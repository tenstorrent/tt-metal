# VC1 split (two 2x2 meshes, ttrun.py; see vc1_split.yaml): one long row of vc1_split.yaml's benchmarks, for PC
# sampling of VC1 routers (consolidation/vc1_pcs_runs.sh).
allocation_policies:
    receiver:
      policy: RoundRobin
      max_configs_per_core: 4

Tests:
  - name: "PcsVc1Mcast"
    benchmark_mode: true
    sync: true
    fabric_setup:
      topology: Mesh
    parametrization_params:
      ntype: [unicast_write]
      size: [4352]
    defaults:
      ftype: mcast
      num_packets: 4000000
    patterns:
      - type: all_to_all
        iterations: 1
        mesh_scope: intra_mesh

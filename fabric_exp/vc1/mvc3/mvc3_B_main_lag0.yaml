# Generated by fabric_exp/consolidation/mvc3_yamls.py (set B_main, group lag0; see its docstring).
# Run via consolidation/mvc3_runs.sh. Group lag0: mesh 0 launches 200 ms later (rank bindings with TT_RUN_RANK swapped).
allocation_policies:
  receiver:
    policy: RoundRobin
    max_configs_per_core: 4
Tests:
  - name: "MVC3_B_main_P01m1"
    benchmark_mode: true
    sync: false  # each sender times its own send loop (mvc3_yamls.py)
    fabric_setup:
      topology: Mesh
    parametrization_params:
      ntype: [unicast_write]
      size: [256, 1024, 4352]
    defaults:
      ftype: unicast
    senders:
      - device: [1, 0]
        vc_id: 0
        patterns:
          - destination:
              device: [1, 1]
            num_packets: 12200000
      - device: [0, 0]
        patterns:
          - destination:
              device: [1, 1]
            num_packets: 440000

# Mixed VC0 + VC1 load on the VC1 split (study benchmark only; run like vc1_split.yaml, one MPI rank per mesh). Needs
# the study tree's BandwidthProfiler fix for configs without hops. Mesh 1 is row-major ([1, 0] [1, 1] / [1, 2] [1, 3]);
# 2D routes go N/S first; [0, 0]'s inter-mesh link lands on [1, 1] (job 110: [0, 0] -> [1, 1] is the direct row). So
# [0, 0] -> [1, 0] crosses to [1, 1] and goes W on VC1 (VC1 forwarding channel of [1, 1]'s W router), and:
# - VC1MixWorker: plus [1, 1] -> [1, 0], the W router's VC0 worker channel on the same link;
# - VC1MixForward: plus [1, 3] -> [1, 0] (N to [1, 1], then W), its VC0 forwarding channel on the same link;
# - VC1SoloWorker, VC1SoloForward: those VC0 flows alone (the VC1 flow alone is vc1_inter.yaml's to_1_0 row).
# One sender per rank, so each rank's CSV row is its own flow (the device column is the chip in its mesh: 0 is the
# VC1 flow's sender, 1 or 3 the VC0 flow's). Packet counts are set so the flows last about as long as each other
# under v4gi with VC1 forwarding at 4-6 slots (VC1 flow 40000, VC0 1-hop 100000, VC0 2-hop 60000); each row's cycles
# show how much they overlapped. 4 tests x 2 sizes, 16 finishes over both ranks.
allocation_policies:
    receiver:
      policy: RoundRobin
      max_configs_per_core: 4

Tests:
  - name: "VC1MixWorker"
    benchmark_mode: true
    sync: true
    fabric_setup:
      topology: Mesh
    parametrization_params:
      ntype: [unicast_write]
      size: [16, 4352]
    defaults:
      ftype: unicast
    senders:
      - device: [0, 0]
        patterns:
          - destination:
              device: [1, 0]
            num_packets: 40000
      - device: [1, 1]
        patterns:
          - destination:
              device: [1, 0]
            num_packets: 100000

  - name: "VC1MixForward"
    benchmark_mode: true
    sync: true
    fabric_setup:
      topology: Mesh
    parametrization_params:
      ntype: [unicast_write]
      size: [16, 4352]
    defaults:
      ftype: unicast
    senders:
      - device: [0, 0]
        patterns:
          - destination:
              device: [1, 0]
            num_packets: 40000
      - device: [1, 3]
        patterns:
          - destination:
              device: [1, 0]
            num_packets: 60000

  - name: "VC1SoloWorker"
    benchmark_mode: true
    sync: true
    fabric_setup:
      topology: Mesh
    parametrization_params:
      ntype: [unicast_write]
      size: [16, 4352]
    defaults:
      ftype: unicast
    senders:
      - device: [1, 1]
        patterns:
          - destination:
              device: [1, 0]
            num_packets: 100000

  - name: "VC1SoloForward"
    benchmark_mode: true
    sync: true
    fabric_setup:
      topology: Mesh
    parametrization_params:
      ntype: [unicast_write]
      size: [16, 4352]
    defaults:
      ftype: unicast
    senders:
      - device: [1, 3]
        patterns:
          - destination:
              device: [1, 0]
            num_packets: 60000

# Slot study (SLOT_STUDY.md, 2026-11-01): the VC1 split's rows in one launch, so each allocation is one compile and one
# MPI launch. Run like vc1_split.yaml (p150x8_2x2_split_mgd.textproto, one MPI rank per mesh via ttrun.py) with
# TT_FABRIC_EXP_SLOTS_VC1 setting the depths. Copies of vc1_alloc.yaml's tests (multi-mesh sanity, data checked; 1-hop,
# multicast, 2-hop, 2-hop merged, bursts), vc1_inter.yaml's tests ([0, 0] to each chip of mesh 1), and vc1_mix.yaml's
# tests moved to the post-merge placement: on a09u32 since the merge (job 360, census sdb) [0, 0] lands on [1, 0]
# (VC1Inter_0_0_to_1_0 is the direct row, ~208), not on [1, 1] as in jobs 110-112. So here:
# - VC1MixWorker: [0, 0] -> [1, 1] (lands on [1, 0], then one VC1 hop E/W) plus [1, 0] -> [1, 1], the VC0 worker channel
#   of the same [1, 0] router;
# - VC1MixForward: the same VC1 flow plus [1, 2] -> [1, 1] (N/S first to [1, 0], then E/W), that router's VC0
#   forwarding channel;
# - VC1SoloWorker, VC1SoloForward: those VC0 flows alone (the VC1 flow alone is VC1Inter_0_0_to_1_1).
# The mix rows' sharing is checked from the data (each flow slower than alone), not assumed.
# 41 tests, 82 finishes over both ranks.
allocation_policies:
    receiver:
      policy: RoundRobin
      max_configs_per_core: 4

Tests:
  - name: "MultiMeshAllToAll"
    sync: true
    fabric_setup:
      topology: Mesh
    parametrization_params:
      ntype: [unicast_write, atomic_inc, fused_atomic_inc, unicast_scatter_write]
      size: [1024, 4096]
    defaults:
      ftype: unicast
      num_packets: 100
    patterns:
      - type: all_to_all

  - name: "MultiMeshNeighborExchangeInter"
    sync: true
    fabric_setup:
      topology: Mesh
    parametrization_params:
      ntype: [unicast_write, atomic_inc, fused_atomic_inc, unicast_scatter_write]
    defaults:
      ftype: unicast
      size: 32
      num_packets: 3000
    patterns:
      - type: neighbor_exchange
        mesh_scope: inter_mesh

  - name: "VC1Mesh1HopEW"
    benchmark_mode: true
    sync: true
    fabric_setup:
      topology: Mesh
    parametrization_params:
      ntype: [unicast_write]
      size: [16, 4352]
    defaults:
      ftype: unicast
      num_packets: 50000
    senders:
      - device: [0, 0]
        patterns:
          - destination:
              device: [0, 1]

  - name: "VC1Mesh1HopNS"
    benchmark_mode: true
    sync: true
    fabric_setup:
      topology: Mesh
    parametrization_params:
      ntype: [unicast_write]
      size: [16, 4352]
    defaults:
      ftype: unicast
      num_packets: 50000
    senders:
      - device: [0, 0]
        patterns:
          - destination:
              device: [0, 2]

  - name: "VC1MeshMulticast"
    benchmark_mode: true
    sync: true
    fabric_setup:
      topology: Mesh
    parametrization_params:
      ntype: [unicast_write]
      size: [4352]
    defaults:
      ftype: mcast
      num_packets: 20000
    patterns:
      - type: all_to_all
        iterations: 1
        mesh_scope: intra_mesh

  - name: "VC1Mesh2Hop"
    benchmark_mode: true
    sync: true
    fabric_setup:
      topology: Mesh
    parametrization_params:
      ntype: [unicast_write]
      size: [16, 4352]
    defaults:
      ftype: unicast
      num_packets: 50000
    senders:
      - device: [0, 0]
        patterns:
          - destination:
              device: [0, 3]

  - name: "VC1Mesh2HopMerge"
    benchmark_mode: true
    sync: true
    fabric_setup:
      topology: Mesh
    parametrization_params:
      ntype: [unicast_write]
      size: [16, 4352]
    defaults:
      ftype: unicast
      num_packets: 50000
    senders:
      - device: [0, 0]
        patterns:
          - destination:
              device: [0, 3]
      - device: [0, 1]
        patterns:
          - destination:
              device: [0, 3]
      - device: [0, 2]
        patterns:
          - destination:
              device: [0, 3]

  - name: "VC1BurstEW_N8_G500"
    benchmark_mode: true
    sync: true
    fabric_setup:
      topology: Mesh
    parametrization_params:
      size: [4352, 16]
    defaults:
      ftype: unicast
    senders:
      - device: [0, 0]
        patterns:
          - destination:
              device: [0, 1]
            repeat: 2500
            stream:
              - {ntype: unicast_write, count: 8}
              - {idle: 500}

  - name: "VC1BurstEW_N32_G500"
    benchmark_mode: true
    sync: true
    fabric_setup:
      topology: Mesh
    parametrization_params:
      size: [4352, 16]
    defaults:
      ftype: unicast
    senders:
      - device: [0, 0]
        patterns:
          - destination:
              device: [0, 1]
            repeat: 625
            stream:
              - {ntype: unicast_write, count: 32}
              - {idle: 500}

  - name: "VC1Inter_0_0_to_1_0"

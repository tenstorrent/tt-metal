  - name: "VC1MixWorker"
    benchmark_mode: true
    sync: true
    fabric_setup:
      topology: Mesh
    parametrization_params:
      ntype: [unicast_write]
      size: [16, 4352]
    defaults:
      ftype: unicast
    senders:
      - device: [0, 0]
        patterns:
          - destination:
              device: [1, 1]
            num_packets: 40000
      - device: [1, 0]
        patterns:
          - destination:
              device: [1, 1]
            num_packets: 100000

  - name: "VC1MixForward"

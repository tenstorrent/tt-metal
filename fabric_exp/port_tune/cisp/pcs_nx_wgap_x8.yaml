# cisp row-order C (mk_order_yamls.py): one unicast_write iteration per row, each followed by a
# tiny fused_atomic_inc row (1000 packets), 8 repeats.
allocation_policies:
  receiver:
    policy: RoundRobin
    max_configs_per_core: 4
Tests:
- name: WgapR01_w00_size_2048_ntype_unicast_write_num_links_1
  benchmark_mode: true
  sync: true
  fabric_setup:
    topology: NeighborExchange
    num_links: 1
  defaults:
    ftype: unicast
    ntype: unicast_write
    size: 2048
    num_packets: 100000
  patterns:
  - type: neighbor_exchange
    iterations: 1
- name: WgapR01_g00_size_2048_ntype_fused_atomic_inc_num_links_1

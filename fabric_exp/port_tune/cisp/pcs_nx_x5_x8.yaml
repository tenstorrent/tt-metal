# cisp slow-state check X5 (mk_flow_yamls.py): one sender core against one per flow, 8 repeats.
allocation_policies:
  receiver:
    policy: RoundRobin
    max_configs_per_core: 4
Tests:
- name: X5SO1C00R01
  benchmark_mode: true
  sync: true
  top_level_iterations: 3
  fabric_setup:
    topology: NeighborExchange
  parametrization_params:
    num_links:
    - 1
    ntype:
    - unicast_write
    size:
    - 2048
    - 4096
  defaults:
    ftype: unicast
    num_packets: 100000
  senders:
  - device: [0, 0]
    patterns:
    - destination:
        hops:
          E: 1
    - destination:
        hops:
          S: 1

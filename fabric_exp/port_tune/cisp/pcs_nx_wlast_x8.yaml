# cisp row-order B (mk_order_yamls.py): stock rows, unicast_write block last, 8 repeats.
allocation_policies:
  receiver:
    policy: RoundRobin
    max_configs_per_core: 4
Tests:
- name: NeighborExchangeUnicastR01
  benchmark_mode: true
  sync: true
  fabric_setup:
    topology: NeighborExchange
  parametrization_params:
    num_links:
    - 1
    - 2
    ntype:
    - fused_atomic_inc
    - unicast_scatter_write
    - unicast_write
    size:
    - 2048
    - 4096
  defaults:
    ftype: unicast
    num_packets: 100000
  patterns:
  - type: neighbor_exchange
    iterations: 3

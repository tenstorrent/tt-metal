# cisp stall sampling (cisp_pcs2.sh): ubench.yaml's NeighborExchangeUnicast group as CI runs it (100k packets,
# 3 iterations per row; num_links 1 and 2, the ones this P150 x8 mesh runs), repeated 8 times in one process.
allocation_policies:
  receiver:
    policy: RoundRobin
    max_configs_per_core: 4
Tests:
- name: NeighborExchangeUnicastR01
  benchmark_mode: true
  sync: true
  fabric_setup:
    topology: NeighborExchange
  parametrization_params:
    num_links:
    - 1
    - 2
    ntype:
    - unicast_write
    - fused_atomic_inc
    - unicast_scatter_write
    size:
    - 2048
    - 4096
  defaults:
    ftype: unicast
    num_packets: 100000
  patterns:
  - type: neighbor_exchange
    iterations: 3

allocation_policies:
  receiver:
    policy: RoundRobin
    max_configs_per_core: 4
Tests:
- name: NeighborExchangeUnicast
  benchmark_mode: true
  sync: true
  fabric_setup:
    topology: NeighborExchange
  parametrization_params:
    num_links:
    - 1
    - 2
    - 3
    - 4
    ntype:
    - unicast_write
    - fused_atomic_inc
    - unicast_scatter_write
    size:
    - 2048
    - 4096
  defaults:
    ftype: unicast
    num_packets: 100000
  patterns:
  - type: neighbor_exchange
    iterations: 3
- name: LinearMulticast

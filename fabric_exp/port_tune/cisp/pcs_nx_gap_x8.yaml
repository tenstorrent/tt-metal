# cisp X7 (mk_order_yamls.py): NX write rows, L1/L2 alternation with an idle gap after each L2 block.
allocation_policies:
  receiver:
    policy: RoundRobin
    max_configs_per_core: 4
Tests:
- name: NeighborExchangeUnicastR01S2048
  benchmark_mode: true
  sync: true
  fabric_setup:
    topology: NeighborExchange
  parametrization_params:
    num_links:
    - 1
    - 2
    ntype:
    - unicast_write
    size:
    - 2048
  defaults:
    ftype: unicast
    num_packets: 100000
  patterns:
  - type: neighbor_exchange
    iterations: 3
- name: GapR01a
  benchmark_mode: true

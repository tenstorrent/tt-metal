# cisp slow-state check X4 (mk_flow_yamls.py): two outbound flows with placed sender cores, 8 repeats.
allocation_policies:
  receiver:
    policy: RoundRobin
    max_configs_per_core: 4
Tests:
- name: X4SOdefC00R01
  benchmark_mode: true
  sync: true
  top_level_iterations: 3
  fabric_setup:
    topology: NeighborExchange
  parametrization_params:
    num_links:
    - 1
    ntype:
    - unicast_write
    size:
    - 2048
    - 4096
  defaults:
    ftype: unicast
    num_packets: 100000
  senders:
  - device: [0, 0]
    core: [11, 8]
    patterns:
    - destination:
        hops:
          E: 1
  - device: [0, 0]
    core: [11, 7]
    patterns:
    - destination:
        hops:
          S: 1

# deliver_other inline A/B (port_tune/dio/dio_ab.sh): P150 2x4 mesh, 1-hop E/W (device 0,0 -> 0,1), the receiver's
# common send types: writes at 16 / 4352 B, atomic increment, scatter write (2 chunks), fused write + atomic.
allocation_policies:
  receiver:
    policy: RoundRobin
    max_configs_per_core: 4
Tests:
- name: EW_Write
  benchmark_mode: true
  sync: true
  fabric_setup:
    topology: Mesh
  parametrization_params:
    ntype:
    - unicast_write
    size:
    - 16
    - 4352
  defaults:
    ftype: unicast
    num_packets: 50000
  senders:
  - device:
    - 0
    - 0
    patterns:
    - destination:
        device:
        - 0
        - 1
- name: EW_Atomic
  benchmark_mode: true
  sync: true
  fabric_setup:
    topology: Mesh
  parametrization_params:
    ntype:
    - atomic_inc
    size:
    - 4352
  defaults:
    ftype: unicast
    num_packets: 50000
  senders:

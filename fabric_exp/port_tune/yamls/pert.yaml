# Delay-perturbation rows of the receiver tuning sweep (mk_tune_yamls.py; RECEIVER_TUNING.md).
allocation_policies:
  receiver:
    policy: RoundRobin
    max_configs_per_core: 4
Tests:
- name: BurstEW_N1_G500
  benchmark_mode: true
  sync: true
  fabric_setup:
    topology: Mesh
  parametrization_params:
    size:
    - 4352
    - 16
  defaults:
    ftype: unicast
  senders:
  - device:
    - 0
    - 0
    patterns:
    - destination:
        device:
        - 0
        - 1
      repeat: 20000
      stream:
      - ntype: unicast_write
        count: 1
      - idle: 500

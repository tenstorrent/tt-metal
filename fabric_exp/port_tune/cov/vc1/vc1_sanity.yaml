allocation_policies:
  receiver:
    policy: RoundRobin
    max_configs_per_core: 4
Tests:
- name: MultiMeshAllToAll
  sync: true
  fabric_setup:
    topology: Mesh
  parametrization_params:
    ntype:
    - unicast_write
    - atomic_inc
    - fused_atomic_inc
    - unicast_scatter_write
    size:
    - 1024
    - 4096
  defaults:
    ftype: unicast
    num_packets: 64
  patterns:
  - type: all_to_all
- name: MultiMeshNeighborExchangeInter
  sync: true
  fabric_setup:
    topology: Mesh
  parametrization_params:
    ntype:
    - unicast_write
    - atomic_inc
    - fused_atomic_inc
    - unicast_scatter_write
  defaults:
    ftype: unicast
    size: 32
    num_packets: 3000
  patterns:
  - type: neighbor_exchange
    mesh_scope: inter_mesh

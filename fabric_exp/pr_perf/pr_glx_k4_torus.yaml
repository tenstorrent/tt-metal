# PR perf gap runs, Galaxy 200G (mk_pr_gap_yamls.py): galaxy/glx_sizes_torus.yaml's GlxTorusWrapEW, GlxTorusWrapNS
# at 512 and 4096 B only (the sizes the 200G size suites did not run).
allocation_policies:
  receiver:
    policy: RoundRobin
    max_configs_per_core: 4
Tests:
- name: GlxTorusWrapEW
  benchmark_mode: true
  sync: true
  fabric_setup:
    topology: Torus
    torus_config: XY
  parametrization_params:
    ntype:
    - unicast_write
    size:
    - 512
    - 4096
  defaults:
    ftype: unicast
    num_packets: 50000
  senders:
  - device:
    - 0
    - 0
    patterns:
    - destination:
        device:
        - 0
        - 3
- name: GlxTorusWrapNS
  benchmark_mode: true
  sync: true
  fabric_setup:
    topology: Torus
    torus_config: XY
  parametrization_params:
    ntype:
    - unicast_write
    size:
    - 512
    - 4096
  defaults:
    ftype: unicast
    num_packets: 50000
  senders:
  - device:
    - 0
    - 0
    patterns:
    - destination:
        device:
        - 0
        - 28

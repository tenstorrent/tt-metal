# IDLE_PASSES sweep, Galaxy 200G (mk_pr_gap_yamls.py): ring controls (groups of 1): ring 1-hop E/W 4096 B, full-ring multicast 4352 B.
allocation_policies:
  receiver:
    policy: RoundRobin
    max_configs_per_core: 4
Tests:
- name: GlxRing1HopEW
  benchmark_mode: true
  sync: true
  fabric_setup:
    topology: Ring
  parametrization_params:
    ntype:
    - unicast_write
    size:
    - 4096
  defaults:
    ftype: unicast
    num_packets: 50000
  senders:
  - device:
    - 0
    - 0
    patterns:
    - destination:
        device:
        - 0
        - 1
- name: GlxFullRingMulticast
  benchmark_mode: true
  sync: true
  fabric_setup:
    topology: Ring
  parametrization_params:
    ntype:
    - unicast_write
    size:
    - 4352
  defaults:
    ftype: mcast
    num_packets: 20000
  patterns:
  - type: full_ring
    iterations: 1

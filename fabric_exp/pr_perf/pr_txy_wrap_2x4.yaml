# PR perf gap runs (mk_pr_gap_yamls.py): XY torus 2x4 (auto-discovered), 1 hop E/W across the wrap,
# write, 256-4352 B (torus/torusxy_2x4_sizes.yaml's TorusXYWrap1HopEW).
allocation_policies:
  receiver:
    policy: RoundRobin
    max_configs_per_core: 4
Tests:
- name: TorusXYWrap1HopEW
  benchmark_mode: true
  sync: true
  fabric_setup:
    topology: Torus
    torus_config: XY
  parametrization_params:
    ntype:
    - unicast_write
    size:
    - 256
    - 512
    - 1024
    - 2048
    - 3072
    - 4096
    - 4352
  defaults:
    ftype: unicast
    num_packets: 50000
  senders:
  - device:
    - 0
    - 3
    patterns:
    - destination:
        device:
        - 0
        - 0

# PR perf gap runs (mk_pr_gap_yamls.py): XY torus 4x2 (TT_MESH_GRAPH_DESC_PATH=fabric_exp/torus/p150_x8_4x2_torus_xy_mgd.textproto),
# 1 hop N/S across the wrap, write, 256-4352 B (torus/torusxy_4x2_sizes.yaml's TorusXY4x2_Wrap1HopNS).
allocation_policies:
  receiver:
    policy: RoundRobin
    max_configs_per_core: 4
Tests:
- name: TorusXY4x2_Wrap1HopNS
  benchmark_mode: true
  sync: true
  fabric_setup:
    topology: Torus
    torus_config: XY
  parametrization_params:
    ntype:
    - unicast_write
    size:
    - 256
    - 512
    - 1024
    - 2048
    - 3072
    - 4096
    - 4352
  defaults:
    ftype: unicast
    num_packets: 50000
  senders:
  - device:
    - 0
    - 6
    patterns:
    - destination:
        device:
        - 0
        - 0

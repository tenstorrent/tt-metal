- name: GlxMeshMulticast
  benchmark_mode: true
  sync: true
  fabric_setup:
    topology: Mesh
  parametrization_params:
    ntype:
    - unicast_write
    size:
    - 512
    - 4096
  defaults:
    ftype: mcast
    num_packets: 20000
  patterns:
  - type: all_to_all
    iterations: 1

  defaults:
    ftype: unicast
    num_packets: 50000
  senders:
  - device:
    - 0
    - 0
    patterns:
    - destination:
        device:
        - 0
        - 1
- name: GlxMesh3HopEW
  benchmark_mode: true
  sync: true
  fabric_setup:
    topology: Mesh
  parametrization_params:
    ntype:
    - unicast_write
    size:
    - 512
    - 4096
  defaults:
    ftype: unicast
    num_packets: 50000
  senders:

# PR perf gap runs, Galaxy 200G (mk_pr_gap_yamls.py): galaxy/glx_sizes_ring.yaml's GlxRing1HopEW, GlxFullRingMulticast
# at 512 and 4096 B only (the sizes the 200G size suites did not run).
allocation_policies:
  receiver:
    policy: RoundRobin
    max_configs_per_core: 4
Tests:
- name: GlxRing1HopEW
  benchmark_mode: true
  sync: true
  fabric_setup:
    topology: Ring
  parametrization_params:
    ntype:
    - unicast_write
    size:
    - 512
    - 4096
  defaults:
    ftype: unicast
    num_packets: 50000
  senders:
  - device:
    - 0
    - 0
    patterns:
    - destination:
        device:
        - 0
        - 1
- name: GlxFullRingMulticast
  benchmark_mode: true
  sync: true
  fabric_setup:
    topology: Ring
  parametrization_params:
    ntype:
    - unicast_write
    size:
    - 512
    - 4096
  defaults:
    ftype: mcast
    num_packets: 20000
  patterns:
  - type: full_ring
    iterations: 1

      - id: G0-mm-2x8-stab
        from_ci: {list: galaxy_e2e_tests.yaml, name: "Galaxy Fabric Multi-mesh 2x8 and 2x4s stability tests", sku: bh_galaxy, lines_matching: 'test_fabric_multi_mesh_stability_short_running'}

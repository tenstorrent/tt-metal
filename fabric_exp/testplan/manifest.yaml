  - id: G-L0-mpiab
    level: L0
    system: bh_galaxy
    kind: coverage
    routers: [main]
    reset_between_steps: true   # A/B: a forced reset between arms (coordinator 2026-11-04; 171869's arm B ran unreset)
    why: "same-node isolating A/B for the tt-run stall (171352: every non-bare tt-run step HANG after device start): arm A = the CI command (5 min), arm B = the one change --tcp-interface lo"
    steps:
      - id: G0-mm-4x4-ci
        from_ci: {list: galaxy_e2e_tests.yaml, name: "Galaxy Fabric Multi-Mesh 4x4 and 2x4s stability tests", sku: bh_galaxy, replace: [['--mpi-args "--allow-run-as-root"', '--verbose --mpi-args "--allow-run-as-root"']]}
        pre_cmd: |
          echo "== ip -br addr"; ip -br addr
          echo "== ip route"; ip route
          echo "== mpirun"; command -v mpirun-ulfm mpirun; mpirun-ulfm --version 2>&1 | head -2
          echo "== OMPI/PMIX/PRTE env"; env | grep -E '^(OMPI|PMIX|PRTE)_' || true
        env: {OMPI_MCA_mpi_show_mca_params: enviro}
        timeout_min: 5
        needs: [mpi]
        result: log_marker
        marker: "All tests completed successfully"
      - id: G0-mm-4x4-lo
        # arm = the CI entry with ONE change: tt-run's own `--tcp-interface lo` (both tt-run phases then get only
        # `--mca btl self,tcp --mca btl_tcp_if_include lo`; an include inside --mpi-args would meet Phase 1's default
        # exclude, ttrun.py:2835-2837, and Open MPI aborts). `--verbose` only logs the effective mpirun lines.
        from_ci: {list: galaxy_e2e_tests.yaml, name: "Galaxy Fabric Multi-Mesh 4x4 and 2x4s stability tests", sku: bh_galaxy, replace: [['--mpi-args "--allow-run-as-root"', '--tcp-interface lo --verbose --mpi-args "--allow-run-as-root"']]}
        pre_cmd: |
          echo "== ip -br addr"; ip -br addr
          echo "== ip route"; ip route
          echo "== mpirun"; command -v mpirun-ulfm mpirun; mpirun-ulfm --version 2>&1 | head -2
          echo "== OMPI/PMIX/PRTE env"; env | grep -E '^(OMPI|PMIX|PRTE)_' || true
        env: {OMPI_MCA_mpi_show_mca_params: enviro}
        needs: [mpi]
        result: log_marker
        marker: "All tests completed successfully"

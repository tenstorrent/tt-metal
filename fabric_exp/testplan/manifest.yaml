      - {id: G0-mm-z, from_ci: {list: galaxy_e2e_tests.yaml, name: "Galaxy Fabric 2x2 multi-mesh sanity (inter-mesh over Z)", sku: bh_galaxy}, needs: [mpi, ring_mapping], result: log_marker, marker: "All tests completed successfully"}
      - {id: G0-mm-nsew, from_ci: {list: galaxy_e2e_tests.yaml, name: "Galaxy Fabric 2x2 multi-mesh sanity (inter-mesh over N/S/E/W)", sku: bh_galaxy}, needs: [mpi, ring_mapping], result: log_marker, marker: "All tests completed successfully"}
      - {id: G0-mm-trim-nsew, from_ci: {list: galaxy_e2e_tests.yaml, name: "Galaxy Fabric 2x2 multi-mesh channel trimming (inter-mesh over N/S/E/W)", sku: bh_galaxy}, needs: [mpi, ring_mapping], result: log_marker, marker: "All tests completed successfully"}
      - {id: G0-mm-trim-z, from_ci: {list: galaxy_e2e_tests.yaml, name: "Galaxy Fabric 2x2 multi-mesh channel trimming (inter-mesh over Z)", sku: bh_galaxy}, needs: [mpi, ring_mapping], result: log_marker, marker: "All tests completed successfully"}
      - {id: G0-mm-hetero, from_ci: {list: galaxy_e2e_tests.yaml, name: "Galaxy Fabric per-mesh heterogeneous-config sanity + multicast (4 MGDs)", sku: bh_galaxy}, needs: [mpi, ring_mapping], result: log_marker, marker: "All tests completed successfully"}
      - {id: G0-mm-4x4, from_ci: {list: galaxy_e2e_tests.yaml, name: "Galaxy Fabric Multi-Mesh 4x4 and 2x4s stability tests", sku: bh_galaxy}, needs: [mpi], result: log_marker, marker: "All tests completed successfully"}

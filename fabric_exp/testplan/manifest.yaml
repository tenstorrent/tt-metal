    kind: perf
    routers: [main, new]
    passes: [[main, new], [main, new], [main, new]]   # 3 interleaved passes (all_reduce spread 0.8-4.7 % on main)
    why: "DeepSeek CCL trace perf matrix (the study's CCL_MATRIX.md rows), device-profiler op times; telemetry-independent"
    steps:
      - id: B1-ccl-ag
        cmd: "for s in 2048 4096 4352 8192 15232; do python models/demos/deepseek_v3_b1/scripts/ccl_trace_perf_matrix.py --ccl all_gather --max-payload-sizes $s --output-dir $REGRESS_STEP_DIR/ccl; done"
        timeout_min: 15
        result: metrics
        metrics: 'Updated reports after ccl=(?P<ccl>\w+), (?P<cfg>[^:]*?)max_payload_size_bytes=(?P<payload>\d+): op_time=(?P<value>[\d.]+) us'
      - id: B1-ccl-ar
        cmd: "for l in 1 2; do for s in 2048 4096 4352 8192 15232; do python models/demos/deepseek_v3_b1/scripts/ccl_trace_perf_matrix.py --ccl all_reduce --max-payload-sizes $s --num-links $l --output-dir $REGRESS_STEP_DIR/ccl; done; done"
        timeout_min: 20
        result: metrics
        metrics: 'Updated reports after ccl=(?P<ccl>\w+), (?P<cfg>[^:]*?)max_payload_size_bytes=(?P<payload>\d+): op_time=(?P<value>[\d.]+) us'
      - id: B1-ccl-bc
        cmd: "for l in 1 2; do for s in 2048 4096 4352 8192 15232; do python models/demos/deepseek_v3_b1/scripts/ccl_trace_perf_matrix.py --ccl broadcast --max-payload-sizes $s --num-links $l --output-dir $REGRESS_STEP_DIR/ccl; done; done"
        timeout_min: 20
        result: metrics
        metrics: 'Updated reports after ccl=(?P<ccl>\w+), (?P<cfg>[^:]*?)max_payload_size_bytes=(?P<payload>\d+): op_time=(?P<value>[\d.]+) us'
      - id: B1-ccl-sdpa  # the study's tuned (num_l_chunks, compute_block_size) per payload (CCL_MATRIX.md)
        known_fail: "main d2bd12f: host-side TT_FATAL page_config.cpp:179 (ROW MAJOR page config with a custom tile) in ttnn.from_torch of the SDPA trace test; no fabric involved (jobs 605, 607)"
        cmd: "for c in 4096:2:4 4352:2:4 8192:2:8 15232:2:8; do IFS=: read s l b <<< $c; python models/demos/deepseek_v3_b1/scripts/ccl_trace_perf_matrix.py --ccl sdpa_reduce_to_all --max-payload-sizes $s --sdpa-num-l-chunks $l --sdpa-compute-block-sizes $b --output-dir $REGRESS_STEP_DIR/ccl; done"
        timeout_min: 12
        result: metrics
        metrics: 'Updated reports after ccl=(?P<ccl>\w+), (?P<cfg>[^:]*?)max_payload_size_bytes=(?P<payload>\d+): op_time=(?P<value>[\d.]+) us'


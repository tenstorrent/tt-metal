# Regression groups for landing the new fabric router (TEST_PLAN.md §4). Read by run_group.py.
#
# A group is one Slurm-sized unit: one system, one allocation (or a series of <= 25 min broker jobs on a09u32), and a
# list of steps. A step is one CI entry (`from_ci`, so the command is read from the tree under test and never drifts)
# or an explicit `cmd`. Each step's timeout is its CI timeout unless `timeout_min` overrides it.
#
# Step fields:
#   id            TEST_PLAN §1 ID (B0-1d, G1-night, ...); unique within the group
#   from_ci       {list: <tests/pipeline_reorg file>, name: <entry name>, sku: <sku whose timeout / {placeholders} apply>,
#                  replace: [[old, new], ...] (literal, applied first), lines_matching: <regex, keep only these lines>,
#                  drop_lines: [<regex>, ...]}
#   cmd           explicit shell command (run from TT_METAL_HOME); `ci_ref` names the CI entry it mirrors, if any
#   timeout_min   overrides the CI timeout (timeout_note says why, recorded in status.json)
#   est_min       expected duration for the broker budget (a step starts only if it fits 60 % of what is left)
#   result        collector(s): rc | gtest | pytest | fabric_csv | benchmark_json | metrics | log_marker (several: a list);
#                 every step also fails on rc != 0, and on test_tt_fabric's "Tests: N executed, M failed" with M > 0
#   metrics       for result metrics: regex (or a list) with named groups; group `value` is the number, the others the row key
#   marker        for result log_marker: regex that must appear in the log for PASS
#   env           extra environment for this step only
#   needs         [weights_mlperf, mpi, ring_mapping, study_tree]: preflight checks; a step whose need is unmet is SKIP
#   perf_window   true (or a regex): a FAIL case whose message says the value left the test's perf window becomes
#                 PERF_WINDOW (measured value + window kept in tests.json); compare scores the metric values instead
#   known_fail    reason: a FAIL of this step is recorded as KNOWN_FAIL and not scored against the other side
#   known_fail_statuses  statuses known_fail covers (default [FAIL]); e.g. [FAIL, HANG, TIMEOUT] when the known failure
#                 also leaves the process hung
#   env_fail      reason: a FAIL of this step is the node's environment (ENV), recorded and not scored
#   known_fail_cases  {case-name regex: reason}: those FAIL cases are KNOWN_FAIL (run, recorded, not scored)
#   deviation     how this step departs from the CI command (recorded in status.json for main and new alike)
#   note          free text recorded in status.json (context a reader of the result needs)
#   on_missing    skip (default): SKIP when a /mnt path the command names exists nowhere; run: run anyway, record them
#   status        planned: listed by `plan`, never run (with `why`); not_run: recorded as NOT_RUN in the results (why), never run
#
# Group fields: id, level (L0 | L1 | L2), system, kind (coverage | perf), routers (modes it runs), passes (perf A/B
# orders, one list per pass), status (ready | held | planned | ci_only | multi_galaxy) + why, reset_between_steps (A/B
# groups on Slurm: a device reset after every step, not only after failures), steps.
version: 1
ci_lists: tests/pipeline_reorg

# The one place that maps a router mode to environment (MAINLINE_PLAN §1.6). The port replaces the router outright, so
# main-vs-new is tree vs tree: router `main` runs on tree main, router `new` on a new_<sha> tree (router_trees).
router_env:
  main: {}
  new: {}            # the port replaces the ERISC router (f4779d68dc5): the tree selects the router, no env switch
router_trees:        # which trees a router mode may run on (preflight check)
  main: [main]
  new: [new_]        # prefix: new_<sha> trees

# Environment of every step: the CI container defaults (tm-fabric-tests-impl, blackhole-e2e-tests-impl and
# setup-job: auto-triage's 5 s dispatch timeout, no triage command). TT_METAL_HOME, PYTHONPATH, LD_LIBRARY_PATH,
# GTEST_OUTPUT, TT_METAL_CACHE are set by the runner per tree and step.
ci_env:
  CI: "true"                                # GitHub Actions sets it; tests read it (e.g. largest-mesh-only parametrization). No C++ reads it.
  ARCH_NAME: blackhole
  LOGURU_LEVEL: INFO
  TT_METAL_OPERATION_TIMEOUT_SECONDS: "5"   # setup-job auto-triage default; dropped for entries with auto_triage: false
  TRACY_NO_WEB_SERVER: "1"                  # tools/tracy would otherwise leave a web server running after the step
# Extra CI env per workflow family, applied by test list.
ci_env_by_list:   # tm-fabric-tests-impl only: its entries log at warn, so they are judged by exit code (as CI does)
  fabric_tests.yaml: {TTNN_CONFIG_OVERRIDES: '{"validate_program_args": true}', TT_LOGGER_LEVEL: warn}

# Model weights. CI's model jobs see /mnt/MLPerf/huggingface (cloud-mlperf: the host's /mnt/MLPerf/huggingface; QB2's
# yyz4-mnt-models: the host's /mnt/models/huggingface mounted there) with HF_HUB_CACHE on its hub and HF offline.
# `path_map` repeats that mount where /mnt/MLPerf is missing: each prefix is rewritten in a step's command and env when
# the left side does not exist on the node and the right side does. Paths a step names that exist nowhere make it SKIP.
weights:
  weights_mlperf: {mount: /mnt/MLPerf/huggingface, env: {HF_HUB_CACHE: /mnt/MLPerf/huggingface/hub, HF_HUB_OFFLINE: "1"}}
path_map:
  /mnt/MLPerf/huggingface: /mnt/models/huggingface

# Named trees. `path` is the tree on a09u32 (built there); `data_path` its lean copy on /data that Slurm nodes run
# (stage with `run_group.py stage`). A later new-router tree is added here the same way.
trees:
  main:
    path: /home/aagarwal/tt-metal-main
    data_path: /data/aagarwal/regress/trees/main_d2bd12f
    sha: d2bd12fcf1f1aac1203b735bf12540a34a8c2fc1
  # new_4db4f45 (4db4f45790b, staged 05:55, never run): its /data copy was renamed to new_288afd2 and restaged over
  # (rsync --delete) at 2fc06852f48 to save inodes; its local worktree now holds new_288afd2
  new_288afd2:       # final port tip 2fc06852f48 (= 288afd237a7 = cb42eb72501 + A2 (b), minus the stray tt_metal/pre-compiled
                     # symlink 288afd237a7 committed; sources identical). Built in place in tt-metal-new 2026-11-04 with
                     # CCACHE_DISABLE=1; name and labels (new_288afd2, ab_288afd2) kept from the first checkout
    path: /home/aagarwal/tt-metal-new
    data_path: /data/aagarwal/regress/trees/new_288afd2   # staged 2026-11-04 over the renamed new_4db4f45 copy
    sha: 2fc06852f489560679c4a168fd806f7f0d45d3b7

results:
  local: /home/aagarwal/tt-metal/fabric_exp/testplan/results     # a09u32 broker runs write here; `collect` copies Slurm results here
  data: /data/aagarwal/regress/results                           # Slurm jobs write here

systems:
  bh_loudbox:
    arch: blackhole
    chips: 8
    sku: bh_loudbox
    broker:                                   # a09u32: the user's tt-device broker queue (commands go through the user)
      node: bh-lb-120-a09u32
      workspace: /home/aagarwal
      max_job_s: 1500
      budget_s: 1380                          # what one broker job may spend on steps (margin for startup and copies)
      cache: /home/aagarwal/.tt-metal-cache-regress
    slurm:                                    # extra LoudBoxes (LB2_HARNESS.md); one job per node at a time
      nodes: {bh-lb-120-a07u28: bh_lb_C45, bh-lb-120-a08u28: bh_lb_C67, bh-lb-120-a04u24: bh_lb_120_A45}
      overflow_partition: bh_lb_single         # user 2026-11-03: overflow LB capacity only when the LB queue backs up
      overflow_node_regex: '^bh-lb-a10u'
      reset: tt-smi -r
      health: required                        # CI's ensure-bh-links-online: reset + test_system_health
  bh_galaxy:
    arch: blackhole
    chips: 32
    sku: bh_galaxy
    slurm:
      partition: bh_sc36_6,bh_110a_sc16       # bh_110a_sc16 (a07..a10, 6 h limit) opened by the user 2026-11-03
      max_time_min: 360
      node_regex: '^bh-glx-110-a'             # user rule 2026-11-02: 110-a Galaxies only
      exclude_for_ring: [bh-glx-110-a02u14]   # cannot map ring / torus (one link per chip pair)
      # Standing excludes, every Galaxy job (also the port's G-PORT reruns: use a node outside these):
      #   a01u14: full /tmp (Open MPI init fails, job 171630); a02u02 / a02u08: coordinator 2026-11-03;
      #   a03u14 + a08u20: multi-process tt-run stalls after device start, main and port alike (jobs 171352, 171987), cause unknown
      #   a09u02: the same tt-run stall (jobs 176161, 176236: the port's passing tree cb42eb7 stalls there too), 2026-11-05
      #   a02u14: cannot map ring/torus (also listed standing by the coordinator); a10u02: other users' work outside Slurm (job 171871)
      exclude: [bh-glx-110-a01u14, bh-glx-110-a02u02, bh-glx-110-a02u08, bh-glx-110-a02u14, bh-glx-110-a03u08, bh-glx-110-a03u14, bh-glx-110-a07u02, bh-glx-110-a08u20, bh-glx-110-a09u02, bh-glx-110-a10u02]
      max_concurrent: 4                       # study Galaxy jobs, all agents, running + pending; the multi-Galaxy quad (pod partitions) excepted
      min_data_inodes_free: 150000            # submit only with >= 150k free inodes on /data (coordinator 2026-11-04: was 2M, unreachable; job 172554 died on ENOSPC)
      reset: tt-smi -glx_reset
      node_check:                             # first job on a node: a data-checked torus row (needs ring/torus mapping); result kept per node
        cmd: "TT_METAL_OPERATION_TIMEOUT_SECONDS=0 ./build/test/tt_metal/tt_fabric/test_infra/test_tt_fabric --test_config tests/tt_metal/tt_fabric/test_infra/test_yamls/test_fabric_2d_torus_stability.yaml --filter 'name.*_short'"
        timeout_min: 15
        pass_rx: "Tests: \\d+ executed, 0 failed"
        noring_rx: "could not fit in the discovered physical topology|Graph .* could not fit"
      health: advisory                        # CI's Galaxy jobs run no link loop; logged, never stops the job
  bh_qb2:
    status: ci_only                           # user 2026-11-03: allowed if free, not planned; QB2 coverage + goldens via CI
    sku: bh_quietbox_2
    slurm: {partition: bh_qb2}
  bh_p300:
    status: planned                           # user 2026-11-03: P300 tests held
  bh_quad:
    status: multi_galaxy                      # fabric_exp/galaxy/glxq_run.sh (the multi-Galaxy agent)
  cpu:
    status: not_approved
    slurm: {partition: cpu_only, time_limit: "01:00:00"}

groups:
  # ---------------------------------------------------------------- L0 fabric, BH LoudBox (P150x8)
  - id: LB-L0-a
    level: L0
    system: bh_loudbox
    kind: coverage
    routers: [main, new]
    steps:
      - {id: B0-1d, from_ci: {list: fabric_tests.yaml, name: "BH fabric 1D unit tests", sku: bh_loudbox}, result: gtest}
      - {id: B0-2d, from_ci: {list: fabric_tests.yaml, name: "BH fabric 2D fixture unit tests", sku: bh_loudbox}, result: gtest}
      - id: B0-1e        # the single-ERISC line of the fast set (its other lines are B0-1d / B0-2d / B0-mux)
        from_ci: {list: blackhole_e2e_tests.yaml, name: "fabric fast unit tests (1D, 2D, single erisc)", sku: bh_loudbox, lines_matching: DISABLE_MULTI_AERISC}
        result: gtest
      - {id: B0-mux, from_ci: {list: fabric_tests.yaml, name: "BH fabric mux v2 unit tests", sku: bh_loudbox}, result: gtest}
      - {id: B0-trim, from_ci: {list: fabric_tests.yaml, name: "BH fabric channel trimming tests", sku: bh_loudbox}, result: gtest}
      - {id: B0-udm, from_ci: {list: fabric_tests.yaml, name: "BH fabric UDM mode unit tests", sku: bh_loudbox}, result: gtest}
      - {id: B0-udm-ttnn, from_ci: {list: fabric_tests.yaml, name: "BH ttnn UDM unit tests", sku: bh_loudbox}, result: gtest}
  - id: LB-L0-b
    level: L0
    system: bh_loudbox
    kind: coverage
    routers: [main, new]
    steps:
      - {id: B0-health, from_ci: {list: fabric_tests.yaml, name: "BH fabric system health tests", sku: bh_loudbox}, result: gtest}
      - {id: B0-infra, from_ci: {list: fabric_tests.yaml, name: "BH fabric infra unit tests", sku: bh_loudbox}, result: rc}
      - {id: B0-stab, from_ci: {list: fabric_tests.yaml, name: "BH fabric stability nightly tests", sku: bh_loudbox}, result: rc}
      - id: B0-night     # NightlyFabric*: in CI for T3K / Galaxy, not BH boxes; same command as the Galaxy entry
        from_ci: {list: galaxy_e2e_tests.yaml, name: "Galaxy Fabric unit tests", sku: bh_galaxy}
        result: gtest
      - id: B0-eth
        known_fail_cases:
          "ActiveEthKernels(DirectSend|SendInterleavedBuffer)AllConnectedChips": "main, lab LoudBoxes a09u32 + a07u28 (TEST_PLAN 4.5): slow dispatch TT_FATAL tt_cluster.cpp:1564-1567 'Chip N logical eth core 0-9 connects to a remote mmio device'"
        from_ci: {list: runtime_integration_tests.yaml, name: bh_multicard_eth, sku: bh_loudbox}
        result: gtest
  - id: LB-L0-study
    level: L0
    system: bh_loudbox
    kind: coverage
    routers: [main, new]
    status: planned
    why: "the study's validation yamls (fabric_exp/v4/val_*.yaml) use study-only test_tt_fabric keys; MAINLINE_PLAN commit 8 moves them"
    steps:
      - {id: B0-study, cmd: "echo planned", needs: [study_tree], timeout_min: 25, result: log_marker, marker: "never"}
  - id: LB-P
    level: L0
    system: bh_loudbox
    kind: perf
    routers: [main, new]
    passes: [[main, new], [main, new], [main, new]]   # A/B: 3 passes interleaved main, new, main, new, main, new on one host (coordinator 2026-11-03)
    telemetry: off (prod default)         # user 2026-11-03: fabric perf A/Bs run with router BW telemetry off for both routers
    why: "fabric BW + latency (test_fabric_ubench_at_least_2x2_mesh.yaml); CI's goldens were recorded with telemetry on"
    steps:
      - id: B0-bench
        from_ci: {list: blackhole_e2e_tests.yaml, name: "fabric sanity benchmark", sku: bh_loudbox}
        env: {TT_FABRIC_NO_BW_TELEMETRY: "1"}
        needs: [no_bw_telemetry_switch]
        result: [fabric_csv, log_marker]
        marker: "Tests: \\d+ executed, 0 failed"
        golden_check: telemetry_on   # a golden FAIL line here is expected (goldens are telemetry-on); rows are compared main vs new

  # ---------------------------------------------------------------- L1 CCL, BH LoudBox
  - id: LB-L1
    level: L1
    system: bh_loudbox
    kind: coverage
    routers: [main, new]
    steps:
      - id: B1-apc
        est_min: 14            # job 602: 785 s
        from_ci: {list: blackhole_e2e_tests.yaml, name: "ttnn ops fast unit tests (ccl, DRAM prefetcher)", sku: bh_loudbox}
        result: pytest
      # B1-night = CI's "BH ccl nightly tests" (box/nightly, 30 min) as two file subsets (pytest per-file time 692 / 585 s on
      # main): one run took 1306 s of a 1380 s broker budget, and a budget kill mid-test can fault the fabric (job 604)
      - id: B1-night-a
        from_ci: {list: fabric_tests.yaml, name: "BH ccl nightly tests", sku: bh_loudbox, replace: [['tests/ttnn/unit_tests/operations/ccl/blackhole_CI/box/nightly', 'tests/ttnn/unit_tests/operations/ccl/blackhole_CI/box/nightly/test_minimal_reduce_scatter_async_bh.py tests/ttnn/unit_tests/operations/ccl/blackhole_CI/box/nightly/test_reduce_scatter_slot_invariance_bh.py tests/ttnn/unit_tests/operations/ccl/blackhole_CI/box/nightly/test_new_all_reduce.py tests/ttnn/unit_tests/operations/ccl/blackhole_CI/box/nightly/test_reduce_scatter_minimal_direct_bh.py tests/ttnn/unit_tests/operations/ccl/blackhole_CI/box/nightly/test_reduce_scatter_batch_invariance_bh.py tests/ttnn/unit_tests/operations/ccl/blackhole_CI/box/nightly/test_matmul_reduce_scatter_cache_bh.py tests/ttnn/unit_tests/operations/ccl/blackhole_CI/box/nightly/test_reduce_scatter_2d_fabric.py tests/ttnn/unit_tests/operations/ccl/blackhole_CI/box/nightly/test_reduce_to_root_trace.py tests/ttnn/unit_tests/operations/ccl/blackhole_CI/box/nightly/test_minimal_reduce_scatter_async.py tests/ttnn/unit_tests/operations/ccl/blackhole_CI/box/nightly/test_matmul_reduce_scatter_prefill_bh.py tests/ttnn/unit_tests/operations/ccl/blackhole_CI/box/nightly/test_matmul_reduce_scatter_prefill_perf_bh.py tests/ttnn/unit_tests/operations/ccl/blackhole_CI/box/nightly/test_ccl_perf.py']]}
        est_min: 14
        known_fail_cases:
          "test_matmul_reduce_scatter_cache_hit\\[.*mesh_device=\\(1, 4\\)": "main, lab LoudBoxes a09u32 + a07u28 (TEST_PLAN 4.5): 1x4 submesh setup 'Fabric Router Sync: Timeout after 10000 ms on Device 0' (fabric_firmware_initializer.cpp:289)"
          "test_moe_compute_fullccl_linear_1x4\\[": "main, lab LoudBoxes a09u32 + a07u28 (TEST_PLAN 4.5): 1x4 submesh setup 'Fabric Router Sync: Timeout after 10000 ms on Device 0' (fabric_firmware_initializer.cpp:289)"
          "test_selective_reduce_combine_linear_1x4\\[": "main, lab LoudBoxes a09u32 + a07u28 (TEST_PLAN 4.5): 1x4 submesh setup 'Fabric Router Sync: Timeout after 10000 ms on Device 0' (fabric_firmware_initializer.cpp:289)"
        result: pytest
      - id: B1-night-b
        from_ci: {list: fabric_tests.yaml, name: "BH ccl nightly tests", sku: bh_loudbox, replace: [['tests/ttnn/unit_tests/operations/ccl/blackhole_CI/box/nightly', 'tests/ttnn/unit_tests/operations/ccl/blackhole_CI/box/nightly/test_all_gather_nightly.py tests/ttnn/unit_tests/operations/ccl/blackhole_CI/box/nightly/test_all_to_all.py tests/ttnn/unit_tests/operations/ccl/blackhole_CI/box/nightly/test_moe_compute_multi_card.py tests/ttnn/unit_tests/operations/ccl/blackhole_CI/box/nightly/test_all_to_all_dispatch_bh.py tests/ttnn/unit_tests/operations/ccl/blackhole_CI/box/nightly/test_new_all_broadcast.py tests/ttnn/unit_tests/operations/ccl/blackhole_CI/box/nightly/test_all_reduce_2d_fabric_turning.py tests/ttnn/unit_tests/operations/ccl/blackhole_CI/box/nightly/test_all_gather_2d_fabric.py tests/ttnn/unit_tests/operations/ccl/blackhole_CI/box/nightly/test_all_to_all_combine_bh.py tests/ttnn/unit_tests/operations/ccl/blackhole_CI/box/nightly/test_all_to_all_async_generic_perf.py tests/ttnn/unit_tests/operations/ccl/blackhole_CI/box/nightly/test_all_broadcast_2d_fabric.py tests/ttnn/unit_tests/operations/ccl/blackhole_CI/box/nightly/test_all_reduce_2d_fabric.py']]}
        est_min: 12
        known_fail_cases:
          "test_matmul_reduce_scatter_cache_hit\\[.*mesh_device=\\(1, 4\\)": "main, lab LoudBoxes a09u32 + a07u28 (TEST_PLAN 4.5): 1x4 submesh setup 'Fabric Router Sync: Timeout after 10000 ms on Device 0' (fabric_firmware_initializer.cpp:289)"
          "test_moe_compute_fullccl_linear_1x4\\[": "main, lab LoudBoxes a09u32 + a07u28 (TEST_PLAN 4.5): 1x4 submesh setup 'Fabric Router Sync: Timeout after 10000 ms on Device 0' (fabric_firmware_initializer.cpp:289)"
          "test_selective_reduce_combine_linear_1x4\\[": "main, lab LoudBoxes a09u32 + a07u28 (TEST_PLAN 4.5): 1x4 submesh setup 'Fabric Router Sync: Timeout after 10000 ms on Device 0' (fabric_firmware_initializer.cpp:289)"
        result: pytest
      - id: B1-watch     # the box/watcher half of the QB2 "ccl nightly tests" entry (its box/nightly half is B1-night)
        est_min: 2            # job 604: 25 s
        known_fail_cases:
          "test_fused_matmul_reduce_scatter_atomic_barrier\\[.*M128_scatter_header.*mesh_device=\\(1, 4\\)": "main, lab LoudBoxes a09u32 + a07u28 (TEST_PLAN 4.5): 1x4 submesh setup 'Fabric Router Sync: Timeout after 10000 ms on Device 0' (fabric_firmware_initializer.cpp:289)"
        from_ci: {list: ops_unit_tests.yaml, name: "ccl nightly tests", sku: bh_quietbox_2, drop_lines: ['^pytest tests/ttnn/unit_tests/operations/ccl/blackhole_CI/box/nightly\s*$']}
        timeout_min: 30
        result: pytest
      # B1-dp: the CI entry "Disaggregated prefill op unit tests (LB)" (30 min) does not fit one 25-min broker job (job 604:
      # CAPPED at 1338 s), so it runs as its own lines: host-side pytest, the op_unit_tests pytest over three file subsets
      # (CI's -k / -m filter unchanged), the D2D stream gtest. `|| exit_code=$?` is dropped so a failing line fails the step.
      - id: B1-dp-host
        est_min: 8            # 604: host ~6 min, op_unit_tests ~18 min in all
        from_ci: {list: ops_unit_tests.yaml, name: "Disaggregated prefill op unit tests (LB)", sku: bh_loudbox, replace: [[' || exit_code=$?', '']], lines_matching: 'models/demos/common/prefill/tests'}
        result: pytest
      - id: B1-dp-ops-a
        est_min: 9            # 604: host ~6 min, op_unit_tests ~18 min in all
        from_ci: {list: ops_unit_tests.yaml, name: "Disaggregated prefill op unit tests (LB)", sku: bh_loudbox, replace: [['models/demos/deepseek_v3_d_p/tests/op_unit_tests/ ', 'models/demos/deepseek_v3_d_p/tests/op_unit_tests/test_combine_fabric2d.py models/demos/deepseek_v3_d_p/tests/op_unit_tests/test_combine_subdevices.py models/demos/deepseek_v3_d_p/tests/op_unit_tests/test_compressor_state_exchange.py models/demos/deepseek_v3_d_p/tests/op_unit_tests/test_csa_compressor.py models/demos/deepseek_v3_d_p/tests/op_unit_tests/test_csa_sparse_attention.py models/demos/deepseek_v3_d_p/tests/op_unit_tests/test_deepseek_prefill_rotary_embedding_indexed.py models/demos/deepseek_v3_d_p/tests/op_unit_tests/test_deepseek_prefill_update_padded_kv_cache.py '], [' || exit_code=$?', '']], lines_matching: 'op_unit_tests/'}
        result: pytest
      - id: B1-dp-ops-b
        known_fail_cases:      # main d2bd12f: the test's call does not match main's combine_fabric2d binding (TEST_PLAN §4.5)
          "test_hybrid_routed_expert_combine_overlap_perf\\[": "TypeError: ttnn.experimental.deepseek_prefill.combine_fabric2d(): incompatible function arguments"
        est_min: 9            # 604: host ~6 min, op_unit_tests ~18 min in all
        from_ci: {list: ops_unit_tests.yaml, name: "Disaggregated prefill op unit tests (LB)", sku: bh_loudbox, replace: [['models/demos/deepseek_v3_d_p/tests/op_unit_tests/ ', 'models/demos/deepseek_v3_d_p/tests/op_unit_tests/test_dispatch_combine_l1_small_semaphores.py models/demos/deepseek_v3_d_p/tests/op_unit_tests/test_dispatch_combine_local.py models/demos/deepseek_v3_d_p/tests/op_unit_tests/test_dispatch_fabric2d.py models/demos/deepseek_v3_d_p/tests/op_unit_tests/test_hybrid_routed_expert_combine.py models/demos/deepseek_v3_d_p/tests/op_unit_tests/test_masked_bincount.py models/demos/deepseek_v3_d_p/tests/op_unit_tests/test_moe_padding_config.py models/demos/deepseek_v3_d_p/tests/op_unit_tests/test_offset_cumsum.py '], [' || exit_code=$?', '']], lines_matching: 'op_unit_tests/'}
        result: pytest
      - id: B1-dp-ops-c
        est_min: 9            # 604: host ~6 min, op_unit_tests ~18 min in all

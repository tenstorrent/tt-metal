  # ---------------------------------------------------------------- L2 models, BH LoudBox
  - id: LB-L2
    level: L2
    system: bh_loudbox
    kind: perf
    routers: [main, new]
    steps:
      # B2-dp-perf: the CI entry (35 min) split by its own lines so each part stays well inside a broker job (a budget
      # kill mid-test faulted the fabric in job 604); `|| exit_code=$?` dropped so a failing line fails its part
      - id: B2-dp-perf-ds    # recorded as NOT_RUN (never a skip-pass)
        status: not_run
        why: "NOT RUN: needs /mnt/MLPerf/huggingface/hub/models--deepseek-ai--DeepSeek-R1-0528 (absent on a09u32 and in /mnt/models/huggingface); run it in CI (blackhole-e2e-tests, model disaggregated_prefill)"
        from_ci: {list: blackhole_e2e_tests.yaml, name: "Disaggregated prefill perf tests", sku: bh_loudbox}
      - id: B2-dp-perf-kda   # in-test targets are two-sided (+/- 3-5 %): a faster host fails them; the measured values are the metrics
        perf_window: true      # a case outside its in-test perf window is PERF_WINDOW (value in metrics / tests.json window), not FAIL
        from_ci: {list: blackhole_e2e_tests.yaml, name: "Disaggregated prefill perf tests", sku: bh_loudbox, replace: [[' || exit_code=$?', '']], lines_matching: 'KDA_PERF_SKU|test_qkv_convolution_exchange'}
        needs: [weights_mlperf]
        est_min: 10
        result: [pytest, benchmark_json, metrics]
        metrics:
          - '(?P<name>KDA_[A-Z_]+_PERF)=\{.*?"layout": "(?P<layout>[^"]+)".*?"median_trace_wall_ms": (?P<value>[\d.]+)'
          - '(?P<name>KDA_[A-Z_]+_PERF)=\{.*?"median_trace_wall_ms": (?P<value>[\d.]+).*?"layout": "(?P<layout>[^"]+)"'
          - '(?P<name>qkv_causal_conv1d_silu_with_carry) Kimi-K3 perf: (?P<value>[\d.]+) us per call'
      - id: B2-dp-perf-m4
        perf_window: true      # a case outside its in-test perf window is PERF_WINDOW (value in metrics / tests.json window), not FAIL
        from_ci: {list: blackhole_e2e_tests.yaml, name: "Disaggregated prefill perf tests", sku: bh_loudbox, replace: [[' || exit_code=$?', '']], lines_matching: 'MISTRAL4_HF_MODEL|test_mistral4_'}
        needs: [weights_mlperf]
        est_min: 10
        result: [pytest, benchmark_json, metrics]
        metrics:   # device-perf blocks (tt_py_test_utils_common.perf.device_perf_utils): the run's own value per test
          - '(?s)Test: pytest (?P<test>\S+).*?"AVG DEVICE KERNEL DURATION \[ns\]": (?P<value>[\d.]+)'
      - id: B2-dp-k3
        perf_window: true      # a case outside its in-test perf window is PERF_WINDOW (value in metrics / tests.json window), not FAIL
        from_ci: {list: blackhole_e2e_tests.yaml, name: "Disaggregated prefill Kimi-K3 MLA + AttnRes perf tests (LoudBox)", sku: bh_loudbox}
        needs: [weights_mlperf]
        result: [pytest, benchmark_json, metrics]
        metrics:   # device-perf blocks (tt_py_test_utils_common.perf.device_perf_utils): the run's own value per test
          - '(?s)Test: pytest (?P<test>\S+).*?"AVG DEVICE KERNEL DURATION \[ns\]": (?P<value>[\d.]+)'
          - 'kimi_k3 MLA chunked perf \[(?P<case>[^\]]+)\][^\n]*\n[^\n]*\ntraced host E2E: (?P<value>[\d.]+) ms'
          - '(?P<name>ATTN_RES_PERF)=\{.*?"e2e_us": \{"(?P<part>boundary)": (?P<value>[\d.]+)'
          - '(?P<name>ATTN_RES_PERF)=\{.*?"e2e_us": \{"boundary": [\d.]+, "(?P<part>ordinary)": (?P<value>[\d.]+)'


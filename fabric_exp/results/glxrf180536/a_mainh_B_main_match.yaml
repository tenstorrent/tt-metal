# fabric_exp/report/refresh/rf_matched.py from this job's pass a (set B_main): N_i = 1.5e+09 / r_i.
# 256 B: F0 4047000 (r 370.6), F1 1462000 (r 1026.0); 1024 B: F0 4145000 (r 361.9), F1 1294000 (r 1159.2); 4352 B: F0 4178000 (r 359.0), F1 1234000 (r 1215.6)
allocation_policies:
  receiver:
    policy: RoundRobin
    max_configs_per_core: 4
Tests:
  - name: "MVC3_B_main_M01_s256"
    benchmark_mode: true
    sync: false  # each sender times its own send loop (mvc3_yamls.py)
    fabric_setup:
      topology: Mesh
    parametrization_params:
      ntype: [unicast_write]
      size: [256]
    defaults:
      ftype: unicast
    senders:
      - device: [1, 0]
        vc_id: 0
        patterns:
          - destination:
              device: [1, 1]
            num_packets: 4047000
      - device: [0, 0]
        patterns:
          - destination:
              device: [1, 1]
            num_packets: 1462000


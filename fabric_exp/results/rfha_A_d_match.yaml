allocation_policies:
  receiver:
    policy: RoundRobin
    max_configs_per_core: 4
Tests:
  - name: "MVC3_A_d_M012_s256"
    benchmark_mode: true
    sync: false  # each sender times its own send loop (mvc3_yamls.py)
    fabric_setup:
      topology: Mesh
      use_vc2: true
    parametrization_params:
      ntype: [unicast_write]
      size: [256]
    defaults:
      ftype: unicast
    senders:
      - device: [1, 0]
        vc_id: 0
        patterns:
          - destination:
              device: [1, 1]
            num_packets: 4810000
      - device: [0, 0]
        patterns:

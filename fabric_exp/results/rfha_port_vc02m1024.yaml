# VC0 + VC2 with matched counts (port, 1024 B; fabric_exp/report/refresh/rf_matched.py, from this job's pass a):
# VC0 4000000 packets, VC2 1099000: VC0 / VC2 cycles per packet under contention 172.5 / 627.7, so both senders finish
# together and the summary CSV is the link's combined rate.
allocation_policies:
  receiver:
    policy: RoundRobin
    max_configs_per_core: 4
Tests:
- name: PcsVC02M1024
  benchmark_mode: true
  sync: false  # each sender times its own run
  fabric_setup:
    topology: Mesh
    use_vc2: true
  parametrization_params:
    ntype:
    - unicast_write
    size:
    - 1024
  defaults:
    ftype: unicast
    num_packets: 4000000
  senders:
  - device:
    - 0
    - 0
    vc_id: 0
    patterns:
    - num_packets: 4000000
      destination:
        device:
        - 0
        - 1
  - device:
    - 0
    - 0
    vc_id: 2
    patterns:
    - num_packets: 1099000
      destination:
        device:
        - 0
        - 1

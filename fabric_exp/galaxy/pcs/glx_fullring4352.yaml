# Cycle breakdown, phase 2 (fabric_exp/report/BREAKDOWN_PLAN.md): Point 5: GlxFullRingMulticast write 4352 B, long. Duration not calibrated (census rows used 20000 packets); the sampler stops at --max-s.
# Copy of fabric_exp/consolidation/bd_rows/glx_fullring4352.yaml (mock-vetted on the Galaxy descriptor) with num_packets 120,000,000 (was 380,000,000: the busiest sender carries 3 traffic configs, so job 169481 ran 518 s of traffic on main and ~720 s on v4rxg3, near the 900 s step timeout; 120M gives ~165 s / ~230 s) (Galaxy report runs, frs_glx_rsz.sbatch).
allocation_policies:
  receiver:
    policy: RoundRobin
    max_configs_per_core: 4
Tests:
- name: BdGlxFullRing4352
  benchmark_mode: true
  sync: true
  fabric_setup:
    topology: Ring
  parametrization_params:
    ntype:
    - unicast_write
    size:
    - 4352
  defaults:
    ftype: mcast
    num_packets: 120000000
  patterns:
  - type: full_ring
    iterations: 1

# Blackhole Galaxy (single node, 8x4, rows of 4 chips: [0,0..3] is the first row), 2D torus XY (wraparound on both
# axes), one link: the Galaxy analogue of the P150 Y-torus suite (fabric_exp/v4/exp_torus_y.yaml) for the report's
# 200G size sweep (2026-11-02), at 256 / 1024 / 2048 / 3072 / 4352 B. Wrap rows: chip 0 to 3 (E/W) and 0 to 28 (N/S),
# one hop on the torus when routing takes the wraparound link (3 and 7 hops on the mesh).
allocation_policies:
  receiver: {policy: RoundRobin, max_configs_per_core: 4}
Tests:
- name: GlxTorus1HopEW
  benchmark_mode: true
  sync: true
  fabric_setup: {topology: Torus, torus_config: XY}
  parametrization_params:
    ntype: [unicast_write]
    size: [256, 1024, 2048, 3072, 4352]
  defaults: {ftype: unicast, num_packets: 50000}
  senders:
  - device: [0, 0]
    patterns:
    - destination:
        device: [0, 1]

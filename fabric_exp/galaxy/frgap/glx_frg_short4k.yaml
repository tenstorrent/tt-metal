# RING_JAM_FIX.md §9.3 (slot depth x injection threshold): glx_frg_short.yaml at 4352 B only. GlxRing1HopEW (one 1-hop
# unicast flow: what a small worker channel costs) and GlxHalfRingMulticast (half_ring pattern, 20000 packets).
allocation_policies:
  receiver: {policy: RoundRobin, max_configs_per_core: 4}
Tests:
- name: GlxRing1HopEW
  benchmark_mode: true
  sync: true
  fabric_setup: {topology: Ring}
  parametrization_params:
    ntype: [unicast_write]
    size: [4352]
  defaults: {ftype: unicast, num_packets: 50000}
  senders:
  - device: [0, 0]
    patterns:
    - destination:
        device: [0, 1]
- name: GlxHalfRingMulticast
  benchmark_mode: true
  sync: true
  fabric_setup: {topology: Ring}
  parametrization_params:
    ntype: [unicast_write]
    size: [4352]
  defaults: {ftype: mcast, num_packets: 20000}
  patterns:
  - {type: half_ring, iterations: 1}

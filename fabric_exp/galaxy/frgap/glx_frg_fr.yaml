# FULLRING_MCAST_GAP.md A/Bs 5 and 6 (2026-11-03): glx_sizes_ring.yaml's GlxFullRingMulticast at 3072 and 4352 B, run
# under the slot and keepalive settings (frs_glx_frgap.sbatch configs v4tier / v4r32 / v4r48 / v4ka0 / v4ka250).
allocation_policies:
  receiver: {policy: RoundRobin, max_configs_per_core: 4}
Tests:
- name: GlxFullRingMulticast
  benchmark_mode: true
  sync: true
  fabric_setup: {topology: Ring}
  parametrization_params:
    ntype: [unicast_write]
    size: [3072, 4352]
  defaults: {ftype: mcast, num_packets: 20000}
  patterns:
  - {type: full_ring, iterations: 1}

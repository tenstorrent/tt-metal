# FULLRING_MCAST_GAP.md §8.14 (injection throttle): short-trip ring rows. GlxRing1HopEW as glx_sizes_ring.yaml (one
# 1-hop unicast flow); GlxHalfRingMulticast: the half_ring pattern on the Galaxy rings (each chip multicasts half the
# ring each way), 20000 packets. 3072 and 4352 B.
allocation_policies:
  receiver: {policy: RoundRobin, max_configs_per_core: 4}
Tests:
- name: GlxRing1HopEW
  benchmark_mode: true
  sync: true
  fabric_setup: {topology: Ring}
  parametrization_params:
    ntype: [unicast_write]
    size: [3072, 4352]
  defaults: {ftype: unicast, num_packets: 50000}
  senders:
  - device: [0, 0]
    patterns:
    - destination:
        device: [0, 1]
- name: GlxHalfRingMulticast
  benchmark_mode: true
  sync: true
  fabric_setup: {topology: Ring}
  parametrization_params:
    ntype: [unicast_write]
    size: [3072, 4352]
  defaults: {ftype: mcast, num_packets: 20000}
  patterns:
  - {type: half_ring, iterations: 1}

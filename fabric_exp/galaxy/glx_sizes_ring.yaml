# Generated from fabric_exp/galaxy/glx_ring.yaml (report 200G size sweep, 2026-11-02): every test at [256, 1024, 2048, 3072, 4352] B; otherwise unchanged.
allocation_policies:
  receiver: {policy: RoundRobin, max_configs_per_core: 4}
Tests:
- name: GlxRing1HopEW
  benchmark_mode: true
  sync: true
  fabric_setup: {topology: Ring}
  parametrization_params:
    ntype: [unicast_write]
    size: [256, 1024, 2048, 3072, 4352]
  defaults: {ftype: unicast, num_packets: 50000}
  senders:
  - device: [0, 0]
    patterns:
    - destination:
        device: [0, 1]
- name: GlxFullRingMulticast
  benchmark_mode: true
  sync: true
  fabric_setup: {topology: Ring}
  parametrization_params:
    ntype: [unicast_write]
    size: [256, 1024, 2048, 3072, 4352]
  defaults: {ftype: mcast, num_packets: 20000}
  patterns:
  - {type: full_ring, iterations: 1}

# test_fabric_stability.yaml's _short test on a Y torus, for the P150x8 LoudBox: flow control, all-to-all, the four
# ntypes, 1/2/4 KB, 10k packets, 10 iterations. Unicast only: Y-torus multicast aborts in setup on the P150 and wedges
# the device (RESULTS.md, val_torus_y_p150.yaml).
Tests:
  - name: "FlowControlTorusY_short"
    enable_flow_control: true
    fabric_setup:
      topology: Torus
      torus_config: Y
      num_links: max

    top_level_iterations: 10

    parametrization_params:
      ntype: [unicast_write, atomic_inc, fused_atomic_inc, unicast_scatter_write]
      size: [1024, 2048, 4096]

    defaults:
      ftype: unicast
      num_packets: 10000

    patterns:
      - type: all_to_all

# Router study (2026-10-29), express / Z on one Galaxy: groups of
# tests/tt_metal/tt_fabric/test_infra/test_yamls/test_fabric_express_routing_sanity_common.yaml, unchanged,
# for express/express_links_8x4_line_ring_mesh_graph_descriptor.textproto (one mesh of CI's quad 8x4: dim 0
# LINE with the ex4 and row 0 <-> 7 chords, dim 1 RING): CI's quad 8x4 groups (topology.TorusX, MeshMulticastAllToAllIntra).
# Each group vetted on the mock Galaxy (fabric_exp/express/probe).
Tests:
- name: MeshMulticastAllToAllIntra
  sync: true
  enable_flow_control: true
  fabric_setup:
    topology: Mesh
  parametrization_params:
    ntype:
    - unicast_write
    - atomic_inc
    - fused_atomic_inc
    - unicast_scatter_write
    num_links:
    - 1
    - 2
    size:
    - 1024
    - 2048
    - 4096
  defaults:
    ftype: mcast
    num_packets: 100
  patterns:
  - type: all_to_all
    mesh_scope: intra_mesh
- name: TorusXAllToAll
  sync: true
  enable_flow_control: true
  fabric_setup:
    topology: Torus
    torus_config: X
  parametrization_params:
    ntype:
    - unicast_write
    - atomic_inc
    - fused_atomic_inc
    - unicast_scatter_write
    num_links:
    - 1
    - 2
    size:
    - 1024
    - 2048
    - 4096
  defaults:
    ftype: unicast
    num_packets: 100
  patterns:
  - type: all_to_all
- name: TorusXAllToAllIntra
  sync: true
  enable_flow_control: true
  fabric_setup:
    topology: Torus
    torus_config: X
  parametrization_params:
    ntype:
    - unicast_write
    - atomic_inc
    - fused_atomic_inc
    - unicast_scatter_write
    num_links:
    - 1
    - 2
    size:
    - 1024
    - 2048
    - 4096
  defaults:
    ftype: unicast
    num_packets: 100
  patterns:
  - type: all_to_all
    mesh_scope: intra_mesh

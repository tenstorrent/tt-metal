# Report refresh 2 (2026-11-06, fabric_exp/report/refresh/mk_rf2_yamls.py): fused write + atomic (fused_atomic_inc, the stock test infra's default flush), benchmark mode only, at 1,024 / 4,096 / 4,352 B; 400G rows as the matrix's 1-hop write cells: Linear1HopEW, Ring1HopEW, TorusXYWrap1HopEW (XY torus 2x4), NeighborExchange (1 link).
allocation_policies:
  receiver:
    policy: RoundRobin
    max_configs_per_core: 4
Tests:
- name: Linear1HopEW
  benchmark_mode: true
  sync: true
  fabric_setup:
    topology: Linear
  parametrization_params:
    ntype:
    - fused_atomic_inc
    size:
    - 1024
    - 4096
    - 4352
  defaults:
    ftype: unicast
    num_packets: 50000
  senders:
  - device:
    - 0
    - 0
    patterns:
    - destination:
        device:
        - 0
        - 1
- name: Ring1HopEW
  benchmark_mode: true
  sync: true
  fabric_setup:
    topology: Ring
  parametrization_params:
    ntype:
    - fused_atomic_inc
    size:
    - 1024
    - 4096
    - 4352
  defaults:
    ftype: unicast
    num_packets: 50000
  senders:
  - device:
    - 0
    - 0
    patterns:
    - destination:
        device:
        - 0
        - 1
- name: TorusXYWrap1HopEW
  benchmark_mode: true
  sync: true
  fabric_setup:
    topology: Torus
    torus_config: XY
  parametrization_params:
    ntype:
    - fused_atomic_inc
    size:
    - 1024
    - 4096
    - 4352
  defaults:
    ftype: unicast
    num_packets: 50000
  senders:
  - device:
    - 0
    - 3
    patterns:
    - destination:
        device:
        - 0
        - 0
- name: NeighborExchange
  benchmark_mode: true
  sync: true
  fabric_setup:
    topology: NeighborExchange
  parametrization_params:
    num_links:
    - 1
    ntype:
    - fused_atomic_inc
    size:
    - 1024
    - 4096
    - 4352
  defaults:
    ftype: unicast
    num_packets: 50000
  patterns:
  - type: neighbor_exchange
    iterations: 1

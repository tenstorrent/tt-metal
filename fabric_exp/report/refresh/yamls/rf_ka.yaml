# Report data refresh 2026-11-05 (fabric_exp/report/refresh/mk_rf_yamls.py): the keepalive table's one-way rows at 4352 B (1D line, ring, 2D merge), for main at the firmware keepalive, main at 1000 cycles and the port in one job.
allocation_policies:
  receiver:
    policy: RoundRobin
    max_configs_per_core: 4
Tests:
- name: Linear1HopEW
  benchmark_mode: true
  sync: true
  fabric_setup:
    topology: Linear
  parametrization_params:
    ntype:
    - unicast_write
    - unicast_scatter_write
    size:
    - 4352
  defaults:
    ftype: unicast
    num_packets: 50000
  senders:
  - device:
    - 0
    - 0
    patterns:
    - destination:
        device:
        - 0
        - 1

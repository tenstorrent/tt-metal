# Report data refresh 2026-11-05 (fabric_exp/report/refresh/mk_rf_yamls.py): 200G missing cells: pr_glx_nx_sweep.yaml's GlxNeighborExchange as scatter_write, 1 link.
allocation_policies:
  receiver:
    policy: RoundRobin
    max_configs_per_core: 4
Tests:
- name: GlxNeighborExchange
  benchmark_mode: true
  sync: true
  fabric_setup:
    topology: NeighborExchange
  parametrization_params:
    num_links:
    - 1
    ntype:
    - unicast_scatter_write
    size:
    - 256
    - 512
    - 1024
    - 2048
    - 3072
    - 4096
    - 4352
  defaults:
    ftype: unicast
    num_packets: 200000
  patterns:
  - type: neighbor_exchange
    iterations: 1

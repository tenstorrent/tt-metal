# Report data refresh 2026-11-05 (fabric_exp/report/refresh/mk_rf_yamls.py): exp_2d_4352.yaml's rows at [256, 1024, 2048, 3072, 4096, 4352] B (Mesh1HopEW also fused_atomic_inc), pr_ptype_sweep.yaml's MeshFwd (write, scatter, fused) and pure atomics (atomic_inc at a nominal 256 B; MeshFwdAtomic = MeshFwd's two flows as atomic_inc).
allocation_policies:
  receiver:
    policy: RoundRobin
    max_configs_per_core: 4
Tests:
- name: Mesh1HopEW
  benchmark_mode: true
  sync: true
  fabric_setup:
    topology: Mesh
  parametrization_params:
    ntype:
    - unicast_write
    - unicast_scatter_write
    - fused_atomic_inc
    size:
    - 256
    - 1024
    - 2048
    - 3072
    - 4096
    - 4352
  defaults:
    ftype: unicast
    num_packets: 50000
  senders:
  - device:
    - 0
    - 0
    patterns:
    - destination:
        device:
        - 0
        - 1

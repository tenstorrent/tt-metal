  - name: "VC1Mesh2HopMerge"
    benchmark_mode: true
    sync: true
    fabric_setup:
      topology: Mesh
    parametrization_params:
      ntype: [unicast_write]
      size: [16, 4352]
    defaults:
      ftype: unicast
      num_packets: 50000
    senders:
      - device: [0, 0]
        patterns:
          - destination:
              device: [0, 3]
      - device: [0, 1]
        patterns:
          - destination:
              device: [0, 3]
      - device: [0, 2]
        patterns:
          - destination:
              device: [0, 3]

  - name: "VC1BurstEW_N8_G500"
    benchmark_mode: true
    sync: true
    fabric_setup:
      topology: Mesh
    parametrization_params:
      size: [4352, 16]
    defaults:
      ftype: unicast
    senders:
      - device: [0, 0]
        patterns:
          - destination:
              device: [0, 1]
            repeat: 2500
            stream:
              - {ntype: unicast_write, count: 8}
              - {idle: 500}

  - name: "VC1BurstEW_N32_G500"
    benchmark_mode: true

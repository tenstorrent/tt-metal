# Slot study P4 (PREPARED, NOT RUN: VC1 with meshes larger than 2x2 waits for the command-buffer-2 fix, V4_BOUNDS.md
# §4). The Galaxy as four 4x2 meshes, one per tray (glx_4x2_split_*: a ring of meshes 0-1-2-3-0), one MPI rank per
# mesh; device ids [mesh, r * 2 + c]. Multi-mesh sanity, intra-mesh rows (1-hop and 3-hop along the 4-chip side, a
# corner), and inter-mesh rows from [0, 0] to two chips of each other mesh: to meshes 1 and 3 one inter-mesh link, to
# mesh 2 two (through mesh 1 or 3 on VC1: the pass-through case a 2x2 pair of meshes never has).
allocation_policies:
    receiver:
      policy: RoundRobin
      max_configs_per_core: 4

Tests:

  - name: "MultiMeshAllToAll"
    sync: true
    fabric_setup:
      topology: Mesh
    parametrization_params:
      ntype: [unicast_write, fused_atomic_inc]
      size: [1024, 4096]
    defaults:
      ftype: unicast
      num_packets: 100
    patterns:
      - type: all_to_all

  - name: "MultiMeshNeighborExchangeInter"
    sync: true
    fabric_setup:
      topology: Mesh
    parametrization_params:
      ntype: [unicast_write, fused_atomic_inc]
    defaults:
      ftype: unicast
      size: 32
      num_packets: 3000
    patterns:
      - type: neighbor_exchange
        mesh_scope: inter_mesh

  - name: "X42Mesh1HopNS"
    benchmark_mode: true
    sync: true
    fabric_setup:
      topology: Mesh
    parametrization_params:
      ntype: [unicast_write]
      size: [16, 4352]
    defaults:
      ftype: unicast
      num_packets: 50000
    senders:
      - device: [0, 0]
        patterns:
          - destination:
              device: [0, 2]

  - name: "X42Mesh3HopNS"

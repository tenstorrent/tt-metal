# Slot study, 3584 B slots (SLOT_STUDY.md "3-3.5 KiB slots"): sls_2d_glx.yaml's rows (Galaxy 8x4 mesh, 2D, VC0 only)
# with max_packet_size 3584, at 256, 1024 and 3584 B payloads; slots from TT_FABRIC_EXP_SLOTS_2D or the builder default. 33 tests.
allocation_policies:
    receiver:
      policy: RoundRobin
      max_configs_per_core: 4

Tests:

  - name: "Sls1HopEW"
    benchmark_mode: true
    sync: true
    fabric_setup:
      topology: Mesh
      max_packet_size: 3584
    parametrization_params:
      ntype: [unicast_write]
      size: [256, 1024, 3584]
    defaults:
      ftype: unicast
      num_packets: 50000
    senders:
      - device: [0, 0]
        patterns:
          - destination:
              device: [0, 1]

  - name: "Sls1HopNS"
    benchmark_mode: true
    sync: true
    fabric_setup:

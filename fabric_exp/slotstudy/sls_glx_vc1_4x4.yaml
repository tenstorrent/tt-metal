# Slot study P4 (PREPARED, NOT RUN: VC1 with meshes larger than 2x2 waits for the command-buffer-2 fix, V4_BOUNDS.md
# §4; main says when). The Galaxy as two 4x4 meshes (glx_4x4_split_*), one MPI rank per mesh; device ids [mesh, r * 4 + c].
# Multi-mesh sanity (data checked), intra-mesh VC0 rows with longer paths (3-hop E/W and N/S, a 6-hop corner, a row
# merge) and inter-mesh rows from the four corners of mesh 0 to the four corners of mesh 1 (VC1 paths of 0-6 hops in
# mesh 1, depending on the exits the placement picks; read the exits from the mock's router args first).
allocation_policies:
    receiver:
      policy: RoundRobin
      max_configs_per_core: 4

Tests:

  - name: "MultiMeshAllToAll"
    sync: true
    fabric_setup:
      topology: Mesh
    parametrization_params:
      ntype: [unicast_write, fused_atomic_inc]
      size: [1024, 4096]
    defaults:
      ftype: unicast
      num_packets: 100
    patterns:
      - type: all_to_all

  - name: "MultiMeshNeighborExchangeInter"
    sync: true
    fabric_setup:
      topology: Mesh
    parametrization_params:
      ntype: [unicast_write, fused_atomic_inc]
    defaults:
      ftype: unicast
      size: 32
      num_packets: 3000
    patterns:
      - type: neighbor_exchange
        mesh_scope: inter_mesh

  - name: "X44Mesh1HopEW"
    benchmark_mode: true
    sync: true
    fabric_setup:
      topology: Mesh
    parametrization_params:
      ntype: [unicast_write]
      size: [16, 4352]
    defaults:
      ftype: unicast
      num_packets: 50000
    senders:
      - device: [0, 0]
        patterns:
          - destination:
              device: [0, 1]

  - name: "X44Mesh3HopEW"

# Slot study, 2 KiB slots: sls_vc2_glx_4k.yaml's VC2-on rows with max_packet_size 2048 (2 KiB slots). 4 tests.
allocation_policies:
  receiver:
    policy: RoundRobin
    max_configs_per_core: 4
Tests:
- name: Vc2OnVC0
  benchmark_mode: true
  sync: true
  fabric_setup:
    topology: Mesh
    use_vc2: true
    max_packet_size: 2048
  parametrization_params:
    ntype:
    - unicast_write
    size:
    - 2048
  defaults:
    ftype: unicast
  senders:
  - device:
    - 0
    - 0
    vc_id: 0
    patterns:
    - destination:
        device:
        - 0
        - 1
      num_packets: 1000000

- name: Vc2Alone
  benchmark_mode: true

# Slot study, 2 KiB slots: sls_2d_glx.yaml's rows at the default 4352 B slots with 1024, 2048 and 4352 B payloads (the
# control for sls_2d_glx_2k.yaml: same payloads, half the slots). 33 tests.
allocation_policies:
    receiver:
      policy: RoundRobin
      max_configs_per_core: 4

Tests:

  - name: "Sls1HopEW"
    benchmark_mode: true
    sync: true
    fabric_setup:
      topology: Mesh
    parametrization_params:
      ntype: [unicast_write]
      size: [1024, 2048, 4352]
    defaults:
      ftype: unicast
      num_packets: 50000
    senders:
      - device: [0, 0]
        patterns:
          - destination:
              device: [0, 1]

  - name: "Sls1HopNS"
    benchmark_mode: true
    sync: true
    fabric_setup:
      topology: Mesh
    parametrization_params:
      ntype: [unicast_write]
      size: [1024, 2048, 4352]
    defaults:
      ftype: unicast
      num_packets: 50000
    senders:
      - device: [0, 0]
        patterns:
          - destination:
              device: [0, 4]

  - name: "Sls1HopEWBidir"
    benchmark_mode: true
    sync: true
    fabric_setup:
      topology: Mesh
    parametrization_params:
      ntype: [unicast_write]
      size: [1024, 2048, 4352]
    defaults:
      ftype: unicast
      num_packets: 50000
    senders:
      - device: [0, 0]
        patterns:
          - destination:
              device: [0, 1]
      - device: [0, 1]
        patterns:
          - destination:
              device: [0, 0]

  - name: "Sls3HopEW"

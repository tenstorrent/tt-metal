# Focused fabric throughput experiment set (1 link, P150x8 2x4 mesh)
allocation_policies:
    receiver:
      policy: RoundRobin
      max_configs_per_core: 4

Tests:
  - name: "NeighborExchangeUnicast"
    benchmark_mode: true
    sync: true
    fabric_setup:
      topology: NeighborExchange
    parametrization_params:
      num_links: [1]
      ntype: [unicast_write, unicast_scatter_write]
      size: [2048]
    defaults:
      ftype: unicast
      num_packets: 50000
    patterns:
      - type: neighbor_exchange
        iterations: 1

  - name: "LinearMulticast"
    benchmark_mode: true
    sync: true
    fabric_setup:
      topology: Linear
    parametrization_params:
      num_links: [1]
      ntype: [unicast_write, unicast_scatter_write]
      size: [2048]
    defaults:
      ftype: mcast
      num_packets: 20000
    patterns:
      - type: all_to_all
        iterations: 1

  - name: "UnidirLinearMulticast"
    benchmark_mode: true
    sync: true
    fabric_setup:
      topology: Linear
    parametrization_params:
      num_links: [1]
      ntype: [unicast_write, unicast_scatter_write]
      size: [2048]
    defaults:
      ftype: mcast
      num_packets: 20000
    patterns:
      - type: unidirectional_linear
        iterations: 1

  - name: "MeshMulticast"
    benchmark_mode: true
    sync: true
    fabric_setup:
      topology: Mesh
    parametrization_params:
      num_links: [1]
      ntype: [unicast_write, unicast_scatter_write]
      size: [2048]
    defaults:
      ftype: mcast
      num_packets: 20000
    patterns:
      - type: all_to_all
        iterations: 1

  - name: "HalfRingMulticast"
    benchmark_mode: true
    sync: true
    fabric_setup:
      topology: Ring
    parametrization_params:
      num_links: [1]
      ntype: [unicast_write, unicast_scatter_write]
      size: [2048]
    defaults:
      ftype: mcast
      num_packets: 50000
    patterns:
      - type: half_ring
        iterations: 1

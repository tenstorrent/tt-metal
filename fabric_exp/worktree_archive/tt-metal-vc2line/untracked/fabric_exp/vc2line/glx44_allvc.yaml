# VC0, VC1 and VC2 carrying traffic at once on meshes larger than 2x2 (VC2_LINE_BRINGUP.md): one Blackhole Galaxy split
# into two 4x4 meshes (glx_4x4_split_*, one MPI rank per mesh), every flow below concurrent, data-checked, flow control
# on, VC2 in line mode. Devices are [mesh_id, chip]; chips are row-major in each 4x4 mesh (chip = 4 * row + col; E is
# +col, S is +row). Placement: mesh 0 leaves at chips 0 and 1 (row 0, facing N); mesh 1 at chips 12 and 13 (row 3, facing
# S) on a Galaxy whose links all have 2 lanes (mock), or at chips 0 (facing N) and 12 (facing S) with bh-glx-110-a02u14's
# two 1-link edges (mock of job 168774's node). Every other router is inside its mesh (not an edge router), so the E/W
# routers of cols 1-2 forward VC0 on the command-buffer preset, and VC1 and VC2 next to it (the shared-preset rule).
# A VC2 flow to the other mesh must run straight to its exit, so its sources are col-0 chips, which every placement
# above lines up with an exit.
#   VC0 inside each mesh   2D unicasts that turn into rows 1 and 2 (through the inner E/W routers), a 2D multicast
#   VC0 between meshes     VC0 in the source mesh, VC1 (crossover at the intermesh router) in the destination mesh, to
#                          chips at col 3: VC1 crosses the inner E/W routers of rows 1 and 2
#   VC2 inside each mesh   3-hop lines along rows 1 and 2 (the inner E/W routers) and along cols 2 and 3, a row multicast
#   VC2 between meshes     from col-0 chips (exit chips and chips in line with them): VC2 in the source mesh, VC1 after
#                          the crossover, to chips at cols 2 and 3
# Multicasts are writes (pattern-level ntype); every other flow takes the parametrized ntype.
Tests:
  - name: "AllVCsConcurrent4x4"
    enable_flow_control: true
    fabric_setup:
      topology: Mesh
      vc2_line: true
    parametrization_params:
      ntype: [unicast_write, fused_atomic_inc]
      size: [1024, 4096]
    defaults:
      ftype: unicast
      num_packets: 5000
    senders:
      # --- VC0 inside each mesh ---
      - device: [0, 12]
        vc_id: 0
        patterns:
          - destination: {device: [0, 7]}
      - device: [0, 7]
        vc_id: 0
        patterns:
          - destination: {device: [0, 12]}
      - device: [0, 5]
        vc_id: 0
        patterns:
          - {ftype: mcast, ntype: unicast_write, destination: {hops: {E: 2, S: 2}}}
      - device: [1, 0]
        vc_id: 0
        patterns:
          - destination: {device: [1, 11]}
      - device: [1, 11]
        vc_id: 0
        patterns:
          - destination: {device: [1, 0]}
      - device: [1, 10]
        vc_id: 0
        patterns:
          - {ftype: mcast, ntype: unicast_write, destination: {hops: {W: 2, N: 2}}}
      # --- VC0 between the meshes (VC1 in the destination mesh) ---
      - device: [0, 10]
        vc_id: 0
        patterns:
          - destination: {device: [1, 7]}
      - device: [0, 13]
        vc_id: 0
        patterns:
          - destination: {device: [1, 11]}
      - device: [1, 6]
        vc_id: 0
        patterns:
          - destination: {device: [0, 7]}
      - device: [1, 1]
        vc_id: 0
        patterns:
          - destination: {device: [0, 11]}
      # --- VC2 inside each mesh (straight lines, 3 hops) ---
      - device: [0, 4]
        vc_id: 2
        patterns:
          - destination: {device: [0, 7]}
      - device: [0, 11]
        vc_id: 2
        patterns:
          - destination: {device: [0, 8]}
      - device: [0, 2]
        vc_id: 2
        patterns:
          - destination: {device: [0, 14]}
      - device: [0, 15]
        vc_id: 2
        patterns:
          - destination: {device: [0, 3]}
      - device: [1, 8]
        vc_id: 2
        patterns:
          - destination: {device: [1, 11]}
      - device: [1, 7]
        vc_id: 2
        patterns:
          - destination: {device: [1, 4]}
      - device: [1, 14]
        vc_id: 2
        patterns:
          - destination: {device: [1, 2]}
      - device: [1, 4]
        vc_id: 2
        patterns:
          - {ftype: mcast, ntype: unicast_write, destination: {hops: {E: 3}}}
      # --- VC2 between the meshes (fanning into VC1): sources in col 0, in line with an exit in every placement seen ---
      - device: [0, 0]
        vc_id: 2
        patterns:
          - destination: {device: [1, 7]}
          - destination: {device: [1, 10]}
      - device: [0, 8]
        vc_id: 2
        patterns:
          - destination: {device: [1, 3]}
      - device: [0, 12]
        vc_id: 2
        patterns:
          - destination: {device: [1, 6]}
      - device: [1, 12]
        vc_id: 2
        patterns:
          - destination: {device: [0, 7]}
          - destination: {device: [0, 10]}
      - device: [1, 0]
        vc_id: 2
        patterns:
          - destination: {device: [0, 11]}
      - device: [1, 8]
        vc_id: 2
        patterns:
          - destination: {device: [0, 15]}

# 2D (Mesh, VC0) single-flow writes and scatter writes, 1 hop E/W and N/S, channel trimming on, small packets
# (256 B, 1 KiB, 2 KiB). Each test runs a capture pass, then a replay with unused router channels compiled out.
# 2x4 P150x8 mesh, 1 link.
# Chip ids are row-major: [0, 0..3] is the top row, [0, 4..7] the bottom row.
allocation_policies:
    receiver:
      policy: RoundRobin
      max_configs_per_core: 4

Tests:
  # One flow, one hop east-west: TX of chip 0 -> RX of chip 1 (local delivery only)
  - name: "Mesh1HopEW"
    benchmark_mode: true
    sync: true
    fabric_setup:
      topology: Mesh
      enable_channel_trimming: true
    parametrization_params:
      ntype: [unicast_write, unicast_scatter_write]
      size: [256, 1024, 2048]
    defaults:
      ftype: unicast
      num_packets: 50000
    senders:
      - device: [0, 0]
        patterns:
          - destination:
              device: [0, 1]

  # One flow, one hop north-south
  - name: "Mesh1HopNS"
    benchmark_mode: true
    sync: true
    fabric_setup:
      topology: Mesh
      enable_channel_trimming: true
    parametrization_params:
      ntype: [unicast_write, unicast_scatter_write]
      size: [256, 1024, 2048]
    defaults:
      ftype: unicast
      num_packets: 50000
    senders:
      - device: [0, 0]
        patterns:
          - destination:
              device: [0, 4]

# Port slot measurements (SLOT_ALLOCATOR.md section 12.12; fabric_exp/port_slots/mk_port_yamls.py)
# 1D forwarding rows ['SlsLin3HopEW', 'SlsLinRowMerge'], 3072 B slots.
allocation_policies:
  receiver:
    policy: RoundRobin
    max_configs_per_core: 4
Tests:
- name: SlsLin3HopEW
  benchmark_mode: true
  sync: true
  fabric_setup:
    topology: Linear
    max_packet_size: 3072
  parametrization_params:
    ntype:
    - unicast_write
    size:
    - 256
    - 1024
    - 2048
    - 3072
  defaults:
    ftype: unicast
    num_packets: 50000
  senders:
  - device:
    - 0
    - 0
    patterns:
    - destination:
        device:
        - 0
        - 3
- name: SlsLinRowMerge
  benchmark_mode: true
  sync: true
  fabric_setup:
    topology: Linear
    max_packet_size: 3072
  parametrization_params:
    ntype:
    - unicast_write
    size:
    - 256
    - 1024
    - 2048
    - 3072
  defaults:
    ftype: unicast
    num_packets: 50000
  senders:
  - device:
    - 0
    - 0
    patterns:
    - destination:
        device:
        - 0
        - 3
  - device:
    - 0
    - 1
    patterns:
    - destination:
        device:
        - 0
        - 3
  - device:
    - 0
    - 2
    patterns:
    - destination:
        device:
        - 0
        - 3

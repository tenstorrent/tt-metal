# Port against study (fabric_exp/port_slots/mk_pvs_yamls.py)
# P150 4x2 XY torus (needs its descriptor): N/S rows and 1-hop E/W, no multicast.
allocation_policies:
  receiver:
    policy: RoundRobin
    max_configs_per_core: 4
Tests:
- name: TorusXY4x2_1HopEW
  benchmark_mode: true
  sync: true
  fabric_setup:
    topology: Torus
    torus_config: XY
  parametrization_params:
    ntype:
    - unicast_write
    - unicast_scatter_write
    size:
    - 256
    - 1024
    - 2048
    - 3072
    - 4352
  defaults:
    ftype: unicast
    num_packets: 50000
  senders:
  - device:
    - 0
    - 0
    patterns:
    - destination:
        device:
        - 0
        - 1

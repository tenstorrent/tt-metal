# mk_p1d_yamls.py: val_ring_p150.yaml, num_links 1-2, 4352 B slots. Data-checked (the deadlock-quick row is a benchmark row).
Tests:
- name: FullRingMulticast
  fabric_setup:
    topology: Ring
  parametrization_params:
    num_links:
    - 1
    - 2
    ntype:
    - unicast_write
    - fused_atomic_inc
    - unicast_scatter_write
  defaults:
    ftype: mcast
    size: 1024
    num_packets: 100
  patterns:
  - type: full_ring
- name: FullRingUnicast
  fabric_setup:
    topology: Ring
  parametrization_params:
    num_links:
    - 1
    - 2
    ntype:
    - unicast_write
    - fused_atomic_inc
    - unicast_scatter_write
  defaults:
    ftype: unicast
    size: 1024
    num_packets: 100
  patterns:
  - type: full_ring
- name: FullRingUnicastDeadlockQuick
  benchmark_mode: true
  sync: true
  fabric_setup:
    topology: Ring
  parametrization_params:
    num_links:
    - 1
    ntype:
    - unicast_write
  defaults:
    ftype: unicast
    size: 1024
    num_packets: 1000000
  patterns:
  - type: full_ring
- name: HalfRingMulticast
  fabric_setup:
    topology: Ring
    num_links: 1
  parametrization_params:
    num_links:
    - 1
    - 2
    ntype:
    - unicast_write
    - fused_atomic_inc
    - unicast_scatter_write
  defaults:
    ftype: mcast
    size: 1024
    num_packets: 100
  patterns:
  - type: half_ring

# Port against study (fabric_exp/port_slots/mk_pvs_yamls.py)
# fabric_exp/exp_1d_4352.yaml's NeighborExchange rows (the 1D census suite).
allocation_policies:
  receiver:
    policy: RoundRobin
    max_configs_per_core: 4
Tests:
- name: NeighborExchange
  benchmark_mode: true
  sync: true
  fabric_setup:
    topology: NeighborExchange
  parametrization_params:
    num_links:
    - 1
    ntype:
    - unicast_write
    - unicast_scatter_write
    size:
    - 4352
  defaults:
    ftype: unicast
    num_packets: 50000
  patterns:
  - type: neighbor_exchange
    iterations: 1

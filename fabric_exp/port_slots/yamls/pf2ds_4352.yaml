# Port slot measurements (SLOT_ALLOCATOR.md section 12.12; fabric_exp/port_slots/mk_port_yamls.py)
# 2D forwarding rows ['Sls3HopEW', 'SlsTurn4', 'SlsRowMerge', 'SlsMulticast'] at 256-2048 B, 4352 B slots.
allocation_policies:
  receiver:
    policy: RoundRobin
    max_configs_per_core: 4
Tests:
- name: Sls3HopEW
  benchmark_mode: true
  sync: true
  fabric_setup:
    topology: Mesh
  parametrization_params:
    ntype:
    - unicast_write
    size:
    - 256
    - 1024
    - 2048
  defaults:
    ftype: unicast
    num_packets: 50000
  senders:
  - device:
    - 0
    - 0
    patterns:
    - destination:
        device:
        - 0
        - 3
- name: SlsTurn4
  benchmark_mode: true
  sync: true
  fabric_setup:
    topology: Mesh
  parametrization_params:
    ntype:
    - unicast_write
    size:
    - 256
    - 1024
    - 2048
  defaults:
    ftype: unicast
    num_packets: 50000
  senders:
  - device:
    - 0
    - 0
    patterns:
    - destination:
        device:
        - 0
        - 7
- name: SlsRowMerge
  benchmark_mode: true
  sync: true
  fabric_setup:
    topology: Mesh
  parametrization_params:
    ntype:
    - unicast_write
    size:
    - 256
    - 1024
    - 2048
  defaults:
    ftype: unicast
    num_packets: 50000
  senders:
  - device:
    - 0
    - 0
    patterns:
    - destination:
        device:
        - 0
        - 3
  - device:
    - 0
    - 1
    patterns:
    - destination:
        device:
        - 0
        - 3
  - device:
    - 0
    - 2
    patterns:
    - destination:
        device:
        - 0
        - 3
- name: SlsMulticast
  benchmark_mode: true
  sync: true
  fabric_setup:
    topology: Mesh
  parametrization_params:
    ntype:
    - unicast_write
    size:
    - 256
    - 1024
    - 2048
  defaults:
    ftype: mcast
    num_packets: 20000
  patterns:
  - type: all_to_all
    iterations: 1

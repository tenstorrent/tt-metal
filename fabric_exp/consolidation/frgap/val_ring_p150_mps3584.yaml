# RING_JAM_FIX.md §9.5: val_ring_p150.yaml (the proven P150 ring validation) at a 3584 B router max packet, for the
# 64-slot receiver arms.
# val_ring.yaml's tests that get past setup on the P150x8 (mock probe on a09u32's descriptor, 2026-10-27);
# the others need a taller torus or other link directions (Galaxy) and abort in setup, wedging the device.
Tests:
- name: FullRingMulticast
  fabric_setup:
    topology: Ring
    max_packet_size: 3584
  parametrization_params:
    num_links:
    - 1
    - 2
    - 3
    - 4
    ntype:
    - unicast_write
    - fused_atomic_inc
    - unicast_scatter_write
  defaults:
    ftype: mcast
    size: 1024
    num_packets: 100
  patterns:
  - type: full_ring
- name: FullRingUnicast
  fabric_setup:
    topology: Ring
    max_packet_size: 3584
  parametrization_params:
    num_links:
    - 1
    - 2
    - 3
    - 4
    ntype:
    - unicast_write
    - fused_atomic_inc
    - unicast_scatter_write
  defaults:
    ftype: unicast
    size: 1024
    num_packets: 100
  patterns:
  - type: full_ring
- name: FullRingUnicastDeadlockQuick
  benchmark_mode: true
  sync: true
  fabric_setup:
    topology: Ring
    max_packet_size: 3584
  parametrization_params:
    num_links:
    - 1
    ntype:
    - unicast_write
  defaults:
    ftype: unicast
    size: 1024
    num_packets: 1000000
  patterns:
  - type: full_ring
- name: HalfRingMulticast
  fabric_setup:
    topology: Ring
    max_packet_size: 3584
    num_links: 1
  parametrization_params:
    num_links:
    - 1
    - 2
    - 3
    - 4
    ntype:
    - unicast_write
    - fused_atomic_inc
    - unicast_scatter_write
  defaults:
    ftype: mcast
    size: 1024
    num_packets: 100
  patterns:
  - type: half_ring

# FULLRING_MCAST_GAP.md A/B 3 (P150, 400G; 2026-11-03): the ring multicast rows that step at 4352 B on v4rxg3 only
# (report/sweep/ring_sizes.yaml's UnidirRingMulticast, HalfRingMulticast, RingMulticast, write and scatter, otherwise
# unchanged) at 3072 / 3584 / 3840 / 4000 / 4096 / 4352 B: growth with size vs a step at two Ethernet frames per packet.
allocation_policies:
  receiver: {policy: RoundRobin, max_configs_per_core: 4}
Tests:
- name: UnidirRingMulticast
  benchmark_mode: true
  sync: true
  fabric_setup: {topology: Ring}
  parametrization_params:
    num_links: [1]
    ntype: [unicast_write, unicast_scatter_write]
    size: [3072, 3584, 3840, 4000, 4096, 4352]
  defaults: {ftype: mcast, num_packets: 20000}
  patterns:
  - {type: unidirectional_linear, iterations: 1}
- name: HalfRingMulticast
  benchmark_mode: true
  sync: true
  fabric_setup: {topology: Ring}
  parametrization_params:
    num_links: [1]
    ntype: [unicast_write, unicast_scatter_write]
    size: [3072, 3584, 3840, 4000, 4096, 4352]
  defaults: {ftype: mcast, num_packets: 50000}
  patterns:
  - {type: half_ring, iterations: 1}
- name: RingMulticast
  benchmark_mode: true
  sync: true
  fabric_setup: {topology: Ring}
  parametrization_params:
    num_links: [1]
    ntype: [unicast_write, unicast_scatter_write]
    size: [3072, 3584, 3840, 4000, 4096, 4352]
  defaults: {ftype: mcast, num_packets: 20000}
  patterns:
  - {type: all_to_all, iterations: 1}

# Completion-group merge rows (SLOT_ALLOCATOR.md section 12.10): k far sender channels into one receiver, on
# the link chip 5 -> chip 6 (channels: worker from chip 5, straight from chip 4, turnN from chip 1); k1f = one
# forwarding channel alone. 3072 B slots. Benchmark.
allocation_policies:
  receiver:
    policy: RoundRobin
    max_configs_per_core: 4
Tests:
- name: Merge_p2x4_k1
  benchmark_mode: true
  sync: true
  fabric_setup:
    topology: Mesh
    max_packet_size: 3072
  parametrization_params:
    ntype:
    - unicast_write
    size: &id001
    - 256
    - 3072
  defaults:
    ftype: unicast
    num_packets: 50000
  senders:
  - device:
    - 0
    - 5
    patterns:
    - destination:
        device:
        - 0
        - 6

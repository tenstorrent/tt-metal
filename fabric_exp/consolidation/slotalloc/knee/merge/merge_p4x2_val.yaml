# Completion-group merge rows (SLOT_ALLOCATOR.md section 12.10): k far sender channels into one receiver, on
# the link chip 2 -> chip 3 (channels: worker from chip 2, turnN from chip 0, turnS from chip 4); k1f = one
# forwarding channel alone. 3072 B slots. Data-checked, packets <= the receiver ring slots (85 of 3072 B).
allocation_policies:
  receiver:
    policy: RoundRobin
    max_configs_per_core: 4
Tests:
- name: Merge_p4x2_k1
  sync: true
  fabric_setup:
    topology: Mesh
    max_packet_size: 3072
  parametrization_params:
    ntype:
    - unicast_write
    size: &id001
    - 3072
  defaults:
    ftype: unicast
    num_packets: 64
  senders:
  - device:
    - 0
    - 2
    patterns:
    - destination:
        device:
        - 0
        - 3

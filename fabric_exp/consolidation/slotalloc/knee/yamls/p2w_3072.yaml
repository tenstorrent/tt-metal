# Slot-need sweep (SLOT_ALLOCATOR.md section 12; mk_knee_yamls.py): Sls1HopEW, Sls1HopNS, Sls1HopEWBidir from
# fabric_exp/slotstudy/sls_2d_p150.yaml at [256, 1024, 2048, 3072] B packets, 3072 B slots.
allocation_policies:
  receiver:
    policy: RoundRobin
    max_configs_per_core: 4
Tests:
- name: Sls1HopEW
  benchmark_mode: true
  sync: true
  fabric_setup:
    topology: Mesh
    max_packet_size: 3072
  parametrization_params:
    ntype:
    - unicast_write
    size:
    - 256
    - 1024
    - 2048
    - 3072
  defaults:
    ftype: unicast
    num_packets: 50000
  senders:
  - device:
    - 0
    - 0
    patterns:
    - destination:
        device:
        - 0
        - 1
- name: Sls1HopNS
  benchmark_mode: true
  sync: true
  fabric_setup:
    topology: Mesh
    max_packet_size: 3072
  parametrization_params:
    ntype:
    - unicast_write
    size:
    - 256
    - 1024
    - 2048
    - 3072
  defaults:
    ftype: unicast
    num_packets: 50000
  senders:
  - device:
    - 0
    - 0
    patterns:
    - destination:
        device:
        - 0
        - 4
- name: Sls1HopEWBidir
  benchmark_mode: true
  sync: true
  fabric_setup:
    topology: Mesh
    max_packet_size: 3072
  parametrization_params:
    ntype:
    - unicast_write
    size:
    - 256
    - 1024
    - 2048
    - 3072
  defaults:
    ftype: unicast
    num_packets: 50000
  senders:
  - device:
    - 0
    - 0
    patterns:
    - destination:
        device:
        - 0
        - 1
  - device:
    - 0
    - 1
    patterns:
    - destination:
        device:
        - 0
        - 0

# Slot-need sweep (SLOT_ALLOCATOR.md section 12; mk_knee_yamls.py): VC1Inter_0_0_to_1_0, VC1Inter_0_0_to_1_1, VC1Inter_0_0_to_1_2, VC1Inter_0_0_to_1_3, VC1MixWorker, VC1MixForward, VC1SoloWorker, VC1SoloForward, VC1Mesh2Hop, VC1MeshMulticast from
# fabric_exp/vc1/sls_vc1_all.yaml at [256, 1024, 2048, 3072] B packets, 3072 B slots.
allocation_policies:
  receiver:
    policy: RoundRobin
    max_configs_per_core: 4
Tests:
- name: VC1Inter_0_0_to_1_0
  benchmark_mode: true
  sync: true
  fabric_setup:
    topology: Mesh
    max_packet_size: 3072
  parametrization_params:
    ntype:
    - unicast_write
    size:
    - 256
    - 1024
    - 2048
    - 3072
  defaults:
    ftype: unicast
    num_packets: 50000
  senders:
  - device:
    - 0
    - 0
    patterns:
    - destination:
        device:
        - 1
        - 0

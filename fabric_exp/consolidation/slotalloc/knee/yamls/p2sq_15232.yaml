# Slot-need sweep (SLOT_ALLOCATOR.md section 12; mk_knee_yamls.py): Sls1HopEW, Sls1HopEWBidir, Sls3HopEW, SlsMulticast from
# fabric_exp/slotstudy/sls_2d_p150.yaml at [256, 4352, 15232] B packets, 15232 B slots.
allocation_policies:
  receiver:
    policy: RoundRobin
    max_configs_per_core: 4
Tests:
- name: Sls1HopEW
  benchmark_mode: true
  sync: true
  fabric_setup:
    topology: Mesh
    max_packet_size: 15232
  parametrization_params:
    ntype:
    - unicast_write
    size:
    - 256
    - 4352
    - 15232
  defaults:
    ftype: unicast
    num_packets: 50000
  senders:
  - device:
    - 0
    - 0
    patterns:
    - destination:
        device:
        - 0
        - 1
- name: Sls1HopEWBidir
  benchmark_mode: true
  sync: true
  fabric_setup:
    topology: Mesh
    max_packet_size: 15232
  parametrization_params:
    ntype:
    - unicast_write
    size:
    - 256
    - 4352
    - 15232
  defaults:
    ftype: unicast
    num_packets: 50000
  senders:
  - device:
    - 0
    - 0
    patterns:
    - destination:
        device:
        - 0
        - 1
  - device:
    - 0
    - 1
    patterns:
    - destination:
        device:
        - 0
        - 0
- name: Sls3HopEW
  benchmark_mode: true
  sync: true
  fabric_setup:
    topology: Mesh
    max_packet_size: 15232
  parametrization_params:
    ntype:
    - unicast_write
    size:
    - 256
    - 4352
    - 15232
  defaults:
    ftype: unicast
    num_packets: 50000
  senders:
  - device:
    - 0
    - 0
    patterns:
    - destination:
        device:
        - 0
        - 3
- name: SlsMulticast
  benchmark_mode: true
  sync: true
  fabric_setup:
    topology: Mesh
    max_packet_size: 15232
  parametrization_params:
    ntype:
    - unicast_write
    size:
    - 256
    - 4352
    - 15232
  defaults:
    ftype: mcast
    num_packets: 20000
  patterns:
  - type: all_to_all
    iterations: 1

# Slot-need sweep (SLOT_ALLOCATOR.md section 12; mk_knee_yamls.py): SlsLin1HopEW, SlsLin3HopEW, SlsLinRowMerge from
# fabric_exp/slotstudy/sls_1d_p150.yaml at [256, 4352, 15232] B packets, 15232 B slots.
allocation_policies:
  receiver:
    policy: RoundRobin
    max_configs_per_core: 4
Tests:
- name: SlsLin1HopEW
  benchmark_mode: true
  sync: true
  fabric_setup:
    topology: Linear
    max_packet_size: 15232
  parametrization_params:
    ntype:
    - unicast_write
    size:
    - 256
    - 4352
    - 15232
  defaults:
    ftype: unicast
    num_packets: 50000
  senders:
  - device:
    - 0
    - 0
    patterns:
    - destination:
        device:
        - 0
        - 1
- name: SlsLin3HopEW
  benchmark_mode: true
  sync: true
  fabric_setup:
    topology: Linear
    max_packet_size: 15232
  parametrization_params:
    ntype:
    - unicast_write
    size:
    - 256
    - 4352
    - 15232
  defaults:
    ftype: unicast
    num_packets: 50000
  senders:
  - device:
    - 0
    - 0
    patterns:
    - destination:
        device:
        - 0
        - 3
- name: SlsLinRowMerge
  benchmark_mode: true
  sync: true
  fabric_setup:
    topology: Linear
    max_packet_size: 15232
  parametrization_params:
    ntype:
    - unicast_write
    size:
    - 256
    - 4352
    - 15232
  defaults:
    ftype: unicast
    num_packets: 50000
  senders:
  - device:
    - 0
    - 0
    patterns:
    - destination:
        device:
        - 0
        - 3
  - device:
    - 0
    - 1
    patterns:
    - destination:
        device:
        - 0
        - 3
  - device:
    - 0
    - 2
    patterns:
    - destination:
        device:
        - 0
        - 3

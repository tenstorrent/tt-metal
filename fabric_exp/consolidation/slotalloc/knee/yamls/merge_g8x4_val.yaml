# Completion-group merge rows (SLOT_ALLOCATOR.md section 12.10): k far sender channels into one receiver, on
# the link chip 13 -> chip 14 (channels: worker from chip 13, straight from chip 12, turnN from chip 9, turnS from chip 17); k1f = one
# forwarding channel alone. 3072 B slots. Data-checked, packets <= the receiver ring slots (85 of 3072 B).
allocation_policies:
  receiver:
    policy: RoundRobin
    max_configs_per_core: 4
Tests:
- name: Merge_g8x4_k1
  sync: true
  fabric_setup:
    topology: Mesh
    max_packet_size: 3072
  parametrization_params:
    ntype:
    - unicast_write
    size: &id001
    - 3072
  defaults:
    ftype: unicast
    num_packets: 64
  senders:
  - device:
    - 0
    - 13
    patterns:
    - destination:
        device:
        - 0
        - 14

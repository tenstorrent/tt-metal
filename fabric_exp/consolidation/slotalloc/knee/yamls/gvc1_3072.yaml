# Slot-need sweep (SLOT_ALLOCATOR.md section 12; mk_knee_yamls.py): GlxInter_0_0_to_1_0, GlxInter_0_0_to_1_1, GlxInter_0_0_to_1_2, GlxInter_0_0_to_1_3, GlxInter_0_1_to_1_0, GlxInter_0_1_to_1_1, GlxInter_0_1_to_1_2, GlxInter_0_1_to_1_3, GlxMixWorker, GlxMixForward, GlxSoloWorker, GlxSoloForward, VC1Mesh2Hop, VC1MeshMulticast from
# fabric_exp/slotstudy/sls_glx_vc1.yaml at [256, 1024, 2048, 3072] B packets, 3072 B slots.
allocation_policies:
  receiver:
    policy: RoundRobin
    max_configs_per_core: 4
Tests:
- name: GlxInter_0_0_to_1_0
  benchmark_mode: true
  sync: true
  fabric_setup:
    topology: Mesh
    max_packet_size: 3072
  parametrization_params:
    ntype:
    - unicast_write
    size:
    - 256
    - 1024
    - 2048
    - 3072
  defaults:
    ftype: unicast
  senders:
  - device:
    - 0
    - 0
    patterns:
    - destination:
        device:
        - 1
        - 0
      num_packets: 50000

# Send-batch study (V4_SEND_BATCH.md): pcs3/ew16.yaml with 20000000 packets, for the delay-perturbation sweep (short runs).
allocation_policies:
  receiver:
    policy: RoundRobin
    max_configs_per_core: 4
Tests:
- name: SbPsEW16
  benchmark_mode: true
  sync: true
  fabric_setup:
    topology: Mesh
  parametrization_params:
    ntype:
    - unicast_write
    size:
    - 16
  defaults:
    ftype: unicast
    num_packets: 20000000
  senders:
  - device:
    - 0
    - 0
    patterns:
    - destination:
        device:
        - 0
        - 1

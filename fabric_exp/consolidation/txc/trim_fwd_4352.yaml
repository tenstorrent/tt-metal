# Sender consolidation C1b (V4_SENDER_CONSOLIDATION.md): the two tests of exp_2d_trim_4352.yaml whose replays have
# forwarding-only routers (VC0's worker channel trimmed, its forwarding channels serviced), copied verbatim.
# Channel-trimmed variant of exp_2d_4352.yaml (4352 B, the default 2D slot payload): each test runs a capture pass, then a replay with unused router
# channels compiled out.
# 2D (Mesh, VC0) throughput experiments on the 2x4 P150x8 mesh, 1 link.
# Chip ids are row-major: [0, 0..3] is the top row, [0, 4..7] the bottom row.
allocation_policies:
    receiver:
      policy: RoundRobin
      max_configs_per_core: 4

Tests:
  - name: "Mesh3HopEW"
    benchmark_mode: true
    sync: true
    fabric_setup:
      topology: Mesh
      enable_channel_trimming: true
    parametrization_params:
      ntype: [unicast_write, unicast_scatter_write]
      size: [4352]
    defaults:
      ftype: unicast
      num_packets: 50000
    senders:
      - device: [0, 0]
        patterns:
          - destination:
              device: [0, 3]

  # All-to-all multicast (the golden's MeshMulticast)
  - name: "MeshMulticast"
    benchmark_mode: true
    sync: true
    fabric_setup:
      topology: Mesh
      enable_channel_trimming: true
    parametrization_params:
      num_links: [1]
      ntype: [unicast_write, unicast_scatter_write]
      size: [4352]
    defaults:
      ftype: mcast
      num_packets: 20000
    patterns:
      - type: all_to_all
        iterations: 1

# P3 mixes with channel trimming (each test runs a capture pass, then the replay used for results). Benchmark mode, 1 link, 2x4 P150x8 mesh; chip ids row-major.
# Every mix runs next to single-segment runs of each segment it uses, for the mix penalty
# (measured cycles/packet / sum of share x pure cycles/packet). Generated by the snippet in P3 notes.
allocation_policies:
    receiver:
      policy: RoundRobin
      max_configs_per_core: 4

Tests:
  - name: "EW_MixCmd"
    benchmark_mode: true
    sync: true
    fabric_setup:
      topology: Mesh
      enable_channel_trimming: true
    defaults:
      ftype: unicast
      repeat: 12000
      stream:
        - {ntype: unicast_write, size: 4352}
        - {ntype: unicast_scatter_write, size: 4352}
        - {ntype: fused_atomic_inc, size: 4352}
        - {ntype: atomic_inc, size: 4352}
    senders:
      - device: [0, 0]
        patterns:
          - destination: {device: [0, 1]}

  - name: "EW_MixSize2"
    benchmark_mode: true
    sync: true
    fabric_setup:
      topology: Mesh
      enable_channel_trimming: true
    defaults:
      ftype: unicast

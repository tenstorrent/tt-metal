# P3 mixes (plan: First mixes). Benchmark mode, 1 link, 2x4 P150x8 mesh; chip ids row-major.
# Every mix runs next to single-segment runs of each segment it uses, for the mix penalty
# (measured cycles/packet / sum of share x pure cycles/packet). Generated by the snippet in P3 notes.
allocation_policies:
    receiver:
      policy: RoundRobin
      max_configs_per_core: 4

Tests:
  - name: "EW_PureWrite4352"
    benchmark_mode: true
    sync: true
    fabric_setup:
      topology: Mesh
    defaults:
      ftype: unicast
      repeat: 48000
      stream:
        - {ntype: unicast_write, size: 4352}
    senders:
      - device: [0, 0]
        patterns:
          - destination: {device: [0, 1]}

  - name: "EW_PureFused4352"
    benchmark_mode: true
    sync: true
    fabric_setup:
      topology: Mesh
    defaults:
      ftype: unicast
      repeat: 48000
      stream:
        - {ntype: fused_atomic_inc, size: 4352}
    senders:
      - device: [0, 0]
        patterns:
          - destination: {device: [0, 1]}

  - name: "NS_PureFused4352"
    benchmark_mode: true
    sync: true
    fabric_setup:
      topology: Mesh
    defaults:
      ftype: unicast
      repeat: 48000
      stream:
        - {ntype: fused_atomic_inc, size: 4352}
    senders:
      - device: [0, 0]
        patterns:
          - destination: {device: [0, 4]}

  - name: "FWD_PureWrite4352"
    benchmark_mode: true
    sync: true
    fabric_setup:
      topology: Mesh
    defaults:
      ftype: unicast
      repeat: 48000
      stream:
        - {ntype: unicast_write, size: 4352}
    senders:
      - device: [0, 0]
        patterns:
          - destination: {device: [0, 2]}
      - device: [0, 1]
        patterns:
          - destination: {device: [0, 2]}

  - name: "FWD_PureFused4352"
    benchmark_mode: true
    sync: true
    fabric_setup:
      topology: Mesh
    defaults:
      ftype: unicast
      repeat: 48000
      stream:
        - {ntype: fused_atomic_inc, size: 4352}
    senders:
      - device: [0, 0]
        patterns:
          - destination: {device: [0, 2]}
      - device: [0, 1]
        patterns:
          - destination: {device: [0, 2]}

    sync: true
    fabric_setup:
      topology: Mesh
    defaults:
      ftype: unicast
      repeat: 48000
      stream:
        - {ntype: unicast_scatter_write, size: 4352}
    senders:
      - device: [0, 0]
        patterns:
          - destination: {device: [0, 1]}

  - name: "NS_PureScatter4352"
    benchmark_mode: true
    sync: true

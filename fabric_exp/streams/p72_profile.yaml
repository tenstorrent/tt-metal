      stream:
        - {ntype: unicast_write, size: 4352}
    senders:
      - device: [0, 0]
        patterns:
          - destination: {device: [0, 2]}
      - device: [0, 1]
        patterns:
          - destination: {device: [0, 2]}

  - name: "FWD_PureWrite16"

# §72 profiling subset of p3_mixes.yaml: 1-hop E/W and N/S 4352 B write and scatter, E/W unflushed fused, atomic and
# 16 B write, forwarded 4352 B and 16 B writes. Benchmark mode, 1 link, 2x4 P150x8 mesh; chip ids row-major.
allocation_policies:
    receiver:
      policy: RoundRobin
      max_configs_per_core: 4

Tests:
  - name: "EW_PureWrite4352"
    benchmark_mode: true
    sync: true
    fabric_setup:
      topology: Mesh
    defaults:
      ftype: unicast
      repeat: 48000
      stream:
        - {ntype: unicast_write, size: 4352}
    senders:
      - device: [0, 0]
        patterns:
          - destination: {device: [0, 1]}

  - name: "NS_PureWrite4352"
    benchmark_mode: true
    sync: true
    fabric_setup:
      topology: Mesh
    defaults:
      ftype: unicast
      repeat: 48000
      stream:
        - {ntype: unicast_write, size: 4352}
    senders:
      - device: [0, 0]
        patterns:
          - destination: {device: [0, 4]}

  - name: "EW_PureScatter4352"

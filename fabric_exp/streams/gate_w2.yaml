# W2 only, from the worker-cost gate (plan W1-W3): 1-hop east, 4352 B writes, benchmark mode.
# W0 is today's single-pattern fast path, the reference every W run is compared with.
allocation_policies:
    receiver:
      policy: RoundRobin
      max_configs_per_core: 4

Tests:
  - name: "W2TwoSegments"
    benchmark_mode: true
    sync: true
    fabric_setup:
      topology: Mesh
    senders:
      - device: [0, 0]
        patterns:
          - destination: {device: [0, 1]}
            ftype: unicast
            ntype: unicast_write
            size: 4352
            repeat: 30000
            stream: [unicast_write, unicast_write]

  # Lap of 6: with 32 worker slots (W32) 4 of every 6 packets copy a header. The run log reports
  # the actual copy count, which depends on the router build's worker slot count.

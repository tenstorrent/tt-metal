# One long row for PC sampling: BurstNS_N32_G500 of exp_burst.yaml (bursts of 32, 500 idle cycles), ~20M packets.
allocation_policies:
  receiver:
    policy: RoundRobin
    max_configs_per_core: 4
Tests:
- name: BurstNSN32G500Pcs
  benchmark_mode: true
  sync: true
  fabric_setup:
    topology: Mesh
  parametrization_params:
    size:
    - 4352
  defaults:
    ftype: unicast
  senders:
  - device: [0, 0]
    patterns:
    - destination:
        device: [0, 4]
      repeat: 625000
      stream:
      - {ntype: unicast_write, count: 32}
      - {idle: 500}

# Multi-downstream P150 rows for the v4txa11w A/B (2026-11-03): Sls3HopEW, SlsRowMerge, SlsTurn4, SlsMulticast from
# fabric_exp/slotstudy/sls_2d_p150.yaml verbatim (write, 1024 and 4352 B, default slots).
allocation_policies:
    receiver:
      policy: RoundRobin
      max_configs_per_core: 4
Tests:
  - name: "Sls3HopEW"
    benchmark_mode: true
    sync: true
    fabric_setup:
      topology: Mesh
    parametrization_params:
      ntype: [unicast_write]
      size: [1024, 4352]
    defaults:
      ftype: unicast
      num_packets: 50000
    senders:
      - device: [0, 0]
        patterns:
          - destination:
              device: [0, 3]

  - name: "SlsRowMerge"
    benchmark_mode: true
    sync: true
    fabric_setup:
      topology: Mesh
    parametrization_params:
      ntype: [unicast_write]
      size: [1024, 4352]
    defaults:
      ftype: unicast
      num_packets: 50000
    senders:
      - device: [0, 0]
        patterns:
          - destination:
              device: [0, 3]
      - device: [0, 1]
        patterns:
          - destination:
              device: [0, 3]
      - device: [0, 2]
        patterns:
          - destination:
              device: [0, 3]

  - name: "SlsTurn4"
    benchmark_mode: true
    sync: true
    fabric_setup:
      topology: Mesh
    parametrization_params:
      ntype: [unicast_write]
      size: [1024, 4352]
    defaults:
      ftype: unicast
      num_packets: 50000
    senders:
      - device: [0, 0]
        patterns:
          - destination:
              device: [0, 7]

  - name: "SlsMulticast"
    benchmark_mode: true
    sync: true
    fabric_setup:
      topology: Mesh
    parametrization_params:
      ntype: [unicast_write]
      size: [1024, 4352]
    defaults:
      ftype: mcast
      num_packets: 20000
    patterns:
      - type: all_to_all
        iterations: 1

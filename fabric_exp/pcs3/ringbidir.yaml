# One long row for PC sampling (ringbidir): Ring1HopEWBidir from exp_ring_se, 4352 B write.
allocation_policies:
  receiver:
    policy: RoundRobin
    max_configs_per_core: 4
Tests:
- name: ringbidir
  benchmark_mode: true
  sync: true
  fabric_setup:
    topology: Ring
  parametrization_params:
    ntype:
    - unicast_write
    size:
    - 4352
  defaults:
    ftype: unicast
    num_packets: 30000000
  senders:
  - device:
    - 0
    - 0
    patterns:
    - destination:
        device:
        - 0
        - 1
  - device:
    - 0
    - 1
    patterns:
    - destination:
        device:
        - 0
        - 0

# VC2 traffic row (2026-11-01): VC2 alone, one sender on chip 0 to its E/W neighbour (chip 1), 4352 B, benchmark mode.
# Needs TT_METAL_ENABLE_FABRIC_VC2=1. VC2's worker window is the study row's VC2 depth (2 slots by default; deeper with
# TT_FABRIC_EXP_SLOTS_VC2). Companion rows: ew4352.yaml (VC0 alone), vc02ew4352.yaml (VC0 + VC2 on the same link).
allocation_policies:
  receiver:
    policy: RoundRobin
    max_configs_per_core: 4
Tests:
- name: PcsVC2EW4352
  benchmark_mode: true
  sync: true
  fabric_setup:
    topology: Mesh
    use_vc2: true
  parametrization_params:
    ntype:
    - unicast_write
    size:
    - 4352
  defaults:
    ftype: unicast
    num_packets: 4000000
  senders:
  - device:
    - 0
    - 0
    vc_id: 2
    patterns:
    - destination:
        device:
        - 0
        - 1

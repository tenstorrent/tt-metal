# One long row for PC sampling (muxfullring): MuxFullRingMulticast (mux mode) from exp_mux, 4352 B write.
allocation_policies:
  receiver:
    policy: RoundRobin
    max_configs_per_core: 4
Tests:
- name: muxfullring
  benchmark_mode: true
  sync: true
  fabric_setup:
    topology: Ring
    fabric_tensix_config: Mux
  parametrization_params:
    ntype:
    - unicast_write
    size:
    - 4352
  defaults:
    ftype: mcast
    num_packets: 20000000
  patterns:
  - type: full_ring

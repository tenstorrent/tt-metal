Tests:
- name: AllToAllRing_long
  enable_flow_control: true
  fabric_setup:
    topology: Ring
    num_links: max
  top_level_iterations: 10
  parametrization_params:
    ftype:
    - mcast
    ntype:
    - unicast_write
    - atomic_inc
    - fused_atomic_inc
    - unicast_scatter_write
    size:
    - 2048
    - 4096
  defaults:
    num_packets: 20000
  patterns:
  - type: all_to_all

# v4 tori on the P150x8 (wraparound on Y only): the torus_config Y tests of
# test_fabric_2d_torus_deadlock_stability.yaml and test_fabric_2d_torus_nightly.yaml (data-checked).
allocation_policies:
  receiver:
    max_configs_per_core: 2
Tests:
- name: TorusYMcastNorth
  sync: true
  fabric_setup:
    topology: Torus
    torus_config: Y
    num_links: max
  defaults:
    ftype: mcast
    ntype: unicast_write
    size: 256
    num_packets: 2000
    destination:
      hops:
        N: max
  patterns:
  - type: all_devices_uniform_pattern
    iterations: 3
- name: TorusYMcastSouth
  sync: true
  fabric_setup:
    topology: Torus
    torus_config: Y

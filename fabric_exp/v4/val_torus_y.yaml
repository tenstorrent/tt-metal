    iterations: 3
- name: UnicastAlltoAll
  fabric_setup:
    topology: Torus
    torus_config: Y
    num_links: max
  parametrization_params:
    size:
    - 256
    - 512
    - 1024
    num_packets:
    - 2000
    ntype:
    - unicast_write
    - atomic_inc
    - fused_atomic_inc
    - unicast_scatter_write
  defaults:
    ftype: unicast
  patterns:
  - type: all_to_all

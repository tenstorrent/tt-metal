# The Tensix mux mode cases of test_fabric_sanity_at_least_2x2_mesh.yaml (fabric_tensix_config: Mux; V4_TENSIX_MUX.md):
# linear, full-ring and mesh multicast over three send types, and the ring deadlock check (benchmark row).
Tests:
  - name: "FabricMuxLinearMulticast"
    fabric_setup:
      topology: Linear
      fabric_tensix_config: Mux

    parametrization_params:
      num_links: [1, 2, 3, 4]
      ntype: [unicast_write, fused_atomic_inc, unicast_scatter_write]

    defaults:
      ftype: mcast
      size: 1024
      num_packets: 100

    patterns:
      - type: all_to_all

  - name: "FabricMuxFullRingMulticast"
    fabric_setup:
      topology: Ring
      fabric_tensix_config: Mux

    parametrization_params:
      num_links: [1, 2, 3, 4]
      ntype: [unicast_write, fused_atomic_inc, unicast_scatter_write]

    defaults:
      ftype: mcast
      size: 1024
      num_packets: 100

    patterns:
      - type: full_ring

  - name: "FabricMuxFullRingMulticastDeadlockCheckQuick"
    benchmark_mode: true
    sync: true
    fabric_setup:
      topology: Ring
      fabric_tensix_config: Mux

    parametrization_params:
      num_links: [1]
      ntype: [unicast_write]

    defaults:
      ftype: mcast
      size: 1024
      num_packets: 1000000

    patterns:
      - type: full_ring

  - name: "FabricMuxMeshMulticast"
    fabric_setup:
      topology: Mesh
      fabric_tensix_config: Mux

    parametrization_params:
      num_links: [1, 2, 3, 4]
      ntype: [unicast_write, fused_atomic_inc, unicast_scatter_write]

    defaults:
      ftype: mcast
      size: 1024
      num_packets: 100

    patterns:
      - type: all_to_all


# Tensix mux mode throughput (fabric_tensix_config: Mux; V4_TENSIX_MUX.md), 1 link, unicast_write, 1024 and 4352 B:
# exp_1d_4352.yaml's, v4/exp_ring.yaml's and exp_2d_4352.yaml's 1-hop, bidirectional, 3-hop and multicast rows, and the
# full-ring multicast of the sanity yaml's deadlock check (val_mux.yaml).
allocation_policies:
  receiver:
    policy: RoundRobin
    max_configs_per_core: 4
Tests:
- name: MuxLinear1HopEW
  benchmark_mode: true
  sync: true
  fabric_setup:
    topology: Linear
    fabric_tensix_config: Mux
  parametrization_params:
    ntype:
    - unicast_write
    size:
    - 1024
    - 4352
  defaults:
    ftype: unicast
    num_packets: 50000
  senders:
  - device:
    - 0
    - 0
    patterns:
    - destination:
        device:
        - 0
        - 1
- name: MuxLinear1HopEWBidir
  benchmark_mode: true
  sync: true
  fabric_setup:
    topology: Linear
    fabric_tensix_config: Mux
  parametrization_params:

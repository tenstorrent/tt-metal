# v4 rings: the Ring tests of test_fabric_sanity_at_least_2x2_mesh.yaml (no mux) and of
# test_fabric_2d_torus_deadlock_stability.yaml (data-checked).
Tests:
- name: FullRingMulticast
  fabric_setup:
    topology: Ring
  parametrization_params:
    num_links:
    - 1
    - 2
    - 3
    - 4
    ntype:
    - unicast_write
    - fused_atomic_inc
    - unicast_scatter_write
  defaults:
    ftype: mcast
    size: 1024
    num_packets: 100
  patterns:
  - type: full_ring
- name: FullRingUnicast
  fabric_setup:
    topology: Ring
  parametrization_params:
    num_links:
    - 1
    - 2
    - 3
    - 4
    ntype:
    - unicast_write
    - fused_atomic_inc
    - unicast_scatter_write
  defaults:
    ftype: unicast
    size: 1024
    num_packets: 100
  patterns:
  - type: full_ring
- name: FullRingUnicastDeadlockQuick
  benchmark_mode: true
  sync: true
  fabric_setup:
    topology: Ring
  parametrization_params:
    num_links:
    - 1
    ntype:
    - unicast_write
  defaults:
    ftype: unicast
    size: 1024
    num_packets: 1000000
  patterns:
  - type: full_ring
- name: HalfRingMulticast
  fabric_setup:
    topology: Ring
    num_links: 1
  parametrization_params:
    num_links:
    - 1
    - 2
    - 3
    - 4
    ntype:
    - unicast_write
    - fused_atomic_inc
    - unicast_scatter_write
  defaults:
    ftype: mcast
    size: 1024
    num_packets: 100
  patterns:
  - type: half_ring
- name: LinearMcastEast
  sync: true
  fabric_setup:
    topology: Ring
    num_links: max
  defaults:
    ftype: mcast
    ntype: unicast_write
    size: 256
    num_packets: 2000
    destination:
      hops:
        E: max
  patterns:
  - type: all_devices_uniform_pattern
    iterations: 3
- name: LinearMcastWest
  sync: true
  fabric_setup:
    topology: Ring
    num_links: max
  defaults:
    ftype: mcast
    ntype: unicast_write
    size: 256
    num_packets: 2000
    destination:
      hops:
        W: max
  patterns:
  - type: all_devices_uniform_pattern
    iterations: 3
- name: LinearMcastNorth
  sync: true
  fabric_setup:
    topology: Ring
    num_links: max
  defaults:
    ftype: mcast
    ntype: unicast_write
    size: 256
    num_packets: 2000
    destination:
      hops:
        N: max
  patterns:
  - type: all_devices_uniform_pattern
    iterations: 3
- name: LinearMcastSouth
  sync: true
  fabric_setup:
    topology: Ring
    num_links: max
  defaults:
    ftype: mcast
    ntype: unicast_write
    size: 256
    num_packets: 2000
    destination:
      hops:
        S: max
  patterns:
  - type: all_devices_uniform_pattern
    iterations: 3

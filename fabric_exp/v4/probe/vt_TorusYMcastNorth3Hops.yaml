allocation_policies:
  receiver:
    max_configs_per_core: 2
Tests:
- name: TorusYMcastNorth3Hops
  sync: true
  fabric_setup:
    topology: Torus
    torus_config: Y
  parametrization_params:
    ntype:
    - unicast_write
    - atomic_inc
    - fused_atomic_inc
    - unicast_scatter_write
    ftype:
    - unicast
    - mcast
  defaults:
    size: 512
    num_packets: 2000
    destination:
      hops:
        N: 3
  patterns:
  - type: all_devices_uniform_pattern
    iterations: 3

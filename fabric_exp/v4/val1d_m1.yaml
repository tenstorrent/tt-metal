# v4 bring-up validation (1D/2D, data-checked)
# Filtered from tests/tt_metal/tt_fabric/test_infra/test_yamls/test_fabric_sanity_at_least_2x2_mesh.yaml for the v4 router's first bring-up family (no rings, mux, telemetry or trimming).
Tests:
- name: LinearMulticast
  fabric_setup:
    topology: Linear
  parametrization_params:
    num_links:
    - 1
    - 2
    - 3
    - 4
    ntype:
    - unicast_write
    - fused_atomic_inc
    - unicast_scatter_write
  defaults:
    ftype: mcast
    size: 1024
    num_packets: 100
  patterns:
  - type: all_to_all
- name: LinearMulticastMicroLooped
  fabric_setup:
    topology: Linear
  parametrization_params:
    num_links:
    - 1
    ntype:
    - unicast_write
  defaults:
    ftype: mcast
    size: 64
    num_packets: 1
  patterns:
  - type: all_to_all
    iterations: 20
- name: UnidirLinearMulticast
  fabric_setup:
    topology: Linear
  parametrization_params:
    num_links:
    - 1
    - 2
    - 3
    - 4
    ntype:
    - unicast_write
    - fused_atomic_inc
    - unicast_scatter_write
  defaults:
    ftype: mcast
    size: 1024
    num_packets: 100
  patterns:
  - type: unidirectional_linear
- name: SingleSenderLinearUnicastAllDevices
  fabric_setup:
    topology: Linear
  parametrization_params:
    num_links:
    - 1
    - 2
    - 3
    - 4
    ntype:
    - unicast_write
    - fused_atomic_inc
    - unicast_scatter_write
  defaults:
    ftype: unicast
    ssize: 1024
    num_packets: 100
  patterns:
  - type: one_to_all
- name: MeshMulticast
  fabric_setup:
    topology: Mesh
  parametrization_params:
    num_links:
    - 1
    - 2
    - 3
    - 4
    ntype:
    - unicast_write
    - fused_atomic_inc
    - unicast_scatter_write
  defaults:
    ftype: mcast
    size: 1024
    num_packets: 100
  patterns:
  - type: all_to_all
- name: PacketSizesMeshMulticast
  fabric_setup:
    topology: Mesh
    num_links: 1
  parametrization_params:
    size:
    - 1024
    - 2048
    - 4096
  defaults:
    ftype: mcast
    ntype: unicast_write
    num_packets: 100
  patterns:
  - type: all_to_all
- name: SingleSenderMeshUnicastAllDevices
  fabric_setup:
    topology: Mesh
  parametrization_params:
    num_links:
    - 1
    - 2
    - 3
    - 4
    ntype:
    - unicast_write
    - fused_atomic_inc
    - unicast_scatter_write
  defaults:
    ftype: unicast
    size: 1024
    num_packets: 100
  patterns:
  - type: one_to_all
- name: PacketSizesMeshAllToOneRandomUnicast
  fabric_setup:
    topology: Mesh
  parametrization_params:
    size:
    - 1024
    - 2048
    - 4096
  defaults:
    ftype: unicast
    ntype: unicast_write
    num_packets: 100
  patterns:
  - type: all_to_one_random
    iterations: 10
- name: PacketSizesMeshAllToOneUnicast
  fabric_setup:
    topology: Mesh
  parametrization_params:
    size:
    - 1024
    - 2048
    - 4096
  defaults:
    ftype: unicast
    ntype: unicast_write
    num_packets: 100
  patterns:
  - type: all_to_one
- name: FlowControlAllToAllUnicastMesh
  sync: true
  enable_flow_control: true
  fabric_setup:
    topology: Mesh
  parametrization_params:
    ftype:
    - unicast
    - mcast
    ntype:
    - unicast_write
    - fused_atomic_inc
    - unicast_scatter_write
    num_links:
    - 1
    - 2
    - 3
    - 4
    size:
    - 1024
    - 2048
    - 4096
  defaults:
    num_packets: 10000
  patterns:
  - type: all_to_all

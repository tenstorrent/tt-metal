    size: [1024, 4096]
    ntype: [unicast_write, fused_atomic_inc]
  defaults: {ftype: unicast, num_packets: 5000}
  senders:
  - device:
    - 0
    - [0, 3]
    vc_id: 2
    patterns:
    - ftype: unicast
      destination:
        device:
        - 0
        - [0, 0]
  - device:
    - 0
    - [1, 0]
    vc_id: 2
    patterns:

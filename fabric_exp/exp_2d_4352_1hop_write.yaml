# 2D (Mesh, VC0) 1-hop write-only subset (§54 segment timing) on the 2x4 P150x8 mesh, 1 link, 4352 B (the default 2D slot payload: 4448 B slot - 96 B header).
# Chip ids are row-major: [0, 0..3] is the top row, [0, 4..7] the bottom row.
allocation_policies:
    receiver:
      policy: RoundRobin
      max_configs_per_core: 4

Tests:
  # One flow, one hop east-west: TX of chip 0 -> RX of chip 1 (local delivery only)
  - name: "Mesh1HopEW"
    benchmark_mode: true
    sync: true
    fabric_setup:
      topology: Mesh
    parametrization_params:
      ntype: [unicast_write]
      size: [4352]
    defaults:
      ftype: unicast
      num_packets: 50000
    senders:
      - device: [0, 0]
        patterns:
          - destination:
              device: [0, 1]

  # One flow, one hop north-south
  - name: "Mesh1HopNS"
    benchmark_mode: true
    sync: true
    fabric_setup:
      topology: Mesh
    parametrization_params:
      ntype: [unicast_write]
      size: [4352]
    defaults:
      ftype: unicast
      num_packets: 50000
    senders:
      - device: [0, 0]
        patterns:
          - destination:
              device: [0, 4]

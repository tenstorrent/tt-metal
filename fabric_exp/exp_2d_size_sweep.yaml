# 2D (Mesh, VC0) single-flow plain writes, 1 hop E/W and N/S, channel trimming on, packet-size sweep across 4 KiB.
# Shows the step at payload + header > 4096 B (RESULTS section 15). Each test runs a capture pass, then a replay with
# unused router channels compiled out. 2x4 P150x8 mesh, 1 link.
# Chip ids are row-major: [0, 0..3] is the top row, [0, 4..7] the bottom row.
allocation_policies:
    receiver:
      policy: RoundRobin
      max_configs_per_core: 4

Tests:
  # One flow, one hop east-west: TX of chip 0 -> RX of chip 1 (local delivery only)
  - name: "Mesh1HopEW"
    benchmark_mode: true
    sync: true
    fabric_setup:
      topology: Mesh
      enable_channel_trimming: true
    parametrization_params:
      ntype: [unicast_write]
      size: [2048, 2560, 3072, 3584, 3840, 3968, 4000, 4032, 4064, 4080, 4096]
    defaults:
      ftype: unicast
      num_packets: 50000
    senders:
      - device: [0, 0]
        patterns:
          - destination:
              device: [0, 1]

  # One flow, one hop north-south
  - name: "Mesh1HopNS"
    benchmark_mode: true
    sync: true
    fabric_setup:
      topology: Mesh
      enable_channel_trimming: true
    parametrization_params:
      ntype: [unicast_write]
      size: [2048, 2560, 3072, 3584, 3840, 3968, 4000, 4032, 4064, 4080, 4096]
    defaults:
      ftype: unicast
      num_packets: 50000
    senders:
      - device: [0, 0]
        patterns:
          - destination:
              device: [0, 4]

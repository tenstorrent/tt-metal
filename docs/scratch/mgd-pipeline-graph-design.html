void validate_pipeline_descriptors(const proto::MeshGraphDescriptor& proto, std::vector<std::string>& errors) {
    std::unordered_set<std::string> names;
    for (const auto& p : proto.pipeline_descriptors()) {
        if (p.name().empty() || !names.insert(p.name()).second) {
            errors.push_back(fmt::format("pipeline name '{}' is empty or repeated", p.name()));
        }
        std::unordered_set<std::string> ids;
        for (const auto& s : p.stages()) {
            if (s.id().empty() || !ids.insert(s.id()).second) {
                errors.push_back(fmt::format("pipeline '{}': stage id '{}' is empty or repeated", p.name(), s.id()));
            }
            const auto& d = s.shape().dims();
            if (d.size() != 2 || d[0] <= 0 || d[1] <= 0) {
                errors.push_back(fmt::format("pipeline '{}': stage '{}' shape must be rank 2, dims > 0", p.name(), s.id()));
            }
        }
        for (const auto& e : p.edges()) {
            if (!ids.contains(e.src()) || !ids.contains(e.dst())) {
                errors.push_back(fmt::format("pipeline '{}': edge {} -> {} names an unknown stage", p.name(), e.src(), e.dst()));
            }
            if (e.src() == e.dst()) {
                errors.push_back(fmt::format("pipeline '{}': self-edge on '{}'", p.name(), e.src()));
            }
        }
        // Linear (out-degree <= 1) or one fork of exactly two branches, matching blaze's
        // _find_branches; shared with the carve-planner port (P5).
        // TODO: allow more branches once blaze's fork runtime builds more than two.
        if (auto err = detail::check_pipeline_structure(p); err.has_value()) {
            errors.push_back(fmt::format("pipeline '{}': {}", p.name(), *err));
        }
    }
}`}],tests:["Golden textprotos: GPT-OSS ring, llama_8b_pod (40 stages), joint 4x4 stage, dflash fork with a RELAXED return, mixed4 with s3 -> s0 RELAXED, two pipelines in one MGD.","One negative textproto per rule (duplicate id, unknown stage, self-edge, rank-3 shape, two pipelines with one name). A dead-end branch parses; so does RELAXED on any edge.","Every existing MGD in tt_metal/fabric/mesh_graph_descriptors still parses unchanged."],behaviour:"No behaviour change without the new section."},{id:"P2",title:"merge keeps the pipeline",milestone:"M1 Format",size:"S",deps:["P1"],goal:"MeshGraphDescriptor::merge copies every part's pipeline_descriptors and rejects a name declared twice.",files:["tt_metal/fabric/mesh_graph_descriptor.cpp"],steps:["Single part: already copied whole, nothing to do.","Several parts: copy each part's pipelines in the per-part loop; TT_FATAL if a name is already taken, naming both parts.","No remap: stages bind by shape, not by mesh id or name."],code:[{path:"tt_metal/fabric/mesh_graph_descriptor.cpp  (MeshGraphDescriptor::merge)",mode:"diff",language:"cpp",src:`

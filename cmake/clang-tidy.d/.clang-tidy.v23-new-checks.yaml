# Checks newly enabled by clang-tidy 23 vs. this repo's effective v20 check
# set (diffed via --list-checks on both binaries). Used only by the PR-gate
# v23 shadow run to keep it a plain version bump with no new-check noise.
# Regenerate if clang-tidy-version or .clang-tidy's Checks list changes.
#
# Not included: `portability-no-assembler`, despite being new in v23 — it's
# where v20's `hicpp-no-assembler` landed after the hicpp module was removed
# (most other hicpp checks have a surviving alias already enabled here, e.g.
# hicpp-use-noexcept -> modernize-use-noexcept; this one doesn't). Disabling
# it would drop coverage v20 already has.
#
# Also disabled below: `performance-faster-string-find`, the *old* name for
# `performance-prefer-single-char-overloads`. It's not "new" in v23 so a
# plain diff misses it, but clang-tidy 23 treats the deprecated name itself
# as an error under --warnings-as-errors=*, regardless of findings — it must
# be off too or every TU fails.
#
# Also disabled below: same-name checks whose *detection logic* changed
# between v20 and v23 (invisible to a --list-checks name diff, confirmed via
# a/b testing both binaries against real repo code, not just by name):
#   bugprone-fold-init-type: v23 widened the std::accumulate matcher to the
#     4-arg overload with a transparent functor, without checking the
#     functor's template arg type — flags narrowing that v20 never saw.
#   bugprone-optional-value-conversion: v23 (LLVM 21) widened to also match
#     std::make_optional() arguments, not just direct construction.
#   cppcoreguidelines-missing-std-forward: v23 rewrote its forwarding
#     detection and now false-positives on C++20 lambdas with an explicit
#     template parameter list even when the pack genuinely is forwarded —
#     open upstream regression, llvm/llvm-project#228393.
#   modernize-redundant-void-arg: v23 (LLVM 23, upstream #173340) replaced the
#     per-construct matchers with one FunctionTypeLoc matcher, so void(void)
#     is now flagged inside template args too (e.g. std::function<void(void)>
#     params in CLI11), not just on function declarations.
#   modernize-type-traits: v23 (LLVM 21) widened to flag ::type access on a
#     dependent trait specialization inside decltype, not just direct uses.
#   modernize-use-default-member-init: v23 (LLVM 21, upstream #129425) widened
#     the ctor-initializer matcher from literals only to also match
#     references to constexpr/static constants.
#   readability-else-after-return: v23 widened the matcher to also catch
#     if/else directly under an unbraced switch case label.
Checks: >
  -bugprone-assignment-in-selection-statement,
  -bugprone-capturing-this-in-member-variable,
  -bugprone-command-processor,
  -bugprone-copy-constructor-mutates-argument,
  -bugprone-default-operator-new-on-overaligned-type,
  -bugprone-derived-method-shadowing-base-method,
  -bugprone-exception-copy-constructor-throws,
  -bugprone-float-loop-counter,
  -bugprone-fold-init-type,
  -bugprone-invalid-enum-default-initialization,
  -bugprone-misleading-setter-of-reference,
  -bugprone-missing-end-comparison,
  -bugprone-optional-value-conversion,
  -bugprone-random-generator-seed,
  -bugprone-raw-memory-call-on-non-trivial-type,
  -bugprone-signed-bitwise,
  -bugprone-std-exception-baseclass,
  -bugprone-std-namespace-modification,
  -bugprone-throwing-static-initialization,
  -bugprone-unchecked-string-to-number-conversion,
  -bugprone-unhandled-code-paths,
  -bugprone-unintended-char-ostream-output,
  -bugprone-unsafe-to-allow-exceptions,
  -cert-exp45-c,
  -cppcoreguidelines-explicit-constructor,
  -cppcoreguidelines-missing-std-forward,
  -cppcoreguidelines-pro-bounds-avoid-unchecked-container-access,
  -cppcoreguidelines-use-enum-class,
  -google-runtime-float,
  -misc-anonymous-namespace-in-header,
  -misc-explicit-constructor,
  -misc-multiple-inheritance,
  -misc-override-with-different-visibility,
  -misc-predictable-rand,
  -misc-static-initialization-cycle,
  -modernize-avoid-c-style-cast,
  -modernize-avoid-setjmp-longjmp,
  -modernize-avoid-variadic-functions,
  -modernize-redundant-void-arg,
  -modernize-type-traits,
  -modernize-use-default-member-init,
  -modernize-use-scoped-lock,
  -modernize-use-std-bit,
  -modernize-use-string-view,
  -modernize-use-structured-binding,
  -performance-faster-string-find,
  -performance-prefer-single-char-overloads,
  -performance-string-view-conversions,
  -performance-use-std-move,
  -portability-avoid-pragma-once,
  -readability-ambiguous-smartptr-reset-call,
  -readability-else-after-return,
  -readability-inconsistent-ifelse-braces,
  -readability-redundant-lambda-parameter-list,
  -readability-redundant-nested-if,
  -readability-redundant-parentheses,
  -readability-redundant-qualified-alias,
  -readability-redundant-typename,
  -readability-trailing-comma,
  -readability-trivial-switch,
  -readability-use-concise-preprocessor-directives

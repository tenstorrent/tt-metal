# This file defines the mapping from SKUs to GitHub Actions runner labels (runs_on).
# This is the single source of truth for how SKUs map to runner configurations.

# Each SKU entry contains:
#   runs_on: Array of GitHub Actions runner labels that tests for this SKU.
#     Exabox multihost SKUs use dedicated labels (exabox-multihost-ci-sc1 / -sc1-hp /
#     -sc4 / -sc16). Workers are provisioned by the multihost-ci runner hook from the
#     job's container.image — there is no ttop allocation block on these SKUs.
#   merge_queue_sku: (Optional) Concrete prio SKU to use when github.event_name is
#     merge_group. Logical test-list SKUs should set this instead of listing prio
#     SKUs in YAML. Multiple logical SKUs may share the same merge_queue_sku.
#   weights-cache-mode: (Optional) How model weights are mounted for the SKU.
skus:
  wh_llmbox:
    runs_on:
      - arch-wormhole_b0
      - config-t3000
      - pipeline-functional
      - in-service

  wh_llmbox_perf:
    runs_on:
      - arch-wormhole_b0
      - config-t3000
      - pipeline-perf
      - in-service

  bh_p100:
    runs_on:
      - cloud-virtual-machine
      - P100
      - in-service

  wh_galaxy:
    runs_on:
      - arch-wormhole_b0
      - pipeline-functional
      - topology-6u
      - in-service

  wh_galaxy_merge_gate:
    runs_on:
      - arch-wormhole_b0
      - pipeline-functional
      - topology-6u
      - in-service-dedicated-merge-gate

  wh_galaxy_perf:
    runs_on:
      - arch-wormhole_b0
      - pipeline-perf
      - topology-6u
      - in-service

  bh_galaxy:
    runs_on:
      - arch-blackhole
      - pipeline-functional
      - topology-6u
      - in-service

  bh_galaxy_perf:
    runs_on:
      - arch-blackhole
      - pipeline-perf
      - topology-6u
      - in-service

  wh_n150:
    runs_on:
      - N150
      - in-service
      - cloud-virtual-machine

  wh_n300:
    runs_on:
      - N300
      - in-service
      - cloud-virtual-machine

  wh_n150_civ2:
    runs_on:
      - tt-ubuntu-2204-N150-viommu-stable

  wh_n300_civ2:
    runs_on:
      - tt-ubuntu-2204-N300-viommu-stable

  wh_llmbox_civ2:
    runs_on:
      - tt-ubuntu-2204-N300-llmbox-stable

  wh_llmbox_civ2_viommu:
    runs_on:
      - tt-ubuntu-2204-N300-llmbox-viommu-stable
    merge_queue_sku: wh_llmbox_civ2_prio

  bh_p100_perf:
    runs_on:
      - pipeline-perf
      - P100
      - in-service

  bh_p100a_civ2_viommu:
    runs_on:
      - tt-ubuntu-2204-P100a-viommu-stable

  bh_p150b_civ2_viommu:
    runs_on:
      - tt-ubuntu-2204-P150b-viommu-stable
    merge_queue_sku: bh_p150b_civ2_viommu_prio

  bh_p150b_civ2:
    runs_on:
      - tt-ubuntu-2204-P150b-stable
    weights-cache-mode: lfc

  wh_n300_perf:
    runs_on:
      - N300
      - in-service
      - bare-metal
      - pipeline-perf

  bh_p150:
    runs_on:
      - in-service
      - arch-blackhole
      - P150
      - pipeline-functional
    weights-cache-mode: cloud-mlperf

  bh_p150_perf:
    runs_on:
      - in-service
      - arch-blackhole
      - P150
      - pipeline-perf
    weights-cache-mode: local-disk

  bh_loudbox:
    runs_on:
      - in-service
      - arch-blackhole
      - BH-LoudBox
      - pipeline-functional
    weights-cache-mode: cloud-mlperf

  bh_p300:
    runs_on:
      - in-service
      - arch-blackhole
      - P300-viommu
      - pipeline-yyz2-lfc
    weights-cache-mode: lfc

  bh_p300_viommu:
    runs_on:
      - pipeline-yyz2-lfc
      - P300-viommu
      - in-service
    weights-cache-mode: lfc

  bh_loudbox_civ2_viommu:
    runs_on:
      - tt-ubuntu-2204-BH-LoudBox-viommu-stable

  bh_quietbox_2:
    runs_on:
      - BH-Quietbox-2
      - pipeline-perf
      - in-service
    weights-cache-mode: yyz4-mnt-models

  bh_quietbox_2_iommu:
    runs_on:
      - BH-Quietbox-2-iommu
      - pipeline-perf
      - in-service
    weights-cache-mode: yyz4-mnt-models

  bh_sc1:
    runs_on:
      - exabox-multihost-ci-sc1

  # Like bh_sc1, but routes to the high-power single-galaxy multihost-ci pool
  # (exabox-multihost-ci-sc1-hp / nodes labelled exabox.tenstorrent.com/power=14kw).
  bh_sc1_high_power:
    runs_on:
      - exabox-multihost-ci-sc1-hp

  bh_sc4:
    runs_on:
      - exabox-multihost-ci-sc4

  bh_sc16:
    runs_on:
      - exabox-multihost-ci-sc16

  cpu_medium:
    runs_on:
      - tt-ubuntu-2204-medium-stable
    merge_queue_sku: cpu_medium_prio

  # ---------------------------------------------------------------------------
  # Merge-queue prio SKUs (merge_group events only).
  # Referenced from logical SKUs via merge_queue_sku; do not list these in test
  # YAML skus maps. Multiple logical SKUs may share the same merge_queue_sku.
  # ---------------------------------------------------------------------------
  wh_llmbox_civ2_prio:
    runs_on:
      - tt-ubuntu-2204-N300-llmbox-viommu-prio-stable

  bh_p150b_civ2_viommu_prio:
    runs_on:
      - tt-ubuntu-2204-P150b-viommu-prio-stable

  cpu_medium_prio:
    runs_on:
      - tt-ubuntu-2204-medium-prio-stable

  # Synthetic CPU SKUs for ttsim simulator jobs. Tests using these SKUs run on
  # ubuntu-latest; the impl is expected to invoke .github/actions/setup-ttsim
  # gated on `startsWith(sku, 'sim_')` to download the matching libttsim_<arch>.so
  # and export the simulator env vars. The arch suffix on the SKU name selects
  # the ttsim binary (sim_wormhole_b0 → libttsim_wh.so, sim_blackhole → libttsim_bh.so).
  sim_wormhole_b0:
    runs_on:
      - ubuntu-latest
  sim_blackhole:
    runs_on:
      - ubuntu-latest
  sim_wormhole_b0_galaxy:
    runs_on:
      - tt-ubuntu-2204-large-stable
  sim_blackhole_galaxy:
    runs_on:
      - tt-ubuntu-2204-large-stable

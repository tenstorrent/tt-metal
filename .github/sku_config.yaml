# This file defines the mapping from SKUs to GitHub Actions runner labels (runs_on).
# This is the single source of truth for how SKUs map to runner configurations.

# Each SKU entry contains:
#   runs_on: Array of GitHub Actions runner labels that tests for this SKU.
#   merge_queue_sku: (Optional) Concrete prio SKU to use when github.event_name is
#     merge_group. Logical test-list SKUs should set this instead of listing prio
#     SKUs in YAML. Multiple logical SKUs may share the same merge_queue_sku.
#   weights-cache-mode: (Optional) How model weights are mounted for the SKU.
skus:
  wh_llmbox:
    runs_on:
      - arch-wormhole_b0
      - config-t3000
      - pipeline-functional
      - in-service

  wh_llmbox_perf:
    runs_on:
      - arch-wormhole_b0
      - config-t3000
      - pipeline-perf
      - in-service

  bh_p100:
    runs_on:
      - cloud-virtual-machine
      - P100
      - in-service

  wh_galaxy:
    runs_on:
      - arch-wormhole_b0
      - pipeline-functional
      - topology-6u
      - in-service

  wh_galaxy_merge_gate:
    runs_on:
      - arch-wormhole_b0
      - pipeline-functional
      - topology-6u
      - in-service-dedicated-merge-gate

  wh_galaxy_perf:
    runs_on:
      - arch-wormhole_b0
      - pipeline-perf
      - topology-6u
      - in-service

  bh_galaxy:
    runs_on:
      - arch-blackhole
      - pipeline-functional
      - topology-6u
      - in-service

  bh_galaxy_perf:
    runs_on:
      - arch-blackhole
      - pipeline-perf
      - topology-6u
      - in-service

  wh_n150:
    runs_on:
      - N150
      - in-service
      - cloud-virtual-machine

  wh_n300:
    runs_on:
      - N300
      - in-service
      - cloud-virtual-machine

  wh_n150_civ2:
    runs_on:
      - tt-ubuntu-2204-N150-viommu-stable

  wh_n300_civ2:
    runs_on:
      - tt-ubuntu-2204-N300-viommu-stable

  wh_llmbox_civ2:
    runs_on:
      - tt-ubuntu-2204-N300-llmbox-stable

  wh_llmbox_civ2_viommu:
    runs_on:
      - tt-ubuntu-2204-N300-llmbox-viommu-stable
    merge_queue_sku: wh_llmbox_civ2_prio

  bh_p100_perf:
    runs_on:
      - pipeline-perf
      - P100
      - in-service

  bh_p100a_civ2_viommu:
    runs_on:
      - tt-ubuntu-2204-P100a-viommu-stable

  bh_p150b_civ2_viommu:
    runs_on:
      - tt-ubuntu-2204-P150b-viommu-stable
    merge_queue_sku: bh_p150b_civ2_viommu_prio

  bh_p150b_civ2:
    runs_on:
      - tt-ubuntu-2204-P150b-stable
    weights-cache-mode: lfc

  wh_n300_perf:
    runs_on:
      - N300
      - in-service
      - bare-metal
      - pipeline-perf

  bh_p150:
    runs_on:
      - in-service
      - arch-blackhole
      - P150
      - pipeline-functional
    weights-cache-mode: cloud-mlperf

  bh_p150_perf:
    runs_on:
      - in-service
      - arch-blackhole
      - P150
      - pipeline-perf
    weights-cache-mode: local-disk

  bh_loudbox:
    runs_on:
      - in-service
      - arch-blackhole
      - BH-LoudBox
      - pipeline-functional
    weights-cache-mode: cloud-mlperf

  bh_p300:
    runs_on:
      - in-service
      - arch-blackhole
      - P300-viommu
      - pipeline-yyz2-lfc
    weights-cache-mode: lfc

  bh_p300_viommu:
    runs_on:
      - pipeline-yyz2-lfc
      - P300-viommu
      - in-service
    weights-cache-mode: lfc

  bh_loudbox_civ2_viommu:
    runs_on:
      - tt-ubuntu-2204-BH-LoudBox-viommu-stable

  bh_quietbox_2:
    runs_on:
      - BH-Quietbox-2
      - pipeline-perf
      - in-service
    weights-cache-mode: yyz4-mnt-models

  bh_quietbox_2_iommu:
    runs_on:
      - BH-Quietbox-2-iommu
      - pipeline-perf
      - in-service
    weights-cache-mode: yyz4-mnt-models

  # exabox-multihost-ci-* labels mark multihost routing; do not reuse for other runners.
  bh_sc1:
    runs_on:
      - exabox-multihost-ci-sc1

  # Like bh_sc1, but high-power pool (exabox.tenstorrent.com/power=14kw).
  # exabox-multihost-ci-* labels mark multihost routing; do not reuse for other runners.
  bh_sc1_high_power:
    runs_on:
      - exabox-multihost-ci-sc1-hp

  # exabox-multihost-ci-* labels mark multihost routing; do not reuse for other runners.
  bh_sc4:
    runs_on:
      - exabox-multihost-ci-sc4

  # exabox-multihost-ci-* labels mark multihost routing; do not reuse for other runners.
  bh_sc16:
    runs_on:
      - exabox-multihost-ci-sc16

  cpu_medium:
    runs_on:
      - tt-ubuntu-2204-medium-stable
    merge_queue_sku: cpu_medium_prio

  # ---------------------------------------------------------------------------
  # Merge-queue prio SKUs (merge_group events only).
  # Referenced from logical SKUs via merge_queue_sku; do not list these in test
  # YAML skus maps. Multiple logical SKUs may share the same merge_queue_sku.
  # ---------------------------------------------------------------------------
  wh_llmbox_civ2_prio:
    runs_on:
      - tt-ubuntu-2204-N300-llmbox-viommu-prio-stable

  bh_p150b_civ2_viommu_prio:
    runs_on:
      - tt-ubuntu-2204-P150b-viommu-prio-stable

  cpu_medium_prio:
    runs_on:
      - tt-ubuntu-2204-medium-prio-stable

  # Synthetic CPU SKUs for ttsim simulator jobs. The impl invokes
  # .github/actions/setup-ttsim gated on `startsWith(sku, 'sim_')`; that action reads
  # ttsim_lib below to pick which simulator binary to install, and derives the soc
  # descriptor from its wh/bh prefix. Workflows never name a libttsim binary — add or
  # retarget a SKU here and every pipeline that uses it follows.
  #
  # Each sim SKU mirrors one HW SKU's processor count, so a test can list the sim SKU
  # alongside the HW SKU it stands in for:
  #   ttsim_lib: (Required) libttsim binary from the tenstorrent/ttsim release pinned
  #     in tt_metal/ttsim-version. The fetch-ttsim job downloads libttsim_*.so wholesale,
  #     so a new lib needs no workflow change.
  sim_wh_n150:
    runs_on:
      - ubuntu-latest
    ttsim_lib: libttsim_wh.so
  sim_wh_n300:
    runs_on:
      - ubuntu-latest
    ttsim_lib: libttsim_wh_x2.so
  sim_wh_llmbox:
    runs_on:
      - tt-ubuntu-2204-large-stable
    ttsim_lib: libttsim_wh_x8.so
  sim_wh_galaxy:
    runs_on:
      - tt-ubuntu-2204-large-stable
    ttsim_lib: libttsim_wh_x32.so
  sim_bh_p150:
    runs_on:
      - ubuntu-latest
    ttsim_lib: libttsim_bh.so
  sim_bh_p300:
    runs_on:
      - ubuntu-latest
    ttsim_lib: libttsim_bh_x2.so
  sim_bh_quietbox_2:
    runs_on:
      - tt-ubuntu-2204-large-stable
    ttsim_lib: libttsim_bh_x4.so
  sim_bh_galaxy:
    runs_on:
      - tt-ubuntu-2204-large-stable
    ttsim_lib: libttsim_bh_x32.so

# This file defines the mapping from SKUs to GitHub Actions runner labels (runs_on).
# This is the single source of truth for how SKUs map to runner configurations.

# Each SKU entry contains:
#   runs_on: Array of GitHub Actions runner labels that tests for this SKU.
#   allocation: (Optional) Configuration for TTOP allocation
#     type: "Count" or "MGD"
#     count: Number of nodes (for Count type)
#     match_labels: Dictionary of Kubernetes labels
#     topology_keys: List of topology keys (for MGD type)
#   mgd: (Optional) MGD configuration text for runtime topology
skus:
  wh_llmbox:
    runs_on:
      - arch-wormhole_b0
      - config-t3000
      - pipeline-functional
      - in-service

  wh_llmbox_perf:
    runs_on:
      - arch-wormhole_b0
      - config-t3000
      - pipeline-perf
      - in-service

  bh_p100:
    runs_on:
      - cloud-virtual-machine
      - P100
      - in-service

  wh_galaxy:
    runs_on:
      - arch-wormhole_b0
      - pipeline-functional
      - topology-6u
      - in-service

  wh_galaxy_merge_gate:
    runs_on:
      - arch-wormhole_b0
      - pipeline-functional
      - topology-6u
      # TEST-ONLY (SYS-4772) -- DO NOT MERGE.
      #
      # Restored after b30f5be3 removed it. This label is load-bearing for something
      # non-obvious: models-smoke-tests-impl.yaml chooses the job container with
      #   contains(join(runs_on, ','), 'dedicated-merge-gate')
      #     && inputs.docker-image                                  # raw GHCR
      #     || format('{0}{1}', harbor-prefix, inputs.docker-image) # harbor-prefixed
      # so with no 'dedicated-merge-gate' string anywhere in runs_on the job asks for
      # harbor.ci.tenstorrent.net/... and dies in "Initialize containers" with
      #   dial tcp: lookup harbor.ci.tenstorrent.net ... no such host
      # because the galaxy lab has no DNS for harbor (see the comment in merge-gate.yaml).
      # That is what failed all 5 attempts of run 30395043332 -- before the test ever ran.
      - in-service-dedicated-merge-gate
      #
      # Pin this SKU to the single faulty board OM1-01A04-STGWH01 instead of letting the
      # pool pick between STGWH01 and its healthy twin STGWH02. runs_on is the only routing
      # mechanism GitHub Actions offers (there is no way to select a self-hosted runner by
      # name), so this requires a label that ONLY STGWH01 carries.
      # VERIFIED 2026-07-28: this label is real -- run 30395043332 was picked up by
      # OM1-01A04-STGWH01 within 3 seconds, twice.
      - OM1-01A04-STGWH01

  wh_galaxy_perf:
    runs_on:
      - arch-wormhole_b0
      - pipeline-perf
      - topology-6u
      - in-service

  bh_galaxy:
    runs_on:
      - arch-blackhole
      - pipeline-functional
      - topology-6u
      - in-service

  bh_galaxy_perf:
    runs_on:
      - arch-blackhole
      - pipeline-perf
      - topology-6u
      - in-service

  wh_n150:
    runs_on:
      - N150
      - in-service
      - cloud-virtual-machine

  wh_n300:
    runs_on:
      - N300
      - in-service
      - cloud-virtual-machine

  wh_n150_civ2:
    runs_on:
      - tt-ubuntu-2204-N150-viommu-stable

  wh_n300_civ2:
    runs_on:
      - tt-ubuntu-2204-N300-viommu-stable

  wh_llmbox_civ2:
    runs_on:
      - tt-ubuntu-2204-N300-llmbox-stable

  wh_llmbox_civ2_viommu:
    runs_on:
      - tt-ubuntu-2204-N300-llmbox-viommu-stable

  wh_llmbox_civ2_prio:
    runs_on:
      - tt-ubuntu-2204-N300-llmbox-viommu-prio-stable

  bh_p100_perf:
    runs_on:
      - pipeline-perf
      - P100
      - in-service

  bh_p100a_civ2_viommu:
    runs_on:
      - tt-ubuntu-2204-P100a-viommu-stable

  bh_p150b_civ2_viommu:
    runs_on:
      - tt-ubuntu-2204-P150b-viommu-stable

  bh_p150b_civ2_viommu_prio:
    runs_on:
      - tt-ubuntu-2204-P150b-viommu-prio-stable

  bh_p150b_civ2:
    runs_on:
      - tt-ubuntu-2204-P150b-stable

  wh_n300_perf:
    runs_on:
      - N300
      - in-service
      - bare-metal
      - pipeline-perf

  bh_p150:
    runs_on:
      - in-service
      - arch-blackhole
      - P150
      - pipeline-functional

  bh_p150_perf:
    runs_on:
      - in-service
      - arch-blackhole
      - P150
      - pipeline-perf

  bh_loudbox:
    runs_on:
      - in-service
      - arch-blackhole
      - BH-LoudBox
      - pipeline-functional

  bh_p300:
    runs_on:
      - in-service
      - arch-blackhole
      - P300-viommu
      - pipeline-yyz2-lfc
  bh_p300_viommu:
    runs_on:
      - pipeline-yyz2-lfc
      - P300-viommu
      - in-service

  bh_loudbox_civ2_viommu:
    runs_on:
      - tt-ubuntu-2204-BH-LoudBox-viommu-stable

  bh_quietbox_2:
    runs_on:
      - BH-Quietbox-2
      - pipeline-perf
      - in-service

  bh_spsg:
    runs_on:
      - exabox-multihost-with-nfs
    allocation:
      type: Count
      count: 1
      match_labels:
        exabox.tenstorrent.com/purpose: ci-metal
        exabox.tenstorrent.com/superpod: A29

  bh_sp1:
    runs_on:
      - exabox-multihost-with-nfs
    allocation:
      type: Count
      count: 4
      match_labels:
        exabox.tenstorrent.com/purpose: ci-metal
        exabox.tenstorrent.com/superpod: A29

  bh_sp1-blitz:
    runs_on:
      - exabox-multihost-with-nfs
    allocation:
      type: MGD
      match_labels:
        exabox.tenstorrent.com/purpose: ci-metal
      topologyKeys:
        - exabox.tenstorrent.com/quad
      mgd_file: models/demos/deepseek_v3_b1/scaleout_configs/blitz_decode_single_pod_mesh_graph_descriptor.textproto

  bh_sp1-mgd:
    runs_on:
      - exabox-multihost-with-nfs
    allocation:
      type: MGD
      match_labels:
        exabox.tenstorrent.com/purpose: ci-metal
      topologyKeys:
        - exabox.tenstorrent.com/quad
      mgd_file: tt_metal/fabric/mesh_graph_descriptors/32x4_quad_bh_galaxy_torus_xy_graph_descriptor.textproto

  bh_sp4:
    runs_on:
      - exabox-multihost-with-nfs
    allocation:
      type: Count
      count: 16
      match_labels:
        exabox.tenstorrent.com/purpose: ci-metal
        exabox.tenstorrent.com/superpod: A29

  # Synthetic CPU SKUs for ttsim simulator jobs. Tests using these SKUs run on
  # ubuntu-latest; the impl is expected to invoke .github/actions/setup-ttsim
  # gated on `startsWith(sku, 'sim_')` to download the matching libttsim_<arch>.so
  # and export the simulator env vars. The arch suffix on the SKU name selects
  # the ttsim binary (sim_wormhole_b0 → libttsim_wh.so, sim_blackhole → libttsim_bh.so).
  sim_wormhole_b0:
    runs_on:
      - ubuntu-latest
  sim_blackhole:
    runs_on:
      - ubuntu-latest

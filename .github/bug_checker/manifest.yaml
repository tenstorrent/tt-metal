    severity: blocking
    suggest_fix: true
    model: null
    paths:
      - "tt_metal/impl/ccl/**"
      - "ttnn/cpp/ttnn/operations/ccl/**"
    labels:
      - "area:ccl"

  reshape-dim-check:
    file: reshape-dim-check.md
    severity: warning
    suggest_fix: true
    model: null
    paths:
      - "ttnn/cpp/ttnn/operations/data_movement/**"

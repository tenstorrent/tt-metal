# PROTOTYPE: replaces umd_bump_metal.sh PR creation (find-or-create PR, branch, commit, changelog).
# Dependabot opens one PR per new tt-umd commit and keeps it rebased.
version: 2
updates:
  - package-ecosystem: gitsubmodule
    directory: "/"
    schedule:
      interval: daily        # fastest supported; the old script bumped at most once a day anyway
    allow:
      - dependency-name: "tt_metal/third_party/umd"
    open-pull-requests-limit: 1
    commit-message:
      prefix: "[UMD Bump]"
    labels:
      - umd-bump

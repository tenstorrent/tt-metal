  - Disaggregated prefill sparse MLA accuracy tests
  - Disaggregated prefill perf tests
  - Disaggregated prefill accuracy & weight cache tests
  - Disaggregated prefill D2D socket sync op tests
blaze_models_prefill_tests.yaml:

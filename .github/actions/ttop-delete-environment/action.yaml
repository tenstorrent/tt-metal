name: 'Delete Environment'
description: 'A composable action to delete an environment'

inputs:
  environmentName:
    description: 'Environment name'
    required: true
  namespace:
    description: 'Target namespace for the environment'
    required: false
    default: 'ttop-ci'
  timeoutSeconds:
    description: 'Max seconds to keep retrying the delete before failing.'
    required: false
    default: '300'
  retries:
    description: 'Number of retries minting the OIDC in one attempt before giving up'
    required: false
    default: '3'

runs:
  using: 'composite'
  steps:
    - name: Delete Environment
      shell: bash
      env:
        NAMESPACE: ${{ inputs.namespace }}
        RESOURCE: helmrelease/${{ inputs.environmentName }}
        MODE: delete
        OVERALL_TIMEOUT: ${{ inputs.timeoutSeconds }}
        RETRIES: ${{ inputs.retries }}
      run: "$GITHUB_ACTION_PATH/../ttop-await-resource/await.sh"

name: 'Pull, tag, and push a docker image to GHCR as latest'
description: 'Tags a Docker image as latest and pushes to GitHub Container Registry'

inputs:
  docker-image-tag:
    description: 'Docker image tag in format REPO_NAME:VERSION'
    required: true
    type: string
  github-token:
    description: 'GH Token for registry login'
    required: true
    type: string
  new-tag:
    description: 'New tag to use, for example latest or v0.65.0'
    required: false
    type: string
    default: 'latest'

outputs:
  repo-name:
    description: 'Extracted repository name from docker image tag'
    value: ${{ steps.parse-repo.outputs.repo-name }}

runs:
  using: 'composite'
  steps:
    - name: Validate docker image tag format
      shell: bash
      run: |
        if [[ ! "${{ inputs.docker-image-tag }}" =~ ^[a-zA-Z0-9._/-]+:[a-zA-Z0-9._-]+$ ]]; then
          echo "Error: docker-image-tag must be in format REPO_NAME:VERSION"
          echo "Provided: ${{ inputs.docker-image-tag }}"
          exit 1
        fi
        echo "✅ Docker image tag format is valid"

    - name: Login to GitHub Container Registry
      uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.github-token }}

    - name: "Download regctl"
      shell: bash
      run: |
        tmp=$(mktemp)
        curl -fsSL https://github.com/regclient/regclient/releases/download/v0.9.2/regctl-linux-amd64 -o "$tmp"
        echo "4da11cfe7009661a498ffafc11f510049864ffb4eb44961743618b3975db3c55  $tmp" | sha256sum -c -
        sudo install -m 0755 "$tmp" /usr/local/bin/regctl
        rm -f "$tmp"

    - name: Parse repository name
      id: parse-repo
      shell: bash
      run: |
        FULL_TAG="${{ inputs.docker-image-tag }}"
        REPO_NAME="${FULL_TAG%:*}"
        echo "repo-name=${REPO_NAME}" >> $GITHUB_OUTPUT
        echo "Extracted repository name: ${REPO_NAME}"

    - name: Pull, tag and push image
      shell: bash
      run: |
        LATEST_TAG="${{ steps.parse-repo.outputs.repo-name }}:${{ inputs.new-tag }}"
        echo "Copying ${{ inputs.docker-image-tag }} to ${LATEST_TAG}"
        regctl image copy ${{ inputs.docker-image-tag }} ${LATEST_TAG}

name: "Download Artifacts from Workflow Run"
description: "Download and extract build artifacts from a specific workflow run to skip building"

inputs:
  workflow_run_id:
    required: true
    description: "GitHub Actions workflow run ID to download artifacts from"
  working-directory:
    required: false
    default: "/work"
    description: "Directory to extract artifacts to"
  tracy:
    required: false
    default: "true"
    description: "Whether to look for profiler-enabled artifacts"
  # The patterns select one build of a run that holds several (for example a
  # Merge Gate run holds Release, ASan, and TSan packages). Each is an extended
  # regex for the whole artifact name. When a pattern is set, the artifact must
  # match exactly once, or the step fails. When it is empty, the step uses the
  # first name that matches the old loose filter.
  build-artifact-pattern:
    required: false
    default: ""
    description: "Regex for the build tarball artifact (TTMetal_build_any_...)"
  require-build-artifact:
    required: false
    default: "true"
    description: "Fail when no build tarball is found. Set false for a build that publishes no tarball"
  packages-artifact-pattern:
    required: false
    default: ""
    description: "Regex for the packages artifact (packages-...)"
  wheel-artifact-pattern:
    required: false
    default: ""
    description: "Regex for the wheel artifact (ttnn-dist-...)"
  ttnn-import-artifact-name:
    required: false
    default: ""
    description: "Exact name of the ttnn-import artifact to download into <working-directory>/ttnn-import"

outputs:
  build-artifact-name:
    description: "Name of the downloaded build artifact"
    value: ${{ steps.download.outputs.build-artifact-name }}
  wheel-artifact-name:
    description: "Name of the downloaded wheel artifact"
    value: ${{ steps.download.outputs.wheel-artifact-name }}
  packages-artifact-name:
    description: "Name of the downloaded packages artifact"
    value: ${{ steps.download.outputs.packages-artifact-name }}
  ttnn-import-artifact-name:
    description: "Name of the downloaded ttnn-import artifact"
    value: ${{ steps.download.outputs.ttnn-import-artifact-name }}

runs:
  using: composite
  steps:
    - name: Check required tools
      shell: bash
      run: |
        if ! command -v gh >/dev/null 2>&1; then
          echo "ERROR: GitHub CLI (gh) not found"
          exit 1
        fi
        # Authenticate using GH_TOKEN if available (automatically used by gh CLI)
        if [ -n "${GH_TOKEN:-}" ]; then
          echo "GH_TOKEN found, GitHub CLI will use it automatically"
        elif ! gh auth status >/dev/null 2>&1; then
          echo "ERROR: GitHub CLI not authenticated and GH_TOKEN not set"
          exit 1
        fi

    - name: Get workflow run info
      id: run-info
      shell: bash
      run: |
        WORKFLOW_RUN_ID="${{ inputs.workflow_run_id }}"
        echo "Fetching artifacts from workflow run: $WORKFLOW_RUN_ID"

        # Get workflow run details
        RUN_INFO=$(gh run view "$WORKFLOW_RUN_ID" --repo "${{ github.repository }}" --json conclusion,workflowName 2>&1)
        if [ $? -ne 0 ]; then
          echo "ERROR: Failed to fetch workflow run $WORKFLOW_RUN_ID"
          echo "$RUN_INFO"
          exit 1
        fi

        CONCLUSION=$(echo "$RUN_INFO" | jq -r '.conclusion')
        if [ "$CONCLUSION" != "success" ]; then
          echo "WARNING: Workflow run $WORKFLOW_RUN_ID has conclusion: $CONCLUSION (expected: success)"
        fi

        echo "Workflow run conclusion: $CONCLUSION"

    - name: List available artifacts
      id: list-artifacts
      shell: bash
      run: |
        WORKFLOW_RUN_ID="${{ inputs.workflow_run_id }}"
        ARTIFACTS=$(gh api --paginate repos/${{ github.repository }}/actions/runs/"$WORKFLOW_RUN_ID"/artifacts --jq '.artifacts[] | select(.expired | not) | .name' 2>&1)

        if [ $? -ne 0 ]; then
          echo "ERROR: Failed to list artifacts for run $WORKFLOW_RUN_ID"
          echo "$ARTIFACTS"
          exit 1
        fi

        echo "Available artifacts:"
        echo "$ARTIFACTS"
        echo "artifacts<<EOF" >> $GITHUB_OUTPUT
        echo "$ARTIFACTS" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT

    - name: Download artifacts
      id: download
      shell: bash
      # The patterns hold a ref name, so they go in through env, not into the script text.
      env:
        BUILD_PATTERN: ${{ inputs.build-artifact-pattern }}
        REQUIRE_BUILD: ${{ inputs.require-build-artifact }}
        PACKAGES_PATTERN: ${{ inputs.packages-artifact-pattern }}
        WHEEL_PATTERN: ${{ inputs.wheel-artifact-pattern }}
        TTNN_IMPORT_NAME: ${{ inputs.ttnn-import-artifact-name }}
      run: |
        WORKFLOW_RUN_ID="${{ inputs.workflow_run_id }}"
        WORK_DIR="${{ inputs.working-directory }}"
        TRACY_ENABLED="${{ inputs.tracy }}"

        mkdir -p "$WORK_DIR"
        cd "$WORK_DIR"

        # Parse artifact names from previous step
        ARTIFACTS="${{ steps.list-artifacts.outputs.artifacts }}"

        # Exactly one artifact must match a set pattern.
        pick() {
          local pattern="$1" what="$2" found count
          found=$(echo "$ARTIFACTS" | grep -E -- "$pattern" || true)
          count=$(echo "$found" | grep -c . || true)
          if [ "$count" -gt 1 ]; then
            echo "ERROR: $count $what artifacts match '$pattern':" >&2
            echo "$found" >&2
            return 1
          fi
          echo "$found"
        }

        # Find build artifact (ttm_any.tar.zst)
        BUILD_ARTIFACT=""
        if [ "$TRACY_ENABLED" = "true" ]; then
          BUILD_ARTIFACT=$(echo "$ARTIFACTS" | grep -E "TTMetal_build_any.*_profiler_" | head -1 || true)
        else
          BUILD_ARTIFACT=$(echo "$ARTIFACTS" | grep -E "TTMetal_build_any" | grep -v "_profiler_" | head -1 || true)
        fi

        # Grab the appropriate wheel artifact based on whether tracy is enabled
        if [ "$TRACY_ENABLED" = "true" ]; then
          WHEEL_ARTIFACT=$(echo "$ARTIFACTS" | grep -E "^ttnn-dist" | grep -E -- "-profiler-" | head -1 || true)
        else
          WHEEL_ARTIFACT=$(echo "$ARTIFACTS" | grep -E "^ttnn-dist" | grep -v -- "-profiler-" | head -1 || true)
        fi

        # Find packages artifact (optional)
        PACKAGES_ARTIFACT=$(echo "$ARTIFACTS" | grep -E "packages-" | head -1 || true)

        # Pattern mode: when one pattern is set, the patterns replace the loose
        # filters above. An artifact with an empty pattern is not downloaded, and an
        # artifact with a set pattern is required.
        PATTERN_MODE=false
        if [ -n "$BUILD_PATTERN$PACKAGES_PATTERN$WHEEL_PATTERN" ]; then
          PATTERN_MODE=true
          BUILD_ARTIFACT=""
          WHEEL_ARTIFACT=""
          PACKAGES_ARTIFACT=""
          if [ -n "$BUILD_PATTERN" ]; then
            BUILD_ARTIFACT=$(pick "$BUILD_PATTERN" build) || exit 1
          fi
          if [ -n "$WHEEL_PATTERN" ]; then
            WHEEL_ARTIFACT=$(pick "$WHEEL_PATTERN" wheel) || exit 1
            if [ -z "$WHEEL_ARTIFACT" ]; then
              echo "ERROR: No wheel artifact matches '$WHEEL_PATTERN'"
              echo "Available artifacts:"; echo "$ARTIFACTS"
              exit 1
            fi
          fi
          if [ -n "$PACKAGES_PATTERN" ]; then
            PACKAGES_ARTIFACT=$(pick "$PACKAGES_PATTERN" packages) || exit 1
            if [ -z "$PACKAGES_ARTIFACT" ]; then
              echo "ERROR: No packages artifact matches '$PACKAGES_PATTERN'"
              echo "Available artifacts:"; echo "$ARTIFACTS"
              exit 1
            fi
          fi
        fi
        TTNN_IMPORT_ARTIFACT=""
        if [ -n "$TTNN_IMPORT_NAME" ]; then
          if ! echo "$ARTIFACTS" | grep -qxF -- "$TTNN_IMPORT_NAME"; then
            echo "ERROR: No ttnn-import artifact named '$TTNN_IMPORT_NAME'"
            echo "Available artifacts:"; echo "$ARTIFACTS"
            exit 1
          fi
          TTNN_IMPORT_ARTIFACT=$TTNN_IMPORT_NAME
        fi

        if [ -z "$BUILD_ARTIFACT" ] && [ "$REQUIRE_BUILD" != "true" ]; then
          echo "No build artifact found; none is required."
        elif [ -z "$BUILD_ARTIFACT" ]; then
          echo "ERROR: Could not find build artifact matching expected pattern"
          echo "TRACY_ENABLED (requested): $TRACY_ENABLED"

          # Check if only the opposite tracy variant exists to give a clear hint
          PROFILER_ARTIFACT=$(echo "$ARTIFACTS" | grep -E "TTMetal_build_any.*_profiler_" | head -1 || true)
          NON_PROFILER_ARTIFACT=$(echo "$ARTIFACTS" | grep -E "TTMetal_build_any" | grep -v "_profiler_" | head -1 || true)

          if [ "$TRACY_ENABLED" = "true" ] && [ -n "$NON_PROFILER_ARTIFACT" ]; then
            echo "HINT: Found non-profiler build artifact: $NON_PROFILER_ARTIFACT"
            echo "      But tracy=true was requested, so a profiler-enabled artifact was expected."
            echo "      You may have triggered this workflow with tracy=true while reusing a run built without tracy."
          elif [ "$TRACY_ENABLED" != "true" ] && [ -n "$PROFILER_ARTIFACT" ]; then
            echo "HINT: Found profiler-enabled build artifact: $PROFILER_ARTIFACT"
            echo "      But tracy=false was requested, so a non-profiler artifact was expected."
            echo "      You may have triggered this workflow with tracy=false while reusing a run built with tracy enabled."
          fi

          echo "Available artifacts:"
          echo "$ARTIFACTS"
          exit 1
        fi

        echo "Found build artifact: ${BUILD_ARTIFACT:-none}"
        echo "Found wheel artifact: ${WHEEL_ARTIFACT:-none}"
        echo "Found packages artifact: ${PACKAGES_ARTIFACT:-none}"
        echo "Found ttnn-import artifact: ${TTNN_IMPORT_ARTIFACT:-none}"

        if [ -n "$BUILD_ARTIFACT" ]; then
          # Download build artifact to a temp directory first
          TEMP_DIR=$(mktemp -d)
          echo "Downloading $BUILD_ARTIFACT to $TEMP_DIR..."
          if ! gh run download "$WORKFLOW_RUN_ID" --repo "${{ github.repository }}" --name "$BUILD_ARTIFACT" --dir "$TEMP_DIR" 2>&1; then
            echo "ERROR: Failed to download build artifact"
            exit 1
          fi

          # Move ttm_any.tar.zst to work directory (keep it compressed for re-upload)
          if [ -f "$TEMP_DIR/ttm_any.tar.zst" ]; then
            mv "$TEMP_DIR/ttm_any.tar.zst" "$WORK_DIR/"
            echo "Build artifact ready at $WORK_DIR/ttm_any.tar.zst"
          elif [ -f "$TEMP_DIR/ttm_any.tar" ]; then
            mv "$TEMP_DIR/ttm_any.tar" "$WORK_DIR/"
            echo "Build artifact ready at $WORK_DIR/ttm_any.tar"
          else
            echo "ERROR: No ttm_any.tar.zst or ttm_any.tar found after download"
            ls -la "$TEMP_DIR"
            exit 1
          fi
          rm -rf "$TEMP_DIR"
        fi

        # Download wheel artifact if found
        if [ -n "$WHEEL_ARTIFACT" ]; then
          TEMP_DIR=$(mktemp -d)
          echo "Downloading $WHEEL_ARTIFACT to $TEMP_DIR..."
          if gh run download "$WORKFLOW_RUN_ID" --repo "${{ github.repository }}" --name "$WHEEL_ARTIFACT" --dir "$TEMP_DIR" 2>&1; then
            WHEEL_FILE=$(find "$TEMP_DIR" -name "*.whl" -type f | head -1)
            if [ -n "$WHEEL_FILE" ]; then
              mv "$WHEEL_FILE" "$WORK_DIR/"
              echo "Wheel file ready at $WORK_DIR/$(basename "$WHEEL_FILE")"
            fi
          elif [ "$PATTERN_MODE" = "true" ]; then
            echo "ERROR: Failed to download wheel artifact"
            exit 1
          else
            echo "WARNING: Failed to download wheel artifact (non-fatal)"
          fi
          rm -rf "$TEMP_DIR"
        fi

        # Download packages artifact if found
        if [ -n "$PACKAGES_ARTIFACT" ]; then
          TEMP_DIR=$(mktemp -d)
          echo "Downloading $PACKAGES_ARTIFACT..."
          if gh run download "$WORKFLOW_RUN_ID" --repo "${{ github.repository }}" --name "$PACKAGES_ARTIFACT" --dir "$TEMP_DIR" 2>&1; then
            # Move the .deb files and their .ddeb debug-symbol packages to work directory
            find "$TEMP_DIR" \( -name "*.deb" -o -name "*.ddeb" \) -exec mv {} "$WORK_DIR/" \;
          elif [ "$PATTERN_MODE" = "true" ]; then
            echo "ERROR: Failed to download packages artifact"
            exit 1
          else
            echo "WARNING: Failed to download packages artifact (non-fatal)"
          fi
          rm -rf "$TEMP_DIR"
        fi

        # Download the ttnn-import tree (build/lib + runtime) if requested
        if [ -n "$TTNN_IMPORT_ARTIFACT" ]; then
          echo "Downloading $TTNN_IMPORT_ARTIFACT to $WORK_DIR/ttnn-import..."
          if ! gh run download "$WORKFLOW_RUN_ID" --repo "${{ github.repository }}" --name "$TTNN_IMPORT_ARTIFACT" --dir "$WORK_DIR/ttnn-import" 2>&1; then
            echo "ERROR: Failed to download ttnn-import artifact"
            exit 1
          fi
        fi

        # Set outputs - use the original artifact names so downstream jobs can reference them
        echo "build-artifact-name=$BUILD_ARTIFACT" >> $GITHUB_OUTPUT
        echo "wheel-artifact-name=${WHEEL_ARTIFACT:-}" >> $GITHUB_OUTPUT
        echo "packages-artifact-name=${PACKAGES_ARTIFACT:-}" >> $GITHUB_OUTPUT
        echo "ttnn-import-artifact-name=${TTNN_IMPORT_ARTIFACT:-}" >> $GITHUB_OUTPUT

        echo "✓ Artifacts downloaded successfully to $WORK_DIR"

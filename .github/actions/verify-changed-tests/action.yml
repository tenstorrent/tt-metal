name: "Verify changed tests"
description: >-
  Scope tests/pipeline_reorg changes and narrow the matrix to them. Pinned to
  @main by every caller so a PR branch always runs the current version of this
  gate, never a stale or missing copy from its own head. Runs
  .github/scripts/utils/verify_changed_tests.py
  in place -- that script is not duplicated here, so pinning this action to a
  ref pins that script to the same ref.

inputs:
  event:
    description: "GitHub event name (pull_request or merge_group)"
    required: true
  base:
    description: "Base ref or sha to diff against"
    required: true
  output:
    description: "Path to also write the JSON scope result to"
    required: false
    default: ""

outputs:
  status:
    description: "Gate status: no_op or run"
    value: ${{ steps.gate.outputs.status }}
  expected-leg-count:
    value: ${{ steps.gate.outputs.expected-leg-count }}
  dropped-leg-count:
    description: "Legs skipped because their SKU is in UNSUPPORTED_SKUS"
    value: ${{ steps.gate.outputs.dropped-leg-count }}
  leg-digest:
    value: ${{ steps.gate.outputs.leg-digest }}
  needs-default:
    value: ${{ steps.gate.outputs.needs-default }}
  needs-profiler:
    value: ${{ steps.gate.outputs.needs-profiler }}
  matrix:
    value: ${{ steps.gate.outputs.matrix }}
  sim-libs:
    value: ${{ steps.gate.outputs.sim-libs }}
  leg-count:
    value: ${{ steps.gate.outputs.leg-count }}

runs:
  using: "composite"
  steps:
    - name: Scope the changed tests and narrow the matrix
      id: gate
      shell: bash
      run: |
        # GITHUB_ACTION_PATH is this action's directory inside the checkout of
        # this repo at the ref the caller's `uses:` line pinned (@main). The
        # script two levels up from there is that same checkout's copy, so
        # running it in place -- rather than a copy bundled into this action --
        # is what makes pinning this action pin the script.
        python3 "${GITHUB_ACTION_PATH}/../../scripts/utils/verify_changed_tests.py" \
          --event "${{ inputs.event }}" \
          --base "${{ inputs.base }}" \
          --output "${{ inputs.output }}"

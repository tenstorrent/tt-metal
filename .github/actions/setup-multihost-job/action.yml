name: Setup Multihost Job
description: >
  Shared exabox multihost setup: download build/wheel artifacts, fan them out to
  workers with mpirun --pernode, run ttop-recovery (runner ConfigMap) to IPMI-reset
  + validate the cluster, and sanity-check ttnn (and optionally /mnt/models).
  Callers must already have checked out the repo and set PIPELINE_DIR when using
  scratch staging.

inputs:
  build-artifact-name:
    description: Name of the build artifact (.tar.zst)
    required: true
  wheel-artifact-name:
    description: Name of the ttnn wheel artifact
    required: true
  artifacts-path:
    description: Directory to download artifacts into (shared NFS recommended)
    required: false
    default: /home/user/artifacts
  extra-pip-packages:
    description: >
      Extra packages to install alongside the ttnn wheel on every worker
      (space-separated). Models e2e/unit pass pytest + pytest-timeout.
    required: false
    default: ""
  create-pipeline-dir:
    description: Create $PIPELINE_DIR if set (NFS scratch for ranklogs / automapper cwd)
    required: false
    default: "true"
  check-mnt-models:
    description: Verify /mnt/models is readable on every worker
    required: false
    default: "true"
  cluster-validation-bin:
    description: >
      Path to run_cluster_validation (arg 1 to ttop-recovery). Must exist on
      workers after unpack (default matches the ConfigMap script default).
    required: false
    default: /home/user/tt-metal/build/tools/scaleout/run_cluster_validation
  cabling-descriptor-path:
    description: >
      Cabling descriptor for ttop-recovery (arg 3). Defaults match the runner
      ConfigMap script (/scaleout_configs/..., not /data/scaleout_configs/...).
    required: false
    default: /data/scaleout_configs/bh_glx_exabox/cabling_descriptor.textproto
  deployment-descriptor-path:
    description: Deployment descriptor for ttop-recovery (arg 4)
    required: false
    default: /data/scaleout_configs/bh_glx_exabox/deployment_descriptor.textproto
  max-recovery-attempts:
    description: Max ttop-ipmi-reset + validation attempts (arg 2 to ttop-recovery)
    required: false
    default: "10"

runs:
  using: "composite"
  steps:
    - name: Download Build Artifact
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: ${{ inputs.build-artifact-name }}
        path: ${{ inputs.artifacts-path }}

    - name: Download Python Wheel
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: ${{ inputs.wheel-artifact-name }}
        path: ${{ inputs.artifacts-path }}

    - name: Unpack artifacts & install
      shell: bash
      env:
        ARTIFACTS_PATH: ${{ inputs.artifacts-path }}
        EXTRA_PIP_PACKAGES: ${{ inputs.extra-pip-packages }}
        CREATE_PIPELINE_DIR: ${{ inputs.create-pipeline-dir }}
      run: |
        set -euo pipefail
        # Move the cloned directory to workers. TODO: Clone directly to NFS
        cp -r "$GITHUB_WORKSPACE" /ci/tt-metal
        shopt -s globstar nullglob
        build_archives=("${ARTIFACTS_PATH}"/**/*.tar.zst)
        echo "Found ${#build_archives[@]} .tar.zst candidate(s) under ${ARTIFACTS_PATH}"
        printf ' - %s\n' "${build_archives[@]}"
        if [ ${#build_archives[@]} -eq 0 ]; then
          echo "ERROR: Could not find any .tar.zst under ${ARTIFACTS_PATH}"
          echo "Artifact directory layout:"
          ls -R "${ARTIFACTS_PATH}"
          exit 1
        fi
        BUILD_ARCHIVE="${build_archives[0]}"
        echo "Using build archive: ${BUILD_ARCHIVE}"

        if [ "${CREATE_PIPELINE_DIR}" = "true" ] && [ -n "${PIPELINE_DIR:-}" ]; then
          # Per-job NFS scratch (ranklogs, automapper cwd). Do NOT copy the full
          # tt-metal tree here — that OOMs the 4Gi Actions runner.
          mkdir -p "$PIPELINE_DIR"
        fi

        # Workers + runner local copy for runtime (local disk).

        cp -r /home/user/tt-metal /ci/tt-metal 
        tar --zstd -xf "${BUILD_ARCHIVE}" -C /home/user/tt-metal

        mpirun --pernode bash -lc 'cp -r /ci/tt-metal /home/user/'
        mpirun --pernode git -C /home/user/tt-metal submodule update --init --recursive
        mpirun --pernode tar --zstd -xf "${BUILD_ARCHIVE}" -C /home/user/tt-metal

        ttnn_wheels=("${ARTIFACTS_PATH}"/**/ttnn-*.whl)
        echo "Found ${#ttnn_wheels[@]} ttnn wheel candidate(s) under ${ARTIFACTS_PATH}"
        printf ' - %s\n' "${ttnn_wheels[@]}"
        if [ ${#ttnn_wheels[@]} -eq 0 ]; then
          echo "ERROR: Could not find ttnn-*.whl under ${ARTIFACTS_PATH}"
          echo "Artifact directory layout:"
          ls -R "${ARTIFACTS_PATH}"
          exit 1
        fi
        # shellcheck disable=SC2086 # intentional word-split of EXTRA_PIP_PACKAGES
        mpirun --pernode uv pip install "${ttnn_wheels[@]}" ${EXTRA_PIP_PACKAGES}

    - name: Reset cards and validate cluster
      shell: bash
      working-directory: /tmp
      env:
        CLUSTER_VALIDATION: ${{ inputs.cluster-validation-bin }}
        MAX_RECOVERY_ATTEMPTS: ${{ inputs.max-recovery-attempts }}
        CABLING_DESCRIPTOR_PATH: ${{ inputs.cabling-descriptor-path }}
        DEPLOYMENT_DESCRIPTOR_PATH: ${{ inputs.deployment-descriptor-path }}
      run: |
        set -euo pipefail
        if ! command -v ttop-recovery >/dev/null 2>&1; then
          echo "ERROR: ttop-recovery not on PATH (expected from multihost-ci runner ConfigMap)"
          exit 1
        fi
        if [ ! -x "$CLUSTER_VALIDATION" ]; then
          echo "ERROR: run_cluster_validation not found/executable at: $CLUSTER_VALIDATION"
          echo "Did unpack/install finish before recovery?"
          ls -la "$(dirname "$CLUSTER_VALIDATION")" 2>/dev/null || true
          exit 1
        fi
        echo "Running ttop-recovery with cluster validation: $CLUSTER_VALIDATION"
        ttop-recovery \
          "$CLUSTER_VALIDATION" \
          "$MAX_RECOVERY_ATTEMPTS" \
          "$CABLING_DESCRIPTOR_PATH" \
          "$DEPLOYMENT_DESCRIPTOR_PATH"

    - name: Verify ttnn imports on workers
      shell: bash
      working-directory: /tmp
      run: |
        mpirun --pernode --tag-output bash -lc '
          python3 -c "import ttnn; print(\"ttnn import: OK\")"
          python3 -c "import ttnn.device; print(\"ttnn.device import: OK\")"
        '

    - name: Check /mnt/models access on workers
      if: ${{ inputs.check-mnt-models == 'true' }}
      shell: bash
      working-directory: /tmp
      run: |
        mpirun --pernode --tag-output bash -lc '
          test -r /mnt/models
        '

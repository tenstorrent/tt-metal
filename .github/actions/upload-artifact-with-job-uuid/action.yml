name: "Upload artifact with a uuid"
description: "Upload artifact with a uuid for later identification with the job"

inputs:
  path:
    description: "Paths to pass to upload-artifact and upload"
    required: false
    default: "/work/generated/test_reports/"
  prefix:
    description: "Artifact name prefix"
    default: "artifact_"

runs:
  using: "composite"
  steps:
    - name: Generate artifact name
      id: generate-artifact-name
      shell: bash
      run: |
        # uuidgen ships with util-linux on most images but is missing from
        # minimal containers (e.g., basic-ttnn-runtime). Fall back to the
        # kernel's random-UUID source, which is always present on Linux.
        uuid=$(uuidgen 2>/dev/null || cat /proc/sys/kernel/random/uuid)
        artifact_name="${{ inputs.prefix }}$uuid"
        echo "[UPLOAD-ARTIFACT-UUID] $artifact_name"
        echo "artifact-name=$artifact_name" >> "$GITHUB_OUTPUT"
    - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
      with:
        name: "${{ steps.generate-artifact-name.outputs.artifact-name }}"
        path: ${{ inputs.path }}

    # One artifact per hung job
    - name: Upload triage output
      if: ${{ env.TT_TRIAGE_DIR != '' }}
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
      with:
        name: "triage_${{ github.job }}_${{ job.check_run_id }}"
        path: ${{ env.TT_TRIAGE_DIR }}/
        if-no-files-found: ignore
        retention-days: 30

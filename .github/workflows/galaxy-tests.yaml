name: "Galaxy tests"

on:
  workflow_dispatch:
    inputs:
      # These 4 inputs shape a dispatch only. A scheduled run ignores them and
      # covers every suite. run-e2e-tests and run-multi-user-isolation-tests default
      # to false: those 2 suites are 266 of the 306 machine-minutes of a full run,
      # and "(Galaxy) unit tests" alone took 143 dispatches in 90 days.
      run-unit-tests:
        required: false
        type: boolean
        default: true
        description: "Run the Galaxy unit tests"
      run-integration-tests:
        required: false
        type: boolean
        default: true
        description: "Run the Galaxy integration tests"
      run-e2e-tests:
        required: false
        type: boolean
        default: false
        description: "Run the Galaxy e2e tests (about 166 machine-minutes; off by default on a dispatch)"
      run-multi-user-isolation-tests:
        required: false
        type: boolean
        default: false
        description: "Run the Galaxy multi-user isolation matrix (about 100 machine-minutes; off by default on a dispatch)"
      e2e-test-selection:
        description: "e2e tests: one id from tests/pipeline_reorg/galaxy_e2e_tests.yaml, or all"
        required: false
        default: all
        type: choice
        options:
          - all
          - galaxy-fabric-unit
          - galaxy-fabric-2d-torus-nightly
          - galaxy-fabric-multi-mesh-4x4-2x4s
          - galaxy-fabric-multi-mesh-2x8-2x4s
          - bh-galaxy-fabric-torus-stability
          - bh-galaxy-socket-pipeline
          - bh-galaxy-tensor-prefetcher
      wormhole:
        required: false
        type: boolean
        default: true
      blackhole:
        required: false
        type: boolean
        default: false
      unit-model:
        description: "Unit tests: select model to test"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - unit
          - fabric
          - multiprocess
#          - prefetcher
          - distributed-ops
      integration-model:
        description: "Integration tests: select model to test"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - unit
      extra-tag:
        required: false
        type: string
        default: "in-service"
      platform:
        required: false
        type: choice
        default: "Ubuntu 22.04"
        options:
          - "Ubuntu 22.04"
          - "Ubuntu 24.04"
        description: "Platform to build and test"
      build-type:
        required: false
        type: choice
        default: Release
        options:
          - Release
          - Debug
          - RelWithDebInfo
          - ASan
          - TSan
        description: "Build type configuration"
      enable-lto:
        required: false
        type: boolean
        default: false
        description: "Enable Link Time Optimization (LTO)"
  schedule:
    - cron: "0 0 * * *" # Runs every day at 12am UTC

run-name: >-
  Galaxy tests
  Tests[${{ github.event_name == 'schedule' && 'All'
  || format('{0}{1}{2}{3}{4}{5}{6}',
     inputs.run-unit-tests && 'unit' || '',
     inputs.run-unit-tests && inputs.run-integration-tests && ',' || '',
     inputs.run-integration-tests && 'integration' || '',
     (inputs.run-unit-tests || inputs.run-integration-tests) && inputs.run-e2e-tests && ',' || '',
     inputs.run-e2e-tests && 'e2e' || '',
     (inputs.run-unit-tests || inputs.run-integration-tests || inputs.run-e2e-tests) && inputs.run-multi-user-isolation-tests && ',' || '',
     inputs.run-multi-user-isolation-tests && 'multi-user' || '') }}]

permissions:
  packages: write
  contents: write

jobs:
  # A scheduled run covers every suite, thus it carries no inputs to check.
  check-selection:
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-slim
    steps:
      - name: Make sure at least one suite is selected
        run: |
          if [[ "${{ inputs.run-unit-tests }}" != "true" \
             && "${{ inputs.run-integration-tests }}" != "true" \
             && "${{ inputs.run-e2e-tests }}" != "true" \
             && "${{ inputs.run-multi-user-isolation-tests }}" != "true" ]]; then
            echo "::error::No suite selected. Enable at least one of run-unit-tests, run-integration-tests, run-e2e-tests or run-multi-user-isolation-tests."
            exit 1
          fi

  check-harbor:
    uses: ./.github/workflows/check-harbor.yaml

  # The impl-based suites take the in-place wheel. The multi-user isolation
  # matrix installs the wheel with pip, so it needs the manylinux wheel instead.
  build-artifact:
    needs: [check-harbor, check-selection]
    if: ${{ !cancelled() && needs.check-selection.result != 'failure' }}
    uses: ./.github/workflows/build-artifact.yaml
    permissions:
      contents: read
      packages: write
    secrets: inherit
    with:
      harbor-prefix: ${{ needs.check-harbor.outputs.harbor-prefix }}
      build-type: ${{ inputs.build-type || 'Release' }}
      build-inplace-wheel: true
      build-umd-tests: true
      platform: ${{ inputs.platform || 'Ubuntu 22.04' }}
      enable-lto: ${{ inputs.enable-lto || false }}

  build-artifact-wheel:
    needs: [check-harbor, check-selection]
    if: ${{ !cancelled() && needs.check-selection.result != 'failure' && (github.event_name == 'schedule' || inputs.run-multi-user-isolation-tests) }}
    uses: ./.github/workflows/build-artifact.yaml
    permissions:
      contents: read
      packages: write
    secrets: inherit
    with:
      harbor-prefix: ${{ needs.check-harbor.outputs.harbor-prefix }}
      build-type: ${{ inputs.build-type || 'Release' }}
      build-wheel: true
      platform: ${{ inputs.platform || 'Ubuntu 22.04' }}
      enable-lto: ${{ inputs.enable-lto || false }}

  galaxy-unit-tests:
    needs: [check-harbor, build-artifact]
    if: ${{ !cancelled() && (github.event_name == 'schedule' || inputs.run-unit-tests) && needs.build-artifact.result == 'success' }}
    secrets: inherit
    uses: ./.github/workflows/galaxy-unit-tests-impl.yaml
    with:
      docker-image: ${{ needs.build-artifact.outputs.dev-docker-image }}
      build-artifact-name: ${{ needs.build-artifact.outputs.build-artifact-name }}
      wheel-artifact-name: ${{ needs.build-artifact.outputs.wheel-artifact-name }}
      model: ${{ inputs.unit-model || 'all' }}
      topology: topology-6u

  galaxy-integration-tests:
    needs: [check-harbor, build-artifact]
    if: ${{ !cancelled() && (github.event_name == 'schedule' || inputs.run-integration-tests) && needs.build-artifact.result == 'success' }}
    secrets: inherit
    uses: ./.github/workflows/galaxy-integration-tests-impl.yaml
    with:
      docker-image: ${{ needs.build-artifact.outputs.dev-docker-image }}
      wheel-artifact-name: ${{ needs.build-artifact.outputs.wheel-artifact-name }}
      build-artifact-name: ${{ needs.build-artifact.outputs.build-artifact-name }}
      model: ${{ inputs.integration-model || 'all' }}

  galaxy-e2e-tests:
    needs: [check-harbor, build-artifact]
    if: ${{ !cancelled() && (github.event_name == 'schedule' || inputs.run-e2e-tests) && needs.build-artifact.result == 'success' }}
    secrets: inherit
    uses: ./.github/workflows/galaxy-e2e-tests-impl.yaml
    with:
      docker-image: ${{ needs.build-artifact.outputs.dev-docker-image }}
      wheel-artifact-name: ${{ needs.build-artifact.outputs.wheel-artifact-name }}
      build-artifact-name: ${{ needs.build-artifact.outputs.build-artifact-name }}
      # For scheduled runs: hardcode the full list of SKUs you want active.
      # For workflow_dispatch: derive from checkboxes.
      enabled-skus: >-
        ${{
          github.event_name == 'schedule'
            && 'wh_galaxy,bh_galaxy'
            || (
              inputs.wormhole && inputs.blackhole
                && 'wh_galaxy,bh_galaxy'
                || (
                  inputs.wormhole
                    && 'wh_galaxy'
                    || (
                      inputs.blackhole
                        && 'bh_galaxy'
                        || ''
                    )
                )
            )
        }}
      test-selection: ${{ inputs.e2e-test-selection || 'all' }}


  galaxy-multi-user-isolation-tests:
    needs: [check-selection, build-artifact-wheel]
    if: ${{ !cancelled() && (github.event_name == 'schedule' || inputs.run-multi-user-isolation-tests) && needs.build-artifact-wheel.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        arch: [wormhole_b0, blackhole]
        scenario: [single, tp2, tray]
        include:
          # Wormhole B0 configuration
          - arch: wormhole_b0
            scenario: single
            num_containers: 32
            chips_per_container: 1
            container_prefix: chip
            mesh_descriptor: n150_mesh_graph_descriptor.textproto
            test_path: tests/ttnn/unit_tests/operations/eltwise/test_fill.py
            test_args: "-k test_fill"
          - arch: wormhole_b0
            scenario: tp2
            num_containers: 16
            chips_per_container: 2
            container_prefix: tp2
            mesh_descriptor: n300_mesh_graph_descriptor.textproto
            test_path: tests/ttnn/unit_tests/operations/transformers/test_paged_cache_mask.py
            test_args: ""
          - arch: wormhole_b0
            scenario: tray
            num_containers: 4
            chips_per_container: 8
            container_prefix: tray
            mesh_descriptor: t3k_mesh_graph_descriptor.textproto
            test_path: tests/nightly/t3000/ccl/test_all_gather.py
            # Exclude fabric_ring tests for tray: t3k tray topology and mesh descriptor are mismatched, causing these cases to fail in CI.
            test_args: "-k 'not fabric_ring'"
          # Blackhole configuration
          - arch: blackhole
            scenario: single
            num_containers: 32
            chips_per_container: 1
            container_prefix: bh_chip
            mesh_descriptor: p150_mesh_graph_descriptor.textproto
            test_path: tests/ttnn/unit_tests/operations/eltwise/test_fill.py
            test_args: "-k test_fill"
          - arch: blackhole
            scenario: tp2
            num_containers: 16
            chips_per_container: 2
            container_prefix: bh_tp2
            mesh_descriptor: p150_x2_mesh_graph_descriptor.textproto
            test_path: tests/ttnn/unit_tests/operations/transformers/test_paged_cache_mask.py
            test_args: ""
          - arch: blackhole
            scenario: tray
            num_containers: 4
            chips_per_container: 8
            container_prefix: bh_tray
            mesh_descriptor: p150_x8_mesh_graph_descriptor.textproto
            test_path: tests/ttnn/unit_tests/operations/ccl/blackhole_CI/box/nightly/test_all_gather_nightly.py
            # The bh_1d_mesh_device fixture is function-scoped and opens/closes all 8 devices per test.
            # Repeated open/close cycles can randomly cause firmware re-initialization failures
            # ("Device N init: failed to initialize FW") due to a BH-specific firmware layer issue,
            # not a tt-metal issue. Since this CI only needs one representative test to verify
            # inter-container isolation, we narrow down to a single test combination to avoid the problem.
            test_args: "-k 'non-trace and not ring and not broken and linear_2D and bfloat_8 and not DRAM'"
          # ETH isolation reset tests. Implemented and working, but held until the
          # hardware is stable: BH tray_reset reproducibly drops tray 2's eth link.
          # - arch: wormhole_b0
          #   scenario: tray_reset
          #   repeat_count: 2
          #   num_containers: 4
          #   chips_per_container: 8
          #   container_prefix: tray_reset
          #   mesh_descriptor: t3k_mesh_graph_descriptor.textproto
          #   test_path: tests/nightly/t3000/ccl/test_all_gather.py
          #   test_args: "-k 'not fabric_ring'"
          # - arch: blackhole
          #   scenario: tray_reset
          #   repeat_count: 400
          #   num_containers: 4
          #   chips_per_container: 8
          #   container_prefix: bh_tray_reset
          #   mesh_descriptor: p150_x8_mesh_graph_descriptor.textproto
          #   test_path: tests/ttnn/unit_tests/operations/ccl/blackhole_CI/box/nightly/test_all_gather_nightly.py
          #   test_args: "-k 'non-trace and not ring and not broken and linear_2D and bfloat_8 and not DRAM'"
          # - arch: wormhole_b0
          #   scenario: asic_reset
          #   repeat_count: 1500
          #   num_containers: 32
          #   chips_per_container: 1
          #   container_prefix: chip_reset
          #   mesh_descriptor: n150_mesh_graph_descriptor.textproto
          #   test_path: tests/ttnn/unit_tests/operations/eltwise/test_fill.py
          #   test_args: "-k test_fill"
          # - arch: blackhole
          #   scenario: asic_reset
          #   repeat_count: 1500
          #   num_containers: 32
          #   chips_per_container: 1
          #   container_prefix: bh_chip_reset
          #   mesh_descriptor: p150_mesh_graph_descriptor.textproto
          #   test_path: tests/ttnn/unit_tests/operations/eltwise/test_fill.py
          #   test_args: "-k test_fill"
    runs-on:
      - topology-6u
      - arch-${{ matrix.arch }}
      - ${{ inputs.extra-tag || 'in-service' }}
    name: "${{ matrix.arch }} - ${{ matrix.scenario }} (${{ matrix.num_containers }}x${{ matrix.chips_per_container }})"
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        timeout-minutes: 20
        with:
          submodules: recursive
      - name: ⬇️ Download Build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        timeout-minutes: 10
        with:
          name: ${{ needs.build-artifact-wheel.outputs.build-artifact-name }}
      - name: Extract files
        run: tar --zstd -xvf ttm_any.tar.zst
      - name: ⬇️ Download Wheel
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        timeout-minutes: 10
        with:
          name: ${{ needs.build-artifact-wheel.outputs.wheel-artifact-name }}
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.10"
      - name: Install Wheel
        run: |
          python3 -m pip install --force-reinstall ttnn-*.whl
      - name: Reset and health-check cluster
        # A cold/degraded cluster yields an inconsistent descriptor that crashes
        # serialize_cluster_descriptor() in the next step (SYS-1634 / BH-84).
        timeout-minutes: 25
        env:
          DEV_IMAGE: ${{ needs.build-artifact-wheel.outputs.dev-docker-image }}
        run: |
          HEALTH_CHECK=./build/test/tt_metal/tt_fabric/test_system_health
          # Run the binary inside the dev image, which carries its runtime deps
          # (OpenMPI etc.) that are absent on the bare-metal runner. LD_LIBRARY_PATH
          # is *prepended* to the image's own value on purpose: build/lib holds the
          # extracted libtt_metal.so, while libmpi.so.40 (ULFM OpenMPI) only resolves
          # via the path the image already sets.
          health_check() {
            docker run --rm --privileged \
              --device /dev/tenstorrent --device /dev/ipmi0 \
              -v /dev/hugepages-1G:/dev/hugepages-1G \
              -v "$PWD":/work -w /work -e TT_METAL_HOME=/work \
              "$DEV_IMAGE" \
              bash -c 'export LD_LIBRARY_PATH="/work/build/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"; exec ./build/test/tt_metal/tt_fabric/test_system_health'
          }
          if [ ! -x "$HEALTH_CHECK" ]; then
            echo "::warning::test_system_health not in the build artifact; resetting without link verification"
            exec python3 .github/scripts/utils/cluster_recover.py reset
          fi
          # A full galaxy reset takes minutes, so a handful of attempts is the most
          # that fits the step timeout -- and a state that survives 3 resets is not
          # the transient cold-start this works around.
          ATTEMPTS=3
          for i in $(seq 1 $ATTEMPTS); do
            echo "Reset/health-check attempt $i of $ATTEMPTS"
            if python3 .github/scripts/utils/cluster_recover.py reset && health_check; then
              echo "Reset + health check passed"
              exit 0
            fi
            echo "Attempt $i failed, retrying in 5s..."
            sleep 5
          done
          echo "Cluster did not become healthy after $ATTEMPTS reset attempts"
          exit 1
      - name: Generate tray to PCIe device mapping
        # Retry with a reset in between: the first cluster open of a nightly run
        # can still hit a transient degraded state (manual re-runs historically
        # pass), so automate that recovery instead of failing the whole job.
        # Budget covers 3 mapping attempts plus the 2 galaxy resets between them.
        timeout-minutes: 20
        run: |
          # A board reset does not free a stale process still holding the device,
          # so kill holders too (sudo: needed to read other users' /proc fds).
          free_tt_devices() { sudo python3 .github/scripts/utils/cluster_recover.py free || true; sleep 3; }
          # A missing/unenumerated device yields an incomplete mapping that would
          # only fail later in create-files with no recovery; treat it as a failed
          # attempt so the reset+retry below can bring the device back.
          EXPECTED=$(( ${{ matrix.num_containers }} * ${{ matrix.chips_per_container }} ))
          generate_ok() {
            local count
            python3 .github/scripts/utils/generate_tray_mapping.py || return 1
            count=$(python3 -c "import yaml; d=yaml.safe_load(open('tray_to_pcie_device_mapping.yaml')); print(sum(len(v) for v in d.get('device_mapping', {}).values()))") || return 1
            if [ "$count" -ne "$EXPECTED" ]; then
              echo "Incomplete cluster: mapped $count devices, expected $EXPECTED"
              return 1
            fi
          }
          ATTEMPTS=3
          free_tt_devices
          for i in $(seq 1 $ATTEMPTS); do
            echo "generate_tray_mapping attempt $i of $ATTEMPTS"
            if generate_ok; then
              echo "Tray mapping generated successfully"
              exit 0
            fi
            echo "generate_tray_mapping failed on attempt $i"
            if [ "$i" -lt "$ATTEMPTS" ]; then
              free_tt_devices
              echo "Resetting cluster before retry..."
              python3 .github/scripts/utils/cluster_recover.py reset || true
              sleep 10
            fi
          done
          echo "generate_tray_mapping failed after $ATTEMPTS attempts"
          exit 1
      - name: Create Docker Compose file
        run: |
          TRAY_MAPPING_ARG=""
          if [ "${{ matrix.scenario }}" = "tray" ] || [ "${{ matrix.scenario }}" = "tp2" ] || [ "${{ matrix.scenario }}" = "tray_reset" ]; then
            TRAY_MAPPING_ARG="--tray-mapping-file tray_to_pcie_device_mapping.yaml"
          fi
          python3 .github/scripts/utils/multi-user-create-files.py \
            --image "${{ needs.build-artifact-wheel.outputs.dev-docker-image }}" \
            --num-containers ${{ matrix.num_containers }} \
            --chips-per-container ${{ matrix.chips_per_container }} \
            $TRAY_MAPPING_ARG \
            --mesh-descriptor ${{ matrix.mesh_descriptor }} \
            --container-prefix ${{ matrix.container_prefix }}
      - name: Pull container image
        # Pull the dev image up-front so its (multi-minute) download does not eat
        # into the container-readiness wait budget below. Previously the image
        # pull happened inside `docker compose up -d` while the readiness timer
        # was already running, so a slow pull timed the wait out on its first
        # iteration before any container could write its marker file.
        timeout-minutes: 15
        run: |
          # --ignore-pull-failures: `up -d` below pulls when the image is
          # missing, so a registry blip must not fail a cache-warm job.
          docker compose -p multi-user -f multi-user-dc.yaml pull --ignore-pull-failures
      - name: Run Docker Compose
        timeout-minutes: 15
        run: |
          shopt -s nullglob
          CONTAINERS_DIR=".multi-user-galaxy-docker-files"
          REQUIRED_CONTAINERS=${{ matrix.num_containers }}
          # Budget covers only in-container dependency install (uv pip install)
          # across all containers, not the image pull (done in the previous step).
          TIMEOUT=600
          CONTAINER_PREFIX="${{ matrix.container_prefix }}"

          rm -rf "$CONTAINERS_DIR"
          mkdir -p "$CONTAINERS_DIR"

          docker compose -p multi-user -f multi-user-dc.yaml up -d

          # Start timing only after containers are up, so the wait measures
          # container readiness rather than image-pull latency.
          EPOCH_START=$(date +%s)

          # wait for container marker files to appear (with timeout)
          while true; do
            files=( "$CONTAINERS_DIR"/${CONTAINER_PREFIX}-*.txt )
            count=${#files[@]}
            elapsed=$(( $(date +%s) - EPOCH_START))
            if [ "$count" -ge "$REQUIRED_CONTAINERS" ]; then
              break
            fi
            if [ "$elapsed" -ge "$TIMEOUT" ]; then
              echo "Error: Not all $REQUIRED_CONTAINERS containers started within $TIMEOUT seconds (found $count)."
              exit 1
            fi
            sleep 1
          done

          echo "All $REQUIRED_CONTAINERS docker containers have started (found $count)."

      - name: Run the tests
        if: matrix.scenario != 'tray_reset' && matrix.scenario != 'asic_reset'
        timeout-minutes: 15
        run: |
          NUM_CONTAINERS=${{ matrix.num_containers }}
          CONTAINER_PREFIX="${{ matrix.container_prefix }}"
          TEST_PATH="${{ matrix.test_path }}"
          TEST_ARGS="${{ matrix.test_args }}"
          RESULTS_DIR=".multi-user-test-results"

          mkdir -p "$RESULTS_DIR"

          run_test() {
            testname="$1"
            command="$2"
            pids=()
            for i in $(seq 0 $(( NUM_CONTAINERS - 1 ))); do
              container="${CONTAINER_PREFIX}-${i}"
              echo ">>> Running $testname in $container"
              (
                docker exec "$container" bash -c "$command" | sed "s/^/[$container] /"
                status=${PIPESTATUS[0]}
                echo $status > "$RESULTS_DIR/${container}.status"
                exit $status
              ) &
              pids+=($!)
            done

            status=0
            for pid in "${pids[@]}"; do
              if ! wait "$pid"; then
                status=1
              fi
            done

            if [ $status -ne 0 ]; then
              exit 1
            fi
          }

          export -f run_test
          export NUM_CONTAINERS
          export CONTAINER_PREFIX
          export RESULTS_DIR

          TEST_NAME=$(basename "${TEST_PATH}" .py)
          # Output: ">>> Running single/test_fill in chip-0" etc.
          run_test "${{ matrix.scenario }}/${TEST_NAME}" "pytest -v ${TEST_PATH} ${TEST_ARGS}" || true

      - name: Run reset isolation test
        if: matrix.scenario == 'tray_reset' || matrix.scenario == 'asic_reset'
        # Survivors hold one long run each; ~20min at the repeat_counts above.
        timeout-minutes: 35
        run: |
          if [ "${{ matrix.scenario }}" = "tray_reset" ]; then
            RESET_DEVICE_IDS=$(python3 -c "
          import yaml
          with open('tray_to_pcie_device_mapping.yaml') as f:
              m = yaml.safe_load(f)
          devices = m['device_mapping']['1']
          print(','.join(str(d) for d in devices))
          ")
          else
            # asic_reset: reset device 0 only (used by chip_reset-0 / bh_chip_reset-0)
            RESET_DEVICE_IDS="0"
          fi
          bash .github/scripts/utils/run-reset-isolation-test.sh \
            ${{ matrix.num_containers }} \
            "${{ matrix.container_prefix }}" \
            "${{ matrix.test_path }}" \
            "${{ matrix.test_args }}" \
            "$RESET_DEVICE_IDS" \
            ${{ matrix.repeat_count }}

      - name: Check test results
        run: |
          RESULTS_DIR=".multi-user-test-results"
          NUM_CONTAINERS=${{ matrix.num_containers }}
          CONTAINER_PREFIX="${{ matrix.container_prefix }}"

          failed=0
          for i in $(seq 0 $(( NUM_CONTAINERS - 1 ))); do
            container="${CONTAINER_PREFIX}-${i}"
            status_file="$RESULTS_DIR/${container}.status"
            if [ -f "$status_file" ]; then
              status=$(cat "$status_file")
              if [ "$status" != "0" ]; then
                failed=1
              fi
            else
              # No status file means container didn't complete
              failed=1
            fi
          done

          if [ $failed -ne 0 ]; then
            exit 1
          fi

      - name: Tear down containers
        if: always()
        run: |
          docker compose -p multi-user -f multi-user-dc.yaml down

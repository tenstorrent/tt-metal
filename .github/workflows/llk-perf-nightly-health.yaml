name: "LLK perf nightly health"

on:
  # One check a day, after both nightlies of llk-perf.yaml (03:00 and 05:00 UTC, up to 4 hours each).
  # A schedule also reports a nightly that did not run, which a completion of that nightly never could.
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: "Day to check, YYYY-MM-DD (blank = today, UTC)"
        required: false
        type: string

permissions:
  actions: read
  contents: read

jobs:
  health:
    name: "Check the nightlies and report"
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2 cachew: keep
        timeout-minutes: 20
        with:
          fetch-depth: 1
          sparse-checkout: tt_metal/tt-llk/perf
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.10'
      - name: Check and send
        env:
          GH_TOKEN: ${{ github.token }}
          SLACK_BOT_TOKEN: ${{ secrets.LLK_SLACK_REPORTING_BOT_TOKEN }}
          DAY: ${{ inputs.date }}
        run: |
          python3 tt_metal/tt-llk/perf/nightly_health.py --repo "$GITHUB_REPOSITORY" ${DAY:+--date "$DAY"} \
            --post U0BCPNHUF43 "${{ secrets.LLK_PERF_GATE_SLACK_CHANNEL_ID }}"
      - name: Report a failed check
        if: failure()
        env:
          SLACK_BOT_TOKEN: ${{ secrets.LLK_SLACK_REPORTING_BOT_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -sS --fail-with-body -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer ${SLACK_BOT_TOKEN}" -H "Content-type: application/json; charset=utf-8" \
            --data "{\"channel\": \"U0BCPNHUF43\", \"text\": \":warning: LLK perf nightly health check failed: ${RUN_URL}\"}"

name: CodeOwner Bypass

# Lets a PR skip code-owner review without the infra team owning the merge.
#
#   /codeowners bypass  A member of @tenstorrent/codeowner-bypass blesses the PR.
#                       The only effect is the `codeowner-bypass` label.
#
# The developer then just clicks "Merge when ready" like on any other PR. When ALL
# of the following hold, this workflow puts the PR in the merge queue as the bot
# (CODEOWNERS_GROUP_ANALYSIS_PAT), which is a bypass actor on the
# `main-codeowner-bypass` ruleset, so code-owner review is skipped:
#
#   1. the PR carries `codeowner-bypass`, and the latest `labeled` event for it was
#      made by the bot (a label added by hand by someone with write access doesn't count)
#   2. auto-merge ("Merge when ready") is enabled on the PR
#   3. every status check the ruleset requires is green on the PR's head commit
#
# The same idempotent check runs from every event that can complete the condition,
# and whichever fires last acts: auto-merge enabled, the label applied, or a workflow
# that produces a required check finishing. No polling. If a PR is evicted from the
# queue GitHub disables auto-merge, so the developer clicks "Merge when ready" again,
# exactly as on a regular PR.
#
# The decisions live in .github/scripts/codeowner_bypass.py (unit-tested in
# test_codeowner_bypass.py). Triggers run from the default branch (issue_comment,
# pull_request_target, workflow_run) and only the default branch's .github/scripts is
# checked out. PR code is never checked out.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [auto_merge_enabled, labeled]
  workflow_run:
    # Workflows that produce the required checks (see the main ruleset). Keep in sync.
    workflows:
      - PR Gate
      - Merge Gate
      - "[post-commit] all - Static checks, linters etc."
    types: [completed]

permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: read
  statuses: read

env:
  BYPASS_LABEL: codeowner-bypass
  BYPASS_TEAM: codeowner-bypass
  ORG: tenstorrent
  GH_TOKEN: ${{ secrets.CODEOWNERS_GROUP_ANALYSIS_PAT }}
  GH_REPO: ${{ github.repository }}

jobs:
  bless:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/codeowner')
    runs-on: ubuntu-slim
    concurrency:
      group: codeowner-bypass-${{ github.event.issue.number }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Bless the PR
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_ID: ${{ github.event.comment.id }}
          COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: python3 .github/scripts/codeowner_bypass.py bless

  enqueue:
    # No filter on the triggering run's conclusion: all required checks can be green when
    # that workflow was skipped or only a non-required job failed. The script verifies
    # the required checks and is the only judge of eligibility.
    if: >-
      github.event_name == 'pull_request_target' && github.event.label.name == 'codeowner-bypass' ||
      github.event_name == 'pull_request_target' && github.event.action == 'auto_merge_enabled' ||
      github.event_name == 'workflow_run'
    runs-on: ubuntu-slim
    concurrency:
      group: codeowner-bypass-enqueue-${{ github.event.pull_request.number || github.event.workflow_run.head_sha }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Enqueue a blessed PR once everything is satisfied
        env:
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: python3 .github/scripts/codeowner_bypass.py enqueue

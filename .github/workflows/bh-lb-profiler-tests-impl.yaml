name: "[internal] Blackhole LoudBox profiler tests impl"

on:
  workflow_call:
    inputs:
      docker-image:
        required: true
        type: string
      prebuilt-image:
        required: false
        type: string
        default: ""
        description: >-
          Env image carrying the source tree and build output at /work. When set,
          the job mounts no /work, checks out only .github, and fetches no
          artifact. Empty falls back to the artifact path, which is what forks and
          a failed bake get.
      build-artifact-name:
        required: true
        type: string
      wheel-artifact-name:
        required: true
        type: string
      ref:
        required: false
        type: string
        default: ""
      enable-watcher:
        required: false
        type: boolean
        default: false
      enable-lightweight-kernel-asserts:
        required: false
        type: boolean
        default: false
      enable-llk-asserts:
        required: false
        type: boolean
        default: false

jobs:
  load-test-matrix:
    runs-on: ubuntu-slim
    outputs:
      matrix: ${{ steps.build-matrix.outputs.matrix }}
    env:
      TESTS_YAML_PATH: ./tests/pipeline_reorg/bh_lb_profiler_tests.yaml
    steps:
      - name: Checkout the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        timeout-minutes: 20
        with:
          sparse-checkout: |
            .github
            tests/pipeline_reorg
          sparse-checkout-cone-mode: true
      - name: Install dependencies
        run: pip3 install PyYAML
      - name: Build test matrix
        id: build-matrix
        uses: tenstorrent/tt-metal/.github/actions/prepare-test-matrix@main
        with:
          tests-yaml: ${{ env.TESTS_YAML_PATH }}
          enabled-skus: "bh_loudbox"
          sku-config: ./.github/sku_config.yaml

  bh-lb-profiler-tests:
    needs: load-test-matrix
    strategy:
      fail-fast: false
      matrix:
        test-group: ${{ fromJson(needs.load-test-matrix.outputs.matrix) }}
    name: ${{ matrix.test-group.name }}
    runs-on: ${{ matrix.test-group.runs_on }}
    container:
      image: ${{ inputs.prebuilt-image || inputs.docker-image || 'docker-image-unresolved!' }}
      env:
        TT_METAL_HOME: /work
        # Only on the image path. There /work/ttnn is required because no wheel is
        # installed: it is a namespace dir whose package is /work/ttnn/ttnn, and
        # /work/tools carries the `tracy` module _ttnn imports during init on a
        # tracy-enabled build, which this caller is. On the artifact path a wheel IS
        # installed and prepending the source tree would shadow it.
        PYTHONPATH: ${{ inputs.prebuilt-image != '' && '/work:/work/ttnn:/work/tools' || '/work' }}
        LD_LIBRARY_PATH: /work/build/lib
        ARCH_NAME: blackhole
        LOGURU_LEVEL: INFO
        PROFILER_SCRIPTS_ROOT: /work/tools/tracy
        PROFILER_TEST_SCRIPTS_ROOT: /work/tests/tt_metal/tools/profiler
        PROFILER_ARTIFACTS_DIR: /work/generated/profiler
        PROFILER_OUTPUT_DIR: /work/generated/profiler/reports
        DONT_USE_VIRTUAL_ENVIRONMENT: 1
      volumes:
        # The image owns /work, so no bind mount: one would mask the payload. A
        # single-path entry is an anonymous volume on an unused path.
        - ${{ inputs.prebuilt-image != '' && '/no_work_mount' || format('{0}/docker-job:/work', github.workspace) }}
        - /dev/hugepages-1G:/dev/hugepages-1G
        - /mnt/MLPerf:/mnt/MLPerf:ro
      options: "--device /dev/tenstorrent"
    defaults:
      run:
        shell: bash
        working-directory: /work
    steps:
      - name: 🧬 Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        timeout-minutes: 20
        with:
          ref: ${{ inputs.ref || github.sha }}
          # With an image the source is already at /work; the workspace copy only
          # has to satisfy `uses: ./docker-job/...`, which resolves against it.
          submodules: ${{ inputs.prebuilt-image == '' && 'recursive' || 'false' }}
          sparse-checkout: ${{ inputs.prebuilt-image != '' && '.github' || '' }}
          path: docker-job
      - name: Mark repository as safe directory
        run: git config --global --add safe.directory $GITHUB_WORKSPACE
      - name: ⬇️  Setup Job
        uses: ./docker-job/.github/actions/setup-job
        timeout-minutes: 10
        with:
          build-artifact-name: ${{ inputs.build-artifact-name }}
          wheel-artifact-name: ${{ inputs.wheel-artifact-name }}
          env-from-image: ${{ inputs.prebuilt-image != '' }}
          enable-watcher: ${{ inputs.enable-watcher }}
          enable-lightweight-kernel-asserts: ${{ inputs.enable-lightweight-kernel-asserts }}
          enable-llk-asserts: ${{ inputs.enable-llk-asserts }}
      - name: Ensure BH links online
        uses: ./docker-job/.github/actions/ensure-bh-links-online
        timeout-minutes: 10
      - name: ${{ matrix.test-group.name }}
        timeout-minutes: ${{ matrix.test-group.timeout }}
        run: |
          ${{ matrix.test-group.cmd }}
      - name: 📊 CCache Report
        if: ${{ !cancelled() }}
        run: |
          echo "::group::CCache Statistics"
          ccache --show-stats || echo "ccache stats not available"
          echo "::endgroup::"
      - uses: tenstorrent/tt-metal/.github/actions/upload-artifact-with-job-uuid@main
        timeout-minutes: 10
        if: ${{ !cancelled() }}
        with:
          prefix: "test_reports_"
      - uses: tenstorrent/tt-metal/.github/actions/cleanup@main
        if: always()

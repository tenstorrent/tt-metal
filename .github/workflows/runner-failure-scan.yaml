name: "(triage) Runner Failure Scan"

on:
  schedule:
    # Every four hours, offset from :00 which GitHub sheds first under load.
    - cron: "15 */4 * * *"
  workflow_dispatch:
    inputs:
      hours:
        description: "Number of hours to look back"
        required: false
        default: "24"
      force-fresh:
        description: "Ignore previous checked-job state and rescan matching failed jobs"
        required: false
        type: boolean
        default: false
      post-to-slack:
        description: "Post Slack notifications for manual runs"
        required: false
        type: boolean
        default: false

permissions:
  actions: read
  contents: read

concurrency:
  group: runner-failure-scan-${{ github.ref }}
  cancel-in-progress: false

env:
  # Slack channel ID for #runner-failure-vibe-alerts. Not a secret.
  RUNNER_FAILURE_SCAN_CHANNEL: C0BHAKAULEN
  RUNNER_FAILURE_SCAN_WORKFLOWS: |
    # Jobs are included unless include_exact or include_prefixes is set.
    # Exclusions are applied after inclusions.
    repository: tenstorrent/tt-metal

    workflows:
      - name: vllm-model-tests
        workflow_id: vllm-model-tests.yaml
        include_prefixes:
          - "vllm-tests /"

      - name: all-model-tests
        workflow_id: all-model-tests.yaml
        exclude_exact:
          - preflight
          - build-artifact
          - build-artifact-vllm
          - check-farbot
          - check-harbor
        exclude_prefixes:
          - "build-artifact /"
          - "build-artifact-vllm /"
          - "check-farbot /"
          - "check-harbor /"

      - name: models-t1-e2e-tests
        workflow_id: models-t1-e2e-tests.yaml
        include_prefixes:
          - "models-e2e-tests /"

      - name: models-t1-unit-tests
        workflow_id: models-t1-unit-tests.yaml
        include_prefixes:
          - "models-unit-tests /"

      - name: models-t2-unit-tests
        workflow_id: models-t2-unit-tests.yaml
        include_prefixes:
          - "models-unit-tests /"

      - name: models-t3-unit-tests
        workflow_id: models-t3-unit-tests.yaml
        include_prefixes:
          - "models-unit-tests /"

      - name: models-t2-e2e-tests
        workflow_id: models-t2-e2e-tests.yaml
        include_prefixes:
          - "models-e2e-tests /"

      - name: models-t3-e2e-tests
        workflow_id: models-t3-e2e-tests.yaml
        include_prefixes:
          - "models-e2e-tests /"

      - name: models-t1-sweep-tests
        workflow_id: models-t1-sweep-tests.yaml
        include_prefixes:
          - "models-sweep-tests /"

      - name: models-t2-sweep-tests
        workflow_id: models-t2-sweep-tests.yaml
        include_prefixes:
          - "models-sweep-tests /"

      - name: models-t1-device-perf-tests
        workflow_id: models-t1-device-perf-tests.yaml
        include_prefixes:
          - "models-device-perf-tests /"

jobs:
  # Scans for failures. Runs from any branch and holds no Slack token.
  # Branch runs rescan from scratch and never feed state to main.
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      runner_matrix: ${{ steps.runner_matrix.outputs.runner_matrix }}
      has_report: ${{ steps.check.outputs.has_report }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2 cachew: keep
        timeout-minutes: 20
        with:
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: true

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/scripts/runner_failure_scan_requirements.txt

      - name: Install scanner dependencies
        run: python3 -m pip install -r .github/scripts/runner_failure_scan_requirements.txt

      - name: Restore previous checked-job state
        if: github.ref == 'refs/heads/main' && github.event.inputs.force-fresh != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .runner-failure-state
          latest_run_id="$(gh run list \
            --workflow runner-failure-scan.yaml \
            --branch main \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId // ""' || true)"
          if [[ -n "$latest_run_id" ]]; then
            echo "Restoring checked-job state from workflow run $latest_run_id"
            gh run download "$latest_run_id" \
              --name runner-failure-state \
              --dir .runner-failure-state || true
          else
            echo "No previous successful runner-failure-scan run found."
          fi

      - name: Scan recent workflow failures
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          FORCE_FRESH: ${{ github.ref != 'refs/heads/main' || github.event.inputs.force-fresh == 'true' }}
          HOURS: ${{ github.event.inputs.hours || '24' }}
        run: |
          mkdir -p out
          printf '%s\n' "$RUNNER_FAILURE_SCAN_WORKFLOWS" > out/runner_failure_scan_workflows.yaml
          args=(
            --config out/runner_failure_scan_workflows.yaml
            --hours "$HOURS"
            --state-in .runner-failure-state/runner_failure_state.json
            --state-out out/runner_failure_state.json
            --report-json out/runner_failure_report.json
            --report-md out/runner_failure_report.md
          )
          if [[ "$FORCE_FRESH" == "true" ]]; then
            args+=(--force-fresh)
          fi
          python3 .github/scripts/runner_failure_scan.py "${args[@]}"

      - name: Check for report
        id: check
        if: always()
        run: |
          if [[ -f out/runner_failure_report.json ]]; then
            echo "has_report=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Preview scan health alert
        if: always() && steps.check.outputs.has_report == 'true'
        run: |
          python3 .github/scripts/runner_failure_post_slack.py \
            --dry-run \
            --scan-health-report-json out/runner_failure_report.json

      - name: Build runner report matrix
        id: runner_matrix
        if: always() && hashFiles('out/runner_failure_report.json') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          HOURS: ${{ github.event.inputs.hours || '24' }}
        run: |
          runner_count="$(jq '(.runner_failures // {}) | length' out/runner_failure_report.json)"
          if [[ "$runner_count" -gt 0 ]]; then
            python3 .github/scripts/runner_failure_report.py \
              --hours "$HOURS" \
              --owner-repo tenstorrent/tt-metal \
              --export-live-jobs-json out/live_github_jobs.json || {
                echo "warning: live GitHub enrichment export failed; continuing without precomputed enrichment."
                printf '{"jobs":[]}\n' > out/live_github_jobs.json
              }
          else
            printf '{"jobs":[]}\n' > out/live_github_jobs.json
          fi
          runner_matrix="$(
            jq -c --slurpfile live out/live_github_jobs.json '
              (($live[0].jobs // []) | group_by(.runner_name | ascii_downcase) |
                map({key: (.[0].runner_name | ascii_downcase), value: .}) | from_entries) as $live_by_runner |
              (.runner_failures // {}) | to_entries |
              map({
                runner_name: .key,
                triggering_failures: .value,
                enrichment_jobs: ($live_by_runner[(.key | ascii_downcase)] // [])
              })
            ' out/runner_failure_report.json
          )"
          echo "runner_matrix=$runner_matrix" >> "$GITHUB_OUTPUT"
          echo "Runner report matrix: $runner_matrix"

      - name: Add report to step summary
        if: always() && hashFiles('out/runner_failure_report.md') != ''
        run: cat out/runner_failure_report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload runner failure report
        if: always() && hashFiles('out/runner_failure_report.*') != ''
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: runner-failure-scan-report-${{ github.run_id }}
          path: |
            out/runner_failure_report.json
            out/runner_failure_report.md
          retention-days: 14

      - name: Upload checked-job state
        if: always() && hashFiles('out/runner_failure_state.json') != ''
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: runner-failure-state
          path: out/runner_failure_state.json
          retention-days: 30

  # Posts the scan health alert. Only this job reads SLACK_BOT_TOKEN, from the
  # runner-failure-alerts-slack environment, which allows only main.
  post-scan-health:
    needs: scan
    if: always() && needs.scan.outputs.has_report == 'true' && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event.inputs.post-to-slack == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: runner-failure-alerts-slack
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2 cachew: keep
        timeout-minutes: 20
        with:
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: true

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"

      - name: Download runner failure scan report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: runner-failure-scan-report-${{ github.run_id }}
          path: out

      - name: Post scan health alert
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          DEFAULT_SLACK_CHANNEL: ${{ env.RUNNER_FAILURE_SCAN_CHANNEL }}
        run: |
          python3 .github/scripts/runner_failure_post_slack.py \
            --scan-health-report-json out/runner_failure_report.json \
            --slack-channel "$DEFAULT_SLACK_CHANNEL"

  runner-report:
    needs: scan
    if: ${{ always() && needs.scan.outputs.runner_matrix != '' && needs.scan.outputs.runner_matrix != '[]' }}
    permissions:
      actions: read
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        runner: ${{ fromJson(needs.scan.outputs.runner_matrix) }}
    uses: ./.github/workflows/runner-failure-report.yaml
    with:
      runner_name: ${{ matrix.runner.runner_name }}
      triggering_failures_json: ${{ toJson(matrix.runner.triggering_failures) }}
      enrichment_jobs_json: ${{ toJson(matrix.runner.enrichment_jobs) }}
      run_enrichment: false
      hours: ${{ github.event.inputs.hours || '24' }}
      # The report workflow posts only from main, whatever this says.
      post_to_slack: ${{ github.event_name == 'schedule' || github.event.inputs.post-to-slack == 'true' }}

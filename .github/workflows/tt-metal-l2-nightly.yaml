name: "Nightly tt-metal L2 tests"

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      run_wormhole:
        description: "Run wormhole tests"
        required: false
        type: boolean
        default: true
      run_blackhole:
        description: "Run blackhole tests"
        required: false
        type: boolean
        default: true
      run_didt_tests:
        description: "Run DIDT tests"
        required: false
        type: boolean
        default: false
      run_cpp_tests:
        description: "Run cpp unit tests"
        required: false
        type: boolean
        default: false
      run_llk_unit_tests:
        description: "Run LLK Unit Tests (slow dispatch)"
        required: false
        type: boolean
        default: false
      run_p100_sanity_tests:
        description: "Run P100 Sanity Tests"
        required: false
        type: boolean
        default: false
      run_tutorials_tests:
        description: "Run TTNN Tutorials"
        required: false
        type: boolean
        default: false
      run_tt_train_unit_tests:
        description: "Run TT-Train Unit Tests"
        required: false
        type: boolean
        default: false
      run_tt_train_perf_pretraining_tests:
        description: "Run TT-Train Pretraining Tests"
        required: false
        type: boolean
        default: false
      run_tt_train_perf_finetuning_tests:
        description: "Run TT-Train Finetuning Tests"
        required: false
        type: boolean
        default: false
      run_tt_cnn_unit_tests:
        description: "Run tt-cnn-unit-tests"
        required: false
        type: boolean
        default: false
      run_ccl_tests:
        description: "Run CCL tests"
        required: false
        type: boolean
        default: false
      run_triage_tests:
        description: "Run tt-triage tests"
        required: false
        type: boolean
        default: true
      additional_test_categories:
        description: >
          Additional test categories to run (comma-separated, e.g.,
          conv,pool,sdpa,eltwise,matmul,experimental,docs_examples,ops_docs_check,misc,moreh,fused,reduction,data_movement,transformers,compute_fused)
        required: false
        type: string
        default: ""
      platform:
        required: false
        type: choice
        default: "Ubuntu 22.04"
        options:
          - "Ubuntu 22.04"
          - "Ubuntu 24.04"
        description: "Platform to build and test"
      build-type:
        required: false
        type: choice
        default: Release
        options:
          - Release
          - Debug
          - RelWithDebInfo
          - ASan
          - TSan
        description: "Build type configuration"
      enable-lto:
        required: false
        type: boolean
        default: false
        description: "Enable Link Time Optimization (LTO)"
      enable-llk-asserts:
        description: "Enable LLK asserts"
        required: false
        type: boolean
        default: false

jobs:
  check-harbor:
    uses: ./.github/workflows/check-harbor.yaml
  build-artifact:
    needs: check-harbor
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/build-artifact.yaml
    permissions:
      contents: read
      packages: write
    secrets: inherit
    with:
      harbor-prefix: ${{ needs.check-harbor.outputs.harbor-prefix }}
      build-type: ${{ inputs.build-type || 'Release' }}
      build-inplace-wheel: true
      tracy: true
      # UMD test binaries are needed by the umd-p100-tests job below.
      build-umd-tests: true
      skip-tt-train: false
      platform: ${{ inputs.platform || 'Ubuntu 22.04' }}
      enable-lto: ${{ inputs.enable-lto || false }}
  generate-arch-matrix:
    runs-on: ubuntu-slim
    outputs:
      l2-nightly-skus: ${{ steps.parse.outputs.l2-nightly-skus }}
    steps:
      - id: parse
        run: |
          # Scheduled runs always cover both archs; workflow_dispatch reflects checkbox state.
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            run_wormhole=true
            run_blackhole=true
          else
            run_wormhole='${{ inputs.run_wormhole }}'
            run_blackhole='${{ inputs.run_blackhole }}'
          fi

          if [[ "$run_wormhole" != "true" && "$run_blackhole" != "true" ]]; then
            echo "❌ Error: Neither wormhole nor blackhole was selected."
            exit 1
          fi

          # SKU coverage spanning every L2 nightly test yaml entry.
          l2_nightly_skus=()
          if [[ "$run_wormhole" == "true" ]]; then
            l2_nightly_skus+=("wh_n150" "wh_n300" "wh_n150_civ2" "wh_n300_civ2" "sim_wh_n150" "wh_galaxy")
          fi
          if [[ "$run_blackhole" == "true" ]]; then
            l2_nightly_skus+=("bh_p100" "bh_p150b_civ2" "bh_p150b_civ2_viommu" "sim_bh_p150" "bh_p300" "bh_quietbox_2" "bh_galaxy")
          fi
          l2_nightly_skus_str=$(IFS=,; echo "${l2_nightly_skus[*]}")
          echo "l2-nightly-skus=$l2_nightly_skus_str" >> $GITHUB_OUTPUT

  resolve-docker-pull-refs:
    needs: [check-harbor, build-artifact]
    if: ${{ !cancelled() && needs.build-artifact.result == 'success' }}
    uses: ./.github/workflows/resolve-docker-pull-refs.yaml
    with:
      harbor-prefix: ${{ needs.check-harbor.outputs.harbor-prefix }}
      dev-docker-image: ${{ needs.build-artifact.outputs.dev-docker-image }}
      basic-ttnn-runtime-docker-image: ${{ needs.build-artifact.outputs.basic-ttnn-runtime-docker-image }}

  # =============================================================================
  # ttsim team
  # =============================================================================
  ttsim-unit-tests:
    needs: [build-artifact, generate-arch-matrix]
    if: |
      needs.generate-arch-matrix.outputs.l2-nightly-skus != '' && (
        github.event_name == 'schedule' || contains(format(',{0},', inputs.additional_test_categories), ',compute_fused,')
      )
    secrets: inherit
    uses: ./.github/workflows/ttsim-unit-tests-impl.yaml
    with:
      docker-image: ${{ needs.build-artifact.outputs.dev-docker-image }}
      build-artifact-name: ${{ needs.build-artifact.outputs.build-artifact-name }}
      wheel-artifact-name: ${{ needs.build-artifact.outputs.wheel-artifact-name }}
      enabled-skus: ${{ needs.generate-arch-matrix.outputs.l2-nightly-skus }}
      additional_test_categories: >-
        ${{ github.event_name == 'schedule' && 'compute_fused'
        || inputs.additional_test_categories }}
      enable-llk-asserts: ${{ inputs.enable-llk-asserts || false }}

  # =============================================================================
  # Syseng team
  # =============================================================================
  syseng-didt-tests:
    needs: [build-artifact, generate-arch-matrix]
    if: |
      (github.event_name == 'schedule' || inputs.run_didt_tests) &&
      needs.generate-arch-matrix.outputs.l2-nightly-skus != ''
    secrets: inherit
    uses: ./.github/workflows/syseng-didt-tests-impl.yaml
    with:
      docker-image: ${{ needs.build-artifact.outputs.dev-docker-image }}
      build-artifact-name: ${{ needs.build-artifact.outputs.build-artifact-name }}
      wheel-artifact-name: ${{ needs.build-artifact.outputs.wheel-artifact-name }}
      enabled-skus: ${{ needs.generate-arch-matrix.outputs.l2-nightly-skus }}

  # =============================================================================
  # TTNN team
  # =============================================================================
  ops-unit-tests:
    needs: [build-artifact, generate-arch-matrix]
    if: |
      needs.generate-arch-matrix.outputs.l2-nightly-skus != '' && (
        github.event_name == 'schedule' || inputs.additional_test_categories != '' || inputs.run_cpp_tests || inputs.run_ccl_tests
      )
    secrets: inherit
    uses: ./.github/workflows/ops-unit-tests-impl.yaml
    with:
      docker-image: ${{ needs.build-artifact.outputs.dev-docker-image }}
      build-artifact-name: ${{ needs.build-artifact.outputs.build-artifact-name }}
      wheel-artifact-name: ${{ needs.build-artifact.outputs.wheel-artifact-name }}
      enabled-skus: ${{ needs.generate-arch-matrix.outputs.l2-nightly-skus }}
      additional_test_categories: >-
        ${{ (github.event_name == 'schedule' &&
        'conv,matmul,fused,reduction,experimental,pool,eltwise,transformers,moreh,misc,sdpa,data_movement,ccl,docs_examples,cpp_accessor,cpp_lab_examples')
        || (inputs.run_ccl_tests && inputs.run_cpp_tests && format('{0},ccl,cpp_accessor,cpp_lab_examples', inputs.additional_test_categories))
        || (inputs.run_ccl_tests && format('{0},ccl', inputs.additional_test_categories))
        || (inputs.run_cpp_tests && format('{0},cpp_accessor,cpp_lab_examples', inputs.additional_test_categories))
        || inputs.additional_test_categories }}
      enable-llk-asserts: ${{ inputs.enable-llk-asserts || false }}
  ops-integration-tests:
    needs: [build-artifact, generate-arch-matrix]
    if: |
      (github.event_name == 'schedule' || contains(format(',{0},', inputs.additional_test_categories), ',ops_docs_check,')) &&
      needs.generate-arch-matrix.outputs.l2-nightly-skus != ''
    secrets: inherit
    uses: ./.github/workflows/ops-integration-tests-impl.yaml
    with:
      docker-image: ${{ needs.build-artifact.outputs.dev-docker-image }}
      build-artifact-name: ${{ needs.build-artifact.outputs.build-artifact-name }}
      wheel-artifact-name: ${{ needs.build-artifact.outputs.wheel-artifact-name }}
      enabled-skus: ${{ needs.generate-arch-matrix.outputs.l2-nightly-skus }}
      additional_test_categories: >-
        ${{ github.event_name == 'schedule' && 'ops_docs_check'
        || inputs.additional_test_categories }}
      enable-llk-asserts: ${{ inputs.enable-llk-asserts || false }}
  ttnn-integration-tests:
    needs: [build-artifact, generate-arch-matrix]
    if: |
      (github.event_name == 'schedule' || inputs.run_tutorials_tests) &&
      needs.generate-arch-matrix.outputs.l2-nightly-skus != ''
    secrets: inherit
    uses: ./.github/workflows/ttnn-integration-tests-impl.yaml
    with:
      docker-image: ${{ needs.build-artifact.outputs.basic-ttnn-runtime-docker-image }}
      build-artifact-name: ${{ needs.build-artifact.outputs.build-artifact-name }}
      wheel-artifact-name: ${{ needs.build-artifact.outputs.wheel-artifact-name }}
      enabled-skus: ${{ needs.generate-arch-matrix.outputs.l2-nightly-skus }}
      additional_test_categories: tutorials
      enable-llk-asserts: ${{ inputs.enable-llk-asserts || false }}
  cnn-unit-tests:
    needs: [resolve-docker-pull-refs, build-artifact, generate-arch-matrix]
    if: |
      (github.event_name == 'schedule' || inputs.run_tt_cnn_unit_tests) &&
      needs.generate-arch-matrix.outputs.l2-nightly-skus != ''
    secrets: inherit
    uses: ./.github/workflows/tt-cnn-unit-tests-impl.yaml
    with:
      docker-image: ${{ needs.resolve-docker-pull-refs.outputs.dev-docker-image }}
      wheel-artifact-name: ${{ needs.build-artifact.outputs.wheel-artifact-name }}
      enabled-skus: ${{ needs.generate-arch-matrix.outputs.l2-nightly-skus }}
      additional_test_categories: cnn_pipeline,cnn_builder
      enable-llk-asserts: ${{ inputs.enable-llk-asserts || false }}
  ttnn-p100-tests:
    needs: [check-harbor, build-artifact]
    if: ${{ github.event_name == 'schedule' || (inputs.run_blackhole && inputs.run_p100_sanity_tests) }}
    secrets: inherit
    uses: ./.github/workflows/ttnn-sanity-tests-impl.yaml
    with:
      enabled-skus: "bh_p100"
      docker-image: ${{ needs.build-artifact.outputs.ci-test-docker-image }}
      harbor-prefix: ${{ needs.check-harbor.outputs.harbor-prefix }}
      wheel-artifact-name: ${{ needs.build-artifact.outputs.wheel-artifact-name }}
      enable-llk-asserts: ${{ inputs.enable-llk-asserts || false }}

  # =============================================================================
  # UMD team
  # =============================================================================
  umd-p100-tests:
    needs: [resolve-docker-pull-refs, build-artifact]
    if: ${{ github.event_name == 'schedule' || (inputs.run_blackhole && inputs.run_p100_sanity_tests) }}
    secrets: inherit
    uses: ./.github/workflows/umd-sanity-tests-impl.yaml
    with:
      enabled-skus: "bh_p100a_civ2_viommu"
      docker-image: ${{ needs.resolve-docker-pull-refs.outputs.dev-docker-image }}
      build-artifact-name: ${{ needs.build-artifact.outputs.build-artifact-name }}
      enable-llk-asserts: ${{ inputs.enable-llk-asserts || false }}

  # =============================================================================
  # tt-train team
  # =============================================================================
  tt-train-unit-tests:
    needs: [build-artifact, generate-arch-matrix]
    if: |
      (github.event_name == 'schedule' || inputs.run_tt_train_unit_tests) &&
      needs.generate-arch-matrix.outputs.l2-nightly-skus != ''
    secrets: inherit
    uses: ./.github/workflows/tt-train-tests.yaml
    with:
      test-category: unit
      enabled-skus: ${{ needs.generate-arch-matrix.outputs.l2-nightly-skus }}
      docker-image: ${{ needs.build-artifact.outputs.dev-docker-image }}
      build-artifact-name: ${{ needs.build-artifact.outputs.build-artifact-name }}
      wheel-artifact-name: ${{ needs.build-artifact.outputs.wheel-artifact-name }}
      enable-llk-asserts: ${{ inputs.enable-llk-asserts || false }}
      summary-scope: unit
  tt-train-perf-pretraining-tests:
    needs: [build-artifact, generate-arch-matrix]
    if: |
      (github.event_name == 'schedule' || inputs.run_tt_train_perf_pretraining_tests) &&
      needs.generate-arch-matrix.outputs.l2-nightly-skus != ''
    secrets: inherit
    uses: ./.github/workflows/tt-train-tests.yaml
    with:
      test-category: perf
      enabled-skus: ${{ needs.generate-arch-matrix.outputs.l2-nightly-skus }}
      docker-image: ${{ needs.build-artifact.outputs.dev-docker-image }}
      build-artifact-name: ${{ needs.build-artifact.outputs.build-artifact-name }}
      wheel-artifact-name: ${{ needs.build-artifact.outputs.wheel-artifact-name }}
      enable-llk-asserts: ${{ inputs.enable-llk-asserts || false }}
      subcategories: pretraining
      summary-scope: pretraining
  tt-train-perf-finetuning-tests:
    needs: [build-artifact, generate-arch-matrix]
    if: |
      (github.event_name == 'schedule' || inputs.run_tt_train_perf_finetuning_tests) &&
      needs.generate-arch-matrix.outputs.l2-nightly-skus != ''
    secrets: inherit
    uses: ./.github/workflows/tt-train-tests.yaml
    with:
      test-category: perf
      enabled-skus: ${{ needs.generate-arch-matrix.outputs.l2-nightly-skus }}
      docker-image: ${{ needs.build-artifact.outputs.dev-docker-image }}
      build-artifact-name: ${{ needs.build-artifact.outputs.build-artifact-name }}
      wheel-artifact-name: ${{ needs.build-artifact.outputs.wheel-artifact-name }}
      enable-llk-asserts: ${{ inputs.enable-llk-asserts || false }}
      subcategories: finetuning
      summary-scope: finetuning

  # =============================================================================
  # Triage team
  # =============================================================================
  triage-tests:
    needs: [resolve-docker-pull-refs, build-artifact, generate-arch-matrix]
    if: |
      (github.event_name == 'schedule' || inputs.run_triage_tests) &&
      contains(needs.generate-arch-matrix.outputs.l2-nightly-skus, 'wh_n150')
    secrets: inherit
    uses: ./.github/workflows/triage-tests-impl.yaml
    with:
      docker-image: ${{ needs.resolve-docker-pull-refs.outputs.dev-docker-image }}
      build-artifact-name: ${{ needs.build-artifact.outputs.build-artifact-name }}
      wheel-artifact-name: ${{ needs.build-artifact.outputs.wheel-artifact-name }}
      enabled-skus: ${{ needs.generate-arch-matrix.outputs.l2-nightly-skus }}
      test-category: unit
      enable-llk-asserts: ${{ inputs.enable-llk-asserts || false }}

  # =============================================================================
  # LLK team
  # =============================================================================
  # LLK Unit Tests — runs the full LLK gtest binary in slow dispatch as a comprehensive
  # nightly regression. The PR gate covers two narrower slices (FD path via
  # llk-fd-unit-tests-* and a Quasar+SD-only slice via llk-sd-unit-tests-*); this job is the
  # superset that re-validates everything in SD on every supported runner class.
  llk-unit-tests:
    needs: [build-artifact, generate-arch-matrix]
    if: |
      (github.event_name == 'schedule' || inputs.run_llk_unit_tests) &&
      needs.generate-arch-matrix.outputs.l2-nightly-skus != ''
    secrets: inherit
    uses: ./.github/workflows/llk-unit-tests-impl.yaml
    with:
      docker-image: ${{ needs.build-artifact.outputs.dev-docker-image }}
      build-artifact-name: ${{ needs.build-artifact.outputs.build-artifact-name }}
      enabled-skus: ${{ needs.generate-arch-matrix.outputs.l2-nightly-skus }}
      enable-llk-asserts: ${{ inputs.enable-llk-asserts || false }}

  # =============================================================================
  # AI run summary
  # =============================================================================
  # Aggregates the per-leg ai-job-summary artifacts into one run-level report.
  # expected-jobs is the union of each impl's matrix, so a leg whose runner died is
  # reported as an infra failure rather than silently dropped. A new test job must be
  # added to `needs:` below or its legs are absent from that union with no error.
  #
  # No scope: this workflow has no workflow_call trigger and no call site carries a
  # strategy matrix, so exactly one instance of this job exists per run. A scoped run
  # stage over unscoped job summaries matches nothing and stubs every leg
  # INFRA_FAILURE, which is strictly worse than the collision scope guards against.
  #
  # check-harbor, build-artifact, generate-arch-matrix and resolve-docker-pull-refs
  # are in `needs:` because every test job is gated on them: when the build fails the
  # impls are *skipped*, not failed, and without them the combined result would be
  # `skipped` — which suppresses infra synthesis entirely and reports a broken run as
  # if nothing was due.
  ai-run-summary:
    name: "AI Run Summary"
    needs:
      - check-harbor
      - build-artifact
      - generate-arch-matrix
      - resolve-docker-pull-refs
      - ttsim-unit-tests
      - syseng-didt-tests
      - ops-unit-tests
      - ops-integration-tests
      - ttnn-integration-tests
      - cnn-unit-tests
      - ttnn-p100-tests
      - umd-p100-tests
      - tt-train-unit-tests
      - tt-train-perf-pretraining-tests
      - tt-train-perf-finetuning-tests
      - triage-tests
      - llk-unit-tests
    # Reports on a run that failed — the case the summary exists for — but not
    # on one that was cancelled: an aborted run has no outcome to summarize, and
    # asking for one spends an LLM call to say it stopped early.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      actions: read # download the per-leg ai_job_summary artifacts
      contents: read # a job-level block zeroes every scope it omits, incl. checkout's
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        timeout-minutes: 20
        with:
          filter: blob:none
          sparse-checkout: .github
      - name: Aggregate child matrices and results
        id: aggregate
        # Reporting must never fail the run: a jq error here would turn a green
        # nightly red.
        continue-on-error: true
        env:
          # toJSON(needs) is one object keyed by child job name, each with `result`
          # and `outputs.matrix`; aggregating from it keeps this data-driven as jobs
          # are added to or removed from the `needs` list.
          NEEDS: ${{ toJSON(needs) }}
        run: |
          # Expected legs come from the children that ran. A cancelled child keeps a
          # successful load-test-matrix, so including it would stub its legs as
          # INFRA_FAILURE when another child failed; skipped children expose a
          # null/empty matrix, which fromjson would throw on. On workflow_dispatch
          # most test jobs are legitimately skipped, so this is the common path here.
          RAN=$(jq -cn --argjson n "$NEEDS" '
            [$n[] | select(.result != "cancelled" and .result != "skipped")]')

          EXPECTED=$(jq -cn --argjson r "$RAN" '
            [$r[] | .outputs.matrix | select(. != null and . != "") | fromjson] | add // []')
          echo "expected-jobs=$EXPECTED" >> "$GITHUB_OUTPUT"
          echo "Merged $(echo "$EXPECTED" | jq 'length') expected legs"

          # Most-severe-wins over every child, so a cancelled run says so in the
          # report instead of reading as a clean pass. Upstream also treats
          # cancelled/skipped as "expect nothing", which is what we want: legs that
          # never finished were aborted, not infra failures.
          RESULT=$(jq -rn --argjson n "$NEEDS" '
            [$n[].result] as $s |
            if   any($s[]; . == "failure")   then "failure"
            elif any($s[]; . == "cancelled") then "cancelled"
            elif any($s[]; . == "success")   then "success"
            else                                  "skipped"
            end')
          echo "run-result=$RESULT" >> "$GITHUB_OUTPUT"
          echo "Combined run-result: $RESULT"
      - id: ai-run-summary
        continue-on-error: true
        uses: tenstorrent/tt-github-actions/.github/actions/ai_summary/run@main
        with:
          config: |
            {
              "model": "${{ vars.AI_SUMMARY_MODEL }}",
              "workspace": "$GITHUB_WORKSPACE",
              "input_dir": "ai_job_summaries",
              "output_dir": "ai_run_summaries"
            }
          api-key: ${{ secrets.TT_CHAT_API_KEY }}
          api-url: ${{ secrets.TT_CHAT_URL }}
          expected-jobs: ${{ steps.aggregate.outputs.expected-jobs }}
          run-result: ${{ steps.aggregate.outputs.run-result }}
      - name: Show report
        if: ${{ always() && steps.ai-run-summary.outputs.report-file != '' }}
        continue-on-error: true
        shell: bash
        env:
          REPORT_FILE: ${{ steps.ai-run-summary.outputs.report-file }}
        run: |
          if [ -f "$REPORT_FILE" ]; then
            cat "$REPORT_FILE"
            cat "$REPORT_FILE" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Report file not found: $REPORT_FILE"
          fi

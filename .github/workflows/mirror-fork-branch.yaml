name: Mirror Fork Branch to Origin

on:
  workflow_call:
    inputs:
      source:
        description: 'Source in format <fork_owner>:<branch>'
        required: true
        type: string
      target_branch:
        description: >
          Optional. Target branch name in origin. If not provided, the branch will be named
          `mirror/<fork_owner>/<branch>`.
        required: false
        type: string
  workflow_dispatch:
    inputs:
      source:
        description: 'Source in format <fork_owner>:<branch>'
        required: true
      target_branch:
        description: >
          Optional. Target branch name in origin. If not provided, the branch will be named
          `mirror/<fork_owner>/<branch>`.
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  mirror-fork-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Parse input
        id: parse_input
        shell: bash
        env:
          SOURCE: ${{ inputs.source }}
          TARGET_BRANCH: ${{ inputs.target_branch }}
          REPOSITORY: ${{ github.repository }}
        run: |
          # Expect input format: <fork_owner>:<branch>
          IFS=":" read -r FORK_OWNER SRC_BRANCH <<< "$SOURCE"
          if [[ "$SOURCE" == *$'\n'* ]] || [ -z "$FORK_OWNER" ] || [ -z "$SRC_BRANCH" ]; then
            echo "Error: Input must be in the format <fork_owner>:<branch>"
            exit 1
          fi
          if [[ ! "$FORK_OWNER" =~ ^[A-Za-z0-9][A-Za-z0-9-]*$ ]]; then
            echo "Error: '$FORK_OWNER' is not a GitHub user or organization name"
            exit 1
          fi
          if [ -z "$TARGET_BRANCH" ]; then
            TARGET_BRANCH="mirror/${FORK_OWNER}/${SRC_BRANCH}"
          fi
          for name in "$FORK_OWNER" "$SRC_BRANCH" "$TARGET_BRANCH"; do
            if [[ ! "$name" =~ ^[A-Za-z0-9._/-]+$ ]] || [[ "$name" == -* ]]; then
              echo "Error: unsupported characters in '$name' (allowed: A-Z a-z 0-9 . _ / -)"
              exit 1
            fi
          done
          # Derive the fork repository name from the current repository.
          FORK_REPO="${FORK_OWNER}/${REPOSITORY#*/}"
          echo "Fork repository: $FORK_REPO"
          echo "Source branch: $SRC_BRANCH"
          echo "Target branch: $TARGET_BRANCH"
          {
            echo "fork_owner=$FORK_OWNER"
            echo "src_branch=$SRC_BRANCH"
            echo "fork_repo=$FORK_REPO"
            echo "target_branch=$TARGET_BRANCH"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout base repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2 cachew: keep
        timeout-minutes: 20
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch fork branch
        env:
          FORK_REPO: ${{ steps.parse_input.outputs.fork_repo }}
          SRC_BRANCH: ${{ steps.parse_input.outputs.src_branch }}
        run: |
          git remote add fork "https://github.com/${FORK_REPO}.git"
          git fetch fork "+refs/heads/${SRC_BRANCH}:refs/remotes/fork/${SRC_BRANCH}"

      - name: Push branch to origin
        env:
          SRC_BRANCH: ${{ steps.parse_input.outputs.src_branch }}
          TARGET_BRANCH: ${{ steps.parse_input.outputs.target_branch }}
        run: |
          echo "Pushing fork/$SRC_BRANCH to origin/$TARGET_BRANCH"
          git push --force origin "refs/remotes/fork/${SRC_BRANCH}:refs/heads/${TARGET_BRANCH}"

      - name: Find PR
        id: pr
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          HEAD_QUERY: ${{ steps.parse_input.outputs.fork_owner }}:${{ steps.parse_input.outputs.src_branch }}
        run: |
          echo "Searching for PR with head: $HEAD_QUERY"
          PR_NUMBER=$(gh api "repos/${REPOSITORY}/pulls" -X GET -f head="$HEAD_QUERY" --jq '.[0].number // empty')
          if [ -z "$PR_NUMBER" ]; then
            echo "No PR found"
          else
            echo "Found PR #$PR_NUMBER"
          fi
          echo "issue=$PR_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Post comment on PR
        if: steps.pr.outputs.issue != ''
        uses: mshick/add-pr-comment@b8f338c590a895d50bcbfa6c5859251edc8952fc # v2.8.2
        with:
          issue: ${{ steps.pr.outputs.issue }}
          message: |
           ✨ A mirror branch has been created/updated for this PR: [`${{ steps.parse_input.outputs.target_branch }}`](https://github.com/${{ github.repository }}/tree/${{ steps.parse_input.outputs.target_branch }})

name: "LLK perf"
# perf-trial/elf-reuse-* only: cross-commit ELF cache trial (merge-gate compile, CPU runner).

on:
  workflow_dispatch:
    inputs:
      ref-a:
        description: "Commit A (cache filled here)"
        required: true
        type: string
      ref-b:
        description: "Commit B (warm with A's cache)"
        required: true
        type: string
      workers:
        description: "pytest -n for the compile session (the board uses 10)"
        required: false
        default: "10"
        type: string
      runner:
        description: "CPU runner label"
        required: false
        default: tt-ubuntu-2204-xlarge-stable
        type: string
      legs:
        description: "JSON list of legs [arch, group, n]"
        required: false
        default: '[["blackhole",1,4],["blackhole",2,4],["blackhole",3,4],["blackhole",4,4],["wormhole",1,3],["wormhole",2,3],["wormhole",3,3]]'
        type: string

permissions:
  actions: read
  contents: read
  packages: write

jobs:
  build-images:
    name: "Docker setup"
    uses: ./.github/workflows/build-docker-artifact.yaml
    secrets: inherit

  trial:
    needs: [build-images]
    strategy:
      fail-fast: false
      matrix:
        leg: ${{ fromJSON(inputs.legs) }}
    name: "ELF reuse ${{ matrix.leg[0] }} ${{ matrix.leg[1] }}/${{ matrix.leg[2] }}"
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 170
    container:
      image: ${{ needs.build-images.outputs.llk-ci-tag }}
      options: "--rm"
    env:
      ARCH: ${{ matrix.leg[0] }}
      CHIP_ARCH: ${{ matrix.leg[0] }}
      GROUP: ${{ matrix.leg[1] }}
      NGROUPS: ${{ matrix.leg[2] }}
      SPEED_OF_LIGHT: "false"
      LLK_PERF_DEBUG_SYMBOLS: "true"
      LLK_PERF_RUN_TYPES: L1_TO_L1
      PIPELINE: merge_baseline
      TT_LLK_DISABLE_ASSERTS: "1"
      LLK_PERF_COMPILE_WORKERS: ${{ inputs.workers }}
    steps:
      - name: Trial scripts
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2 cachew: keep
        timeout-minutes: 10
        with:
          path: trialsrc
          sparse-checkout: |
            elf_reuse_trial
            tt_metal/tt-llk/tests/python_tests/helpers
          sparse-checkout-cone-mode: true
      - name: Stage trial scripts
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/trial"
          cp trialsrc/elf_reuse_trial/* "$RUNNER_TEMP/trial/"
          cp trialsrc/tt_metal/tt-llk/tests/python_tests/helpers/elf_cache.py "$RUNNER_TEMP/trial/"
          chmod +x "$RUNNER_TEMP"/trial/*.sh
          rm -rf trialsrc
          command -v zstd || { apt-get update -qq && apt-get install -y -qq zstd; }
          echo "OUT=$RUNNER_TEMP/out/${ARCH}-${GROUP}" >> "$GITHUB_ENV"
          nproc; free -g; df -h "$RUNNER_TEMP" .
      - name: Checkout A
        uses: tenstorrent/tt-metal/.github/actions/cachew-checkout@7586e1e528b173057dbaa828c9ae1fa945fd2a9f # cachew checkout
        timeout-minutes: 20
        with:
          ref: ${{ inputs.ref-a }}
      - name: Sessions at A
        timeout-minutes: 75
        shell: bash
        run: bash "$RUNNER_TEMP/trial/run_leg.sh" a
      - name: Checkout B
        uses: tenstorrent/tt-metal/.github/actions/cachew-checkout@7586e1e528b173057dbaa828c9ae1fa945fd2a9f # cachew checkout
        timeout-minutes: 20
        with:
          ref: ${{ inputs.ref-b }}
      - name: Sessions at B
        timeout-minutes: 75
        shell: bash
        run: |
          bash "$RUNNER_TEMP/trial/run_leg.sh" b
          df -h "$RUNNER_TEMP"
      - name: Upload results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: elf-reuse-${{ matrix.leg[0] }}-${{ matrix.leg[1] }}
          path: ${{ runner.temp }}/out/
          retention-days: 7

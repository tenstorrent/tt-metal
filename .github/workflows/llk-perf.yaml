name: "LLK perf: Wormhole MATH_ISOLATE prelude cost (trial, do not merge)"
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: read
  packages: write
jobs:
  today:
    uses: ./.github/workflows/llk-perf-impl.yaml
    with:
      architecture: wormhole
      tests-yaml: ./tests/pipeline_reorg/llk_perf_merge_gate_tests.yaml
      compile-quasar: false
      speed-of-light: false
      perf-run-types: "L1_TO_L1,"
      pipeline: pr
      artifact-suffix: "-today"
    secrets: inherit
  prelude:
    needs: today
    if: always()
    uses: ./.github/workflows/llk-perf-impl.yaml
    with:
      architecture: wormhole
      tests-yaml: ./tests/pipeline_reorg/llk_perf_merge_gate_tests.yaml
      compile-quasar: false
      speed-of-light: false
      perf-run-types: L1_TO_L1
      pipeline: pr
      artifact-suffix: "-prelude"
    secrets: inherit

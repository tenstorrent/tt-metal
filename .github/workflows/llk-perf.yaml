name: "LLK perf"
# perf-trial/smoke-ci-equiv only: equivalence checks of the smoke-leg levers on a CPU runner.

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "CPU runner label"
        required: false
        default: tt-ubuntu-2204-xlarge-stable
        type: string
      script:
        description: "smoke_trial script"
        required: false
        default: equiv.sh
        type: string
      legs:
        description: "JSON list of legs [arch, group, n]"
        required: false
        default: '[["blackhole",1,3],["blackhole",2,3],["blackhole",3,3],["wormhole",1,2],["wormhole",2,2]]'
        type: string

permissions:
  actions: read
  contents: read
  packages: write

jobs:
  build-images:
    name: "Docker setup"
    uses: ./.github/workflows/build-docker-artifact.yaml
    secrets: inherit

  equiv:
    needs: [build-images]
    strategy:
      fail-fast: false
      matrix:
        leg: ${{ fromJSON(inputs.legs) }}
    name: "Equivalence ${{ matrix.leg[0] }} ${{ matrix.leg[1] }}/${{ matrix.leg[2] }}"
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 120
    container:
      image: ${{ needs.build-images.outputs.llk-ci-tag }}
      options: "--rm --cap-add SYS_PTRACE"
    env:
      ARCH: ${{ matrix.leg[0] }}
      CHIP_ARCH: ${{ matrix.leg[0] }}
      GROUP: ${{ matrix.leg[1] }}
      NGROUPS: ${{ matrix.leg[2] }}
    steps:
      - name: Checkout code
        uses: tenstorrent/tt-metal/.github/actions/cachew-checkout@7586e1e528b173057dbaa828c9ae1fa945fd2a9f # cachew checkout
        timeout-minutes: 20
      - name: Install SFPI
        shell: bash
        working-directory: tt_metal/tt-llk/tests
        run: ./setup_testing_env.sh
      - name: Durations table of run 45585767139
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: split-durations
          path: ${{ runner.temp }}/split-durations
          run-id: 45585767139
          github-token: ${{ github.token }}
      - name: Equivalence checks
        timeout-minutes: 110
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          nproc; free -g
          OUT="$RUNNER_TEMP/out/${ARCH}-${GROUP}" DURATIONS="$RUNNER_TEMP/split-durations/$ARCH.json" bash smoke_trial/${{ inputs.script }}
      - name: Upload results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: smoke-equiv-${{ matrix.leg[0] }}-${{ matrix.leg[1] }}
          path: ${{ runner.temp }}/out/
          retention-days: 7

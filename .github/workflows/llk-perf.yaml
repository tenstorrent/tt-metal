name: "LLK perf"

on:
  schedule:
    # Run every night at 3AM UTC
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      architecture:
        description: "Architecture to run performance tests on"
        required: true
        default: all
        type: choice
        options:
          - all
          - wormhole
          - blackhole
          - quasar
      pipeline:
        description: "Label these runs as this pipeline: nightly, baseline or pr (blank = infer)"
        required: false
        default: ""
        type: string
      speed-of-light:
        description: "Enable --speed-of-light for LLK performance tests"
        required: false
        default: true
        type: boolean
      upload-to-warehouse:
        description: "Upload the run's Parquet to the perf warehouse over SFTP"
        required: false
        default: false
        type: boolean

permissions:
  actions: read
  checks: write
  contents: read
  packages: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ inputs.architecture || 'all' }}-${{
    github.ref_protected && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  llk-perf-tests:
    name: "LLK perf tests"
    uses: ./.github/workflows/llk-perf-impl.yaml
    with:
      # Scheduled runs have no dispatch inputs, so retain the existing behavior.
      architecture: ${{ inputs.architecture || 'all' }}
      # A scheduled run is the nightly by definition; a manual run says so.
      pipeline: ${{ github.event_name == 'schedule' && 'nightly' || inputs.pipeline }}
      # Nightly runs always use speed-of-light; manual runs use the checkbox.
      speed-of-light: ${{ github.event_name == 'schedule' || inputs.speed-of-light }}
      # Nightly runs always publish; manual runs use the checkbox.
      upload-to-warehouse: ${{ github.event_name == 'schedule' || inputs.upload-to-warehouse }}
    secrets: inherit

  gate:
    name: "Gate ${{ matrix.arch }} (speed of light)"
    needs: llk-perf-tests
    if: ${{ always() && (github.event_name == 'schedule' || inputs.speed-of-light) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: blackhole
            threshold: 0.02
            run_types: L1_TO_L1,PACK_ISOLATE,UNPACK_ISOLATE,MATH_ISOLATE
          - arch: wormhole
            threshold: 0.06
            run_types: L1_TO_L1,UNPACK_ISOLATE,MATH_ISOLATE
    uses: ./.github/workflows/llk-perf-gate-impl.yaml
    with:
      arch: ${{ matrix.arch }}
      baseline_pipeline: baseline
      speed_of_light: "true"
      run_types: ${{ matrix.run_types }}
      threshold: ${{ matrix.threshold }}
      min_cycles: 30
    secrets: inherit

  llk-perf-summary:
    name: "LLK perf summary"
    if: always()
    needs:
      - llk-perf-tests
    runs-on: ubuntu-slim
    steps:
      - name: Check perf test results
        uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}

  report-status:
    name: "Report status"
    runs-on: ubuntu-slim
    if: always()
    needs: llk-perf-summary
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        timeout-minutes: 20
        with:
          fetch-depth: 1
      - name: Report status
        uses: ./.github/actions/report-failure
        with:
          test_name: "LLK perf tests"
          slack_bot_token: ${{ secrets.LLK_SLACK_REPORTING_BOT_TOKEN }}
          slack_channel_id: ${{ secrets.LLK_CI_STATUS_CHANNEL_ID }}
          status: ${{ needs.llk-perf-summary.result }}

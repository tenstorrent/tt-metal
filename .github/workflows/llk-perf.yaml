name: "LLK perf: stage 2 replay (trial, do not merge)"
on:
  workflow_dispatch:
    inputs:
      cases:
        description: 'JSON list of "arch case base12 head12"'
        required: true
        type: string
permissions:
  actions: read
  contents: read
  packages: write
jobs:
  build-images:
    uses: ./.github/workflows/build-docker-artifact.yaml
    secrets: inherit
  replay:
    needs: build-images
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        case: ${{ fromJSON(inputs.cases) }}
    name: "replay ${{ matrix.case }}"
    runs-on: ${{ contains(matrix.case, 'wormhole') && 'tt-ubuntu-2204-N150-viommu-stable' || 'tt-ubuntu-2204-P150b-stable' }}
    timeout-minutes: 240
    container:
      image: ${{ needs.build-images.outputs.llk-ci-tag }}
      options: "--rm --device /dev/tenstorrent --ulimit nofile=4096:4096"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          sparse-checkout: .github/replay
      - name: Replay
        env:
          REPLAY_ROOT: ${{ runner.temp }}/replay
          CASE: ${{ matrix.case }}
        shell: bash
        run: |
          if [[ $CASE == script\ * ]]; then bash .github/replay/${CASE#script }; else bash .github/replay/replay_case.sh $CASE; fi
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        if: always()
        with:
          name: replay-${{ strategy.job-index }}
          path: |
            ${{ runner.temp }}/replay/out/
            !${{ runner.temp }}/replay/out/*/s2-*/**/*.windowhash

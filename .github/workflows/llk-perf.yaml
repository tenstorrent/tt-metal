name: "LLK perf: threshold trial, merge-gate config (do not merge)"
on:
  workflow_dispatch:
    inputs:
      architecture:
        description: "all, wormhole or blackhole"
        required: false
        default: all
        type: string
permissions:
  actions: read
  checks: write
  contents: read
  packages: write
  pull-requests: write
jobs:
  measure:
    uses: ./.github/workflows/llk-perf-impl.yaml
    with:
      architecture: ${{ inputs.architecture }}
      tests-yaml: ./tests/pipeline_reorg/llk_perf_merge_gate_tests.yaml
      compile-quasar: false
      speed-of-light: false
      perf-run-types: L1_TO_L1
      pipeline: merge_baseline
      upload-to-warehouse: false
    secrets: inherit

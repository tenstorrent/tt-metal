name: "LLK perf"
# The nightly health check (llk-perf-nightly-health.yaml) tells the two nightlies apart by this name.
run-name: >-
  ${{ github.event_name != 'schedule' && format('LLK perf, manual run on {0}', github.ref_name)
      || github.event.schedule == '0 5 * * *' && 'LLK perf nightly' || 'LLK perf nightly, speed of light' }}

on:
  schedule:
    # Two nightlies, two hours apart so they do not wait for each other's boards:
    # speed of light at 03:00 UTC (builds on CPU runners), the rest at 05:00 UTC.
    - cron: '0 3 * * *'
    - cron: '0 5 * * *'
  workflow_dispatch:
    inputs:
      architecture:
        description: "Architecture to run performance tests on"
        required: true
        default: all
        type: choice
        options:
          - all
          - wormhole
          - blackhole
          - quasar
      pipeline:
        description: "Label these runs as this pipeline: nightly, baseline or pr (blank = infer)"
        required: false
        default: ""
        type: string
      speed-of-light:
        description: "Enable --speed-of-light for LLK performance tests"
        required: false
        default: true
        type: boolean
      upload-to-warehouse:
        description: "Upload the run's Parquet to the perf warehouse over SFTP"
        required: false
        default: false
        type: boolean
      debug-symbols:
        description: "Build the ELFs with -g (the nightly builds without)"
        required: false
        default: false
        type: boolean
      compile-runner:
        description: "Build on this CPU runner; the board only measures (blank = the board builds)"
        required: false
        default: ""
        type: string
      gate:
        description: "Also run the nightly gate on the result"
        required: false
        default: false
        type: boolean

permissions:
  actions: read
  checks: write
  contents: read
  packages: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ inputs.architecture || 'all' }}-${{
    github.ref_protected && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  llk-perf-tests:
    name: "LLK perf tests"
    uses: ./.github/workflows/llk-perf-impl.yaml
    with:
      # Scheduled runs have no dispatch inputs, so retain the existing behavior.
      architecture: ${{ inputs.architecture || 'all' }}
      # L1_CONGESTION is not gated and costs a fifth of the build.
      perf-run-types: ALL_MODES
      # A scheduled run is the nightly by definition; a manual run says so.
      pipeline: ${{ github.event_name == 'schedule' && 'nightly' || inputs.pipeline }}
      # The 03:00 nightly is speed of light, the 05:00 one is not; manual runs use the checkbox.
      speed-of-light: ${{ github.event_name == 'schedule' && github.event.schedule != '0 5 * * *' || github.event_name != 'schedule' && inputs.speed-of-light }}
      # The non speed-of-light nightly keeps -g; the speed-of-light one builds without it.
      debug-symbols: ${{ github.event.schedule == '0 5 * * *' || github.event_name != 'schedule' && inputs.debug-symbols }}
      # Nightly runs always publish; manual runs use the checkbox.
      upload-to-warehouse: ${{ github.event_name == 'schedule' || inputs.upload-to-warehouse }}
      # The speed-of-light nightly builds on CPU runners and the boards only measure (#61833).
      compile-runner: >-
        ${{ github.event.schedule == '0 3 * * *' && 'tt-ubuntu-2204-xlarge-stable'
            || github.event_name != 'schedule' && inputs.compile-runner || '' }}
    secrets: inherit

  gate:
    name: "Gate ${{ matrix.arch }}"
    needs: llk-perf-tests
    if: ${{ !cancelled() && (github.event_name == 'schedule' || inputs.gate) }}
    strategy:
      fail-fast: false
      matrix:
        arch: [blackhole, wormhole]
    uses: ./.github/workflows/llk-perf-gate-impl.yaml
    with:
      gate: ${{ (github.event_name == 'schedule' && github.event.schedule != '0 5 * * *' || github.event_name != 'schedule' && inputs.speed-of-light) && 'nightly_sol' || 'nightly' }}
      arch: ${{ matrix.arch }}
    secrets: inherit

  llk-perf-summary:
    name: "LLK perf summary"
    if: always()
    needs:
      - llk-perf-tests
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - name: Check perf test results
        uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}

  report-status:
    name: "Report status"
    runs-on: ubuntu-slim
    timeout-minutes: 10
    if: always()
    needs: llk-perf-summary
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2 cachew: keep
        timeout-minutes: 20
        with:
          fetch-depth: 1
      - name: Report status
        uses: ./.github/actions/report-failure
        with:
          test_name: "LLK perf tests"
          slack_bot_token: ${{ secrets.LLK_SLACK_REPORTING_BOT_TOKEN }}
          slack_channel_id: ${{ secrets.LLK_CI_STATUS_CHANNEL_ID }}
          status: ${{ needs.llk-perf-summary.result }}

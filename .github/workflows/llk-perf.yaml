name: "LLK perf"
# perf-trial/elf-reuse-convert only: recompress a trial run's zstd stats as gzip.
on:
  workflow_dispatch:
    inputs:
      run-id:
        required: true
        type: string
permissions:
  actions: read
  contents: read
jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          run-id: ${{ inputs.run-id }}
          github-token: ${{ github.token }}
          pattern: elf-reuse-*
          path: in
      - name: Recompress
        run: |
          find in -name '*.zst' | while read -r f; do zstd -q -dc "$f" | gzip > "${f%.zst}.gz"; rm "$f"; done
          du -sh in
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: elf-reuse-gz
          path: in/
          retention-days: 7

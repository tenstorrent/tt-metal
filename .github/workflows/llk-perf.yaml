name: "LLK perf"
# perf-trial/min-cover-* only: compile the merge-gate suite on a CPU runner and fingerprint every ELF.

on:
  workflow_dispatch:
    inputs:
      workers:
        description: "pytest -n"
        required: false
        default: "36"
        type: string
      runner:
        description: "CPU runner label"
        required: false
        default: tt-ubuntu-2204-xlarge-stable
        type: string

permissions:
  actions: read
  contents: read
  packages: write

jobs:
  build-images:
    name: "Docker setup"
    uses: ./.github/workflows/build-docker-artifact.yaml
    secrets: inherit

  codepath:
    needs: [build-images]
    strategy:
      fail-fast: false
      matrix:
        arch: [blackhole, wormhole]
    name: "Code paths ${{ matrix.arch }}"
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 150
    container:
      image: ${{ needs.build-images.outputs.llk-ci-tag }}
      options: "--rm"
    env:
      ARCH: ${{ matrix.arch }}
      CHIP_ARCH: ${{ matrix.arch }}
      WORKERS: ${{ inputs.workers }}
      SPEED_OF_LIGHT: "false"
      PIPELINE: merge_baseline
      TT_LLK_DISABLE_ASSERTS: "1"
    steps:
      - name: Checkout
        uses: tenstorrent/tt-metal/.github/actions/cachew-checkout@7586e1e528b173057dbaa828c9ae1fa945fd2a9f # cachew checkout
        timeout-minutes: 20
      - name: Compile and fingerprint
        timeout-minutes: 120
        shell: bash
        run: |
          echo "OUT=$RUNNER_TEMP/out/${ARCH}" >> "$GITHUB_ENV"
          nproc; free -g
          OUT="$RUNNER_TEMP/out/${ARCH}" bash min_cover_trial/run_leg.sh
      - name: Upload results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: min-cover-${{ matrix.arch }}
          path: ${{ runner.temp }}/out/
          retention-days: 7

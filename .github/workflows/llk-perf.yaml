name: "LLK perf: merge-gate stage 2 capacity + blocking trial (do not merge)"
on:
  workflow_dispatch:
    inputs:
      arch:
        description: "wormhole or blackhole"
        required: true
        type: string
      base_ref:
        description: "Commit stage 2 measures as the queue base"
        required: true
        type: string
      baseline_run:
        description: "Run whose perf data is the merge baseline (blank = the warehouse)"
        required: false
        default: ""
        type: string
      measure_only:
        description: "Measure only (no stage 2, no gate), to make a baseline run"
        required: false
        default: false
        type: boolean
permissions:
  actions: read
  checks: write
  contents: read
  packages: write
  pull-requests: write
jobs:
  changes:
    runs-on: ubuntu-slim
    outputs:
      changed: "true"
      thresholds: '{"threshold": "0.02", "min_cycles": "30", "module_thresholds": ""}'
    steps:
      - run: echo "trial"

  measure:
    needs: [changes]
    uses: ./.github/workflows/llk-perf-impl.yaml
    with:
      architecture: ${{ inputs.arch == 'wormhole' && 'wormhole' || 'all' }}
      tests-yaml: ./tests/pipeline_reorg/llk_perf_merge_gate_tests.yaml
      compile-quasar: false
      speed-of-light: false
      perf-run-types: L1_TO_L1
      pipeline: merge_baseline
      upload-to-warehouse: false
      stage2-baseline-ref: ${{ !inputs.measure_only && inputs.base_ref || '' }}
      trial-baseline-run: ${{ inputs.baseline_run }}
      stage2-thresholds: >-
        ${{ format('{{"{0}": {1}}}', inputs.arch, needs.changes.outputs.thresholds) }}
    secrets: inherit

  gate:
    needs: [changes, measure]
    if: always() && !cancelled() && !inputs.measure_only
    uses: ./.github/workflows/llk-perf-gate-impl.yaml
    with:
      arch: ${{ inputs.arch }}
      gate_name: LLK perf merge gate (trial)
      baseline_pipeline: merge_baseline
      baseline_match_ref: ${{ inputs.base_ref }}
      baseline_wait_minutes: "0"
      speed_of_light: "false"
      run_types: L1_TO_L1
      threshold: ${{ fromJSON(needs.changes.outputs.thresholds).threshold }}
      module_thresholds: ${{ fromJSON(needs.changes.outputs.thresholds).module_thresholds }}
      min_cycles: ${{ fromJSON(needs.changes.outputs.thresholds).min_cycles }}
      measure_result: ${{ needs.measure.result }}
      stage2_baseline_artifact: llk-perf-stage2-baseline
      fail_on_regression: ${{ inputs.arch == 'blackhole' }}
      fail_without_baseline: true
      slack: false
      slack_on_pass: false
    secrets: inherit

name: "LLK perf: merge-gate stage 2 blocking trial, Blackhole (do not merge)"
on:
  workflow_dispatch:
    inputs:
      base_ref:
        description: "Commit stage 2 measures as the queue base"
        required: true
        type: string
      head_ref:
        description: "Queue ref to read the PR number from"
        required: false
        default: ""
        type: string
permissions:
  actions: read
  checks: write
  contents: read
  packages: write
  pull-requests: write
jobs:
  changes:
    runs-on: ubuntu-slim
    outputs:
      changed: "true"
      thresholds: >-
        {"blackhole": {"threshold": "0.02", "module_thresholds": "", "blocking": true}}
    steps:
      - run: echo "trial"

  measure:
    needs: [changes]
    uses: ./.github/workflows/llk-perf-impl.yaml
    with:
      architecture: all
      tests-yaml: ./tests/pipeline_reorg/llk_perf_merge_gate_tests.yaml
      compile-quasar: false
      speed-of-light: false
      perf-run-types: L1_TO_L1
      pipeline: merge_baseline
      upload-to-warehouse: false
      stage2-baseline-ref: ${{ inputs.base_ref }}
      stage2-thresholds: >-
        ${{ format('{{"blackhole": {0}}}', toJSON(fromJSON(needs.changes.outputs.thresholds).blackhole)) }}
    secrets: inherit

  gate:
    needs: [changes, measure]
    if: always() && !cancelled()
    uses: ./.github/workflows/llk-perf-gate-impl.yaml
    with:
      arch: blackhole
      gate_name: LLK perf merge gate (trial)
      baseline_pipeline: merge_baseline
      baseline_match_ref: ${{ inputs.base_ref }}
      baseline_wait_minutes: "0"
      speed_of_light: "false"
      run_types: L1_TO_L1
      threshold: "0.02"
      module_thresholds: ""
      min_cycles: "30"
      measure_result: ${{ needs.measure.result }}
      stage2_baseline_artifact: llk-perf-stage2-baseline
      fail_on_regression: true
      slack: false
      slack_on_pass: false
    secrets: inherit

  blocking:
    name: LLK perf merge gate (blocking)
    needs: [changes, gate]
    if: always() && !cancelled() && needs.changes.outputs.changed == 'true'
    runs-on: ubuntu-slim
    steps:
      - name: Download the verdicts
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: llk-perf-gate-verdict-*
          # One match or two, the files land in verdicts/ the same way.
          merge-multiple: true
          path: verdicts
      - name: Check the blocking arches
        env:
          THRESHOLDS: ${{ needs.changes.outputs.thresholds }}
          HEAD_REF: ${{ inputs.head_ref }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ARCHES=$(python3 -c 'import json, os; print(*[a for a, t in json.loads(os.environ["THRESHOLDS"]).items() if t["blocking"]])')
          if [ -z "$ARCHES" ]; then
            echo "::error::No blocking arch in the thresholds; the gate cannot decide."
            exit 1
          fi
          # Each verdict file is "<exit code> <kind>", kind: pass, regression, incomplete or no-compare.
          KINDS=()
          for ARCH in $ARCHES; do
            { read -r CODE KIND < "verdicts/gate_verdict-${ARCH}.txt"; } 2>/dev/null || { CODE=missing; KIND=no-compare; }
            echo "${ARCH}: exit ${CODE}, ${KIND}"
            [ "$CODE" = 0 ] || KINDS+=("${ARCH}:${KIND}")
          done
          [ ${#KINDS[@]} = 0 ] && exit 0

          ONLY_REGRESSION=true
          for K in "${KINDS[@]}"; do
            [ "${K#*:}" = regression ] || ONLY_REGRESSION=false
          done
          if [ "$ONLY_REGRESSION" = true ] && [[ "$HEAD_REF" =~ /pr-([0-9]+)- ]]; then
            PR=${BASH_REMATCH[1]}
            # Accepted: someone other than the author added llk-perf-accepted after the PR's last push.
            # The push time is when the first workflow run for the head commit was made; the commit date
            # can be older than the push.
            AUTHOR=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}" --jq .user.login)
            HEAD_SHA=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}" --jq .head.sha)
            PUSHED=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${HEAD_SHA}&per_page=100" \
              --jq '.workflow_runs[].created_at' | sort | head -n 1)
            HAS=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/labels" --jq '.[].name' | grep -cx llk-perf-accepted || true)
            BY=""
            if [ -n "$PUSHED" ]; then
              BY=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${PR}/events" \
                --jq ".[] | select(.event == \"labeled\" and .label.name == \"llk-perf-accepted\"
                      and .actor.login != \"${AUTHOR}\" and .created_at > \"${PUSHED}\") | .actor.login" | tail -n 1)
            fi
            if [ "$HAS" != 0 ] && [ -n "$BY" ]; then
              echo "::notice::${BY} accepted the LLK perf slowdown of #${PR} (llk-perf-accepted after its last push at ${PUSHED})."
              exit 0
            fi
          fi

          echo "::error::The LLK perf merge gate blocks this entry (${KINDS[*]}). See the gate reports in this run."
          for K in "${KINDS[@]}"; do
            case "${K#*:}" in
              regression)
                echo "${K%%:*}, regression: stage 2 found stage-1 regressions slower at every code position, or could not"
                echo "  re-measure them. To look closer: add the llk-perf-gate label to the PR, then run the LLK perf gate"
                echo "  workflow by hand with placement_run_id set to that PR-gate run (stage 2 with no test limit)."
                echo "  To accept the slowdown: a reviewer other than the author adds the llk-perf-accepted label after"
                echo "  the PR's last push, then the PR is queued again."
                ;;
              incomplete)
                echo "${K%%:*}, incomplete: a measuring leg did not finish, so nothing was compared. The gate report"
                echo "  names the leg. If a perf test failed, fix the test. If a runner or board failed, queue the PR again."
                echo "  llk-perf-accepted does not apply: there is no measurement to accept."
                ;;
              *)
                echo "${K%%:*}, no-compare: the baseline read or the comparison did not finish (an infrastructure fault)."
                echo "  Queue the PR again. llk-perf-accepted does not apply: there is no measurement to accept."
                ;;
            esac
          done
          exit 1

name: "LLK perf"
# perf-trial/leg-anatomy-* only: profile of the merge-gate compile phase on a CPU runner.

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "CPU runner label"
        required: false
        default: tt-ubuntu-2204-xlarge-stable
        type: string
      legs:
        description: "JSON list of legs [arch, group, n]"
        required: false
        default: '[["blackhole",1,4],["blackhole",2,4],["blackhole",3,4],["blackhole",4,4],["wormhole",1,3],["wormhole",2,3],["wormhole",3,3]]'
        type: string

permissions:
  actions: read
  contents: read
  packages: write

jobs:
  build-images:
    name: "Docker setup"
    uses: ./.github/workflows/build-docker-artifact.yaml
    secrets: inherit

  profile:
    needs: [build-images]
    strategy:
      fail-fast: false
      matrix:
        leg: ${{ fromJSON(inputs.legs) }}
    name: "Leg anatomy ${{ matrix.leg[0] }} ${{ matrix.leg[1] }}/${{ matrix.leg[2] }}"
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 170
    container:
      image: ${{ needs.build-images.outputs.llk-ci-tag }}
      options: "--rm"
    env:
      ARCH: ${{ matrix.leg[0] }}
      CHIP_ARCH: ${{ matrix.leg[0] }}
      GROUP: ${{ matrix.leg[1] }}
      NGROUPS: ${{ matrix.leg[2] }}
      SPEED_OF_LIGHT: "false"
      LLK_PERF_DEBUG_SYMBOLS: "true"
      LLK_PERF_RUN_TYPES: L1_TO_L1
      PIPELINE: merge_baseline
      TT_LLK_DISABLE_ASSERTS: "1"
    steps:
      - name: Sparse checkout (timing only)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2 cachew: keep
        timeout-minutes: 10
        with:
          path: sparse
          fetch-depth: 1
          sparse-checkout: |
            .github
            tt_metal/tt-llk
            tt_metal/hw
            tt_metal/hostdevcommon
            tt_metal/sfpi-version
          sparse-checkout-cone-mode: false
      - name: Stage trial scripts
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/trial"
          cp sparse/leg_anatomy_trial/* "$RUNNER_TEMP/trial/" 2>/dev/null || true
          du -sh sparse; rm -rf sparse
          echo "OUT=$RUNNER_TEMP/out/${ARCH}-${GROUP}" >> "$GITHUB_ENV"
          nproc; free -g
      - name: Checkout code
        uses: tenstorrent/tt-metal/.github/actions/cachew-checkout@7586e1e528b173057dbaa828c9ae1fa945fd2a9f # cachew checkout
        timeout-minutes: 20
      - name: Install SFPI
        shell: bash
        working-directory: tt_metal/tt-llk/tests
        run: ./setup_testing_env.sh
      - name: Use the board's test durations
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/sd"
          zstd -dc leg_anatomy_trial/$ARCH.json.zst > "$RUNNER_TEMP/sd/$ARCH.json" || gzip -dc leg_anatomy_trial/$ARCH.json.gz > "$RUNNER_TEMP/sd/$ARCH.json"
          echo "LLK_SPLIT_DURATIONS=$RUNNER_TEMP/sd/$ARCH.json" >> "$GITHUB_ENV"
          cp leg_anatomy_trial/* "$RUNNER_TEMP/trial/"; chmod +x "$RUNNER_TEMP"/trial/*.sh
      - name: Profile
        timeout-minutes: 150
        shell: bash
        working-directory: tt_metal/tt-llk/tests/python_tests
        run: bash "$RUNNER_TEMP/trial/run_profile.sh"
      - name: Upload results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: leg-anatomy-${{ matrix.leg[0] }}-${{ matrix.leg[1] }}
          path: ${{ runner.temp }}/out/
          retention-days: 7

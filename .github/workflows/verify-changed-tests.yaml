name: "Verify changed tests"

# Gate for tests/pipeline_reorg edits. A PR that touches a test entry cannot enter
# the merge queue until that specific entry has run green
#
# All logic lives in the tenstorrent/tt-metal/.github/actions/verify-changed-tests
# action, meant to be pinned to @main so a PR branch always runs the current gate
# rather than whatever copy (or lack of one) sits at its own head -- referenced by
# local path below until this action exists on main, then switch to @main. This
# file only wires it up, plus the two policy lists below.
#
# merge_group runs `scope` only. The hardware legs already ran on the PR head;
# re-firing them in the queue would spend the same scarce hardware twice. The
# queue only needs the context to report, which `scope` does. Required checks
# are evaluated on the merge group too, so the trigger cannot simply be dropped.

on:
  pull_request:
    branches:
      - "main"
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  # Keyed per PR so pushes supersede each other, but merge-group runs never cancel
  # one another.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  # Logical SKUs this gate must never dispatch: hardware too scarce to spend on a
  # gate run. Touching an entry that covers one of these does not run it -- the PR
  # is blocked until a code owner of the edited file approves it.
  #
  # Add a SKU     -> those legs stop auto-running and need an owner approval.
  # Remove a SKU  -> the gate runs those legs itself and merge waits on them.
  #
  # Names are validated against .github/sku_config.yaml, so a typo fails the gate
  # rather than silently letting a galaxy leg auto-run. The sim_* galaxy SKUs are
  # absent on purpose: they run on CPU under ttsim and cost nothing scarce.
  REVIEW_ONLY_SKUS: >-
    wh_galaxy
    wh_galaxy_perf
    bh_galaxy
    bh_sc1
    bh_sc1_high_power
    bh_sc4
    bh_sc16

  # Yamls the gate cannot dispatch, so edits to them go to their code owners for
  # review instead of being run. vllm_model_tests.yaml carries no `cmd` on any entry
  # -- vllm-model-tests-impl.yaml passes --allow-missing-cmd and synthesises the
  # command from `model`, `tt-config` and friends -- so there is nothing here to run.
  #
  #   ttnn_sweep_tests.yaml          cmd is the literal string "placeholder - matrix
  #                                  generated by compute_sweep_matrix.py"; the real
  #                                  matrix comes from ttnn-run-sweeps-impl.yaml.
  #   single_card_profiler_tests     its impl injects a "$MODE_FLAG" between the
  #                                  wrapper script and the function name, and uses
  #                                  cmd as an artifact-name component.
  #   llk_ttsim_weekly.yaml          its impl appends --architecture, derived per leg
  #                                  from ttsim_lib, so no static cmd is complete.
  #   llk_ttnop_tests.yaml           runs only through its specialized manual/weekly
  #                                  workflow, which supplies TTNOP setup and recovery.
  #
  # This is not an exemption: the legs still block the PR until an owner approves.
  UNSUPPORTED_YAMLS: >-
    vllm_model_tests.yaml
    ttnn_sweep_tests.yaml
    single_card_profiler_tests.yaml
    llk_ttsim_weekly.yaml
    llk_ttnop_tests.yaml

  # Yamls under tests/pipeline_reorg/ that legitimately hold no test matrix, so the
  # gate has nothing to prove for them. ttsim-skip-list.yaml is a per-arch mapping of
  # test ids, not a list of entries.
  #
  # Only these may be a non-list. Any other yaml that stops being a list of test
  # entries fails the gate, the same way prepare_test_matrix.py errors on that shape
  # -- otherwise reshaping a real matrix into a mapping would read as "no tests" and
  # pass the PR with zero coverage.
  NON_MATRIX_YAMLS: >-
    ttsim-skip-list.yaml

  # Yamls whose tests need a tracy-enabled build. This cannot be derived: nothing
  # in a test entry says "profiler build", and matching cmds on "profiler" also
  # hits runtime_unit_tests.yaml and fabric_perf_tests.yaml. Everything else is
  # derived from the leg itself -- sim_* SKUs run under ttsim, and a pytest cmd
  # needs the wheel.
  #
  # blackhole_e2e_tests.yaml is on the list despite not being named *_profiler_tests:
  # its LoudBox perf legs call run_device_perf, which shells out to `python3 -m tracy`.
  # Without a profiler build the gate dispatches them and they fail on "Tracy tools
  # not found" -- a gate artefact, not a test failure. blackhole-e2e-tests.yaml itself
  # builds with `tracy: true` for the same reason.
  TRACY_BUILD_YAMLS: >-
    galaxy_profiler_tests.yaml
    single_card_profiler_tests.yaml
    t3k_profiler_tests.yaml
    runtime_perf_profiler_tests.yaml
    blackhole_e2e_tests.yaml

jobs:
  scope:
    name: Scope changed tests
    if: ${{ github.event_name == 'merge_group' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    outputs:
      status: ${{ steps.gate.outputs.status }}
      expected-leg-count: ${{ steps.gate.outputs.expected-leg-count }}
      review-leg-count: ${{ steps.gate.outputs.review-leg-count }}
      review-met: ${{ steps.gate.outputs.review-met }}
      leg-digest: ${{ steps.gate.outputs.leg-digest }}
      needs-default: ${{ steps.gate.outputs.needs-default }}
      needs-profiler: ${{ steps.gate.outputs.needs-profiler }}
      matrix: ${{ steps.gate.outputs.matrix }}
      sim-libs: ${{ steps.gate.outputs.sim-libs }}
      leg-count: ${{ steps.gate.outputs.leg-count }}
    steps:
      - name: Checkout the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        timeout-minutes: 20
        with:
          # Full history: the gate diffs against the merge base with main.
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || '' }}

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip3 install PyYAML

      - name: Scope the changed tests, narrow the matrix, enforce owner review
        id: gate
        # TODO: switch to tenstorrent/tt-metal/.github/actions/verify-changed-tests@main
        # once this action lands on main -- @main can't resolve to a path that doesn't
        # exist there yet. Pinning to @main is the point: a PR branch then always runs
        # the current gate, not whatever copy (or lack of one) sits at its own head.
        uses: ./.github/actions/verify-changed-tests
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          event: ${{ github.event_name }}
          base: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          repo: ${{ github.repository }}
          pr: ${{ github.event.pull_request.number }}
          output: scope.json

      - name: Summarise
        if: ${{ !cancelled() }}
        run: |
          {
            echo "### Verify changed tests"
            echo
            echo "Status: \`${{ steps.gate.outputs.status }}\`"
            echo "Legs to prove: \`${{ steps.gate.outputs.expected-leg-count }}\`"
            echo "Legs needing an owner review: \`${{ steps.gate.outputs.review-leg-count }}\`"
            echo "Leg digest: \`${{ steps.gate.outputs.leg-digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # --- builds ---------------------------------------------------------------
  # Only the flavours the surviving legs actually need. A PR touching one gtest
  # pipeline pays for one plain build and nothing else.

  build-default:
    name: Build
    needs: scope
    if: ${{ github.event_name == 'pull_request' && needs.scope.outputs.needs-default == 'true' }}
    uses: ./.github/workflows/build-artifact.yaml
    permissions:
      contents: read
      packages: write
    secrets: inherit
    with:
      build-inplace-wheel: true
      tracy: false

  build-profiler:
    name: Build (profiler)
    needs: scope
    if: ${{ github.event_name == 'pull_request' && needs.scope.outputs.needs-profiler == 'true' }}
    uses: ./.github/workflows/build-artifact.yaml
    permissions:
      contents: read
      packages: write
    secrets: inherit
    with:
      build-inplace-wheel: true
      tracy: true

  fetch-ttsim:
    name: Fetch ttsim (${{ matrix.lib }})
    needs: scope
    if: >-
      ${{ github.event_name == 'pull_request'
          && needs.scope.outputs.sim-libs != '[]'
          && needs.scope.outputs.sim-libs != '' }}
    runs-on: ubuntu-slim
    strategy:
      fail-fast: false
      matrix:
        lib: ${{ fromJson(needs.scope.outputs.sim-libs) }}
    concurrency:
      group: ttsim-lib-${{ github.run_id }}-${{ matrix.lib }}
      cancel-in-progress: false
      queue: max
    steps:
      - name: Checkout fetch-ttsim action and pinned ttsim version
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        timeout-minutes: 20
        with:
          sparse-checkout: |
            .github/actions/fetch-ttsim
            tt_metal/ttsim-version
          sparse-checkout-cone-mode: false

      - name: Fetch simulator binary
        uses: ./.github/actions/fetch-ttsim
        with:
          lib: ${{ matrix.lib }}

  # --- runs -----------------------------------------------------------------
  run-tests:
    name: ${{ matrix.leg.name }}
    # fetch-ttsim is a prerequisite even for hardware legs: every fetch the run needs
    # completes before any test starts.
    needs: [scope, build-default, build-profiler, fetch-ttsim]
    # An empty matrix vector is a workflow-level error in Actions, not a skipped
    # job: the run is marked failed with nothing red inside it. scope returns an
    # empty matrix on every no_op PR -- i.e. most of them -- so guard it here the
    # same way fetch-ttsim guards sim-libs above.
    if: >-
      ${{ !cancelled()
          && !contains(needs.*.result, 'failure')
          && github.event_name == 'pull_request'
          && needs.scope.outputs.matrix != '[]'
          && needs.scope.outputs.matrix != ''}}
    strategy:
      fail-fast: false
      matrix:
        leg: ${{ fromJson(needs.scope.outputs.matrix) }}
    runs-on: ${{ matrix.leg.runs_on }}
    container:
      image: >-
        ${{ (matrix.leg.gate_packages && matrix.leg.gate_profile == 'profiler' && needs.build-profiler.outputs.basic-dev-docker-image)
         || (matrix.leg.gate_packages && needs.build-default.outputs.basic-dev-docker-image)
         || (matrix.leg.gate_profile == 'profiler' && needs.build-profiler.outputs.dev-docker-image)
         || needs.build-default.outputs.dev-docker-image
         || 'docker-image-unresolved!' }}
      env:
        # An entry only carries `arch` when it needs it to tell two otherwise
        # identical entries apart, so most legs have none and ARCH_NAME arrived
        # empty -- which the test scripts reject outright ("Must provide ARCH_NAME
        # in environment"). Fall back to the SKU prefix, the same derivation
        # single-card-profiler-tests-impl.yaml uses.
        ARCH_NAME: >-
          ${{ matrix.leg.arch
              || (contains(matrix.leg.sku, 'quasar') && 'quasar')
              || ((startsWith(matrix.leg.sku, 'bh_') || startsWith(matrix.leg.sku, 'sim_bh')) && 'blackhole')
              || 'wormhole_b0' }}
        LOGURU_LEVEL: INFO
        TT_LOGGER_LEVEL: warn
        LD_LIBRARY_PATH: /work/build/lib
        GTEST_OUTPUT: xml:/work/generated/test_reports/
        TT_METAL_HOME: ${{ matrix.leg.gate_packages && '/usr/libexec/tt-metalium' || '/work' }}
        # Set by 57 of the owning impls and assumed by anything importing from the
        # tree; tracks TT_METAL_HOME so a packages leg resolves to the same root.
        PYTHONPATH: ${{ matrix.leg.gate_packages && '/usr/libexec/tt-metalium' || '/work' }}
        GTEST_TOTAL_SHARDS: ${{ matrix.leg.gtest_shard_total || 1 }}
        GTEST_SHARD_INDEX: ${{ matrix.leg.gtest_shard_index || 0 }}
        HF_HUB_OFFLINE: ${{ (matrix.leg['weights-cache-mode'] == 'local-disk' || matrix.leg['weights-cache-mode'] == 'lfc') && '0' || '1' }}
        # The tracy paths the three profiler impls set. Empty on every other leg,
        # which the consuming scripts treat as unset (they test with -z).
        PROFILER_SCRIPTS_ROOT: ${{ matrix.leg.gate_profile == 'profiler' && '/work/tools/tracy' || '' }}
        PROFILER_TEST_SCRIPTS_ROOT: ${{ matrix.leg.gate_profile == 'profiler' && '/work/tests/tt_metal/tools/profiler' || '' }}
        PROFILER_ARTIFACTS_DIR: ${{ matrix.leg.gate_profile == 'profiler' && '/work/generated/profiler' || '' }}
        PROFILER_OUTPUT_DIR: ${{ matrix.leg.gate_profile == 'profiler' && '/work/generated/profiler/reports' || '' }}
        DONT_USE_VIRTUAL_ENVIRONMENT: ${{ matrix.leg.gate_profile == 'profiler' && '1' || '' }}
      volumes:
        - ${{ github.workspace }}/docker-job:/work # Subdir to workaround https://github.com/actions/runner/issues/691
        # GitHub-hosted runners have no hugepages or weights cache; derived from runs_on
        # so a new hosted SKU is covered automatically. Same exclusion as smoke.yaml.
        - ${{ contains(join(matrix.leg.runs_on, ','), 'ubuntu-latest') && '/no_hugepages' || '/dev/hugepages-1G:/dev/hugepages-1G' }}
        # Weights cache, selected by the SKU's weights-cache-mode exactly as the
        # owning pipeline selects it.
        - ${{ contains(join(matrix.leg.runs_on, ','), 'ubuntu-latest') && '/no_weights_cache' || (matrix.leg['weights-cache-mode'] == 'cloud-mlperf' && '/mnt/MLPerf/huggingface:/mnt/MLPerf/huggingface:ro') || (matrix.leg['weights-cache-mode'] == 'yyz4-mnt-models' && '/mnt/models/huggingface:/mnt/MLPerf/huggingface:ro') || (matrix.leg['weights-cache-mode'] == 'local-disk' || matrix.leg['weights-cache-mode'] == 'lfc') && '/localdev/blackhole_demos/huggingface_data:/mnt/MLPerf/huggingface:rw' || '/mnt/MLPerf:/mnt/MLPerf:ro' }}
      options: >-
         ${{ (startsWith(matrix.leg.sku, 'sim_') && '--label runner-mode=sim')
             || (matrix.leg.sku != 'github_hosted_cpu' && '--device /dev/tenstorrent')
             || '' }}
    defaults:
      run:
        shell: bash
        working-directory: /work # https://github.com/actions/runner/issues/878
    steps:
      - name: 🧬 Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        timeout-minutes: 20
        with:
          submodules: recursive
          path: docker-job

      - name: ⬇️ Setup Job
        if: ${{ !matrix.leg.gate_packages }}
        uses: ./docker-job/.github/actions/setup-job
        timeout-minutes: 10
        with:
          build-artifact-name: >-
            ${{ (matrix.leg.gate_profile == 'profiler' && needs.build-profiler.outputs.build-artifact-name)
             || needs.build-default.outputs.build-artifact-name
             || '' }}
          wheel-artifact-name: >-
            ${{ (matrix.leg.gate_profile == 'profiler' && needs.build-profiler.outputs.wheel-artifact-name)
             || needs.build-default.outputs.wheel-artifact-name
             || '' }}
          auto-triage: false

      - name: ⬇️ Download packages artifact
        if: ${{ matrix.leg.gate_packages }}
        uses: ./docker-job/.github/actions/download-artifact-with-retry
        timeout-minutes: 15
        with:
          name: >-
            ${{ (matrix.leg.gate_profile == 'profiler' && needs.build-profiler.outputs.packages-artifact-name)
             || needs.build-default.outputs.packages-artifact-name
             || 'packages artifact unresolved!' }}
          path: /work/pkgs/

      - name: Install packages
        if: ${{ matrix.leg.gate_packages }}
        timeout-minutes: 10
        run: |
          set -euo pipefail
          apt update
          # tt-metalium-jit is optional: TT_USE_SYSTEM_SFPI builds don't produce it, since this
          # container already has /opt/tenstorrent/sfpi for the JIT-build runtime fallback
          # (see tt_metal/jit_build/build.cpp).
          shopt -s nullglob
          pkgs=(./pkgs/tt-metalium_*.deb ./pkgs/tt-metalium-jit_*.deb ./pkgs/tt-metalium-dev_*.deb ./pkgs/tt-metalium-examples_*.deb)
          apt install -y "${pkgs[@]}"

      - name: ⬇️ Setup TTSim
        if: ${{ startsWith(matrix.leg.sku, 'sim_') }}
        uses: ./docker-job/.github/actions/setup-ttsim
        timeout-minutes: 5
        with:
          sku: ${{ matrix.leg.sku }}
          root: ${{ matrix.leg.gate_packages && '/usr/libexec/tt-metalium' || '/work' }}

      - name: Install pytest-xdist (sim parallel execution)
        if: ${{ startsWith(matrix.leg.sku, 'sim_') && !matrix.leg.gate_packages }}
        run: uv pip install pytest-xdist

      - name: Apply ttsim wormhole workaround patches
        if: ${{ startsWith(matrix.leg.sku, 'sim_wh') }}
        run: |
          HEADER=$(find /opt/venv -name "cunpack_common.h" -path "*wormhole_b0*" 2>/dev/null | head -1)
          echo "Patching: $HEADER"
          sed -i -e '/TT_UNPACR(SrcA, 0, 0, context_id, 0, 1 \/\* Set OvrdThreadId\*\/, 0 \/\*Set Dvalid\*\/, p_unpacr::RAREFYB_DISABLE, 1, 0, 0, 0, 1);/d' \
            "$HEADER"

      - name: ${{ matrix.leg.name }}
        if: ${{ !startsWith(matrix.leg.sku, 'sim_') }}
        timeout-minutes: ${{ matrix.leg.timeout }}
        uses: ./docker-job/.github/actions/run-with-log
        with:
          log-file: generated/test_logs/${{ matrix.leg.name }}.log
          run: |
            mkdir -p generated/test_reports
            # A quoted heredoc keeps the outer shell from touching the cmd, so
            # multi-line entries and embedded quoting survive intact -- 34 of the
            # pipeline yamls have multi-line cmds, and interpolating one straight
            # into an if/else would mangle it and apply a leading env assignment to
            # only its first line. Same pattern as blaze-models-prefill-tests-impl
            # and ttnn-sanity-tests-impl. The delimiter must not appear in any cmd.
            CMD=$(cat <<'GATE_CMD_EOF'
            ${{ matrix.leg.cmd }}
            GATE_CMD_EOF
            )
            if [[ '${{ matrix.leg.dispatch_mode }}' == 'sd' ]]; then
              export TT_METAL_SLOW_DISPATCH_MODE=1
            fi
            eval "$CMD"

      - name: ${{ matrix.leg.name }} (simulator)
        if: ${{ startsWith(matrix.leg.sku, 'sim_') }}
        timeout-minutes: ${{ matrix.leg.timeout }}
        uses: ./docker-job/.github/actions/run-with-log
        with:
          log-file: generated/test_logs/${{ matrix.leg.name }}.log
          run: |
            mkdir -p generated/test_reports
            # gate_pytest_deselect carries the --deselect args for this leg's arch,
            # resolved from tests/pipeline_reorg/ttsim-skip-list.yaml: the tests that
            # do not yet work under the simulator. Without them a sim leg fails on a
            # test its own pipeline knowingly skips.
            if [[ '${{ matrix.leg.gate_packages }}' != 'true' ]]; then
              export PYTEST_ADDOPTS="-p no:timeout -n 4 ${{ matrix.leg.gate_pytest_deselect }} ${PYTEST_ADDOPTS:-}"
            fi
            CMD=$(cat <<'GATE_CMD_EOF'
            ${{ matrix.leg.cmd }}
            GATE_CMD_EOF
            )
            eval "$CMD"

      - uses: ./docker-job/.github/actions/upload-artifact-with-job-uuid
        timeout-minutes: 10
        if: ${{ !cancelled() }}
        with:
          prefix: "test_reports_"

      - name: Generate gtest annotations on failure
        uses: tenstorrent/tt-metal/.github/actions/generate-gtest-failure-message@main
        if: ${{ failure() }}

  # --- verdict --------------------------------------------------------------

  verify-changed-tests:
    # This job name is the required status check. It must run in every event, so
    # the merge queue always gets an answer.
    name: Changed tests verified
    needs: [scope, run-tests]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Decide
        run: |
          set -euo pipefail

          fail() { echo "::error::$1"; exit 1; }

          if [[ '${{ github.event.pull_request.draft }}' == 'true' ]]; then
            echo "Draft PR: the gate runs when it is marked ready for review. Drafts cannot be queued."
            exit 0
          fi

          # A skipped stage is never treated as a pass. Every branch below states
          # positively what had to succeed.
          [[ '${{ needs.scope.result }}' == 'success' ]] \
            || fail "the scope stage did not succeed (${{ needs.scope.result }})."

          if [[ '${{ github.event_name }}' == 'merge_group' ]]; then
            echo "Merge group: scope re-resolved cleanly; the legs already ran on the PR head."
            exit 0
          fi

          # Every leg scope asked for must have been dispatched. A matrix that lost
          # legs on the way would otherwise look exactly like a clean pass.
          if [[ '${{ needs.scope.outputs.expected-leg-count || 0 }}' != '${{ needs.scope.outputs.leg-count || 0 }}' ]]; then
            fail "scope resolved ${{ needs.scope.outputs.expected-leg-count || 0 }} leg(s) but ${{ needs.scope.outputs.leg-count || 0 }} were dispatched."
          fi

          if [[ '${{ needs.scope.outputs.leg-count || 0 }}' != '0' ]]; then
            [[ '${{ needs.run-tests.result }}' == 'success' ]] \
              || fail "${{ needs.scope.outputs.leg-count }} leg(s) did not all pass (run-tests: ${{ needs.run-tests.result }})."
          fi

          # Reported, not failed on: CODEOWNERS and the branch ruleset already block the merge.
          if [[ '${{ needs.scope.outputs.review-met }}' == 'false' ]]; then
            echo "::notice::${{ needs.scope.outputs.review-leg-count }} leg(s) on highly contended SKUs still need an approving review from a code owner; the branch ruleset holds the merge until then. See the scope job for which files and owners."
          fi

          case '${{ needs.scope.outputs.status }}' in
            no_op)
              echo "No behaviour-affecting test-entry changes. Nothing to prove."
              ;;
            blocked)
              echo "${{ needs.scope.outputs.leg-count }} leg(s) ran; ${{ needs.scope.outputs.review-leg-count }} on highly contended SKUs are left to code owner review."
              ;;
            run)
              echo "All ${{ needs.scope.outputs.leg-count }} leg(s) passed."
              ;;
            *)
              fail "unrecognised scope status '${{ needs.scope.outputs.status }}'."
              ;;
          esac

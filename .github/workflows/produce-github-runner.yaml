name: "[internal] Produce GitHub Runner data"

on:
  workflow_dispatch:

  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: read

jobs:
  produce-github-runner:
    runs-on: ubuntu-slim
    timeout-minutes: 4

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        timeout-minutes: 20

      - name: Check GitHub API rate limit
        env:
          # PAT with Administration:read (required to list self-hosted runners).
          GH_TOKEN: ${{ secrets.RUNNER_API_TOKEN }}
        run: gh api rate_limit

      - name: Fetch self-hosted runners
        env:
          GH_TOKEN: ${{ secrets.RUNNER_API_TOKEN }}
        run: |
          set -euo pipefail

          # Lists all self-hosted runners registered to tt-metal. --paginate
          # concatenates pages (each page is a {total_count, runners} object);
          # the build step slurps and flattens them below.
          gh api --paginate /orgs/tenstorrent/actions/runners > runners_raw.json

      - name: Build runner snapshot
        run: |
          set -euo pipefail

          mkdir -p generated/github_runner
          COLLECTED_AT=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          # Shape must match dags/pipelines/github_runner/pydantic_models.py in
          # data_airflow: {collected_at, runners:[{id,name,os,status,busy,labels}]}.
          # Labels are flattened from GitHub's {name,...} objects to name strings.
          # IN_SERVICE is derived downstream from the labels; version is optional.
          jq -n \
            --arg ts "$COLLECTED_AT" \
            --slurpfile pages runners_raw.json '
          {
            collected_at: $ts,
            runners: [
              $pages[] | .runners[]? | {
                id,
                name,
                os,
                status,
                busy,
                labels: [ .labels[]?.name ]
              }
            ]
          }
          ' > generated/github_runner/github_runner_snapshot.json

          echo "Runner count:"
          jq '.runners | length' generated/github_runner/github_runner_snapshot.json

      - name: Add timestamp to filename
        run: |
          TS=$(date -u +"%Y%m%dT%H%M%SZ")
          mv generated/github_runner/github_runner_snapshot.json \
             generated/github_runner/${TS}_github_runner_snapshot.json

      # Download this from the run's Summary page to inspect / push to STG.
      - name: Upload snapshot as artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: github-runner-snapshot
          path: generated/github_runner/*.json
          if-no-files-found: error

      # TEMPORARY: also SFTP on the branch push so we can test the real upload
      # end-to-end before merge. Requires aws_s3 + aws_sftp applied (bucket +
      # github-runner-writer user). Revert to `== 'schedule'` (or drop the gate)
      # when removing the temporary push trigger before merge.
      - name: Upload runner data via SFTP
        if: github.event_name == 'push' || github.event_name == 'schedule'
        uses: ./.github/actions/upload-data-via-sftp
        with:
          ssh-private-key: ${{ secrets.SFTP_GITHUB_RUNNER_WRITER_KEY }}
          username: ${{ secrets.SFTP_GITHUB_RUNNER_WRITER_USERNAME }}
          hostname: ${{ secrets.SFTP_GITHUB_RUNNER_WRITER_HOSTNAME }}
          sftp-batchfile: .github/actions/upload-data-via-sftp/github_runner_batchfile.txt

name: "LLK SFPU ULP budget guard"

# Called from PR Gate (pr-gate.yaml) on every non-draft PR and merge-queue entry. A
# light job first lists the budget tables the change touches (the
# sfpu_accuracy_budget_*.yaml files under tt_metal/tt-llk/tests/python_tests/helpers/,
# one per architecture, deletions included); the comparison runs only when there is one,
# in the LLK CI image, since the tool is a module of the test package
# (python -m helpers.ulp_budget_diff). It takes each table's architecture from its
# file name.
#
# It fails a change that loosens a gate in a table -- a raised figure, a widened
# `near_zero_atol`, a row demoted to `metric: tolerance`, a gated row deleted, a
# tolerance row's declared `atol`/`rtol` widened, or a tolerance row's recorded
# measurement or non-finite count raised or dropped (the nightly headroom check holds
# the cell to those) -- unless the change is a budget raise PR: it touches nothing but
# the tables, and carries the `ulp-budget-raise-approved` label. A raise therefore never
# rides along with the kernel or golden change that needed it, and someone opts in to
# it. A cell no row covered before (a new op, or a cell enrolled with its kernel) is an
# addition, not a loosening. It also fails on a table that cannot load.
#
# PR Gate does not run on `labeled`: after adding the label, re-run this job ("Re-run
# failed jobs" on the PR Gate run). The label is read from the API when the job runs.
#
# The sweep that holds the hardware to the tables is llk-sfpu-ulp-sweep.yaml, nightly.

on:
  workflow_call:
    inputs:
      docker-image:
        description: "The LLK CI image, which has the test package's dependencies"
        required: true
        type: string

env:
  TABLE_DIR: tt_metal/tt-llk/tests/python_tests/helpers
  MARKER: "<!-- llk-ulp-budget-guard -->"

jobs:
  find-tables:
    name: "SFPU ULP budget tables changed"
    runs-on: ubuntu-slim
    timeout-minutes: 15
    permissions:
      contents: read
      issues: read
      pull-requests: write
    outputs:
      tables: ${{ steps.find.outputs.tables }}
    steps:
      - name: Checkout the change
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        timeout-minutes: 10
        with:
          # The commit and its first parent, which is all the comparison reads.
          fetch-depth: 2
          sparse-checkout: tt_metal/tt-llk/tests/python_tests/helpers

      - name: List the budget tables the change touches
        id: find
        shell: bash
        run: |
          set -euo pipefail
          # The checkout is the merge the PR proposes (pull_request) or the queue's
          # commit (merge_group). Its first parent is what the change lands on, with
          # everything queued ahead of it, so the diff is exactly this change -- unlike
          # the event's base.sha, which can be absent after a base-branch force-push.
          if ! git rev-parse --verify --quiet 'HEAD^1^{commit}' > /dev/null; then
            echo "::error title=SFPU ULP budget guard::The checkout has no first parent to compare against."
            exit 1
          fi
          echo "Comparing HEAD $(git rev-parse HEAD) against HEAD^1 $(git rev-parse HEAD^1)"
          # Every table by pattern, so a table added or renamed is not missed; no
          # --diff-filter, so a deleted table is judged too.
          tables=$(git diff --name-only HEAD^1 HEAD -- "$TABLE_DIR/sfpu_accuracy_budget_*.yaml" \
            | xargs -r -n1 basename | tr '\n' ' ')
          if [[ -z "$tables" ]]; then
            echo "No budget table changed; nothing to judge."
          else
            echo "Changed: $tables"
          fi
          echo "tables=${tables% }" >> "$GITHUB_OUTPUT"

      - name: Retire an earlier report
        # A push that drops the table edits leaves the report of the push before it, which
        # may say Blocked. Edit it to say so; post nothing when there is none.
        if: ${{ github.event_name == 'pull_request' && steps.find.outputs.tables == '' }}
        continue-on-error: true
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const marker = process.env.MARKER;
            const mine = comments.find(
              (c) => c.user?.type === 'Bot' && c.body?.includes(marker));
            if (!mine) return;
            const body = `${marker}\n### SFPU ULP budgets\n\n` +
              'This pull request no longer changes a budget table.\n';
            if (mine.body !== body) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            }

  budget-guard:
    name: "SFPU ULP budgets"
    needs: find-tables
    if: ${{ needs.find-tables.outputs.tables != '' }}
    runs-on: ${{ github.event_name == 'merge_group' && 'tt-ubuntu-2204-medium-prio-stable' || 'tt-ubuntu-2204-medium-stable' }}
    timeout-minutes: 30
    permissions:
      contents: read
      issues: read
      pull-requests: write
    container:
      image: ${{ inputs.docker-image }}
    env:
      TABLES: ${{ needs.find-tables.outputs.tables }}
    steps:
      - name: Checkout the change
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        timeout-minutes: 20
        with:
          fetch-depth: 2

      - name: Take the base revision of each table
        shell: bash
        run: |
          set -euo pipefail
          # Before any other git command: in the container the checkout is owned by
          # another uid as far as git can tell, and it refuses it otherwise.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          mkdir -p "$RUNNER_TEMP/base"
          for table in $TABLES; do
            path="$TABLE_DIR/$table"
            # A table the change introduces has no base version; an empty one makes
            # every row read as added.
            if git cat-file -e "HEAD^1:$path" 2> /dev/null; then
              git show "HEAD^1:$path" > "$RUNNER_TEMP/base/$table"
            else
              : > "$RUNNER_TEMP/base/$table"
            fi
          done

      - name: Decide whether this is a budget raise PR
        id: raise
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const { execSync } = require('child_process');
            const label = 'ulp-budget-raise-approved';
            const dir = process.env.TABLE_DIR;
            const tables = process.env.TABLES.split(' ').map((t) => `${dir}/${t}`);
            const decide = (allowed, why) => {
              core.setOutput('allowed', allowed ? 'true' : 'false');
              core.setOutput('why', why);
              core.info(why);
            };
            const changed = execSync('git diff --name-only HEAD^1 HEAD', { encoding: 'utf8' })
              .split('\n').filter(Boolean);
            const others = changed.filter((path) => !tables.includes(path));
            // The comparison runs on the change's own helpers/: a change to them beside a
            // table is judged by its own rules, so say so.
            const helpers = others.filter((path) => path.startsWith(`${dir}/`));
            if (helpers.length) {
              const note = `The comparison ran on this change's own helpers/, which it also ` +
                `changes (${helpers.slice(0, 3).join(', ')}${helpers.length > 3 ? ', …' : ''}): ` +
                `review the verdict against that change.`;
              core.warning(note, { title: 'SFPU ULP budget guard' });
              core.setOutput('note', note);
            }
            // The queue's commit names its pull request in the branch
            // (gh-readonly-queue/<base>/pr-<number>-<sha>).
            let number = context.payload.pull_request?.number;
            if (!number && context.eventName === 'merge_group') {
              const found = /\/pr-(\d+)-[0-9a-f]+$/.exec(context.payload.merge_group.head_ref);
              number = found && Number(found[1]);
            }
            let labelled = false;
            if (number) {
              const labels = await github.paginate(github.rest.issues.listLabelsOnIssue, {
                ...context.repo, issue_number: number, per_page: 100,
              });
              labelled = labels.some((l) => l.name === label);
            }
            if (others.length) {
              decide(false, `not a budget raise PR: it also changes ${others.length} other ` +
                `file(s), e.g. ${others.slice(0, 3).join(', ')}`);
            } else if (!labelled) {
              decide(false, `not a budget raise PR: the '${label}' label is not set`);
            } else {
              decide(true, `a budget raise PR: only the tables changed, and '${label}' is set`);
            }

      - name: Compare the budgets
        id: compare
        shell: bash
        env:
          ALLOWED: ${{ steps.raise.outputs.allowed }}
          WHY: ${{ steps.raise.outputs.why }}
          NOTE: ${{ steps.raise.outputs.note }}
        working-directory: tt_metal/tt-llk/tests/python_tests
        run: |
          set -uo pipefail
          # As a module of the test package, in the LLK image, one table at a time; the
          # tool takes the architecture from the table's file name. Exit 1 is a loosened
          # gate, 2 a table that cannot load; --allow-raises admits the first, never the
          # second, and the worst table's status is the job's.
          allow=()
          if [[ "$ALLOWED" == true ]]; then
            allow=(--allow-raises)
          fi
          status=0
          report="$RUNNER_TEMP/ulp_budget_report.md"
          : > "$report"
          for table in $TABLES; do
            one=0
            python3 -m helpers.ulp_budget_diff diff \
              --base "$RUNNER_TEMP/base/$table" \
              --head "helpers/$table" \
              "${allow[@]}" \
              --out "$RUNNER_TEMP/ulp_budget_report_$table.md" || one=$?
            {
              echo "## $table"
              echo
              cat "$RUNNER_TEMP/ulp_budget_report_$table.md"
              echo
            } >> "$report"
            if (( one > status )); then status=$one; fi
          done
          if [[ -n "$NOTE" ]]; then
            printf '\n**Note:** %s\n' "$NOTE" >> "$report"
          fi
          if [[ "$status" == 1 ]]; then
            printf '\n**Blocked:** %s. Move the loosened rows into a pull request that %s\n' \
              "$WHY" "changes only the tables, and have a reviewer add the \`ulp-budget-raise-approved\` label; then re-run this job." \
              >> "$report"
          fi
          # A verdict word rather than the exit code: the Fail step below compares it
          # with 'pass', so an output that was never written fails the job instead of
          # reading as 0.
          case "$status" in
            0) echo "verdict=pass" >> "$GITHUB_OUTPUT" ;;
            1) echo "verdict=loosened" >> "$GITHUB_OUTPUT" ;;
            *) echo "verdict=unloadable" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Publish the report
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          if [[ -s "$RUNNER_TEMP/ulp_budget_report.md" ]]; then
            cat "$RUNNER_TEMP/ulp_budget_report.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "The comparison produced no report; see the step above." \
              >> "$GITHUB_STEP_SUMMARY"
          fi
          if grep -q "loosen a gate" "$RUNNER_TEMP/ulp_budget_report.md" 2> /dev/null; then
            echo "::warning title=SFPU ULP budget loosened::A gate in a budget table \
          was loosened. See the job summary for which rows."
          fi

      - name: Comment on the pull request
        # A fork PR's token is read-only, so the comment is best effort. The job
        # summary carries the same report either way. The merge queue does not
        # comment: the PR's own run already did.
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        continue-on-error: true
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const fs = require('fs');
            // Written outside the checkout, so nothing in the tree has to ignore it.
            const report = `${process.env.RUNNER_TEMP}/ulp_budget_report.md`;
            if (!fs.existsSync(report)) return;
            const marker = process.env.MARKER;
            // The report lists every loosened cell. A comment holds 65,536 characters,
            // so a longer one is cut at a line and points at the job summary.
            const limit = 60000;
            let text = fs.readFileSync(report, 'utf8');
            if (text.length > limit) {
              const run = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}` +
                `/actions/runs/${process.env.GITHUB_RUN_ID}`;
              text = text.slice(0, text.lastIndexOf('\n', limit)) +
                `\n\n_Cut at ${limit} characters: the [job summary](${run}) has the whole report._\n`;
            }
            const body = `${marker}\n${text}`;
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            // One comment, edited in place, so a series of pushes does not bury the
            // conversation. Only a bot's comment: a person quoting the marker in a
            // reply is never overwritten.
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const mine = comments.find(
              (c) => c.user?.type === 'Bot' && c.body?.includes(marker));
            if (mine) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Fail on a loosened gate or a table that cannot load
        if: ${{ steps.compare.outputs.verdict != 'pass' }}
        shell: bash
        env:
          VERDICT: ${{ steps.compare.outputs.verdict }}
        run: |
          if [[ "$VERDICT" == loosened ]]; then
            echo "::error title=SFPU ULP budget loosened::A gate in a budget table was \
          loosened outside a budget raise PR (only the tables changed, and the \
          'ulp-budget-raise-approved' label set). See the job summary."
          else
            echo "::error title=SFPU ULP budget table::A budget table cannot load (the \
          report names the base or the head), so no comparison with it means anything. \
          See the job summary."
          fi
          exit 1

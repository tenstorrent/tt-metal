name: "(T3K) Choose your pipeline"

on:
  workflow_dispatch:
    inputs:
      trigger_type:
        description: "Trigger type. 'manual' = custom selection below; other options = predefined configs. ⚠️ Resource intensive!"
        required: true
        type: choice
        options:
          - manual
          - models-mandatory # unit tests only
          - models-extended # unit tests only
        default: manual
      extra-tag:
        required: true
        type: string
        default: "in-service"
      t3000-unit:
        description: "Unit tests: Select 'all', specific model or 'disabled'"
        type: choice
        default: disabled
        options:
          - disabled
          - all
          - t3k_ttmetal_tests
          - t3k_ttnn_tests
          - llama3-small
          - llama3.2-11b
          - llama3.2-11b-vision
          - n300 mesh llama3.2-11b-vision
          - llama3.2-90b-vision
          - llama3.2-90b
          - mixtral
          - unet shallow
          - qwen25_vl
          - gemma3-small
      t3000-integration:
        description: "Integration tests: Select 'all', specific model or 'disabled'"
        type: choice
        default: disabled
        options:
          - disabled
          - all
          - tteager
          - ethernet
          - trace stress
          - deepseek-modules
      t3000-e2e:
        required: false
        type: boolean
        default: false
      t3000-profiler:
        description: "Profiler tests"
        required: false
        type: boolean
        default: false
      platform:
        required: false
        type: choice
        default: "Ubuntu 22.04"
        options:
          - "Ubuntu 22.04"
          - "Ubuntu 24.04"
        description: "Platform to build and test"
      build-type:
        required: false
        type: choice
        options:
          - Release
          - Debug
          - RelWithDebInfo
          - ASan
          - TSan
        default: Release
      enable-lto:
        required: false
        type: boolean
        default: false
        description: "Enable Link Time Optimization (LTO)"

run-name: T3000 ${{ inputs.trigger_type == 'manual' && 'custom' || inputs.trigger_type }} pipeline
jobs:
  check-harbor:
    uses: ./.github/workflows/check-harbor.yaml
  # Centralized logic to determine what should run
  determine-tests:
    runs-on: ubuntu-slim
    outputs:
      run-unit: ${{ steps.logic.outputs.run-unit }}
      run-integration: ${{ steps.logic.outputs.run-integration }}
      run-e2e: ${{ steps.logic.outputs.run-e2e }}
      run-profiler: ${{ steps.logic.outputs.run-profiler }}
    steps:
      - name: Determine test execution
        id: logic
        run: |
          case "${{ inputs.trigger_type }}" in
            "manual")
              echo "run-unit=${{ inputs.t3000-unit != 'disabled' }}" >> $GITHUB_OUTPUT
              echo "run-integration=${{ inputs.t3000-integration != 'disabled' }}" >> $GITHUB_OUTPUT
              echo "run-e2e=${{ inputs.t3000-e2e }}" >> $GITHUB_OUTPUT
              echo "run-profiler=${{ inputs.t3000-profiler }}" >> $GITHUB_OUTPUT
              ;;
            "models-mandatory")
              echo "run-unit=true" >> $GITHUB_OUTPUT
              echo "run-integration=false" >> $GITHUB_OUTPUT
              echo "run-e2e=false" >> $GITHUB_OUTPUT
              echo "run-profiler=false" >> $GITHUB_OUTPUT
              ;;
            "models-extended")
              echo "run-unit=true" >> $GITHUB_OUTPUT
              echo "run-integration=false" >> $GITHUB_OUTPUT
              echo "run-e2e=false" >> $GITHUB_OUTPUT
              echo "run-profiler=false" >> $GITHUB_OUTPUT
              ;;
          esac
  build-artifact:
    needs: [check-harbor, determine-tests]
    if: ${{ !cancelled() && needs.determine-tests.result == 'success' }}
    uses: ./.github/workflows/build-artifact.yaml
    permissions:
      contents: read
      packages: write
    secrets: inherit
    with:
      harbor-prefix: ${{ needs.check-harbor.outputs.harbor-prefix }}
      platform: ${{ inputs.platform || 'Ubuntu 22.04' }}
      build-type: ${{ inputs.build-type || 'Release' }}
      enable-lto: ${{ inputs.enable-lto || false }}
      build-inplace-wheel: true
      tracy: ${{ needs.determine-tests.outputs.run-perf == 'true' }}
  t3000-unit-tests:
    if: ${{ needs.determine-tests.outputs.run-unit == 'true' }}
    needs: [build-artifact, determine-tests]
    secrets: inherit
    uses: ./.github/workflows/t3000-unit-tests-impl.yaml
    with:
      enabled-skus: "wh_llmbox"
      docker-image: ${{ needs.build-artifact.outputs.dev-docker-image }}
      build-artifact-name: ${{ needs.build-artifact.outputs.build-artifact-name }}
      wheel-artifact-name: ${{ needs.build-artifact.outputs.wheel-artifact-name }}
      model: ${{ inputs.trigger_type == 'manual' && inputs.t3000-unit || 'all' }}
  t3000-integration-tests:
    if: ${{ needs.determine-tests.outputs.run-integration == 'true' }}
    needs: [build-artifact, determine-tests]
    secrets: inherit
    uses: ./.github/workflows/t3000-integration-tests-impl.yaml
    with:
      enabled-skus: "wh_llmbox"
      docker-image: ${{ needs.build-artifact.outputs.dev-docker-image }}
      build-artifact-name: ${{ needs.build-artifact.outputs.build-artifact-name }}
      wheel-artifact-name: ${{ needs.build-artifact.outputs.wheel-artifact-name }}
      model: ${{ inputs.trigger_type == 'manual' && inputs.t3000-integration || 'all' }}
  t3000-e2e-tests:
    if: ${{ needs.determine-tests.outputs.run-e2e == 'true' }}
    needs: [build-artifact, determine-tests]
    secrets: inherit
    uses: ./.github/workflows/t3000-e2e-tests-impl.yaml
    with:
      enabled-skus: "wh_llmbox"
      docker-image: ${{ needs.build-artifact.outputs.dev-docker-image }}
      build-artifact-name: ${{ needs.build-artifact.outputs.build-artifact-name }}
      wheel-artifact-name: ${{ needs.build-artifact.outputs.wheel-artifact-name }}
  t3000-profiler-tests:
    if: ${{ needs.determine-tests.outputs.run-profiler == 'true' }}
    needs: [build-artifact, determine-tests]
    secrets: inherit
    uses: ./.github/workflows/t3000-profiler-tests-impl.yaml
    with:
      docker-image: ${{ needs.build-artifact.outputs.dev-docker-image }}
      build-artifact-name: ${{ needs.build-artifact.outputs.build-artifact-name }}
      wheel-artifact-name: ${{ needs.build-artifact.outputs.wheel-artifact-name }}

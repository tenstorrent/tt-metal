name: "[internal] ttsim sanity tests impl"

on:
  workflow_call:
    inputs:
      basic-docker-image:
        required: true
        type: string
      package-artifact-name:
        required: false
        type: string
      ref:
        required: false
        type: string
        default: ""
        description: "Commit SHA to test (default: HEAD)"
      summary-scope:
        required: false
        type: string
        default: ""
        description: "Discriminator for the AI summaries when the calling workflow is invoked more than once per run"
    outputs:
      matrix:
        description: "Filtered matrix of legs that ran (consumed by ai_summary/run for INFRA_FAILURE reconciliation)"
        value: ${{ jobs.load-test-matrix.outputs.matrix }}

jobs:
  load-test-matrix:
    runs-on: ubuntu-slim
    outputs:
      matrix: ${{ steps.build-matrix.outputs.matrix }}
      sim-libs: ${{ steps.build-matrix.outputs.sim-libs }}
    env:
      TESTS_YAML_PATH: ./tests/pipeline_reorg/ttsim_sanity_tests.yaml
    steps:
      - name: Checkout the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        timeout-minutes: 20
        with:
          sparse-checkout: |
            .github
            tests/pipeline_reorg
          sparse-checkout-cone-mode: true
      - name: Install dependencies
        run: pip3 install PyYAML
      - name: Verify test timeouts against budget
        run: |
          set -e
          python3 .github/scripts/utils/verify_time_budget.py \
            ${{ env.TESTS_YAML_PATH }} \
            ./.github/time_budget.yaml \
            "sanity"
      - name: Build test matrix based on enabled SKUs
        id: build-matrix
        run: |
          python3 .github/scripts/utils/prepare_test_matrix.py \
            ${{ env.TESTS_YAML_PATH }} \
            "ALL_SKUS_IN_TESTS" \
            ./.github/sku_config.yaml

  fetch-ttsim:
    needs: load-test-matrix
    if: ${{ needs.load-test-matrix.outputs.sim-libs != '[]' }}
    runs-on: ubuntu-slim
    strategy:
      fail-fast: false
      matrix:
        lib: ${{ fromJson(needs.load-test-matrix.outputs.sim-libs) }}
    concurrency:
      group: ttsim-lib-${{ github.run_id }}-${{ matrix.lib }}
      cancel-in-progress: false
      queue: max
    # The probe and upload talk to the artifact service with the runtime token, not
    # GITHUB_TOKEN, so no actions: scope is needed — and requesting one fails for callers that
    # run with the default actions: none (a nested job cannot exceed its caller's grant).
    permissions:
      contents: read
    steps:
      - name: Checkout fetch-ttsim action and pinned ttsim version
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        timeout-minutes: 20
        with:
          sparse-checkout: |
            .github/actions/fetch-ttsim
            tt_metal/ttsim-version
          sparse-checkout-cone-mode: false
          ref: ${{ inputs.ref || github.sha }}
      - name: ⬇️  Fetch ttsim
        uses: ./.github/actions/fetch-ttsim
        timeout-minutes: 10
        with:
          lib: ${{ matrix.lib }}

  ttsim-sanity-tests:
    needs: [load-test-matrix, fetch-ttsim]
    if: ${{ needs.load-test-matrix.outputs.matrix != '[]' && needs.fetch-ttsim.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        test-group: ${{ fromJson(needs.load-test-matrix.outputs.matrix) }}
    name: ${{ matrix.test-group.name }}
    runs-on: ${{ matrix.test-group.runs_on }}
    permissions:
      contents: read
    container:
      image: ${{ inputs.basic-docker-image || 'docker-image-unresolved!' }}
      volumes:
        - ${{ github.workspace }}:/work
    defaults:
      run:
        shell: bash
        working-directory: /work # https://github.com/actions/runner/issues/878
    env:
      CC: gcc-12
      CXX: g++-12
      # ttsim installs under TT_METAL_HOME; setup-ttsim is invoked with root=$TT_METAL_HOME
      # so it copies the soc descriptor from the installed package's tt_metal/soc_descriptors/.
      TT_METAL_HOME: /usr/libexec/tt-metalium
    steps:
      - name: Checkout actions
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        timeout-minutes: 20
        with:
          sparse-checkout: |
            .github/actions/download-artifact-with-retry
            .github/actions/setup-ttsim
            .github/sku_config.yaml
            .github/actions/run-with-log
            .github/scripts/utils/host-load-sidecar.sh
          sparse-checkout-cone-mode: false
          ref: ${{ inputs.ref || github.sha }}

      - name: Download packages artifact
        uses: ./.github/actions/download-artifact-with-retry
        timeout-minutes: 15
        with:
          name: ${{ inputs.package-artifact-name || 'packages artifact unresolved!' }}
          path: /work/pkgs/

      - name: Install packages
        timeout-minutes: 10
        run: |
          set -euo pipefail
          apt update
          # tt-metalium-jit is optional: TT_USE_SYSTEM_SFPI builds don't produce it, since this
          # container already has /opt/tenstorrent/sfpi for the JIT-build runtime fallback
          # (see tt_metal/jit_build/build.cpp).
          shopt -s nullglob
          pkgs=(./pkgs/tt-metalium_*.deb ./pkgs/tt-metalium-jit_*.deb ./pkgs/tt-metalium-dev_*.deb ./pkgs/tt-metalium-examples_*.deb)
          apt install -y "${pkgs[@]}"

      - name: ⬇️  Setup TTSim
        uses: ./.github/actions/setup-ttsim
        timeout-minutes: 5
        with:
          sku: ${{ matrix.test-group.sku }}
          root: ${{ env.TT_METAL_HOME }}

      # ttsim examples run on the simulator (no hardware power telemetry); wrap the run in the
      # host-load sidecar to capture host CPU/memory/disk/network usage.
      # The command is written to a file first (a quoted heredoc preserves its
      # embedded quoting) and run under the sidecar; the report is written to /work/mem_report.json
      # (uploaded below) and the sidecar propagates the run's exit code so failures still fail the job.
      - name: ${{ matrix.test-group.name }}
        timeout-minutes: ${{ matrix.test-group.timeout }}
        uses: ./.github/actions/run-with-log
        with:
          log-file: generated/test_logs/${{ matrix.test-group.name }}.log
          run: |
            cat > /tmp/ttsim_cmd.sh <<'TTSIM_CMD_EOF'
            ${{ matrix.test-group.cmd }}
            TTSIM_CMD_EOF
            .github/scripts/utils/host-load-sidecar.sh \
              --interval 1 \
              --label "${{ matrix.test-group.name }}" \
              --output /work/mem_report.json \
              -- bash --noprofile --norc -eo pipefail /tmp/ttsim_cmd.sh
      - name: Upload mem report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: mem-report-${{ matrix.test-group.name }}
          # /work/ is mounted from ${{ github.workspace }}; the host-load sidecar writes its
          # CPU/memory/disk/network report to --output /work/mem_report.json, so upload-artifact
          # reads it from there.
          path: ${{ github.workspace }}/mem_report.json
          if-no-files-found: warn
          retention-days: 30
      # This container mounts the workspace root at /work (no docker-job subdir),
      # so the tool's workspace is /work rather than $GITHUB_WORKSPACE/docker-job.
      - name: 🤖 AI job summary
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: tenstorrent/tt-github-actions/.github/actions/ai_summary/job@main
        with:
          config: |
            {
              "model": "${{ vars.AI_SUMMARY_MODEL }}",
              "workspace": "/work",
              "input_dirs": ["generated/test_logs"],
              "output_dir": "generated/ai_summaries",
              "scope": "${{ inputs.summary-scope }}"
            }
          api-key: ${{ secrets.TT_CHAT_API_KEY }}
          api-url: ${{ secrets.TT_CHAT_URL }}
          job-name: ${{ matrix.test-group.name }}

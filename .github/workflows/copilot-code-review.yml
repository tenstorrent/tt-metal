name: "Copilot Code Review Setup Steps"

# Pins Copilot code review to the environment it already uses today.
#
# Without this file, Copilot code review falls back to copilot-setup-steps.yml:
# "If your repository does not have a copilot-code-review.yml file, Copilot code
# review will use the copilot-setup-steps.yml file instead."
# https://docs.github.com/en/copilot/how-tos/copilot-on-github/set-up-copilot/configure-runners
#
# Since copilot-setup-steps.yml is being pointed at an internal build runner and
# the tt-metal CI build image, that fallback would silently drag code review onto
# the build pool too. Code review runs on every PR and needs none of the
# toolchain or ccache, so this file keeps it on ubuntu-latest.
#
# This is a no-op relative to current behaviour - it reproduces what
# copilot-setup-steps.yml did before the coding-agent experiment.
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-code-review.yml

jobs:
  # The job MUST be called 'copilot-setup-steps' even in this file.
  copilot-setup-steps:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install gh-aw extension
        # Keep in lockstep with copilot-setup-steps.yml: the version the copilot-loop
        # lock files (squad-plan, issue-monster, pr-sous-chef) are compiled with. The
        # six older lock files are still at v0.86.2 — see the note there.
        uses: github/gh-aw-actions/setup-cli@924af5fdc64061cfbf66fb584c8b07e2ac230c60 # v0.89.21
        with:
          version: v0.89.21

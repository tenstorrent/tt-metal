name: "(Tier 2) Models End-To-End Tests"

on:
  schedule:
    # Once a day at 03:00 UTC — all models, all SKUs
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      model:
        description: "Select model to test"
        required: true
        default: all
        type: choice
        options:
          - all
          - llama3.1-8b
          - llama3.1-8b-dp
          - llama3.3-70b
          - llama3.2-90b-vision
          - qwen3-32b
          - qwen2.5-32b
          - qwen2.5-coder-32b
          - qwen2.5-vl-72b
          - qwen3-tts-1.7b
          - qwen3-tts-0.6b
          - mistral-7b
          - gemma-3-4b
          - gemma-3-27b
          - gemma-4-e2b
          - gemma-4-e4b
          - gemma-4-26b-a4b
          - gemma-4-31b
          - mixtral-8x7b
          - gpt-oss-20b
          - sdxl
          - qwenimage
          - vit
          - motif
          - bge_m3
      sku:
        description: "Select SKU to test (not all models are configured for all SKUs. If a combination is non-existent no test will be run)"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - "wh_n150 (N150)"
          - "wh_n300 (N300)"
          - "wh_llmbox (T3000)"
          - "wh_llmbox_perf (T3000 perf)"
          - "wh_galaxy (WH Galaxy)"
          - "wh_galaxy_perf (WH Galaxy perf)"
          - "bh_p150 (P150)"
          - "bh_p300 (P300)"
          - "bh_quietbox_2 (BH QB2)"
          - "bh_galaxy (BH Galaxy)"
          - "bh_p150b_civ2 (P150b CIv2)"
      platform:
        required: false
        type: choice
        default: "Ubuntu 22.04"
        options:
          - "Ubuntu 22.04"
          - "Ubuntu 24.04"
        description: "Platform to build and test"
      build-type:
        required: false
        type: choice
        default: Release
        options:
          - Release
          - Debug
          - RelWithDebInfo
          - ASan
          - TSan
        description: "Build type configuration"
      enable-lto:
        required: false
        type: boolean
        default: false
        description: "Enable Link Time Optimization (LTO)"
      mlperf-read-only:
        required: false
        type: boolean
        default: true
        description: "Mount /mnt/MLPerf as read-only (uncheck for read-write access)"

permissions:
  packages: write
  contents: write

run-name: "(Tier 2) Models E2E${{ github.event_name == 'schedule' && ' [scheduled]' || '' }}"

jobs:
  check-harbor:
    uses: ./.github/workflows/check-harbor.yaml
  resolve-skus:
    runs-on: ubuntu-slim
    outputs:
      enabled-skus: ${{ steps.resolve.outputs.enabled-skus }}
      model: ${{ steps.resolve.outputs.model }}
    steps:
      - name: Resolve SKU and model selection
        id: resolve
        run: |
          ALL_SKUS="wh_n150,wh_n300,wh_llmbox,wh_llmbox_perf,wh_galaxy,wh_galaxy_perf,bh_p150,bh_p300,bh_quietbox_2,bh_galaxy,bh_p150b_civ2"
          EVENT="${{ github.event_name }}"
          if [[ "$EVENT" == "workflow_dispatch" ]]; then
            SKU_INPUT="${{ inputs.sku || 'all' }}"
            if [[ "$SKU_INPUT" == "all" ]]; then
              echo "enabled-skus=$ALL_SKUS" >> $GITHUB_OUTPUT
            else
              SKU_NAME=$(echo "$SKU_INPUT" | sed 's/ (.*//')
              echo "enabled-skus=$SKU_NAME" >> $GITHUB_OUTPUT
            fi
            echo "model=${{ inputs.model }}" >> $GITHUB_OUTPUT
            exit 0
          fi
          # Scheduled runs: all models, all SKUs
          echo "enabled-skus=$ALL_SKUS" >> $GITHUB_OUTPUT
          echo "model=all" >> $GITHUB_OUTPUT
  build-artifact:
    needs: check-harbor
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/build-artifact.yaml
    permissions:
      contents: read
      packages: write
    secrets: inherit
    with:
      harbor-prefix: ${{ needs.check-harbor.outputs.harbor-prefix }}
      build-type: ${{ inputs.build-type || 'Release' }}
      build-inplace-wheel: true
      platform: ${{ inputs.platform || 'Ubuntu 22.04' }}
      enable-lto: ${{ inputs.enable-lto || false }}
  # Bakes the source tree and this run's build output into one image the test legs
  # run in, so they need no artifact download and no recursive checkout.
  # PROFILE=full because the legs read /work/build and /work/runtime; the dev base
  # is the same image docker-image resolves to, so the image path and the fallback
  # path agree.
  bake-env-dev-full:
    needs: build-artifact
    if: ${{ !cancelled() && needs.build-artifact.result == 'success' }}
    uses: ./.github/workflows/build-prebuilt-tests-image.yaml
    permissions:
      contents: read
      packages: write
      actions: read
    secrets: inherit
    with:
      artifact-name: ${{ needs.build-artifact.outputs.build-artifact-name }}
      # Canonical, never a resolve-docker-pull-refs output: that one is
      # Harbor-prefixed and the producer runs GitHub-hosted with no Harbor access.
      base-image: ${{ needs.build-artifact.outputs.dev-docker-image }}
      dockerfile: dockerfile/Dockerfile.prebuilt-tests-env
      image-name: prebuilt-tests-env-image
      checkout-source: true
      build-args: PROFILE=full
      # No source-ref: this caller takes no ref, so the producer's default (its own
      # commit) is already the commit build-artifact built.
  models-e2e-tests:
    needs: [check-harbor, build-artifact, resolve-skus, bake-env-dev-full]
    if: ${{ !cancelled() && needs.build-artifact.result == 'success' && needs.resolve-skus.result == 'success' }}
    # bake-env-dev-full is in needs but deliberately absent from the if: above.
    # A failed bake leaves the ref empty and the legs fall back to the artifact
    # path, which a gate on the bake would turn into a skipped suite instead.
    # id-token: write is required by the nested exabox multihost job (multihost-ci runner chart).
    # Job-level permissions replace inherited defaults, so restate the reads the container legs need too.
    permissions:
      contents: read
      packages: read
      id-token: write
    secrets: inherit
    uses: ./.github/workflows/models-e2e-tests-impl.yaml
    with:
      docker-image: ${{ needs.build-artifact.outputs.dev-docker-image }}
      prebuilt-image: ${{ needs.bake-env-dev-full.outputs.image }}
      build-artifact-name: ${{ needs.build-artifact.outputs.build-artifact-name }}
      wheel-artifact-name: ${{ needs.build-artifact.outputs.wheel-artifact-name }}
      enabled-skus: ${{ needs.resolve-skus.outputs.enabled-skus }}
      model: ${{ needs.resolve-skus.outputs.model }}
      mlperf-read-only: ${{ inputs.mlperf-read-only != false }}
      tier: "2"

  ai-run-summary:
    name: "AI Run Summary"
    # One run-level report (ai_run_summary_r<run>_a<attempt>) for the CI digest
    # to read. Here rather than in the impl: all-model-tests.yaml calls the impl
    # once per tier and writes its own report, so a report from the impl would
    # duplicate it there.
    needs: [build-artifact, resolve-skus, models-e2e-tests]
    # Reports on a run that failed — the case the summary exists for — but not
    # on one that was cancelled: an aborted run has no outcome to summarize, and
    # asking for one spends an LLM call to say it stopped early.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        timeout-minutes: 20
      - name: Aggregate upstream run result
        id: run-result
        env:
          # Most-severe-wins so a build failure isn't masked when the test job
          # is skipped because of it.
          NEEDS: ${{ toJSON(needs) }}
        run: |
          RESULT=$(jq -rn --argjson n "$NEEDS" '
            [$n[].result] as $r |
            if   any($r[]; . == "failure")   then "failure"
            elif any($r[]; . == "cancelled") then "cancelled"
            elif any($r[]; . == "success")   then "success"
            else                                  "skipped"
            end')
          echo "run-result=$RESULT" >> "$GITHUB_OUTPUT"
      - id: ai-run-summary
        continue-on-error: true
        uses: tenstorrent/tt-github-actions/.github/actions/ai_summary/run@main
        with:
          config: |
            {
              "model": "${{ vars.AI_SUMMARY_MODEL }}",
              "workspace": "$GITHUB_WORKSPACE",
              "input_dir": "ai_job_summaries",
              "output_dir": "ai_run_summaries"
            }
          api-key: ${{ secrets.TT_CHAT_API_KEY }}
          api-url: ${{ secrets.TT_CHAT_URL }}
          # Single-host legs only, as in all-model-tests.yaml: an expected leg
          # with no job summary is reported as an infra failure, and the
          # multihost legs don't all publish one.
          expected-jobs: ${{ needs.models-e2e-tests.outputs.matrix }}
          run-result: ${{ steps.run-result.outputs.run-result }}
      - name: Show report
        if: always() && steps.ai-run-summary.outputs.report-file != ''
        continue-on-error: true
        shell: bash
        env:
          REPORT_FILE: ${{ steps.ai-run-summary.outputs.report-file }}
        run: |
          if [ -f "$REPORT_FILE" ]; then
            cat "$REPORT_FILE"
            cat "$REPORT_FILE" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Report file not found: $REPORT_FILE"
          fi

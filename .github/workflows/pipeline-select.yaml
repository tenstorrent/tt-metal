name: "(Single) Choose your pipeline"

on:
  workflow_dispatch:
    inputs:
      trigger_type:
        description: "Trigger type. 'manual' = custom selection below; other options = predefined configs."
        type: choice
        options:
          - manual
          - models-mandatory
          - models-extended
        default: manual
      extra-tag:
        required: true
        type: string
        default: "in-service"
      single-card-perf-device-models:
        required: false
        type: boolean
        default: false
      cpp-unit:
        description: "Run cpp unit tests"
        required: false
        type: boolean
        default: false
      platform:
        required: false
        type: choice
        default: "Ubuntu 22.04"
        options:
          - "Ubuntu 22.04"
          - "Ubuntu 24.04"
        description: "Platform to build and test"
      build-type:
        required: false
        type: choice
        options:
          - Release
          - Debug
          - RelWithDebInfo
          - ASan
          - TSan
        default: Release
      enable-lto:
        required: false
        type: boolean
        default: false
        description: "Enable Link Time Optimization (LTO)"

run-name: ${{ inputs.trigger_type == 'manual' && 'custom' || inputs.trigger_type }} pipeline
jobs:
  # Centralized logic to determine what should run
  determine-tests:
    runs-on: ubuntu-slim
    outputs:
      run-perf-device-models: ${{ steps.logic.outputs.run-perf-device-models }}
      run-cpp-unit: ${{ steps.logic.outputs.run-cpp-unit }}
    steps:
      - name: Determine test execution
        id: logic
        run: |
          case "${{ inputs.trigger_type }}" in
            "manual")
              echo "run-perf-device-models=${{ inputs.single-card-perf-device-models }}" >> $GITHUB_OUTPUT
              echo "run-cpp-unit=${{ inputs.cpp-unit }}" >> $GITHUB_OUTPUT
              ;;
            "models-mandatory")
              echo "run-perf-device-models=true" >> $GITHUB_OUTPUT
              echo "run-cpp-unit=true" >> $GITHUB_OUTPUT
              ;;
            "models-extended")
              echo "run-perf-device-models=true" >> $GITHUB_OUTPUT
              echo "run-cpp-unit=true" >> $GITHUB_OUTPUT
              ;;
          esac
  check-harbor:
    uses: ./.github/workflows/check-harbor.yaml

  build-artifact:
    needs: [check-harbor, determine-tests]
    if: ${{ !cancelled() && needs.determine-tests.result == 'success' }}
    uses: ./.github/workflows/build-artifact.yaml
    permissions:
      contents: read
      packages: write
    secrets: inherit
    with:
      harbor-prefix: ${{ needs.check-harbor.outputs.harbor-prefix }}
      platform: ${{ inputs.platform || 'Ubuntu 22.04' }}
      build-type: ${{ inputs.build-type || 'Release' }}
      enable-lto: ${{ inputs.enable-lto || false }}
      build-inplace-wheel: true
      tracy: ${{ needs.determine-tests.outputs.run-perf-device-models == 'true' }}
  single-card-perf-device-models-tests:
    if: ${{ needs.determine-tests.outputs.run-perf-device-models == 'true' }}
    needs: [build-artifact, determine-tests]
    secrets: inherit
    uses: ./.github/workflows/perf-device-models-impl.yaml
    with:
      extra-tag: ${{ inputs.extra-tag }}
      docker-image: ${{ needs.build-artifact.outputs.dev-docker-image }}
      build-artifact-name: ${{ needs.build-artifact.outputs.build-artifact-name }}
      wheel-artifact-name: ${{ needs.build-artifact.outputs.wheel-artifact-name }}
  cpp-unit-tests:
    if: ${{ needs.determine-tests.outputs.run-cpp-unit == 'true' }}
    needs: [build-artifact, determine-tests]
    secrets: inherit
    uses: ./.github/workflows/ops-unit-tests-impl.yaml
    with:
      docker-image: ${{ needs.build-artifact.outputs.dev-docker-image }}
      build-artifact-name: ${{ needs.build-artifact.outputs.build-artifact-name }}
      wheel-artifact-name: ${{ needs.build-artifact.outputs.wheel-artifact-name }}
      enabled-skus: "wh_n300_civ2"
      additional_test_categories: "cpp_accessor,cpp_lab_examples"

# Build and push a single release-models image on demand.
#
# WHY THIS EXISTS
# ---------------
# release-models is the disaggregated-prefill worker: since #52303 it bakes
# tt-llm-engine's _migration_client into itself (see the mig-client stages in
# dockerfile/Dockerfile). Validating a change to that path had no cheap trigger:
#
#   * package-and-release.yaml can be dispatched, but its docker job is gated on
#     `github.ref == main/stable/tag || dry-run`, and `dry-run` propagates down to
#     publish-release-image.yaml, whose build step is `if: !inputs.dry-run`. So on a
#     feature branch the image is either skipped or built-but-not-built. Either way
#     you cannot get a real image out of it.
#   * publish-release-image-wrapper.yaml builds the [release, release-models] matrix
#     with no way to pick one, and authenticates ghcr with GITHUB_TOKEN, which cannot
#     read the private tt-llm-engine/migration-worker package in another repo.
#
# This workflow mirrors publish-release-image.yaml's release-models path (same tool
# contexts, same bake output line, same SBOM/attestation action) with three deliberate
# differences, each justified below: VM_BLAZE ghcr login, no wheel, no smoke tests.
#
# ubuntu-22.04 only, by design: _migration_client is a nanobind module built without
# STABLE_ABI, and the engine image is py3.10. On 24.04 (py3.12) the mig-client selector
# resolves to an empty stage, so a 24.04 build proves nothing about this path.

name: "Build prefill-worker image"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Image tag to push. Empty = dev-<branch-slug>."
        required: false
        type: string
        default: ""
      tt-llm-engine-image:
        description: "Override the tt-llm-engine image _migration_client is copied from. Empty = the pinned default in docker-bake.hcl."
        required: false
        type: string
        default: ""

  # TODO: DELETE THIS PUSH TRIGGER BEFORE MERGING TO main.
  # workflow_dispatch resolves workflow files from the default branch only, so until
  # this file lands on main `gh workflow run --ref <branch>` 404s. The push trigger is
  # the only way to fire it from the feature branch. Once merged, dispatch works and
  # this block must go - otherwise every Dockerfile change on main would kick off a
  # multi-hour from-source release-models build.
  push:
    branches:
      - vm/trigger_prefill_worker_build_on_dispatch
    paths:
      - ".github/workflows/build-release-models-on-dispatch.yaml"
      - "dockerfile/Dockerfile"
      - "dockerfile/docker-bake.hcl"

jobs:
  # Same pull-through cache resolution the release uses, so tool layers come from
  # Harbor when it is healthy and fall back to ghcr direct when it is not.
  check-harbor:
    uses: ./.github/workflows/check-harbor.yaml

  build:
    name: Build release-models image
    needs: check-harbor
    permissions:
      contents: read
      packages: write
    runs-on: tt-ubuntu-2204-large-stable
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        timeout-minutes: 20

      - name: Set up env variables
        run: |
          set -euo pipefail
          # 22.04 / 3.10 are hardcoded rather than derived from a platform input:
          # this workflow exists to exercise the py3.10-only mig-client path.
          echo "UBUNTU_VERSION=22.04" >> $GITHUB_ENV
          echo "PYTHON_VERSION=3.10" >> $GITHUB_ENV

          # Same convention as publish-release-image-wrapper.yaml: dev- + branch slug.
          VERSION="${{ inputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION="dev-${GITHUB_REF_NAME//\//-}"
          fi

          REPO_IMAGE_NAME=ghcr.io/${{ github.repository }}/tt-metalium-ubuntu-22.04-release-models-amd64
          echo "REPO_IMAGE_NAME=$REPO_IMAGE_NAME" >> $GITHUB_ENV
          echo "TAG_NAME=$REPO_IMAGE_NAME:$VERSION" >> $GITHUB_ENV

      - name: Capture proxy env for the buildx builder
        run: |
          # This runner's proxy isn't inherited by the isolated buildx builder
          # (see docker-run/action.yml's forward_civ2_proxy_env_vars).
          #
          # Do not set NO_PROXY here. A previous value of "tenstorrent.net"
          # matched harbor.ci.tenstorrent.net. That made the builder skip
          # the proxy and connect to Harbor directly, which times out.
          echo "PROXY_HTTP=${HTTP_PROXY:-${http_proxy:-}}" >> "$GITHUB_ENV"
          echo "PROXY_HTTPS=${HTTPS_PROXY:-${https_proxy:-}}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          # network=host: builder uses the runner's own network namespace
          # instead of the docker-container driver's default bridge.
          driver-opts: |
            network=host
            env.HTTP_PROXY=${{ env.PROXY_HTTP }}
            env.HTTPS_PROXY=${{ env.PROXY_HTTPS }}

      # DELIBERATE DIFFERENCE #1 from publish-release-image.yaml, which logs in with
      # GITHUB_TOKEN. That token only reaches tt-metal's own packages, and the
      # release-models build now pulls ghcr.io/tenstorrent/tt-llm-engine/migration-worker
      # - a private package in a DIFFERENT repo - so GITHUB_TOKEN gets a 403 on the FROM.
      #
      # ghcr allows one credential per registry host, so VM_BLAZE authenticates every
      # ghcr operation in this job: the engine pull, the release-models base, the tool
      # images, AND the final push (which therefore needs write:packages on it).
      #
      # This is a stopgap. The real fix is granting tenstorrent/tt-metal Read on the
      # migration-worker package (or making it Internal), after which the nightly works
      # with GITHUB_TOKEN and this login should be switched back to match it.
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: https://ghcr.io
          # ghcr authenticates on the token, not the username.
          username: ${{ github.actor }}
          password: ${{ secrets.VM_BLAZE }}

      - name: Compute tool tags
        id: tool-tags
        run: |
          TOOL_TAGS=$(.github/scripts/compute-tool-tags.sh "${{ github.repository }}")
          {
            echo "tool_tags<<EOF"
            echo "$TOOL_TAGS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Prepare bake overrides
        id: bake
        env:
          TOOL_TAGS: ${{ steps.tool-tags.outputs.tool_tags }}
          TAG_NAME: ${{ env.TAG_NAME }}
          UBUNTU_VERSION: ${{ env.UBUNTU_VERSION }}
          PYTHON_VERSION: ${{ env.PYTHON_VERSION }}
          HARBOR_PREFIX: ${{ needs.check-harbor.outputs.harbor-prefix }}
          PROXY_HTTP: ${{ env.PROXY_HTTP }}
          PROXY_HTTPS: ${{ env.PROXY_HTTPS }}
          ENGINE_IMAGE: ${{ inputs.tt-llm-engine-image }}
        run: |
          set -euo pipefail
          TARGET="release-models"
          # Tool list comes from docker-bake.hcl via get-target-tools.sh
          TOOLS=($(.github/scripts/get-target-tools.sh "$TARGET"))
          SET=""
          for tool in "${TOOLS[@]}"; do
            tag=$(echo "$TOOL_TAGS" | jq -r ".\"${tool}-tag\"")
            [ "$tag" = "null" ] && { echo "ERROR: missing tag for tool '$tool' in compute-tool-tags output"; exit 1; }
            SET+="${TARGET}.contexts.${tool}-layer=docker-image://${HARBOR_PREFIX}${tag}"$'\n'
          done
          SET+="${TARGET}.tags=${TAG_NAME}"$'\n'
          # Byte-identical to the release's output line, so compression and media
          # types match what the nightly produces.
          SET+="${TARGET}.output=type=image,push=true,compression=zstd,compression-level=22,force-compression=true,oci-mediatypes=true"$'\n'
          # DELIBERATE DIFFERENCE #2: no WHEEL_FILENAME. ARG WHEEL_FILENAME is consumed
          # only by the `release` stage; release-models clones tt-metal and builds from
          # source via GIT_REF, so there is nothing to download a wheel artifact for.
          SET+="${TARGET}.args.UBUNTU_VERSION=${UBUNTU_VERSION}"$'\n'
          SET+="${TARGET}.args.PYTHON_VERSION=${PYTHON_VERSION}"$'\n'
          # Builds tt-metal from THIS ref, which is the point of the workflow.
          SET+="${TARGET}.args.GIT_REF=${{ github.ref_name }}"$'\n'
          if [ -n "$ENGINE_IMAGE" ]; then
            SET+="${TARGET}.args.TT_LLM_ENGINE_IMAGE=${ENGINE_IMAGE}"$'\n'
          fi
          # RUN steps (apt-get, curl, uv pip) need the proxy too. BuildKit
          # sets these build args in every RUN automatically, no ARG
          # declaration needed.
          if [ -n "$PROXY_HTTP" ]; then
            SET+="${TARGET}.args.HTTP_PROXY=${PROXY_HTTP}"$'\n'
            SET+="${TARGET}.args.HTTPS_PROXY=${PROXY_HTTPS}"$'\n'
          fi
          {
            echo "set<<EOF"
            echo "$SET"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          # Consumed directly by manual-docker-bake.sh (SBOM generator, oras
          # binary for enrichment), not as a build-stage context.
          echo "syft-scanner-image=$(echo "$TOOL_TAGS" | jq -r '."syft-scanner-tag"')" >> "$GITHUB_OUTPUT"
          echo "oras-image=$(echo "$TOOL_TAGS" | jq -r '."oras-tag"')" >> "$GITHUB_OUTPUT"

      # Success signal to look for in this step's log:
      #   OK _migration_client: /opt/tt-llm-engine/.../_migration_client.cpython-310-x86_64-linux-gnu.so
      # emitted by the import check at the end of the release-models stage.
      #
      # Expect this step to run for a long while - it does a full from-source
      # build_metal.sh + create_venv.sh. A fast failure here (seconds) means the
      # engine-image pull was denied, i.e. VM_BLAZE lost read on migration-worker.
      - name: Build and push release-models
        uses: ./.github/actions/manual-docker-bake
        with:
          targets: release-models
          set-lines: ${{ steps.bake.outputs.set }}
          syft-scanner-image: ${{ steps.bake.outputs.syft-scanner-image }}
          oras-image: ${{ steps.bake.outputs.oras-image }}
          # Cheap insurance against transient blips - the actual fix for the
          # timeouts we hit is the proxy env forwarded above.
          retries: "2"
          retry-delay-seconds: "15"
          harbor-prefix: ${{ needs.check-harbor.outputs.harbor-prefix }}

      # DELIBERATE DIFFERENCE #3: publish-release-image.yaml follows the build with
      # N150/N300 smoke-test jobs. Skipped here - this workflow answers "does the image
      # build and does the client import", and the in-build import check covers that
      # without occupying hardware runners.
      - name: Report pushed image
        run: |
          set -euo pipefail
          DIGEST=$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "${{ env.TAG_NAME }}")
          {
            echo "### Pushed release-models image"
            echo ""
            echo '```'
            echo "${{ env.TAG_NAME }}"
            echo "${{ env.REPO_IMAGE_NAME }}@${DIGEST}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

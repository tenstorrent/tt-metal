name: "(triage) Runner Failure Report"

on:
  workflow_dispatch:
    inputs:
      runner_name:
        description: "Runner/host name to report on"
        required: true
      hours:
        description: "Number of hours to look back"
        required: false
        default: "24"
      post_to_slack:
        description: "Post the report to Slack"
        required: false
        type: boolean
        default: true
      run_enrichment:
        description: "Fetch live GitHub active-run enrichment when no enrichment_jobs_json is supplied"
        required: false
        type: boolean
        default: true
      triggering_failures_json:
        description: "Optional JSON array of triggering failures from the scan workflow."
        required: false
      enrichment_jobs_json:
        description: "Optional JSON array of precomputed live GitHub jobs from the scan workflow."
        required: false
  workflow_call:
    inputs:
      runner_name:
        required: true
        type: string
      hours:
        required: false
        type: string
        default: "24"
      post_to_slack:
        required: false
        type: boolean
        default: true
      run_enrichment:
        required: false
        type: boolean
        default: true
      triggering_failures_json:
        required: false
        type: string
        default: ""
      enrichment_jobs_json:
        required: false
        type: string
        default: ""

permissions:
  actions: read
  contents: read
  id-token: write

env:
  # Data-team API route for CI job data (datacentral api-access route 5).
  # The role and URL are not secrets; the role only trusts GitHub OIDC.
  DATA_API_ROLE: arn:aws:iam::533267429815:role/github-actions-api-gateway-role
  DATA_API_ROUTE_BASE: https://ftuxhxqka0.execute-api.us-east-2.amazonaws.com
  # Slack channel ID for #runner-failure-vibe-alerts. Not a secret.
  RUNNER_FAILURE_SCAN_CHANNEL: C0BHAKAULEN

jobs:
  # Builds the report. Runs from any branch and holds no Slack token.
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      has_report: ${{ steps.check.outputs.has_report }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2 cachew: keep
        timeout-minutes: 20
        with:
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: true

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/scripts/runner_failure_report_requirements.txt

      - name: Install scanner dependencies
        run: python3 -m pip install -r .github/scripts/runner_failure_report_requirements.txt

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ env.DATA_API_ROLE }}
          aws-region: us-east-2

      - name: Build runner report
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_RUNNER_NAME: ${{ inputs.runner_name }}
          HOURS: ${{ inputs.hours || '24' }}
          RUNNER_FAILURE_API_BASE_URL: ${{ env.DATA_API_ROUTE_BASE }}
          TRIGGERING_FAILURES_JSON: ${{ inputs.triggering_failures_json }}
          ENRICHMENT_JOBS_JSON: ${{ inputs.enrichment_jobs_json }}
          RUN_ENRICHMENT: ${{ inputs.run_enrichment }}
        run: |
          mkdir -p out
          args=(
            --hours "$HOURS"
            --runner-name "$TARGET_RUNNER_NAME"
            --report-json out/runner_failure_report.json
            --report-md out/runner_failure_report.md
          )
          if [[ -n "$TRIGGERING_FAILURES_JSON" && "$TRIGGERING_FAILURES_JSON" != "[]" ]]; then
            printf '%s' "$TRIGGERING_FAILURES_JSON" > out/triggering_failures.json
            args+=(
              --triggering-failures-json out/triggering_failures.json
            )
          fi
          if [[ -n "$ENRICHMENT_JOBS_JSON" && "$ENRICHMENT_JOBS_JSON" != "[]" ]]; then
            printf '%s' "$ENRICHMENT_JOBS_JSON" > out/enrichment_jobs.json
            args+=(
              --live-jobs-json out/enrichment_jobs.json
            )
          fi
          if [[ "$RUN_ENRICHMENT" != "true" ]]; then
            args+=(--no-run-enrichment)
          fi
          python3 .github/scripts/runner_failure_report.py "${args[@]}"

      - name: Check for report
        id: check
        if: always()
        run: |
          if [[ -f out/runner_failure_report.json ]]; then
            echo "has_report=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Preview Slack messages
        if: always() && steps.check.outputs.has_report == 'true'
        env:
          TARGET_RUNNER_NAME: ${{ inputs.runner_name }}
        run: |
          args=(
            --dry-run
            --runner-report-json out/runner_failure_report.json
            --runner-name "$TARGET_RUNNER_NAME"
          )
          if [[ -f out/triggering_failures.json ]]; then
            args+=(--triggering-failures-json out/triggering_failures.json)
          fi
          python3 .github/scripts/runner_failure_post_slack.py "${args[@]}" | tee out/slack_preview.txt
          {
            echo "<details><summary>Slack message preview</summary>"
            echo
            echo '```'
            cat out/slack_preview.txt
            echo '```'
            echo "</details>"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Add report to step summary
        if: always() && hashFiles('out/runner_failure_report.md') != ''
        run: cat out/runner_failure_report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload runner failure report
        if: always() && hashFiles('out/runner_failure_report.*') != ''
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: runner-failure-report-${{ inputs.runner_name }}-${{ github.run_id }}
          path: |
            out/runner_failure_report.json
            out/runner_failure_report.md
            out/triggering_failures.json
            out/slack_preview.txt
          retention-days: 14

  # Posts the report. Only this job reads SLACK_BOT_TOKEN, from the
  # runner-failure-alerts-slack environment, which allows only main.
  post-to-slack:
    needs: report
    if: always() && needs.report.outputs.has_report == 'true' && inputs.post_to_slack && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: runner-failure-alerts-slack
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2 cachew: keep
        timeout-minutes: 20
        with:
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: true

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"

      - name: Download runner failure report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: runner-failure-report-${{ inputs.runner_name }}-${{ github.run_id }}
          path: out

      - name: Post Slack notification
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          DEFAULT_SLACK_CHANNEL: ${{ env.RUNNER_FAILURE_SCAN_CHANNEL }}
          TARGET_RUNNER_NAME: ${{ inputs.runner_name }}
        run: |
          if [[ -z "$SLACK_BOT_TOKEN" ]]; then
            echo "SLACK_BOT_TOKEN is not set in the runner-failure-alerts-slack environment."
            exit 1
          fi
          args=(
            --runner-report-json out/runner_failure_report.json
            --runner-name "$TARGET_RUNNER_NAME"
            --slack-channel "$DEFAULT_SLACK_CHANNEL"
          )
          if [[ -f out/triggering_failures.json ]]; then
            args+=(--triggering-failures-json out/triggering_failures.json)
          fi
          python3 .github/scripts/runner_failure_post_slack.py "${args[@]}"

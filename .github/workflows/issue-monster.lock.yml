      - name: Setup threat detection
        if: always() && steps.detection_guard.outputs.run_detection == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          WORKFLOW_NAME: "Issue Monster (tt-metal)"
          WORKFLOW_DESCRIPTION: "(dispatch) Issue Monster. Scheduled workflow that finds open issues carrying the\n`copilot-ready` pickup label, applies deterministic safety exclusions in a\npre-activation script (already assigned, is a parent issue, already has an open\nCopilot PR, a sibling sub-issue of the same plan is in flight, bounty/blocked/\ndiscussion labels, retry-blocked topics, stale duplicate topics, Copilot rate-limit\nsignals), and assigns up to 2 topic-separated survivors per run to the GitHub Copilot\ncoding agent via the `assign-to-agent` safe output. Ported from github/gh-aw's\ndogfooded issue-monster.md and adapted to tt-metal's labels, Copilot runner capacity\nand existing Copilot automation (copilot-autofix-clangsa.yaml, copilot-setup-steps.yml).\nOperates for real: the safety mechanism is the opt-in label, the deterministic\nexclusions, the per-run cap and the open-Copilot-PR back-pressure — not a dry-run\nflag. Every safety check fails closed: a candidate whose metadata could not be read\nis dropped, and the run fails (dispatching nothing) if the retry history cannot be\nbuilt. Retry-blocked issues are labeled `copilot-retry-blocked` and get one human\ncheckpoint comment from the pre-activation script itself (deterministic, no agent);\na maintainer approves one more attempt with `copilot-retry-approved`. Requires the\n`GH_AW_AGENT_TOKEN` repository secret (see the frontmatter comment on\n`assign-to-agent`) and the three labels listed under \"Operator notes\"."
          HAS_PATCH: ${{ needs.agent.outputs.has_patch }}
          GH_AW_DETECTION_CONTINUE_ON_ERROR: "true"
          GH_AW_DETECTION_SKIP_PROMPT_SUMMARY: "true"
        with:
          script: |
            const path = require('path');
            const actionsDir = path.join(process.env.RUNNER_TEMP, 'gh-aw', 'actions');
            const { setupGlobals } = require(path.join(actionsDir, 'setup_globals.cjs'));
            setupGlobals(core, github, context, exec, io, getOctokit);
            const { main } = require(path.join(actionsDir, 'setup_threat_detection.cjs'));
            await main();
      - name: Ensure threat-detection directory and log
        if: always() && steps.detection_guard.outputs.run_detection == 'true'

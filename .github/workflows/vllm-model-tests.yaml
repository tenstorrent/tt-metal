      run: python3 "${{ github.workspace }}/experiment-harness/.github/scripts/qwen-sampling-controls.py" summary
    - name: Retain comparison records
      if: always()
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
      with:
        name: qwen-sampling-comparison
        path: ${{ runner.temp }}/qwen-sampling-results/
        if-no-files-found: warn
    - name: Clean CI workspace
      if: always()
      uses: tenstorrent/tt-metal/.github/actions/cleanup@main

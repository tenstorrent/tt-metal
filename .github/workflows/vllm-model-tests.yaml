name: Qwen sampling causal controls
'on':
  workflow_dispatch: {}
run-name: 'Qwen sampling: Sep16, Sep17, warmup reversal, SFPI reversal'
permissions:
  contents: read
  packages: write
  actions: read
jobs:
  check-harbor:
    uses: ./.github/workflows/check-harbor.yaml
  build-warmup:
    needs:
    - check-harbor
    uses: ./.github/workflows/build-artifact.yaml
    secrets: inherit
    with:
      ref: d89eeb6d9addd506d599f361bc3c64f89fc121b6
      wheel-ref: d89eeb6d9addd506d599f361bc3c64f89fc121b6
      build-type: Release
      build-wheel: true
      platform: Ubuntu 22.04
      enable-lto: false
      use-system-sfpi: false
      ci-build-docker-image: ghcr.io/tenstorrent/tt-metal/tt-metalium/ubuntu-22.04-ci-build-amd64:b30bb019bb1e09fddc879639164e1ae1d04aa60c
      manylinux-docker-image: ghcr.io/tenstorrent/tt-metal/tt-metalium/manylinux-amd64:fd4a27d2b0df3c65daa6d9dab51c105cf6bb0a82
      harbor-prefix: ${{ needs.check-harbor.outputs.harbor-prefix }}
  build-sfpi:
    needs:
    - check-harbor
    uses: ./.github/workflows/build-artifact.yaml
    secrets: inherit
    with:
      ref: 4ee5b5c398d91f20f220d3c85471883728789977
      wheel-ref: 4ee5b5c398d91f20f220d3c85471883728789977
      build-type: Release
      build-wheel: true
      platform: Ubuntu 22.04
      enable-lto: false
      use-system-sfpi: false
      ci-build-docker-image: ghcr.io/tenstorrent/tt-metal/tt-metalium/ubuntu-22.04-ci-build-amd64:b30bb019bb1e09fddc879639164e1ae1d04aa60c
      manylinux-docker-image: ghcr.io/tenstorrent/tt-metal/tt-metalium/manylinux-amd64:448ad9aeff3c8348ff183e87ec4248bb8f7a969d
      harbor-prefix: ${{ needs.check-harbor.outputs.harbor-prefix }}
  compare:
    name: Qwen3-32B four controls on one WH Galaxy
    needs:
    - build-warmup
    - build-sfpi
    runs-on:
    - arch-wormhole_b0
    - pipeline-perf
    - topology-6u
    - in-service
    timeout-minutes: 240
    permissions:
      contents: read
      packages: read
      actions: read
    container:
      image: ghcr.io/tenstorrent/tt-metal/tt-metalium/ubuntu-22.04-dev-amd64:03938b485e0b99c2df8e4ccb7fc66df7118f507a
      env:
        TT_METAL_HOME: /work
        TT_METAL_RUNTIME_ROOT: /work
        PLUGIN_DIR: /work/vllm-tt-plugin
        PYTHONPATH: /work:/work/vllm-tt-plugin/src
        LD_LIBRARY_PATH: /work/build/lib
        LOGURU_LEVEL: INFO
        HF_HUB_OFFLINE: '1'
        HF_HUB_CACHE: /mnt/MLPerf/huggingface/hub
        TT_CACHE_HOME: /mnt/MLPerf/huggingface/tt_cache
        MESH_DEVICE: TG
        TT_QWEN3_TEXT_VER: qwen3_32b_galaxy
        HF_MODEL: Qwen/Qwen3-32B
        TT_CACHE_PATH: /mnt/MLPerf/huggingface/tt_cache/Qwen--Qwen3-32B
        VLLM_RPC_TIMEOUT: '300000'
        FILE_SERVER_PID: ./server.pid
        FILE_SERVER_LOG: ./output/vllm_server.log
      volumes:
      - ${{ github.workspace }}/docker-job:/work
      - /dev/hugepages-1G:/dev/hugepages-1G
      - /mnt/MLPerf:/mnt/MLPerf:ro
      options: --device /dev/tenstorrent
    defaults:
      run:
        shell: bash
        working-directory: /work
    steps:
    - name: Checkout experiment harness
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        path: experiment-harness
        persist-credentials: false
    - name: 'sep16: checkout exact metal source'
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        ref: 5814fa3fdfef701c33a48d16745b7ffc390ccaa4
        submodules: recursive
        path: docker-job
        persist-credentials: false
        clean: true
    - name: 'sep16: download exact build'
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        path: docker-job
        digest-mismatch: error
        merge-multiple: true
        artifact-ids: '10424547617'
        run-id: '35039019794'
        github-token: ${{ github.token }}
    - name: 'sep16: download exact wheel'
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        path: docker-job
        digest-mismatch: error
        merge-multiple: true
        artifact-ids: '10424951060'
        run-id: '35039019794'
        github-token: ${{ github.token }}
    - name: 'sep16: install paired native build and wheel'
      id: sep16-prepare
      run: |
        test ! -e runtime
        test ! -e build/lib
        tar --zstd -xf ttm_any.tar.zst
        mapfile -t wheels < <(find . -maxdepth 1 -name "*.whl" -type f)
        test "${#wheels[@]}" -eq 1
        uv pip install --reinstall --no-deps "${wheels[0]}"
        mkdir -p output
        echo "TT_METAL_CACHE=/tmp/qwen-sampling-${{ github.run_id }}-${{ github.run_attempt }}-sep16" >> "$GITHUB_ENV"
        echo "TT_METAL_RUNTIME_ROOT=/work" >> "$GITHUB_ENV"
    - name: 'sep16: configure standard CI triage'
      uses: ./docker-job/.github/actions/setup-job
      with:
        auto-triage: true
    - name: 'sep16: configure detailed triage'
      run: echo "TT_TRIAGE_ENABLE_AGGREGATED_CALLSTACKS=0" >> "$GITHUB_ENV"
    - name: 'sep16: checkout pinned plugin'
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        repository: tenstorrent/vllm-tt-plugin
        ref: 3480a552e7d88dc9748e5633cff465124b1099bb
        path: docker-job/vllm-tt-plugin
        fetch-depth: 1
        persist-credentials: false
    - name: 'sep16: install pinned vLLM plugin'
      run: |-
        pushd vllm-tt-plugin
        source docs/install-vllm-tt.sh
        popd
    - name: 'sep16: verify source, native libraries and compiler'
      run: python3 "${{ github.workspace }}/experiment-harness/.github/scripts/qwen-sampling-controls.py" identity sep16 5814fa3fdfef701c33a48d16745b7ffc390ccaa4
        3480a552e7d88dc9748e5633cff465124b1099bb 7.77.0
    - name: 'sep16: start server'
      id: sep16-start
      timeout-minutes: 1
      run: python3 "${{ github.workspace }}/experiment-harness/.github/scripts/qwen-sampling-controls.py" start
    - name: 'sep16: wait for server'
      timeout-minutes: 36
      run: python3 "${{ github.workspace }}/experiment-harness/.github/scripts/qwen-sampling-controls.py" wait
    - name: 'sep16: benchmark before sampling'
      timeout-minutes: 10
      run: |-
        vllm bench serve --backend vllm --model Qwen/Qwen3-32B --dataset-name random --random-input-len 100 --random-output-len 100 --num-prompts 32 --ignore-eos --percentile-metrics ttft,tpot,itl,e2el --save-result --result-filename output/vllm_result.json 2>&1 | tee output/vllm_benchmark.log
        python3 -c 'import json; d=json.load(open("output/vllm_result.json")); assert d["completed"] == d["num_prompts"] == 32, d'
    - name: 'sep16: full 78-case sampling suite'
      id: sep16-sampling
      timeout-minutes: 10
      continue-on-error: true
      run: pytest "${PLUGIN_DIR}/tests/tt" -v --tt-server-url=http://localhost:8000 --tt-model-name=Qwen/Qwen3-32B --junitxml=output/sampling.xml
        2>&1 | tee output/vllm_sampling_tests.log
    - name: 'sep16: stop server and verify process exit'
      id: sep16-stop
      if: ${{ always() && steps.sep16-start.outcome == 'success' }}
      timeout-minutes: 2
      run: python3 "${{ github.workspace }}/experiment-harness/.github/scripts/qwen-sampling-controls.py" stop
    - name: 'sep16: preserve server log'
      if: ${{ always() && steps.sep16-start.outcome == 'success' }}
      continue-on-error: true
      run: cat output/vllm_server.log
    - name: 'sep16: retain experiment evidence'
      if: ${{ always() && steps.sep16-prepare.outcome == 'success' }}
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
      with:
        name: qwen-sampling-sep16
        path: |-
          docker-job/output/
          docker-job/generated/triage/
        if-no-files-found: error
    - name: 'sep16: verify complete comparison input'
      run: python3 "${{ github.workspace }}/experiment-harness/.github/scripts/qwen-sampling-controls.py" result sep16
    - name: 'sep17: checkout exact metal source'
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        ref: e37ab0ff1fc86f5ccba25f4b539450d3f7909020
        submodules: recursive
        path: docker-job
        persist-credentials: false

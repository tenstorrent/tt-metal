name: "Kernel clang-tidy"

# Post-hoc clang-tidy on runtime-JIT-compiled kernel code (prototype).
# Runs one ttnn test group on hardware; the impl workflow captures that leg's
# JIT kernel compiles, lints them with clang-tidy via CodeChecker, and uploads
# an HTML report, which this workflow publishes to GitHub Pages.
# See tech_reports/code-indexing/kernel-clang-tidy.md.

on:
  # TEMPORARY (remove before merge): registers the workflow from this branch
  # and lets each push verify it end-to-end, including the publish step.
  push:
    branches: ["clang-tidy-jit-runtime-prototype"]
  workflow_dispatch:
    inputs:
      target-group:
        description: "ttnn matrix test-group name to capture + lint"
        required: false
        type: string
        default: "trace allocation tracker"
      enabled-skus:
        description: "Comma-separated SKUs for the ttnn impl matrix"
        required: false
        type: string
        default: "wh_n300_civ2"
      publish-html:
        description: "Publish the HTML report to tenstorrent/tt-metal-kernel-clang-tidy-results"
        required: false
        type: boolean
        default: false

jobs:
  check-harbor:
    uses: ./.github/workflows/check-harbor.yaml

  build-artifact:
    needs: check-harbor
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/build-artifact.yaml
    permissions:
      contents: read
      packages: write
    secrets: inherit
    with:
      harbor-prefix: ${{ needs.check-harbor.outputs.harbor-prefix }}
      build-inplace-wheel: true
      tracy: false
      skip-tt-train: false
      platform: "Ubuntu 22.04"

  run-ttnn-tests:
    needs: [check-harbor, build-artifact]
    if: ${{ !cancelled() && needs.build-artifact.result == 'success' }}
    uses: ./.github/workflows/ttnn-sanity-tests-impl.yaml
    secrets: inherit
    with:
      enabled-skus: ${{ inputs.enabled-skus || 'wh_n300_civ2' }}
      docker-image: ${{ needs.build-artifact.outputs.ci-test-docker-image }}
      harbor-prefix: ${{ needs.check-harbor.outputs.harbor-prefix }}
      wheel-artifact-name: ${{ needs.build-artifact.outputs.wheel-artifact-name }}
      enable-kernel-clang-tidy: true
      clang-tidy-target-group: ${{ inputs.target-group || 'trace allocation tracker' }}

  publish-report:
    needs: [run-ttnn-tests]
    # The github.event_name == 'push' leg is TEMPORARY (see push trigger above).
    if: ${{ !cancelled() && (inputs.publish-html || github.ref == 'refs/heads/main' || github.event_name == 'push') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download HTML report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: kernel-clang-tidy-html-*
          path: site
          merge-multiple: true

      - name: Check report presence
        id: check
        run: |
          if [ -s site/index.html ]; then
            touch site/.nojekyll
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::no HTML report was produced; skipping publish."
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to tenstorrent/tt-metal-kernel-clang-tidy-results (gh-pages)
        if: ${{ steps.check.outputs.found == 'true' }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.CLANGSA_RESULTS_PAT }}
          external_repository: tenstorrent/tt-metal-kernel-clang-tidy-results
          publish_branch: gh-pages
          publish_dir: site
          force_orphan: true
          commit_message: "kernel clang-tidy report from tt-metal @ ${{ github.sha }}"

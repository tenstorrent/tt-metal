name: "Kernel clang-tidy"

# Post-hoc clang-tidy on runtime-JIT-compiled kernel code (prototype).
# Runs the ttnn sanity suite on hardware with kernel clang-tidy enabled on
# every leg; each leg captures its own JIT kernel compiles, lints them with
# clang-tidy via CodeChecker and exports an HTML report. This workflow
# collects the per-leg reports and publishes them to GitHub Pages.
# See tech_reports/code-indexing/kernel-clang-tidy.md.

on:
  # TEMPORARY (remove before merge): registers the workflow from this branch
  # and lets each push verify it end-to-end, including the publish step.
  push:
    branches: ["clang-tidy-jit-runtime-prototype"]
  workflow_dispatch:
    inputs:
      enabled-skus:
        description: "Comma-separated SKUs for the ttnn impl matrix"
        required: false
        type: string
        default: "wh_n300_civ2"
      publish-html:
        description: "Publish the HTML reports to tenstorrent/tt-metal-kernel-clang-tidy-results"
        required: false
        type: boolean
        default: false

jobs:
  check-harbor:
    uses: ./.github/workflows/check-harbor.yaml

  build-artifact:
    needs: check-harbor
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/build-artifact.yaml
    permissions:
      contents: read
      packages: write
    secrets: inherit
    with:
      harbor-prefix: ${{ needs.check-harbor.outputs.harbor-prefix }}
      build-inplace-wheel: true
      tracy: false
      skip-tt-train: false
      platform: "Ubuntu 22.04"

  run-ttnn-tests:
    needs: [check-harbor, build-artifact]
    if: ${{ !cancelled() && needs.build-artifact.result == 'success' }}
    uses: ./.github/workflows/ttnn-sanity-tests-impl.yaml
    secrets: inherit
    with:
      enabled-skus: ${{ inputs.enabled-skus || 'wh_n300_civ2' }}
      docker-image: ${{ needs.build-artifact.outputs.ci-test-docker-image }}
      harbor-prefix: ${{ needs.check-harbor.outputs.harbor-prefix }}
      wheel-artifact-name: ${{ needs.build-artifact.outputs.wheel-artifact-name }}
      enable-kernel-clang-tidy: true

  publish-report:
    needs: [run-ttnn-tests]
    # Legs that failed may still have produced findings, so do not gate on result.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        timeout-minutes: 20
        with:
          fetch-depth: 1
          sparse-checkout: .github/scripts/utils
          sparse-checkout-cone-mode: true

      # One directory per leg: CodeChecker's HTML export must run in the leg's
      # container (it reads the analyzed sources, which only exist there), so
      # the reports cannot be merged into one CodeChecker report here.
      - name: Download per-leg HTML reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: kernel-clang-tidy-html-*
          path: reports
          merge-multiple: false

      - name: Assemble site
        id: site
        env:
          REPORTS_DIR: reports
          SITE_DIR: site
        run: |
          set -euo pipefail
          python3 .github/scripts/utils/kernel_tidy_index.py \
            --reports-dir "$REPORTS_DIR" \
            --site-dir "$SITE_DIR" \
            --summary-file "${GITHUB_STEP_SUMMARY:-/dev/null}"
          if [ -s "$SITE_DIR/index.html" ]; then
            touch "$SITE_DIR/.nojekyll"
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload combined report
        if: ${{ steps.site.outputs.found == 'true' }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: kernel-tidy-report-site
          path: site
          retention-days: 30

      - name: Publish to tenstorrent/tt-metal-kernel-clang-tidy-results (gh-pages)
        if: >-
          ${{ steps.site.outputs.found == 'true' &&
              (inputs.publish-html || github.ref == 'refs/heads/main' || github.event_name == 'push') }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.CLANGSA_RESULTS_PAT }}
          external_repository: tenstorrent/tt-metal-kernel-clang-tidy-results
          publish_branch: gh-pages
          publish_dir: site
          force_orphan: true
          commit_message: "kernel clang-tidy report from tt-metal @ ${{ github.sha }}"

name: "Kernel clang-tidy"

# Post-hoc clang-tidy on runtime-JIT-compiled kernel code (prototype).
# Runs the ttnn sanity suite on hardware with kernel clang-tidy enabled on
# every leg; each leg captures its own JIT kernel compiles, lints them with
# clang-tidy via CodeChecker and uploads the raw plists. A final job merges
# every leg's plists and renders one deduplicated CodeChecker report, which is
# published to GitHub Pages.
# See tech_reports/code-indexing/kernel-clang-tidy.md.

on:
  # TEMPORARY (remove before merge): registers the workflow from this branch
  # and lets each push verify it end-to-end, including the publish step.
  push:
    branches: ["clang-tidy-jit-runtime-prototype"]
  workflow_dispatch:
    inputs:
      enabled-skus:
        description: "Comma-separated SKUs for the ttnn impl matrix"
        required: false
        type: string
        default: "wh_n300_civ2"
      publish-html:
        description: "Publish the HTML reports to tenstorrent/tt-metal-kernel-clang-tidy-results"
        required: false
        type: boolean
        default: false

jobs:
  check-harbor:
    uses: ./.github/workflows/check-harbor.yaml

  build-artifact:
    needs: check-harbor
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/build-artifact.yaml
    permissions:
      contents: read
      packages: write
    secrets: inherit
    with:
      harbor-prefix: ${{ needs.check-harbor.outputs.harbor-prefix }}
      build-inplace-wheel: true
      tracy: false
      skip-tt-train: false
      platform: "Ubuntu 22.04"

  run-ttnn-tests:
    needs: [check-harbor, build-artifact]
    if: ${{ !cancelled() && needs.build-artifact.result == 'success' }}
    uses: ./.github/workflows/ttnn-sanity-tests-impl.yaml
    secrets: inherit
    with:
      enabled-skus: ${{ inputs.enabled-skus || 'wh_n300_civ2' }}
      docker-image: ${{ needs.build-artifact.outputs.ci-test-docker-image }}
      harbor-prefix: ${{ needs.check-harbor.outputs.harbor-prefix }}
      wheel-artifact-name: ${{ needs.build-artifact.outputs.wheel-artifact-name }}
      enable-kernel-clang-tidy: true

  consolidate-report:
    name: "Consolidate & publish report"
    needs: [check-harbor, build-artifact, run-ttnn-tests]
    # Legs that failed may still have produced findings, so do not gate on result.
    if: ${{ !cancelled() }}
    runs-on: tt-ubuntu-2204-large-stable
    timeout-minutes: 180
    # Renders one merged report, so it needs the analyzed sources on the same
    # absolute paths the legs used: /opt/venv/... (wheel, via setup-job) and
    # /work/... (checkout). Without them CodeChecker emits index.html and
    # statistics.html but zero finding pages.
    container:
      image: ${{ format('{0}{1}', needs.check-harbor.outputs.harbor-prefix, needs.build-artifact.outputs.ci-test-docker-image) }}
      volumes:
        - ${{ github.workspace }}:/work
      options: --tmpfs /tmp
    defaults:
      run:
        shell: bash
        working-directory: /work

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        timeout-minutes: 20
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Configure git safe.directory
        run: git config --global --add safe.directory /work

      - name: Setup job
        uses: ./.github/actions/setup-job
        with:
          wheel-artifact-name: ${{ needs.build-artifact.outputs.wheel-artifact-name }}
          auto-triage: false

      - name: Install clang-tidy + CodeChecker
        run: |
          command -v clang-tidy-20 >/dev/null 2>&1 || { apt-get update || true; apt-get install -y clang-tidy-20 clang-20 || true; }
          for tool in clang clang++ clang-tidy; do
            update-alternatives --install "/usr/bin/$tool" "$tool" "/usr/bin/${tool}-20" 100 || true
          done
          if command -v uv >/dev/null 2>&1; then
            uv pip install codechecker==6.27.1
          else
            pip3 install codechecker==6.27.1
          fi

      - name: Download per-leg captures
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: kernel-clang-tidy-*
          path: /work/legs
          merge-multiple: false

      - name: Merge per-leg plists
        id: merge
        run: |
          set -euo pipefail
          # Restore each leg's generated JIT sources to their original absolute
          # paths. Without them CodeChecker skips every plist that references
          # one, which is all of them, and renders an empty report.
          find /work/legs -name 'generated-sources.tar.gz' -print0 \
            | xargs -0 -r -I{} tar -xzf {} -C / 2>/dev/null || true
          # Every TU re-reports the defects of the headers it includes, so the
          # raw plists carry ~19x more diagnostics than there are distinct
          # findings. parse is single-threaded and scales with that raw count,
          # so drop the duplicates in parallel first.
          if [ -n "$(find /work/legs -name '*.plist' -print -quit)" ]; then
            python3 .github/scripts/utils/merge_kernel_tidy_plists.py /work/legs /work/merged
          fi
          # parse reads review statuses from the report directory it is given.
          if [ -d /work/merged ]; then
            cp tt_metal/jit_build/kernel_clang_tidy/review_status.yaml /work/merged/
          fi
          n=$(find /work/merged -name '*.plist' 2>/dev/null | wc -l)
          echo "$n deduplicated plists from $(find /work/legs -maxdepth 1 -mindepth 1 -type d | wc -l) legs"
          if [ "$n" -eq 0 ]; then
            echo "::warning::no plists found; nothing to consolidate."
            echo "merged=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "merged=$n" >> "$GITHUB_OUTPUT"

      # Cheap relative to the HTML render and it yields the complete finding
      # set, so it runs first: if the render below runs long we still publish
      # the numbers. parse exits non-zero when it finds reports, hence || true.
      - name: Export findings and summarise
        if: ${{ steps.merge.outputs.merged != '0' }}
        timeout-minutes: 45
        run: |
          set -euo pipefail
          mkdir -p /work/site
          CodeChecker parse /work/merged --export json --output /work/site/reports.json >/dev/null 2>&1 || true
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import collections, json, pathlib
          p = pathlib.Path("/work/site/reports.json")
          reports = json.loads(p.read_text()).get("reports", []) if p.is_file() else []
          def loc(r):
              f = r.get("file") or {}
              path = f.get("path") if isinstance(f, dict) else str(f)
              return (path, r.get("line"), r.get("column"), r.get("checker_name"))
          unique = {loc(r) for r in reports}
          by_severity = collections.Counter(r.get("severity") for r in reports)
          # CodeChecker's own export carries bug paths and macro expansions and
          # ran to 124 MB, over GitHub's 100 MB per-file limit. This is the
          # queryable form, and the one to point an agent at.
          slim = [
              {"file": loc(r)[0], "line": r.get("line"), "col": r.get("column"),
               "checker": r.get("checker_name"), "severity": r.get("severity"),
               "message": r.get("message")}
              for r in reports
          ]
          pathlib.Path("/work/site/findings.json").write_text(
              json.dumps(slim, separators=(",", ":"))
          )
          print("## Kernel clang-tidy (consolidated)")
          print("")
          print(f"{len(reports)} findings, {len(unique)} unique locations.")
          print("")
          print("| Severity | Findings |")
          print("| --- | --- |")
          for name in ("CRITICAL", "HIGH", "MEDIUM", "LOW", "STYLE", "UNSPECIFIED"):
              if by_severity.get(name):
                  print(f"| {name} | {by_severity[name]} |")
          top = collections.Counter(
              r.get("checker_name") for r in reports
              if r.get("severity") in ("CRITICAL", "HIGH")
          )
          if top:
              print("")
              print("Top severity checkers: " + ", ".join(f"{c} ({n})" for c, n in top.most_common()))
          PY

      # The expensive step: renders a source-annotated page per finding.
      # Bounded and non-fatal so a slow render cannot cost us the whole job;
      # run 33984801327 hit the job timeout here and published nothing.
      - name: Render consolidated HTML report
        id: site
        if: ${{ steps.merge.outputs.merged != '0' }}
        timeout-minutes: 100
        continue-on-error: true
        run: |
          CodeChecker parse /work/merged --export html --output /work/site || true
          # index.html alone is not success: CodeChecker writes it even when it
          # skipped every plist for missing sources, which is how run
          # 34006365739 published a report with no findings in it.
          pages=$(ls /work/site/*.plist.html 2>/dev/null | wc -l)
          echo "finding pages rendered: $pages"
          if [ -s /work/site/index.html ] && [ "$pages" -gt 0 ]; then
            touch /work/site/.nojekyll
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::render produced no finding pages; not publishing."
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      # Not gated on the render: reports.json is the complete finding set and
      # is worth keeping even if only the HTML rendering ran long.
      - name: Upload consolidated report
        if: ${{ !cancelled() && steps.merge.outputs.merged != '0' }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: kernel-tidy-report-site
          path: /work/site
          retention-days: 30

      - name: Publish to tenstorrent/tt-metal-kernel-clang-tidy-results (gh-pages)
        if: >-
          ${{ steps.site.outputs.found == 'true' &&
              (inputs.publish-html || github.ref == 'refs/heads/main' || github.event_name == 'push') }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.CLANGSA_RESULTS_PAT }}
          external_repository: tenstorrent/tt-metal-kernel-clang-tidy-results
          publish_branch: gh-pages
          publish_dir: /work/site
          force_orphan: true
          # CodeChecker's raw export exceeds GitHub's 100 MB per-file limit and
          # is only in the artifact; findings.json is the published database.
          exclude_assets: ".github,reports.json"
          commit_message: "kernel clang-tidy report from tt-metal @ ${{ github.sha }}"

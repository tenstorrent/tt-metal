name: Blaze Merge Gate

# Runs tt-blaze's ENTIRE merge gate (its ci.yaml) against the tt-metal build this
# release pipeline just produced, so a tt-metal change that breaks tt-blaze is
# caught while the release is being cut rather than by the next uplift.
#
# tt-metal does not start tt-blaze itself. It starts the relay workflow
# relay.yaml in tenstorrent/tt-blaze-relay with ONE input, the id of this run.
# The relay checks that run against public tt-metal (repository, workflow,
# event, branch main, age, the profiler build), then starts ONE run of
# tt-blaze's ci.yaml on main with values it takes from GitHub (this run's
# commit), waits for it and ends with its result. This job waits for the relay
# run and passes or fails with it. When this job is cancelled, fails or times
# out, it cancels the relay run, and the relay then cancels the tt-blaze run.
#
# tt-blaze's ci.yaml on main, its whole gate, default runner labels and the
# image of tt-blaze's DEV_IMAGE variable: these are fixed in the relay. Other
# tt-blaze workflows, refs, buckets or images cannot be asked for from here.
#
# tt-blaze cannot build tt-metal itself: its CI consumes the prebuilt tarball and
# wheel that `build-artifact-profiler` published in this run. The relay passes
# this run's id and commit to tt-blaze, so tt-blaze downloads exactly those
# artifacts and moves its tt-metal submodule to the same commit.
#
# Auth: no token is stored in this repo. The job gets short-lived tokens at run
# time (OIDC sign-in, role tenstorrent--tt-metal--blaze-dispatch). The role
# answers only a job that runs on `main` (schedule or manual dispatch) AND
# names the environment `tt-blaze-dispatch`. Tokens are on tt-blaze-relay
# only: a write token (actions write) for the dispatch and for a cancel, each
# revoked right after its use, and a read token (actions read) for the wait,
# one per 12 minute segment, revoked at the end of the segment (a token and
# its sign-in last at most 15 minutes). The caller job must grant
# `id-token: write`. To change the access, open an OSPO ticket.

on:
  workflow_call:
    outputs:
      relay-run-url:
        description: "URL of the relay run this gate waited on (empty if none was found)."
        value: ${{ jobs.blaze-ci.outputs.relay-run-url }}

permissions:
  contents: read

jobs:
  blaze-ci:
    name: tt-blaze CI (full merge gate)
    runs-on: ubuntu-latest
    # The wait (GATE_WAIT_MINUTES), a few minutes for the dispatch and the
    # cancel path, and slack. The relay's own deadline (175 minutes) comes
    # first, so normally the relay reports the result or the timeout.
    timeout-minutes: 205
    # The role binds this environment. Deployment branch rule: main only.
    environment: tt-blaze-dispatch
    permissions:
      id-token: write # sign-in for the short-lived relay tokens
    outputs:
      relay-run-url: ${{ steps.dispatch.outputs.relay-run-url }}
    env:
      RELAY_REPO: tenstorrent/tt-blaze-relay
      RELAY_WORKFLOW: relay.yaml
      RELAY_REF: main
      GATE_WAIT_MINUTES: "190"
      SEGMENT_MINUTES: "12"
      POLL_SECONDS: "60"
      # The id of this run. In a reusable workflow it is the caller's run id,
      # the run that holds the profiler build.
      METAL_RUN_ID: ${{ github.run_id }}
    steps:
      # The tokens are given only to runs on main. Stop here, with one clear
      # message, instead of failing later at the sign-in.
      - name: Check the trigger
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$REPO" != tenstorrent/tt-metal ] || [ "$REF" != refs/heads/main ]; then
            echo "::error::the tt-blaze gate runs only on main of tenstorrent/tt-metal; ask OSPO by ticket for other needs"
            exit 1
          fi
          case "$EVENT" in
            schedule | workflow_dispatch) ;;
            *)
              echo "::error::the tt-blaze gate runs only for schedule and workflow_dispatch (got ${EVENT})"
              exit 1
              ;;
          esac
          if ! [[ "$METAL_RUN_ID" =~ ^[1-9][0-9]{0,19}$ ]]; then
            echo "::error::unexpected run id"
            exit 1
          fi

      # The helpers of the steps below, from this file. No checkout: this job
      # runs no code of the repository and no code chosen by an input.
      - name: Write the job helpers
        shell: bash
        run: |
          cat >"$RUNNER_TEMP/relay-lib.sh" <<'RELAY_LIB_EOF'
            # shellcheck shell=bash
            # Helpers of the blaze-ci job. Written by the job itself from the workflow
            # file (no checkout, no repository script). Sourced, not run.
            #
            # Token rules: a token comes only through the environment of a step. It is
            # never printed and never put on a command line (printf is a shell builtin;
            # curl reads its headers from stdin; gh reads GH_TOKEN from the environment).

            # revoke_token NAME LABEL: revokes the GitHub token held in variable NAME.
            # Always returns 0. Prints only the HTTP status.
            revoke_token() {
              local tok="${!1:-}" code
              if [ -z "$tok" ]; then
                echo "$2 token: nothing to revoke"
                return 0
              fi
              code=$(printf 'header = "Authorization: Bearer %s"\nheader = "Accept: application/vnd.github+json"\n' "$tok" |
                curl -sS --max-time 10 -o /dev/null -w '%{http_code}' -K - -X DELETE \
                  https://api.github.com/installation/token 2>/dev/null) || code=000
              case "$code" in
                204) echo "$2 token: revoked" ;;
                401) echo "$2 token: already invalid" ;;
                *) echo "$2 token: revoke not confirmed (HTTP ${code}); it expires on its own" ;;
              esac
              return 0
            }

            # The relay's run name for this tt-metal run (relay.yaml run-name).
            relay_title() {
              printf 'tt-blaze relay for tt-metal run %s' "$METAL_RUN_ID"
            }

            # relay_run_state ID: prints "path<TAB>branch<TAB>event<TAB>status<TAB>conclusion<TAB>url<TAB>title".
            # Needs GH_TOKEN with actions read on the relay.
            relay_run_state() {
              gh api "repos/${RELAY_REPO}/actions/runs/$1" |
                jq -r '[.path, .head_branch, .event, .status, (.conclusion // "-"), .html_url, (.display_title // "")] | @tsv'
            }

            # relay_run_is_ours ID: 0 when run ID is a workflow_dispatch run of
            # RELAY_WORKFLOW on RELAY_REF with the run name of this tt-metal run.
            relay_run_is_ours() {
              local p b e t
              IFS=$'\t' read -r p b e _ _ _ t < <(relay_run_state "$1") || return 1
              [ "$p" = ".github/workflows/${RELAY_WORKFLOW}" ] && [ "$b" = "$RELAY_REF" ] &&
                [ "$e" = workflow_dispatch ] && [ "$t" = "$(relay_title)" ]
            }

            # find_relay_run: prints the id of the oldest relay run with the run name of
            # this tt-metal run that was created after DISPATCH_AT (ISO time, taken 30
            # seconds before the dispatch call). A re-run of this tt-metal run keeps the
            # same run id, so the time filter keeps out the relay runs of earlier attempts.
            find_relay_run() {
              gh api "repos/${RELAY_REPO}/actions/workflows/${RELAY_WORKFLOW}/runs?event=workflow_dispatch&branch=${RELAY_REF}&per_page=50" |
                jq -r --arg t "$(relay_title)" --arg since "$DISPATCH_AT" \
                  '[.workflow_runs[] | select((.display_title // "") == $t and .created_at >= $since)] | sort_by(.created_at) | .[0].id // empty'
            }

            # cancel_lookup_run_id: prints the relay run id for the cancel path, or
            # nothing. RELAY_RUN_ID when known. Else, when the dispatch was started
            # (DISPATCH_AT set), the run-name lookup: 12 tries, LOOKUP_SLEEP seconds
            # apart (default 5, about 60 seconds), when the dispatch call returned success
            # (DISPATCH_ACCEPTED=1) or the job was cancelled (JOB_STATUS=cancelled, so the
            # call may have been accepted); one try only after a refused call.
            cancel_lookup_run_id() {
              local run_id="${RELAY_RUN_ID:-}" tries=1 try
              if [[ "$run_id" =~ ^[0-9]+$ ]]; then
                echo "$run_id"
                return 0
              fi
              [ -n "${DISPATCH_AT:-}" ] || return 0
              if [ "${DISPATCH_ACCEPTED:-}" = 1 ] || [ "${JOB_STATUS:-}" = cancelled ]; then
                tries=12
              fi
              for try in $(seq 1 "$tries"); do
                run_id=$(find_relay_run) || run_id=""
                if [[ "$run_id" =~ ^[0-9]+$ ]]; then
                  echo "$run_id"
                  return 0
                fi
                if [ "$try" -lt "$tries" ]; then
                  sleep "${LOOKUP_SLEEP:-5}" &
                  wait $!
                fi
              done
              return 0
            }

            # poll_segment: watches the relay run for at most SEGMENT_MINUTES with the
            # read token in RELAY_READ_TOKEN, and revokes that token at the end.
            # Writes RELAY_DONE=1 and RELAY_CONCLUSION to GITHUB_ENV when the run ended.
            # Exit 1 when the gate deadline passed (the cancel steps then stop the relay run).
            poll_segment() {
              local segment_end now state p b e status conclusion url title
              trap 'revoke_token RELAY_READ_TOKEN read' EXIT
              trap 'exit 143' TERM INT
              [ -n "${RELAY_READ_TOKEN:-}" ] || { echo "::error::no relay read token from the Vault step"; exit 1; }
              [[ "${RELAY_RUN_ID:-}" =~ ^[0-9]+$ ]] || { echo "::error::no relay run id"; exit 1; }
              [[ "${GATE_DEADLINE:-}" =~ ^[0-9]+$ ]] || { echo "::error::no deadline"; exit 1; }
              export GH_TOKEN="$RELAY_READ_TOKEN"
              segment_end=$(($(date +%s) + SEGMENT_MINUTES * 60))
              while :; do
                now=$(date +%s)
                if [ "$now" -ge "$GATE_DEADLINE" ]; then
                  echo "::error::relay run ${RELAY_RUN_ID} did not end within ${GATE_WAIT_MINUTES} minutes"
                  echo "- relay run ${RELAY_RUN_ID}: no result within ${GATE_WAIT_MINUTES} minutes" >>"$GITHUB_STEP_SUMMARY"
                  exit 1
                fi
                [ "$now" -lt "$segment_end" ] || break
                state=$(relay_run_state "$RELAY_RUN_ID") || state=""
                if [ -n "$state" ]; then
                  IFS=$'\t' read -r p b e status conclusion url title <<<"$state"
                  if [ "$p" != ".github/workflows/${RELAY_WORKFLOW}" ] || [ "$b" != "$RELAY_REF" ] ||
                    [ "$e" != workflow_dispatch ] || [ "$title" != "$(relay_title)" ]; then
                    echo "::error::run ${RELAY_RUN_ID} is not the relay run this job started"
                    exit 1
                  fi
                  if [ "$status" = completed ]; then
                    { echo "RELAY_DONE=1"; echo "RELAY_CONCLUSION=${conclusion}"; } >>"$GITHUB_ENV"
                    echo "relay run ${RELAY_RUN_ID} ended: ${conclusion} (${url})"
                    echo "- relay run [${RELAY_RUN_ID}](${url}): ${conclusion}" >>"$GITHUB_STEP_SUMMARY"
                    exit 0
                  fi
                  echo "relay run ${RELAY_RUN_ID}: ${status}"
                else
                  echo "::warning::could not read relay run ${RELAY_RUN_ID}; trying again"
                fi
                # Background sleep, so a cancel signal is handled at once.
                sleep "$POLL_SECONDS" &
                wait $!
              done
              echo "segment ended; the next segment gets a new token"
            }
          RELAY_LIB_EOF

      # Write token: just before the dispatch; the next step revokes it.
      - name: Get the relay write token (dispatch)
        id: vault-dispatch
        uses: tenstorrent/.github/actions/vault-secrets@a697f1bb22ad8b488b0ac63f9a261e462179fe13 # vault-secrets-v1.0.0
        with:
          role: tenstorrent--tt-metal--blaze-dispatch
          github-token: tenstorrent--tt-metal--relay-actions-write

      - name: Start the tt-blaze relay
        id: dispatch
        shell: bash
        env:
          RELAY_TOKEN: ${{ steps.vault-dispatch.outputs.token }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          . "$RUNNER_TEMP/relay-lib.sh"
          # Revoke the write token on every exit, also on a cancel signal.
          trap 'revoke_token RELAY_TOKEN write' EXIT
          trap 'exit 143' TERM INT
          [ -n "${RELAY_TOKEN:-}" ] || { echo "::error::no relay write token from the Vault step; ask OSPO by ticket"; exit 1; }
          export GH_TOKEN="$RELAY_TOKEN"

          # The deadline and the time filter for the fallback lookup are set
          # before the call. DISPATCHED=1 also comes before the call, so a
          # cancel right after GitHub accepted it still reaches the cancel path.
          DISPATCH_AT=$(date -u -d '-30 seconds' +%Y-%m-%dT%H:%M:%SZ)
          {
            echo "DISPATCH_AT=${DISPATCH_AT}"
            echo "GATE_DEADLINE=$(($(date +%s) + GATE_WAIT_MINUTES * 60))"
            echo "DISPATCHED=1"
          } >>"$GITHUB_ENV"

          # The body is built by jq; its only value is this run's id. Same
          # request form as the relay's own dispatch: when GitHub answers 200
          # with workflow_run_id, that id is used; on a 204 (no body) the run is
          # found by its run name below.
          body=$(jq -n --arg ref "$RELAY_REF" --arg rid "$METAL_RUN_ID" '{ref: $ref, inputs: {"metal-run-id": $rid}}')
          resp=$(gh api -X POST "repos/${RELAY_REPO}/actions/workflows/${RELAY_WORKFLOW}/dispatches" --input - <<<"$body") || {
            echo "::error::the dispatch of ${RELAY_WORKFLOW} on ${RELAY_REPO}@${RELAY_REF} was refused. Ask OSPO by ticket."
            echo "- tt-blaze relay: dispatch refused" >>"$GITHUB_STEP_SUMMARY"
            exit 1
          }
          echo "DISPATCH_ACCEPTED=1" >>"$GITHUB_ENV"
          echo "started ${RELAY_WORKFLOW} on ${RELAY_REPO}@${RELAY_REF} for tt-metal run ${METAL_RUN_ID}"

          # The run id: from the 200 answer, else by the relay's run name,
          # only among runs created after DISPATCH_AT.
          run_id=$(printf '%s' "${resp:-}" | jq -r '.workflow_run_id // empty' 2>/dev/null || true)
          if ! [[ "$run_id" =~ ^[0-9]+$ ]]; then
            run_id=""
            for _ in $(seq 1 24); do
              sleep 5 &
              wait $!
              run_id=$(find_relay_run) || run_id=""
              [ -z "$run_id" ] || break
            done
          fi
          [[ "$run_id" =~ ^[0-9]+$ ]] || { echo "::error::the relay was started, but its run was not found within 2 minutes"; exit 1; }
          relay_run_is_ours "$run_id" || { echo "::error::run ${run_id} is not the relay run this job started"; exit 1; }

          url="https://github.com/${RELAY_REPO}/actions/runs/${run_id}"
          echo "RELAY_RUN_ID=${run_id}" >>"$GITHUB_ENV"
          echo "relay-run-url=${url}" >>"$GITHUB_OUTPUT"
          echo "- tt-blaze relay: [run ${run_id}](${url})" >>"$GITHUB_STEP_SUMMARY"
          echo "relay run: ${url}"

      # Safety net when the step above did not reach its own revoke (for
      # example a cancel between the two steps). Quiet when already revoked.
      - name: Revoke the relay write token (dispatch)
        if: ${{ always() && steps.vault-dispatch.outcome == 'success' }}
        shell: bash
        env:
          RELAY_TOKEN: ${{ steps.vault-dispatch.outputs.token }}
        run: |
          # shellcheck disable=SC1091
          . "$RUNNER_TEMP/relay-lib.sh" 2>/dev/null || exit 0
          revoke_token RELAY_TOKEN write

      # Wait segment 1 of 16: a new read token, at most SEGMENT_MINUTES of polling.
      - name: Get a relay read token (wait 1)
        id: vault-read-1
        if: ${{ env.RELAY_RUN_ID != '' && env.RELAY_DONE != '1' }}
        uses: tenstorrent/.github/actions/vault-secrets@a697f1bb22ad8b488b0ac63f9a261e462179fe13 # vault-secrets-v1.0.0
        with:
          role: tenstorrent--tt-metal--blaze-dispatch
          github-token: tenstorrent--tt-metal--relay-actions-read

      - name: Wait for the relay run (1)
        if: ${{ env.RELAY_RUN_ID != '' && env.RELAY_DONE != '1' }}
        shell: bash
        env:
          RELAY_READ_TOKEN: ${{ steps.vault-read-1.outputs.token }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          . "$RUNNER_TEMP/relay-lib.sh"
          poll_segment

      # Wait segment 2 of 16: a new read token, at most SEGMENT_MINUTES of polling.
      - name: Get a relay read token (wait 2)
        id: vault-read-2
        if: ${{ env.RELAY_RUN_ID != '' && env.RELAY_DONE != '1' }}
        uses: tenstorrent/.github/actions/vault-secrets@a697f1bb22ad8b488b0ac63f9a261e462179fe13 # vault-secrets-v1.0.0
        with:
          role: tenstorrent--tt-metal--blaze-dispatch
          github-token: tenstorrent--tt-metal--relay-actions-read

      - name: Wait for the relay run (2)
        if: ${{ env.RELAY_RUN_ID != '' && env.RELAY_DONE != '1' }}
        shell: bash
        env:
          RELAY_READ_TOKEN: ${{ steps.vault-read-2.outputs.token }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          . "$RUNNER_TEMP/relay-lib.sh"
          poll_segment

      # Wait segment 3 of 16: a new read token, at most SEGMENT_MINUTES of polling.
      - name: Get a relay read token (wait 3)
        id: vault-read-3
        if: ${{ env.RELAY_RUN_ID != '' && env.RELAY_DONE != '1' }}
        uses: tenstorrent/.github/actions/vault-secrets@a697f1bb22ad8b488b0ac63f9a261e462179fe13 # vault-secrets-v1.0.0
        with:
          role: tenstorrent--tt-metal--blaze-dispatch
          github-token: tenstorrent--tt-metal--relay-actions-read

      - name: Wait for the relay run (3)
        if: ${{ env.RELAY_RUN_ID != '' && env.RELAY_DONE != '1' }}
        shell: bash
        env:
          RELAY_READ_TOKEN: ${{ steps.vault-read-3.outputs.token }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          . "$RUNNER_TEMP/relay-lib.sh"
          poll_segment

      # Wait segment 4 of 16: a new read token, at most SEGMENT_MINUTES of polling.
      - name: Get a relay read token (wait 4)
        id: vault-read-4
        if: ${{ env.RELAY_RUN_ID != '' && env.RELAY_DONE != '1' }}
        uses: tenstorrent/.github/actions/vault-secrets@a697f1bb22ad8b488b0ac63f9a261e462179fe13 # vault-secrets-v1.0.0
        with:
          role: tenstorrent--tt-metal--blaze-dispatch
          github-token: tenstorrent--tt-metal--relay-actions-read

      - name: Wait for the relay run (4)
        if: ${{ env.RELAY_RUN_ID != '' && env.RELAY_DONE != '1' }}
        shell: bash
        env:
          RELAY_READ_TOKEN: ${{ steps.vault-read-4.outputs.token }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          . "$RUNNER_TEMP/relay-lib.sh"
          poll_segment

      # Wait segment 5 of 16: a new read token, at most SEGMENT_MINUTES of polling.
      - name: Get a relay read token (wait 5)
        id: vault-read-5
        if: ${{ env.RELAY_RUN_ID != '' && env.RELAY_DONE != '1' }}
        uses: tenstorrent/.github/actions/vault-secrets@a697f1bb22ad8b488b0ac63f9a261e462179fe13 # vault-secrets-v1.0.0
        with:
          role: tenstorrent--tt-metal--blaze-dispatch
          github-token: tenstorrent--tt-metal--relay-actions-read

      - name: Wait for the relay run (5)
        if: ${{ env.RELAY_RUN_ID != '' && env.RELAY_DONE != '1' }}
        shell: bash
        env:
          RELAY_READ_TOKEN: ${{ steps.vault-read-5.outputs.token }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          . "$RUNNER_TEMP/relay-lib.sh"
          poll_segment

      # Wait segment 6 of 16: a new read token, at most SEGMENT_MINUTES of polling.
      - name: Get a relay read token (wait 6)
        id: vault-read-6
        if: ${{ env.RELAY_RUN_ID != '' && env.RELAY_DONE != '1' }}
        uses: tenstorrent/.github/actions/vault-secrets@a697f1bb22ad8b488b0ac63f9a261e462179fe13 # vault-secrets-v1.0.0
        with:
          role: tenstorrent--tt-metal--blaze-dispatch
          github-token: tenstorrent--tt-metal--relay-actions-read

      - name: Wait for the relay run (6)
        if: ${{ env.RELAY_RUN_ID != '' && env.RELAY_DONE != '1' }}
        shell: bash
        env:
          RELAY_READ_TOKEN: ${{ steps.vault-read-6.outputs.token }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          . "$RUNNER_TEMP/relay-lib.sh"
          poll_segment

      # Wait segment 7 of 16: a new read token, at most SEGMENT_MINUTES of polling.
      - name: Get a relay read token (wait 7)
        id: vault-read-7
        if: ${{ env.RELAY_RUN_ID != '' && env.RELAY_DONE != '1' }}
        uses: tenstorrent/.github/actions/vault-secrets@a697f1bb22ad8b488b0ac63f9a261e462179fe13 # vault-secrets-v1.0.0
        with:
          role: tenstorrent--tt-metal--blaze-dispatch
          github-token: tenstorrent--tt-metal--relay-actions-read

      - name: Wait for the relay run (7)
        if: ${{ env.RELAY_RUN_ID != '' && env.RELAY_DONE != '1' }}
        shell: bash
        env:
          RELAY_READ_TOKEN: ${{ steps.vault-read-7.outputs.token }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          . "$RUNNER_TEMP/relay-lib.sh"
          poll_segment

      # Wait segment 8 of 16: a new read token, at most SEGMENT_MINUTES of polling.
      - name: Get a relay read token (wait 8)
        id: vault-read-8
        if: ${{ env.RELAY_RUN_ID != '' && env.RELAY_DONE != '1' }}
        uses: tenstorrent/.github/actions/vault-secrets@a697f1bb22ad8b488b0ac63f9a261e462179fe13 # vault-secrets-v1.0.0
        with:
          role: tenstorrent--tt-metal--blaze-dispatch
          github-token: tenstorrent--tt-metal--relay-actions-read

      - name: Wait for the relay run (8)
        if: ${{ env.RELAY_RUN_ID != '' && env.RELAY_DONE != '1' }}
        shell: bash
        env:
          RELAY_READ_TOKEN: ${{ steps.vault-read-8.outputs.token }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          . "$RUNNER_TEMP/relay-lib.sh"
          poll_segment

      # Wait segment 9 of 16: a new read token, at most SEGMENT_MINUTES of polling.
      - name: Get a relay read token (wait 9)
        id: vault-read-9
        if: ${{ env.RELAY_RUN_ID != '' && env.RELAY_DONE != '1' }}
        uses: tenstorrent/.github/actions/vault-secrets@a697f1bb22ad8b488b0ac63f9a261e462179fe13 # vault-secrets-v1.0.0
        with:
          role: tenstorrent--tt-metal--blaze-dispatch
          github-token: tenstorrent--tt-metal--relay-actions-read

      - name: Wait for the relay run (9)
        if: ${{ env.RELAY_RUN_ID != '' && env.RELAY_DONE != '1' }}
        shell: bash
        env:
          RELAY_READ_TOKEN: ${{ steps.vault-read-9.outputs.token }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          . "$RUNNER_TEMP/relay-lib.sh"
          poll_segment

      # Wait segment 10 of 16: a new read token, at most SEGMENT_MINUTES of polling.
      - name: Get a relay read token (wait 10)
        id: vault-read-10
        if: ${{ env.RELAY_RUN_ID != '' && env.RELAY_DONE != '1' }}
        uses: tenstorrent/.github/actions/vault-secrets@a697f1bb22ad8b488b0ac63f9a261e462179fe13 # vault-secrets-v1.0.0
        with:
          role: tenstorrent--tt-metal--blaze-dispatch
          github-token: tenstorrent--tt-metal--relay-actions-read

      - name: Wait for the relay run (10)
        if: ${{ env.RELAY_RUN_ID != '' && env.RELAY_DONE != '1' }}
        shell: bash
        env:
          RELAY_READ_TOKEN: ${{ steps.vault-read-10.outputs.token }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          . "$RUNNER_TEMP/relay-lib.sh"
          poll_segment

      # Wait segment 11 of 16: a new read token, at most SEGMENT_MINUTES of polling.
      - name: Get a relay read token (wait 11)
        id: vault-read-11
        if: ${{ env.RELAY_RUN_ID != '' && env.RELAY_DONE != '1' }}
        uses: tenstorrent/.github/actions/vault-secrets@a697f1bb22ad8b488b0ac63f9a261e462179fe13 # vault-secrets-v1.0.0
        with:
          role: tenstorrent--tt-metal--blaze-dispatch
          github-token: tenstorrent--tt-metal--relay-actions-read

      - name: Wait for the relay run (11)
        if: ${{ env.RELAY_RUN_ID != '' && env.RELAY_DONE != '1' }}
        shell: bash
        env:
          RELAY_READ_TOKEN: ${{ steps.vault-read-11.outputs.token }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          . "$RUNNER_TEMP/relay-lib.sh"
          poll_segment

      # Wait segment 12 of 16: a new read token, at most SEGMENT_MINUTES of polling.
      - name: Get a relay read token (wait 12)
        id: vault-read-12
        if: ${{ env.RELAY_RUN_ID != '' && env.RELAY_DONE != '1' }}
        uses: tenstorrent/.github/actions/vault-secrets@a697f1bb22ad8b488b0ac63f9a261e462179fe13 # vault-secrets-v1.0.0
        with:
          role: tenstorrent--tt-metal--blaze-dispatch
          github-token: tenstorrent--tt-metal--relay-actions-read

      - name: Wait for the relay run (12)
        if: ${{ env.RELAY_RUN_ID != '' && env.RELAY_DONE != '1' }}
        shell: bash
        env:
          RELAY_READ_TOKEN: ${{ steps.vault-read-12.outputs.token }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          . "$RUNNER_TEMP/relay-lib.sh"
          poll_segment

      # Wait segment 13 of 16: a new read token, at most SEGMENT_MINUTES of polling.
      - name: Get a relay read token (wait 13)
        id: vault-read-13
        if: ${{ env.RELAY_RUN_ID != '' && env.RELAY_DONE != '1' }}
        uses: tenstorrent/.github/actions/vault-secrets@a697f1bb22ad8b488b0ac63f9a261e462179fe13 # vault-secrets-v1.0.0
        with:
          role: tenstorrent--tt-metal--blaze-dispatch
          github-token: tenstorrent--tt-metal--relay-actions-read

      - name: Wait for the relay run (13)
        if: ${{ env.RELAY_RUN_ID != '' && env.RELAY_DONE != '1' }}
        shell: bash
        env:
          RELAY_READ_TOKEN: ${{ steps.vault-read-13.outputs.token }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          . "$RUNNER_TEMP/relay-lib.sh"
          poll_segment

      # Wait segment 14 of 16: a new read token, at most SEGMENT_MINUTES of polling.
      - name: Get a relay read token (wait 14)
        id: vault-read-14
        if: ${{ env.RELAY_RUN_ID != '' && env.RELAY_DONE != '1' }}
        uses: tenstorrent/.github/actions/vault-secrets@a697f1bb22ad8b488b0ac63f9a261e462179fe13 # vault-secrets-v1.0.0
        with:
          role: tenstorrent--tt-metal--blaze-dispatch
          github-token: tenstorrent--tt-metal--relay-actions-read

      - name: Wait for the relay run (14)
        if: ${{ env.RELAY_RUN_ID != '' && env.RELAY_DONE != '1' }}
        shell: bash
        env:
          RELAY_READ_TOKEN: ${{ steps.vault-read-14.outputs.token }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          . "$RUNNER_TEMP/relay-lib.sh"
          poll_segment

      # Wait segment 15 of 16: a new read token, at most SEGMENT_MINUTES of polling.
      - name: Get a relay read token (wait 15)
        id: vault-read-15
        if: ${{ env.RELAY_RUN_ID != '' && env.RELAY_DONE != '1' }}
        uses: tenstorrent/.github/actions/vault-secrets@a697f1bb22ad8b488b0ac63f9a261e462179fe13 # vault-secrets-v1.0.0
        with:
          role: tenstorrent--tt-metal--blaze-dispatch
          github-token: tenstorrent--tt-metal--relay-actions-read

      - name: Wait for the relay run (15)
        if: ${{ env.RELAY_RUN_ID != '' && env.RELAY_DONE != '1' }}
        shell: bash
        env:
          RELAY_READ_TOKEN: ${{ steps.vault-read-15.outputs.token }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          . "$RUNNER_TEMP/relay-lib.sh"
          poll_segment

      # Wait segment 16 of 16: a new read token, at most SEGMENT_MINUTES of polling.
      - name: Get a relay read token (wait 16)
        id: vault-read-16
        if: ${{ env.RELAY_RUN_ID != '' && env.RELAY_DONE != '1' }}
        uses: tenstorrent/.github/actions/vault-secrets@a697f1bb22ad8b488b0ac63f9a261e462179fe13 # vault-secrets-v1.0.0
        with:
          role: tenstorrent--tt-metal--blaze-dispatch
          github-token: tenstorrent--tt-metal--relay-actions-read

      - name: Wait for the relay run (16)
        if: ${{ env.RELAY_RUN_ID != '' && env.RELAY_DONE != '1' }}
        shell: bash
        env:
          RELAY_READ_TOKEN: ${{ steps.vault-read-16.outputs.token }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          . "$RUNNER_TEMP/relay-lib.sh"
          poll_segment

      - name: Report the relay result
        shell: bash
        env:
          DONE: ${{ env.RELAY_DONE }}
          CONCLUSION: ${{ env.RELAY_CONCLUSION }}
        run: |
          if [ "$DONE" != 1 ]; then
            echo "::error::no relay result within ${GATE_WAIT_MINUTES} minutes"
            exit 1
          fi
          if [ "$CONCLUSION" = success ]; then
            echo "tt-blaze CI passed (through the relay)"
            exit 0
          fi
          echo "::error::the relay run ended '${CONCLUSION}': tt-blaze CI failed, timed out or was refused. See the relay run (its log names the tt-blaze run)."
          exit 1

      # This job was cancelled, failed or timed out while the relay run may
      # still run: cancel the relay run with a fresh write token. The relay
      # then cancels the tt-blaze run it started.
      - name: Get the relay write token (cancel)
        id: vault-cancel
        if: ${{ (cancelled() || failure()) && env.DISPATCHED == '1' && env.RELAY_DONE != '1' }}
        uses: tenstorrent/.github/actions/vault-secrets@a697f1bb22ad8b488b0ac63f9a261e462179fe13 # vault-secrets-v1.0.0
        with:
          role: tenstorrent--tt-metal--blaze-dispatch
          github-token: tenstorrent--tt-metal--relay-actions-write

      - name: Cancel the relay run of this job
        if: ${{ (cancelled() || failure()) && env.DISPATCHED == '1' && env.RELAY_DONE != '1' }}
        shell: bash
        env:
          RELAY_CANCEL_TOKEN: ${{ steps.vault-cancel.outputs.token }}
          # "cancelled" when the tt-metal run was cancelled: the dispatch call
          # may have been accepted though DISPATCH_ACCEPTED was not written.
          JOB_STATUS: ${{ job.status }}
        run: |
          set -uo pipefail
          # shellcheck disable=SC1091
          . "$RUNNER_TEMP/relay-lib.sh" || exit 0
          trap 'revoke_token RELAY_CANCEL_TOKEN cancel' EXIT
          if [ -z "${RELAY_CANCEL_TOKEN:-}" ]; then
            echo "::warning::no write token for the cancel; the relay run (if any) keeps running until its own deadline"
            exit 0
          fi
          export GH_TOKEN="$RELAY_CANCEL_TOKEN"
          run_id=$(cancel_lookup_run_id) || run_id=""
          if ! [[ "$run_id" =~ ^[0-9]+$ ]]; then
            echo "no relay run of this job found: nothing to cancel"
            exit 0
          fi
          if ! relay_run_is_ours "$run_id"; then
            echo "::warning::run ${run_id} is not the relay run this job started; not cancelled"
            exit 0
          fi
          if gh api -X POST "repos/${RELAY_REPO}/actions/runs/${run_id}/cancel" >/dev/null 2>&1; then
            echo "relay run ${run_id}: cancel requested"
            echo "- relay run ${run_id}: cancel requested" >>"$GITHUB_STEP_SUMMARY"
          else
            # 409 when the run has already ended.
            echo "::warning::cancel of relay run ${run_id} not accepted (it may have ended already)"
          fi
          exit 0

      # Safety net for the read and cancel tokens: each step revokes its own
      # token on exit, but a cancel between a sign-in step and its next step
      # would leave that token alive. Empty values are skipped.
      - name: Revoke the read and cancel tokens
        if: ${{ always() }}
        shell: bash
        env:
          READ_TOKEN_1: ${{ steps.vault-read-1.outputs.token }}
          READ_TOKEN_2: ${{ steps.vault-read-2.outputs.token }}
          READ_TOKEN_3: ${{ steps.vault-read-3.outputs.token }}
          READ_TOKEN_4: ${{ steps.vault-read-4.outputs.token }}
          READ_TOKEN_5: ${{ steps.vault-read-5.outputs.token }}
          READ_TOKEN_6: ${{ steps.vault-read-6.outputs.token }}
          READ_TOKEN_7: ${{ steps.vault-read-7.outputs.token }}
          READ_TOKEN_8: ${{ steps.vault-read-8.outputs.token }}
          READ_TOKEN_9: ${{ steps.vault-read-9.outputs.token }}
          READ_TOKEN_10: ${{ steps.vault-read-10.outputs.token }}
          READ_TOKEN_11: ${{ steps.vault-read-11.outputs.token }}
          READ_TOKEN_12: ${{ steps.vault-read-12.outputs.token }}
          READ_TOKEN_13: ${{ steps.vault-read-13.outputs.token }}
          READ_TOKEN_14: ${{ steps.vault-read-14.outputs.token }}
          READ_TOKEN_15: ${{ steps.vault-read-15.outputs.token }}
          READ_TOKEN_16: ${{ steps.vault-read-16.outputs.token }}
          CANCEL_TOKEN: ${{ steps.vault-cancel.outputs.token }}
        run: |
          # shellcheck disable=SC1091
          . "$RUNNER_TEMP/relay-lib.sh" 2>/dev/null || exit 0
          for name in READ_TOKEN_1 READ_TOKEN_2 READ_TOKEN_3 READ_TOKEN_4 READ_TOKEN_5 READ_TOKEN_6 READ_TOKEN_7 READ_TOKEN_8 READ_TOKEN_9 READ_TOKEN_10 READ_TOKEN_11 READ_TOKEN_12 READ_TOKEN_13 READ_TOKEN_14 READ_TOKEN_15 READ_TOKEN_16 CANCEL_TOKEN; do
            [ -n "${!name:-}" ] || continue
            revoke_token "$name" "$name"
          done

      # The shared sign-in action does not leave the tailnet.
      - name: Leave the tailnet
        if: ${{ always() }}
        shell: bash
        run: |
          if command -v tailscale >/dev/null 2>&1; then
            sudo tailscale logout || { echo "::warning::tailscale logout failed; taking the interface down"; sudo tailscale down || true; }
          else
            echo "not on the tailnet"
          fi

name: Blaze Merge Gate

# Runs tt-blaze's ENTIRE merge gate (its ci.yaml) against the tt-metal build this
# release pipeline just produced, so a tt-metal change that breaks tt-blaze is
# caught while the release is being cut rather than by the next uplift.
#
# Scope is tt-blaze's whole gate -- unit + P150 + craq-sim + every gate-tier BH
# Loudbox bucket. With `selected-buckets` set it instead runs tt-blaze's
# bh-loudbox-intermittent.yaml for just those BH Loudbox buckets.
#
# tt-blaze cannot build tt-metal itself -- its CI consumes prebuilt tarball+wheel
# artifacts. So this workflow does NOT hand tt-blaze a branch to go resolve: it
# hands over `metal-run-id`, the id of the top-level run whose `build-artifact-profiler`
# job has already published the tarball and wheel for this exact commit. tt-blaze's
# download-build-artifact.yaml takes that run id verbatim and skips pin
# resolution entirely. `metal-ref` then moves tt-blaze's tt-metal submodule to the
# same commit, so JIT-compiled kernels and the linked libraries come from one
# tt-metal rather than two.
#
# `dev-image` is the dev container this run built for the same commit. tt-blaze
# JIT-compiles kernels with the SFPI in the container it runs in (not the tarball
# or wheel), so the gate must run in this commit's image, not vars.DEV_IMAGE.
#
#
# Auth: the default GITHUB_TOKEN is scoped to tt-metal and cannot dispatch
# tt-blaze, so this uses a GitHub App installed on tenstorrent/tt-blaze with
# Repository permissions `Actions: Read and write` (dispatch, poll, cancel) and
# `Metadata: Read` (mandatory for every App). Nothing else.
#   - vars.TT_BLAZE_APP_CLIENT_ID     the App's Client ID (not secret)
#   - secrets.TT_BLAZE_APP_PRIVATE_KEY the App's PEM private key
# Installation tokens live 1 hour and the wait below runs for up to 3, so the
# poll step mints its own tokens: proactively after 45 minutes, and again on
# any 401. Each token is narrowed to tt-blaze + actions:write at mint time.
#
# `gh workflow run` returns no run id, so the run is correlated by echoing a
# unique `dispatch-id` into tt-blaze's `run-name` and matching it back. That token
# is also tt-blaze's concurrency key, which is what keeps concurrent dispatches
# from cancelling each other's blaze run.

on:
  workflow_call:
    inputs:
      metal-run-id:
        description: >-
          Run id holding the tt-metal build artifacts tt-blaze should test
          against. Normally `github.run_id` -- artifacts belong to the TOP-LEVEL
          run, so that is the right value even from a nested reusable workflow.
        required: true
        type: string
      metal-ref:
        description: >-
          tt-metal commit those artifacts were built from. tt-blaze checks its
          tt-metal submodule out here. Must be a commit fetchable from
          tenstorrent/tt-metal for as long as the blaze run lasts.
        required: true
        type: string
      dev-image:
        description: >-
          Dev image for `metal-ref` (`build-artifact`'s `dev-docker-image` output,
          full ghcr ref). Empty = tt-blaze's repo-variable DEV_IMAGE.
        required: false
        type: string
      blaze-ref:
        description: "tt-blaze branch/tag/SHA to run the gate from."
        required: false
        type: string
        default: main
      wait-timeout-minutes:
        description: >-
          How long to wait for the tt-blaze run. Includes 1 hour of running the gate
          and 2 hours to find runners, though most cases should find runners within 30 min
          given blaze stats, especially at night. Internal timeouts make it fail fast on hangs.
        required: false
        type: number
        default: 180
      selected-buckets:
        description: >-
          Comma-separated tt-blaze BH Loudbox bucket ids. Empty (the default) runs
          tt-blaze's full merge gate (ci.yaml). Set, it runs tt-blaze's
          bh-loudbox-intermittent.yaml instead with run-all off, so only these
          buckets run. An unknown id fails the tt-blaze run.
        required: false
        type: string
        default: ""
    outputs:
      blaze-run-url:
        description: "URL of the tt-blaze run this gate waited on (empty if none was ever found)."
        value: ${{ jobs.blaze-ci.outputs.blaze-run-url }}
    secrets:
      TT_BLAZE_APP_PRIVATE_KEY:
        description: >-
          PEM private key of the GitHub App installed on tenstorrent/tt-blaze
          (Actions: Read and write). Its Client ID is vars.TT_BLAZE_APP_CLIENT_ID.
        required: true

permissions:
  contents: read

jobs:
  blaze-ci:
    name: ${{ inputs.selected-buckets == '' && 'tt-blaze CI (full merge gate)' || 'tt-blaze BH Loudbox Intermittent (selected buckets)' }}
    runs-on: ubuntu-latest
    # The 3-hour deadline plus slack: the poll loop must outlive its own deadline
    # so it can report WHY it gave up. If the runner killed it first, the failure
    # would read as an infra timeout instead of "no Loudbox came free".
    timeout-minutes: 195
    outputs:
      blaze-run-url: ${{ steps.dispatch.outputs.blaze-run-url }}
    env:
      BLAZE_REPO: tenstorrent/tt-blaze
      BLAZE_WORKFLOW: ${{ inputs.selected-buckets == '' && 'ci.yaml' || 'bh-loudbox-intermittent.yaml' }}
    steps:
      - name: Dispatch tt-blaze ${{ env.BLAZE_WORKFLOW }} and wait for it
        id: dispatch
        env:
          APP_CLIENT_ID: ${{ vars.TT_BLAZE_APP_CLIENT_ID }}
          APP_PRIVATE_KEY: ${{ secrets.TT_BLAZE_APP_PRIVATE_KEY }}
          METAL_RUN_ID: ${{ inputs.metal-run-id }}
          METAL_REF: ${{ inputs.metal-ref }}
          BLAZE_REF: ${{ inputs.blaze-ref }}
          DEV_IMAGE: ${{ inputs.dev-image }}
          SELECTED_BUCKETS: ${{ inputs.selected-buckets }}
          TIMEOUT_MINUTES: ${{ inputs.wait-timeout-minutes }}
        shell: bash
        run: |
          set -euo pipefail

          POLL_SECONDS=60
          # A dispatched run is not immediately visible to `gh run list`. Until this
          # is up, "no matching run" means "not indexed yet", not "dispatch failed".
          GRACE_SECONDS=300
          # Below this job's fixed 195-minute cap, with room for the loop to report
          # a timeout instead of the runner killing it mid-wait. Raising the
          # deadline past this means raising `timeout-minutes` above too.
          MAX_WAIT_MINUTES=180

          # `number` inputs are not integer inputs -- 1.5 reaches the arithmetic
          # below and fails there as a bare bash syntax error naming nothing.
          if [[ ! "${TIMEOUT_MINUTES:-}" =~ ^[0-9]+$ ]] || [ "$TIMEOUT_MINUTES" -lt 1 ]; then
            echo "::error::wait-timeout-minutes must be a positive whole number of minutes (got '${TIMEOUT_MINUTES:-}')."
            exit 1
          fi
          if [ "$TIMEOUT_MINUTES" -gt "$MAX_WAIT_MINUTES" ]; then
            echo "::error::wait-timeout-minutes=${TIMEOUT_MINUTES} exceeds ${MAX_WAIT_MINUTES}. This job's timeout-minutes caps it, so a longer deadline would be cut short by the runner instead of reported here -- raise timeout-minutes in this workflow alongside it."
            exit 1
          fi

          # Unique per run AND per re-run of that run, so a re-run never latches
          # onto the blaze run its previous attempt started.
          DISPATCH_ID="metal-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "dispatch-id: ${DISPATCH_ID}"

          # Scope: with no selected-buckets, tt-blaze's WHOLE merge gate. Its
          # `bh-loudbox-run-all` and `p150-run-all` selectors both default to
          # true, so passing only the plumbing inputs below is what asks for
          # every gate-tier bucket.
          # With selected-buckets, bh-loudbox-intermittent.yaml with run-all off:
          # its category toggles and warm-kernel-cache all default to false, so
          # only the listed buckets run.
          SCOPE_ARGS=()
          SCOPE="full merge gate"
          if [ -n "$SELECTED_BUCKETS" ]; then
            SCOPE_ARGS=(-f bh-loudbox-run-all=false -f bh-loudbox-selected-buckets="$SELECTED_BUCKETS")
            SCOPE="selected buckets: ${SELECTED_BUCKETS}"
          fi
          # ---- GitHub App token handling --------------------------------------
          # Installation tokens expire after 1 hour and this step can wait 3, so
          # tokens are minted here rather than by actions/create-github-app-token
          # (which mints once per step). ensure_token re-mints once a token is
          # REFRESH_AFTER_SECONDS old, and gh_auth re-mints and retries once if
          # GitHub answers 401 anyway (clock skew, revocation).
          REFRESH_AFTER_SECONDS=$(( 45 * 60 ))
          WORK_DIR=$(mktemp -d "${RUNNER_TEMP:-/tmp}/blaze-app.XXXXXX")
          chmod 700 "$WORK_DIR"
          APP_KEY_FILE="${WORK_DIR}/key.pem"
          APP_RESP_FILE="${WORK_DIR}/resp.json"
          GH_OUT_FILE="${WORK_DIR}/gh.out"
          GH_ERR_FILE="${WORK_DIR}/gh.err"
          GH_TOKEN=""
          GH_OUT=""
          TOKEN_MINTED_AT=0
          TOKEN_EXPIRES_AT=0
          APP_INSTALLATION_ID=""
          # Least privilege per token: only tt-blaze, only Actions.
          TOKEN_REQUEST=$(jq -nc --arg r "${BLAZE_REPO#*/}" \
            '{repositories: [$r], permissions: {actions: "write", metadata: "read"}}')

          cleanup() {
            # Best effort: a revoked token is useless if a log or the disk leaks it.
            if [ -n "${GH_TOKEN:-}" ]; then
              curl -sS -o /dev/null -X DELETE \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                "${GITHUB_API_URL}/installation/token" || true
            fi
            rm -rf "$WORK_DIR"
          }
          trap cleanup EXIT

          b64url() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }

          # A 9-minute RS256 JWT identifying the App (iat backdated 60s for skew).
          app_jwt() {
            local now header payload sig
            now=$(date +%s)
            header=$(printf '{"alg":"RS256","typ":"JWT"}' | b64url)
            payload=$(printf '{"iat":%d,"exp":%d,"iss":"%s"}' \
              $(( now - 60 )) $(( now + 540 )) "$APP_CLIENT_ID" | b64url)
            sig=$(printf '%s.%s' "$header" "$payload" \
              | openssl dgst -sha256 -sign "$APP_KEY_FILE" -binary | b64url) || return 1
            [ -n "$sig" ] || return 1
            printf '%s.%s.%s' "$header" "$payload" "$sig"
          }

          # app_api METHOD PATH [JSON]: call the API as the App itself.
          # Sets APP_HTTP (status, 000 on network failure) and APP_BODY.
          app_api() {
            local jwt
            APP_HTTP=000
            APP_BODY=""
            jwt=$(app_jwt) || return 1
            APP_HTTP=$(curl -sS -o "$APP_RESP_FILE" -w '%{http_code}' -X "$1" \
              -H "Authorization: Bearer ${jwt}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              ${3:+--data "$3"} \
              "${GITHUB_API_URL}$2") || APP_HTTP=000
            APP_BODY=$(cat "$APP_RESP_FILE" 2>/dev/null || true)
          }

          app_message() { jq -r '.message // empty' <<< "$APP_BODY" 2>/dev/null || true; }

          # Mint an installation token into GH_TOKEN (exported for gh).
          mint_token() {
            local token expires
            app_api POST "/app/installations/${APP_INSTALLATION_ID}/access_tokens" "$TOKEN_REQUEST" || return 1
            if [ "$APP_HTTP" != "201" ]; then
              echo "::warning::Minting a ${BLAZE_REPO} App token failed (HTTP ${APP_HTTP}): $(app_message)"
              return 1
            fi
            token=$(jq -r '.token // empty' <<< "$APP_BODY")
            expires=$(jq -r '.expires_at // empty' <<< "$APP_BODY")
            [ -n "$token" ] && [ -n "$expires" ] || return 1
            # Installation tokens are not repo secrets, so Actions does not mask them.
            echo "::add-mask::${token}"
            export GH_TOKEN="$token"
            TOKEN_MINTED_AT=$(date +%s)
            TOKEN_EXPIRES_AT=$(date -d "$expires" +%s)
            echo "Minted ${BLAZE_REPO} App token (expires ${expires})"
          }

          # Keep GH_TOKEN usable. Refreshes after 45 min (or within 5 min of
          # expiry); if a refresh fails while the old token is still good, keeps
          # it and tries again on the next call instead of failing the gate.
          ensure_token() {
            local now
            now=$(date +%s)
            if [ -n "$GH_TOKEN" ] \
              && [ "$now" -lt $(( TOKEN_MINTED_AT + REFRESH_AFTER_SECONDS )) ] \
              && [ "$now" -lt $(( TOKEN_EXPIRES_AT - 300 )) ]; then
              return 0
            fi
            mint_token && return 0
            if [ -n "$GH_TOKEN" ] && [ "$now" -lt $(( TOKEN_EXPIRES_AT - 60 )) ]; then
              echo "::warning::Could not refresh the ${BLAZE_REPO} App token; keeping the current one (valid until $(date -u -d "@${TOKEN_EXPIRES_AT}" +%H:%M:%SZ)) and retrying on the next call."
              return 0
            fi
            return 1
          }

          # gh_auth CMD...: run a gh command with a live token, re-minting and
          # retrying once on 401. Stdout lands in GH_OUT rather than on stdout,
          # because calling this inside $(...) would refresh GH_TOKEN in a
          # subshell and throw the new token away.
          gh_auth() {
            local rc=0
            GH_OUT=""
            ensure_token || { echo "::warning::No usable ${BLAZE_REPO} App token."; return 1; }
            "$@" > "$GH_OUT_FILE" 2> "$GH_ERR_FILE" || rc=$?
            if [ "$rc" -ne 0 ] && grep -qE 'HTTP 401|Bad credentials' "$GH_ERR_FILE"; then
              echo "GitHub rejected the App token (401); minting a fresh one and retrying once"
              mint_token || return 1
              rc=0
              "$@" > "$GH_OUT_FILE" 2> "$GH_ERR_FILE" || rc=$?
            fi
            GH_OUT=$(cat "$GH_OUT_FILE")
            [ "$rc" -eq 0 ] || cat "$GH_ERR_FILE" >&2
            return "$rc"
          }

          # ---- Preflight -------------------------------------------------------
          # tt-blaze is PRIVATE, and GitHub answers 404 (never 403) for anything a
          # token cannot see there, so `gh workflow run` reports a missing workflow
          # when the real fault is credentials. Each probe below isolates one
          # setup mistake so the log names the actual fix.
          if [ -z "${APP_CLIENT_ID:-}" ] || [ -z "${APP_PRIVATE_KEY:-}" ]; then
            echo "::error::The tt-blaze GitHub App is not configured in ${GITHUB_REPOSITORY}: set the repository/org variable TT_BLAZE_APP_CLIENT_ID (the App's Client ID) and the secret TT_BLAZE_APP_PRIVATE_KEY (its PEM private key), and make sure the caller passes the secret to this reusable workflow."
            echo "- ❌ tt-blaze — GitHub App credentials not configured" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          ( umask 077; printf '%s\n' "$APP_PRIVATE_KEY" > "$APP_KEY_FILE" )
          unset APP_PRIVATE_KEY

          # Probe 1: can we sign a JWT, and does GitHub accept it as this App?
          if ! app_jwt > /dev/null; then
            echo "::error::TT_BLAZE_APP_PRIVATE_KEY is not a usable RSA private key (openssl could not sign with it). Paste the full .pem the App generated, including the BEGIN/END lines."
            echo "- ❌ tt-blaze — App private key unreadable" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          app_api GET /app || true
          if [ "$APP_HTTP" != "200" ]; then
            echo "::error::GitHub rejected the App JWT (HTTP ${APP_HTTP}: $(app_message)). TT_BLAZE_APP_CLIENT_ID and TT_BLAZE_APP_PRIVATE_KEY do not belong to the same App, or the key was revoked in the App's settings."
            echo "- ❌ tt-blaze — App credentials rejected" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          # Not a secret; naming it turns "wrong App" into a one-line diagnosis.
          APP_SLUG=$(jq -r '.slug // "?"' <<< "$APP_BODY")
          echo "Authenticating as GitHub App: ${APP_SLUG}"

          # Probe 2: is the App installed with access to tt-blaze?
          app_api GET "/repos/${BLAZE_REPO}/installation" || true
          if [ "$APP_HTTP" != "200" ]; then
            echo "::error::GitHub App '${APP_SLUG}' is not installed on ${BLAZE_REPO} (HTTP ${APP_HTTP}: $(app_message)). Install it on the tenstorrent org and include ${BLAZE_REPO} in its repository selection."
            echo "- ❌ tt-blaze — App '${APP_SLUG}' not installed on ${BLAZE_REPO}" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          APP_INSTALLATION_ID=$(jq -r '.id' <<< "$APP_BODY")
          if [ "$(jq -r '.permissions.actions // "none"' <<< "$APP_BODY")" != "write" ]; then
            echo "::error::GitHub App '${APP_SLUG}' is installed on ${BLAZE_REPO} but its installation grants Actions: '$(jq -r '.permissions.actions // "none"' <<< "$APP_BODY")', not 'write'. Give the App 'Actions: Read and write' and have an org owner accept the updated permissions on the installation."
            echo "- ❌ tt-blaze — App '${APP_SLUG}' lacks Actions: write" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          # Probe 3: mint the first token.
          if ! mint_token; then
            echo "::error::GitHub App '${APP_SLUG}' could not mint an installation token for ${BLAZE_REPO} (HTTP ${APP_HTTP}: $(app_message))."
            echo "- ❌ tt-blaze — App token mint failed" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          # Probe 4: can the token see the workflow file?
          if ! gh_auth gh api "repos/${BLAZE_REPO}/actions/workflows/${BLAZE_WORKFLOW}" --jq .id; then
            echo "::error::App '${APP_SLUG}' has a token for ${BLAZE_REPO} but cannot read ${BLAZE_WORKFLOW}. Either ${BLAZE_WORKFLOW} does not exist on ${BLAZE_REPO}'s default branch, or the token lacks Actions access."
            echo "- ❌ tt-blaze — cannot read ${BLAZE_WORKFLOW}" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          # Dispatching needs actions:WRITE, which the read probe does not prove.
          if ! gh_auth gh workflow run "$BLAZE_WORKFLOW" \
            --repo "$BLAZE_REPO" \
            --ref "$BLAZE_REF" \
            -f metal-run-id="$METAL_RUN_ID" \
            -f metal-ref="$METAL_REF" \
            -f dispatch-id="$DISPATCH_ID" \
            -f dev-image="$DEV_IMAGE" \
            "${SCOPE_ARGS[@]}"; then
            echo "::error::Dispatch of ${BLAZE_WORKFLOW} on ${BLAZE_REPO}@${BLAZE_REF} failed. The token can read the workflow (checked above), so the usual causes are: no actions:write on ${BLAZE_REPO}; ${BLAZE_REF} does not carry every input passed here (an input this workflow sends but ${BLAZE_REF}'s ${BLAZE_WORKFLOW} does not declare is rejected outright -- the tt-blaze side must land FIRST); or ${BLAZE_REF} does not exist."
            echo "- ❌ tt-blaze — dispatch rejected" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "Dispatched ${BLAZE_REPO} ${BLAZE_WORKFLOW} on ${BLAZE_REF} (${SCOPE})"
          echo "  tt-metal commit:  ${METAL_REF}"
          echo "  tt-metal build:   https://github.com/${GITHUB_REPOSITORY}/actions/runs/${METAL_RUN_ID}"

          started=$(date +%s)
          deadline=$(( started + TIMEOUT_MINUTES * 60 ))
          run_id=""
          run_url=""

          while :; do
            elapsed=$(( $(date +%s) - started ))

            if [ -z "$run_id" ]; then
              # Correlate on the token echoed into tt-blaze's run-name. Matching on
              # "newest dispatch" instead would be wrong: the release pipeline is
              # dispatched on a schedule AND by hand, so two runs can be dispatching
              # onto the same ref at once.
              #
              # `displayTitle` is where a computed `run-name` lands; `name` is the
              # workflow's own name. Both are searched so this keeps working if gh
              # ever changes which one carries it.
              gh_auth gh run list --repo "$BLAZE_REPO" --workflow "$BLAZE_WORKFLOW" \
                --event workflow_dispatch --limit 100 \
                --json databaseId,displayTitle,name \
                --jq "[.[] | select(((.displayTitle // \"\") + \" \" + (.name // \"\")) | contains(\"${DISPATCH_ID}\"))] | .[0].databaseId // empty" \
                2>/dev/null || true
              run_id="$GH_OUT"

              if [ -z "$run_id" ]; then
                if [ "$elapsed" -gt "$GRACE_SECONDS" ]; then
                  echo "::error::Dispatched ${BLAZE_REPO} ${BLAZE_WORKFLOW} but no run carrying '${DISPATCH_ID}' appeared within ${elapsed}s. Most likely ${BLAZE_REF} does not echo dispatch-id into run-name (the tt-blaze side of this plumbing is missing or older than this workflow)."
                  echo "- ❌ tt-blaze — dispatched run never appeared" >> "$GITHUB_STEP_SUMMARY"
                  exit 1
                fi
                echo "waiting for the dispatched run to be indexed (${elapsed}s)"
                sleep "$POLL_SECONDS"
                continue
              fi

              run_url="https://github.com/${BLAZE_REPO}/actions/runs/${run_id}"
              echo "tt-blaze run: ${run_url}"
              echo "blaze-run-url=${run_url}" >> "$GITHUB_OUTPUT"
              # Read by the cancel step below, which runs only if THIS job is
              # cancelled and so cannot rely on any of the locals here.
              echo "BLAZE_RUN_ID=${run_id}" >> "$GITHUB_ENV"
              echo "- ⏳ tt-blaze — [run ${run_id}](${run_url})" >> "$GITHUB_STEP_SUMMARY"
            fi

            # A failed poll (network blip, token trouble) is not a verdict: note
            # it and fall through to the deadline check rather than exiting.
            if gh_auth gh run view "$run_id" --repo "$BLAZE_REPO" \
                 --json status,conclusion \
                 --jq '"\(.status) \(.conclusion // "-")"'; then
              read -r status conclusion <<< "$GH_OUT"
            else
              echo "::warning::Polling tt-blaze run ${run_id} failed; retrying in ${POLL_SECONDS}s"
              status="unknown"
              conclusion="-"
            fi

            if [ "$status" = "completed" ]; then
              case "$conclusion" in
                success)
                  echo "✅ tt-blaze CI passed: ${run_url}"
                  echo "- ✅ tt-blaze — [run ${run_id}](${run_url})" >> "$GITHUB_STEP_SUMMARY"
                  exit 0
                  ;;
                skipped)
                  echo "::error::tt-blaze CI was skipped, so the required merge-gate validation did not run. ${run_url}"
                  echo "- ❌ tt-blaze — skipped; no validation ran ([run ${run_id}](${run_url}))" >> "$GITHUB_STEP_SUMMARY"
                  exit 1
                  ;;
                *)
                  echo "::error::tt-blaze CI concluded '${conclusion}' — this tt-metal change breaks tt-blaze, or the blaze run itself is broken. ${run_url}"
                  echo "- ❌ tt-blaze — \`${conclusion}\` ([run ${run_id}](${run_url}))" >> "$GITHUB_STEP_SUMMARY"
                  exit 1
                  ;;
              esac
            fi

            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::Timed out after ${TIMEOUT_MINUTES} min with the tt-blaze run still '${status}'. Raise wait-timeout-minutes or check runner availability. ${run_url}"
              echo "- ⏱️ tt-blaze — timed out after ${TIMEOUT_MINUTES} min ([run ${run_id}](${run_url}))" >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi

            echo "tt-blaze run ${run_id}: ${status} (${elapsed}s elapsed)"
            sleep "$POLL_SECONDS"
          done

      # Cancelling this run (or the release pipeline around it) stops this job but
      # not the run it started, which would otherwise keep occupying constrained
      # P150/Loudbox runners for hours on behalf of a release nobody is cutting.
      #
      # failure() is here for the TIMEOUT path specifically: giving up on the wait
      # exits 1, which is not cancelled(), so without this a timed-out gate leaves
      # the blaze run holding those runners with nobody watching it anymore.
      #
      # A fresh token is minted here: the poll step's token may be near its
      # 1-hour expiry or already revoked by that step's cleanup.
      - name: Mint a tt-blaze App token for cancellation
        id: cancel-token
        if: (cancelled() || failure()) && env.BLAZE_RUN_ID != ''
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.TT_BLAZE_APP_CLIENT_ID }}
          private-key: ${{ secrets.TT_BLAZE_APP_PRIVATE_KEY }}
          owner: tenstorrent
          repositories: tt-blaze
          permission-actions: write

      - name: Cancel the tt-blaze run if this job was cancelled or timed out
        if: (cancelled() || failure()) && env.BLAZE_RUN_ID != '' && steps.cancel-token.outputs.token != ''
        env:
          GH_TOKEN: ${{ steps.cancel-token.outputs.token }}
        shell: bash
        run: |
          echo "Cancelling tt-blaze run ${BLAZE_RUN_ID}"
          gh run cancel "$BLAZE_RUN_ID" --repo "$BLAZE_REPO" || true

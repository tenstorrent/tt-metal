name: Blaze Merge Gate

# Runs tt-blaze's gpt-oss-temporal-multiuser BH Loudbox bucket against the
# tt-metal commit under test, so a tt-metal change that breaks tt-blaze is
# caught before it lands rather than by the next uplift.
#
# Scope is deliberately ONE bucket, not tt-blaze's whole merge gate: this job
# blocks tt-metal's merge queue while it waits, and tt-blaze's full silicon
# matrix (unit + P150 + craq-sim + every Loudbox bucket) would hold the queue for
# hours on a runner pool it does not own. The dispatch step below is where that
# scope is set.
#
# tt-blaze cannot build tt-metal itself -- its CI consumes prebuilt tarball+wheel
# artifacts. So this workflow does NOT hand tt-blaze a branch to go resolve: it
# hands over `metal-run-id`, the id of the caller's own run, whose `build` job has
# already published the tarball and wheel for this exact commit. tt-blaze's
# download-build-artifact.yaml takes that run id verbatim and skips pin
# resolution entirely. `metal-ref` then moves tt-blaze's tt-metal submodule to the
# same commit, so JIT-compiled kernels and the linked libraries come from one
# tt-metal rather than two.
#
# The caller's build is tracy=false, so the dispatch also runs tt-blaze against
# the plain variant (its pin-driven runs are profiler-only). Blaze tests that
# need tracy at runtime cannot run here.
#
# Auth: dispatching and polling a workflow in another repo needs a PAT with
# `actions: write` (dispatch, cancel) and `actions: read` (poll) on
# tenstorrent/tt-blaze, stored in THIS repo as the `TT_BLAZE_PAT` secret. The
# default GITHUB_TOKEN is scoped to tt-metal and cannot dispatch tt-blaze.
#
# `gh workflow run` returns no run id, so the run is correlated by echoing a
# unique `dispatch-id` into tt-blaze's `run-name` and matching it back. That token
# is also tt-blaze's concurrency key, which is what keeps concurrent merge-gate
# runs from cancelling each other's blaze run.
#
# Runs on Priority Loudboxes inside of blaze merge gate, priority loudboxes are only
# Used in the two merge gates

on:
  workflow_call:
    inputs:
      metal-run-id:
        description: >-
          Run id holding the tt-metal build artifacts tt-blaze should test
          against. Normally the caller's own `github.run_id`.
        required: true
        type: string
      metal-ref:
        description: >-
          tt-metal commit those artifacts were built from. tt-blaze checks its
          tt-metal submodule out here. Must be a commit fetchable from
          tenstorrent/tt-metal for as long as the blaze run lasts.
        required: true
        type: string
      blaze-ref:
        description: "tt-blaze branch/tag/SHA to run the gate from."
        required: false
        type: string
        default: main
      wait-timeout-minutes:
        description: >-
          How long to wait for the tt-blaze run. The bucket itself is bounded by
          tt-blaze's own per-bucket budget; the bulk of this is queue time for a
          free BH Loudbox.
        required: false
        type: number
        default: 180
    outputs:
      blaze-run-url:
        description: "URL of the tt-blaze run this gate waited on (empty if none was ever found)."
        value: ${{ jobs.blaze-ci.outputs.blaze-run-url }}
    secrets:
      TT_BLAZE_PAT:
        description: "PAT with actions:read+write on tenstorrent/tt-blaze."
        required: true


permissions: {}

jobs:
  blaze-ci:
    name: tt-blaze CI (gpt-oss temporal multiuser Loudbox bucket)
    runs-on: ubuntu-slim
    # Long timeout to accommodate waiting for the loudbox to become available
    timeout-minutes: 360
    outputs:
      blaze-run-url: ${{ steps.dispatch.outputs.blaze-run-url }}
    env:
      BLAZE_REPO: tenstorrent/tt-blaze
      BLAZE_WORKFLOW: ci.yaml
      # tt-blaze's bucket id for the leg this gate requires. Distinct from the
      # `bh-loudbox-gptoss-temporal` dispatch input below, which is the boolean
      # that SELECTS this bucket -- the two are separate names on the tt-blaze
      # side and must be changed together. Used by the post-run assertion to
      # prove the bucket actually ran; see the `success` case in the poll loop.
      BLAZE_BUCKET: gpt-oss-temporal-multiuser
    steps:
      - name: Dispatch tt-blaze ci.yaml and wait for it
        id: dispatch
        env:
          GH_TOKEN: ${{ secrets.TT_BLAZE_PAT }}
          METAL_RUN_ID: ${{ inputs.metal-run-id }}
          METAL_REF: ${{ inputs.metal-ref }}
          BLAZE_REF: ${{ inputs.blaze-ref }}
          TIMEOUT_MINUTES: ${{ inputs.wait-timeout-minutes }}
        shell: bash
        run: |
          set -euo pipefail

          POLL_SECONDS=60
          # A dispatched run is not immediately visible to `gh run list`. Until this
          # is up, "no matching run" means "not indexed yet", not "dispatch failed".
          GRACE_SECONDS=300
          # Below this job's fixed 360-minute cap, with room for the loop to report
          # a timeout instead of the runner killing it mid-wait.
          MAX_WAIT_MINUTES=345

          # `number` inputs are not integer inputs -- 1.5 reaches the arithmetic
          # below and fails there as a bare bash syntax error naming nothing.
          if [[ ! "${TIMEOUT_MINUTES:-}" =~ ^[0-9]+$ ]] || [ "$TIMEOUT_MINUTES" -lt 1 ]; then
            echo "::error::wait-timeout-minutes must be a positive whole number of minutes (got '${TIMEOUT_MINUTES:-}')."
            exit 1
          fi
          if [ "$TIMEOUT_MINUTES" -gt "$MAX_WAIT_MINUTES" ]; then
            echo "::error::wait-timeout-minutes=${TIMEOUT_MINUTES} exceeds ${MAX_WAIT_MINUTES}. This job is capped at 360 min by GitHub, so a longer deadline would be cut short by the runner instead of reported here."
            exit 1
          fi

          # Unique per run AND per re-run of that run, so a re-run never latches
          # onto the blaze run its previous attempt started.
          DISPATCH_ID="metal-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "dispatch-id: ${DISPATCH_ID}"

          # Persisted BEFORE the dispatch, not after the poll loop resolves a run
          # id. A cancellation landing between `gh workflow run` and the run
          # becoming visible to `gh run list` -- up to GRACE_SECONDS, the window
          # this loop explicitly tolerates -- would otherwise leave the cleanup
          # step with no id and let a live blaze run keep a Loudbox for a merge
          # group that no longer exists. With the token persisted first, cleanup
          # can find the run by correlation even though this step never did.
          # Written before dispatch rather than after so a cancellation DURING
          # the dispatch call is covered too: the run may or may not have been
          # created, and searching for it is the only way to tell.
          echo "BLAZE_DISPATCH_ID=${DISPATCH_ID}" >> "$GITHUB_ENV"

          # Scope: the gpt-oss-temporal-multiuser Loudbox bucket only, NOT
          # tt-blaze's whole merge gate. `bh-loudbox-run-all=false` flips
          # tt-blaze's Loudbox job from "every gate bucket" to "the ones selected
          # below", and `bh-loudbox-gptoss-temporal` selects exactly that one
          # bucket on that side. (Its sibling `bh-loudbox-gptoss` is the wider
          # selection -- gptoss + gpt-oss-temporal-multiuser -- and is
          # deliberately NOT used here: the global-layer and teacher-forced
          # e2e top-k legs roughly double the time this job holds tt-metal's
          # merge queue for coverage the temporal run already exercises.)
          # tt-blaze skips its unit / P150 / craq-sim jobs on its own whenever
          # metal-run-id is set. To widen the scope, add the sibling
          # `bh-loudbox-*` / `p150-*` booleans from tt-blaze's ci.yaml here (its
          # job guards need widening too).
          if ! gh workflow run "$BLAZE_WORKFLOW" \
            --repo "$BLAZE_REPO" \
            --ref "$BLAZE_REF" \
            -f metal-run-id="$METAL_RUN_ID" \
            -f metal-ref="$METAL_REF" \
            -f dispatch-id="$DISPATCH_ID" \
            -f bh-loudbox-run-all=false \
            -f bh-loudbox-gptoss-temporal=true; then
            echo "::error::Dispatch of ${BLAZE_WORKFLOW} on ${BLAZE_REPO}@${BLAZE_REF} failed. Usual causes: ${BLAZE_REF} does not carry every input passed here (an input this workflow sends but ${BLAZE_REF}'s ci.yaml does not declare is rejected outright -- the tt-blaze side must land FIRST); ${BLAZE_REF} does not exist; or TT_BLAZE_PAT has lapsed or lost access. Note ${BLAZE_REPO} is PRIVATE, so GitHub answers 404 rather than 403 for anything the token is not entitled to -- a token fault therefore surfaces here as a missing-workflow error, not a permission one."
            echo "- ❌ tt-blaze — dispatch rejected" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          # Lets cleanup distinguish "a run is out there" from "the dispatch was
          # rejected, so finding nothing is expected" -- the difference between
          # a warning worth acting on and pure noise on an already-reported
          # failure.
          echo "BLAZE_DISPATCHED=1" >> "$GITHUB_ENV"

          echo "Dispatched ${BLAZE_REPO} ${BLAZE_WORKFLOW} on ${BLAZE_REF} (gpt-oss-temporal-multiuser bucket)"
          echo "  tt-metal commit:  ${METAL_REF}"
          echo "  tt-metal build:   https://github.com/${GITHUB_REPOSITORY}/actions/runs/${METAL_RUN_ID}"

          started=$(date +%s)
          deadline=$(( started + TIMEOUT_MINUTES * 60 ))
          run_id=""
          run_url=""

          while :; do
            elapsed=$(( $(date +%s) - started ))

            if [ -z "$run_id" ]; then
              # Correlate on the token echoed into tt-blaze's run-name. Matching on
              # "newest dispatch" instead would be wrong: several tt-metal
              # merge-gate runs dispatch onto the same ref at once.
              #
              # `displayTitle` is where a computed `run-name` lands; `name` is the
              # workflow's own name. Both are searched so this keeps working if gh
              # ever changes which one carries it.
              run_id=$(gh run list --repo "$BLAZE_REPO" --workflow "$BLAZE_WORKFLOW" \
                         --event workflow_dispatch --limit 100 \
                         --json databaseId,displayTitle,name \
                         --jq "[.[] | select(((.displayTitle // \"\") + \" \" + (.name // \"\")) | contains(\"${DISPATCH_ID}\"))] | .[0].databaseId // empty" \
                       2>/dev/null || echo "")

              if [ -z "$run_id" ]; then
                if [ "$elapsed" -gt "$GRACE_SECONDS" ]; then
                  echo "::error::Dispatched ${BLAZE_REPO} ${BLAZE_WORKFLOW} but no run carrying '${DISPATCH_ID}' appeared within ${elapsed}s. Most likely ${BLAZE_REF} does not echo dispatch-id into run-name (the tt-blaze side of this plumbing is missing or older than this workflow)."
                  echo "- ❌ tt-blaze — dispatched run never appeared" >> "$GITHUB_STEP_SUMMARY"
                  exit 1
                fi
                echo "waiting for the dispatched run to be indexed (${elapsed}s)"
                sleep "$POLL_SECONDS"
                continue
              fi

              run_url="https://github.com/${BLAZE_REPO}/actions/runs/${run_id}"
              echo "tt-blaze run: ${run_url}"
              echo "blaze-run-url=${run_url}" >> "$GITHUB_OUTPUT"
              # Read by the cancel step below, which runs only if THIS job is
              # cancelled and so cannot rely on any of the locals here.
              echo "BLAZE_RUN_ID=${run_id}" >> "$GITHUB_ENV"
              echo "- ⏳ tt-blaze — [run ${run_id}](${run_url})" >> "$GITHUB_STEP_SUMMARY"
            fi

            read -r status conclusion <<< "$(gh run view "$run_id" --repo "$BLAZE_REPO" \
                                               --json status,conclusion \
                                               --jq '"\(.status) \(.conclusion // "-")"')"

            if [ "$status" = "completed" ]; then
              case "$conclusion" in
                success)
                  # A green run does NOT prove the bucket ran. If tt-blaze's
                  # selected-buckets resolves to nothing, its select-buckets job
                  # sets has-buckets=false, the Loudbox matrix job is skipped,
                  # and tt-blaze's own workflow-status lists that job as
                  # OPTIONAL -- so the run still concludes success. Taking that
                  # at face value would leave this gate permanently green and
                  # permanently empty after any bucket rename or wiring drift on
                  # the tt-blaze side. Assert the leg exists and passed.
                  #
                  # Substring match: the leg's full name is composed by the
                  # caller and the reusable workflow (eg.
                  # "silicon-tests-bh-loudbox / Silicon Tests (Blackhole Loudbox)
                  # / ${BLAZE_BUCKET}"), so only the bucket id is stable here.
                  bucket_jobs=$(gh run view "$run_id" --repo "$BLAZE_REPO" --json jobs \
                                  --jq "[.jobs[] | select((.name // \"\") | contains(\"${BLAZE_BUCKET}\"))] | length" \
                                2>/dev/null || echo "")
                  bucket_passed=$(gh run view "$run_id" --repo "$BLAZE_REPO" --json jobs \
                                    --jq "[.jobs[] | select(((.name // \"\") | contains(\"${BLAZE_BUCKET}\")) and .conclusion == \"success\")] | length" \
                                  2>/dev/null || echo "")

                  # An unreadable jobs list is not proof of anything; fail rather
                  # than infer coverage from a query that did not answer.
                  if [ -z "$bucket_jobs" ] || [ -z "$bucket_passed" ]; then
                    echo "::error::tt-blaze run ${run_id} concluded success but its job list could not be read, so this gate cannot confirm '${BLAZE_BUCKET}' ran. ${run_url}"
                    echo "- ❌ tt-blaze — could not verify \`${BLAZE_BUCKET}\` ran ([run ${run_id}](${run_url}))" >> "$GITHUB_STEP_SUMMARY"
                    exit 1
                  fi
                  if [ "$bucket_jobs" -eq 0 ]; then
                    echo "::error::tt-blaze run ${run_id} is green but ran NO job for bucket '${BLAZE_BUCKET}' -- this gate proved nothing. The bucket selection drifted: either ${BLAZE_REF}'s ci.yaml no longer maps bh-loudbox-gptoss-temporal onto that bucket, or the bucket was renamed in its silicon-tests-bh-loudbox-impl.yaml catalog. Realign BLAZE_BUCKET here with the tt-blaze side. ${run_url}"
                    echo "- ❌ tt-blaze — \`${BLAZE_BUCKET}\` never ran ([run ${run_id}](${run_url}))" >> "$GITHUB_STEP_SUMMARY"
                    exit 1
                  fi
                  if [ "$bucket_passed" -eq 0 ]; then
                    echo "::error::tt-blaze run ${run_id} is green overall but its '${BLAZE_BUCKET}' leg did not pass (skipped or cancelled). ${run_url}"
                    echo "- ❌ tt-blaze — \`${BLAZE_BUCKET}\` did not pass ([run ${run_id}](${run_url}))" >> "$GITHUB_STEP_SUMMARY"
                    exit 1
                  fi

                  echo "✅ tt-blaze CI passed (${BLAZE_BUCKET} ran): ${run_url}"
                  echo "- ✅ tt-blaze — [run ${run_id}](${run_url})" >> "$GITHUB_STEP_SUMMARY"
                  exit 0
                  ;;
                skipped)
                  # Unreachable from this dispatch -- check-skip runs on any
                  # workflow_dispatch, so at least one job always runs and the
                  # conclusion is success or failure, never skipped. Kept as a
                  # FAILURE rather than removed: if tt-blaze ever guards that job
                  # off too, "nothing ran" must not read as "the gate passed".
                  echo "::error::tt-blaze CI concluded 'skipped' -- no job ran, so this gate verified nothing. ${run_url}"
                  echo "- ❌ tt-blaze — skipped, nothing verified ([run ${run_id}](${run_url}))" >> "$GITHUB_STEP_SUMMARY"
                  exit 1
                  ;;
                *)
                  echo "::error::tt-blaze CI concluded '${conclusion}' — this tt-metal change breaks tt-blaze, or the blaze run itself is broken. ${run_url}"
                  echo "- ❌ tt-blaze — \`${conclusion}\` ([run ${run_id}](${run_url}))" >> "$GITHUB_STEP_SUMMARY"
                  exit 1
                  ;;
              esac
            fi

            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::Timed out after ${TIMEOUT_MINUTES} min with the tt-blaze run still '${status}'. Raise wait-timeout-minutes or check runner availability. ${run_url}"
              echo "- ⏱️ tt-blaze — timed out after ${TIMEOUT_MINUTES} min ([run ${run_id}](${run_url}))" >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi

            echo "tt-blaze run ${run_id}: ${status} (${elapsed}s elapsed)"
            sleep "$POLL_SECONDS"
          done

      # Dequeuing a PR cancels this job but not the run it started, which would
      # otherwise keep occupying constrained P150/Loudbox runners for hours on
      # behalf of a merge group that no longer exists.
      #
      # Gated on the DISPATCH ID, not the run id: the run id only exists once
      # the poll loop has seen the run, so gating on it would skip cleanup for
      # exactly the cancellations that happen during the indexing window.
      #
      # failure() as well as cancelled(): the wait-timeout path exits 1, which
      # is a failure and not a cancellation, and at that moment the blaze run is
      # by definition STILL RUNNING -- the timeout is what proves it. Leaving it
      # alive is the same Loudbox leak dequeuing causes. The other failure paths
      # (dispatch rejected, blaze concluded red, bucket assertion) are harmless
      # here: the status check below turns them into no-ops.
      - name: Cancel the tt-blaze run if this job did not finish cleanly
        if: (cancelled() || failure()) && env.BLAZE_DISPATCH_ID != ''
        env:
          GH_TOKEN: ${{ secrets.TT_BLAZE_PAT }}
        shell: bash
        run: |
          set -uo pipefail

          # A cancelled job is not given unlimited time to wind down, so this is
          # deliberately short: ~2 min of retries, well inside the runner's
          # post-cancellation grace. It does not need to cover the full
          # GRACE_SECONDS indexing window of the main loop -- most cancellations
          # resolve on the first attempt, and a bounded best effort beats the
          # previous unconditional skip.
          RETRIES=8
          RETRY_SLEEP=15

          # If the dispatch never reported success there is most likely nothing
          # to find, so do not spend the full budget proving it -- but still
          # look, because a cancellation that killed `gh workflow run` mid-call
          # leaves the same unset flag and MAY have created a run.
          [ "${BLAZE_DISPATCHED:-}" = "1" ] || RETRIES=2

          run_id="${BLAZE_RUN_ID:-}"

          if [ -z "$run_id" ]; then
            # Cancelled before the poll loop resolved an id. The dispatch may or
            # may not have created a run; correlating on the token is the only
            # way to find out, and finding nothing is a legitimate outcome.
            echo "No run id recorded yet; searching ${BLAZE_REPO} for a run carrying '${BLAZE_DISPATCH_ID}'"
            for attempt in $(seq 1 "$RETRIES"); do
              run_id=$(gh run list --repo "$BLAZE_REPO" --workflow "$BLAZE_WORKFLOW" \
                         --event workflow_dispatch --limit 100 \
                         --json databaseId,displayTitle,name \
                         --jq "[.[] | select(((.displayTitle // \"\") + \" \" + (.name // \"\")) | contains(\"${BLAZE_DISPATCH_ID}\"))] | .[0].databaseId // empty" \
                       2>/dev/null || echo "")
              [ -n "$run_id" ] && break
              echo "  attempt ${attempt}/${RETRIES}: not indexed yet"
              [ "$attempt" -lt "$RETRIES" ] && sleep "$RETRY_SLEEP"
            done
          fi

          if [ -z "$run_id" ]; then
            if [ "${BLAZE_DISPATCHED:-}" = "1" ]; then
              # The dispatch landed, so a run almost certainly exists and is
              # simply not indexed yet. It may be holding a Loudbox, and nothing
              # further here can reach it.
              echo "::warning::No tt-blaze run carrying '${BLAZE_DISPATCH_ID}' became visible before this step had to give up. The dispatch did land, so that run is likely still going and must be cancelled manually: https://github.com/${BLAZE_REPO}/actions/workflows/${BLAZE_WORKFLOW}"
            else
              # The dispatch was rejected (or never got that far), so there is
              # nothing to leak. Do not raise a warning on top of the error the
              # dispatch step already reported.
              echo "Dispatch never landed, so no tt-blaze run exists to cancel."
            fi
            exit 0
          fi

          # Only a run that is still alive needs cancelling. On the timeout path
          # it will be, which is the whole point; on the "blaze concluded red"
          # and bucket-assertion paths it is already finished, and cancelling a
          # completed run is a pointless API call that reads in the log like
          # something went wrong.
          status=$(gh run view "$run_id" --repo "$BLAZE_REPO" --json status --jq .status 2>/dev/null || echo "")
          if [ "$status" = "completed" ]; then
            echo "tt-blaze run ${run_id} already finished; nothing to cancel."
            exit 0
          fi

          # An unreadable status is not proof it finished -- try the cancel.
          echo "Cancelling tt-blaze run ${run_id} (status: ${status:-unknown})"
          gh run cancel "$run_id" --repo "$BLAZE_REPO" || true

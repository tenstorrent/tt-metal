name: "[post-commit] LLK tooling - unit tests"

# Hermetic Python unit tests for the LLK static-analysis tooling: the llk-audit
# recall tool's checkers and the pre-commit checkers under infra/. No clang,
# hardware, or repo build needed — the tests run each checker over synthetic
# fact bases. Path-filtered so it only runs when that tooling changes.

on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    branches:
      - "main"
    paths:
      - "tt_metal/tt-llk/.claude/tools/llk-audit/**"
      - "tt_metal/tt-llk/infra/**"
      - ".github/workflows/llk-audit-tool-tests.yaml"

permissions:
  contents: read

jobs:
  llk-tooling-unit-tests:
    name: Run LLK tooling unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        timeout-minutes: 10
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
      - name: Run llk-audit unit tests
        working-directory: tt_metal/tt-llk/.claude/tools/llk-audit
        run: python3 tests/test_checks.py
      - name: Install pytest
        run: python3 -m pip install --no-cache-dir pytest
      - name: Run infra checker unit tests
        working-directory: tt_metal/tt-llk/infra
        # --noconftest: the repo-root conftest imports models/, which is not built here.
        run: python3 -m pytest tests -q --noconftest

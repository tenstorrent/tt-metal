name: "LLK ttsim PR gate impl"

# Quasar half of tests/pipeline_reorg/llk_pr_gate_tests.yaml. Wormhole and Blackhole
# shards stay on silicon in llk-smoke-impl.yaml; this workflow runs the sim_quasar_xl
# shards against ttsim. run_ttsim_regression.sh applies tests/pipeline_reorg/ttsim-skip-list.yaml
# unless the cmd passes --no-ignore. The shard cmds pass --no-html; JUnit XML is
# still uploaded. A shard failure fails the job.

on:
  workflow_call:
    inputs:
      docker-image:
        description: "The LLK Docker image to use"
        required: true
        type: string
      ref:
        required: false
        type: string
        default: ""
        description: "Commit SHA to test. Empty means github.sha."

permissions:
  actions: read
  checks: write
  contents: read

env:
  LLK_PATH: tt_metal/tt-llk

jobs:
  load-test-matrix:
    runs-on: ubuntu-slim
    outputs:
      matrix: ${{ steps.build-matrix.outputs.matrix }}
      sim-libs: ${{ steps.build-matrix.outputs.sim-libs }}
      split-durations: ${{ steps.durations.outputs.found }}
    env:
      TESTS_YAML_PATH: ./tests/pipeline_reorg/llk_pr_gate_tests.yaml
    steps:
      - name: Checkout the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2 cachew: keep
        timeout-minutes: 20
        with:
          ref: ${{ inputs.ref || github.sha }}
          sparse-checkout: |
            .github
            tests/pipeline_reorg
          sparse-checkout-cone-mode: true
      - name: Install dependencies
        run: pip3 install PyYAML
      # Matrix script from upstream main, not this branch (#57555, #57579);
      # keep after the checkout above, whose clean would delete this.
      - name: Checkout CI actions from main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        timeout-minutes: 20
        with:
          repository: tenstorrent/tt-metal  # github.repository would be the fork
          ref: main
          path: ci-main
          sparse-checkout: |
            .github/actions
            .github/scripts
          sparse-checkout-cone-mode: true

      - name: Build test matrix
        id: build-matrix
        uses: ./ci-main/.github/actions/prepare-test-matrix
        with:
          tests-yaml: ${{ env.TESTS_YAML_PATH }}
          enabled-skus: sim_quasar_xl
          sku-config: ./.github/sku_config.yaml
          event: ${{ github.event_name }}

      # pytest-split (--splits) cuts by test count unless it finds .test_durations. Take
      # them from the newest green push run on main, once here, so every leg cuts the
      # same list. On any failure the legs cut by test count, as before.
      - name: Fetch test durations from main
        id: durations
        continue-on-error: true
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for run in $(gh run list -w pr-gate.yaml -b main -e push -s success -L 5 --json databaseId --jq '.[].databaseId'); do
            gh run download "$run" -p 'test-durations-*' -D durations && break
          done
          python3 - << 'PY'
          import json
          import os
          from pathlib import Path

          Path("split-durations").mkdir()
          found = False
          for arch in ("quasar",):
              merged = {}
              for leg in sorted(Path("durations").glob(f"test-durations-{arch}-*/.test_durations")):
                  merged.update(json.loads(leg.read_text()))
              print(f"{arch}: durations for {len(merged)} tests")
              if merged:
                  Path(f"split-durations/{arch}.json").write_text(json.dumps(merged))
                  found = True
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"found={str(found).lower()}\n")
          PY
      - name: Upload test durations for the legs
        if: steps.durations.outputs.found == 'true'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: split-durations
          path: split-durations

  fetch-ttsim:
    needs: load-test-matrix
    if: ${{ needs.load-test-matrix.outputs.sim-libs != '[]' }}
    runs-on: ubuntu-slim
    strategy:
      fail-fast: false
      matrix:
        lib: ${{ fromJson(needs.load-test-matrix.outputs.sim-libs) }}
    concurrency:
      group: ttsim-lib-${{ github.run_id }}-${{ matrix.lib }}
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
    steps:
      - name: Checkout fetch-ttsim action and pinned ttsim version
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2 cachew: keep
        timeout-minutes: 20
        with:
          sparse-checkout: |
            .github/actions/fetch-ttsim
            tt_metal/ttsim-version
          sparse-checkout-cone-mode: false
          ref: ${{ inputs.ref || github.sha }}
      - name: ⬇️  Fetch ttsim
        uses: ./.github/actions/fetch-ttsim
        timeout-minutes: 10
        with:
          lib: ${{ matrix.lib }}

  llk-quasar-ttsim:
    needs: [load-test-matrix, fetch-ttsim]
    if: ${{ needs.load-test-matrix.outputs.matrix != '[]' && needs.fetch-ttsim.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        test-group: ${{ fromJson(needs.load-test-matrix.outputs.matrix) }}
    name: ${{ matrix.test-group.name }}
    runs-on: ${{ matrix.test-group.runs_on }}
    timeout-minutes: ${{ matrix.test-group.timeout }}
    container:
      image: ${{ inputs.docker-image }}
      options: "--label runner-mode=sim"
    steps:
      - name: Checkout code
        uses: tenstorrent/tt-metal/.github/actions/cachew-checkout@8146c9d2746a20109da97143663494805274ce8c # cachew checkout
        timeout-minutes: 20
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Install SFPI
        shell: bash
        working-directory: ${{ env.LLK_PATH }}/tests
        run: ./setup_testing_env.sh

      # ${{ github.workspace }} is the host path. $GITHUB_WORKSPACE, read inside
      # the container, is the path the checkout is mounted at.
      - name: Resolve in-container workspace path
        id: workspace
        shell: bash
        run: echo "path=$GITHUB_WORKSPACE" >> "$GITHUB_OUTPUT"

      - name: ⬇️  Setup TTSim
        uses: ./.github/actions/setup-ttsim
        timeout-minutes: 5
        with:
          sku: ${{ matrix.test-group.sku }}
          root: ${{ steps.workspace.outputs.path }}

      - name: Download test durations
        if: needs.load-test-matrix.outputs.split-durations == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: split-durations
          path: split-durations
      - name: Use the test durations for --splits
        if: needs.load-test-matrix.outputs.split-durations == 'true'
        shell: bash
        run: cp split-durations/quasar.json "$LLK_PATH/tests/python_tests/.test_durations"

      - name: Run tests
        shell: bash
        working-directory: ${{ env.LLK_PATH }}
        env:
          CHIP_ARCH: quasar
          PYTEST_ADDOPTS: --store-durations --clean-durations
        run: |
          ${{ matrix.test-group.cmd }}

      - name: Upload test durations
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: test-durations-quasar-${{ matrix.test-group.split_group }}
          path: ${{ env.LLK_PATH }}/tests/python_tests/.test_durations
          include-hidden-files: true

      - name: Upload JUnit report
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: always()
        with:
          name: junit-report-quasar-${{ matrix.test-group.split_group }}
          path: ${{ env.LLK_PATH }}/tests/python_tests/ttsim_results/ttsim_*.xml
          if-no-files-found: warn

      - name: Publish Test Results
        uses: mikepenz/action-junit-report@v5
        if: always()
        with:
          report_paths: ${{ env.LLK_PATH }}/tests/python_tests/ttsim_results/ttsim_*.xml
          include_passed: true
          annotate_only: true

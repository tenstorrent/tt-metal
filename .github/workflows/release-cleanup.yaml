name: Release Cleanup

permissions:
  contents: write

on:
  schedule:
    - cron: "0 7 * * *"  # Runs daily at midnight UTC
  workflow_dispatch:
    inputs:
      months_back:
        description: "Number of months back to check for pre-releases"
        required: false
        default: "3"  # Default set to 3 months

jobs:
  cleanup:
    runs-on: ubuntu-slim
    steps:
      - name: Cleanup old pre-releases
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          # core.getInput reads this step's `with:` inputs, not workflow_dispatch's.
          # Empty on scheduled runs.
          MONTHS_BACK: ${{ inputs.months_back }}
        with:
          script: |
            const raw = process.env.MONTHS_BACK || "3"; // Default to 3 months
            // Deletions are irreversible: refuse anything but a whole number of months >= 1.
            if (!/^[1-9][0-9]*$/.test(raw.trim())) {
              core.setFailed(`months_back must be a whole number of months, 1 or more; got "${raw}"`);
              return;
            }
            const monthsBack = parseInt(raw, 10);
            const now = new Date();
            const cutoffDate = new Date(now.setMonth(now.getMonth() - monthsBack));

            // Retrieve all releases using pagination
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner: context.repo.owner,
              repo: context.repo.repo,
            });

            for (const release of releases) {
              if (release.prerelease && new Date(release.created_at) < cutoffDate) {
                console.log(`Deleting pre-release: ${release.name || release.tag_name} (created at: ${release.created_at})`);

                try {
                  await github.rest.repos.deleteRelease({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    release_id: release.id,
                  });
                  console.log(`Successfully deleted release: ${release.name || release.tag_name}`);
                } catch (releaseError) {
                  console.error(`Failed to delete release ${release.name || release.tag_name}: ${releaseError.message}`);
                }
              }
            }

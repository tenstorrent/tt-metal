name: "[internal] Models end-to-end artifact checks"

on:
  workflow_call:
    inputs:
      matrix:
        required: true
        type: string
      docker-image:
        required: true
        type: string
      result-prefix:
        required: true
        type: string

permissions:
  contents: read
  packages: read

jobs:
  plan:
    runs-on: ubuntu-slim
    outputs:
      legs: ${{ steps.plan.outputs.legs }}
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: plan
        env:
          TEST_MATRIX: ${{ inputs.matrix }}
        run: python3 .github/scripts/utils/prepare_postprocess_matrix.py

  check:
    needs: plan
    if: ${{ !cancelled() && needs.plan.outputs.shards != '[]' && needs.plan.outputs.shards != '' }}
    name: ${{ matrix.check.name }} artifact check ${{ matrix.check.shard }}
    runs-on: ${{ matrix.check.runs_on }}
    timeout-minutes: ${{ matrix.check.timeout }}
    container:
      image: ${{ inputs.docker-image }}
    env:
      PATH: /opt/venv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      VIRTUAL_ENV: /opt/venv
      POSTPROCESS_INPUT: ${{ github.workspace }}/postprocess-input
      POSTPROCESS_OUTPUT: ${{ github.workspace }}/postprocess-output
      POSTPROCESS_SHARD: ${{ matrix.check.shard }}
    strategy:
      fail-fast: false
      matrix:
        check: ${{ fromJson(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: models-e2e-multihost-${{ matrix.check.index }}-${{ github.run_id }}
          path: ${{ env.POSTPROCESS_INPUT }}
      - name: Run configured artifact check
        shell: bash
        run: |
          mkdir -p "$POSTPROCESS_OUTPUT"
          ${{ matrix.check.cmd }}
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: ${{ inputs.result-prefix }}-${{ matrix.check.index }}-${{ matrix.check.shard }}
          path: ${{ env.POSTPROCESS_OUTPUT }}/
          if-no-files-found: error

  aggregate:
    needs: [plan, check]
    if: ${{ !cancelled() && needs.plan.outputs.legs != '[]' && needs.plan.outputs.legs != '' }}
    name: ${{ matrix.check.name }} artifact gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: ${{ inputs.docker-image }}
    env:
      PATH: /opt/venv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      VIRTUAL_ENV: /opt/venv
      POSTPROCESS_INPUT: ${{ github.workspace }}/postprocess-input
      POSTPROCESS_OUTPUT: ${{ github.workspace }}/postprocess-output
    strategy:
      fail-fast: false
      matrix:
        check: ${{ fromJson(needs.plan.outputs.legs) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: models-e2e-multihost-${{ matrix.check.index }}-${{ github.run_id }}
          path: ${{ env.POSTPROCESS_INPUT }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ${{ inputs.result-prefix }}-${{ matrix.check.index }}-*
          path: ${{ env.POSTPROCESS_OUTPUT }}
          merge-multiple: true
      - name: Enforce configured aggregate gate
        shell: bash
        run: ${{ matrix.check.aggregate_cmd }}

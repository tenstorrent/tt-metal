name: "LLK bit-exact"

# Manual ttnop sweep on this branch (WH and/or BH, 15 shards each).
# TEMP: WH only, first 5 of a 15-way split, 5 machines. Restore: uncomment all/blackhole, default all.

on:
  workflow_dispatch:
    inputs:
      architecture:
        description: "Architecture to run ttnop on"
        required: true
        default: wormhole # TEMP: was all
        type: choice
        options:
          # - all # TEMP restore
          - wormhole
          # - blackhole # TEMP restore

permissions:
  checks: write
  contents: read
  packages: write

# Cancel a previous in-flight run of the same architecture on this ref.
concurrency:
  # TEMP: fallback was 'all'
  group: ${{ github.workflow }}-${{ inputs.architecture || 'wormhole' }}-${{
    github.ref_protected && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  llk-bit-exact-tests:
    name: "LLK ttnop tests"
    uses: ./.github/workflows/llk-bit-exact-impl.yaml
    with:
      architecture: ${{ inputs.architecture || 'wormhole' }} # TEMP: was 'all'
    secrets: inherit

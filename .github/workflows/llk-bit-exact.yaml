name: "LLK bit-exact"

on:
  workflow_dispatch:
    inputs:
      architecture:
        description: "Architecture to run bit-exactness tests on"
        required: true
        default: all
        type: choice
        options:
          - all
          - wormhole
          - blackhole
      test_selection:
        description: "TTNOP tests to sweep"
        required: true
        default: changed
        type: choice
        options:
          - changed
          - full

permissions:
  actions: read
  checks: write
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-dispatcher-${{ inputs.architecture || 'all' }}-${{
    github.ref_protected && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  ttnop-injector:
    name: "TTNOP Injector"
    uses: ./.github/workflows/ttnop-injector.yaml
    with:
      architecture: ${{ inputs.architecture || 'all' }}
      test_selection: ${{ inputs.test_selection || 'changed' }}
    secrets: inherit

  ttnop-injector-summary:
    name: "TTNOP Injector summary"
    if: always()
    needs:
      - ttnop-injector
    runs-on: ubuntu-slim
    steps:
      - name: Check TTNOP Injector results
        uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}

  report-status:
    name: "Report status"
    runs-on: ubuntu-slim
    if: always()
    needs: ttnop-injector-summary
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        timeout-minutes: 20
        with:
          fetch-depth: 1
      - name: Report status
        uses: ./.github/actions/report-failure
        with:
          test_name: "TTNOP Injector"
          slack_bot_token: ${{ secrets.LLK_SLACK_REPORTING_BOT_TOKEN }}
          slack_channel_id: ${{ secrets.LLK_CI_STATUS_CHANNEL_ID }}
          status: ${{ needs.ttnop-injector-summary.result }}

name: DiT review

# For PRs touching models/tt_dit/:
#   - assign-reviewers requests 1-2 DiT team members chosen by recent commit history
#     in the touched directories (always at least one), then withdraws the
#     metalium-dit team-wide CODEOWNERS request so the PR leaves the other members'
#     review queues. It cannot undo the notification CODEOWNERS already sent; the
#     team's auto-assignment setting is what prevents that.
#   - automerge approves and enables auto-merge for small DiT PRs whose author added
#     the dit-auto-merge label and that have a passing All Model Tests run covering
#     DiT on the latest commit. It re-evaluates on every push, label change, review
#     and finished test run, and dismisses its approval / turns auto-merge off when
#     a PR stops qualifying. A "DiT auto-merge" status (never blocking) says why.
# Logic and criteria live in .github/scripts/dit_review.py.
#
# Reviews can add unresolved threads, which affect eligibility. Reviews do not
# trigger pull_request_target, and pull_request_review runs without secrets on fork
# PRs, so dit-review-trigger.yaml records the PR number and this workflow re-checks
# via workflow_run. A finished All Model Tests run only knows its commit, so the
# script looks up the open PRs at that commit.
#
# Team membership needs read:org, so this reuses the codeowners-group-analysis PAT
# (same one auto-approve.yaml uses). That account also approves PRs, so it must be
# a code owner of models/tt_dit/ for its approval to count.
#
# Security note: pull_request_target and workflow_run run with write access and
# secrets, even for fork PRs. This is safe because:
#   1. Only the base branch is checked out (to get the script); PR code is never
#      checked out or executed
#   2. The script only reads PR metadata via the API
#   3. The PR number from the trigger artifact is validated as an integer; nothing
#      else is taken from it

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize, labeled, unlabeled]
  workflow_run:
    workflows: [DiT review trigger, All Model Tests]
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: write
  statuses: write

jobs:
  assign-reviewers:
    name: Assign DiT reviewers
    runs-on: ubuntu-slim
    if: |
      github.event_name == 'pull_request_target' &&
      contains(fromJSON('["opened", "reopened", "ready_for_review"]'), github.event.action) &&
      !github.event.pull_request.draft &&
      github.event.pull_request.user.type != 'Bot'
    steps:
      - name: Checkout script from base branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          sparse-checkout: .github/scripts/dit_review.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Request reviewers
        env:
          GH_TOKEN: ${{ secrets.CODEOWNERS_GROUP_ANALYSIS_PAT }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python3 .github/scripts/dit_review.py assign

  automerge:
    name: DiT auto-merge
    runs-on: ubuntu-slim
    if: |
      github.event_name == 'pull_request_target' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Download PR number from trigger run
        if: github.event.workflow_run.name == 'DiT review trigger'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dit-review-pr
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Resolve PR number or commit
        id: pr
        env:
          EVENT_PR: ${{ github.event.pull_request.number }}
          RUN_NAME: ${{ github.event.workflow_run.name }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [[ -n "$EVENT_PR" ]]; then
            n="$EVENT_PR"
          elif [[ "$RUN_NAME" == "All Model Tests" ]]; then
            echo "head-sha=$RUN_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          else
            n=$(cat pr_number)
          fi
          if [[ ! "$n" =~ ^[0-9]+$ ]]; then
            echo "::error::Invalid PR number: $n"
            exit 1
          fi
          echo "number=$n" >> "$GITHUB_OUTPUT"
      - name: Checkout script and test lists from base branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          sparse-checkout: |
            .github/scripts/dit_review.py
            tests/pipeline_reorg/models_unit_tests.yaml
            tests/pipeline_reorg/models_e2e_tests.yaml
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Approve and enable auto-merge, or undo
        env:
          GH_TOKEN: ${{ secrets.CODEOWNERS_GROUP_ANALYSIS_PAT }}
          STATUS_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          HEAD_SHA: ${{ steps.pr.outputs.head-sha }}
        run: python3 .github/scripts/dit_review.py automerge

name: DiT review

# For PRs touching models/tt_dit/:
#   - assign-reviewers requests 1-2 DiT team members chosen by recent commit history
#     in the touched directories (always at least one), and withdraws the team-wide
#     CODEOWNERS requests when the PR only changes models/tt_dit/.
#   - check-approval posts a "DiT approval" commit status that is pending until a
#     member of tenstorrent/metalium-dit approves. Other PRs get success immediately,
#     so the status can be made required repo-wide.
# Logic lives in .github/scripts/dit_review.py.
#
# Reviews do not trigger pull_request_target, and pull_request_review runs without
# secrets on fork PRs, so dit-review-trigger.yaml records the PR number and this
# workflow re-checks via workflow_run.
#
# Team membership needs read:org, so this reuses the codeowners-group-analysis PAT
# (same one auto-approve.yaml uses).
#
# Security note: pull_request_target and workflow_run run with write access and
# secrets, even for fork PRs. This is safe because:
#   1. Only the base branch is checked out (to get the script); PR code is never
#      checked out or executed
#   2. The script only reads PR metadata via the API
#   3. The PR number from the trigger artifact is validated as an integer; nothing
#      else is taken from it

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize]
  workflow_run:
    workflows: [DiT review trigger]
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: write
  statuses: write

jobs:
  assign-reviewers:
    name: Assign DiT reviewers
    runs-on: ubuntu-slim
    if: |
      github.event_name == 'pull_request_target' &&
      github.event.action != 'synchronize' &&
      !github.event.pull_request.draft &&
      github.event.pull_request.user.type != 'Bot'
    steps:
      - name: Checkout script from base branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          sparse-checkout: .github/scripts/dit_review.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Request reviewers
        env:
          GH_TOKEN: ${{ secrets.CODEOWNERS_GROUP_ANALYSIS_PAT }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python3 .github/scripts/dit_review.py assign

  check-approval:
    name: Check DiT approval
    runs-on: ubuntu-slim
    if: |
      github.event_name == 'pull_request_target' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Download PR number from trigger run
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dit-review-pr
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Resolve PR number
        id: pr
        env:
          EVENT_PR: ${{ github.event.pull_request.number }}
        run: |
          if [[ -n "$EVENT_PR" ]]; then
            n="$EVENT_PR"
          else
            n=$(cat pr_number)
          fi
          if [[ ! "$n" =~ ^[0-9]+$ ]]; then
            echo "::error::Invalid PR number: $n"
            exit 1
          fi
          echo "number=$n" >> "$GITHUB_OUTPUT"
      - name: Checkout script from base branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          sparse-checkout: .github/scripts/dit_review.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Post DiT approval status
        env:
          GH_TOKEN: ${{ secrets.CODEOWNERS_GROUP_ANALYSIS_PAT }}
          STATUS_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: python3 .github/scripts/dit_review.py check

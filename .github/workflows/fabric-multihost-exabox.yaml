name: "(SC4) Health check & Fabric Test"

on:
  schedule:
    - cron: "0 5 * * *" # Runs every day at 5:00 AM UTC
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

run-name: Fabric Test on a BH Quad

# Each test owns its full ttop lifecycle in a single job -- allocate, deploy the
# worker environment, run, tear down -- so the run shows one job per test with a
# readable list of steps instead of a create/run/cleanup trio each.
#
# The teardown steps are `if: always()`, which covers a failed or cancelled test.
# It does NOT cover the runner disappearing mid-job; that trade was made knowingly
# in favour of the flatter job list. If leaked allocations ever become a problem,
# split the two teardown steps back out into their own `if: always()` job.
jobs:
  check-harbor:
    uses: ./.github/workflows/check-harbor.yaml

  build-artifact:
    needs: check-harbor
    uses: ./.github/workflows/build-artifact.yaml
    permissions:
      contents: read
      packages: write
    secrets: inherit
    with:
      harbor-prefix: ${{ needs.check-harbor.outputs.harbor-prefix }}
      build-wheel: true
      platform: "Ubuntu 22.04"
      skip-tt-train: false
      ref: ${{ github.sha }}

  # ===========================================================================
  # SC4 health checks + fabric test, against the freshly built dev image.
  # ===========================================================================
  sc4-test:
    name: Health check & Fabric Test (SC4)
    needs: build-artifact
    runs-on:
      group: exabox
      labels: exabox-multihost-with-nfs
    env:
      PATH: "/opt/venv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
      VIRTUAL_ENV: /opt/venv
      HOME: /home/user
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        timeout-minutes: 20

      - name: Extract allocation spec from SKU
        id: extract-spec
        run: |
          pip3 install PyYAML
          {
            echo "allocation_spec<<EOF"
            python3 .github/scripts/utils/extract_allocation_from_sku.py "bh_sc4-mgd"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Create allocation
        id: allocation
        timeout-minutes: 30
        uses: ./.github/actions/ttop-create-allocation
        with:
          allocationName: ci-${{ github.run_id }}-metal
          namespace: ttop-ci
          spec: ${{ steps.extract-spec.outputs.allocation_spec }}

      - name: Parse docker image
        id: parse-image
        run: |
          IMAGE="${{ needs.build-artifact.outputs.dev-docker-image }}"
          REPOSITORY="${IMAGE%:*}"
          TAG="${IMAGE##*:}"
          echo "repository=$REPOSITORY" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Get Allocation data
        uses: ./.github/actions/ttop-get-allocation-data
        with:
          allocationName: ci-${{ github.run_id }}-metal
          allocationNamespace: ttop-ci

      - name: Create environment
        uses: ./.github/actions/ttop-create-environment
        timeout-minutes: 30
        with:
          environmentName: ci-${{ github.run_id }}-metal
          allocationName: ci-${{ github.run_id }}-metal
          allocationNamespace: ttop-ci
          workerRepository: ${{ steps.parse-image.outputs.repository }}
          workerTag: ${{ steps.parse-image.outputs.tag }}
          useDevHostMount: 'true'
          sharedVolumeEnabled: 'true'
          path: /etc/ttop

      - name: 📦 Download Build Artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build-artifact.outputs.build-artifact-name }}
          path: /ci/artifacts

      - name: 🧪 Download Python Wheel
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build-artifact.outputs.wheel-artifact-name }}
          path: /ci/artifacts

      - name: Unpack artifacts & install
        run: |
          # Move the cloned directory to workers. TODO: Clone directly to NFS
          rm -rf /ci/tt-metal
          cp -r "$GITHUB_WORKSPACE" /ci/tt-metal
          if ! command -v zstd >/dev/null 2>&1; then
            echo "zstd not found in runner context, installing fallback..."
            sudo apt-get update
            sudo apt-get install -y zstd
          fi
          shopt -s globstar nullglob
          build_archives=(/ci/artifacts/**/*.tar.zst)
          echo "Found ${#build_archives[@]} .tar.zst candidate(s) under /ci/artifacts"
          printf ' - %s\n' "${build_archives[@]}"
          if [ ${#build_archives[@]} -eq 0 ]; then
            echo "ERROR: Could not find any .tar.zst under /ci/artifacts"
            echo "Artifact directory layout:"
            ls -R /ci/artifacts
            exit 1
          fi
          BUILD_ARCHIVE="${build_archives[0]}"
          echo "Using build archive: ${BUILD_ARCHIVE}"

          sudo rm -rf /home/user/tt-metal
          sudo mkdir -p /home/user/tt-metal
          sudo chown "$(id -u):$(id -g)" /home/user/tt-metal
          tar --zstd -xf "${BUILD_ARCHIVE}" -C /home/user/tt-metal

          mpirun --pernode bash -lc 'rm -rf /home/user/tt-metal && cp -r /ci/tt-metal /home/user/'
          mpirun --pernode git -C /home/user/tt-metal submodule update --init --recursive

          # Unpack artifacts
          mpirun --pernode tar --zstd -xf "${BUILD_ARCHIVE}" -C /home/user/tt-metal
          ttnn_wheels=(/ci/artifacts/**/ttnn-*.whl)
          echo "Found ${#ttnn_wheels[@]} ttnn wheel candidate(s) under /ci/artifacts"
          printf ' - %s\n' "${ttnn_wheels[@]}"
          if [ ${#ttnn_wheels[@]} -eq 0 ]; then
            echo "ERROR: Could not find ttnn-*.whl under /ci/artifacts"
            echo "Artifact directory layout:"
            ls -R /ci/artifacts
            exit 1
          fi
          mpirun --pernode uv pip install "${ttnn_wheels[@]}"

      - name: Reset cards and validate cluster
        working-directory: /tmp
        timeout-minutes: 30
        run: |
          MAX_RECOVERY_ATTEMPTS=10

          echo "--- Pre-check: tt-smi visibility on all hosts ---"
          mpirun --pernode --tag-output \
            bash -lc '
              snapshot=$(tt-smi --snapshot_no_tty --snapshot)
              driver=$(jq -r ".host_info.Driver // \"unknown\"" <<< "$snapshot")
              tt_smi=$(jq -r ".host_sw_vers.tt_smi // \"unknown\"" <<< "$snapshot")
              echo "$(hostname): Driver=${driver} tt_smi=${tt_smi}"
            ' || true

          run_cluster_validation() {
            mpirun --pernode --tag-output \
              /home/user/tt-metal/build/tools/scaleout/run_cluster_validation \
              --send-traffic \
              --hard-fail \
              --cabling-descriptor-path /data/scaleout_configs/bh_glx_exabox/cabling_descriptor.textproto \
              --deployment-descriptor-path /data/scaleout_configs/bh_glx_exabox/deployment_descriptor.textproto \
              --num-iterations 5
          }

          echo "--- Checking cluster health before reset ---"
          if run_cluster_validation; then
            echo "SUCCESS: Cluster validation passed without reset"
            exit 0
          fi

          for attempt in $(seq 1 "$MAX_RECOVERY_ATTEMPTS"); do
            echo "=== Recovery attempt $attempt of $MAX_RECOVERY_ATTEMPTS ==="
            reset_success=false
            validation_success=false

            echo "--- Resetting cards with tt-smi ---"
            if mpirun --pernode tt-smi -glx_reset; then
              reset_success=true
            else
              echo "WARNING: Reset failed on attempt $attempt"
            fi

            if [ "$reset_success" = true ]; then
              echo "--- Sleeping 5s after reset to allow links/services to settle ---"
              sleep 5

              echo "--- Running cluster validation ---"
              if run_cluster_validation; then
                validation_success=true
              else
                echo "WARNING: Validation failed on attempt $attempt"
              fi
            else
              echo "WARNING: Skipping validation because reset failed on attempt $attempt"
            fi

            if [ "$reset_success" = true ] && [ "$validation_success" = true ]; then
              echo "SUCCESS: Reset and cluster validation passed on attempt $attempt"
              exit 0
            fi

            if [ "$attempt" -lt "$MAX_RECOVERY_ATTEMPTS" ]; then
              echo "Sleeping 30s before retry..."
              sleep 30
            fi
          done

          echo "ERROR: Recovery failed after $MAX_RECOVERY_ATTEMPTS attempts"
          exit 1

      - name: Verify ttnn imports on workers
        working-directory: /tmp
        run: |
          mpirun --pernode --tag-output bash -lc '
            python3 -c "import ttnn; print(\"ttnn import: OK\")"
            python3 -c "import ttnn.device; print(\"ttnn.device import: OK\")"
          '

      - name: Run Physical discovery test
        timeout-minutes: 10
        run: |
          mpirun --tag-output -x LD_LIBRARY_PATH -x TT_METAL_RUNTIME_ROOT --pernode /home/user/tt-metal/build/test/tt_metal/tt_fabric/test_physical_discovery

      - name: Run System Health Check
        timeout-minutes: 10
        run: |
          mpirun --tag-output -x LD_LIBRARY_PATH -x TT_METAL_RUNTIME_ROOT --pernode \
            /home/user/tt-metal/build/test/tt_metal/tt_fabric/test_system_health --min-connections 2

      - name: Run Fabric Test
        timeout-minutes: 20
        working-directory: /home/user/tt-metal
        run: |
          TTRUN_DIR=/etc/ttop
          PIPELINE_HOSTS=$(awk 'NF {printf "%s,", $1}' "${TTRUN_DIR}/hostfile" | sed 's/,$//')

          tt-run --skip-mgd-check --skip-executable-check \
            --rank-binding "${TTRUN_DIR}/rank_bindings.yaml" \
            --mpi-args "--tag-output --host $PIPELINE_HOSTS --map-by rankfile:file=${TTRUN_DIR}/rankfile --bind-to hwt:overload-allowed --wdir ${TT_METAL_HOME}" \
            /home/user/tt-metal/build/test/tt_metal/tt_fabric/test_infra/test_tt_fabric --test_config /home/user/tt-metal/tests/tt_metal/tt_fabric/test_infra/test_yamls/test_bh_glx_superpod_short_running.yaml

      - name: Delete environment
        if: always()
        uses: ./.github/actions/ttop-delete-environment
        with:
          environmentName: ci-${{ github.run_id }}-metal
          namespace: ttop-ci

      - name: Delete allocation
        if: always()
        uses: ./.github/actions/ttop-delete-allocation
        with:
          allocationName: ci-${{ github.run_id }}-metal
          namespace: ttop-ci

  # ===========================================================================
  # DC validation on the QUAD (issue #50505), driven by the DC's own
  # tools/scaleout/exabox/run_fabric_tests.sh so CI runs exactly the script the
  # DC runs -- same 4x32 launch, same mesh graph descriptor, same MPMD segments,
  # same pass/fail banner.
  #
  # It runs with `--image none` (the script's no-docker path): `--image <img>`
  # drives mpi-docker, which needs a docker daemon on EVERY host, and the ttop
  # worker hosts have none ("docker: command not found"). With --image none the
  # script launches the test binary directly on the workers, so what gets
  # exercised is whatever those workers are running -- here the same freshly
  # built dev image + build artifact as the SC4 job, no pinned image involved.
  # ===========================================================================
  dc-validation-quad:
    name: DC validation (quad)
    needs: build-artifact
    runs-on:
      group: exabox
      labels: exabox-multihost-with-nfs
    env:
      PATH: "/opt/venv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
      VIRTUAL_ENV: /opt/venv
      HOME: /home/user
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        timeout-minutes: 20

      - name: Extract allocation spec from SKU
        id: extract-spec
        run: |
          pip3 install PyYAML
          {
            echo "allocation_spec<<EOF"
            python3 .github/scripts/utils/extract_allocation_from_sku.py "bh_sc4-mgd"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Create allocation
        id: allocation
        timeout-minutes: 30
        uses: ./.github/actions/ttop-create-allocation
        with:
          allocationName: ci-${{ github.run_id }}-dc-quad
          namespace: ttop-ci
          spec: ${{ steps.extract-spec.outputs.allocation_spec }}

      - name: Parse docker image
        id: parse-image
        run: |
          IMAGE="${{ needs.build-artifact.outputs.dev-docker-image }}"
          REPOSITORY="${IMAGE%:*}"
          TAG="${IMAGE##*:}"
          echo "repository=$REPOSITORY" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Get Allocation data
        uses: ./.github/actions/ttop-get-allocation-data
        with:
          allocationName: ci-${{ github.run_id }}-dc-quad
          allocationNamespace: ttop-ci

      - name: Create environment
        uses: ./.github/actions/ttop-create-environment
        timeout-minutes: 30
        with:
          environmentName: ci-${{ github.run_id }}-dc-quad
          allocationName: ci-${{ github.run_id }}-dc-quad
          allocationNamespace: ttop-ci
          workerRepository: ${{ steps.parse-image.outputs.repository }}
          workerTag: ${{ steps.parse-image.outputs.tag }}
          useDevHostMount: 'true'
          sharedVolumeEnabled: 'true'
          path: /etc/ttop

      - name: 📦 Download Build Artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build-artifact.outputs.build-artifact-name }}
          path: /ci/artifacts

      # Same layout the SC4 job builds, minus the ttnn wheel: run_fabric_tests.sh
      # --image none launches the C++ test binary straight from the tree, so the
      # workers need /home/user/tt-metal = repo checkout + unpacked build, and
      # nothing python-side.
      - name: Unpack artifacts onto the workers
        run: |
          # Move the cloned directory to workers. TODO: Clone directly to NFS
          rm -rf /ci/tt-metal
          cp -r "$GITHUB_WORKSPACE" /ci/tt-metal
          if ! command -v zstd >/dev/null 2>&1; then
            echo "zstd not found in runner context, installing fallback..."
            sudo apt-get update
            sudo apt-get install -y zstd
          fi
          shopt -s globstar nullglob
          build_archives=(/ci/artifacts/**/*.tar.zst)
          echo "Found ${#build_archives[@]} .tar.zst candidate(s) under /ci/artifacts"
          printf ' - %s\n' "${build_archives[@]}"
          if [ ${#build_archives[@]} -eq 0 ]; then
            echo "ERROR: Could not find any .tar.zst under /ci/artifacts"
            echo "Artifact directory layout:"
            ls -R /ci/artifacts
            exit 1
          fi
          BUILD_ARCHIVE="${build_archives[0]}"
          echo "Using build archive: ${BUILD_ARCHIVE}"

          sudo rm -rf /home/user/tt-metal
          sudo mkdir -p /home/user/tt-metal
          sudo chown "$(id -u):$(id -g)" /home/user/tt-metal
          tar --zstd -xf "${BUILD_ARCHIVE}" -C /home/user/tt-metal

          mpirun --pernode bash -lc 'rm -rf /home/user/tt-metal && cp -r /ci/tt-metal /home/user/'
          mpirun --pernode git -C /home/user/tt-metal submodule update --init --recursive
          mpirun --pernode tar --zstd -xf "${BUILD_ARCHIVE}" -C /home/user/tt-metal

      - name: Reset cards
        timeout-minutes: 15
        run: |
          mpirun --pernode tt-smi -glx_reset || echo "WARNING: glx_reset failed; continuing"

      # iproute2 for the interface dump below; the run itself uses --mpi-if none,
      # so nothing depends on `ip` being present.
      - name: Install iproute2
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends iproute2
          echo "--- available interfaces ---"; ip -br link || true

      # The DC's own script. The only deviations from the DC's command line are
      # --image none (see the job comment) and absolute worker-side paths: the
      # script's repo-relative defaults would resolve against the runner's
      # checkout, but the binary/config/descriptor have to resolve on the workers
      # under /home/user/tt-metal.
      - name: DC validation (quad) - run_fabric_tests.sh 4x32 neighbor exchange
        timeout-minutes: 20
        run: |
          TTRUN_DIR=/etc/ttop
          WORKER_HOME=/home/user/tt-metal

          # ttop-get-allocation-data dumps the allocation ConfigMap keys here.
          # Dump what actually landed: an empty/short --hosts makes the script
          # exit in under a second with a one-line error and no other clue.
          echo "--- ${TTRUN_DIR} ---"
          ls -la "$TTRUN_DIR" 2>&1 || true
          for f in hostfile rankfile; do
            echo "--- ${f} ---"
            cat "${TTRUN_DIR}/${f}" 2>&1 || true
          done

          # Host ORDER defines the 32x4 ring: --config 4x32 launches one rank per
          # --hosts entry against a host_topology 4x1 descriptor, and (unlike the Z
          # configs) the script does not reorder them. Take ttop's own rank order
          # from the rankfile -- that is the placement the SC4 fabric test runs
          # with -- and fall back to hostfile order if it can't be parsed.
          count_hosts() { tr ',' '\n' <<< "$1" | grep -c . || true; }

          PIPELINE_HOSTS=$(sed -n 's/^rank[[:space:]]*[0-9]*=\([^[:space:]]*\).*/\1/p' "${TTRUN_DIR}/rankfile" 2>/dev/null \
            | awk '!seen[$0]++' | paste -sd, -)
          NHOSTS=$(count_hosts "$PIPELINE_HOSTS")
          if [ "${NHOSTS:-0}" -ne 4 ]; then
            echo "rankfile yielded ${NHOSTS} host(s); falling back to hostfile order"
            PIPELINE_HOSTS=$(awk 'NF {print $1}' "${TTRUN_DIR}/hostfile" 2>/dev/null \
              | awk '!seen[$0]++' | paste -sd, -)
            NHOSTS=$(count_hosts "$PIPELINE_HOSTS")
          fi
          echo "Ring order (${NHOSTS} hosts): $PIPELINE_HOSTS"
          if [ "${NHOSTS:-0}" -ne 4 ]; then
            echo "::error::Could not determine the 4 quad hosts from ${TTRUN_DIR} (see the dump above)"
            exit 1
          fi

          set -o pipefail
          ./tools/scaleout/exabox/run_fabric_tests.sh \
            --hosts "$PIPELINE_HOSTS" \
            --image none \
            --config 4x32 \
            --test-binary "$WORKER_HOME/build/test/tt_metal/tt_fabric/test_infra/test_tt_fabric" \
            --test-config "$WORKER_HOME/tests/tt_metal/tt_fabric/test_infra/test_yamls/test_fabric_sanity_neighbor_exchange.yaml" \
            --mesh-graph-desc-path "$WORKER_HOME/tt_metal/fabric/mesh_graph_descriptors/32x4_quad_bh_galaxy_torus_xy_graph_descriptor.textproto" \
            --filter name.2DTorusXYNeighborExchange \
            --mpi-if none \
            --mpi-args "--wdir $WORKER_HOME" 2>&1 | tee dc_quad_result.log
          # `set -o pipefail` above plus the script's exit status (non-zero unless
          # every rank reported success) is the pass/fail signal. Do NOT grep the
          # log for the success marker instead: the script's own failure banner
          # quotes that marker ("Expected '...' once per rank"), so a grep passes
          # on a failed run.
          #
          # Belt and braces against a vacuous green: test_tt_fabric reports
          # "Tests: <N> executed, <M> failed" per rank, so require that at least
          # one test actually ran.
          if ! grep -qE "Tests: [1-9][0-9]* executed" dc_quad_result.log; then
            echo "::error::DC validation ran no tests (check the --test-config path and --filter)"
            exit 1
          fi

      - name: Upload fabric test logs
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: dc-validation-quad-logs
          path: |
            fabric_test_logs/
            dc_quad_result.log
          if-no-files-found: ignore

      - name: Delete environment
        if: always()
        uses: ./.github/actions/ttop-delete-environment
        with:
          environmentName: ci-${{ github.run_id }}-dc-quad
          namespace: ttop-ci

      - name: Delete allocation
        if: always()
        uses: ./.github/actions/ttop-delete-allocation
        with:
          allocationName: ci-${{ github.run_id }}-dc-quad
          namespace: ttop-ci

name: "(TEMPORARY) Test prefill-worker image build"

# Off-branch dry run of what the NIGHTLY release does for the disaggregated
# prefill-worker image, without running a full release. It imitates the release's
# create-prefill-worker-image job (-> publish-release-image.yaml, derived-image
# path): derive FROM the published release-models image, COPY _migration_client
# out of the prebuilt tt-llm-engine migration image, and push with the exact same
# bake target + compression/output settings + SBOM/attestation (the shared
# manual-docker-bake action) the release uses.
#
# Deviations from the real nightly (so it's safe to run repeatedly off a branch):
#   * It layers on an ALREADY-PUBLISHED release-models tag (base-version, default
#     'latest') and pushes to a throwaway '<test-tag>' instead of a single shared
#     release version. The real job uses the release version for both.
#   * No on-device smoke test / retag-as-latest - those are release management,
#     not part of building this image.
# Everything else (derive-from-release-models, the prebuilt-engine COPY, the
# derived output line, attestations) matches the nightly.
#
# Platforms: both 22.04 and 24.04, exactly as the package-and-release matrix
# drives the nightly. The 24.04 leg is EXPECTED to fail the in-build import check
# until tt-llm-engine publishes a Python-3.12 migration-worker image (the module
# is a version-specific nanobind extension; today the image is 3.10 only).
# fail-fast:false so the 22.04 leg still completes and pushes.
#
# Why a `push` trigger and not just workflow_dispatch: `gh workflow run` resolves
# workflows from the DEFAULT branch only, so a dispatch-only workflow on a feature
# branch cannot be triggered (404). A push trigger runs the definition from the
# pushed branch itself.
#
# DELETE THIS FILE once the prefill-worker release job has run green.

on:
  workflow_dispatch:
    inputs:
      base-version:
        description: "Tag of the published release-models image to layer on (e.g. 'latest' or 'v0.76.0-dev20260726')"
        required: false
        default: latest
        type: string
      test-tag:
        description: "Throwaway tag to push the built worker as"
        required: false
        default: prefill-worker-buildtest
        type: string
      tt-llm-engine-image:
        description: >-
          Prebuilt tt-llm-engine migration image to COPY _migration_client from.
          Leave empty to use the pinned default in dockerfile/docker-bake.hcl.
        required: false
        default: ""
        type: string
  push:
    branches-ignore:
      - main
      - stable
    paths:
      - dockerfile/Dockerfile.prefill-worker
      - dockerfile/Dockerfile.prefill-worker.dockerignore
      - dockerfile/docker-bake.hcl
      - .github/workflows/test-prefill-worker-image.yaml

permissions:
  contents: read
  packages: write

jobs:
  build-prefill-worker:
    name: Build prefill-worker (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, ubuntu-24.04]
    runs-on: tt-ubuntu-2204-large-stable
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        timeout-minutes: 20

      - name: Capture proxy env for the buildx builder
        id: proxy-env
        run: |
          echo "PROXY_HTTP=${HTTP_PROXY:-${http_proxy:-}}" >> "$GITHUB_ENV"
          echo "PROXY_HTTPS=${HTTPS_PROXY:-${https_proxy:-}}" >> "$GITHUB_ENV"
          echo "PROXY_NO_PROXY=tenstorrent.net" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          driver-opts: |
            env.HTTP_PROXY=${{ env.PROXY_HTTP }}
            env.HTTPS_PROXY=${{ env.PROXY_HTTPS }}
            env.NO_PROXY=${{ env.PROXY_NO_PROXY }}

      - name: Resolve inputs and image refs
        id: refs
        env:
          BASE_VERSION: ${{ inputs.base-version || 'latest' }}
          TEST_TAG: ${{ inputs.test-tag || 'prefill-worker-buildtest' }}
          ENGINE: ${{ inputs.tt-llm-engine-image || '' }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          # Same image naming the release uses: tt-metalium-<platform>-<image>-amd64.
          BASE="ghcr.io/${GITHUB_REPOSITORY}/tt-metalium-${PLATFORM}-release-models-amd64:${BASE_VERSION}"
          OUT="ghcr.io/${GITHUB_REPOSITORY}/tt-metalium-${PLATFORM}-prefill-worker-amd64:${TEST_TAG}"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "out=$OUT" >> "$GITHUB_OUTPUT"
          echo "engine=$ENGINE" >> "$GITHUB_OUTPUT"
          echo "Base:   $BASE"
          echo "Output: $OUT"
          echo "Engine: ${ENGINE:-<bake default>}"

      # Log in with VM_BLAZE (a personal PAT) rather than the default GITHUB_TOKEN:
      # this image PULLS the private tt-llm-engine/migration-worker package, which
      # lives in a DIFFERENT repo, and GITHUB_TOKEN only grants access to tt-metal's
      # own packages. VM_BLAZE has read access to that engine package. It's one
      # login per registry (ghcr.io), so this same cred also pulls the release-models
      # base + tool images and pushes the worker - VM_BLAZE therefore also needs
      # write:packages for the tt-metal prefill-worker package (see note below if the
      # push is denied). TEMPORARY: the real release will use a shared org secret.
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: https://ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.VM_BLAZE }}

      - name: Verify base + engine images are readable
        env:
          BASE: ${{ steps.refs.outputs.base }}
          ENGINE: ${{ steps.refs.outputs.engine }}
        run: |
          set -uo pipefail
          if ! docker manifest inspect "$BASE" > /dev/null 2>&1; then
            echo "::error::Base image $BASE not found in GHCR." \
              "Re-run with base-version set to a release-models tag that exists for this platform."
            exit 1
          fi
          echo "Base image found."
          # ENGINE empty => the bake default is used; the build's own pull would
          # surface a missing image. Only preflight an explicitly-passed override.
          if [ -n "$ENGINE" ] && ! docker manifest inspect "$ENGINE" > /dev/null 2>&1; then
            echo "::error::tt-llm-engine image $ENGINE not found / not readable in GHCR."
            exit 1
          fi
          [ -n "$ENGINE" ] && echo "Engine image found." || echo "Engine image: using bake default."

      # Same as the release: the SBOM attestation needs our self-hosted syft-scanner
      # + oras tool images, resolved to their content-addressed ghcr tags.
      - name: Compute tool tags
        id: tool-tags
        run: |
          TOOL_TAGS=$(.github/scripts/compute-tool-tags.sh "${{ github.repository }}")
          {
            echo "syft-scanner-image=$(echo "$TOOL_TAGS" | jq -r '."syft-scanner-tag"')"
            echo "oras-image=$(echo "$TOOL_TAGS" | jq -r '."oras-tag"')"
          } >> "$GITHUB_OUTPUT"

      - name: Prepare bake overrides
        id: bake
        env:
          BASE: ${{ steps.refs.outputs.base }}
          OUT: ${{ steps.refs.outputs.out }}
          ENGINE: ${{ steps.refs.outputs.engine }}
          PROXY_HTTP: ${{ env.PROXY_HTTP }}
          PROXY_HTTPS: ${{ env.PROXY_HTTPS }}
          PROXY_NO_PROXY: ${{ env.PROXY_NO_PROXY }}
        run: |
          set -euo pipefail
          SET=""
          # derive-from release-models: layer on the published base image (exactly
          # what publish-release-image.yaml sets for a derived image).
          SET+="prefill-worker.contexts.release-base=docker-image://${BASE}"$'\n'
          SET+="prefill-worker.tags=${OUT}"$'\n'
          # Override the engine image only when one was passed; otherwise the pinned
          # default in dockerfile/docker-bake.hcl applies.
          if [ -n "$ENGINE" ]; then
            SET+="prefill-worker.args.TT_LLM_ENGINE_IMAGE=${ENGINE}"$'\n'
          fi
          # Derived-image output line: zstd but NO force-compression. This worker
          # layers on a REMOTE base whose layers are referenced lazily;
          # force-compression=true would make BuildKit recompress those lazy base
          # blobs to zstd at export and fail with 'failed to get compression blob
          # "zstd": not found'. Without it the base layers are reused by digest and
          # only the new worker layer is zstd. Matches the release's derived branch.
          SET+="prefill-worker.output=type=image,push=true,compression=zstd,compression-level=22,oci-mediatypes=true"$'\n'
          if [ -n "$PROXY_HTTP" ]; then
            SET+="prefill-worker.args.HTTP_PROXY=${PROXY_HTTP}"$'\n'
            SET+="prefill-worker.args.HTTPS_PROXY=${PROXY_HTTPS}"$'\n'
            SET+="prefill-worker.args.NO_PROXY=${PROXY_NO_PROXY}"$'\n'
          fi
          {
            echo "set<<EOF"
            echo "$SET"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # Same composite action the release uses - so this exercises the identical
      # bake invocation, SBOM attestation and enrichment path.
      - name: Build and push prefill-worker
        uses: ./.github/actions/manual-docker-bake
        with:
          targets: prefill-worker
          set-lines: ${{ steps.bake.outputs.set }}
          syft-scanner-image: ${{ steps.tool-tags.outputs.syft-scanner-image }}
          oras-image: ${{ steps.tool-tags.outputs.oras-image }}
          retries: "2"
          retry-delay-seconds: "15"

name: "LLK harness release"

# Publishes the tt-llk Python test harness as a wheel when its VERSION file changes on main
# (tt_metal/tt-llk/docs/tests/getting_started.md, "Releasing the harness"). The wheel goes to ghcr.io as a private
# package of this repository; its visibility and readers are package settings an organisation admin sets once.
# A pull request or a manual run builds and verifies the wheel and publishes nothing.
on:
  push:
    branches:
      - main
    paths:
      - tt_metal/tt-llk/tests/python_tests/tt_llk_harness/VERSION
  pull_request:
    paths:
      - .github/workflows/llk-harness-release.yaml
      - tt_metal/tt-llk/tests/harness_wheel/**
      - tt_metal/tt-llk/tests/python_tests/tt_llk_harness/VERSION
  workflow_dispatch:

permissions:
  contents: read

# One release at a time, never cancelled, and in a group no pull request or branch run can displace it from.
concurrency:
  group: llk-harness-release-${{ github.event_name == 'push' && 'main' || github.ref }}
  cancel-in-progress: false

env:
  LLK_PATH: tt_metal/tt-llk
  VERSION_FILE: tt_metal/tt-llk/tests/python_tests/tt_llk_harness/VERSION

jobs:
  build-and-verify:
    name: "Build and verify"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.wheel.outputs.version }}
      wheel: ${{ steps.wheel.outputs.wheel }}
      sha256: ${{ steps.wheel.outputs.sha256 }}
    steps:
      # The whole tree: the fixture the wheel is verified with compiles against tt-metal's hw headers.
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2 cachew: keep
        timeout-minutes: 20
        with:
          fetch-depth: 1
          persist-credentials: false
      # The Python of the LLK image, which the harness and its pinned requirements are run on.
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.10'
      - name: Find the version before this push
        id: before
        if: ${{ github.event_name == 'push' }}
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          # The file as it was before the push; the new version must be greater. A commit that cannot be fetched
          # stops the release: only the file being absent from that commit makes this the first one.
          git fetch --quiet --depth=1 origin "$BEFORE"
          if [ -n "$(git ls-tree --name-only "$BEFORE" -- "$VERSION_FILE")" ]; then
            echo "version=$(git show "$BEFORE:$VERSION_FILE")" >> "$GITHUB_OUTPUT"
          else
            echo "No ${VERSION_FILE} at ${BEFORE}: this is the first release."
          fi
      - name: Install SFPI
        shell: bash
        run: ./${{ env.LLK_PATH }}/tests/install_sfpi.sh
      - name: Build the wheel
        id: wheel
        shell: bash
        env:
          RELEASE: ${{ github.event_name == 'push' }}
          BEFORE_VERSION: ${{ steps.before.outputs.version }}
        run: |
          set -euo pipefail
          options=(--out-dir dist)
          if [ "$RELEASE" = "true" ]; then
            options+=(--release)
            if [ -n "$BEFORE_VERSION" ]; then
              options+=(--after "$BEFORE_VERSION")
            fi
          fi
          # Sets the step's version, wheel and sha256 outputs.
          python3 "$LLK_PATH/tests/harness_wheel/make_wheel.py" "${options[@]}"
      - name: Verify the wheel in a new environment
        shell: bash
        run: ./${{ env.LLK_PATH }}/tests/harness_wheel/verify_wheel.sh dist/*.whl
      # The publish job's push and a suite's pull, to a directory instead of the registry: no credentials, and it
      # runs on pull requests.
      - name: Install ORAS
        uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3
      - name: Rehearse the push and the pull
        shell: bash
        env:
          WHEEL: ${{ steps.wheel.outputs.wheel }}
        run: |
          set -euo pipefail
          cp "$LLK_PATH/tests/requirements.txt" dist/requirements.txt
          (cd dist && oras push --oci-layout ../rehearsal:release,latest \
            --artifact-type application/vnd.tenstorrent.tt-llk-harness.v1 \
            "$WHEEL:application/zip" requirements.txt:text/plain)
          oras pull --oci-layout rehearsal:latest --output pulled
          cmp "dist/$WHEEL" "pulled/$WHEEL"
          cmp dist/requirements.txt pulled/requirements.txt

  publish:
    name: "Publish"
    needs: build-and-verify
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Deployments from main only, and whatever approval the environment asks for: the one place a release can be held.
    environment: llk-harness-release
    permissions:
      contents: read
      packages: write
    env:
      PACKAGE: ghcr.io/${{ github.repository }}/tt-llk-harness
      VERSION: ${{ needs.build-and-verify.outputs.version }}
      WHEEL: ${{ needs.build-and-verify.outputs.wheel }}
    steps:
      - name: Checkout tt-llk
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2 cachew: keep
        timeout-minutes: 20
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            tt_metal/tt-llk
          sparse-checkout-cone-mode: true
      # Built again rather than handed over as an Actions artifact, which any GitHub account could download: the
      # same commit gives the same bytes, so the digest says this is the wheel that was verified.
      - name: Build the verified wheel again
        shell: bash
        env:
          VERIFIED_SHA256: ${{ needs.build-and-verify.outputs.sha256 }}
        run: |
          set -euo pipefail
          python3 "$LLK_PATH/tests/harness_wheel/make_wheel.py" --release --out-dir dist
          echo "$VERIFIED_SHA256  dist/$WHEEL" | sha256sum --check
          cp "$LLK_PATH/tests/requirements.txt" dist/requirements.txt
      - name: Install ORAS
        uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3
      # Before anything is uploaded, and by status code: an answer that is neither "it is there" nor "it is not"
      # stops the release, with the answer printed.
      - name: Check the package and the version before publishing
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # A package that exists must not be public: a wheel pushed to it would be out before the check after.
          name="${GITHUB_REPOSITORY#*/}%2Ftt-llk-harness"
          status=$(curl -sS -o package.json -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "${GITHUB_API_URL}/orgs/${GITHUB_REPOSITORY_OWNER}/packages/container/${name}")
          case "$status" in
            404) echo "No tt-llk-harness package yet: this release creates it." ;;
            200) [ "$(jq -r .visibility package.json)" != public ] ||
              { echo "::error::The tt-llk-harness package is public. Set it to private in its settings."; exit 1; } ;;
            *) echo "::error::Could not read the package (HTTP $status): $(cat package.json)"; exit 1 ;;
          esac
          # A release is never replaced: suites pin a version and must keep getting the same bytes for it.
          token=$(curl -fsS -u "$GITHUB_ACTOR:$GH_TOKEN" \
            "https://ghcr.io/token?service=ghcr.io&scope=repository:${GITHUB_REPOSITORY}/tt-llk-harness:pull" | jq -r .token)
          status=$(curl -sS -o manifest.json -w '%{http_code}' -H "Authorization: Bearer $token" \
            -H "Accept: application/vnd.oci.image.manifest.v1+json" \
            "https://ghcr.io/v2/${GITHUB_REPOSITORY}/tt-llk-harness/manifests/${VERSION}")
          case "$status" in
            404) echo "$PACKAGE:$VERSION is not published yet." ;;
            200) echo "::error::$PACKAGE:$VERSION is already published. Raise the VERSION file."; exit 1 ;;
            *) echo "::error::Could not look up $PACKAGE:$VERSION (HTTP $status): $(cat manifest.json)"; exit 1 ;;
          esac
      - name: Publish the wheel
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "$GH_TOKEN" | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          cd dist
          oras push "$PACKAGE:$VERSION,latest" \
            --artifact-type application/vnd.tenstorrent.tt-llk-harness.v1 \
            --annotation "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --annotation "org.opencontainers.image.revision=${GITHUB_SHA}" \
            "$WHEEL:application/zip" \
            requirements.txt:text/plain
          echo "Published \`$WHEEL\` as \`$PACKAGE:$VERSION\`." >> "$GITHUB_STEP_SUMMARY"
      - name: Check that the package is not public
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          name="${GITHUB_REPOSITORY#*/}%2Ftt-llk-harness"
          if ! visibility=$(gh api "orgs/${GITHUB_REPOSITORY_OWNER}/packages/container/${name}" --jq .visibility); then
            echo "::warning::Could not read the visibility of the package. Check in its settings that it is private."
            exit 0
          fi
          echo "Package visibility: $visibility"
          if [ "$visibility" = "public" ]; then
            echo "::error::The tt-llk-harness package is public. Set it to private or internal in the package settings."
            exit 1
          fi

name: tt-llk SFPU corpus

on:
  pull_request:
    paths:
      - "tt_metal/tt-llk/tt_llk_*/common/inc/sfpu/**"
      - "tt_metal/tt-llk/tests/corpus/**"
      - ".github/workflows/tt-llk-sfpu-corpus.yaml"
  workflow_dispatch:

jobs:
  inventory-and-plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Reject SFPU inventory drift
        run: python3 tt_metal/tt-llk/tests/corpus/sfpu_corpus.py --validate
      - name: Materialize compile and CRAQ plans
        run: |
          python3 tt_metal/tt-llk/tests/corpus/sfpu_corpus.py --arch bh --list > sfpu-bh-plan.tsv
          python3 tt_metal/tt-llk/tests/corpus/sfpu_corpus.py --arch wh --list > sfpu-wh-plan.tsv
          python3 tt_metal/tt-llk/tests/corpus/sfpu_corpus.py --arch qsr --list > sfpu-qsr-plan.tsv
          test "$(wc -l < sfpu-bh-plan.tsv)" -eq 152
          test "$(wc -l < sfpu-wh-plan.tsv)" -eq 138
          test "$(wc -l < sfpu-qsr-plan.tsv)" -eq 42
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: sfpu-corpus-plans
          path: sfpu-*-plan.tsv

  compile-mapped-corpus:
    runs-on: tt-ubuntu-2204-large-stable
    strategy:
      matrix: {arch: [bh, wh, qsr]}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Provision pinned LLK compiler environment
        working-directory: tt_metal/tt-llk/tests
        run: CHIP_ARCH=${{ matrix.arch == 'bh' && 'blackhole' || matrix.arch == 'wh' && 'wormhole' || 'quasar' }} ./setup_testing_env.sh
      - name: Compile every mapped corpus module
        run: python3 tt_metal/tt-llk/tests/corpus/sfpu_corpus.py --mode compile --arch ${{ matrix.arch }} --execute --run-root sfpu-${{ matrix.arch }}-compile
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        if: always()
        with:
          name: sfpu-${{ matrix.arch }}-compile
          path: sfpu-${{ matrix.arch }}-compile

# CRAQ needs a pinned libttsim.so supplied by the simulator artifact workflow;
# silicon needs a serialized lab runner. Those resource-owning workflows call
# this runner and publish its run directory. Absence is a recorded skip, never
# a green performance run.

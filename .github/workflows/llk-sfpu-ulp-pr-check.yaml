name: "LLK SFPU ULP PR check"

# Called from PR Gate. Fails a change that makes an SFPU op less accurate on Wormhole or
# Blackhole, or that
# loosens a budget in tt_metal/tt-llk/tests/python_tests/helpers/sfpu_accuracy_budget_*.yaml.
#   changes  what the change touches against HEAD^1, and the card matrix.
#   select   (CPU) fails a loosened budget unless the PR changes only the tables (and the
#            acknowledgements in test_sfpu_accuracy_budget.py) and has the
#            `ulp-budget-raise-approved` label. Builds every sweep cell of each architecture at
#            HEAD^1 and HEAD and picks those whose loaded ELF bytes or table row differ
#            (helpers/ulp_affected.py); a change to this check picks every cell, so its card
#            jobs run before it merges.
#   sweep    (one card per architecture with a picked cell) runs them; any cell or `domains`
#            entry whose max ULP is above its table's fails
#            (tests/pipeline_reorg/llk_sfpu_ulp_pr_gate_tests.yaml).

on:
  workflow_call:
    inputs:
      docker-image:
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash # -eo pipefail: `diff | tee` must keep the diff's failure

env:
  TESTS: tt_metal/tt-llk/tests/python_tests
  # The SFPU kernels: each architecture's files named *sfpu*, or under a directory so named, in
  # tt-llk and in the metal LLK API. A change to the harness, the golden or SFPI alone is left
  # to the nightly sweep.
  KERNEL_PATHS: >-
    :(glob)tt_metal/tt-llk/tt_llk_wormhole_b0/**/*sfpu* :(glob)tt_metal/tt-llk/tt_llk_wormhole_b0/**/*sfpu*/**
    :(glob)tt_metal/tt-llk/tt_llk_blackhole/**/*sfpu* :(glob)tt_metal/tt-llk/tt_llk_blackhole/**/*sfpu*/**
    :(glob)tt_metal/hw/ckernels/wormhole_b0/**/*sfpu* :(glob)tt_metal/hw/ckernels/wormhole_b0/**/*sfpu*/**
    :(glob)tt_metal/hw/ckernels/blackhole/**/*sfpu* :(glob)tt_metal/hw/ckernels/blackhole/**/*sfpu*/**
  # The check itself: a change here runs every cell.
  CHECK_PATHS: .github/workflows/llk-sfpu-ulp-pr-check.yaml tests/pipeline_reorg/llk_sfpu_ulp_pr_gate_tests.yaml

jobs:
  changes:
    runs-on: ubuntu-slim
    timeout-minutes: 15
    outputs:
      kernels: ${{ steps.diff.outputs.kernels }}
      check: ${{ steps.diff.outputs.check }}
      tables: ${{ steps.diff.outputs.tables }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 2
          sparse-checkout: |
            .github
            tests/pipeline_reorg
      - id: diff
        # HEAD is the merge the PR proposes, or the queue's commit; HEAD^1 is what it lands on.
        run: |
          set -f # the pathspecs' globs are git's
          # shellcheck disable=SC2086
          if git diff --quiet HEAD^1 HEAD -- $CHECK_PATHS; then check=false; else check=true; fi
          tables=$(git diff --name-only HEAD^1 HEAD -- "$TESTS/helpers/sfpu_accuracy_budget_*.yaml" | xargs -r -n1 basename | xargs)
          # A changed table runs Budgets, and the cells whose row changed.
          # shellcheck disable=SC2086
          if [[ $check == false && -z $tables ]] && git diff --quiet HEAD^1 HEAD -- $KERNEL_PATHS; then kernels=false; else kernels=true; fi
          echo "kernels=$kernels" >> "$GITHUB_OUTPUT"
          echo "check=$check" >> "$GITHUB_OUTPUT"
          echo "tables=$tables" >> "$GITHUB_OUTPUT"
      - if: steps.diff.outputs.kernels == 'true'
        run: pip3 install PyYAML
      - id: matrix
        if: steps.diff.outputs.kernels == 'true'
        uses: tenstorrent/tt-metal/.github/actions/prepare-test-matrix@main
        with:
          tests-yaml: ./tests/pipeline_reorg/llk_sfpu_ulp_pr_gate_tests.yaml
          enabled-skus: ALL_SKUS_IN_TESTS
          sku-config: ./.github/sku_config.yaml
          event: ${{ github.event_name }}

  select:
    needs: changes
    if: needs.changes.outputs.kernels == 'true'
    runs-on: ${{ github.event_name == 'merge_group' && 'tt-ubuntu-2204-large-prio-stable' || 'tt-ubuntu-2204-large-stable' }}
    timeout-minutes: 45
    permissions:
      contents: read
      issues: read
    container:
      image: ${{ inputs.docker-image }}
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    env:
      ARCHES: wormhole blackhole
      TABLES: ${{ needs.changes.outputs.tables }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 2
      - id: label
        if: env.TABLES != ''
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          # Read when the job runs, so a re-run sees a label added after the push. A queue
          # branch names its PR: gh-readonly-queue/<base>/pr-<number>-<sha>.
          script: |
            const number = context.payload.pull_request?.number ??
              Number(/\/pr-(\d+)-/.exec(context.payload.merge_group?.head_ref ?? '')?.[1]);
            const labels = number ? await github.paginate(github.rest.issues.listLabelsOnIssue,
              { ...context.repo, issue_number: number }) : [];
            core.setOutput('raise', labels.some((l) => l.name === 'ulp-budget-raise-approved'));
      - name: Budgets
        working-directory: ${{ env.TESTS }}
        env:
          LABELLED: ${{ steps.label.outputs.raise }}
        run: |
          # The container's uid does not own the checkout; git refuses it without this.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          mkdir -p "$RUNNER_TEMP/base"
          for t in sfpu_accuracy_budget_wh.yaml sfpu_accuracy_budget_bh.yaml $TABLES; do
            git show "HEAD^1:$TESTS/helpers/$t" > "$RUNNER_TEMP/base/$t" 2> /dev/null || : > "$RUNNER_TEMP/base/$t"
          done
          [[ -z "$TABLES" ]] && exit 0
          allow=()
          # A raise that parks a cell as not measurable, or leaves an op on tolerance only,
          # must also edit the acknowledgements in test_sfpu_accuracy_budget.py.
          others=$(git diff --name-only HEAD^1 HEAD | grep -v -e '/sfpu_accuracy_budget_[a-z]*\.yaml$' \
            -e '^tt_metal/tt-llk/tests/hardware_free/accuracy/test_sfpu_accuracy_budget\.py$' || :)
          if [[ "$LABELLED" == true && -z "$others" ]]; then
            allow=(--allow-raises)
          fi
          status=0
          for t in $TABLES; do
            # 1: a budget loosened. 2: a table did not load, which --allow-raises never passes.
            python3 -m helpers.ulp_budget_diff diff --base "$RUNNER_TEMP/base/$t" --head "helpers/$t" "${allow[@]}" \
              | tee -a "$GITHUB_STEP_SUMMARY" || { s=$?; (( s > status )) && status=$s || :; }
          done
          case $status in
            1) echo "::error::A budget was loosened. A raise must be a PR that changes only the tables (and test_sfpu_accuracy_budget.py) and has the ulp-budget-raise-approved label; then re-run this job." ;;
            2) echo "::error::A budget table did not load (the report above says why); no label passes that." ;;
          esac
          exit "$status"
      - name: Build at HEAD^1
        working-directory: ${{ env.TESTS }}/..
        run: |
          echo "HEAD_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git checkout -q --detach HEAD^1
          # A cell the parent does not build reads as new and runs, so a failure here only costs card time.
          ./setup_testing_env.sh || echo "::warning::HEAD^1 did not set up; every cell runs."
          cd python_tests
          for arch in $ARCHES; do
            CHIP_ARCH=$arch RUNNER_TEMP="$GITHUB_WORKSPACE/ulp/$arch/base" \
              pytest -q -n auto -p no:cacheprovider --compile-producer --no-debug-symbols test_unary_sfpu_ulp.py \
              || echo "::warning::HEAD^1 did not build every $arch sweep cell; those run."
          done
      - name: Build at HEAD
        working-directory: ${{ env.TESTS }}/..
        run: |
          git checkout -q --detach "$HEAD_SHA"
          ./setup_testing_env.sh
          cd python_tests
          for arch in $ARCHES; do
            CHIP_ARCH=$arch RUNNER_TEMP="$GITHUB_WORKSPACE/ulp/$arch/head" \
              pytest -q -n auto -p no:cacheprovider --compile-producer --no-debug-symbols \
              --ulp-variants="$GITHUB_WORKSPACE/ulp/$arch/head/records.jsonl" test_unary_sfpu_ulp.py
          done
      - id: select
        working-directory: ${{ env.TESTS }}
        env:
          CHECK_CHANGED: ${{ needs.changes.outputs.check }}
          MATRIX: ${{ needs.changes.outputs.matrix }}
        run: |
          all=()
          [[ "$CHECK_CHANGED" == true ]] && all=(--all)
          picked=()
          for arch in $ARCHES; do
            ulp="$GITHUB_WORKSPACE/ulp/$arch" short="${arch:0:1}h" # wh, bh: the tables' and SKUs' prefix
            CHIP_ARCH=$arch python3 -m helpers.ulp_affected --records "$ulp/head/records.jsonl" \
              --base "$ulp/base/tt-llk-build" --head "$ulp/head/tt-llk-build" \
              --base-table "$RUNNER_TEMP/base/sfpu_accuracy_budget_$short.yaml" --nodes "$ulp/head/nodes.txt" \
              "${all[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
            [[ -s "$ulp/head/nodes.txt" ]] && picked+=("${short}_")
          done
          # The card legs of the architectures with a picked cell.
          echo "matrix=$(python3 -c 'import json, os, sys; print(json.dumps([g for g in json.loads(os.environ["MATRIX"]) if g["sku"][:3] in sys.argv[1:]]))' "${picked[@]}")" >> "$GITHUB_OUTPUT"
      - if: steps.select.outputs.matrix != '[]'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: llk-sfpu-ulp-pr-cells
          # Both architectures, so the artefact's root is ulp/.
          path: |
            ulp/*/head
            !ulp/*/head/**/obj/**
          include-hidden-files: true
          retention-days: 3

  sweep:
    needs: select
    if: needs.select.outputs.matrix != '[]'
    strategy:
      fail-fast: false
      matrix:
        test-group: ${{ fromJSON(needs.select.outputs.matrix) }}
    name: ${{ matrix.test-group.name }}
    runs-on: ${{ matrix.test-group.runs_on }}
    timeout-minutes: ${{ matrix.test-group.timeout }}
    container:
      image: ${{ inputs.docker-image }}
      options: "--rm --device /dev/tenstorrent --ulimit nofile=4096:4096"
    env:
      CHIP_ARCH: ${{ startsWith(matrix.test-group.sku, 'wh_') && 'wormhole' || 'blackhole' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: llk-sfpu-ulp-pr-cells
          path: ulp
      - name: Run the picked cells
        working-directory: tt_metal/tt-llk
        run: |
          # The harness reads its builds from $RUNNER_TEMP/tt-llk-build.
          mv "$GITHUB_WORKSPACE/ulp/$CHIP_ARCH/head/tt-llk-build" "$RUNNER_TEMP/"
          export ULP_SWEEP_NODES="$GITHUB_WORKSPACE/ulp/$CHIP_ARCH/head/nodes.txt"
          ${{ matrix.test-group.cmd }}

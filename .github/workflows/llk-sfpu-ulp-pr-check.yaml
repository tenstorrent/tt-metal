name: "LLK SFPU ULP PR check"

# Called from PR Gate. Fails a change that makes a Wormhole SFPU op less accurate, or that
# loosens a budget in tt_metal/tt-llk/tests/python_tests/helpers/sfpu_accuracy_budget_*.yaml.
#   changes  what the change touches against HEAD^1, and the card matrix.
#   select   (CPU) fails a loosened budget unless the PR changes only the tables and has the
#            `ulp-budget-raise-approved` label. Builds every sweep cell at HEAD^1 and HEAD and
#            picks those whose loaded ELF bytes or table row differ (helpers/ulp_affected.py).
#   sweep    (Wormhole card) runs the picked cells; any cell or `domains` entry whose max ULP
#            is above the table's fails (tests/pipeline_reorg/llk_sfpu_ulp_pr_gate_tests.yaml).
# Blackhole is swept nightly only (llk-sfpu-ulp-sweep.yaml): its pr_gate time budget is full.

on:
  workflow_call:
    inputs:
      docker-image:
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash # -eo pipefail: `diff | tee` must keep the diff's failure

env:
  TESTS: tt_metal/tt-llk/tests/python_tests
  # What the sweep's kernels are built from: the harness's include roots and the SFPI pin.
  KERNEL_PATHS: >-
    tt_metal/tt-llk tt_metal/hw/inc tt_metal/hw/ckernels/wormhole_b0 tt_metal/hostdevcommon/api
    ttnn/cpp/ttnn/operations/experimental tt_metal/sfpi-version
    .github/workflows/llk-sfpu-ulp-pr-check.yaml tests/pipeline_reorg/llk_sfpu_ulp_pr_gate_tests.yaml

jobs:
  changes:
    runs-on: ubuntu-slim
    timeout-minutes: 15
    outputs:
      kernels: ${{ steps.diff.outputs.kernels }}
      tables: ${{ steps.diff.outputs.tables }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 2
          sparse-checkout: |
            .github
            tests/pipeline_reorg
      - id: diff
        # HEAD is the merge the PR proposes, or the queue's commit; HEAD^1 is what it lands on.
        run: |
          # shellcheck disable=SC2086
          if git diff --quiet HEAD^1 HEAD -- $KERNEL_PATHS; then kernels=false; else kernels=true; fi
          tables=$(git diff --name-only HEAD^1 HEAD -- "$TESTS/helpers/sfpu_accuracy_budget_*.yaml" | xargs -r -n1 basename | xargs)
          echo "kernels=$kernels" >> "$GITHUB_OUTPUT"
          echo "tables=$tables" >> "$GITHUB_OUTPUT"
      - if: steps.diff.outputs.kernels == 'true'
        run: pip3 install PyYAML
      - id: matrix
        if: steps.diff.outputs.kernels == 'true'
        uses: tenstorrent/tt-metal/.github/actions/prepare-test-matrix@main
        with:
          tests-yaml: ./tests/pipeline_reorg/llk_sfpu_ulp_pr_gate_tests.yaml
          enabled-skus: ALL_SKUS_IN_TESTS
          sku-config: ./.github/sku_config.yaml
          event: ${{ github.event_name }}

  select:
    needs: changes
    if: needs.changes.outputs.kernels == 'true'
    runs-on: ${{ github.event_name == 'merge_group' && 'tt-ubuntu-2204-large-prio-stable' || 'tt-ubuntu-2204-large-stable' }}
    timeout-minutes: 45
    permissions:
      contents: read
      issues: read
    container:
      image: ${{ inputs.docker-image }}
    outputs:
      cells: ${{ steps.select.outputs.cells }}
    env:
      CHIP_ARCH: wormhole
      TABLES: ${{ needs.changes.outputs.tables }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 2
      - id: label
        if: env.TABLES != ''
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          # Read when the job runs, so a re-run sees a label added after the push. A queue
          # branch names its PR: gh-readonly-queue/<base>/pr-<number>-<sha>.
          script: |
            const number = context.payload.pull_request?.number ??
              Number(/\/pr-(\d+)-/.exec(context.payload.merge_group?.head_ref ?? '')?.[1]);
            const labels = number ? await github.paginate(github.rest.issues.listLabelsOnIssue,
              { ...context.repo, issue_number: number }) : [];
            core.setOutput('raise', labels.some((l) => l.name === 'ulp-budget-raise-approved'));
      - name: Budgets
        working-directory: ${{ env.TESTS }}
        env:
          LABELLED: ${{ steps.label.outputs.raise }}
        run: |
          # The container's uid does not own the checkout; git refuses it without this.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          mkdir -p "$RUNNER_TEMP/base"
          for t in sfpu_accuracy_budget_wh.yaml $TABLES; do
            git show "HEAD^1:$TESTS/helpers/$t" > "$RUNNER_TEMP/base/$t" 2> /dev/null || : > "$RUNNER_TEMP/base/$t"
          done
          [[ -z "$TABLES" ]] && exit 0
          allow=()
          if [[ "$LABELLED" == true && -z "$(git diff --name-only HEAD^1 HEAD | grep -v '/sfpu_accuracy_budget_[a-z]*\.yaml$')" ]]; then
            allow=(--allow-raises)
          fi
          status=0
          for t in $TABLES; do
            python3 -m helpers.ulp_budget_diff diff --base "$RUNNER_TEMP/base/$t" --head "helpers/$t" "${allow[@]}" \
              | tee -a "$GITHUB_STEP_SUMMARY" || status=1
          done
          if (( status )); then
            echo "::error::A budget was loosened. A raise must be a PR that changes only the tables and has the ulp-budget-raise-approved label; then re-run this job."
          fi
          exit "$status"
      - name: Build at HEAD^1
        working-directory: ${{ env.TESTS }}/..
        run: |
          echo "HEAD_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git checkout -q --detach HEAD^1
          # A cell the parent does not build reads as new and runs, so a failure here only costs card time.
          (./setup_testing_env.sh && cd python_tests && RUNNER_TEMP="$GITHUB_WORKSPACE/ulp/base" \
            pytest -q -n auto -p no:cacheprovider --compile-producer --no-debug-symbols test_unary_sfpu_ulp.py) \
            || echo "::warning::HEAD^1 did not build every sweep cell; those run."
      - name: Build at HEAD
        working-directory: ${{ env.TESTS }}/..
        run: |
          git checkout -q --detach "$HEAD_SHA"
          ./setup_testing_env.sh
          cd python_tests
          RUNNER_TEMP="$GITHUB_WORKSPACE/ulp/head" pytest -q -n auto -p no:cacheprovider --compile-producer --no-debug-symbols \
            --ulp-variants="$GITHUB_WORKSPACE/ulp/head/records.jsonl" test_unary_sfpu_ulp.py
      - id: select
        working-directory: ${{ env.TESTS }}
        run: |
          python3 -m helpers.ulp_affected --records "$GITHUB_WORKSPACE/ulp/head/records.jsonl" \
            --base "$GITHUB_WORKSPACE/ulp/base/tt-llk-build" --head "$GITHUB_WORKSPACE/ulp/head/tt-llk-build" \
            --base-table "$RUNNER_TEMP/base/sfpu_accuracy_budget_wh.yaml" --nodes "$GITHUB_WORKSPACE/ulp/head/nodes.txt" \
            | tee -a "$GITHUB_STEP_SUMMARY"
          echo "cells=$(wc -l < "$GITHUB_WORKSPACE/ulp/head/nodes.txt")" >> "$GITHUB_OUTPUT"
      - if: steps.select.outputs.cells != '0'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: llk-sfpu-ulp-pr-cells
          path: |
            ulp/head
            !ulp/head/**/obj/**
          include-hidden-files: true
          retention-days: 3

  sweep:
    needs: [changes, select]
    if: needs.select.outputs.cells != '0'
    strategy:
      fail-fast: false
      matrix:
        test-group: ${{ fromJSON(needs.changes.outputs.matrix) }}
    name: ${{ matrix.test-group.name }}
    runs-on: ${{ matrix.test-group.runs_on }}
    timeout-minutes: ${{ matrix.test-group.timeout }}
    container:
      image: ${{ inputs.docker-image }}
      options: "--rm --device /dev/tenstorrent --ulimit nofile=4096:4096"
    env:
      CHIP_ARCH: wormhole
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: llk-sfpu-ulp-pr-cells
          path: ulp
      - name: Run the picked cells
        working-directory: tt_metal/tt-llk
        run: |
          # The harness reads its builds from $RUNNER_TEMP/tt-llk-build.
          mv "$GITHUB_WORKSPACE/ulp/tt-llk-build" "$RUNNER_TEMP/"
          export ULP_SWEEP_NODES="$GITHUB_WORKSPACE/ulp/nodes.txt"
          ${{ matrix.test-group.cmd }}

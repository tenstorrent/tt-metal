name: "[internal] DFB repair loop"

# Runs every Quasar DataflowBuffer (DFB) test on the ttsim simulator. In repair and pr modes, the GitHub Copilot CLI
# with Claude Opus 5.5 tries to fix new failures. A fix is kept only if, applied to a clean copy, it makes the failing
# tests pass and no other test gets worse. The work itself is done by .github/dfb-repair/orchestrator.py.
#
# How a run starts:
#   - Nightly at 07:00 UTC, only while the repository variable DFB_REPAIR_NIGHTLY is "on" (or "true"). Its mode comes
#     from the DFB_REPAIR_MODE variable (default: report). Scheduled runs only start from the default branch.
#   - By hand from the Actions tab, with the mode picked there.
#   - On this workflow's own PR, for testing (the pull_request trigger below; remember to remove before merging).
#
# Modes: smoke (one Copilot request, no build), report (tests only, no AI), repair (AI fixes kept in the run's
# artifact), pr (also opens draft PRs).
#
# Safety: the AI runs in a throwaway container with a token that can only read the repository and make Copilot
# requests. Only the publish job can write to the repository, and it never runs the AI.

on:
  schedule:
    - cron: "0 7 * * *" # 02:00 Toronto in winter
  workflow_dispatch:
    inputs:
      mode:
        description: >-
          smoke (one Copilot request, no build), report (no model calls), repair (fixes kept as artifacts) or pr
          (also opens draft PRs)
        type: choice
        options: [smoke, report, repair, pr]
        default: report
      retry:
        description: "Group ids from the summary to forget and try again (space separated)"
        type: string
        default: ""
  # Until this workflow is on main (manual runs need it there), it runs on its own PR: the smoke check on each push,
  # the full loop in repair mode while the PR has the label dfb-repair-test, and one full run in pr mode (it opens
  # real draft PRs) each time the label dfb-repair-pr-mode is added. Remove this trigger before the PR merges.
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - .github/workflows/dfb-repair-nightly.yaml
      - .github/dfb-repair/**

permissions:
  contents: read

env:
  DFB_BRANCH_PREFIX: dfb-repair-bot
  MAX_PRS: 2

jobs:
  mode:
    # On the PR, adding any other label (bots add some) starts nothing; a nightly run starts nothing while the
    # DFB_REPAIR_NIGHTLY switch is off.
    if: >-
      github.repository == 'tenstorrent/tt-metal'
      && (github.event.action != 'labeled' || github.event.label.name == 'dfb-repair-test'
      || github.event.label.name == 'dfb-repair-pr-mode')
      && (github.event_name != 'schedule' || vars.DFB_REPAIR_NIGHTLY == 'on' || vars.DFB_REPAIR_NIGHTLY == 'true')
    runs-on: ubuntu-slim
    outputs:
      mode: ${{ steps.pick.outputs.mode }}
    steps:
      - name: Pick the mode
        id: pick
        env:
          EVENT: ${{ github.event_name }}
          INPUT: ${{ inputs.mode }}
          VARIABLE: ${{ vars.DFB_REPAIR_MODE }}
          FULL_TEST: ${{ contains(github.event.pull_request.labels.*.name, 'dfb-repair-test') }}
          PR_MODE_TEST: ${{ github.event.action == 'labeled' && github.event.label.name == 'dfb-repair-pr-mode' }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            mode=smoke
            [ "$FULL_TEST" = true ] && mode=repair
            [ "$PR_MODE_TEST" = true ] && mode="pr" # only on the event that adds the label: one run each time
          else
            mode=${INPUT:-${VARIABLE:-report}}
          fi
          case "$mode" in smoke | report | repair | pr) ;; *) echo "::error::unknown mode: $mode" && exit 1 ;; esac
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "Mode: $mode" >> "$GITHUB_STEP_SUMMARY"

  copilot-smoke:
    # A few minutes, no build: the loop's own agent check asks Claude Opus 5.5 through Copilot for one word with this
    # job's token, with the same command line and agent setup as an attempt, from the loop's runner and from a
    # GitHub-hosted one. It proves the model, the copilot-requests permission, the organization policy and usage, and
    # the loop runner's network path; if only the loop's runner fails, the step that failed shows whether an install or
    # the path to Copilot is the problem.
    needs: mode
    if: needs.mode.outputs.mode == 'smoke'
    strategy:
      fail-fast: false
      matrix:
        runner: [tt-ubuntu-2204-large-stable, ubuntu-latest]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      copilot-requests: write # the model call, billed to the organization's Copilot
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2 cachew: keep
        timeout-minutes: 20
        with:
          sparse-checkout: .github/dfb-repair
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Install the GitHub Copilot CLI (pinned)
        run: npm install --prefix "$RUNNER_TEMP/copilot-cli" @github/copilot@1.0.87

      - name: Ask Claude Opus 5.5 through Copilot for one word, the way the loop runs its agent
        env:
          COPILOT_GITHUB_TOKEN: ${{ github.token }}
          DFB_AGENT: copilot
        run: |
          python3 -c "import yaml" 2>/dev/null || python3 -m pip install --quiet --user pyyaml \
            || python3 -m pip install --quiet --user --break-system-packages pyyaml
          mkdir -p "$RUNNER_TEMP/dfb-check"
          DFB_COPILOT_BIN="$RUNNER_TEMP/copilot-cli/node_modules/@github/copilot-linux-x64/copilot" \
            python3 .github/dfb-repair/orchestrator.py --agent-check --root "$RUNNER_TEMP/dfb-check" \
            --tool-dir .github/dfb-repair

  fetch-ttsim:
    needs: mode
    if: needs.mode.outputs.mode != 'smoke'
    runs-on: ubuntu-slim
    concurrency:
      group: ttsim-lib-${{ github.run_id }}-libttsim_qsr.so
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        timeout-minutes: 20
        with:
          sparse-checkout: |
            .github/actions/fetch-ttsim
            tt_metal/ttsim-version
          sparse-checkout-cone-mode: false
      - uses: ./.github/actions/fetch-ttsim
        timeout-minutes: 10
        with:
          lib: libttsim_qsr.so

  dfb-repair:
    needs: [mode, fetch-ttsim]
    # ttsim needs no tt-card; the build and the test runs are CPU-bound, so use a large CPU runner. No job
    # container: the loop runs in its own throwaway containers (below).
    runs-on: tt-ubuntu-2204-large-stable
    timeout-minutes: 480 # JOB_MINUTES below
    # One loop at a time (one per PR while it is tested there): runs share the state and the build cache.
    concurrency:
      group: dfb-repair-loop-${{ github.event.pull_request.number || 'main' }}
      cancel-in-progress: false
    permissions:
      contents: read
      copilot-requests: write
    env:
      MODE: ${{ needs.mode.outputs.mode }}
      IMAGE: ghcr.io/tenstorrent/tt-metal/tt-metalium/ubuntu-22.04-dev-amd64:latest
      JOB_MINUTES: 480 # the same as timeout-minutes: the loop's deadline is fitted to it
    outputs:
      queued: ${{ steps.loop.outputs.queued }}
    steps:
      - name: Note when the job started
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      # Only what this job runs itself: the ttsim setup and the loop's tooling. The loop clones its own tree.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2 cachew: keep
        timeout-minutes: 20
        with:
          sparse-checkout: |
            .github
            tt_metal/ttsim-version
            tt_metal/soc_descriptors
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Set up ttsim
        uses: ./.github/actions/setup-ttsim
        timeout-minutes: 5
        with:
          sku: sim_quasar
          root: ${{ github.workspace }} # a host path: this job has no container

      - name: Prepare the loop
        run: |
          LOOP_ROOT=$RUNNER_TEMP/dfb-loop
          echo "LOOP_ROOT=$LOOP_ROOT" >> "$GITHUB_ENV"
          echo "RUN_DIR=$LOOP_ROOT/runs/$GITHUB_RUN_ID" >> "$GITHUB_ENV"
          mkdir -p "$LOOP_ROOT/runs" "$RUNNER_TEMP/ttsim" "$RUNNER_TEMP/dfb-tool"
          mv "$GITHUB_WORKSPACE/sim/"* "$RUNNER_TEMP/ttsim/"
          # The loop stops if main has moved to another ttsim version since this checkout.
          cp "$GITHUB_WORKSPACE/tt_metal/ttsim-version" "$RUNNER_TEMP/ttsim/ttsim-version"
          cp -r "$GITHUB_WORKSPACE/.github/dfb-repair/." "$RUNNER_TEMP/dfb-tool/"
          # The loop and its agent work in their own clone, never in this workspace, which the runner reuses. It holds
          # main only, so no other branch (a fix that is not merged yet, say) is in the agent's history.
          git clone -q --filter=blob:none --single-branch --branch main "https://github.com/${GITHUB_REPOSITORY}.git" \
            "$LOOP_ROOT/tt-metal"
          git -C "$LOOP_ROOT/tt-metal" config user.name "github-actions[bot]"
          git -C "$LOOP_ROOT/tt-metal" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Starts the loop in a throwaway container: only the variables and mounts listed here reach it, it runs as
          # this runner's user, and the token for the agent is passed only when the step sets it.
          cat > "$RUNNER_TEMP/run-loop.sh" <<'EOF'
          #!/bin/bash
          key=()
          [ -n "${COPILOT_GITHUB_TOKEN:-}" ] && key=(-e COPILOT_GITHUB_TOKEN)
          exec docker run --rm --init --network host --user "$(id -u):$(id -g)" "${key[@]}" \
            --label "dfb-loop=$GITHUB_RUN_ID" --ulimit core=0 \
            -e HTTP_PROXY -e HTTPS_PROXY -e NO_PROXY -e http_proxy -e https_proxy -e no_proxy \
            -e HOME=/tmp/home -e DFB_BRANCH_PREFIX -e DFB_HANDLED -e DFB_RETRY -e DFB_AGENT=copilot \
            -e DFB_COPILOT_BIN="$LOOP_ROOT/copilot-cli/node_modules/@github/copilot-linux-x64/copilot" \
            -e DFB_PUSH_URL="https://github.com/${GITHUB_REPOSITORY}.git" \
            -v "$LOOP_ROOT:$LOOP_ROOT" -v "$RUNNER_TEMP/ttsim:/ttsim:ro" -v "$RUNNER_TEMP/dfb-tool:/dfb-tool:ro" \
            -w "$LOOP_ROOT" "$IMAGE" \
            bash -c 'mkdir -p "$HOME" && git config --global --add safe.directory "*" &&
                     { python3 -c "import yaml" 2>/dev/null || python3 -m pip install --quiet --user pyyaml; } &&
                     exec python3 /dfb-tool/orchestrator.py "$@"' loop \
            --root "$LOOP_ROOT" --tool-dir /dfb-tool --sim-dir /ttsim --no-carry --own-pid-namespace "$@"
          EOF
          docker pull --quiet "$IMAGE" # the current dev image, not whatever this runner pulled before

      # Earlier nights' state and saved fixes, so a failure is not given to the model again every night. Repair-mode
      # test runs on the PR start fresh, so each one tries the failures again; pr-mode test runs keep it, like nightly
      # runs.
      - name: Restore the loop's state
        if: github.event_name != 'pull_request' || env.MODE == 'pr'
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ${{ runner.temp }}/dfb-loop/state.json
            ${{ runner.temp }}/dfb-loop/runs/*/fixes
          key: dfb-repair-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: dfb-repair-state-

      - name: Restore the build cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ runner.temp }}/dfb-loop/ccache
          key: dfb-repair-ccache-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: dfb-repair-ccache-

      # The build cache is saved only from a run without the agent, so the agent can never put objects into it.
      - name: Build and test once without the agent
        if: env.MODE != 'report'
        run: |
          bash "$RUNNER_TEMP/run-loop.sh" --mode report --run-dir "$LOOP_ROOT/runs/warmup-$GITHUB_RUN_ID" \
            --state "$LOOP_ROOT/warmup-state.json" || true
          find "$LOOP_ROOT/ccache" -type l -delete 2>/dev/null || true

      - name: Save the build cache
        if: env.MODE != 'report'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ runner.temp }}/dfb-loop/ccache
          key: dfb-repair-ccache-${{ github.run_id }}-${{ github.run_attempt }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: env.MODE != 'report'
        with:
          node-version: "22"

      - name: Install the GitHub Copilot CLI (pinned)
        if: env.MODE != 'report'
        # Its copilot binary is native, so it also runs in the loop's container, which has no Node.
        run: npm install --prefix "$LOOP_ROOT/copilot-cli" @github/copilot@1.0.87

      - name: Run the loop
        id: loop
        env:
          COPILOT_GITHUB_TOKEN: ${{ env.MODE != 'report' && github.token || '' }}
          DFB_HANDLED: ${{ vars.DFB_REPAIR_HANDLED }} # group ids people have taken over
          DFB_RETRY: ${{ inputs.retry }}
        run: |
          # Old saved fixes. A restored runs/<id> gets the restore time, so go by its fixes directory.
          find "$LOOP_ROOT/runs" -mindepth 2 -maxdepth 2 -name fixes -type d -mtime +30 -printf '%h\0' \
            | xargs -0 -r rm -rf
          # What is left of the job, less an hour for the loop to finish and for the steps after it.
          budget=$(( JOB_MINUTES - ($(date +%s) - JOB_START) / 60 - 60 ))
          [ "$budget" -ge 60 ] || budget=60
          extra=(--deadline-minutes "$budget")
          [ "$MODE" = pr ] && extra+=(--outbox "$RUN_DIR/outbox")
          set +e
          bash "$RUNNER_TEMP/run-loop.sh" --mode "$MODE" --run-dir "$RUN_DIR" "${extra[@]}"
          rc=$?
          set -e
          # The loop's files are data from here on: no links, and Python ignores the directories it runs from.
          find "$LOOP_ROOT/runs" "$LOOP_ROOT/state.json" -type l -delete 2>/dev/null || true
          cd "$RUNNER_TEMP"
          queued=$(python3 -I -c 'import json, sys
          s = json.load(open(sys.argv[1]))
          print(sum(1 for g in s["groups"] if (g.get("fix") or {}).get("queued")))' "$RUN_DIR/summary.json" \
            2>/dev/null || echo 0)
          echo "queued=$queued" >> "$GITHUB_OUTPUT"
          # 0: no new failures or all fixed; 1: failures remain (in the summary); anything else, or no summary: the
          # night could not judge the tests. Only that fails the job, so a pending handoff does not turn nights red.
          case $rc in 0|1) test -f "$RUN_DIR/summary.json" ;; *) false ;; esac

      - name: Stop the loop's container
        if: always()
        timeout-minutes: 3
        run: docker ps -q --filter "label=dfb-loop=$GITHUB_RUN_ID" | xargs -r docker stop -t 90 || true

      - name: Remove links and the job token from everything that is saved
        id: redact
        if: always()
        env:
          KEY: ${{ github.token }}
        run: |
          find "$LOOP_ROOT/runs" "$LOOP_ROOT/state.json" -type l -delete 2>/dev/null || true
          cd "$RUNNER_TEMP"
          python3 -I - "$LOOP_ROOT" <<'EOF'
          import os, pathlib, sys
          key = os.environ.get("KEY", "").encode()
          root = pathlib.Path(sys.argv[1])
          for p in [root / "state.json", *(root / "runs").rglob("*")]:
              if key and p.is_file() and not p.is_symlink():
                  data = p.read_bytes()
                  if key in data:
                      p.write_bytes(data.replace(key, b"[redacted]"))
          EOF

      - name: Save the loop's state
        if: always() && steps.redact.outcome == 'success' && (github.event_name != 'pull_request' || env.MODE == 'pr')
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ${{ runner.temp }}/dfb-loop/state.json
            ${{ runner.temp }}/dfb-loop/runs/*/fixes
          key: dfb-repair-state-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save the build cache in report mode, where no agent ran
        if: always() && env.MODE == 'report'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ runner.temp }}/dfb-loop/ccache
          key: dfb-repair-ccache-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Job summary
        if: always() && steps.redact.outcome == 'success'
        run: cat "$RUN_DIR/summary.md" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      - name: Upload the run's logs, attempts and fixes
        if: always() && steps.redact.outcome == 'success'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: dfb-repair-run-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/dfb-loop/runs/${{ github.run_id }}
            !${{ runner.temp }}/dfb-loop/runs/${{ github.run_id }}/**/cache*
          retention-days: 14

  publish:
    # Pushes the fixes the loop queued and opens draft PRs. It never runs the agent, so only this job can write, and it
    # checks every entry again because the artifact was written next to the agent.
    needs: [mode, dfb-repair]
    if: >-
      always() && needs.dfb-repair.result != 'cancelled' && needs.mode.outputs.mode == 'pr'
      && needs.dfb-repair.outputs.queued != '' && needs.dfb-repair.outputs.queued != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # create the fix branches
      pull-requests: write # open the draft PRs
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0 # to check that each fix's base is on main
          filter: blob:none

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dfb-repair-run-${{ github.run_id }}
          path: ${{ runner.temp }}/dfb-run

      - name: Check and publish each queued fix
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.DFB_REPAIR_PR_TOKEN || github.token }}
        run: |
          python3 -c "import yaml" 2>/dev/null || python3 -m pip install --quiet --user pyyaml \
            || python3 -m pip install --quiet --user --break-system-packages pyyaml
          # The guards come from this job's own checkout of main, copied before any fix is applied.
          cp -r .github/dfb-repair "$RUNNER_TEMP/dfb-tool"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          run="$RUNNER_TEMP/dfb-run"
          find "$run" -type l -delete
          python3 -I - "$run/summary.json" > "$RUNNER_TEMP/queue.txt" <<'EOF'
          import json, sys
          for g in json.load(open(sys.argv[1])).get("groups", []):
              branch = (g.get("fix") or {}).get("queued")
              if branch:
                  print(g["gid"], branch)
          EOF
          n=0
          while read -r gid branch <&3; do # the queue is on fd 3, so nothing in the loop can read it by accident
            d="$run/outbox/$gid"
            if [ "$n" -ge "$MAX_PRS" ]; then
              echo "$gid: the PR limit for this run was reached; a later night queues it again"
              continue
            fi
            if ! [[ "$gid" =~ ^[0-9a-f]{10}$ && "$branch" =~ ^${DFB_BRANCH_PREFIX}/[0-9]{8}-${gid}$ ]] \
                || [ "$(cat "$d/branch.txt" 2>/dev/null)" != "$branch" ]; then
              echo "::warning::$gid: malformed queue entry; skipped"
              continue
            fi
            if git ls-remote --exit-code --heads origin "$branch" > /dev/null; then
              echo "$gid: $branch is already on origin (a re-run?); skipped"
              continue
            fi
            base=$(cat "$d/base.txt")
            if ! git merge-base --is-ancestor "$base" origin/main; then
              echo "::warning::$gid: its base is not on main; skipped"
              continue
            fi
            git checkout -q -B "$branch" "$base"
            if ! git apply --index "$d/patch.diff"; then
              git reset -q --hard "$base"
              echo "::warning::$gid: the patch does not apply to its base; skipped"
              continue
            fi
            # The guards run on exactly what is committed below, with this job's own copy of them.
            git diff --cached --binary > "$RUNNER_TEMP/applied.diff"
            if ! python3 "$RUNNER_TEMP/dfb-tool/orchestrator.py" --check-patch "$RUNNER_TEMP/applied.diff" \
                --base "$base" --checkout . --tool-dir "$RUNNER_TEMP/dfb-tool"; then
              git reset -q --hard "$base"
              echo "::warning::$gid: the guards reject this patch; skipped"
              continue
            fi
            # Commit, title and body are made here: the bot is the author, and the text is cleaned again.
            for f in message.txt title.txt pr_body.md; do
              cp "$d/$f" "$RUNNER_TEMP/$f"
              python3 "$RUNNER_TEMP/dfb-tool/orchestrator.py" --sanitize-file "$RUNNER_TEMP/$f"
            done
            git commit -q --no-verify -F "$RUNNER_TEMP/message.txt"
            git push -q --force-with-lease="refs/heads/$branch:" origin "HEAD:refs/heads/$branch" # create only
            if ! gh pr create --draft --base main --head "$branch" --title "$(head -c 200 "$RUNNER_TEMP/title.txt")" \
                --body-file "$RUNNER_TEMP/pr_body.md" >> "$GITHUB_STEP_SUMMARY"; then
              # GitHub refused the PR (for example, Actions may not open PRs here): keep the branch and give the link
              # to GitHub's PR form, which fills in the title and description from the branch's one commit, and the
              # link to the branch, where its bin icon deletes it.
              link="https://github.com/$GITHUB_REPOSITORY/compare/main...$branch?expand=1"
              drop="https://github.com/$GITHUB_REPOSITORY/branches/all?query=$branch"
              {
                printf -- '- %s: GitHub did not let the bot open the PR.\n' "$gid"
                printf -- '  - Open it as a draft: %s\n' "$link"
                printf -- '  - Or drop the fix: delete its branch with the bin icon here: %s\n' "$drop"
              } >> "$GITHUB_STEP_SUMMARY"
              echo "::warning::$gid: GitHub did not let the bot open the PR. Open it: $link or delete the branch: $drop"
            fi
            n=$((n + 1))
          done 3< "$RUNNER_TEMP/queue.txt"

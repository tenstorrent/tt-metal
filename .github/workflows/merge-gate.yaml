name: Merge Gate
# This pipeline is the minimum bar a PR must pass before it can pass the merge queue.
# It is intended to be relatively fast and lightweight that the delay between completing
# a PR and having the changes available on main is not onerous.

# Requirements for all jobs in this workflow:
# - End-to-end (excluding wait times for runners) must be less than 15mins.
#   This includes the cost of checking out the code, preparing a runner, etc.
# - Individual test cases must be less than 5s.

run-name: >-
  ${{ github.event_name == 'merge_group' && github.event.action == 'destroyed' && github.event.reason == 'merged' && format('[Merge Queue] 🎯 Merged {0}', github.sha) ||
      github.event_name == 'merge_group' && github.event.action == 'destroyed' && github.event.reason == 'dequeued' && format('[Merge Queue] ↩️ Dequeued {0}', github.sha) ||
      github.event_name == 'merge_group' && github.event.action == 'destroyed' && github.event.reason == 'invalidated' && format('[Merge Queue] 💔 Invalidated {0}', github.sha) ||
      github.event_name == 'merge_group' && github.event.action == 'destroyed' && format('[Merge Queue] {0} {1}', github.event.reason, github.sha) ||
      github.event_name == 'merge_group' && format('[Merge Queue] 💫 Processing {0}: {1}', github.actor, github.sha) ||
      '' }}

on:
  workflow_dispatch:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  merge_group:
    types:
      - checks_requested
      - destroyed
  push:
    branches:
      - main # Builds on main will populate the shared ccache to speed up builds on branches

concurrency:
  # Groups to control cancelling of obsolete runs.
  # main (or any protected branch): run_id (ie: never cancel other jobs)
  # PRs: PR #
  # Merge Queue: branch name; will be paired with the 'destroyed' trigger to cause a cancel when it leaves or moves in the queue.
  #              See https://github.com/orgs/community/discussions/137976#discussioncomment-14004793
  # All others: branch name (ie: one run per branch)
  group: >-
    ${{ github.workflow }}-
    ${{ (github.ref_protected && github.run_id)
        || github.event.pull_request.number
        || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  checks: write
  packages: write
  # The producer downloads the artifact via REST; a called workflow only downgrades.
  actions: read

jobs:
  llk-perf-merge-gate-changes:
    name: LLK perf merge gate (changes)
    if: ${{
        github.event.action != 'destroyed' &&
        (github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch')
      }}
    runs-on: ubuntu-slim
    outputs:
      changed: ${{ steps.classify.outputs.changed }}
      # The gate's thresholds, for the compare job and for stage 2 in the Blackhole legs.
      thresholds: ${{ steps.policy.outputs.merge }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2 cachew: keep
        timeout-minutes: 20
        with:
          fetch-depth: 0
          filter: tree:0
          sparse-checkout: |
            .github
            tt_metal/tt-llk/perf/gate_policy.json
      - name: Read the gate policy
        id: policy
        run: echo "merge=$(python3 -c 'import json; print(json.dumps(json.load(open("tt_metal/tt-llk/perf/gate_policy.json"))["merge"]))')" >> "$GITHUB_OUTPUT"
      - name: Classify this entry's own changes
        id: classify
        env:
          # In the queue, base..head holds only this entry; the entries in front are in the base.
          BASE: ${{ github.event.merge_group.base_sha }}
        run: |
          BASE=${BASE:-$(git merge-base origin/main HEAD)}
          CHANGED=$(git diff --name-only --diff-filter=ACMRT "$BASE" HEAD | .github/scripts/llk-perf-inputs-changed.sh)
          echo "LLK perf inputs changed in ${BASE}..$(git rev-parse HEAD): ${CHANGED}"
          echo "changed=${CHANGED}" >> "$GITHUB_OUTPUT"

  llk-perf-merge-gate-measure:
    name: LLK perf merge gate (measure)
    needs: [llk-perf-merge-gate-changes]
    if: needs.llk-perf-merge-gate-changes.outputs.changed == 'true'
    uses: ./.github/workflows/llk-perf-impl.yaml
    with:
      architecture: all
      tests-yaml: ./tests/pipeline_reorg/llk_perf_merge_gate_tests.yaml
      compile-quasar: false
      speed-of-light: false
      perf-run-types: L1_TO_L1
      pipeline: merge_baseline
      upload-to-warehouse: false
      stage2-baseline-ref: ${{ github.event.merge_group.base_sha || github.sha }}
      stage2-thresholds: >-
        ${{ format('{{"blackhole": {0}, "wormhole": {1}}}',
            toJSON(fromJSON(needs.llk-perf-merge-gate-changes.outputs.thresholds).blackhole),
            toJSON(fromJSON(needs.llk-perf-merge-gate-changes.outputs.thresholds).wormhole)) }}
    secrets: inherit

  llk-perf-merge-gate-stage2-plan:
    name: "LLK perf merge gate (stage 2: pick the tests)"
    needs: [llk-perf-merge-gate-changes, llk-perf-merge-gate-measure]
    if: ${{ !cancelled() && needs.llk-perf-merge-gate-measure.result == 'success' }}
    runs-on: ubuntu-slim
    outputs:
      arches: ${{ steps.plan.outputs.arches }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2 cachew: keep
        timeout-minutes: 20
        with:
          sparse-checkout: |
            tt_metal/tt-llk/perf
            tt_metal/tt-llk/tests/python_tests/helpers/perf
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.10'
      - run: pip install pandas
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        continue-on-error: true
        with:
          name: llk-perf-stage2-baseline
          path: baseline
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        continue-on-error: true
        with:
          pattern: perf-data-blackhole-?
          merge-multiple: true
          path: current/blackhole
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        continue-on-error: true
        with:
          pattern: perf-data-wormhole-?
          merge-multiple: true
          path: current/wormhole
      - name: Pick the tests
        id: plan
        env:
          THRESHOLDS: ${{ needs.llk-perf-merge-gate-changes.outputs.thresholds }}
          # As in the PR gate: one placement leg measures about 1,000 tests in 5 minutes after a 3-minute start.
          CAP: "8000"
        run: |
          ARCHES=()
          for ARCH in blackhole wormhole; do
            [ -f "baseline/${ARCH}/baseline.csv" ] || continue
            policy() { python3 -c 'import json, os, sys; print(json.loads(os.environ["THRESHOLDS"])[sys.argv[1]][sys.argv[2]])' "$ARCH" "$1"; }
            mkdir -p "nodes/${ARCH}"
            # The same comparison as the gate job's, so stage 2 judges exactly the gate's stage-1 regressions.
            python3 tt_metal/tt-llk/perf/regression_compare.py \
              --threshold "$(policy threshold)" --min-cycles "$(policy min_cycles)" \
              --module-threshold "$(policy module_thresholds)" \
              --current "current/${ARCH}/**/*.csv" --baseline "baseline/${ARCH}/**/*.csv" \
              --run-types L1_TO_L1 --arch "$ARCH" --report "nodes/${ARCH}/stage1.md" > /dev/null || true
            [ -s "nodes/${ARCH}/stage1.regressions.csv" ] || continue
            python3 tt_metal/tt-llk/perf/placement_check.py nodes \
              --candidates "nodes/${ARCH}/stage1.regressions.csv" \
              --map "current/${ARCH}/**/*.windowhash" --cap "$CAP" --out "nodes/${ARCH}/nodes.txt"
            [ -s "nodes/${ARCH}/nodes.txt" ] && ARCHES+=("\"${ARCH}\"")
          done
          echo "arches=[$(IFS=,; echo "${ARCHES[*]}")]" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        if: hashFiles('nodes/blackhole/nodes.txt') != ''
        with:
          name: placement-nodes-blackhole
          path: nodes/blackhole/
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        if: hashFiles('nodes/wormhole/nodes.txt') != ''
        with:
          name: placement-nodes-wormhole
          path: nodes/wormhole/

  llk-perf-merge-gate-stage2-head:
    name: "LLK perf merge gate (stage 2: the entry on ${{ matrix.arch }})"
    needs: llk-perf-merge-gate-stage2-plan
    if: ${{ !cancelled() && needs.llk-perf-merge-gate-stage2-plan.outputs.arches != '[]' && needs.llk-perf-merge-gate-stage2-plan.outputs.arches != '' }}
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(needs.llk-perf-merge-gate-stage2-plan.outputs.arches) }}
    uses: ./.github/workflows/llk-perf-impl.yaml
    with:
      architecture: ${{ matrix.arch }}
      ref: ${{ github.sha }}
      artifact-suffix: "-head-placement"
      speed-of-light: false
      perf-run-types: L1_TO_L1
      tests-yaml: ./tests/pipeline_reorg/llk_perf_placement_tests.yaml
      node-list-artifact: placement-nodes-${{ matrix.arch }}
      compile-quasar: false
      upload-to-warehouse: false
      pipeline: merge_baseline
    secrets: inherit

  llk-perf-merge-gate-stage2-base:
    name: "LLK perf merge gate (stage 2: the queue base on ${{ matrix.arch }})"
    needs: llk-perf-merge-gate-stage2-plan
    if: ${{ !cancelled() && needs.llk-perf-merge-gate-stage2-plan.outputs.arches != '[]' && needs.llk-perf-merge-gate-stage2-plan.outputs.arches != '' }}
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(needs.llk-perf-merge-gate-stage2-plan.outputs.arches) }}
    uses: ./.github/workflows/llk-perf-impl.yaml
    with:
      architecture: ${{ matrix.arch }}
      ref: 43909bca9104b33801fc0c94538055ca3e07a64d
      artifact-suffix: "-base-placement"
      speed-of-light: false
      perf-run-types: L1_TO_L1
      tests-yaml: ./tests/pipeline_reorg/llk_perf_placement_tests.yaml
      node-list-artifact: placement-nodes-${{ matrix.arch }}
      compile-quasar: false
      upload-to-warehouse: false
      pipeline: merge_baseline
    secrets: inherit

  llk-perf-merge-gate-stage2-decide:
    name: "LLK perf merge gate (stage 2: decide on ${{ matrix.arch }})"
    needs: [llk-perf-merge-gate-changes, llk-perf-merge-gate-stage2-plan, llk-perf-merge-gate-stage2-head, llk-perf-merge-gate-stage2-base]
    if: ${{ !cancelled() && needs.llk-perf-merge-gate-stage2-plan.outputs.arches != '[]' && needs.llk-perf-merge-gate-stage2-plan.outputs.arches != '' }}
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(needs.llk-perf-merge-gate-stage2-plan.outputs.arches) }}
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2 cachew: keep
        timeout-minutes: 20
        with:
          sparse-checkout: |
            tt_metal/tt-llk/perf
            tt_metal/tt-llk/tests/python_tests/helpers/perf
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.10'
      - run: pip install pandas
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: placement-nodes-${{ matrix.arch }}
          path: nodes
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: llk-perf-stage2-baseline
          path: gate-baseline
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        continue-on-error: true
        with:
          pattern: perf-data-${{ matrix.arch }}-*-head-placement
          merge-multiple: true
          path: current
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        continue-on-error: true
        with:
          pattern: perf-data-${{ matrix.arch }}-*-base-placement
          merge-multiple: true
          path: baseline
      - name: Decide
        env:
          ARCH: ${{ matrix.arch }}
          THRESHOLD: ${{ fromJSON(needs.llk-perf-merge-gate-changes.outputs.thresholds)[matrix.arch].threshold }}
          MIN_CYCLES: ${{ fromJSON(needs.llk-perf-merge-gate-changes.outputs.thresholds)[matrix.arch].min_cycles }}
          MODULE_THRESHOLDS: ${{ fromJSON(needs.llk-perf-merge-gate-changes.outputs.thresholds)[matrix.arch].module_thresholds }}
        run: |
          mkdir -p current baseline out
          python3 -c 'import json, sys; print(json.load(open(sys.argv[1])).get("commit_sha", ""))' \
            "gate-baseline/${ARCH}/baseline_metadata.json" > out/stage2.base
          # The positions both sides measured at: the one list, in run_llk_perf_placement.sh.
          SHIFTS=$(git show HEAD:tt_metal/tt-llk/tests/run_llk_perf_placement.sh | sed -n 's/.*LLK_CODE_SHIFTS:-\([0-9 ]*\).*/\1/p')
          # A side that measured nothing leaves its rows "not re-measured", which the gate job counts as blocking.
          python3 tt_metal/tt-llk/perf/placement_check.py decide \
            --candidates nodes/stage1.regressions.csv --baseline baseline --current current \
            --threshold "$THRESHOLD" --min-cycles "$MIN_CYCLES" --module-threshold "$MODULE_THRESHOLDS" \
            --over-cap nodes/nodes.over --positions "$SHIFTS" --arch "$ARCH" --report out/stage2.md || true
          cat out/stage2.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: llk-perf-stage2-${{ matrix.arch }}-1
          path: out/stage2.*
          if-no-files-found: ignore

  llk-perf-merge-gate:
    name: LLK perf merge gate (${{ matrix.arch }})
    needs: [llk-perf-merge-gate-changes, llk-perf-merge-gate-measure, llk-perf-merge-gate-stage2-decide]
    if: always() && !cancelled() && needs.llk-perf-merge-gate-changes.outputs.changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        arch: [blackhole, wormhole]
    uses: ./.github/workflows/llk-perf-gate-impl.yaml
    with:
      arch: ${{ matrix.arch }}
      gate_name: LLK perf merge gate
      baseline_pipeline: merge_baseline
      baseline_match_ref: ${{ github.event.merge_group.base_sha || github.sha }}
      # No wait, so the queue never waits for the warehouse: a missing baseline
      # falls back to the newest older one in the base's history, marked stale.
      baseline_wait_minutes: "0"
      speed_of_light: "false"
      run_types: L1_TO_L1
      threshold: ${{ fromJSON(needs.llk-perf-merge-gate-changes.outputs.thresholds)[matrix.arch].threshold }}
      module_thresholds: ${{ fromJSON(needs.llk-perf-merge-gate-changes.outputs.thresholds)[matrix.arch].module_thresholds }}
      min_cycles: ${{ fromJSON(needs.llk-perf-merge-gate-changes.outputs.thresholds)[matrix.arch].min_cycles }}
      measure_result: ${{ needs.llk-perf-merge-gate-measure.result }}
      # The measuring legs only: stage 2's placement data in this run must not count as stage 1.
      current_artifact_pattern: perf-data-${{ matrix.arch }}-?
      # Stage 2 and the gate compare against the same baseline read; without it, the gate reads the warehouse.
      stage2_baseline_artifact: llk-perf-stage2-baseline
      # A regression is report-only, stage 2 included. A measurement that did not complete,
      # a missing baseline or a comparison that did not finish fails the job, and blocks the merge.
      fail_on_regression: false
      fail_without_baseline: true
      # llk-perf-merge-gate-notify posts one message for both arches, so each arch does not post.
      slack: false
      slack_on_pass: false
    secrets: inherit

  llk-perf-merge-gate-notify:
    name: LLK perf merge gate (Slack)
    needs: [llk-perf-merge-gate-changes, llk-perf-merge-gate]
    if: >-
      always() && !cancelled()
      && needs.llk-perf-merge-gate-changes.outputs.changed == 'true'
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2 cachew: keep
        timeout-minutes: 20
        with:
          sparse-checkout: tt_metal/tt-llk/perf
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.10'
      # One download per arch, each into a directory named after it. A pattern
      # download puts a single match straight into the path, with no directory
      # per artifact, so when one arch lost its job the other arch's verdict was
      # not found either and the gate reported both as skipped. Naming the
      # artifact makes the layout the same whether one arch wrote or both did.
      - name: Download the blackhole verdict
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: llk-perf-gate-slack-blackhole
          path: parts/blackhole
      - name: Download the wormhole verdict
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: llk-perf-gate-slack-wormhole
          path: parts/wormhole
      - name: Download the blackhole report
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: llk-perf-gate-report-blackhole
          path: reports/blackhole
      - name: Download the wormhole report
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: llk-perf-gate-report-wormhole
          path: reports/wormhole
      - name: Build the Slack payload
        id: slack
        env:
          SLACK_CHANNEL_ID: ${{ secrets.LLK_PERF_GATE_SLACK_CHANNEL_ID }}
        run: |
          ARGS=()
          for arch in blackhole wormhole; do
            part="parts/${arch}/slack_part.json"
            points="reports/${arch}/perf_gate_report.points.csv"
            if [ -f "$part" ]; then
              ARGS+=(--part "$part")
              echo "${arch}: verdict found"
            else
              echo "${arch}: no verdict; the gate reports it as skipped"
            fi
            if [ -f "$points" ]; then
              ARGS+=(--points "${arch}=${points}")
            fi
          done
          python3 tt_metal/tt-llk/perf/gate_slack_combine.py "${ARGS[@]}" \
            --expect blackhole,wormhole \
            --gate-name "LLK perf merge gate" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --channel "${SLACK_CHANNEL_ID:-unset}" \
            --out slack_payload.json && { cat slack_payload.json; cat "$GITHUB_OUTPUT"; exit 0; }
          echo "::error::The gate could not build its Slack notification."
          echo "should_post=false" >> "$GITHUB_OUTPUT"
      - name: Notify Slack
        if: steps.slack.outputs.should_post == 'true' && github.event_name == 'merge_group'
        env:
          SLACK_BOT_TOKEN: ${{ secrets.LLK_SLACK_REPORTING_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.LLK_PERF_GATE_SLACK_CHANNEL_ID }}
        run: |
          if [ -z "$SLACK_CHANNEL_ID" ]; then
            echo "LLK_PERF_GATE_SLACK_CHANNEL_ID is unset. No notification is sent."
            exit 0
          fi
          if [ -z "$SLACK_BOT_TOKEN" ]; then
            echo "::error::LLK_SLACK_REPORTING_BOT_TOKEN is unset; the gate could not notify Slack."
            exit 0
          fi
          RESPONSE=$(curl -sS -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer ${SLACK_BOT_TOKEN}" \
            -H "Content-type: application/json; charset=utf-8" \
            --data @slack_payload.json) || true
          case "$RESPONSE" in
            *'"ok":true'*) echo "Posted the gate verdict to Slack." ;;
            *) echo "::error::Slack rejected the gate notification: ${RESPONSE}" ;;
          esac
  workflow-status:
    name: Merge Gate Status
    if: always()
    needs: [llk-perf-merge-gate-changes, llk-perf-merge-gate-measure, llk-perf-merge-gate]
    runs-on: ubuntu-slim
    steps:
      - name: Check if all jobs passed
        uses: tenstorrent/tt-metal/.github/actions/workflow-status@main
        with:
          required-jobs: "llk-perf-merge-gate-changes"
          optional-jobs: "llk-perf-merge-gate"
        env:
          NEEDS_CONTEXT: "${{ toJSON(needs) }}"

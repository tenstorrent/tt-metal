name: Merge Gate
# Trial (perf-trial/offload-*): the LLK perf merge gate only. No warehouse write.
# arm 0 = today's in-leg compile; A = per-leg CPU compile with a parallel board start;
# AB = A + the ELF cache, read-only; writer = fill and save the ELF cache (no board).
on:
  workflow_dispatch:
    inputs:
      arm:
        type: choice
        options: ["0", "A", "AB", "writer"]
        default: "A"
      tag:
        type: string
        default: ""

run-name: "Offload trial arm ${{ inputs.arm }} ${{ inputs.tag }}"

permissions:
  actions: write
  checks: write
  contents: read
  packages: write
  pull-requests: write

jobs:
  llk-perf-merge-gate-changes:
    name: LLK perf merge gate (changes)
    runs-on: ubuntu-slim
    outputs:
      changed: "true"
      thresholds: >-
        {"blackhole": {"threshold": "0.01", "module_thresholds": ""},
         "wormhole": {"threshold": "0.01", "module_thresholds": ""}}
    steps:
      - run: echo "trial; always measure"

  llk-perf-merge-gate-measure:
    name: LLK perf merge gate (measure)
    needs: [llk-perf-merge-gate-changes]
    if: needs.llk-perf-merge-gate-changes.outputs.changed == 'true' && inputs.arm != 'writer'
    uses: ./.github/workflows/llk-perf-impl.yaml
    with:
      architecture: all
      tests-yaml: ./tests/pipeline_reorg/llk_perf_merge_gate_tests.yaml
      compile-quasar: false
      speed-of-light: false
      perf-run-types: L1_TO_L1
      pipeline: merge_baseline
      upload-to-warehouse: false  # trial: never write the warehouse
      leg-compile-runner: ${{ inputs.arm != '0' && 'tt-ubuntu-2204-large-stable' || '' }}
      leg-compile-workers: 16
      elf-cache: ${{ inputs.arm == 'AB' && 'read' || '' }}
      # The entry's queue base: the first parent of c8713e574a2.
      stage2-baseline-ref: 4078396428ef05c5146643934da1300d26786f10
      stage2-thresholds: >-
        ${{ format('{{"blackhole": {0}}}', toJSON(fromJSON(needs.llk-perf-merge-gate-changes.outputs.thresholds).blackhole)) }}
    secrets: inherit

  llk-perf-merge-gate:
    name: LLK perf merge gate (${{ matrix.arch }})
    needs: [llk-perf-merge-gate-changes, llk-perf-merge-gate-measure]
    if: always() && !cancelled() && needs.llk-perf-merge-gate-changes.outputs.changed == 'true' && inputs.arm != 'writer'
    strategy:
      fail-fast: false
      matrix:
        arch: [blackhole, wormhole]
    uses: ./.github/workflows/llk-perf-gate-impl.yaml
    with:
      arch: ${{ matrix.arch }}
      gate_name: LLK perf merge gate
      baseline_pipeline: merge_baseline
      baseline_match_ref: 4078396428ef05c5146643934da1300d26786f10
      baseline_wait_minutes: "0"
      speed_of_light: "false"
      run_types: L1_TO_L1
      threshold: ${{ fromJSON(needs.llk-perf-merge-gate-changes.outputs.thresholds)[matrix.arch].threshold }}
      module_thresholds: ${{ fromJSON(needs.llk-perf-merge-gate-changes.outputs.thresholds)[matrix.arch].module_thresholds }}
      min_cycles: "30"
      measure_result: ${{ needs.llk-perf-merge-gate-measure.result }}
      stage2_baseline_artifact: llk-perf-stage2-baseline
      fail_on_regression: false
      slack: false
      slack_on_pass: false
    secrets: inherit

  llk-perf-merge-gate-elf-cache:
    name: LLK perf merge gate (ELF cache)
    if: inputs.arm == 'writer'
    permissions:
      actions: write
      checks: write
      contents: read
      packages: write
    uses: ./.github/workflows/llk-perf-elf-cache.yaml
    secrets: inherit

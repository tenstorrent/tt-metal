name: Merge Gate
# This pipeline is the minimum bar a PR must pass before it can pass the merge queue.
# It is intended to be relatively fast and lightweight that the delay between completing
# a PR and having the changes available on main is not onerous.

# Requirements for all jobs in this workflow:
# - End-to-end (excluding wait times for runners) must be less than 15mins.
#   This includes the cost of checking out the code, preparing a runner, etc.
# - Individual test cases must be less than 5s.

run-name: >-
  ${{ github.event_name == 'merge_group' && github.event.action == 'destroyed' && github.event.reason == 'merged' && format('[Merge Queue] 🎯 Merged {0}', github.sha) ||
      github.event_name == 'merge_group' && github.event.action == 'destroyed' && github.event.reason == 'dequeued' && format('[Merge Queue] ↩️ Dequeued {0}', github.sha) ||
      github.event_name == 'merge_group' && github.event.action == 'destroyed' && github.event.reason == 'invalidated' && format('[Merge Queue] 💔 Invalidated {0}', github.sha) ||
      github.event_name == 'merge_group' && github.event.action == 'destroyed' && format('[Merge Queue] {0} {1}', github.event.reason, github.sha) ||
      github.event_name == 'merge_group' && format('[Merge Queue] 💫 Processing {0}: {1}', github.actor, github.sha) ||
      '' }}

on:
  workflow_dispatch:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  merge_group:
    types:
      - checks_requested
      - destroyed
  push:
    branches:
      - main # Builds on main will populate the shared ccache to speed up builds on branches

concurrency:
  # Groups to control cancelling of obsolete runs.
  # main (or any protected branch): run_id (ie: never cancel other jobs)
  # PRs: PR #
  # Merge Queue: branch name; will be paired with the 'destroyed' trigger to cause a cancel when it leaves or moves in the queue.
  #              See https://github.com/orgs/community/discussions/137976#discussioncomment-14004793
  # All others: branch name (ie: one run per branch)
  group: >-
    ${{ github.workflow }}-
    ${{ (github.ref_protected && github.run_id)
        || github.event.pull_request.number
        || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  checks: write
  packages: write
  # The producer downloads the artifact via REST; a called workflow only downgrades.
  actions: read

jobs:
  llk-perf-merge-gate-changes:
    name: LLK perf merge gate (changes)
    if: ${{
        github.event.action != 'destroyed' &&
        (github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch')
      }}
    runs-on: ubuntu-slim
    timeout-minutes: 10
    outputs:
      changed: ${{ steps.classify.outputs.changed }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2 cachew: keep
        timeout-minutes: 20
        with:
          fetch-depth: 0
          filter: tree:0
          sparse-checkout: .github
      - name: Classify this entry's own changes
        id: classify
        env:
          # In the queue, base..head holds only this entry; the entries in front are in the base.
          BASE: ${{ github.event.merge_group.base_sha }}
        run: |
          BASE=${BASE:-$(git merge-base origin/main HEAD)}
          CHANGED=$(git diff --name-only --diff-filter=ACMRT "$BASE" HEAD | .github/scripts/llk-perf-inputs-changed.sh)
          echo "LLK perf inputs changed in ${BASE}..$(git rev-parse HEAD): ${CHANGED}"
          echo "changed=${CHANGED}" >> "$GITHUB_OUTPUT"

  llk-perf-merge-gate-measure:
    name: LLK perf merge gate (measure)
    needs: [llk-perf-merge-gate-changes]
    if: needs.llk-perf-merge-gate-changes.outputs.changed == 'true'
    uses: ./.github/workflows/llk-perf-impl.yaml
    with:
      architecture: all
      tests-yaml: ./tests/pipeline_reorg/llk_perf_merge_gate_tests.yaml
      compile-quasar: false
      speed-of-light: false
      perf-run-types: L1_TO_L1
      pipeline: merge_baseline
      upload-to-warehouse: true
      stage2-baseline-ref: ${{ github.event.merge_group.base_sha || github.sha }}
      # The arches with stage: true in gate_policy.yaml run stage 2, under its thresholds.
      stage2-gate: merge
    secrets: inherit

  llk-perf-merge-gate:
    name: LLK perf merge gate (${{ matrix.arch }})
    needs: [llk-perf-merge-gate-changes, llk-perf-merge-gate-measure]
    if: always() && !cancelled() && needs.llk-perf-merge-gate-changes.outputs.changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        arch: [blackhole, wormhole]
    uses: ./.github/workflows/llk-perf-gate-impl.yaml
    with:
      gate: merge
      arch: ${{ matrix.arch }}
      baseline_match_ref: ${{ github.event.merge_group.base_sha || github.sha }}
      # No wait, so the queue never waits for the warehouse: a missing baseline
      # falls back to the newest older one in the base's history, marked stale.
      baseline_wait_minutes: "0"
      # Stage 2 and the gate compare against the same baseline read; without it, the gate reads the warehouse.
      stage2_baseline_artifact: llk-perf-stage2-baseline
      # gate_policy.yaml decides whether a regression blocks. A measurement that did not complete,
      # a missing baseline or a comparison that did not finish fails the job, and blocks the merge.
    secrets: inherit

  # The only LLK perf gate that posts to the regressions channel, and only a regression or a skip.
  # One message for both arches, rendered from their verdict files. A manual run on a dev branch does not post.
  llk-perf-merge-gate-notify:
    name: LLK perf merge gate (Slack)
    needs: [llk-perf-merge-gate-changes, llk-perf-merge-gate]
    if: >-
      always() && !cancelled() && github.event_name == 'merge_group'
      && needs.llk-perf-merge-gate-changes.outputs.changed == 'true'
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2 cachew: keep
        timeout-minutes: 20
        with:
          sparse-checkout: tt_metal/tt-llk/perf
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.10'
      - run: pip install -c tt_metal/tt-llk/perf/constraints.txt pandas pyyaml
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: llk-perf-gate-report-*
          path: reports
      - name: Post to Slack
        env:
          SLACK_BOT_TOKEN: ${{ secrets.LLK_SLACK_REPORTING_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.LLK_PERF_GATE_SLACK_CHANNEL_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tt_metal/tt-llk/perf/gate.py render --gate merge --reports reports --slack --trigger "merge queue"

  # ===========================================================================
  # Team: ttsim
  # test list: ttsim_merge_gate_tests.yaml
  # ===========================================================================

  # Quasar coverage on the ttsim simulator (sim_quasar SKU, no hardware). The impl owns
  # its test list (tests/pipeline_reorg/ttsim_merge_gate_tests.yaml), so adding or
  # retiring a leg here is a change to that yaml alone. Its fetch-ttsim job downloads
  # libttsim_qsr.so and setup-ttsim installs it for the matrix's sim SKU.

name: Merge Gate
# Trial (perf-trial/bh-slow-old): Blackhole legs of the LLK perf merge gate at this commit, with host/cgroup diagnostics.
run-name: "BH slowdown trial old ${{ github.ref_name }} prio=${{ inputs.prio }}"
on:
  workflow_dispatch:
    inputs:
      prio:
        description: "Run the legs on the merge-queue (prio) Blackhole pool"
        type: boolean
        default: false

permissions:
  actions: read
  checks: write
  contents: read
  packages: write
  pull-requests: write

jobs:
  # LLK perf merge gate (tests/pipeline_reorg/llk_perf_merge_gate_tests.yaml): measure
  # the queue head, non speed-of-light, L1_TO_L1, and compare it with the merge
  # baseline at the queue's base. The base is the head of the entry in front, and
  # that entry's gate uploaded its head as merge_baseline, so the next entry finds it.
  llk-perf-merge-gate-changes:
    name: LLK perf merge gate (changes)
    if: ${{
        github.event.action != 'destroyed' &&
        (github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch')
      }}
    runs-on: ubuntu-slim
    outputs:
      changed: ${{ steps.classify.outputs.changed }}
      # The gate's thresholds, for the compare job and for stage 2 in the Blackhole legs.
      thresholds: >-
        {"blackhole": {"threshold": "0.01", "module_thresholds": ""},
         "wormhole": {"threshold": "0.01", "module_thresholds": ""}}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2 cachew: keep
        timeout-minutes: 20
        with:
          fetch-depth: 0
          filter: tree:0
          sparse-checkout: .github
      - name: Classify this entry's own changes
        id: classify
        env:
          # In the queue, base..head holds only this entry; the entries in front are in the base.
          BASE: ${{ github.event.merge_group.base_sha }}
        run: |
          BASE=${BASE:-$(git merge-base origin/main HEAD)}
          CHANGED=$(git diff --name-only --diff-filter=ACMRT "$BASE" HEAD | .github/scripts/llk-perf-inputs-changed.sh)
          echo "LLK perf inputs changed in ${BASE}..$(git rev-parse HEAD): ${CHANGED}"
          echo "changed=true" >> "$GITHUB_OUTPUT"  # trial: always measure

  llk-perf-merge-gate-measure:
    name: LLK perf merge gate (measure)
    needs: [llk-perf-merge-gate-changes]
    if: needs.llk-perf-merge-gate-changes.outputs.changed == 'true'
    uses: ./.github/workflows/llk-perf-impl.yaml
    with:
      architecture: all
      tests-yaml: ./tests/pipeline_reorg/llk_perf_merge_gate_tests.yaml
      compile-quasar: false
      speed-of-light: false
      perf-run-types: L1_TO_L1
      pipeline: merge_baseline
      upload-to-warehouse: false  # trial: never write the warehouse
    secrets: inherit

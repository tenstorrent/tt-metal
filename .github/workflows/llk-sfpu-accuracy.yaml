name: "LLK SFPU accuracy sweep"

# The exhaustive 16-bit ULP sweep, run as a gate against the declared budgets.
#
# The functional drivers sample a few thousand points from each op's safe domain,
# and a budget measured that way describes the sample rather than the format. This
# runs every finite bfloat16 and float16 value through each enrolled op, so a budget
# that only held on the sample fails.
#
# Three entry points, because a regression is worth catching at three different
# moments:
#
#   * nightly, which is the backstop;
#   * on a pull request that touches an SFPU kernel or the budget table, so whoever
#     changed the kernel sees the measurement before it merges rather than the next
#     morning;
#   * on demand, for a branch that wants the numbers.
#
# It never writes the budget table. `--ulp-emit` rewrites it from a run, and that is
# a deliberate human act with a review attached — a table regenerated by a nightly
# is a gate that agrees with itself by construction. What this publishes instead is
# a headroom report: which cells are over budget, which have no margin left, and
# which are carrying slack.
#
# The complementary check is llk-sfpu-ulp-budget-guard.yaml, which needs no
# hardware: it refuses a pull request that raises a budget without re-measuring.

on:
  schedule:
    # 05:30 UTC. Not 01:00 (llk-e2e) and not 03:00, which llk-bit-exact and llk-perf
    # both hold with 90- and 150-minute budgets on the same wh_n150_civ2 pool -- a third
    # 45-minute reservation on that minute would queue all three.
    - cron: "30 5 * * *"
  pull_request:
    paths:
      # The kernels whose accuracy the table describes...
      - "tt_metal/tt-llk/tt_llk_wormhole_b0/common/inc/sfpu/**"
      - "tt_metal/tt-llk/tt_llk_wormhole_b0/llk_lib/llk_math_eltwise_unary_sfpu*"
      # ...including the wrapper tree, which is where the 110 ckernel_sfpu_*.h live and
      # which the test compiler puts on the include path (helpers/test_config.py).
      # Without it a change to one of those headers would not trigger the sweep.
      - "tt_metal/hw/ckernels/wormhole_b0/metal/llk_api/**"
      # ...the table itself, and the machinery that measures and judges it.
      - "tt_metal/tt-llk/tests/python_tests/helpers/sfpu_accuracy_budget.*"
      - "tt_metal/tt-llk/tests/python_tests/helpers/ulp*.py"
      - "tt_metal/tt-llk/tests/python_tests/test_unary_sfpu_ulp.py"
      - "tests/pipeline_reorg/llk_sfpu_accuracy_tests.yaml"
      - ".github/workflows/llk-sfpu-accuracy*.yaml"
  workflow_dispatch:

permissions:
  checks: write
  contents: read
  packages: write
  pull-requests: write

concurrency:
  # One sweep per ref: it holds a card for the better part of an hour, and a queue
  # of superseded runs helps nobody.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  llk-sfpu-accuracy:
    name: "LLK SFPU accuracy sweep"
    uses: ./.github/workflows/llk-sfpu-accuracy-impl.yaml
    secrets: inherit
    with:
      report-to-pr: ${{ github.event_name == 'pull_request' }}

  llk-sfpu-accuracy-summary:
    name: "LLK SFPU accuracy summary"
    if: always()
    needs:
      - llk-sfpu-accuracy
    runs-on: ubuntu-slim
    steps:
      - name: Check sweep results
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # release/v1
        with:
          jobs: ${{ toJSON(needs) }}

  report-status:
    name: "Report status"
    runs-on: ubuntu-slim
    # Slack is for the unattended runs. A pull request reports itself, on the PR.
    if: ${{ always() && github.event_name != 'pull_request' }}
    needs: llk-sfpu-accuracy-summary
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        timeout-minutes: 20
        with:
          fetch-depth: 1
      - name: Report status
        uses: ./.github/actions/report-failure
        with:
          test_name: "LLK SFPU accuracy sweep"
          slack_bot_token: ${{ secrets.LLK_SLACK_REPORTING_BOT_TOKEN }}
          slack_channel_id: ${{ secrets.LLK_CI_STATUS_CHANNEL_ID }}
          status: ${{ needs.llk-sfpu-accuracy-summary.result }}

# Throwaway. Answers one question: can a GitHub-hosted runner host the porting agent's build loop?
#
# The agent's job cannot run in-cluster, because CIv2 reaches the network through
# `proxy.restricted-proxy.svc.cluster.local`, which answers 403 to the Copilot API -- the one host
# gh-aw cannot work without. GitHub-hosted runners are outside the cluster and reach it natively, so
# they are the only pool available without an infra change. The open question is capacity, not
# access: 4 vCPU against the many-core pool that builds tt-metal in about 15 minutes, and no route
# to the Garage ccache, so every run starts cold.
#
# Two numbers decide the architecture, and this measures both:
#
#   Cold build. Whether the agent can build on its own host at all inside a 330-minute job.
#   Incremental rebuild. What one edit-compile cycle costs, which is the loop the agent actually
#   lives in. Mostly link-bound rather than compile-bound, so it may barely notice the core count --
#   and if that is true, the core count mostly stops mattering.
#
# Deliberately no device: this proves nothing about measurement, which stays on CIv2 either way.
# Delete once the numbers are recorded in HANDOFF.md.
name: (probe) Cold build on a GitHub-hosted runner

on:
  workflow_dispatch:
  push:
    branches:
      - ebanerjee/port-op-probe

permissions:
  contents: read

jobs:
  cold-build:
    runs-on: ubuntu-latest
    # The GitHub-hosted ceiling is 6 hours. Taking nearly all of it, because a run that dies at the
    # limit still reports how far it got, which a shorter cap would throw away.
    timeout-minutes: 350
    env:
      IMAGE: ghcr.io/tenstorrent/tt-metal/tt-metalium/ubuntu-22.04-dev-amd64:latest
    steps:
      - name: Describe the machine
        run: |
          echo "nproc: $(nproc)"
          free -g | sed 's/^/  /'
          df -h / /mnt 2>/dev/null | sed 's/^/  /'
          echo "free_gb=$(df -BG --output=avail / | tail -1 | tr -dc '0-9')" >> "$GITHUB_ENV"

      # tt-metal plus a full build tree is tens of GB. Public 4-core runners currently carry a 150 GB
      # disk with roughly 90 GB free, but only 14 GB of that is contractual, so this reclaims the
      # largest preinstalled trees when the margin looks thin. Twenty seconds of insurance against
      # discovering the limit at minute eighty of a build.
      - name: Reclaim disk if the margin is thin
        run: |
          if [ "${free_gb:-0}" -lt 60 ]; then
            echo "only ${free_gb}G free, removing preinstalled toolchains"
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
            df -h / | sed 's/^/  /'
          else
            echo "${free_gb}G free, leaving the image alone"
          fi

      - name: Checkout tt-metal
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 1
          persist-credentials: false
          submodules: recursive

      # The checkout's own duration is on the step above in the UI; this is just how much it landed,
      # since the build tree has to fit beside it.
      - name: Report what the checkout cost in disk
        run: |
          echo "workspace: $(du -sh . 2>/dev/null | cut -f1)"
          df -h / | sed 's/^/  /'

      # Same image port-op uses, so the toolchain and the compiler version match and the numbers
      # transfer. From GHCR, which is reachable here; the in-cluster Harbor mirror is not.
      - name: Start the toolchain container
        run: |
          start=$(date +%s)
          docker pull "$IMAGE"
          echo "::notice title=Image pull::$(( $(date +%s) - start ))s"

          docker run -d --name portdev \
            -v "${{ github.workspace }}:/work" \
            -e CCACHE_TEMPDIR=/tmp/ccache \
            -e CCACHE_BASEDIR=/work \
            -w /work \
            "$IMAGE" sleep infinity
          docker exec portdev git config --global --add safe.directory /work
          docker exec portdev mkdir -p /tmp/ccache
          echo "cores visible in container: $(docker exec portdev nproc)"

      # Backgrounded with a heartbeat rather than streamed: an hour of ninja output is unreadable,
      # and the last progress line every minute gives a live ETA instead.
      - name: Cold build
        run: |
          start=$(date +%s)
          docker exec portdev bash -c \
            './build_metal.sh --build-dir build --build-type Release --enable-ccache > /tmp/build.log 2>&1' &
          pid=$!
          while kill -0 "$pid" 2>/dev/null; do
            sleep 60
            echo "[$(( ($(date +%s) - start) / 60 ))m] $(docker exec portdev tail -n 1 /tmp/build.log 2>/dev/null | tr -d '\r')"
          done
          set +e
          wait "$pid"
          status=$?
          set -e
          elapsed=$(( $(date +%s) - start ))
          echo "cold_build_s=$elapsed" >> "$GITHUB_ENV"
          echo "cold_build_status=$status" >> "$GITHUB_ENV"
          echo "::notice title=Cold build::${elapsed}s (exit $status)"
          if [ "$status" -ne 0 ]; then
            docker exec portdev tail -n 60 /tmp/build.log || true
          fi
          exit "$status"

      - name: Confirm the build was actually cold
        if: always()
        run: |
          docker exec portdev ccache -s 2>/dev/null | sed 's/^/  /' || true
          df -h / | sed 's/^/  /'
          echo "build tree: $(docker exec portdev du -sh /work/build 2>/dev/null | cut -f1)"

      # The number that decides everything. One touched translation unit in the category the ported
      # ops live in, then the exact command the agent's `build` tool runs. Touching rather than
      # editing keeps it a pure timing measurement with no chance of a compile error.
      - name: Incremental rebuild after one touched file
        run: |
          target=$(docker exec portdev bash -c \
            'ls /work/ttnn/cpp/ttnn/operations/data_movement/*/device/*.cpp 2>/dev/null | head -1')
          echo "touching: ${target:-<none found>}"
          [ -n "$target" ] || { echo "::error::no data_movement device source found"; exit 1; }
          docker exec portdev touch "$target"

          start=$(date +%s)
          docker exec portdev bash -c \
            'cmake --build build --target install -j"$(nproc)" > /tmp/incr.log 2>&1' &
          pid=$!
          while kill -0 "$pid" 2>/dev/null; do
            sleep 30
            echo "[$(( $(date +%s) - start ))s] $(docker exec portdev tail -n 1 /tmp/incr.log 2>/dev/null | tr -d '\r')"
          done
          set +e
          wait "$pid"
          status=$?
          set -e
          elapsed=$(( $(date +%s) - start ))
          echo "incr_build_s=$elapsed" >> "$GITHUB_ENV"
          echo "::notice title=Incremental rebuild::${elapsed}s (exit $status)"
          docker exec portdev tail -n 15 /tmp/incr.log || true
          exit "$status"

      - name: Verdict
        if: always()
        run: |
          {
            echo "## Can a GitHub-hosted runner host the agent's build loop?"
            echo
            echo "| measurement | value |"
            echo "| --- | --- |"
            echo "| cores | $(nproc) |"
            echo "| cold build | ${cold_build_s:-did not finish}s |"
            echo "| incremental rebuild, one file | ${incr_build_s:-did not finish}s |"
            echo "| reference: many-core in-cluster pool | ~933s cold |"
            echo
            echo "A cold build inside a 330-minute job means the agent can build on its own host and"
            echo "keep its fast loop, dispatching to CIv2 only to measure. Otherwise the agent gets"
            echo "\`clang++ -fsyntax-only\` locally and dispatches every real build."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Collect the build logs
        if: always()
        run: |
          mkdir -p /tmp/probe
          docker cp portdev:/tmp/build.log /tmp/probe/build.log 2>/dev/null || true
          docker cp portdev:/tmp/incr.log /tmp/probe/incr.log 2>/dev/null || true
          docker exec portdev ccache -s > /tmp/probe/ccache.txt 2>/dev/null || true

      - uses: actions/upload-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: always()
        with:
          name: probe-logs
          path: /tmp/probe
          retention-days: 3

      - name: Stop the container
        if: always()
        run: docker rm -f portdev || true

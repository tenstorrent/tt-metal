name: "[internal] Matmul registry CPU contract tests"

on:
  workflow_call:
    inputs:
      docker-image:
        required: true
        type: string
      package-artifact-name:
        required: true
        type: string
      runner:
        required: true
        type: string

permissions:
  contents: read

jobs:
  matmul-registry-contract:
    name: Matmul registry CPU contract
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 10
    container:
      image: ${{ inputs.docker-image || 'docker-image-unresolved!' }}
      env:
        ASAN_OPTIONS: "color=always"
        TSAN_OPTIONS: "color=always"
        UBSAN_OPTIONS: "color=always:print_stacktrace=1:halt_on_error=1"
        GTEST_OUTPUT: xml:/work/generated/test_reports/matmul_registry_contract.xml
        LOGURU_LEVEL: INFO
        TT_METAL_HOME: /work
      volumes:
        - /work
    defaults:
      run:
        shell: bash
        working-directory: /work
    steps:
      - name: Download packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        timeout-minutes: 5
        with:
          name: ${{ inputs.package-artifact-name || 'packages artifact unresolved!' }}
          path: /work/pkgs/
          digest-mismatch: error

      - name: Install validation packages
        timeout-minutes: 5
        run: |
          set -euo pipefail
          shopt -s nullglob
          pkgs=(
            ./pkgs/tt-metalium_*.deb
            ./pkgs/tt-metalium-jit_*.deb
            ./pkgs/tt-metalium-validation_*.deb
            ./pkgs/tt-nn_*.deb
            ./pkgs/tt-nn-validation_*.deb
          )
          if (( ${#pkgs[@]} == 0 )); then
            echo "No TT-Metal validation packages were downloaded" >&2
            exit 1
          fi
          apt install -y "${pkgs[@]}"

      - name: Run exact registry contract
        timeout-minutes: 2
        run: |
          set -euo pipefail
          mkdir -p generated/test_reports
          /usr/bin/tt-nn-validation-basic \
            --gtest_filter='MatmulConfigRegistry.*' \
            --gtest_color=yes

      - name: Upload test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        timeout-minutes: 5
        with:
          name: matmul-registry-contract-${{ github.run_id }}-${{ github.run_attempt }}
          path: /work/generated/test_reports/matmul_registry_contract.xml
          if-no-files-found: error

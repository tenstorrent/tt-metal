name: "Formatter serial T3K diagnostic"

on:
  workflow_dispatch:
    inputs:
      protocol:
        description: "Diagnostic only: stock producer and the frozen chunked or structured pair"
        type: choice
        required: true
        default: chunked
        options: [chunked, structured]

permissions:
  contents: read
  actions: read
  packages: read

concurrency:
  group: formatter-58542-serial-control
  cancel-in-progress: false

run-name: "Formatter diagnostic: main21754/ee072dd, identical EE native"

jobs:
  serial-control:
    name: Formatter serial T3K diagnostic
    runs-on: [arch-wormhole_b0, config-t3000, pipeline-functional, in-service]
    # The administrator's normal start hook precedes the producer. This job
    # never invokes a reset or changes that hook; the three boots stay serial.
    timeout-minutes: 240
    env:
      PAIR_WORKSPACE: pair-runtime-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Initialize fresh diagnostic workspace
        id: workspace
        timeout-minutes: 1
        run: |
          python3 - <<'PY'
          import os, pathlib
          run_id, attempt = os.environ['GITHUB_RUN_ID'], os.environ['GITHUB_RUN_ATTEMPT']
          assert run_id.isdigit() and attempt.isdigit()
          root = pathlib.Path(os.environ['PAIR_WORKSPACE'])
          assert str(root) == 'pair-runtime-' + run_id + '-' + attempt
          root.mkdir(mode=0o700)
          assert root.stat().st_uid == os.getuid()
          print('Fresh diagnostic workspace: ' + str(root))
          PY
      - name: Checkout isolated diagnostic controller
        id: controller
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        timeout-minutes: 5
        with:
          path: ${{ env.PAIR_WORKSPACE }}/control
          persist-credentials: false
      - name: Checkout sealed baseline Python source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        timeout-minutes: 5
        with:
          ref: 21754c005c015161fe5de2d1cdb10bf64a6fd5a1
          path: ${{ env.PAIR_WORKSPACE }}/baseline
          submodules: recursive
          persist-credentials: false
      - name: Checkout sealed candidate Python source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        timeout-minutes: 5
        with:
          ref: ee072dd216c2d19c6b228be26f695757d8ec1500
          fetch-depth: 2
          path: ${{ env.PAIR_WORKSPACE }}/candidate
          submodules: recursive
          persist-credentials: false
      - name: Checkout pinned plugin
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        timeout-minutes: 5
        with:
          repository: tenstorrent/vllm-tt-plugin
          ref: c1c85eb6bfe14a3e47afc450e25f7a8ddc81d974
          path: ${{ env.PAIR_WORKSPACE }}/plugin
          persist-credentials: false
      - name: Checkout pinned benchmark source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        timeout-minutes: 5
        with:
          repository: vllm-project/vllm
          ref: 568afb3a13806beb53bb2e6bd518269357b237c0
          path: ${{ env.PAIR_WORKSPACE }}/vllm-source
          persist-credentials: false
      - name: Setup job-local verified GitHub CLI
        timeout-minutes: 2
        run: |
          python3 - <<'PY'
          import hashlib, io, json, os, pathlib, platform, subprocess, tarfile, urllib.request
          assert platform.machine() == 'x86_64'
          version = '2.78.0'
          digest = 'ac309f70c5d6b122c82e6138ce82cb65ca5d8595cc09d11751fbc4e3907e1a05'
          url = 'https://github.com/cli/cli/releases/download/v' + version + '/gh_' + version + '_linux_amd64.tar.gz'
          with urllib.request.urlopen(url, timeout=30) as response:
              payload = response.read()
          assert hashlib.sha256(payload).hexdigest() == digest, 'Official CLI archive digest mismatch'
          binary = pathlib.Path(os.environ['PAIR_WORKSPACE']) / 'tools/gh/bin/gh'
          binary.parent.mkdir(parents=True)
          with tarfile.open(fileobj=io.BytesIO(payload), mode='r:gz') as archive:
              member = archive.getmember('gh_' + version + '_linux_amd64/bin/gh')
              assert member.isfile()
              binary.write_bytes(archive.extractfile(member).read())
          binary.chmod(0o755)
          actual = subprocess.check_output([str(binary.resolve()), '--version'], text=True, timeout=10)
          assert actual.splitlines()[0].split()[2] == version
          with open(os.environ['GITHUB_PATH'], 'a') as path:
              path.write(str(binary.parent.resolve()) + '\n')
          evidence = pathlib.Path(os.environ['PAIR_WORKSPACE']) / 'evidence'
          evidence.mkdir(exist_ok=True)
          receipt = {'version': version, 'official_url': url, 'archive_sha256': digest, 'binary_sha256': hashlib.sha256(binary.read_bytes()).hexdigest(), 'job_local': True}
          (evidence / 'gh-cli.json').write_text(json.dumps(receipt, indent=2) + '\n')
          print('Verified job-local gh ' + version + ': ' + receipt['binary_sha256'])
          PY
      - name: Verify current assignment and sealed artifact metadata
        timeout-minutes: 1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          expected = {
              11136307415: 'd53b4d0c285e6a9aeaea22ea83e558c1a78a917dc90665c3df14e5a846d407d3',
              11136385647: '76b0aafb988e7ec40717b65913836bcf6edb057ba34c241732eb381fe4f8926e',
          }
          def api(endpoint):
              return json.loads(subprocess.check_output(['gh', 'api', endpoint]))
          jobs = api('repos/tenstorrent/tt-metal/actions/runs/' + os.environ['GITHUB_RUN_ID'] + '/jobs')['jobs']
          matches = [j for j in jobs if j['name'] == 'Formatter serial T3K diagnostic' and j['status'] == 'in_progress' and j['runner_name'] == os.environ['RUNNER_NAME']]
          assert len(matches) == 1
          receipts = {'job_id': matches[0]['id'], 'started_at': matches[0]['started_at'], 'runner_name': matches[0]['runner_name'], 'run_id': os.environ['GITHUB_RUN_ID'], 'artifacts': []}
          for artifact_id, digest in expected.items():
              item = api('repos/tenstorrent/tt-metal/actions/artifacts/' + str(artifact_id))
              assert not item['expired']
              assert item['workflow_run']['id'] == 36800249207
              assert item['workflow_run']['head_sha'] == 'ee072dd216c2d19c6b228be26f695757d8ec1500'
              assert item['digest'] == 'sha256:' + digest
              receipts['artifacts'].append({'id': artifact_id, 'digest': item['digest'], 'source': item['workflow_run']['head_sha']})
          path = pathlib.Path(os.environ['PAIR_WORKSPACE']) / 'evidence'
          path.mkdir(exist_ok=True)
          (path / 'ci-assignment-and-artifacts.json').write_text(json.dumps(receipts, indent=2) + '\n')
          PY
      - name: Download ONE native archive for both source legs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        timeout-minutes: 3
        with:
          artifact-ids: 11136307415
          github-token: ${{ github.token }}
          run-id: 36800249207
          path: ${{ env.PAIR_WORKSPACE }}/artifacts/native
          digest-mismatch: error
      - name: Real Linux pidfd ownership and cancellation controls
        timeout-minutes: 1
        working-directory: ${{ env.PAIR_WORKSPACE }}
        run: python3 -B control/.github/scripts/utils/test_formatter_ci_pidfd.py
      - name: Download ONE wheel for both source legs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        timeout-minutes: 3
        with:
          artifact-ids: 11136385647
          github-token: ${{ github.token }}
          run-id: 36800249207
          path: ${{ env.PAIR_WORKSPACE }}/artifacts/wheel
          digest-mismatch: error
      - name: GHCR read access
        uses: docker/login-action@v3
        timeout-minutes: 1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Declared producer and sealed serial arms; stop on any native hang
        # The controller uses job started_at, not this step's start, for its
        # original 45min preparation/220min work deadlines; 20min remain for close/upload.
        timeout-minutes: 220
        working-directory: ${{ env.PAIR_WORKSPACE }}
        env:
          PAIR_PROTOCOL: ${{ inputs.protocol }}
          GH_TOKEN: ${{ github.token }}
        run: python3 -B control/.github/scripts/utils/formatter_stock_pair/formatter_ci_binding.py host .
      - name: Identity-checked owned-container cleanup, including cancellation
        if: always() && steps.workspace.outcome == 'success' && steps.controller.outcome == 'success'
        timeout-minutes: 14
        working-directory: ${{ env.PAIR_WORKSPACE }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B control/.github/scripts/utils/formatter_stock_pair/formatter_ci_binding.py cleanup .
      - name: Preserve diagnostic evidence
        if: always() && steps.workspace.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: formatter-58542-serial-control-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.PAIR_WORKSPACE }}/evidence/
            ${{ env.PAIR_WORKSPACE }}/*/evidence/
            ${{ env.PAIR_WORKSPACE }}/capsule/capsule.json
            ${{ env.PAIR_WORKSPACE }}/storage-admission.json
          if-no-files-found: warn
        timeout-minutes: 5
      # Retain task directories if upload or closure fails. The existing runner
      # administrator owns its normal end-of-job lifecycle; no task-side rm/reset.

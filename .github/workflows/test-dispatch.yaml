name: "Custom test dispatch"

# Probe-only branch: record firmware / KMD versions of the P100a CI boards.
# No build, no tests. Each job prints the board serial (runner hook) and tt-smi -s.
on:
  workflow_dispatch:
    inputs:
      runner-label:
        required: false
        type: string
        default: "tt-ubuntu-2204-P100a-viommu-stable"
      samples:
        required: false
        type: string
        default: '[1,2,3,4,5,6,7,8]'
      description:
        type: string
        default: "P100a firmware probe"
        required: false

run-name: ${{ inputs.description }}
jobs:
  fw-probe:
    strategy:
      fail-fast: false
      matrix:
        sample: ${{ fromJSON(inputs.samples) }}
    runs-on: ${{ inputs.runner-label }}
    timeout-minutes: 20
    steps:
      - name: Host info
        run: |
          hostname; uname -a
          cat /sys/module/tenstorrent/version 2>/dev/null && echo "^ KMD version (sysfs)"
          ls -la /dev/tenstorrent/ || true
          for d in /sys/class/tenstorrent/*; do echo "== $d"; for f in "$d"/tt_*; do [ -f "$f" ] && echo "$(basename $f): $(cat $f 2>/dev/null)"; done; done 2>/dev/null || true
      - name: tt-smi snapshot
        run: |
          set -x
          PY=$(command -v python3 || true)
          if [ -z "$PY" ]; then echo "no python3 on host"; exit 0; fi
          $PY -m venv /tmp/smi 2>/dev/null || { $PY -m pip install --user virtualenv && $PY -m virtualenv /tmp/smi; }
          /tmp/smi/bin/pip install -q tt-smi
          /tmp/smi/bin/tt-smi -s -f /tmp/smi.json || /tmp/smi/bin/tt-smi -s > /tmp/smi.json
          cat /tmp/smi.json
          echo "----- summary -----"
          grep -E '"(fw_bundle_version|eth_fw|cm_fw|dm_app_fw|dm_bl_fw|tt_flash_version|board_id|Driver|tt_smi)"' /tmp/smi.json || true
      - name: Job summary
        if: always()
        run: |
          {
            echo "### sample ${{ matrix.sample }} on $RUNNER_NAME"
            echo '```'
            grep -E '"(fw_bundle_version|eth_fw|cm_fw|dm_app_fw|board_id|Driver)"' /tmp/smi.json 2>/dev/null || echo "no tt-smi output"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

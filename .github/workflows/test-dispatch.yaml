name: "Formatter serial T3K diagnostic"

on:
  workflow_dispatch:
    inputs:
      protocol:
        description: "Diagnostic only: original chunked 8-request/3-assertion pair"
        type: choice
        required: true
        default: chunked
        options: [chunked]

permissions:
  contents: read
  actions: read
  packages: read

concurrency:
  group: formatter-58542-serial-control
  cancel-in-progress: false

run-name: "Formatter diagnostic: main21754/ee072dd, identical EE native"

jobs:
  serial-control:
    name: Formatter serial T3K diagnostic
    runs-on: [arch-wormhole_b0, config-t3000, pipeline-functional, in-service]
    timeout-minutes: 120
    steps:
      - name: Checkout isolated diagnostic controller
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: pair-runtime/control
          persist-credentials: false
      - name: Checkout sealed baseline Python source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 21754c005c015161fe5de2d1cdb10bf64a6fd5a1
          path: pair-runtime/baseline
          submodules: recursive
          persist-credentials: false
      - name: Checkout sealed candidate Python source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ee072dd216c2d19c6b228be26f695757d8ec1500
          fetch-depth: 2
          path: pair-runtime/candidate
          submodules: recursive
          persist-credentials: false
      - name: Checkout pinned plugin
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: tenstorrent/vllm-tt-plugin
          ref: c1c85eb6bfe14a3e47afc450e25f7a8ddc81d974
          path: pair-runtime/plugin
          persist-credentials: false
      - name: Checkout pinned benchmark source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: vllm-project/vllm
          ref: v0.26.0
          path: pair-runtime/vllm-source
          persist-credentials: false
      - name: Verify current assignment and sealed artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          expected = {
              11136307415: 'd53b4d0c285e6a9aeaea22ea83e558c1a78a917dc90665c3df14e5a846d407d3',
              11136385647: '76b0aafb988e7ec40717b65913836bcf6edb057ba34c241732eb381fe4f8926e',
          }
          def api(endpoint):
              return json.loads(subprocess.check_output(['gh', 'api', endpoint]))
          jobs = api('repos/tenstorrent/tt-metal/actions/runs/' + os.environ['GITHUB_RUN_ID'] + '/jobs')['jobs']
          matches = [j for j in jobs if j['name'] == 'Formatter serial T3K diagnostic' and j['status'] == 'in_progress' and j['runner_name'] == os.environ['RUNNER_NAME']]
          assert len(matches) == 1
          receipts = {'job_id': matches[0]['id'], 'started_at': matches[0]['started_at'], 'runner_name': matches[0]['runner_name'], 'run_id': os.environ['GITHUB_RUN_ID'], 'artifacts': []}
          for artifact_id, digest in expected.items():
              item = api('repos/tenstorrent/tt-metal/actions/artifacts/' + str(artifact_id))
              assert not item['expired']
              assert item['workflow_run']['id'] == 36800249207
              assert item['workflow_run']['head_sha'] == 'ee072dd216c2d19c6b228be26f695757d8ec1500'
              assert item['digest'] == 'sha256:' + digest
              receipts['artifacts'].append({'id': artifact_id, 'digest': item['digest'], 'source': item['workflow_run']['head_sha']})
          path = pathlib.Path('pair-runtime/evidence')
          path.mkdir()
          (path / 'ci-assignment-and-artifacts.json').write_text(json.dumps(receipts, indent=2) + '\n')
          PY
      - name: Download ONE native archive for both source legs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: 11136307415
          github-token: ${{ github.token }}
          run-id: 36800249207
          path: pair-runtime/artifacts/native
          digest-mismatch: error
      - name: Download ONE wheel for both source legs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: 11136385647
          github-token: ${{ github.token }}
          run-id: 36800249207
          path: pair-runtime/artifacts/wheel
          digest-mismatch: error
      - name: GHCR read access
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Pull exact original image
        run: docker pull ghcr.io/tenstorrent/tt-metal/tt-metalium/ubuntu-22.04-dev-amd64@sha256:3643bc059bf70bd14d3031f5f53f8853abc564cd2a5d9a3dcff1b54c7003e25b
      - name: Sealed sequential control; preserve and stop on any native hang
        timeout-minutes: 100
        working-directory: pair-runtime
        env:
          PAIR_PROTOCOL: ${{ inputs.protocol }}
        run: python3 control/.github/scripts/utils/formatter_serial_control.py host "$PAIR_PROTOCOL"
      - name: Identity-checked owned-container cleanup, including cancellation
        if: always()
        timeout-minutes: 3
        working-directory: pair-runtime
        run: python3 control/.github/scripts/utils/formatter_serial_control.py cleanup
      - name: Preserve diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: formatter-58542-serial-control-${{ github.run_id }}
          path: pair-runtime/evidence/
          if-no-files-found: warn
      - name: Cleanup only this job's checkout
        if: always()
        uses: ./pair-runtime/control/.github/actions/cleanup
        with:
          path: ${{ github.workspace }}/pair-runtime

name: "Custom test dispatch"

on:
  workflow_dispatch:
    inputs:
      arch:
        required: true
        type: choice
        options:
          - wormhole_b0
          - blackhole
      runner-label:
        description: 'Optional: N150, N300, BH, config-t3000, topology-6u. for example: ["in-service", "config-t3000"]'
        required: true
        type: string
        default: '["in-service"]'
      tracy:
        required: false
        type: boolean
        default: false
        description: "Build with tracy enabled"
      command:
        required: true
        type: string
      description:
        type: string
        default: "Custom test dispatch"
        required: false
      commit:
        required: false
        type: string
        default: ""
        description: "Commit SHA to test (default: HEAD)"
      platform:
        required: false
        type: choice
        default: "Ubuntu 22.04"
        options:
          - "Ubuntu 22.04"
          - "Ubuntu 24.04"
        description: "Platform to build and test"
      build-type:
        required: false
        type: choice
        options:
          - Release
          - Debug
          - RelWithDebInfo
          - ASan
          - TSan
      enable-lto:
        required: false
        type: boolean
        default: false
        description: "Enable Link Time Optimization (LTO)"

run-name: ${{ inputs.description }}
jobs:
  check-harbor:
    uses: ./.github/workflows/check-harbor.yaml
  split-commands:
    needs: check-harbor
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    outputs:
      commands: ${{ steps.split.outputs.commands }}
      build: ${{ steps.split.outputs.build }}
    steps:
      - name: Split the command input
        id: split
        shell: bash
        env:
          COMMANDS: ${{ inputs.command }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, re, sys

          def name(command):
              files = [os.path.basename(f) for f in re.findall(r"\S+\.py", command)]
              selection = re.search(r"-k\s+('[^']*'|\"[^\"]*\"|\S+)", command)
              label = " ".join(files) or command
              return f"{label} {selection.group(1)}" if selection else label

          parts = [p for p in (p.strip() for p in os.environ["COMMANDS"].split(";;")) if p]
          build = parts.pop(0)[len("build=") :] if parts and re.fullmatch(r"build=\d+", parts[0]) else ""
          stray = [p for p in parts if re.match(r"(?i)build\s*[=:]", p)]
          if stray:
              sys.exit(f"{stray[0]!r} is not a build pin; expected build=<run id>")
          if not parts:
              sys.exit("no test commands")
          print("build=" + build)
          print("commands=" + json.dumps([{"name": name(p), "run": p} for p in parts]))
          PY
          cat "$GITHUB_OUTPUT"

  # NOTE: build-artifact.yaml handles platform parsing internally.
  # Just pass platform and enable-lto inputs directly.
  build-artifact:
    needs: [check-harbor, split-commands]
    if: ${{ !cancelled() && needs.split-commands.result == 'success' }}
    uses: ./.github/workflows/build-artifact.yaml
    permissions:
      contents: read
      packages: write
    secrets: inherit
    with:
      harbor-prefix: ${{ needs.check-harbor.outputs.harbor-prefix }}
      tracy: ${{ inputs.tracy }}
      build-wheel: true
      ref: ${{ inputs.commit || github.sha }}
      use-artifacts-from-run: ${{ needs.split-commands.outputs.build }}
      platform: ${{ inputs.platform || 'Ubuntu 22.04' }}
      build-type: ${{ inputs.build-type || 'Release' }}
      enable-lto: ${{ inputs.enable-lto || false }}
  test-dispatch:
    needs: [check-harbor, build-artifact, split-commands]
    if: ${{ !cancelled() && needs.build-artifact.result == 'success' }}
    name: ${{ matrix.command.name }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        command: ${{ fromJSON(needs.split-commands.outputs.commands) }}
    runs-on: ${{ fromJSON(inputs.runner-label) }}
    container:
      image: ${{ contains(inputs.runner-label, 'tt-ubuntu-2204') && needs.check-harbor.outputs.harbor-prefix || '' }}${{ needs.build-artifact.outputs.dev-docker-image || 'docker-image-unresolved' }}
      env:
        ARCH_NAME: ${{ inputs.arch }}
        LOGURU_LEVEL: INFO
        PYTHONPATH: /work
        LD_LIBRARY_PATH: /work/build/lib
        GTEST_OUTPUT: xml:/work/generated/test_reports/
        TT_METAL_HOME: /work
        HF_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN }}
      volumes:
        - ${{ github.workspace }}/docker-job:/work # Subdir to workaround https://github.com/actions/runner/issues/691
        - ${{ !contains(inputs.runner-label, 'viommu') && '/dev/hugepages-1G:/dev/hugepages-1G' || '/nohugepages:/nohugepages' }}
        - ${{ !contains(inputs.runner-label, 'tt-ubuntu-2204') && '/mnt/MLPerf:/mnt/MLPerf:ro' || '/donotmount:/donotmount:ro' }}
      options: "--device /dev/tenstorrent"
    defaults:
      run:
        shell: bash
        working-directory: /work # https://github.com/actions/runner/issues/878
    steps:
      - name: 🧬 Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        timeout-minutes: 10
        with:
          fetch-depth: 1
          submodules: recursive
          path: docker-job
          ref: ${{ inputs.commit || github.sha }}
      - name: 📦 Download Build Artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        timeout-minutes: 10
        with:
          name: ${{ needs.build-artifact.outputs.build-artifact-name }}
          path: docker-job
      - name: 📂 Extract Build Files
        timeout-minutes: 10
        working-directory: docker-job
        run: tar --zstd -xf ttm_any.tar.zst
        shell: bash
      - name: 🧪 Download Python Wheel
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        timeout-minutes: 10
        with:
          name: ${{ needs.build-artifact.outputs.wheel-artifact-name }}
          path: docker-job
      - name: 💿 Install Wheel
        timeout-minutes: 10
        working-directory: docker-job
        run: |
          echo "📂 In directory: $(pwd)"
          echo "📄 Files:"
          ls -la
          WHEEL_FILENAME=$(ls -1 *.whl)
          echo "📦 Installing $WHEEL_FILENAME"
          uv pip install "$WHEEL_FILENAME"
        shell: bash
      - name: Run regression in loop
        run: |
          uv pip install pytest-repeat
          ${{ matrix.command.run }}
        shell: bash
      - uses: tenstorrent/tt-metal/.github/actions/cleanup@main
        if: always()

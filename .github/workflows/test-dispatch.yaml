name: PCH pool A/B without kernel ccache

on:
  workflow_dispatch:
    inputs:
      wheel-run-id:
        description: Sanity workflow run containing the wheel to test
        required: true
        type: string
      wheel-artifact:
        description: Wheel artifact name from that run
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  pool:
    name: Wormhole pool PCH order=${{ matrix.order }} (ccache disabled)
    strategy:
      fail-fast: false
      matrix:
        include:
          - order: off-on
            first: "0"
            second: "1"
          - order: on-off
            first: "1"
            second: "0"
    runs-on: [tt-ubuntu-2204-N300-viommu-stable]
    timeout-minutes: 150
    container:
      image: ghcr.io/tenstorrent/tt-metal/tt-metalium/ubuntu-22.04-ci-test-amd64:47c36e3a5e196b42b0abf8512c801be5f089f162
      env:
        LOGURU_LEVEL: INFO
        PYTHONPATH: /work
        TT_LOGGER_LEVEL: info
        CCACHE_DISABLE: "1"
        TTNN_CONFIG_OVERRIDES: '{"validate_program_args": true}'
      volumes:
        - ${{ github.workspace }}/docker-job:/work
        - /dev/hugepages-1G:/dev/hugepages-1G
      options: --device /dev/tenstorrent -e TT_GH_CI_INFRA
    defaults:
      run:
        shell: bash
        working-directory: /work
    steps:
      - name: Initial disk space
        working-directory: /
        run: df -h / /work /github/home /tmp
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: docker-job
          submodules: recursive
      - name: Download wheel under test
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.wheel-artifact }}
          run-id: ${{ inputs.wheel-run-id }}
          github-token: ${{ github.token }}
          path: docker-job
      - name: Install wheel under test
        run: uv pip install ./*.whl
      - name: Set up runtime without kernel ccache
        uses: ./docker-job/.github/actions/setup-job
        with:
          use-evaluation-image: true
          enable-kernel-ccache: false
      - name: First pool sweep (PCH=${{ matrix.first }})
        uses: ./docker-job/.github/actions/run-with-log
        with:
          log-file: generated/pch-diagnosis/first.log
          run: python3 -u .github/scripts/diagnose_pch_pool.py --pch ${{ matrix.first }} --phase suite --label first
      - name: Upload first sweep immediately
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pch-no-ccache-${{ matrix.order }}-first
          path: docker-job/generated/pch-diagnosis
      - name: Second pool sweep (PCH=${{ matrix.second }})
        if: ${{ !cancelled() }}
        uses: ./docker-job/.github/actions/run-with-log
        with:
          log-file: generated/pch-diagnosis/second.log
          run: python3 -u .github/scripts/diagnose_pch_pool.py --pch ${{ matrix.second }} --phase suite --label second
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pch-no-ccache-${{ matrix.order }}
          path: docker-job/generated/pch-diagnosis
      - uses: tenstorrent/tt-metal/.github/actions/cleanup@main
        if: always()

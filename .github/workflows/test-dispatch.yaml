name: "Custom test dispatch"

on:
  workflow_dispatch:
    inputs:
      arch:
        required: true
        type: choice
        options:
          - wormhole_b0
          - blackhole
      runner-label:
        description: 'Optional: N150, N300, BH, config-t3000, topology-6u. for example: ["in-service", "config-t3000"]'
        required: true
        type: string
        default: '["in-service"]'
      tracy:
        required: false
        type: boolean
        default: false
        description: "Build with tracy enabled"
      command:
        required: true
        type: string
      description:
        type: string
        default: "Custom test dispatch"
        required: false
      commit:
        required: false
        type: string
        default: ""
        description: "Commit SHA to test (default: HEAD)"
      platform:
        required: false
        type: choice
        default: "Ubuntu 22.04"
        options:
          - "Ubuntu 22.04"
          - "Ubuntu 24.04"
        description: "Platform to build and test"
      build-type:
        required: false
        type: choice
        options:
          - Release
          - Debug
          - RelWithDebInfo
          - ASan
          - TSan
      enable-lto:
        required: false
        type: boolean
        default: false
        description: "Enable Link Time Optimization (LTO)"

run-name: ${{ inputs.description }}
jobs:
  check-harbor:
    uses: ./.github/workflows/check-harbor.yaml
  # NOTE: build-artifact.yaml handles platform parsing internally.
  # Just pass platform and enable-lto inputs directly.
  build-artifact:
    needs: check-harbor
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/build-artifact.yaml
    permissions:
      contents: read
      packages: write
    secrets: inherit
    with:
      harbor-prefix: ${{ needs.check-harbor.outputs.harbor-prefix }}
      tracy: ${{ inputs.tracy }}
      build-inplace-wheel: true
      ref: ${{ inputs.commit || github.sha }}
      platform: ${{ inputs.platform || 'Ubuntu 22.04' }}
      build-type: ${{ inputs.build-type || 'Release' }}
      enable-lto: ${{ inputs.enable-lto || false }}
  test-dispatch:
    needs: [check-harbor, build-artifact]
    if: ${{ !cancelled() && needs.build-artifact.result == 'success' }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      # 4-D matrix: board x dtype x shape x 5 shards, with P100a limited by
      # `exclude` to ONE combo (bf16 x 32x32). Grid = 20 N150 cells + 5 P100a
      # cells = 25, all off the ONE arch-agnostic build. include entries attach
      # per-board (runner label, arch), per-dtype (perf_dtype) and per-shape
      # (perf_shape); GitHub merges an include entry into every cell whose
      # existing keys it matches. inputs.arch / inputs.runner-label are unused.
      #
      # The board/dtype/shape VALUES are load-bearing: the dashboard globs the
      # artifact name below to decide which combo directory a result lands in,
      # and re-checks it against the metadata.perf_dtype/perf_shape/perf_arch
      # the harness stamps from PERF_DTYPE/PERF_SHAPE/ARCH_NAME. They must stay
      # in step with COMBOS in the dashboard's daily-eltwise-perf.yml. N150 is
      # the implicit board there (no prefix in the artifact name) so the four
      # original combos' names, directories and history never had to change.
      #
      # `label` rides on the board entries and runs-on reads matrix.label: the
      # container block keys off contains(matrix.label, ...) to pick the viommu
      # paths (harbor image prefix, /nohugepages, no /mnt/MLPerf). Hard-coding
      # the runner would silently take the non-viommu branch and mount paths
      # that do not exist on the pod.
      matrix:
        board: [n150, p100a]
        dtype: [bf16, fp32]
        shape: [32x32, 256x256]
        shard: [1, 2, 3, 4, 5]
        exclude:
          - board: p100a
            dtype: fp32
          - board: p100a
            shape: 256x256
        include:
          - board: n150
            label: tt-ubuntu-2204-N150-viommu-stable
            arch: wormhole_b0
          - board: p100a
            label: tt-ubuntu-2204-P100a-viommu-stable
            arch: blackhole
          - dtype: bf16
            perf_dtype: bfloat16
          - dtype: fp32
            perf_dtype: float32
          - shape: 32x32
            perf_shape: "1,1,32,32"
          - shape: 256x256
            perf_shape: "1,1,256,256"
    runs-on: ${{ matrix.label }}
    container:
      image: ${{ contains(matrix.label, 'tt-ubuntu-2204') && needs.check-harbor.outputs.harbor-prefix || '' }}${{ needs.build-artifact.outputs.dev-docker-image || 'docker-image-unresolved' }}
      env:
        ARCH_NAME: ${{ matrix.arch }}          # per board; the harness stamps it as perf_arch
        PERF_SHAPE: ${{ matrix.perf_shape }}   # test_eltwise_operations.py reads this
        PERF_DTYPE: ${{ matrix.perf_dtype }}   # ...and this (defaults to bfloat16 if unset)
        LOGURU_LEVEL: INFO
        PYTHONPATH: /work
        LD_LIBRARY_PATH: /work/build/lib
        GTEST_OUTPUT: xml:/work/generated/test_reports/
        TT_METAL_HOME: /work
      volumes:
        - ${{ github.workspace }}/docker-job:/work # Subdir to workaround https://github.com/actions/runner/issues/691
        - ${{ !contains(matrix.label, 'viommu') && '/dev/hugepages-1G:/dev/hugepages-1G' || '/nohugepages:/nohugepages' }}
        - ${{ !contains(matrix.label, 'tt-ubuntu-2204') && '/mnt/MLPerf:/mnt/MLPerf:ro' || '/donotmount:/donotmount:ro' }}
      options: "--device /dev/tenstorrent"
    defaults:
      run:
        shell: bash
        working-directory: /work # https://github.com/actions/runner/issues/878
    steps:
      - name: 🧬 Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        timeout-minutes: 10
        with:
          fetch-depth: 1
          submodules: recursive
          path: docker-job
          ref: ${{ inputs.commit || github.sha }}
      - name: 📦 Download Build Artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        timeout-minutes: 10
        with:
          name: ${{ needs.build-artifact.outputs.build-artifact-name }}
          path: docker-job
      - name: 📂 Extract Build Files
        timeout-minutes: 10
        working-directory: docker-job
        run: tar --zstd -xf ttm_any.tar.zst
        shell: bash
      - name: 🧪 Download Python Wheel
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        timeout-minutes: 10
        with:
          name: ${{ needs.build-artifact.outputs.wheel-artifact-name }}
          path: docker-job
      - name: 💿 Install Wheel
        timeout-minutes: 10
        working-directory: docker-job
        run: |
          echo "📂 In directory: $(pwd)"
          echo "📄 Files:"
          ls -la
          WHEEL_FILENAME=$(ls -1 *.whl)
          echo "📦 Installing $WHEEL_FILENAME"
          uv pip install "$WHEEL_FILENAME"
        shell: bash
      - name: Run regression in loop
        env:
          SHARD: ${{ matrix.shard }}
          SHARD_TOTAL: "5"
        run: |
          uv pip install pytest-repeat
          ${{ inputs.command }}
        shell: bash
      - name: 🏷️ Name shard result
        if: always()
        working-directory: /work
        run: |
          f=$(ls -1 eltwise_perf_results_*_final.json 2>/dev/null | head -1)
          if [ -n "$f" ]; then mv "$f" "shard-${{ matrix.shard }}.json"; fi
        shell: bash
      - name: 📤 Upload shard result JSON
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # Per-board, per-shape, per-shard artifact so the combine job can
          # group by (board, shape).
          # N150 keeps the un-prefixed name it always had; other boards get a
          # `<board>-` prefix. Mirrors the dashboard's COMBOS key rule.
          name: eltwise-perf-results-${{ matrix.board != 'n150' && format('{0}-', matrix.board) || '' }}${{ matrix.dtype }}-${{ matrix.shape }}-shard-${{ matrix.shard }}
          path: /work/shard-${{ matrix.shard }}.json
          if-no-files-found: error
      - uses: tenstorrent/tt-metal/.github/actions/cleanup@main
        if: always()

name: "Custom test dispatch"
run-name: "Diagnostic only: Llama WH watcher NOINLINE at merge2a631"

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  test-dispatch:
    name: "NOINLINE diagnostic / Llama 3.1-8B unit [wh_llmbox_perf]"
    runs-on: [arch-wormhole_b0, config-t3000, pipeline-perf, in-service]
    timeout-minutes: 90
    container:
      image: ghcr.io/tenstorrent/tt-metal/tt-metalium/ubuntu-22.04-dev-amd64:cc1204b3dea8525419895db3cf805bc6e186e540@sha256:3643bc059bf70bd14d3031f5f53f8853abc564cd2a5d9a3dcff1b54c7003e25b
      env:
        ARCH_NAME: wormhole_b0
        LOGURU_LEVEL: INFO
        TT_LOGGER_LEVEL: warn
        LD_LIBRARY_PATH: /work/build/lib
        GTEST_OUTPUT: xml:/work/generated/test_reports/
        TT_METAL_HOME: /work
        PYTHONPATH: /work
        GTEST_TOTAL_SHARDS: 1
        GTEST_SHARD_INDEX: 0
        HF_HUB_CACHE: /mnt/MLPerf/huggingface/hub
        HF_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN }}
        HF_HUB_OFFLINE: 1
      volumes:
        - ${{ github.workspace }}/docker-job:/work
        - /dev/hugepages-1G:/dev/hugepages-1G
        - /mnt/MLPerf:/mnt/MLPerf:ro
      options: "--device /dev/tenstorrent"
    defaults:
      run:
        shell: bash
        working-directory: /work
    steps:
      - name: Checkout exact failed source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        timeout-minutes: 20
        with:
          ref: 2a631e7214d4e3aa6440ec50048edd278e88422d
          submodules: recursive
          path: docker-job
      - name: Checkout diagnostic observer separately
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        timeout-minutes: 10
        with:
          ref: ${{ github.sha }}
          sparse-checkout: .github/scripts/utils/formatter_noinline_diagnostic.py
          sparse-checkout-cone-mode: false
          path: diagnostic-control
      - name: Download original native artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        timeout-minutes: 10
        with:
          artifact-ids: 11115885924
          run-id: 36752002112
          github-token: ${{ github.token }}
          path: docker-job
          digest-mismatch: error
      - name: Extract original native artifact
        run: tar --zstd -xf ttm_any.tar.zst
      - name: Download original wheel
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        timeout-minutes: 10
        with:
          artifact-ids: 11115716089
          run-id: 36752002112
          github-token: ${{ github.token }}
          path: docker-job
          digest-mismatch: error
      - name: Install original wheel
        run: uv pip install ./ttnn-0.75.0rc10.dev2389+g2a631e7214-cp310-cp310-manylinux_2_35_x86_64.whl
      - name: Original unit recipe with NOINLINE only
        timeout-minutes: 18
        uses: ./docker-job/.github/actions/run-with-log
        with:
          log-file: generated/test_logs/noinline-diagnostic.log
          run: |
            mkdir -p generated/test_reports
            python3 "$GITHUB_WORKSPACE/diagnostic-control/.github/scripts/utils/formatter_noinline_diagnostic.py"
      - name: Preserve diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: watcher-noinline-diagnostic-${{ github.run_id }}
          path: |
            docker-job/generated/noinline-diagnostic/
            docker-job/generated/test_logs/noinline-diagnostic.log
            docker-job/generated/test_reports/
          if-no-files-found: warn
      - uses: tenstorrent/tt-metal/.github/actions/cleanup@main
        if: always()

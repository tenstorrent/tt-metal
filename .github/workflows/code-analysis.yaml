name: "Code analysis"

on:
  schedule:
    # Run every 6 hours to keep ccache/ctcache warm for code-analysis PR runs (Ubuntu 24.04)
    - cron: "0 */2 * * *"
  workflow_call:
    inputs:
      platform:
        required: false
        type: string
        default: "Ubuntu 24.04"
        description: "Platform to analyze (e.g., 'Ubuntu 22.04', 'Ubuntu 24.04')"
      architecture:
        required: false
        type: string
        default: "amd64"
      # Pre-built Docker image tags (optional - if provided, skips docker build)
      ci-build-docker-image:
        required: false
        type: string
        default: ""
        description: "Pre-built CI Build Docker image tag"
      dev-docker-image:
        required: false
        type: string
        default: ""
        description: "Pre-built Dev Docker image tag"
      build-type:
        required: false
        type: string
        default: "Release"
        description: "Build type configuration (Release, Debug, RelWithDebInfo, ASan, TSan)"
      enable-lto:
        required: false
        type: boolean
        default: false
        description: "Enable Link Time Optimization (LTO)"
      force-scan:
        required: false
        type: boolean
        default: false
        description: "Force a full scan even if no C++ changes are detected"
      post-pr-suggestions:
        required: false
        type: boolean
        default: false
        description: "Post inline clang-tidy fix suggestions on PR diffs"
      check-harbor-runs-on:
        required: false
        type: string
        default: "tt-ubuntu-light"
        description: "Runner label for the Harbor health check job"
  workflow_dispatch:
    inputs:
      architecture:
        required: false
        type: string
        default: "amd64"
      platform:
        required: false
        type: choice
        default: "Ubuntu 24.04"
        options:
          - "Ubuntu 22.04"
          - "Ubuntu 24.04"
        description: "Platform to analyze"
      build-type:
        required: false
        type: choice
        default: Release
        options:
          - Release
          - Debug
          - RelWithDebInfo
          - ASan
          - TSan
        description: "Build type configuration"
      enable-lto:
        required: false
        type: boolean
        default: false
        description: "Enable Link Time Optimization (LTO)"
      force-scan:
        required: false
        type: boolean
        default: false
        description: "Force a full scan even if no C++ changes are detected"

jobs:
  # NOTE: Platform parsing is handled by build-docker-artifact.yaml internally.
  # This workflow only needs to pass the platform string.

  determine-scan-type:
    runs-on: ubuntu-latest
    outputs:
      do-full-scan: ${{ steps.compute-outputs.outputs.do-full-scan }}
      do-scan: ${{ steps.compute-outputs.outputs.do-scan }}
      api-headers-changed: ${{ steps.find-changes.outputs.tt-metalium-api-headers-changed }}
    steps:
      - name: Check out repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        timeout-minutes: 20
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Configure git safe.directory
        run: git config --global --add safe.directory ${{ github.workspace }}

      - id: find-changes
        uses: ./.github/actions/find-changed-files

      - id: compute-outputs
        shell: bash
        run: |
          # Full scan on main, when .clang-tidy config changed, or when forced
          if [[ "${{ inputs.force-scan }}" == "true" ]] || \
             [[ "${{ github.ref_name }}" == "main" ]] || \
             [[ "${{ steps.find-changes.outputs.clang-tidy-config-changed }}" == "true" ]]; then
            do_full_scan="true"
          else
            do_full_scan="false"
          fi

          # Skip scan entirely if no code/cmake changes and not a full scan
          if [[ "$do_full_scan" == "true" ]] || \
             [[ "${{ steps.find-changes.outputs.any-code-changed }}" == "true" ]]; then
            do_scan="true"
          else
            do_scan="false"
          fi

          echo "Do a scan: $do_scan"
          echo "Do a full scan: $do_full_scan"
          echo "do-full-scan=$do_full_scan" >> "$GITHUB_OUTPUT"
          echo "do-scan=$do_scan" >> "$GITHUB_OUTPUT"

  # Check Harbor availability first
  check-harbor:
    uses: ./.github/workflows/check-harbor.yaml
    with:
      runs-on: ${{ inputs.check-harbor-runs-on }}

  # Only build docker images if pre-built tags are not provided
  build-docker-image:
    if: ${{ always() && !failure() && !cancelled() && inputs.ci-build-docker-image == '' }}
    needs: check-harbor
    uses: ./.github/workflows/build-docker-artifact.yaml
    permissions:
      contents: read
      packages: write
    secrets: inherit
    with:
      platform: ${{ inputs.platform || 'Ubuntu 24.04' }}
      architecture: ${{ inputs.architecture || 'amd64' }}
      harbor-prefix: ${{ needs.check-harbor.outputs.harbor-prefix }}

  resolve-docker-pull-refs:
    needs: [check-harbor, build-docker-image]
    if: ${{ always() && !failure() && !cancelled() }}
    uses: ./.github/workflows/resolve-docker-pull-refs.yaml
    with:
      harbor-prefix: ${{ needs.check-harbor.outputs.harbor-prefix }}
      ci-build-docker-image: ${{ inputs.ci-build-docker-image || needs.build-docker-image.outputs.ci-build-tag }}

  # Full scan: single job that analyzes everything
  clang-tidy-full:
    name: 🤖 Clang Tidy (Full)
    needs: [resolve-docker-pull-refs, build-docker-image, determine-scan-type]
    if: >-
      ${{ always() && !failure() && !cancelled() &&
          needs.determine-scan-type.outputs.do-scan == 'true' &&
          needs.determine-scan-type.outputs.do-full-scan == 'true' }}
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/clang-tidy-reusable.yaml
    secrets: inherit
    with:
      platform: ${{ inputs.platform || 'Ubuntu 24.04' }}
      architecture: ${{ inputs.architecture || 'amd64' }}
      ci-build-docker-image: ${{ needs.resolve-docker-pull-refs.outputs.ci-build-docker-image }}
      prereq-targets: ''
      scan-targets: ''
      post-pr-suggestions: ${{ inputs.post-pr-suggestions || false }}

  # Incremental scan: parallel jobs for different targets
  clang-tidy-incremental-tt-metal:
    name: 🤖 Clang Tidy (Metalium)
    needs: [resolve-docker-pull-refs, build-docker-image, determine-scan-type]
    if: >-
      ${{ always() && !failure() && !cancelled() &&
          needs.determine-scan-type.outputs.do-scan == 'true' &&
          needs.determine-scan-type.outputs.do-full-scan != 'true' }}
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/clang-tidy-reusable.yaml
    secrets: inherit
    with:
      platform: ${{ inputs.platform || 'Ubuntu 24.04' }}
      architecture: ${{ inputs.architecture || 'amd64' }}
      ci-build-docker-image: ${{ needs.resolve-docker-pull-refs.outputs.ci-build-docker-image }}
      prereq-targets: ''
      scan-targets: 'tt_metal'
      post-pr-suggestions: ${{ inputs.post-pr-suggestions || false }}

  clang-tidy-incremental-ttnn:
    name: 🤖 Clang Tidy (TTNN)
    needs: [resolve-docker-pull-refs, build-docker-image, determine-scan-type]
    if: >-
      ${{ always() && !failure() && !cancelled() &&
          needs.determine-scan-type.outputs.do-scan == 'true' &&
          needs.determine-scan-type.outputs.do-full-scan != 'true' }}
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/clang-tidy-reusable.yaml
    secrets: inherit
    with:
      platform: ${{ inputs.platform || 'Ubuntu 24.04' }}
      architecture: ${{ inputs.architecture || 'amd64' }}
      ci-build-docker-image: ${{ needs.resolve-docker-pull-refs.outputs.ci-build-docker-image }}
      prereq-targets: 'tt_metal'
      scan-targets: 'ttnn'
      post-pr-suggestions: ${{ inputs.post-pr-suggestions || false }}

  clang-tidy-incremental-tt-train:
    name: 🤖 Clang Tidy (tt-train)
    needs: [resolve-docker-pull-refs, build-docker-image, determine-scan-type]
    if: >-
      ${{ always() && !failure() && !cancelled() &&
          needs.determine-scan-type.outputs.do-scan == 'true' &&
          needs.determine-scan-type.outputs.do-full-scan != 'true' }}
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/clang-tidy-reusable.yaml
    secrets: inherit
    with:
      platform: ${{ inputs.platform || 'Ubuntu 24.04' }}
      architecture: ${{ inputs.architecture || 'amd64' }}
      ci-build-docker-image: ${{ needs.resolve-docker-pull-refs.outputs.ci-build-docker-image }}
      prereq-targets: 'tt_metal ttnn'
      scan-targets: 'tt-train'
      post-pr-suggestions: ${{ inputs.post-pr-suggestions || false }}

  clang-tidy-incremental-catchall:
    name: 🤖 Clang Tidy (catchall)
    needs: [resolve-docker-pull-refs, build-docker-image, determine-scan-type]
    if: >-
      ${{ always() && !failure() && !cancelled() &&
          needs.determine-scan-type.outputs.do-scan == 'true' &&
          needs.determine-scan-type.outputs.do-full-scan != 'true' }}
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/clang-tidy-reusable.yaml
    secrets: inherit
    with:
      platform: ${{ inputs.platform || 'Ubuntu 24.04' }}
      architecture: ${{ inputs.architecture || 'amd64' }}
      ci-build-docker-image: ${{ needs.resolve-docker-pull-refs.outputs.ci-build-docker-image }}
      prereq-targets: 'tt_metal ttnn'
      scan-targets: ''
      post-pr-suggestions: ${{ inputs.post-pr-suggestions || false }}

  # Report-only IWYU on the tt_metal public headers touched by the PR. IWYU needs a
  # translation unit; CMake's header-set verification already generates one per
  # public header (with the real flags and an `IWYU pragma: associated` include),
  # so this configures, builds only the generated API headers, and analyzes those.
  # Not a gate: findings go to the step summary and an artifact. See
  # .github/scripts/utils/run_api_header_iwyu.sh.
  iwyu-api-headers:
    name: "🔍 IWYU (tt_metal API headers)"
    needs: [check-harbor, determine-scan-type]
    if: >-
      ${{ !cancelled() && github.event_name == 'pull_request' &&
          needs.determine-scan-type.outputs.api-headers-changed == 'true' }}
    # Mostly single-threaded (CMake configure, flatc, IWYU on a few headers); medium is
    # the smallest self-hosted size that already runs CPU-only container jobs.
    runs-on: tt-ubuntu-2204-medium-stable
    timeout-minutes: 30
    continue-on-error: true
    permissions:
      contents: read
    container:
      # ci-test rather than ci-build: include-what-you-use is installed from the
      # ci-test-light stage onward (dockerfile/Dockerfile), same as iwyu-host.yaml.
      image: ${{ format('{0}{1}', needs.check-harbor.outputs.harbor-prefix, 'ghcr.io/tenstorrent/tt-metal/tt-metalium/ubuntu-24.04-ci-test-amd64:latest') }}
      volumes:
        - ${{ github.workspace }}:/work
      options: --tmpfs /tmp
    defaults:
      run:
        shell: bash
        working-directory: /work # https://github.com/actions/runner/issues/878
    steps:
      - name: Check out repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        timeout-minutes: 20
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Configure git safe.directory
        run: git config --global --add safe.directory /work

      - name: 📦 Restore CPM source cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .cpmcache.tar.zst
          key: cpm-z22-${{ hashFiles('third_party/CMakeLists.txt', 'tt_metal/third_party/umd/third_party/CMakeLists.txt', 'tt-train/cmake/dependencies.cmake') }}
          restore-keys: cpm-z22-

      - name: Unpack CPM cache
        run: |
          [ -f .cpmcache.tar.zst ] && tar -I 'zstd -T0' -xf .cpmcache.tar.zst || true

      - name: 🔧 CMake configure
        run: cmake --preset iwyu

      - name: 🛠️ Generate API headers
        run: cmake --build .build/iwyu --target metalium_GeneratedHeaders

      - name: 🔍 Analyze changed API headers with include-what-you-use
        run: |
          base=$(git merge-base origin/main HEAD)
          mapfile -t headers < <(git diff --name-only --diff-filter=ACMR "${base}..HEAD" -- 'tt_metal/api/*.h' 'tt_metal/api/*.hpp')
          if [ "${#headers[@]}" -eq 0 ]; then
            # Triggered by a change to the check itself, not by a header.
            headers=(--all)
          fi
          .github/scripts/utils/run_api_header_iwyu.sh .build/iwyu "${headers[@]}"

      - name: Upload IWYU report
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: iwyu-api-headers-report
          path: |
            /work/.build/iwyu/report-api/iwyu.txt
            /work/.build/iwyu/report-api/iwyu-version.txt
            /work/.build/iwyu/report-api/iwyu-exit-code.txt
          retention-days: 30

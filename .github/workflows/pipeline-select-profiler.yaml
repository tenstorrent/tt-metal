name: "(Profiler) Choose your pipeline"

on:
  schedule:
    - cron: "0 2 * * *" # Run daily at 2am UTC
  workflow_dispatch:
    inputs:
      run-t3k-profiler:
        description: "T3K profiler"
        required: false
        type: boolean
        default: true
      run-galaxy-profiler:
        description: "Galaxy profiler"
        required: false
        type: boolean
        default: false
      run-blackhole-profiler:
        description: "Blackhole profiler"
        required: false
        type: boolean
        default: true
      run-n300-profiler:
        description: "N300 profiler"
        required: false
        type: boolean
        default: true
      run-n150-profiler:
        description: "N150 profiler"
        required: false
        type: boolean
        default: true
      platform:
        required: false
        type: choice
        default: "Ubuntu 22.04"
        options:
          - "Ubuntu 22.04"
          - "Ubuntu 24.04"
        description: "Platform to build and test"
      build-type:
        required: false
        type: choice
        default: Release
        options:
          - Release
          - Debug
          - RelWithDebInfo
          - ASan
          - TSan
        description: "Build type configuration"
      enable-lto:
        required: false
        type: boolean
        default: false
        description: "Enable Link Time Optimization (LTO)"

jobs:
  determine-tests:
    runs-on: ubuntu-slim
    outputs:
      run-galaxy: ${{ steps.logic.outputs.run-galaxy }}
      run-t3k: ${{ steps.logic.outputs.run-t3k }}
      run-single-card: ${{ steps.logic.outputs.run-single-card }}
      single-card-skus: ${{ steps.logic.outputs.single-card-skus }}
      any-selected: ${{ steps.logic.outputs.any-selected }}
    steps:
      - name: Determine sub-pipeline selection
        id: logic
        run: |
          set -e
          # Schedule events don't carry workflow_dispatch inputs, so
          # the run-* booleans evaluate as empty. Run every sub-pipeline.
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            galaxy=true
            t3k=true
            bh=true
            n300=true
            n150=true
          else
            galaxy="${{ inputs.run-galaxy-profiler }}"
            t3k="${{ inputs.run-t3k-profiler }}"
            bh="${{ inputs.run-blackhole-profiler }}"
            n300="${{ inputs.run-n300-profiler }}"
            n150="${{ inputs.run-n150-profiler }}"
          fi

          parts=()
          [[ "$bh" == "true" ]]   && parts+=("bh_p100a_civ2_viommu" "bh_p150b_civ2_viommu")
          [[ "$n300" == "true" ]] && parts+=("wh_n300_civ2")
          [[ "$n150" == "true" ]] && parts+=("wh_n150_civ2")
          sc_skus=$(IFS=,; echo "${parts[*]}")

          [[ -n "$sc_skus" ]] && run_sc=true || run_sc=false

          any=false
          { [[ "$galaxy" == "true" ]] || [[ "$t3k" == "true" ]] || [[ "$run_sc" == "true" ]]; } && any=true

          if [[ "$any" != "true" ]]; then
            echo "::error::No profiler sub-pipeline selected. Enable at least one of the run-*-profiler inputs."
            exit 1
          fi

          echo "run-galaxy=$galaxy"        >> "$GITHUB_OUTPUT"
          echo "run-t3k=$t3k"              >> "$GITHUB_OUTPUT"
          echo "run-single-card=$run_sc"   >> "$GITHUB_OUTPUT"
          echo "single-card-skus=$sc_skus" >> "$GITHUB_OUTPUT"
          echo "any-selected=$any"         >> "$GITHUB_OUTPUT"

  build-artifact:
    needs: determine-tests
    if: ${{ needs.determine-tests.outputs.any-selected == 'true' }}
    uses: ./.github/workflows/build-artifact.yaml
    permissions:
      contents: read
      packages: write
    secrets: inherit
    with:
      tracy: true
      build-inplace-wheel: true
      platform: ${{ inputs.platform || 'Ubuntu 22.04' }}
      build-type: ${{ inputs.build-type || 'Release' }}
      enable-lto: ${{ inputs.enable-lto || false }}

  # Bakes the source tree and this run's build output into one image the test legs
  # run in, so they need no artifact download and no recursive checkout. One bake
  # serves all three legs, since they share the one build-artifact above and all
  # take the build tarball on the dev base.
  #
  # No consumer gate needed here: determine-tests.any-selected is true only when at
  # least one of run-galaxy, run-t3k and run-single-card is, and all three of those
  # legs consume this image. build-artifact already carries that gate.
  bake-env-dev-full:
    needs: [determine-tests, build-artifact]
    if: ${{ !cancelled() && needs.build-artifact.result == 'success' }}
    uses: ./.github/workflows/build-prebuilt-tests-image.yaml
    permissions:
      contents: read
      packages: write
      actions: read
    secrets: inherit
    with:
      artifact-name: ${{ needs.build-artifact.outputs.build-artifact-name }}
      # Canonical, never a resolve-docker-pull-refs output: that one is
      # Harbor-prefixed and the producer runs GitHub-hosted with no Harbor access.
      base-image: ${{ needs.build-artifact.outputs.dev-docker-image }}
      dockerfile: dockerfile/Dockerfile.prebuilt-tests-env
      image-name: prebuilt-tests-env-image
      checkout-source: true
      build-args: PROFILE=full
      # No source-ref: this caller takes no ref, so the producer's default (its own
      # commit) is already the commit build-artifact built.

  galaxy-profiler-tests:
    needs: [determine-tests, build-artifact, bake-env-dev-full]
    # bake-env-dev-full is in needs but deliberately absent from the if:. A failed
    # bake leaves the ref empty and the legs fall back to the artifact path; gating
    # on it would skip the suite instead. The if: therefore restates the
    # build-artifact dependency the bare needs list used to imply. determine-tests
    # stays covered by the run-* check, which is empty unless that job succeeded.
    if: ${{ !cancelled() && needs.build-artifact.result == 'success' &&
     needs.determine-tests.outputs.run-galaxy == 'true' }}
    uses: ./.github/workflows/galaxy-profiler-tests-impl.yaml
    secrets: inherit
    with:
      docker-image: ${{ needs.build-artifact.outputs.dev-docker-image }}
      prebuilt-image: ${{ needs.bake-env-dev-full.outputs.image }}
      build-artifact-name: ${{ needs.build-artifact.outputs.build-artifact-name }}
      wheel-artifact-name: ${{ needs.build-artifact.outputs.wheel-artifact-name }}

  t3000-profiler-tests:
    needs: [determine-tests, build-artifact, bake-env-dev-full]
    # bake-env-dev-full is in needs but deliberately absent from the if:. A failed
    # bake leaves the ref empty and the legs fall back to the artifact path; gating
    # on it would skip the suite instead. The if: therefore restates the
    # build-artifact dependency the bare needs list used to imply. determine-tests
    # stays covered by the run-* check, which is empty unless that job succeeded.
    if: ${{ !cancelled() && needs.build-artifact.result == 'success' &&
     needs.determine-tests.outputs.run-t3k == 'true' }}
    uses: ./.github/workflows/t3000-profiler-tests-impl.yaml
    secrets: inherit
    with:
      docker-image: ${{ needs.build-artifact.outputs.dev-docker-image }}
      prebuilt-image: ${{ needs.bake-env-dev-full.outputs.image }}
      build-artifact-name: ${{ needs.build-artifact.outputs.build-artifact-name }}
      wheel-artifact-name: ${{ needs.build-artifact.outputs.wheel-artifact-name }}

  single-card-profiler-tests:
    needs: [determine-tests, build-artifact, bake-env-dev-full]
    # bake-env-dev-full is in needs but deliberately absent from the if:. A failed
    # bake leaves the ref empty and the legs fall back to the artifact path; gating
    # on it would skip the suite instead. The if: therefore restates the
    # build-artifact dependency the bare needs list used to imply. determine-tests
    # stays covered by the run-* check, which is empty unless that job succeeded.
    if: ${{ !cancelled() && needs.build-artifact.result == 'success' &&
     needs.determine-tests.outputs.run-single-card == 'true' }}
    uses: ./.github/workflows/single-card-profiler-tests-impl.yaml
    secrets: inherit
    with:
      docker-image: ${{ needs.build-artifact.outputs.dev-docker-image }}
      prebuilt-image: ${{ needs.bake-env-dev-full.outputs.image }}
      build-artifact-name: ${{ needs.build-artifact.outputs.build-artifact-name }}
      wheel-artifact-name: ${{ needs.build-artifact.outputs.wheel-artifact-name }}
      enabled-skus: ${{ needs.determine-tests.outputs.single-card-skus }}
      test-selection: 'all'

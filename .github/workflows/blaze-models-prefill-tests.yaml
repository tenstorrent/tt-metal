name: "Blaze Models Prefill tests"

on:
  workflow_dispatch:
    inputs:
      # Test selection. Each checkbox's id IS a token from the test matrix
      # (tests/pipeline_reorg/blaze_models_prefill_tests.yaml): a test_type, test_group
      # or test_tag. validate-test-type joins the ticked ids into the comma-separated
      # selection, so ids must stay snake_case (hyphenated ids like enable-lto are
      # ignored) and must be valid matrix tokens. Nothing ticked runs everything,
      # which is what the nightly schedule does.
      # workflow_dispatch allows at most 25 inputs and all 25 are used: adding a box
      # means removing one.
      kimi_k3:
        type: boolean
        default: false
        description: "Kimi-K3: every K3 leg (also pulls ring_joint_sdpa_perf)"
      k3_mla_perf:
        type: boolean
        default: false
        description: "K3 > k3_mla_perf"
      k3_accuracy_suite:
        type: boolean
        default: false
        description: "K3 > k3_accuracy_suite"
      k3_prefill_runner_24l:
        type: boolean
        default: false
        description: "K3 > k3_prefill_runner_24l"
      k3_prefill_runner_93l:
        type: boolean
        default: false
        description: "K3 > k3_prefill_runner_93l"
      k3_dspark_runner:
        type: boolean
        default: false
        description: "K3 > k3_dspark_runner"
      kimi_k2_7:
        type: boolean
        default: false
        description: "Kimi-K2.7: every K2.7 leg (also pulls kv_cache_table, ring_joint_sdpa_perf)"
      glm_5_3:
        type: boolean
        default: false
        description: "GLM-5.3: every GLM leg (also pulls kv_cache_table)"
      glm_chunked_perf_suite:
        type: boolean
        default: false
        description: "GLM > glm_chunked_perf_suite"
      glm_components_suite:
        type: boolean
        default: false
        description: "GLM > glm_components_suite"
      dsv4_flash:
        type: boolean
        default: false
        description: "DeepSeek-V4: every V4 leg except transformer depth"
      dsv4_transformer_depth:
        type: boolean
        default: false
        description: "DeepSeek-V4 > dsv4_transformer_depth (real weights, every layer; only runs when ticked)"
      gemma4_d_p:
        type: boolean
        default: false
        description: "Gemma4: every Gemma4 leg except layer perf"
      gemma4_prefill_kv_pcc:
        type: boolean
        default: false
        description: "Gemma4 > gemma4_prefill_kv_pcc"
      gemma4_d_p_layer_perf:
        type: boolean
        default: false
        description: "Gemma4 > gemma4_d_p_layer_perf (Tracy build; only runs when ticked)"
      minimax_m3:
        type: boolean
        default: false
        description: "MiniMax-M3: every MiniMax leg"
      mistral4:
        type: boolean
        default: false
        description: "Mistral4: every Mistral4 leg (also pulls kv_cache_table)"
      llama31:
        type: boolean
        default: false
        description: "Llama3.1: every Llama3.1 leg"
      gpt_oss_prefill_suite:
        type: boolean
        default: false
        description: "gpt-oss: gpt_oss_prefill_suite"
      disagg_prefill:
        type: boolean
        default: false
        description: "Group: every disaggregated-prefill runner+producer leg (SC1 and SC4)"
      sdpa_perf:
        type: boolean
        default: false
        description: "Group: ring-joint SDPA perf + high-bandwidth all-gather / sparse KV push perf"
      moe_gate:
        type: boolean
        default: false
        description: "Cross-model: moe_gate"
      platform:
        required: false
        type: choice
        default: "Ubuntu 22.04"
        options:
          - "Ubuntu 22.04"
          - "Ubuntu 24.04"
        description: "Platform to build and test"
      build-type:
        required: false
        type: choice
        default: Release
        options:
          - Release
          - Debug
          - RelWithDebInfo
          - ASan
          - TSan
        description: "Build type configuration"
      enable-lto:
        required: false
        type: boolean
        default: false
        description: "Enable Link Time Optimization (LTO)"
  schedule:
    - cron: "0 5 * * *" # Run at 5:00 AM UTC every day

jobs:
  validate-test-type:
    # Fail fast on a bad selection before spending a build on it. Emits the
    # normalized selection (empty/"all" -> "all") consumed by the impl filter.
    runs-on: ubuntu-slim
    outputs:
      test-type: ${{ steps.validate.outputs.selection }}
    env:
      TESTS_YAML_PATH: ./tests/pipeline_reorg/blaze_models_prefill_tests.yaml
    steps:
      - name: Checkout the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2 cachew: keep
        timeout-minutes: 20
      - name: Install dependencies
        run: pip3 install PyYAML
      - name: Collect ticked checkboxes
        id: collect
        # Pass inputs via env (not direct ${{ }} interpolation) to avoid shell injection.
        # Only snake_case ids are test tokens; this skips platform/build-type/enable-lto.
        env:
          INPUTS_JSON: ${{ toJSON(inputs) }}
        run: |
          selection=$(python3 -c '
          import json, os, re
          inputs = json.loads(os.environ.get("INPUTS_JSON") or "{}") or {}
          print(",".join(k for k, v in inputs.items()
                         if re.fullmatch(r"[a-z0-9_]+", k) and v in (True, "true")))
          ')
          echo "Ticked: ${selection:-(none, running all)}"
          echo "selection=${selection}" >> "$GITHUB_OUTPUT"
      - name: Validate test-type selection
        id: validate
        env:
          TEST_TYPE: ${{ steps.collect.outputs.selection }}
        run: |
          python3 .github/scripts/utils/validate_test_type_selection.py \
            "${{ env.TESTS_YAML_PATH }}" \
            "${TEST_TYPE}"

  check-harbor:
    needs: validate-test-type
    uses: ./.github/workflows/check-harbor.yaml

  build-artifact:
    needs: [validate-test-type, check-harbor]
    if: ${{ !cancelled() && needs.validate-test-type.result == 'success' }}
    uses: ./.github/workflows/build-artifact.yaml
    permissions:
      contents: read
      packages: write
    secrets: inherit
    with:
      harbor-prefix: ${{ needs.check-harbor.outputs.harbor-prefix }}
      build-type: ${{ inputs.build-type || 'Release' }}
      build-inplace-wheel: true
      # Only the layer-perf stage needs a Tracy build.
      tracy: ${{ contains(needs.validate-test-type.outputs.test-type, 'gemma4_d_p_layer_perf') }}
      platform: ${{ inputs.platform || 'Ubuntu 22.04' }}
      enable-lto: ${{ inputs.enable-lto || false }}

  Galaxy-Blaze-models-prefill:
    needs: [validate-test-type, check-harbor, build-artifact]
    permissions:
      id-token: write
      contents: read
      actions: read
      checks: read
    secrets: inherit
    uses: ./.github/workflows/blaze-models-prefill-tests-impl.yaml
    with:
      docker-image: ${{ needs.build-artifact.outputs.dev-docker-image }}
      build-artifact-name: ${{ needs.build-artifact.outputs.build-artifact-name }}
      wheel-artifact-name: ${{ needs.build-artifact.outputs.wheel-artifact-name }}
      enabled-skus: bh_sc1,bh_sc1_high_power
      sp-config: sc1
      test-type: ${{ needs.validate-test-type.outputs.test-type }}
      # Keep the perf checks in a focused job so the long functional run remains unchanged.
      exclude-test-group: sdpa_perf,disagg_prefill,gemma4_d_p_layer_perf,dsv4_transformer_depth
      resource-prefix: module

  Galaxy-Blaze-models-prefill-SDPA-Perf-tests:
    needs: [validate-test-type, check-harbor, build-artifact]
    permissions:
      id-token: write
      contents: read
      actions: read
      checks: read
    secrets: inherit
    uses: ./.github/workflows/blaze-models-prefill-tests-impl.yaml
    with:
      docker-image: ${{ needs.build-artifact.outputs.dev-docker-image }}
      build-artifact-name: ${{ needs.build-artifact.outputs.build-artifact-name }}
      wheel-artifact-name: ${{ needs.build-artifact.outputs.wheel-artifact-name }}
      enabled-skus: bh_sc1,bh_sc1_high_power
      sp-config: sc1
      test-type: ${{ needs.validate-test-type.outputs.test-type }}
      # Own the perf group and nothing else, so a tag shared with a functional entry
      # (mla, determinism, kimi_k3) selects the perf entry here and only here.
      include-test-group: sdpa_perf
      resource-prefix: sdpa-perf

  Galaxy-Blaze-models-prefill-layer-perf:
    needs: [validate-test-type, check-harbor, build-artifact]
    if: ${{ contains(needs.validate-test-type.outputs.test-type, 'gemma4_d_p_layer_perf') }}
    permissions:
      id-token: write
      contents: read
      actions: read
      checks: read
    secrets: inherit
    uses: ./.github/workflows/blaze-models-prefill-tests-impl.yaml
    with:
      docker-image: ${{ needs.build-artifact.outputs.dev-docker-image }}
      build-artifact-name: ${{ needs.build-artifact.outputs.build-artifact-name }}
      wheel-artifact-name: ${{ needs.build-artifact.outputs.wheel-artifact-name }}
      enabled-skus: bh_sc1_high_power
      sp-config: sc1
      test-type: ${{ needs.validate-test-type.outputs.test-type }}
      include-test-group: gemma4_d_p_layer_perf
      resource-prefix: gemma4-layer-perf

  Galaxy-Blaze-models-prefill-dsv4-depth:
    needs: [validate-test-type, check-harbor, build-artifact]
    if: ${{ contains(needs.validate-test-type.outputs.test-type, 'dsv4_transformer_depth') }}
    permissions:
      id-token: write
      contents: read
      actions: read
      checks: read
    secrets: inherit
    uses: ./.github/workflows/blaze-models-prefill-tests-impl.yaml
    with:
      docker-image: ${{ needs.build-artifact.outputs.dev-docker-image }}
      build-artifact-name: ${{ needs.build-artifact.outputs.build-artifact-name }}
      wheel-artifact-name: ${{ needs.build-artifact.outputs.wheel-artifact-name }}
      enabled-skus: bh_sc1
      sp-config: sc1
      test-type: ${{ needs.validate-test-type.outputs.test-type }}
      include-test-group: dsv4_transformer_depth
      resource-prefix: dsv4-depth

  Galaxy-Blaze-models-prefill-sc4:
    needs: [validate-test-type, check-harbor, build-artifact]
    # 4-galaxy (SC4) disaggregated-prefill runner+producer KV-PCC leg. Its own impl
    # invocation because the impl filters the matrix by sp_config, and this is the only
    # sc4 entry (the sc1 job's enabled-skus + sp_config filters already exclude it).
    permissions:
      id-token: write
      contents: read
      actions: read
      checks: read
    secrets: inherit
    uses: ./.github/workflows/blaze-models-prefill-tests-impl.yaml
    with:
      docker-image: ${{ needs.build-artifact.outputs.dev-docker-image }}
      build-artifact-name: ${{ needs.build-artifact.outputs.build-artifact-name }}
      wheel-artifact-name: ${{ needs.build-artifact.outputs.wheel-artifact-name }}
      enabled-skus: bh_sc4,bh_sc4_high_power
      sp-config: sc4
      test-type: ${{ needs.validate-test-type.outputs.test-type }}
      resource-prefix: sc4
      hang-detection-timeout: 120

  Galaxy-Blaze-models-prefill-sc1-runner:
    needs: [validate-test-type, check-harbor, build-artifact]
    permissions:
      id-token: write
      contents: read
      actions: read
      checks: read
    secrets: inherit
    uses: ./.github/workflows/blaze-models-prefill-tests-impl.yaml
    with:
      docker-image: ${{ needs.build-artifact.outputs.dev-docker-image }}
      build-artifact-name: ${{ needs.build-artifact.outputs.build-artifact-name }}
      wheel-artifact-name: ${{ needs.build-artifact.outputs.wheel-artifact-name }}
      enabled-skus: bh_sc1,bh_sc1_high_power
      sp-config: sc1
      test-type: ${{ needs.validate-test-type.outputs.test-type }}
      include-test-group: disagg_prefill
      resource-prefix: sc1-runner
      hang-detection-timeout: 120

  prefill-scaling-summary:
    name: ${{ matrix.title }}
    needs: [Galaxy-Blaze-models-prefill-sc4, Galaxy-Blaze-models-prefill-sc1-runner]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    # Reads the checkout and this run's own artifacts; it writes nothing.
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - model: glm53
            title: "(GLM-5.3-744B) disaggregated prefill SC4 vs SC1 scaling"
          - model: glm53_mtp_kv_share
            title: "(GLM-5.3-744B) MTP KV share prefill SC4 vs SC1 scaling"
          # sc4 alone: K3's sc1 leg runs 24 of 93 layers, so there is no sc1 baseline to scale from.
          - model: kimi_k3
            title: "(Kimi-K3-2.8T) disaggregated prefill SC4 perf"
            sc4_only: true
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2 cachew: keep
        timeout-minutes: 20
      - name: Download per-leg perf metrics
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: prefill-perf-metrics-*
          path: perf_metrics
        continue-on-error: true
      - name: Resolve pipeline gantt URL
        id: gantt
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODEL: ${{ matrix.model }}
        run: |
          id=$(gh api --paginate "/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" \
            --jq ".artifacts[] | select(.name == \"${MODEL}_pipeline_gantt.png\") | .id" | head -1)
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if [ -n "$id" ]; then
            echo "url=${run_url}/artifacts/${id}" >> "$GITHUB_OUTPUT"
          fi
      - name: Plot chunk_time@ISL
        id: plot
        continue-on-error: true
        run: |
          python3 -m venv "${RUNNER_TEMP}/plot-venv"
          "${RUNNER_TEMP}/plot-venv/bin/pip" install --quiet matplotlib
          "${RUNNER_TEMP}/plot-venv/bin/python" models/demos/common/prefill/runners/ci/plot_chunk_time.py \
            --metrics-dir perf_metrics --model "${{ matrix.model }}" -o "${{ matrix.model }}_chunk_time.png"
          if [ -f "${{ matrix.model }}_chunk_time.png" ]; then
            echo "png=${{ matrix.model }}_chunk_time.png" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload chunk_time@ISL plot
        id: chunk-time
        if: ${{ steps.plot.outputs.png }}
        continue-on-error: true
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          path: ${{ steps.plot.outputs.png }}
          archive: false
      - name: Report scaling
        run: |
          python3 models/demos/common/prefill/runners/ci/scaling_summary.py \
            --metrics-dir perf_metrics --model "${{ matrix.model }}" ${{ matrix.sc4_only && '--sc4-only' || '' }} \
            ${{ matrix.ref && format('--ref {0}', matrix.ref) || '' }} \
            ${{ matrix.base && format('--base {0}', matrix.base) || '' }} \
            ${{ steps.gantt.outputs.url && format('--gantt-url {0}', steps.gantt.outputs.url) || '' }} \
            ${{ steps.chunk-time.outputs.artifact-url && format('--chunk-time-url {0}', steps.chunk-time.outputs.artifact-url) || '' }}

  ai-run-summary:
    name: "AI Run Summary"
    # One run-level summary across both test groups. Each impl invocation
    # uploads its leg matrix as test_matrix_<resource-prefix>; we merge them
    # into expected-jobs so legs that produced no ai_job_summary artifact are
    # reconciled as infra failures rather than silently dropped.
    needs: [Galaxy-Blaze-models-prefill, Galaxy-Blaze-models-prefill-SDPA-Perf-tests,
      Galaxy-Blaze-models-prefill-layer-perf,
      Galaxy-Blaze-models-prefill-sc4, Galaxy-Blaze-models-prefill-sc1-runner]
    # Reports on a run that failed — the case the summary exists for — but not
    # on one that was cancelled: an aborted run has no outcome to summarize, and
    # asking for one spends an LLM call to say it stopped early.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2 cachew: keep
        timeout-minutes: 20
      - name: Download per-group matrices
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: test_matrix_*
          path: matrices
          merge-multiple: true
        continue-on-error: true
      - name: Merge matrices into expected-jobs union
        id: merge
        run: |
          if compgen -G "matrices/test_matrix_*.json" > /dev/null; then
            merged=$(jq -cs 'add // []' matrices/test_matrix_*.json)
          else
            merged='[]'
          fi
          echo "matrix<<EOF" >> $GITHUB_OUTPUT
          echo "$merged" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      - name: Aggregate upstream run result
        id: run-result
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          RESULT=$(jq -rn --argjson n "$NEEDS" '
            [$n[].result] as $r |
            if   any($r[]; . == "failure")   then "failure"
            elif any($r[]; . == "cancelled") then "cancelled"
            elif any($r[]; . == "success")   then "success"
            else                                  "skipped"
            end')
          echo "run-result=$RESULT" >> "$GITHUB_OUTPUT"
      - id: ai-run-summary
        continue-on-error: true
        uses: tenstorrent/tt-github-actions/.github/actions/ai_summary/run@main
        with:
          config: |
            {
              "model": "${{ vars.AI_SUMMARY_MODEL }}",
              "workspace": "$GITHUB_WORKSPACE",
              "input_dir": "ai_job_summaries",
              "output_dir": "ai_run_summaries"
            }
          api-key: ${{ secrets.TT_CHAT_API_KEY }}
          api-url: ${{ secrets.TT_CHAT_URL }}
          expected-jobs: ${{ steps.merge.outputs.matrix }}
          run-result: ${{ steps.run-result.outputs.run-result }}
      - name: Show report
        if: always() && steps.ai-run-summary.outputs.report-file != ''
        continue-on-error: true
        env:
          REPORT_FILE: ${{ steps.ai-run-summary.outputs.report-file }}
        run: |
          if [ -f "$REPORT_FILE" ]; then
            cat "$REPORT_FILE"
            cat "$REPORT_FILE" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Report file not found: $REPORT_FILE"
          fi

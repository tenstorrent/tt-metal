name: "[internal] Close Stale PRs"

permissions:
  pull-requests: write

on:
  schedule:
    - cron: "0 5 * * 1-4"   # Runs at 05:00 UTC, Monday through Thursday
  workflow_dispatch: # Allows manual trigger

jobs:
  close-stale-prs:
    if: github.repository == 'tenstorrent/tt-metal'
    runs-on: ubuntu-slim
    steps:
      # actions/stale can't ignore tenstorrent-github-bot's relabeling, which keeps resetting updated_at and masking real staleness.
      - name: Close PRs stale by real (non-bot) activity
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          REPO="tenstorrent/tt-metal"
          OWNER="tenstorrent"
          NAME="tt-metal"
          STALE_DAYS=32
          EXCLUDED_BOT="tenstorrent-github-bot"
          # Keeps writes under GitHub's secondary rate limit (500/hour); each close costs 3.
          MAX_CLOSES=150
          CLOSE_MSG='**AUTOMATION**: This PR has been automatically closed because it has had no activity for 32 days. If you still need this change, feel free to reopen it or open a new PR whenever you'"'"'re ready to continue.'

          now_epoch=$(date -u +%s)
          cutoff_epoch=$(( now_epoch - STALE_DAYS * 86400 ))

          # Ordered by createdAt (not updatedAt, which the bot corrupts) so we can stop paging once PRs are too young to be stale.
          query=$(cat <<'GQL'
          query($owner: String!, $name: String!, $cursor: String) {
            repository(owner: $owner, name: $name) {
              pullRequests(states: OPEN, first: 50, after: $cursor, orderBy: {field: CREATED_AT, direction: ASC}) {
                pageInfo { hasNextPage endCursor }
                nodes {
                  number
                  createdAt
                  timelineItems(last: 30, itemTypes: [LABELED_EVENT, UNLABELED_EVENT, ISSUE_COMMENT, PULL_REQUEST_REVIEW, PULL_REQUEST_COMMIT, HEAD_REF_FORCE_PUSHED_EVENT, REOPENED_EVENT, READY_FOR_REVIEW_EVENT]) {
                    filteredCount
                    nodes {
                      __typename
                      ... on LabeledEvent { createdAt actor { login } }
                      ... on UnlabeledEvent { createdAt actor { login } }
                      ... on IssueComment { createdAt lastEditedAt author { login } editor { login } }
                      ... on PullRequestReview { createdAt author { login } }
                      ... on PullRequestCommit { commit { pushedDate committedDate } }
                      ... on HeadRefForcePushedEvent { createdAt actor { login } }
                      ... on ReopenedEvent { createdAt actor { login } }
                      ... on ReadyForReviewEvent { createdAt actor { login } }
                    }
                  }
                }
              }
            }
          }
          GQL
          )

          # Normalizes each timeline event to (actor, date), preferring comment edits over original posts, and drops the excluded bot's events.
          jq_filter='
            .data.repository.pullRequests.nodes[] |
            . as $pr |
            ($pr.timelineItems.nodes
              | map({
                  actor: (.editor.login // .actor.login // .author.login // ""),
                  date: (.lastEditedAt // .createdAt // .commit.pushedDate // .commit.committedDate // "")
                })
              | map(select(.actor != $bot and .date != ""))
              | map(.date)
              | (if length > 0 then max else "-" end)
            ) as $lastReal |
            [($pr.number | tostring), $lastReal, $pr.createdAt, ($pr.timelineItems.filteredCount | tostring), ($pr.timelineItems.nodes | length | tostring)] | @tsv
          '

          closed=0
          cursor=""
          stop_paging=false

          while :; do
            if [[ -z "$cursor" ]]; then
              resp=$(gh api graphql -f query="$query" -F owner="$OWNER" -F name="$NAME")
            else
              resp=$(gh api graphql -f query="$query" -F owner="$OWNER" -F name="$NAME" -F cursor="$cursor")
            fi

            has_next=$(echo "$resp" | jq -r '.data.repository.pullRequests.pageInfo.hasNextPage')
            cursor=$(echo "$resp" | jq -r '.data.repository.pullRequests.pageInfo.endCursor')

            while IFS=$'\t' read -r number last_real created_at filtered_count fetched_count; do
              [[ -z "$number" ]] && continue

              created_epoch=$(date -u -d "$created_at" +%s)
              if (( created_epoch > cutoff_epoch )); then
                stop_paging=true
                continue
              fi

              # Only treat "no non-bot events" as zero activity when the fetched window covers the PR's entire timeline.
              if [[ "$last_real" == "-" ]]; then
                if (( filtered_count > fetched_count )); then
                  echo "Skipping PR #$number: no non-bot events in last $fetched_count of $filtered_count timeline items; older activity unknown"
                  continue
                fi
                last_real="$created_at"
              fi

              last_epoch=$(date -u -d "$last_real" +%s)
              if (( last_epoch > cutoff_epoch )); then
                continue
              fi

              if (( closed >= MAX_CLOSES )); then
                stop_paging=true
                continue
              fi

              echo "Closing stale PR #$number (last real activity: $last_real, created: $created_at)"
              # Close first so a failed close doesn't leave label/comment activity that resets the staleness clock.
              gh pr close "$number" --repo "$REPO"
              gh pr edit "$number" --repo "$REPO" --add-label stale
              gh pr comment "$number" --repo "$REPO" --body "$CLOSE_MSG"
              closed=$((closed + 1))
            done < <(echo "$resp" | jq -r --arg bot "$EXCLUDED_BOT" "$jq_filter")

            if [[ "$stop_paging" == true || "$has_next" != "true" || -z "$cursor" || "$cursor" == "null" ]]; then
              break
            fi
          done

          echo "Closed $closed stale PR(s) this run."

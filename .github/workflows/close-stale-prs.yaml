name: "[internal] Close Stale PRs"

permissions:
  pull-requests: write

on:
  schedule:
    - cron: "0 5 * * 1-4"   # Runs at 05:00 UTC, Monday through Thursday
  workflow_dispatch: # Allows manual trigger

jobs:
  close-stale-prs:
    if: github.repository == 'tenstorrent/tt-metal'
    runs-on: ubuntu-slim
    steps:
      # We used to run actions/stale here, but it determines staleness purely from
      # each PR's `updated_at`, which GitHub bumps on *any* activity. A separate bot,
      # tenstorrent-github-bot, periodically re-labels pr-priority/pr-risk/pr-complexity
      # on essentially every open PR (roughly every 1-2 weeks) -- faster than our
      # 32-day threshold -- so that relabeling alone was resetting the staleness clock
      # on PRs with no real human activity for months. actions/stale has no option to
      # exclude a single actor's activity (only the all-or-nothing `ignore-updates`,
      # which would also ignore genuine human comments/pushes), so we compute
      # staleness ourselves from each PR's timeline instead, skipping events from that
      # one bot.
      - name: Close PRs stale by real (non-bot) activity
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          REPO="tenstorrent/tt-metal"
          OWNER="tenstorrent"
          NAME="tt-metal"
          STALE_DAYS=32
          # One name today; add more here if another bot starts doing the same thing.
          EXCLUDED_BOT="tenstorrent-github-bot"
          # Same write budget actions/stale used, to stay well under GitHub's secondary
          # rate limit of 500 content-generating (POST/PATCH) requests/hour: each close
          # costs 3 (label + comment + close), so 150 closes = 450 writes.
          MAX_CLOSES=150
          CLOSE_MSG='**AUTOMATION**: This PR has been automatically closed because it has had no activity for 32 days. If you still need this change, feel free to reopen it or open a new PR whenever you'"'"'re ready to continue.'

          now_epoch=$(date -u +%s)
          cutoff_epoch=$(( now_epoch - STALE_DAYS * 86400 ))

          # Batched read: one GraphQL call returns up to 50 PRs *and* each PR's recent
          # timeline in a single round trip (~1 point against the 10,000/hr GraphQL
          # budget per page), instead of one REST call per PR. Ordered by createdAt
          # (not updatedAt -- that's the field the bot corrupts) ascending: a PR's real
          # last activity can never predate its own creation, so once a page's PRs were
          # created less than 32 days ago, everything after it is too young to be
          # stale and we can stop paging.
          query=$(cat <<'GQL'
          query($owner: String!, $name: String!, $cursor: String) {
            repository(owner: $owner, name: $name) {
              pullRequests(states: OPEN, first: 50, after: $cursor, orderBy: {field: CREATED_AT, direction: ASC}) {
                pageInfo { hasNextPage endCursor }
                nodes {
                  number
                  createdAt
                  timelineItems(last: 30, itemTypes: [LABELED_EVENT, UNLABELED_EVENT, ISSUE_COMMENT, PULL_REQUEST_REVIEW, PULL_REQUEST_COMMIT, HEAD_REF_FORCE_PUSHED_EVENT]) {
                    nodes {
                      __typename
                      ... on LabeledEvent { createdAt actor { login } }
                      ... on UnlabeledEvent { createdAt actor { login } }
                      ... on IssueComment { createdAt author { login } }
                      ... on PullRequestReview { createdAt author { login } }
                      ... on PullRequestCommit { commit { committedDate } }
                      ... on HeadRefForcePushedEvent { createdAt actor { login } }
                    }
                  }
                }
              }
            }
          }
          GQL
          )

          # Normalizes every timeline event variant to (actor, date), drops the
          # excluded bot's events, and emits one TSV line per PR:
          # "<number>\t<last-real-activity-or-createdAt>\t<createdAt>".
          jq_filter='
            .data.repository.pullRequests.nodes[] |
            . as $pr |
            ($pr.timelineItems.nodes
              | map({
                  actor: (.actor.login // .author.login // ""),
                  date: (.createdAt // .commit.committedDate // "")
                })
              | map(select(.actor != $bot and .date != ""))
              | map(.date)
              | (if length > 0 then max else null end)
            ) as $lastReal |
            [($pr.number | tostring), ($lastReal // $pr.createdAt), $pr.createdAt] | @tsv
          '

          closed=0
          cursor=""
          stop_paging=false

          while :; do
            if [[ -z "$cursor" ]]; then
              resp=$(gh api graphql -f query="$query" -F owner="$OWNER" -F name="$NAME")
            else
              resp=$(gh api graphql -f query="$query" -F owner="$OWNER" -F name="$NAME" -F cursor="$cursor")
            fi

            has_next=$(echo "$resp" | jq -r '.data.repository.pullRequests.pageInfo.hasNextPage')
            cursor=$(echo "$resp" | jq -r '.data.repository.pullRequests.pageInfo.endCursor')

            while IFS=$'\t' read -r number last_real created_at; do
              [[ -z "$number" ]] && continue

              created_epoch=$(date -u -d "$created_at" +%s)
              if (( created_epoch > cutoff_epoch )); then
                stop_paging=true
                continue
              fi

              last_epoch=$(date -u -d "$last_real" +%s)
              if (( last_epoch > cutoff_epoch )); then
                continue
              fi

              if (( closed >= MAX_CLOSES )); then
                stop_paging=true
                continue
              fi

              echo "Closing stale PR #$number (last real activity: $last_real, created: $created_at)"
              gh pr edit "$number" --repo "$REPO" --add-label stale
              gh pr comment "$number" --repo "$REPO" --body "$CLOSE_MSG"
              gh pr close "$number" --repo "$REPO"
              closed=$((closed + 1))
            done < <(echo "$resp" | jq -r --arg bot "$EXCLUDED_BOT" "$jq_filter")

            if [[ "$stop_paging" == true || "$has_next" != "true" || -z "$cursor" || "$cursor" == "null" ]]; then
              break
            fi
          done

          echo "Closed $closed stale PR(s) this run."

name: "Build TT-Metalium across all configs"
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  packages: read
jobs:
  gpt-host-contracts:
    runs-on: tt-ubuntu-2204-large-stable
    timeout-minutes: 35
    container:
      image: ghcr.io/tenstorrent/tt-metal/tt-metalium/ubuntu-24.04-dev-amd64@sha256:01621216c5a6d2cc661550ff007d1d1c51ea1e9ba5808286d0c79ab325a03a61
      env:
        TT_METAL_HOME: /work
        PYTHONPATH: /tmp/observer:/work:/work/ttnn
        LD_LIBRARY_PATH: /work/build/lib
        TT_FROM_PRECOMPILED_DIR: /work
        GPT_PREFILL_OBSERVATION: /tmp/observer-output
        PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        TT_MODEL_CLASS_OVERRIDES: "TTGptOssForCausalLM=observed_model:TTGptOssForCausalLM"
      volumes:
        - ${{ github.workspace }}/docker-job:/work
        - ${{ github.workspace }}/plugin:/plugin
    defaults:
      run:
        shell: bash
        working-directory: /work
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 1e11ea08d753c66fff839d93e3de407df5b134de
          submodules: recursive
          path: docker-job
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: "11904909423"
          run-id: "38584722221"
          github-token: ${{ github.token }}
          merge-multiple: true
          path: /work
      - name: Admit exact compiled artifact and interpreter
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 1e11ea08d753c66fff839d93e3de407df5b134de
          git fetch --depth=1 origin 0b315cc07f0fe4d99a5bfee256549bfbb7337112
          git diff --exit-code 0b315cc07f0fe4d99a5bfee256549bfbb7337112 HEAD -- tt_metal ttnn tt_stl
          echo "29e69618b7c138a81bd1b5210f3fb107caf15e21d95c51b5d9d2357f90e80e96  ttm_any.tar.zst" | sha256sum -c -
          tar --zstd -xf ttm_any.tar.zst
          /opt/venv/bin/python -c 'import sys; assert sys.version_info[:2] == (3,12), sys.version; print(sys.version)'
          uv pip install --python /opt/venv/bin/python --extra-index-url https://download.pytorch.org/whl/cpu --index-strategy unsafe-best-match -r tt_metal/python_env/requirements-dev.txt
          uv pip install --python /opt/venv/bin/python -e .
          uv pip freeze --python /opt/venv/bin/python > /work/host-environment.txt
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: tenstorrent/vllm-tt-plugin
          ref: d84049edcece77c64772a39e92f920f5679efce4
          path: plugin
      - name: Install exact merged plugin and its supported empty vLLM target
        timeout-minutes: 15
        working-directory: /plugin
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = d84049edcece77c64772a39e92f920f5679efce4
          source /opt/venv/bin/activate
          source docs/install-vllm-tt.sh
          uv pip freeze > /work/host-environment.txt
      - name: Stage bounded diagnostic host inputs
        run: |
          mkdir /tmp/observer
          python3 - <<'PYDATA'
          import json,base64
          from pathlib import Path
          data=json.loads('{"observer.py": "", "rows.py": "", "observed_model.py": "", "test_observer.py": "", "test_rows.py": "", "check_shutdown.py": ""}')
          for name,content in data.items():
              Path('/tmp/observer',name).write_bytes(base64.b64decode(content))
          PYDATA
      - name: Real observer imports and shutdown CLI contract
        timeout-minutes: 12
        run: |
          set -euo pipefail
          # Exact current draft source; no overlays or test replacements.
          git diff --exit-code HEAD
          cat > /tmp/gpt-import-host.py <<'PY'
          """CPU-only admission of the exact built GPT source, followed by original host tests."""
          import hashlib
          import json
          import os
          from pathlib import Path
          import platform
          import sys
          import time

          root = Path(sys.argv[1]).resolve(strict=True)
          out = Path(sys.argv[2]).resolve()
          out.mkdir(exist_ok=False)
          assert sys.version_info[:2] == (3, 12), sys.version
          assert platform.machine() == 'x86_64', platform.machine()

          def tt_fds():
              found = {}
              for p in Path('/proc/self/fd').iterdir():
                  try:
                      target = os.readlink(p)
                  except FileNotFoundError:
                      continue
                  if target.startswith('/dev/tenstorrent/'):
                      found[p.name] = target
              return found

          assert not tt_fds()
          import ttnn

          def refuse_device(*args, **kwargs):
              raise AssertionError('CPU host admission must not open a Tenstorrent device')

          # These host tests use mock device operations. Real imports must never open a device.
          for name in ('open_device', 'open_mesh_device', 'CreateDevice', 'CreateDevices'):
              if hasattr(ttnn, name):
                  setattr(ttnn, name, refuse_device)

          import models.demos.gpt_oss_120b_qb2.tt.generator_vllm
          import pytest
          import vllm
          from vllm_tt_plugin.entrypoints import register
          register()
          from vllm.model_executor.models.registry import ModelRegistry
          registered = ModelRegistry.models['TTGptOssForCausalLM'].load_model_cls()
          from models.demos.gpt_oss_120b_qb2.tt.generator_vllm import TTGptOssForCausalLM
          assert registered is TTGptOssForCausalLM
          import re
          import shlex
          from vllm.utils.argparse_utils import FlexibleArgumentParser
          from vllm.entrypoints.launchers.cli_args import make_arg_parser
          readme = (root/'models/demos/gpt_oss_120b_qb2/README.md').read_text()
          command = re.search(r'python -m vllm.entrypoints.openai.api_server (.*?)\n```',readme,re.S).group(1).replace('\\\n',' ')
          parsed = make_arg_parser(FlexibleArgumentParser()).parse_args(shlex.split(command))
          assert parsed.max_num_seqs == 32 and parsed.max_model_len == 131072
          assert parsed.additional_config['tt']['sample_on_device_mode'] == 'all'
          assert not tt_fds()
          (out/'plugin-proof.json').write_text(json.dumps({'vllm':vllm.__version__,'plugin_head':'d84049edcece77c64772a39e92f920f5679efce4','registered_class':registered.__module__+'.'+registered.__name__,'cli_max_model_len':parsed.max_model_len,'tt_fds':tt_fds()},indent=2)+'\n')
          origins = {}
          for name, module in tuple(sys.modules.items()):
              if not (name == 'ttnn' or name.startswith(('ttnn.', 'models.'))):
                  continue
              path = getattr(module, '__file__', None)
              if path:
                  p = Path(path).resolve(strict=True)
                  assert p.is_relative_to(root), (name, str(p), str(root))
                  origins[name] = {'path': str(p), 'sha256': hashlib.sha256(p.read_bytes()).hexdigest()}
          assert not tt_fds()
          (out/'import-proof.json').write_text(json.dumps({'python':sys.version,'origins':origins,'tt_fds':tt_fds()},indent=2)+'\n')
          import observed_model
          assert observed_model.TTGptOssForCausalLM is TTGptOssForCausalLM
          assert observed_model.observer.calls == 0 and not observed_model.observer.armed()
          from vllm.engine.arg_utils import AsyncEngineArgs
          shutdown=make_arg_parser(FlexibleArgumentParser()).parse_args(['--model','unused','--shutdown-timeout','60'])
          assert AsyncEngineArgs.from_cli_args(shutdown).shutdown_timeout == 60
          (out/'observer-proof.json').write_text(json.dumps({'shutdown_timeout':60,'original_class_identity':True,'warmup_unarmed':True,'tt_fds':tt_fds(),'observer_sha':hashlib.sha256(Path('/tmp/observer/observer.py').read_bytes()).hexdigest()},indent=2))
          rc = pytest.main(['--noconftest', '-q', '/tmp/observer/test_observer.py', '/tmp/observer/test_rows.py', '--junitxml='+str(out/'host.xml')])
          observed_model.observer.restore()
          assert not tt_fds()
          (out/'host-result.json').write_text(json.dumps({'pytest_exit':rc,'tt_fds':tt_fds(),'completed_unix':time.time()},indent=2)+'\n')
          raise SystemExit(rc)
          PY
          timeout --signal=TERM --kill-after=15s 600s /opt/venv/bin/python /tmp/gpt-import-host.py /work /work/gpt-host-results
      - name: Preserve host evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gpt-current-host-contracts
          path: |
            /work/gpt-host-results
            /work/host-environment.txt
          if-no-files-found: warn

name: "Build TT-Metalium across all configs"
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: read
jobs:
  checkpoint-runtime:
    runs-on: tt-ubuntu-2204-large-stable
    timeout-minutes: 12
    container:
      image: ghcr.io/tenstorrent/tt-metal/tt-metalium/ubuntu-24.04-dev-amd64@sha256:01621216c5a6d2cc661550ff007d1d1c51ea1e9ba5808286d0c79ab325a03a61
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ee801490377d44fe328dabb09ed619d30060d8ac
          path: source
          sparse-checkout: models/demos/blackhole/qwen38_flash_next
      - name: Actual CPU imports and original downloader compatibility
        run: |
          set -euo pipefail
          mkdir -p evidence
          timeout 180 /opt/venv/bin/python .ci/flash-checkpoint/runtime_check.py 2>&1 | tee evidence/runtime.stdout
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: flash-checkpoint-runtime
          path: evidence

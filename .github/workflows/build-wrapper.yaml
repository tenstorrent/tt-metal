name: "Build TT-Metalium across all configs"
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  packages: read
jobs:
  gpt-host-contracts:
    runs-on: tt-ubuntu-2204-large-stable
    timeout-minutes: 35
    container:
      image: ghcr.io/tenstorrent/tt-metal/tt-metalium/ubuntu-24.04-dev-amd64@sha256:01621216c5a6d2cc661550ff007d1d1c51ea1e9ba5808286d0c79ab325a03a61
      env:
        TT_METAL_HOME: /work
        PYTHONPATH: /tmp/candidate:/work:/work/ttnn
        LD_LIBRARY_PATH: /work/build/lib
        TT_FROM_PRECOMPILED_DIR: /work
        PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        TT_MODEL_CLASS_OVERRIDES: "TTGptOssForCausalLM=observed_model:TTGptOssForCausalLM"
        GPT_PREFILL_OBSERVATION: /tmp/candidate-output
      volumes:
        - ${{ github.workspace }}/docker-job:/work
        - ${{ github.workspace }}/plugin:/plugin
    defaults:
      run:
        shell: bash
        working-directory: /work
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          submodules: recursive
          path: docker-job
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: "11904909423"
          run-id: "38584722221"
          github-token: ${{ github.token }}
          merge-multiple: true
          path: /work
      - name: Admit exact compiled artifact and interpreter
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          git fetch --depth=1 origin 0b315cc07f0fe4d99a5bfee256549bfbb7337112
          git diff --exit-code 0b315cc07f0fe4d99a5bfee256549bfbb7337112 HEAD -- tt_metal ttnn tt_stl
          git fetch --depth=1 origin 1e11ea08d753c66fff839d93e3de407df5b134de
          git diff --exit-code 1e11ea08d753c66fff839d93e3de407df5b134de HEAD -- models ':!models/demos/gpt_oss_120b_qb2/tt/attention_prefill.py' ':!models/demos/gpt_oss_120b_qb2/tests/test_short_prefill_qkv.py' ':!models/demos/gpt_oss_120b_qb2/tests/test_short_prefill_output.py' ':!models/demos/gpt_oss_120b_qb2/tests/test_short_prefill_reduction.py'
          echo "29e69618b7c138a81bd1b5210f3fb107caf15e21d95c51b5d9d2357f90e80e96  ttm_any.tar.zst" | sha256sum -c -
          tar --zstd -xf ttm_any.tar.zst
          /opt/venv/bin/python -c 'import sys; assert sys.version_info[:2] == (3,12), sys.version; print(sys.version)'
          uv pip install --python /opt/venv/bin/python --extra-index-url https://download.pytorch.org/whl/cpu --index-strategy unsafe-best-match -r tt_metal/python_env/requirements-dev.txt
          uv pip install --python /opt/venv/bin/python -e .
          uv pip freeze --python /opt/venv/bin/python > /work/host-environment.txt
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: tenstorrent/vllm-tt-plugin
          ref: d84049edcece77c64772a39e92f920f5679efce4
          path: plugin
      - name: Install exact merged plugin and its supported empty vLLM target
        timeout-minutes: 15
        working-directory: /plugin
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = d84049edcece77c64772a39e92f920f5679efce4
          source /opt/venv/bin/activate
          source docs/install-vllm-tt.sh
          uv pip freeze > /work/host-environment.txt
      - name: Stage exact candidate metadata contract
        run: |
          mkdir /tmp/candidate
          python3 - <<'PYDATA'
          import base64,json
          from pathlib import Path
          data=json.loads('{"candidate_contract.py": "", "test_candidate_contract.py": "", "test_actual_candidate_contract.py": "", "observed_model.py": "", "output_contract.py": "", "mapping_contract.py": "", "row_mapping.py": "", "test_output_candidate.py": "", "test_output_contract.py": "", "test_mapping_contract.py": "", "test_row_mapping.py": "", "test_actual_output.py": "", "attention_prefill.py": "", "test_actual_mapping.py": "", "actual-padded-extraction133071.json": "", "boundary_observer.py": "", "boundary_rows.py": "", "test_boundary_observer.py": "", "test_boundary_rows.py": "", "test_actual_boundary.py": "", "reduction_contract.py": "", "test_reduction_contract.py": ""}')
          for name,content in data.items():
              Path('/tmp/candidate',name).write_bytes(base64.b64decode(content))
          PYDATA
      - name: Real candidate imports and CPU contracts
        timeout-minutes: 12
        run: |
          set -euo pipefail
          git diff --exit-code HEAD
          cat > /tmp/gpt-candidate-host.py <<'PY'
          import hashlib,json,os,sys,time
          from pathlib import Path
          assert sys.version_info[:2]==(3,12)
          root=Path('/work');out=root/'gpt-host-results';out.mkdir()
          def fds():
           return [os.readlink(p) for p in Path('/proc/self/fd').iterdir() if p.exists() and os.readlink(p).startswith('/dev/tenstorrent/')]
          assert not fds()
          import ttnn
          def refuse(*a,**kw):raise AssertionError('CPU controls must not open devices')
          for name in ('open_device','open_mesh_device','CreateDevice','CreateDevices'):
           if hasattr(ttnn,name):setattr(ttnn,name,refuse)
          from models.demos.gpt_oss_120b_qb2.tt.generator_vllm import TTGptOssForCausalLM
          from models.demos.gpt_oss_120b_qb2.tt import attention_prefill,multichip_decoder
          assert multichip_decoder.prefill_forward.__globals__ is attention_prefill.__dict__
          from models.demos.gpt_oss_120b_qb2.tt.model import Model
          from models.demos.gpt_oss_120b_qb2.tt.generator import Generator
          original_init=Model.__init__;original_project=attention_prefill._project_qkv;original_output=attention_prefill._project_output
          from models.demos.gpt_oss import config as mesh_config_module
          original_collective=mesh_config_module.MeshConfig.allreduce;original_config_ttnn=mesh_config_module.ttnn
          original_finish=attention_prefill._finish_prefill;original_reduce=attention_prefill._reduce_output
          original_prefill=Generator.prefill_forward;original_extract=Model.extract_last_tokens_batched_prefill
          import vllm,pytest
          from vllm_tt_plugin.entrypoints import register
          register()
          from vllm.model_executor.models.registry import ModelRegistry
          assert ModelRegistry.models['TTGptOssForCausalLM'].load_model_cls() is TTGptOssForCausalLM
          import observed_model
          assert observed_model.TTGptOssForCausalLM is TTGptOssForCausalLM
          assert Model.__init__.__wrapped__.__wrapped__ is original_init
          assert attention_prefill._project_qkv.__wrapped__ is original_project and attention_prefill._project_output.__wrapped__.__wrapped__ is original_output
          assert Generator.prefill_forward.__wrapped__ is original_prefill and Model.extract_last_tokens_batched_prefill.__wrapped__ is original_extract
          assert attention_prefill._finish_prefill.__wrapped__.__wrapped__ is original_finish and attention_prefill._reduce_output.__wrapped__.__wrapped__ is original_reduce
          assert mesh_config_module.MeshConfig.allreduce is original_collective
          assert mesh_config_module.ttnn is original_config_ttnn
          observed_model.restore()
          assert mesh_config_module.MeshConfig.allreduce is original_collective and mesh_config_module.ttnn is original_config_ttnn
          assert Model.__init__ is original_init and attention_prefill._project_qkv is original_project and attention_prefill._project_output is original_output
          assert Generator.prefill_forward is original_prefill and Model.extract_last_tokens_batched_prefill is original_extract and attention_prefill.ttnn is ttnn
          assert attention_prefill._finish_prefill is original_finish and attention_prefill._reduce_output is original_reduce
          from vllm.utils.argparse_utils import FlexibleArgumentParser
          from vllm.entrypoints.launchers.cli_args import make_arg_parser
          from vllm.engine.arg_utils import AsyncEngineArgs
          parsed=make_arg_parser(FlexibleArgumentParser()).parse_args(['--model','unused','--shutdown-timeout','60'])
          assert AsyncEngineArgs.from_cli_args(parsed).shutdown_timeout==60
          origins={}
          for name,module in tuple(sys.modules.items()):
           if name=='ttnn' or name.startswith(('ttnn.','models.')):
            path=getattr(module,'__file__',None)
            if path:
             p=Path(path).resolve();assert p.is_relative_to(root)
             origins[name]={'path':str(p),'sha256':hashlib.sha256(p.read_bytes()).hexdigest()}
          (out/'import-proof.json').write_text(json.dumps(origins,indent=2))
          original=attention_prefill._project_qkv;native=ttnn.linear
          rc=pytest.main(['--noconftest', '-q', 'models/demos/gpt_oss_120b_qb2/tests/test_short_prefill_qkv.py', 'models/demos/gpt_oss_120b_qb2/tests/test_short_prefill_output.py', 'models/demos/gpt_oss_120b_qb2/tests/test_short_prefill_reduction.py', '/tmp/candidate/test_reduction_contract.py', 'models/demos/gpt_oss_120b_qb2/tests/test_serving_host.py', '/tmp/candidate/test_candidate_contract.py', '/tmp/candidate/test_actual_candidate_contract.py', '/tmp/candidate/test_output_candidate.py', '/tmp/candidate/test_output_contract.py', '/tmp/candidate/test_mapping_contract.py', '/tmp/candidate/test_row_mapping.py', '/tmp/candidate/test_actual_output.py', '/tmp/candidate/test_actual_mapping.py', '/tmp/candidate/test_boundary_observer.py', '/tmp/candidate/test_boundary_rows.py', '/tmp/candidate/test_actual_boundary.py', '--junitxml=/work/gpt-host-results/host.xml'])
          assert attention_prefill._project_qkv is original and attention_prefill.ttnn is ttnn and ttnn.linear is native
          from candidate_contract import CandidateContract
          from models.demos.gpt_oss_120b_qb2.tt.model import Model
          original_init=Model.__init__
          c=CandidateContract('/tmp/unused-candidate-proof');c.install(Model,attention_prefill)
          assert Model.__init__.__wrapped__ is original_init and attention_prefill._project_qkv.__wrapped__ is original
          c.restore()
          assert Model.__init__ is original_init and attention_prefill._project_qkv is original
          (out/'candidate-contract-source.json').write_text(json.dumps({'sha256':hashlib.sha256(Path('/tmp/candidate/candidate_contract.py').read_bytes()).hexdigest(),'actual_import_restore':True}))
          assert not fds()
          (out/'remainder-source.json').write_text(json.dumps({n:hashlib.sha256(Path('/tmp/candidate',n).read_bytes()).hexdigest() for n in ['candidate_contract.py', 'test_candidate_contract.py', 'test_actual_candidate_contract.py', 'observed_model.py', 'output_contract.py', 'mapping_contract.py', 'row_mapping.py', 'test_output_candidate.py', 'test_output_contract.py', 'test_mapping_contract.py', 'test_row_mapping.py', 'test_actual_output.py', 'attention_prefill.py', 'test_actual_mapping.py', 'actual-padded-extraction133071.json', 'boundary_observer.py', 'boundary_rows.py', 'test_boundary_observer.py', 'test_boundary_rows.py', 'test_actual_boundary.py', 'reduction_contract.py', 'test_reduction_contract.py']},indent=2))
          (out/'host-result.json').write_text(json.dumps({'pytest_exit':rc,'zero_device_fds':True,'restored':True,'shutdown_timeout':60,'python':sys.version,'utc_unix':time.time()}))
          raise SystemExit(rc)
          PY
          timeout --signal=TERM --kill-after=15s 600s /opt/venv/bin/python /tmp/gpt-candidate-host.py
      - name: Preserve host evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gpt-current-host-contracts
          path: |
            /work/gpt-host-results
            /work/host-environment.txt
          if-no-files-found: warn

name: "Build TT-Metalium across all configs"
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  packages: read
jobs:
  flash-current-runtime:
    runs-on: tt-ubuntu-2204-large-stable
    timeout-minutes: 25
    container:
      image: ghcr.io/tenstorrent/tt-metal/tt-metalium/ubuntu-24.04-dev-amd64@sha256:01621216c5a6d2cc661550ff007d1d1c51ea1e9ba5808286d0c79ab325a03a61
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: validation
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 88db301912607fc681d56c5a21e776b52d84c500
          submodules: recursive
          fetch-depth: 500
          path: source
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: "11935456408"
          run-id: "38651980925"
          github-token: ${{ github.token }}
          merge-multiple: true
          path: source
      - name: Admit exact source and artifact, package in-family wheel without recompiling
        working-directory: source
        run: |
          set -euo pipefail
          mkdir -p ../evidence ../wheelhouse
          test "$(git rev-parse HEAD)" = 88db301912607fc681d56c5a21e776b52d84c500
          echo '9232a7c97f096091d4c37a5944c1b989247e622da428c738d5ade443ccacc1a4  ttm_any.tar.zst' | sha256sum -c -
          tar --zstd -xf ttm_any.tar.zst
          echo '33bb942d5b0fc623f2d099866fc5598c02aac71b11f7694225458a2629dae82e  ttnn/ttnn/_ttnn.so' | sha256sum -c -
          /opt/venv/bin/python -c 'import sys,platform; assert sys.version_info[:3]==(3,12,12); assert platform.machine()=="x86_64"; print(sys.version)'
          export TT_FROM_PRECOMPILED_DIR="$PWD" TT_METAL_HOME="$PWD"
          export LD_LIBRARY_PATH="$PWD/build/lib" PYTHONPATH="$PWD:$PWD/ttnn"
          timeout 600 uv build --wheel --out-dir ../wheelhouse
          sha256sum ../wheelhouse/*.whl > ../evidence/wheel.sha256
          uv pip install --python /opt/venv/bin/python -e .
          uv pip install --python /opt/venv/bin/python transformers==5.16.1
          uv pip freeze --python /opt/venv/bin/python > ../evidence/environment.txt
          git diff --exit-code HEAD
      - name: Actual current-source imports and original host controls, no devices
        working-directory: source
        run: |
          set -euo pipefail
          export TT_METAL_HOME="$PWD" LD_LIBRARY_PATH="$PWD/build/lib" PYTHONPATH="$PWD:$PWD/ttnn"
          export PYTEST_DISABLE_PLUGIN_AUTOLOAD=1
          timeout 120 /opt/venv/bin/python ../validation/.ci/flash-current-runtime/model_config.py ../evidence/model-config
          timeout 600 /opt/venv/bin/python ../validation/.ci/flash-current-runtime/runtime_host.py "$PWD" ../evidence/host
          /opt/venv/bin/python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('../evidence/host/import-proof.json').read_text())
          assert d['origins']['ttnn._ttnn']['sha256']=='33bb942d5b0fc623f2d099866fc5598c02aac71b11f7694225458a2629dae82e'
          assert d['tt_fds']=={}
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: flash-current88db-runtime-evidence
          path: evidence
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: flash-current88db-in-family-wheel
          path: wheelhouse
          if-no-files-found: error

name: "LLK SFPU report"
# Before/after perf and accuracy of the SFPU ops a PR changes, on Wormhole and
# Blackhole silicon. Dispatched by the `/llk-sfpu-test` PR command
# (llk-sfpu-test.md), or by hand from the Actions tab. It never comments itself:
# it uploads the `llk-sfpu-report` artifact, and llk-sfpu-summary.md posts it.
#
# Fork PRs are the point of this workflow, so it is built so that a PR's code
# only ever runs on the Tensix:
#   * it always runs from main (dispatch on main); the PR is an input, not a ref;
#   * the measuring job checks out main, fetches the PR's commits by SHA, and
#     compiles only their device C++ (tt_metal/tt-llk/sfpu_report/overlay.py);
#     every host-side line -- harness, pytest plugins, the tool -- is main's;
#   * that job has a read-only token, no secrets, and persists no credentials;
#   * the head SHA is pinned by the plan job; a later push is reported, not tested.

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number"
        required: true
        type: string
      head_sha:
        description: "PR head commit to test (blank = the PR's current head)"
        required: false
        default: ""
        type: string
      ops:
        description: "Comma-separated MathOperation names, e.g. Tanh,Exp (blank = auto-detect)"
        required: false
        default: ""
        type: string
      arch:
        description: "all, wormhole or blackhole"
        required: false
        default: all
        type: choice
        options: [all, wormhole, blackhole]
      base:
        description: "merge-base: the PR's branch point; main: current main vs main + the PR's kernel diff"
        required: false
        default: merge-base
        type: choice
        options: [merge-base, main]
      iterations:
        description: "Perf runs per side"
        required: false
        default: "3"
        type: string
      context:
        description: "JSON passed through to the summary step (requester, hint, bounty targets)"
        required: false
        default: "{}"
        type: string

permissions:
  contents: read

concurrency:
  # One report per PR at a time; a new command replaces the one in flight.
  group: llk-sfpu-report-${{ inputs.pr_number }}
  cancel-in-progress: true

env:
  LLK_PATH: tt_metal/tt-llk

jobs:
  plan:
    name: "Plan"
    runs-on: ubuntu-slim
    permissions:
      contents: read
      pull-requests: read
    outputs:
      head_sha: ${{ steps.plan.outputs.head_sha }}
      head_moved_to: ${{ steps.plan.outputs.head_moved_to }}
      base_sha: ${{ steps.plan.outputs.base_sha }}
      mode: ${{ steps.plan.outputs.mode }}
      skus: ${{ steps.plan.outputs.skus }}
    steps:
      - name: Resolve the PR, its head and its merge-base
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr_number }}
          REQUESTED_SHA: ${{ inputs.head_sha }}
          ARCH: ${{ inputs.arch }}
          BASE: ${{ inputs.base }}
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]] || { echo "::error::pr_number must be a number"; exit 1; }
          pr="$(gh api "repos/$REPO/pulls/$PR_NUMBER")"
          current="$(jq -r .head.sha <<<"$pr")"
          base_ref="$(jq -r .base.ref <<<"$pr")"
          head="${REQUESTED_SHA:-$current}"
          [[ "$head" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::head_sha must be a full commit SHA"; exit 1; }
          moved=""
          [ "$head" = "$current" ] || moved="$current"
          # The compare API computes the merge-base without fetching any history.
          merge_base="$(gh api "repos/$REPO/compare/${base_ref}...${head}" --jq .merge_base_commit.sha)"
          case "$BASE" in
            merge-base) mode=merge-base ;;
            main) mode=rebase ;;
            *) echo "::error::base must be merge-base or main"; exit 1 ;;
          esac
          case "$ARCH" in
            all) skus="wh_n150_civ2,bh_p150b_civ2" ;;
            wormhole) skus="wh_n150_civ2" ;;
            blackhole) skus="bh_p150b_civ2" ;;
            *) echo "::error::arch must be all, wormhole or blackhole"; exit 1 ;;
          esac
          {
            echo "head_sha=$head"
            echo "head_moved_to=$moved"
            echo "base_sha=$merge_base"
            echo "mode=$mode"
            echo "skus=$skus"
          } >> "$GITHUB_OUTPUT"
          echo "PR #$PR_NUMBER head ${head:0:12} (current ${current:0:12}), merge-base ${merge_base:0:12}, mode $mode" >> "$GITHUB_STEP_SUMMARY"

  build-images:
    name: "Docker setup"
    uses: ./.github/workflows/build-docker-artifact.yaml
    secrets: inherit
    permissions:
      contents: read
      packages: write

  load-test-matrix:
    runs-on: ubuntu-slim
    needs: [plan]
    outputs:
      matrix: ${{ steps.build-matrix.outputs.matrix }}
    steps:
      - name: Checkout the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        timeout-minutes: 20
        with:
          persist-credentials: false
          sparse-checkout: |
            .github
            tests/pipeline_reorg
          sparse-checkout-cone-mode: true
      - name: Install dependencies
        run: pip3 install PyYAML
      - name: Build test matrix
        id: build-matrix
        uses: tenstorrent/tt-metal/.github/actions/prepare-test-matrix@main
        with:
          tests-yaml: ./tests/pipeline_reorg/llk_sfpu_report_tests.yaml
          enabled-skus: ${{ needs.plan.outputs.skus }}
          sku-config: ./.github/sku_config.yaml

  measure:
    needs: [plan, build-images, load-test-matrix]
    if: ${{ needs.load-test-matrix.outputs.matrix != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        test-group: ${{ fromJSON(needs.load-test-matrix.outputs.matrix) }}
    name: ${{ matrix.test-group.name }}
    runs-on: ${{ matrix.test-group.runs_on }}
    timeout-minutes: ${{ matrix.test-group.timeout }}
    # Read-only token, no secrets: this job compiles and runs a PR's device code.
    permissions:
      contents: read
    container:
      image: ${{ needs.build-images.outputs.llk-ci-tag }}
      options: "--rm --device /dev/tenstorrent --ulimit nofile=4096:4096"
    steps:
      - name: Checkout main (the tool revision)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        timeout-minutes: 20
        with:
          persist-credentials: false
      - name: Measure
        shell: bash
        working-directory: ${{ env.LLK_PATH }}
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          HEAD_SHA: ${{ needs.plan.outputs.head_sha }}
          HEAD_MOVED_TO: ${{ needs.plan.outputs.head_moved_to }}
          BASE_SHA: ${{ needs.plan.outputs.base_sha }}
          MODE: ${{ needs.plan.outputs.mode }}
          OPS: ${{ inputs.ops }}
          ITERATIONS: ${{ inputs.iterations }}
          OUT_DIR: ${{ github.workspace }}/sfpu-report-out
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          ${{ matrix.test-group.cmd }}
      - name: Upload this architecture's results
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: llk-sfpu-report-${{ strategy.job-index }}
          path: sfpu-report-out/
          if-no-files-found: warn

  collect:
    name: "Render the report"
    needs: [plan, measure]
    if: ${{ always() && needs.plan.result == 'success' }}
    runs-on: ubuntu-slim
    permissions:
      contents: read
    steps:
      - name: Checkout main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        timeout-minutes: 20
        with:
          persist-credentials: false
          sparse-checkout: |
            tt_metal/tt-llk/sfpu_report
          sparse-checkout-cone-mode: true
      - name: Download the per-architecture results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: llk-sfpu-report-*
          path: parts
          merge-multiple: true
      - name: Render
        id: render
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          HEAD_SHA: ${{ needs.plan.outputs.head_sha }}
          CONTEXT: ${{ inputs.context }}
          MEASURE_RESULT: ${{ needs.measure.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          mkdir -p out
          shopt -s nullglob
          summaries=(parts/summary-*.json)
          if [ ${#summaries[@]} -gt 0 ]; then
            python3 tt_metal/tt-llk/sfpu_report/report.py "${summaries[@]}" -o out/report.md
            cp "${summaries[@]}" out/
          else
            printf '%s\n' '<!-- llk-sfpu-report -->' '## LLK SFPU report' '' \
              "The measurement did not finish (${MEASURE_RESULT}); see the [run](${RUN_URL})." > out/report.md
          fi
          cp parts/run-*.log out/ 2>/dev/null || true
          # What the summary step needs, in one file it can trust: this job wrote it.
          ctx="${CONTEXT:-}"
          jq -e 'type == "object"' <<<"$ctx" >/dev/null 2>&1 || ctx='{}'
          jq -n --arg pr "$PR_NUMBER" --arg sha "$HEAD_SHA" --arg run "$RUN_URL" \
                --arg result "$MEASURE_RESULT" --argjson context "$ctx" \
                '{pr_number: ($pr|tonumber), head_sha: $sha, run_url: $run, measure: $result, context: $context}' > out/meta.json
          cat out/report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the report
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: llk-sfpu-report
          path: out/

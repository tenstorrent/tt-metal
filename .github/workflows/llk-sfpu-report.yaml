name: "LLK SFPU report"
# Before/after perf and accuracy of the SFPU ops a PR changes, on Wormhole and
# Blackhole silicon. Dispatched by the `/llk-sfpu-test` PR command
# (llk-sfpu-test-command.yaml), or by hand from the Actions tab. The report is
# always in the `llk-sfpu-report` artifact and the run summary; with post_comment
# (the command sets it) it is also posted on the PR, replacing the earlier report
# and the command's "measuring" note.
#
# Fork PRs are the point of this workflow, so it is built so that a PR's code
# only ever runs on the Tensix:
#   * it always runs from main (dispatch on main); the PR is an input, not a ref;
#   * the measuring job checks out main, fetches the PR's commits by SHA, and
#     compiles only their device C++ (.github/llk_sfpu_report/overlay.py);
#     every host-side line -- harness, pytest plugins, the tool -- is main's;
#   * that job has a read-only token, no secrets, and persists no credentials;
#   * the head SHA is pinned by the plan job; a later push is reported, not tested.

on:
  # Also callable, so a wrapper can run it (e.g. to try a branch before this file is
  # on main: workflow_dispatch only finds workflows that exist on the default branch).
  workflow_call:
    inputs:
      pr_number: {type: string, required: true}
      head_sha: {type: string, required: false, default: ""}
      ops: {type: string, required: false, default: ""}
      arch: {type: string, required: false, default: auto}
      base: {type: string, required: false, default: merge-base}
      iterations: {type: string, required: false, default: "3"}
      post_comment: {type: boolean, required: false, default: false}
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number"
        required: true
        type: string
      head_sha:
        description: "PR head commit to test (blank = the PR's current head)"
        required: false
        default: ""
        type: string
      ops:
        description: "Comma-separated MathOperation names, e.g. Tanh,Exp (blank = auto-detect)"
        required: false
        default: ""
        type: string
      arch:
        description: "auto: the architectures whose device code the PR changes; all: both"
        required: false
        default: auto
        type: choice
        options: [auto, all, wormhole, blackhole]
      base:
        description: "merge-base: the PR's branch point; main: current main vs main + the PR's kernel diff"
        required: false
        default: merge-base
        type: choice
        options: [merge-base, main]
      iterations:
        description: "Perf runs per side"
        required: false
        default: "3"
        type: string
      post_comment:
        description: "Post the report on the PR, replacing its earlier report"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  # One report per PR at a time; a new command replaces the one in flight.
  group: llk-sfpu-report-${{ inputs.pr_number }}
  cancel-in-progress: true

jobs:
  plan:
    name: "Plan"
    runs-on: ubuntu-slim
    permissions:
      contents: read
      pull-requests: read
    outputs:
      head_sha: ${{ steps.plan.outputs.head_sha }}
      head_moved_to: ${{ steps.plan.outputs.head_moved_to }}
      base_sha: ${{ steps.plan.outputs.base_sha }}
      mode: ${{ steps.plan.outputs.mode }}
      skus: ${{ steps.plan.outputs.skus }}
      archs: ${{ steps.plan.outputs.archs }}
      skipped: ${{ steps.plan.outputs.skipped }}
    steps:
      # Main's copy of the tool, for the path classifier the auto arch uses.
      - name: Checkout main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        timeout-minutes: 20
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/llk_sfpu_report
          sparse-checkout-cone-mode: true
      - name: Resolve the PR, its head and its merge-base
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr_number }}
          REQUESTED_SHA: ${{ inputs.head_sha }}
          ARCH: ${{ inputs.arch }}
          BASE: ${{ inputs.base }}
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]] || { echo "::error::pr_number must be a number"; exit 1; }
          pr="$(gh api "repos/$REPO/pulls/$PR_NUMBER")"
          current="$(jq -r .head.sha <<<"$pr")"
          base_ref="$(jq -r .base.ref <<<"$pr")"
          head="${REQUESTED_SHA:-$current}"
          [[ "$head" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::head_sha must be a full commit SHA"; exit 1; }
          moved=""
          [ "$head" = "$current" ] || moved="$current"
          # The compare API computes the merge-base without fetching any history, and
          # lists the files the PR changes since.
          compare="$RUNNER_TEMP/compare.json"
          gh api "repos/$REPO/compare/${base_ref}...${head}" > "$compare"
          merge_base="$(jq -r .merge_base_commit.sha "$compare")"
          case "$BASE" in
            merge-base) mode=merge-base ;;
            main) mode=rebase ;;
            *) echo "::error::base must be merge-base or main"; exit 1 ;;
          esac
          case "$ARCH" in
            all) archs="wormhole,blackhole" ;;
            wormhole|blackhole) archs="$ARCH" ;;
            auto)
              # The architectures whose device code the PR changes, both sides of a
              # rename included. The API lists at most 300 files: a longer list may
              # be cut, so it measures both.
              if [ "$(jq '.files // [] | length' "$compare")" -ge 300 ]; then
                archs="wormhole,blackhole"
              else
                archs="$(jq -r '.files // [] | .[] | .filename, (.previous_filename // empty)' "$compare" |
                  python3 .github/llk_sfpu_report/overlay.py archs)"
              fi ;;
            *) echo "::error::arch must be auto, all, wormhole or blackhole"; exit 1 ;;
          esac
          skus="" skipped=""
          for a in wormhole blackhole; do
            case "$a" in wormhole) sku=wh_n150_civ2 ;; blackhole) sku=bh_p150b_civ2 ;; esac
            if [[ ",$archs," == *",$a,"* ]]; then
              skus="${skus:+$skus,}$sku"
            elif [ "$ARCH" = auto ]; then
              skipped="${skipped:+$skipped,}$a"
            fi
          done
          {
            echo "head_sha=$head"
            echo "head_moved_to=$moved"
            echo "base_sha=$merge_base"
            echo "mode=$mode"
            echo "skus=$skus"
            echo "archs=$archs"
            echo "skipped=$skipped"
          } >> "$GITHUB_OUTPUT"
          echo "PR #$PR_NUMBER head ${head:0:12} (current ${current:0:12}), merge-base ${merge_base:0:12}," \
            "mode $mode, architectures: ${archs:-none}" >> "$GITHUB_STEP_SUMMARY"

  build-images:
    name: "Docker setup"
    uses: ./.github/workflows/build-docker-artifact.yaml
    secrets: inherit
    permissions:
      contents: read
      packages: write

  load-test-matrix:
    runs-on: ubuntu-slim
    needs: [plan]
    # No architecture to run: the PR changes no device code either chip builds.
    if: ${{ needs.plan.outputs.skus != '' }}
    outputs:
      matrix: ${{ steps.build-matrix.outputs.matrix }}
    steps:
      - name: Checkout the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        timeout-minutes: 20
        with:
          persist-credentials: false
          sparse-checkout: |
            .github
            tests/pipeline_reorg
          sparse-checkout-cone-mode: true
      - name: Install dependencies
        run: pip3 install PyYAML
      - name: Build test matrix
        id: build-matrix
        # This run's own copy: the workflow only runs from main, and the checkout above
        # pins it to the commit the run started from.
        uses: ./.github/actions/prepare-test-matrix
        with:
          tests-yaml: ./tests/pipeline_reorg/llk_sfpu_report_tests.yaml
          enabled-skus: ${{ needs.plan.outputs.skus }}
          sku-config: ./.github/sku_config.yaml

  measure:
    needs: [plan, build-images, load-test-matrix]
    if: ${{ needs.load-test-matrix.outputs.matrix != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        test-group: ${{ fromJSON(needs.load-test-matrix.outputs.matrix) }}
    name: ${{ matrix.test-group.name }}
    runs-on: ${{ matrix.test-group.runs_on }}
    timeout-minutes: ${{ matrix.test-group.timeout }}
    # Read-only token, no secrets: this job compiles and runs a PR's device code.
    permissions:
      contents: read
    container:
      image: ${{ needs.build-images.outputs.llk-ci-tag }}
      options: "--rm --device /dev/tenstorrent --ulimit nofile=4096:4096"
    steps:
      - name: Checkout main (the tool revision)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        timeout-minutes: 20
        with:
          persist-credentials: false
      - name: Measure
        shell: bash
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          HEAD_SHA: ${{ needs.plan.outputs.head_sha }}
          HEAD_MOVED_TO: ${{ needs.plan.outputs.head_moved_to }}
          BASE_SHA: ${{ needs.plan.outputs.base_sha }}
          MODE: ${{ needs.plan.outputs.mode }}
          OPS: ${{ inputs.ops }}
          ITERATIONS: ${{ inputs.iterations }}
          OUT_DIR: ${{ github.workspace }}/sfpu-report-out
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          ${{ matrix.test-group.cmd }}
      # ci_run.sh copies its log when it exits; a leg that hits the job timeout never does.
      - name: Keep the log of an unfinished run
        if: always()
        shell: bash
        env:
          LEG: ${{ matrix.test-group.name }}
        run: |
          mkdir -p sfpu-report-out
          compgen -G "sfpu-report-out/run-*.log" >/dev/null ||
            cp "$RUNNER_TEMP/llk-sfpu-report/run.log" "sfpu-report-out/run-${LEG##*_}.log" 2>/dev/null || true
      - name: Upload this architecture's results
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: llk-sfpu-report-${{ strategy.job-index }}
          path: sfpu-report-out/
          if-no-files-found: warn

  collect:
    name: "Render the report"
    needs: [plan, measure]
    # Not on cancel: a newer /llk-sfpu-test replaced this run and posts its own. On a
    # failed plan too, so the command's "measuring" note does not stay up.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-slim
    permissions:
      contents: read
      pull-requests: write # post the report; this job runs no PR code
    steps:
      - name: Checkout main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        timeout-minutes: 20
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/llk_sfpu_report
          sparse-checkout-cone-mode: true
      - name: Download the per-architecture results
        if: ${{ needs.plan.outputs.skus != '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: llk-sfpu-report-*
          path: parts
          merge-multiple: true
      - name: Render
        id: render
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          HEAD_SHA: ${{ needs.plan.outputs.head_sha }}
          ARCHS: ${{ needs.plan.outputs.archs }}
          SKIPPED: ${{ needs.plan.outputs.skipped }}
          PLAN_RESULT: ${{ needs.plan.result }}
          MEASURE_RESULT: ${{ needs.measure.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          mkdir -p out
          shopt -s nullglob
          summaries=(parts/summary-*.json)
          if [ ${#summaries[@]} -gt 0 ] || { [ "$PLAN_RESULT" = success ] && [ -z "$ARCHS" ]; }; then
            # An arch in ARCHS without a summary is named in the report as not finished;
            # one in SKIPPED was not run, since the PR changes no device code it builds.
            python3 .github/llk_sfpu_report/report.py "${summaries[@]}" \
              --expect "$ARCHS" --skipped "$SKIPPED" --run-url "$RUN_URL" -o out/report.md
            [ ${#summaries[@]} -eq 0 ] || cp "${summaries[@]}" out/
          else
            if [ "$PLAN_RESULT" != success ]; then
              what="Could not plan the run (the PR, its head or its merge-base did not resolve)"
            else
              what="The measurement did not finish (${MEASURE_RESULT})"
            fi
            printf '%s\n' '<!-- llk-sfpu-report -->' '## LLK SFPU report' '' \
              "${what}; see the [run](${RUN_URL})." > out/report.md
          fi
          cp parts/run-*.log out/ 2>/dev/null || true
          jq -n --arg pr "$PR_NUMBER" --arg sha "$HEAD_SHA" --arg run "$RUN_URL" \
                --arg plan "$PLAN_RESULT" --arg result "$MEASURE_RESULT" \
                '{pr_number: $pr, head_sha: $sha, run_url: $run, plan: $plan, measure: $result}' > out/meta.json
          cat out/report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the report
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: llk-sfpu-report
          path: out/
      # Posts the report, then hides this PR's earlier reports and the command's
      # "measuring" note (only this bot's, matched by their first line). Posting comes
      # first: hiding is tidying up, and a failed listing must not cost the report.
      - name: Post the report on the PR
        if: ${{ inputs.post_comment }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail
          posted="$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" -F body=@out/report.md --jq .node_id)"
          earlier="$(gh api --paginate "repos/$REPO/issues/$PR_NUMBER/comments" --jq '
            .[] | select(.user.login == "github-actions[bot]")
                | select((.body | startswith("<!-- llk-sfpu-report -->"))
                      or (.body | startswith("<!-- llk-sfpu-test:running -->")))
                | .node_id')" || { echo "::warning::Could not list the earlier reports to hide them"; exit 0; }
          for id in $earlier; do
            [ "$id" != "$posted" ] || continue
            # shellcheck disable=SC2016 # $id is a GraphQL variable, not a shell one
            gh api graphql --silent -f id="$id" -f query='
              mutation($id: ID!) {
                minimizeComment(input: {subjectId: $id, classifier: OUTDATED}) { clientMutationId }
              }' || echo "::warning::Could not hide an earlier report"
          done

name: Test cachew checkout

on:
  # Manual runs only. The action's own tests run in tenstorrent/.github.
  workflow_dispatch:
    inputs:
      live-smoke:
        description: Also check out tt-metal through a live cachew endpoint
        type: boolean
        default: false
      cachew-url:
        description: Cachew HTTPS origin for the optional live smoke test
        type: choice
        options:
          - auto
          - https://cachew.dev.tenstorrent.net
          - https://cachew.ci.tenstorrent.net
          - https://cachew.yyz2.ci.tenstorrent.net
        default: auto

permissions:
  contents: read

jobs:
  # The action, its migration helper and their tests live in
  # tenstorrent/.github (actions/cachew-checkout). This repository checks its
  # own consumers against the pin in .github/cachew-checkout.json.
  consumers:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2 cachew: keep
        with:
          sparse-checkout: .github
          persist-credentials: false
      # cachew_checkout.py runs tenstorrent/.github's migrate.py at the pinned
      # commit, so this also proves the pin is a pushed commit there.
      - name: Verify all checkout consumers use cachew
        run: python3 .github/scripts/utils/cachew_checkout.py --check
      - name: Verify every consumer pins action_sha
        run: python3 .github/scripts/utils/cachew_checkout.py --verify-pins
      - name: Warn while the pin is not on tenstorrent/.github main
        # Before an action change merges, the pin is on a pull request branch.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(jq -r .action_sha .github/cachew-checkout.json)
          status=$(gh api "repos/tenstorrent/.github/compare/main...$sha" --jq .status)
          case "$status" in
            behind|identical) ;;
            *) echo "::warning::cachew pin $sha is not on tenstorrent/.github main ($status); re-pin once it merges" ;;
          esac

  live-smoke:
    if: github.event_name == 'workflow_dispatch' && inputs.live-smoke
    runs-on: tt-ubuntu-2204-large-stable
    timeout-minutes: 20
    steps:
      - name: Checkout through cachew with upstream fallback
        id: checkout
        uses: tenstorrent/.github/actions/cachew-checkout@a140c8c392c97a81ebe9919b8397a6d0e90febf3 # cachew checkout
        with:
          cachew-url: ${{ inputs.cachew-url }}
          ref: ${{ github.sha }}
          path: cachew-smoke
          submodules: recursive
          persist-credentials: false
      - name: Verify checkout
        env:
          EXPECTED_SHA: ${{ github.sha }}
          ACTUAL_SHA: ${{ steps.checkout.outputs.commit }}
          CACHEW_CHECKED_OUT: ${{ steps.checkout.outputs.cachew-checked-out }}
          CACHEW_CONFIGURED: ${{ steps.checkout.outputs.cachew-configured }}
        run: |
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
          test "$CACHEW_CHECKED_OUT" = "true"
          test "$CACHEW_CONFIGURED" = "true"
          git -C cachew-smoke submodule status --recursive
          echo "cachew-checked-out=$CACHEW_CHECKED_OUT"
          # Later dependency reads go through the job-global rewrite and wrapper.
          test -n "$CACHEW_SESSION_DIR"
          git ls-remote https://github.com/tenstorrent/tt-metal refs/heads/main

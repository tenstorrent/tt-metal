name: Test cachew checkout

on:
  # Manual runs only. The action's own tests run in tenstorrent/.github.
  workflow_dispatch:
    inputs:
      live-smoke:
        description: Also check out tt-metal through a live cachew endpoint
        type: boolean
        default: false
      cachew-url:
        description: Cachew HTTPS origin for the optional live smoke test
        type: choice
        options:
          - auto
          - https://cachew.dev.tenstorrent.net
          - https://cachew.ci.tenstorrent.net
          - https://cachew.yyz2.ci.tenstorrent.net
        default: auto

permissions:
  contents: read

jobs:
  # The action and its unit tests live in tenstorrent/.github
  # (actions/cachew-checkout). This repository checks its own consumers: the
  # migration script, its tests, and that the pin exists there.
  consumers:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2 cachew: keep
        with:
          sparse-checkout: .github
          persist-credentials: false
      - name: Test the migration script
        run: python3 .github/scripts/utils/test_cachew_checkout.py -v
      - name: Verify all checkout consumers use cachew
        run: python3 .github/scripts/utils/cachew_checkout.py --check
      - name: Verify every consumer pins ACTION_SHA
        run: python3 .github/scripts/utils/cachew_checkout.py --verify-pins
      - name: Verify the pin exists in tenstorrent/.github
        # Fetching by SHA fails unless the commit was pushed there. Before the
        # action change merges, the pin is on a pull request branch, so not
        # being on main only warns.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(python3 -c 'import importlib.util as u; s=u.spec_from_file_location("m", ".github/scripts/utils/cachew_checkout.py"); m=u.module_from_spec(s); s.loader.exec_module(m); print(m.ACTION_SHA)')
          git init -q pin-check
          git -C pin-check fetch --no-tags --depth=1 https://github.com/tenstorrent/.github "$sha"
          git -C pin-check cat-file -e "$sha:actions/cachew-checkout/action.yml"
          status=$(gh api "repos/tenstorrent/.github/compare/main...$sha" --jq .status)
          case "$status" in
            behind|identical) ;;
            *) echo "::warning::cachew pin $sha is not on tenstorrent/.github main ($status); re-pin ACTION_SHA once it merges" ;;
          esac

  live-smoke:
    if: github.event_name == 'workflow_dispatch' && inputs.live-smoke
    runs-on: tt-ubuntu-2204-large-stable
    timeout-minutes: 20
    steps:
      - name: Checkout through cachew with upstream fallback
        id: checkout
        uses: tenstorrent/.github/actions/cachew-checkout@e0302d6af3504b1f3d8b64ad6fba7d88276a23f4 # cachew checkout
        with:
          cachew-url: ${{ inputs.cachew-url }}
          ref: ${{ github.sha }}
          path: cachew-smoke
          submodules: recursive
          persist-credentials: false
      - name: Verify checkout
        env:
          EXPECTED_SHA: ${{ github.sha }}
          ACTUAL_SHA: ${{ steps.checkout.outputs.commit }}
          CACHEW_CHECKED_OUT: ${{ steps.checkout.outputs.cachew-checked-out }}
          CACHEW_CONFIGURED: ${{ steps.checkout.outputs.cachew-configured }}
        run: |
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
          test "$CACHEW_CHECKED_OUT" = "true"
          test "$CACHEW_CONFIGURED" = "true"
          git -C cachew-smoke submodule status --recursive
          echo "cachew-checked-out=$CACHEW_CHECKED_OUT"
          # Later dependency reads go through the job-global rewrite and wrapper.
          test -n "$CACHEW_SESSION_DIR"
          git ls-remote https://github.com/tenstorrent/tt-metal refs/heads/main

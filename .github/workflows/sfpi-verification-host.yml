name: SFPI verification host selftests
on:
  pull_request:
    paths:
      - 'tt_metal/tt-llk/tests/corpus/tools/**'
      - 'tt_metal/tt-llk/tests/helpers/include/fresh_cpp/**'
      - 'tt_metal/tt-llk/tests/python_tests/**'
      - '.github/workflows/sfpi-verification-host.yml'
  push:
    paths:
      - 'tt_metal/tt-llk/tests/corpus/tools/**'
      - 'tt_metal/tt-llk/tests/helpers/include/fresh_cpp/**'
      - 'tt_metal/tt-llk/tests/python_tests/**'
      - '.github/workflows/sfpi-verification-host.yml'
jobs:
  host-selftests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tt_metal/tt-llk/tests/corpus/tools/requirements-formal.txt
      - name: Install pinned host validation dependencies
        run: >-
          python -m pip install
          -r tt_metal/tt-llk/tests/corpus/tools/requirements-formal.txt
      - name: Run current validation and historical-reproducer host checks
        run: python tt_metal/tt-llk/tests/corpus/tools/selftest_host.py

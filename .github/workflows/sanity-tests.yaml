name: "Sanity tests"

on:
  workflow_call:
    inputs:
      build-type:
        required: false
        default: Release
        type: string
        description: "Build type configuration (Release, Debug, RelWithDebInfo, ASan, TSan)"
      platform:
        required: false
        type: string
        default: "Ubuntu 22.04"
        description: "Platform to build and test (e.g., 'Ubuntu 22.04', 'Ubuntu 24.04')"
      enable-lto:
        required: false
        type: boolean
        default: false
        description: "Enable Link Time Optimization (LTO)"
      build-inplace-wheel:
        required: false
        type: boolean
        default: true
        description: "Use Ubuntu instead of manylinux for the wheel build."
      with-retries:
        required: false
        type: boolean
        default: false
        description: "Re-run failed jobs (max 3)"
      run-wormhole:
        required: false
        type: boolean
        default: true
        description: "Run the Wormhole suite"
      run-blackhole:
        required: false
        type: boolean
        default: true
        description: "Run the Blackhole suite"
      run-sim:
        required: false
        default: true
        type: boolean
        description: "Run the TTSim suite"
      run-ttnn-sanity-tests:
        required: false
        type: boolean
        default: true
        description: "Run TTNN sanity tests"
      run-t3000-sanity-tests:
        required: false
        type: boolean
        default: true
        description: "Run T3000 sanity tests"
      run-fabric-sanity-tests:
        required: false
        type: boolean
        default: true
        description: "Run fabric sanity tests"
      run-ops-sanity-tests:
        required: false
        type: boolean
        default: true
        description: "Run ops unit tests"
      run-umd-sanity-tests:
        required: false
        type: boolean
        default: true
        description: "Run UMD sanity tests"
      run-ttsim-sanity-tests:
        required: false
        type: boolean
        default: true
        description: "Run TTSim sanity tests"
      run-blackhole-multi-card-sanity-tests:
        required: false
        default: true
        type: boolean
        description: "Run Blackhole multi-card sanity tests"
      run-models-sanity-tests:
        required: false
        default: true
        type: boolean
        description: "Run model sanity tests (WH Galaxy)"
      enable-watcher:
        required: false
        type: boolean
        default: false
        description: "Enable watcher for long-running tests"
      enable-lightweight-kernel-asserts:
        required: false
        type: boolean
        default: false
        description: "Enable lightweight kernel asserts"
      enable-llk-asserts:
        required: false
        type: boolean
        default: false
        description: "Enable LLK asserts"
      ref:
        required: false
        type: string
        default: ""
        description: "Commit SHA to test (default: HEAD)"
      publish-run-summary:
        required: false
        type: boolean
        default: true
        description: "Publish the AI run summary. A caller that invokes this workflow more than once per run must pass false on all but one invocation, or the reports collide on the artifact name."
  workflow_dispatch:
    inputs:
      with-retries:
        default: false
        type: boolean
        description: "Re-run failed jobs (max 3)"
      run-wormhole:
        required: false
        default: true
        type: boolean
        description: "Run the Wormhole suite"
      run-blackhole:
        required: false
        default: true
        type: boolean
        description: "Run the Blackhole suite"
      run-sim:
        required: false
        default: true
        type: boolean
        description: "Run the TTSim suite"
      platform:
        required: false
        type: choice
        default: "Ubuntu 22.04"
        options:
          - "Ubuntu 22.04"
          - "Ubuntu 24.04"
        description: "Platform to build and test"
      build-type:
        required: false
        default: Release
        type: choice
        options:
          - Release
          - Debug
          - RelWithDebInfo
          - ASan
          - TSan
      enable-lto:
        required: false
        default: false
        type: boolean
        description: "Enable Link Time Optimization (LTO)"
      build-inplace-wheel:
        required: false
        default: true
        type: boolean
        description: "Use Ubuntu instead of manylinux for the wheel build."
      run-ttnn-sanity-tests:
        required: false
        default: true
        type: boolean
        description: "Run TTNN sanity tests"
      run-t3000-sanity-tests:
        required: false
        default: true
        type: boolean
        description: "Run T3000 sanity tests"
      run-fabric-sanity-tests:
        required: false
        default: true
        type: boolean
        description: "Run fabric sanity tests (WH N300 + BH card smoke)"
      run-ops-sanity-tests:
        required: false
        default: true
        type: boolean
        description: "Run ops sanity tests"
      run-umd-sanity-tests:
        required: false
        default: true
        type: boolean
        description: "Run UMD sanity tests"
      run-ttsim-sanity-tests:
        required: false
        default: true
        type: boolean
        description: "Run TTSim sanity tests"
      run-blackhole-multi-card-sanity-tests:
        required: false
        default: true
        type: boolean
        description: "Run Blackhole multi-card sanity tests"
      run-models-sanity-tests:
        required: false
        default: true
        type: boolean
        description: "Run model sanity tests (WH Galaxy)"
      enable-watcher:
        required: false
        default: false
        type: boolean
        description: "Enable watcher for long-running tests"
      enable-lightweight-kernel-asserts:
        required: false
        default: false
        type: boolean
        description: "Enable lightweight kernel asserts"
      enable-llk-asserts:
        required: false
        default: false
        type: boolean
        description: "Enable LLK asserts"
      ref:
        required: false
        type: string
        default: ""
        description: "Commit SHA to test (default: HEAD)"
  push:
    branches: ["main"]
  schedule:
    # Scheduled (cron) runs fire the Blackhole suite (Wormhole + Sim excluded).
    - cron: "0 */2 * * *"

permissions:
  actions: read
  contents: write
  pull-requests: write
  pages: write
  id-token: write
  packages: write
  checks: write

run-name: >-
  Sanity tests${{ (github.event_name == 'schedule' && ' (scheduled)')
  || (github.event_name == 'push' && ' (push)')
  || '' }}${{ inputs.with-retries && ' (with retries)' || '' }}${{
  format(' SKUs[{0}{1}{2}{3}{4}]',
  (inputs.run-wormhole || github.event_name == 'push') && 'WH' || '',
  (inputs.run-wormhole || github.event_name == 'push') && (inputs.run-blackhole || github.event_name == 'schedule') && ',' || '',
  (inputs.run-blackhole || github.event_name == 'schedule') && 'BH' || '',
  (inputs.run-wormhole || inputs.run-blackhole || github.event_name == 'push' || github.event_name == 'schedule') && (inputs.run-sim || github.event_name == 'push') && ',' || '',
  (inputs.run-sim || github.event_name == 'push') && 'Sim' || '') }}
jobs:
  check-harbor:
    uses: ./.github/workflows/check-harbor.yaml
  # NOTE: build-artifact.yaml handles platform parsing internally.
  # Just pass platform and enable-lto inputs directly.
  build-artifact:
    needs: check-harbor
    # A failed/errored check-harbor must not skip the whole pipeline: an empty
    # harbor-prefix output already means "fall back to direct GHCR pulls".
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/build-artifact.yaml
    permissions:
      contents: read
      packages: write
    secrets: inherit
    with:
      harbor-prefix: ${{ needs.check-harbor.outputs.harbor-prefix }}
      build-type: ${{ inputs.build-type || 'Release' }}
      # In-place wheel by default; nightly canary passes build-inplace-wheel:false for the real manylinux wheel.
      # Direct push has no inputs, so treat it as in-place too.
      build-inplace-wheel: ${{ inputs.build-inplace-wheel || github.event_name == 'push' || github.event_name == 'schedule'}}
      build-wheel: ${{ !inputs.build-inplace-wheel && github.event_name != 'push' && github.event_name != 'schedule' }}
      tracy: true
      platform: ${{ inputs.platform || 'Ubuntu 22.04' }}
      skip-tt-train: false
      build-umd-tests: true
      enable-lto: ${{ inputs.enable-lto || false }}
      # CI-internal only: consumers of these packages all run in docker images that
      # already stage SFPI, so skip the redundant download. Never set for release builds.
      use-system-sfpi: true
      ref: ${{ inputs.ref || github.sha }}
      checkout-filter: tree:0

  resolve-docker-pull-refs:
    needs: [check-harbor, build-artifact]
    if: ${{ !cancelled() && needs.build-artifact.result == 'success' }}
    uses: ./.github/workflows/resolve-docker-pull-refs.yaml
    with:
      harbor-prefix: ${{ needs.check-harbor.outputs.harbor-prefix }}
      dev-docker-image: ${{ needs.build-artifact.outputs.dev-docker-image }}
      basic-dev-docker-image: ${{ needs.build-artifact.outputs.basic-dev-docker-image }}
      ci-test-docker-image: ${{ needs.build-artifact.outputs.ci-test-docker-image }}
      basic-docker-image: ${{ needs.build-artifact.outputs.basic-dev-docker-image }}
      test-docker-image: ${{ needs.build-artifact.outputs.ci-test-docker-image }}

  # Single SKU list that gates every suite (L2-nightly style). Each impl filters this list against
  # its own tests yaml via prepare_test_matrix.py, so an empty intersection just yields no jobs.
  generate-sku-matrix:
    runs-on: ubuntu-slim
    outputs:
      sanity-skus: ${{ steps.parse.outputs.sanity-skus }}
      wh-skus: ${{ steps.parse.outputs.wh-skus }}
      bh-skus: ${{ steps.parse.outputs.bh-skus }}
      sim-skus: ${{ steps.parse.outputs.sim-skus }}
      run-wormhole: ${{ steps.parse.outputs.run-wormhole }}
      run-blackhole: ${{ steps.parse.outputs.run-blackhole }}
      run-sim: ${{ steps.parse.outputs.run-sim }}
    steps:
      - id: parse
        run: |
          run_wormhole='${{ inputs.run-wormhole }}'
          run_blackhole='${{ inputs.run-blackhole }}'
          run_sim='${{ inputs.run-sim }}'

          if [[ -z "$run_wormhole" && -z "$run_blackhole" && -z "$run_sim" ]]; then
            if [[ "${{ github.event_name }}" == "schedule" ]]; then
              # Scheduled (cron) runs of this workflow cover Blackhole.
              run_wormhole=false
              run_blackhole=true
              run_sim=false
            else
              # Direct push to main covers Wormhole + sim.
              run_wormhole=true
              run_blackhole=false
              run_sim=true
            fi
          fi

          if [[ "$run_wormhole" != "true" && "$run_blackhole" != "true" && "$run_sim" != "true" ]]; then
            echo "❌ Error: Neither wormhole, blackhole, nor sim was selected."
            exit 1
          fi

          sanity_skus=()
          wh_skus=()
          bh_skus=()
          sim_skus=()
          # wh-skus / bh-skus are per-arch lists: pass these to an impl when this pipeline
          # must restrict a multi-architecture tests YAML to one architecture (umd-sanity-tests).
          # sanity-skus is the union of every enabled arch's list below: pass this to an impl
          # whose tests yaml spans multiple architectures in one file (ttnn-sanity-tests,
          # ops-sanity-tests, blackhole-multi-card-fast-sanity-tests). prepare_test_matrix.py
          # intersects whichever list it's given against each test's own `skus:` map, so handing
          # a wider list than a given tests yaml needs is safe -- SKUs the yaml doesn't reference
          # simply produce no matrix rows for that impl.
          #
          # Both lists include every wh_*/bh_* SKU in .github/sku_config.yaml except:
          #   - Galaxy SKUs (wh_galaxy*, bh_galaxy*) -- a separate pipeline (galaxy-sanity.yaml).
          #   - bh_sc* -- exabox multihost SKUs, used by shield/scaleout, not sanity.
          #   - cpu_medium -- not a wh/bh hardware SKU.
          #   - *_prio SKUs -- merge_group-only aliases; sku_config.yaml itself says not to
          #     list these in a tests yaml's skus map.
          if [[ "$run_wormhole" == "true" ]]; then
            wh_skus+=(
              "wh_llmbox"
              "wh_llmbox_perf"
              "wh_n150"
              "wh_n300"
              "wh_n150_civ2"
              "wh_n300_civ2"
              "wh_llmbox_civ2"
              "wh_llmbox_civ2_viommu"
              "wh_n300_perf"
            )
            sanity_skus+=("${wh_skus[@]}")
          fi
          if [[ "$run_blackhole" == "true" ]]; then
            bh_skus+=(
              "bh_p150b_civ2_viommu"
              "bh_p150b_civ2"
              "bh_p150"
              "bh_p150_perf"
              "bh_loudbox"
              "bh_p300"
              "bh_p300_viommu"
              "bh_loudbox_civ2_viommu"
              "bh_quietbox_2"
              "bh_quietbox_2_iommu"
            )
            sanity_skus+=("${bh_skus[@]}")
          fi
          if [[ "$run_sim" == "true" ]]; then
            sim_skus+=(
              "sim_wh_n150"
              "sim_wh_galaxy"
              "sim_bh_p150"
              "sim_bh_galaxy"
            )
            sanity_skus+=("${sim_skus[@]}")
          fi

          sanity_skus_str=$(IFS=,; echo "${sanity_skus[*]}")
          echo "sanity-skus=$sanity_skus_str" >> "$GITHUB_OUTPUT"
          # Per-arch subsets, for suites whose tests yaml also defines SKUs of another arch that this
          # pipeline does not want to schedule.
          wh_skus_str=$(IFS=,; echo "${wh_skus[*]}")
          echo "wh-skus=$wh_skus_str" >> "$GITHUB_OUTPUT"
          bh_skus_str=$(IFS=,; echo "${bh_skus[*]}")
          echo "bh-skus=$bh_skus_str" >> "$GITHUB_OUTPUT"
          sim_skus_str=$(IFS=,; echo "${sim_skus[*]}")
          echo "sim-skus=$sim_skus_str" >> "$GITHUB_OUTPUT"

          echo "run-wormhole=$run_wormhole" >> "$GITHUB_OUTPUT"
          echo "run-blackhole=$run_blackhole" >> "$GITHUB_OUTPUT"
          echo "run-sim=$run_sim" >> "$GITHUB_OUTPUT"

  # TTNN sanity tests
  ttnn-sanity-tests:
    needs: [build-artifact, generate-sku-matrix]
    secrets: inherit
    if: ${{ always() && !cancelled() && needs.build-artifact.result == 'success' && needs.generate-sku-matrix.outputs.sanity-skus != '' && toJSON(inputs.run-ttnn-sanity-tests) != 'false' }}
    uses: ./.github/workflows/ttnn-sanity-tests-impl.yaml
    with:
      summary-scope: ${{ inputs.platform }}
      # HW and sim SKUs share one call; sim_* SKUs run on ubuntu-latest (no Harbor access), so this
      # uses the canonical GHCR image from build-artifact (not the Harbor-resolved ref).
      enabled-skus: ${{ needs.generate-sku-matrix.outputs.sanity-skus }}
      docker-image: ${{ needs.build-artifact.outputs.ci-test-docker-image }}
      wheel-artifact-name: ${{ needs.build-artifact.outputs.wheel-artifact-name }}
      enable-watcher: ${{ inputs.enable-watcher || false }}
      timeout-minutes-override: ${{ inputs.enable-watcher && 240 || 0 }}
      enable-lightweight-kernel-asserts: ${{ inputs.enable-lightweight-kernel-asserts || false }}
      enable-llk-asserts: ${{ inputs.enable-llk-asserts || false }}
      ref: ${{ inputs.ref || github.sha }}

  t3000-sanity-tests:
    if: ${{ always() && !cancelled() && needs.build-artifact.result == 'success' && needs.generate-sku-matrix.outputs.run-wormhole == 'true' && toJSON(inputs.run-t3000-sanity-tests) != 'false' }}
    needs: [build-artifact, generate-sku-matrix]
    secrets: inherit
    uses: ./.github/workflows/t3000-sanity-tests-impl.yaml
    with:
      summary-scope: ${{ inputs.platform }}
      # sanity-skus, same as ttnn-sanity-tests/ops-sanity-tests/blackhole-multi-card-fast-sanity-tests.
      # t3000_sanity_tests.yaml today only defines wh_llmbox_civ2; every other SKU in the
      # list (wh_n300_civ2, wh_llmbox, wh_llmbox_civ2_viommu, wh_llmbox_perf, and any bh_*/sim_*
      # entries) simply produces no matrix row here until/unless a test entry references it.
      # The job's own `if:` above still gates on run-wormhole, so this never fires with a
      # SKU set lacking a wh_llmbox entry.
      enabled-skus: ${{ needs.generate-sku-matrix.outputs.sanity-skus }}
      docker-image: ${{ needs.build-artifact.outputs.dev-docker-image }}
      build-artifact-name: ${{ needs.build-artifact.outputs.build-artifact-name }}
      wheel-artifact-name: ${{ needs.build-artifact.outputs.wheel-artifact-name }}
      enable-watcher: ${{ inputs.enable-watcher || false }}
      enable-lightweight-kernel-asserts: ${{ inputs.enable-lightweight-kernel-asserts || false }}
      enable-llk-asserts: ${{ inputs.enable-llk-asserts || false }}
      timeout-minutes-override: ${{ inputs.enable-watcher && 80 || 0 }}
      ref: ${{ inputs.ref || github.sha }}

  # Fabric sanity (via fabric_sanity_tests.yaml).
  # Single source of truth for fabric coverage in the sanity pipeline.
  fabric-sanity-tests:
    if: ${{ always() && !cancelled() && needs.build-artifact.result == 'success' && (needs.generate-sku-matrix.outputs.run-wormhole == 'true' || needs.generate-sku-matrix.outputs.run-blackhole == 'true') && toJSON(inputs.run-fabric-sanity-tests) != 'false' }}
    needs: [build-artifact, generate-sku-matrix]
    secrets: inherit
    uses: ./.github/workflows/fabric-sanity-tests-impl.yaml
    with:
      enabled-skus: ${{ format('{0}{1}', needs.generate-sku-matrix.outputs.sanity-skus, needs.generate-sku-matrix.outputs.run-wormhole == 'true' && ',wh_llmbox_civ2' || '') }}
      docker-image: ${{ needs.build-artifact.outputs.dev-docker-image }}
      build-artifact-name: ${{ needs.build-artifact.outputs.build-artifact-name }}
      wheel-artifact-name: ${{ needs.build-artifact.outputs.wheel-artifact-name }}
      enable-watcher: ${{ inputs.enable-watcher || false }}
      ref: ${{ inputs.ref || github.sha }}

  # Ops sanity (Wormhole + Blackhole via ops_sanity_tests.yaml)
  ops-sanity-tests:
    needs: [resolve-docker-pull-refs, build-artifact, generate-sku-matrix]
    secrets: inherit
    if: ${{ always() && !cancelled() && needs.resolve-docker-pull-refs.result == 'success' && needs.build-artifact.result == 'success' && (needs.generate-sku-matrix.outputs.run-wormhole == 'true' || needs.generate-sku-matrix.outputs.run-blackhole == 'true') && toJSON(inputs.run-ops-sanity-tests) != 'false' }}
    uses: ./.github/workflows/ops-sanity-impl.yaml
    with:
      summary-scope: ${{ inputs.platform }}
      docker-image: ${{ needs.resolve-docker-pull-refs.outputs.dev-docker-image }}
      build-artifact-name: ${{ needs.build-artifact.outputs.build-artifact-name }}
      wheel-artifact-name: ${{ needs.build-artifact.outputs.wheel-artifact-name }}
      enabled-skus: ${{ needs.generate-sku-matrix.outputs.sanity-skus }}
      enable-watcher: ${{ inputs.enable-watcher || false }}
      enable-lightweight-kernel-asserts: ${{ inputs.enable-lightweight-kernel-asserts || false }}
      enable-llk-asserts: ${{ inputs.enable-llk-asserts || false }}
      ref: ${{ inputs.ref || github.sha }}

  # UMD sanity (Blackhole only)
  umd-sanity-tests:
    needs: [resolve-docker-pull-refs, build-artifact, generate-sku-matrix]
    secrets: inherit
    if: ${{ always() && !cancelled() && needs.resolve-docker-pull-refs.result == 'success' && needs.build-artifact.result == 'success' && needs.generate-sku-matrix.outputs.run-blackhole == 'true' && toJSON(inputs.run-umd-sanity-tests) != 'false' }}
    uses: ./.github/workflows/umd-sanity-tests-impl.yaml
    with:
      summary-scope: ${{ inputs.platform }}
      enabled-skus: ${{ needs.generate-sku-matrix.outputs.bh-skus }}
      docker-image: ${{ needs.resolve-docker-pull-refs.outputs.dev-docker-image }}
      build-artifact-name: ${{ needs.build-artifact.outputs.build-artifact-name }}
      enable-watcher: ${{ inputs.enable-watcher || false }}
      enable-llk-asserts: ${{ inputs.enable-llk-asserts || false }}
      ref: ${{ inputs.ref || github.sha }}

  ttsim-sanity-tests:
    needs: [build-artifact, generate-sku-matrix]
    if: ${{ !cancelled() && needs.build-artifact.result == 'success' && needs.generate-sku-matrix.outputs.run-sim == 'true' && toJSON(inputs.run-ttsim-sanity-tests) != 'false' }}
    uses: ./.github/workflows/ttsim-sanity-tests-impl.yaml
    secrets: inherit
    with:
      summary-scope: ${{ inputs.platform }}
      basic-docker-image: ${{ needs.build-artifact.outputs.basic-dev-docker-image }}
      package-artifact-name: ${{ needs.build-artifact.outputs.packages-artifact-name }}
      ref: ${{ inputs.ref || github.sha }}

  runtime-sim-sanity-tests:
    needs: [build-artifact, generate-sku-matrix]
    if: ${{ !cancelled() && needs.build-artifact.result == 'success' && needs.generate-sku-matrix.outputs.run-sim == 'true' && toJSON(inputs.run-ttsim-sanity-tests) != 'false' }}
    uses: ./.github/workflows/runtime-sanity-tests-impl.yaml
    secrets: inherit
    with:
      summary-scope: ${{ inputs.platform }}
      docker-image: ${{ needs.build-artifact.outputs.ci-test-docker-image }}
      build-artifact-name: ${{ needs.build-artifact.outputs.build-artifact-name }}
      wheel-artifact-name: ${{ needs.build-artifact.outputs.wheel-artifact-name }}
      # runtime_sanity_tests.yaml also covers HW SKUs; this job is the sim half only.
      enabled-skus: ${{ needs.generate-sku-matrix.outputs.sim-skus }}
      ref: ${{ inputs.ref || github.sha }}

  # Blackhole multi-card post-commit tests (QB2/P300 box).
  blackhole-multi-card-fast-sanity-tests:
    if: ${{ always() && !cancelled() && needs.build-artifact.result == 'success' && needs.generate-sku-matrix.outputs.run-blackhole == 'true' && toJSON(inputs.run-blackhole-multi-card-sanity-tests) != 'false' }}
    needs: [build-artifact, generate-sku-matrix]
    secrets: inherit
    uses: ./.github/workflows/blackhole-multi-card-sanity-tests-impl.yaml
    with:
      summary-scope: ${{ inputs.platform }}
      enabled-skus: ${{ needs.generate-sku-matrix.outputs.sanity-skus }}
      docker-image: ${{ needs.build-artifact.outputs.dev-docker-image }}
      build-artifact-name: ${{ needs.build-artifact.outputs.build-artifact-name }}
      wheel-artifact-name: ${{ needs.build-artifact.outputs.wheel-artifact-name }}
      enable-llk-asserts: ${{ inputs.enable-llk-asserts || false }}
      ref: ${{ inputs.ref || github.sha }}

  # Model sanity tests (WH Galaxy). The gate requires an explicit true, so a push to
  # main and the scheduled runs leave this leg out: `inputs` is null on those events.
  models-sanity-tests:
    if: ${{ always() && !cancelled() && needs.build-artifact.result == 'success' && needs.generate-sku-matrix.outputs.run-wormhole == 'true' && toJSON(inputs.run-models-sanity-tests) == 'true' }}
    needs: [build-artifact, generate-sku-matrix]
    secrets: inherit
    uses: ./.github/workflows/models-sanity-tests-impl.yaml
    with:
      docker-image: ${{ needs.build-artifact.outputs.dev-docker-image }}
      build-artifact-name: ${{ needs.build-artifact.outputs.build-artifact-name }}
      wheel-artifact-name: ${{ needs.build-artifact.outputs.wheel-artifact-name }}
      ref: ${{ inputs.ref || github.sha }}
      summary-scope: ${{ inputs.platform }}

  # ── AI run summary ────────────────────────────────────────────────
  # Aggregates the per-leg ai-job-summary artifacts from the sanity impls this
  # workflow invokes (galaxy-sanity-impl is driven by galaxy-sanity.yaml and is
  # not covered) into one run-level report. expected-jobs is the union of each
  # impl's matrix, so a leg whose runner died is reported as an infra failure
  # rather than silently dropped. A new impl must be added to `needs:` below or
  # its legs are absent from that union with no error.
  #
  # build-artifact and the matrix jobs are in `needs:` because every impl is
  # gated on them: when a build fails the impls are *skipped*, not failed, and
  # without them the combined result would be `skipped` — which suppresses
  # infra synthesis entirely and reports a broken run as if nothing was due.
  ai-run-summary:
    name: "AI Run Summary"
    needs:
      - build-artifact
      - resolve-docker-pull-refs
      - generate-sku-matrix
      - ttnn-sanity-tests
      - t3000-sanity-tests
      - ops-sanity-tests
      - umd-sanity-tests
      - ttsim-sanity-tests
      - runtime-sim-sanity-tests
      - blackhole-multi-card-fast-sanity-tests
      - models-sanity-tests
    # Reports on a run that failed — the case the summary exists for — but not
    # on one that was cancelled: an aborted run has no outcome to summarize, and
    # asking for one spends an LLM call to say it stopped early.
    #
    # A caller that invokes this workflow twice per run (sanity-tests-debug)
    # passes false, so the two reports don't collide on the artifact name.
    # The github.workflow arm covers this workflow's own push/schedule triggers,
    # where the `inputs` context is empty and the default above never applies;
    # it is the caller's workflow name for a workflow_call, so it is false there.
    if: ${{ !cancelled() && (inputs.publish-run-summary || github.workflow == 'Sanity tests') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        timeout-minutes: 20
        with:
          filter: blob:none
          sparse-checkout: .github
      - name: Aggregate child matrices and results
        id: aggregate
        # Reporting must never fail the run: a jq error here would turn a green
        # sanity run red.
        continue-on-error: true
        env:
          # toJSON(needs) is one object keyed by child job name, each with
          # `result` and `outputs.matrix`; aggregating from it keeps this
          # data-driven as impls are added to or removed from the `needs` list.
          NEEDS: ${{ toJSON(needs) }}
        run: |
          # Expected legs come from the children that ran. A cancelled child
          # keeps a successful load-test-matrix, so including it would stub its
          # legs as INFRA_FAILURE when another child failed; skipped children
          # expose a null/empty matrix, which fromjson would throw on.
          RAN=$(jq -cn --argjson n "$NEEDS" '
            [$n[] | select(.result != "cancelled" and .result != "skipped")]')

          EXPECTED=$(jq -cn --argjson r "$RAN" '
            [$r[] | .outputs.matrix | select(. != null and . != "") | fromjson] | add // []')
          echo "expected-jobs=$EXPECTED" >> "$GITHUB_OUTPUT"
          echo "Merged $(echo "$EXPECTED" | jq 'length') expected legs"

          # Most-severe-wins over every child, so a cancelled run says so in the
          # report instead of reading as a clean pass. Upstream also treats
          # cancelled/skipped as "expect nothing", which is what we want: legs
          # that never finished were aborted, not infra failures.
          RESULT=$(jq -rn --argjson n "$NEEDS" '
            [$n[].result] as $s |
            if   any($s[]; . == "failure")   then "failure"
            elif any($s[]; . == "cancelled") then "cancelled"
            elif any($s[]; . == "success")   then "success"
            else                                  "skipped"
            end')
          echo "run-result=$RESULT" >> "$GITHUB_OUTPUT"
          echo "Combined run-result: $RESULT"
      - id: ai-run-summary
        continue-on-error: true
        uses: tenstorrent/tt-github-actions/.github/actions/ai_summary/run@main
        with:
          config: |
            {
              "model": "${{ vars.AI_SUMMARY_MODEL }}",
              "workspace": "$GITHUB_WORKSPACE",
              "input_dir": "ai_job_summaries",
              "output_dir": "ai_run_summaries",
              "scope": "${{ inputs.platform }}"
            }
          api-key: ${{ secrets.TT_CHAT_API_KEY }}
          api-url: ${{ secrets.TT_CHAT_URL }}
          expected-jobs: ${{ steps.aggregate.outputs.expected-jobs }}
          run-result: ${{ steps.aggregate.outputs.run-result }}
      - name: Show report
        if: ${{ always() && steps.ai-run-summary.outputs.report-file != '' }}
        continue-on-error: true
        shell: bash
        env:
          REPORT_FILE: ${{ steps.ai-run-summary.outputs.report-file }}
        run: |
          if [ -f "$REPORT_FILE" ]; then
            cat "$REPORT_FILE"
            cat "$REPORT_FILE" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Report file not found: $REPORT_FILE"
          fi

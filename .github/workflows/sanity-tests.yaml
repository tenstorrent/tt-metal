name: "Sanity tests"

on:
  workflow_call:
    inputs:
      build-type:
        required: false
        default: Release
        type: string
        description: "Build type configuration (Release, Debug, RelWithDebInfo, ASan, TSan)"
      platform:
        required: false
        type: string
        default: "Ubuntu 22.04"
        description: "Platform to build and test (e.g., 'Ubuntu 22.04', 'Ubuntu 24.04')"
      enable-lto:
        required: false
        type: boolean
        default: false
        description: "Enable Link Time Optimization (LTO)"
      build-inplace-wheel:
        required: false
        type: boolean
        default: true
        description: "Use Ubuntu instead of manylinux for the wheel build."
      with-retries:
        required: false
        type: boolean
        default: false
        description: "Re-run failed jobs (max 3)"
      run-wormhole:
        required: false
        type: boolean
        default: true
        description: "Run the Wormhole suite"
      run-blackhole:
        required: false
        type: boolean
        default: true
        description: "Run the Blackhole suite"
      run-sim:
        required: false
        default: true
        type: boolean
        description: "Run the TTSim suite"
      run-ttnn-sanity-tests:
        required: false
        type: boolean
        default: true
        description: "Run TTNN sanity tests"
      run-t3000-sanity-tests:
        required: false
        type: boolean
        default: true
        description: "Run T3000 sanity tests"
      run-ops-sanity-tests:
        required: false
        type: boolean
        default: true
        description: "Run ops unit tests"
      run-umd-sanity-tests:
        required: false
        type: boolean
        default: true
        description: "Run UMD sanity tests"
      run-ttsim-sanity-tests:
        required: false
        type: boolean
        default: true
        description: "Run TTSim sanity tests"
      run-blackhole-multi-card-sanity-tests:
        required: false
        default: true
        type: boolean
        description: "Run Blackhole multi-card sanity tests"
      enable-watcher:
        required: false
        type: boolean
        default: false
        description: "Enable watcher for long-running tests"
      enable-lightweight-kernel-asserts:
        required: false
        type: boolean
        default: false
        description: "Enable lightweight kernel asserts"
      enable-llk-asserts:
        required: false
        type: boolean
        default: false
        description: "Enable LLK asserts"
      ref:
        required: false
        type: string
        default: ""
        description: "Commit SHA to test (default: HEAD)"
  workflow_dispatch:
    inputs:
      with-retries:
        default: false
        type: boolean
        description: "Re-run failed jobs (max 3)"
      run-wormhole:
        required: false
        default: true
        type: boolean
        description: "Run the Wormhole suite"
      run-blackhole:
        required: false
        default: true
        type: boolean
        description: "Run the Blackhole suite"
      run-sim:
        required: false
        default: true
        type: boolean
        description: "Run the TTSim suite"
      platform:
        required: false
        type: choice
        default: "Ubuntu 22.04"
        options:
          - "Ubuntu 22.04"
          - "Ubuntu 24.04"
        description: "Platform to build and test"
      build-type:
        required: false
        default: Release
        type: choice
        options:
          - Release
          - Debug
          - RelWithDebInfo
          - ASan
          - TSan
      enable-lto:
        required: false
        default: false
        type: boolean
        description: "Enable Link Time Optimization (LTO)"
      build-inplace-wheel:
        required: false
        default: true
        type: boolean
        description: "Use Ubuntu instead of manylinux for the wheel build."
      run-ttnn-sanity-tests:
        required: false
        default: true
        type: boolean
        description: "Run TTNN sanity tests"
      run-t3000-sanity-tests:
        required: false
        default: true
        type: boolean
        description: "Run T3000 sanity tests"
      run-ops-sanity-tests:
        required: false
        default: true
        type: boolean
        description: "Run ops sanity tests"
      run-umd-sanity-tests:
        required: false
        default: true
        type: boolean
        description: "Run UMD sanity tests"
      run-ttsim-sanity-tests:
        required: false
        default: true
        type: boolean
        description: "Run TTSim sanity tests"
      run-blackhole-multi-card-sanity-tests:
        required: false
        default: true
        type: boolean
        description: "Run Blackhole multi-card sanity tests"
      enable-watcher:
        required: false
        default: false
        type: boolean
        description: "Enable watcher for long-running tests"
      enable-lightweight-kernel-asserts:
        required: false
        default: false
        type: boolean
        description: "Enable lightweight kernel asserts"
      enable-llk-asserts:
        required: false
        default: false
        type: boolean
        description: "Enable LLK asserts"
      ref:
        required: false
        type: string
        default: ""
        description: "Commit SHA to test (default: HEAD)"
  push:
    branches: ["main"]
  schedule:
    # Scheduled (cron) runs fire the Blackhole suite (Wormhole + Sim excluded).
    - cron: "0 */4 * * *"

permissions:
  actions: read
  contents: write
  pull-requests: write
  pages: write
  id-token: write
  packages: write
  checks: write

run-name: >-
  Sanity tests${{ (github.event_name == 'schedule' && ' (scheduled)')
  || (github.event_name == 'push' && ' (push)')
  || '' }}${{ inputs.with-retries && ' (with retries)' || '' }}${{
  format(' SKUs[{0}{1}{2}{3}{4}]',
  (inputs.run-wormhole || github.event_name == 'push') && 'WH' || '',
  (inputs.run-wormhole || github.event_name == 'push') && (inputs.run-blackhole || github.event_name == 'schedule') && ',' || '',
  (inputs.run-blackhole || github.event_name == 'schedule') && 'BH' || '',
  (inputs.run-wormhole || inputs.run-blackhole || github.event_name == 'push' || github.event_name == 'schedule') && (inputs.run-sim || github.event_name == 'push') && ',' || '',
  (inputs.run-sim || github.event_name == 'push') && 'Sim' || '') }}
jobs:
  check-harbor:
    uses: ./.github/workflows/check-harbor.yaml
  # NOTE: build-artifact.yaml handles platform parsing internally.
  # Just pass platform and enable-lto inputs directly.
  build-artifact:
    needs: check-harbor
    # A failed/errored check-harbor must not skip the whole pipeline: an empty
    # harbor-prefix output already means "fall back to direct GHCR pulls".
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/build-artifact.yaml
    permissions:
      contents: read
      packages: write
    secrets: inherit
    with:
      harbor-prefix: ${{ needs.check-harbor.outputs.harbor-prefix }}
      build-type: ${{ inputs.build-type || 'Release' }}
      # In-place wheel by default; nightly canary passes build-inplace-wheel:false for the real manylinux wheel.
      # Direct push has no inputs, so treat it as in-place too.
      build-inplace-wheel: ${{ inputs.build-inplace-wheel || github.event_name == 'push' || github.event_name == 'schedule'}}
      build-wheel: ${{ !inputs.build-inplace-wheel && github.event_name != 'push' && github.event_name != 'schedule' }}
      tracy: true
      platform: ${{ inputs.platform || 'Ubuntu 22.04' }}
      skip-tt-train: false
      build-umd-tests: true
      enable-lto: ${{ inputs.enable-lto || false }}
      # CI-internal only: consumers of these packages all run in docker images that
      # already stage SFPI, so skip the redundant download. Never set for release builds.
      use-system-sfpi: true
      ref: ${{ inputs.ref || github.sha }}
      checkout-filter: tree:0

  resolve-docker-pull-refs:
    needs: [check-harbor, build-artifact]
    if: ${{ !cancelled() && needs.build-artifact.result == 'success' }}
    uses: ./.github/workflows/resolve-docker-pull-refs.yaml
    with:
      harbor-prefix: ${{ needs.check-harbor.outputs.harbor-prefix }}
      dev-docker-image: ${{ needs.build-artifact.outputs.dev-docker-image }}
      basic-dev-docker-image: ${{ needs.build-artifact.outputs.basic-dev-docker-image }}
      ci-test-docker-image: ${{ needs.build-artifact.outputs.ci-test-docker-image }}
      basic-docker-image: ${{ needs.build-artifact.outputs.basic-dev-docker-image }}
      test-docker-image: ${{ needs.build-artifact.outputs.ci-test-docker-image }}

  # Single SKU list that gates every suite (L2-nightly style). Each impl filters this list against
  # its own tests yaml via prepare_test_matrix.py, so an empty intersection just yields no jobs.
  generate-sku-matrix:
    runs-on: ubuntu-slim
    outputs:
      sanity-skus: ${{ steps.parse.outputs.sanity-skus }}
      wh-skus: ${{ steps.parse.outputs.wh-skus }}
      bh-skus: ${{ steps.parse.outputs.bh-skus }}
      sim-skus: ${{ steps.parse.outputs.sim-skus }}
      run-wormhole: ${{ steps.parse.outputs.run-wormhole }}
      run-blackhole: ${{ steps.parse.outputs.run-blackhole }}
      run-sim: ${{ steps.parse.outputs.run-sim }}
    steps:
      - id: parse
        run: |
          run_wormhole='${{ inputs.run-wormhole }}'
          run_blackhole='${{ inputs.run-blackhole }}'
          run_sim='${{ inputs.run-sim }}'

          if [[ -z "$run_wormhole" && -z "$run_blackhole" && -z "$run_sim" ]]; then
            if [[ "${{ github.event_name }}" == "schedule" ]]; then
              # Scheduled (cron) runs of this workflow cover Blackhole.
              run_wormhole=false
              run_blackhole=true
              run_sim=false
            else
              # Direct push to main covers Wormhole + sim.
              run_wormhole=true
              run_blackhole=false
              run_sim=true
            fi
          fi

          if [[ "$run_wormhole" != "true" && "$run_blackhole" != "true" && "$run_sim" != "true" ]]; then
            echo "❌ Error: Neither wormhole, blackhole, nor sim was selected."
            exit 1
          fi

          sanity_skus=()
          wh_skus=()
          bh_skus=()
          sim_skus=()
          if [[ "$run_wormhole" == "true" ]]; then
            wh_skus+=("wh_n300_civ2")
            sanity_skus+=("${wh_skus[@]}")
          fi
          if [[ "$run_blackhole" == "true" ]]; then
            bh_skus+=("bh_p150b_civ2" "bh_p150b_civ2_viommu" "bh_quietbox_2" "bh_p300")
            sanity_skus+=("${bh_skus[@]}")
          fi
          if [[ "$run_sim" == "true" ]]; then
            sim_skus+=("sim_wh_n150" "sim_wh_galaxy" "sim_bh_p150" "sim_bh_galaxy")
            sanity_skus+=("${sim_skus[@]}")
          fi

          sanity_skus_str=$(IFS=,; echo "${sanity_skus[*]}")
          echo "sanity-skus=$sanity_skus_str" >> "$GITHUB_OUTPUT"
          # Per-arch subsets, for suites whose tests yaml also defines SKUs of another arch that this
          # pipeline does not want to schedule.
          wh_skus_str=$(IFS=,; echo "${wh_skus[*]}")
          echo "wh-skus=$wh_skus_str" >> "$GITHUB_OUTPUT"
          bh_skus_str=$(IFS=,; echo "${bh_skus[*]}")
          echo "bh-skus=$bh_skus_str" >> "$GITHUB_OUTPUT"
          sim_skus_str=$(IFS=,; echo "${sim_skus[*]}")
          echo "sim-skus=$sim_skus_str" >> "$GITHUB_OUTPUT"

          echo "run-wormhole=$run_wormhole" >> "$GITHUB_OUTPUT"
          echo "run-blackhole=$run_blackhole" >> "$GITHUB_OUTPUT"
          echo "run-sim=$run_sim" >> "$GITHUB_OUTPUT"

  # TTNN sanity tests
  ttnn-sanity-tests:
    needs: [build-artifact, generate-sku-matrix]
    secrets: inherit
    if: ${{ always() && !cancelled() && needs.build-artifact.result == 'success' && needs.generate-sku-matrix.outputs.sanity-skus != '' && toJSON(inputs.run-ttnn-sanity-tests) != 'false' }}
    uses: ./.github/workflows/ttnn-sanity-tests-impl.yaml
    with:
      # HW and sim SKUs share one call; sim_* SKUs run on ubuntu-latest (no Harbor access), so this
      # uses the canonical GHCR image from build-artifact (not the Harbor-resolved ref).
      enabled-skus: ${{ needs.generate-sku-matrix.outputs.sanity-skus }}
      docker-image: ${{ needs.build-artifact.outputs.ci-test-docker-image }}
      wheel-artifact-name: ${{ needs.build-artifact.outputs.wheel-artifact-name }}
      enable-watcher: ${{ inputs.enable-watcher || false }}
      timeout-minutes-override: ${{ inputs.enable-watcher && 240 || 0 }}
      enable-lightweight-kernel-asserts: ${{ inputs.enable-lightweight-kernel-asserts || false }}
      enable-llk-asserts: ${{ inputs.enable-llk-asserts || false }}
      ref: ${{ inputs.ref || github.sha }}

  t3000-sanity-tests:
    if: ${{ always() && !cancelled() && needs.build-artifact.result == 'success' && needs.generate-sku-matrix.outputs.run-wormhole == 'true' && toJSON(inputs.run-t3000-sanity-tests) != 'false' }}
    needs: [build-artifact, generate-sku-matrix]
    secrets: inherit
    uses: ./.github/workflows/t3000-sanity-tests-impl.yaml
    with:
      enabled-skus: "wh_llmbox_civ2"
      docker-image: ${{ needs.build-artifact.outputs.dev-docker-image }}
      build-artifact-name: ${{ needs.build-artifact.outputs.build-artifact-name }}
      wheel-artifact-name: ${{ needs.build-artifact.outputs.wheel-artifact-name }}
      enable-watcher: ${{ inputs.enable-watcher || false }}
      enable-lightweight-kernel-asserts: ${{ inputs.enable-lightweight-kernel-asserts || false }}
      enable-llk-asserts: ${{ inputs.enable-llk-asserts || false }}
      timeout-minutes-override: ${{ inputs.enable-watcher && 80 || 0 }}
      ref: ${{ inputs.ref || github.sha }}

  # Ops sanity (Wormhole + Blackhole via ops_sanity_tests.yaml)
  ops-sanity-tests:
    needs: [resolve-docker-pull-refs, build-artifact, generate-sku-matrix]
    secrets: inherit
    if: ${{ always() && !cancelled() && needs.resolve-docker-pull-refs.result == 'success' && needs.build-artifact.result == 'success' && (needs.generate-sku-matrix.outputs.run-wormhole == 'true' || needs.generate-sku-matrix.outputs.run-blackhole == 'true') && toJSON(inputs.run-ops-sanity-tests) != 'false' }}
    uses: ./.github/workflows/ops-sanity-impl.yaml
    with:
      docker-image: ${{ needs.resolve-docker-pull-refs.outputs.dev-docker-image }}
      build-artifact-name: ${{ needs.build-artifact.outputs.build-artifact-name }}
      wheel-artifact-name: ${{ needs.build-artifact.outputs.wheel-artifact-name }}
      enabled-skus: ${{ needs.generate-sku-matrix.outputs.sanity-skus }}
      enable-watcher: ${{ inputs.enable-watcher || false }}
      enable-lightweight-kernel-asserts: ${{ inputs.enable-lightweight-kernel-asserts || false }}
      enable-llk-asserts: ${{ inputs.enable-llk-asserts || false }}
      ref: ${{ inputs.ref || github.sha }}

  # UMD sanity (Blackhole only)
  umd-sanity-tests:
    needs: [resolve-docker-pull-refs, build-artifact, generate-sku-matrix]
    secrets: inherit
    if: ${{ always() && !cancelled() && needs.resolve-docker-pull-refs.result == 'success' && needs.build-artifact.result == 'success' && needs.generate-sku-matrix.outputs.run-blackhole == 'true' && toJSON(inputs.run-umd-sanity-tests) != 'false' }}
    uses: ./.github/workflows/umd-sanity-tests-impl.yaml
    with:
      enabled-skus: ${{ needs.generate-sku-matrix.outputs.bh-skus }}
      docker-image: ${{ needs.resolve-docker-pull-refs.outputs.dev-docker-image }}
      build-artifact-name: ${{ needs.build-artifact.outputs.build-artifact-name }}
      enable-watcher: ${{ inputs.enable-watcher || false }}
      enable-llk-asserts: ${{ inputs.enable-llk-asserts || false }}
      ref: ${{ inputs.ref || github.sha }}

  ttsim-sanity-tests:
    needs: [build-artifact, generate-sku-matrix]
    if: ${{ !cancelled() && needs.build-artifact.result == 'success' && needs.generate-sku-matrix.outputs.run-sim == 'true' && toJSON(inputs.run-ttsim-sanity-tests) != 'false' }}
    uses: ./.github/workflows/ttsim-sanity-tests-impl.yaml
    secrets: inherit
    with:
      basic-docker-image: ${{ needs.build-artifact.outputs.basic-dev-docker-image }}
      package-artifact-name: ${{ needs.build-artifact.outputs.packages-artifact-name }}
      ref: ${{ inputs.ref || github.sha }}

  runtime-sim-sanity-tests:
    needs: [build-artifact, generate-sku-matrix]
    if: ${{ !cancelled() && needs.build-artifact.result == 'success' && needs.generate-sku-matrix.outputs.run-sim == 'true' && toJSON(inputs.run-ttsim-sanity-tests) != 'false' }}
    uses: ./.github/workflows/runtime-sanity-tests-impl.yaml
    secrets: inherit
    with:
      docker-image: ${{ needs.build-artifact.outputs.ci-test-docker-image }}
      build-artifact-name: ${{ needs.build-artifact.outputs.build-artifact-name }}
      wheel-artifact-name: ${{ needs.build-artifact.outputs.wheel-artifact-name }}
      # runtime_sanity_tests.yaml also covers HW SKUs; this job is the sim half only.
      enabled-skus: ${{ needs.generate-sku-matrix.outputs.sim-skus }}
      ref: ${{ inputs.ref || github.sha }}

  # Blackhole multi-card post-commit tests (QB2/P300 box).
  blackhole-multi-card-fast-sanity-tests:
    if: ${{ always() && !cancelled() && needs.build-artifact.result == 'success' && needs.generate-sku-matrix.outputs.run-blackhole == 'true' && toJSON(inputs.run-blackhole-multi-card-sanity-tests) != 'false' }}
    needs: [build-artifact, generate-sku-matrix]
    secrets: inherit
    uses: ./.github/workflows/blackhole-multi-card-sanity-tests-impl.yaml
    with:
      enabled-skus: ${{ needs.generate-sku-matrix.outputs.sanity-skus }}
      docker-image: ${{ needs.build-artifact.outputs.dev-docker-image }}
      build-artifact-name: ${{ needs.build-artifact.outputs.build-artifact-name }}
      wheel-artifact-name: ${{ needs.build-artifact.outputs.wheel-artifact-name }}
      enable-llk-asserts: ${{ inputs.enable-llk-asserts || false }}
      ref: ${{ inputs.ref || github.sha }}

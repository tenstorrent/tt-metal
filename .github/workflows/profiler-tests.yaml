name: "Profiler Tests"

on:
  schedule:
    - cron: "0 2 * * *" # Run daily at 2am UTC
  workflow_dispatch:
    inputs:
      skus:
        description: "Which SKUs to profile. A scheduled run always covers every SKU."
        required: false
        type: choice
        default: all
        options:
          - all
          - all single-card
          - wh_n150_civ2
          - wh_n300_civ2
          - bh_p100a_civ2_viommu
          - bh_p150b_civ2_viommu
          - wh_llmbox
          - wh_galaxy
      skus-override:
        description: "Comma-separated SKU list (e.g. wh_n300_civ2,wh_llmbox). Leave skus set to all when using this input."
        required: false
        type: string
        default: ""
      post-commit-only:
        description: "Single-card only: run the post-commit subset instead of the full suite"
        required: false
        type: boolean
        default: false
      platform:
        required: false
        type: choice
        default: "Ubuntu 22.04"
        options:
          - "Ubuntu 22.04"
          - "Ubuntu 24.04"
        description: "Platform to build and test"
      build-type:
        required: false
        type: choice
        default: Release
        options:
          - Release
          - Debug
          - RelWithDebInfo
          - ASan
          - TSan
        description: "Build type configuration"
      enable-lto:
        required: false
        type: boolean
        default: false
        description: "Enable Link Time Optimization (LTO)"

run-name: >-
  Profiler Tests
  SKUs[${{ github.event_name == 'schedule' && 'All'
  || (inputs.skus-override != '' && inputs.skus-override)
  || (inputs.skus == 'all' && 'All')
  || inputs.skus }}]

jobs:
  # Resolves the SKU filter into one list, and into a flag per impl so an impl
  # whose SKUs nobody asked for is never started. The SKU sets below must match
  # the skus maps in the three tests YAMLs under tests/pipeline_reorg/.
  # Resolves the SKU filter, and sets a flag per impl so an impl whose SKUs nobody
  # asked for never starts. The valid SKUs come from the 3 tests YAMLs themselves,
  # thus a SKU added to a YAML needs no change here.
  select-skus:
    runs-on: ubuntu-slim
    outputs:
      enabled-skus: ${{ steps.logic.outputs.enabled-skus }}
      run-t3k: ${{ steps.logic.outputs.run-t3k }}
      run-galaxy: ${{ steps.logic.outputs.run-galaxy }}
      run-single-card: ${{ steps.logic.outputs.run-single-card }}
    steps:
      - name: Checkout the tests YAMLs
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        timeout-minutes: 20
        with:
          sparse-checkout: tests/pipeline_reorg
          sparse-checkout-cone-mode: true
      - name: Install dependencies
        run: pip3 install PyYAML
      - name: Resolve the SKU filter
        id: logic
        env:
          EVENT_NAME: ${{ github.event_name }}
          CHOICE: ${{ inputs.skus }}
          OVERRIDE: ${{ inputs.skus-override }}
        run: |
          set -e
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import os, sys, yaml

          # The impl that reads each tests YAML, and the output flag that gates it.
          FAMILIES = {
              "t3k": "tests/pipeline_reorg/t3k_profiler_tests.yaml",
              "galaxy": "tests/pipeline_reorg/galaxy_profiler_tests.yaml",
              "single-card": "tests/pipeline_reorg/single_card_profiler_tests.yaml",
          }

          def fail(msg):
              print(f"::error::{msg}", file=sys.stderr)
              sys.exit(1)

          coverage = {}
          for family, path in FAMILIES.items():
              tests = yaml.safe_load(open(path)) or []
              coverage[family] = {sku for test in tests for sku in (test.get("skus") or {})}
              if not coverage[family]:
                  fail(f"{path} declares no SKU, thus the {family} profiler tests can never run.")
          known = set().union(*coverage.values())

          event = os.environ["EVENT_NAME"]
          choice = (os.environ.get("CHOICE") or "").strip()
          override = (os.environ.get("OVERRIDE") or "").strip()

          # Both inputs set is ambiguous: refuse it rather than pick a winner.
          if override and choice and choice != "all":
              fail(f"skus is {choice!r} and skus-override is {override!r}. Set one of them, not both.")

          if event == "schedule":
              selection = "all"
          else:
              selection = override or choice or "all"

          if selection == "all":
              requested = set(known)
          elif selection == "all single-card":
              requested = set(coverage["single-card"])
          else:
              requested = {s.strip() for s in selection.split(",") if s.strip()}

          unknown = sorted(requested - known)
          if unknown:
              fail(f"Unknown SKU: {', '.join(unknown)}. "
                   f"The profiler tests YAMLs cover: {', '.join(sorted(known))}.")
          if not requested:
              fail("No SKU selected. Pick a SKU in the skus input, or list them in skus-override.")

          # ALL_SKUS_IN_TESTS lets each impl resolve its own YAML, so a full run needs
          # no list from here and cannot drift from the YAMLs.
          enabled = "ALL_SKUS_IN_TESTS" if requested == known else ",".join(sorted(requested))

          print(f"Requested SKUs: {', '.join(sorted(requested))}", file=sys.stderr)
          print(f"enabled-skus={enabled}")
          for family, skus in coverage.items():
              flag = "true" if requested & skus else "false"
              print(f"run-{family}={flag}")
              print(f"  run-{family}={flag}", file=sys.stderr)
          PY

  # Gated on select-skus so a rejected filter starts nothing else at all.
  check-harbor:
    needs: select-skus
    uses: ./.github/workflows/check-harbor.yaml

  build-artifact:
    needs: [check-harbor, select-skus]
    if: ${{ !cancelled() && needs.select-skus.result == 'success' }}
    uses: ./.github/workflows/build-artifact.yaml
    permissions:
      contents: read
      packages: write
    secrets: inherit
    with:
      harbor-prefix: ${{ needs.check-harbor.outputs.harbor-prefix }}
      tracy: true
      build-inplace-wheel: true
      platform: ${{ inputs.platform || 'Ubuntu 22.04' }}
      build-type: ${{ inputs.build-type || 'Release' }}
      enable-lto: ${{ inputs.enable-lto || false }}

  t3000-profiler-tests:
    needs: [select-skus, build-artifact]
    if: ${{ !cancelled() && needs.select-skus.outputs.run-t3k == 'true' && needs.build-artifact.result == 'success' }}
    secrets: inherit
    uses: ./.github/workflows/t3000-profiler-tests-impl.yaml
    with:
      docker-image: ${{ needs.build-artifact.outputs.dev-docker-image }}
      build-artifact-name: ${{ needs.build-artifact.outputs.build-artifact-name }}
      wheel-artifact-name: ${{ needs.build-artifact.outputs.wheel-artifact-name }}
      enabled-skus: ${{ needs.select-skus.outputs.enabled-skus }}

  galaxy-profiler-tests:
    needs: [select-skus, build-artifact]
    if: ${{ !cancelled() && needs.select-skus.outputs.run-galaxy == 'true' && needs.build-artifact.result == 'success' }}
    secrets: inherit
    uses: ./.github/workflows/galaxy-profiler-tests-impl.yaml
    with:
      docker-image: ${{ needs.build-artifact.outputs.dev-docker-image }}
      build-artifact-name: ${{ needs.build-artifact.outputs.build-artifact-name }}
      wheel-artifact-name: ${{ needs.build-artifact.outputs.wheel-artifact-name }}
      enabled-skus: ${{ needs.select-skus.outputs.enabled-skus }}

  single-card-profiler-tests:
    needs: [select-skus, build-artifact]
    if: ${{ !cancelled() && needs.select-skus.outputs.run-single-card == 'true' && needs.build-artifact.result == 'success' }}
    secrets: inherit
    uses: ./.github/workflows/single-card-profiler-tests-impl.yaml
    with:
      docker-image: ${{ needs.build-artifact.outputs.dev-docker-image }}
      build-artifact-name: ${{ needs.build-artifact.outputs.build-artifact-name }}
      wheel-artifact-name: ${{ needs.build-artifact.outputs.wheel-artifact-name }}
      enabled-skus: ${{ needs.select-skus.outputs.enabled-skus }}
      test-selection: ${{ inputs.post-commit-only && 'post-commit' || 'all' }}

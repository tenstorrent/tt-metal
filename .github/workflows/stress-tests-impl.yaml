name: "[internal] Stress tests impl"

on:
  workflow_call:
    inputs:
      docker-image:
        required: true
        type: string
      wheel-artifact-name:
        required: true
        type: string
      build-artifact-name:
        required: true
        type: string
      enabled-skus:
        required: true
        type: string
      test-selection:
        required: false
        type: string
        default: "all"
      extra-tag:
        required: false
        type: string
        default: "in-service"
      topology:
        required: false
        type: string
        default: "topology-6u"

jobs:
  load-test-matrix:
    runs-on: ubuntu-slim
    outputs:
      matrix: ${{ steps.apply-runner-labels.outputs.matrix }}
    env:
      TESTS_YAML_PATH: ./tests/pipeline_reorg/stress_tests.yaml
    steps:
      - name: Checkout the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        timeout-minutes: 20
        with:
          sparse-checkout: |
            .github
            tests/pipeline_reorg
          sparse-checkout-cone-mode: true
      - name: Install dependencies
        run: |
          pip3 install PyYAML
      - name: Build unified test matrix based on enabled SKUs
        id: build-matrix
        uses: tenstorrent/tt-metal/.github/actions/prepare-test-matrix@main
        with:
          tests-yaml: ${{ env.TESTS_YAML_PATH }}
          enabled-skus: "${{ inputs.enabled-skus }}"
          sku-config: ./.github/sku_config.yaml
      - name: Apply test selection
        id: apply-test-selection
        env:
          MATRIX: ${{ steps.build-matrix.outputs.matrix }}
          TEST_SELECTION: ${{ inputs.test-selection }}
        run: |
          if [ "$TEST_SELECTION" = "all" ]; then
            echo "matrix<<EOF" >> $GITHUB_OUTPUT
            echo "$MATRIX" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            FILTERED=$(jq -c --arg id "$TEST_SELECTION" '[.[] | select(.id == $id)]' <<<"$MATRIX")
            if [ "$FILTERED" = "[]" ]; then
              echo "::error::No tests found for test-selection '$TEST_SELECTION'. Ensure id matches tests/pipeline_reorg/stress_tests.yaml and enabled-skus includes the needed SKU."
              exit 1
            fi
            echo "matrix<<EOF" >> $GITHUB_OUTPUT
            echo "$FILTERED" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi
      - name: Apply runner labels (topology / extra-tag)
        id: apply-runner-labels
        env:
          MATRIX: ${{ steps.apply-test-selection.outputs.matrix }}
          EXTRA_TAG: ${{ inputs.extra-tag }}
          TOPOLOGY: ${{ inputs.topology }}
        run: |
          UPDATED=$(jq -c \
            --arg tag "$EXTRA_TAG" \
            --arg topology "$TOPOLOGY" \
            'map(.runs_on |= map(
              if . == "in-service" then $tag
              elif startswith("topology-") then $topology
              else . end
            ))' <<<"$MATRIX")
          echo "matrix<<EOF" >> $GITHUB_OUTPUT
          echo "$UPDATED" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

  stress-tests:
    needs: load-test-matrix
    if: ${{ needs.load-test-matrix.outputs.matrix != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        test-group: ${{ fromJson(needs.load-test-matrix.outputs.matrix) }}
    name: ${{ matrix.test-group.name }}
    runs-on: ${{ matrix.test-group.runs_on }}
    container:
      image: ${{ inputs.docker-image || 'docker-image-unresolved!' }}
      env:
        TT_METAL_HOME: /work
        PYTHONPATH: /work
        LD_LIBRARY_PATH: /work/build/lib
        LOGURU_LEVEL: INFO
        # bh_* SKUs run on Blackhole, anything else on Wormhole, as the ops impl derives it.
        ARCH_NAME: ${{ startsWith(matrix.test-group.sku, 'bh_') && 'blackhole' || 'wormhole_b0' }}
        # As the ops impl sets it: no cache on bh_p150b_civ2.
        HF_HUB_CACHE: ${{ matrix.test-group.sku == 'bh_p150b_civ2' && '' || '/mnt/MLPerf/huggingface/hub' }}
      volumes:
        - ${{ github.workspace }}/docker-job:/work
        - /dev/hugepages-1G:/dev/hugepages-1G
        - /mnt/MLPerf:/mnt/MLPerf:ro
      options: "--device /dev/tenstorrent"
    defaults:
      run:
        shell: bash
        working-directory: /work
    steps:
      - name: 🧬 Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        timeout-minutes: 20
        with:
          submodules: recursive
          path: docker-job
      - name: Mark repository as safe directory
        run: |
          git config --global --add safe.directory $GITHUB_WORKSPACE
      - name: ⬇️  Setup Job
        uses: ./docker-job/.github/actions/setup-job
        timeout-minutes: 10
        with:
          build-artifact-name: ${{ inputs.build-artifact-name }}
          wheel-artifact-name: ${{ inputs.wheel-artifact-name }}
      - name: ${{ matrix.test-group.name }}
        timeout-minutes: ${{ matrix.test-group.timeout }}
        run: |
          ${{ matrix.test-group.cmd }}
      - uses: tenstorrent/tt-metal/.github/actions/upload-artifact-with-job-uuid@main
        timeout-minutes: 10
        if: ${{ !cancelled() }}
        with:
          prefix: "test_reports_"
      - uses: tenstorrent/tt-metal/.github/actions/cleanup@main
        if: always()

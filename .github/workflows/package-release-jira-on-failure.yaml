# Files a Jira record when the Package and release workflow fails.
#
# Watches the "Package and release" workflow; on a failed run it collects the
# failed jobs and opens (or de-duplicates onto) a Jira issue via
# jira_client.py.
#
# TODO (specifics to be provided):
#   - JIRA_ISSUE_TYPE        : issue type (default below: Bug)
#   - WATCH_JOBS             : comma-separated job-name substrings that count as
#                             "the tests and pipelines" (empty = any failed job)
#
# Credentials (repo/org Actions secrets, scoped to this RELEASE-project automation
# so other Jira projects can carry their own):
#   - secrets JIRA_RELEASE_USER_EMAIL / JIRA_RELEASE_API_TOKEN : Jira account creds
# The Jira project key ("RELEASE") is not secret and is inlined below.
name: "[internal] File Jira issue on package-and-release failure"

on:
  workflow_run:
    workflows:
      - "Package and release"
    types:
      - completed
  workflow_dispatch:
    inputs:
      run-id:
        description: "Package and release workflow run id to file a Jira issue for (manual testing)"
        required: true
        type: string

permissions:
  contents: read
  actions: read

env:
  # Empty = file for any failed job. Narrow to the specific tests/pipelines later.
  WATCH_JOBS: ""
  JIRA_ISSUE_TYPE: "Bug"

jobs:
  file-jira:
    # Failed run, or a manual dispatch for testing. The release-ref check lives
    # in the collect step below, which resolves the branch from the run itself
    # so both paths are covered.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        timeout-minutes: 20

      - name: Collect failed jobs from the package-and-release run
        id: collect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id || inputs.run-id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          # Only real releases reach the RELEASE board. Package and release also
          # runs on main (cron dev release) and on feature branches via dispatch;
          # those failures are CI noise. Release refs are `stable` and the
          # version tags, matching release-build-test-publish.yaml.
          #
          # Resolved from the run itself rather than the trigger, because
          # `on.workflow_run.branches` cannot express tags and does not apply to
          # workflow_dispatch at all. One check, both entry points.
          BRANCH=$(gh api "repos/$REPO/actions/runs/$RUN_ID" --jq .head_branch)
          case "$BRANCH" in
            stable|v[0-9]*) ;;
            *)
              echo "::notice::run $RUN_ID is on '$BRANCH', not a release ref; nothing to file."
              echo "file=false" >> "$GITHUB_OUTPUT"
              exit 0 ;;
          esac

          # Failed jobs as "name<TAB>url", so the ticket can link each one to
          # its log. Capture first: a gh failure inside <(...) would leave the
          # list empty and be read as "nothing to file".
          if ! rows=$(gh api "repos/$REPO/actions/runs/$RUN_ID/jobs" --paginate \
            --jq '.jobs[] | select(.conclusion=="failure" or .conclusion=="timed_out")
                  | [.name, .html_url] | @tsv'); then
            echo "::error::could not list jobs for run $RUN_ID"
            exit 1
          fi
          mapfile -t rows < <(printf '%s' "$rows")
          if [ -n "${WATCH_JOBS}" ]; then
            filtered=()
            IFS=',' read -ra pats <<< "$WATCH_JOBS"
            for r in "${rows[@]}"; do
              for p in "${pats[@]}"; do
                [[ "${r%%$'\t'*}" == *"$(echo "$p" | xargs)"* ]] && filtered+=("$r") && break
              done
            done
            rows=("${filtered[@]}")
          fi
          failed=(); urls=()
          for r in "${rows[@]}"; do failed+=("${r%%$'\t'*}"); urls+=("${r#*$'\t'}"); done
          if [ "${#failed[@]}" -eq 0 ]; then
            echo "No watched jobs failed; nothing to file."
            echo "file=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "file=true" >> "$GITHUB_OUTPUT"


          # Name what failed, not just that something did. A GitHub job name is a path:
          #   build-test-publish (Ubuntu 22.04) / release-demo-tests / ... / Gemma-4-31B e2e tests [bh_quietbox_2]
          # The leaf identifies the thing that broke; the second segment identifies the
          # family it belongs to. Both beat "4 job(s)" in a ticket title.
          leaves=(); groups=()
          for j in "${failed[@]}"; do
            leaf="${j##*/ }"                   # after the last " / "
            leaf="${leaf%% \[*}"               # drop the trailing [runner] tag
            leaves+=("$leaf")
            if [[ "$j" == *" / "* ]]; then
              g="${j#* / }"; g="${g%% / *}"    # the second path segment
              groups+=("$g")
            else
              groups+=("")                     # unnested job: no family to name
            fi
          done

          mapfile -t uniq < <(printf '%s\n' "${leaves[@]}" | awk '!seen[$0]++')
          mapfile -t ugroups < <(printf '%s\n' "${groups[@]}" | awk '!seen[$0]++')

          if [ "${#ugroups[@]}" -eq 1 ] && [ -n "${ugroups[0]}" ]; then
            # All from one family: name it, and let the leaves say which ones.
            what="${ugroups[0]#release-}"; what="${what//-/ }"
            [ "${#failed[@]}" -eq 1 ] && what="${what%s}"   # "1 demo test", not "tests"
            details=("${uniq[@]}")
          elif [ "${#ugroups[@]}" -eq 1 ]; then
            # Nothing is nested, so there is no family to name -- the leaves are all
            # the detail there is.
            what="jobs"; [ "${#failed[@]}" -eq 1 ] && what="job"
            details=("${uniq[@]}")
          else
            # Spread across families: the families are the useful detail, not one
            # arbitrary leaf. Count each so the shape of the failure is visible.
            what="jobs"; [ "${#failed[@]}" -eq 1 ] && what="job"
            mapfile -t details < <(printf '%s\n' "${groups[@]}" | awk '
              {c[$0]++; if (!($0 in first)) { first[$0]=++n; ord[n]=$0 } }
              END { for (i = 1; i <= n; i++) { g = ord[i]
                      label = (g == "" ? "other" : g)
                      sub(/^release-/, "", label); gsub(/-/, " ", label)
                      print label " (" c[g] ")" } }')
          fi

          # Fit as many details as a fixed budget allows, then count the rest. Keeps the
          # title bounded whatever the job names are -- some carry a parenthesised
          # cluster description and run past 70 characters on their own.
          names=""; shown=0
          for n in "${details[@]}"; do
            cand="${names:+$names, }$n"
            [ "${#cand}" -gt 90 ] && break
            names="$cand"; shown=$((shown + 1))
          done
          [ "$shown" -eq 0 ] && { names="${details[0]:0:87}..."; shown=1; }
          rest=$(( ${#details[@]} - shown ))
          [ "$rest" -gt 0 ] && names="$names (+$rest more)"

          summary="${#failed[@]} ${what} failed during release ${BRANCH}: ${names}"
          # Jira caps summaries at 255.
          [ "${#summary}" -gt 255 ] && summary="${summary:0:252}..."

          {
            echo "summary=$summary"
            echo "description<<EOF"
            echo "The Package and release workflow failed."
            echo "Branch: $BRANCH"
            if [ -n "${HEAD_SHA:-}" ]; then
              echo "Commit: [${HEAD_SHA:0:12}](https://github.com/$REPO/commit/$HEAD_SHA)"
            else
              echo "Commit: unknown"
            fi
            echo "Run: [$RUN_ID](${RUN_URL:-https://github.com/$REPO/actions/runs/$RUN_ID})"
            echo "Failed jobs:"
            # The leaf name, not the whole "a / b / c / leaf" path -- the prefix
            # is the same for every row and the link carries the full context.
            for i in "${!failed[@]}"; do echo "- [${failed[$i]##*/ }](${urls[$i]})"; done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: File Jira issue
        if: ${{ steps.collect.outputs.file == 'true' }}
        env:
          JIRA_BASE_URL: "https://tenstorrent.atlassian.net"
          JIRA_USER_EMAIL: ${{ secrets.JIRA_RELEASE_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_RELEASE_API_TOKEN }}
          JIRA_PROJECT_KEY: "RELEASE"
          JIRA_ISSUE_TYPE: ${{ env.JIRA_ISSUE_TYPE }}
          JIRA_SUMMARY: ${{ steps.collect.outputs.summary }}
          JIRA_DESCRIPTION: ${{ steps.collect.outputs.description }}
          JIRA_LABELS: "ci-failure,package-and-release"
          # Everything lands on one owner for triage, who reassigns. Override
          # with the repo variable rather than editing this file.
          JIRA_ASSIGNEE_ACCOUNT_ID: ${{ vars.RELEASE_JIRA_ASSIGNEE || '63c5a7806178fcc941d86a9d' }}
          # While one issue is open for this pipeline, later failures comment on it.
          # Scope per commit: re-runs of the same release de-dupe onto one
          # ticket, a later release failure opens a new one.
          JIRA_DEDUP_LABEL: "package-release-failure:${{ github.event.workflow_run.head_sha || inputs.run-id }}"
        run: |
          if [ -z "${JIRA_USER_EMAIL}" ] || [ -z "${JIRA_API_TOKEN}" ]; then
            echo "::notice::JIRA_RELEASE_* secrets not configured; skipping Jira filing."
            exit 0
          fi
          python3 .github/actions/scripts/jira_client.py

name: "[internal] ttnn run sweeps impl"

on:
  workflow_call:
    inputs:
      matrix:
        description: "JSON matrix of sweep batches for this hw group"
        required: true
        type: string
      sweep-name:
        description: "Resolved sweep name"
        required: true
        type: string
      dev-docker-image:
        description: "Dev Docker image"
        required: true
        type: string
      build-artifact-name:
        description: "Build artifact name"
        required: true
        type: string
      wheel-artifact-name:
        description: "Wheel artifact name"
        required: true
        type: string
      skip-on-timeout:
        type: string
        default: "true"
      measure-device-perf:
        type: string
        default: "true"
      measure-e2e-perf:
        type: string
        default: "false"
      measure-memory:
        type: string
        default: "false"
      fail-on-test-failure:
        type: string
        default: "false"
      mesh-shape:
        type: string
        default: ""

permissions:
  contents: read

jobs:
  ttnn-run-sweeps-parallel:
    name: ${{ matrix.batch_display }}
    strategy:
      # Do not fail-fast because we need to ensure all tests go to completion
      # so we try not to get hanging machines
      fail-fast: false
      max-parallel: 20
      matrix:
        include: ${{ fromJSON(inputs.matrix).include }}
    container:
      image: ${{ inputs.dev-docker-image }}
      env:
        TT_METAL_HOME: /work
        PYTHONPATH: /work
        LD_LIBRARY_PATH: /work/build/lib
        ARCH_NAME: ${{ matrix.arch }}
        RUNNER_LABEL: ${{ matrix.runner_label }}
        LOGURU_LEVEL: INFO
        GITHUB_ACTIONS: true
        TT_SMI_RESET_COMMAND: ${{ matrix.tt_smi_cmd }}
        TEST_GROUP_NAME: ${{ matrix.test_group_name }}
        TRACY_NO_INVARIANT_CHECK: 1
        LEAD_MODELS_RUN: ${{ startsWith(matrix.test_group_name, 'lead-models') && '1' || '0' }}
      volumes:
        - ${{ github.workspace }}/docker-job:/work # Subdir to workaround https://github.com/actions/runner/issues/691
        - /dev/hugepages-1G:/dev/hugepages-1G
        - /mnt/MLPerf:/mnt/MLPerf:ro
      options: "--device /dev/tenstorrent"
    defaults:
      run:
        shell: bash
        working-directory: /work # https://github.com/actions/runner/issues/878
    # Single-source-of-truth per-job timeout: compute_sweep_matrix.py stamps
    # matrix.timeout onto every entry from tests/pipeline_reorg/ttnn_sweep_tests.yaml
    # (checked against .github/time_budget.yaml by verify_time_budget.py). Run types
    # not budget-tracked in the yaml (nightly/comprehensive) are stamped with the
    # 60-min default in matrix_runner_config.get_timeout_for, so the value is always
    # present and consumed here directly.
    timeout-minutes: ${{ matrix.timeout }}
    runs-on: ${{ matrix.runs_on }}
    steps:
      - name: 🧬 Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        timeout-minutes: 20
        with:
          submodules: recursive
          path: docker-job
      - name: ⬇️  Setup Job
        uses: ./docker-job/.github/actions/setup-job
        timeout-minutes: 10
        with:
          build-artifact-name: ${{ inputs.build-artifact-name }}
          wheel-artifact-name: ${{ inputs.wheel-artifact-name }}
          # Sweep CI default of 5s is too aggressive for traced multi-device
          # configs on Galaxy: linear/multiply/matmul with sharded I/O can
          # exceed 5s during reshard + dispatch bring-up, producing false-
          # positive op-timeouts. Raise to 30s for the whole sweep job so
          # every op benefits without per-module env-var overrides.
          hang-detection-timeout: 30
      - name: 📋 Display parallel sweep configuration
        run: |
          echo "::group::🔧 Parallel Sweeps Execution - Configuration"
          echo "┌─────────────────────────────────────────────────────────────┐"
          echo "│              Parallel Sweeps Configuration                  │"
          echo "├─────────────────────────────────────────────────────────────┤"
          echo "│ Run Mode:             Parallel Execution (${{ matrix.test_group_name }})"
          echo "│ Batch:                ${{ matrix.batch_display }}"
          echo "│ Module Selector:      ${{ matrix.module_selector }}"
          echo "│ Device-key Batch:     ${{ matrix.vectors_dir || 'none (un-partitioned export)' }}"
          echo "│ Mesh Shape:           ${{ matrix.mesh_shape || 'auto-detect' }}"
          echo "│ Dispatch Axis:        ${{ matrix.dispatch_axis || 'default' }}"
          echo "│ Fabric:               ${{ matrix.fabric || 'n/a' }}"
          echo "│ Suite Override:       ${{ matrix.suite_name || 'none' }}"
          echo "│ Architecture:         ${{ matrix.arch }}"
          echo "│ Runner:               ${{ toJSON(matrix.runs_on) }}"
          echo "│ Skip on Timeout:      ${{ inputs.skip-on-timeout }}"
          echo "│ Measure Device Perf:  ${{ inputs.measure-device-perf }}"
          echo "│ Measure E2E Perf:     ${{ inputs.measure-e2e-perf }}"
          echo "│ Measure Memory:       ${{ inputs.measure-memory }}"
          echo "│ Use Database:         ${{ inputs['sweep-name'] == 'ALL SWEEPS (Model Traced)' || inputs['sweep-name'] == 'ALL SWEEPS (Lead Models)' }}"
          echo "│ Mesh Shape Filter:    ${{ inputs.mesh-shape || 'none' }}"
          echo "└─────────────────────────────────────────────────────────────┘"
          echo "::endgroup::"
      - name: Download sweep vectors
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sweeps-vectors
          path: /work/tests/sweep_framework/vectors_export
      - name: Clear stale kernel cache
        # A stale/corrupt persisted kernel ELF (e.g. cq_prefetch) left in
        # ~/.cache/tt-metal-cache from a prior build makes tt_elffile.cpp throw on
        # load (observed: T3K all_gather FABRIC_2D configs 0256fe6b/0694284f fail
        # "TT_THROW @ tt_elffile.cpp:405" / hang every retry, yet pass 207/207 on a
        # runner with a fresh cache). Clear it so kernels JIT-rebuild cleanly.
        run: |
          rm -rf "${HOME}/.cache/tt-metal-cache" /github/home/.cache/tt-metal-cache 2>/dev/null || true
          echo "Cleared tt-metal kernel cache"
      - name: Split sweep vectors into device-key batches
        run: |
          # Materialise the batch directories this job's matrix entry refers to. The matrix
          # planned the same partition from the same vectors (both call plan_batches), so the
          # directory named by matrix.vectors_dir is produced here.
          #
          # split_vectors_by_axis.py still runs because the plain axis partitions remain
          # referenced elsewhere; the device-key batches are what the run consumes.
          cd /work
          python3 tests/sweep_framework/split_vectors_by_axis.py
          python3 tests/sweep_framework/split_vectors_by_device_key.py
          echo "::group::Device-key batches"
          ls tests/sweep_framework/vectors_export_by_device/ 2>/dev/null || true
          echo "::endgroup::"
      - name: Run ttnn sweeps (batch)
        run: |
          MODULE_SELECTOR="${{ matrix.module_selector }}"
          SUITE_NAME="${{ matrix.suite_name }}"
          MESH_DIMS="${{ matrix.mesh_dims }}"

          # Set skip-on-timeout flag
          SKIP_ON_TIMEOUT_FLAG=""
          if [[ "${{ inputs.skip-on-timeout }}" == "true" ]]; then
            SKIP_ON_TIMEOUT_FLAG="--skip-on-timeout"
          fi

          # Enable device performance when requested
          DEVICE_PERF_FLAG=""
          if [[ "${{ inputs.measure-device-perf }}" == "true" ]]; then
            DEVICE_PERF_FLAG="--device-perf"
          fi

          # Enable e2e performance when requested
          E2E_PERF_FLAG=""
          if [[ "${{ inputs.measure-e2e-perf }}" == "true" ]]; then
            E2E_PERF_FLAG="--perf-with-cache"
          fi

          # Enable memory measurement when requested
          MEMORY_FLAG=""
          if [[ "${{ inputs.measure-memory }}" == "true" ]]; then
            MEMORY_FLAG="--measure-memory"
          fi

          CMD=(
            python3 tests/sweep_framework/sweeps_runner.py
            --module-name "$MODULE_SELECTOR"
            --vector-source vectors_export
            --result-dest results_export
            --tag ci-main
            --summary
          )

          if [[ -n "$SKIP_ON_TIMEOUT_FLAG" ]]; then
            CMD+=("$SKIP_ON_TIMEOUT_FLAG")
          fi

          if [[ -n "$DEVICE_PERF_FLAG" ]]; then
            CMD+=("$DEVICE_PERF_FLAG")
          fi

          if [[ -n "$E2E_PERF_FLAG" ]]; then
            CMD+=("$E2E_PERF_FLAG")
          fi

          if [[ -n "$MEMORY_FLAG" ]]; then
            CMD+=("$MEMORY_FLAG")
          fi

          if [[ -n "$SUITE_NAME" ]]; then
            CMD+=(--suite-name "$SUITE_NAME")
          fi

          # Fabric-family split: restrict this job to 1D- or 2D-mesh vectors so a
          # single process never does a live FABRIC_1D->FABRIC_2D transition.
          if [[ -n "$MESH_DIMS" ]]; then
            CMD+=(--mesh-dims "$MESH_DIMS")
          fi
          if [[ "${{ inputs.fail-on-test-failure }}" == "true" ]]; then
            CMD+=("--fail-on-test-failure")
          fi

          # ONE device-key batch per job. The matrix (compute_sweep_matrix.py) and the
          # splitter (split_vectors_by_device_key.py) share the same planner, so the batch
          # named by the matrix is the directory the split step just wrote. That batch holds
          # vectors for exactly ONE (mesh shape, dispatch axis, fabric), so the job opens one
          # device and never switches -- no mid-job reopen, and therefore no Galaxy
          # dispatch-wedge risk from one.
          #
          # MESH_DEVICE_SHAPE and TTNN_DISPATCH_AXIS are DECLARED from the matrix rather than
          # auto-detected. Previously the shape came from hardware auto-detect and every
          # vector in the job inherited it, so vectors traced at a different shape silently
          # fell back to ReplicateTensorToMesh instead of their traced placement.
          BATCH_DIR="${{ matrix.vectors_dir }}"
          BATCH_MESH="${{ matrix.mesh_shape }}"
          BATCH_AXIS="${{ matrix.dispatch_axis }}"

          if [[ -z "$BATCH_DIR" || ! -d "$BATCH_DIR" ]]; then
            # Module-batched matrix (SWEEP_DEVICE_KEY_BATCHING=0) or a nightly/comprehensive
            # run: no device-key batch was planned, so run the export as a whole.
            echo "[device-key] no batch directory for this entry — using the un-partitioned export"
            TTNN_VECTORS_EXPORT_DIR="tests/sweep_framework/vectors_export" "${CMD[@]}"
            exit $?
          fi

          echo "[device-key] === ${{ matrix.batch_display }} (mesh=${BATCH_MESH:-auto} axis=$BATCH_AXIS) ==="
          # A mesh-less batch (no traced shape recorded) leaves MESH_DEVICE_SHAPE unset so the
          # runner falls back to auto-detect, rather than exporting an empty value.
          if [[ -n "$BATCH_MESH" ]]; then
            export MESH_DEVICE_SHAPE="$BATCH_MESH"
          fi
          TTNN_DISPATCH_AXIS="$BATCH_AXIS" \
            TTNN_VECTORS_EXPORT_DIR="$BATCH_DIR" \
            "${CMD[@]}"
      - name: Compute artifact suffix
        # Must run even when the sweep step fails so the upload step gets a unique
        # BATCH_SUFFIX; without it the artifact name is incomplete and results may collide.
        if: ${{ always() }}
        shell: bash
        run: |
          DISPLAY_LABEL="${{ matrix.batch_display }}"
          SUITE_LABEL="${{ matrix.suite_name }}"
          GROUP_LABEL="${{ matrix.test_group_name }}"
          FINGERPRINT="$GROUP_LABEL|$DISPLAY_LABEL"
          if [[ -n "$SUITE_LABEL" ]]; then
            FINGERPRINT="$FINGERPRINT|$SUITE_LABEL"
          fi
          echo "BATCH_SUFFIX=$(echo -n "$FINGERPRINT" | sha256sum | cut -d' ' -f1 | cut -c1-12)" >> $GITHUB_ENV
      - name: Upload sweep results
        if: ${{ always() }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: sweeps-results-${{ matrix.test_group_name }}-batch-${{ env.BATCH_SUFFIX }}
          path: /work/tests/sweep_framework/results_export/
          retention-days: 1

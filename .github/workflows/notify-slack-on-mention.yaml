name: Notify Slack on Comment or Mention

# Launchpad for mentions in PR descriptions and PR review comments. It runs with
# no secrets and no write access (fork PRs included), so it only collects the
# mentions and hands them to notify-slack-on-mention-impl.yaml through an
# artifact. The impl treats that artifact as untrusted and re-reads the text
# itself. Issues and issue/PR conversation comments go straight to the impl.

on:
  pull_request:
    types: [opened, edited]
  pull_request_review_comment:
    types: [created]

permissions: {}

jobs:
  collect-mentions:
    if: contains(github.event.comment.body || github.event.pull_request.body, '@')
    runs-on: ubuntu-slim
    steps:
      - name: Collect mentions
        id: collect
        run: |
          # Org members can reach each other on Slack directly; a public member
          # writing their own text is skipped here, everyone else is left to the
          # impl, which can see private members.
          SENDER=$(jq -r '.sender.login // ""' "$GITHUB_EVENT_PATH")
          SENDER_TYPE=$(jq -r '.sender.type // ""' "$GITHUB_EVENT_PATH")
          AUTHOR=$(jq -r '(.comment.user.login // .pull_request.user.login // "")' "$GITHUB_EVENT_PATH")
          ASSOCIATION=$(jq -r '(.comment.author_association // .pull_request.author_association // "")' "$GITHUB_EVENT_PATH")
          if [ "$SENDER_TYPE" != "Bot" ] && [ "$SENDER" = "$AUTHOR" ] && { [ "$ASSOCIATION" = "MEMBER" ] || [ "$ASSOCIATION" = "OWNER" ]; }; then
            echo "Skipping: $SENDER is an org $ASSOCIATION"
            exit 0
          fi

          MENTION_RE='(?<![A-Za-z0-9_])@[A-Za-z0-9](?:[A-Za-z0-9]|-(?=[A-Za-z0-9]))*'
          # GitHub does not notify mentions inside code, so fenced blocks and inline code are dropped first.
          # A fence that is never closed runs to the end of the body, as Markdown renders it.
          extract_mentions() {
            perl -0pe 's/^[ \t]*(`{3,}|~{3,}).*?^[ \t]*\1[^\n]*$//gms; s/^[ \t]*(`{3,}|~{3,}).*\z//ms; s/(`+).+?\1//gs' |
              { grep -oP "$MENTION_RE" || true; } | sed 's/^@//' | sort -u
          }

          BODY=$(jq -r '(.comment.body // .pull_request.body // "")' "$GITHUB_EVENT_PATH")
          MENTIONED=$(echo "$BODY" | extract_mentions)

          # An edited PR only pings the mentions the edit added to its description. An edit that leaves the
          # description alone (title, base branch) carries no changes.body and pings nobody.
          ACTION=$(jq -r '.action // ""' "$GITHUB_EVENT_PATH")
          if [ "$ACTION" = "edited" ]; then
            if jq -e '.changes.body' "$GITHUB_EVENT_PATH" > /dev/null; then
              PREVIOUS=$(jq -r '.changes.body.from // ""' "$GITHUB_EVENT_PATH" | extract_mentions)
              MENTIONED=$(comm -23 <(echo "$MENTIONED") <(echo "$PREVIOUS"))
            else
              MENTIONED=""
            fi
          fi

          MENTIONED=$(echo "$MENTIONED" | sed '/^$/d')
          if [ -z "$MENTIONED" ]; then
            echo "No new mentions"
            exit 0
          fi

          mkdir -p "$RUNNER_TEMP/request"
          jq -n \
            --arg kind "$([ "$GITHUB_EVENT_NAME" = "pull_request_review_comment" ] && echo review_comment || echo pull_request)" \
            --arg pr "$(jq -r '.pull_request.number' "$GITHUB_EVENT_PATH")" \
            --arg comment "$(jq -r '.comment.id // ""' "$GITHUB_EVENT_PATH")" \
            --arg mentions "$MENTIONED" \
            '{kind: $kind, pr_number: $pr, comment_id: $comment, mentions: ($mentions | split("\n"))}' \
            > "$RUNNER_TEMP/request/request.json"
          echo "requested=true" >> "$GITHUB_OUTPUT"
          echo "Mentions to relay: $(echo "$MENTIONED" | paste -sd ',')"

      - name: Hand over to the impl
        if: steps.collect.outputs.requested == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: notify-slack-request
          path: ${{ runner.temp }}/request/request.json
          retention-days: 1
          if-no-files-found: error

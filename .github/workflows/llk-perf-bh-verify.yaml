name: "LLK perf BH verify matrix"
# Transient workflow on fu/verify/bh-matrix branch ONLY.
# Produces the 8-leg BH verification matrix (4 tags × 2 orderings).
# DO NOT merge into main.

on:
  workflow_dispatch:

permissions:
  checks: write
  contents: read
  packages: write

env:
  LLK_PATH: tt_metal/tt-llk

jobs:
  build-images:
    name: "Docker setup"
    uses: ./.github/workflows/build-docker-artifact.yaml
    secrets: inherit

  # ---------------------------------------------------------------------------
  # ncsol fwd — nc + speed-of-light + forward order
  # ---------------------------------------------------------------------------
  ncsol-fwd-g1:
    name: "BH verify ncsol fwd 1/5"
    needs: [build-images]
    runs-on: [tt-ubuntu-2204-P150b-stable]
    timeout-minutes: 180
    container:
      image: ${{ needs.build-images.outputs.llk-ci-tag }}
      options: "--rm --device /dev/tenstorrent --ulimit nofile=4096:4096"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        timeout-minutes: 20
      - name: Install SFPI
        working-directory: ${{ env.LLK_PATH }}
        run: cd tests && ./setup_testing_env.sh && cd ..
      - name: Run
        working-directory: ${{ env.LLK_PATH }}
        env:
          PERF_NC_WC: "nc"
          PERF_SOL: "sol"
          PERF_ORDER: "fwd"
          TT_LLK_DISABLE_ASSERTS: "1"
        run: ./tests/run_llk_perf_blackhole.sh 1 5
      - name: Zip perf data
        if: always()
        working-directory: ${{ env.LLK_PATH }}
        run: |
          if compgen -G "tests/python_tests/perf_data/**" > /dev/null 2>&1; then
            cd tests/python_tests && zip -r perf_data-bh-verify-ncsol-fwd-1.zip perf_data/
          fi
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: always()
        with:
          name: perf-data-bh-verify-ncsol-fwd-1
          path: ${{ env.LLK_PATH }}/tests/python_tests/perf_data-bh-verify-ncsol-fwd-1.zip
          if-no-files-found: ignore

  ncsol-fwd-g2:

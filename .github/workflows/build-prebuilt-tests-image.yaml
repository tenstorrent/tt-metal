name: "Build prebuilt tests image"
# Bakes a build's output into the container image hardware test jobs already pull,
# so those jobs download no GHA artifact and run no install step.
#
# Push-oriented, like build-evaluation-image.yaml: this pushes an image *to* ghcr
# rather than pulling CI images *through* Harbor, so it deliberately does not use
# check-harbor.yaml or resolve-docker-pull-refs. The emitted ref is the canonical
# ghcr one; callers decide whether to Harbor-prefix it for their own pull.
#
# Everything path-specific lives in the Dockerfile. The artifact lands at
# artifact/ in the build context and the optional source checkout at src/, so a
# consumer path is added by writing a Dockerfile, not by changing this workflow.

permissions:
  contents: read
  packages: write
  actions: read

on:
  workflow_call:
    inputs:
      artifact-name:
        required: true
        type: string
        description: "Name of the build artifact to bake into the image"
      artifact-run-id:
        required: false
        type: string
        default: ""
        description: "Workflow run to take the artifact from (default: this run)"
      base-image:
        required: true
        type: string
        description: "Full ref of the base image the consumer already pulls"
      dockerfile:
        required: true
        type: string
        description: "Path to the Dockerfile, e.g. dockerfile/Dockerfile.prebuilt-tests-packages"
      build-args:
        required: false
        type: string
        default: ""
        description: "Extra docker build args; BASE is always supplied"
      image-name:
        required: false
        type: string
        default: "prebuilt-tests-image"
        description: "ghcr package name, under ghcr.io/<repository>/"
      checkout-source:
        required: false
        type: boolean
        default: false
        description: >-
          Check the source tree out to src/ for Dockerfiles that need it. Off by
          default: it is a multi-GB recursive clone that the package-based paths
          have no use for.
      source-ref:
        required: false
        type: string
        default: ""
        description: >-
          Commit to bake the source from, when checkout-source is on. Must be a
          full 40-character sha, not a branch or tag: a movable ref would let a
          re-run recompute the same tag while checking out different source, and
          overwrite the image with it. Defaults to this workflow's own commit. A
          caller testing a non-default ref must pass the same one it gave
          build-artifact, or src/ and artifact/ disagree.
      runner-label:
        required: false
        type: string
        default: "ubuntu-latest"
        description: >-
          Runner for the image build. GitHub-hosted is ~80s/run faster and keeps
          this off the self-hosted fleet, but cannot reach Harbor, so base-image
          must be a canonical ghcr ref. Self-hosted works with a ghcr base too.
    outputs:
      image:
        description: "Pullable ref of the built image; empty when the build was skipped or failed"
        value: ${{ jobs.build-test-image.outputs.image }}
  workflow_dispatch:
    inputs:
      artifact-name:
        required: true
        type: string
        description: "Name of the build artifact to bake into the image"
      artifact-run-id:
        required: true
        type: string
        description: >-
          Workflow run to take the artifact from. Required here: a dispatched run
          builds nothing itself, so defaulting to the current run would download
          from a run with no artifacts.
      base-image:
        required: true
        type: string
        description: "Full ref of the base image the consumer already pulls"
      dockerfile:
        required: true
        type: string
        description: "Path to the Dockerfile, e.g. dockerfile/Dockerfile.prebuilt-tests-packages"
      build-args:
        required: false
        type: string
        default: ""
        description: "Extra docker build args; BASE is always supplied"
      image-name:
        required: false
        type: string
        default: "prebuilt-tests-image"
        description: "ghcr package name, under ghcr.io/<repository>/"
      checkout-source:
        required: false
        type: boolean
        default: false
        description: "Check the source tree out to src/ for Dockerfiles that need it"
      source-ref:
        required: false
        type: string
        default: ""
        description: "Full 40-character commit sha to bake the source from; defaults to this workflow's commit"
      runner-label:
        required: false
        type: string
        default: "ubuntu-latest"
        description: "Runner for the image build; self-hosted cannot use a Harbor-prefixed base"

jobs:
  build-test-image:
    name: "Build and push"
    # Forks will never have secrets, so they cannot push. Don't fail the job for
    # them; the ref comes back empty and the caller keeps the artifact path.
    if: ${{ github.event.pull_request.head.repo.fork != true }}
    runs-on: ${{ inputs.runner-label }}
    timeout-minutes: 30
    outputs:
      # From the publish step, not the ref step. The ref is computed before the
      # push, so taking it directly would hand a consumer the ref of an image
      # that failed to push, and the consumer would fail pulling it.
      image: ${{ steps.published.outputs.image }}
    steps:
      # First, so a bad name or an over-long tag fails before paying for a
      # multi-hundred-MB download.
      - name: Compute the image ref
        id: ref
        env:
          ARTIFACT_NAME: ${{ inputs.artifact-name }}
          BASE_IMAGE: ${{ inputs.base-image }}
          IMAGE_NAME: ${{ inputs.image-name }}
          DOCKERFILE: ${{ inputs.dockerfile }}
          BUILD_ARGS: ${{ inputs.build-args }}
          CHECKOUT_SOURCE: ${{ inputs.checkout-source }}
          ARTIFACT_RUN_ID: ${{ inputs.artifact-run-id }}
          SOURCE_REF: ${{ inputs.source-ref }}
        run: |
          set -euo pipefail
          # required: true still lets '' through, and an empty name would make
          # download-artifact fetch every artifact in the run.
          if [ -z "$ARTIFACT_NAME" ]; then
            echo "::error::artifact-name is empty; the upstream build did not produce one"
            exit 1
          fi
          # A branch or tag can move, so re-running would recompute the same tag
          # while checking out different source and overwrite the image with it.
          if [ -n "$SOURCE_REF" ] && ! printf '%s' "$SOURCE_REF" | grep -qE '^[0-9a-f]{40}$'; then
            echo "::error::source-ref must be a full 40-character commit sha, got '$SOURCE_REF'"
            exit 1
          fi
          # Taking the artifact from another run says nothing about which commit
          # built it, so defaulting the source to this workflow's sha would pair
          # this commit's source with someone else's binaries under a valid tag.
          if [ "$CHECKOUT_SOURCE" = "true" ] && [ -n "$ARTIFACT_RUN_ID" ] && [ -z "$SOURCE_REF" ]; then
            echo "::error::source-ref is required when checkout-source is on and the artifact comes from another run, or src/ and artifact/ are from different commits"
            exit 1
          fi
          # Names end in <ref><sep><runid>, but packages joins with '-' and the
          # tarball with '_', so strip by shape rather than by position.
          CONFIG=$(printf '%s' "$ARTIFACT_NAME" | sed -E 's/[-_][0-9a-f]{7,40}[-_][0-9]+$//')
          BASE_SLUG="${BASE_IMAGE##*/}"
          BASE_SLUG="${BASE_SLUG%%:*}"
          # Everything that decides what ends up in the image, at full length.
          # Two calls differing only in build-args, say PRODUCT, would otherwise
          # push the same tag and the second would overwrite the first. Equal
          # hashes mean identical images, so sharing a tag is then correct.
          # CONFIG rather than the raw artifact name: the run id must not leak in
          # or a re-run of the same commit would mint a new tag. ARTIFACT_RUN_ID
          # is the raw input, so it is empty on the same-run path and changes
          # nothing there, but it separates two cross-run calls that share a
          # build config and would otherwise collide on different payloads.
          # SOURCE_REF included, or two calls differing only in the source they
          # bake would share a tag and the second would overwrite the first.
          RECIPE=$(printf '%s\n%s\n%s\n%s\n%s\n%s\n%s' \
            "$CONFIG" "$BASE_IMAGE" "$DOCKERFILE" "$BUILD_ARGS" "$CHECKOUT_SOURCE" \
            "$ARTIFACT_RUN_ID" "$SOURCE_REF" \
            | sha256sum | cut -c1-8)
          # The readable parts are truncated so the tag is bounded by construction.
          # Real configs reach 142 chars untruncated, over Docker's 128 limit, and
          # a legitimate build should not fail on its name. Truncation cannot cause
          # a collision because the full values are in RECIPE.
          TAG=$(printf '%s-%s-%s-%s' "${GITHUB_SHA:0:12}" "${CONFIG:0:48}" "${BASE_SLUG:0:32}" "$RECIPE" | tr -c 'a-zA-Z0-9_.-' '-')
          if [ "${#TAG}" -gt 128 ]; then
            echo "::error::Computed tag is ${#TAG} chars, over Docker's 128 limit: $TAG"
            exit 1
          fi
          echo "tag=${TAG}" | tee -a "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY}/${IMAGE_NAME}:${TAG}" | tee -a "$GITHUB_OUTPUT"
          # Derived, so a Dockerfile outside dockerfile/ needs no workflow change.
          echo "dockerfile-dir=$(dirname "$DOCKERFILE")" | tee -a "$GITHUB_OUTPUT"

      - name: Checkout the Dockerfile
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        timeout-minutes: 20
        with:
          fetch-depth: 1
          sparse-checkout: ${{ steps.ref.outputs.dockerfile-dir }}
          sparse-checkout-cone-mode: false

      - name: Checkout the source that goes into the image
        if: ${{ inputs.checkout-source }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        timeout-minutes: 20
        with:
          # Must match the commit the artifact was built from, or src/ and
          # artifact/ disagree; defaults to this workflow's own commit.
          ref: ${{ inputs.source-ref || github.sha }}
          path: src
          submodules: recursive

      # context: is the whole workspace, so every .git in it is transferred. The
      # Dockerfile checkout puts one at the root even when no source is checked
      # out, and a source checkout adds its own plus every submodule's.
      - name: Exclude git metadata from the build context
        run: |
          set -euo pipefail
          printf '.git\n**/.git\n' > "$GITHUB_WORKSPACE/.dockerignore"
          cat "$GITHUB_WORKSPACE/.dockerignore"

      - name: Download the build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        timeout-minutes: 15
        with:
          name: ${{ inputs.artifact-name }}
          run-id: ${{ inputs.artifact-run-id || github.run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: artifact

      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The docker driver's classic image store does no zstd and no OCI media
      # types, and cannot serve the Dockerfile's bind mount.
      # The self-hosted runners have no direct egress: the daemon is configured
      # with a proxy, but BuildKit runs as its own container and inherits none of
      # it. Emits nothing on runners that need no proxy.
      - name: Proxy settings for BuildKit
        id: buildkit
        run: |
          set -euo pipefail
          {
            echo 'driver-opts<<DRIVEROPTS'
            # No no_proxy: buildx splits driver-opts on commas, and BuildKit only
            # ever reaches ghcr here. A Harbor-prefixed base would need it back,
            # comma problem and all.
            if [ -n "${http_proxy:-}" ]; then
              echo "env.http_proxy=${http_proxy}"
              echo "env.https_proxy=${https_proxy:-${http_proxy}}"
            fi
            echo DRIVEROPTS
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          driver-opts: ${{ steps.buildkit.outputs.driver-opts }}

      - name: Extract metadata (tags, labels)
        id: docker-metadata
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository }}/${{ inputs.image-name }}
          tags: |
            type=raw,value=${{ steps.ref.outputs.tag }}

      - name: Build and push the test image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ github.workspace }}
          file: ${{ inputs.dockerfile }}
          # Our own ref, not the metadata action's, so the pushed tag is exactly
          # the one this job hands back to the caller. Labels still come from it.
          tags: ${{ steps.ref.outputs.image }}
          labels: ${{ steps.docker-metadata.outputs.labels }}
          build-args: |
            BASE=${{ inputs.base-image }}
            ${{ inputs.build-args }}
          # One ghcr version per push instead of three. Buildx otherwise emits an
          # image index plus an attestation manifest, which a tag-based GC sweep
          # would leave behind holding the layers alive.
          provenance: false
          outputs: |
            type=registry,push=true,compression=zstd,compression-level=3,oci-mediatypes=true

      # Runs only if the push succeeded, so a failed build yields an empty ref
      # and the consumer falls back to the artifact path instead of pulling a
      # ref that was never published.
      - name: Publish the ref
        id: published
        run: echo "image=${{ steps.ref.outputs.image }}" | tee -a "$GITHUB_OUTPUT"

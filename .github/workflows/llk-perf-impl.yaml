name: "LLK perf impl"
# Entry points: workflow_call only. Schedule / workflow_dispatch live in llk-perf.yaml.

on:
  workflow_call:
    inputs:
      architecture:
        description: "Architecture to run: all, wormhole, blackhole, or quasar"
        required: false
        default: all
        type: string
      speed-of-light:
        description: "Enable --speed-of-light for LLK performance tests"
        required: false
        default: true
        type: boolean
      pipeline:
        description: "nightly, baseline, merge_baseline or pr; empty infers it from the event"
        required: false
        default: ""
        type: string
      perf-run-types:
        description: "Comma-separated PerfRunType names to measure (blank = all)"
        required: false
        default: ""
        type: string
      tests-yaml:
        description: "Test list to build the matrix from"
        required: false
        default: ./tests/pipeline_reorg/llk_perf_tests.yaml
        type: string
      compile-quasar:
        description: "Also compile the Quasar perf ELFs (off when a caller already does)"
        required: false
        default: true
        type: boolean
      ref:
        description: "Commit to check out and measure (blank = this run's ref)"
        required: false
        default: ""
        type: string
      artifact-suffix:
        description: "Appended to artifact names, so two sweeps in one run do not collide"
        required: false
        default: ""
        type: string
      upload-to-warehouse:
        description: "Upload the run's Parquet to the perf warehouse over SFTP"
        required: false
        default: false
        type: boolean
      node-list-artifact:
        description: "Artifact of this run holding nodes.txt; the tests set LLK_PERF_NODE_LIST to it (blank = none)"
        required: false
        default: ""
        type: string
      stage2-baseline-ref:
        description: "Merge gate: after stage 1, each leg re-measures its regressions against the merge baseline at this ref (blank = off)"
        required: false
        default: ""
        type: string
      stage2-thresholds:
        description: 'With stage2-baseline-ref: {"<arch>": {"threshold": ..., "module_thresholds": ...}}; only these arches run stage 2'
        required: false
        default: "{}"
        type: string
      debug-symbols:
        description: "Build the ELFs with -g"
        required: false
        default: true
        type: boolean
      compile-runner:
        description: "Build each shard on this CPU runner; the board only measures (falls back to a board compile; blank = off)"
        required: false
        default: ""
        type: string
      compile-workers:
        description: "pytest -n on the compile runner"
        required: false
        default: 24
        type: number

permissions:
  checks: write
  contents: read
  packages: write

env:
  LLK_PATH: tt_metal/tt-llk

jobs:
  build-images:
    name: "Docker setup"
    uses: ./.github/workflows/build-docker-artifact.yaml
    secrets: inherit

  load-test-matrix:
    if: ${{ inputs.architecture != 'quasar' }}
    runs-on: ubuntu-slim
    timeout-minutes: 10
    needs: [build-images]
    outputs:
      matrix: ${{ steps.build-matrix.outputs.matrix }}
    env:
      TESTS_YAML_PATH: ${{ inputs.tests-yaml }}
    steps:
      - name: Checkout the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2 cachew: keep
        timeout-minutes: 20
        with:
          sparse-checkout: |
            .github
            tests/pipeline_reorg
          sparse-checkout-cone-mode: true
      - name: Install dependencies
        run: pip3 install PyYAML
      - name: Resolve enabled SKUs
        id: resolve-skus
        env:
          ARCHITECTURE: ${{ inputs.architecture }}
        run: |
          case "$ARCHITECTURE" in
            all)
              ENABLED_SKUS="ALL_SKUS_IN_TESTS"
              ;;
            wormhole)
              ENABLED_SKUS="wh_n150_civ2"
              ;;
            blackhole)
              ENABLED_SKUS="bh_p150b_civ2"
              ;;
            *)
              echo "::error::Unsupported architecture '$ARCHITECTURE'"
              exit 1
              ;;
          esac
          echo "enabled-skus=$ENABLED_SKUS" >> "$GITHUB_OUTPUT"

      # Matrix script from upstream main, not this branch (#57555, #57579);
      # keep after the checkout above, whose clean would delete this.
      - name: Checkout CI actions from main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        timeout-minutes: 20
        with:
          repository: tenstorrent/tt-metal  # github.repository would be the fork
          ref: main
          path: ci-main
          sparse-checkout: |
            .github/actions
            .github/scripts
          sparse-checkout-cone-mode: true

      - name: Build test matrix
        id: build-matrix
        uses: ./ci-main/.github/actions/prepare-test-matrix
        with:
          tests-yaml: ${{ env.TESTS_YAML_PATH }}
          enabled-skus: ${{ steps.resolve-skus.outputs.enabled-skus }}
          sku-config: ./.github/sku_config.yaml
          event: ${{ github.event_name == 'merge_group' && 'merge_group' || '' }}

  compile-quasar-perf:
    if: ${{ inputs.compile-quasar && (inputs.architecture == 'all' || inputs.architecture == 'quasar') }}
    needs: [build-images]
    uses: ./.github/workflows/build-quasar-perf.yml
    with:
      docker_image: ${{ needs.build-images.outputs.llk-ci-tag }}

  llk-perf-cpu-compile:
    needs: [load-test-matrix, build-images]
    if: ${{ inputs.compile-runner != '' && inputs.architecture != 'quasar' && needs.load-test-matrix.outputs.matrix != '[]' }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        test-group: ${{ fromJSON(needs.load-test-matrix.outputs.matrix) }}
    # Must not match the gate's leg filter ("_<arch> group N/M").
    name: "CPU compile, shard ${{ matrix.test-group.split_group }} on ${{ join(matrix.test-group.runs_on, ' ') }}"
    runs-on: ${{ inputs.compile-runner }}
    timeout-minutes: ${{ matrix.test-group.timeout }}
    container:
      image: ${{ needs.build-images.outputs.llk-ci-tag }}
      options: "--rm"
    steps:
      - name: Checkout code
        uses: tenstorrent/tt-metal/.github/actions/cachew-checkout@8146c9d2746a20109da97143663494805274ce8c # cachew checkout
        timeout-minutes: 20
        with:
          ref: ${{ inputs.ref }}
      - name: Install SFPI and zstd
        shell: bash
        working-directory: ${{ env.LLK_PATH }}
        run: |
          cd tests
          ./setup_testing_env.sh
          command -v zstd || { apt-get update -qq && apt-get install -y -qq zstd; }
      - name: Set CHIP_ARCH
        shell: bash
        env:
          RUN_ON_LABELS: ${{ join(matrix.test-group.runs_on, ' ') }}
        run: |
          RUN_LABEL="${RUN_ON_LABELS%% *}"
          if [[ "$RUN_LABEL" =~ N150 ]]; then
            CHIP_ARCH=wormhole
          elif [[ "$RUN_LABEL" =~ P150 ]]; then
            CHIP_ARCH=blackhole
          else
            echo "::error::cannot tell the architecture from '$RUN_ON_LABELS'"
            exit 1
          fi
          echo "CHIP_ARCH=$CHIP_ARCH" >> "$GITHUB_ENV"
      - name: Compile
        shell: bash
        working-directory: ${{ env.LLK_PATH }}
        env:
          SPEED_OF_LIGHT: ${{ inputs.speed-of-light }}
          LLK_PERF_DEBUG_SYMBOLS: ${{ inputs.debug-symbols }}
          TT_LLK_DISABLE_ASSERTS: "1"
          LLK_PERF_RUN_TYPES: ${{ inputs.perf-run-types }}
          LLK_PERF_PHASE: compile
          LLK_PERF_COMPILE_WORKERS: ${{ inputs.compile-workers }}
          MATRIX_CMD: ${{ matrix.test-group.cmd }}
        run: |
          "$GITHUB_WORKSPACE/.github/scripts/utils/host-load-sidecar.sh" \
            --interval 5 \
            --label "CPU compile ${{ matrix.test-group.name }} on ${{ inputs.compile-runner }} (-n ${{ inputs.compile-workers }})" \
            --output "$GITHUB_STEP_SUMMARY" \
            -- bash -c "$MATRIX_CMD"
      - name: Pack the ELFs
        shell: bash
        working-directory: ${{ env.LLK_PATH }}
        env:
          SPEED_OF_LIGHT: ${{ inputs.speed-of-light }}
          LLK_PERF_DEBUG_SYMBOLS: ${{ inputs.debug-symbols }}
          TT_LLK_DISABLE_ASSERTS: "1"
          LLK_PERF_RUN_TYPES: ${{ inputs.perf-run-types }}
          MATRIX_CMD: ${{ matrix.test-group.cmd }}
        run: |
          python3 tests/llk_perf_offload.py pack --cmd "$MATRIX_CMD" \
            --out "$RUNNER_TEMP/elfs/llk-elfs-${CHIP_ARCH}-${{ matrix.test-group.split_group }}${{ inputs.artifact-suffix }}.tar.zst" \
            --junit tests/python_tests/pytest-report-*-${{ matrix.test-group.split_group }}-compile.xml
      - name: Upload the ELFs
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          path: ${{ runner.temp }}/elfs/llk-elfs-${{ env.CHIP_ARCH }}-${{ matrix.test-group.split_group }}${{ inputs.artifact-suffix }}.tar.zst
          archive: false
          retention-days: 1
          if-no-files-found: error

  stage2-baseline:
    name: "Stage 2: read the merge baseline"
    if: ${{ inputs.stage2-baseline-ref != '' }}
    continue-on-error: true
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        timeout-minutes: 20
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            .github
            tt_metal/tt-llk/perf
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.10'
      - run: pip install -c tt_metal/tt-llk/perf/constraints.txt pandas snowflake-connector-python cryptography
      - name: Read the baseline from the warehouse
        env:
          SNOWFLAKE_ACCOUNT: TLUIIGS-MN66866
          SNOWFLAKE_USER: SVC_TTOPS_SWEEPS
          SNOWFLAKE_WAREHOUSE: PUBLIC
          SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SWEEPS_SNOWFLAKE_KEY }}
          SPEED_OF_LIGHT: ${{ inputs.speed-of-light }}
          MATCH_REF: ${{ inputs.stage2-baseline-ref }}
          LLK_PERF_WAREHOUSE_TABLE: ${{ vars.LLK_PERF_WAREHOUSE_TABLE }}
          STAGE2_THRESHOLDS: ${{ inputs.stage2-thresholds }}
        run: |
          COMMITS=$(.github/scripts/llk-perf-baseline-commits.sh "$MATCH_REF" | paste -sd, -) || COMMITS=""
          for ARCH in $(python3 -c 'import json, os; print(*json.loads(os.environ["STAGE2_THRESHOLDS"]))'); do
            python3 tt_metal/tt-llk/perf/baseline_from_warehouse.py \
              --arch "$ARCH" --pipeline merge_baseline --speed-of-light "$SPEED_OF_LIGHT" \
              --exclude-workflow-run "$GITHUB_RUN_ID" --commits "$COMMITS" --wait-minutes 0 \
              --out "stage2-baseline/${ARCH}/baseline.csv" --metadata "stage2-baseline/${ARCH}/baseline_metadata.json" \
              || echo "::warning::The ${ARCH} merge baseline read failed; its legs skip stage 2."
          done
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: llk-perf-stage2-baseline${{ inputs.artifact-suffix }}
          path: stage2-baseline/

  llk-perf-exec:
    needs: [load-test-matrix, build-images, llk-perf-cpu-compile, stage2-baseline]
    if: >-
      ${{ !cancelled() && inputs.architecture != 'quasar' && needs.build-images.result == 'success'
          && needs.load-test-matrix.result == 'success' && needs.load-test-matrix.outputs.matrix != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        test-group: ${{ fromJSON(needs.load-test-matrix.outputs.matrix) }}
    name: ${{ matrix.test-group.name }}
    runs-on: ${{ matrix.test-group.runs_on }}
    timeout-minutes: ${{ matrix.test-group.timeout }}
    container:
      image: ${{ needs.build-images.outputs.llk-ci-tag }}
      options: "--rm --device /dev/tenstorrent --ulimit nofile=4096:4096"
    steps:
      - name: Record the job start
        if: ${{ inputs.stage2-baseline-ref != '' }}
        run: echo "JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - name: Checkout code
        uses: tenstorrent/tt-metal/.github/actions/cachew-checkout@8146c9d2746a20109da97143663494805274ce8c # cachew checkout
        timeout-minutes: 20
        with:
          ref: ${{ inputs.ref }}
      - name: Install SFPI
        shell: bash
        working-directory: ${{ env.LLK_PATH }}
        run: |
          cd tests
          ./setup_testing_env.sh
          cd ..
      - name: Set CHIP_ARCH and the run tag
        shell: bash
        env:
          RUN_ON_LABELS: ${{ join(matrix.test-group.runs_on, ' ') }}
        run: |
          RUN_LABEL="${RUN_ON_LABELS%% *}"
          if [[ "$RUN_LABEL" =~ N150 ]]; then
            CHIP_ARCH=wormhole
          elif [[ "$RUN_LABEL" =~ P150 ]]; then
            CHIP_ARCH=blackhole
          else
            echo "::error::cannot tell the architecture from '$RUN_ON_LABELS'"
            exit 1
          fi
          echo "CHIP_ARCH=$CHIP_ARCH" >> "$GITHUB_ENV"
          echo "PERF_RUN_TAG=${{ github.run_id }}-$CHIP_ARCH-${{ strategy.job-index }}" >> "$GITHUB_ENV"
      - name: Download the node list
        if: ${{ inputs.node-list-artifact != '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ inputs.node-list-artifact }}
          path: ${{ runner.temp }}/node-list
      - name: Point the tests at the node list
        if: ${{ inputs.node-list-artifact != '' }}
        run: echo "LLK_PERF_NODE_LIST=$RUNNER_TEMP/node-list/nodes.txt" >> "$GITHUB_ENV"
      - name: "Offload: install zstd"
        id: offload-zstd
        if: ${{ inputs.compile-runner != '' }}
        continue-on-error: true
        timeout-minutes: 2
        shell: bash
        run: command -v zstd || { apt-get update -qq && apt-get install -y -qq zstd; }
      - name: "Offload: download the CPU-built ELFs"
        id: offload-download
        if: ${{ steps.offload-zstd.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 10
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: llk-elfs-${{ env.CHIP_ARCH }}-${{ matrix.test-group.split_group }}${{ inputs.artifact-suffix }}.tar.zst
          path: ${{ runner.temp }}/offload-download
      - name: "Offload: unpack and check the CPU-built ELFs"
        id: offload-unpack
        if: ${{ steps.offload-download.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 5
        shell: bash
        working-directory: ${{ env.LLK_PATH }}
        env:
          SPEED_OF_LIGHT: ${{ inputs.speed-of-light }}
          LLK_PERF_DEBUG_SYMBOLS: ${{ inputs.debug-symbols }}
          TT_LLK_DISABLE_ASSERTS: "1"
          LLK_PERF_RUN_TYPES: ${{ inputs.perf-run-types }}
          MATRIX_CMD: ${{ matrix.test-group.cmd }}
        run: |
          python3 tests/llk_perf_offload.py unpack --cmd "$MATRIX_CMD" \
            --dir "$RUNNER_TEMP/offload-download" --delete-archive
      - name: "Offload: fall back to a board compile"
        id: offload-fallback
        if: ${{ inputs.compile-runner != '' && steps.offload-unpack.outcome != 'success' }}
        shell: bash
        run: |
          echo "::warning::No usable CPU build for this shard; the board compiles it."
          echo "### Offload fallback: the board compiled this shard" >> "$GITHUB_STEP_SUMMARY"
      - name: "Offload: report the fallback to Slack"
        if: ${{ steps.offload-fallback.outcome == 'success' && github.event_name == 'schedule' }}
        continue-on-error: true
        uses: ./.github/actions/report-failure
        with:
          test_name: "LLK perf CPU compile offload (board fell back to compiling ${{ matrix.test-group.name }})"
          slack_bot_token: ${{ secrets.LLK_SLACK_REPORTING_BOT_TOKEN }}
          slack_channel_id: ${{ secrets.LLK_CI_STATUS_CHANNEL_ID }}
          status: failure
      - name: Run tests
        shell: bash
        working-directory: ${{ env.LLK_PATH }}
        env:
          SPEED_OF_LIGHT: ${{ inputs.speed-of-light }}
          LLK_PERF_DEBUG_SYMBOLS: ${{ inputs.debug-symbols }}
          TT_LLK_DISABLE_ASSERTS: "1"
          PIPELINE: ${{ inputs.pipeline }}
          LLK_PERF_RUN_TYPES: ${{ inputs.perf-run-types }}
          LLK_PERF_PHASE: ${{ steps.offload-unpack.outcome == 'success' && 'run' || 'all' }}
        run: |
          ${{ matrix.test-group.cmd }}
          mkdir -p perf_data/runs && touch perf_data/runs/leg-complete

      # One retry: a reset on FinalizeArtifact must not cost the architecture its verdict.
      - name: Upload performance data
        id: upload-perf-data
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: always() && hashFiles('tt_metal/tt-llk/perf_data/runs/**') != ''
        continue-on-error: true
        with:
          name: perf-data-${{ env.CHIP_ARCH }}-${{ matrix.test-group.split_group }}${{ inputs.artifact-suffix }}
          path: ${{ env.LLK_PATH }}/perf_data/runs/

      - name: Upload performance data, second attempt
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: always() && steps.upload-perf-data.outcome == 'failure'
        with:
          name: perf-data-${{ env.CHIP_ARCH }}-${{ matrix.test-group.split_group }}${{ inputs.artifact-suffix }}
          path: ${{ env.LLK_PATH }}/perf_data/runs/
          overwrite: true

      - name: Upload test logs on failure
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: failure()
        with:
          name: test-logs-${{ env.CHIP_ARCH }}-${{ matrix.test-group.split_group }}${{ inputs.artifact-suffix }}
          path: |
            ${{ env.LLK_PATH }}/tests/python_tests/test_run*.log
            ${{ env.LLK_PATH }}/tests/python_tests/test_errors*.log

      # Neither this nor the publish below feeds the gate, and the gate refuses to
      # compare when a measuring leg did not complete. A stalled report upload must
      # not cost the architecture a verdict it already measured.
      - name: Upload JUnit report
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: always()
        continue-on-error: true
        with:
          name: perf-junit-report-${{ env.CHIP_ARCH }}-${{ matrix.test-group.split_group }}${{ inputs.artifact-suffix }}
          path: |
            ${{ env.LLK_PATH }}/tests/python_tests/pytest-report-*-${{ matrix.test-group.split_group }}.xml
            ${{ env.LLK_PATH }}/tests/python_tests/pytest-report-*-${{ matrix.test-group.split_group }}-*-run.xml
            ${{ env.LLK_PATH }}/tests/python_tests/pytest-report-*-${{ matrix.test-group.split_group }}-run.xml
            ${{ env.LLK_PATH }}/tests/python_tests/pytest-report-*-${{ matrix.test-group.split_group }}-compile.xml

      - name: Publish Test Results
        uses: mikepenz/action-junit-report@v5
        if: always()
        continue-on-error: true
        with:
          report_paths: |
            ${{ env.LLK_PATH }}/tests/python_tests/pytest-report-*-${{ matrix.test-group.split_group }}-compile.xml
            ${{ env.LLK_PATH }}/tests/python_tests/pytest-report-*-${{ matrix.test-group.split_group }}-run.xml
            ${{ env.LLK_PATH }}/tests/python_tests/pytest-report-*-${{ matrix.test-group.split_group }}-*-run.xml
          include_passed: true
          annotate_only: true

      # Stage 2 runs in the leg's spare time, after the official upload, so it adds no board job.
      - name: "Stage 2: download the merge baseline"
        id: stage2-baseline
        if: ${{ success() && inputs.stage2-baseline-ref != '' && fromJSON(inputs.stage2-thresholds)[env.CHIP_ARCH] }}
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: llk-perf-stage2-baseline${{ inputs.artifact-suffix }}
          path: ${{ runner.temp }}/stage2-baseline
      - name: "Stage 2: re-measure this leg's regressions at 5 code positions"
        if: ${{ steps.stage2-baseline.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        working-directory: ${{ env.LLK_PATH }}
        env:
          TIMEOUT_MINUTES: ${{ matrix.test-group.timeout }}
          LLK_PERF_RUN_TYPES: ${{ inputs.perf-run-types }}
          THRESHOLD: ${{ fromJSON(inputs.stage2-thresholds)[env.CHIP_ARCH].threshold }}
          MODULE_THRESHOLDS: ${{ fromJSON(inputs.stage2-thresholds)[env.CHIP_ARCH].module_thresholds }}
        run: |
          # JOB_START_EPOCH is stamped after container init (up to ~3 min on a cold pull); 2 more stay for the uploads.
          export LLK_STAGE2_DEADLINE=$(( JOB_START_EPOCH + (TIMEOUT_MINUTES - 5) * 60 ))
          # The container runs as another user than the checkout's owner; stage 2 fetches the base with git.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          # The script stops measuring at the deadline. This limit also covers its other steps (git fetch, compare),
          # with 30 s past the deadline to write the result, so stage 2 cannot run the leg into its timeout.
          LEFT=$(( LLK_STAGE2_DEADLINE + 30 - $(date +%s) ))
          if (( LEFT < 60 )); then
            echo "::warning::No time left for stage 2 in this leg."
            exit 0
          fi
          LLK_STAGE2_BASE_REF="${{ inputs.stage2-baseline-ref }}" timeout -k 10 "$LEFT" \
            tests/run_llk_perf_merge_stage2.sh "$RUNNER_TEMP/stage2-baseline/$CHIP_ARCH" "$RUNNER_TEMP/stage2" \
            || echo "::warning::Stage 2 did not finish in this leg (exit $?); the gate report counts this leg as missing."
      - name: "Stage 2: upload the result"
        if: ${{ !cancelled() && steps.stage2-baseline.outcome == 'success' }}
        continue-on-error: true
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: llk-perf-stage2-${{ env.CHIP_ARCH }}-${{ matrix.test-group.split_group }}${{ inputs.artifact-suffix }}
          # One search path: with two, upload-artifact uploaded only one of the files in the leg container.
          path: ${{ runner.temp }}/stage2/stage2.*
          if-no-files-found: ignore

  upload-perf-data:
    name: "Upload perf data to the warehouse"
    needs: [build-images, load-test-matrix, llk-perf-exec]
    # always(): publish each architecture whose legs all completed. The merged
    # run_id carries no attempt, so re-running the failed shards and
    # re-uploading publishes the rest under the same run.
    if: ${{ always() && inputs.upload-to-warehouse }}
    runs-on: ubuntu-latest
    # The merge lives in helpers.perf.core, whose imports reach the device
    # libraries, so it needs the LLK python env. The test image has it.
    container:
      image: ${{ needs.build-images.outputs.llk-ci-tag }}
      options: "--rm"
    steps:
      - name: Checkout the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2 cachew: keep
        timeout-minutes: 20
        with:
          fetch-depth: 1
      - name: Download this run's perf data
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: perf-data-*
          path: perf-data
      - name: Merge the run's shards into one file per architecture
        working-directory: ${{ env.LLK_PATH }}/tests/python_tests
        env:
          # helpers is `.`; tt_llk_perf is tools/python. Relative: github.workspace is the host path, absent in this container.
          PYTHONPATH: .:../../tools/python
          # Required, and not by the merge: importing anything under helpers
          # runs helpers/device.py, whose module scope calls
          # get_chip_architecture(), which probes a device when CHIP_ARCH is
          # unset. This runner has none. The value is arbitrary -- the merge
          # reads each file's own arch column and stamps no new rows -- but it
          # must be one ChipArchitecture accepts.
          CHIP_ARCH: wormhole
        run: |
          python3 -m helpers.perf.core \
            --in-dir "$GITHUB_WORKSPACE/perf-data" \
            --out-dir "$GITHUB_WORKSPACE/generated/llk_perf"
          ls -l "$GITHUB_WORKSPACE/generated/llk_perf"
      - name: Drop an architecture with an incomplete leg
        env:
          MATRIX: ${{ needs.load-test-matrix.outputs.matrix }}
        run: |
          for f in "$GITHUB_WORKSPACE"/generated/llk_perf/*.parquet; do
            arch=$(basename "$f" .parquet); arch=${arch##*-}
            case "$arch" in wormhole) label=N150 ;; blackhole) label=P150 ;; *) label=none ;; esac
            want=$(python3 -c 'import json, os, sys; print(sum(sys.argv[1] in t["runs_on"][0] for t in json.loads(os.environ["MATRIX"] or "[]")))' "$label")
            got=$(ls "$GITHUB_WORKSPACE"/perf-data/perf-data-"$arch"-*/leg-complete 2>/dev/null | wc -l)
            if (( want == 0 || got < want )); then
              echo "::warning::$arch: $got of $want legs completed; not published."
              rm "$f"
            fi
          done
          ls "$GITHUB_WORKSPACE"/generated/llk_perf/*.parquet || { echo "::error::No complete architecture to publish."; exit 1; }
      # The LLK test image has the python env but no ssh client, and the
      # upload action shells out to sftp.
      - name: Install the SFTP client
        run: apt-get update -qq && apt-get install -y -qq openssh-client
      - name: Upload perf data
        uses: ./.github/actions/upload-data-via-sftp
        with:
          ssh-private-key: ${{ secrets.SFTP_LLK_PERF_WRITER_KEY }}
          sftp-batchfile: .github/actions/upload-data-via-sftp/llk_perf_batchfile.txt
          username: "llk-perf-run-writer"
          hostname: "s-dbd4b8a190fa40a4b.server.transfer.us-east-2.amazonaws.com"

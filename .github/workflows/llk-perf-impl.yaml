name: "LLK perf impl"
# Entry points: workflow_call only. Schedule / workflow_dispatch live in llk-perf.yaml.

on:
  workflow_call:
    inputs:
      architecture:
        description: "Architecture to run: all, wormhole, blackhole, or quasar"
        required: false
        default: all
        type: string
      speed-of-light:
        description: "Enable --speed-of-light for LLK performance tests"
        required: false
        default: true
        type: boolean
      upload-to-warehouse:
        description: "Upload the run's Parquet to the perf warehouse over SFTP"
        required: false
        default: false
        type: boolean
      only-group:
        description: "Run only this split group (1-5). Empty runs every group."
        required: false
        default: ""
        type: string

permissions:
  checks: write
  contents: read
  packages: write

env:
  LLK_PATH: tt_metal/tt-llk

jobs:
  build-images:
    name: "Docker setup"
    uses: ./.github/workflows/build-docker-artifact.yaml
    secrets: inherit

  load-test-matrix:
    if: ${{ inputs.architecture != 'quasar' }}
    runs-on: ubuntu-slim
    needs: [build-images]
    outputs:
      # An unset trim step yields "", which is falsy, so the full matrix wins.
      matrix: ${{ steps.trim.outputs.matrix || steps.build-matrix.outputs.matrix }}
    env:
      TESTS_YAML_PATH: ./tests/pipeline_reorg/llk_perf_tests.yaml
    steps:
      - name: Checkout the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        timeout-minutes: 20
        with:
          sparse-checkout: |
            .github
            tests/pipeline_reorg
          sparse-checkout-cone-mode: true
      - name: Install dependencies
        run: pip3 install PyYAML
      - name: Verify test timeouts against budget
        run: |
          set -e
          python3 .github/scripts/utils/verify_time_budget.py \
            ${{ env.TESTS_YAML_PATH }} \
            ./.github/time_budget.yaml \
            "perf"
      - name: Build test matrix
        id: build-matrix
        env:
          ARCHITECTURE: ${{ inputs.architecture }}
        run: |
          case "$ARCHITECTURE" in
            all)
              ENABLED_SKUS="ALL_SKUS_IN_TESTS"
              ;;
            wormhole)
              ENABLED_SKUS="wh_n150_civ2"
              ;;
            blackhole)
              ENABLED_SKUS="bh_p150b_civ2"
              ;;
            *)
              echo "::error::Unsupported architecture '$ARCHITECTURE'"
              exit 1
              ;;
          esac

          python3 .github/scripts/utils/prepare_test_matrix.py \
            ${{ env.TESTS_YAML_PATH }} \
            "$ENABLED_SKUS" \
            ./.github/sku_config.yaml
      - name: Keep only one split group
        id: trim
        if: ${{ inputs.only-group != '' }}
        env:
          MATRIX: ${{ steps.build-matrix.outputs.matrix }}
          ONLY_GROUP: ${{ inputs.only-group }}
        run: |
          # One shard instead of ten. A change to this workflow can then be
          # tested end to end without occupying every perf machine for two
          # hours. Fails loud on a group number that matches nothing, so a typo
          # cannot silently run no tests at all.
          FILTER='import json, os, sys
          rows = json.loads(os.environ["MATRIX"])
          group = os.environ["ONLY_GROUP"]
          keep = [r for r in rows if str(r.get("split_group")) == group]
          if not keep:
              sys.exit("no matrix row with split_group=" + group)
          print("matrix=" + json.dumps(keep))'
          python3 -c "$FILTER" >> "$GITHUB_OUTPUT"

  compile-quasar-perf:
    if: ${{ inputs.architecture == 'all' || inputs.architecture == 'quasar' }}
    needs: [build-images]
    uses: ./.github/workflows/build-quasar-perf.yml
    with:
      docker_image: ${{ needs.build-images.outputs.llk-ci-tag }}

  llk-perf-exec:
    needs: [load-test-matrix, build-images]
    if: ${{ inputs.architecture != 'quasar' && needs.load-test-matrix.outputs.matrix != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        test-group: ${{ fromJSON(needs.load-test-matrix.outputs.matrix) }}
    name: ${{ matrix.test-group.name }}
    runs-on: ${{ matrix.test-group.runs_on }}
    timeout-minutes: ${{ matrix.test-group.timeout }}
    container:
      image: ${{ needs.build-images.outputs.llk-ci-tag }}
      options: "--rm --device /dev/tenstorrent --ulimit nofile=4096:4096"
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        timeout-minutes: 20
      - name: Install SFPI
        shell: bash
        working-directory: ${{ env.LLK_PATH }}
        run: |
          cd tests
          ./setup_testing_env.sh
          cd ..
      - name: Set CHIP_ARCH and the run tag
        shell: bash
        env:
          RUN_ON_LABELS: ${{ join(matrix.test-group.runs_on, ' ') }}
        run: |
          RUN_LABEL="${RUN_ON_LABELS%% *}"
          if [[ "$RUN_LABEL" =~ N150 ]]; then
            CHIP_ARCH=wormhole
          elif [[ "$RUN_LABEL" =~ P150 ]]; then
            CHIP_ARCH=blackhole
          else
            CHIP_ARCH=unknown
          fi
          echo "CHIP_ARCH=$CHIP_ARCH" >> "$GITHUB_ENV"
          # One name for everything this shard produces: the report directory
          # perf_data/runs/<tag> and the Parquet inside it. Must be unique per
          # job, because pytest-split divides by test item rather than by
          # module, so one module's variants land in several shards and their
          # reports would collide the moment the artefacts are brought together.
          # It carries the workflow run id, so it is also unique across nights --
          # which matters once these files are archived into one directory.
          echo "PERF_RUN_TAG=${{ github.run_id }}-$CHIP_ARCH-${{ strategy.job-index }}" >> "$GITHUB_ENV"
      - name: Run tests
        shell: bash
        working-directory: ${{ env.LLK_PATH }}
        env:
          SPEED_OF_LIGHT: ${{ inputs.speed-of-light }}
        run: |
          ${{ matrix.test-group.cmd }}

      - name: Upload performance data
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: always() && hashFiles('tt_metal/tt-llk/perf_data/runs/**') != ''
        with:
          name: perf-data-${{ env.CHIP_ARCH }}-${{ matrix.test-group.split_group }}
          path: ${{ env.LLK_PATH }}/perf_data/runs/

      - name: Upload test logs on failure
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: failure()
        with:
          name: test-logs-${{ env.CHIP_ARCH }}-${{ matrix.test-group.split_group }}
          path: |
            ${{ env.LLK_PATH }}/tests/python_tests/test_run*.log
            ${{ env.LLK_PATH }}/tests/python_tests/test_errors*.log

      - name: Upload JUnit report
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: always()
        with:
          name: perf-junit-report-${{ env.CHIP_ARCH }}-${{ matrix.test-group.split_group }}
          # Match the merged report, the compile report, the BH per-slice
          # `-<tname>-run` reports, and the WH `-run` report so that per-test
          # reports are still uploaded even when a timeout prevents the merge.
          path: |
            ${{ env.LLK_PATH }}/tests/python_tests/pytest-report-*-${{ matrix.test-group.split_group }}.xml
            ${{ env.LLK_PATH }}/tests/python_tests/pytest-report-*-${{ matrix.test-group.split_group }}-*-run.xml
            ${{ env.LLK_PATH }}/tests/python_tests/pytest-report-*-${{ matrix.test-group.split_group }}-run.xml
            ${{ env.LLK_PATH }}/tests/python_tests/pytest-report-*-${{ matrix.test-group.split_group }}-compile.xml

      - name: Publish Test Results
        uses: mikepenz/action-junit-report@v5
        if: always()
        with:
          # Read the per-phase / per-slice result reports directly (compile +
          # run for WH, per-slice run for BH) rather than only the merged
          # report, so results are still published if a shard times out before
          # the merge step. The three patterns are disjoint and exclude the
          # merged report, so no test is counted twice.
          report_paths: |
            ${{ env.LLK_PATH }}/tests/python_tests/pytest-report-*-${{ matrix.test-group.split_group }}-compile.xml
            ${{ env.LLK_PATH }}/tests/python_tests/pytest-report-*-${{ matrix.test-group.split_group }}-run.xml
            ${{ env.LLK_PATH }}/tests/python_tests/pytest-report-*-${{ matrix.test-group.split_group }}-*-run.xml
          include_passed: true
          annotate_only: true

  upload-perf-data:
    name: "Upload perf data to the warehouse"
    needs: [llk-perf-exec]
    # always(): a shard that failed still produced Parquets worth keeping.
    # The job is not shielded: a refused login fails it, and fails the run. That
    # is the behaviour the scheduled nightly will have when the default flips.
    if: ${{ always() && inputs.upload-to-warehouse }}
    runs-on: ubuntu-latest
    steps:
      # The upload action is a local action, so the repo has to be on disk
      # before it can be resolved. Checkout also clears the workspace, so it
      # must come before the artifacts are downloaded into it.
      - name: Checkout the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        timeout-minutes: 20
        with:
          fetch-depth: 1
      - name: Download this run's perf data
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: perf-data-*
          path: perf-data
      - name: Collect the run Parquets
        run: |
          mkdir -p generated/llk_perf
          # One Parquet per shard, already named <run_id>-<arch>-<job_index>,
          # so a flat copy cannot collide. generated/<producer>/ is where every
          # other producer in this repo stages its upload.
          #
          # Prefix every name with llk_perf_. The upload lands in a remote
          # directory this repo shares between producers, where a bare
          # <run_id>-<arch>-<shard> says nothing about who owns the file. The
          # prefix is greppable, it is what an ingest rule can key on, and it
          # matches what helpers.perf.backfill sends for the older nights.
          find perf-data -name '*.parquet' | while read -r f; do
            cp "$f" "generated/llk_perf/llk_perf_$(basename "$f")"
          done
          ls -l generated/llk_perf
          if [ -z "$(ls -A generated/llk_perf)" ]; then
            echo "::error::no run Parquet in the perf-data artifacts"
            exit 1
          fi
      # LLK perf has its own SFTP writer and its own ingest bucket
      # (data_iac#655: user llk-perf-run, home data-pipeline-llk-perf-run-ingest).
      # Only that bucket has the llk_perf_run wrangler behind it
      # (data_airflow dags/pipelines/llk_perf_run), which loads the file into
      # LLK_PERF.{RUNS,TEST_EXECUTIONS,MEASUREMENTS}. Another producer's writer
      # would put the file in a bucket where nothing reads it.
      - name: Upload perf data
        uses: ./.github/actions/upload-data-via-sftp
        with:
          ssh-private-key: ${{ secrets.SFTP_LLK_PERF_WRITER_KEY }}
          sftp-batchfile: .github/actions/upload-data-via-sftp/llk_perf_batchfile.txt
          username: ${{ secrets.SFTP_LLK_PERF_WRITER_USERNAME }}
          hostname: ${{ secrets.SFTP_LLK_PERF_WRITER_HOSTNAME }}

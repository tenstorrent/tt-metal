name: "LLK perf impl"
# Entry points: workflow_call only. Schedule / workflow_dispatch live in llk-perf.yaml.

on:
  workflow_call:
    inputs:
      architecture:
        description: "Architecture to run: all, wormhole, blackhole, or quasar"
        required: false
        default: all
        type: string
      speed-of-light:
        description: "Enable --speed-of-light for LLK performance tests"
        required: false
        default: true
        type: boolean
      pipeline:
        description: "nightly, baseline, merge_baseline or pr; empty infers it from the event"
        required: false
        default: ""
        type: string
      perf-run-types:
        description: "Comma-separated PerfRunType names to measure (blank = all)"
        required: false
        default: ""
        type: string
      tests-yaml:
        description: "Test list to build the matrix from"
        required: false
        default: ./tests/pipeline_reorg/llk_perf_tests.yaml
        type: string
      compile-quasar:
        description: "Also compile the Quasar perf ELFs (off when a caller already does)"
        required: false
        default: true
        type: boolean
      ref:
        description: "Commit to check out and measure (blank = this run's ref)"
        required: false
        default: ""
        type: string
      artifact-suffix:
        description: "Appended to artifact names, so two sweeps in one run do not collide"
        required: false
        default: ""
        type: string
      upload-to-warehouse:
        description: "Upload the run's Parquet to the perf warehouse over SFTP"
        required: false
        default: false
        type: boolean
      compile-runner:
        description: "Compile each shard on this CPU-only runner and only measure on the board (blank = compile on the board)"
        required: false
        default: ""
        type: string
      compile-workers:
        description: "Compile workers (pytest -n) on the compile runner"
        required: false
        default: 10
        type: number
      compile-timeout:
        description: "Timeout in minutes for each compile job on the compile runner"
        required: false
        default: 240
        type: number
      debug-symbols:
        description: "Build the ELFs with -g; false adds --no-debug-symbols"
        required: false
        default: true
        type: boolean
      exit-first:
        description: "Stop a shard's measuring pass at its first failure (-x)"
        required: false
        default: true
        type: boolean
      elf-check:
        description: "With compile-runner: rebuild a sample on the board and compare it with the shipped ELFs"
        required: false
        default: false
        type: boolean

permissions:
  checks: write
  contents: read
  packages: write

env:
  LLK_PATH: tt_metal/tt-llk

jobs:
  build-images:
    name: "Docker setup"
    uses: ./.github/workflows/build-docker-artifact.yaml
    secrets: inherit

  load-test-matrix:
    if: ${{ inputs.architecture != 'quasar' }}
    runs-on: ubuntu-slim
    needs: [build-images]
    outputs:
      matrix: ${{ steps.build-matrix.outputs.matrix }}
    env:
      TESTS_YAML_PATH: ${{ inputs.tests-yaml }}
    steps:
      - name: Checkout the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        timeout-minutes: 20
        with:
          sparse-checkout: |
            .github
            tests/pipeline_reorg
          sparse-checkout-cone-mode: true
      - name: Install dependencies
        run: pip3 install PyYAML
      - name: Resolve enabled SKUs
        id: resolve-skus
        env:
          ARCHITECTURE: ${{ inputs.architecture }}
        run: |
          case "$ARCHITECTURE" in
            all)
              ENABLED_SKUS="ALL_SKUS_IN_TESTS"
              ;;
            wormhole)
              ENABLED_SKUS="wh_n150_civ2"
              ;;
            blackhole)
              ENABLED_SKUS="bh_p150b_civ2"
              ;;
            *)
              echo "::error::Unsupported architecture '$ARCHITECTURE'"
              exit 1
              ;;
          esac
          echo "enabled-skus=$ENABLED_SKUS" >> "$GITHUB_OUTPUT"

      - name: Build test matrix
        id: build-matrix
        uses: tenstorrent/tt-metal/.github/actions/prepare-test-matrix@main
        with:
          tests-yaml: ${{ env.TESTS_YAML_PATH }}
          enabled-skus: ${{ steps.resolve-skus.outputs.enabled-skus }}
          sku-config: ./.github/sku_config.yaml
          event: ${{ github.event_name == 'merge_group' && 'merge_group' || '' }}

  compile-quasar-perf:
    if: ${{ inputs.compile-quasar && (inputs.architecture == 'all' || inputs.architecture == 'quasar') }}
    needs: [build-images]
    uses: ./.github/workflows/build-quasar-perf.yml
    with:
      docker_image: ${{ needs.build-images.outputs.llk-ci-tag }}

  # Opt-in (compile-runner): build each shard's ELFs on a CPU-only runner, so the
  # board job below only measures. The archive carries a manifest of the commit,
  # compiler, flags and environment, which the board job checks before it opens
  # the device: the variant id ignores all of them.
  llk-perf-compile:
    needs: [load-test-matrix, build-images]
    if: ${{ inputs.compile-runner != '' && inputs.architecture != 'quasar' && needs.load-test-matrix.outputs.matrix != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        test-group: ${{ fromJSON(needs.load-test-matrix.outputs.matrix) }}
    name: "Compile ${{ matrix.test-group.name }}"
    runs-on: ${{ inputs.compile-runner }}
    timeout-minutes: ${{ inputs.compile-timeout }}
    container:
      image: ${{ needs.build-images.outputs.llk-ci-tag }}
      options: "--rm"
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        timeout-minutes: 20
        with:
          ref: ${{ inputs.ref }}
      - name: Install SFPI and zstd
        shell: bash
        working-directory: ${{ env.LLK_PATH }}
        run: |
          cd tests
          ./setup_testing_env.sh
          command -v zstd || { apt-get update -qq && apt-get install -y -qq zstd; }
      - name: Set CHIP_ARCH
        shell: bash
        env:
          RUN_ON_LABELS: ${{ join(matrix.test-group.runs_on, ' ') }}
        run: |
          # The board runner's labels, not this runner's, name the architecture.
          RUN_LABEL="${RUN_ON_LABELS%% *}"
          if [[ "$RUN_LABEL" =~ N150 ]]; then
            CHIP_ARCH=wormhole
          elif [[ "$RUN_LABEL" =~ P150 ]]; then
            CHIP_ARCH=blackhole
          else
            echo "::error::cannot tell the architecture from '$RUN_ON_LABELS'"
            exit 1
          fi
          echo "CHIP_ARCH=$CHIP_ARCH" >> "$GITHUB_ENV"
          echo "Compile runner: $(nproc) CPUs, $(awk '/MemTotal/ {printf "%.1f GiB", $2/1048576}' /proc/meminfo)" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Compile
        shell: bash
        working-directory: ${{ env.LLK_PATH }}
        env:
          SPEED_OF_LIGHT: ${{ inputs.speed-of-light }}
          TT_LLK_DISABLE_ASSERTS: "1"
          LLK_PERF_RUN_TYPES: ${{ inputs.perf-run-types }}
          LLK_PERF_DEBUG_SYMBOLS: ${{ inputs.debug-symbols }}
          LLK_PERF_PHASE: compile
          LLK_PERF_COMPILE_WORKERS: ${{ inputs.compile-workers }}
          MATRIX_CMD: ${{ matrix.test-group.cmd }}
        run: |
          "$GITHUB_WORKSPACE/.github/scripts/utils/host-load-sidecar.sh" \
            --interval 5 \
            --label "compile ${{ matrix.test-group.name }} on ${{ inputs.compile-runner }} (-n ${{ inputs.compile-workers }})" \
            --output "$GITHUB_STEP_SUMMARY" \
            -- bash -c "$MATRIX_CMD"
      - name: Pack the ELFs
        shell: bash
        working-directory: ${{ env.LLK_PATH }}
        env:
          SPEED_OF_LIGHT: ${{ inputs.speed-of-light }}
          TT_LLK_DISABLE_ASSERTS: "1"
          LLK_PERF_RUN_TYPES: ${{ inputs.perf-run-types }}
          LLK_PERF_DEBUG_SYMBOLS: ${{ inputs.debug-symbols }}
          MATRIX_CMD: ${{ matrix.test-group.cmd }}
        run: |
          python3 tests/llk_perf_offload.py pack --cmd "$MATRIX_CMD" \
            --out "$RUNNER_TEMP/offload/llk-elfs-${CHIP_ARCH}-${{ matrix.test-group.split_group }}${{ inputs.artifact-suffix }}.tar.zst" \
            --junit tests/python_tests/pytest-report-*-${{ matrix.test-group.split_group }}-compile.xml
      - name: Upload the ELFs
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          path: ${{ runner.temp }}/offload/llk-elfs-${{ env.CHIP_ARCH }}-${{ matrix.test-group.split_group }}${{ inputs.artifact-suffix }}.tar.zst
          archive: false
          retention-days: 3
          if-no-files-found: error
      - name: Upload the compile JUnit report
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: always()
        with:
          name: perf-junit-report-${{ env.CHIP_ARCH }}-${{ matrix.test-group.split_group }}-offload-compile${{ inputs.artifact-suffix }}
          path: ${{ env.LLK_PATH }}/tests/python_tests/pytest-report-*-${{ matrix.test-group.split_group }}-compile.xml

  llk-perf-exec:
    needs: [load-test-matrix, build-images, llk-perf-compile]
    # !cancelled(): llk-perf-compile is skipped unless compile-runner is set, and a
    # skipped need would skip this job too.
    if: >-
      ${{ !cancelled() && inputs.architecture != 'quasar'
          && needs.load-test-matrix.result == 'success'
          && needs.load-test-matrix.outputs.matrix != '[]'
          && (needs.llk-perf-compile.result == 'success' || (inputs.compile-runner == '' && needs.llk-perf-compile.result == 'skipped')) }}
    strategy:
      fail-fast: false
      matrix:
        test-group: ${{ fromJSON(needs.load-test-matrix.outputs.matrix) }}
    name: ${{ matrix.test-group.name }}
    runs-on: ${{ matrix.test-group.runs_on }}
    timeout-minutes: ${{ matrix.test-group.timeout }}
    container:
      image: ${{ needs.build-images.outputs.llk-ci-tag }}
      options: "--rm --device /dev/tenstorrent --ulimit nofile=4096:4096"
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        timeout-minutes: 20
        with:
          ref: ${{ inputs.ref }}
      - name: Install SFPI
        shell: bash
        working-directory: ${{ env.LLK_PATH }}
        run: |
          cd tests
          ./setup_testing_env.sh
          cd ..
          if [[ -n "${{ inputs.compile-runner }}" ]]; then
            command -v zstd || { apt-get update -qq && apt-get install -y -qq zstd; }
          fi
      - name: Set CHIP_ARCH and the run tag
        shell: bash
        env:
          RUN_ON_LABELS: ${{ join(matrix.test-group.runs_on, ' ') }}
        run: |
          RUN_LABEL="${RUN_ON_LABELS%% *}"
          if [[ "$RUN_LABEL" =~ N150 ]]; then
            CHIP_ARCH=wormhole
          elif [[ "$RUN_LABEL" =~ P150 ]]; then
            CHIP_ARCH=blackhole
          else
            CHIP_ARCH=unknown
          fi
          echo "CHIP_ARCH=$CHIP_ARCH" >> "$GITHUB_ENV"
          echo "PERF_RUN_TAG=${{ github.run_id }}-$CHIP_ARCH-${{ strategy.job-index }}" >> "$GITHUB_ENV"
      - name: Download the ELFs
        if: ${{ inputs.compile-runner != '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          # An unarchived artifact is named after its file.
          pattern: llk-elfs-${{ env.CHIP_ARCH }}-${{ matrix.test-group.split_group }}${{ inputs.artifact-suffix }}.tar.zst
          path: ${{ runner.temp }}/offload-download
      - name: Unpack and check the ELFs
        if: ${{ inputs.compile-runner != '' }}
        shell: bash
        working-directory: ${{ env.LLK_PATH }}
        env:
          SPEED_OF_LIGHT: ${{ inputs.speed-of-light }}
          TT_LLK_DISABLE_ASSERTS: "1"
          LLK_PERF_RUN_TYPES: ${{ inputs.perf-run-types }}
          LLK_PERF_DEBUG_SYMBOLS: ${{ inputs.debug-symbols }}
          MATRIX_CMD: ${{ matrix.test-group.cmd }}
        run: |
          python3 tests/llk_perf_offload.py unpack --cmd "$MATRIX_CMD" --dir "$RUNNER_TEMP/offload-download"
      - name: Run tests
        shell: bash
        working-directory: ${{ env.LLK_PATH }}
        env:
          SPEED_OF_LIGHT: ${{ inputs.speed-of-light }}
          TT_LLK_DISABLE_ASSERTS: "1"
          PIPELINE: ${{ inputs.pipeline }}
          LLK_PERF_RUN_TYPES: ${{ inputs.perf-run-types }}
          LLK_PERF_DEBUG_SYMBOLS: ${{ inputs.debug-symbols }}
          LLK_PERF_EXITFIRST: ${{ inputs.exit-first }}
          LLK_PERF_PHASE: ${{ inputs.compile-runner != '' && 'run' || 'all' }}
        run: |
          ${{ matrix.test-group.cmd }}

      - name: Upload performance data
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: always() && hashFiles('tt_metal/tt-llk/perf_data/runs/**') != ''
        with:
          name: perf-data-${{ env.CHIP_ARCH }}-${{ matrix.test-group.split_group }}${{ inputs.artifact-suffix }}
          path: ${{ env.LLK_PATH }}/perf_data/runs/

      - name: Upload test logs on failure
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: failure()
        with:
          name: test-logs-${{ env.CHIP_ARCH }}-${{ matrix.test-group.split_group }}${{ inputs.artifact-suffix }}
          path: |
            ${{ env.LLK_PATH }}/tests/python_tests/test_run*.log
            ${{ env.LLK_PATH }}/tests/python_tests/test_errors*.log

      - name: Upload JUnit report
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: always()
        with:
          name: perf-junit-report-${{ env.CHIP_ARCH }}-${{ matrix.test-group.split_group }}${{ inputs.artifact-suffix }}
          path: |
            ${{ env.LLK_PATH }}/tests/python_tests/pytest-report-*-${{ matrix.test-group.split_group }}.xml
            ${{ env.LLK_PATH }}/tests/python_tests/pytest-report-*-${{ matrix.test-group.split_group }}-*-run.xml
            ${{ env.LLK_PATH }}/tests/python_tests/pytest-report-*-${{ matrix.test-group.split_group }}-run.xml
            ${{ env.LLK_PATH }}/tests/python_tests/pytest-report-*-${{ matrix.test-group.split_group }}-compile.xml

      - name: Publish Test Results
        uses: mikepenz/action-junit-report@v5
        if: always()
        with:
          report_paths: |
            ${{ env.LLK_PATH }}/tests/python_tests/pytest-report-*-${{ matrix.test-group.split_group }}-compile.xml
            ${{ env.LLK_PATH }}/tests/python_tests/pytest-report-*-${{ matrix.test-group.split_group }}-run.xml
            ${{ env.LLK_PATH }}/tests/python_tests/pytest-report-*-${{ matrix.test-group.split_group }}-*-run.xml
          include_passed: true
          annotate_only: true

      # Last, so a mismatch cannot stop the perf data from uploading. The rebuild
      # replaces the build directory, which nothing after this step reads.
      - name: Check the shipped ELFs against a board rebuild
        if: ${{ !cancelled() && inputs.compile-runner != '' && inputs.elf-check }}
        shell: bash
        working-directory: ${{ env.LLK_PATH }}
        env:
          SPEED_OF_LIGHT: ${{ inputs.speed-of-light }}
          TT_LLK_DISABLE_ASSERTS: "1"
          LLK_PERF_RUN_TYPES: ${{ inputs.perf-run-types }}
          LLK_PERF_DEBUG_SYMBOLS: ${{ inputs.debug-symbols }}
        run: |
          python3 tests/llk_perf_offload.py elf-check

  upload-perf-data:
    name: "Upload perf data to the warehouse"
    needs: [build-images, llk-perf-exec]
    # always(): a night that lost shards still produced the ones that finished,
    # and partial coverage is real data. Publishing it is safe because the
    # merged run_id carries no attempt, so re-running the failed shards and
    # re-uploading replays over the partial night instead of adding a second.
    if: ${{ always() && inputs.upload-to-warehouse }}
    runs-on: ubuntu-latest
    # The merge lives in helpers.perf.core, whose imports reach the device
    # libraries, so it needs the LLK python env. The test image has it.
    container:
      image: ${{ needs.build-images.outputs.llk-ci-tag }}
      options: "--rm"
    steps:
      - name: Checkout the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        timeout-minutes: 20
        with:
          fetch-depth: 1
      - name: Download this run's perf data
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: perf-data-*
          path: perf-data
      - name: Merge the run's shards into one file per architecture
        working-directory: ${{ env.LLK_PATH }}/tests/python_tests
        env:
          # helpers is `.`; tt_llk_perf is tools/python. Relative: github.workspace is the host path, absent in this container.
          PYTHONPATH: .:../../tools/python
          # Required, and not by the merge: importing anything under helpers
          # runs helpers/device.py, whose module scope calls
          # get_chip_architecture(), which probes a device when CHIP_ARCH is
          # unset. This runner has none. The value is arbitrary -- the merge
          # reads each file's own arch column and stamps no new rows -- but it
          # must be one ChipArchitecture accepts.
          CHIP_ARCH: wormhole
        run: |
          python3 -m helpers.perf.core \
            --in-dir "$GITHUB_WORKSPACE/perf-data" \
            --out-dir "$GITHUB_WORKSPACE/generated/llk_perf"
          ls -l "$GITHUB_WORKSPACE/generated/llk_perf"
      # The LLK test image has the python env but no ssh client, and the
      # upload action shells out to sftp.
      - name: Install the SFTP client
        run: apt-get update -qq && apt-get install -y -qq openssh-client
      - name: Upload perf data
        uses: ./.github/actions/upload-data-via-sftp
        with:
          ssh-private-key: ${{ secrets.SFTP_LLK_PERF_WRITER_KEY }}
          sftp-batchfile: .github/actions/upload-data-via-sftp/llk_perf_batchfile.txt
          username: "llk-perf-run-writer"
          hostname: "s-dbd4b8a190fa40a4b.server.transfer.us-east-2.amazonaws.com"

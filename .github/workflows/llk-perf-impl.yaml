name: "LLK perf impl"
# Entry points: workflow_call only. Schedule / workflow_dispatch live in llk-perf.yaml.

on:
  workflow_call:
    inputs:
      architecture:
        description: "Architecture to run: all, wormhole, blackhole, or quasar"
        required: false
        default: all
        type: string
      speed-of-light:
        description: "Enable --speed-of-light for LLK performance tests"
        required: false
        default: true
        type: boolean

permissions:
  checks: write
  contents: read
  packages: write

env:
  LLK_PATH: tt_metal/tt-llk

jobs:
  build-images:
    name: "Docker setup"
    uses: ./.github/workflows/build-docker-artifact.yaml
    secrets: inherit

  load-test-matrix:
    if: ${{ inputs.architecture != 'quasar' }}
    runs-on: ubuntu-slim
    needs: [build-images]
    outputs:
      matrix: ${{ steps.build-matrix.outputs.matrix }}
    env:
      TESTS_YAML_PATH: ./tests/pipeline_reorg/llk_perf_tests.yaml
    steps:
      - name: Checkout the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        timeout-minutes: 20
        with:
          sparse-checkout: |
            .github
            tests/pipeline_reorg
          sparse-checkout-cone-mode: true
      - name: Install dependencies
        run: pip3 install PyYAML
      - name: Verify test timeouts against budget
        run: |
          set -e
          python3 .github/scripts/utils/verify_time_budget.py \
            ${{ env.TESTS_YAML_PATH }} \
            ./.github/time_budget.yaml \
            "perf"
      - name: Build test matrix
        id: build-matrix
        env:
          ARCHITECTURE: ${{ inputs.architecture }}
        run: |
          case "$ARCHITECTURE" in
            all)
              ENABLED_SKUS="ALL_SKUS_IN_TESTS"
              ;;
            wormhole)
              ENABLED_SKUS="wh_n150_civ2"
              ;;
            blackhole)
              ENABLED_SKUS="bh_p150b_civ2"
              ;;
            *)
              echo "::error::Unsupported architecture '$ARCHITECTURE'"
              exit 1
              ;;
          esac

          python3 .github/scripts/utils/prepare_test_matrix.py \
            ${{ env.TESTS_YAML_PATH }} \
            "$ENABLED_SKUS" \
            ./.github/sku_config.yaml

  compile-quasar-perf:
    if: ${{ inputs.architecture == 'all' || inputs.architecture == 'quasar' }}
    needs: [build-images]
    uses: ./.github/workflows/build-quasar-perf.yml
    with:
      docker_image: ${{ needs.build-images.outputs.llk-ci-tag }}

  llk-perf-exec:
    needs: [load-test-matrix, build-images]
    if: ${{ inputs.architecture != 'quasar' && needs.load-test-matrix.outputs.matrix != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        test-group: ${{ fromJSON(needs.load-test-matrix.outputs.matrix) }}
    name: ${{ matrix.test-group.name }}
    runs-on: ${{ matrix.test-group.runs_on }}
    timeout-minutes: ${{ matrix.test-group.timeout }}
    container:
      image: ${{ needs.build-images.outputs.llk-ci-tag }}
      options: "--rm --device /dev/tenstorrent --ulimit nofile=4096:4096"
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        timeout-minutes: 20
      - name: Install SFPI
        shell: bash
        working-directory: ${{ env.LLK_PATH }}
        run: |
          cd tests
          ./setup_testing_env.sh
          cd ..
      - name: Set CHIP_ARCH and the run tag
        shell: bash
        env:
          RUN_ON_LABELS: ${{ join(matrix.test-group.runs_on, ' ') }}
        run: |
          RUN_LABEL="${RUN_ON_LABELS%% *}"
          if [[ "$RUN_LABEL" =~ N150 ]]; then
            CHIP_ARCH=wormhole
          elif [[ "$RUN_LABEL" =~ P150 ]]; then
            CHIP_ARCH=blackhole
          else
            CHIP_ARCH=unknown
          fi
          echo "CHIP_ARCH=$CHIP_ARCH" >> "$GITHUB_ENV"
          # One name for everything this shard produces: the report directory
          # perf_data/runs/<tag> and the published Parquet. Must be unique per
          # job, because pytest-split divides by test item rather than by
          # module, so one module's variants land in several shards and their
          # reports would collide the moment the artefacts are brought together.
          # It carries the workflow run id, so it is also unique across nights --
          # which matters once these files are archived into one directory.
          # Exported here rather than scoped to a single step: the publish step
          # names its output from the same tag, and two naming schemes drift.
          echo "PERF_RUN_TAG=${{ github.run_id }}-$CHIP_ARCH-${{ strategy.job-index }}" >> "$GITHUB_ENV"
      - name: Run tests
        shell: bash
        working-directory: ${{ env.LLK_PATH }}
        env:
          SPEED_OF_LIGHT: ${{ inputs.speed-of-light }}
        run: |
          ${{ matrix.test-group.cmd }}

      - name: Publish Parquet from CSVs
        if: always() && hashFiles('tt_metal/tt-llk/perf_data/**/*.csv') != ''
        shell: bash
        working-directory: ${{ env.LLK_PATH }}/tests/python_tests
        env:
          COMMIT_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          PIPELINE: ${{ github.event_name == 'schedule' && 'nightly' || 'PR' }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # This run only. publish_run globs **/*.csv, so pointing it at
          # perf_data would sweep every retained run into one batch.
          python3 -m helpers.perf.publish_run \
            --csv-dir ../../perf_data/latest \
            --out ../../perf_data/llk-perf-${{ env.PERF_RUN_TAG }}.parquet \
            --arch ${{ env.CHIP_ARCH }}

      - name: Upload performance data
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: always() && hashFiles('tt_metal/tt-llk/perf_data/runs/**') != ''
        with:
          name: perf-data-${{ env.CHIP_ARCH }}-${{ matrix.test-group.split_group }}
          path: |
            ${{ env.LLK_PATH }}/perf_data/runs/
            ${{ env.LLK_PATH }}/perf_data/*.parquet

      - name: Upload test logs on failure
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: failure()
        with:
          name: test-logs-${{ env.CHIP_ARCH }}-${{ matrix.test-group.split_group }}
          path: |
            ${{ env.LLK_PATH }}/tests/python_tests/test_run*.log
            ${{ env.LLK_PATH }}/tests/python_tests/test_errors*.log

      - name: Upload JUnit report
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: always()
        with:
          name: perf-junit-report-${{ env.CHIP_ARCH }}-${{ matrix.test-group.split_group }}
          # Match the merged report, the compile report, the BH per-slice
          # `-<tname>-run` reports, and the WH `-run` report so that per-test
          # reports are still uploaded even when a timeout prevents the merge.
          path: |
            ${{ env.LLK_PATH }}/tests/python_tests/pytest-report-*-${{ matrix.test-group.split_group }}.xml
            ${{ env.LLK_PATH }}/tests/python_tests/pytest-report-*-${{ matrix.test-group.split_group }}-*-run.xml
            ${{ env.LLK_PATH }}/tests/python_tests/pytest-report-*-${{ matrix.test-group.split_group }}-run.xml
            ${{ env.LLK_PATH }}/tests/python_tests/pytest-report-*-${{ matrix.test-group.split_group }}-compile.xml

      - name: Publish Test Results
        uses: mikepenz/action-junit-report@v5
        if: always()
        with:
          # Read the per-phase / per-slice result reports directly (compile +
          # run for WH, per-slice run for BH) rather than only the merged
          # report, so results are still published if a shard times out before
          # the merge step. The three patterns are disjoint and exclude the
          # merged report, so no test is counted twice.
          report_paths: |
            ${{ env.LLK_PATH }}/tests/python_tests/pytest-report-*-${{ matrix.test-group.split_group }}-compile.xml
            ${{ env.LLK_PATH }}/tests/python_tests/pytest-report-*-${{ matrix.test-group.split_group }}-run.xml
            ${{ env.LLK_PATH }}/tests/python_tests/pytest-report-*-${{ matrix.test-group.split_group }}-*-run.xml
          include_passed: true
          annotate_only: true

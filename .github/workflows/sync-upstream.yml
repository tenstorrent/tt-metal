name: sync-upstream-ttmetal

# Keeps the REMOTE apande-TT:feature/tt-hw-planner branch synced to latest tenstorrent/tt-metal.
# Cloud-side does ONLY the merge + push (no build) -> runs on any runner, needs no TT hardware and
# no big build machine. Heavy verification (build + PCC) is done locally on a TT box, because that
# is the only place with a device. On an unexpected conflict it files an issue and pushes nothing.

on:
  schedule:
    # Target is 06:00 Europe/Berlin every day. GitHub cron is UTC-only and DST-blind, so both
    # candidate hours are scheduled and the `berlin-gate` job drops the wrong twin: 04:00 UTC is
    # 06:00 CEST (summer), 05:00 UTC is 06:00 CET (winter). Exactly one fires as 06:00 local.
    - cron: "0 4 * * *"
    - cron: "0 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

jobs:
  berlin-gate:
    # DST discriminator: keep whichever cron corresponds to 06:00 Berlin right now, drop the twin.
    # It keys off WHICH cron fired (github.event.schedule), NOT off the current wall clock --
    # scheduled runs are best-effort and routinely start hours late (observed: the 06:00 cron ran
    # at 08:27Z), so a wall-clock hour comparison would skip the sync on every delayed run.
    # Manual dispatch always proceeds.
    runs-on: ubuntu-22.04
    outputs:
      go: ${{ steps.tz.outputs.go }}
    steps:
      - name: Did the 06:00-Europe/Berlin cron fire?
        id: tz
        run: |
          OFFSET=$(TZ=Europe/Berlin date +%z)
          if [ "$OFFSET" = "+0100" ]; then WANT="0 5 * * *"; else WANT="0 4 * * *"; fi
          FIRED="${{ github.event.schedule }}"
          if [ "${{ github.event_name }}" != "schedule" ] || [ "$FIRED" = "$WANT" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
            echo "Proceeding (Berlin offset=$OFFSET, cron fired='$FIRED', event=${{ github.event_name }})."
          else
            echo "go=false" >> "$GITHUB_OUTPUT"
            echo "Skipping: Berlin offset=$OFFSET wants cron '$WANT', but '$FIRED' fired -- off-DST twin."
          fi

  sync-remote:
    needs: berlin-gate
    if: needs.berlin-gate.outputs.go == 'true'
    runs-on: ubuntu-22.04       # merge-only -> no container / no big runner needed
    env:
      GH_API: https://api.github.com/repos/${{ github.repository }}
    steps:
      - name: Checkout the remote tool branch (full history)
        uses: actions/checkout@v4
        with:
          ref: feature/tt-hw-planner
          fetch-depth: 0

      - name: Git setup (safe.directory + identity)
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global user.name  "tt-hw-planner-bot"
          git config --global user.email "tt-hw-planner-bot@users.noreply.github.com"

      - name: Fetch upstream tenstorrent/tt-metal
        run: |
          git remote add upstream https://github.com/tenstorrent/tt-metal.git 2>/dev/null \
            || git remote set-url upstream https://github.com/tenstorrent/tt-metal.git
          git fetch upstream main

      - name: Already up to date?
        id: check
        run: |
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "uptodate=true"  >> "$GITHUB_OUTPUT"
          else
            echo "uptodate=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge upstream + push the remote branch (auto-sync)
        if: steps.check.outputs.uptodate == 'false'
        id: sync
        run: |
          SHA=$(git rev-parse --short upstream/main)
          set +e
          git merge --no-commit --no-ff upstream/main
          # known, recurring core conflicts -> take upstream
          git checkout --theirs ttnn/ttnn/device.py 2>/dev/null && git add ttnn/ttnn/device.py
          UMD=$(git rev-parse upstream/main:tt_metal/third_party/umd 2>/dev/null)
          [ -n "$UMD" ] && git update-index --cacheinfo 160000,"$UMD",tt_metal/third_party/umd
          UNRESOLVED=$(git diff --name-only --diff-filter=U)
          set -e
          if [ -n "$UNRESOLVED" ]; then
            echo "Unexpected conflicts -- not pushing:"; echo "$UNRESOLVED"
            { echo "conflicts<<EOF"; echo "$UNRESOLVED"; echo "EOF"; } >> "$GITHUB_OUTPUT"
            git merge --abort
            exit 1
          fi
          git commit -m "Merge upstream/main ($SHA, latest tt-metal) [auto-sync, tool-only]"
          git push origin HEAD:feature/tt-hw-planner
          echo "Pushed feature/tt-hw-planner -> latest tt-metal ($SHA)"

      - name: File an issue on conflict/failure
        if: failure()
        run: |
          BODY="Auto-sync to latest tt-metal could not push (unexpected merge conflict). Conflicts: ${{ steps.sync.outputs.conflicts }}. Resolve manually, then verify build+PCC on a TT box. See run logs."
          python3 - "$BODY" <<'PY'
          import json,os,sys,urllib.request
          data=json.dumps({"title":"Auto-sync to latest tt-metal needs manual attention","body":sys.argv[1]}).encode()
          req=urllib.request.Request(os.environ["GH_API"]+"/issues",data=data,
              headers={"Authorization":"token %s"%os.environ["TOKEN"],"Accept":"application/vnd.github+json"})
          print(urllib.request.urlopen(req).status)
          PY
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: LLK PR Review
run-name: "LLK PR Review — PR #${{ inputs.pr_number }} (effort: ${{ inputs.effort }}, debug: ${{ inputs.debug_output }})"

# On-demand AI code review for LLK pull requests.
#
# Run it manually from the Actions tab (workflow_dispatch) against any PR
# number. The job runs the repository-local LLK review command against the PR's
# diff,
# with:
#   * the LLK MCP servers (tt_metal/tt-llk/.mcp.json — DeepWiki, Atlassian, Glean),
#   * the team's private LLK review knowledge, fetched at runtime and routed to
#     each reviewer by role, with a compact coordination system prompt.
# It posts findings as inline review comments, or an issue-level no-findings
# summary when no actionable findings survive.
#
# The human gate is that a person with write access must dispatch the workflow.

on:
  # Manual on-demand trigger: review any open PR by number at a chosen effort.
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to review"
        required: true
        type: string
      effort:
        description: "Reasoning effort for the review session (--effort)"
        required: false
        default: "max"
        type: choice
        options: [low, medium, high, max]
      debug_output:
        description: "Print full Claude output (may expose private review context in Actions logs)"
        required: false
        default: false
        type: boolean

# One review at a time per PR; a newer trigger does not kill an in-flight review.
concurrency:
  group: llk-pr-review-${{ inputs.pr_number }}
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 150         # measured full reviews can exceed 85 minutes
    permissions:
      contents: read             # read the checkout
      pull-requests: write       # post inline review comments
      issues: write              # post acknowledgement / summary
      id-token: write            # OIDC, if the key path requires it
    env:
      PR_NUMBER: ${{ inputs.pr_number }}
    steps:
      # 1. Checkout the ref containing this workflow and the review command.
      #    This checkout is orchestration-only; PR code is placed in exact
      #    base/head worktrees below.
      - name: Checkout repository
        uses: actions/checkout@main   # intentionally floating: always latest
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      # 2. Fetch the private LLK review knowledge, kept out of the public tree and
      #    pulled at runtime into a scratch dir via a sparse checkout.
      - name: Fetch private LLK review knowledge
        uses: actions/checkout@main   # intentionally floating: always latest
        with:
          repository: tenstorrent/llk_code_gen
          # Token with read access to the private knowledge repo.
          token: ${{ secrets.LLK_KNOWLEDGE_TOKEN }}
          path: .llk-review-knowledge-src
          sparse-checkout: dashboard/pr_review/knowledge
          sparse-checkout-cone-mode: false
          persist-credentials: false

      # 3. Materialize the exact PR revisions. A workflow_dispatch checkout is
      #    normally the reviewer branch, not the PR base or head; allowing agents
      #    to read code from it can produce stale comparisons and false findings.
      - name: Prepare exact PR base and head worktrees
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if [[ ! "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "::error::PR number must contain only decimal digits"
            exit 1
          fi

          base_tip_sha="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.base.sha')"
          head_sha="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.sha')"
          if [[ ! "$base_tip_sha" =~ ^[0-9a-f]{40}$ ]] || [[ ! "$head_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::GitHub returned an invalid PR base or head SHA"
            exit 1
          fi

          git fetch --no-tags --depth=200 origin "$base_tip_sha"
          git fetch --no-tags --depth=200 origin "pull/${PR_NUMBER}/head"
          fetched_head="$(git rev-parse FETCH_HEAD)"
          if [ "$fetched_head" != "$head_sha" ]; then
            echo "::error::PR head moved while the review was starting; dispatch a fresh review"
            exit 1
          fi

          if ! comparison_base_sha="$(git merge-base "$base_tip_sha" "$head_sha")"; then
            git fetch --no-tags --depth=2000 origin "$base_tip_sha"
            git fetch --no-tags --depth=2000 origin "pull/${PR_NUMBER}/head"
            fetched_head="$(git rev-parse FETCH_HEAD)"
            if [ "$fetched_head" != "$head_sha" ]; then
              echo "::error::PR head moved while resolving its merge-base; dispatch a fresh review"
              exit 1
            fi
            comparison_base_sha="$(git merge-base "$base_tip_sha" "$head_sha")"
          fi
          if [[ ! "$comparison_base_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Could not resolve the PR merge-base"
            exit 1
          fi

          base_dir="${GITHUB_WORKSPACE}/.llk-review-pr-base"
          head_dir="${GITHUB_WORKSPACE}/.llk-review-pr-head"
          git worktree add --detach "$base_dir" "$comparison_base_sha"
          git worktree add --detach "$head_dir" "$head_sha"

          test "$(git -C "$base_dir" rev-parse HEAD)" = "$comparison_base_sha"
          test "$(git -C "$head_dir" rev-parse HEAD)" = "$head_sha"

          {
            echo "LLK_PR_BASE_TIP_SHA=$base_tip_sha"
            echo "LLK_PR_BASE_SHA=$comparison_base_sha"
            echo "LLK_PR_HEAD_SHA=$head_sha"
            echo "LLK_PR_BASE_DIR=$base_dir"
            echo "LLK_PR_HEAD_DIR=$head_dir"
          } >> "$GITHUB_ENV"

          echo "Prepared PR merge-base ${comparison_base_sha:0:12}, base tip ${base_tip_sha:0:12}, and head ${head_sha:0:12}"

      # 4. Validate the runtime knowledge and build a compact coordination prompt.
      #    Task subagents have isolated contexts, so the repository-local command
      #    tells each role which source files to read. Keeping the full corpus out
      #    of the parent prompt avoids paying for irrelevant knowledge repeatedly.
      - name: Prepare review knowledge
        run: |
          set -euo pipefail
          src=".llk-review-knowledge-src/dashboard/pr_review/knowledge"
          out="${GITHUB_WORKSPACE}/.llk-review-system-prompt.md"

          required=(
            pinned-rules.md
            learnings.md
            review-rubric.md
            conventions.md
            golden-review.md
            performance-audit.md
          )
          for name in "${required[@]}"; do
            if [ ! -s "$src/$name" ]; then
              echo "::error::Required LLK review knowledge is missing or empty: $name"
              exit 1
            fi
          done

          {
            echo "# LLK review coordination directive"
            echo
            echo "You are the lead orchestrator for a Tenstorrent LLK pull-request review."
            echo "The authoritative private knowledge files are under:"
            echo "  $src"
            echo
            echo "The workflow checkout root contains review orchestration, not PR code."
            echo "Read current PR code only from the exact head worktree:"
            echo "  $LLK_PR_HEAD_DIR (commit $LLK_PR_HEAD_SHA)"
            echo "Read baseline code only from the exact PR merge-base worktree:"
            echo "  $LLK_PR_BASE_DIR (merge-base commit $LLK_PR_BASE_SHA)"
            echo "The current PR base-branch tip is commit $LLK_PR_BASE_TIP_SHA."
            echo "The intake agent may inspect the complete PR diff once to build whole-PR"
            echo "context. Downstream reviewers and validators must use exact-SHA, path-scoped"
            echo "git diffs. Never infer PR code from the workflow checkout root or another"
            echo "local branch."
            echo
            echo "Task subagents do not inherit this system prompt or the parent's context."
            echo "For every delegated review or validation task, explicitly name the exact"
            echo "knowledge files that role must Read. Do not paste the whole corpus into task"
            echo "prompts. The repository-local review command defines the role-to-file routing."
            echo
            echo "Every Agent call must set run_in_background=false. For a parallel phase, emit"
            echo "all Agent calls together in one assistant message and wait for every tool"
            echo "result. Never return a progress update as the final result while agents run."
            echo "Do not begin validation until all reviewers return, and do not begin posting"
            echo "until all validators return. Missing results must be retried synchronously."
            echo
            echo "Recall is more important than precision for subtle LLK correctness and HW"
            echo "hazards. Keep grounded suspicions and state what would confirm or refute them;"
            echo "drop only findings shown to be incorrect, pre-existing, duplicate, or out of"
            echo "scope. Do not manufacture generic concerns merely to produce a comment."
            echo
            echo "Human-pinned rules are mandatory and have highest priority. At least one"
            echo "dedicated reviewer must read pinned-rules.md and actively check every rule."
            echo "Use golden-review.md only for test/golden changes and performance-audit.md"
            echo "only for SFPI, raw TTI, or otherwise performance-sensitive kernel changes."
            echo
            echo "Before final filtering and posting, read conventions.md once and apply it to"
            echo "all output. Every surviving finding must be introduced by this PR, actionable,"
            echo "deduplicated against existing review comments, and anchored to the smallest"
            echo "relevant changed line or contiguous right-side range, with file/line fallback."
            echo
            echo "Keep all worktrees read-only. Never use Write/Edit or temporary files. Use"
            echo "Bash only for one direct gh api command, the intake agent's one complete"
            echo "gh pr diff call, or an allowlisted read-only"
            echo "git diff/show/log/rev-parse command per call, with no pipes, redirects, shell"
            echo "composition, substitution, or inline environment assignment. Never run"
            echo "find / or read Claude execution/tool-result files. Repeat these constraints"
            echo "and the exact revision paths in every delegated Task prompt."
            echo "Run git commands directly from the orchestration checkout root. Never use"
            echo "git -C or cd; exact commits are already available in the root object database."
          } > "$out"
          echo "Prepared compact coordination prompt ($(wc -w < "$out") words); validated ${#required[@]} knowledge files"

      # 5. Run the repository-local review command against the PR. It posts via
      #    the authenticated gh CLI instead of the unavailable inline-comment
      #    MCP server.
      - name: Record review start time
        run: echo "LLK_REVIEW_STARTED_AT=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"

      - name: Run /llk-code-review
        id: llk_code_review
        uses: anthropics/claude-code-action@v1
        env:
          # GITHUB_TOKEN is the per-run automatic token; its write scope comes
          # from the job's `permissions:` block (pull-requests/issues: write), so
          # comments post as github-actions[bot] — no user PAT needed.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Real Anthropic API key — sent as x-api-key to api.anthropic.com.
          anthropic_api_key: ${{ secrets.LLK_PR_REVIEW_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          show_full_output: ${{ inputs.debug_output }}
          # The command is versioned with this repository under .claude/commands.
          prompt: "/llk-code-review ${{ github.repository }}/pull/${{ env.PR_NUMBER }} --comment"
          # No --model override: defaults apply, so the command's per-role
          # haiku/sonnet/opus subagents each use their intended model. --effort
          # sets the session reasoning effort (the review command itself takes
          # no effort argument). gh is used for both PR inspection and posting.
          claude_args: |
            --effort ${{ inputs.effort || 'max' }}
            --allowedTools "Agent,Task,Read,Grep,Glob,Skill,Bash(gh api:*),Bash(gh pr diff:*),Bash(git diff:*),Bash(git show:*),Bash(git log:*),Bash(git rev-parse:*),mcp__deepwiki__*,mcp__atlassian__*,mcp__glean_default__*"
            --max-turns 150
            --mcp-config tt_metal/tt-llk/.mcp.json
            --append-system-prompt-file ${{ github.workspace }}/.llk-review-system-prompt.md

      # The execution file can contain private injected knowledge and tool
      # arguments. Emit only aggregate tool counts and static Bash categories;
      # never print commands, arguments, paths, prompts, or file contents.
      - name: Report Claude permission denials
        if: always() && steps.llk_code_review.outputs.execution_file != ''
        env:
          CLAUDE_EXECUTION_FILE: ${{ steps.llk_code_review.outputs.execution_file }}
        run: |
          set -euo pipefail

          if [ ! -f "$CLAUDE_EXECUTION_FILE" ]; then
            echo "::warning::Claude execution file was not found; denial summary is unavailable"
            exit 0
          fi

          if ! denial_summary="$(
            jq -r '
              def denials:
                .[]
                | select(.type == "result")
                | .permission_denials[]?;

              def command:
                .tool_input.command? // "";

              def bash_prefix_category:
                command as $command
                | if $command == "" then
                    "empty-or-unavailable"
                  elif ($command | test("^[[:space:]]*[A-Za-z_][A-Za-z0-9_]*=")) then
                    "inline-environment-assignment"
                  elif ($command | test("^[[:space:]]*gh[[:space:]]+api([[:space:]]|$)")) then
                    "allowlisted-gh-api"
                  elif ($command | test("^[[:space:]]*gh[[:space:]]+pr[[:space:]]+diff([[:space:]]|$)")) then
                    "allowlisted-intake-pr-diff"
                  elif ($command | test("^[[:space:]]*git[[:space:]]+(diff|show|log|rev-parse)([[:space:]]|$)")) then
                    "allowlisted-read-only-git"
                  elif ($command | test("^[[:space:]]*find([[:space:]]|$)")) then
                    "forbidden-find"
                  elif ($command | test("^[[:space:]]*(grep|rg|diff|head|tail|sed|awk|cat|ls|wc|nl|cut|sort|uniq|tree|basename|dirname)([[:space:]]|$)")) then
                    "unlisted-read-command"
                  else
                    "unrecognized-or-unlisted"
                  end;

              [
                (denials | ["tool", (.tool_name // "unknown")]),
                (denials
                  | select(.tool_name == "Bash")
                  | ["bash-prefix", bash_prefix_category]),
                (denials
                  | select(.tool_name == "Bash" and (command | test("&&|\\|\\||[;|\\n]|(^|[^&])&([^&]|$)")))
                  | ["bash-feature", "compound-or-separated"]),
                (denials
                  | select(.tool_name == "Bash" and (command | test("[<>]")))
                  | ["bash-feature", "contains-redirection-character"]),
                (denials
                  | select(.tool_name == "Bash" and (command | test("^[[:space:]]*[A-Za-z_][A-Za-z0-9_]*=")))
                  | ["bash-feature", "inline-environment-assignment"]),
                (denials
                  | select(.tool_name == "Bash" and (command | length > 10000))
                  | ["bash-feature", "over-10000-characters"])
              ]
              | sort
              | group_by(.)
              | .[]
              | "\(.[0][0])\t\(.[0][1])\t\(length)"
            ' "$CLAUDE_EXECUTION_FILE"
          )"; then
            echo "::warning::Could not parse Claude permission denials"
            exit 0
          fi

          if [ -z "$denial_summary" ]; then
            echo "Claude reported no permission denials"
            exit 0
          fi

          echo "Claude permission denials (aggregate categories only):"
          while IFS=$'\t' read -r category label count; do
            echo "${category}/${label}: ${count}"
          done <<< "$denial_summary"

      # When the session ends with is_error:true, the result text is normally a
      # bare API/transport error ("API Error: 429 ...", "overloaded", ...) and
      # is the only clue to why the run died. Print it only when it matches a
      # known API-error shape, truncated; anything else could be session
      # content, so emit just its subtype and length and keep the text out of
      # the public log.
      - name: Report Claude error result
        if: always() && steps.llk_code_review.outputs.execution_file != ''
        env:
          CLAUDE_EXECUTION_FILE: ${{ steps.llk_code_review.outputs.execution_file }}
        run: |
          set -euo pipefail

          if [ ! -f "$CLAUDE_EXECUTION_FILE" ]; then
            exit 0
          fi

          if ! error_entry="$(
            jq -c '
              [.[] | select(.type == "result")] | last // empty
              | select(.is_error == true)
              | {subtype: (.subtype // "unknown"), text: (.result // "")}
            ' "$CLAUDE_EXECUTION_FILE"
          )"; then
            echo "::warning::Could not parse Claude result entry"
            exit 0
          fi

          if [ -z "$error_entry" ]; then
            echo "Claude result reported no error"
            exit 0
          fi

          subtype="$(jq -r '.subtype' <<< "$error_entry")"
          text="$(jq -r '.text' <<< "$error_entry")"
          echo "Claude error result: subtype=${subtype}, text length=${#text}"

          snippet="$(printf '%s' "$text" | head -c 400)"
          if printf '%s' "$snippet" | grep -qiE '^(API Error|Error:)|overloaded|rate.?limit|too many (concurrent )?requests|credit balance|invalid x-api-key|authentication_error|billing|quota|prompt is too long|context window|request timed out|econnreset|fetch failed'; then
            echo "Claude error result text (first 400 chars):"
            printf '%s\n' "$snippet"
          else
            echo "Claude error result text withheld: does not match a known API error shape"
          fi

      # Re-read GitHub instead of trusting process success. A session that exits
      # cleanly without executing its posting contract is a failed review; never
      # mask that failure by manufacturing a workflow-level "No issues found".
      - name: Verify review output was posted
        if: steps.llk_code_review.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          current_head="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.sha')"
          if [ "$current_head" != "$LLK_PR_HEAD_SHA" ]; then
            echo "::error::PR head changed during review; discard this result and dispatch a fresh review"
            exit 1
          fi

          for attempt in 1 2 3; do
            inline_count="$(
              gh api \
                "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/comments?since=${LLK_REVIEW_STARTED_AT}&per_page=100" \
                --jq '[.[] | select(.user.login == "github-actions[bot]")] | length'
            )"
            issue_count="$(
              gh api \
                "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments?since=${LLK_REVIEW_STARTED_AT}&per_page=100" \
                --jq '[.[] | select(.user.login == "github-actions[bot]")] | length'
            )"
            if (( inline_count + issue_count > 0 )); then
              echo "LLK review posted ${inline_count} inline and ${issue_count} issue-level comment(s)"
              exit 0
            fi
            if (( attempt < 3 )); then
              sleep 2
            fi
          done

          echo "::error::Claude completed without posting any LLK review output"
          exit 1

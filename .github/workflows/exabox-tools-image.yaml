name: Build and publish exabox-tools image

# Builds and publishes ghcr.io/tenstorrent/tt-metal/exabox-tools (recover.sh,
# run_cluster_validation, fabric system health check). See dockerfile/exabox_tools/Dockerfile.
#
# Separate from upstream-tests.yaml so the image can be rebuilt when that workflow is red.
# Manual dispatch only, no schedule or push trigger: every new image is a multi-GB pull on
# each host that runs a job, so it is built when someone wants one.
#
# Every run pushes exabox-tools:<git describe> (one per commit; rebuilding a commit
# re-pushes it). Ticking "make latest" also moves exabox-tools:latest.

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      make-latest:
        required: false
        type: boolean
        default: false
        description: Make latest - also tag this build as exabox-tools:latest

concurrency:
  group: exabox-tools-image-${{ github.ref }}
  cancel-in-progress: false

env:
  EXABOX_TOOLS_IMAGE_NAME: ghcr.io/tenstorrent/tt-metal/exabox-tools

jobs:
  check-harbor:
    uses: ./.github/workflows/check-harbor.yaml
  build-artifact:
    needs: check-harbor
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/build-artifact.yaml
    permissions:
      contents: read
      packages: write
    secrets: inherit
    with:
      harbor-prefix: ${{ needs.check-harbor.outputs.harbor-prefix }}
      platform: "Ubuntu 22.04"
      build-type: Release
      build-wheel: true
      build-umd-tests: true
      tracy: true
  build-and-push:
    needs: build-artifact
    permissions:
      packages: write
      contents: read
    runs-on: tt-ubuntu-2204-large-stable
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        timeout-minutes: 20
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Download build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build-artifact.outputs.build-artifact-name }}
      - name: Extract build artifact
        run: |
          mkdir -p _tt-metal
          tar --zstd -xf ttm_any.tar.zst -C _tt-metal/
          ls -hal _tt-metal/build/tools/scaleout/run_cluster_validation
      - name: Download Python wheel
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build-artifact.outputs.wheel-artifact-name }}
      - name: Verify wheel exists
        run: ls -la ttnn-*.whl
      - name: Exclude Git metadata from the build context
        run: |
          printf '.git\n**/.git\n' > "$GITHUB_WORKSPACE/.dockerignore"
      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute tags
        id: tags
        run: |
          suffix="$(git describe)"
          TAGS="${{ env.EXABOX_TOOLS_IMAGE_NAME }}:${suffix}"
          if [ "${{ inputs.make-latest }}" = "true" ]; then
            TAGS="${TAGS}"$'\n'"${{ env.EXABOX_TOOLS_IMAGE_NAME }}:latest"
          fi
          {
            echo "tags<<EOF"
            echo "$TAGS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "suffix=${suffix}" >> "$GITHUB_OUTPUT"
      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          file: dockerfile/exabox_tools/Dockerfile
          platforms: linux/amd64
          pull: true
          tags: ${{ steps.tags.outputs.tags }}
          context: ${{ github.workspace }}
          build-args: |
            TT_METAL_DEV_IMAGE=${{ needs.build-artifact.outputs.dev-docker-image }}
            TT_METAL_COMMIT_SHA=${{ github.sha }}
            IMAGE_VERSION=${{ steps.tags.outputs.suffix }}
          outputs: |
            type=registry,push=true,compression=zstd,compression-level=3,force-compression=true,oci-mediatypes=true
      - name: Summary
        run: |
          {
            echo "## exabox-tools image"
            echo
            echo "Commit: \`${{ github.sha }}\` (\`${{ github.ref_name }}\`)"
            echo
            echo '```'
            echo "${{ steps.tags.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

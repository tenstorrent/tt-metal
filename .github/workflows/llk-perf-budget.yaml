name: "LLK perf time budget"
# What a non-speed-of-light LLK perf gate would cost, measured in CI rather than
# on a reserved lab machine, so the run itself is the evidence: one URL, a
# summary table, and the per-job artefacts behind it.
#
# One job = one card. That job measures every requested run-type selection in
# sequence on that card, each with a cold build, so the whole matrix is four
# cards -- two per architecture -- rather than one card per configuration. The
# perf suite runs in a single group, so each measurement covers the whole sweep,
# and the producer (compile) and consumer (device measure) phases are timed
# separately by tt_metal/tt-llk/tests/run_llk_perf_budget.sh.
#
# It shares no code path with the nightly llk-perf.yaml beyond the docker image
# and the matrix helpers, so a change here cannot affect the nightly, and it
# publishes nothing to the perf warehouse.
#
# HOW TO START A RUN
#
# workflow_dispatch only works once this file is on the default branch, which
# is why the push trigger exists: a push to the measurement branch can produce
# a real run, and a real run URL, before anything is merged. A push starts
# nothing unless its commit message carries a marker, so an ordinary push to
# the branch cannot occupy the lab by accident:
#
#   [budget-run]    both architectures, two cards each, four configurations per
#                   card, unsharded
#   [budget-shards] the same four configurations split across FIVE workers per
#                   architecture, to measure what sharding buys
#
# Two counts can be named in the message as well, in any combination with the
# markers above:
#
#   [budget-shards=2]     split across two workers instead
#   [budget-producer=15]  give the compile phase 15 xdist workers, not 10
#
# A count alone does not start a run unless it is a [budget-shards...] one:
# pair [budget-producer=15] with [budget-run] to change the worker count of an
# otherwise ordinary run.
#   [budget-smoke]  one job: one Blackhole card, L1_TO_L1 alone. Use this first
#                   after touching the workflow or the runner script.
#
# Dispatch inputs, when present, override all of them, and expose shard counts
# the markers do not (2) plus the producer's worker count.

on:
  push:
    branches:
      - "nstojictt/llk-perf-budget-ci"
  workflow_dispatch:
    inputs:
      architecture:
        description: "Architecture to measure"
        required: true
        default: all
        type: choice
        options:
          - all
          - wormhole
          - blackhole
      configs:
        description: "Run-type selections each card measures, in order, comma separated: full, isolates, l1, isolates_l1"
        required: false
        default: "full,isolates,l1,isolates_l1"
        type: string
      cards:
        description: "At one shard: how many cards per architecture measure the whole suite, as a comma-separated list of labels (1,2)."
        required: false
        default: "1,2"
        type: string
      shards:
        description: "Split the suite across this many workers per architecture. 1 measures the whole suite in one job."
        required: false
        default: "1"
        type: choice
        options:
          - "1"
          - "2"
          - "5"
      producer-workers:
        description: "xdist workers for the compile phase. The nightly uses 10; the consumer is always 15."
        required: false
        default: "10"
        type: string
      speed-of-light:
        description: "Measure with --speed-of-light instead (the nightly's mode)"
        required: false
        default: false
        type: boolean

permissions:
  checks: write
  contents: read
  packages: write

concurrency:
  # Scoped to the commit, not the branch: two measurement runs with different
  # shard counts are different experiments and must be allowed to run at the
  # same time. A re-run of the same commit still supersedes itself.
  group: ${{ github.workflow }}-${{ inputs.architecture || 'push' }}-${{ github.sha }}
  cancel-in-progress: true

env:
  LLK_PATH: tt_metal/tt-llk

jobs:
  build-images:
    name: "Docker setup"
    # A push runs only when its commit message asks for it, so an ordinary push
    # to the measurement branch cannot occupy the lab by accident.
    if: ${{ github.event_name == 'workflow_dispatch'
      || contains(github.event.head_commit.message, '[budget-run]')
      || contains(github.event.head_commit.message, '[budget-shards')
      || contains(github.event.head_commit.message, '[budget-smoke]') }}
    uses: ./.github/workflows/build-docker-artifact.yaml
    secrets: inherit

  load-test-matrix:
    if: ${{ github.event_name == 'workflow_dispatch'
      || contains(github.event.head_commit.message, '[budget-run]')
      || contains(github.event.head_commit.message, '[budget-shards')
      || contains(github.event.head_commit.message, '[budget-smoke]') }}
    runs-on: ubuntu-slim
    needs: [build-images]
    outputs:
      matrix: ${{ steps.trim.outputs.matrix }}
      configs: ${{ steps.trim.outputs.configs }}
      shards: ${{ steps.trim.outputs.shards }}
      producer_workers: ${{ steps.trim.outputs.producer_workers }}
    env:
      TESTS_YAML_PATH: ./tests/pipeline_reorg/llk_perf_budget_tests.yaml
    steps:
      - name: Checkout the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        timeout-minutes: 20
        with:
          sparse-checkout: |
            .github
            tests/pipeline_reorg
          sparse-checkout-cone-mode: true
      - name: Install dependencies
        run: pip3 install PyYAML
      - name: Verify test timeouts against budget
        run: |
          set -e
          python3 .github/scripts/utils/verify_time_budget.py \
            ${{ env.TESTS_YAML_PATH }} \
            ./.github/time_budget.yaml \
            "perf"
      - name: Build test matrix
        id: build-matrix
        env:
          # Dispatch inputs win. A push has none, so the marker decides.
          ARCHITECTURE: ${{ inputs.architecture
            || (contains(github.event.head_commit.message, '[budget-smoke]')
            && 'blackhole' || 'all') }}
        run: |
          case "$ARCHITECTURE" in
            all)       ENABLED_SKUS="ALL_SKUS_IN_TESTS" ;;
            wormhole)  ENABLED_SKUS="wh_n150_civ2" ;;
            blackhole) ENABLED_SKUS="bh_p150b_civ2" ;;
            *)
              echo "::error::Unsupported architecture '$ARCHITECTURE'"
              exit 1
              ;;
          esac

          python3 .github/scripts/utils/prepare_test_matrix.py \
            ${{ env.TESTS_YAML_PATH }} \
            "$ENABLED_SKUS" \
            ./.github/sku_config.yaml
      - name: Keep the workers this run needs, and validate the configurations
        id: trim
        env:
          MATRIX: ${{ steps.build-matrix.outputs.matrix }}
          CONFIGS: ${{ inputs.configs
            || (contains(github.event.head_commit.message, '[budget-smoke]')
            && 'l1' || 'full,isolates,l1,isolates_l1') }}
          CARDS: ${{ inputs.cards
            || (contains(github.event.head_commit.message, '[budget-smoke]')
            && '1' || '1,2') }}
          # Shard and worker counts come from the dispatch inputs when there
          # are any, else from the commit message, which can carry
          # [budget-shards=2] and [budget-producer=15]. Parsed in python rather
          # than in an expression, so one mechanism covers every value instead
          # of one marker per number.
          SHARDS_INPUT: ${{ inputs.shards }}
          PRODUCER_INPUT: ${{ inputs.producer-workers }}
          HEAD_MSG: ${{ github.event.head_commit.message }}
        run: |
          # A row is a worker. At one shard a worker measures the whole suite,
          # so the workers are the cards and CARDS says how many; above one
          # shard, worker k measures shard k and the shard count says how many.
          # Configurations are not rows -- every worker measures all of them in
          # sequence -- but they are validated here all the same, because a typo
          # would otherwise surface an hour into a job holding a card.
          FILTER='import json, os, re, sys
          KNOWN = ["full", "isolates", "l1", "isolates_l1"]
          rows = json.loads(os.environ["MATRIX"])
          configs = [c.strip() for c in os.environ["CONFIGS"].split(",") if c.strip()]
          cards = [c.strip() for c in os.environ["CARDS"].split(",") if c.strip()]
          msg = os.environ.get("HEAD_MSG", "")
          def number(name, given, default):
              if given.strip():
                  return int(given)
              found = re.search(r"\[budget-" + name + r"=(\d+)\]", msg)
              if found:
                  return int(found.group(1))
              return default
          shards = number("shards", os.environ.get("SHARDS_INPUT", ""),
                          5 if "[budget-shards]" in msg else 1)
          producer_workers = number("producer", os.environ.get("PRODUCER_INPUT", ""), 10)
          if shards < 1 or producer_workers < 1:
              sys.exit("shards and producer workers must be positive")
          unknown = [c for c in configs if c not in KNOWN]
          if unknown:
              sys.exit("unknown config(s) %s; valid: %s" % (unknown, KNOWN))
          if not configs:
              sys.exit("no configuration requested")
          wanted = shards if shards > 1 else len(cards)
          slots = sorted({int(r["slot"]) for r in rows})
          if wanted > len(slots):
              sys.exit("%d workers asked for, but the matrix declares %d slots per "
                       "architecture" % (wanted, len(slots)))
          keep = [r for r in rows if int(r["slot"]) <= wanted]
          if not keep:
              sys.exit("no matrix row left for %d worker(s)" % wanted)
          for r in keep:
              # At one shard there is no group to be in: the worker measures
              # everything, and its slot is only a card label.
              r["group"] = r["slot"] if shards > 1 else 1
              r["shards"] = shards
          what = ("shard %s of %d" % ("k", shards)) if shards > 1 else "the whole suite"
          print("%d job(s), each measuring %s of %s:"
                % (len(keep), what, ", ".join(configs)), file=sys.stderr)
          for r in keep:
              print("  %s -- group %s/%s" % (r["name"], r["group"], shards),
                    file=sys.stderr)
          print("matrix=" + json.dumps(keep))
          print("configs=" + ",".join(configs))
          print("shards=%d" % shards)
          print("producer_workers=%d" % producer_workers)'
          python3 -c "$FILTER" >> "$GITHUB_OUTPUT"

  llk-perf-budget-exec:
    needs: [load-test-matrix, build-images]
    if: ${{ needs.load-test-matrix.outputs.matrix != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        test-group: ${{ fromJSON(needs.load-test-matrix.outputs.matrix) }}
    name: ${{ matrix.test-group.name }}
    runs-on: ${{ matrix.test-group.runs_on }}
    timeout-minutes: ${{ matrix.test-group.timeout }}
    container:
      image: ${{ needs.build-images.outputs.llk-ci-tag }}
      options: "--rm --device /dev/tenstorrent --ulimit nofile=4096:4096"
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        timeout-minutes: 20
      - name: Install SFPI
        shell: bash
        working-directory: ${{ env.LLK_PATH }}
        run: |
          cd tests
          ./setup_testing_env.sh
          cd ..
      - name: Set CHIP_ARCH and the run tag
        shell: bash
        env:
          RUN_ON_LABELS: ${{ join(matrix.test-group.runs_on, ' ') }}
        run: |
          RUN_LABEL="${RUN_ON_LABELS%% *}"
          if [[ "$RUN_LABEL" =~ N150 ]]; then
            CHIP_ARCH=wormhole
          elif [[ "$RUN_LABEL" =~ P150 ]]; then
            CHIP_ARCH=blackhole
          else
            CHIP_ARCH=unknown
          fi
          echo "CHIP_ARCH=$CHIP_ARCH" >> "$GITHUB_ENV"
          echo "PERF_RUN_TAG=${{ github.run_id }}-$CHIP_ARCH-${{ strategy.job-index }}" >> "$GITHUB_ENV"
          # One name per worker. At one shard the worker is a card, so the
          # slot reads as the card label; above one shard it is the group index.
          echo "SLUG=$CHIP_ARCH-worker${{ matrix.test-group.slot }}-of${{ matrix.test-group.shards }}" >> "$GITHUB_ENV"
      - name: Record which machine and card this landed on
        shell: bash
        run: |
          echo "runner:  ${RUNNER_NAME:-unknown}"
          echo "host:    $(hostname)"
          echo "devices: $(ls /dev/tenstorrent 2>/dev/null | tr '\n' ' ')"
          # The ceiling the producer's xdist workers compete for -- and whether
          # it is the machine's or the container's.
          echo "CPUs:    $(nproc) available, $(grep -c '^processor' /proc/cpuinfo) on the host"
          echo "quota:   $(cat /sys/fs/cgroup/cpu.max 2>/dev/null || echo unknown)"
          tt-smi -ls 2>/dev/null || echo "tt-smi not available in this image"
      - name: Measure the budget
        shell: bash
        working-directory: ${{ env.LLK_PATH }}
        env:
          # A push carries no inputs, so this falls through to false, which is
          # the mode being measured.
          SPEED_OF_LIGHT: ${{ inputs.speed-of-light || false }}
          BUDGET_CARD: ${{ matrix.test-group.slot }}
          # Every configuration this worker measures, in order.
          CONFIGS: ${{ needs.load-test-matrix.outputs.configs }}
          # Which shard, and out of how many. One means the whole suite.
          BUDGET_GROUP: ${{ matrix.test-group.group }}
          BUDGET_SHARDS: ${{ needs.load-test-matrix.outputs.shards }}
          # The nightly's compile parallelism, and the knob for whether it is
          # leaving the runner's CPUs idle.
          PRODUCER_WORKERS: ${{ needs.load-test-matrix.outputs.producer_workers }}
        run: |
          ${{ matrix.test-group.cmd }}

      - name: Upload the budget summaries
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: always()
        with:
          name: budget-summary-${{ env.SLUG }}
          path: ${{ env.LLK_PATH }}/tests/python_tests/perf_budget/summary-*.json
          if-no-files-found: warn

      - name: Upload performance data
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: always() && hashFiles('tt_metal/tt-llk/perf_data/runs/**') != ''
        with:
          name: budget-perf-data-${{ env.SLUG }}
          path: ${{ env.LLK_PATH }}/perf_data/runs/

      - name: Upload JUnit reports
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: always()
        with:
          name: budget-junit-${{ env.SLUG }}
          path: ${{ env.LLK_PATH }}/tests/python_tests/pytest-report-*.xml
          if-no-files-found: warn

      - name: Upload test logs on failure
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: failure()
        with:
          name: budget-logs-${{ env.SLUG }}
          path: |
            ${{ env.LLK_PATH }}/tests/python_tests/test_run*.log
            ${{ env.LLK_PATH }}/tests/python_tests/test_errors*.log
          if-no-files-found: warn

  llk-perf-budget-summary:
    name: "Budget summary"
    needs: [llk-perf-budget-exec]
    # always(), so a failed measurement still gets a table -- but not on a push
    # that asked for nothing, where the whole workflow is skipped.
    if: ${{ always() && (github.event_name == 'workflow_dispatch'
      || contains(github.event.head_commit.message, '[budget-run]')
      || contains(github.event.head_commit.message, '[budget-shards')
      || contains(github.event.head_commit.message, '[budget-smoke]')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Download every job's summary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: budget-summary-*
          path: summaries
        continue-on-error: true
      - name: Build the table
        shell: bash
        run: |
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import glob, json

          rows = []
          for path in sorted(glob.glob("summaries/**/summary-*.json", recursive=True)):
              with open(path) as f:
                  rows.append(json.load(f))

          print("# LLK perf time budget\n")
          if not rows:
              print("No job produced a summary. Check the job logs.")
              raise SystemExit(0)

          def hms(s):
              return "%d:%02d:%02d" % (s // 3600, (s % 3600) // 60, s % 60)

          order = {"full": 0, "isolates": 1, "isolates_l1": 2, "l1": 3}
          first = rows[0]
          sol = "on" if first.get("speed_of_light") else "off"
          shards = int(first.get("n_groups", 1))
          print(f"Speed of light **{sol}**, cold build, "
                f"{'the whole suite in one worker' if shards == 1 else f'the suite split across {shards} workers'}, "
                f"producer `-n {first.get('producer_workers')}`, "
                f"consumer `-n {first.get('consumer_workers')}`, "
                f"host CPUs {first.get('nproc')}.\n")

          label = "card" if shards == 1 else "shard"
          print(f"| arch | config | run types | {label} | producer | consumer | total | rc c/m | runner |")
          print("| --- | --- | --- | --: | --: | --: | --: | --: | --- |")
          for r in sorted(rows, key=lambda r: (r["arch"], order.get(r["config"], 9), str(r["card"]))):
              print("| {arch} | {config} | `{run_types}` | {card} | {producer} | {consumer} "
                    "| **{total}** | {producer_rc}/{consumer_rc} | {runner} |".format(**r))

          groups = {}
          for r in rows:
              groups.setdefault((r["arch"], r["config"]), []).append(r)
          keyed = sorted(groups.items(), key=lambda kv: (kv[0][0], order.get(kv[0][1], 9)))

          if shards == 1:
              # A gate's budget has to hold on the slower card, so what the cards
              # disagree by is part of the answer.
              print("\n## Card-to-card spread\n")
              print("| arch | config | slower total | faster total | spread |")
              print("| --- | --- | --: | --: | --: |")
              for (arch, config), got in keyed:
                  if len(got) < 2:
                      continue
                  totals = sorted(r["total_s"] for r in got)
                  lo, hi = totals[0], totals[-1]
                  pct = (hi - lo) / lo * 100 if lo else 0
                  print(f"| {arch} | {config} | {hms(hi)} | {hms(lo)} | {hms(hi - lo)} ({pct:.1f}%) |")
          else:
              # Sharded: the wall clock a gate pays is the SLOWEST shard, because
              # the shards run at the same time on different cards. The sum is
              # what it costs the lab, and the gap between slowest and mean is
              # how unevenly pytest-split divided the work.
              print(f"\n## What {shards} workers buy\n")
              print("| arch | config | slowest shard | mean shard | card time (sum) | imbalance |")
              print("| --- | --- | --: | --: | --: | --: |")
              for (arch, config), got in keyed:
                  totals = [r["total_s"] for r in got]
                  slowest, mean, total = max(totals), sum(totals) / len(totals), sum(totals)
                  imb = (slowest - mean) / mean * 100 if mean else 0
                  print(f"| {arch} | {config} | **{hms(slowest)}** | {hms(int(mean))} "
                        f"| {hms(total)} | +{imb:.0f}% |")
              print("\nThe gate waits for the slowest shard; the sum is what the lab pays.")

          # What each worker spent in total, which is what this run occupied its
          # card for -- as opposed to what any one configuration would cost a gate.
          print("\n## What each worker spent\n")
          print(f"| arch | {label} | configurations | measured | runner |")
          print("| --- | --: | --: | --: | --- |")
          workers = {}
          for r in rows:
              workers.setdefault((r["arch"], str(r["card"])), []).append(r)
          for (arch, worker), got in sorted(workers.items()):
              spent = sum(r["total_s"] for r in got)
              print(f"| {arch} | {worker} | {len(got)} | {hms(spent)} | {got[0]['runner']} |")

          missing = [r for r in rows if r["producer_rc"] or r["consumer_rc"]]
          if missing:
              print("\n> Measurements with a non-zero pytest exit code are listed above. "
                    "The durations are still real, but a failure can shorten a phase.")
          PY
      - name: Check job results
        uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}

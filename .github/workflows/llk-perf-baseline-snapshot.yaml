name: "LLK perf baseline snapshot"

# Triggered after a commit lands on main
# Captures perf data from the PR that was just merged and uploads it as the new baseline
on:
  push:
    branches:
      - main
    paths:
      - "tt_metal/tt-llk/**"

permissions:
  contents: read

jobs:
  upload-baseline:
    name: "Upload baseline to Snowflake"
    runs-on: ubuntu-slim
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        timeout-minutes: 20
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@0b93645e9e0d6c9882fc7902038978ad1a988142 # v5.0.0
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install pandas pyarrow snowflake-connector-python
          # sshpass is available in most CI environments; if not: apt-get install sshpass

      # Retrieve perf_data from SFTP staging
      - name: Retrieve perf_data from SFTP staging
        env:
          COMMIT_SHA: ${{ github.sha }}
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PASS: ${{ secrets.SFTP_PASSWORD }}
        run: |
          set -e
          mkdir -p perf_data
          echo "Retrieving perf_data from SFTP staging: perf_${COMMIT_SHA}/"

          # Use sshpass + sftp to download from staging
          # Credentials from GitHub secrets (configured by data team)
          sshpass -p "${SFTP_PASS}" sftp -o StrictHostKeyChecking=no \
            "${SFTP_USER}@${SFTP_HOST}:/staging/llk-baselines/perf_${COMMIT_SHA}/" \
            perf_data/ || {
            echo "⚠️  No perf data in staging (commit may not have LLK changes)"
            echo "Exiting gracefully"
            exit 0
          }

          echo "✓ Retrieved perf_data from staging"
          find perf_data -name "*.csv" | wc -l | xargs echo "CSV files:"

      # Convert CSVs to Parquet using existing perf infrastructure
      - name: Convert perf_data to Parquet
        env:
          COMMIT_SHA: ${{ github.sha }}
          ARCH: ${{ matrix.arch || 'wormhole' }}
        run: |
          set -e
          cd tt_metal/tt-llk/tests

          python3 - <<'PYTHON'
          import sys
          import glob
          from pathlib import Path
          from datetime import datetime

          sys.path.insert(0, 'python_tests')
          from helpers.perf.parquet import convert_csvs_to_parquet, stamp_provenance, write_parquet
          from helpers.perf.wide_schema import DB_SCHEMA
          import pandas as pd
          import pyarrow as pa

          # Collect all CSVs from staging
          csv_files = glob.glob('../../../perf_data/**/*.csv', recursive=True)
          csv_files = [f for f in csv_files if not f.endswith('.post.csv')]

          if not csv_files:
            print("⚠️  No CSVs found to convert")
            sys.exit(0)

          print(f"Converting {len(csv_files)} CSV(s) to Parquet")

          # Read all CSVs and concatenate
          frames = []
          for csv_file in csv_files:
            df = pd.read_csv(csv_file, low_memory=False)
            frames.append(df)

          combined = pd.concat(frames, ignore_index=True) if frames else pd.DataFrame()

          # Stamp provenance metadata
          combined = stamp_provenance(
            combined,
            commit_sha='${{ env.COMMIT_SHA }}',
            arch='${{ env.ARCH }}',
            run_id='${{ github.run_id }}',
            timestamp=datetime.utcnow().isoformat() + 'Z',
            pipeline='post_merge'
          )

          # Write Parquet with schema validation
          output_path = f'../../../baseline_${{ env.ARCH }}_${{ env.COMMIT_SHA }}.parquet'
          write_parquet(combined, output_path)

          print(f"✓ Wrote {len(combined)} rows to {output_path}")
          PYTHON

      # Upload baseline to SFTP for data team ingestion
      - name: Upload baseline to SFTP
        env:
          COMMIT_SHA: ${{ github.sha }}
          ARCH: ${{ matrix.arch || 'wormhole' }}
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PASS: ${{ secrets.SFTP_PASSWORD }}
        run: |
          set -e
          PARQUET_FILE="baseline_${ARCH}_${COMMIT_SHA}.parquet"
          SFTP_DEST="/baselines/llk/"

          echo "Uploading ${PARQUET_FILE} to SFTP://${SFTP_USER}@${SFTP_HOST}${SFTP_DEST}"

          # Upload via sftp
          sshpass -p "${SFTP_PASS}" sftp -o StrictHostKeyChecking=no \
            "${SFTP_USER}@${SFTP_HOST}" <<EOF
          cd ${SFTP_DEST}
          put ${PARQUET_FILE}
          ls -lh ${PARQUET_FILE}
          bye
          EOF

          echo "✓ Baseline uploaded to SFTP"
          echo ""
          echo "Data team will:"
          echo "  1. Ingest from ${SFTP_DEST}${PARQUET_FILE}"
          echo "  2. Load into Snowflake baselines table"
          echo "  3. Next PR gate will query this commit as baseline"

      - name: Report status
        if: always()
        run: |
          echo "Post-merge baseline snapshot"
          echo "Commit: ${{ github.sha }}"
          echo "Branch: ${{ github.ref }}"
          echo "If this succeeded, the new baseline is ready for the next PR gate."

name: "[internal] Triage tests impl"

on:
  workflow_call:
    inputs:
      docker-image:
        required: true
        type: string
      prebuilt-image:
        required: false
        type: string
        default: ""
        description: >-
          Env image carrying the source tree and build output at /work. When set,
          the job mounts no /work, checks out only .github, and fetches no
          artifact. Empty falls back to the artifact path, which is what forks and
          a failed bake get.
      build-artifact-name:
        required: true
        type: string
      wheel-artifact-name:
        required: true
        type: string
      enabled-skus:
        required: true
        type: string
      test-category:
        required: false
        type: string
        default: unit
        description: "merge_gate: core triage (merge-gate); unit: hang-report test (L2 nightly). Selects yaml and verify_time_budget.py key."
      enable-watcher:
        description: "Enable watcher"
        default: false
        type: boolean
      enable-lightweight-kernel-asserts:
        description: "Enable lightweight kernel asserts"
        default: false
        type: boolean
      enable-llk-asserts:
        description: "Enable LLK asserts"
        default: false
        type: boolean
      per-test-timeout:
        required: false
        type: string
        default: ""
        description: >-
          Max allowed timeout (minutes) for any individual test SKU entry in the
          tests yaml. Verified during load-test-matrix via verify_time_budget.py.
          Empty skips the per-test ceiling check.
      summary-scope:
        required: false
        type: string
        default: ""
        description: "Discriminator for the AI summaries when the calling workflow is invoked more than once per run"
    outputs:
      matrix:
        description: "Filtered matrix of legs that ran (consumed by ai_summary/run for INFRA_FAILURE reconciliation)"
        value: ${{ jobs.load-test-matrix.outputs.matrix }}

jobs:
  load-test-matrix:
    runs-on: ubuntu-slim
    outputs:
      matrix: ${{ steps.prepare.outputs.matrix }}
    env:
      TESTS_YAML_PATH: ${{ inputs.test-category == 'merge_gate' && './tests/pipeline_reorg/triage_merge_gate_tests.yaml' || './tests/pipeline_reorg/triage_tests.yaml' }}
    steps:
      - name: Checkout the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        timeout-minutes: 20
        with:
          sparse-checkout: |
            .github
            tests/pipeline_reorg
          sparse-checkout-cone-mode: true
      - name: Install dependencies
        run: pip3 install PyYAML
      - name: Verify test timeouts against budget
        run: |
          set -euo pipefail
          echo "Verifying that timeouts defined in tests.yaml are within the allowed limits..."
          extra=()
          if [ -n "${{ inputs.per-test-timeout }}" ]; then
            extra+=(--max-per-test-timeout "${{ inputs.per-test-timeout }}")
          fi
          python3 .github/scripts/utils/verify_time_budget.py \
            ${{ env.TESTS_YAML_PATH }} \
            ./.github/time_budget.yaml \
            "${{ inputs.test-category }}" \
            "${extra[@]}"
      - name: Build unified test matrix based on enabled SKUs
        id: prepare
        run: |
          python3 .github/scripts/utils/prepare_test_matrix.py \
            ${{ env.TESTS_YAML_PATH }} \
            "${{ inputs.enabled-skus }}" \
            ./.github/sku_config.yaml \
            --event "${{ github.event_name }}"

  triage-tests:
    needs: load-test-matrix
    if: ${{ needs.load-test-matrix.outputs.matrix != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        test-group: ${{ fromJson(needs.load-test-matrix.outputs.matrix) }}
    name: ${{ matrix.test-group.name }}
    runs-on: ${{ matrix.test-group.runs_on }}
    container:
      image: ${{ inputs.prebuilt-image || inputs.docker-image || 'docker-image-unresolved!' }}
      env:
        LOGURU_LEVEL: INFO
        TT_LOGGER_LEVEL: warn
        # /work/ttnn because the image installs no wheel: /work/ttnn is a namespace
        # dir and the package is /work/ttnn/ttnn. /work/tools carries the `tracy`
        # module, which _ttnn imports during init on a tracy-enabled build, and the
        # L2 nightly builds with tracy on. Missing it fails as "error while
        # initializing the extension", naming neither tracy nor the path.
        PYTHONPATH: /work:/work/ttnn:/work/tools
        TT_METAL_HOME: /work
        ARCH_NAME: ${{ contains(matrix.test-group.sku, 'bh_') && 'blackhole' || 'wormhole_b0' }}
        GTEST_OUTPUT: xml:/work/generated/test_reports/
        LSAN_OPTIONS: suppressions=/usr/share/tt-metalium/lsan.supp
        TT_METAL_RESET_DEVICE_AFTER_HANG: "1"
      volumes:
        # The image owns /work, so no bind mount: one would mask the payload. A
        # single-path entry is an anonymous volume on an unused path.
        - ${{ inputs.prebuilt-image != '' && '/no_work_mount' || format('{0}/docker-job:/work', github.workspace) }} # Subdir to workaround https://github.com/actions/runner/issues/691
        - /dev/hugepages-1G:/dev/hugepages-1G
      options: "--device /dev/tenstorrent -e TT_GH_CI_INFRA"
    defaults:
      run:
        shell: bash
        working-directory: /work # https://github.com/actions/runner/issues/878
    steps:
      - name: 🧬 Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        timeout-minutes: 20
        with:
          # With an image the source is already at /work; the workspace copy only
          # has to satisfy `uses: ./docker-job/...`, which resolves against it.
          submodules: ${{ inputs.prebuilt-image == '' && 'recursive' || 'false' }}
          sparse-checkout: ${{ inputs.prebuilt-image != '' && '.github' || '' }}
          path: docker-job
      - name: ⬇️  Setup Job
        uses: ./docker-job/.github/actions/setup-job
        timeout-minutes: 10
        with:
          build-artifact-name: ${{ inputs.build-artifact-name }}
          wheel-artifact-name: ${{ inputs.wheel-artifact-name }}
          env-from-image: ${{ inputs.prebuilt-image != '' }}
          enable-watcher: ${{ inputs.enable-watcher }}
          enable-lightweight-kernel-asserts: ${{ inputs.enable-lightweight-kernel-asserts }}
          enable-llk-asserts: ${{ inputs.enable-llk-asserts }}
          auto-triage: false # Disable auto-triage because we need to run triage tests explicitly
      - name: ${{ matrix.test-group.name }}
        timeout-minutes: ${{ matrix.test-group.timeout }}
        uses: ./docker-job/.github/actions/run-with-log
        with:
          log-file: generated/test_logs/${{ matrix.test-group.name }}.log
          run: |
            mkdir -p generated/test_reports
            uv pip install -r tools/triage/requirements.txt
            echo "${{ matrix.test-group.cmd }}"
            ${{ matrix.test-group.cmd }}
      - uses: tenstorrent/tt-metal/.github/actions/upload-artifact-with-job-uuid@main
        timeout-minutes: 10
        if: ${{ !cancelled() }}
        with:
          prefix: "test_reports_"
      - name: Generate test annotations on failure
        uses: tenstorrent/tt-metal/.github/actions/generate-gtest-failure-message@main
        if: ${{ failure() }}
      - name: 🤖 AI job summary
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: tenstorrent/tt-github-actions/.github/actions/ai_summary/job@main
        with:
          config: |
            {
              "model": "${{ vars.AI_SUMMARY_MODEL }}",
              "workspace": "/work",
              "input_dirs": ["generated/test_logs"],
              "output_dir": "generated/ai_summaries",
              "scope": "${{ inputs.summary-scope }}",
              "authoritative_job_status": ${{ matrix.test-group.authoritative_job_status }}
            }
          api-key: ${{ secrets.TT_CHAT_API_KEY }}
          api-url: ${{ secrets.TT_CHAT_URL }}
          job-name: ${{ matrix.test-group.name }}

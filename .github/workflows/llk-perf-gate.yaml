name: "LLK perf gate"

on:
  pull_request:
    types: [labeled, synchronize]
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:
    inputs:
      perf_run_id:
        description: "Gate this run's perf artifacts (blank = measure the nightly suite now)"
        required: false
        type: string
      baseline_run_id:
        description: "Compare against this run's artifacts (blank = the warehouse baseline, nightly mode)"
        required: false
        type: string
      baseline_pipeline:
        description: "Nightly mode: warehouse baseline, 'baseline' (pinned) or 'nightly' (previous night)"
        required: false
        default: baseline
        type: string
      arch:
        description: "Architecture to gate on"
        required: false
        default: all
        type: choice
        options:
          - all
          - wormhole
          - blackhole
      run_types:
        description: "Comma-separated run types to compare"
        required: false
        default: L1_TO_L1
        type: string
      pr_number:
        description: "PR to name in the report (labelling only; nothing is posted to it)"
        required: false
        type: string
      placement_run_id:
        description: "Stage 2 without the test limit, for this PR gate run's stage-1 regressions (posts to its PR)"
        required: false
        type: string
permissions:
  actions: read
  contents: read
  checks: write
  packages: write
  pull-requests: write

env:
  # Stage 2 re-measures at most this many tests per arch, so its job stays short; see placement_check.py.
  PLACEMENT_CAP: "1000"

concurrency:
  group: llk-perf-gate-${{ github.event.pull_request.number || github.run_id }}-${{ (github.event.action == 'synchronize' || github.event.label.name == 'llk-perf-gate') && 'gate' || github.run_id }}
  cancel-in-progress: true

jobs:
  branch-point:
    name: "Find the branch point"
    if: >-
      github.event_name == 'pull_request' && (
        github.event.pull_request.head.repo.full_name == github.repository &&
        (
          (github.event.action == 'labeled' && github.event.label.name == 'llk-perf-gate') ||
          (github.event.action == 'synchronize'
           && contains(github.event.pull_request.labels.*.name, 'llk-perf-gate'))
        )
      )
    runs-on: ubuntu-slim
    outputs:
      sha: ${{ steps.find.outputs.sha }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2 cachew: keep
        timeout-minutes: 20
        with:
          fetch-depth: 0
      - name: Find the branch point
        id: find
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          git fetch --no-tags origin "$BASE_REF"
          SHA=$(git merge-base "origin/${BASE_REF}" "$HEAD_SHA")
          echo "Comparing ${HEAD_SHA} against its branch point ${SHA}"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

  measure-branch-point:
    name: "Measure the branch point on ${{ matrix.arch }}"
    needs: branch-point
    strategy:
      fail-fast: false
      matrix:
        arch: [blackhole, wormhole]
    uses: ./.github/workflows/llk-perf-impl.yaml
    with:
      architecture: ${{ matrix.arch }}
      ref: ${{ needs.branch-point.outputs.sha }}
      artifact-suffix: "-base"
      speed-of-light: false
      perf-run-types: L1_TO_L1
      upload-to-warehouse: false
      pipeline: pr
    secrets: inherit

  measure:
    name: "Measure the PR head on ${{ matrix.arch }}"
    if: >-
      github.event_name == 'pull_request' &&
      (
        github.event.pull_request.head.repo.full_name == github.repository &&
        (
          (github.event.action == 'labeled' && github.event.label.name == 'llk-perf-gate') ||
          (github.event.action == 'synchronize'
           && contains(github.event.pull_request.labels.*.name, 'llk-perf-gate'))
        )
      )
    strategy:
      fail-fast: false
      matrix:
        arch: [blackhole, wormhole]
    uses: ./.github/workflows/llk-perf-impl.yaml
    with:
      architecture: ${{ matrix.arch }}
      ref: ${{ github.event.pull_request.head.sha }}
      artifact-suffix: "-head"
      speed-of-light: false
      perf-run-types: ${{ inputs.run_types || 'L1_TO_L1' }}
      upload-to-warehouse: false
      pipeline: pr
    secrets: inherit

  llk-perf-gate:
    name: "LLK perf regression gate (${{ matrix.arch }})"
    needs: [branch-point, measure, measure-branch-point]
    if: >-
      ${{ !cancelled() &&
      (
        (github.event_name == 'workflow_dispatch' && inputs.baseline_run_id != '') ||
        (
          github.event.pull_request.head.repo.full_name == github.repository &&
          (
            (github.event.action == 'labeled' && github.event.label.name == 'llk-perf-gate') ||
            (github.event.action == 'synchronize'
             && contains(github.event.pull_request.labels.*.name, 'llk-perf-gate'))
          )
        )
      ) }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.arch == 'wormhole' && '[{"arch":"wormhole","threshold":"0.02"}]' || inputs.arch == 'blackhole' && '[{"arch":"blackhole","threshold":"0.02"}]' || '[{"arch":"blackhole","threshold":"0.02"},{"arch":"wormhole","threshold":"0.02"}]') }}
    uses: ./.github/workflows/llk-perf-gate-impl.yaml
    with:
      arch: ${{ matrix.arch }}
      run_types: ${{ inputs.run_types || 'L1_TO_L1' }}
      threshold: ${{ matrix.threshold }}
      min_cycles: "30"
      fail_on_regression: false
      measure_result: >-
        ${{ needs.measure.result }},${{ needs.measure-branch-point.result }}
      current_artifact_pattern: >-
        ${{ github.event_name == 'pull_request'
            && format('perf-data-{0}-*-head', matrix.arch) || '' }}
      baseline_artifact_pattern: >-
        ${{ github.event_name == 'pull_request'
            && format('perf-data-{0}-*-base', matrix.arch) || '' }}
      baseline_commit: ${{ needs.branch-point.outputs.sha }}
      perf_run_id: ${{ inputs.perf_run_id || '' }}
      baseline_run_id: ${{ inputs.baseline_run_id || '' }}
      pr_number: ${{ inputs.pr_number || '' }}
    secrets: inherit

  placement-plan:
    name: "Stage 2: pick the tests to re-measure"
    needs: [branch-point, llk-perf-gate]
    if: >-
      ${{ !cancelled() && (
        (github.event_name == 'pull_request' && needs.llk-perf-gate.result != 'skipped') ||
        (github.event_name == 'workflow_dispatch' && inputs.placement_run_id != '')
      ) }}
    runs-on: ubuntu-slim
    outputs:
      arches: ${{ steps.plan.outputs.arches }}
      run: ${{ steps.source.outputs.run }}
      head: ${{ steps.source.outputs.head }}
      base: ${{ steps.source.outputs.base }}
      pr: ${{ steps.source.outputs.pr }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        timeout-minutes: 20
        with:
          sparse-checkout: tt_metal/tt-llk/perf
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.10'
      - run: pip install pandas
      - name: Find the stage-1 run and the commits
        id: source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_RUN: ${{ inputs.placement_run_id || github.run_id }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BRANCH_POINT: ${{ needs.branch-point.outputs.sha }}
        run: |
          CAP="$PLACEMENT_CAP"
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            # The full check: every stage-1 regression of that run, no test limit.
            CAP=1000000
            PR_HEAD=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN}" --jq .head_sha)
            PR_NUMBER=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN}" --jq '.pull_requests[0].number // empty')
            BASE_REF=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq .base.ref)
            BRANCH_POINT=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${BASE_REF}...${PR_HEAD}" --jq .merge_base_commit.sha)
          fi
          echo "Stage 1 from run ${SOURCE_RUN}: PR #${PR_NUMBER}, head ${PR_HEAD}, branch point ${BRANCH_POINT}, cap ${CAP}"
          {
            echo "run=${SOURCE_RUN}"
            echo "head=${PR_HEAD}"
            echo "base=${BRANCH_POINT}"
            echo "pr=${PR_NUMBER}"
            echo "cap=${CAP}"
          } >> "$GITHUB_OUTPUT"
      - name: Download the stage-1 Wormhole report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: llk-perf-gate-report-wormhole
          merge-multiple: true
          path: reports/wormhole
          run-id: ${{ steps.source.outputs.run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download the stage-1 Blackhole report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: llk-perf-gate-report-blackhole
          merge-multiple: true
          path: reports/blackhole
          run-id: ${{ steps.source.outputs.run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download the PR head's Wormhole data
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: perf-data-wormhole-*-head
          merge-multiple: true
          path: head/wormhole
          run-id: ${{ steps.source.outputs.run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download the PR head's Blackhole data
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: perf-data-blackhole-*-head
          merge-multiple: true
          path: head/blackhole
          run-id: ${{ steps.source.outputs.run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Pick the tests
        id: plan
        env:
          CAP: ${{ steps.source.outputs.cap }}
        run: |
          ARCHES=()
          for ARCH in wormhole blackhole; do
            CANDIDATES="reports/${ARCH}/perf_gate_report.regressions.csv"
            [ -f "$CANDIDATES" ] || continue
            mkdir -p "nodes/${ARCH}"
            python3 tt_metal/tt-llk/perf/placement_check.py nodes \
              --candidates "$CANDIDATES" \
              --map "head/${ARCH}/**/*.windowhash" \
              --cap "$CAP" \
              --out "nodes/${ARCH}/nodes.txt"
            [ -s "nodes/${ARCH}/nodes.txt" ] && ARCHES+=("\"${ARCH}\"")
          done
          echo "arches=[$(IFS=,; echo "${ARCHES[*]}")]" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        if: hashFiles('nodes/wormhole/nodes.txt') != ''
        with:
          name: placement-nodes-wormhole
          path: |
            nodes/wormhole/nodes.txt
            nodes/wormhole/nodes.over
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        if: hashFiles('nodes/blackhole/nodes.txt') != ''
        with:
          name: placement-nodes-blackhole
          path: |
            nodes/blackhole/nodes.txt
            nodes/blackhole/nodes.over

  placement-measure-head:
    name: "Stage 2: measure the PR head on ${{ matrix.arch }} at 5 code positions"
    needs: placement-plan
    if: ${{ !cancelled() && needs.placement-plan.outputs.arches != '[]' && needs.placement-plan.outputs.arches != '' }}
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(needs.placement-plan.outputs.arches) }}
    uses: ./.github/workflows/llk-perf-impl.yaml
    with:
      architecture: ${{ matrix.arch }}
      ref: ${{ needs.placement-plan.outputs.head }}
      artifact-suffix: "-head-placement"
      speed-of-light: false
      perf-run-types: L1_TO_L1
      tests-yaml: ./tests/pipeline_reorg/llk_perf_placement_tests.yaml
      node-list-artifact: placement-nodes-${{ matrix.arch }}
      compile-quasar: false
      upload-to-warehouse: false
      pipeline: pr
    secrets: inherit

  placement-measure-base:
    name: "Stage 2: measure the branch point on ${{ matrix.arch }} at 5 code positions"
    needs: placement-plan
    if: ${{ !cancelled() && needs.placement-plan.outputs.arches != '[]' && needs.placement-plan.outputs.arches != '' }}
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(needs.placement-plan.outputs.arches) }}
    uses: ./.github/workflows/llk-perf-impl.yaml
    with:
      architecture: ${{ matrix.arch }}
      ref: ${{ needs.placement-plan.outputs.base }}
      artifact-suffix: "-base-placement"
      speed-of-light: false
      perf-run-types: L1_TO_L1
      tests-yaml: ./tests/pipeline_reorg/llk_perf_placement_tests.yaml
      node-list-artifact: placement-nodes-${{ matrix.arch }}
      compile-quasar: false
      upload-to-warehouse: false
      pipeline: pr
    secrets: inherit

  placement-gate:
    name: "Stage 2: decide on ${{ matrix.arch }}"
    needs: [placement-plan, placement-measure-head, placement-measure-base]
    if: ${{ !cancelled() && needs.placement-plan.outputs.arches != '[]' && needs.placement-plan.outputs.arches != '' }}
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(needs.placement-plan.outputs.arches) }}
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        timeout-minutes: 20
        with:
          sparse-checkout: tt_metal/tt-llk/perf
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.10'
      - run: pip install pandas
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: llk-perf-gate-report-${{ matrix.arch }}
          path: stage1
          run-id: ${{ needs.placement-plan.outputs.run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: placement-nodes-${{ matrix.arch }}
          path: nodes
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: perf-data-${{ matrix.arch }}-*-head-placement
          merge-multiple: true
          path: current
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: perf-data-${{ matrix.arch }}-*-base-placement
          merge-multiple: true
          path: baseline
      - name: Decide
        env:
          ARCH: ${{ matrix.arch }}
          THRESHOLD: "0.02"
          HEAD_RESULT: ${{ needs.placement-measure-head.result }}
          BASE_RESULT: ${{ needs.placement-measure-base.result }}
          SOURCE_RUN: ${{ needs.placement-plan.outputs.run }}
        run: |
          mkdir -p current baseline
          LIMIT_NOTE="The limit of ${PLACEMENT_CAP} tests per arch keeps this job short. To re-measure all of them, run the **LLK perf gate** workflow by hand with \`placement_run_id\` = \`${SOURCE_RUN}\`; it reuses this stage 1 and updates this comment."
          python3 tt_metal/tt-llk/perf/placement_check.py decide \
            --candidates stage1/perf_gate_report.regressions.csv \
            --baseline baseline --current current \
            --threshold "$THRESHOLD" --min-cycles 30 \
            --over-cap nodes/nodes.over --limit-note "$LIMIT_NOTE" \
            --arch "$ARCH" --report stage2.md || true
          if [ "$HEAD_RESULT" != success ] || [ "$BASE_RESULT" != success ]; then
            NOTE="> ⚠️ A stage-2 measuring job did not succeed (PR head: ${HEAD_RESULT}, branch point: ${BASE_RESULT}). What it did not measure is listed as not re-measured."
            printf '%s\n\n%s\n' "$(head -1 stage2.md)" "$NOTE" > stage2.tmp
            tail -n +2 stage2.md >> stage2.tmp
            mv stage2.tmp stage2.md
          fi
          cat stage2.md >> "$GITHUB_STEP_SUMMARY"
      - name: Add stage 2 to the gate comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        if: ${{ needs.placement-plan.outputs.pr != '' }}
        env:
          ARCH: ${{ matrix.arch }}
          PR_NUMBER: ${{ needs.placement-plan.outputs.pr }}
        with:
          script: |
            const fs = require('fs');
            const marker = `<!-- llk-perf-gate:${process.env.ARCH} -->`;
            const split = '<!-- llk-perf-gate-stage2 -->';
            const { owner, repo } = context.repo;
            const issue_number = Number(process.env.PR_NUMBER);
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const mine = comments.find((c) => c.user.type === 'Bot' && c.body.startsWith(marker));
            const stage2 = fs.readFileSync('stage2.md', 'utf8');
            if (!mine) {
              await github.rest.issues.createComment({ owner, repo, issue_number, body: `${marker}\n${split}\n${stage2}` });
              return;
            }
            const body = `${mine.body.split(split)[0].trimEnd()}\n\n${split}\n${stage2}`;
            await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        if: always()
        with:
          name: llk-perf-gate-stage2-${{ matrix.arch }}
          path: |
            stage2.md
            stage2.json
          if-no-files-found: ignore

  nightly-measure:
    name: "Nightly: measure the suite (non speed-of-light)"
    if: >-
      github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch'
      && inputs.baseline_run_id == '' && inputs.perf_run_id == '' && inputs.placement_run_id == '')
    uses: ./.github/workflows/llk-perf-impl.yaml
    with:
      architecture: all
      speed-of-light: false
      perf-run-types: ALL_MODES
      upload-to-warehouse: true
      pipeline: nightly
    secrets: inherit

  nightly-gate:
    name: "Nightly gate ${{ matrix.arch }} (non speed-of-light)"
    needs: nightly-measure
    if: >-
      ${{ !cancelled() && (github.event_name == 'schedule'
      || (github.event_name == 'workflow_dispatch' && inputs.baseline_run_id == ''
          && inputs.placement_run_id == '')) }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.arch == 'wormhole' && '[{"arch":"wormhole","threshold":"0.02","module_thresholds":"","run_types":"L1_TO_L1,UNPACK_ISOLATE,MATH_ISOLATE"}]' || inputs.arch == 'blackhole' && '[{"arch":"blackhole","threshold":"0.02","module_thresholds":"","run_types":"L1_TO_L1,PACK_ISOLATE,UNPACK_ISOLATE,MATH_ISOLATE"}]' || '[{"arch":"blackhole","threshold":"0.02","module_thresholds":"","run_types":"L1_TO_L1,PACK_ISOLATE,UNPACK_ISOLATE,MATH_ISOLATE"},{"arch":"wormhole","threshold":"0.02","module_thresholds":"","run_types":"L1_TO_L1,UNPACK_ISOLATE,MATH_ISOLATE"}]') }}
    uses: ./.github/workflows/llk-perf-gate-impl.yaml
    with:
      arch: ${{ matrix.arch }}
      perf_run_id: ${{ inputs.perf_run_id || '' }}
      baseline_pipeline: ${{ inputs.baseline_pipeline || 'baseline' }}
      speed_of_light: "false"
      run_types: ${{ matrix.run_types }}
      threshold: ${{ matrix.threshold }}
      min_cycles: "30"
      module_thresholds: ${{ matrix.module_thresholds }}
      measure_result: ${{ needs.nightly-measure.result }}
      fail_on_regression: false
    secrets: inherit

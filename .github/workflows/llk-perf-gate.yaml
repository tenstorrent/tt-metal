name: "LLK perf gate"

# Triggered on LLK PRs after compile and measure complete
on:
  workflow_run:
    workflows: ["LLK perf"]
    types: [completed]

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  llk-perf-gate:
    name: "LLK perf regression gate"
    if: github.event.workflow_run.conclusion == 'success'
    uses: ./.github/workflows/llk-perf-gate-impl.yaml
    secrets: inherit
    with:
      baseline_run_id: ${{ github.event.workflow_run.id }}

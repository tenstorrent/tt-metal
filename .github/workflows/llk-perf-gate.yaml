name: "LLK perf gate"

on:
  pull_request:
    types: [labeled, synchronize]
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:
    inputs:
      perf_run_id:
        description: "Gate this run's perf artifacts (blank = measure the nightly suite now)"
        required: false
        type: string
      baseline_run_id:
        description: "Compare against this run's artifacts (blank = the warehouse baseline, nightly mode)"
        required: false
        type: string
      baseline_pipeline:
        description: "Nightly mode: warehouse baseline, 'baseline' (pinned) or 'nightly' (previous night)"
        required: false
        default: baseline
        type: string
      arch:
        description: "Architecture to gate on"
        required: false
        default: all
        type: choice
        options:
          - all
          - wormhole
          - blackhole
      run_types:
        description: "Comma-separated run types to compare"
        required: false
        default: L1_TO_L1
        type: string
      pr_number:
        description: "PR to name in the report (labelling only; nothing is posted to it)"
        required: false
        type: string
permissions:
  actions: read
  contents: read
  checks: write
  packages: write
  pull-requests: write

concurrency:
  group: llk-perf-gate-${{ github.event.pull_request.number || github.run_id }}-${{ (github.event.action == 'synchronize' || github.event.label.name == 'llk-perf-gate') && 'gate' || github.run_id }}
  cancel-in-progress: true

jobs:
  branch-point:
    name: "Find the branch point"
    if: >-
      github.event_name == 'pull_request' && (
        github.event.pull_request.head.repo.full_name == github.repository &&
        (
          (github.event.action == 'labeled' && github.event.label.name == 'llk-perf-gate') ||
          (github.event.action == 'synchronize'
           && contains(github.event.pull_request.labels.*.name, 'llk-perf-gate'))
        )
      )
    runs-on: ubuntu-slim
    outputs:
      sha: ${{ steps.find.outputs.sha }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        timeout-minutes: 20
        with:
          fetch-depth: 0
      - name: Find the branch point
        id: find
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          git fetch --no-tags origin "$BASE_REF"
          SHA=$(git merge-base "origin/${BASE_REF}" "$HEAD_SHA")
          echo "Comparing ${HEAD_SHA} against its branch point ${SHA}"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

  measure-branch-point:
    name: "Measure the branch point on ${{ matrix.arch }}"
    needs: branch-point
    strategy:
      fail-fast: false
      matrix:
        arch: [blackhole, wormhole]
    uses: ./.github/workflows/llk-perf-impl.yaml
    with:
      architecture: ${{ matrix.arch }}
      ref: ${{ needs.branch-point.outputs.sha }}
      artifact-suffix: "-base"
      speed-of-light: false
      perf-run-types: L1_TO_L1
      upload-to-warehouse: false
      pipeline: pr
    secrets: inherit

  measure:
    name: "Measure the PR head on ${{ matrix.arch }}"
    if: >-
      github.event_name == 'pull_request' &&
      (
        github.event.pull_request.head.repo.full_name == github.repository &&
        (
          (github.event.action == 'labeled' && github.event.label.name == 'llk-perf-gate') ||
          (github.event.action == 'synchronize'
           && contains(github.event.pull_request.labels.*.name, 'llk-perf-gate'))
        )
      )
    strategy:
      fail-fast: false
      matrix:
        arch: [blackhole, wormhole]
    uses: ./.github/workflows/llk-perf-impl.yaml
    with:
      architecture: ${{ matrix.arch }}
      ref: ${{ github.event.pull_request.head.sha }}
      artifact-suffix: "-head"
      speed-of-light: false
      perf-run-types: ${{ inputs.run_types || 'L1_TO_L1' }}
      upload-to-warehouse: false
      pipeline: pr
    secrets: inherit

  llk-perf-gate:
    name: "LLK perf regression gate (${{ matrix.arch }})"
    needs: [branch-point, measure, measure-branch-point]
    if: >-
      ${{ !cancelled() &&
      (
        (github.event_name == 'workflow_dispatch' && inputs.baseline_run_id != '') ||
        (
          github.event.pull_request.head.repo.full_name == github.repository &&
          (
            (github.event.action == 'labeled' && github.event.label.name == 'llk-perf-gate') ||
            (github.event.action == 'synchronize'
             && contains(github.event.pull_request.labels.*.name, 'llk-perf-gate'))
          )
        )
      ) }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.arch == 'wormhole' && '[{"arch":"wormhole","threshold":"0.08"}]' || inputs.arch == 'blackhole' && '[{"arch":"blackhole","threshold":"0.02"}]' || '[{"arch":"blackhole","threshold":"0.02"},{"arch":"wormhole","threshold":"0.08"}]') }}
    uses: ./.github/workflows/llk-perf-gate-impl.yaml
    with:
      arch: ${{ matrix.arch }}
      run_types: ${{ inputs.run_types || 'L1_TO_L1' }}
      threshold: ${{ matrix.threshold }}
      min_cycles: "30"
      fail_on_regression: false
      # A labelled PR posts only a regression or a skip; passes cluttered the channel.
      # pr-gate-digest still reports the passes once a day. A manual compare posts all.
      slack_on_pass: ${{ github.event_name != 'pull_request' }}
      measure_result: >-
        ${{ needs.measure.result }},${{ needs.measure-branch-point.result }}
      current_artifact_pattern: >-
        ${{ github.event_name == 'pull_request'
            && format('perf-data-{0}-*-head', matrix.arch) || '' }}
      baseline_artifact_pattern: >-
        ${{ github.event_name == 'pull_request'
            && format('perf-data-{0}-*-base', matrix.arch) || '' }}
      baseline_commit: ${{ needs.branch-point.outputs.sha }}
      perf_run_id: ${{ inputs.perf_run_id || '' }}
      baseline_run_id: ${{ inputs.baseline_run_id || '' }}
      pr_number: ${{ inputs.pr_number || '' }}
    secrets: inherit

  pr-gate-digest:
    name: "PR gate: daily summary"
    # One message a day, also when nothing ran, so a PR gate that stops working is seen.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        timeout-minutes: 20
        with:
          fetch-depth: 1
          sparse-checkout: tt_metal/tt-llk/perf
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.10'
      - name: Summarise the last 24 h of PR gate runs
        env:
          GH_TOKEN: ${{ github.token }}
          SLACK_CHANNEL_ID: ${{ secrets.LLK_PERF_GATE_SLACK_CHANNEL_ID }}
          SLACK_BOT_TOKEN: ${{ secrets.LLK_SLACK_REPORTING_BOT_TOKEN }}
        run: |
          python3 tt_metal/tt-llk/perf/pr_gate_digest.py \
            --repo "$GITHUB_REPOSITORY" --channel "$SLACK_CHANNEL_ID" --out digest_payload.json
          RESPONSE=$(curl -sS -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer ${SLACK_BOT_TOKEN}" \
            -H "Content-type: application/json; charset=utf-8" \
            --data @digest_payload.json)
          case "$RESPONSE" in
            *'"ok":true'*) echo "Posted the PR gate summary." ;;
            *) echo "::error::Slack rejected the PR gate summary: ${RESPONSE}"; exit 1 ;;
          esac

  nightly-measure:
    name: "Nightly: measure the suite (non speed-of-light)"
    if: >-
      github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch'
      && inputs.baseline_run_id == '' && inputs.perf_run_id == '')
    uses: ./.github/workflows/llk-perf-impl.yaml
    with:
      architecture: all
      speed-of-light: false
      upload-to-warehouse: true
      pipeline: nightly
    secrets: inherit

  nightly-gate:
    name: "Nightly gate ${{ matrix.arch }} (non speed-of-light)"
    needs: nightly-measure
    if: >-
      ${{ !cancelled() && (github.event_name == 'schedule'
      || (github.event_name == 'workflow_dispatch' && inputs.baseline_run_id == '')) }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.arch == 'wormhole' && '[{"arch":"wormhole","threshold":"0.10","module_thresholds":"perf_matmul=0.25,perf_math_matmul=0.25","run_types":"L1_TO_L1,UNPACK_ISOLATE,MATH_ISOLATE"}]' || inputs.arch == 'blackhole' && '[{"arch":"blackhole","threshold":"0.02","module_thresholds":"","run_types":"L1_TO_L1,PACK_ISOLATE,UNPACK_ISOLATE,MATH_ISOLATE"}]' || '[{"arch":"blackhole","threshold":"0.02","module_thresholds":"","run_types":"L1_TO_L1,PACK_ISOLATE,UNPACK_ISOLATE,MATH_ISOLATE"},{"arch":"wormhole","threshold":"0.10","module_thresholds":"perf_matmul=0.25,perf_math_matmul=0.25","run_types":"L1_TO_L1,UNPACK_ISOLATE,MATH_ISOLATE"}]') }}
    uses: ./.github/workflows/llk-perf-gate-impl.yaml
    with:
      arch: ${{ matrix.arch }}
      perf_run_id: ${{ inputs.perf_run_id || '' }}
      baseline_pipeline: ${{ inputs.baseline_pipeline || 'baseline' }}
      speed_of_light: "false"
      run_types: ${{ matrix.run_types }}
      threshold: ${{ matrix.threshold }}
      min_cycles: "30"
      module_thresholds: ${{ matrix.module_thresholds }}
      measure_result: ${{ needs.nightly-measure.result }}
      fail_on_regression: false
    secrets: inherit

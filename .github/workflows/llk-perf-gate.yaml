name: "LLK perf gate"

on:
  pull_request:
    types: [labeled, synchronize]

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  llk-perf-gate:
    name: "LLK perf regression gate"
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      (
        (github.event.action == 'labeled' && github.event.label.name == 'llk-perf-gate') ||
        (github.event.action == 'synchronize'
         && contains(github.event.pull_request.labels.*.name, 'llk-perf-gate'))
      )
    uses: ./.github/workflows/llk-perf-gate-impl.yaml
    secrets: inherit

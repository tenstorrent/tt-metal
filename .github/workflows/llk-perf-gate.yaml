name: "LLK perf gate"

on:
  pull_request:
    types: [labeled, synchronize]
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:
    inputs:
      perf_run_id:
        description: "Gate this run's perf artifacts (blank = measure the nightly suite now)"
        required: false
        type: string
      baseline_run_id:
        description: "Compare against this run's artifacts (blank = the warehouse baseline, nightly mode)"
        required: false
        type: string
      baseline_pipeline:
        description: "Nightly mode: warehouse baseline, 'baseline' (pinned) or 'nightly' (previous night)"
        required: false
        default: baseline
        type: string
      arch:
        description: "Architecture to gate on"
        required: false
        default: all
        type: choice
        options:
          - all
          - wormhole
          - blackhole
      run_types:
        description: "Comma-separated run types to compare"
        required: false
        default: L1_TO_L1
        type: string
      pr_number:
        description: "PR to name in the report (labelling only; nothing is posted to it)"
        required: false
        type: string
      placement_run_id:
        description: "Stage 2 without the test limit, for this PR gate run's stage-1 regressions (posts to its PR)"
        required: false
        type: string
permissions:
  actions: read
  contents: read
  checks: write
  packages: write
  pull-requests: write

env:
  # Stage 2 re-measures at most this many tests per arch, so its job stays short; see placement_check.py.
  PLACEMENT_CAP: "1000"

# perf-trial/mincover-pr-map: only the merge-gate cover check, plus a full compile and ELF fingerprints.
concurrency:
  group: llk-perf-gate-${{ github.event.pull_request.number || github.run_id }}-${{ (github.event.action == 'synchronize' || github.event.label.name == 'llk-perf-gate') && 'gate' || github.run_id }}
  cancel-in-progress: true

jobs:
  merge-gate-cover-images:
    if: >-
      github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch'
      && inputs.baseline_run_id == '' && inputs.perf_run_id == '' && inputs.placement_run_id == '')
    uses: ./.github/workflows/build-docker-artifact.yaml
    secrets: inherit

  # The merge gate measures only perf/merge_gate_nodes_<arch>.txt. This fails when the suite has a
  # compile key, axis value or production config the list misses, and uploads the refreshed list.
  merge-gate-cover:
    name: "Nightly: the merge gate's node list covers the ${{ matrix.arch }} suite"
    needs: [merge-gate-cover-images]
    strategy:
      fail-fast: false
      matrix:
        arch: [blackhole, wormhole]
    runs-on: tt-ubuntu-2204-large-stable
    timeout-minutes: 45
    container:
      image: ${{ needs.merge-gate-cover-images.outputs.llk-ci-tag }}
      options: "--rm"
    env:
      CHIP_ARCH: ${{ matrix.arch }}
      SPEED_OF_LIGHT: "false"
      PIPELINE: merge_baseline
      LLK_PERF_RUN_TYPES: L1_TO_L1
      TT_LLK_DISABLE_ASSERTS: "1"
    steps:
      - name: Checkout code
        uses: tenstorrent/tt-metal/.github/actions/cachew-checkout@7586e1e528b173057dbaa828c9ae1fa945fd2a9f # cachew checkout
        timeout-minutes: 20
      - name: Check the node list
        timeout-minutes: 20
        working-directory: tt_metal/tt-llk
        run: |
          (cd tests && ./setup_testing_env.sh)
          export LLK_PERF_COVER_MAP="$RUNNER_TEMP/cover/map"
          mkdir -p "$LLK_PERF_COVER_MAP"
          start=$(date +%s)
          LLK_PERF_PHASE=compile LLK_PERF_COMPILE_WORKERS="$(nproc)" "./tests/run_llk_perf_${CHIP_ARCH}.sh" 1 1
          echo "map pass wall=$(( $(date +%s) - start ))s nproc=$(nproc)"
          python3 perf/merge_gate_cover.py --map "$LLK_PERF_COVER_MAP" --arch "$CHIP_ARCH" \
            --prod perf/merge_gate_prod_configs.json --list "perf/merge_gate_nodes_${CHIP_ARCH}.txt" \
            --out "$RUNNER_TEMP/cover/merge_gate_nodes_${CHIP_ARCH}.txt"
      - name: Upload the refreshed list
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: merge-gate-nodes-${{ matrix.arch }}
          path: ${{ runner.temp }}/cover/merge_gate_nodes_${{ matrix.arch }}.txt
          if-no-files-found: ignore
      - name: "Trial: full compile and ELF fingerprints"
        if: ${{ !cancelled() }}
        working-directory: tt_metal/tt-llk
        run: |
          OUT="$RUNNER_TEMP/trial/$CHIP_ARCH"; mkdir -p "$OUT"
          cp -r "$RUNNER_TEMP/cover/map" "$OUT/map"
          start=$(date +%s)
          LLK_PERF_PHASE=compile LLK_PERF_COMPILE_WORKERS="$(nproc)" "./tests/run_llk_perf_${CHIP_ARCH}.sh" 1 1 > "$OUT/compile.log" 2>&1 || echo "compile rc=$?" >> "$OUT/times.txt"
          echo "full compile wall=$(( $(date +%s) - start ))s nproc=$(nproc)" >> "$OUT/times.txt"
          tail -3 "$OUT/compile.log"
          BUILD=$(find "$RUNNER_TEMP" /tmp -maxdepth 3 -type d -name sources -path '*tt-llk-build*' 2>/dev/null | head -1)
          echo "build=$BUILD" >> "$OUT/times.txt"
          python3 "$GITHUB_WORKSPACE/min_cover_trial/hash_elfs.py" "$BUILD" "$PWD/tests/sfpi/compiler/bin/riscv-tt-elf-objdump" "$PWD/tests/python_tests/helpers" "$OUT/elf_hashes.csv"
          gzip "$OUT/elf_hashes.csv"; cat "$OUT/times.txt"
      - name: "Trial: upload"
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: trial-${{ matrix.arch }}
          path: ${{ runner.temp }}/trial/
          retention-days: 7

name: "LLK perf gate"

# LLK Performance Regression Gate
#
# WHAT: Catches kernel performance regressions at PR merge time by comparing
# measurements against a baseline from main. Blocks PRs if regressions exceed
# threshold (2% slower AND 30+ cycles slower per point).
#
# WHY: LLK kernels are hand-optimized for latency. Small regressions accumulate
# and degrade performance over time. The gate prevents silent degradation by
# gating every commit on measurable perf metrics.
#
# CURRENT STATE: Measures L1_TO_L1 (unpack+math+pack) by default, extensible
# to individual isolate modes (MATH_ISOLATE, UNPACK_ISOLATE, PACK_ISOLATE).
# Thresholds derived from 5-run noise baselines on Blackhole and Wormhole.
#
# BASELINE UPDATES: After merge to main, the sanity workflow re-runs perf tests
# and publishes new baseline to Snowflake. Next PR's gate compares against it.
#
# TRIGGER: add the 'llk-perf-gate' label to a PR. The gate then re-runs on every
# later push to that PR, so a fix can be checked without removing and re-adding
# the label.
#
# SLACK: When the gate finds a regression it posts to Slack and names the PR
# author. The gate runs on one PR, so the author is known by construction — no
# blame analysis is needed. It also posts when the gate SKIPS, because a gate
# that compares nothing goes green and looks like a pass.
# Two secrets, both optional. Without them the gate runs and stays silent.
#   LLK_SLACK_REPORTING_BOT_TOKEN     — existing bot token, already used by CI
#   LLK_PERF_GATE_SLACK_CHANNEL_ID    — the channel to post in. Invite the bot
#                                       to it first; a bot cannot post to a
#                                       private channel it is not a member of.
# PILOT: workflow_dispatch runs one comparison from two existing perf runs. It
# needs no measurement job, no label and no warehouse, so the gate's verdicts
# and its Slack report can be judged before either is wired up. Remove this
# entry point once the label path measures the PR itself.
on:
  pull_request:
    types: [labeled, synchronize]
  # workflow_dispatch cannot reach a workflow that is not yet on the default
  # branch, so until this lands on main a trial is started by pushing a commit
  # whose message carries [gate-trial]. The two run ids then come from repository
  # variables, which are readable from any branch:
  #   LLK_GATE_PILOT_PERF_RUN_ID      the current side
  #   LLK_GATE_PILOT_BASELINE_RUN_ID  the baseline side
  #   LLK_GATE_PILOT_ARCH             which architecture to compare
  # The arch must match the runs: the gate downloads perf-data-<arch>-*, so a
  # mismatch finds no artifacts rather than silently comparing the wrong chip.
  push:
    branches:
      - "**"
  workflow_dispatch:
    inputs:
      perf_run_id:
        description: "Workflow run holding the CURRENT side's perf artifacts"
        required: true
        type: string
      baseline_run_id:
        description: "Workflow run holding the BASELINE side's perf artifacts"
        required: true
        type: string
      arch:
        description: "Architecture to gate on"
        required: false
        default: wormhole
        type: choice
        options:
          - wormhole
          - blackhole
      run_types:
        description: "Comma-separated run types to compare"
        required: false
        default: L1_TO_L1
        type: string
      pr_number:
        description: "PR to name in the report (labelling only; nothing is posted to it)"
        required: false
        type: string
      notify_on_success:
        description: "Post to Slack even when the gate passes"
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  llk-perf-gate:
    name: "LLK perf regression gate"
    # A fork PR carries no secrets and a read-only token, so Snowflake and the
    # PR comment would both fail. Guard on the head repo, as pr-gate.yaml does.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push'
       && contains(github.event.head_commit.message, '[gate-trial]')) ||
      (
        github.event.pull_request.head.repo.full_name == github.repository &&
        (
          (github.event.action == 'labeled' && github.event.label.name == 'llk-perf-gate') ||
          (github.event.action == 'synchronize'
           && contains(github.event.pull_request.labels.*.name, 'llk-perf-gate'))
        )
      )
    uses: ./.github/workflows/llk-perf-gate-impl.yaml
    with:
      # Empty on the label path, so the gate takes its normal warehouse route.
      arch: ${{ inputs.arch || vars.LLK_GATE_PILOT_ARCH || 'wormhole' }}
      run_types: ${{ inputs.run_types || vars.LLK_GATE_PILOT_RUN_TYPES || 'L1_TO_L1' }}
      perf_run_id: ${{ inputs.perf_run_id || vars.LLK_GATE_PILOT_PERF_RUN_ID || '' }}
      baseline_run_id: >-
        ${{ inputs.baseline_run_id || vars.LLK_GATE_PILOT_BASELINE_RUN_ID || '' }}
      pr_number: ${{ inputs.pr_number || '' }}
      notify_on_success: ${{ inputs.notify_on_success || false }}
    secrets: inherit

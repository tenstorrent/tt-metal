name: "LLK perf gate"

# LLK Performance Regression Gate
#
# WHAT: Catches kernel performance regressions at PR merge time by comparing
# measurements against a baseline from main. Blocks PRs if regressions exceed
# threshold (2% slower AND 30+ cycles slower per point).
#
# WHY: LLK kernels are hand-optimized for latency. Small regressions accumulate
# and degrade performance over time. The gate prevents silent degradation by
# gating every commit on measurable perf metrics.
#
# CURRENT STATE: Measures L1_TO_L1 (unpack+math+pack) by default, extensible
# to individual isolate modes (MATH_ISOLATE, UNPACK_ISOLATE, PACK_ISOLATE).
# Thresholds derived from 5-run noise baselines on Blackhole and Wormhole.
#
# BASELINE UPDATES: After merge to main, the sanity workflow re-runs perf tests
# and publishes new baseline to Snowflake. Next PR's gate compares against it.
#
# TRIGGER: add the 'llk-perf-gate' label to a PR. The gate then re-runs on every
# later push to that PR, so a fix can be checked without removing and re-adding
# the label.
#
# SLACK: When the gate finds a regression it posts to Slack and names the PR
# author. The gate runs on one PR, so the author is known by construction — no
# blame analysis is needed. It also posts when the gate SKIPS, because a gate
# that compares nothing goes green and looks like a pass.
# Two secrets, both optional. Without them the gate runs and stays silent.
#   LLK_SLACK_REPORTING_BOT_TOKEN     — existing bot token, already used by CI
#   LLK_PERF_GATE_SLACK_CHANNEL_ID    — the channel to post in. Invite the bot
#                                       to it first; a bot cannot post to a
#                                       private channel it is not a member of.
on:
  pull_request:
    types: [labeled, synchronize]

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  llk-perf-gate:
    name: "LLK perf regression gate"
    # A fork PR carries no secrets and a read-only token, so Snowflake and the
    # PR comment would both fail. Guard on the head repo, as pr-gate.yaml does.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      (
        (github.event.action == 'labeled' && github.event.label.name == 'llk-perf-gate') ||
        (github.event.action == 'synchronize'
         && contains(github.event.pull_request.labels.*.name, 'llk-perf-gate'))
      )
    uses: ./.github/workflows/llk-perf-gate-impl.yaml
    secrets: inherit

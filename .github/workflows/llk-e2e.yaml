name: "LLK e2e Tests"

# Review probe branch (mvlahovicTT), not for main: this file replaces the LLK e2e workflow on this branch only, so a
# workflow_dispatch here runs a base vs head A/B of one LLK functional module and one perf module per arch, both sides
# on the same runner card with interleaved perf reps. review-probe/run.sh does the work; results come back as artifacts.

on:
  workflow_dispatch:
    inputs:
      base_sha:
        description: "Merge base commit"
        required: true
        type: string
      head_sha:
        description: "PR head commit"
        required: true
        type: string
      func_module:
        description: "Functional module under tests/python_tests"
        required: true
        type: string
      perf_module:
        description: "Perf module under tests/python_tests"
        required: true
        type: string
      reps:
        description: "Interleaved perf reps per side"
        required: false
        type: string
        default: "3"
      archs:
        description: "JSON list of archs"
        required: false
        type: string
        default: '["blackhole", "wormhole"]'

permissions:
  contents: read
  packages: write

jobs:
  build-images:
    name: "Docker setup"
    uses: ./.github/workflows/build-docker-artifact.yaml
    secrets: inherit

  review-probe:
    needs: [build-images]
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(inputs.archs) }}
    name: "review probe ${{ matrix.arch }}"
    runs-on: ${{ matrix.arch == 'blackhole' && 'tt-ubuntu-2204-P150b-viommu-stable' || 'tt-ubuntu-2204-N150-viommu-stable' }}
    timeout-minutes: 240
    container:
      image: ${{ needs.build-images.outputs.llk-ci-tag }}
      options: "--rm --device /dev/tenstorrent --ulimit nofile=4096:4096"
    steps:
      - name: Checkout probe scripts
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        timeout-minutes: 20
        with:
          path: probe
          sparse-checkout: review-probe
      - name: Checkout base
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        timeout-minutes: 20
        with:
          ref: ${{ inputs.base_sha }}
          path: base
      - name: Checkout head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        timeout-minutes: 20
        with:
          ref: ${{ inputs.head_sha }}
          path: head
      - name: Run probe
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
          REPS: ${{ inputs.reps }}
          FUNC_MODULE: ${{ inputs.func_module }}
          PERF_MODULE: ${{ inputs.perf_module }}
        run: bash probe/review-probe/run.sh "$ARCH" "$REPS" "$FUNC_MODULE" "$PERF_MODULE"
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: review-probe-${{ matrix.arch }}
          path: out

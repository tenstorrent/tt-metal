name: "LLK e2e Tests"

on:
  schedule:
    # Run every night at 1AM UTC
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      pytest_markers:
        description: "Pytest mark expression for testing (e.g., 'nightly', 'perf')"
        required: false
        default: "not perf and not quasar and not accuracy"
        type: string

permissions:
  checks: write
  contents: read
  packages: write

jobs:
  llk-e2e-tests:
    name: "LLK e2e Tests"
    uses: ./.github/workflows/llk-e2e-impl.yaml
    secrets: inherit
    with:
      pytest-markers: ${{ inputs.pytest_markers || 'not perf and not quasar and not accuracy' }}
      coverage: false

  llk-e2e-summary:
    name: "LLK e2e summary"
    if: always()
    needs:
      - llk-e2e-tests
    runs-on: ubuntu-slim
    steps:
      - name: Check e2e test results
        uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}

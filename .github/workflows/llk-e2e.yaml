name: "LLK e2e Tests"
run-name: "review probe ${{ inputs.tag }}"

# Review probe branch (mvlahovicTT), not for main: this file replaces the LLK e2e workflow on this branch only, so a
# workflow_dispatch here runs a base vs head (and main) A/B of LLK test modules per arch, every side on the same runner
# card: each functional module once plus a rerun of its failing ids, each perf module with interleaved reps.
# review-probe/run.sh does the work; one artifact per arch holds the logs, perf data and summary.json.
# The reviewer's auto/ci dispatches it and finds its run by the tag in the run name.

on:
  workflow_dispatch:
    inputs:
      base_sha:
        description: "Merge base commit"
        required: true
        type: string
      head_sha:
        description: "PR head commit"
        required: true
        type: string
      main_sha:
        description: "Optional third side: a main commit"
        required: false
        type: string
        default: ""
      modules:
        description: 'JSON list of {"func": file, "perf": file} under tests/python_tests, "" when absent'
        required: true
        type: string
      reps:
        description: "Interleaved perf reps per side"
        required: false
        type: string
        default: "3"
      archs:
        description: "JSON list of archs"
        required: false
        type: string
        default: '["blackhole", "wormhole"]'
      tag:
        description: "Run name tag (auto/ci finds its run by it)"
        required: false
        type: string
        default: ""

permissions:
  contents: read
  packages: write

jobs:
  build-images:
    name: "Docker setup"
    uses: ./.github/workflows/build-docker-artifact.yaml
    secrets: inherit

  review-probe:
    needs: [build-images]
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(inputs.archs) }}
    name: "review probe ${{ matrix.arch }}"
    runs-on: ${{ matrix.arch == 'blackhole' && 'tt-ubuntu-2204-P150b-viommu-stable' || 'tt-ubuntu-2204-N150-viommu-stable' }}
    timeout-minutes: 240
    container:
      image: ${{ needs.build-images.outputs.llk-ci-tag }}
      options: "--rm --device /dev/tenstorrent --ulimit nofile=4096:4096"
    steps:
      - name: Checkout probe scripts
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        timeout-minutes: 20
        with:
          path: probe
          sparse-checkout: review-probe
      - name: Checkout base
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        timeout-minutes: 20
        with:
          ref: ${{ inputs.base_sha }}
          path: base
      - name: Checkout head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        timeout-minutes: 20
        with:
          ref: ${{ inputs.head_sha }}
          path: head
      - name: Checkout main
        if: ${{ inputs.main_sha != '' }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        timeout-minutes: 20
        with:
          ref: ${{ inputs.main_sha }}
          path: main
      - name: Run probe
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
          REPS: ${{ inputs.reps }}
          MODULES: ${{ inputs.modules }}
          SIDES: ${{ inputs.main_sha != '' && 'base head main' || 'base head' }}
          BASE_SHA: ${{ inputs.base_sha }}
          HEAD_SHA: ${{ inputs.head_sha }}
          MAIN_SHA: ${{ inputs.main_sha }}
        run: bash probe/review-probe/run.sh
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: review-probe-${{ matrix.arch }}
          path: out

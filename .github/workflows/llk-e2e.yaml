name: "LLK e2e Tests"

on:
  schedule:
    # Run every night at 1AM UTC
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      pytest_markers:
        description: "Pytest mark expression for testing (e.g., 'nightly', 'perf')"
        required: false
        default: "not perf and not quasar and not accuracy"
        type: string

permissions:
  checks: write
  contents: read
  packages: write

jobs:
  llk-e2e-tests:
    name: "LLK e2e Tests"
    uses: ./.github/workflows/llk-e2e-impl.yaml
    secrets: inherit
    with:
      pytest-markers: ${{ inputs.pytest_markers || 'not perf and not quasar and not accuracy' }}
      coverage: false

  llk-e2e-summary:
    name: "LLK e2e summary"
    if: always()
    needs:
      - llk-e2e-tests
    runs-on: ubuntu-slim
    steps:
      - name: Check e2e test results
        uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
      # The harness as a wheel, from a commit whose e2e run passed (the step above stops the job otherwise).
      - name: Checkout tt-llk
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2 cachew: keep
        timeout-minutes: 20
        with:
          fetch-depth: 1
          sparse-checkout: |
            tt_metal/tt-llk
          sparse-checkout-cone-mode: true
      - name: Build the harness wheel
        id: wheel
        shell: bash
        run: |
          set -euo pipefail
          wheel=$(python3 tt_metal/tt-llk/tests/harness_wheel/make_wheel.py --out-dir dist)
          cp tt_metal/tt-llk/tests/requirements.txt dist/requirements.txt
          echo "version=$(basename "$wheel" | cut -d- -f2)" >> "$GITHUB_OUTPUT"
          echo "Built \`$(basename "$wheel")\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the harness wheel
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: llk-harness-wheel
          path: dist/
          if-no-files-found: error
          retention-days: 30
      # Only when a release repository is configured; its visibility decides who can download the wheel.
      - name: Publish the harness wheel as a release
        if: ${{ vars.LLK_HARNESS_WHEEL_RELEASE_REPO != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.LLK_HARNESS_WHEEL_RELEASE_TOKEN }}
          RELEASE_REPO: ${{ vars.LLK_HARNESS_WHEEL_RELEASE_REPO }}
          VERSION: ${{ steps.wheel.outputs.version }}
        run: |
          set -euo pipefail
          # A tag cannot hold the '+' of the wheel's version.
          tag="v${VERSION//+/-}"
          if gh release view "$tag" --repo "$RELEASE_REPO" > /dev/null 2>&1; then
            gh release upload "$tag" dist/* --repo "$RELEASE_REPO" --clobber
          else
            gh release create "$tag" dist/* --repo "$RELEASE_REPO" --latest \
              --title "tt-llk harness $VERSION" --notes "tt-llk Python test harness $VERSION"
          fi

  report-status:
    name: "Report status"
    runs-on: ubuntu-slim
    if: always()
    needs: llk-e2e-summary
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2 cachew: keep
        timeout-minutes: 20
        with:
          fetch-depth: 1
      - name: Report status
        uses: ./.github/actions/report-failure
        with:
          test_name: "LLK e2e tests"
          slack_bot_token: ${{ secrets.LLK_SLACK_REPORTING_BOT_TOKEN }}
          slack_channel_id: ${{ secrets.LLK_CI_STATUS_CHANNEL_ID }}
          status: ${{ needs.llk-e2e-summary.result }}

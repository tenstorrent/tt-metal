name: "LLK smoke offload trial"
# Trial only (not for main): LLK smoke shards compiled on large-stable and xlarge-stable,
# measured on the board, against today's board-only shards in the same run.

on:
  push:
    branches: [nstojictt/smoke-offload-trial]

permissions:
  checks: write
  contents: read
  packages: write

jobs:
  build-images:
    uses: ./.github/workflows/build-docker-artifact.yaml
    secrets: inherit

  control:
    needs: build-images
    strategy:
      fail-fast: false
      matrix:
        s:
          - { arch: wormhole, group: 1, splits: 2, board: tt-ubuntu-2204-N150-viommu-stable }
          - { arch: wormhole, group: 2, splits: 2, board: tt-ubuntu-2204-N150-viommu-stable }
          - { arch: blackhole, group: 1, splits: 3, board: tt-ubuntu-2204-P150b-viommu-stable }
          - { arch: blackhole, group: 2, splits: 3, board: tt-ubuntu-2204-P150b-viommu-stable }
          - { arch: blackhole, group: 3, splits: 3, board: tt-ubuntu-2204-P150b-viommu-stable }
    name: "control ${{ matrix.s.arch }} ${{ matrix.s.group }}/${{ matrix.s.splits }}"
    runs-on: ${{ matrix.s.board }}
    timeout-minutes: 30
    container:
      image: ${{ needs.build-images.outputs.llk-ci-tag }}
      options: "--rm --device /dev/tenstorrent --ulimit nofile=4096:4096"
    env:
      PYTEST_MARKERS: "not perf and not nightly and not quasar and not accuracy"
      CHIP_ARCH: ${{ matrix.s.arch }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        timeout-minutes: 20
      - name: Install SFPI and zstd
        shell: bash
        working-directory: tt_metal/tt-llk/tests
        run: |
          ./setup_testing_env.sh
          command -v zstd || { apt-get update -qq && apt-get install -y -qq zstd; }
      - name: Run tests
        shell: bash
        working-directory: tt_metal/tt-llk
        run: ./tests/run_llk_smoke_trial.sh ${{ matrix.s.group }} ${{ matrix.s.splits }}
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: always()
        with:
          name: junit-control-${{ matrix.s.arch }}-${{ matrix.s.group }}
          path: tt_metal/tt-llk/tests/python_tests/pytest-report-*.xml

  compile-large:
    needs: build-images
    strategy:
      fail-fast: false
      matrix:
        s:
          - { arch: wormhole, group: 1, splits: 2, board: tt-ubuntu-2204-N150-viommu-stable }
          - { arch: wormhole, group: 2, splits: 2, board: tt-ubuntu-2204-N150-viommu-stable }
          - { arch: blackhole, group: 1, splits: 3, board: tt-ubuntu-2204-P150b-viommu-stable }
          - { arch: blackhole, group: 2, splits: 3, board: tt-ubuntu-2204-P150b-viommu-stable }
          - { arch: blackhole, group: 3, splits: 3, board: tt-ubuntu-2204-P150b-viommu-stable }
    name: "compile large ${{ matrix.s.arch }} ${{ matrix.s.group }}/${{ matrix.s.splits }}"
    runs-on: tt-ubuntu-2204-large-stable
    timeout-minutes: 60
    container:
      image: ${{ needs.build-images.outputs.llk-ci-tag }}
      options: "--rm"
    env:
      PYTEST_MARKERS: "not perf and not nightly and not quasar and not accuracy"
      CHIP_ARCH: ${{ matrix.s.arch }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        timeout-minutes: 20
      - name: Install SFPI and zstd
        shell: bash
        working-directory: tt_metal/tt-llk/tests
        run: |
          ./setup_testing_env.sh
          command -v zstd || { apt-get update -qq && apt-get install -y -qq zstd; }
      - name: Compile
        shell: bash
        working-directory: tt_metal/tt-llk
        env:
          LLK_PERF_PHASE: compile
          LLK_PERF_COMPILE_WORKERS: "9"
        run: |
          echo "nproc=$(nproc) mem=$(awk '/MemTotal/ {printf "%.1f GiB", $2/1048576}' /proc/meminfo)" >> "$GITHUB_STEP_SUMMARY"
          "$GITHUB_WORKSPACE/.github/scripts/utils/host-load-sidecar.sh" --interval 5 --label "compile large" \
            --output "$GITHUB_STEP_SUMMARY" -- ./tests/run_llk_smoke_trial.sh ${{ matrix.s.group }} ${{ matrix.s.splits }}
      - name: Pack
        shell: bash
        working-directory: tt_metal/tt-llk
        run: |
          python3 tests/llk_perf_offload.py pack --cmd "./tests/run_llk_smoke_trial.sh ${{ matrix.s.group }} ${{ matrix.s.splits }}" \
            --out "$RUNNER_TEMP/elfs/llk-smoke-large-${{ matrix.s.arch }}-${{ matrix.s.group }}.tar.zst" \
            --junit tests/python_tests/pytest-report-*-compile.xml
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          path: ${{ runner.temp }}/elfs/llk-smoke-large-${{ matrix.s.arch }}-${{ matrix.s.group }}.tar.zst
          archive: false
          retention-days: 3
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: always()
        with:
          name: junit-compile-large-${{ matrix.s.arch }}-${{ matrix.s.group }}
          path: tt_metal/tt-llk/tests/python_tests/pytest-report-*.xml

  board-large:
    needs: [build-images, compile-large]
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        s:
          - { arch: wormhole, group: 1, splits: 2, board: tt-ubuntu-2204-N150-viommu-stable }
          - { arch: wormhole, group: 2, splits: 2, board: tt-ubuntu-2204-N150-viommu-stable }
          - { arch: blackhole, group: 1, splits: 3, board: tt-ubuntu-2204-P150b-viommu-stable }
          - { arch: blackhole, group: 2, splits: 3, board: tt-ubuntu-2204-P150b-viommu-stable }
          - { arch: blackhole, group: 3, splits: 3, board: tt-ubuntu-2204-P150b-viommu-stable }
    name: "board large ${{ matrix.s.arch }} ${{ matrix.s.group }}/${{ matrix.s.splits }}"
    runs-on: ${{ matrix.s.board }}
    timeout-minutes: 30
    container:
      image: ${{ needs.build-images.outputs.llk-ci-tag }}
      options: "--rm --device /dev/tenstorrent --ulimit nofile=4096:4096"
    env:
      PYTEST_MARKERS: "not perf and not nightly and not quasar and not accuracy"
      CHIP_ARCH: ${{ matrix.s.arch }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        timeout-minutes: 20
      - name: Install SFPI and zstd
        shell: bash
        working-directory: tt_metal/tt-llk/tests
        run: |
          ./setup_testing_env.sh
          command -v zstd || { apt-get update -qq && apt-get install -y -qq zstd; }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: llk-smoke-large-${{ matrix.s.arch }}-${{ matrix.s.group }}.tar.zst
          path: ${{ runner.temp }}/dl
      - name: Unpack
        shell: bash
        working-directory: tt_metal/tt-llk
        run: |
          python3 tests/llk_perf_offload.py unpack --cmd "./tests/run_llk_smoke_trial.sh ${{ matrix.s.group }} ${{ matrix.s.splits }}" --dir "$RUNNER_TEMP/dl" --delete-archive --no-junit
      - name: Run tests
        shell: bash
        working-directory: tt_metal/tt-llk
        env:
          LLK_PERF_PHASE: run
        run: ./tests/run_llk_smoke_trial.sh ${{ matrix.s.group }} ${{ matrix.s.splits }}
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: always()
        with:
          name: junit-board-large-${{ matrix.s.arch }}-${{ matrix.s.group }}
          path: tt_metal/tt-llk/tests/python_tests/pytest-report-*.xml

  compile-xlarge:
    needs: build-images
    strategy:
      fail-fast: false
      matrix:
        s:
          - { arch: wormhole, group: 1, splits: 2, board: tt-ubuntu-2204-N150-viommu-stable }
          - { arch: wormhole, group: 2, splits: 2, board: tt-ubuntu-2204-N150-viommu-stable }
          - { arch: blackhole, group: 1, splits: 3, board: tt-ubuntu-2204-P150b-viommu-stable }
          - { arch: blackhole, group: 2, splits: 3, board: tt-ubuntu-2204-P150b-viommu-stable }
          - { arch: blackhole, group: 3, splits: 3, board: tt-ubuntu-2204-P150b-viommu-stable }
    name: "compile xlarge ${{ matrix.s.arch }} ${{ matrix.s.group }}/${{ matrix.s.splits }}"
    runs-on: tt-ubuntu-2204-xlarge-stable
    timeout-minutes: 60
    container:
      image: ${{ needs.build-images.outputs.llk-ci-tag }}
      options: "--rm"
    env:
      PYTEST_MARKERS: "not perf and not nightly and not quasar and not accuracy"
      CHIP_ARCH: ${{ matrix.s.arch }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        timeout-minutes: 20
      - name: Install SFPI and zstd
        shell: bash
        working-directory: tt_metal/tt-llk/tests
        run: |
          ./setup_testing_env.sh
          command -v zstd || { apt-get update -qq && apt-get install -y -qq zstd; }
      - name: Compile
        shell: bash
        working-directory: tt_metal/tt-llk
        env:
          LLK_PERF_PHASE: compile
          LLK_PERF_COMPILE_WORKERS: "24"
        run: |
          echo "nproc=$(nproc) mem=$(awk '/MemTotal/ {printf "%.1f GiB", $2/1048576}' /proc/meminfo)" >> "$GITHUB_STEP_SUMMARY"
          "$GITHUB_WORKSPACE/.github/scripts/utils/host-load-sidecar.sh" --interval 5 --label "compile xlarge" \
            --output "$GITHUB_STEP_SUMMARY" -- ./tests/run_llk_smoke_trial.sh ${{ matrix.s.group }} ${{ matrix.s.splits }}
      - name: Pack
        shell: bash
        working-directory: tt_metal/tt-llk
        run: |
          python3 tests/llk_perf_offload.py pack --cmd "./tests/run_llk_smoke_trial.sh ${{ matrix.s.group }} ${{ matrix.s.splits }}" \
            --out "$RUNNER_TEMP/elfs/llk-smoke-xlarge-${{ matrix.s.arch }}-${{ matrix.s.group }}.tar.zst" \
            --junit tests/python_tests/pytest-report-*-compile.xml
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          path: ${{ runner.temp }}/elfs/llk-smoke-xlarge-${{ matrix.s.arch }}-${{ matrix.s.group }}.tar.zst
          archive: false
          retention-days: 3
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: always()
        with:
          name: junit-compile-xlarge-${{ matrix.s.arch }}-${{ matrix.s.group }}
          path: tt_metal/tt-llk/tests/python_tests/pytest-report-*.xml

  board-xlarge:
    needs: [build-images, compile-xlarge]
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        s:
          - { arch: wormhole, group: 1, splits: 2, board: tt-ubuntu-2204-N150-viommu-stable }
          - { arch: wormhole, group: 2, splits: 2, board: tt-ubuntu-2204-N150-viommu-stable }
          - { arch: blackhole, group: 1, splits: 3, board: tt-ubuntu-2204-P150b-viommu-stable }
          - { arch: blackhole, group: 2, splits: 3, board: tt-ubuntu-2204-P150b-viommu-stable }
          - { arch: blackhole, group: 3, splits: 3, board: tt-ubuntu-2204-P150b-viommu-stable }
    name: "board xlarge ${{ matrix.s.arch }} ${{ matrix.s.group }}/${{ matrix.s.splits }}"
    runs-on: ${{ matrix.s.board }}
    timeout-minutes: 30
    container:
      image: ${{ needs.build-images.outputs.llk-ci-tag }}
      options: "--rm --device /dev/tenstorrent --ulimit nofile=4096:4096"
    env:
      PYTEST_MARKERS: "not perf and not nightly and not quasar and not accuracy"
      CHIP_ARCH: ${{ matrix.s.arch }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        timeout-minutes: 20
      - name: Install SFPI and zstd
        shell: bash
        working-directory: tt_metal/tt-llk/tests
        run: |
          ./setup_testing_env.sh
          command -v zstd || { apt-get update -qq && apt-get install -y -qq zstd; }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: llk-smoke-xlarge-${{ matrix.s.arch }}-${{ matrix.s.group }}.tar.zst
          path: ${{ runner.temp }}/dl
      - name: Unpack
        shell: bash
        working-directory: tt_metal/tt-llk
        run: |
          python3 tests/llk_perf_offload.py unpack --cmd "./tests/run_llk_smoke_trial.sh ${{ matrix.s.group }} ${{ matrix.s.splits }}" --dir "$RUNNER_TEMP/dl" --delete-archive --no-junit
      - name: Run tests
        shell: bash
        working-directory: tt_metal/tt-llk
        env:
          LLK_PERF_PHASE: run
        run: ./tests/run_llk_smoke_trial.sh ${{ matrix.s.group }} ${{ matrix.s.splits }}
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: always()
        with:
          name: junit-board-xlarge-${{ matrix.s.arch }}-${{ matrix.s.group }}
          path: tt_metal/tt-llk/tests/python_tests/pytest-report-*.xml

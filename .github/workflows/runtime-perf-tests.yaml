name: "(Runtime) Performance Tests"

# Every 4 hours for dispatch perf baselines (matches prior fast-dispatch-frequent cadence).
on:
  schedule:
    - cron: "0 */4 * * *" # every 4 hours
  workflow_dispatch:
    inputs:
      wormhole:
        description: "Run on Wormhole"
        required: false
        type: boolean
        default: true
      blackhole:
        description: "Run on Blackhole"
        required: false
        type: boolean
        default: true
      platform:
        required: false
        type: choice
        default: "Ubuntu 22.04"
        options:
          - "Ubuntu 22.04"
          - "Ubuntu 24.04"
        description: "Platform to build and test"
      build-type:
        required: false
        type: choice
        default: Release
        options:
          - Release
          - Debug
          - RelWithDebInfo
          - ASan
          - TSan
        description: "Build type configuration"
      enable-lto:
        required: false
        type: boolean
        default: false
        description: "Enable Link Time Optimization (LTO)"

jobs:
  check-harbor:
    uses: ./.github/workflows/check-harbor.yaml
  build-artifact:
    needs: check-harbor
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/build-artifact.yaml
    permissions:
      contents: read
      packages: write
    secrets: inherit
    with:
      harbor-prefix: ${{ needs.check-harbor.outputs.harbor-prefix }}
      build-type: ${{ inputs.build-type || 'Release' }}
      platform: ${{ inputs.platform || 'Ubuntu 22.04' }}
      enable-lto: ${{ inputs.enable-lto || false }}

  runtime-perf-tests:
    needs: [check-harbor, build-artifact]
    if: ${{ !cancelled() && needs.build-artifact.result == 'success' }}
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/runtime-perf-tests-impl.yaml
    secrets: inherit
    with:
      docker-image: ${{ needs.build-artifact.outputs.dev-docker-image }}
      build-artifact-name: ${{ needs.build-artifact.outputs.build-artifact-name }}
      # This impl is invoked twice per run; distinct scopes keep the two sets of
      # per-leg summary artifacts from colliding on one name.
      summary-scope: perf
      enabled-skus: >-
        ${{
          github.event_name == 'schedule'
            && 'wh_n300_civ2,bh_p150_perf,bh_p150b_civ2_viommu'
            || format('{0}{1}',
              inputs.wormhole && 'wh_n300_civ2' || '',
              inputs.blackhole && format('{0}bh_p150_perf,bh_p150b_civ2_viommu',
                inputs.wormhole && ',' || '') || ''
            )
        }}

  # Separate profiler-enabled build so the non-profiler microbenchmarks above are
  # not perturbed by profiler instrumentation. Used by the profiler-based tests.
  build-artifact-profiler:
    needs: check-harbor
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/build-artifact.yaml
    permissions:
      contents: read
      packages: write
    secrets: inherit
    with:
      tracy: true
      harbor-prefix: ${{ needs.check-harbor.outputs.harbor-prefix }}
      build-type: ${{ inputs.build-type || 'Release' }}
      platform: ${{ inputs.platform || 'Ubuntu 22.04' }}
      enable-lto: ${{ inputs.enable-lto || false }}

  runtime-perf-profiler-tests:
    needs: [check-harbor, build-artifact-profiler]
    if: ${{ !cancelled() && needs.build-artifact-profiler.result == 'success' }}
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/runtime-perf-tests-impl.yaml
    secrets: inherit
    with:
      docker-image: ${{ needs.build-artifact-profiler.outputs.dev-docker-image }}
      build-artifact-name: ${{ needs.build-artifact-profiler.outputs.build-artifact-name }}
      tests-yaml-path: ./tests/pipeline_reorg/runtime_perf_profiler_tests.yaml
      summary-scope: perf-profiler
      enabled-skus: >-
        ${{
          github.event_name == 'schedule'
            && 'wh_n300_civ2,wh_n300_perf,bh_p150_perf'
            || format('{0}{1}',
              inputs.wormhole && 'wh_n300_civ2,wh_n300_perf' || '',
              inputs.blackhole && format('{0}bh_p150_perf',
                inputs.wormhole && ',' || '') || ''
            )
        }}

  # Aggregates the per-leg ai-job-summary artifacts from both impl invocations into
  # one run-level report. expected-jobs is the union of their matrices, so a leg whose
  # runner died is reported as an infra failure rather than silently dropped.
  #
  # Both build jobs are in `needs:` because the test jobs are gated on them: when a
  # build fails its impl is *skipped*, not failed, and without them the combined result
  # would be `skipped` — which suppresses infra synthesis entirely and reports a broken
  # run as if nothing was due.
  #
  # No scope here even though the legs are scoped: this workflow has no workflow_call
  # trigger, so exactly one instance of this job exists per run, and an unscoped run
  # stage is what collects summaries across both scopes.
  ai-run-summary:
    name: "AI Run Summary"
    needs: [build-artifact, build-artifact-profiler, runtime-perf-tests, runtime-perf-profiler-tests]
    # Reports on a run that failed — the case the summary exists for — but not
    # on one that was cancelled: an aborted run has no outcome to summarize, and
    # asking for one spends an LLM call to say it stopped early.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    # Best-effort: checkout is not continue-on-error, so without this it could redden a green run.
    continue-on-error: true
    permissions:
      actions: read # download the per-leg ai_job_summary artifacts
      contents: read # a job-level block zeroes every scope it omits, incl. checkout's
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        timeout-minutes: 20
        with:
          filter: blob:none
          sparse-checkout: .github
      - name: Aggregate child matrices and results
        id: aggregate
        # Reporting must never fail the run: a jq error here would turn a green
        # run red.
        continue-on-error: true
        env:
          # toJSON(needs) is one object keyed by child job name, each with `result`
          # and `outputs.matrix`; aggregating from it keeps this data-driven as jobs
          # are added to or removed from the `needs` list.
          NEEDS: ${{ toJSON(needs) }}
        run: |
          # Expected legs come from the children that ran. A cancelled child keeps a
          # successful load-test-matrix, so including it would stub its legs as
          # INFRA_FAILURE when another child failed; skipped children expose a
          # null/empty matrix, which fromjson would throw on.
          RAN=$(jq -cn --argjson n "$NEEDS" '
            [$n[] | select(.result != "cancelled" and .result != "skipped")]')

          EXPECTED=$(jq -cn --argjson r "$RAN" '
            [$r[] | .outputs.matrix | select(. != null and . != "") | fromjson] | add // []')
          echo "expected-jobs=$EXPECTED" >> "$GITHUB_OUTPUT"
          echo "Merged $(echo "$EXPECTED" | jq 'length') expected legs"

          # Most-severe-wins over every child, so a cancelled run says so in the
          # report instead of reading as a clean pass. Upstream also treats
          # cancelled/skipped as "expect nothing", which is what we want: legs that
          # never finished were aborted, not infra failures.
          RESULT=$(jq -rn --argjson n "$NEEDS" '
            [$n[].result] as $s |
            if   any($s[]; . == "failure")   then "failure"
            elif any($s[]; . == "cancelled") then "cancelled"
            elif any($s[]; . == "success")   then "success"
            else                                  "skipped"
            end')
          echo "run-result=$RESULT" >> "$GITHUB_OUTPUT"
          echo "Combined run-result: $RESULT"
      - id: ai-run-summary
        continue-on-error: true
        uses: tenstorrent/tt-github-actions/.github/actions/ai_summary/run@main
        with:
          config: |
            {
              "model": "${{ vars.AI_SUMMARY_MODEL }}",
              "workspace": "$GITHUB_WORKSPACE",
              "input_dir": "ai_job_summaries",
              "output_dir": "ai_run_summaries"
            }
          api-key: ${{ secrets.TT_CHAT_API_KEY }}
          api-url: ${{ secrets.TT_CHAT_URL }}
          expected-jobs: ${{ steps.aggregate.outputs.expected-jobs }}
          run-result: ${{ steps.aggregate.outputs.run-result }}
      - name: Show report
        if: ${{ always() && steps.ai-run-summary.outputs.report-file != '' }}
        continue-on-error: true
        env:
          REPORT_FILE: ${{ steps.ai-run-summary.outputs.report-file }}
        run: |
          if [ -f "$REPORT_FILE" ]; then
            cat "$REPORT_FILE"
            cat "$REPORT_FILE" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Report file not found: $REPORT_FILE"
          fi

name: "Copilot Setup Steps"
# TEMPORARY PROBE 4 - full integration: submodules + build_metal.sh through the wrapper.
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
jobs:
  copilot-setup-steps:
    runs-on: tt-ubuntu-2204-large-stable
    timeout-minutes: 55
    permissions:
      contents: read
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
      - name: Report checkout cost
        run: |
          echo "submodules present: $(git submodule status --recursive 2>/dev/null | wc -l)"
          du -sh third_party 2>/dev/null || true
      - name: CMake configure through the docker wrapper
        env:
          AK: ${{ secrets.GARAGE_S3_ACCESS_KEY }}
          SK: ${{ secrets.GARAGE_S3_SECRET_KEY }}
        run: |
          IMG=ghcr.io/tenstorrent/tt-metal/tt-metalium/ubuntu-22.04-ci-build-amd64:latest
          EP=http://garage.garage.svc.cluster.local:3900
          docker pull -q "$IMG" >/dev/null
          mkdir -p "${HOME}/.cache/agent-ccache"
          START=$(date +%s)
          set +e
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "${GITHUB_WORKSPACE}:/work" -w /work \
            -v "${HOME}/.cache/agent-ccache:/ccache" \
            -e HOME=/tmp -e CCACHE_DIR=/ccache \
            -e CCACHE_REMOTE_STORAGE="s3://ccache|region=garage|prefix=tt-metal|endpoint_url=${EP}" \
            -e AWS_ACCESS_KEY_ID="$AK" -e AWS_SECRET_ACCESS_KEY="$SK" \
            -e AWS_DEFAULT_REGION=garage -e AWS_ENDPOINT_URL_S3="$EP" \
            "$IMG" bash -lc '
              git config --global --add safe.directory /work
              git config --global --add safe.directory "*"
              ./build_metal.sh --enable-ccache --configure-only 2>&1 | tail -25
            '
          RC=$?
          set -e
          echo "=== configure exit=$RC after $(( $(date +%s) - START ))s ==="
          [ $RC -eq 0 ] && echo "CONFIGURE OK - wrapper works end to end" \
                        || echo "::warning::configure failed rc=$RC (see output above)"

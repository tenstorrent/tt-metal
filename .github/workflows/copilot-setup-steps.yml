name: "Copilot Setup Steps"
# TEMPORARY PROBE 3 - does the remote ccache actually store and retrieve?
# Two containers, distinct local cache dirs, identical source. Run 2 must hit remote.
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
jobs:
  copilot-setup-steps:
    runs-on: tt-ubuntu-2204-large-stable
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Remote ccache store then retrieve
        env:
          AK: ${{ secrets.GARAGE_S3_ACCESS_KEY }}
          SK: ${{ secrets.GARAGE_S3_SECRET_KEY }}
        run: |
          IMG=ghcr.io/tenstorrent/tt-metal/tt-metalium/ubuntu-22.04-ci-build-amd64:latest
          EP=http://garage.garage.svc.cluster.local:3900
          # Unique prefix so this test cannot collide with or pollute the real CI cache.
          PREFIX="agent-probe/$(date +%s)"
          REMOTE="s3://ccache|region=garage|prefix=${PREFIX}|endpoint_url=${EP}"
          echo "using throwaway prefix: ${PREFIX}"
          docker pull -q "$IMG" >/dev/null
          mkdir -p .probe
          printf '#include <string>\n#include <vector>\nint main(){std::vector<std::string> v{"a","b"};return v.size()-2;}\n' > .probe/a.cpp

          run_build () {
            docker run --rm --user "$(id -u):$(id -g)" \
              -v "${GITHUB_WORKSPACE}:/work" -w /work \
              -e HOME=/tmp -e "CCACHE_DIR=/tmp/cc-$1" \
              -e CCACHE_REMOTE_STORAGE="$REMOTE" \
              -e AWS_ACCESS_KEY_ID="$AK" -e AWS_SECRET_ACCESS_KEY="$SK" \
              -e AWS_DEFAULT_REGION=garage -e AWS_ENDPOINT_URL_S3="$EP" \
              "$IMG" bash -lc '
                mkdir -p "$CCACHE_DIR"
                ccache -z >/dev/null 2>&1
                ccache clang++-20 -std=c++20 -c .probe/a.cpp -o /tmp/a.o
                ccache -sv 2>/dev/null | sed -n "/[Rr]emote storage/,/^$/p"
              '
          }

          echo "########## RUN 1 (cold local, cold remote - expect miss + remote write) ##########"
          run_build one 2>&1 | sed 's/^/  /'
          echo "########## RUN 2 (fresh local cache - expect REMOTE HIT) ##########"
          run_build two 2>&1 | sed 's/^/  /'
          rm -rf .probe

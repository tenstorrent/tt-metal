name: "Copilot Setup Steps"
# TEMPORARY PROBE 2 - can a docker container resolve the k8s service DNS for Garage?
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
jobs:
  copilot-setup-steps:
    runs-on: tt-ubuntu-2204-large-stable
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Garage reachability from container, bridge vs host network
        run: |
          IMG=ghcr.io/tenstorrent/tt-metal/tt-metalium/ubuntu-22.04-ci-build-amd64:latest
          EP=http://garage.garage.svc.cluster.local:3900
          docker pull -q "$IMG" >/dev/null

          echo "=== host (baseline) ==="
          curl -sS -m 8 -o /dev/null -w '  host: HTTP %{http_code} in %{time_total}s\n' "$EP" \
            || echo "  host: FAILED"

          for NET in "default-bridge" "host"; do
            echo "=== container network: $NET ==="
            ARGS=(--rm)
            [ "$NET" = "host" ] && ARGS+=(--network host)
            docker run "${ARGS[@]}" --user "$(id -u):$(id -g)" -e HOME=/tmp "$IMG" bash -lc "
              getent hosts garage.garage.svc.cluster.local >/dev/null 2>&1 \
                && echo '  DNS: resolves ->' \$(getent hosts garage.garage.svc.cluster.local | head -1) \
                || echo '  DNS: DOES NOT RESOLVE'
              curl -sS -m 8 -o /dev/null -w '  HTTP: %{http_code} in %{time_total}s\n' $EP 2>&1 \
                || echo '  HTTP: FAILED'
            " 2>&1 | sed 's/^/  /'
          done

      - name: Real ccache remote write/read through the wrapper
        env:
          AK: ${{ secrets.GARAGE_S3_ACCESS_KEY }}
          SK: ${{ secrets.GARAGE_S3_SECRET_KEY }}
        run: |
          IMG=ghcr.io/tenstorrent/tt-metal/tt-metalium/ubuntu-22.04-ci-build-amd64:latest
          EP=http://garage.garage.svc.cluster.local:3900
          REMOTE="s3://ccache|region=garage|prefix=tt-metal|endpoint_url=${EP}"
          mkdir -p .probe && printf '#include <string>\nint main(){std::string s="x";return s.size()-1;}\n' > .probe/a.cpp
          for NET in "" "--network host"; do
            LABEL="${NET:-default-bridge}"
            echo "=== ccache remote via ${LABEL} ==="
            docker run --rm $NET --user "$(id -u):$(id -g)" \
              -v "${GITHUB_WORKSPACE}:/work" -w /work \
              -e HOME=/tmp -e CCACHE_DIR=/tmp/cc -e CCACHE_REMOTE_STORAGE="$REMOTE" \
              -e AWS_ACCESS_KEY_ID="$AK" -e AWS_SECRET_ACCESS_KEY="$SK" \
              -e AWS_DEFAULT_REGION=garage -e AWS_ENDPOINT_URL_S3="$EP" \
              -e CCACHE_LOGFILE=/tmp/cc.log \
              "$IMG" bash -lc '
                ccache -z >/dev/null 2>&1
                ccache clang++-20 -std=c++20 -c .probe/a.cpp -o /tmp/a.o 2>&1 | tail -2
                echo "--- remote counters ---"
                ccache -sv 2>/dev/null | grep -iE "remote" | head -8
                echo "--- log errors ---"
                grep -iE "error|fail|denied|timed out" /tmp/cc.log 2>/dev/null | head -4 || echo "  (none)"
              ' 2>&1 | sed 's/^/  /'
          done
          rm -rf .probe

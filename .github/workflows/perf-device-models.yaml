name: "(Single-card) Device perf regressions"

on:
  workflow_dispatch:
    inputs:
      architecture:
        description: 'Architectures to test: ["blackhole"], ["wormhole_b0"], or both (default)'
        required: false
        type: string
        default: '["blackhole", "wormhole_b0"]'
      requested-models:
        description: 'List of requested models as JSON array, for example: ["vit"]. Default is ''all'''
        default: "all"
        type: string
      platform:
        required: false
        type: choice
        default: "Ubuntu 22.04"
        options:
          - "Ubuntu 22.04"
          - "Ubuntu 24.04"
        description: "Platform to build and test"
      build-type:
        required: false
        type: choice
        default: Release
        options:
          - Release
          - Debug
          - RelWithDebInfo
          - ASan
          - TSan
        description: "Build type configuration"
      enable-lto:
        required: false
        type: boolean
        default: false
        description: "Enable Link Time Optimization (LTO)"
  schedule:
    - cron: "0 2,8,14,20 * * *" # every 6 hours, 4 runs a day
run-name: "(Single-card) Device perf regressions"
jobs:
  check-harbor:
    uses: ./.github/workflows/check-harbor.yaml

  build-artifact-profiler:
    needs: check-harbor
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/build-artifact.yaml
    permissions:
      contents: read
      packages: write
    secrets: inherit
    with:
      harbor-prefix: ${{ needs.check-harbor.outputs.harbor-prefix }}
      build-type: ${{ inputs.build-type || 'Release' }}
      tracy: true
      build-inplace-wheel: true
      platform: ${{ inputs.platform || 'Ubuntu 22.04' }}
      enable-lto: ${{ inputs.enable-lto || false }}
  device-perf:
    needs: [check-harbor, build-artifact-profiler]
    if: ${{ !cancelled() && needs.build-artifact-profiler.result == 'success' }}
    secrets: inherit
    uses: ./.github/workflows/perf-device-models-impl.yaml
    with:
      docker-image: ${{ needs.build-artifact-profiler.outputs.dev-docker-image }}
      build-artifact-name: ${{ needs.build-artifact-profiler.outputs.build-artifact-name }}
      wheel-artifact-name: ${{ needs.build-artifact-profiler.outputs.wheel-artifact-name }}
      architecture: ${{ inputs.architecture || '["blackhole", "wormhole_b0"]' }}
      requested-models: ${{ inputs.requested-models || 'all' }}

name: "[eltwise] Determinism and correctness (daily)"

# Runs every eltwise op N times on identical inputs and requires that every run is bit-identical
# to the first, and that the first matches the golden. Run 1 populates the program cache and the
# rest hit it, so a cache-path divergence surfaces here rather than as an intermittent failure
# somewhere downstream.
#
# Deliberately standalone rather than an input on ttnn-run-sweeps: this needs its own schedule and
# its own failure signal, and folding it in would multiply device time for every op group rather
# than the eltwise ones.

on:
  workflow_dispatch:
    inputs:
      suite:
        description: "Which suite to run. 'default' is one vector per op at bfloat16 / 1x1x32x32 / DRAM; the others sweep a dtype, memory-config or shape axis."
        type: choice
        options:
          - default
          - dtypes
          - memory_configs
          - shapes
        default: default
      arch:
        type: choice
        options:
          - wormhole_b0
          - blackhole
        default: wormhole_b0
      runner-label:
        type: choice
        options:
          - N150
          - N300
          - P150b
        default: N150
  # Gate the PRs that can actually break this: the check itself, the runner it goes through, and
  # the eltwise op and SFPU sources it covers. Deliberately not every PR -- a run is a build plus
  # 192 vectors on a device, which is not worth spending on a diff that cannot affect the result.
  pull_request:
    branches:
      - "main"
    paths:
      - "tests/sweep_framework/sweeps/eltwise/**"
      - "tests/sweep_framework/sweeps_runner.py"
      - "tests/sweep_framework/sweep_utils/**"
      - ".github/workflows/ttnn-eltwise-determinism.yaml"
      - "ttnn/cpp/ttnn/operations/eltwise/**"
      - "tt_metal/hw/ckernels/**/llk_sfpu/**"
  schedule:
    # 05:00 UTC daily. ttnn-run-sweeps already occupies 02:00 and 03:00.
    - cron: "0 5 * * *"

run-name: "eltwise determinism [${{ inputs.suite || 'default' }}] (${{ inputs.arch || 'wormhole_b0' }})"

permissions:
  contents: read
  packages: write

jobs:
  check-harbor:
    uses: ./.github/workflows/check-harbor.yaml

  build-artifact:
    needs: check-harbor
    uses: ./.github/workflows/build-artifact.yaml
    permissions:
      contents: read
      packages: write
    secrets: inherit
    with:
      harbor-prefix: ${{ needs.check-harbor.outputs.harbor-prefix }}
      build-type: Release
      build-inplace-wheel: true

  eltwise-determinism:
    name: "eltwise determinism [${{ inputs.suite || 'default' }}]"
    needs: [check-harbor, build-artifact]
    if: ${{ !cancelled() && needs.build-artifact.result == 'success' }}
    container:
      image: ${{ needs.build-artifact.outputs.dev-docker-image }}
      env:
        TT_METAL_HOME: /work
        PYTHONPATH: /work
        LD_LIBRARY_PATH: /work/build/lib
        ARCH_NAME: ${{ inputs.arch || 'wormhole_b0' }}
        LOGURU_LEVEL: INFO
        GITHUB_ACTIONS: true
      volumes:
        - ${{ github.workspace }}/docker-job:/work
        - /dev/hugepages-1G:/dev/hugepages-1G
      options: "--device /dev/tenstorrent"
    defaults:
      run:
        shell: bash
        working-directory: /work
    timeout-minutes: 60
    runs-on: tt-ubuntu-2204-${{ inputs.runner-label || 'N150' }}-viommu-stable
    steps:
      - name: 🧬 Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        timeout-minutes: 20
        with:
          submodules: recursive
          path: docker-job
      - name: ⬇️  Setup Job
        uses: ./docker-job/.github/actions/setup-job
        timeout-minutes: 10
        with:
          build-artifact-name: ${{ needs.build-artifact.outputs.build-artifact-name }}
          wheel-artifact-name: ${{ needs.build-artifact.outputs.wheel-artifact-name }}
      - name: Generate sweep vectors
        run: |
          python3 tests/sweep_framework/sweeps_parameter_generator.py \
            --module-name eltwise.eltwise_determinism --tag ci-main
      - name: Run eltwise determinism and correctness
        run: |
          python3 tests/sweep_framework/sweeps_runner.py \
            --module-name eltwise.eltwise_determinism \
            --suite-name "${{ inputs.suite || 'default' }}" \
            --vector-source vectors_export \
            --result-dest results_export \
            --tag ci-main \
            --fail-on-test-failure \
            --summary
      - name: Upload test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: eltwise-determinism-report-${{ inputs.arch || 'wormhole_b0' }}
          path: /work/tests/sweep_framework/results_export/
          retention-days: 7

name: "LLK nightly watchdog"

# Messages the owner when the health check is disabled, did not run, or failed.
on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  watchdog:
    name: "Check that the health check reported"
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2 cachew: keep
        timeout-minutes: 20
        with:
          fetch-depth: 1
          sparse-checkout: |
            .github/workflows
            tt_metal/tt-llk/perf
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.10'
      - run: pip install pyyaml
      - name: Check and send
        env:
          GH_TOKEN: ${{ github.token }}
          SLACK_BOT_TOKEN: ${{ secrets.LLK_SLACK_REPORTING_BOT_TOKEN }}
          OWNER_SLACK_ID: U0BCPNHUF43
        run: |
          python3 tt_metal/tt-llk/perf/nightly_health.py --repo "$GITHUB_REPOSITORY" \
            --dm "$OWNER_SLACK_ID" --watchdog --out watchdog_payloads.json
          [ -f watchdog_payloads.json ] || exit 0
          python3 -c 'import json; print(json.dumps(json.load(open("watchdog_payloads.json"))[0]))' > payload.json
          RESPONSE=$(curl -sS -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer ${SLACK_BOT_TOKEN}" \
            -H "Content-type: application/json; charset=utf-8" \
            --data @payload.json)
          case "$RESPONSE" in
            *'"ok":true'*) echo "Sent." ;;
            *) echo "::error::Slack rejected the message: ${RESPONSE}"; exit 1 ;;
          esac

name: "LLK perf gate impl"

on:
  workflow_call:
    inputs:
      gate:
        description: "The gate in tt_metal/tt-llk/perf/gate_policy.yaml: pr, merge, nightly or nightly_sol"
        required: true
        type: string
      arch:
        description: "Architecture to gate on (wormhole or blackhole)"
        required: false
        default: wormhole
        type: string
      perf_run_id:
        description: >-
          The workflow run that produced this PR's perf data. Leave empty when a
          job in THIS run uploaded it; the download then reads the current run.
        required: false
        type: string
      baseline_run_id:
        description: "Baseline from this run's artifacts instead of the warehouse"
        required: false
        type: string
      warehouse_table:
        description: "Warehouse view (default TTDATASF.LLK_PERF.LLK_PERF_V)"
        required: false
        type: string
      baseline_match_ref:
        description: >-
          Take the warehouse run measured at the newest LLK perf change at or before
          merge-base(this ref, HEAD), where the merge gate uploads one. Blank takes
          the newest run.
        required: false
        default: ""
        type: string
      baseline_wait_minutes:
        description: "How long to wait for that run before taking an older one, marked stale"
        required: false
        default: "0"
        type: string
      stage2_baseline_artifact:
        description: >-
          Merge gate: the artifact in which llk-perf-impl's stage-2 baseline job saved the merge
          baseline, so the gate and stage 2 compare against the same read. Missing: the warehouse.
        required: false
        default: ""
        type: string
      baseline_artifact_pattern:
        description: >-
          Take the baseline from THIS run's artifacts matching this pattern
          instead of the warehouse, for a PR measured against its branch point.
        required: false
        default: ""
        type: string
      current_artifact_pattern:
        description: "Artifact pattern for the current side (blank = perf-data-<arch>-*)"
        required: false
        default: ""
        type: string
      baseline_commit:
        description: "Commit the baseline side was measured at, for the report"
        required: false
        default: ""
        type: string
      slack_on_pass:
        description: "Mark a pass as worth posting in the Slack part the caller posts"
        required: false
        default: true
        type: boolean
      pr_number:
        description: >-
          The PR the compared runs came from, when there is no pull_request
          event to read it from. Labels the report only.
        required: false
        type: string

permissions:
  actions: read
  contents: read
  checks: write
  pull-requests: write

env:
  LLK_PATH: tt_metal/tt-llk

jobs:
  llk-perf-gate:
    name: "Compare perf: current vs main"
    # Not ubuntu-slim: its 15-minute cap is shorter than a warehouse read plus the download retries.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2 cachew: keep
        timeout-minutes: 20
        # Only the scripts, with no history and no blobs. The full clone took up to 13 of
        # the 15 minutes an ubuntu-slim job gets. The warehouse step fetches the history it needs.
        with:
          sparse-checkout: |
            .github/scripts
            tt_metal/tt-llk/perf
          filter: blob:none

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -c tt_metal/tt-llk/perf/constraints.txt pandas pyyaml snowflake-connector-python cryptography

      - name: Download the baseline stage 2 read
        if: inputs.stage2_baseline_artifact != ''
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ inputs.stage2_baseline_artifact }}
          path: stage2_baseline

      - name: Read the baseline from the warehouse
        if: inputs.baseline_run_id == '' && inputs.baseline_artifact_pattern == ''
        env:
          SNOWFLAKE_ACCOUNT: TLUIIGS-MN66866
          SNOWFLAKE_USER: SVC_TTOPS_SWEEPS
          SNOWFLAKE_WAREHOUSE: PUBLIC
          SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SWEEPS_SNOWFLAKE_KEY }}
          LLK_PERF_WAREHOUSE_TABLE: >-
            ${{ inputs.warehouse_table || vars.LLK_PERF_WAREHOUSE_TABLE }}
        run: |
          python3 ${{ env.LLK_PATH }}/perf/gate.py baseline --gate "${{ inputs.gate }}" --arch "${{ inputs.arch }}" \
            --exclude-run "${{ inputs.perf_run_id || github.run_id }}" --wait-minutes "${{ inputs.baseline_wait_minutes }}" \
            --match-ref "${{ inputs.baseline_match_ref }}" --reuse stage2_baseline

      # The REST budget belongs to the installation and is shared by every
      # workflow in the repository, so a busy hour can refuse a download although
      # the data is there. It resets on the hour, and the refusal we saw cleared
      # 41 seconds later, so one wait and one more attempt are enough.
      - name: Download the baseline from a workflow run
        id: baseline_run_download
        if: inputs.baseline_run_id != ''
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: perf-data-${{ inputs.arch }}-*
          merge-multiple: true
          path: baseline_perf
          run-id: ${{ inputs.baseline_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Wait, then download the baseline again
        if: steps.baseline_run_download.outcome == 'failure'
        run: sleep 90

      - name: Download the baseline from a workflow run, second attempt
        if: steps.baseline_run_download.outcome == 'failure'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: perf-data-${{ inputs.arch }}-*
          merge-multiple: true
          path: baseline_perf
          run-id: ${{ inputs.baseline_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Take the baseline from this run's artifacts
        id: baseline_artifact_download
        if: inputs.baseline_artifact_pattern != ''
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: ${{ inputs.baseline_artifact_pattern }}
          merge-multiple: true
          path: baseline_perf

      - name: Wait, then take the baseline again
        if: steps.baseline_artifact_download.outcome == 'failure'
        run: sleep 90

      - name: Take the baseline from this run's artifacts, second attempt
        if: steps.baseline_artifact_download.outcome == 'failure'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: ${{ inputs.baseline_artifact_pattern }}
          merge-multiple: true
          path: baseline_perf

      - name: Download the PR's perf data
        id: current_download
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: ${{ inputs.current_artifact_pattern || format('perf-data-{0}-*', inputs.arch) }}
          merge-multiple: true
          path: current_perf
          run-id: ${{ inputs.perf_run_id || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Wait, then download the PR's perf data again
        if: steps.current_download.outcome == 'failure'
        run: sleep 90

      - name: Download the PR's perf data, second attempt
        if: steps.current_download.outcome == 'failure'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: ${{ inputs.current_artifact_pattern || format('perf-data-{0}-*', inputs.arch) }}
          merge-multiple: true
          path: current_perf
          run-id: ${{ inputs.perf_run_id || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download the merge gate's stage 2
        if: inputs.gate == 'merge'
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: llk-perf-stage2-${{ inputs.arch }}-*
          path: stage2

      # Writes verdict-<arch>.json in every case; the steps below read only that.
      - name: Compare regressions
        if: ${{ !cancelled() }}
        env:
          GATE: ${{ inputs.gate }}
          ARCH: ${{ inputs.arch }}
          CURRENT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CURRENT_LABEL: >-
            ${{ github.event_name == 'pull_request' && 'PR head'
                || github.event_name == 'merge_group' && 'merge queue' || github.ref_name }}
          BASELINE_COMMIT: ${{ inputs.baseline_artifact_pattern != '' && inputs.baseline_commit || '' }}
          BASELINE_RUN: ${{ inputs.baseline_run_id }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 ${{ env.LLK_PATH }}/perf/gate.py compare --gate "$GATE" --arch "$ARCH" \
            --current current_perf --baseline baseline_perf \
            --baseline-commit "$BASELINE_COMMIT" --baseline-run "$BASELINE_RUN" --stage2 'stage2/**/stage2.json' \
            --current-sha "$CURRENT_SHA" --current-label "$CURRENT_LABEL"
          cat perf_gate_report.md 2>/dev/null || true

      - name: Comment on PR
        if: >-
          ${{ !cancelled() && github.event_name == 'pull_request'
          && hashFiles('perf_gate_report.md') != '' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          ARCH: ${{ inputs.arch }}
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('perf_gate_report.md')) {
              core.warning('The comparison wrote no report; nothing to post.');
              return;
            }
            const marker = `<!-- llk-perf-gate:${process.env.ARCH} -->`;
            const body = `${marker}\n${fs.readFileSync('perf_gate_report.md', 'utf8')}`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const mine = comments.find(
              (c) => c.user.type === 'Bot' && c.body.startsWith(marker));
            if (mine) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
      - name: Upload the gate report
        id: report
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: llk-perf-gate-report-${{ inputs.arch }}
          path: |
            verdict-${{ inputs.arch }}.json
            perf_gate_report.md
            perf_gate_report.points.csv
            perf_gate_report.regressions.csv
          if-no-files-found: ignore

      - name: Build the Slack payload
        id: slack
        # Not after a cancel: a person or a newer push stopped the run on purpose.
        if: ${{ !cancelled() }}
        env:
          SLACK_CHANNEL_ID: ${{ secrets.LLK_PERF_GATE_SLACK_CHANNEL_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number || '?' }}
          PR_URL: >-
            ${{ github.event.pull_request.html_url
                || (inputs.pr_number
                    && format('{0}/{1}/pull/{2}', github.server_url, github.repository, inputs.pr_number))
                || '' }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          ARCH: ${{ inputs.arch }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # The merge gate run has many jobs; the anchor scrolls to this job's summary.
          REPORT_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}#summary-${{ job.check_run_id }}
          ARTIFACT_URL: ${{ steps.report.outputs.artifact-url }}
          COMMIT_SHA: ${{ github.sha }}
          TRIGGER: >-
            ${{ github.event_name == 'schedule' && 'nightly'
                || github.event_name == 'workflow_dispatch' && format('manual run on {0}', github.ref_name)
                || github.event_name }}
          SLACK_ON_PASS: ${{ inputs.slack_on_pass }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "$PR_NUMBER" == "?" && "$GITHUB_REF" =~ gh-readonly-queue/[^/]+/pr-([0-9]+)- ]]; then
            PR_NUMBER="${BASH_REMATCH[1]}"
            PR_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/pull/${PR_NUMBER}"
            PR_TITLE=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq .title) || PR_TITLE=""
            PR_AUTHOR=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq .user.login) || PR_AUTHOR=""
          fi

          python3 "${LLK_PATH}/perf/gate_slack_notify.py" \
            --verdict "verdict-${ARCH}.json" \
            --regressions perf_gate_report.regressions.csv \
            --channel "${SLACK_CHANNEL_ID:-unset}" \
            --pr-number "$PR_NUMBER" \
            --pr-url "$PR_URL" \
            --pr-title "$PR_TITLE" \
            --author "$PR_AUTHOR" \
            --run-url "$RUN_URL" \
            --report-url "$REPORT_URL" \
            --artifact-url "$ARTIFACT_URL" \
            --commit "$COMMIT_SHA" \
            --trigger "$TRIGGER" \
            --post-pass "$SLACK_ON_PASS" \
            --part-out slack_part.json \
            --out slack_payload.json && exit 0

          echo "::error::The gate could not build its Slack notification."
          echo "should_post=false" >> $GITHUB_OUTPUT

      # The caller can post one message for all arches from these (gate_slack_combine.py).
      - name: Upload the Slack part
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: llk-perf-gate-slack-${{ inputs.arch }}
          path: slack_part.json
          if-no-files-found: ignore

      - name: Gate verdict
        if: always()
        run: python3 ${{ env.LLK_PATH }}/perf/gate.py verdict "verdict-${{ inputs.arch }}.json"

name: "[internal] Create and Publish Release Docker Image"

on:
  workflow_call:
    inputs:
      version:
        required: false
        type: string
      platform:
        required: false
        type: string
        default: ubuntu-22.04
      image:
        required: true
        type: string
        description: "Image type: release, release-models or prefill-worker"
      tag-latest:
        required: false
        type: boolean
        default: false
      timeout:
        required: false
        type: number
        default: 10
      wheel-artifact-name:
        required: false
        type: string
        default: ""
        description: >-
          Wheel artifact installed by the image. Required for images built from
          the wheel (release); empty for derived images (see derive-from), which
          inherit an already-installed tt-metal from their base.
      derive-from:
        required: false
        type: string
        default: ""
        description: >-
          Build this image on top of ANOTHER image type from the same release
          instead of from the base OS + wheel, i.e.
          tt-metalium-<platform>-<derive-from>-amd64:<version>. The job that
          publishes that image type must therefore have completed first. When
          set, no tool layers, wheel or version args are passed to bake - the
          derived Dockerfile is expected to consume only its base contexts.
      builder-image:
        required: false
        type: string
        default: ""
        description: >-
          Image used for a derived image's throwaway compile stage (bake context
          'llm-build-base'). Must match the base's platform/python version.
      skip-smoke-test:
        required: false
        type: boolean
        default: false
        description: >-
          Skip the on-device smoke tests for this image. The retag-as-latest job
          still runs (it treats a skipped smoke test as non-blocking).
      dry-run:
        required: false
        type: boolean
        default: false
      harbor-prefix:
        required: false
        type: string
        default: ""
        description: "Harbor pull-through cache prefix (e.g. 'harbor.example.com/'). Empty to pull GHCR directly."
jobs:
  create-docker-release-image:
    name: Build ${{ inputs.image }} image
    permissions:
      contents: read
      packages: write
    runs-on: tt-ubuntu-2204-large-stable
    outputs:
      image_digest: ${{ steps.get-digest.outputs.IMAGE_DIGEST }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        timeout-minutes: 20
      - name: Extract Ubuntu version
        id: extract-version
        run: |
          PLATFORM="${{ inputs.platform }}"
          UBUNTU_VERSION="${PLATFORM#ubuntu-}"
          echo "version=$UBUNTU_VERSION" >> $GITHUB_OUTPUT
      - name: Capture proxy env for the buildx builder
        id: proxy-env
        run: |
          # This runner's proxy isn't inherited by the isolated buildx builder
          # (see docker-run/action.yml's forward_civ2_proxy_env_vars).
          # NO_PROXY is one entry, no comma - docker buildx create --driver-opt
          # can't handle commas in a value (docker/buildx#1133).
          echo "PROXY_HTTP=${HTTP_PROXY:-${http_proxy:-}}" >> "$GITHUB_ENV"
          echo "PROXY_HTTPS=${HTTPS_PROXY:-${https_proxy:-}}" >> "$GITHUB_ENV"
          echo "PROXY_NO_PROXY=tenstorrent.net" >> "$GITHUB_ENV"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          driver-opts: |
            env.HTTP_PROXY=${{ env.PROXY_HTTP }}
            env.HTTPS_PROXY=${{ env.PROXY_HTTPS }}
            env.NO_PROXY=${{ env.PROXY_NO_PROXY }}
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: https://ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check the build secret this image needs can read tt-llm-engine
        # Fail in seconds with an actionable message rather than minutes into the
        # build on a `git clone` that got an empty or under-scoped token. Checking
        # non-emptiness is not enough: the org-read PATs in this repo are minted
        # for read:org (org-membership lookups), which does NOT grant contents
        # read on a private repo - so probe the actual clone permission.
        if: ${{ inputs.image == 'prefill-worker' && !inputs.dry-run }}
        env:
          GH_TOKEN: ${{ secrets.TENSTORRENT_ORG_READ_TOKEN }}
          IMAGE: ${{ inputs.image }}
        run: |
          set -uo pipefail
          ENGINE_REPO="tenstorrent/tt-llm-engine"
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Secret TENSTORRENT_ORG_READ_TOKEN is empty or not set." \
              "The ${IMAGE} image clones the private ${ENGINE_REPO} and" \
              "cannot be built without a read token."
            exit 1
          fi
          if ! git ls-remote --exit-code -h \
                "https://x-access-token:${GH_TOKEN}@github.com/${ENGINE_REPO}.git" HEAD \
                > /dev/null 2>&1; then
            echo "::error::TENSTORRENT_ORG_READ_TOKEN cannot read ${ENGINE_REPO}." \
              "It is set, so this is a SCOPE problem: the token needs contents read" \
              "on that private repo (classic PAT 'repo', or a fine-grained PAT with" \
              "Contents: Read granted for ${ENGINE_REPO}) - read:org alone is not" \
              "enough. Fix the token's scope, or point gh-token at a secret that has it."
            exit 1
          fi
          echo "Token can read ${ENGINE_REPO}."
      - name: Download wheels
        if: ${{ inputs.wheel-artifact-name != '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.wheel-artifact-name }}
      - name: Get the name of the wheel and set up env variables
        id: generate-tag-name
        run: |
          if [ -n "${{ inputs.wheel-artifact-name }}" ]; then
            echo "WHEEL_FILENAME=$(ls -1 *.whl)" >> $GITHUB_ENV
          fi
          UBUNTU_VERSION="${{ steps.extract-version.outputs.version }}"
          echo "UBUNTU_VERSION=$UBUNTU_VERSION" >> $GITHUB_ENV
          echo "UBUNTU_VERSION=$UBUNTU_VERSION" >> $GITHUB_OUTPUT
          # Determine Python version based on Ubuntu version
          if [ "$UBUNTU_VERSION" = "24.04" ]; then
            PYTHON_VERSION="3.12"
          else
            PYTHON_VERSION="3.10"
          fi
          echo "PYTHON_VERSION=$PYTHON_VERSION" >> $GITHUB_ENV
          echo "PYTHON_VERSION=$PYTHON_VERSION" >> $GITHUB_OUTPUT
          REPO_IMAGE_NAME=ghcr.io/${{ github.repository }}/tt-metalium-${{ inputs.platform }}-${{ inputs.image }}-amd64
          echo "REPO_IMAGE_NAME=$REPO_IMAGE_NAME" >> $GITHUB_ENV
          TAG_NAME=$REPO_IMAGE_NAME:${{ inputs.version }}
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV
      - name: Compute tool tags
        id: tool-tags
        run: |
          TOOL_TAGS=$(.github/scripts/compute-tool-tags.sh "${{ github.repository }}")
          {
            echo "tool_tags<<EOF"
            echo "$TOOL_TAGS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Prepare bake overrides
        id: bake
        env:
          TOOL_TAGS: ${{ steps.tool-tags.outputs.tool_tags }}
          TAG_NAME: ${{ env.TAG_NAME }}
          WHEEL_FILENAME: ${{ env.WHEEL_FILENAME }}
          UBUNTU_VERSION: ${{ env.UBUNTU_VERSION }}
          PYTHON_VERSION: ${{ env.PYTHON_VERSION }}
          HARBOR_PREFIX: ${{ inputs.harbor-prefix }}
          PLATFORM: ${{ inputs.platform }}
          VERSION: ${{ inputs.version }}
          DERIVE_FROM: ${{ inputs.derive-from }}
          BUILDER_IMAGE: ${{ inputs.builder-image }}
          PROXY_HTTP: ${{ env.PROXY_HTTP }}
          PROXY_HTTPS: ${{ env.PROXY_HTTPS }}
          PROXY_NO_PROXY: ${{ env.PROXY_NO_PROXY }}
        run: |
          set -euo pipefail
          TARGET="${{ inputs.image }}"
          SET=""
          if [ -n "$DERIVE_FROM" ]; then
            # Derived image: it layers on an image type published earlier in this
            # same release, so it needs neither tool layers nor the wheel.
            BASE_IMAGE="ghcr.io/${GITHUB_REPOSITORY}/tt-metalium-${PLATFORM}-${DERIVE_FROM}-amd64:${VERSION}"
            if [ -z "$BUILDER_IMAGE" ]; then
              echo "::error::derive-from=${DERIVE_FROM} was given without builder-image."
              exit 1
            fi
            echo "Deriving ${TARGET} from ${BASE_IMAGE} (builder: ${BUILDER_IMAGE})"
            # Deliberately NOT Harbor-prefixed: both refs are ghcr.io images from
            # this very run (the base was pushed minutes ago), and a pull-through
            # cache can serve a stale miss for a tag that new. The tool images
            # below are long-lived, which is why those do go through Harbor.
            SET+="${TARGET}.contexts.release-base=docker-image://${BASE_IMAGE}"$'\n'
            SET+="${TARGET}.contexts.llm-build-base=docker-image://${BUILDER_IMAGE}"$'\n'
          else
            TOOLS=(ccache mold doxygen clangbuildanalyzer gdb cmake yq zstd sfpi openmpi)
            for tool in "${TOOLS[@]}"; do
              tag=$(echo "$TOOL_TAGS" | jq -r ".\"${tool}-tag\"")
              [ "$tag" = "null" ] && { echo "ERROR: missing tag for tool '$tool' in compute-tool-tags output"; exit 1; }
              SET+="${TARGET}.contexts.${tool}-layer=docker-image://${HARBOR_PREFIX}${tag}"$'\n'
            done
            SET+="${TARGET}.args.WHEEL_FILENAME=${WHEEL_FILENAME}"$'\n'
            SET+="${TARGET}.args.UBUNTU_VERSION=${UBUNTU_VERSION}"$'\n'
            SET+="${TARGET}.args.PYTHON_VERSION=${PYTHON_VERSION}"$'\n'
            SET+="${TARGET}.args.GIT_REF=${{ github.ref_name || 'main' }}"$'\n'
          fi
          SET+="${TARGET}.tags=${TAG_NAME}"$'\n'
          SET+="${TARGET}.output=type=image,push=true,compression=zstd,compression-level=22,force-compression=true,oci-mediatypes=true"$'\n'
          # RUN steps (apt-get, curl, uv pip) need the proxy too - BuildKit
          # auto-propagates these build-arg names into every RUN with no ARG
          # declaration needed.
          if [ -n "$PROXY_HTTP" ]; then
            SET+="${TARGET}.args.HTTP_PROXY=${PROXY_HTTP}"$'\n'
            SET+="${TARGET}.args.HTTPS_PROXY=${PROXY_HTTPS}"$'\n'
            SET+="${TARGET}.args.NO_PROXY=${PROXY_NO_PROXY}"$'\n'
          fi
          {
            echo "set<<EOF"
            echo "$SET"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          # Consumed directly by manual-docker-bake.sh (SBOM generator, oras
          # binary for enrichment), not as a build-stage context.
          echo "syft-scanner-image=$(echo "$TOOL_TAGS" | jq -r '."syft-scanner-tag"')" >> "$GITHUB_OUTPUT"
          echo "oras-image=$(echo "$TOOL_TAGS" | jq -r '."oras-tag"')" >> "$GITHUB_OUTPUT"
      - name: Build and push (skipped for dry run)
        if: ${{ !inputs.dry-run }}
        uses: ./.github/actions/manual-docker-bake
        with:
          targets: ${{ inputs.image }}
          set-lines: ${{ steps.bake.outputs.set }}
          syft-scanner-image: ${{ steps.bake.outputs.syft-scanner-image }}
          oras-image: ${{ steps.bake.outputs.oras-image }}
          # Consumed only by targets declaring a gh_token BuildKit secret
          # (prefill-worker clones the private tenstorrent/tt-llm-engine);
          # empty and unused for every other image.
          gh-token: ${{ secrets.TENSTORRENT_ORG_READ_TOKEN }}
          # Cheap insurance against transient blips - the actual fix for the
          # timeouts we hit is the proxy env forwarded above.
          retries: "2"
          retry-delay-seconds: "15"
          harbor-prefix: ${{ inputs.harbor-prefix }}
      - name: Get image digest
        if: ${{ !inputs.dry-run }}
        id: get-digest
        run: |
          DIGEST=$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "${{ env.TAG_NAME }}")
          IMAGE_ID="${{ env.REPO_IMAGE_NAME }}@${DIGEST}"
          echo "Built image: $IMAGE_ID"
          echo "IMAGE_DIGEST=$IMAGE_ID" >> $GITHUB_OUTPUT

  smoke-test-docker-image:
    if: ${{ !inputs.dry-run && !inputs.skip-smoke-test }}
    needs: create-docker-release-image
    strategy:
      matrix:
        test_group:
          [
              {
                runs-on: ["cloud-virtual-machine", "N150", "in-service"],
                cmd: pytest tests/end_to_end_tests,
                arch: wormhole_b0,
              },
              {
                runs-on: ["cloud-virtual-machine", "N300", "in-service"],
                cmd: pytest tests/end_to_end_tests,
                arch: wormhole_b0,
              },
          ]
    runs-on: ${{ matrix.test_group.runs-on }}
    container:
      image: ${{ needs.create-docker-release-image.outputs.image_digest }}
      env:
        LOGURU_LEVEL: INFO
        ARCH_NAME: ${{ matrix.test_group.arch }}
        GITHUB_ACTIONS: true
      volumes:
        - ${{ github.workspace }}/docker-job:/work # Subdir to workaround https://github.com/actions/runner/issues/691
        - /dev/hugepages-1G:/dev/hugepages-1G
      options: "--device /dev/tenstorrent"
    defaults:
      run:
        shell: bash
        working-directory: /work # https://github.com/actions/runner/issues/878
    steps:
      - name: Install Tools
        run: |
          apt-get update && apt-get install -y git
      - name: ⬇️ Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        timeout-minutes: 20
        with:
          submodules: recursive
          path: docker-job # Here be dragons; keep it scoped to our desired volume, yet must be under github.workspace and be sure to clean up at the end
      - name: Test ttnn import
        timeout-minutes: 1
        run: |
            python -c "import ttnn"
      - name: Run frequent regression tests
        timeout-minutes: ${{ inputs.timeout }}
        run: |
            uv pip install --extra-index-url https://download.pytorch.org/whl/cpu --index-strategy unsafe-best-match 'torch>=2.7.1'
            uv pip install 'numpy>=1.24.4,<2' pytest
            ${{ matrix.test_group.cmd }}
      - uses: tenstorrent/tt-metal/.github/actions/cleanup@main
        if: always()
  tag-docker-image-as-latest:
    # A SKIPPED smoke test (skip-smoke-test) must not block the retag, but a
    # FAILED one still must - hence the explicit result checks instead of relying
    # on needs, which would skip this job in both cases.
    if: >-
      ${{ !inputs.dry-run && !cancelled()
      && needs.create-docker-release-image.result == 'success'
      && (needs.smoke-test-docker-image.result == 'success'
      || needs.smoke-test-docker-image.result == 'skipped') }}
    needs: [smoke-test-docker-image, create-docker-release-image]
    runs-on: ubuntu-latest
    steps:
      - name: Docker login
        uses: docker/login-action@v3
        with:
          registry: https://ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag latest if this is a major version release
        run: |
          set -eu # basic shell hygiene
          LATEST_TAG=latest
          if [ "${{ inputs.tag-latest }}" = "true" ]; then
            LATEST_TAG=latest
          else
            LATEST_TAG=latest-rc
          fi
          echo "Determined that the current tag is " $LATEST_TAG
          REPO_IMAGE_NAME=ghcr.io/${{ github.repository }}/tt-metalium-${{ inputs.platform }}-${{ inputs.image }}-amd64
          # Pull by digest to ensure we tag the exact image we built and tested
          IMAGE_DIGEST="${{ needs.create-docker-release-image.outputs.image_digest }}"
          docker pull "$IMAGE_DIGEST"
          echo "Tagging image $IMAGE_DIGEST as $REPO_IMAGE_NAME:$LATEST_TAG"
          docker tag "$IMAGE_DIGEST" "$REPO_IMAGE_NAME:$LATEST_TAG"
          echo "Pushing image with tag $REPO_IMAGE_NAME:$LATEST_TAG"
          docker push "$REPO_IMAGE_NAME:$LATEST_TAG"

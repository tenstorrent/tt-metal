name: CodeOwners Group Analysis

# Launchpad for the "Ping pending code owners" checkbox in the PR description.
# It runs with no secrets and no write access (fork PRs included), so it only
# decides whether the box was just ticked and hands the request to
# codeowners-group-analysis-impl.yaml through an artifact. The impl treats that
# artifact as untrusted and re-checks everything. Comment commands and manual
# runs go straight to the impl.

on:
  pull_request:
    types: [opened, edited]

permissions: {}

jobs:
  checkbox:
    # Substring prefilter; the parse step decides the unticked -> ticked
    # transition. Untick and tick again to re-ping.
    if: >-
      contains(github.event.pull_request.body, '[x] Ping pending code owners') &&
      (github.event.action == 'opened' || github.event.changes.body != null)
    runs-on: ubuntu-slim
    steps:
      - name: Parse description checkbox
        id: parse
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_ACTION: ${{ github.event.action }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PREVIOUS_BODY: ${{ github.event.changes.body.from }}
        run: |
          # Confirm the box is a real top-level task-list line (not text in a
          # comment or code block) that is ticked now and was not ticked before.
          # Four or more leading spaces make the line an indented code block, so
          # at most three are allowed.
          TICKED_LINE='^ {0,3}[-*] \[[xX]\] Ping pending code owners[[:space:]]*$'
          # Drop fenced code blocks and HTML comments before matching.
          markdown_text() {
            printf '%s\n' "$1" | tr -d '\r' | awk '
              # A fence closes only on the same character, at least as long, with
              # nothing after it (CommonMark), so ~~~ inside a ``` block stays code.
              # Like the checkbox, a fence may be indented at most three spaces.
              match($0, /^ ? ? ?(````*|~~~~*)/) {
                m = substr($0, RSTART, RLENGTH); sub(/^ */, "", m)
                rest = substr($0, RSTART + RLENGTH)
                if (!fence) { fence = 1; fch = substr(m, 1, 1); flen = length(m); next }
                if (substr(m, 1, 1) == fch && length(m) >= flen && rest ~ /^[[:space:]]*$/) { fence = 0; next }
              }
              fence { next }
              { line = $0
                while (1) {
                  if (incomment) { e = index(line, "-->"); if (!e) { line = ""; break }
                                   line = substr(line, e + 3); incomment = 0 }
                  s = index(line, "<!--"); if (!s) break
                  out = out substr(line, 1, s - 1); line = substr(line, s + 4); incomment = 1
                }
                print out line; out = "" }'
          }
          if ! markdown_text "$PR_BODY" | grep -qE "$TICKED_LINE"; then
            echo "Checkbox is not ticked as a task-list item; nothing to do"
            exit 0
          fi
          if [ "$EVENT_ACTION" = "edited" ] && markdown_text "$PREVIOUS_BODY" | grep -qE "$TICKED_LINE"; then
            echo "Checkbox was already ticked before this edit; nothing to do"
            exit 0
          fi

          mkdir -p "$RUNNER_TEMP/request"
          jq -n --arg pr "$PR_NUMBER" '{pr_number: $pr}' > "$RUNNER_TEMP/request/request.json"
          echo "requested=true" >> "$GITHUB_OUTPUT"
          echo "Checkbox ticked on PR #$PR_NUMBER; handing over to the impl"

      - name: Hand over to the impl
        if: steps.parse.outputs.requested == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codeowners-checkbox-request
          path: ${{ runner.temp }}/request/request.json
          retention-days: 1
          if-no-files-found: error

name: "PR Sous Chef (tt-metal)"
on:
  issue_comment:
    types:
      - created
      - edited
  # permissions: # Permissions applied to pre-activation job
  # checks: read
  # issues: read
  # pull-requests: read
  schedule:
    - cron: "2/15 * * * *"
  # skip-if-no-match: is:pr is:open -is:draft label:copilot-flow author:app/copilot-swe-agent # Skip-if-no-match processed as search check in pre-activation job
  # steps: # Steps injected into pre-activation job
  # - id: prefilter
  # name: Prefilter and rank copilot-flow PRs
  # uses: actions/github-script@v9.0.0
  # with:
  # script: "const { owner, repo } = context.repo;\n\n// ---- tt-metal configuration -------------------------------------------------\n// Provenance label applied by copilot-flow-ready.yaml (see that file's header).\nconst FLOW_LABEL = 'copilot-flow';\n// Hidden markers. NUDGE_MARKER + \"@copilot\" = an actionable nudge (counts for\n// cooldown, \"no two in a row\" and the per-PR cap); NUDGE_MARKER without \"@copilot\"\n// = informational (slash-command replies), counts for nothing. HANDOFF_MARKER =\n// the one comment posted when the per-PR cap is hit; a PR that has it is never\n// nudged again by this workflow.\nconst NUDGE_MARKER = '<!-- gh-aw-pr-sous-chef-nudge -->';\nconst HANDOFF_MARKER = '<!-- gh-aw-pr-sous-chef-handoff -->';\n// Upstream: 30 min. A tt-metal Copilot session runs up to 59 min and pr-gate ~20\n// min, and the session-in-progress filter below already covers \"Copilot is on\n// it\"; 60 min is for the case where the mention did not start a session at all.\nconst COOLDOWN_MS = 60 * 60 * 1000;\n// Upstream ignores checks that have been running for >1h so long agentic checks do\n// not block nudges forever. pr-gate on a Copilot PR takes ~20 min, but tt-metal's\n// hardware queues can hold a job QUEUED much longer; 90 min keeps nudges from\n// firing during a merely slow (not stuck) pipeline.\nconst PENDING_CHECK_MAX_AGE_MS = 90 * 60 * 1000;\n// Upstream default: a PR with zero changed files 24h after creation is \"stalled\".\nconst ZERO_DIFF_AGE_MS = 24 * 60 * 60 * 1000;\n// NEW vs upstream: after this many actionable nudges on one PR, stop mentioning\n// Copilot and post one hand-off comment for humans instead. Without a cap, a PR\n// whose CI keeps failing would burn one Copilot session per hour indefinitely.\nconst MAX_NUDGES_PER_PR = 6;\n// Upstream: 4 nudges per run. Also the hard cap on how many PRs' context goes into\n// the agent prompt (each PR ~2-4 KB with thread excerpts; the step-output limit is\n// 1 MB but every excerpt is untrusted text in the prompt).\nconst MAX_ELIGIBLE = 4;\n// Untrusted review-comment text placed in the agent prompt is truncated to this.\nconst EXCERPT_MAX = 300;\n// Threads per PR carried into the prompt (newest first).\nconst MAX_THREADS_PER_PR = 10;\n// Combined cap on thread IDs handed to the agent for resolution per run. MUST equal\n// `safe-outputs.resolve-pull-request-review-thread.max` below: the prompt says\n// \"resolve every listed ID\", so the list has to fit the handler's budget or the\n// last calls of a large backlog would be rejected nondeterministically. IDs beyond\n// the cap are simply deferred to the next tick.\nconst RESOLVE_THREADS_MAX = 20;\n// Same predicate as issue-monster.md / copilot-flow-ready.yaml.\nconst isCopilotActor = (login) => /^copilot/i.test(login || '');\n// Explicit allowlist of review-bot logins whose unresolved threads may be resolved\n// once Copilot's reply is the latest comment. Case-normalized, `[bot]` suffix\n// stripped, and the actor must be GraphQL type Bot. Verified against real Copilot\n// PRs in this repo (2026-09-28):\n//   copilot-pull-request-reviewer  Copilot code review (ruleset \"Automatic Copilot PR Review\")\n//   github-actions                 the gh-aw reviewers (tenstorrent-skills-reviewer,\n//                                  mattpocock-skills-reviewer) post their review threads\n//                                  with GITHUB_TOKEN, so this is their GraphQL login;\n//                                  the repo has no GH_AW_GITHUB_TOKEN secret that would\n//                                  change it. Any other repo workflow posting review\n//                                  threads as github-actions is repo-controlled code.\n// NOT on the list, and seen on Copilot PRs here: `cycode-security` (Bot). Its\n// threads — and any other bot's — are treated exactly like a human reviewer's:\n// listed for Copilot to answer, never resolved by this workflow.\nconst RESOLVABLE_REVIEWER_BOTS = new Set(['copilot-pull-request-reviewer', 'github-actions']);\nconst isResolvableReviewerBot = (node) => node?.__typename === 'Bot'\n  && RESOLVABLE_REVIEWER_BOTS.has((node?.login || '').toLowerCase().replace(/\\[bot\\]$/, ''));\n// Identity this workflow's own safe-output comments are posted under. gh-aw uses\n// GH_AW_GITHUB_MCP_SERVER_TOKEN || GH_AW_GITHUB_TOKEN || GITHUB_TOKEN; tt-metal has\n// neither GH_AW_* secret, so comments come from github-actions[bot] (REST login).\n// The hidden NUDGE/HANDOFF markers are public strings (they are in this file), so\n// they are only trusted in comments from this identity — a forged marker from any\n// other commenter is ignored (and counted, see `ignored_untrusted_markers`). If a\n// GH_AW_* token is ever provisioned, update this login or the cap/cooldown will\n// stop seeing the workflow's own history and nudge MORE often, not less.\nconst SOUS_CHEF_LOGIN = 'github-actions[bot]';\nconst isOwnComment = (c) => c?.user?.type === 'Bot' && (c.user.login || '').toLowerCase() === SOUS_CHEF_LOGIN;\n// ------------------------------------------------------------------------------\n\nconst now = Date.now();\nconst counters = {\n  fetched: 0, filtered_checks_pending: 0, filtered_copilot_session_active: 0,\n  filtered_handed_off: 0, filtered_last_comment_from_sous_chef: 0, filtered_cooldown: 0,\n  filtered_nothing_actionable: 0, filtered_error: 0, eligible: 0, nudge_capped: 0,\n  ignored_untrusted_markers: 0, resolvable_threads_deferred: 0\n};\nconst reasons = {}; // number -> why it was filtered (for the /souschef reply)\nconst eligible = [];\n// Marker predicates take the whole REST comment so authorship is always checked.\nconst hasMarker = (c, marker) => (c?.body || '').includes(marker);\nconst isNudge = (c) => isOwnComment(c) && hasMarker(c, NUDGE_MARKER) && (c.body || '').includes('@copilot');\nconst isHandoff = (c) => isOwnComment(c) && hasMarker(c, HANDOFF_MARKER);\n\nconst q = `repo:${owner}/${repo} is:pr is:open draft:false label:${FLOW_LABEL} author:app/copilot-swe-agent`;\nconst search = await github.rest.search.issuesAndPullRequests({ q, per_page: 50, sort: 'updated', order: 'desc' });\ncounters.fetched = search.data.items.length;\ncore.info(`Candidates: ${counters.fetched}`);\n\nfor (const item of search.data.items) {\n  const number = item.number;\n  try {\n    // One GraphQL query per PR for everything except the Copilot session events.\n    // statusCheckRollup contexts are paginated: pr-gate alone fans out into dozens\n    // of check runs.\n    const fetchPr = (after) => github.graphql(`\n      query($owner: String!, $repo: String!, $number: Int!, $after: String) {\n        repository(owner: $owner, name: $repo) {\n          pullRequest(number: $number) {\n            number title url isDraft state createdAt updatedAt changedFiles\n            mergeStateStatus reviewDecision headRefOid headRefName\n            author { login }\n            commits(last: 1) {\n              nodes { commit { committedDate\n                statusCheckRollup { contexts(first: 100, after: $after) {\n                  pageInfo { hasNextPage endCursor }\n                  nodes {\n                    __typename\n                    ... on CheckRun { name status conclusion startedAt detailsUrl }\n                    ... on StatusContext { context state targetUrl }\n                  } } } } }\n            }\n            reviewThreads(first: 50) {\n              nodes { id isResolved isOutdated path\n                comments { totalCount }\n                firstComment: comments(first: 1) { nodes { author { login __typename } body createdAt url } }\n                lastComment: comments(last: 1) { nodes { author { login __typename } createdAt } } }\n            }\n          }\n        }\n      }`, { owner, repo, number, after });\n    let data = await fetchPr(null);\n    let pr = data?.repository?.pullRequest;\n    if (!pr || pr.state !== 'OPEN' || pr.isDraft) { reasons[number] = 'no longer open and non-draft'; continue; }\n    let contexts = pr.commits?.nodes?.[0]?.commit?.statusCheckRollup?.contexts;\n    let checks = [...(contexts?.nodes || [])];\n    let guard = 0;\n    while (contexts?.pageInfo?.hasNextPage && guard++ < 10) {\n      data = await fetchPr(contexts.pageInfo.endCursor);\n      contexts = data?.repository?.pullRequest?.commits?.nodes?.[0]?.commit?.statusCheckRollup?.contexts;\n      checks.push(...(contexts?.nodes || []));\n    }\n\n    // Filter 1 — checks still running (young enough to be genuinely in flight).\n    const pendingCutoff = now - PENDING_CHECK_MAX_AGE_MS;\n    const checksPending = checks.some(c => {\n      if (c.__typename === 'CheckRun') {\n        const pending = ['QUEUED', 'IN_PROGRESS', 'REQUESTED', 'PENDING'].includes(c.status || 'COMPLETED');\n        if (!pending) return false;\n        const ts = c.startedAt ? new Date(c.startedAt).getTime() : null;\n        return ts === null || ts > pendingCutoff;\n      }\n      return c.__typename === 'StatusContext' && c.state === 'PENDING';\n    });\n    if (checksPending) { counters.filtered_checks_pending++; reasons[number] = 'checks still running'; continue; }\n\n    // Filter 2 (new vs upstream) — Copilot is working on it right now. Exact signal:\n    // the latest copilot_work_* timeline event is copilot_work_started.\n    const timeline = await github.paginate(github.rest.issues.listEventsForTimeline, { owner, repo, issue_number: number, per_page: 100 });\n    let session = 'none';\n    for (const ev of timeline) if (typeof ev.event === 'string' && ev.event.startsWith('copilot_work_')) session = ev.event;\n    if (session === 'copilot_work_started') { counters.filtered_copilot_session_active++; reasons[number] = 'Copilot session in progress'; continue; }\n\n    // ALL issue comments (REST, paginated, newest first). They are the persistence\n    // for the nudge cap, the cooldown and the hand-off marker, so a recency window\n    // is not acceptable: on a busy PR thirty newer comments would hide the history\n    // and restart a fresh nudge cycle. Marker predicates above also require the\n    // comment to be authored by this workflow's identity.\n    const comments = (await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: number, per_page: 100 }))\n      .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));\n    const forged = comments.filter(c => !isOwnComment(c) && (hasMarker(c, NUDGE_MARKER) || hasMarker(c, HANDOFF_MARKER)));\n    if (forged.length) {\n      counters.ignored_untrusted_markers += forged.length;\n      core.warning(`#${number}: ignored ${forged.length} sous-chef marker(s) in comments not authored by ${SOUS_CHEF_LOGIN} (${[...new Set(forged.map(c => c.user?.login))].join(', ')})`);\n    }\n    // Filter 3 (new) — handed off to humans after the nudge cap.\n    if (comments.some(isHandoff)) { counters.filtered_handed_off++; reasons[number] = `handed off to maintainers after ${MAX_NUDGES_PER_PR} nudges`; continue; }\n\n    const conflicting = pr.mergeStateStatus === 'CONFLICTING';\n    const headDate = new Date(pr.commits?.nodes?.[0]?.commit?.committedDate || 0).getTime();\n    const nudges = comments.filter(isNudge);\n    const lastNudgeAt = nudges.length ? new Date(nudges[0].created_at).getTime() : null;\n    // Filter 4 — upstream: never two actionable nudges in a row (except when\n    // CONFLICTING). tt-metal refinement: a nudge followed by a Copilot push that\n    // changed the head is a NEW state (CI ran again on new code) and may be\n    // re-evaluated; only an unanswered nudge (head unchanged since) blocks.\n    if (comments.length && isNudge(comments[0]) && !conflicting && headDate <= new Date(comments[0].created_at).getTime()) {\n      counters.filtered_last_comment_from_sous_chef++; reasons[number] = 'last comment is an unanswered sous-chef nudge (no push since)'; continue;\n    }\n    // Filter 5 — cooldown since the last actionable nudge.\n    if (lastNudgeAt !== null && now - lastNudgeAt < COOLDOWN_MS) { counters.filtered_cooldown++; reasons[number] = 'inside the 60 min cooldown'; continue; }\n\n    // Context for the agent.\n    const failedForCopilot = [];\n    const needsMaintainerApproval = [];\n    for (const c of checks) {\n      if (c.__typename === 'CheckRun') {\n        if (c.status === 'WAITING' || c.conclusion === 'ACTION_REQUIRED') needsMaintainerApproval.push({ name: c.name, url: c.detailsUrl || null });\n        else if (['FAILURE', 'TIMED_OUT', 'STARTUP_FAILURE'].includes(c.conclusion || '')) failedForCopilot.push({ name: c.name, conclusion: c.conclusion, url: c.detailsUrl || null });\n      } else if (c.__typename === 'StatusContext' && ['FAILURE', 'ERROR'].includes(c.state || '')) {\n        failedForCopilot.push({ name: c.context, conclusion: c.state, url: c.targetUrl || null });\n      }\n    }\n    const excerpt = (s) => (s || '').replace(/\\s+/g, ' ').trim().slice(0, EXCERPT_MAX);\n    // `copilot_replied` is decided by the thread's LATEST comment only: a thread is\n    // answered when the last word is Copilot's. A reviewer follow-up after Copilot's\n    // reply makes it unanswered again (and un-resolvable), however long the thread.\n    const threads = (pr.reviewThreads?.nodes || []).filter(t => !t.isResolved).map(t => {\n      const first = t.firstComment?.nodes?.[0];\n      const last = t.lastComment?.nodes?.[0];\n      const total = t.comments?.totalCount ?? 0;\n      const copilotReplied = total > 1 && isCopilotActor(last?.author?.login);\n      return {\n        id: t.id, path: t.path || null, url: first?.url || null, outdated: !!t.isOutdated,\n        reviewer: first?.author?.login || 'unknown', reviewer_is_resolvable_bot: isResolvableReviewerBot(first?.author),\n        excerpt: excerpt(first?.body), comment_count: total, copilot_replied: copilotReplied,\n        last_reply_by: total > 1 ? (last?.author?.login || 'unknown') : null\n      };\n    }).sort((a, b) => (b.url || '').localeCompare(a.url || '')).slice(0, MAX_THREADS_PER_PR);\n    const resolvableBotThreads = threads.filter(t => t.reviewer_is_resolvable_bot && t.copilot_replied && !t.outdated).map(t => t.id);\n    const unansweredThreads = threads.filter(t => !t.copilot_replied);\n    const zeroDiffStalled = (pr.changedFiles ?? -1) === 0 && now - new Date(pr.createdAt).getTime() >= ZERO_DIFF_AGE_MS;\n    const nudgeCapped = nudges.length >= MAX_NUDGES_PER_PR;\n\n    // Filter 6 (new) — nothing actionable. A PR that is green and merely waiting\n    // for a human reviewer (or only has runs stuck on the maintainer approval gate)\n    // has nothing for Copilot to do and nothing for this workflow to resolve; the\n    // prompt's rule 4 would end in `noop`, so do not start a paid agent session for\n    // it. Same for a nudge-capped PR: the hand-off is only worth posting when\n    // something is actually still wrong.\n    const needsNudge = conflicting || zeroDiffStalled || failedForCopilot.length > 0 || unansweredThreads.length > 0;\n    if (!needsNudge && resolvableBotThreads.length === 0) {\n      counters.filtered_nothing_actionable++;\n      reasons[number] = needsMaintainerApproval.length\n        ? 'nothing for Copilot to do: only runs waiting on a maintainer to approve them'\n        : 'nothing for Copilot to do: green and waiting on a human';\n      continue;\n    }\n    if (nudgeCapped) counters.nudge_capped++;\n    // Priority: 0 conflict, 1 zero-diff stall, 2 needs a nudge (failed checks or\n    // threads whose latest comment is not Copilot's), 3 only bot threads to resolve.\n    const bucket = conflicting ? 0 : zeroDiffStalled ? 1 : needsNudge ? 2 : 3;\n\n    eligible.push({\n      number, title: pr.title, url: pr.url, headRefOid: pr.headRefOid, headRefName: pr.headRefName,\n      createdAt: pr.createdAt, updatedAt: pr.updatedAt, changedFiles: pr.changedFiles,\n      mergeStateStatus: pr.mergeStateStatus, reviewDecision: pr.reviewDecision,\n      copilot_session: session, zero_diff_stalled: zeroDiffStalled,\n      nudge_count: nudges.length, nudge_capped: nudgeCapped, needs_nudge: needsNudge,\n      failed_checks_for_copilot: failedForCopilot, checks_needing_maintainer_approval: needsMaintainerApproval,\n      unresolved_threads: threads, resolvable_bot_threads: resolvableBotThreads,\n      priority_bucket: bucket\n    });\n  } catch (error) {\n    counters.filtered_error++; reasons[number] = `could not evaluate: ${error.message}`;\n    core.warning(`#${number}: ${error.message}`);\n  }\n}\n\n// Deterministic priority (applied here instead of by the agent): conflicts,\n// zero-diff stalls, PRs that need a nudge, PRs with only bot threads to resolve,\n// then most recently updated; lower PR number breaks ties. (Upstream ranks \"human\n// threads the author answered\" third because it resolves those; this port never\n// resolves human threads, so an answered thread is not actionable here.)\neligible.sort((a, b) => a.priority_bucket - b.priority_bucket\n  || new Date(b.updatedAt) - new Date(a.updatedAt) || a.number - b.number);\nconst selected = eligible.slice(0, MAX_ELIGIBLE);\ncounters.eligible = selected.length;\n\n// Keep the total number of thread IDs the prompt asks the agent to resolve within\n// the safe-output handler's budget (RESOLVE_THREADS_MAX == resolve-pull-request-\n// review-thread.max). Higher-priority PRs keep theirs; the rest are deferred.\nlet resolveBudget = RESOLVE_THREADS_MAX;\nfor (const p of selected) {\n  const keep = p.resolvable_bot_threads.slice(0, Math.max(0, resolveBudget));\n  counters.resolvable_threads_deferred += p.resolvable_bot_threads.length - keep.length;\n  p.resolvable_bot_threads = keep;\n  resolveBudget -= keep.length;\n}\nif (counters.resolvable_threads_deferred) core.info(`${counters.resolvable_threads_deferred} resolvable bot thread(s) deferred to the next run (cap ${RESOLVE_THREADS_MAX})`);\n\n// Slash-command context: what happened to the PR the command was posted on.\nlet trigger = null;\nif (context.eventName === 'issue_comment' && context.payload?.issue?.number) {\n  const n = context.payload.issue.number;\n  const status = selected.some(p => p.number === n) ? 'eligible'\n    : eligible.some(p => p.number === n) ? `eligible but beyond the ${MAX_ELIGIBLE}-PR per-run cap`\n    : reasons[n] || `not an open, non-draft, ${FLOW_LABEL}-labeled Copilot PR`;\n  trigger = { number: n, status };\n}\n\ncore.setOutput('eligible_count', String(selected.length));\ncore.setOutput('eligible_numbers', selected.map(p => p.number).join(','));\ncore.setOutput('eligible_context', JSON.stringify(selected));\ncore.setOutput('trigger_context', trigger ? JSON.stringify(trigger) : '');\ncore.setOutput('counters', JSON.stringify(counters));\nconst rows = Object.entries(counters).map(([k, v]) => `| ${k} | ${v} |`).join('\\n');\nawait core.summary.addHeading('PR Sous Chef — prefilter', 3)\n  .addRaw(`\\n| Metric | Count |\\n|---|---|\\n${rows}\\n\\nSelected: ${selected.map(p => `#${p.number} (bucket ${p.priority_bucket})`).join(', ') || 'none'}\\n`)\n  .write();\n"
  workflow_dispatch:
    inputs:
      aw_context:
        default: ""
        description: "Agent caller context (used internally by Agentic Workflows)."
        required: false
        type: string

permissions: {}

concurrency:
  cancel-in-progress: false
  group: gh-aw-pr-sous-chef

run-name: "PR Sous Chef (tt-metal)"

jobs:
  activation:
    needs: pre_activation
    if: "needs.pre_activation.outputs.activated == 'true' && ((needs.pre_activation.outputs.eligible_count != '0' || github.event_name == 'issue_comment') && ((github.event_name == 'issue_comment') && (github.event_name == 'issue_comment' && (startsWith(github.event.comment.body, '/souschef ') || startsWith(github.event.comment.body, '/souschef\n') || github.event.comment.body == '/souschef') && github.event.issue.pull_request != null) || !(github.event_name == 'issue_comment')))"
    runs-on: ubuntu-slim
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: write
    env:
      GH_AW_MAX_DAILY_AI_CREDITS: "10000"
      GH_AW_RUNTIME_FEATURES: ${{ vars.GH_AW_RUNTIME_FEATURES }}
    outputs:
      body: ${{ steps.sanitized.outputs.body }}
      comment_id: ${{ steps.add-comment.outputs.comment-id }}
      comment_repo: ${{ steps.add-comment.outputs.comment-repo }}
      comment_url: ${{ steps.add-comment.outputs.comment-url }}
      daily_ai_credits_exceeded: ${{ steps.daily-effective-workflow-guardrail.outputs.daily_ai_credits_exceeded == 'true' }}
      daily_ai_credits_guardrail_status: ${{ steps.daily-effective-workflow-guardrail.outputs.daily_ai_credits_guardrail_status || '' }}
      daily_ai_credits_threshold: ${{ steps.daily-effective-workflow-guardrail.outputs.daily_ai_credits_threshold || '' }}
      daily_ai_credits_total_effective_tokens: ${{ steps.daily-effective-workflow-guardrail.outputs.daily_ai_credits_total_effective_tokens || '' }}
      engine_id: ${{ steps.generate_aw_info.outputs.engine_id }}
      lockdown_check_failed: ${{ steps.generate_aw_info.outputs.lockdown_check_failed == 'true' }}
      model: ${{ steps.generate_aw_info.outputs.model }}
      oauth_token_check_failed: ${{ steps.check-oauth-tokens.outputs.oauth_token_check_failed == 'true' }}
      setup-parent-span-id: ${{ steps.setup.outputs.parent-span-id || steps.setup.outputs.span-id }}
      setup-span-id: ${{ steps.setup.outputs.span-id }}
      setup-trace-id: ${{ steps.setup.outputs.trace-id }}
      slash_command: ${{ needs.pre_activation.outputs.matched_command }}
      stale_lock_file_failed: ${{ steps.check-lock-file.outputs.stale_lock_file_failed == 'true' }}
      text: ${{ steps.sanitized.outputs.text }}
      title: ${{ steps.sanitized.outputs.title }}
    steps:
      - name: Setup Scripts
        id: setup
        uses: github/gh-aw-actions/setup@6aab9e5b5c91c615506061f09bedd81a23babe3c # v0.86.2
        with:
          destination: ${{ runner.temp }}/gh-aw/actions
          job-name: ${{ github.job }}
          trace-id: ${{ needs.pre_activation.outputs.setup-trace-id }}
          parent-span-id: ${{ needs.pre_activation.outputs.setup-parent-span-id || needs.pre_activation.outputs.setup-span-id }}
          safe-output-artifact-client: ${{ env.GH_AW_MAX_DAILY_AI_CREDITS != '' }}
        env:
          GH_AW_SETUP_WORKFLOW_NAME: "PR Sous Chef (tt-metal)"
          GH_AW_CURRENT_WORKFLOW_REF: ${{ github.repository }}/.github/workflows/pr-sous-chef.lock.yml@${{ github.ref }}
          GH_AW_INFO_VERSION: "1.0.79"
          GH_AW_INFO_AWF_VERSION: "v0.27.44"
          GH_AW_INFO_ENGINE_ID: "copilot"
      - name: Generate agentic run info
        id: generate_aw_info
        env:
          GH_AW_INFO_ENGINE_ID: "copilot"
          GH_AW_INFO_ENGINE_NAME: "GitHub Copilot CLI"
          GH_AW_INFO_MODEL: ${{ vars.GH_AW_MODEL_AGENT_COPILOT || vars.GH_AW_DEFAULT_MODEL_COPILOT || 'auto' }}
          GH_AW_INFO_VERSION: "1.0.79"
          GH_AW_INFO_AGENT_VERSION: "1.0.79"
          GH_AW_INFO_CLI_VERSION: "v0.86.2"
          GH_AW_INFO_WORKFLOW_NAME: "PR Sous Chef (tt-metal)"
          GH_AW_INFO_EXPERIMENTAL: "false"
          GH_AW_INFO_SUPPORTS_TOOLS_ALLOWLIST: "true"
          GH_AW_INFO_STAGED: "false"
          GH_AW_INFO_ALLOWED_DOMAINS: '["defaults"]'
          GH_AW_INFO_FIREWALL_ENABLED: "true"
          GH_AW_INFO_AWF_VERSION: "v0.27.44"
          GH_AW_INFO_AWMG_VERSION: ""
          GH_AW_INFO_FIREWALL_TYPE: "squid"
          GH_AW_INFO_AGENT_RUNTIME: ""
          GH_AW_COMPILED_STRICT: "true"
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { setupGlobals } = require('${{ runner.temp }}/gh-aw/actions/setup_globals.cjs');
            setupGlobals(core, github, context, exec, io, getOctokit);
            const { main } = require('${{ runner.temp }}/gh-aw/actions/generate_aw_info.cjs');
            await main(core, context);
      - name: Restore daily AIC usage cache
        id: restore-daily-aic-cache
        if: ${{ env.GH_AW_MAX_DAILY_AI_CREDITS != '' }}
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: agentic-workflow-usage-prsouschef-${{ github.run_id }}
          restore-keys: agentic-workflow-usage-prsouschef-
          path: /tmp/gh-aw/agentic-workflow-usage-cache.jsonl
      - name: Restore daily AIC usage cache (artifact fallback)
        id: restore-daily-aic-cache-fallback
        if: ${{ env.GH_AW_MAX_DAILY_AI_CREDITS != '' }}
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GH_AW_RESTORE_DAILY_AIC_CACHE_HIT: ${{ steps.restore-daily-aic-cache.outputs.cache-hit }}
          GH_AW_RESTORE_DAILY_AIC_CACHE_MATCHED_KEY: ${{ steps.restore-daily-aic-cache.outputs.cache-matched-key }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { setupGlobals } = require('${{ runner.temp }}/gh-aw/actions/setup_globals.cjs');
            setupGlobals(core, github, context, exec, io, getOctokit);
            const { main } = require('${{ runner.temp }}/gh-aw/actions/restore_aic_usage_cache_fallback.cjs');
            await main();
      - name: Check daily workflow token guardrail
        id: daily-effective-workflow-guardrail
        if: ${{ env.GH_AW_MAX_DAILY_AI_CREDITS != '' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GH_AW_WORKFLOW_NAME: "PR Sous Chef (tt-metal)"
          GH_AW_WORKFLOW_ID: "pr-sous-chef"
          GH_AW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GH_AW_WORKFLOW_DISPATCH_AW_CONTEXT: ${{ github.event.inputs.aw_context || '' }}
          GH_AW_HAS_SLASH_COMMAND: "true"
          GH_AW_HAS_LABEL_COMMAND: "false"
          GH_AW_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_AW_MAX_DAILY_AI_CREDITS: "10000"
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { setupGlobals } = require('${{ runner.temp }}/gh-aw/actions/setup_globals.cjs');
            setupGlobals(core, github, context, exec, io, getOctokit);
            const { main } = require('${{ runner.temp }}/gh-aw/actions/check_daily_aic_workflow_guardrail.cjs');
            await main();
      - name: Add eyes reaction for immediate feedback
        id: react
        if: github.event_name == 'issues' || github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment' || github.event_name == 'discussion' || github.event_name == 'discussion_comment' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.id == github.repository_id
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GH_AW_REACTION: "eyes"
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { setupGlobals } = require('${{ runner.temp }}/gh-aw/actions/setup_globals.cjs');
            setupGlobals(core, github, context, exec, io, getOctokit);
            const { main } = require('${{ runner.temp }}/gh-aw/actions/add_reaction.cjs');
            await main();
      - name: Check for OAuth tokens
        id: check-oauth-tokens
        run: bash "${RUNNER_TEMP}/gh-aw/actions/check_oauth_tokens.sh"
        env:
          GH_AW_GITHUB_TOKEN: ${{ secrets.GH_AW_GITHUB_TOKEN }}
          GH_AW_GITHUB_MCP_SERVER_TOKEN: ${{ secrets.GH_AW_GITHUB_MCP_SERVER_TOKEN }}
      - name: Checkout .github and .agents folders
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github
            .agents
            .claude
            .codex
            .gemini
            .pi
          sparse-checkout-cone-mode: true
          fetch-depth: 1
      - name: Save agent config folders for base branch restoration
        env:
          GH_AW_AGENT_FOLDERS: ".agents .github"
          GH_AW_AGENT_FILES: "AGENTS.md"
        run: |
          bash "${RUNNER_TEMP}/gh-aw/actions/save_base_github_folders.sh"
      - name: Check workflow lock file
        id: check-lock-file
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GH_AW_WORKFLOW_FILE: "pr-sous-chef.lock.yml"
          GH_AW_CONTEXT_WORKFLOW_REF: "${{ github.workflow_ref }}"
        with:
          script: |
            const { setupGlobals } = require('${{ runner.temp }}/gh-aw/actions/setup_globals.cjs');
            setupGlobals(core, github, context, exec, io, getOctokit);
            const { main } = require('${{ runner.temp }}/gh-aw/actions/check_workflow_timestamp_api.cjs');
            await main();
      - name: Check compile-agentic version
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GH_AW_COMPILED_VERSION: "v0.86.2"
        with:
          script: |
            const { setupGlobals } = require('${{ runner.temp }}/gh-aw/actions/setup_globals.cjs');
            setupGlobals(core, github, context, exec, io, getOctokit);
            const { main } = require('${{ runner.temp }}/gh-aw/actions/check_version_updates.cjs');
            await main();
      - name: Compute current body text
        id: sanitized
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GH_AW_ALLOWED_DOMAINS: "api.business.githubcopilot.com,api.enterprise.githubcopilot.com,api.github.com,api.githubcopilot.com,api.individual.githubcopilot.com,api.snapcraft.io,archive.ubuntu.com,azure.archive.ubuntu.com,crl.geotrust.com,crl.globalsign.com,crl.identrust.com,crl.sectigo.com,crl.thawte.com,crl.usertrust.com,crl.verisign.com,crl3.digicert.com,crl4.digicert.com,crls.ssl.com,github.com,host.docker.internal,json-schema.org,json.schemastore.org,keyserver.ubuntu.com,ocsp.digicert.com,ocsp.geotrust.com,ocsp.globalsign.com,ocsp.identrust.com,ocsp.sectigo.com,ocsp.ssl.com,ocsp.thawte.com,ocsp.usertrust.com,ocsp.verisign.com,packagecloud.io,packages.cloud.google.com,packages.microsoft.com,ppa.launchpad.net,raw.githubusercontent.com,registry.npmjs.org,s.symcb.com,s.symcd.com,security.ubuntu.com,telemetry.enterprise.githubcopilot.com,ts-crl.ws.symantec.com,ts-ocsp.ws.symantec.com,www.googleapis.com"
        with:
          script: |
            const { setupGlobals } = require('${{ runner.temp }}/gh-aw/actions/setup_globals.cjs');
            setupGlobals(core, github, context, exec, io, getOctokit);
            const { main } = require('${{ runner.temp }}/gh-aw/actions/compute_text.cjs');
            await main();
      - name: Add comment with workflow run link
        id: add-comment
        if: github.event_name == 'issues' || github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment' || github.event_name == 'discussion' || github.event_name == 'discussion_comment' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.id == github.repository_id
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GH_AW_WORKFLOW_NAME: "PR Sous Chef (tt-metal)"
          GH_AW_SAFE_OUTPUT_MESSAGES: "{\"footer\":\"\\u003e 🍳 *[{workflow_name}]({run_url}) — automated follow-up on a `copilot-flow` PR; remove the label to opt out.*{ai_credits_suffix}{history_link}\"}"
        with:
          script: |
            const { setupGlobals } = require('${{ runner.temp }}/gh-aw/actions/setup_globals.cjs');
            setupGlobals(core, github, context, exec, io, getOctokit);
            const { main } = require('${{ runner.temp }}/gh-aw/actions/add_workflow_run_comment.cjs');
            await main();
      - name: Log runtime features
        if: ${{ contains(toJSON(vars), '"GH_AW_RUNTIME_FEATURES":') }}
        run: bash "${RUNNER_TEMP}/gh-aw/actions/log_runtime_features_summary.sh"
      - name: Create prompt with built-in context
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GH_AW_ACTIONS_DIR: ${{ runner.temp }}/gh-aw/actions
          GH_AW_PROMPT: ${{ runner.temp }}/gh-aw/aw-prompts/prompt.txt
          GH_AW_SAFE_OUTPUTS: ${{ runner.temp }}/gh-aw/safeoutputs/outputs.jsonl
          GH_AW_PROMPT_CONFIG: "{\"items\":[{\"content_env\":\"GH_AW_PROMPT_CONTENT_0000\"},{\"file\":\"xpia.md\"},{\"file\":\"temp_folder_prompt.md\"},{\"file\":\"markdown.md\"},{\"file\":\"safe_outputs_prompt.md\"},{\"content_env\":\"GH_AW_PROMPT_CONTENT_0001\"},{\"content_env\":\"GH_AW_PROMPT_CONTENT_0002\"},{\"file\":\"mcp_cli_tools_prompt.md\"},{\"content_env\":\"GH_AW_PROMPT_CONTENT_0003\"},{\"file\":\"github_mcp_tools_with_safeoutputs_prompt.md\"},{\"file\":\"pr_context_prompt.md\",\"condition_env\":\"GH_AW_INCLUDE_PR_CONTEXT\"},{\"content_env\":\"GH_AW_PROMPT_CONTENT_0004\"},{\"content_env\":\"GH_AW_PROMPT_CONTENT_0005\"}]}"
          GH_AW_EXPR_1A3A194A: ${{ github.event.discussion.number || (fromJSON(github.event.inputs.aw_context || github.event.client_payload.aw_context || '{}').item_type == 'discussion' && fromJSON(github.event.inputs.aw_context || github.event.client_payload.aw_context || '{}').item_number) }}
          GH_AW_EXPR_463A214A: ${{ github.event.pull_request.number || (fromJSON(github.event.inputs.aw_context || github.event.client_payload.aw_context || '{}').item_type == 'pull_request' && fromJSON(github.event.inputs.aw_context || github.event.client_payload.aw_context || '{}').item_number) }}
          GH_AW_EXPR_802A9F6A: ${{ github.event.issue.number || (fromJSON(github.event.inputs.aw_context || github.event.client_payload.aw_context || '{}').item_type == 'issue' && fromJSON(github.event.inputs.aw_context || github.event.client_payload.aw_context || '{}').item_number) }}
          GH_AW_EXPR_FF1D34CE: ${{ github.event.comment.id || fromJSON(github.event.inputs.aw_context || github.event.client_payload.aw_context || '{}').comment_id }}
          GH_AW_GITHUB_ACTOR: ${{ github.actor }}
          GH_AW_GITHUB_EVENT_NAME: ${{ github.event_name }}
          GH_AW_GITHUB_REPOSITORY: ${{ github.repository }}
          GH_AW_GITHUB_RUN_ID: ${{ github.run_id }}
          GH_AW_GITHUB_WORKSPACE: ${{ github.workspace }}
          GH_AW_INCLUDE_PR_CONTEXT: ${{ (github.event_name == 'issue_comment' && github.event.issue.pull_request != null) || github.event_name == 'pull_request_review_comment' || github.event_name == 'pull_request_review' }}
          GH_AW_NEEDS_PRE_ACTIVATION_OUTPUTS_COUNTERS: ${{ needs.pre_activation.outputs.counters }}
          GH_AW_NEEDS_PRE_ACTIVATION_OUTPUTS_ELIGIBLE_CONTEXT: ${{ needs.pre_activation.outputs.eligible_context }}
          GH_AW_NEEDS_PRE_ACTIVATION_OUTPUTS_ELIGIBLE_NUMBERS: ${{ needs.pre_activation.outputs.eligible_numbers }}
          GH_AW_NEEDS_PRE_ACTIVATION_OUTPUTS_TRIGGER_CONTEXT: ${{ needs.pre_activation.outputs.trigger_context }}
          GH_AW_PROMPT_CONTENT_0000: "<system>\n"
          GH_AW_PROMPT_CONTENT_0001: "<safe-output-tools>\nTools: add_comment(max:5), resolve_pull_request_review_thread(max:20), missing_data, noop\n"
          GH_AW_PROMPT_CONTENT_0002: "</safe-output-tools>\n"
          GH_AW_PROMPT_CONTENT_0003: "<github-context>\nThe following GitHub context information is available for this workflow:\n{{#if github.actor}}\n- **actor**: __GH_AW_GITHUB_ACTOR__\n{{/if}}\n{{#if github.repository}}\n- **repository**: __GH_AW_GITHUB_REPOSITORY__\n{{/if}}\n{{#if github.workspace}}\n- **workspace**: __GH_AW_GITHUB_WORKSPACE__\n{{/if}}\n{{#if github.event.issue.number || (github.aw.context.item_type == 'issue' && github.aw.context.item_number)}}\n- **issue-number**: #__GH_AW_EXPR_802A9F6A__\n{{/if}}\n{{#if github.event.discussion.number || (github.aw.context.item_type == 'discussion' && github.aw.context.item_number)}}\n- **discussion-number**: #__GH_AW_EXPR_1A3A194A__\n{{/if}}\n{{#if github.event.pull_request.number || (github.aw.context.item_type == 'pull_request' && github.aw.context.item_number)}}\n- **pull-request-number**: #__GH_AW_EXPR_463A214A__\n{{/if}}\n{{#if github.event.comment.id || github.aw.context.comment_id}}\n- **comment-id**: __GH_AW_EXPR_FF1D34CE__\n{{/if}}\n{{#if github.run_id}}\n- **workflow-run-id**: __GH_AW_GITHUB_RUN_ID__\n{{/if}}\n</github-context>\n\n"
          GH_AW_PROMPT_CONTENT_0004: "</system>\n"
          GH_AW_PROMPT_CONTENT_0005: "{{#runtime-import .github/workflows/pr-sous-chef.md}}\n"
        with:
          script: |
            const { setupGlobals } = require(process.env.GH_AW_ACTIONS_DIR + '/setup_globals.cjs');
            setupGlobals(core, github, context, exec, io, getOctokit);
            const { main } = require(process.env.GH_AW_ACTIONS_DIR + '/create_prompt.cjs');
            await main(core);
      - name: Interpolate variables and render templates
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GH_AW_PROMPT: ${{ runner.temp }}/gh-aw/aw-prompts/prompt.txt
          GH_AW_ENGINE_ID: "copilot"
          GH_AW_GITHUB_EVENT_NAME: ${{ github.event_name }}
          GH_AW_GITHUB_REPOSITORY: ${{ github.repository }}
          GH_AW_NEEDS_PRE_ACTIVATION_OUTPUTS_COUNTERS: ${{ needs.pre_activation.outputs.counters }}
          GH_AW_NEEDS_PRE_ACTIVATION_OUTPUTS_ELIGIBLE_CONTEXT: ${{ needs.pre_activation.outputs.eligible_context }}
          GH_AW_NEEDS_PRE_ACTIVATION_OUTPUTS_ELIGIBLE_NUMBERS: ${{ needs.pre_activation.outputs.eligible_numbers }}
          GH_AW_NEEDS_PRE_ACTIVATION_OUTPUTS_TRIGGER_CONTEXT: ${{ needs.pre_activation.outputs.trigger_context }}
        with:
          script: |
            const { setupGlobals } = require('${{ runner.temp }}/gh-aw/actions/setup_globals.cjs');
            setupGlobals(core, github, context, exec, io, getOctokit);
            const { main } = require('${{ runner.temp }}/gh-aw/actions/interpolate_prompt.cjs');
            await main();
      - name: Substitute placeholders
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GH_AW_PROMPT: ${{ runner.temp }}/gh-aw/aw-prompts/prompt.txt
          GH_AW_EXPR_1A3A194A: ${{ github.event.discussion.number || (fromJSON(github.event.inputs.aw_context || github.event.client_payload.aw_context || '{}').item_type == 'discussion' && fromJSON(github.event.inputs.aw_context || github.event.client_payload.aw_context || '{}').item_number) }}
          GH_AW_EXPR_463A214A: ${{ github.event.pull_request.number || (fromJSON(github.event.inputs.aw_context || github.event.client_payload.aw_context || '{}').item_type == 'pull_request' && fromJSON(github.event.inputs.aw_context || github.event.client_payload.aw_context || '{}').item_number) }}
          GH_AW_EXPR_802A9F6A: ${{ github.event.issue.number || (fromJSON(github.event.inputs.aw_context || github.event.client_payload.aw_context || '{}').item_type == 'issue' && fromJSON(github.event.inputs.aw_context || github.event.client_payload.aw_context || '{}').item_number) }}
          GH_AW_EXPR_FF1D34CE: ${{ github.event.comment.id || fromJSON(github.event.inputs.aw_context || github.event.client_payload.aw_context || '{}').comment_id }}
          GH_AW_GITHUB_ACTOR: ${{ github.actor }}
          GH_AW_GITHUB_EVENT_NAME: ${{ github.event_name }}
          GH_AW_GITHUB_REPOSITORY: ${{ github.repository }}
          GH_AW_GITHUB_RUN_ID: ${{ github.run_id }}
          GH_AW_GITHUB_WORKSPACE: ${{ github.workspace }}
          GH_AW_INCLUDE_PR_CONTEXT: ${{ (github.event_name == 'issue_comment' && github.event.issue.pull_request != null) || github.event_name == 'pull_request_review_comment' || github.event_name == 'pull_request_review' }}
          GH_AW_MCP_CLI_SERVERS_LIST: "- `github` — run `github --help` to see available tools\n- `safeoutputs` — run `safeoutputs --help` to see available tools"
          GH_AW_NEEDS_PRE_ACTIVATION_OUTPUTS_ACTIVATED: ${{ needs.pre_activation.outputs.activated }}
          GH_AW_NEEDS_PRE_ACTIVATION_OUTPUTS_COUNTERS: ${{ needs.pre_activation.outputs.counters }}
          GH_AW_NEEDS_PRE_ACTIVATION_OUTPUTS_ELIGIBLE_CONTEXT: ${{ needs.pre_activation.outputs.eligible_context }}
          GH_AW_NEEDS_PRE_ACTIVATION_OUTPUTS_ELIGIBLE_NUMBERS: ${{ needs.pre_activation.outputs.eligible_numbers }}
          GH_AW_NEEDS_PRE_ACTIVATION_OUTPUTS_MATCHED_COMMAND: ${{ needs.pre_activation.outputs.matched_command }}
          GH_AW_NEEDS_PRE_ACTIVATION_OUTPUTS_TRIGGER_CONTEXT: ${{ needs.pre_activation.outputs.trigger_context }}
        with:
          script: |
            const { setupGlobals } = require('${{ runner.temp }}/gh-aw/actions/setup_globals.cjs');
            setupGlobals(core, github, context, exec, io, getOctokit);

            const substitutePlaceholders = require('${{ runner.temp }}/gh-aw/actions/substitute_placeholders.cjs');

            // Call the substitution function
            return await substitutePlaceholders({
              file: process.env.GH_AW_PROMPT,
              substitutions: {
                GH_AW_EXPR_1A3A194A: process.env.GH_AW_EXPR_1A3A194A,
                GH_AW_EXPR_463A214A: process.env.GH_AW_EXPR_463A214A,
                GH_AW_EXPR_802A9F6A: process.env.GH_AW_EXPR_802A9F6A,
                GH_AW_EXPR_FF1D34CE: process.env.GH_AW_EXPR_FF1D34CE,
                GH_AW_GITHUB_ACTOR: process.env.GH_AW_GITHUB_ACTOR,
                GH_AW_GITHUB_EVENT_NAME: process.env.GH_AW_GITHUB_EVENT_NAME,
                GH_AW_GITHUB_REPOSITORY: process.env.GH_AW_GITHUB_REPOSITORY,
                GH_AW_GITHUB_RUN_ID: process.env.GH_AW_GITHUB_RUN_ID,
                GH_AW_GITHUB_WORKSPACE: process.env.GH_AW_GITHUB_WORKSPACE,
                GH_AW_INCLUDE_PR_CONTEXT: process.env.GH_AW_INCLUDE_PR_CONTEXT,
                GH_AW_MCP_CLI_SERVERS_LIST: process.env.GH_AW_MCP_CLI_SERVERS_LIST,
                GH_AW_NEEDS_PRE_ACTIVATION_OUTPUTS_ACTIVATED: process.env.GH_AW_NEEDS_PRE_ACTIVATION_OUTPUTS_ACTIVATED,
                GH_AW_NEEDS_PRE_ACTIVATION_OUTPUTS_COUNTERS: process.env.GH_AW_NEEDS_PRE_ACTIVATION_OUTPUTS_COUNTERS,
                GH_AW_NEEDS_PRE_ACTIVATION_OUTPUTS_ELIGIBLE_CONTEXT: process.env.GH_AW_NEEDS_PRE_ACTIVATION_OUTPUTS_ELIGIBLE_CONTEXT,
                GH_AW_NEEDS_PRE_ACTIVATION_OUTPUTS_ELIGIBLE_NUMBERS: process.env.GH_AW_NEEDS_PRE_ACTIVATION_OUTPUTS_ELIGIBLE_NUMBERS,
                GH_AW_NEEDS_PRE_ACTIVATION_OUTPUTS_MATCHED_COMMAND: process.env.GH_AW_NEEDS_PRE_ACTIVATION_OUTPUTS_MATCHED_COMMAND,
                GH_AW_NEEDS_PRE_ACTIVATION_OUTPUTS_TRIGGER_CONTEXT: process.env.GH_AW_NEEDS_PRE_ACTIVATION_OUTPUTS_TRIGGER_CONTEXT
              }
            });
      - name: Validate prompt placeholders
        env:
          GH_AW_PROMPT: ${{ runner.temp }}/gh-aw/aw-prompts/prompt.txt
        run: |
          bash "${RUNNER_TEMP}/gh-aw/actions/validate_prompt_placeholders.sh"
      - name: Print prompt
        env:
          GH_AW_PROMPT: ${{ runner.temp }}/gh-aw/aw-prompts/prompt.txt
        run: |
          bash "${RUNNER_TEMP}/gh-aw/actions/print_prompt_summary.sh"
      - name: Stage prompt files for artifact upload
        run: |
          mkdir -p /tmp/gh-aw/aw-prompts
          cp -a "${RUNNER_TEMP}/gh-aw/aw-prompts/." /tmp/gh-aw/aw-prompts/
      - name: Upload activation artifact
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: activation
          include-hidden-files: true
          path: |
            /tmp/gh-aw/aw_info.json
            /tmp/gh-aw/models.json
            /tmp/gh-aw/aw-prompts/prompt.txt
            /tmp/gh-aw/aw-prompts/prompt-template.txt
            /tmp/gh-aw/aw-prompts/prompt-import-tree.json
            /tmp/gh-aw/github_rate_limits.jsonl
            /tmp/gh-aw/base
            /tmp/gh-aw/.github/agents
            /tmp/gh-aw/.github/skills
          if-no-files-found: ignore
          retention-days: 1

  agent:
    needs: activation
    if: needs.activation.outputs.daily_ai_credits_exceeded != 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      copilot-requests: write
      issues: read
      pull-requests: read
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      GH_AW_ASSETS_ALLOWED_EXTS: ""
      GH_AW_ASSETS_BRANCH: ""
      GH_AW_ASSETS_MAX_SIZE_KB: 0
      GH_AW_MCP_LOG_DIR: /tmp/gh-aw/mcp-logs/safeoutputs
      GH_AW_RUNTIME_FEATURES: ${{ vars.GH_AW_RUNTIME_FEATURES }}
      GH_AW_WORKFLOW_ID_SANITIZED: prsouschef
    outputs:
      agentic_engine_timeout: ${{ steps.detect-agent-errors.outputs.agentic_engine_timeout || 'false' }}
      ai_credits_rate_limit_error: ${{ steps.parse-mcp-gateway.outputs.ai_credits_rate_limit_error || 'false' }}
      aic: ${{ steps.parse-mcp-gateway.outputs.aic }}
      ambient_context: ${{ steps.parse-mcp-gateway.outputs.ambient_context }}
      checkout_pr_success: ${{ steps.checkout-pr.outputs.checkout_pr_success || 'true' }}
      effective_tokens: ${{ steps.parse-mcp-gateway.outputs.effective_tokens }}
      has_patch: ${{ steps.collect_output.outputs.has_patch }}
      http_400_response_error: ${{ steps.detect-agent-errors.outputs.http_400_response_error || 'false' }}
      inference_access_error: ${{ steps.detect-agent-errors.outputs.inference_access_error || 'false' }}
      invocation_cap_exceeded: ${{ steps.detect-agent-errors.outputs.invocation_cap_exceeded || 'false' }}
      max_cache_misses_exceeded: ${{ steps.detect-agent-errors.outputs.max_cache_misses_exceeded || 'false' }}
      mcp_policy_error: ${{ steps.detect-agent-errors.outputs.mcp_policy_error || 'false' }}
      missing_model_pricing_error: ${{ steps.detect-agent-errors.outputs.missing_model_pricing_error || 'false' }}
      missing_model_pricing_model_name: ${{ steps.detect-agent-errors.outputs.missing_model_pricing_model_name || '' }}
      model: ${{ needs.activation.outputs.model }}
      model_not_supported_error: ${{ steps.detect-agent-errors.outputs.model_not_supported_error || 'false' }}
      output: ${{ steps.collect_output.outputs.output }}
      output_types: ${{ steps.collect_output.outputs.output_types }}
      setup-parent-span-id: ${{ steps.setup.outputs.parent-span-id || steps.setup.outputs.span-id }}
      setup-span-id: ${{ steps.setup.outputs.span-id }}
      setup-trace-id: ${{ steps.setup.outputs.trace-id }}
      unknown_model_ai_credits: ${{ steps.parse-mcp-gateway.outputs.unknown_model_ai_credits || 'false' }}
    steps:
      - name: Setup Scripts
        id: setup
        uses: github/gh-aw-actions/setup@6aab9e5b5c91c615506061f09bedd81a23babe3c # v0.86.2
        with:
          destination: ${{ runner.temp }}/gh-aw/actions
          job-name: ${{ github.job }}
          trace-id: ${{ needs.activation.outputs.setup-trace-id }}
          parent-span-id: ${{ needs.activation.outputs.setup-parent-span-id || needs.activation.outputs.setup-span-id }}
        env:
          GH_AW_SETUP_WORKFLOW_NAME: "PR Sous Chef (tt-metal)"
          GH_AW_CURRENT_WORKFLOW_REF: ${{ github.repository }}/.github/workflows/pr-sous-chef.lock.yml@${{ github.ref }}
          GH_AW_INFO_VERSION: "1.0.79"
          GH_AW_INFO_AWF_VERSION: "v0.27.44"
          GH_AW_INFO_ENGINE_ID: "copilot"
      - name: Set runtime paths
        id: set-runtime-paths
        run: |
          {
            echo "GH_AW_SAFE_OUTPUTS=${RUNNER_TEMP}/gh-aw/safeoutputs/outputs.jsonl"
            echo "GH_AW_SAFE_OUTPUTS_CONFIG_PATH=${RUNNER_TEMP}/gh-aw/safeoutputs/config.json"
            echo "GH_AW_SAFE_OUTPUTS_TOOLS_PATH=${RUNNER_TEMP}/gh-aw/safeoutputs/tools.json"
          } >> "$GITHUB_OUTPUT"
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create gh-aw temp directory
        run: bash "${RUNNER_TEMP}/gh-aw/actions/create_gh_aw_tmp_dir.sh"
      - name: Configure gh CLI for GitHub Enterprise
        run: bash "${RUNNER_TEMP}/gh-aw/actions/configure_gh_for_ghe.sh"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Download activation artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: activation
          path: /tmp/gh-aw
      - name: Configure Git credentials
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_TOKEN: ${{ github.token }}
        run: bash "${RUNNER_TEMP}/gh-aw/actions/configure_git_credentials.sh"
      - name: Checkout PR branch
        id: checkout-pr
        if: |
          github.event.pull_request || github.event.issue.pull_request || github.event_name == 'workflow_dispatch' && fromJSON(github.event.inputs.aw_context || '{}').item_type == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GH_TOKEN: ${{ secrets.GH_AW_GITHUB_MCP_SERVER_TOKEN || secrets.GH_AW_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        with:
          github-token: ${{ secrets.GH_AW_GITHUB_MCP_SERVER_TOKEN || secrets.GH_AW_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const { setupGlobals } = require('${{ runner.temp }}/gh-aw/actions/setup_globals.cjs');
            setupGlobals(core, github, context, exec, io, getOctokit);
            const { main } = require('${{ runner.temp }}/gh-aw/actions/checkout_pr_branch.cjs');
            await main();
      - name: Install ripgrep
        run: bash "${RUNNER_TEMP}/gh-aw/actions/install_ripgrep.sh"
      - name: Install GitHub Copilot CLI
        run: bash "${RUNNER_TEMP}/gh-aw/actions/install_copilot_cli.sh"
        env:
          GH_HOST: github.com
          GH_AW_COMPILED_VERSION: v0.86.2
      - name: Install AWF binary
        run: bash "${RUNNER_TEMP}/gh-aw/actions/install_awf_binary.sh" v0.27.44 --rootless
      - name: Determine automatic lockdown mode for GitHub MCP Server
        id: determine-automatic-lockdown
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0 (source v9)
        env:
          GH_AW_GITHUB_TOKEN: ${{ secrets.GH_AW_GITHUB_TOKEN }}
          GH_AW_GITHUB_MCP_SERVER_TOKEN: ${{ secrets.GH_AW_GITHUB_MCP_SERVER_TOKEN }}
          GH_AW_GITHUB_MIN_INTEGRITY: 'approved'
        with:
          script: |
            const determineAutomaticLockdown = require('${{ runner.temp }}/gh-aw/actions/determine_automatic_lockdown.cjs');
            await determineAutomaticLockdown(github, context, core);
      - name: Parse integrity filter lists
        id: parse-guard-vars
        env:
          GH_AW_BLOCKED_USERS_VAR: ${{ vars.GH_AW_GITHUB_BLOCKED_USERS || '' }}
          GH_AW_TRUSTED_USERS_VAR: ${{ vars.GH_AW_GITHUB_TRUSTED_USERS || '' }}
          GH_AW_APPROVAL_LABELS_EXTRA: copilot-flow
          GH_AW_APPROVAL_LABELS_VAR: ${{ vars.GH_AW_GITHUB_APPROVAL_LABELS || '' }}
        run: bash "${RUNNER_TEMP}/gh-aw/actions/parse_guard_list.sh"
      - name: Restore agent config folders from base branch
        if: steps.checkout-pr.outcome == 'success'
        env:
          GH_AW_AGENT_FOLDERS: ".agents .github"
          GH_AW_AGENT_FILES: "AGENTS.md"
        run: bash "${RUNNER_TEMP}/gh-aw/actions/restore_base_github_folders.sh"
      - name: Restore inline sub-agents from activation artifact
        env:
          GH_AW_SUB_AGENT_DIR: ".github/agents"
          GH_AW_SUB_AGENT_EXT: ".agent.md"
        run: bash "${RUNNER_TEMP}/gh-aw/actions/restore_inline_sub_agents.sh"
      - name: Restore inline skills from activation artifact
        env:
          GH_AW_SKILL_DIR: ".github/skills"
        run: bash "${RUNNER_TEMP}/gh-aw/actions/restore_inline_skills.sh"
      - name: Download container images
        run: bash "${RUNNER_TEMP}/gh-aw/actions/download_docker_images.sh" ghcr.io/github/gh-aw-firewall/agent:0.27.44@sha256:0d727725c737b58c7bdf51f640cffb928385ec46517e0917c7f1a02f1bada8b4 ghcr.io/github/gh-aw-firewall/api-proxy:0.27.44@sha256:b50fbadba138f6e9aba94aca09711335c489bb3b15861220cb66f6092e042dc7 ghcr.io/github/gh-aw-firewall/squid:0.27.44@sha256:83e48bbe12c634be8c228a576832fe45f66c529ac3659db92bddbcf2eeb6d627 ghcr.io/github/gh-aw-mcpg:v0.4.9@sha256:e5a1569aeaf41820fa7bdee3e94468cae448133cdbf00119ad24f5b74db1ab9f ghcr.io/github/gh-aw-node@sha256:0d9f1fb5fd6610c0ac1f5194a38e45a8a1e81f8a390d5142d8e4e6f26a4b3196 ghcr.io/github/github-mcp-server:v1.9.0@sha256:881b53d6f75f69bdbc1b5b10fc2f1361717c19054143b3a8529fb5c32061a50e
      - name: Generate Safe Outputs Config
        run: |
          mkdir -p "${RUNNER_TEMP}/gh-aw/safeoutputs"
          mkdir -p /tmp/gh-aw/safeoutputs
          mkdir -p /tmp/gh-aw/mcp-logs/safeoutputs
          cat > "${RUNNER_TEMP}/gh-aw/safeoutputs/config.json" << 'GH_AW_SAFE_OUTPUTS_CONFIG_cd5573bf9913ba72_EOF'
          {"add_comment":{"max":5,"target":"*"},"mentions":{"allowed":["copilot"]},"missing_data":{},"noop":{"max":1,"report-as-issue":"false"},"resolve_pull_request_review_thread":{"max":20}}
          GH_AW_SAFE_OUTPUTS_CONFIG_cd5573bf9913ba72_EOF
      - name: Generate Safe Outputs Tools
        env:
          GH_AW_TOOLS_META_JSON: |
            {
              "description_suffixes": {
                "add_comment": " CONSTRAINTS: Maximum 5 comment(s) can be added. Target: *. Supports reply_to_id for discussion threading.",
                "resolve_pull_request_review_thread": " CONSTRAINTS: Maximum 20 review thread(s) can be resolved."
              },
              "repo_params": {},
              "dynamic_tools": []
            }
          GH_AW_VALIDATION_JSON: |
            {
              "add_comment": {
                "defaultMax": 1,
                "fields": {
                  "body": {
                    "required": true,
                    "type": "string",
                    "sanitize": true,
                    "maxLength": 65000
                  },
                  "comment_id": {
                    "optionalPositiveInteger": true
                  },
                  "item_number": {
                    "issueOrPRNumber": true
                  },
                  "pr": {
                    "issueOrPRNumber": true
                  },
                  "pr_number": {
                    "issueOrPRNumber": true
                  },
                  "reply_to_id": {
                    "type": "string",
                    "maxLength": 256
                  },
                  "repo": {
                    "type": "string",
                    "maxLength": 256
                  },
                  "target": {
                    "type": "string",
                    "enum": [
                      "status"
                    ]
                  },
                  "temporary_id": {
                    "type": "string",
                    "pattern": "^#?aw_[A-Za-z0-9_]{3,12}$"
                  }
                }
              },
              "mentions": {
                "allowed": [
                  "copilot"
                ]
              },
              "missing_data": {
                "defaultMax": 20,

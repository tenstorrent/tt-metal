name: "Cleanup prebuilt tests images"
# Prebuilt tests images are throwaways: one per (commit x build config x base),
# pushed on every PR update, so without this they accumulate indefinitely.
#
# Keeps the newest N and deletes the rest, oldest first.
#
# min-versions-to-keep is what protects an in-flight run: it excludes the newest
# N from deletion, and the action removes oldest-first. The 100-per-run limit
# only bounds how much backlog one sweep clears, so do not treat it as the
# safety mechanism. Note that N counts untagged versions too, so tagged
# retention is lower than the number says.
#
# That 100/run limit is why this is sized for today's volume, where only the
# producer's own test workflow pushes. Once a gate workflow consumes these
# images the push rate goes far above 100/day and the schedule, the limit, or
# the number of images built per run all have to be revisited together.
#
# This deletes irreversibly. It is scoped to the one package the
# build-prebuilt-tests-image producer creates, and never touches a base image.

permissions:
  packages: write

on:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:
    inputs:
      min-versions-to-keep:
        description: "Newest versions to keep. Set very high for a safe no-op run."
        required: false
        type: string
        default: "50"

jobs:
  cleanup:
    name: "Delete aged-out prebuilt tests images"
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5.0.0
        with:
          # Literal, not a context expression: this is what stops the job ever
          # resolving to a package it should not touch.
          owner: tenstorrent
          package-name: tt-metal/prebuilt-tests-image
          package-type: container
          min-versions-to-keep: ${{ inputs.min-versions-to-keep || '50' }}

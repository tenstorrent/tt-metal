# 4-stage pipeline on ONE 32-chip BH galaxy: 4 ranks on this host, 8 chips each.
#
# The device lists are the ONLY thing that keeps the four ranks off each other's chips, and they are
# copied verbatim from tt-train's proven single-galaxy PP4 (tt-train/sources/examples/python/multihost/
# pipeline_parallel_training/configurations/1galaxy_pp4/rank_bindings.yaml). The serpentine order
# (4 ascending, then 4 descending from the neighbouring group) is a Hamiltonian path through each
# 2x4 block, which is what lets 8 chips present as a single line to the mesh descriptor. Do not
# "tidy" them into ascending runs — that breaks the intra-mesh adjacency the line depends on.
#
# TT_VISIBLE_DEVICES MUST live here rather than in the shell: tt-run blocklists it from parent-env
# passthrough (ttrun.py:1585-1586) so a stray shell export cannot silently collapse all four ranks
# onto the same chips. Our earlier single-mesh (8,1) MLA runs set it by exporting in the shell, which
# works for a bare pytest but is dropped under tt-run.
rank_bindings:
  - rank: 0
    mesh_id: 0
    mesh_host_rank: 0
    env_overrides:
      TT_VISIBLE_DEVICES: "0,1,2,3,11,10,9,8"
  - rank: 1
    mesh_id: 1
    mesh_host_rank: 0
    env_overrides:
      TT_VISIBLE_DEVICES: "4,5,6,7,15,14,13,12"
  - rank: 2
    mesh_id: 2
    mesh_host_rank: 0
    env_overrides:
      TT_VISIBLE_DEVICES: "28,29,30,31,23,22,21,20"
  - rank: 3
    mesh_id: 3
    mesh_host_rank: 0
    env_overrides:
      TT_VISIBLE_DEVICES: "24,25,26,27,19,18,17,16"

mesh_graph_desc_path: mistral4_bringup/pp4/pp4_single_galaxy_8x1_mgd.textproto

global_env:
  # 2d, not a torus mode: the [8,1] meshes declare LINE/LINE, and a torus mode whose wrap disagrees
  # with the descriptor hangs at fabric bring-up. Must be 2d rather than the sp<=8 default of 1d
  # because the D2D MeshSocket routes over 2D fabric.
  PREFILL_FABRIC_MODE: "2d"
  # (sp, tp) = the per-rank mesh shape. 8x1 = one 8-chip stage; 4 stages fill the galaxy.
  PREFILL_SP: "8"
  PREFILL_TP: "1"
  PREFILL_NUM_LAYERS: "36"
  PREFILL_CHUNK_SIZE: "5120"
  PREFILL_MAX_SEQ_LEN: "25600"
  PREFILL_H2D_SERVICE_ID: "ds_prefill"
  PREFILL_GATE_FALLBACK_MODE: "DEVICE_FP32"
  LOGURU_LEVEL: "INFO"

---
# PR Gate train-smoke-tests (tt-train-tests.yaml, pr_gate; the bh_p150b_civ2
# entry in tests/pipeline_reorg/train_pr_gate_tests.yaml): the tt-train C++
# smoke tests from the tt-ml-validation package on one p150b, against
# asan-build's packages. Kernel JIT runs cold (no remote kernel ccache on the
# VM path), so 45 m, not GitHub's 10 m.
jobs:
  - id: train-smoke-p150b-asan
    name: tt-train smoke p150b (ASan)
    description: "Run the PR Gate tt-train C++ smoke tests on one p150b with the ASan packages"
    timeout: 1h30m
    runs-on:
      kubernetes:
        os: linux
        arch: amd64
        image: {from-job: ci-build-image, image: ci-build}
        accelerator: {type: p150b, count: 1}
        resources:
          requests: {cpu: '8', memory: 16Gi, ephemeral-storage: 30Gi}
          limits: {cpu: '8', memory: 16Gi, ephemeral-storage: 30Gi}
    packages:
      artifacts:
        - from-job: asan-build
          name: packages-ubuntu-24.04-amd64-ASan-x86_64-linux-clang-20-libstdcpp
          install: [tt-metalium, tt-nn, tt-ml-validation]
    env:
      - {name: HOME, value: /tmp/home}
      - {name: TT_METAL_CACHE, value: /tmp/tt-metal-cache}
      - {name: LOGURU_LEVEL, value: INFO}
      - {name: TT_LOGGER_LEVEL, value: warn}
      - {name: TT_METAL_RUNTIME_ROOT, value: /usr/libexec/tt-metalium}
      - {name: LSAN_OPTIONS, value: "suppressions=/usr/share/tt-metalium/lsan.supp"}
      - {name: UBSAN_OPTIONS, value: "print_stacktrace=1:halt_on_error=1"}
    steps:
      - id: train-smoke
        kind: shell
        shell:
          run:
            - mkdir -p "$HOME" "$TT_METAL_CACHE" generated/test_reports
            # Log to a file and print the tail, to stay under the output budget.
            - >-
              ulimit -n 4096; rc=0; timeout 45m tt-train/tests/ops/run_smoke_tests.sh
              --gtest_output=xml:generated/test_reports/ctest_report.xml >/tmp/train-smoke.log 2>&1 || rc=$?;
              tail -c 20000 /tmp/train-smoke.log; exit $rc

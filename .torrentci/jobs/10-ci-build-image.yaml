---
# Chain-image producer: TorrentCI builds dockerfile/Dockerfile.torrentci-ci-build
# (a standalone equivalent of the bake ci-build target, Ubuntu 24.04) and
# keys it by its inputs, so an unchanged Dockerfile is a cache hit and the
# image is reused. The context is the dockerfile/ directory, filtered to
# nothing by Dockerfile.torrentci-ci-build.dockerignore: the whole repository
# is over TorrentCI's 20 000-entry context limit.
jobs:
  - id: ci-build-image
    description: Build the tt-metal CI build image (Ubuntu 24.04) as a chain image
    runs-on: {os: linux, arch: amd64}
    images:
      build:
        - name: tt-metal-ci-build
          dockerfile: dockerfile/Dockerfile.torrentci-ci-build
          context: dockerfile

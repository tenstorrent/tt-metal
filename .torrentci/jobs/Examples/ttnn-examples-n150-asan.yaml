---
# PR Gate ttnn-examples (sdk-examples.yaml, product tt-nn; wh_n150_civ2 in
# tests/pipeline_reorg/ttnn_examples_pr_gate_tests.yaml): tests/scripts/run_sdk_examples.sh on one n150.
# It checks that the installed SDK exports no internal include dirs (#58511),
# then builds each installed example with ASan/UBSan flags and runs it.
#
# Intent (f686c4693d2, #21488; b3864ce7602, #21095): prove the .debs declare
# every dependency, so a consumer can simply `apt install` them. So the guest
# is a clean ubuntu:24.04, the asan-build packages are installed by apt, and
# apt resolves every dependency through the cluster mirror. GitHub's later
# basic-dev tools and prebuilt image (97de6de0da7, #54911) would hide a
# missing dependency; nothing is preinstalled here.
# distro is only what a consumer brings: a toolchain matching the packages'
# (cmake, ninja, build-essential, clang-20 and its ASan runtime) and
# libprotobuf-dev, which sdk-examples.yaml installs on purpose to catch
# protobuf symbol conflicts (5bc5bc2b12e, #29976). g++-12 is dropped: it was
# for 22.04's gcc-11 and Release builds; ASan builds use clang-20.
# tt-metalium-jit carries SFPI, as in release packages (asan-build ships it).
#
# Waits on tenstorrent/torrentci#1849 P3 (distro packages in the card VM):
# S3b and S3c-a (torrentci#3929, #3931), S3c-b (agent wiring), then
# capabilities.vmDisk.distroPackages on civ2 (S6 acceptance, S7 default).
# Until then it is not a shadow-pr-gate member.
# Kernel JIT runs cold (no hugepages, no remote kernel ccache): 45 m, not 15 m.
jobs:
  - id: ttnn-examples-n150-asan
    name: TT-NN SDK examples n150 (ASan)
    description: "Build and run the PR Gate tt-nn SDK examples on one n150, apt-installed into clean Ubuntu 24.04"
    timeout: 1h30m
    runs-on:
      kubernetes:
        os: linux
        arch: amd64
        # ubuntu:24.04, 2026-11-23.
        image: docker.io/library/ubuntu:24.04@sha256:562111b88caa79c71391c0c4d3c2114a7d5c35915c20561fd893cb1e07929e6b
        accelerator: {type: n150, count: 1}
        resources:
          requests: {cpu: '8', memory: 16Gi, ephemeral-storage: 30Gi}
          limits: {cpu: '8', memory: 16Gi, ephemeral-storage: 30Gi}
    packages:
      artifacts:
        - from-job: asan-build
          name: packages-ubuntu-24.04-amd64-ASan-x86_64-linux-clang-20-libstdcpp
          install: [tt-metalium, tt-metalium-jit, tt-metalium-dev, tt-nn, tt-nn-dev, tt-nn-examples]
      distro: [cmake, ninja-build, build-essential, clang-20, libclang-rt-20-dev, libprotobuf-dev]
    env:
      - {name: HOME, value: /tmp/home}
      - {name: TT_METAL_CACHE, value: /tmp/tt-metal-cache}
      - {name: PRODUCT, value: tt-nn}
      - {name: ASAN_BUILD, value: 'true'}
      - {name: ASAN_OPTIONS, value: "detect_leaks=0:color=always"}
      - {name: LSAN_OPTIONS, value: "suppressions=/usr/share/tt-metalium/lsan.supp"}
      - {name: TT_METAL_HOME, value: /usr/libexec/tt-metalium}
      - {name: TT_METAL_WATCHER, value: '5'}
      - {name: TT_METAL_WATCHER_TEST_MODE, value: '1'}
      - {name: CC, value: clang-20}
      - {name: CXX, value: clang++-20}
      - {name: CMAKE_BUILD_PARALLEL_LEVEL, value: '8'}
    steps:
      - id: examples
        kind: shell
        shell:
          run:
            - mkdir -p "$HOME" "$TT_METAL_CACHE"
            # The ASan runtime directory, as sdk-examples.yaml sets it. Log to
            # a file and print the tail, as smoke-n150-asan does.
            - >-
              export LD_LIBRARY_PATH="$(clang-20 -print-resource-dir)/lib/linux${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}";
              ulimit -n 4096; rc=0; timeout 45m ./tests/scripts/run_sdk_examples.sh
              >/tmp/examples.log 2>&1 || rc=$?;
              grep -e '::error::' -e '::warning::' /tmp/examples.log || true;
              tail -c 20000 /tmp/examples.log; exit $rc

---
# The PR Gate "runtime validation smoke cpu-only" test (smoke.yaml with
# product tt-metalium, test-category pr_gate; the github_hosted_cpu entry in
# tests/pipeline_reorg/runtime_validation_pr_gate_tests.yaml): the host-only
# CPU_* cases of tt-metalium-validation-smoke against asan-build's packages.
# No Tenstorrent device: TT_METAL_MOCK_CLUSTER_DESC_PATH keeps MetalContext
# in mock mode, as on the GitHub-hosted runner.
#
# `packages` puts the job on TorrentCI's VM path (torrentci#1849): the
# ci-build image boots as a guest disk and the named packages are installed
# from asan-build's packages.tar (a flat tar of .deb files) by apt, as root in
# the guest, before the first step. The steps run as uid 1000 against the
# installed tree under /usr, as `apt install ./pkgs/*.deb` does on GitHub.
# The VM path needs cpu and memory requests equal to their limits.
#
# Differences from the GitHub job, all forced by the platform:
# - The image is the ci-build chain image, not ci-test (TorrentCI has no
#   ci-test chain image yet).
# - The artifact is one tar of the .deb files (see 20-asan-build.yaml).
# No triggers: run it by hand. asan-build is an implicit dependency.
jobs:
  - id: smoke-cpu-asan
    description: "Run the PR Gate runtime validation smoke cpu-only test (CPU_* cases, mock cluster) on the ASan packages"
    timeout: 1h
    runs-on:
      kubernetes:
        os: linux
        arch: amd64
        image: {from-job: ci-build-image, image: tt-metal-ci-build}
        resources:
          requests: {cpu: '4', memory: 16Gi, ephemeral-storage: 30Gi}
          limits: {cpu: '4', memory: 16Gi, ephemeral-storage: 40Gi}
    packages:
      artifacts:
        - from-job: asan-build
          name: packages-ubuntu-24.04-amd64-ASan-x86_64-linux-clang-20-libstdcpp
          install: [tt-metalium, tt-metalium-validation]
    env:
      - {name: ASAN_OPTIONS, value: color=always}
      - {name: TSAN_OPTIONS, value: color=always}
      - {name: UBSAN_OPTIONS, value: "color=always:print_stacktrace=1:halt_on_error=1"}
      - {name: GTEST_COLOR, value: 'yes'}
      - {name: TT_METAL_WATCHER_TEST_MODE, value: '1'}
      - {name: TT_LOGGER_LEVEL, value: warn}
      - {name: TT_METAL_RUNTIME_ROOT, value: /usr/libexec/tt-metalium}
      - {name: LSAN_OPTIONS, value: suppressions=/usr/share/tt-metalium/lsan.supp}
      - name: TT_METAL_MOCK_CLUSTER_DESC_PATH
        value: /usr/libexec/tt-metalium/tt_metal/third_party/umd/tests/cluster_descriptor_examples/wormhole_N150.yaml
    steps:
      - id: smoke-cpu
        kind: shell
        shell:
          run:
            # The install outcome (install and seal timings), when the
            # platform writes one.
            - cat .torrentci/packages.json 2>/dev/null || true
            - dpkg -s tt-metalium tt-metalium-validation | grep -e '^Package' -e '^Version'
            - test -f "$TT_METAL_MOCK_CLUSTER_DESC_PATH"
            - mkdir -p test-reports
            - tt-metalium-validation-smoke --gtest_filter='*CPU_*' --gtest_output=xml:test-reports/

---
# Non-required shadow of the PR Gate. Only the merge-queue trigger runs it
# (triggers/merge-queue.yaml). Each member's `when` is its pr-gate.yaml
# condition over .torrentci/path-groups.yaml (tenstorrent/torrentci#2809).
dashboards:
  - id: shadow-pr-gate
    name: Shadow PR Gate
    description: "Shadow PR Gate: a non-blocking shadow of the PR Gate, run on each merge-queue entry; its checks are not required"
    report:
      check: true
    member-conditions:
      evaluate-on: [pull-request, merge-queue]
    members:
      - job: asan-build
        when:
          changed: [any-code, image]
      # runtime-smoke-tests (cpu-only leg).
      - job: smoke-cpu-asan
        when:
          changed: [cmake, tt-metalium, tt-metalium-tests, tt-nn-tests, image]
      - job: llk-hardware-free
        when:
          changed: [llk-wormhole, llk-blackhole, llk-common, llk-sfpi, llk-tests, llk-ci, llk-perf, llk-hardware-free,
                    llk-quasar]
      - job: verify-time-budgets
      - job: build-docs
        when:
          changed: [any-code, docs, image]
      # code-analysis's include-cleaner-api-headers: run-clang-tidy and an API header change.
      - job: include-cleaner
        when:
          changed:
            - all: [tt-metalium-api-headers, clang-tidy-source]
            - all: [tt-metalium-api-headers, cmake-raw]
            - all: [tt-metalium-api-headers, clang-tidy-config]
            - all: [tt-metalium-api-headers, llk-wormhole]
            - all: [tt-metalium-api-headers, llk-blackhole]
            - all: [tt-metalium-api-headers, llk-common]
            - all: [tt-metalium-api-headers, llk-sfpi]
            - all: [tt-metalium-api-headers, submodule]
            - all: [tt-metalium-api-headers, clang-tidy-key-workflow]
            - image

---
# Non-required shadow of the PR Gate, run on each merge-queue entry. Members
# grow as PR Gate jobs are ported.
dashboards:
  - id: shadow-pr-gate
    name: Shadow PR Gate
    description: "Shadow PR Gate: a non-blocking shadow of the PR Gate, run on each merge-queue entry; its checks are not required"
    report: {check: true}
    members:
      - job: asan-build
      - job: smoke-cpu-asan
      - job: smoke-n150-asan
      - job: ttnn-smoke-n150-asan
      - job: llk-hardware-free
      - job: llk-smoke-n150-g1
      - job: llk-smoke-n150-g2

---
# TEMPORARY C0 measurement for the clang-tidy result cache (torrentci#3525,
# design r3 C0 / r2.8). Manual only: no trigger or dashboard targets these
# jobs. Scripts are in .torrentci/c0-ctcache. Remove after C0 is recorded.
jobs:
  - id: c0-ctcache-replay-warm
    description: C0 - ctcache replay of main k..k+10, warm per push, plus the all-hit floor
    timeout: 10h
    compiler-cache: ccache
    runs-on:
      kubernetes:
        os: linux
        arch: amd64
        image: {from-job: ci-build-image, image: ci-build}
        resources:
          requests: {cpu: '16', memory: 16Gi, ephemeral-storage: 100Gi}
          limits: {memory: 24Gi, ephemeral-storage: 150Gi}
    env:
      - {name: CMAKE_BUILD_PARALLEL_LEVEL, value: '16'}
      - {name: CCACHE_COMPILERCHECK, value: content}
      - {name: CCACHE_BASEDIR, value: /workspace}
      - {name: CPM_SOURCE_CACHE, value: /workspace/.cpmcache}
      - {name: GIT_CEILING_DIRECTORIES, value: /workspace/.cpmcache}
    cache:
      key: 'cpm-v1-${ref_name}-${commit_sha}'
      restore-keys: ['cpm-v1-${ref_name}-', cpm-v1-]
      save-paths: [.cpmcache]
    steps:
      - id: prep
        kind: shell
        shell:
          run:
            - .torrentci/c0-ctcache/prep.sh
      - id: measure
        kind: shell
        shell:
          run:
            - .torrentci/c0-ctcache/replay.sh warm
      - id: cpm-cache-save
        kind: shell
        shell:
          run:
            - if [ -f /tmp/cpm-unchanged ]; then rm -rf .cpmcache; fi
  - id: c0-ctcache-replay-stale

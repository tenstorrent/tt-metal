---
# PR Gate llk-hardware-free-tests: host-only, no card.
jobs:
  - id: llk-hardware-free
    name: LLK hardware-free tests
    description: Run PR Gate's host-only LLK hardware-free tests (no card)
    timeout: 20m
    runs-on:
      kubernetes:
        os: linux
        arch: amd64
        # GitHub's llk-ci image, built from tt-llk's own Dockerfiles (its Python deps baked in).
        image: {from-job: llk-ci-image, image: llk-ci}
        resources:
          requests: {cpu: '8', memory: 16Gi, ephemeral-storage: 20Gi}
          limits: {memory: 16Gi, ephemeral-storage: 30Gi}
    # GitHub uploads the three JUnit reports run_hardware_free.sh writes.
    artifacts:
      publish:
        - name: hardware-free-wormhole-test-report
          path: tt_metal/tt-llk/tests/python_tests/pytest-report-hardware-free-wormhole.xml
          content-type: application/junit+xml
          when: always
        - name: hardware-free-blackhole-test-report
          path: tt_metal/tt-llk/tests/python_tests/pytest-report-hardware-free-blackhole.xml
          content-type: application/junit+xml
          when: always
        - name: hardware-free-blackhole-accuracy-test-report
          path: tt_metal/tt-llk/tests/python_tests/pytest-report-hardware-free-blackhole-accuracy.xml
          content-type: application/junit+xml
          when: always
    env:
      # Steps get HOME=/, unwritable, and the image sets none (torrentci#3936).
      - {name: HOME, value: /tmp/home}
    steps:
      - id: setup
        kind: shell
        shell:
          run:
            - mkdir -p "$HOME"
            - cd tt_metal/tt-llk/tests && ./setup_testing_env.sh
      - id: hardware-free
        # GitHub's cap (llk_hardware_free_tests.yaml: 10 min).
        timeout-ms: 600000
        kind: shell
        shell:
          run:
            - cd tt_metal/tt-llk && ./tests/run_hardware_free.sh

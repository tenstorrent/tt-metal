---
# Temporary (torrentci#3506): measure the workspace a cold ci-test chain-image
# build needs, under a large ephemeral limit. Remove once the limit is set.
jobs:
  - id: ci-test-image-measure
    name: CI test image workspace measurement
    description: Measure the peak workspace of a cold ci-test chain-image build (torrentci#3506, temporary)
    timeout: 180m
    temporary-direct-egress: "#1754"
    runs-on:
      kubernetes:
        os: linux
        arch: amd64
        image: docker.io/moby/buildkit:v0.34.1-rootless@sha256:f68752a5a94acfcdad2d07867b7075601a421638e17fc5f28efc1c814d0c4f89
        capability-profile: image-build
        resources:
          requests: {cpu: '3', memory: 16Gi, ephemeral-storage: 80Gi}
          limits: {cpu: '8', memory: 16Gi, ephemeral-storage: 80Gi}
    steps:
      - id: measure
        kind: shell
        shell: {run: [.torrentci/scripts/measure-ci-test-workspace.sh]}

---
# The PR Gate "Build ASan ubuntu 24.04" compile (build-artifact.yaml with
# build-type ASan, the clang-20 libstdc++ toolchain, tracy off, system SFPI,
# skip-tt-train false => --build-all), in the image ci-build-image builds.
# Then the package target and the two uploads the PR Gate makes
# (publish-package, build-ttnn-import-artifact). A TorrentCI artifact is one
# regular file, so each GitHub artifact is published as one tar: the .deb and
# .ddeb files flat and uncompressed (their compression-level 0), and the
# stripped ttnn-import tree with zstd -1 (their compression-level 1). Names
# drop the ref and run-id suffix: TorrentCI scopes artifacts to the producing
# job execution. ccache is remote; CPM's source cache is a TorrentCI cache
# (large restores have failed, torrentci#1179; a failed restore runs cold). On afuller/baby-steps it runs on every merge-queue
# entry; here it runs through the pr-gate and merge-gate dashboards.
jobs:
  - id: asan-build
    description: Configure and compile tt-metal (ASan, --build-all) in the CI build image
    timeout: 4h
    # Remote ccache through the platform's proxy: TorrentCI sets
    # CCACHE_REMOTE_STORAGE (civ2).
    compiler-cache: ccache
    runs-on:
      kubernetes:
        os: linux
        arch: amd64
        image: {from-job: ci-build-image, image: ci-build}
        resources:
          # Two cold runs (resource-summary, main container): 16 jobs peaked at
          # 13.2 GiB anon memory, 32 jobs at 22.7 GiB. No CPU limit: a 16-CPU
          # limit throttled 53% of periods. The renderer passes limits through
          # as declared and requires none.
          requests: {cpu: '16', memory: 24Gi, ephemeral-storage: 100Gi}
          limits: {memory: 32Gi, ephemeral-storage: 150Gi}
    env:
      - {name: CMAKE_BUILD_PARALLEL_LEVEL, value: '16'}
      - {name: CCACHE_DIR, value: /workspace/.cache/ccache}
      - {name: CCACHE_BASEDIR, value: /workspace}
      - {name: CCACHE_TEMPDIR, value: /tmp/ccache}
      - {name: CCACHE_COMPRESS, value: 'true'}
      - {name: CCACHE_COMPRESSLEVEL, value: '3'}
      # TorrentCI's cache archive is capped at 5 GiB compressed.
      - {name: CCACHE_MAXSIZE, value: 4G}
      - {name: CCACHE_COMPILERCHECK, value: content}
      - {name: TRACY_NO_INVARIANT_CHECK, value: '1'}
      - {name: TRACY_NO_ISA_EXTENSIONS, value: '1'}
      # CPM's default source cache, named so configure stops re-fetching
      # ~30 git sources and Boost on every checkout. Same path as the default
      # keeps ccache's relative include paths (CCACHE_BASEDIR) unchanged.
      - {name: CPM_SOURCE_CACHE, value: /workspace/.cpmcache}
    # TorrentCI keys are literal (no hashFiles): restore the newest entry for
    # this ref, then a protected ref's; the cpm-cache step drops a restored tree whose
    # dependency-file hash differs, so a change refetches from scratch and
    # the cache never accumulates stale sources. A miss fetches as before.
    cache:
      key: 'cpm-v1-${ref_name}-${commit_sha}'
      restore-keys: ['cpm-v1-${ref_name}-', cpm-v1-]
      save-paths: [.cpmcache]
    artifacts:
      publish:
        # Consumed as packages-artifact-name by smoke, sdk-examples and
        # build-prebuilt-tests-image (download into /work/pkgs/).
        - name: packages-ubuntu-24.04-amd64-ASan-x86_64-linux-clang-20-libstdcpp
          path: packages.tar
          content-type: application/x-tar
          retention: dependents
        # Consumed by build-docs as TT_FROM_PRECOMPILED_DIR=/work.
        - name: ttnn-import-ASan
          path: ttnn-import.tar.zst
          content-type: application/zstd
          retention: dependents
    steps:
      - id: submodules
        kind: shell
        shell:
          run:
            - git submodule sync --recursive
            - git submodule update --init --recursive --depth 1 --jobs 4
      - id: cpm-cache
        kind: shell
        shell:
          run:
            - >-
              cat cmake/CPM.cmake third_party/CMakeLists.txt tt_metal/third_party/CMakeLists.txt
              tt_metal/third_party/umd/third_party/CMakeLists.txt tt-train/cmake/dependencies.cmake
              .gitmodules | sha256sum | cut -d' ' -f1 > /tmp/cpm-deps.sha256
            - >-
              if [ ! -f .cpmcache/.deps.sha256 ]; then echo "CPM cache: miss";
              elif cmp -s .cpmcache/.deps.sha256 /tmp/cpm-deps.sha256; then
              echo "CPM cache: hit, $(du -sh .cpmcache | cut -f1)"; touch /tmp/cpm-unchanged;
              else echo "CPM cache: dependencies changed, dropping it"; rm -rf .cpmcache; fi
            - mkdir -p .cpmcache && cp /tmp/cpm-deps.sha256 .cpmcache/.deps.sha256
      - id: configure
        kind: shell
        shell:
          run:
            - mkdir -p "$CCACHE_DIR" "$CCACHE_TEMPDIR"
            - >-
              echo "restored ccache: $(du -sh "$CCACHE_DIR" | cut -f1), $(find "$CCACHE_DIR" -type f | wc -l) files"
            - ccache -p | grep -v '^(default)' || true
            - ccache -s -v
            - ccache -z
            - >-
              ./build_metal.sh --build-dir build --build-type ASan
              --toolchain-path cmake/x86_64-linux-clang-20-libstdcpp-toolchain.cmake
              --build-all --enable-ccache --configure-only
              --use-system-sfpi --disable-profiler
      - id: compile
        kind: shell
        shell:
          run:
            - cmake --build build --target install
            - ccache -s -v
      - id: package
        kind: shell
        shell:
          run:
            - cmake --build build --target package
            - ls -1sh build/*.deb build/*.ddeb || true
      - id: stage-packages
        kind: shell
        shell:
          run:
            - >-
              find build -maxdepth 1 -type f \( -name '*.deb' -o -name '*.ddeb' \)
              -printf '%f\n' | sort > packages.list
            - test -s packages.list
            - tar -cf packages.tar -C build -T packages.list
            - ls -l packages.tar
      - id: stage-ttnn-import
        kind: shell
        shell:
          run:
            # Lean TT_FROM_PRECOMPILED_DIR tree (build/lib + runtime), as the
            # PR Gate stages it.
            - rm -rf ttnn-import
            - mkdir -p ttnn-import/build/lib
            - cp -a build/lib/*.so* ttnn-import/build/lib/
            - find ttnn-import/build/lib -type f -name '*.so*' -exec strip --strip-unneeded {} +
            - cp -a runtime ttnn-import/runtime
            - du -sh ttnn-import ttnn-import/build/lib
            - tar -I 'zstd -1 -T0' -cf ttnn-import.tar.zst -C ttnn-import .
            - ls -l ttnn-import.tar.zst
      - id: probe-links
        kind: shell
        shell:
          run:
            - |-
              find build/lib runtime \( -type l -o -links +1 \) -printf '%y %n %p -> %l\n'
            - |-
              find build/lib runtime -type d -perm -2000 -printf 'setgid %p\n'
            - |-
              find build/lib runtime -type f -size +0 -printf '%S %p\n' | awk '$1 < 1'
      - id: cpm-cache-save
        kind: shell
        shell:
          run:
            # The cache archive refuses symlinks (18 in these sources, e.g.
            # cadical's src/configure), hard links, setuid/setgid bits, more
            # than 100k members (about 85k here, 62k of them Boost), holes, names
            # that collide ignoring case, and restores no `.git` path. CPM
            # only checks that a cached source directory exists, so drop the
            # clones' .git and replace each symlink with a copy of its target
            # (dangling ones are dropped).
            - find .cpmcache -name .git -prune -exec rm -rf {} +
            - >-
              find .cpmcache -type l -exec sh -c 'for l; do
              t=$(readlink -f "$l") && rm "$l" && cp -rL "$t" "$l" || true; done' _ {} +
            - find .cpmcache -type l -delete
            # Densify files with holes (the archive refuses sparse files).
            - >-
              find .cpmcache -type f -size +0 -printf '%S %p\n' | awk '$1 < 1 {sub(/^[^ ]+ /, ""); print}'
              | while IFS= read -r f; do echo "densify $f"; cp --sparse=never "$f" "$f.dense" && mv "$f.dense" "$f"; done
            - >-
              if command -v getfattr >/dev/null; then echo "xattr files:
              $(getfattr -R -d -m - .cpmcache 2>/dev/null | grep -c '^# file')"; fi
            - >-
              echo "cpmcache: $(du -sh .cpmcache | cut -f1),
              $(find .cpmcache | wc -l) entries, $(find .cpmcache -type l | wc -l) symlinks,
              $(find .cpmcache -type f -links +1 | wc -l) hard-linked,
              $(find .cpmcache -perm /5000 | wc -l) setuid/sticky,
              $(find .cpmcache -type f -perm /2000 | wc -l) setgid files,
              $(find .cpmcache -type f -size +0 -printf '%S\n' | awk '$1 < 1' | wc -l) sparse,
              $(find .cpmcache | tr A-Z a-z | sort | uniq -d | wc -l) case collisions"
            - find .cpmcache | tr A-Z a-z | sort | uniq -d | head || true
            # An unchanged restored tree is already stored: remove it so the
            # platform skips re-uploading it (save records skipped_empty).
            - if [ -f /tmp/cpm-unchanged ]; then rm -rf .cpmcache; fi

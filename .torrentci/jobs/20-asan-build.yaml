---
# The PR Gate "Build ASan ubuntu 24.04" compile (build-artifact.yaml with
# build-type ASan, the clang-20 libstdc++ toolchain, tracy off, system SFPI,
# skip-tt-train false => --build-all), in the image ci-build-image builds.
# Then the package target and the two uploads the PR Gate makes
# (publish-package, build-ttnn-import-artifact). A TorrentCI artifact is one
# regular file, so each GitHub artifact is published as one tar: the .deb and
# .ddeb files flat and uncompressed (their compression-level 0), and the
# stripped ttnn-import tree with zstd -1 (their compression-level 1). Names
# drop the ref and run-id suffix: TorrentCI scopes artifacts to the producing
# job execution. ccache is remote; no TorrentCI cache (large restores fail
# today, torrentci#1179). Not yet here: triggers (run it by hand).
jobs:
  - id: asan-build
    description: Configure and compile tt-metal (ASan, --build-all) in the CI build image
    timeout: 4h
    # Remote ccache through the platform's proxy: TorrentCI sets
    # CCACHE_REMOTE_STORAGE (civ2).
    # Run marker: cpm warm 1
    compiler-cache: ccache
    runs-on:
      kubernetes:
        os: linux
        arch: amd64
        image: {from-job: ci-build-image, image: tt-metal-ci-build}
        resources:
          # Two cold runs (resource-summary, main container): 16 jobs peaked at
          # 13.2 GiB anon memory, 32 jobs at 22.7 GiB. No CPU limit: a 16-CPU
          # limit throttled 53% of periods. The renderer passes limits through
          # as declared and requires none.
          requests: {cpu: '16', memory: 24Gi, ephemeral-storage: 100Gi}
          limits: {memory: 32Gi, ephemeral-storage: 150Gi}
    env:
      - {name: CMAKE_BUILD_PARALLEL_LEVEL, value: '16'}
      - {name: CCACHE_DIR, value: /workspace/.cache/ccache}
      - {name: CCACHE_BASEDIR, value: /workspace}
      - {name: CCACHE_TEMPDIR, value: /tmp/ccache}
      - {name: CCACHE_COMPRESS, value: 'true'}
      - {name: CCACHE_COMPRESSLEVEL, value: '3'}
      # TorrentCI's cache archive is capped at 5 GiB compressed.
      - {name: CCACHE_MAXSIZE, value: 4G}
      - {name: TRACY_NO_INVARIANT_CHECK, value: '1'}
      - {name: TRACY_NO_ISA_EXTENSIONS, value: '1'}
    artifacts:
      publish:
        # Consumed as packages-artifact-name by smoke, sdk-examples and
        # build-prebuilt-tests-image (download into /work/pkgs/).
        - name: packages-ubuntu-24.04-amd64-ASan-x86_64-linux-clang-20-libstdcpp
          path: packages.tar
          content-type: application/x-tar
        # Consumed by build-docs as TT_FROM_PRECOMPILED_DIR=/work.
        - name: ttnn-import-ASan
          path: ttnn-import.tar.zst
          content-type: application/zstd
    steps:
      - id: check-image
        kind: shell
        shell:
          run:
            - . tt_metal/sfpi-version
            - echo "repo sfpi ${sfpi_version} ${sfpi_x86_64_debian_deb_hash}"
            - echo "image sfpi $(cat /opt/tenstorrent/sfpi/.torrentci-sfpi-version)"
            - test "$(cat /opt/tenstorrent/sfpi/.torrentci-sfpi-version)" = "${sfpi_version} ${sfpi_x86_64_debian_deb_hash}"
      - id: submodules
        kind: shell
        shell:
          run:
            - git submodule sync --recursive
            - git submodule update --init --recursive --depth 1 --jobs 4
      - id: configure
        kind: shell
        shell:
          run:
            - mkdir -p "$CCACHE_DIR" "$CCACHE_TEMPDIR"
            - >-
              echo "restored ccache: $(du -sh "$CCACHE_DIR" | cut -f1), $(find "$CCACHE_DIR" -type f | wc -l) files"
            - ccache -p | grep -v '^(default)' || true
            - ccache -s -v
            - ccache -z
            - >-
              ./build_metal.sh --build-dir build --build-type ASan
              --toolchain-path cmake/x86_64-linux-clang-20-libstdcpp-toolchain.cmake
              --build-all --enable-ccache --configure-only
              --use-system-sfpi --disable-profiler
      # TEMPORARY (torrentci#2382): measure .cpmcache as a cache archive.
      - id: measure-cpmcache
        kind: shell
        shell:
          run:
            - |
              set +e
              cd /workspace
              echo "M2382 members $(find .cpmcache | wc -l)"
              echo "M2382 files $(find .cpmcache -type f | wc -l) dirs $(find .cpmcache -type d | wc -l) links $(find .cpmcache -type l | wc -l) other $(find .cpmcache ! -type f ! -type d ! -type l | wc -l)"
              echo "M2382 hardlinked_files $(find .cpmcache -type f -links +1 | wc -l)"
              echo "M2382 apparent_bytes $(du -sb --apparent-size .cpmcache | cut -f1)"
              echo "M2382 path_bytes $(find .cpmcache -printf '%p\n' | wc -c)"
              echo "M2382 max_path $(find .cpmcache -printf '%p\n' | awk '{ if (length($0) > m) m = length($0) } END { print m }')"
              echo "M2382 max_depth $(find .cpmcache -printf '%d\n' | sort -n | tail -1)"
              echo "M2382 setuid_or_sticky $(find .cpmcache -perm /7000 | wc -l)"
              find .cpmcache -type l -printf 'M2382 link %p -> %l\n'
              s=$(date +%s.%N)
              tar -cf - .cpmcache | zstd -3 --long=27 -T1 -q -o /workspace/.m2382.tar.zst
              e=$(date +%s.%N)
              echo "M2382 compressed_bytes $(stat -c %s /workspace/.m2382.tar.zst) pack_seconds $(awk "BEGIN { print $e - $s }")"
              mkdir -p /workspace/.m2382-x
              s=$(date +%s.%N)
              zstd -d --long=27 -T1 -q -c /workspace/.m2382.tar.zst | tar -xf - -C /workspace/.m2382-x
              e=$(date +%s.%N)
              echo "M2382 extract_seconds_1cpu $(awk "BEGIN { print $e - $s }")"
              rm -rf /workspace/.m2382-x /workspace/.m2382.tar.zst
              exit 0
      - id: compile
        kind: shell
        shell:
          run:
            - cmake --build build --target install
            - ccache -s -v
      - id: package
        kind: shell
        shell:
          run:
            - cmake --build build --target package
            - ls -1sh build/*.deb build/*.ddeb || true
      - id: stage-packages
        kind: shell
        shell:
          run:
            - >-
              find build -maxdepth 1 -type f \( -name '*.deb' -o -name '*.ddeb' \)
              -printf '%f\n' | sort > packages.list
            - test -s packages.list
            - tar -cf packages.tar -C build -T packages.list
            - ls -l packages.tar
      - id: stage-ttnn-import
        kind: shell
        shell:
          run:
            # Lean TT_FROM_PRECOMPILED_DIR tree (build/lib + runtime), as the
            # PR Gate stages it.
            - rm -rf ttnn-import
            - mkdir -p ttnn-import/build/lib
            - cp -a build/lib/*.so* ttnn-import/build/lib/
            - find ttnn-import/build/lib -type f -name '*.so*' -exec strip --strip-unneeded {} +
            - cp -a runtime ttnn-import/runtime
            - du -sh ttnn-import ttnn-import/build/lib
            - tar -I 'zstd -1 -T0' -cf ttnn-import.tar.zst -C ttnn-import .
            - ls -l ttnn-import.tar.zst

model:
  variant: kimi_k2_6         # [MATCH RUNNER] the PREFILL_MODEL kimi26.json selects
  num_layers: 61             # [MATCH RUNNER] ack count is num_layers x chunks; a mismatch hangs the drain
  max_seq_len: 56320         # [MATCH RUNNER]
  chunk_size: 5120           # [MATCH RUNNER] 56320 / 5120 = 11 chunks exactly, no partial tail

transport:
  sp: 8                      # [MATCH RUNNER] 8x4 = the 32-chip BH galaxy
  tp: 4
  h2d_service_id: kimi26_prefill   # [MATCH RUNNER] PREFILL_H2D_SERVICE_ID
  connect_timeout_s: 60

workload:
  num_users: 3               # [MATCH RUNNER NUM_USERS]
  max_requests: 3            # one resident request per slot; no slot recycling
  interleave: round_robin
  check_pcc: false           # runner validates its device-owned KV after the shutdown sentinel
  slot_prompts:
    - /mnt/models/deepseek-prefill-cache/golden/structured_traces/kimi_longbook_55k_vllm
    - /mnt/models/deepseek-prefill-cache/golden/structured_traces/kimi_debug_55k_vllm
    - /home/jameszianxu/tt-metal/prompt_generation_testing/generated_traces

migration:
  issue: false               # no endpoint, migration worker, or KV copy

env:
  PREFILL_SEND_SHUTDOWN: "1" # end the request loop so the runner performs its post-loop PCC check
universal:
  faq:
    - q: How are these tests run?
      a: >
        Each test is a C++ kernel that runs directly on the Tenstorrent device.
        A host-side Python harness launches the kernel, waits for completion,
        and reads back cycle counts and byte counts from device registers.
        The reported bandwidth and latency are computed from those raw measurements.
    - q: What is the NoC?
      a: >
        The Network on Chip (NoC) is the on-die interconnect that connects all
        Tensix cores, DRAM controllers, and PCIe endpoints on a Tenstorrent chip.
        It is a 2D mesh with dedicated read and write networks, and all data
        movement between cores or between cores and memory goes through the NoC.
    - q: What does "bytes/cycle" mean and how do I convert it to GB/s?
      a: >
        Bytes/cycle is the bandwidth normalized to the NoC clock. To convert to
        GB/s, multiply by the clock frequency in GHz (Wormhole: 1.0 GHz,
        Blackhole: 1.35 GHz). For example, 32 bytes/cycle on Blackhole =
        32 × 1.35 = 43.2 GB/s.
    - q: Why do Blackhole and Wormhole results differ for the same test?
      a: >
        Blackhole and Wormhole have different NoC architectures, clock speeds,
        link widths, core counts, and DRAM configurations. Blackhole generally
        has wider NoC links and higher clock speeds, so it achieves higher
        absolute bandwidth. Comparing the two reveals which improvements are
        architectural vs frequency-driven.
    - q: What does "Transaction Size" mean?
      a: >
        Transaction size is the number of bytes sent in a single noc_async_read
        or noc_async_write call. Larger transactions amortize per-packet overhead
        and generally achieve higher bandwidth, up to the link-rate ceiling.
    - q: How should I interpret the sweep charts?
      a: >
        Each line in a sweep chart represents a different configuration (e.g. a
        different virtual channel, grid size, or NoC index). The x-axis is the
        swept parameter, and the y-axis is the measured bandwidth or latency.
        Look for where lines plateau (hitting a hardware limit), diverge (one
        config outperforming another), or drop (contention or bottleneck).

groups:
  one_from_one:
    name: One from One
    tags: [read, unicast, L1, single_core, virtual_channels]
    image: web_images/bad-one-from-one.svg
    faq:
      - q: What does the One from One test measure?
        a: >
          It measures the NoC read bandwidth and latency when a single reader core
          issues noc_async_read calls to pull data from one remote sender core.
          This isolates unicast read performance with no contention from other cores.
      - q: Why does bandwidth plateau at larger transaction sizes?
        a: >
          The NoC has a fixed link bandwidth (e.g. ~32 bytes/cycle per link on Blackhole).
          At small transaction sizes, per-transaction overhead (header, handshake) dominates,
          so bandwidth is low. Once the payload is large enough to amortize that overhead,
          you hit the link-rate ceiling and bandwidth flattens.
      - q: What are virtual channels and why do they matter?
        a: >
          Virtual channels (VCs) are independent logical lanes on the same physical NoC link.
          Using different VCs allows independent transactions to make progress without
          head-of-line blocking. The virtual channel sweep test shows whether changing the VC
          assignment affects throughput for this single-core-pair scenario.
      - q: How is "Bandwidth (bytes/cycle)" calculated?
        a: >
          Total bytes transferred divided by the elapsed cycle count measured between
          noc_async_read issue and the corresponding noc_async_read_barrier completion.
          This is the effective application-visible bandwidth, not raw link rate.
      - q: What is the difference between One from One and One to One?
        a: >
          One from One uses noc_async_read (the reader pulls data from the sender),
          while One to One uses noc_async_write (the sender pushes data to the receiver).
          Both are single-source single-destination, but the direction of the initiating
          transaction differs, which can affect latency and bandwidth characteristics.

  one_to_one:
    name: One to One
    tags: [write, unicast, L1, single_core, virtual_channels]
    faq:
      - q: What does the One to One test measure?
        a: >
          It measures NoC write bandwidth and latency when a single sender core uses
          noc_async_write to push data to one remote receiver core. This isolates
          unicast write performance with no contention from other cores.
      - q: How does One to One performance compare to One from One?
        a: >
          Writes (One to One) are fire-and-forget from the sender's perspective — the sender
          doesn't stall waiting for data to arrive. Reads (One from One) require a round trip.
          This means writes can sometimes show higher apparent throughput, though the NoC
          link bandwidth is the same in both directions.
      - q: Why does the virtual channel sweep matter for writes?
        a: >
          Even in a single-pair write scenario, the VC determines which internal buffer
          the packet uses. Certain VCs may have deeper buffers or different arbitration
          priority, which can affect sustained throughput.

  one_from_all:
    name: One from All
    tags: [read, unicast, L1, single_core, virtual_channels]
    faq:
      - q: What does the One from All test measure?
        a: >
          A single reader core reads data from every other core on the chip. This
          stresses the NoC's ability to handle many concurrent read requests converging
          on one destination and measures how read bandwidth scales with source count.
      - q: Why might throughput drop compared to One from One?
        a: >
          All responses converge on a single destination core, creating congestion at
          the receiver's local router. The destination's receive buffer also becomes a
          bottleneck as it must absorb traffic from every source simultaneously.

  one_to_all:
    name: One to All
    tags: [write, unicast, multicast, L1, single_core]
    faq:
      - q: What is the difference between unicast and multicast One to All?
        a: >
          Unicast One to All sends separate noc_async_write transactions to each
          destination core individually. Multicast One to All uses a single multicast
          write that the NoC hardware replicates at each router hop, which is
          significantly more efficient for one-to-many data distribution.
      - q: What does "Multicast Linked" mean?
        a: >
          Multicast linked mode sends data to a rectangular grid of cores using a single
          multicast transaction where each receiving core also updates a linked-list
          semaphore. This is the pattern used for tilized data distribution in matmul
          and other collective operations.
      - q: What are the Multicast Schemes tests?
        a: >
          These tests compare different multicast delivery strategies (e.g. row-first
          vs column-first routing, different grid shapes) to show which schemes
          achieve the best bandwidth and lowest latency for a given core layout.

  one_packet:
    name: One Packet
    tags: [read, write, unicast, L1, single_core]
    faq:
      - q: What does the One Packet test measure?
        a: >
          It measures the latency and overhead of sending a single NoC packet
          (one read or one write) between two cores. Unlike the streaming tests,
          this focuses on per-transaction cost rather than sustained throughput.
      - q: Why is single-packet latency important?
        a: >
          Many real workloads issue small, latency-sensitive transactions (e.g.
          semaphore updates, control messages, small tensor tile headers). If
          per-packet overhead is high, these workloads suffer even though the
          link bandwidth is large.

  all_to_all:
    name: All to All
    tags: [write, unicast, L1, multi_core]
    faq:
      - q: What does the All to All test measure?
        a: >
          Every core writes data to every other core simultaneously. This is the
          maximum-contention write scenario and measures how the NoC fabric handles
          full bisection traffic.
      - q: What does the grid sweep variant test?
        a: >
          The grid sweep varies the number of participating cores (e.g. 2x2, 4x4,
          up to the full grid) to show how all-to-all write bandwidth scales with
          core count and at what point the NoC becomes saturated.
      - q: Why is all-to-all bandwidth lower than one-to-one?
        a: >
          Every router in the mesh is simultaneously sourcing and sinking traffic,
          so links are shared across many flows. Bandwidth per flow drops because
          the aggregate demand exceeds the bisection bandwidth of the mesh.

  all_from_all:
    name: All from All
    tags: [read, unicast, L1, multi_core]
    faq:
      - q: What does the All from All test measure?
        a: >
          Every core reads data from every other core simultaneously. This is the
          maximum-contention read scenario and reveals how NoC read bandwidth
          degrades under full mesh traffic.
      - q: How does All from All differ from All to All?
        a: >
          All from All uses noc_async_read (each core pulls from all others), while
          All to All uses noc_async_write (each core pushes to all others). Reads
          require a request-response round trip, so All from All typically shows
          higher latency per transaction than All to All.

  multi_interleaved:
    name: Multi Interleaved
    tags: [read, write, unicast, DRAM, multi_core]
    faq:
      - q: What does the Multi Interleaved test measure?
        a: >
          Multiple cores simultaneously read or write to DRAM using interleaved
          (page-striped) addressing. This measures how DRAM bandwidth scales when
          many cores share the DRAM banks through the NoC.
      - q: What is the difference between the read, write, and combined variants?
        a: >
          The "Read" variant has all cores reading from DRAM, the "Write" variant
          has all cores writing to DRAM, and the combined "Sizes" variant has cores
          doing both. The combined variant shows whether read-write conflicts at the
          DRAM controller degrade total throughput.
      - q: What does the grid sweep variant show?
        a: >
          It varies the number of participating cores to reveal the scaling curve —
          at what core count DRAM bandwidth saturates and whether adding more cores
          causes contention that reduces per-core throughput.

  atomics:
    name: Atomic Semaphore
    tags: [write, unicast, L1, multi_core, atomics]
    faq:
      - q: What does the Atomic Semaphore test measure?
        a: >
          It measures the bandwidth and latency of atomic semaphore increment
          operations between cores. One core issues atomic increments to a semaphore
          located on another core's L1, and we measure how fast these complete.
      - q: What is the difference between adjacent and non-adjacent sweeps?
        a: >
          The adjacent sweep places the source and destination cores next to each
          other (1 hop), while the non-adjacent sweep increases the hop distance.
          This reveals how atomic operation latency scales with NoC distance.

  core_bidirectional:
    name: Core Bidirectional
    tags: [read, write, unicast, L1, single_core]
    faq:
      - q: What does the Core Bidirectional test measure?
        a: >
          Two cores simultaneously send data to each other, measuring whether
          full-duplex NoC traffic achieves the expected 2x throughput of a
          single direction, or whether contention at shared links reduces it.
      - q: What is the difference between same-kernel and different-kernel variants?
        a: >
          The same-kernel variant runs identical code on both cores (symmetric traffic).
          The different-kernel variant runs different code on each core (asymmetric
          traffic patterns), which can reveal how the NoC handles imbalanced flows.

  direct_write:
    name: Direct Write
    tags: [write, unicast, L1, single_core]
    faq:
      - q: What is a direct write and how does it differ from noc_async_write?
        a: >
          A direct (inline) write embeds the payload directly in the NoC packet header
          rather than doing a DMA from L1. This avoids the DMA read latency and is
          faster for very small payloads (typically 16 bytes or fewer), but the maximum
          payload size is limited by the header capacity.
      - q: What does the address pattern test show?
        a: >
          It compares direct write performance across different destination address
          patterns (sequential, strided, random) to check whether the target address
          alignment or pattern affects throughput.

  dram_neighbour:
    name: DRAM Neighbour
    tags: [read, unicast, DRAM, multi_core]
    faq:
      - q: What does the DRAM Neighbour test measure?
        a: >
          It measures DRAM read bandwidth as a function of the physical distance between
          the reading core and the target DRAM bank. "Closest neighbour" means the core
          reads from the nearest DRAM channel, minimizing NoC hops.
      - q: What do the page sweep and bank sweep variants show?
        a: >
          The page sweep varies the number of DRAM pages read per transaction to find
          the optimal batch size. The bank sweep varies which DRAM banks are targeted
          to reveal whether spreading reads across banks improves throughput through
          bank-level parallelism.
      - q: What are the "one hop" and "loop back" distance variants?
        a: >
          "One hop" places the reader one NoC hop away from the DRAM controller.
          "Loop back" places the reader as far as possible, routing traffic across the
          full chip. Comparing them shows the NoC distance penalty for DRAM access.

  dram_sharded:
    name: DRAM Sharded Read
    tags: [read, unicast, DRAM, multi_core]
    faq:
      - q: What does the DRAM Sharded Read test measure?
        a: >
          It measures read bandwidth when each core reads from a dedicated shard
          (contiguous region) of DRAM, rather than interleaved pages. This is the
          access pattern used by sharded tensor layouts.
      - q: What do the tile number and bank number sweeps show?
        a: >
          The tile number sweep varies how many tiles each core reads per batch.
          The bank number sweep varies how many DRAM banks each core's shard spans.
          Together they reveal the optimal sharding granularity for maximum throughput.

  dram_unary:
    name: DRAM Unary
    tags: [read, write, unicast, DRAM, single_core]
    faq:
      - q: What does the DRAM Unary test measure?
        a: >
          A single core reads from or writes to DRAM, isolating the baseline
          DRAM bandwidth achievable by one core with no contention from others.
      - q: Why is single-core DRAM bandwidth important?
        a: >
          It establishes the per-core DRAM bandwidth ceiling. Multi-core DRAM tests
          can then be compared against this baseline to measure how much contention
          reduces per-core throughput.

  interleaved:
    name: Interleaved
    tags: [read, write, unicast, DRAM, L1, single_core]
    faq:
      - q: What does the Interleaved test measure?
        a: >
          A single core reads or writes using interleaved (page-striped) addressing
          across DRAM or L1 banks. This measures the throughput of the interleaved
          memory layout that TT-Metal uses for many tensor storage formats.
      - q: What is the difference between the DRAM and L1 interleaved variants?
        a: >
          DRAM interleaved stripes pages across DRAM banks (off-chip memory), while
          L1 interleaved stripes pages across other cores' L1 SRAM (on-chip). L1
          interleaved typically has lower latency but is limited by L1 capacity.

  loopback:
    name: Loopback
    tags: [read, write, unicast, L1, single_core]
    faq:
      - q: What does the Loopback test measure?
        a: >
          A core reads from or writes to its own L1 through the NoC, routing
          traffic out of and back into the same core. This measures the minimum
          NoC round-trip latency and maximum single-core self-bandwidth.
      - q: Why test loopback if the core could just access L1 directly?
        a: >
          Loopback isolates the NoC router and link overhead with zero hop distance.
          Comparing loopback bandwidth against direct L1 access shows how much overhead
          the NoC adds for the simplest possible transaction.

  noc_estimator_tests:
    name: Noc Estimator
    tags: [read, write, unicast, multicast, L1, DRAM, single_core, multi_core]
    faq:
      - q: What does the Noc Estimator test measure?
        a: >
          These tests run real NoC traffic patterns and compare measured bandwidth
          against the analytical NoC bandwidth estimator model. The goal is to
          validate that the estimator's predictions match hardware behavior.
      - q: How are the estimator tests organized?
        a: >
          They are organized by memory type (L1 vs DRAM) and traffic pattern
          (one-to-one, one-from-one, all-to-all, row, column, etc.). Each test
          runs the pattern on hardware and records both the measured bandwidth
          and the estimator's prediction for comparison.
      - q: What do "sharded" vs "interleaved" DRAM estimator tests mean?
        a: >
          Sharded tests use a contiguous DRAM region per core (each core owns a shard),
          while interleaved tests stripe pages across all DRAM banks. The estimator
          must handle both layouts correctly because they produce different NoC
          traffic patterns and congestion profiles.

  pcie_read_bw:
    name: PCIe Read
    tags: [read, unicast, DRAM, single_core]
    faq:
      - q: What does the PCIe Read test measure?
        a: >
          It measures the bandwidth of reading data from the host CPU into the device
          over the PCIe link. This is the device-to-host (D2H) read path and is
          typically limited by PCIe gen and lane count.
      - q: Why is PCIe read bandwidth usually lower than write bandwidth?
        a: >
          PCIe reads require a request-completion round trip (the device sends a read
          request, the host responds with data), while writes are posted (fire-and-forget).
          The round-trip latency limits outstanding read requests and reduces throughput.

  pcie_write_bw:
    name: PCIe Write
    tags: [write, unicast, DRAM, single_core]
    faq:
      - q: What does the PCIe Write test measure?
        a: >
          It measures the bandwidth of writing data from the host CPU to the device
          over the PCIe link. This is the host-to-device (H2D) write path.
      - q: How does PCIe write bandwidth relate to model loading performance?
        a: >
          Model weights and inputs are typically written from the host to device DRAM
          via PCIe writes. Higher PCIe write bandwidth means faster model loading
          and input data staging.

  transaction_id:
    name: Transaction ID
    tags: [read, write, unicast, L1, single_core]
    faq:
      - q: What does the Transaction ID test measure?
        a: >
          It measures the overhead and correctness of read-after-write and
          write-after-read ordering using NoC transaction IDs. Transaction IDs
          allow the hardware to enforce memory ordering without software barriers.
      - q: What is the difference between the "one packet" and "stateful" variants?
        a: >
          The "one packet" variant sends a single transaction per ordering point,
          measuring pure ordering overhead. The "stateful" variant accumulates state
          across transactions, testing whether the ordering mechanism works correctly
          under sustained traffic with data dependencies.
      - q: Why does memory ordering matter for NoC transactions?
        a: >
          Without ordering guarantees, a read issued after a write might return stale
          data because the write hasn't reached its destination yet. Transaction IDs
          let the programmer specify which prior writes must complete before a
          subsequent read is allowed to execute.

tags:
  read:
    faq:
      - q: What is a NoC read (noc_async_read)?
        a: >
          A NoC read is a pull operation — the initiating core sends a read request
          to a remote location, and the data is returned via the NoC to the requester's
          L1. The core must issue noc_async_read_barrier to wait for the data to arrive.
      - q: How does read latency differ from write latency?
        a: >
          Reads require a round trip (request out, data back), so they inherently have
          higher latency than writes, which are posted (one-way). For bandwidth-bound
          workloads this matters less, but for latency-sensitive operations reads are
          typically the slower path.

  write:
    faq:
      - q: What is a NoC write (noc_async_write)?
        a: >
          A NoC write is a push operation — the initiating core sends data from its L1
          to a remote destination. Writes are "posted," meaning the sender doesn't wait
          for an acknowledgment. The sender must issue noc_async_write_barrier to ensure
          all writes have left the local output buffer.
      - q: When should I use writes vs reads for data movement?
        a: >
          Use writes when the data source knows where data should go (producer-push).
          Use reads when the data consumer knows what it needs (consumer-pull). Writes
          have lower latency per transaction but the sender must know all destinations.

  unicast:
    faq:
      - q: What is a unicast NoC transaction?
        a: >
          A unicast transaction targets a single destination — one specific (x, y) core
          coordinate. This is the most common transaction type and is used for
          point-to-point data transfers between cores or between cores and DRAM.
      - q: How does unicast bandwidth scale with hop count?
        a: >
          For a single transaction, bandwidth is roughly constant regardless of hop
          count because the NoC is pipelined. However, latency increases with hops,
          which reduces throughput when the sender must wait for completions (e.g. reads)
          before issuing the next transaction.

  multicast:
    faq:
      - q: What is a multicast NoC transaction?
        a: >
          A multicast transaction delivers the same data to a rectangular grid of
          destination cores using a single NoC packet. The hardware replicates the
          packet at each router, making it much more efficient than sending individual
          unicast packets to each destination.
      - q: When is multicast used in real workloads?
        a: >
          Multicast is used whenever one core needs to distribute the same data to
          many cores — for example, broadcasting input activations in matmul, or
          distributing weight tiles to a row or column of compute cores.

  L1:
    faq:
      - q: What is L1 memory in the context of data movement?
        a: >
          L1 is the local SRAM on each Tensix core (~1.5 MB on Wormhole, ~1.5 MB on
          Blackhole). NoC transactions can read from or write to any core's L1,
          making the aggregate L1 across all cores a large distributed scratchpad.
      - q: What are the advantages of L1 over DRAM for data movement?
        a: >
          L1 has much lower access latency (no DRAM controller overhead) and higher
          bandwidth per bank. However, total L1 capacity is limited, so large tensors
          must be stored in DRAM and streamed through L1 in tiles.

  DRAM:
    faq:
      - q: How does DRAM access work through the NoC?
        a: >
          DRAM banks are connected to the NoC via DRAM controller cores at fixed
          positions on the chip. A Tensix core accesses DRAM by sending NoC
          read/write transactions to those controller coordinates. The DRAM controller
          translates the NoC request into DDR commands.
      - q: What is the difference between sharded and interleaved DRAM access?
        a: >
          Sharded access assigns each core a contiguous region of DRAM, minimizing
          cross-traffic but potentially causing bank hotspots. Interleaved access
          stripes pages round-robin across all banks, spreading load evenly but
          requiring each core to access multiple DRAM controllers.

  single_core:
    faq:
      - q: Why test with a single core?
        a: >
          Single-core tests isolate the baseline NoC and memory performance without
          contention. They establish the per-core bandwidth and latency ceiling that
          multi-core tests can then be compared against to quantify contention effects.

  multi_core:
    faq:
      - q: Why test with multiple cores?
        a: >
          Multi-core tests reveal how bandwidth scales and how contention affects
          performance when many cores access the NoC simultaneously. Real workloads
          always use many cores, so these tests reflect production conditions.
      - q: How should I compare single-core vs multi-core results?
        a: >
          Divide the multi-core aggregate bandwidth by the number of cores to get
          per-core bandwidth, then compare against the single-core baseline. The
          ratio tells you the scaling efficiency — 1.0 means perfect linear scaling,
          lower values indicate contention.

  virtual_channels:
    faq:
      - q: What are virtual channels (VCs)?
        a: >
          Virtual channels are independent logical lanes multiplexed on the same
          physical NoC link. Each VC has its own buffer, so a blocked packet on one
          VC doesn't stall packets on other VCs. This prevents head-of-line blocking
          and deadlocks in the routing network.
      - q: How do I choose which virtual channel to use?
        a: >
          In most cases the default VC assignment is correct. Custom VC selection is
          useful when you need to separate latency-critical control traffic from
          bulk data traffic, or when routing constraints require specific VC
          assignments to avoid deadlock.

  atomics:
    faq:
      - q: What are NoC atomic operations?
        a: >
          Atomic operations (e.g. semaphore increment) perform a read-modify-write
          on a remote L1 address in a single NoC transaction, without the remote core
          needing to participate. They are used for synchronization — signaling that
          a data transfer is complete or that a buffer is available.
      - q: How do atomics affect data movement performance?
        a: >
          Atomics are small (typically 4 bytes) but latency-sensitive because the
          initiator must wait for the operation to complete at the remote core. In
          data movement pipelines, atomic semaphore overhead can become the bottleneck
          if tiles are very small or if many synchronization points are required.

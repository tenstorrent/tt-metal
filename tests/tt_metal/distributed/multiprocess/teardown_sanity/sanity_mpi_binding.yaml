# 3 local ranks for launching the raw C++ probe (sanity_mpi_probe) through tt-run. The probe does not use the mesh
# fields; tt-run only needs a rank binding to start the ranks. Used by the tt-run MPI sanity rows.
rank_bindings:
  - rank: 0
    mesh_id: 0
  - rank: 1
    mesh_id: 0
  - rank: 2
    mesh_id: 0
mesh_graph_desc_path: "tt_metal/fabric/mesh_graph_descriptors/dual_galaxy_mesh_graph_descriptor.textproto"

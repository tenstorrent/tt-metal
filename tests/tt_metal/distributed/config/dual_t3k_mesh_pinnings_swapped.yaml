# --mesh-pinning-file for the dual T3K CI mock
# (tt_metal/third_party/tt-cluster-descriptors/wormhole/dual_t3k_ci/dual_t3k_ci_cluster_desc_mapping.yaml)
# with tests/tt_metal/tt_fabric/custom_mesh_descriptors/dual_t3k_mesh_graph_descriptor.textproto.
# A mock rank's hostname is its cluster descriptor's cluster_id (f10cs03 / f10cs04 here), the same string the
# factory system descriptor uses. The unpinned Phase 1 placement puts mesh 0 on f10cs04 and mesh 1 on
# f10cs03; this file pins the reverse, so a run that ignored the pins is caught by
# MultiHost.MeshPinningFileHonored.
mesh_host_rank_pinnings:
  - mesh_id: 0
    mesh_host_rank: 0
    hostname: f10cs03
    TT_VISIBLE_DEVICES: "0,1,2,3"
  - mesh_id: 1
    mesh_host_rank: 0
    hostname: f10cs04
    TT_VISIBLE_DEVICES: "0,1,2,3"

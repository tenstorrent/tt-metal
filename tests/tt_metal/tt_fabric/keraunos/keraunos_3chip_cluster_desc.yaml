# Three Keraunos test chips on one emulated mmk package, a line A - M - B over the two SerDes cross-tile loopbacks:
# HSIO tile 0 (chip A, channel 0 = core 4-0) to HSIO tile 1 (chip M, channel 0 = core 4-1), and HSIO tile 2 (chip M,
# channel 1 = core 4-2) to HSIO tile 3 (chip B, channel 0 = core 4-3), CCE0 on every end. Channels index each chip's
# own SoC descriptor eth list (keraunos_3chip_{a,m,b}_soc_desc.yaml).
arch:
  0: quasar
  1: quasar
  2: quasar
chips:
  {}
# Ids carry UMD's mock Quasar board UPI (0x50) in bits 36 and up.
chip_unique_ids:
  0: 5497558138880
  1: 5497558138881
  2: 5497558138882
ethernet_connections:
  - [{chip: 0, chan: 0}, {chip: 1, chan: 0}]
  - [{chip: 1, chan: 1}, {chip: 2, chan: 0}]
ethernet_connections_to_remote_devices:
  []
chips_with_mmio:
  - 0: 0
  - 1: 1
  - 2: 2
harvesting:
  0:
    noc_translation: false
    harvest_mask: 0
  1:
    noc_translation: false
    harvest_mask: 0
  2:
    noc_translation: false
    harvest_mask: 0
chip_to_boardtype:
  0: quasar
  1: quasar
  2: quasar
# One Quasar board (one package, one chip) per test chip; the links between them are external connections.
boards:
  -
    - board_id: 5497558138880
    - board_type: quasar
    - chips:
        - 0
  -
    - board_id: 5497558138881
    - board_type: quasar
    - chips:
        - 1
  -
    - board_id: 5497558138882
    - board_type: quasar
    - chips:
        - 2
asic_locations:
  0: 0
  1: 0
  2: 0

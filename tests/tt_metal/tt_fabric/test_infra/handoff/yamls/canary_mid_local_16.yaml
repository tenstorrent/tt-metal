# Verifier canary on the local path: run with TT_FABRIC_TEST_CORRUPT_PAYLOAD=1; must fail with DATA_MISMATCH. With one
# config per receiver core, a 16 B payload's ring has 65536+ slots, too many for the SFPU path's data CB.
Tests:
  - name: "CanaryMidLocal16"
    enable_flow_control: true
    fabric_setup:
      topology: Linear
    parametrization_params:
      ntype: [unicast_write]
      size: [16]
    defaults:
      ftype: unicast
      num_packets: 100
    patterns:
      - type: all_to_all

# Verifier canary: run with TT_FABRIC_TEST_CORRUPT_PAYLOAD=2 or 3; must fail with DATA_MISMATCH.
Tests:
  - name: "CanaryTailScatter80"
    enable_flow_control: true
    fabric_setup:
      topology: Linear
    parametrization_params:
      ntype: [{type: unicast_scatter_write, chunks: 2}]
      size: [80]
    defaults:
      ftype: unicast
      num_packets: 100
    patterns:
      - type: all_to_all

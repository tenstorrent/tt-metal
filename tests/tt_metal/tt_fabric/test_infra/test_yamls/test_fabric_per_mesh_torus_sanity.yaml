# Multi-mesh sanity for an MGD that declares DIFFERENT per-mesh torus axes (e.g. a TORUS_Y mesh connected
# to a TORUS_X mesh). The fabric is opened as a TORUS_XY envelope so deadlock-avoidance / bubble-flow-control
# cover BOTH axes -- which protects each mesh's own genuine ring (the TORUS_Y mesh's Y-ring and the TORUS_X
# mesh's X-ring) -- while the MGD's per-mesh fabric_config fields keep each mesh's connectivity to its own
# single wrap. Intra- and inter-mesh neighbor exchange; checks the fabric does not hang/starve.

Tests:

  - name: "PerMeshTorusNeighborExchangeIntra"
    fabric_setup:
      topology: Torus
      torus_config: XY

    parametrization_params:
      ntype: [unicast_write, atomic_inc, fused_atomic_inc, unicast_scatter_write]
      num_links: [1, 2]

    defaults:
      ftype: unicast
      size: 32
      num_packets: 30000

    patterns:
      - type: neighbor_exchange
        mesh_scope: intra_mesh

  - name: "PerMeshTorusNeighborExchangeInter"
    fabric_setup:
      topology: Torus
      torus_config: XY

    parametrization_params:
      ntype: [unicast_write, atomic_inc, fused_atomic_inc, unicast_scatter_write]
      num_links: [1, 2]

    defaults:
      ftype: unicast
      size: 32
      num_packets: 30000

    patterns:
      - type: neighbor_exchange
        mesh_scope: inter_mesh

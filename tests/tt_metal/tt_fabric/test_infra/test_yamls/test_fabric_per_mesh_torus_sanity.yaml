# Per-mesh heterogeneous-config sanity (torus). Companion to the MGDs under
# custom_mesh_descriptors/single_galaxy_*per_mesh*; each of those declares a DIFFERENT fabric_config per
# mesh (TORUS_XY / TORUS_X / TORUS_Y / FABRIC_2D), so the config is applied AT MGD LEVEL and each process
# adopts its own (ControlPlane::adopt_local_mesh_fabric_config).
#
# This config opens the test harness as `topology: Torus` -- which is REQUIRED for a torus fabric:
# test_tt_fabric derives the packet routing style from THIS topology field (is_torus_2d_unicast,
# tt_fabric_test_device_setup.cpp:482), NOT from the MGD. Using `topology: Mesh` on a torus MGD routes
# packets mesh-style into the torus and deadlocks on the wrap edge -- so the generic
# test_fabric_multi_mesh_sanity_common.yaml (whose leading cases are topology: Mesh) HANGS on these MGDs by
# construction. `sync: false` avoids the global-sync setup picking a wrap direction that does not exist on
# every node of a heterogeneous+host-split topology (TestDevice::register_fabric_connection); the
# neighbor_exchange pattern still validates received data (0 failed == correct intra- and inter-mesh traffic).
Tests:
  - name: "PerMeshTorusNeighborExchangeIntra"
    sync: false
    fabric_setup:
      topology: Torus
      torus_config: XY
    parametrization_params:
      ntype: [unicast_write]
      num_links: [1]
    defaults:
      ftype: unicast
      size: 32
      num_packets: 10000
    patterns:
      - type: neighbor_exchange
        mesh_scope: intra_mesh
  - name: "PerMeshTorusNeighborExchangeInter"
    sync: false
    fabric_setup:
      topology: Torus
      torus_config: XY
    parametrization_params:
      ntype: [unicast_write]
      num_links: [1]
    defaults:
      ftype: unicast
      size: 32
      num_packets: 10000
    patterns:
      - type: neighbor_exchange
        mesh_scope: inter_mesh

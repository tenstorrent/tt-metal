# Per-mesh heterogeneous-config sanity (torus). Companion to custom_mesh_descriptors/single_galaxy_*per_mesh*,
# each declaring a DIFFERENT fabric_config per mesh (TORUS_XY / TORUS_X / TORUS_Y / FABRIC_2D) at MGD level.
# topology: Torus is REQUIRED: test_tt_fabric derives the packet routing style from it (is_torus_2d_unicast);
# topology: Mesh would route mesh-style into the torus and deadlock on the wrap edge.
Tests:
  - name: "PerMeshTorusNeighborExchangeIntra"
    sync: true
    fabric_setup:
      topology: Torus
      torus_config: XY
    parametrization_params:
      ntype: [unicast_write]
      num_links: [1]
    defaults:
      ftype: unicast
      size: 32
      num_packets: 10000
    patterns:
      - type: neighbor_exchange
        mesh_scope: intra_mesh
  - name: "PerMeshTorusNeighborExchangeInter"
    sync: true
    fabric_setup:
      topology: Torus
      torus_config: XY
    parametrization_params:
      ntype: [unicast_write]
      num_links: [1]
    defaults:
      ftype: unicast
      size: 32
      num_packets: 10000
    patterns:
      - type: neighbor_exchange
        mesh_scope: inter_mesh

#
# Single BH galaxy 2x2 inter-mesh torus repro for #56298 -- Z-routed variant.
# Four 2x2 RING/LINE stages (mesh_id 0..3) occupy half of one 32-ASIC BH galaxy,
# ring-connected (mesh 3 -> mesh 0 loops back) with the inter-mesh links forced
# onto the Z routers (assign_z_direction). Every mesh opens with the SAME fabric
# config; for each torus topology (X, Y, XY) the InterMesh group drives routing
# across the Z inter-mesh links -- which under the fix never enable deadlock
# avoidance, whichever direction -- and the IntraMesh group is the control
# (intra-mesh routing is untouched). Checks the torus fabric does not hang/starve.
#
# Galaxy-only: pairs 1:1 with the 2x2 Z MGD below (each stage is a 2x2 mesh:
# device_topology { dims: [2, 2] }). Wired as galaxy-fabric-2x2-torus-z in
# tests/pipeline_reorg/galaxy_e2e_tests.yaml. Non-Z counterpart:
# test_galaxy_fabric_2x2_torus_nonz.yaml.
#
#   ./tools/scaleout/exabox/run_fabric_tests.sh --hosts <one BH galaxy> --image none --mpi-if none \
#     --mesh-graph-desc-path tests/tt_metal/tt_fabric/custom_mesh_descriptors/single_galaxy_2x2_z_ring_4stage_ring_mesh_graph_descriptor.textproto \
#     --test-config tests/tt_metal/tt_fabric/test_infra/test_yamls/test_galaxy_fabric_2x2_torus_z.yaml \
#     --filter name.Torus

Tests:

  - name: "TorusXInterMeshNeighborExchange"
    sync: true
    enable_flow_control: true
    fabric_setup:
      topology: Torus
      torus_config: X
    parametrization_params:
      ntype: [unicast_write, atomic_inc, fused_atomic_inc, unicast_scatter_write]
      num_links: [1, 2]
    defaults:
      ftype: unicast
      size: 32
      num_packets: 30000
    patterns:
      - type: neighbor_exchange
        mesh_scope: inter_mesh

  - name: "TorusXIntraMeshNeighborExchange"
    sync: true
    enable_flow_control: true
    fabric_setup:
      topology: Torus
      torus_config: X

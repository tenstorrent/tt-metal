# One BH Galaxy as two 4x4 meshes, its top and bottom tray halves, with only the X axis wrapped
# (dim_types [LINE, RING]): the layout of the 4x4 prefill stages. Checks intra-mesh traffic on the
# X ring and Y line, and traffic across the Z seam between the halves.
#
# Launch (2 ranks on one host; add --oversubscribe where the allocation gives a single slot):
#   python models/demos/deepseek_v3_d_p/utils/gen_pipeline_binding.py --layout 4x4
#   TT_METAL_FABRIC_ROUTER_SYNC_TIMEOUT_MS=1000000 tt-run \
#     --rank-binding models/demos/common/prefill/runners/topology_configuration/pipeline_prefill_request_intragalaxy_2rank_4x4_sp1.$(hostname).yaml \
#     --mpi-args "--host $(hostname -s):2 --map-by slot --bind-to none -x TT_METAL_FABRIC_ROUTER_SYNC_TIMEOUT_MS" \
#     -- build/test/tt_metal/tt_fabric/test_infra/test_tt_fabric --test_config <this file>

Tests:

  - name: "TorusXMeshNeighborExchange"
    sync: true
    fabric_setup:
      topology: Torus
      torus_config: X

    parametrization_params:
      ntype: [unicast_write, atomic_inc]
      num_links: [1, 2]

    defaults:
      ftype: unicast
      size: 1024
      num_packets: 1000

    patterns:
      - type: neighbor_exchange

  - name: "TorusXAllToAllIntra"
    sync: true
    fabric_setup:
      topology: Torus
      torus_config: X

    parametrization_params:
      ntype: [unicast_write, atomic_inc]
      num_links: [1, 2]
      size: [1024, 4096]

    defaults:
      ftype: unicast
      num_packets: 100

    patterns:
      - type: all_to_all
        mesh_scope: intra_mesh

  - name: "TorusXAllToAllInter"
    sync: true
    fabric_setup:
      topology: Torus
      torus_config: X

    parametrization_params:
      ntype: [unicast_write, atomic_inc]
      num_links: [1, 2]
      size: [1024, 4096]

    defaults:
      ftype: unicast
      num_packets: 100

    patterns:
      - type: all_to_all
        mesh_scope: inter_mesh

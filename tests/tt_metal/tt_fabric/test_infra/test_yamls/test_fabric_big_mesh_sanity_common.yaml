# Shared big-mesh CI sanity suite (system-agnostic).
# Single mesh id spanning one or more hosts; cross-host traffic is still intra-mesh,
# so both 1D (Linear) and 2D (Mesh) topologies are valid.
# High-level patterns only; system selection is via tt-run rank binding / mesh graph descriptor.
Tests:
  - name: "LinearNeighborExchange"
    sync: true
    fabric_setup:
      topology: Linear

    parametrization_params:
      ntype: [unicast_write, atomic_inc, fused_atomic_inc, unicast_scatter_write]
      num_links: all

    defaults:
      ftype: unicast
      size: 1024
      num_packets: 100

    patterns:
      - type: neighbor_exchange

  - name: "MeshNeighborExchange"
    sync: true
    fabric_setup:
      topology: Mesh

    parametrization_params:
      ntype: [unicast_write, atomic_inc, fused_atomic_inc, unicast_scatter_write]
      num_links: all

    defaults:
      ftype: unicast
      size: 1024
      num_packets: 100

    patterns:
      - type: neighbor_exchange

  - name: "FlowControlLinear"
    enable_flow_control: true
    fabric_setup:
      topology: Linear

    parametrization_params:
      ftype: [unicast, mcast]
      ntype: [unicast_write, atomic_inc, fused_atomic_inc, unicast_scatter_write]
      num_links: all
      size: [1024, 2048, 4096]

    defaults:
      num_packets: 10000

    patterns:
      - type: all_to_all

  - name: "FlowControlMesh"
    enable_flow_control: true
    fabric_setup:
      topology: Mesh

    parametrization_params:
      ftype: [unicast, mcast]
      ntype: [unicast_write, atomic_inc, fused_atomic_inc, unicast_scatter_write]
      num_links: all
      size: [1024, 2048, 4096]

    defaults:
      num_packets: 10000

    patterns:
      - type: all_to_all

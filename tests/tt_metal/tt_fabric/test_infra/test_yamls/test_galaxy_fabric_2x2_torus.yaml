#
# Single BH galaxy 2x2 inter-mesh torus repro for #56298. Four 2x2 RING/LINE
# stages (mesh_id 0..3, each stage a 2x2 mesh -- device_topology { dims: [2, 2] })
# occupy half of one 32-ASIC BH galaxy, ring-connected (mesh 3 -> mesh 0 loops
# back). Every mesh opens with the SAME fabric config; for each torus topology
# (X, Y, XY) the InterMesh group drives routing across the inter-mesh links --
# which under the fix never enable deadlock avoidance, whichever direction -- and
# the IntraMesh group is the control (intra-mesh routing is untouched). Checks the
# torus fabric does not hang/starve.
#
# This ONE config is run against BOTH 2x2 4-stage-ring MGDs, wired in
# tests/pipeline_reorg/galaxy_e2e_tests.yaml:
#   - galaxy-fabric-2x2-torus-z    -> single_galaxy_2x2_z_ring_4stage_ring_mesh_graph_descriptor.textproto
#                                     (inter-mesh links forced onto Z, assign_z_direction)
#   - galaxy-fabric-2x2-torus-nonz -> single_galaxy_2x2_ring_4stage_ring_mesh_graph_descriptor.textproto
#                                     (inter-mesh links over the normal N/S/E/W routers)
# so the same torus X/Y/XY neighbor-exchange coverage runs with inter-mesh links
# on Z and on N/S/E/W. Galaxy-only.
#
#   ./tools/scaleout/exabox/run_fabric_tests.sh --hosts <one BH galaxy> --image none --mpi-if none \
#     --mesh-graph-desc-path tests/tt_metal/tt_fabric/custom_mesh_descriptors/single_galaxy_2x2_z_ring_4stage_ring_mesh_graph_descriptor.textproto \
#     --test-config tests/tt_metal/tt_fabric/test_infra/test_yamls/test_galaxy_fabric_2x2_torus.yaml \
#     --filter name.Torus
#   (swap the MGD for single_galaxy_2x2_ring_4stage_ring_... for the non-Z variant)

Tests:

  - name: "TorusXInterMeshNeighborExchange"
    sync: true
    enable_flow_control: true
    fabric_setup:
      topology: Torus
      torus_config: X
    parametrization_params:
      ntype: [unicast_write, atomic_inc, fused_atomic_inc, unicast_scatter_write]
      num_links: [1, 2]
    defaults:
      ftype: unicast
      size: 32
      num_packets: 30000
    patterns:
      - type: neighbor_exchange
        mesh_scope: inter_mesh

  - name: "TorusXIntraMeshNeighborExchange"
    sync: true
    enable_flow_control: true
    fabric_setup:
      topology: Torus
      torus_config: X
    parametrization_params:

# Per-mesh heterogeneous fabric config (#60499/#60690), consolidated coverage.
#
# Every group uses `topology: FromMgd`, which hands FabricConfig::MGD_DEFAULT to SetFabricConfig: each process's
# control plane resolves the fabric config from its own mesh's dim_types (TORUS_X / TORUS_Y / TORUS_XY / FABRIC_2D),
# and the test infra fills in the resolved concrete topology for its traffic logic. One yaml therefore works for any
# per-mesh MGD on single-galaxy or multihost -- no CLI flag, no per-scenario topology.
#
# Deduped matrix (the MGD picks the torus axis, so the old explicit TORUS_XY/X/Y variants collapsed into duplicates;
# what actually differs is pattern x scope x ftype). Multicast cannot cross mesh boundaries, so there is no
# mcast inter-mesh case (it would generate no traffic):
#   unicast  neighbor_exchange  intra_mesh
#   unicast  neighbor_exchange  inter_mesh
#   unicast  all_to_all         intra_mesh
#   unicast  all_to_all         inter_mesh
#   mcast    all_to_all         intra_mesh

Tests:

  - name: "MgdDefaultNeighborExchangeIntra"
    fabric_setup:
      topology: FromMgd

    parametrization_params:
      ntype: [unicast_write, atomic_inc, fused_atomic_inc, unicast_scatter_write]
      num_links: [1, 2]

    defaults:
      ftype: unicast
      size: 32
      num_packets: 30000

    patterns:
      - type: neighbor_exchange
        mesh_scope: intra_mesh

  - name: "MgdDefaultNeighborExchangeInter"
    fabric_setup:
      topology: FromMgd

    parametrization_params:
      ntype: [unicast_write, atomic_inc, fused_atomic_inc, unicast_scatter_write]
      num_links: [1, 2]

    defaults:
      ftype: unicast
      size: 32
      num_packets: 30000

    patterns:
      - type: neighbor_exchange
        mesh_scope: inter_mesh

  - name: "MgdDefaultAllToAllIntra"
    sync: true
    fabric_setup:
      topology: FromMgd

    parametrization_params:
      ntype: [unicast_write, atomic_inc, fused_atomic_inc, unicast_scatter_write]
      num_links: [1, 2]
      size: [1024, 2048, 4096]

    defaults:
      ftype: unicast
      num_packets: 100

    patterns:
      - type: all_to_all
        mesh_scope: intra_mesh

  - name: "MgdDefaultAllToAllInter"
    sync: true
    fabric_setup:
      topology: FromMgd

    parametrization_params:
      ntype: [unicast_write, atomic_inc, fused_atomic_inc, unicast_scatter_write]
      num_links: [1, 2]
      size: [1024, 2048, 4096]

    defaults:
      ftype: unicast
      num_packets: 100

    patterns:
      - type: all_to_all
        mesh_scope: inter_mesh

  - name: "MgdDefaultMulticastAllToAllIntra"
    sync: true
    enable_flow_control: true
    fabric_setup:
      topology: FromMgd

    parametrization_params:
      ntype: [unicast_write, atomic_inc, fused_atomic_inc, unicast_scatter_write]
      num_links: [1, 2]
      size: [1024, 2048, 4096]

    defaults:
      ftype: mcast
      num_packets: 100

    patterns:
      - type: all_to_all
        mesh_scope: intra_mesh

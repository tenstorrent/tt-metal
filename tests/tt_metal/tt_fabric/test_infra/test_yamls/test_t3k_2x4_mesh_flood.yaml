#
# Single-mesh occupancy bring-up on a Wormhole LoudBox / T3K (default 2x4).
# No tt-run, no custom MGD.
#
# Do not set skip_packet_validation: that compiles BENCHMARK_MODE, which skips
# L1 progress writes, so --show-progress-detail reports 0 packets and false hangs.
# Do not set enable_flow_control: worker credits throttle inject and keep fabric
# buffers from filling.
# sync is off so data inject is not gated on line-sync.
#
# CornerCycle is the occupancy-shaped pattern: bidirectional multi-hop across
# the 2x4 corners (0↔7 and 3↔4). Packets should start moving; a true circular
# wait would then freeze the counters. Intra-mesh DOR may still drain this.
#
# Launch:
#   ./build/test/tt_metal/tt_fabric/test_infra/test_tt_fabric \
#     --test_config tests/tt_metal/tt_fabric/test_infra/test_yamls/test_t3k_2x4_mesh_flood.yaml \
#     --filter name.AllToOneHotspot \
#     --show-progress-detail --hung-threshold 30 --wait-on-hang

Tests:
  - name: SimpleUnicast
    fabric_setup:
      topology: Mesh
    senders:
      - device: [0, 0]
        patterns:
          - ftype: unicast
            ntype: unicast_write
            size: 1024
            num_packets: 100
            destination:
              device: [0, 1]

  - name: CornerCycle
    skip_packet_validation: false
    fabric_setup:
      topology: Mesh
    defaults:
      ftype: unicast
      ntype: unicast_write
      size: 4096
      num_packets: 20000
    senders:
      - device: [0, 0]
        patterns:
          - destination:
              device: [0, 7]
      - device: [0, 7]
        patterns:
          - destination:
              device: [0, 0]
      - device: [0, 3]
        patterns:
          - destination:
              device: [0, 4]
      - device: [0, 4]
        patterns:
          - destination:
              device: [0, 3]

  - name: MeshFlood
    skip_packet_validation: false
    fabric_setup:
      topology: Mesh
    defaults:
      ftype: unicast
      ntype: unicast_write
      size: 4096
      num_packets: 20000
    patterns:
      - type: all_to_all

  # ERISC backpressure: last-hop fabric writes dest Tensix L1 and frees the
  # slot even if that kernel is stalled, so CornerCycle drained the rings after
  # senders finished. This keeps 7 chips injecting into chip 0 so the incoming
  # ERISCs on 0:0 (and the hops toward it) stay occupied. Capture with
  # --wait-on-hang while senders are still running, not after they complete.
  # In the viewer look at receiver rings and forwarding senders (from N/E/S/W),
  # not sender.0 local-worker. Full = occupied == depth / free_slots == 0.
  - name: AllToOneHotspot
    skip_packet_validation: false
    fabric_setup:
      topology: Mesh
      num_links: 1
    defaults:
      ftype: unicast
      ntype: unicast_write
      size: 4096
      num_packets: 2000000
    senders:
      - device: [0, 1]
        patterns:
          - destination:
              device: [0, 0]
      - device: [0, 2]
        patterns:
          - destination:
              device: [0, 0]
      - device: [0, 3]
        patterns:
          - destination:
              device: [0, 0]
      - device: [0, 4]
        patterns:
          - destination:
              device: [0, 0]
      - device: [0, 5]
        patterns:
          - destination:
              device: [0, 0]
      - device: [0, 6]
        patterns:
          - destination:
              device: [0, 0]
      - device: [0, 7]
        patterns:
          - destination:
              device: [0, 0]

  # True circular dependency: everyone forwards around the perimeter ring at
  # once (0->1->2->3->7->6->5->4->0), each holding buffers while waiting for
  # the next chip. Mesh DOR can't do this (acyclic routing), so this uses
  # topology Ring. Bubble FC auto-enables on Ring and keeps one bubble free,
  # so expect sustained backpressure (high occupied, torn captures, inject
  # stalled) rather than a frozen deadlock. Capture while 0/14 done.
  - name: RingCycle
    skip_packet_validation: false
    sync: true
    fabric_setup:
      topology: Ring
      num_links: 1
    defaults:
      ftype: unicast
      ntype: unicast_write
      size: 4096
      num_packets: 500000
    patterns:
      - type: full_ring

  # Heavier circle: mcast has to hold each packet until ALL downstream
  # branches accept it, so one slow branch parks the upstream buffer much
  # longer than unicast. Same ring, same bubble, but far more likely to catch
  # occupied > 0 / torn while 0/N done. If this still passes, bubble is simply
  # winning and true stuck-full needs a manually stalled ERISC, not traffic.
  - name: RingMcastFlood
    skip_packet_validation: false
    sync: true
    fabric_setup:
      topology: Ring
      num_links: max
    defaults:
      ftype: mcast
      ntype: unicast_write
      size: 4096
      num_packets: 200000
    patterns:
      - type: full_ring

  # Bubble-defeat circle: bubble FC only protects VC0 (vc==0). VC2 has no
  # bubble, so a Ring full_ring on VC2 is the one traffic pattern that can
  # truly deadlock with all buffers held. Requires TT_METAL_ENABLE_FABRIC_VC2=1.
  # If this hangs with occupied==depth, that's your stuck-full photo.
  - name: RingVC2Deadlock
    skip_packet_validation: false
    sync: true
    fabric_setup:
      topology: Ring
      num_links: 1
      use_vc2: true
    defaults:
      ftype: unicast
      ntype: unicast_write
      size: 4096
      num_packets: 500000
      vc_id: 2
    patterns:
      - type: full_ring

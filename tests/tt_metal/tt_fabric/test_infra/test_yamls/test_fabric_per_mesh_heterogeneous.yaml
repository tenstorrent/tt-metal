# Per-mesh heterogeneous fabric config (#60499/#60690).
#
# Every group uses `topology: FromMgd`, a test-infra marker that hands FabricConfig::MGD_DEFAULT to the control
# plane, which resolves each process's config from its OWN mesh's dim_types (TORUS_X / TORUS_Y / TORUS_XY /
# FABRIC_2D). Dedicated yaml (kept out of the shared sanity/express yamls, so the suites that run those unfiltered
# are unaffected). One filter -- name.HeterogeneousFabric* -- selects every group below.
#
# NOTE: each traffic pattern is its OWN group on purpose. Combining neighbor_exchange + all_to_all (intra + inter)
# into a single group's workload deadlocks at traffic execution; isolated per-pattern groups do not. Deduped
# matrix (the MGD picks the torus axis, so per-axis variants would be duplicates):
#   unicast  neighbor_exchange  intra_mesh
#   unicast  neighbor_exchange  inter_mesh
#   unicast  all_to_all         intra_mesh
#   unicast  all_to_all         inter_mesh
#   mcast    all_to_all         intra_mesh   (multicast cannot cross mesh boundaries -> no inter-mesh case)

Tests:

  - name: "HeterogeneousFabricNeighborExchangeIntra"
    fabric_setup:
      topology: FromMgd

    parametrization_params:
      ntype: [unicast_write, atomic_inc, fused_atomic_inc, unicast_scatter_write]
      num_links: [1, 2]

    defaults:
      ftype: unicast
      size: 32
      num_packets: 30000

    patterns:
      - type: neighbor_exchange
        mesh_scope: intra_mesh

  - name: "HeterogeneousFabricNeighborExchangeInter"
    fabric_setup:
      topology: FromMgd

    parametrization_params:
      ntype: [unicast_write, atomic_inc, fused_atomic_inc, unicast_scatter_write]
      num_links: [1, 2]

    defaults:
      ftype: unicast
      size: 32
      num_packets: 30000

    patterns:
      - type: neighbor_exchange
        mesh_scope: inter_mesh

  - name: "HeterogeneousFabricAllToAllIntra"
    sync: true
    fabric_setup:
      topology: FromMgd

    parametrization_params:
      ntype: [unicast_write, atomic_inc, fused_atomic_inc, unicast_scatter_write]
      num_links: [1, 2]
      size: [1024, 2048, 4096]

    defaults:
      ftype: unicast
      num_packets: 100

    patterns:
      - type: all_to_all
        mesh_scope: intra_mesh

  - name: "HeterogeneousFabricAllToAllInter"
    sync: true
    fabric_setup:
      topology: FromMgd

    parametrization_params:
      ntype: [unicast_write, atomic_inc, fused_atomic_inc, unicast_scatter_write]
      num_links: [1, 2]
      size: [1024, 2048, 4096]

    defaults:
      ftype: unicast
      num_packets: 100

    patterns:
      - type: all_to_all
        mesh_scope: inter_mesh

  - name: "HeterogeneousFabricMulticastAllToAllIntra"
    sync: true
    enable_flow_control: true
    fabric_setup:
      topology: FromMgd

    parametrization_params:
      ntype: [unicast_write, atomic_inc, fused_atomic_inc, unicast_scatter_write]
      num_links: [1, 2]
      size: [1024, 2048, 4096]

    defaults:
      ftype: mcast
      num_packets: 100

    patterns:
      - type: all_to_all
        mesh_scope: intra_mesh

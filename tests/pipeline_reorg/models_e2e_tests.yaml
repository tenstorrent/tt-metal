- name: Demo Test with Perf Metrics (DeepSeek V3 B1 Supercluster 4 aka Superpod 1)
  cmd: |
    MGD="${TT_METAL_HOME}/models/demos/deepseek_v3_b1/scaleout_configs/blitz_decode_single_pod_mesh_graph_descriptor.textproto"
    mkdir -p "${PIPELINE_DIR}/ranklogs" "${TTRUN_CWD}"
    RESOLVED_HOSTS=$(awk 'NF {printf "%s,", $1}' /etc/ttop/hostfile | sed 's/,$//')
    test -f "${TTRUN_PY}" || { echo "ERROR: missing ${TTRUN_PY}"; exit 1; }
    test -f "${MGD}" || { echo "ERROR: missing ${MGD}"; exit 1; }

    cd "${TTRUN_CWD}"
    TT_METAL_ALLOCATOR_MODE_HYBRID=1 TT_METAL_SLOW_DISPATCH_MODE=1 python3 "${TTRUN_PY}" \
      --skip-executable-check \
      --tcp-interface ens5f0np0 \
      --mesh-graph-descriptor "${MGD}" \
      --hosts "${RESOLVED_HOSTS}" \
      --mpi-args "--bind-to none --tag-output --wdir ${TT_METAL_HOME} --output-filename ${PIPELINE_DIR}/ranklogs" \
      -- \
      python3 -m models.demos.deepseek_v3_b1.demo.cli \
        --max-new-tokens 4096 \
        --no-stop-at-eos \
        --weights real \
        --cache-path /mnt/models/deepseek-ai/cache-2026-03-22 \
        --prompt "Solve this step by step: Design a cache for sharded LLM weights across multiple hosts with local NVMe and shared NFS. Minimize startup latency, avoid duplicate reads, support cache invalidation, and explain tradeoffs between per-host caches, content-addressable storage, and pre-sharded artifacts." \
        --model-path /mnt/models/deepseek-ai/DeepSeek-R1-0528-dequantized/DeepSeek-R1-dequantized \
      > "${PIPELINE_DIR}/launch.log" 2>&1
  model: deepseek-v3-b1
  model_family: DeepSeek
  skus:
    bh_sc4:
      timeout: 30
      tier: 1
      release_ready: true
  owner_id: U08E1JCMAJF
  team: scaleout


# PIPELINE_DIR / TTRUN_CWD / TTRUN_PY come from models-e2e-tests-multihost-impl.yaml.
#
# Same automapper pattern as WAN SC4: --mesh-graph-descriptor + --hosts from
# /etc/ttop/hostfile. SC4 uses the single-pod blitz MGD (not superpod).


# This file defines the test matrix for the Models End-To-End Tests pipelines.
#
# Each entry represents a parallel job with the following keys:
#   name: The display name for the job in GitHub Actions.
#   cmd: The exact command to run (env vars must be inlined).
#   model: Model identifier for filtering (workflow_dispatch model selection).
#   model_family: (optional) Human-facing model family for grouping/reporting (e.g. Llama, Qwen, Gemma). Omit when a test spans multiple families.
#   skus: A mapping of SKU names to their configuration:
#     timeout: Job timeout in minutes.
#     tier: Model tier (1, 2, or 3) used to filter which pipeline runs this test.
#     release_ready: Whether this SKU leg is included in package-and-release (default false).
#   owner_id: The Slack user ID to notify on failure.
#   team: The team that owns the test.

# For max allowed timeout refer to .github/time_budget.yaml

# ── Llama ──────────────────────────────────────────────────────────

- name: Qwen3.6-27B e2e tests
  cmd: |
    export HF_HOME=/mnt/MLPerf/huggingface HF_MODEL=Qwen/Qwen3.6-27B TT_CACHE_PATH=/mnt/MLPerf/huggingface/tt_cache/Qwen/Qwen3.6-27B MESH_DEVICE=P150x4
    pytest --timeout 1200 models/demos/blackhole/qwen36/demo/text_demo.py -k "traced_128 and not traced_128k"
    pytest --timeout 1200 models/demos/blackhole/qwen36/demo/text_demo.py -k "determinism_128"
    pytest --timeout 1800 models/demos/blackhole/qwen36/demo/vision_demo.py -k "traced_single_image"
  model: qwen3.6-27b
  model_family: Qwen
  skus:
    bh_quietbox_2:
      timeout: 45
      tier: 1
      release_ready: true
  owner_id: U08HL8X1ECD # Aniruddha Tupe
  team: models

# ── Gemma ──────────────────────────────────────────────────────────

- name: Gemma-4-12B e2e tests
  cmd: |
    uv pip install -r models/demos/gemma4/requirements.txt
    export HF_HOME=/mnt/MLPerf/huggingface HF_MODEL=google/gemma-4-12B-it TT_CACHE_PATH=/mnt/MLPerf/huggingface/tt_cache/google--gemma-4-12B-it
    pytest -s --timeout 1500 models/demos/gemma4/demo/text_demo.py::test_demo
    pytest -s --timeout 900 \
      models/demos/gemma4/tests/unit/test_lm_head.py \
      models/demos/gemma4/tests/unit/test_packed_verify.py \
      models/demos/gemma4/tests/unit/test_model.py::test_full_model \
      --deselect models/demos/gemma4/tests/unit/test_packed_verify.py::test_packed_verify_batch_perf
  model: gemma-4-12b
  model_family: Gemma
  skus:
    # Single Blackhole P150: short demo + unit PCC. Cap at 6m so models
    # e2e_tier2 bh_p150 stays within the 26m team budget (GPT-OSS 15 + UNet 5
    # + this 6). f562aa60493's timeout:20 made requested=40 and failed
    # load-test-matrix (see all-model-tests on arg/gemma4_1x8optiom).
    bh_p150:
      timeout: 6
      tier: 2
    bh_quietbox_2:
      timeout: 22
      tier: 1
      release_ready: true
  owner_id: U088413NP0Q # Ashai Reddy
  team: models

# ── Mistral / Mixtral ──────────────────────────────────────────────

- name: TT-DiT Flux.1 schnell e2e tests
  cmd: |
    unset HF_HUB_OFFLINE
    export NO_PROMPT=1
    pytest --timeout 10000 models/tt_dit/tests/models/flux1/test_performance_flux1.py -k flux_schnell
  model: flux.1-schnell
  model_family: Flux
  skus:
    bh_quietbox_2:
      timeout: 20
      tier: 1
      release_ready: true
  owner_id: U0ATR08RCQ0 # James Lee
  team: models

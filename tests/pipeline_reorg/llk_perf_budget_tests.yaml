# LLK perf time budget -- matrix for llk-perf-budget.yaml (workflow_dispatch
# only; nothing here runs on a schedule or on a PR).
#
# One row is one measurement: one architecture, one run-type selection, one
# card, the whole perf suite in a single group, non speed-of-light, cold build.
# Two cards per (architecture, configuration) so machine-to-machine spread is
# visible instead of assumed -- the two rows are identical apart from `card`,
# and because a runner takes one job at a time they land on different machines.
#
# The runner is tt_metal/tt-llk/tests/run_llk_perf_budget.sh, which times the
# producer and the consumer separately and writes perf_budget/summary.json.
# {perf_config} is substituted per row by prepare_test_matrix.py.

- name: llk_perf_budget wormhole full card 1
  # all declared run types
  perf_config: full
  card: 1
  team: llk
  cmd: |
    set -euo pipefail
    ./tests/run_llk_perf_budget.sh {perf_config} 1 1
  skus:
    wh_n150_civ2:
      timeout: 120
  owner_id: U09UC143684 # Nemanja Divnic

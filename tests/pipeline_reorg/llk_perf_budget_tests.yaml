# LLK perf time budget -- matrix for llk-perf-budget.yaml (workflow_dispatch or
# a marked push; nothing here runs on a schedule or on a PR).
#
# A row is one WORKER, and what a worker means depends on the shard count the
# workflow asks for:
#
#   shards 1  -- each worker measures the whole suite on its own card. Two
#                workers are then two independent cards measuring the same
#                thing, which is how the card-to-card spread is obtained.
#   shards N  -- worker k measures shard k of N (pytest-split --group k
#                --splits N). The wall clock a sharded gate pays is the SLOWEST
#                worker, not the sum; the sum is the card time it costs.
#
# Five slots per architecture, because the nightly splits into five. The
# workflow keeps only the slots a run needs, so a one-shard run reserves one
# card per architecture (or two, for the spread) rather than five.
#
# Each worker measures every requested run-type selection in sequence, each with
# a cold build. The runner is tt_metal/tt-llk/tests/run_llk_perf_budget.sh; it
# takes the group and the shard count, and reads CONFIGS, PRODUCER_WORKERS and
# CONSUMER_WORKERS from the environment -- all set by the workflow.
#
# Timeouts hold every configuration in one job, at one shard, which is the
# longest a worker can be. Measured in CI, non-SoL, whole suite, four
# configurations: about 105 min on Wormhole and 127 min on Blackhole. The cap is
# 240, and the per-SKU sum has to stay inside the llk/perf allocation in
# .github/time_budget.yaml -- which is what limits the slots to five.

- name: llk_perf_budget wormhole worker 1
  slot: 1
  team: llk
  cmd: |
    set -euo pipefail
    ./tests/run_llk_perf_budget.sh "$BUDGET_GROUP" "$BUDGET_SHARDS"
  skus:
    wh_n150_civ2:
      timeout: 180
  owner_id: U09UC143684 # Nemanja Divnic

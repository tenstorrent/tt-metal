# LLK perf time budget -- matrix for llk-perf-budget.yaml (workflow_dispatch or
# a marked push; nothing here runs on a schedule or on a PR).
#
# One row is one card. Each job measures every requested run-type selection in
# sequence on that card -- full, isolates, l1, isolates_l1 -- each with a cold
# build, the whole perf suite in a single group, non speed-of-light. Four jobs
# occupy four cards, not sixteen: a card is the scarce thing, and measuring the
# configurations on one card also removes the machine from the comparison
# between them.
#
# Two cards per architecture, because a gate's budget has to hold on the slower
# card and the spread between machines was so far assumed rather than measured.
# The two rows differ only in `card`; a runner takes one job at a time, so they
# land on different machines, and each job records its runner, host and devices.
#
# The runner is tt_metal/tt-llk/tests/run_llk_perf_budget.sh, which times the
# producer and the consumer of every configuration separately and writes one
# perf_budget/summary-<config>.json each. Which configurations it runs comes
# from CONFIGS, set by the workflow.
#
# Timeouts hold every configuration in one job. Measured on one Blackhole card,
# non-SoL, whole suite: full 19:41, isolates 12:40, L1_TO_L1 6:17 -- about an
# hour for all four. The cap is several times that, and the per-SKU sum stays
# inside the llk/perf allocation in .github/time_budget.yaml.

- name: llk_perf_budget wormhole card 1
  card: 1
  team: llk
  cmd: |
    set -euo pipefail
    ./tests/run_llk_perf_budget.sh 1 1
  skus:
    wh_n150_civ2:
      timeout: 240
  owner_id: U09UC143684 # Nemanja Divnic

- name: llk_perf_budget wormhole card 2
  card: 2
  team: llk
  cmd: |
    set -euo pipefail

# SFPU kernels outside eltwise that Sanity runs on ttsim. 690 tests.
# sfpu_binary_bcast: welford layernorm (interleaved, large, sharded) and two_pass groupnorm.
# reshuffle_rows: embedding_bw, the case ttnn_sanity_tests.yaml runs.
- name: "llk sfpu norm embedding sim"
  cmd: >-
    pytest --timeout 60 -xv
    tests/ttnn/unit_tests/operations/fused/test_layer_norm.py
    tests/ttnn/unit_tests/operations/fused/test_layer_norm_sharded.py
    tests/ttnn/unit_tests/operations/fused/test_group_norm.py
    tests/ttnn/unit_tests/operations/data_movement/test_backward_embedding.py::test_embedding_bw_with_program_cache
    -k "welford or two_pass or embedding_bw_with_program_cache"
    -m "not disable_fast_runtime_mode"
  skus:
    sim_wh_n150:
      timeout: 15
    sim_bh_p150:
      timeout: 15
  team: llk
  budget_type: merge_gate
  owner_id: U09UC143684 # Nemanja Divnic

# WH/BH LLK kernels on ttsim. Catches SFPU instruction modes silicon accepts but ttsim does not.
# Run by ttnn-smoke-tests-impl.yaml from merge-gate.yaml, on WH/BH/common/SFPI LLK and ttsim changes.
# Covers the WH/BH SFPU kernels that Sanity runs on ttsim after merge (ttnn_sanity_tests.yaml).
# If ttsim lacks an instruction a change needs, skip the tests in ttsim-skip-list.yaml.
# Not covered: max_pool_indices and direct topk (skip-listed, too slow on ttsim); topk is reached
# via test_sampling.py. SFPLOADMACRO is disabled on ttsim. test_binary_category5_float32.py is left
# out to stay within budget; its ops run in bf16 below. ~4-10 min per leg on ubuntu-latest.

# Unary bf16 and int. 567 tests.
- name: "llk sfpu unary bf16 int sim"
  cmd: >-
    pytest --timeout 60 -xv
    tests/ttnn/unit_tests/operations/eltwise/test_unary_category1_bfloat16.py
    tests/ttnn/unit_tests/operations/eltwise/test_unary_category2_bfloat16.py
    tests/ttnn/unit_tests/operations/eltwise/test_unary_category3_bfloat16.py
    tests/ttnn/unit_tests/operations/eltwise/test_unary_category4_bfloat16.py
    tests/ttnn/unit_tests/operations/eltwise/test_unary_category5_bfloat16.py
    tests/ttnn/unit_tests/operations/eltwise/test_unary_category6_bfloat16.py
    tests/ttnn/unit_tests/operations/eltwise/test_unary_int32.py
    tests/ttnn/unit_tests/operations/eltwise/test_unary_uint32.py
    -m "not disable_fast_runtime_mode"
  skus:
    sim_wh_n150:
      timeout: 15
    sim_bh_p150:
      timeout: 15
  team: llk
  budget_type: merge_gate
  owner_id: U09UC143684 # Nemanja Divnic


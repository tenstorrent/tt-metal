    pytest --timeout 600 models/tt_transformers/tests/test_device_perf.py -k "decode-llama3_8b-2-131072-2-10-1-1-False"
  model: llama3.1-8b
  skus:
    wh_n150:
      timeout: 20
      tt_cache_path: /mnt/MLPerf/huggingface/tt_cache
      hf_model: meta-llama/Llama-3.1-8B-Instruct
    bh_p150:
      timeout: 20
      tt_cache_path: /mnt/MLPerf/huggingface/tt_cache
      hf_model: meta-llama/Llama-3.1-8B-Instruct

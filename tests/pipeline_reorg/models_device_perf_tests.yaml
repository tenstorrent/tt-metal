# The base and LoRA perf files used to share one leg that ran both and reported the worst
# exit code. A hang in the first file left the second one running on a dead card until
# the job timeout (#57706). Each file is its own leg now, so each starts on reset devices.
# The old leg's timeout is split between the two (~36 min measured for base, ~4 min for LoRA
# on wh_n150).
- name: Stable Diffusion XL device-perf tests
  cmd: |
    export HF_HUB_OFFLINE=0
    pytest models/demos/stable_diffusion_xl_base/tests/test_sdxl_perf.py -m models_device_performance_bare_metal
  model: sdxl
  skus:
    wh_n150:
      timeout: 80
    bh_p150:
      timeout: 45
  owner_id: U08SXRPCTJ5 # Janko Mitrovic
  team: shield
  budget_type: device_perf


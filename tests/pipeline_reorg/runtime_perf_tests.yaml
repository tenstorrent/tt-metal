# This file defines the test matrix for the Runtime performance tests.
# These are host-side microbenchmarks (dispatch latency, buffer R/W bandwidth,
# JIT-build compile throughput, and PCIe mem_bench). Each runs through
# tests/perf/test_suites.py, which compares against its golden using the policy in
# tests/perf/suites.yaml and $PERF_ENVIRONMENT (the SKU).
#
# Each entry represents a parallel job with the following keys:
#   name: The display name for the job in GitHub Actions.
#   cmd: The exact command to run for the test.
#   skus: A mapping of SKU names to their configuration.
#     Each SKU entry contains:
#       timeout: The maximum allowed runtime for this job in minutes on that SKU.
#   owner_id: The Slack user ID to notify on failure.
#   team: The team that owns the test.

# For max allowed timeout refer to .github/time_budget.yaml

# --- Dispatch Program Latency Benchmark ---
- name: runtime_perf_pgm_dispatch
  cmd: |
    mkdir -p generated/test_reports
    pytest --noconftest -p tests.perf.plugin "tests/perf/test_suites.py::test_perf[pgm_dispatch]"
  skus:
    wh_n300_perf:
      timeout: 25
    bh_p150_perf:
      timeout: 25
  owner_id: U099A7FMKL2 # Manish Sudumbrekar
  team: runtime
  budget_type: perf

# --- Dispatch Program Latency Benchmark, host-bound no_trace cases ---
# These vary by up to 25% across civ2 VMs and by 12% to 27% across the bh_p150_perf
# machines, so Blackhole is temporarily pinned to one host.
- name: runtime_perf_pgm_dispatch_no_trace
  cmd: |
    mkdir -p generated/test_reports
    pytest --noconftest -p tests.perf.plugin "tests/perf/test_suites.py::test_perf[pgm_dispatch_no_trace]"
  skus:
    wh_n300_perf:
      timeout: 10
    bh_p150_perf_gh04:
      timeout: 10
  owner_id: U099A7FMKL2 # Manish Sudumbrekar
  team: runtime
  budget_type: perf

# --- Dispatch Buffer R/W Bandwidth Benchmark ---
- name: runtime_perf_rw_buffer
  cmd: |
    mkdir -p generated/test_reports

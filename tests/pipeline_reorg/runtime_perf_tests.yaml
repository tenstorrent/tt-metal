# This file defines the test matrix for the Runtime performance tests.
# These are host-side microbenchmarks (dispatch latency, buffer R/W bandwidth,
# and JIT-build compile throughput), each with golden comparison for regression
# detection. The dispatch/buffer benchmarks use Google Benchmark; the JIT-build
# benchmark drives a gtest and gates via compile_stress_ci.py.
#
# Each entry represents a parallel job with the following keys:
#   name: The display name for the job in GitHub Actions.
#   cmd: The exact command to run for the test.
#   skus: A mapping of SKU names to their configuration.
#     Each SKU entry contains:
#       timeout: The maximum allowed runtime for this job in minutes on that SKU.
#   owner_id: The Slack user ID to notify on failure.
#   team: The team that owns the test.

# For max allowed timeout refer to .github/time_budget.yaml

# --- Dispatch Program Latency Benchmark ---
- name: runtime_perf_pgm_dispatch
  cmd: |
    mkdir -p generated/test_reports
    ./build/test/tt_metal/perf_microbenchmark/dispatch/test_pgm_dispatch \
      --benchmark_out_format=json --benchmark_out=pgm_bench.json --benchmark_repetitions=2
    if [ "$ARCH_NAME" = "blackhole" ]; then
      ./tests/tt_metal/tt_metal/perf_microbenchmark/dispatch/compare_pgm_dispatch_perf_ci.py \
        -g tests/tt_metal/tt_metal/perf_microbenchmark/dispatch/pgm_dispatch_blackhole_golden.json \
        pgm_bench.json
    else
      ./tests/tt_metal/tt_metal/perf_microbenchmark/dispatch/compare_pgm_dispatch_perf_ci.py \
        pgm_bench.json
    fi
  skus:
    wh_n300_civ2:
      timeout: 30
    bh_p150_perf:
      timeout: 30
  owner_id: U099A7FMKL2 # Manish Sudumbrekar
  team: runtime

# --- Dispatch Buffer R/W Bandwidth Benchmark ---
- name: runtime_perf_rw_buffer
  cmd: |
    mkdir -p generated/test_reports
    if [ "$ARCH_NAME" = "blackhole" ]; then
      ./build/test/tt_metal/perf_microbenchmark/dispatch/benchmark_rw_buffer \
        --benchmark_out_format=json --benchmark_out=buffer_bench.json --benchmark_repetitions=11
      ./tests/tt_metal/tt_metal/perf_microbenchmark/dispatch/compare_benchmark_rw_buffer.py \
        --golden tests/tt_metal/tt_metal/perf_microbenchmark/dispatch/benchmark_rw_buffer_blackhole_golden.json \
        buffer_bench.json --ignore-times
    else
      ./build/test/tt_metal/perf_microbenchmark/dispatch/benchmark_rw_buffer \
        --benchmark_out_format=json --benchmark_out=buffer_bench.json --benchmark_repetitions=5
      ./tests/tt_metal/tt_metal/perf_microbenchmark/dispatch/compare_benchmark_rw_buffer.py \
        buffer_bench.json --ignore-times \
        --golden tests/tt_metal/tt_metal/perf_microbenchmark/dispatch/benchmark_rw_buffer_n300_iommu_golden.json
    fi
  skus:
    wh_n300_civ2:
      timeout: 25
    bh_p150_perf:
      timeout: 10
  owner_id: U099A7FMKL2 # Manish Sudumbrekar
  team: runtime

# --- Host Init/Teardown Benchmark ---
# Google Benchmark host-timing binary that isolates device bring-up and teardown cost:
# MeshDevice open (create*) and close, over a topology sweep enumerated from the attached
# cluster (single_chip always; then mesh_2, mesh_4, ... up to the full mesh on multi-device
# SKUs - each shape probe-opened first and skipped if the hardware can't instantiate it).
# Behaves identically on Wormhole and Blackhole (no profiler / device instrumentation).
# SKU coverage: wh_n300_civ2 (2 chips -> single_chip, mesh_2), wh_llmbox_perf (T3K, 8 chips
# -> single_chip, mesh_2, mesh_4, mesh_8), wh_galaxy_perf (6U galaxy, 32 chips -> single_chip,
# mesh_2, mesh_4, mesh_8, mesh_16, mesh_32), bh_p150_perf (1 chip -> single_chip).
- name: runtime_perf_host_init_teardown
  cmd: |
    mkdir -p generated/test_reports
    # Write under generated/test_reports so the per-SKU JSON is uploaded as a CI artifact
    # (upload-artifact-with-job-uuid uploads that dir); the follow-up gate is armed by
    # downloading this exact benchmark_out to replace the placeholder golden.
    ./build/test/tt_metal/perf_microbenchmark/dispatch/benchmark_host_init_teardown \
      --benchmark_out_format=json \
      --benchmark_out=generated/test_reports/host_init_teardown_bench.json
    GOLDEN=tests/tt_metal/tt_metal/perf_microbenchmark/dispatch/host_init_teardown_golden.json
    if [ "$ARCH_NAME" = "blackhole" ]; then
      GOLDEN=tests/tt_metal/tt_metal/perf_microbenchmark/dispatch/host_init_teardown_blackhole_golden.json
    fi
    # BRING-UP: goldens ship with placeholder / single-SKU times, so --ignore-times validates
    # structure only (no errored benchmarks; topology set is SKU-dependent) for now. Arm the
    # gate by replacing the golden with a real CI benchmark_out JSON captured on this SKU, then
    # drop --ignore-times.
    ./tests/tt_metal/tt_metal/perf_microbenchmark/dispatch/compare_host_init_teardown_ci.py \
      generated/test_reports/host_init_teardown_bench.json --golden "$GOLDEN" --ignore-times
  skus:
    wh_n300_civ2:
      timeout: 10
    wh_llmbox_perf:
      timeout: 15
    wh_galaxy_perf:
      timeout: 30
    bh_p150_perf:
      timeout: 10
  owner_id: U099A7FMKL2 # Manish Sudumbrekar
  team: runtime

# --- JIT Build (local host compile) Throughput Benchmark ---
# Adapts DISABLED_TensixCompileStress into a runtime perf gate: real attached
# device, no remote compile server, N cache-bypassing kernels compiled locally
# per rep (kernels are compiled, not dispatched). The driver takes the fastest
# rep and compares it against a per-arch golden (record mode until goldens are
# armed). Auto-picks the golden from $ARCH_NAME.
- name: runtime_perf_jit_build
  cmd: |
    mkdir -p generated/test_reports
    ./tests/tt_metal/tt_metal/jit_build/compile_stress_ci.py \
      --arch "$ARCH_NAME" --num-kernels 300 --repetitions 3
  skus:
    wh_n300_civ2:
      timeout: 10
    bh_p150_perf:
      timeout: 10
  owner_id: U099A7FMKL2 # Manish Sudumbrekar
  team: runtime

# --- JIT Build (local host compile) Throughput Benchmark ---
# Adapts DISABLED_TensixCompileStress into a runtime perf gate: real attached
# device, no remote compile server, 300 cache-bypassing kernels compiled locally
# per rep (kernels are compiled, not dispatched). See the jit_build suite in
# tests/perf/suites.yaml.
- name: runtime_perf_jit_build
  cmd: |
    mkdir -p generated/test_reports
    pytest --noconftest -p tests.perf.plugin "tests/perf/test_suites.py::test_perf[jit_build]"
  # Compile time scales with host cores, which differ across the bh_p150_perf machines.
  skus:
    wh_n300_civ2:
      timeout: 10
    bh_p150_perf_gh04:
      timeout: 10
  owner_id: U099A7FMKL2 # Manish Sudumbrekar
  team: runtime
  budget_type: perf

# --- PCIe host/device bandwidth (mem_bench) ---
# Same benchmark filter and CIv2 P150b SKU as the former metal-run-microbenchmarks
# "BH P150 PCIe Performance" job. Report only until it has a golden; keep it off
# bare-metal perf runners so it does not block the dispatch/buffer jobs
# (https://github.com/tenstorrent/tt-metal/pull/28148#issuecomment-3275595011).
- name: runtime_perf_pcie_mem_bench
  cmd: |
    mkdir -p generated/test_reports
    pytest --noconftest -p tests.perf.plugin "tests/perf/test_suites.py::test_perf[pcie_mem_bench]"
  skus:
    bh_p150b_civ2_viommu:
      timeout: 10
  owner_id: U099A7FMKL2 # Manish Sudumbrekar
  team: runtime
  budget_type: perf

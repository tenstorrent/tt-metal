# LLK SFPU accuracy — the exhaustive ULP sweep, held against
# tt_metal/tt-llk/tests/python_tests/helpers/sfpu_accuracy_budget.yaml.
#
# Run nightly by .github/workflows/llk-sfpu-ulp-sweep.yaml, which llk-e2e.yaml calls;
# dispatch that workflow to sweep a branch. Every finite bfloat16 and float16 value (and
# a stride of float32) through every enrolled unary op, per format pair, approximation
# mode and dest accumulator.
#
# Two checks, both run whatever the first returns, and the job fails if either does:
#   * pytest fails a gated cell whose worst lane is over its `max_ulp`;
#   * `ulp_budget_diff.py headroom` fails a tolerance cell past the `max N ULP` or the
#     non-finite lane count its row records, and lists every pytest failure no
#     measurement describes. Its report is the job summary.
#
# The JUnit file is not named pytest-report-*: the cmd lint (tt-metal#57706) reads any
# later word `pytest` as a second device run after a recorded failure, and the
# comparison after the sweep runs nothing on the device.
#
# Named by path, not by marker: the sweep is marked `accuracy`, which the other LLK
# pipelines deselect. Wormhole only: the table's budgets are Wormhole measurements.
# Nothing here writes the table: --ulp-emit is a deliberate human step, and a table
# rewritten by CI would be a gate that agrees with itself.
#
# Charged to llk's e2e bucket, not pr_gate: PR Gate's wh_n150_civ2 bucket (40 minutes)
# is taken by llk_smoke_wormhole's two 15-minute groups. The job took 9-11 minutes on
# wh_n150_civ2, checkout and SFPI install included (2026-09/10).

- name: llk_sfpu_ulp_sweep_wormhole
  split_group: 1
  team: llk
  budget_type: e2e
  coverage: false
  cmd: |
    set -uo pipefail
    cd tests/python_tests
    status=0
    pytest -q --override-ini=log_cli=false -n auto --dist=worksteal \
      --ulp-measure=ulp_measurements.jsonl \
      --timeout=900 \
      --junitxml=ulp_sweep_junit.xml \
      test_unary_sfpu_ulp.py || status=$?
    python3 helpers/ulp_budget_diff.py headroom \
      --table helpers/sfpu_accuracy_budget.yaml \
      --measured ulp_measurements.jsonl \
      --junit ulp_sweep_junit.xml \
      --out ulp_headroom_report.md || status=$?
    if [[ -n "${GITHUB_STEP_SUMMARY:-}" && -s ulp_headroom_report.md ]]; then
      cat ulp_headroom_report.md >> "$GITHUB_STEP_SUMMARY"
    fi
    exit "$status"
  skus:
    wh_n150_civ2:
      timeout: 25
  owner_id: U09UC143684 # Nemanja Divnic

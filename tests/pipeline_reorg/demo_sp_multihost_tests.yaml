  owner_id: U08E1JCMAJF
  team: scaleout
  sp_config: sc4-blitz

# =============================================================================
# BH SC16 Multihost Pipeline Tests (4 connected SC4 = 16 galaxies)
# =============================================================================
# Count allocation + generate_blitz_decode_pipeline_configs.py (not tt-run automapper).
# Needs build/test/tt_metal/tt_fabric/test_physical_discovery.

- name: "Teacher Forcing Test (DeepSeek V3 B1 Supercluster 16 aka Superpod 4)"
  cmd: |
    TTRUN_DIR=/etc/ttop
    export TT_METAL_HOME="${TT_METAL_HOME:-/home/user/tt-metal}"
    TTRUN_PY="${TT_METAL_HOME}/ttnn/ttnn/distributed/ttrun.py"
    SCALEOUT_DIR="${TT_METAL_HOME}/models/demos/deepseek_v3_b1/scaleout_configs"
    PIPELINE_DIR="${PIPELINE_DIR:?PIPELINE_DIR must be set (NFS staging for ranklogs)}"
    RANKLOG_DIR="${PIPELINE_DIR}/ranklogs"
    BINDINGS_DIR="${PIPELINE_DIR}/blitz_bindings"
    mkdir -p "${RANKLOG_DIR}" "${BINDINGS_DIR}"
    export LOGURU_LEVEL=ERROR
    export TT_LOGGER_LEVEL=error

    cd "${BINDINGS_DIR}"
    python3 "${SCALEOUT_DIR}/generate_blitz_decode_pipeline_configs.py" \
      "${SCALEOUT_DIR}/blitz_pipeline_config_superpod_ci.yaml" \
      --hostfile "${TTRUN_DIR}/hostfile" \
      --preserve-hostfile-order \
      --stage-size 4x2 \
      --worker-tt-metal-home "${TT_METAL_HOME}" \
      --output-dir "${BINDINGS_DIR}"

    RB=blitz_decode_pipeline_rank_binding_superpod_ci.yaml
    RF=blitz_decode_pipeline_rank_file_superpod_ci
    LOCAL_BIND="${TT_METAL_HOME}/generated/blitz_sc16"
    mkdir -p "${LOCAL_BIND}"
    cp -f "${BINDINGS_DIR}/${RB}" "${BINDINGS_DIR}/${RF}" "${LOCAL_BIND}/"
    mpirun --pernode bash -lc "mkdir -p '${LOCAL_BIND}' && cp -f '${BINDINGS_DIR}/${RB}' '${BINDINGS_DIR}/${RF}' '${LOCAL_BIND}/'"

    PIPELINE_HOSTS=$(awk 'NF {printf "%s,", $1}' "${TTRUN_DIR}/hostfile" | sed 's/,$//')
    cd "${TT_METAL_HOME}"
    TT_METAL_ALLOCATOR_MODE_HYBRID=1 TT_METAL_SLOW_DISPATCH_MODE=1 python3 "${TTRUN_PY}" \
      --tcp-interface ens5f0np0 \
      --rank-binding "generated/blitz_sc16/${RB}" \
      --mpi-args "--host ${PIPELINE_HOSTS} --bind-to hwt:overload-allowed --wdir ${TT_METAL_HOME} --map-by rankfile:file=generated/blitz_sc16/${RF} -x LOGURU_LEVEL=ERROR" \
      bash -c "python3 -m models.demos.deepseek_v3_b1.demo.teacher_forced \
        --weights real \
        --cache-path /mnt/models/deepseek-ai/cache-2026-03-22 \
        --model-path /mnt/models/deepseek-ai/DeepSeek-R1-0528-dequantized \
        --prompt 'Solve this step by step: Design a cache for sharded LLM weights across multiple hosts with local NVMe and shared NFS. Minimize startup latency, avoid duplicate reads, support cache invalidation, and explain tradeoffs between per-host caches, content-addressable storage, and pre-sharded artifacts.' \
        --reference-file /mnt/models/ref_data/output1_reference.txt \
        --output-file output1_teacher_forcing_results.json \
        --chunk-accuracy 256 \
        > \"${RANKLOG_DIR}/rank-\${TT_RUN_RANK}.log\" 2>&1" \
      > "${PIPELINE_DIR}/launch.log" 2>&1
  skus:
    bh_sc16:
      timeout: 30
  owner_id: U08E1JCMAJF
  team: scaleout
  sp_config: sc16


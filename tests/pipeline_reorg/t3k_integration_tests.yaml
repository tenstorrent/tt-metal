# This file defines the test matrix for the T3000 integration tests pipeline.

# Each entry represents a parallel job with the following keys:
#   name: The display name for the job in GitHub Actions.
#   cmd: The command to run the test (includes sourcing the script and calling the function).
#   skus: A mapping of SKU names to their configuration (each SKU has timeout in minutes).
#   owner_id: The Slack user ID to notify on failure.
#   team: The team that owns the test.

# For max allowed timeout refer to .github/time_budget.yaml

- name: t3k_tteager_tests
  cmd: run_t3000_tteager_tests
  skus:
    wh_llmbox:
      timeout: 30
  owner_id: U084B1CES7M # Borys Bradel
  team: ttnn
  model-name: tteager


- name: t3k_trace_stress_tests
  cmd: run_t3000_trace_stress_tests
  skus:
    wh_llmbox:
      timeout: 30
  owner_id: U0709049XNK # Aditya Saigal
  team: scaleout
  model-name: trace stress


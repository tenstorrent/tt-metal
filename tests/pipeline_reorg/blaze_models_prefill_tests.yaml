# Smoke (forward completes, no host reference) only. The PCC cases are KNOWN-FAILING and are
# deliberately NOT wired here, because the failure is a real model gap rather than a flake and a
# permanently-red nightly entry only teaches people to ignore this pipeline. Measured locally:
#
#   embed 1.000000 | layer_0 0.975813 | layer_1 0.942922 | layer_2 0.906779
#   layer_3 0.870295 | layer_4 0.834688 | norm 0.834414 | lm_head 0.769880    (threshold 0.99)
#
# embed is exact and layer_0/layer_1 reproduce bit-identically across the 2- and 5-layer runs, so
# this is deterministic: the softmax-vs-sigmoid router substitution costs a steady ~0.0355 PCC per
# layer. Over 36 layers that is model-breaking. Enable the line below once moe_grouped_topk.cpp
# supports a softmax score_func and Mistral4Small119BConfig declares SCORE_FUNC = "softmax":
#
#   python3 -m pytest models/demos/deepseek_v3_d_p/tests/test_prefill_transformer.py::test_mistral4_prefill_transformer -k "pcc-random" -vvv --tb=short

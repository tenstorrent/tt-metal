# MiniMax-M3 full-model chunked-prefill throughput regression (same harness as KV PCC, PCC skipped).
# Gates whole-sequence tok/s against PREFILL_EXPECTED_TPS +/- PREFILL_PERF_MARGIN on high-power Galaxy.
# Allowed range: ~5007-6774 tok/s (5890 +/- 15%).
# 5890 is the measured whole-sequence median of run 32280869211 job 96161901672 (PREFILL_TPS_ITERS=5
# within that one run), the first run of this pipeline after the per-device MeshWorkload dispatch
# fan-out was removed - it exceeded the old 4500 ceiling, which is why this moved. That is a single
# run, unlike the ten-run median the Kimi chunked
# baseline uses, so if this proves noisy widen PREFILL_PERF_MARGIN rather than chasing the centre.
# For scale, this pipeline is host-dispatch bound: it measured 5057.8 tok/s (run 31996994902) with the
# fan-out absent and 3582.8 (run 32075671439) with it present, so the gate's own floor is what caught
# #52775 here.
# If this test fails: first check whether it is a true regression or a performance improvement.
# If neither (CI noise), widen this range or comment out this test due to CI instability.
- name: "MiniMax-M3-428B chunked prefill perf longbook 55k@5k"
  cmd: |
    export LOGURU_LEVEL=INFO
    export TT_METAL_HOME=${TT_METAL_HOME:-$PWD}
    export PYTHONPATH=${TT_METAL_HOME}${PYTHONPATH:+:$PYTHONPATH}
    export HF_MODEL=/mnt/models/MiniMaxAI/MiniMax-M3-ref/
    export PREFILL_TRACE_DIR=/mnt/models/MiniMaxAI/MiniMax-M3-ref/golden/longbook_56320
    export TT_MESH_GRAPH_DESC_PATH=$TT_METAL_HOME/tt_metal/fabric/mesh_graph_descriptors/single_bh_galaxy_mesh_graph_descriptor.textproto
    export EXPERT_DTYPE=bf4
    export PREFILL_CHUNKED=1
    export PREFILL_CHUNK_SIZE=5120
    export PREFILL_TPS_ITERS=5
    export PREFILL_SKIP_PCC=1
    export PREFILL_REQUIRE_HIGH_POWER=1
    export PREFILL_EXPECTED_TPS=5890
    export PREFILL_PERF_MARGIN=0.15
    mpirun --bind-to none --pernode --tag-output bash -lc '
      python3 models/demos/minimax_m3/tests/galaxy_prefill_kv_pcc.py
    '
  test_type: minimax_prefill_perf
  test_group: module
  skus:
    bh_sc1_high_power:
      # Warm tilized-cache + chunked prefill (5120) x5 timed iters, no PCC; cold cache build will exceed this.
      timeout: 35
  owner_id: U08ECJQ848G # Viacheslav Melnykov
  team: models
  sp_config: sc1

# ---------------------------------------------------------------------------------------------
# Mistral-Small-4-119B prefill (dense MLA + MoE-every-layer, SP=8 / TP=4 on a 32-chip Blackhole
# galaxy). Bring-up branch: ssalice/mistral4-119b-prefill.
#
# STAGING REQUIRED before these can go green on CI. Nothing for this model exists under
# /mnt/models yet (verified). Two mounts are needed:
#   MISTRAL4_HF_MODEL              -> the fp8 checkpoint (per-tensor scheme, scalar
#                                     weight_scale_inv -- NOT the [128,128] block scheme)
#   TT_MISTRAL4_PREFILL_TTNN_CACHE -> a WRITABLE tilized weight-cache dir. The adapter's
#                                     ttnn_cache_default is "" (mistral_small_4_119b.py:39), so
#                                     without this every run re-converts weights from fp8.
# The paths below follow the house convention; adjust to wherever the weights actually land.
# Locally these tests were validated against /data/kmabee/models/Mistral-Small-4-119B-2603.
#
# owner_id below is the models-team default -- reassign to the Mistral-4 owner before enabling.
# ---------------------------------------------------------------------------------------------

- name: "Blaze - Mistral4 MLA"
  cmd: |
    export MISTRAL4_HF_MODEL=/mnt/models/Mistral-Small-4-119B-2603/
    export TT_MISTRAL4_PREFILL_TTNN_CACHE=/mnt/models/Mistral-Small-4-119B-Cache/prefill_ttnn

    mpirun --bind-to none --pernode --tag-output bash -lc '
      export OMP_NUM_THREADS=$(nproc)
      python3 -m pytest models/demos/deepseek_v3_d_p/tests/test_mla.py::test_mistral4_mla -k "8x4" -vvv --tb=short
    '
  test_type: mistral4_mla
  test_group: module
  skus:
    bh_sc1:
      # 4 cases (random/pretrained x seq5k/seq25k); 91 s locally with a warm cache.
      timeout: 20
  owner_id: U08RL15T4N8
  team: models
  sp_config: sc1

- name: "Blaze - Mistral4 KV Cache Table"
  cmd: |

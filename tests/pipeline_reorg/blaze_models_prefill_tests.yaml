# ===== GPT-OSS-120B ==================================================================================

# GPT-OSS-120B prefill suite: sections run serially on one allocation; each is time-bounded and
# runs regardless of the others, and the job fails if any section fails.
#
# [1/3] chunked prefill KV accuracy longbook 5k@2.5k and [2/3] 5k@1k: full-model real-weights
# chunked prefill + per-layer KV PCC (models/demos/gpt_oss_d_p/tests/galaxy_prefill_kv_pcc.py,
# standalone harness, not pytest; the GPT-OSS analog of the MiniMax-M3 KV-accuracy stage above).
# [2/3] is the same harness/goldens at the small variable-chunk size (PREFILL_CHUNK_SIZE=1024 ->
# 5 chunks over the 5k golden). Auto-SKIP (rc 0) off-galaxy or when PREFILL_TRACE_DIR is unset.
# GPT_OSS_KV_PCC_MIN=0.85 is a floor under the measured ~0.92 min KV PCC (ring chunked and
# 1k-chunk configs, EXPERT_DTYPE=bf8), keeping headroom for bf8/golden noise.
# [3/3] variable-chunk smoke (models/demos/gpt_oss_d_p/tests/variable_chunk_smoke.py): one
# runtime built for {1k, 8k} prefills the same 1024 real tokens as a native 1k chunk vs padded
# into an 8k chunk and reports both timings. No PCC/golden -- it catches the multi-chunk-size
# runtime build or small-chunk ring path breaking. Auto-SKIPs off-galaxy; no PREFILL_TRACE_DIR.
#
# Requires staged mounts:
#   HF_MODEL          -> /mnt/models/blaze/openai/gpt-oss-120b (config only here: with
#                        GPT_OSS_WEIGHTS_FROM_CACHE=1 weights come from the tilized cache)
#   TT_CACHE_PATH     -> /mnt/models/blaze/openai/gpt-oss-120b
#                        must hold "tensor_cache_bfp8_MeshShape([4, 8])"; without it the run
#                        cold-tilizes from safetensors and will blow the timeout
#   PREFILL_TRACE_DIR -> /mnt/models/blaze/openai/gpt-oss-120b/golden/longbook_qa_eng_prefill_5000
#                        (KV accuracy sections only)
# fabric_profile torus_xy: every chunk drives the SP ring cache-read (FABRIC_1D_RING), which
# needs the certified TorusXY wraparound links the impl workflow provides.
#
# Per-section bounds (timeout -k 2m, a timeout counts as FAIL and the next section still runs):
#   [1/3] 35 min: cache load + JIT + prefill + PCC readback, with headroom for cold kernel JIT and
#         the ~180 GB tilized-cache read over NFS. A cold cache BUILD exceeds it.
#   [2/3] 35 min: same profile as [1/3] (5 ring chunks instead of 2; compile/IO dominate).
#   [3/3] 30 min: one runtime build + 6 short prefills, no golden readback; cache read + JIT dominate.
- name: "(GPT-OSS-120B) chunked prefill KV accuracy longbook 5k@2.5k, 5k@1k + variable-chunk smoke 1k vs 8k"
  fabric_profile: torus_xy
  cmd: |
    # errexit off for the whole suite: each section must run whatever the previous one did.
    set +e
    suite_rc=0
    suite_summary=()

    # Section bodies run in a subshell "( ... )" so one section's exports cannot leak into the next.
    gpt_oss_kv_pcc_2p5k() (
      export LOGURU_LEVEL=INFO
      export TT_METAL_HOME=${TT_METAL_HOME:-$PWD}
      export PYTHONPATH=${TT_METAL_HOME}${PYTHONPATH:+:$PYTHONPATH}
      export HF_MODEL=/mnt/models/blaze/openai/gpt-oss-120b
      export TT_CACHE_PATH=/mnt/models/blaze/openai/gpt-oss-120b
      export PREFILL_TRACE_DIR=/mnt/models/blaze/openai/gpt-oss-120b/golden/longbook_qa_eng_prefill_5000
      export GPT_OSS_WEIGHTS_FROM_CACHE=1
      export EXPERT_DTYPE=bf8
      export PREFILL_CHUNKED=1
      export PREFILL_CHUNK_SIZE=2560
      export PREFILL_TPS_ITERS=1
      export GPT_OSS_KV_PCC_MIN=0.85
      timeout -k 2m 35m mpirun --pernode --tag-output bash -lc '
        python3 models/demos/gpt_oss_d_p/tests/galaxy_prefill_kv_pcc.py
      '
    )

    gpt_oss_kv_pcc_1k() (
      export LOGURU_LEVEL=INFO
      export TT_METAL_HOME=${TT_METAL_HOME:-$PWD}
      export PYTHONPATH=${TT_METAL_HOME}${PYTHONPATH:+:$PYTHONPATH}
      export HF_MODEL=/mnt/models/blaze/openai/gpt-oss-120b
      export TT_CACHE_PATH=/mnt/models/blaze/openai/gpt-oss-120b
      export PREFILL_TRACE_DIR=/mnt/models/blaze/openai/gpt-oss-120b/golden/longbook_qa_eng_prefill_5000
      export GPT_OSS_WEIGHTS_FROM_CACHE=1
      export EXPERT_DTYPE=bf8
      export PREFILL_CHUNKED=1
      export PREFILL_CHUNK_SIZE=1024
      export PREFILL_TPS_ITERS=1
      export GPT_OSS_KV_PCC_MIN=0.85
      timeout -k 2m 35m mpirun --pernode --tag-output bash -lc '
        python3 models/demos/gpt_oss_d_p/tests/galaxy_prefill_kv_pcc.py
      '
    )

    gpt_oss_varchunk_smoke() (
      export LOGURU_LEVEL=INFO
      export TT_METAL_HOME=${TT_METAL_HOME:-$PWD}
      export PYTHONPATH=${TT_METAL_HOME}${PYTHONPATH:+:$PYTHONPATH}
      export HF_MODEL=/mnt/models/blaze/openai/gpt-oss-120b
      export TT_CACHE_PATH=/mnt/models/blaze/openai/gpt-oss-120b
      export GPT_OSS_WEIGHTS_FROM_CACHE=1
      export EXPERT_DTYPE=bf8
      export VARCHUNK_SMALL=1024
      export VARCHUNK_LARGE=8192
      timeout -k 2m 30m mpirun --pernode --tag-output bash -lc '
        python3 models/demos/gpt_oss_d_p/tests/variable_chunk_smoke.py
      '
    )

    # run_section <n/total> <title> <function>: banner, run, one-line result; never aborts.
    run_section() {
      local tag="$1" title="$2" fn="$3" t0=$SECONDS rc verdict note=""
      echo "::group::[$tag] $title"
      "$fn"
      rc=$?
      echo "::endgroup::"
      if [ "$rc" -eq 0 ]; then verdict=PASS; else verdict=FAIL; suite_rc=1; fi
      if [ "$rc" -eq 124 ] || [ "$rc" -eq 137 ]; then note=", timed out"; fi
      local d=$((SECONDS - t0))
      echo "[$tag] $verdict (exit $rc, $((d / 60)) min $((d % 60)) s$note)"
      suite_summary+=("[$tag] $verdict  $title")
    }

    run_section 1/3 "(GPT-OSS-120B) chunked prefill KV accuracy longbook 5k@2.5k" gpt_oss_kv_pcc_2p5k
    run_section 2/3 "(GPT-OSS-120B) chunked prefill KV accuracy longbook 5k@1k" gpt_oss_kv_pcc_1k
    run_section 3/3 "(GPT-OSS-120B) variable-chunk prefill smoke 1k vs 8k" gpt_oss_varchunk_smoke

    echo "===== GPT-OSS-120B prefill suite summary ====="
    printf '%s\n' "${suite_summary[@]}"
    if [ "$suite_rc" -eq 0 ]; then echo "suite: PASS"; else echo "suite: FAIL"; fi
    exit "$suite_rc"
  test_type: gpt_oss_prefill_suite
  # Per-section tokens: `-f test-type=<token>` selects this job.
  test_tags: [gpt_oss_prefill_kv_pcc, gpt_oss_prefill_kv_pcc_1k, gpt_oss_varchunk_smoke]
  test_group: module
  skus:
    bh_sc1:
      # Exactly the sum of the per-section bounds (35 + 35 + 30), no margin: the models/demo/bh_sc1
      # time budget bucket is exactly full, so this entry cannot carry any. Worst case (a section
      # hits its limit plus the 2 min kill grace) the last section may be cut short by this timeout.
      timeout: 100
  owner_id: U08HM8SL5U4 # Maciek Dragula
  team: models
  budget_type: demo
  sp_config: sc1


# ===== Llama-3.1-8B ===================================================================================

# Disaggregated-prefill model accuracy on one BH Galaxy. Timeouts include checkpoint I/O, CPU references,
# device JIT and readbacks; these are scheduling budgets, not performance claims.
# Components and book top-5 run as sections of one job. Every section and every pytest runs even if
# an earlier one failed; the job fails if any of them failed.
# Full 2K accuracy remains a required local check; restore its CI job before
# project completion (see the model README).
- name: "(Llama-3.1-8B) prefill components, decoder + book top-5 accuracy 2k, 4k"
  fabric_profile: torus_xy
  cmd: |
    fail=0
    summary=""

    echo "::group::[1/2] (Llama-3.1-8B) prefill components and decoder accuracy"
    t0=$SECONDS
    rc=0
    (
      export LLAMA31_8B_CHECKPOINT=/mnt/models/meta-llama/Llama-3.1-8B-Instruct
      # No set -e: the unit tests run even if the host tests fail; exit 1 if either failed.
      timeout -k 2m 25m mpirun --bind-to none --pernode --tag-output bash -lc '
        export OMP_NUM_THREADS=16
        rc=0
        python3 -m pytest --noconftest -v models/demos/llama_3p1_8b_d_p/tests/host || rc=1
        python3 -m pytest --timeout=600 -v models/demos/llama_3p1_8b_d_p/tests/unit || rc=1
        exit $rc
      '
    ) || rc=$?
    echo "::endgroup::"
    if [ "$rc" -eq 0 ]; then res=PASS; else res=FAIL; fail=1; fi
    line="[1/2] $res (exit $rc, $(( (SECONDS - t0) / 60 )) min) (Llama-3.1-8B) prefill components and decoder accuracy"
    echo "$line"
    summary+="$line"$'\n'

    echo "::group::[2/2] (Llama-3.1-8B) prefill book top-5 accuracy 2k, 4k"
    t0=$SECONDS
    rc=0
    (
      export LLAMA31_8B_CHECKPOINT=/mnt/models/meta-llama/Llama-3.1-8B-Instruct
      timeout -k 2m 15m mpirun --bind-to none --pernode --tag-output bash -lc '
        set -e
        export OMP_NUM_THREADS=16
        python3 -m pytest --timeout=600 -v models/demos/llama_3p1_8b_d_p/tests/model/test_prefill_book_top5.py
      '
    ) || rc=$?
    echo "::endgroup::"
    if [ "$rc" -eq 0 ]; then res=PASS; else res=FAIL; fail=1; fi
    line="[2/2] $res (exit $rc, $(( (SECONDS - t0) / 60 )) min) (Llama-3.1-8B) prefill book top-5 accuracy 2k, 4k"
    echo "$line"
    summary+="$line"$'\n'

    echo "===== Llama-3.1-8B summary (exit 124 or 137 = section timed out) ====="
    printf '%s' "$summary"
    exit "$fail"
  test_type: llama31_prefill_suite
  # Per-section tokens: `-f test-type=<token>` selects this job.
  test_tags: [llama31, transformer, llama31_prefill_components, llama31_prefill_book_top5]
  test_group: module
  skus:
    bh_sc1:
      # Sum of the section timeouts (25 + 15). No margin: the models/demo/bh_sc1
      # budget in .github/time_budget.yaml is fully allocated.
      timeout: 40
      tier: 2
      release_ready: false
  owner_id: U053W15B6JF # Djordje Ivanovic
  team: models
  budget_type: demo
  sp_config: sc1



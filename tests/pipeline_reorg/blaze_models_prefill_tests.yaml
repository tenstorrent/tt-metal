- name: "high_bw_all_gather CCL perf + accuracy"
  # A full 8x4 Blackhole-Galaxy Fabric2D XY-torus gate. Runs the 8-rank axis ring at
  # 55K and 512K global rows, then the 32-rank snake ring: exact-output accuracy plus
  # perf at matched per-device and matched global volume.
  #
  # The traced gate measures the 8-rank axis-ring shapes again through a captured ttnn trace, with the
  # cache slot and active gather extent read from metadata tensors on-device rather than from host
  # runtime arguments. Only it can catch a regression in that path -- a trace replay never re-runs the
  # host runtime-arg patch the scalar form depends on. It shares this job because the fabric bring-up
  # dominates the step, so a separate job would roughly double the cost of the same coverage.
  fabric_profile: torus_xy
  cmd: |
    export MESH_DEVICE=TG
    export TT_METAL_HIGH_BW_ALL_GATHER_RUN_32_RANK_ACCURACY=1

    mpirun --bind-to none --pernode --tag-output bash -lc '
      export OMP_NUM_THREADS=$(nproc)
      rc=0
      python3 -m pytest tests/ttnn/unit_tests/operations/experimental/test_high_bw_all_gather.py::test_high_bw_all_gather_galaxy_ci_perf -q || rc=1
      python3 -m pytest tests/ttnn/unit_tests/operations/experimental/test_high_bw_all_gather.py::test_high_bw_all_gather_galaxy_8x4_whole_mesh_accuracy -q || rc=1
      python3 -m pytest tests/ttnn/unit_tests/operations/experimental/test_high_bw_all_gather.py::test_high_bw_all_gather_galaxy_full_mesh_matched_local_perf -q || rc=1
      python3 -m pytest tests/ttnn/unit_tests/operations/experimental/test_high_bw_all_gather.py::test_high_bw_all_gather_galaxy_full_mesh_ci_perf -q || rc=1
      python3 -m pytest tests/ttnn/unit_tests/operations/experimental/test_high_bw_all_gather.py::test_high_bw_all_gather_galaxy_ci_perf_traced -q || rc=1
      exit $rc
    '
  test_type: high_bw_all_gather_perf
  test_tags: [ccl]
  test_group: sdpa_perf
  skus:
    bh_sc1_high_power:
      timeout: 20
      tier: 2
      release_ready: false
  owner_id: U085GDCAZTN # Pavle Josipovic
  team: ttnn
  budget_type: demo
  sp_config: sc1

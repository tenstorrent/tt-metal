# ===== Kimi-K3-2.8T ====================================================================================

- name: "(Kimi-K3-2.8T) contract gates, KDA 5k, MLA chunked 10k@5k and 55k@5k"
  # Four legs folded into one. Each ran well under the ~5.5 min "Setup multihost job" cost, so four
  # galaxy allocations were spending ~22 min of setup to run ~7 min of tests. Measured test-step
  # times on run 36717057668: 77 / 150 / 114 / 92 s.
  #
  # fabric_profile torus_xy is required by [2/4]..[4/4]. [1/4] is host-only -- no mesh device, no
  # fabric -- and rides along for free rather than paying its own setup. It keeps its mpirun wrapper:
  # the runner's container hook drives the step through its host-execution path and does not handle
  # a bare command (it failed 4 runs out of 4, 0 s in, before pytest ran).
  fabric_profile: torus_xy
  cmd: |
    # Sections run in order and the suite stops at the FIRST failure: a failed test can leave the
    # devices unreset, so the next section must not start (tt-metal#57706, enforced by
    # .github/scripts/utils/lint_pipeline_cmds.py). That is a real trade against the separate legs
    # this replaces -- a failure in an early section now masks the later ones.
    #
    # Each body is the leg's previous `cmd` verbatim, wrapped in a subshell with its mpirun bounded,
    # so it can be diffed against the leg it replaces. The subshell is load-bearing, not hygiene:
    # one of these sections deliberately sets no KIMI_K3_HF_MODEL and test_mla.py flips its `cpu`
    # reference case to pretrained weights when it sees that variable.

    k3_contracts() (
      timeout -k 2m 10m mpirun --bind-to none --pernode --tag-output bash -lc '
        set -e
        export LOGURU_LEVEL=INFO
        export TT_METAL_HOME=${TT_METAL_HOME:-$PWD}
        export PYTHONPATH=${TT_METAL_HOME}${PYTHONPATH:+:$PYTHONPATH}
        export KIMI_K3_HF_MODEL=/mnt/weka/model-weights/llm/moonshotai/Kimi-K3-mxfp4-2496450e
        export KIMI_K3_CKPT=/mnt/weka/model-weights/llm/moonshotai/Kimi-K3-dequantized
        python3 -m pytest -vvv --tb=short \
          models/demos/deepseek_v3_d_p/tests/kimi_k3/test_golden_contract.py \
          models/demos/deepseek_v3_d_p/tests/kimi_k3/test_layer_schedule.py \
          models/demos/deepseek_v3_d_p/tests/kimi_k3/test_cache_contract.py \
          models/demos/deepseek_v3_d_p/tests/kimi_k3/test_runtime_contract.py \
          models/demos/deepseek_v3_d_p/tests/kimi_k3/test_kda_golden.py \
          models/demos/deepseek_v3_d_p/tests/test_kv_ack.py \
          models/demos/deepseek_v3_d_p/tests/attn_res/model/test_attn_res_pipeline_split.py
      '
    )

    k3_kda() (
      timeout -k 2m 12m mpirun --bind-to none --pernode --tag-output bash -lc '
        set -e
        export OMP_NUM_THREADS=$(nproc)
        python3 -m pytest models/demos/deepseek_v3_d_p/tests/kda/layer/test_acceptance.py::test_synthetic_kimi_k3_accuracy_and_determinism -k "SP8xTP4" -vvv --tb=short
      '
    )

    k3_mla() (

      timeout -k 2m 12m mpirun --bind-to none --pernode --tag-output bash -lc '
        set -e
        export OMP_NUM_THREADS=$(nproc)
        uv pip install -r models/demos/deepseek_v3/reference/deepseek/requirements.txt
        python3 -m pytest models/demos/deepseek_v3_d_p/tests/test_mla.py::test_mla_chunked_prefill -k "k3 and torus-xy-8x4 and scalar and ((maxedge-1u and cpu and no_determinism) or (plain-5k and func and with_determinism))" -vvv --tb=short
      '
    )

    k3_mla_trace() (
      export KIMI_K3_HF_MODEL=/mnt/weka/model-weights/llm/moonshotai/Kimi-K3-mxfp4-2496450e

      timeout -k 2m 12m mpirun --bind-to none --pernode --tag-output bash -lc '
        export OMP_NUM_THREADS=$(nproc)
        uv pip install -r models/demos/deepseek_v3/reference/deepseek/requirements.txt
        python3 -m pytest models/demos/deepseek_v3_d_p/tests/test_mla.py::test_mla_chunked_prefill -k "k3 and production-50k+5k and trace and torus-xy-8x4 and scalar and no_determinism" -vvv --tb=short
      '
    )

    echo "===== [1/4] (Kimi-K3-2.8T) golden-contract, layer-schedule, cache and KV-ack gates ====="
    k3_contracts || exit $?
    echo "===== [2/4] (Kimi-K3-2.8T) KDA accuracy, determinism 5k SP8xTP4 ====="
    k3_kda || exit $?
    echo "===== [3/4] (Kimi-K3-2.8T) MLA chunked accuracy 10k@5k + determinism 5k@5k ====="
    k3_mla || exit $?
    echo "===== [4/4] (Kimi-K3-2.8T) MLA chunked accuracy 55k@5k vs golden trace ====="
    k3_mla_trace || exit $?
    echo "===== all 4 sections passed ====="
  test_type: k3_accuracy_suite

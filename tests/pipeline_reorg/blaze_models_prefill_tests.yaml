# ===== DeepSeek-V4 =====================================================================================

# DeepSeek-V4 suites: one job per SKU, one section per test, run serially on one allocation.
# * The perf suite stays on bh_sc1_high_power: its tests skip on other hosts.
# * Each section runs in its own subshell under `timeout -k 2m <N>m`; a timeout is a FAIL.
# * The first failed section ends the job with its exit code, and later sections report NOT RUN:
#   nothing resets the devices between sections (tt-metal#57706).
- name: "(DeepSeek-V4-Flash, DeepSeek-V4-Pro) HCA chunked accuracy 6k@5k + SWA chunked accuracy 55k@5k + teacher-forced block chunked accuracy 55k@5k + CSA chunked accuracy 13k@5k"
  fabric_profile: torus_xy
  cmd: |
    titles=(
      "(DeepSeek-V4-Flash) HCA chunked accuracy 6k@5k"
      "(DeepSeek-V4-Flash) SWA chunked accuracy 55k@5k"
      "(DeepSeek-V4) teacher-forced block chunked 55k@5k"
      "(DeepSeek-V4-Flash) CSA chunked accuracy 13k@5k"
      "(DeepSeek-V4-Pro) CSA chunked accuracy 13k@5k"
    )
    summary=""
    section_start() {
      sec_n=$1
      sec_title=${titles[$((sec_n - 1))]}
      sec_t0=$SECONDS
      echo "::group::[$sec_n/${#titles[@]}] $sec_title"
    }
    section_end() {
      local rc=$1 s=$((SECONDS - sec_t0)) st=PASS note=""
      echo "::endgroup::"
      if [ "$rc" -ne 0 ]; then st=FAIL; fi
      if [ "$rc" -eq 124 ]; then note=", timed out"; fi
      if [ "$rc" -eq 137 ]; then note=", killed"; fi
      local line="[$sec_n/${#titles[@]}] $st (exit $rc$note, $((s / 60)).$((s % 60 * 10 / 60)) min) $sec_title"
      echo "$line"
      summary+="$line"$'\n'
    }
    finish() {
      local j
      for ((j = sec_n + 1; j <= ${#titles[@]}; j++)); do
        summary+="[$j/${#titles[@]}] NOT RUN ${titles[$((j - 1))]}"$'\n'
      done
      echo "===== DeepSeek-V4 prefill suite summary ====="
      printf '%s' "$summary"
    }

    section_start 1
    (
      timeout -k 2m 6m mpirun --bind-to none --pernode --tag-output bash -lc '
        export OMP_NUM_THREADS=$(nproc)
        python3 -m pytest models/demos/deepseek_v3_d_p/tests/pcc/test_ttnn_hca.py::test_hca_chunked_prefill_mesh -k "flash and chunk5120-varying and torus-xy-8x4" -vvv --tb=short
      '
    ) || { rc=$?; section_end "$rc"; finish; exit "$rc"; }
    section_end 0

    section_start 2
    (
      timeout -k 2m 8m mpirun --bind-to none --pernode --tag-output bash -lc '
        export OMP_NUM_THREADS=$(nproc)
        python3 -m pytest models/demos/deepseek_v3_d_p/tests/pcc/test_ttnn_swa.py::test_swa_long_prefill_mesh -k "flash and mixed5120 and torus-xy-8x4" -vvv --tb=short
      '
    ) || { rc=$?; section_end "$rc"; finish; exit "$rc"; }
    section_end 0

    section_start 3
    (
      timeout -k 2m 12m mpirun --bind-to none --pernode --tag-output bash -lc '
        export OMP_NUM_THREADS=$(nproc)
        python3 -m pytest models/demos/deepseek_v3_d_p/tests/v4/test_block_chunked.py -k "(pro and L3-hca-topk) or (flash and L1-swa-hash)" -vvv --tb=short
      '
    ) || { rc=$?; section_end "$rc"; finish; exit "$rc"; }
    section_end 0

    # Production-width chunked CSA with the real sparse top-k: 5120+5120+3000 actual tokens, fixed
    # 5120 device width, and the variant's stock index_topk.
    section_start 4
    (
      timeout -k 2m 15m mpirun --bind-to none --pernode --tag-output bash -lc '
        export OMP_NUM_THREADS=$(nproc)
        python3 -m pytest models/demos/deepseek_v3_d_p/tests/pcc/test_ttnn_csa.py::test_csa_chunked_prefill_mesh -k "flash and 3chunk-production and torus-xy-8x4" -vvv --tb=short
      '
    ) || { rc=$?; section_end "$rc"; finish; exit "$rc"; }
    section_end 0

    section_start 5
    (
      timeout -k 2m 25m mpirun --bind-to none --pernode --tag-output bash -lc '
        export OMP_NUM_THREADS=$(nproc)
        python3 -m pytest models/demos/deepseek_v3_d_p/tests/pcc/test_ttnn_csa.py::test_csa_chunked_prefill_mesh -k "pro and 3chunk-production and torus-xy-8x4" -vvv --tb=short
      '
    ) || { rc=$?; section_end "$rc"; finish; exit "$rc"; }
    section_end 0

    finish
  test_type: dsv4_prefill_suite
  # Per-section tokens: `-f test-type=<token>` selects this job.
  test_tags: [dsv4_flash, dsv4_pro, hca, swa, csa, hca_chunked, swa_mixed, v4_block_chunked, csa_chunked, csa_chunked_pro]
  test_group: module
  skus:
    bh_sc1:
      # Sum of the section timeouts (6+8+12+15+25 = 66). No margin: models/demo/bh_sc1 in
      # .github/time_budget.yaml is full (1790/1790), so anything above 66 fails verify-time-budgets.
      timeout: 66
      tier: 2
      release_ready: false
  owner_id: U08SXRPCTJ5  # Janko Mitrovic
  team: models
  budget_type: demo
  sp_config: sc1



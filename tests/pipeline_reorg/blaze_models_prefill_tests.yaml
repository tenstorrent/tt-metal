# This file defines the test matrix for the Blaze Models Prefill tests pipeline.

# Each entry represents a parallel job with the following keys:
#   name: The display name for the job in GitHub Actions. Naming convention:
#         "<Model>-<version>-<size> <unit under test> <accuracy|perf|determinism> <shape>"
#         * Do NOT prefix with "Blaze - ": every job here is a Blaze job, so it carries no information.
#         * Name the model the test actually runs, with version AND parameter count -- "GLM-5.2-744B",
#           not "GLM"; "Kimi-K2.6-1T"/"Kimi-K2.7-1T"/"Kimi-K3-2.8T", not "Kimi". Multi-model jobs
#           follow the "&" rule below. Op-level jobs with no model (CCL, SDPA) name the op.
#         * Tag what is being gated: "accuracy" (PCC/golden compare), "perf", or "determinism".
#         * Chunked tests state total ISL and chunk size as <isl>@<chunk>, e.g. "code_debug 55k@5k".
#         * One separator, one meaning -- a job whose name reads several ways is the bug this
#           convention exists to prevent:
#             "+"  the distinct things this one job gates, each carrying its own shape
#                  -> "MoE accuracy 12.5k + perf 25k"
#             ","  peers sharing a qualifier; binds tighter than "+". Either direction:
#                  several shapes under one tag, or several tags under one shape
#                  -> "MLA accuracy 100k, 128k"      (two shapes, one tag)
#                  -> "ring MLA chunked 55k@5k perf, accuracy, determinism"  (one shape, three tags)
#             "&"  two models. At three or more the unit leads and the models move to a trailing
#                  "(...)" list, so the unit under test is not buried behind the model list
#                  -> "DeepSeek-V3-671B & Kimi-K2.6-1T MLA chunked accuracy 10k@5k"
#                  -> "KV cache table accuracy (DeepSeek-V3-671B, Kimi-K2.6-1T, GLM-5.2-744B)"
#             "/"  components of one pipeline, not a list of gated things
#                  -> "disaggregated prefill runner/producer"
#           Never leave a shape whose binding is ambiguous: "MoE accuracy + perf 25k" cannot say
#           whether 25k covers both tags, so give each tag its own shape or give neither one.
#   cmd: The exact command to run (env vars must be inlined).
#   test_type: Test type identifier for filtering (workflow_dispatch test-type selection).
#   test_group: Group identifier for selecting multiple related tests at once.
#   skus: A mapping of SKU names to their configuration (each SKU has timeout in minutes).
#   owner_id: The Slack user ID to notify on failure.
#   team: The team that owns the test.
#   sp_config: Supercluster configuration (sc1) to run this test on.

# For max allowed timeout refer to .github/time_budget.yaml

# Galaxy-Blaze setup validates each allocation, then the reusable workflow maps
# `fabric_profile: torus_xy` to the production TorusXY descriptor and certification environment.

# Blackhole Galaxy DeepSeek Prefill tests
- name: "DeepSeek-V3-671B MoE gate accuracy"
  fabric_profile: torus_xy
  cmd: |
    export DEEPSEEK_V3_HF_MODEL=/mnt/models/DeepSeek-R1-0528-fp8-4236a6af/
    export DEEPSEEK_V3_CACHE=/mnt/models/DeepSeek-R1-0528-Cache/CI
    export TT_DS_PREFILL_TTNN_CACHE=/mnt/models/DeepSeek-R1-0528-Cache/DeepSeek-R1-0528-Cache-prefill_secure
    export TT_DS_PREFILL_HOST_REF_CACHE=/mnt/models/deepseek-prefill-cache/golden/
    export DEEPSEEK_V3_TRACE_DIR=/mnt/models/deepseek-prefill-cache

    mpirun --bind-to none --pernode --tag-output bash -lc '
      set -e
      export OMP_NUM_THREADS=$(nproc)
      uv pip install -r models/demos/deepseek_v3/reference/deepseek/requirements.txt
      python3 -m pytest models/demos/deepseek_v3_d_p/tests/pcc/test_moe_gate_prefill2d.py -k "torus-xy-8x4"
    '
  test_type: moe_gate
  test_group: module
  skus:
    bh_sc1:
      timeout: 14
  owner_id: U08RL15T4N8
  team: models
  sp_config: sc1


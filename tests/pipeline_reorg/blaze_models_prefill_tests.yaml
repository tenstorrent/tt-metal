# This file defines the test matrix for the Blaze Models Prefill tests pipeline.

# Each entry represents a parallel job with the following keys:
#   name: The display name for the job in GitHub Actions. Naming convention:
#         "(<Models>) <unit under test> <accuracy|perf|determinism> <shape>"
#         * The model list LEADS, in parentheses, always -- one convention, not two. Comma-separate
#           any number of them: "(Kimi-K2.7-1T)", "(Kimi-K2.7-1T, GLM-5.3-744B)". This keeps the
#           models in one place and lets the unit under test read left-to-right after them.
#         * Do NOT prefix with "Blaze - ": every job here is a Blaze job, so it carries no information.
#         * Name the model the test actually runs, with version AND parameter count -- "GLM-5.3-744B",
#           not "GLM"; "Kimi-K2.7-1T"/"Kimi-K3-2.8T", not "Kimi". A job covering every
#           gate model says so: "(all prefill gate models)".
#         * Op-level jobs with no model take NO leading parenthesis and name the op instead
#           -> "high_bw_all_gather CCL perf + accuracy"
#         * Tag what is being gated: "accuracy" (PCC/golden compare), "perf", or "determinism".
#         * Chunked tests state total ISL and chunk size as <isl>@<chunk>, e.g. "code_debug 55k@5k".
#         * Nothing else goes in parentheses -- the leading "(...)" is the model list and only that,
#           so a qualifier is trailing prose: "... 55k@5k vs golden trace", "... 55k@5k, SC4".
#         * No "/" in a name. The impl workflow uses the name verbatim as the test-log path and as
#           the log/triage artifact names, so a slash buries the log in a subdirectory the console-echo
#           glob misses and makes both uploads fail. Hyphenate, or drop the component list.
#         * One separator, one meaning -- a job whose name reads several ways is the bug this
#           convention exists to prevent:
#             "+"  the distinct things this one job gates, each carrying its own shape
#                  -> "(GLM-5.3-744B) MoE accuracy 12.5k + perf 25k"
#             ","  peers sharing a qualifier; binds tighter than "+". Either direction:
#                  several shapes under one tag, or several tags under one shape
#                  -> "(DeepSeek-V3-671B) MLA accuracy 100k, 128k"   (two shapes, one tag)
#                  -> "ring MLA chunked 55k@5k perf, accuracy, determinism"  (one shape, three tags)
#         * Entries are grouped by model in file order, in the same order the name reads: a
#           cross-model section first, then one section per model, then op-level jobs. Keep a new
#           entry inside its model's section rather than appending it at the end.
#   cmd: The exact command to run (env vars must be inlined).
#   test_type: Test type identifier for filtering (workflow_dispatch test-type selection).
#   test_group: Group identifier for selecting multiple related tests at once.
#   test_tags: Optional list of coarse selectors for workflow_dispatch, matched exactly and
#              OR-ed with test_type / test_group. Two vocabularies in one list: the model a
#              leg covers (kimi_k2_7, kimi_k3, glm_5_3, dsv4_flash, dsv4_pro, minimax_m3)
#              and the unit under test (moe, gate, mla, hca, swa, csa, sdpa, ccl, block, transformer,
#              kv_cache, dflash, mtp, runner, determinism). So `moe` runs every MoE leg and `kimi_k3`
#              every K3 leg. Multiple tokens UNION, they do not intersect: `moe,kimi_k3` is every MoE
#              leg plus every K3 leg, not the K3 MoE legs.
#   skus: A mapping of SKU names to their configuration:
#     timeout: Job timeout in minutes.
#     tier: Model tier (1, 2, or 3) used to filter which pipeline runs this test.
#     release_ready: Whether this SKU leg is included in package-and-release (default false).
#   owner_id: The Slack user ID to notify on failure.
#   team: The team that owns the test.
#   sp_config: Supercluster configuration (sc1) to run this test on.

# For max allowed timeout refer to .github/time_budget.yaml

# Galaxy-Blaze setup validates each allocation, then the reusable workflow maps
# `fabric_profile: torus_xy` to the production TorusXY descriptor and certification environment.

# Blackhole Galaxy DeepSeek Prefill tests

# ===== Cross-model =====================================================================================

- name: "(all prefill gate models) MoE gate accuracy"
  fabric_profile: torus_xy
  cmd: |
    export DEEPSEEK_V3_HF_MODEL=/mnt/models/blaze/deepseek-ai/DeepSeek-R1-0528/
    export DEEPSEEK_V3_CACHE=/mnt/models/DeepSeek-R1-0528-Cache/CI
    export TT_DS_PREFILL_TTNN_CACHE=/mnt/models/DeepSeek-R1-0528-Cache/DeepSeek-R1-0528-Cache-prefill_secure
    export TT_DS_PREFILL_HOST_REF_CACHE=/mnt/models/deepseek-prefill-cache/golden/
    export DEEPSEEK_V3_TRACE_DIR=/mnt/models/deepseek-prefill-cache

    mpirun --bind-to none --pernode --tag-output bash -lc '
      set -e
      export OMP_NUM_THREADS=$(nproc)
      uv pip install -r models/demos/deepseek_v3/reference/deepseek/requirements.txt
      python3 -m pytest models/demos/deepseek_v3_d_p/tests/pcc/test_moe_gate_prefill2d.py -k "torus-xy-8x4"
    '
  test_type: moe_gate
  test_tags: [moe, gate]
  test_group: module
  skus:
    bh_sc1:
      timeout: 28
      tier: 2
      release_ready: false
  owner_id: U08RL15T4N8 # Danilo Djekic
  team: models
  budget_type: demo
  sp_config: sc1


# ===== Kimi-K2.7-1T ====================================================================================

- name: "(Kimi-K2.7-1T) MLA chunked, MoE, transformer + block determinism and DFlash accuracy 5k"
  fabric_profile: torus_xy
  cmd: |
    kimi_mla_chunked() (
      timeout -k 2m 22m mpirun --bind-to none --pernode --tag-output bash -lc '
        set -e
        export OMP_NUM_THREADS=$(nproc)
        uv pip install -r models/demos/deepseek_v3/reference/deepseek/requirements.txt
        python3 -m pytest models/demos/deepseek_v3_d_p/tests/test_mla.py::test_mla_chunked_prefill -k "k2_7 and torus-xy-8x4 and ((maxedge-1u and cpu and no_determinism) or (plain-5k and func and with_determinism and scalar))" -vvv --tb=short
      '
    )

    kimi_moe() (
      timeout -k 2m 48m mpirun --bind-to none --pernode --tag-output bash -lc '
        export OMP_NUM_THREADS=$(nproc)
        python3 -m pytest models/demos/deepseek_v3_d_p/tests/pcc/test_ttnn_moe.py::test_kimi_moe -k "torus-xy-8x4 and kimi-5k-pcc" -vvv --tb=short
      '
    )

    kimi_prefill_transformer_determinism() (
      export MESH_DEVICE=TG
      export KIMI_K2_7_HF_MODEL=/mnt/weka/model-weights/llm/moonshotai/Kimi-K2.7-Code-dequantized
      export TT_KIMI_PREFILL_TTNN_CACHE=/mnt/weka/model-cache/scratch/moonshotai/Kimi-K2_7-Code-Cache/Kimi-K2_7-Code-Cache-prefill

      timeout -k 2m 30m mpirun --bind-to none --pernode --tag-output bash -lc '
        set -e
        export OMP_NUM_THREADS=$(nproc)
        python3 -m pytest models/demos/deepseek_v3_d_p/tests/test_prefill_transformer.py::test_kimi_prefill_transformer -k "torus-xy-8x4 and 5_layers and e384_device and 5k and not 25k and iter2 and not iter25 and not iter2000 and smoke and with_determinism and non_balanced and right_pad and json_prompts and pretrained" -vvv --tb=short --timeout=3600
      '
    )

    kimi_dflash() (
      export MESH_DEVICE=TG
      export DFLASH_HF_MODEL=/mnt/models/blaze/closed_do_not_share/Kimi-K2.7-Code-DFlash

      timeout -k 2m 18m mpirun --bind-to none --pernode --tag-output bash -lc '
        export OMP_NUM_THREADS=$(nproc)
        python3 -m pytest models/demos/deepseek_v3_d_p/tests/dflash_prefill/test_dflash.py::test_dflash_pcc -k "torus-xy-8x4 and pretrained and ctx5k-1chunk" -vvv --tb=short --timeout=1200
        python3 -m pytest models/demos/deepseek_v3_d_p/tests/dflash_prefill/test_dflash.py::test_dflash_multiturn_pcc -k "torus-xy-8x4 and pretrained and (aligned_min or midchip_straddle or lastchip or rot_partial)" -vvv --tb=short
        python3 -m pytest models/demos/deepseek_v3_d_p/tests/dflash_prefill/test_dflash_trace.py -vvv --tb=short
      '
    )

    kimi_prefill_block_determinism() (
      export MESH_DEVICE=TG
      export KIMI_K2_7_HF_MODEL=/mnt/weka/model-weights/llm/moonshotai/Kimi-K2.7-Code-dequantized
      export TT_KIMI_PREFILL_TTNN_CACHE=/mnt/weka/model-cache/scratch/moonshotai/Kimi-K2_7-Code-Cache/Kimi-K2_7-Code-Cache-prefill
      export PREFILL_TRACE_DIR=/mnt/weka/model-cache/stable/deepseek-prefill-cache/golden/structured_traces/vllm-kimi-k27-codedebug-56320

      timeout -k 2m 24m mpirun --bind-to none --pernode --tag-output bash -lc '
        set -e
        export OMP_NUM_THREADS=$(nproc)
        python3 -m pytest models/demos/deepseek_v3_d_p/tests/test_prefill_block_chunked.py::test_kimi_prefill_block_chunked -k "torus-xy-8x4 and chunks2 and with_determinism and iter2" -vvv --tb=short --timeout=900'
    )

    echo "===== [1/5] (Kimi-K2.7-1T) MLA chunked accuracy 10k@5k + determinism 5k ====="
    kimi_mla_chunked || exit $?
    echo "===== [2/5] (Kimi-K2.7-1T) MoE accuracy 5k ====="
    kimi_moe || exit $?
    echo "===== [3/5] (Kimi-K2.7-1T) prefill transformer determinism 5k ====="
    kimi_prefill_transformer_determinism || exit $?
    echo "===== [4/5] (Kimi-K2.7-1T) DFlash drafter accuracy ====="
    kimi_dflash || exit $?
    echo "===== [5/5] (Kimi-K2.7-1T) prefill block determinism 5k ====="
    kimi_prefill_block_determinism || exit $?
    echo "===== all 5 sections passed ====="
  test_type: kimi_components_suite
  test_tags: [kimi_k2_7, mla, moe, transformer, block, determinism, dflash, mla_chunked, kimi_moe, prefill_transformer_determinism, kimi_dflash, prefill_block_determinism]
  test_group: module
  skus:
    bh_sc1:
      timeout: 142
      tier: 2
      release_ready: false
  owner_id: U08RL15T4N8 # Danilo Djekic
  team: models
  budget_type: demo
  sp_config: sc1


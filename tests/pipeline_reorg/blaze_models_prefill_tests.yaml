# ===== Op-level, no model under test ===================================================================

# Ring joint SDPA gates, over ModelConfig shape presets on random tensors (not model runs):
#   joint-attention perf -> wan2_2_1xGLX and mla_100k
#   ring_mla chunked     -> kimi50k and kimi_k3 for perf; kimi_k3 for accuracy and determinism
# Uses real-time device program records, so it runs on the plain build without ENABLE_TRACY.
# sp/tp are auto-selected by MeshConfig.detect() on Galaxy (sp=8, tp=4).

# 4-galaxy (SC4) disaggregated prefill for Kimi-K3: all 93 layers as 24/24/24/21. Four ranks, not
# two: ~717 MiB/chip/layer against 31.85 GiB/chip OOMs during weight load at 46/47 per rank, and
# MLA's static CBs become unplaceable past ~36 layers on a rank (#54876). Every boundary is a
# multiple of ATTN_RES_BLOCK_SIZE=12, or a rank inherits a partial sealed set and its local layer 0
# seals a block that is not there; the adapter's layer_split_boundaries snaps the even split there,
# so PREFILL_PP_LAYER_COUNTS is deliberately not pinned here.
# Fabric comes from the manifest and the descriptor from run_multirank_pcc.sh, so this leg carries
# no fabric_profile -- same as the Kimi-K2.7 and GLM-5.3 disagg legs beside it.
# Traced, and the request runs to 1M like GLM-5.3's: only the 55k the golden spans is PCC'd, the
# tail is timed. Its throughput lands on the run page through the "(Kimi-K3-2.8T) disaggregated
# prefill SC4 perf" summary job.
# Own test_type per rung, unlike the Kimi-K2.7 and GLM-5.3 pairs that share prefill_runner_kv_pcc:
# four galaxies is the scarcest resource in the pool, so this leg has to be dispatchable without
# also claiming a single-galaxy one. The `runner` and `kv_cache` tags still select both rungs.
- name: "(Kimi-K3-2.8T) disaggregated prefill KV accuracy 55k@5k + perf 1M@5k, SC4"
  cmd: |
    set -euo pipefail
    export TT_METAL_HOME="${TT_METAL_HOME:-/home/user/tt-metal}"
    if [ ! -f "${TT_METAL_HOME}/ttnn/ttnn/distributed/ttrun.py" ]; then
      cp -rn /ci/tt-metal/. "${TT_METAL_HOME}/"
    fi
    cd "${TT_METAL_HOME}"
    exec bash models/demos/common/prefill/runners/ci/run_multirank_pcc.sh kimi_k3
  test_type: k3_prefill_runner_93l
  test_tags: [kimi_k3, runner, kv_cache]
  test_group: disagg_prefill
  skus:
    bh_sc4:
      # Weight load dominates and it is NFS-bandwidth-bound, not compute-bound: the TTNN cache is
      # 1.5 TB of tensorbins on the models share and all four ranks stream their slice of it at once,
      # so the phase runs at roughly line rate and its cost swings with whatever else is on the mount.
      # Two measurements, both from test-step start to all four ranks serving: 42.6 min on run
      # 34648535999, 65.9 min on run 34659612357 (rank 0 alone spent 54.2 min loading its 24 layers).
      # After that comes the producer connect, 11 chunks of 5120, the KV read-back and a ~7 min mesh
      # unwind. 45 min cut this off mid-bringup and 70 min cut it off six minutes after bringup.
      # 100 was still too tight: run 34831600450 was killed at 106 min with the leg live. Doubled,
      # matching the 2x pass #56135 applied to the rest of this pipeline. shield/demo bh_sc4
      # is a SUM over the team's legs on that SKU, not a per-leg cap: 40 (Kimi-K2.7) + 60 (GLM-5.3) + 60 (DFlash) + 200.
      timeout: 200
      tier: 1
      release_ready: false
  owner_id: U0ACLAM77PS  # Kosta Grujcic
  team: shield
  budget_type: demo
  sp_config: sc4


# Single-galaxy rung of the same launcher. 93 layers do not fit one galaxy, so the sc1 arm overrides

# decoder-output stream covers, making this a real accuracy gate rather than a smaller copy of sc4.
# Traced like sc4, and timed to 250k like the other sc1 legs; 24 layers are no baseline for 93, so
# its numbers stay in this job's log and out of the sc4 summary.
- name: "(Kimi-K3-2.8T) disaggregated prefill L24 KV accuracy 55k@5k + perf 250k@5k, SC1"
  cmd: |
    set -euo pipefail
    export TT_METAL_HOME="${TT_METAL_HOME:-/home/user/tt-metal}"
    if [ ! -f "${TT_METAL_HOME}/ttnn/ttnn/distributed/ttrun.py" ]; then
      cp -rn /ci/tt-metal/. "${TT_METAL_HOME}/"
    fi
    cd "${TT_METAL_HOME}"
    # Below the job timeout on purpose: at the script default of 3600 the wait outlives the leg,
    # so a bringup that never finishes is reported as a job kill with no diagnostic.
    export TABLE_WAIT_SECS=2400
    exec bash models/demos/common/prefill/runners/ci/run_multirank_pcc.sh kimi_k3 sc1
  test_type: k3_prefill_runner_24l
  test_tags: [kimi_k3, runner, kv_cache]
  test_group: disagg_prefill
  skus:
    bh_sc1_high_power:
      # 30 killed the leg at 38 min on run 34831600450, mid-bringup.
      timeout: 60
  owner_id: U0ACLAM77PS  # Kosta Grujcic
  team: shield

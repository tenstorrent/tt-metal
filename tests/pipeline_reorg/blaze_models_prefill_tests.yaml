- name: "(Kimi-K3-2.8T) prefill transformer L24, chunked L24 and traced L24 vs golden trace"
  # Three legs folded into one. None is short, but each paid its own ~5.5 min "Setup multihost job"
  # and all three carry identical environments -- same checkpoint, same TTNN cache, same mesh
  # descriptor -- so three allocations bought nothing. Measured test-step times on run 36717057668:
  # 479 / 725 / 368 s.
  #
  # No fabric_profile, as before: the fabric comes from each test's own device_params, and adding
  # the key here would swap the mesh descriptor and change nothing else.
  #
  # [3/3] is the only K3 PCC gate on the captured-trace path rather than eager, and its
  # TT_KIMI_K3_PREFILL_TTNN_CACHE export is load-bearing: conftest's `weight_cache_path` fixture
  # reads `variant.ttnn_cache_env` and nothing else, with no fallback to the share, so without it
  # the fixture points at the checkpoint dir and the section dies on `TTNN cache incomplete`.
  cmd: |
    # Sections run in order and the suite stops at the FIRST failure: a failed test can leave the
    # devices unreset, so the next section must not start (tt-metal#57706, enforced by
    # .github/scripts/utils/lint_pipeline_cmds.py). That is a real trade against the separate legs
    # this replaces -- a failure in an early section now masks the later ones.
    #
    # Each body is the leg's previous `cmd` verbatim, wrapped in a subshell with its mpirun bounded,
    # so it can be diffed against the leg it replaces. All three sections here happen to export the
    # same environment, so the subshell is only keeping them independent -- unlike the accuracy suite
    # above, where it is load-bearing because one section must NOT see another's KIMI_K3_HF_MODEL.
    # Repeating the exports per section rather than hoisting them is what keeps each body verbatim.

    k3_transformer_depth() (
      export LOGURU_LEVEL=INFO
      export TT_METAL_HOME=${TT_METAL_HOME:-$PWD}
      export PYTHONPATH=${TT_METAL_HOME}${PYTHONPATH:+:$PYTHONPATH}
      export KIMI_K3_HF_MODEL=/mnt/weka/model-weights/llm/moonshotai/Kimi-K3-mxfp4-2496450e
      export KIMI_K3_CKPT=/mnt/weka/model-weights/llm/moonshotai/Kimi-K3-dequantized
      export TT_KIMI_K3_PREFILL_TTNN_CACHE=/mnt/weka/model-cache/scratch/moonshotai/Kimi-K3-Cache/Kimi-K3-Cache-prefill
      export TT_MESH_GRAPH_DESC_PATH=$TT_METAL_HOME/tt_metal/fabric/mesh_graph_descriptors/single_bh_galaxy_mesh_graph_descriptor.textproto
      timeout -k 2m 70m mpirun --bind-to none --pernode --tag-output bash -lc '
        export OMP_NUM_THREADS=$(nproc)
        python3 -m pytest models/demos/deepseek_v3_d_p/tests/kimi_k3/test_transformer_depth.py -k "L24" -vvv --tb=short
      '
    )

    k3_chunked_prefill() (
      export LOGURU_LEVEL=INFO
      export TT_METAL_HOME=${TT_METAL_HOME:-$PWD}
      export PYTHONPATH=${TT_METAL_HOME}${PYTHONPATH:+:$PYTHONPATH}
      export KIMI_K3_HF_MODEL=/mnt/weka/model-weights/llm/moonshotai/Kimi-K3-mxfp4-2496450e
      export KIMI_K3_CKPT=/mnt/weka/model-weights/llm/moonshotai/Kimi-K3-dequantized
      export TT_KIMI_K3_PREFILL_TTNN_CACHE=/mnt/weka/model-cache/scratch/moonshotai/Kimi-K3-Cache/Kimi-K3-Cache-prefill
      export TT_MESH_GRAPH_DESC_PATH=$TT_METAL_HOME/tt_metal/fabric/mesh_graph_descriptors/single_bh_galaxy_mesh_graph_descriptor.textproto
      timeout -k 2m 90m mpirun --bind-to none --pernode --tag-output bash -lc '
        export OMP_NUM_THREADS=$(nproc)
        python3 -m pytest models/demos/deepseek_v3_d_p/tests/kimi_k3/test_chunked_prefill.py -k "L24" -vvv --tb=short
      '
    )

    k3_transformer_traced() (
      export LOGURU_LEVEL=INFO
      export TT_METAL_HOME=${TT_METAL_HOME:-$PWD}
      export PYTHONPATH=${TT_METAL_HOME}${PYTHONPATH:+:$PYTHONPATH}
      export KIMI_K3_HF_MODEL=/mnt/weka/model-weights/llm/moonshotai/Kimi-K3-mxfp4-2496450e
      export KIMI_K3_CKPT=/mnt/weka/model-weights/llm/moonshotai/Kimi-K3-dequantized
      export TT_KIMI_K3_PREFILL_TTNN_CACHE=/mnt/weka/model-cache/scratch/moonshotai/Kimi-K3-Cache/Kimi-K3-Cache-prefill
      export TT_MESH_GRAPH_DESC_PATH=$TT_METAL_HOME/tt_metal/fabric/mesh_graph_descriptors/single_bh_galaxy_mesh_graph_descriptor.textproto
      timeout -k 2m 45m mpirun --bind-to none --pernode --tag-output bash -lc '
        export OMP_NUM_THREADS=$(nproc)
        python3 -m pytest models/demos/deepseek_v3_d_p/tests/test_prefill_transformer_chunked.py::test_kimi_k3_prefill_transformer_chunked -k "L24 and chunks_eleven and traced and iters1 and no_determinism" -vvv --tb=short
      '
    )

    echo "===== [1/3] (Kimi-K3-2.8T) prefill transformer accuracy L24 vs golden trace ====="
    k3_transformer_depth || exit $?
    echo "===== [2/3] (Kimi-K3-2.8T) chunked prefill accuracy L24 55k@5k vs golden trace ====="
    k3_chunked_prefill || exit $?
    echo "===== [3/3] (Kimi-K3-2.8T) traced chunked prefill accuracy L24 55k@5k vs golden trace ====="

# ===== Mistral-Small-4-119B ============================================================================

# Mistral-Small-4-119B suite: one section per test, run serially on one allocation.
# * Every section runs regardless of earlier failures; the job exits non-zero if ANY section failed.
#   Each section is `( ... ) || rc=$?`: the `||` keeps the outer `bash -eo pipefail` (run-with-log)
#   from aborting, and the subshell keeps a section's exports out of the others.
# * No entry-level fabric_profile: sections [2/7], [6/7], [7/7] export the TorusXY variables the
#   impl's "Configure TorusXY fabric profile" step would set; the others run without them.
# * Each section is bounded by `timeout -k 2m <N>m`; a timeout is a FAIL and the next section still
#   runs. A hang can leave the device wedged for later sections; they still run and report.
#
# Per-section notes:
# [1/7] MLA + llama4 query scale, 20 min. Carries the llama4 query-temperature tests: Mistral's query
#       scale is why this model needs bespoke MLA handling. The tests/torch/ reference and
#       test_llama4_scale_cache.py are host-only (the latter stubs the mesh device and asserts the
#       shared query-scale dict reaches every layer). Each pytest runs regardless; any failure fails
#       the section.
# [2/7] MLA chunked, 44 min: 13 scenarios; relies on the staged weight cache.
# [3/7] Prefill block, 40 min: PROVISIONAL, size from CI. The `-k` pins the two PCC rows, random and
#       pretrained, at iter1; the full matrix is 24 runnable rows.
# [4/7] MoE, 20 min: 5k and 25k rows.
# [5/7] Prefill transformer, 28 min: full-model PCC gated per stage on npcc.
# [6/7] Chunked padded no trace, 52 min: L36/full55k (18 chunks x 35 layers, each a host readback).
#       56,320-token host-generated golden (torch/HF reference, not a vLLM recording), so it localises
#       per layer but is not independent of the reference. Its decoder gate is the only assertion in
#       [6/7] or [7/7] covering layers past GATED_LAYER_DEPTH (10) -- shorten it before deleting it.
#       Decoder outputs gate on nPCC (adapter.gate_hidden_states_on_npcc). PREFILL_TRACE_DIR is
#       deliberately unexported: the adapter's default points at the staged golden.
# [7/7] Chunked padded trace, 20 min: trace twin of [6/7] -- same splits, golden and KV bar; the
#       padded forward is captured once and replayed per chunk. A separate section so a trace-only
#       regression is attributed on its own line. Asserts KV only, gated to layers 0..10 (the
#       per-layer decoder readback cannot live inside a capture), and is the only section exercising
#       ChunkMetadata.llama4_scale.
- name: "(Mistral-Small-4-119B) MLA, MLA chunked, block, MoE, transformer + chunked padded accuracy"
  cmd: |
    fail=0
    summary=""
    section_start() {
      sec_n=$1
      sec_title=$2
      sec_t0=$SECONDS
      echo "::group::[$sec_n/7] $sec_title"
    }
    section_end() {
      local rc=$1 s=$((SECONDS - sec_t0)) st=PASS note=""
      echo "::endgroup::"
      if [ "$rc" -ne 0 ]; then st=FAIL; fail=1; fi
      if [ "$rc" -eq 124 ]; then note=", timed out"; fi
      if [ "$rc" -eq 137 ]; then note=", killed"; fi
      local line="[$sec_n/7] $st (exit $rc$note, $((s / 60)).$((s % 60 * 10 / 60)) min) $sec_title"
      echo "$line"
      summary+="$line"$'\n'
    }

    section_start 1 "Mistral-Small-4-119B MLA accuracy 5k, 25k + llama4 query scale"
    rc=0
    (
      export MISTRAL4_HF_MODEL=/mnt/models/blaze/mistralai/Mistral-Small-4-119B-2603
      export MISTRAL4_MLA_REF_CACHE=/mnt/models/blaze/mistralai/Mistral-Small-4-Cache/mla_ref

      timeout -k 2m 20m mpirun --bind-to none --pernode --tag-output bash -lc '
        rc=0
        export OMP_NUM_THREADS=$(nproc)
        python3 -m pytest models/demos/deepseek_v3_d_p/tests/test_mla.py::test_mistral_small4_mla -vvv --tb=short || rc=1
        python3 -m pytest models/demos/deepseek_v3_d_p/tests/test_mla.py -k "llama4" -vvv --tb=short || rc=1
        python3 -m pytest models/demos/deepseek_v3_d_p/tests/torch/test_mistral_small_4_mla_reference.py -vvv --tb=short || rc=1
        python3 -m pytest models/demos/deepseek_v3_d_p/tests/test_llama4_scale_cache.py -vvv --tb=short || rc=1
        exit $rc
      '
    ) || rc=$?
    section_end "$rc"

    section_start 2 "Mistral-Small-4-119B MLA chunked accuracy 5k@5k, 25k@5k"
    rc=0
    (
      export TT_MESH_GRAPH_DESC_PATH=/home/user/tt-metal/tt_metal/fabric/mesh_graph_descriptors/single_bh_galaxy_torus_xy_graph_descriptor.textproto
      export PREFILL_TORUS_XY_CERTIFIED=1

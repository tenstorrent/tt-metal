      if [ "$rc" -eq 124 ]; then note=", timed out"; fi
      if [ "$rc" -eq 137 ]; then note=", killed"; fi
      local line="[$sec_n/${#titles[@]}] $st (exit $rc$note, $((s / 60)).$((s % 60 * 10 / 60)) min) $sec_title"
      echo "$line"
      summary+="$line"$'\n'
    }
    finish() {
      local j
      for ((j = sec_n + 1; j <= ${#titles[@]}; j++)); do
        summary+="[$j/${#titles[@]}] NOT RUN ${titles[$((j - 1))]}"$'\n'
      done
      echo "===== DeepSeek-V4 prefill perf suite summary ====="
      printf '%s' "$summary"
    }

    section_start 1
    (
      timeout -k 2m 6m mpirun --bind-to none --pernode --tag-output bash -lc '
        export OMP_NUM_THREADS=$(nproc)
        python3 -m pytest models/demos/deepseek_v3_d_p/tests/perf/test_ttnn_hca_perf.py -k "flash and torus-xy-8x4" -vvv --tb=short
      '
    ) || { rc=$?; section_end "$rc"; finish; exit "$rc"; }
    section_end 0

    section_start 2
    (
      timeout -k 2m 6m mpirun --bind-to none --pernode --tag-output bash -lc '
        export OMP_NUM_THREADS=$(nproc)
        python3 -m pytest models/demos/deepseek_v3_d_p/tests/perf/test_ttnn_swa_perf.py -k "flash and torus-xy-8x4" -vvv --tb=short
      '
    ) || { rc=$?; section_end "$rc"; finish; exit "$rc"; }
    section_end 0

    finish
  test_type: dsv4_prefill_perf_suite
  # Per-section tokens: `-f test-type=<token>` selects this job.
  test_tags: [dsv4_flash, hca, swa, hca_perf, swa_perf]

# MoE dispatch/combine op coverage. Only the "// 4" expert-scaledown params are selectable on a
# 32-chip mesh: the "-pcc" params divide 128 experts by 16, giving 8 experts over 32 chips = 0
# experts/chip and a ZeroDivisionError in tt/moe/init_helpers.py:245. That is pre-existing and
# model-independent (the dsv3 baseline fails identically), and the <=8-chip meshes those params
# want cannot be opened on a Blackhole galaxy at all.
- name: "Mistral4 MoE Dispatch/Combine Ops"
  cmd: |
    rc=0
    mpirun --bind-to none --pernode --tag-output bash -lc '
      export OMP_NUM_THREADS=$(nproc)
      python3 -m pytest models/demos/deepseek_v3_d_p/tests/op_unit_tests/test_ttnn_dispatch_combine.py -k "mistral4-640-avg" -vvv --tb=short
    ' || rc=1
    mpirun --bind-to none --pernode --tag-output bash -lc '
      export OMP_NUM_THREADS=$(nproc)
      python3 -m pytest models/demos/deepseek_v3_d_p/tests/op_unit_tests/test_prefill_dispatch.py -k "mistral4-perf_no_pcc and 8x4" -vvv --tb=short
    ' || rc=1
    exit $rc
  test_type: mistral4_moe_ops
  test_group: module
  skus:

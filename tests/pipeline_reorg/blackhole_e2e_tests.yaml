# --- deepseek_prefill ---
- id: bh-lb-deepseek-prefill
  name: bh_lb_DeepSeek_PREFILL
  model-name: deepseek_prefill
  cmd: |
    exit_code=0
    export DEEPSEEK_V3_HF_MODEL=/mnt/MLPerf/huggingface/hub/models--deepseek-ai--DeepSeek-R1-0528
    # K3 has dedicated production Galaxy coverage. Keep this pre-existing LoudBox matrix at 65
    # rather than admitting the imported K3 gate/shared-expert and four 896-expert MoE rows.
    EXPECT_NUM_TESTS=65 pytest models/demos/deepseek_v3_d_p/tests/pcc/ -vvv --tb=short -k "(fabric2d-mesh-4x2 or fabric2d-mesh-2x4 or fabric2d-2x4) and not k3 and not matmul_pcc and not perf-host-64 and not pad50" --timeout 1800 || exit_code=$?
    EXPECT_NUM_TESTS=4 pytest models/demos/deepseek_v3_d_p/tests/test_mla.py::test_ds_mla -k "fabric2d-2x4 and random and scaled_sl and check_pcc" -vvv --tb=short || exit_code=$?
    EXPECT_NUM_TESTS=3 pytest models/demos/deepseek_v3_d_p/tests/test_prefill_block.py::test_ds_prefill_block -k "balanced and not non_balanced and fabric2d-mesh-2x4 and random and not pretrained and not host_gate_all and ((pcc-abc_1k and dense and no_determinism and iter1) or (smoke-random and with_determinism and iter2 and not iter25 and not iter2000 and (dense or moe-gate_device)))" -vvv --tb=short --timeout=900 || exit_code=$?
    EXPECT_NUM_TESTS=8 pytest models/demos/deepseek_v3_d_p/tests/test_prefill_block_loop.py -k "fabric2d-mesh-2x4-2link and layer0 and device and not isl_2k56 and not isl_12k8" -vvv --tb=short || exit_code=$?
    exit $exit_code
  skus:
    bh_loudbox:
      timeout: 117
  owner_id: U08E1JCMAJF # Marko Bezulj
  team: models

- id: bh-lb-deepseek-dsa
  name: bh_lb_DeepSeek_DSA
  model-name: deepseek_prefill
  cmd: |
    exit_code=0
    export DEEPSEEK_V3_HF_MODEL=/mnt/MLPerf/tt_dnn-models/deepseek-ai/DeepSeek-R1-0528
    export DEEPSEEK_V32_MLA_REF_CACHE=/tmp/deepseek_v32_mla_ref_cache GLM52_MLA_REF_CACHE=/tmp/glm_5_2_mla_ref_cache
    export DS_SPARSE_FABRIC=fabric2d
    # Sparse MLA (V3.2 + GLM-5.2) vs MLACPU. Random weights + on-the-fly CPU truth -> no staged weights.
    # GLM-5.2 reshards heads->sequence in _sparse_mla so it now runs at tp=4; 2x4 is its coverage (accuracy
    # + the determinism/chunked anchor cases, which pin to the highest-TP mesh). DeepSeek-V3.2 covers the
    # asymmetric 2x4 mesh (its 8x4 coverage is on Galaxy). The sparse suite carries no tier markers, so
    # there is no -m gate.
    EXPECT_NUM_TESTS=8 pytest models/demos/deepseek_v3_d_p/tests/sparse_mla/test_sparse_mla.py -k "glm_5_2 and 2x4 and fabric2d" -vvv --tb=short || exit_code=$?
    EXPECT_NUM_TESTS=7 pytest models/demos/deepseek_v3_d_p/tests/sparse_mla/test_sparse_mla.py -k "deepseek_v32 and 2x4 and fabric2d" -vvv --tb=short || exit_code=$?
    exit $exit_code
  skus:
    bh_loudbox:
      timeout: 10
  owner_id: U07N3CUUN05  # Iva Potkonjak
  team: models

- id: bh-lb-deepseek-prefill-op-tests
  name: bh_lb_DeepSeek_PREFILL_OP_TESTS
  model-name: deepseek_prefill
  cmd: |
    exit_code=0
    # Cheap host-side coverage for the mixed-format cache contract and producer decoding.
    EXPECT_NUM_TESTS=20 pytest models/demos/common/prefill/tests/test_prefill_producer_kv_decode.py models/demos/deepseek_v3_d_p/tests/test_sparse_kv_cache_contract.py -vvv --tb=short || exit_code=$?
    EXPECT_NUM_TESTS=68 pytest models/demos/deepseek_v3_d_p/tests/op_unit_tests/ -vvv --tb=short -k "(2x4 or 4x2) and not torus and not test_combine_subdevice_placement and not test_sub_device_load_clear_tracy and (not test_ring_joint_mla or (4x2 and pcc_check and fabric2d)) and (not test_rope_prefill or 4x2) and (not update_padded_kv_cache or (2x4 and multi_iteration and small and padded_partial)) and (not rotary_embedding_indexed or (2x4 and small and padded_partial and not non_padded)) and (not moe_padding_config or (2x4 and not start10080_isl3360 and not start13440_isl1920)) and (not zero_padded or 2x4) and (not test_ttnn_dispatch_combine or not row_major) and (not test_prefill_dispatch or (((bf16_in and tile and bf16_out) and (random or not perf_no_pcc)) or ((fp8_scaled_in and row_major and fp8_out) and random))) and (not test_prefill_combine or ((bf16_out and (not perf_no_pcc or (random and tile))) or (fp8_out and random and tile and not perf_no_pcc)))" -m "not extended_model" || exit_code=$?
    exit $exit_code
  skus:
    bh_loudbox:
      timeout: 28
  owner_id: U094PKWHNJ0 # Petar Milojevic
  team: models


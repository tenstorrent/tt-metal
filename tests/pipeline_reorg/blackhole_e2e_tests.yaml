# This file defines the test matrix for the Blackhole e2e pipeline (e2e, integration, perf, unit,
# DeepSeek prefill).

# Each entry represents a parallel job with the following keys:
#   id: Stable slug for workflow_dispatch / jq filtering.
#   name: The display name for the job in GitHub Actions.
#   cmd: The exact command to run for the test.
#   skus: A mapping of SKU names to their configuration.
#     Each SKU entry contains:
#       timeout: The maximum allowed runtime for this job in minutes on that SKU.
#   owner_id: The Slack user ID to notify on failure.
#   team: The team that owns the test.
#   tags: (Optional) Labels used by workflow_dispatch test-selection groups.
#   model-name: (Optional) Model identifier; rows are kept when workflow_dispatch
#     `model` matches this value or when the row has no `model-name` (always-run).

# For max allowed timeout refer to .github/time_budget.yaml

# --- integration ---
- id: bh-fabric-infra-integration
  name: fabric infra unit tests
  cmd: |
    ./build/test/tt_metal/tt_fabric/test_infra/test_tt_fabric --test_config ./tests/tt_metal/tt_fabric/test_infra/test_yamls/test_fabric_sanity_common.yaml
    ./build/test/tt_metal/tt_fabric/test_infra/test_tt_fabric --test_config ./tests/tt_metal/tt_fabric/test_infra/test_yamls/test_fabric_sanity_at_least_2x2_mesh.yaml
    TT_FABRIC_PROFILE_RX_CH_FWD=1 ./build/test/tt_metal/tt_fabric/test_infra/test_tt_fabric --test_config ./tests/tt_metal/tt_fabric/test_infra/test_yamls/test_fabric_code_profiling.yaml
  skus:
    bh_loudbox:
      timeout: 15
    bh_p300:
      timeout: 15
    bh_quietbox_2:
      timeout: 15
  owner_id: U07D5N7QL4U # Joseph Chu
  team: scaleout


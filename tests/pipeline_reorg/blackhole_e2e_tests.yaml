  upload_fabric_data: true
  skus:
    bh_loudbox:
      timeout: 15
    bh_p300:
      timeout: 15
    bh_quietbox_2:
      timeout: 15
  owner_id: U07D5N7QL4U # Joseph Chu
  team: scaleout


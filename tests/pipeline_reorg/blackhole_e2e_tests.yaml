- id: bh-lb-kimi-k3-attn-res
  name: bh_lb_Kimi_K3_ATTN_RES
  model-name: kimi_k3
  # AttnRes shards the hidden axis over TP and reduces its read statistics across it, so
  # the reduction only exists at tp > 1 — a single-card SKU would run a green arm over a
  # computation the model never executes. That holds for the op as much as the module,
  # which is why the op's own PCC gate rides this row instead of a single-card ops job.
  # bh_loudbox is the smallest box carrying Galaxy's TP factor of 4, and everything here
  # runs at one shape: 1280 tokens over SP 2 and `d` over TP 4, so every chip holds the
  # 640 rows prefill shards to. The reference test needs no device and costs a second.
  cmd: |
    EXPECT_NUM_TESTS=17 pytest \
      models/demos/deepseek_v3_d_p/tests/attn_res/model/ \
      tests/ttnn/unit_tests/operations/attn_residual/test_attn_res_gather_softmax.py \
      -vvv --tb=short
  skus:
    bh_loudbox:
      # 3:14 with nothing in the kernel cache, which is how CI runs it — 2:17 of that
      # is the tests and the rest is compiling the op's four kernels.
      timeout: 4
  owner_id: U09LK84G4TF # Nikola Milicevic
  team: models

- id: bh-qb2-deepseek-d2d-socket-sync
  name: bh_qb2_DeepSeek_D2D_SOCKET_SYNC
  model-name: deepseek_prefill
  # Program-cache validation for outbound_socket_service_sync (D2D sender op) on a 4-chip
  # QuietBox Fabric2D 2x2 variant: 2 sender + 2 receiver chips over tt-fabric. Confirms the
  # op is built once and cache-hits on the 2nd dispatch (input addr is a BufferBinding).
  cmd: |
    exit_code=0
    EXPECT_NUM_TESTS=2 pytest models/demos/deepseek_v3_d_p/tests/test_d2d_socket_sync.py -k "fabric2d-2x2" -vvv --tb=short || exit_code=$?
    exit $exit_code
  skus:
    bh_quietbox_2:
      timeout: 10
  owner_id: U094PKWHNJ0 # Petar Milojevic
  team: models

# TTSim Skip List
# Tests that currently do not work on TTSim simulator
#
# Structure: Each architecture has its own section with all tests to skip.
# Tests that apply to all architectures are duplicated in each section.
# Paths are pytest node ids from the repo root, the same form ttnn sim legs pass
# to --deselect. Each entry must load as a yaml string: quote an id that ends in
# ':' (yaml would otherwise read it as a mapping key).
#
# run_ttsim_regression.sh reads this file too. It keeps entries under
# tt_metal/tt-llk/tests/python_tests/ and drops that prefix, because the LLK
# suite collects pytest with python_tests/ as rootdir.


- name: DeepSeek-V3 long-sequence module sweep (Galaxy)
  cmd: |
    export DEEPSEEK_V3_HF_MODEL=/mnt/MLPerf/tt_dnn-models/deepseek-ai/DeepSeek-R1-0528-dequantized-stacked
    export DEEPSEEK_V3_CACHE=/mnt/MLPerf/tt_dnn-models/deepseek-ai/DeepSeek-R1-0528-Cache/CI
    export MESH_DEVICE=TG
    uv pip install -r models/demos/deepseek_v3/reference/deepseek/requirements.txt
    DEEPSEEK_MAX_SEQ_LEN_OVERRIDE=16384 pytest models/demos/deepseek_v3/tests/test_mla.py -k "mode_decode" --timeout 900 --durations=0
    DEEPSEEK_MAX_SEQ_LEN_OVERRIDE=12288 pytest models/demos/deepseek_v3/tests/test_decoder_block.py -k "mode_decode" --timeout 2400 --durations=0
    DEEPSEEK_MAX_SEQ_LEN_OVERRIDE=1024 pytest models/demos/deepseek_v3/tests/test_model.py -k "mode_decode" --timeout 1250 --durations=0
    DEEPSEEK_MAX_SEQ_LEN_OVERRIDE=32768 pytest models/demos/deepseek_v3/tests/test_model.py -k "mode_prefill" --timeout 1250 --durations=0
  model: deepseek-v3
  model_family: DeepSeek
  skus:
    wh_galaxy_perf:
      timeout: 50
      tier: 1
  owner_id: U0896VBAKFC
  team: models
  budget_type: sweep

# Request behavior tests: real models, device sampling, no serving framework.

- name: Llama 3.3-70B request behavior (Galaxy)
  cmd: |
    mkdir -p generated/test_reports/model_behavior
    export HF_HOME=/mnt/MLPerf/huggingface
    export HF_MODEL=meta-llama/Llama-3.3-70B-Instruct
    export TT_CACHE_PATH=/mnt/MLPerf/huggingface/tt_cache/meta-llama/Llama-3.3-70B-Instruct
    pytest --confcutdir=tests/model_behavior tests/model_behavior \
      --model-behavior-backend=galaxy-llama70b --model-behavior-execution=both \
      --timeout=3600 --basetemp=generated/test_reports/model_behavior/requests \
      --junitxml=generated/test_reports/model_behavior/results.xml
  model: llama3.3-70b-galaxy
  model_family: Llama
  skus:
    wh_galaxy_perf:
      timeout: 60
      tier: 1
      release_ready: false
  owner_id: U053W15B6JF

# This file defines the test matrix for the Models Sweep Tests pipelines.
#
# Each entry represents a parallel job with the following keys:
#   name: The display name for the job in GitHub Actions.
#   cmd: The exact command to run (env vars must be inlined).
#   model: Model identifier for filtering (workflow_dispatch model selection).
#   model_family: (optional) Human-facing model family for grouping/reporting (e.g. Llama, Qwen, Gemma). Omit when a test spans multiple families.
#   skus: A mapping of SKU names to their configuration:
#     timeout: Job timeout in minutes.
#     tier: Model tier (1, 2, or 3) used to filter which pipeline runs this test.
#   owner_id: The Slack user ID to notify on failure.
#   team: The team that owns the test.

# For max allowed timeout refer to .github/time_budget.yaml

# Entries are grouped by model.

# Full Llama-3.1-8B prefill does not fit a single N150 L1, so run a reduced 10-layer smoke for
# pipeline liveness on N150. Full-model sweep coverage lives on multi-device SKUs. See #44482.
- name: Llama 3.1-8B seqlen sweep
  cmd: |
    export HF_MODEL=meta-llama/Llama-3.1-8B-Instruct TT_CACHE_PATH=/mnt/MLPerf/huggingface/tt_cache/meta-llama/Llama-3.1-8B-Instruct
    pytest --timeout 840 models/tt_transformers/demo/simple_text_demo.py -k "performance-seqlen-sweep" --num_layers 10
  model: llama3.1-8b
  model_family: Llama
  skus:
    wh_n150:
      timeout: 15
      tier: 1
    bh_p150:
      timeout: 15
      tier: 1
  owner_id: U03PUAKE719 # Miguel Tairum Cruz
  team: models

- name: Llama 3.1-8B e2e tests (watcher)
  cmd: |
    export TT_METAL_WATCHER=60
    export HF_MODEL=meta-llama/Llama-3.1-8B-Instruct TT_CACHE_PATH=/mnt/MLPerf/huggingface/tt_cache/meta-llama/Llama-3.1-8B-Instruct
    pytest --timeout 840 models/tt_transformers/demo/simple_text_demo.py -k "performance-ci-token-matching"
    # The DRAM prefetcher does not yet support more than one repeat batch (issue #47820):
    # cover the eval repeat-batch loop with the prefetcher DISABLED (perf reporting skipped
    # so only the prefetcher run sets perf), and cover the prefetcher path with a SINGLE
    # repeat batch (this run reports/validates perf). See #47820 for the multi-batch work.
    pytest --timeout 1200 models/tt_transformers/demo/simple_text_demo.py -k "performance-ci-eval-32" --skip_perf_report
    pytest --timeout 1200 models/tt_transformers/demo/simple_text_demo.py -k "performance-ci-eval-32" --use_prefetcher True --repeat_batches 1
    pytest --timeout 840 models/tt_transformers/demo/simple_text_demo.py -k "performance-ci-token-matching" --use_hf_rope
  model: llama3.1-8b
  model_family: Llama
  skus:
    wh_n150:
      timeout: 40
      tier: 1
    bh_p150:
      timeout: 40
      tier: 1
  owner_id: U03PUAKE719 # Miguel Tairum Cruz
  team: models

- name: Llama 3.3-70B prefix-caching benchmark
  cmd: |
    export TT_CACHE_HOME=/mnt/MLPerf/huggingface/tt_cache LLAMA_DIR=/mnt/MLPerf/tt_dnn-models/llama/Llama3.3-70B-Instruct/ MESH_DEVICE=TG
    pytest --timeout 1140 models/demos/llama3_70b_galaxy/demo/prefix_caching_benchmark.py
  model: llama3.3-70b
  model_family: Llama
  skus:
    wh_galaxy:
      timeout: 20
      tier: 1
  owner_id: U09LTAPEU2U # Viktor Pus
  team: models

- name: Llama 3.3-70B seqlen sweep (LoudBox)
  cmd: |
    export HF_MODEL=meta-llama/Llama-3.3-70B-Instruct TT_CACHE_PATH=/mnt/MLPerf/huggingface/tt_cache/meta-llama/Llama-3.3-70B-Instruct
    pytest --timeout 1440 models/tt_transformers/demo/simple_text_demo.py -k "performance-seqlen-sweep"
  model: llama3.3-70b
  model_family: Llama
  skus:
    wh_llmbox_perf:
      timeout: 25
      tier: 2
    # bh_quietbox_2 descoped: 70B prefill exceeds Blackhole 4-device L1 (circular-buffer clash). See #48533.
  owner_id: U03PUAKE719 # Miguel Tairum Cruz
  team: models

- name: Llama 3.3-70B e2e tests (Galaxy, watcher)
  cmd: |
    export TT_METAL_WATCHER=60
    export TT_CACHE_HOME=/mnt/MLPerf/huggingface/tt_cache LLAMA_DIR=/mnt/MLPerf/tt_dnn-models/llama/Llama3.3-70B-Instruct/ FAKE_DEVICE=TG
    pytest --timeout 1800 models/demos/llama3_70b_galaxy/demo/text_demo.py -k "ci-token-matching"
    pytest --timeout 1800 models/demos/llama3_70b_galaxy/demo/text_demo.py -k "repeat2"
  model: llama3.3-70b-galaxy
  model_family: Llama
  skus:
    wh_galaxy_perf:
      timeout: 60
      tier: 1
  owner_id: U03PUAKE719 # Miguel Tairum Cruz
  team: models


# Model-independent sampling coverage (temperature / top-k / top-p / seed / penalties /
# batch isolation) on synthetic logits -- no model weights. In the sweep pipeline rather than
# unit_tier1, which has no wh_n150 headroom left. See #38316.
- name: Sampling module sweep (common)
  cmd: |
    unset TT_METAL_WATCHER  # blocked by #50886
    pytest --timeout 600 models/common/tests/test_tt_sampling.py
    # Complements the above: SeedManager slot/salt state machine, params broadcast/scatter,
    # host-level trace bookkeeping. -k drops the log-probs tests, the only ones needing >1 device.
    pytest --timeout 600 models/common/tests/test_sampling.py -k "not log_probs and not logprobs"
  model: sampling-common
  skus:
    wh_n150:
      timeout: 12
      tier: 1
    bh_p150:
      timeout: 10
      tier: 1
    # Galaxy (4,8) SKUs disabled: the 32-chip ring fabric fails to initialise on a marginal
    # ethernet link (Device 24 handshake timeout), and sweep_tier1 has no budget key for
    # wh_galaxy_perf / bh_galaxy. The (4,8) cases stay in the suite and auto-skip here.
  owner_id: U03PUAKE719 # Miguel Tairum Cruz
  team: models
  budget_type: sweep


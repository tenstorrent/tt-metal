  team: llk
  budget_type: [pr_gate, sanity]
  coverage: false
  cmd: |
    set -euo pipefail
    cd tests/python_tests
    echo hang probe runs in group 1 only
  skus:
    wh_n150_civ2:
      timeout: 15
  owner_id: U09UC143684 # Nemanja Divnic
  workdir: tt_metal/tt-llk

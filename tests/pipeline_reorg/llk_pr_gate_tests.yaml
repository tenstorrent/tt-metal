# LLK PR-gate python_tests matrix.
#
# Merge-gate gtest coverage lives in llk_merge_gate_tests.yaml.
# PYTEST_MARKERS is set by llk-smoke-impl.yaml / workflow_call inputs.
# For max allowed timeout refer to .github/time_budget.yaml (llk -> pr_gate and
# llk -> sanity). Two allowances, because two pipelines run this list: the PR gate
# charges llk.pr_gate and sanity-tests charges llk.sanity.
#
# Logical SKUs only; merge_group prio routing is via sku_config merge_queue_sku.
# Blackhole uses bh_p150b_civ2_viommu (same logical SKU as merge-gate); previously
# non-prio PR runs used bh_p150b_civ2.
# The junitxml name must end in -<split_group>.xml: llk-smoke-impl collects reports with
# the glob pytest-report-*-<split_group>.xml.

- name: llk_smoke_wormhole
  split_group: 1
  team: llk
  budget_type: [pr_gate, sanity]
  coverage: false
  cmd: |
    set -euo pipefail
    cd tests/python_tests
    pytest -q --override-ini=log_cli=false -n auto -x \
      --dist=worksteal -m "$PYTEST_MARKERS" \
      --timeout=60 \
      --junitxml=pytest-report-wormhole-1.xml .
  skus:
    wh_n150_civ2:
      timeout: 15
  owner_id: U09UC143684 # Nemanja Divnic

- name: llk_smoke_blackhole groups 1-3/5
  split_group: 1
  team: llk
  budget_type: [pr_gate, sanity]
  coverage: false
  cmd: |
    set -euo pipefail
    cd tests/python_tests
    for group in 1 2 3; do
      pytest -q --override-ini=log_cli=false -n auto -x \
        --dist=worksteal -m "$PYTEST_MARKERS" \
        --splits 5 --group "$group" \
        --timeout=60 \
        --junitxml="pytest-report-blackhole-group-${group}-1.xml" .
    done
  skus:
    bh_p150b_civ2_viommu:
      timeout: 15
  owner_id: U09UC143684 # Nemanja Divnic

- name: llk_smoke_blackhole groups 4-5/5
  split_group: 2
  team: llk
  budget_type: [pr_gate, sanity]
  coverage: false
  cmd: |
    set -euo pipefail
    cd tests/python_tests
    for group in 4 5; do
      pytest -q --override-ini=log_cli=false -n auto -x \
        --dist=worksteal -m "$PYTEST_MARKERS" \
        --splits 5 --group "$group" \
        --timeout=60 \
        --junitxml="pytest-report-blackhole-group-${group}-2.xml" .
    done
  skus:
    bh_p150b_civ2_viommu:
      timeout: 15
  owner_id: U09UC143684 # Nemanja Divnic

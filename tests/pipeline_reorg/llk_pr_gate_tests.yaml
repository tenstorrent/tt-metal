# LLK PR-gate python_tests matrix.
#
# Merge-gate gtest coverage lives in llk_merge_gate_tests.yaml.
# llk-smoke-impl.yaml sets PYTEST_MARKERS from its workflow_call inputs; the
# `env:` and `workdir:` on each entry are what verify-changed-tests uses instead.
# The sim_quasar legs declare CHIP_ARCH because there is no device to detect it
# from, and run_ttsim_regression.sh sets its own marker expression.
# For max allowed timeout refer to .github/time_budget.yaml (llk -> pr_gate and
# llk -> sanity). Two allowances, because two pipelines run this list: the PR gate
# charges llk.pr_gate and sanity-tests charges llk.sanity.
#
# Logical SKUs only; merge_group prio routing is via sku_config merge_queue_sku.
# Blackhole uses bh_p150b_civ2_viommu (same logical SKU as merge-gate); previously
# non-prio PR runs used bh_p150b_civ2.
# The junitxml name must end in -<split_group>.xml: llk-smoke-impl collects reports with
# the glob pytest-report-*-<split_group>.xml.

- name: llk_smoke_wormhole group 1/2
  split_group: 1
  team: llk
  budget_type: [pr_gate, sanity]
  coverage: false
  cmd: |
    set -euo pipefail
    cd tests/python_tests
    pytest --collect-only -q --override-ini=log_cli=false test_eltwise_unary_datacopy.py::test_eltwise_unary_datacopy | grep '::' | awk 'NR%40==1' > /tmp/hang_dc.txt
    { sed -n 1p /tmp/hang_dc.txt; echo 'test_hang_probe.py::test_hang_probe[spin]'; sed -n 2,3p /tmp/hang_dc.txt; echo 'test_hang_probe.py::test_hang_probe[stall]'; sed -n 4,5p /tmp/hang_dc.txt; } > /tmp/hang_order.txt
    cat /tmp/hang_order.txt
    pytest @/tmp/hang_order.txt -n 0 -v -s --override-ini=log_cli=false --timeout=600 --junitxml=pytest-report-wormhole-1.xml
  skus:
    wh_n150_civ2:
      timeout: 15
  owner_id: U09UC143684 # Nemanja Divnic
  workdir: tt_metal/tt-llk
  env:
    PYTEST_MARKERS: "not perf and not nightly and not quasar and not accuracy"

- name: llk_smoke_wormhole group 2/2

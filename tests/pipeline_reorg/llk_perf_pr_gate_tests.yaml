# LLK perf PR gate: the legs the label-triggered gate measures, on the PR head
# and on its branch point.
#
# This list exists to hold the same split as llk_perf_merge_gate_tests.yaml.
# The two gates judge the same code against the same thresholds, so they should
# measure it the same way: the split decides which tests share a board and in
# which order, and a kernel's cycles depend on what ran before it on that core.
# A 1/5 split and a 1/3 split put different tests next to each other, so their
# numbers are not directly comparable. Keep the group count here equal to the
# merge gate's.
#
# What still differs, on purpose:
#   - the SKU. The merge gate asks for bh_p150b_civ2_viommu, which it can do
#     because it builds its matrix with architecture 'all' (ALL_SKUS_IN_TESTS).
#     llk-perf-impl resolves a single architecture to bh_p150b_civ2, so naming
#     the viommu SKU here would produce an empty matrix.
#   - the timeout. The merge gate has a 15 min ceiling per leg; this gate can be
#     dispatched with wider run types than L1_TO_L1, which take longer.
#
# The PR gate measures two sides, so it holds 3 boards per architecture per
# side: 12 in all, against 20 under the five-way split.
#
# {split_group} is substituted with each row's split_group by prepare_test_matrix.py.

- name: llk_perf_wormhole group 1/3
  split_group: 1
  team: llk
  budget_type: perf
  cmd: |
    set -euo pipefail
    ./tests/run_llk_perf_wormhole.sh {split_group} 3
  skus:
    wh_n150_civ2:
      timeout: 150
  owner_id: U09UC143684 # Nemanja Divnic
  workdir: tt_metal/tt-llk
  env:
    SPEED_OF_LIGHT: "false"
    LLK_PERF_RUN_TYPES: "L1_TO_L1"
    PIPELINE: "pr"
    TT_LLK_DISABLE_ASSERTS: "1"


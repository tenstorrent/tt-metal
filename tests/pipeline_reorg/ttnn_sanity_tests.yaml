# PRUNED FOR A CI PROBE -- DO NOT MERGE THIS BRANCH.
#
# Only the "ttnn data movement group" is kept, because that is the group the untilize port adds a
# line to (test_untilize.py::test_untilize_codegen). The other 14 groups -- eltwise, conv, pool,
# matmul, fused, misc, sdpa, indexer_score, reduce, core -- are dropped as unrelated to this port,
# not because they fail. The real file on port/untilize-untilize-wormhole_b0-20260716T183525Z is
# unchanged.
#
# This group runs on hardware SKUs and on both ttsim SKUs, so it is also what proves the codegen
# kernels work under the simulator now that untilize is off ttsim-skip-list.yaml.
#
# Each entry: name, cmd, skus: { <sku>: { timeout: N } }, team, owner_id.
# Optional: fast_runtime_mode_off.


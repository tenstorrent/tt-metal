# This file defines TTNN unit test groups used by:
#   - ttnn-sanity-tests-impl.yaml (hardware CI + ttsim simulator coverage)
# Merge-gate tests live in ttnn_merge_gate_tests.yaml.
#
# Each entry: name, cmd, skus: { <sku>: { timeout: N } }, team, owner_id.
# Optional: fast_runtime_mode_off.
#
# sim_wormhole_b0 / sim_blackhole SKUs run the same cmd under the ttsim simulator
# on ubuntu-latest; ttnn-sanity-tests-impl.yaml invokes setup-ttsim for these.
# See .github/actions/setup-ttsim/action.yml.
#
# TRIAL-ONLY: narrowed to a single N300 leg running just the broadcast_to negative
# tests, to confirm ai-summary crash-signal wording. Do not merge.

- name: "ttnn broadcast_to negative"
  cmd: 'pytest --timeout 300 tests/ttnn/unit_tests/operations/eltwise/test_broadcast_to.py -v -k invalid'
  skus:
    wh_n300_civ2:
      timeout: 20
  team: ttnn
  owner_id: U09BX3N0N95

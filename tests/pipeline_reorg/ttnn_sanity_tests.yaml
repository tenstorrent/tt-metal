# This file defines TTNN unit test groups used by:
#   - ttnn-sanity-tests-impl.yaml (hardware CI + ttsim simulator coverage)
# Merge-gate tests live in ttnn_merge_gate_tests.yaml.
#
# Each entry: name, cmd, skus: { <sku>: { timeout: N } }, team, owner_id.
# Optional: fast_runtime_mode_off.
#
# sim_wh_n150 / sim_bh_p150 SKUs run the same cmd under the ttsim simulator
# on ubuntu-latest; ttnn-sanity-tests-impl.yaml invokes setup-ttsim for these.
# See .github/actions/setup-ttsim/action.yml.

- name: "ttnn deepseek_prefill group"
  cmd: 'pytest --timeout 300 tests/ttnn/nightly/unit_tests/operations/experimental/deepseek_prefill/test_deepseek_moe_post_combine_reduce.py tests/ttnn/nightly/unit_tests/operations/experimental/deepseek_prefill/test_deepseek_prefill_per_token_cast.py tests/ttnn/nightly/unit_tests/operations/experimental/deepseek_prefill/test_moe_grouped_topk.py tests/ttnn/nightly/unit_tests/operations/experimental/deepseek_prefill/test_single_routed_expert.py tests/ttnn/nightly/unit_tests/operations/experimental/deepseek_prefill/test_swigluoai_routed_expert.py -k "(test_skip_nonlocal_experts and dsv3) or (test_moe_grouped_topk and deepseek-8g256e and sigmoid and in_bf16 and realistic and pad50) or (test_moe_grouped_topk and kimi-1g384e and sigmoid and in_bf16 and realistic and pad0) or (test_single_routed_expert_functional and x_rm and dsv3-isl-3001) or (test_swigluoai_routed_expert_m3_shapes and (t128 or t4k)) or (test_cast_to_fp8_scale_values and bfloat16 and TILE and 7168) or (test_round_trip_random and bfloat16 and TILE and 1152)" -v'
  skus:
    bh_p150b_civ2:
      timeout: 5
  team: ttnn
  budget_type: sanity
  owner_id: U0976495SLU # Nikola Ostojic

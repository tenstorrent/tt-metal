# This file defines TTNN unit test groups used by:
#   - ttnn-sanity-tests-impl.yaml (hardware CI + ttsim simulator coverage)
# Merge-gate tests live in ttnn_merge_gate_tests.yaml.
#
# Each entry: name, cmd, skus: { <sku>: { timeout: N } }, team, owner_id.
# Optional: fast_runtime_mode_off.
#
# sim_wh_n150 / sim_bh_p150 SKUs run the same cmd under the ttsim simulator
# on ubuntu-latest; ttnn-sanity-tests-impl.yaml invokes setup-ttsim for these.
# See .github/actions/setup-ttsim/action.yml.
#
# THROWAWAY DEBUG BRANCH (debug/54968-repro): every other group has been
# deleted from this file so that dispatching sanity-tests.yaml on this branch
# can only ever schedule the single job below, regardless of which SKUs/suites
# are requested at dispatch time. Not intended to land on main -- see
# https://github.com/tenstorrent/tt-metal/issues/54968.

- name: "core ttnn unit test group"
  cmd: 'pytest --timeout 1260 tests/ttnn/unit_tests/base_functionality/test_to_layout.py::test_to_layout_wide_tensor_stress_54968 -xvs'
  skus:
    wh_n300_civ2:
      timeout: 22
  team: ttnn
  owner_id: U076Z1JJUQZ # Artem Yerofieiev

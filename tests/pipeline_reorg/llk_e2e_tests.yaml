# LLK e2e — python_tests, no speed-of-light.
# PYTEST_MARKERS is set by llk-e2e-impl from workflow_call inputs. ci-quiet log mode is hard-coded.
# The junitxml name must end in -<split_group>.xml: llk-e2e-impl collects reports with
# the glob pytest-report-*-<split_group>.xml.
# Coverage is off: re-enabling needs `--coverage` on the pytest legs plus a copy of
# /tmp/tt-llk-build/merged_coverage.info to code-coverage-<arch>-<split_group>.info,
# and `coverage: true` both here and on the llk-e2e-impl call.

- name: llk_e2e_blackhole group 1/1
  split_group: 1
  team: llk
  budget_type: e2e
  coverage: false
  cmd: |
    set -euo pipefail
    cd tests/python_tests
    mkdir -p perf_data
    export TT_LLK_DISABLE_ASSERTS=1
    pytest -q --override-ini=log_cli=false -n 10 --timeout=600 --junitxml=pytest-report-blackhole-1.xml -k functional perf_eltwise_binary_blk.py || true
    pytest -q --override-ini=log_cli=false --compile-producer -n 10 -m perf --timeout=600 perf_eltwise_binary_blk.py
    for pass in 1 2; do
      pytest -q --override-ini=log_cli=false --compile-consumer -m perf --timeout=600 perf_eltwise_binary_blk.py || true
      find .. ../.. /tmp -name "perf_eltwise_binary_blk*.post.csv" 2>/dev/null | while read -r f; do echo "=== pass $pass $f"; cat "$f"; rm -f "$f"; done
    done
  skus:
    bh_p150b_civ2:
      timeout: 60
  owner_id: U09UC143684 # Nemanja Divnic

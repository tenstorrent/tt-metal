# Temporary A/B investigation using existing face-compressed tests and bit-exact repeats.

- name: llk_adc_guard_absent
  split_group: 1
  team: llk
  coverage: false
  cmd: |
    set -euo pipefail
    git fetch --no-tags --depth=1 origin d87af74bd14cda49bcbd8ecef50f59e7c5d1894a
    git show d87af74bd14cda49bcbd8ecef50f59e7c5d1894a:tt_metal/tt-llk/tests/sources/matmul_face_compressed_test.cpp > tests/sources/matmul_face_compressed_test.cpp
    git hash-object tests/sources/matmul_face_compressed_test.cpp
    cd tests/python_tests
    pytest -q --override-ini=log_cli=false -n auto \
      --dist=worksteal \
      -k 'interleaved and bfp0 and (8192 or 576)' \
      --bit-exact-runs=200 --timeout=300 \
      --junitxml=pytest-report-blackhole-1.xml test_matmul_face_compressed.py
  skus:
    bh_p150b_civ2:
      timeout: 38
  owner_id: U09UC143684 # Nemanja Divnic


# LLK e2e — python_tests compile producer/consumer with coverage (5-way split, no speed-of-light).
# PYTEST_MARKERS is set by llk-e2e-impl from workflow_call inputs. ci-quiet log mode is hard-coded.

- name: llk_e2e_wormhole
  split_group: 1
  team: llk
  coverage: true
  cmd: |
    set -euo pipefail
    cd tests/python_tests
    pytest -q -n auto \
      --dist=worksteal -m "$PYTEST_MARKERS" \
      --timeout=60 \
      --junitxml=pytest-report-wormhole.xml .
  skus:
    wh_n150_civ2:
      timeout: 38
  owner_id: U09UC143684 # Nemanja Divnic

- name: llk_e2e_blackhole
  split_group: 1
  team: llk
  coverage: true
  cmd: |
    set -euo pipefail
    cd tests/python_tests
    pytest -q --override-ini=log_cli=false -n auto \
      --dist=worksteal -m "$PYTEST_MARKERS" \
      --timeout=60 \
      --junitxml=pytest-report-blackhole.xml .
  skus:
    bh_p150b_civ2:
      timeout: 55
  owner_id: U09UC143684 # Nemanja Divnic

# LLK e2e — python_tests, no speed-of-light.
# PYTEST_MARKERS is set by llk-e2e-impl from workflow_call inputs. ci-quiet log mode is hard-coded.
# The junitxml name must end in -<split_group>.xml: llk-e2e-impl collects reports with
# the glob pytest-report-*-<split_group>.xml.
# Coverage is off: re-enabling needs `--coverage` on the pytest legs plus a copy of
# /tmp/tt-llk-build/merged_coverage.info to code-coverage-<arch>-<split_group>.info,
# and `coverage: true` both here and on the llk-e2e-impl call.

- name: llk_e2e_blackhole group 1/6
  split_group: 1
  team: llk
  budget_type: e2e
  coverage: false
  cmd: |
    set -euo pipefail
    cd tests/python_tests
    mkdir -p perf_data
    export TT_LLK_DISABLE_ASSERTS=1
    pytest -q --override-ini=log_cli=false --compile-producer -n 10 -m perf --timeout=600 perf_eltwise_binary_wt.py
    for pass in 1 2 3; do
      pytest -q --override-ini=log_cli=false --compile-consumer -m perf --timeout=600 --junitxml=pytest-report-blackhole-1.xml perf_eltwise_binary_wt.py || true
      find .. ../.. /tmp -name "perf_eltwise_binary_wt*.post.csv" 2>/dev/null | while read -r f; do echo "=== pass $pass $f"; cat "$f"; rm -f "$f"; done
    done
  skus:
    bh_p150b_civ2:
      timeout: 120
  owner_id: U09UC143684 # Nemanja Divnic

- name: llk_e2e_blackhole group 2/6
  split_group: 2
  team: llk
  budget_type: e2e
  coverage: false
  cmd: |
    set -euo pipefail
    cd tests/python_tests
    export PYTHONPATH=$PWD:${PYTHONPATH:-} 
    export EB_SEL='(test_eltwise_binary|test_eltwise_binary_bfp4_b)\[.*tile_dimensions:\[(1|2|4|8|16), 32\]|test_sdpa_bcast_col_srcb_reuse\['
    pytest -q --override-ini=log_cli=false -p eb_sel_plugin -n auto --dist=worksteal -m "$PYTEST_MARKERS" --timeout=120 --junitxml=pytest-report-blackhole-2.xml test_eltwise_binary.py test_sdpa_bcast_col_srcb_reuse.py
  skus:
    bh_p150b_civ2:
      timeout: 90
  owner_id: U09UC143684 # Nemanja Divnic


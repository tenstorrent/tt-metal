# ---------------------------------------------------------------------------------------
# Non-coverage companion groups (split_group 6-10).
#
# !! THE JUSTIFICATION BELOW WAS WRONG, AND THESE GROUPS ARE UNDER DISCUSSION. !!
#
# They were added on the premise that the groups above run under coverage, that
# `_skip_coverage_unsupported` in test_sfpu_unary.py therefore skips every BROAD_SWEEP_OPS
# variant there, and that the broad unary profile consequently ran in no automated job on
# any architecture.
#
# The first link does not hold. No group in this file passes `--coverage` on either pytest
# leg -- the only mentions of the flag here are in comments, this one included -- and all
# four of the groups above carry `coverage: false`. `WITH_COVERAGE` is set solely by that
# CLI option, and llk-e2e-impl.yaml runs `matrix.test-group.cmd` verbatim, with
# `inputs.coverage` gating nothing but the artifact upload. So `_skip_coverage_unsupported`
# is already a no-op in this workflow and the broad profile already runs nightly on both
# arches, which makes these five groups per arch a duplicate rather than new coverage.
#
# Kept in place only so the discussion has something concrete to point at; see the review
# thread on this file. The open question is not merely whether the rationale was right but
# whether the underlying BROAD_SWEEP_OPS skip is still needed at all -- it cites tt-llk#1435,
# an accuracy issue possibly caused by BIT11 leaking between tests, and the suggestion on
# review is to re-run without the skip and either delete it or debug what scrambles the
# values, rather than route around it.
#
# The mechanical notes, still accurate: targeted at test_sfpu_unary.py rather than `.`, since
# BROAD_SWEEP_OPS and _skip_coverage_unsupported live only there and `.` would re-run every
# other suite a second time per arch per night. split_group is 6-10 rather than 1-5 because
# artifact names are keyed on it (`junit-report-<arch>-<split_group>`) and would collide.
# ---------------------------------------------------------------------------------------

- name: llk_e2e_wormhole_nocov group 1/5
  split_group: 6
  team: llk
  coverage: false
  cmd: |
    set -euo pipefail
    cd tests/python_tests
    PYTEST_COMPILE_EXTRA="-q --override-ini=log_cli=false"
    PYTEST_RUN_EXTRA="-q --override-ini=log_cli=false"
    pytest $PYTEST_COMPILE_EXTRA --compile-producer -n 10 \
      -m "$PYTEST_MARKERS" \
      --splits 5 --group 1 --timeout=60 \
      --junitxml=pytest-report-wormhole-6-compile.xml test_sfpu_unary.py
    pytest $PYTEST_RUN_EXTRA --compile-consumer -x \
      -m "$PYTEST_MARKERS" \
      --splits 5 --group 1 \
      --timeout=60 \
      --junitxml=pytest-report-wormhole-6-run.xml test_sfpu_unary.py
    junitparser merge pytest-report-wormhole-6-compile.xml pytest-report-wormhole-6-run.xml pytest-report-wormhole-6.xml
  skus:
    wh_n150_civ2:
      timeout: 25
  owner_id: U09UC143684 # Nemanja Divnic


# Weekly reconfig sweep job, sharded across four machines.

- name: reconfig_escape_blackhole group 1/4
  split_group: 1
  team: llk
  budget_type: reconfig_escape
  coverage: false
  cmd: |
    set -euo pipefail
    if [ -n "${VIRTUAL_ENV:-}" ]; then
      uv pip install -q --index-strategy unsafe-best-match --no-cache-dir -r tt_metal/tt-llk/tests/requirements.txt
    else
      uv pip install -q --system --index-strategy unsafe-best-match --no-cache-dir -r tt_metal/tt-llk/tests/requirements.txt
    fi
    cd tt_metal/tt-llk/tests/python_tests/reconfig_escape
    ./ci.sh --arch blackhole --splits 4 --group 1 --report-dir reports/blackhole-1
  skus:
    bh_p150b_civ2:
      timeout: 480
  owner_id: U09UC143684


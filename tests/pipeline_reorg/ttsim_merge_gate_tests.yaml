# TTSim merge-gate matrix (Quasar simulator coverage, sim_* SKUs only, no HW).
#
# Each entry: name, cmd, skus: { <sku>: { timeout: N } }, team, owner_id.
# For max allowed timeout refer to .github/time_budget.yaml (ttsim -> merge_gate).
#
# The sanity counterpart is runtime_sim_quasar_cpp_unit_tests in
# tests/pipeline_reorg/runtime_sanity_tests.yaml (ttsim -> sanity). The entry below is
# currently an exact copy of it — same fixtures, same binary — differing only in
# timeout: 15 here against the 15-min merge-gate ceiling, 30 there. It is NOT yet a
# reduced subset, so a run in the 15-30 min range passes sanity and times out in the
# merge gate; either trim the gtest filter or raise the merge-gate budget.
# Keep the two in sync when adding fixtures to either.
#
# This list is run by .github/workflows/ttsim-merge-gate-tests-impl.yaml, which
# hardcodes the path and invokes setup-ttsim for every sim_* SKU. See
# .github/actions/setup-ttsim/action.yml and .github/sku_config.yaml.
#
# Some of these may fail today due to a known libttsim_qsr.so NOC_API_V2 gap in the
# simulator itself, not this CI wiring — see #54794.
# QuasarMultiSemaphorePipeline and QuasarMultipleClustersMultiSemaphorePipeline are
# excluded: both are disabled on tt-metal main.
- name: runtime_sim_quasar_cpp_unit_tests
  cmd: >-
    f=HostOnlyTest.Bfp8Conversion;
    f=$f:UnitMeshFixture.InterleavedL1Buffer;
    f=$f:UnitMeshFixture.UnalignedReadWriteCore;
    f=$f:QuasarMeshDeviceSingleCardFixture.DmLoopback;
    f=$f:QuasarMeshDeviceSingleCardFixture.MultiDmAddTwoInts;
    f=$f:QuasarMeshDeviceSingleCardFixture.QuasarComputeKernelMultipleThreads;
    f=$f:QuasarMeshDeviceSingleCardFixture.QuasarComputeKernelSingleThread;
    f=$f:QuasarMeshDeviceSingleCardFixture.QuasarComputeKernelTLS;
    f=$f:QuasarMeshDeviceSingleCardFixture.QuasarCreateMultipleComputeKernelsSingleCluster;
    f=$f:QuasarMeshDeviceSingleCardFixture.SingleDmL1Write;
    f=$f:RISCVAtomicsFixture.TestAtomicAddFetchRISCV;
    f=$f:RISCVAtomicsFixture.TestAtomicLoadStoreRISCV;
    ./build/test/tt_metal/unit_tests_legacy --gtest_filter=$f
  skus:
    sim_quasar:
      timeout: 15
  owner_id: U08PR765YJ1 # Matt Craighead
  team: ttsim

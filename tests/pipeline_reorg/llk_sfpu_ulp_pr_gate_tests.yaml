# LLK SFPU accuracy in PR Gate: the ULP sweep over the Wormhole cells a change can move.
# Run only by .github/workflows/llk-sfpu-ulp-pr-check.yaml, which builds the picked cells into
# $RUNNER_TEMP/tt-llk-build and lists their node ids in $ULP_SWEEP_NODES. Same checks as the
# nightly (llk_sfpu_accuracy_tests.yaml). Blackhole's pr_gate budget is full, so it is nightly
# only. Every cell from prebuilt ELFs took 1 min 53 s on a WH n300 host; one op's, ~10 s.

- name: llk_sfpu_ulp_pr_gate_wormhole
  split_group: 1
  team: llk
  budget_type: pr_gate
  coverage: false
  cmd: |
    set -uo pipefail
    cd tests/python_tests
    status=0
    pytest -q -n auto --dist=worksteal --timeout=120 --ulp-measure=ulp_measurements.jsonl \
      --compile-consumer "@$ULP_SWEEP_NODES" || status=$?
    python3 -m helpers.ulp_budget_diff headroom --measured ulp_measurements.jsonl \
      --out "${GITHUB_STEP_SUMMARY:-/dev/null}" || status=$?
    exit "$status"
  skus:
    wh_n150_civ2:
      timeout: 10
  owner_id: U09UC143684 # Nemanja Divnic

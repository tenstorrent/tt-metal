# Test matrix for the descriptor parity check.
#
# The L2 nightly runs these tests on a separate build configured with
# -DENABLE_DESCRIPTOR_PATCHING_PARITY_CHECK=ON. On every program cache hit, that build rebuilds the descriptor for the
# current tensors and fails the test if the cached program's runtime args or circular-buffer addresses differ, so a
# factory whose cache-hit path leaves a stale value fails here with the op, kernel, core and arg named, instead of
# producing wrong numbers.
#
# It runs on the 2-chip box with the 1x2 mesh, as the distributed unit tests do, so the tests that need two chips (ring
# SDPA among them) run too. Only the Galaxy tests skip.
#
# Keys are the same as in train_unit_tests.yaml. For max allowed timeout refer to .github/time_budget.yaml.

- name: tt-train cpp descriptor parity tests
  cmd: |
    mkdir -p generated/test_reports
    export TT_MESH_GRAPH_DESC_PATH=${TT_METAL_RUNTIME_ROOT}/tt-train/configs/mgd/bh_1_2_line_line.textproto
    build/tt-train/tests/ttml_tests --gtest_output=xml:generated/test_reports/ctest_report.xml --gtest_filter="-*NIGHTLY*"
  skus:
    bh_quietbox_2:
      timeout: 30
  owner_id: U08HM8SL5U4 # Maciek Draguła
  team: train
  budget_type: unit

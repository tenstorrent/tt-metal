# BH galaxy is the only Blackhole SKU in CI whose firmware bundle clears the DRAM-programmable-cores
# floor (19.12.0.0), so it is the only place these tests run instead of skipping. Single-device
# suites: they cover the DRAM-core/GCB/prefetcher path itself, not multi-device sharding.
- id: bh-galaxy-tensor-prefetcher
  name: BH Galaxy tensor prefetcher unit tests
  cmd: |
    pytest tests/ttnn/unit_tests/operations/transformers/test_prefetcher_BH_validator.py
    pytest tests/ttnn/unit_tests/operations/transformers/test_prefetcher_BH_tensor_large.py
  skus:
    bh_galaxy:
      timeout: 8
  owner_id: U07R05K4WGJ # John Bauman
  team: ttnn
  budget_type: e2e

# Full and offset distributions exercise uniform and nonuniform uploads with remote host shards.
- id: bh-galaxy-complete-host-tensor-dual-rank
  name: BH Galaxy complete host tensor uploads on dual-rank meshes
  cmd: >-
    tt-run --mesh-graph-descriptor tests/ttnn/distributed/config/bh_1x2_dual_rank_mesh_graph_descriptor.textproto --hosts "$(hostname)" --mpi-args "--allow-run-as-root --tag-output" pytest -x tests/ttnn/distributed/test_complete_host_tensor_dual_rank.py
    && tt-run --mesh-graph-descriptor tests/ttnn/distributed/config/bh_1x4_dual_rank_mesh_graph_descriptor.textproto --hosts "$(hostname)" --mpi-args "--allow-run-as-root --tag-output" pytest -x tests/ttnn/distributed/test_complete_host_tensor_nonuniform_dual_rank.py
  skus:
    bh_galaxy:
      timeout: 15
  owner_id: U088DBNUKGR # Evan Smal
  team: ttnn
  budget_type: e2e

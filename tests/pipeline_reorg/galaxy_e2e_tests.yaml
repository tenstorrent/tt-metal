# This file defines the test matrix for the Galaxy e2e tests pipeline.

# Each entry represents a parallel job with the following keys:
#   id: Stable slug for workflow_dispatch / jq filtering (must match pipeline-select-galaxy).
#   name: The display name for the job in GitHub Actions.
#   cmd: The exact command to run for the test.
#   skus: A mapping of SKU names to their configuration.
#     Each SKU entry contains:
#       timeout: The maximum allowed runtime for this job in minutes on that SKU.
#   owner_id: The Slack user ID to notify on failure.
#   team: The team that owns the test.

# For max allowed timeout refer to .github/time_budget.yaml

# Wormhole Galaxy e2e tests
- id: galaxy-fabric-unit
  name: Galaxy Fabric unit tests
  cmd: build/test/tt_metal/tt_fabric/fabric_unit_tests --gtest_filter="NightlyFabric*Fixture.*"
  skus:
    wh_galaxy:
      timeout: 25
    bh_galaxy:
      timeout: 30
  owner_id: U08UBDUKH6Z # Neel Nyamagoudar
  team: scaleout
  budget_type: e2e

- id: galaxy-fabric-2d-torus-nightly
  name: Galaxy Fabric 2D Torus Nightly Tests
  cmd: ./build/test/tt_metal/tt_fabric/test_infra/test_tt_fabric --test_config tests/tt_metal/tt_fabric/test_infra/test_yamls/test_fabric_2d_torus_nightly.yaml
  skus:
    wh_galaxy:
      timeout: 45
    bh_galaxy:
      timeout: 45
  owner_id: U08UBDUKH6Z # Neel Nyamagoudar
  team: scaleout
  budget_type: e2e

# Single BH galaxy 2x2 inter-mesh torus repro for #56298: four 2x2 RING/LINE stages ring-connected on
# one galaxy, every mesh opening with the SAME fabric config under Torus X/Y/XY. This entry routes the
# inter-mesh links over Z (assign_z_direction); the -nonz entry below routes them over N/S/E/W. Checks
# the torus fabric does not hang/starve. Config: test_galaxy_fabric_2x2_torus_z.yaml.
- id: galaxy-fabric-2x2-torus-z
  name: Galaxy Fabric 2x2 Torus X/Y/XY (inter-mesh over Z)
  cmd: |
    TT_METAL_OPERATION_TIMEOUT_SECONDS=0 tt-run --mesh-graph-descriptor {mgd} --hosts "$(hostname)" --mpi-args "--allow-run-as-root" ./build/test/tt_metal/tt_fabric/test_infra/test_tt_fabric --test_config tests/tt_metal/tt_fabric/test_infra/test_yamls/test_galaxy_fabric_2x2_torus_z.yaml
  skus:
    bh_galaxy:
      timeout: 12
      mgd: tests/tt_metal/tt_fabric/custom_mesh_descriptors/single_galaxy_2x2_z_ring_4stage_ring_mesh_graph_descriptor.textproto
  owner_id: U08UBDUKH6Z # Neel Nyamagoudar
  team: scaleout
  budget_type: e2e

- id: galaxy-fabric-2x2-torus-nonz
  name: Galaxy Fabric 2x2 Torus X/Y/XY (inter-mesh over N/S/E/W)
  cmd: |
    TT_METAL_OPERATION_TIMEOUT_SECONDS=0 tt-run --mesh-graph-descriptor {mgd} --hosts "$(hostname)" --mpi-args "--allow-run-as-root" ./build/test/tt_metal/tt_fabric/test_infra/test_tt_fabric --test_config tests/tt_metal/tt_fabric/test_infra/test_yamls/test_galaxy_fabric_2x2_torus_nonz.yaml
  skus:
    bh_galaxy:
      timeout: 12
      mgd: tests/tt_metal/tt_fabric/custom_mesh_descriptors/single_galaxy_2x2_ring_4stage_ring_mesh_graph_descriptor.textproto
  owner_id: U08UBDUKH6Z # Neel Nyamagoudar
  team: scaleout
  budget_type: e2e

- id: galaxy-fabric-multi-mesh-4x4-2x4s
  name: Galaxy Fabric Multi-Mesh 4x4 and 2x4s stability tests
  cmd: |
    TT_METAL_OPERATION_TIMEOUT_SECONDS=0 tt-run --mesh-graph-descriptor {mgd} --hosts "$(hostname)" --mpi-args "--allow-run-as-root" ./build/test/tt_metal/tt_fabric/test_infra/test_tt_fabric --test_config tests/tt_metal/tt_fabric/test_infra/test_yamls/test_fabric_multi_mesh_stability_short_running.yaml
    TT_METAL_ENABLE_FABRIC_MESH_PASS_THROUGH=1 tt-run --mesh-graph-descriptor {mgd} --hosts "$(hostname)" --mpi-args "--allow-run-as-root" ./build/test/tt_metal/tt_fabric/test_infra/test_tt_fabric --test_config tests/tt_metal/tt_fabric/test_infra/test_yamls/test_fabric_mesh_passthrough.yaml
  skus:
    wh_galaxy:
      timeout: 15
      mgd: tests/tt_metal/tt_fabric/custom_mesh_descriptors/wh_galaxy_split_4x4_2x4_3_mesh.textproto
    bh_galaxy:
      timeout: 10
      mgd: tests/tt_metal/tt_fabric/custom_mesh_descriptors/bh_galaxy_split_4x4_2x4_3_mesh.textproto
  owner_id: U08UBDUKH6Z # Neel Nyamagoudar
  team: scaleout
  budget_type: e2e

- id: galaxy-fabric-multi-mesh-2x8-2x4s
  name: Galaxy Fabric Multi-mesh 2x8 and 2x4s stability tests
  cmd: |
    TT_METAL_OPERATION_TIMEOUT_SECONDS=0 tt-run --mesh-graph-descriptor {mgd} --hosts "$(hostname)" --mpi-args "--allow-run-as-root" ./build/test/tt_metal/tt_fabric/test_infra/test_tt_fabric --test_config tests/tt_metal/tt_fabric/test_infra/test_yamls/test_fabric_multi_mesh_stability_short_running.yaml
    TT_METAL_ENABLE_FABRIC_MESH_PASS_THROUGH=1 tt-run --mesh-graph-descriptor {mgd} --hosts "$(hostname)" --mpi-args "--allow-run-as-root" ./build/test/tt_metal/tt_fabric/test_infra/test_tt_fabric --test_config tests/tt_metal/tt_fabric/test_infra/test_yamls/test_fabric_mesh_passthrough.yaml
  skus:
    wh_galaxy:
      timeout: 15
      mgd: tests/tt_metal/tt_fabric/custom_mesh_descriptors/wh_galaxy_split_2x8_2x4_3_mesh.textproto
    bh_galaxy:
      timeout: 10
      mgd: tests/tt_metal/tt_fabric/custom_mesh_descriptors/bh_galaxy_split_2x8_2x4_3_mesh.textproto
  owner_id: U08UBDUKH6Z # Neel Nyamagoudar
  team: scaleout
  budget_type: e2e

# Blackhole Galaxy e2e tests
- id: bh-galaxy-fabric-torus-stability
  name: BH Galaxy Fabric Torus Stability Tests
  cmd: TT_METAL_OPERATION_TIMEOUT_SECONDS=0 ./build/test/tt_metal/tt_fabric/test_infra/test_tt_fabric --test_config tests/tt_metal/tt_fabric/test_infra/test_yamls/test_fabric_2d_torus_stability.yaml
  skus:
    bh_galaxy:
      timeout: 20
  owner_id: U08UBDUKH6Z # Neel Nyamagoudar
  team: scaleout
  budget_type: e2e

- id: bh-galaxy-socket-pipeline
  name: BH Galaxy Socket Pipeline Single Galaxy
  cmd: |
    python tests/tt_metal/tt_fabric/utils/generate_rank_bindings.py
    tt-run --rank-binding bh_galaxy_split_4x2_multi_mesh_rank_binding.yaml --mpi-args "--allow-run-as-root --tag-output" ./build/test/tt_metal/multihost/socket_pipeline/multiprocess/unit_tests_pipeline
  skus:
    bh_galaxy:
      timeout: 10
  owner_id: U08UBDUKH6Z # Neel Nyamagoudar
  team: scaleout
  budget_type: e2e

# BH galaxy is the only Blackhole SKU in CI whose firmware bundle clears the DRAM-programmable-cores
# floor (19.12.0.0), so it is the only place these tests run instead of skipping. Single-device
# suites: they cover the DRAM-core/GCB/prefetcher path itself, not multi-device sharding.
- id: bh-galaxy-tensor-prefetcher
  name: BH Galaxy tensor prefetcher unit tests
  cmd: |
    pytest tests/ttnn/unit_tests/operations/transformers/test_prefetcher_BH_validator.py
    pytest tests/ttnn/unit_tests/operations/transformers/test_prefetcher_BH_tensor_large.py
  skus:
    bh_galaxy:
      timeout: 8
  owner_id: U07R05K4WGJ # John Bauman
  team: ttnn
  budget_type: e2e

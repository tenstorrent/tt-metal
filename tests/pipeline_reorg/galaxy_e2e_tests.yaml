# Per-mesh fabric config (#60499/#60690): heterogeneous per-mesh 2D fabric configs declared AT MGD LEVEL.
# Each of the four MGDs below is a SEPARATE scenario -- each mesh_descriptor carries its own fabric_config
# and each process adopts its own via ControlPlane::adopt_local_mesh_fabric_config. One job runs all four in
# sequence (kernel-compile cache is shared, so this is far cheaper than four separate jobs) and fails if any
# tt-run does. Covered scenarios:
#   1. torus_yx      -- TORUS_Y + TORUS_X + TORUS_Y (3 meshes)
#   2. split_2x4     -- 2x4 TORUS_X split across 2 processes + 2x2 TORUS_Y (one mesh over 2 host ranks)
#   3. config_combo  -- ALL four 2D configs: TORUS_XY + TORUS_X + TORUS_Y + FABRIC_2D, ring-connected
#   4. bigmesh_combo -- 4x4 TORUS_X split across 2 processes + 2x2 TORUS_Y + 2x2 FABRIC_2D, all inter-linked
#
# Runs the torus neighbor_exchange cases of the generic multi_mesh_sanity_common.yaml (selected with
# --filter topology.Torus): topology: Torus is required so test_tt_fabric uses torus unicast routing
# (is_torus_2d_unicast); the yaml's leading topology: Mesh cases would deadlock on the wrap edge, so they
# are filtered out. Each MGD declares a different per-mesh fabric_config; all four pass intra+inter.
- id: galaxy-fabric-per-mesh-torus-yx
  name: Galaxy Fabric per-mesh heterogeneous-config sanity (4 MGDs)
  cmd: |
    set -e
    YAML=tests/tt_metal/tt_fabric/test_infra/test_yamls/test_fabric_multi_mesh_sanity_common.yaml
    MGDDIR=tests/tt_metal/tt_fabric/custom_mesh_descriptors
    for MGD in \
      $MGDDIR/single_galaxy_per_mesh_torus_yx_mesh_graph_descriptor.textproto \
      $MGDDIR/single_galaxy_split_2x4_per_mesh_mesh_graph_descriptor.textproto \
      $MGDDIR/single_galaxy_per_mesh_config_combo_mesh_graph_descriptor.textproto \
      $MGDDIR/single_galaxy_bigmesh_multirank_combo_mesh_graph_descriptor.textproto; do
      echo "=== per-mesh scenario: $MGD ==="
      TT_METAL_OPERATION_TIMEOUT_SECONDS=0 tt-run --mesh-graph-descriptor $MGD --hosts "$(hostname)" --mpi-args "--allow-run-as-root" ./build/test/tt_metal/tt_fabric/test_infra/test_tt_fabric --test_config $YAML --filter topology.Torus
    done
  skus:
    bh_galaxy:
      timeout: 20
  owner_id: U08UBDUKH6Z # Neel Nyamagoudar
  team: scaleout
  budget_type: e2e


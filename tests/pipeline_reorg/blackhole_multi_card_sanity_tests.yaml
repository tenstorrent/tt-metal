# This file defines the test matrix for the multi-card sanity tests pipeline.

# Each entry represents a parallel job with the following keys:
#   id: Stable slug for workflow_dispatch / jq filtering (must match galaxy-tests).
#   name: The display name for the job in GitHub Actions.
#   cmd: The exact command to run for the test.
#   skus: A mapping of SKU names to their configuration.
#     Each SKU entry contains:
#       timeout: The maximum allowed runtime for this job in minutes on that SKU.
#   owner_id: The Slack user ID to notify on failure.
#   team: The team that owns the test.

# For max allowed timeout refer to .github/time_budget.yaml


# CI-ONLY (branch pmilenkovic/llk2-ring-sdpa, not for merge): this branch's dispatch runs only the LLK 2.0
# ring-joint SDPA kernel (TT_RING_SDPA_LLK2=1) on QB2. The other entries of this file are left out here.
- name: LLK 2.0 ring SDPA accuracy (Wan, videogen) (QB2 only)
  cmd: |
    export TT_RING_SDPA_LLK2=1
    pytest tests/nightly/blackhole/sdpa/test_ring_joint_sdpa.py::test_ring_joint_attention_sdpa_accuracy -k "bf16_acc and (wan2_2 or videogen)" -svv
  skus:
    bh_quietbox_2:
      timeout: 40
  owner_id: U085GDCAZTN
  team: ttnn
  budget_type: sanity

- name: LLK 2.0 ring SDPA determinism (Wan, videogen) (QB2 only)
  cmd: |
    export TT_RING_SDPA_LLK2=1
    env -u CI pytest tests/nightly/blackhole/sdpa/test_ring_joint_sdpa.py::test_ring_joint_attention_sdpa_determinism -k "wan2_2 or videogen" -svv
  skus:
    bh_quietbox_2:
      timeout: 40
  owner_id: U085GDCAZTN
  team: ttnn
  budget_type: sanity

- name: LLK 2.0 ring SDPA tt_dit Wan 480p 2x2 (QB2 only)
  cmd: |
    export TT_RING_SDPA_LLK2=1
    pytest models/tt_dit/tests/unit/test_ring_joint_attention.py::test_ring_joint_sdpa -k "wan_14b_480p and bh_qb_ge and q128 and k512 and no_trace_check" -svv
  skus:
    bh_quietbox_2:
      timeout: 40
  owner_id: U085GDCAZTN
  team: ttnn
  budget_type: sanity

- name: LLK 2.0 ring SDPA Wan perf 1.0 vs 2.0 (QB2 only)
  cmd: |
    pytest tests/nightly/blackhole/sdpa/test_ring_joint_sdpa.py::test_ring_joint_attention_perf_check -k wan2_2 -svv || exit $?
    TT_RING_SDPA_LLK2=1 pytest tests/nightly/blackhole/sdpa/test_ring_joint_sdpa.py::test_ring_joint_attention_perf_check -k wan2_2 -svv
  skus:
    bh_quietbox_2:
      timeout: 40
  owner_id: U085GDCAZTN
  team: ttnn
  budget_type: sanity

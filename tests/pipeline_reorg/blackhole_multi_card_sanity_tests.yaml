# This file defines the test matrix for the multi-card sanity tests pipeline.

# Each entry represents a parallel job with the following keys:
#   id: Stable slug for workflow_dispatch / jq filtering (must match galaxy-tests).
#   name: The display name for the job in GitHub Actions.
#   cmd: The exact command to run for the test.
#   skus: A mapping of SKU names to their configuration.
#     Each SKU entry contains:
#       timeout: The maximum allowed runtime for this job in minutes on that SKU.
#   owner_id: The Slack user ID to notify on failure.
#   team: The team that owns the test.

# For max allowed timeout refer to .github/time_budget.yaml


- name: ttnn ops fast unit tests (ccl, DRAM prefetcher)
  cmd: |
    pytest tests/ttnn/unit_tests/operations/ccl/blackhole_CI/box/all_post_commit
    # Disabled due to issue https://github.com/tenstorrent/tt-metal/issues/41040
    # pytest tests/ttnn/unit_tests/operations/transformers/test_prefetcher_BH.py
  skus:
    bh_quietbox_2:
      timeout: 15
    bh_p300:
      timeout: 15
  owner_id: U03BJ1L3LUQ # Mo Memarian
  team: ttnn
  budget_type: sanity

- name: Host IO fast unit test (viommu only)
  # Reload configuration needs slow dispatch; P300 also covers the 1x2 L1 round trip.
  cmd: >-
    TT_METAL_SLOW_DISPATCH_MODE=1 pytest -svv
    models/demos/deepseek_v3_b1/tests/unit_tests/test_host_io.py
    tests/ttnn/unit_tests/base_functionality/test_reload_host_support.py
  skus:
    bh_p300:
      timeout: 10
  owner_id: U03PUAKE719 # Miguel Tairum Cruz
  team: models
  budget_type: sanity

- name: TTNN multi-device CCL, SDPA PERF, and indexer tests (QB2 only)
  cmd: |
    pytest tests/nightly/blackhole/sdpa/ -svv
    pytest tests/ttnn/unit_tests/operations/experimental/test_high_bw_all_gather.py::test_high_bw_all_gather_quietbox_ci_perf -q
    pytest tests/ttnn/nightly/unit_tests/operations/experimental/indexer_score/test_ring_indexer_score_dsa_perf.py -svv
    pytest tests/ttnn/nightly/unit_tests/operations/experimental/indexer_score/test_ring_indexer_score_dsa_4d.py -svv
    pytest tests/ttnn/nightly/unit_tests/operations/experimental/indexer_score/test_ring_indexer_score_dsa.py -k "full_mesh or sptp" -svv
  skus:
    bh_quietbox_2:
      timeout: 40
  owner_id: U085GDCAZTN # Pavle Josipovic
  team: ttnn
  budget_type: sanity

- name: TTNN MSA sp>1 metadata and block-cyclic geometry tests (QB2 only)
  # indexer_score_msa / sparse_sdpa_msa at sp>1: the block-cyclic rotated-start geometry and the trace-safe
  # metadata contract on a mesh. Every case needs 2 or 4 chips -- the mesh_device fixture skips them on one
  # card, so the single-card sdpa/indexer legs collect them without ever exercising a rank other than 0.
  # QB2's four chips cover the (1,2) and (1,4) submeshes both files parametrize; the one (2,2) case skips
  # unless the system mesh is 2D.
  cmd: |
    pytest tests/ttnn/nightly/unit_tests/operations/experimental/indexer_score/test_indexer_score_msa_metadata_multidevice.py -svv
    pytest tests/ttnn/nightly/unit_tests/operations/sdpa/test_sparse_sdpa_msa_block_cyclic_multidevice.py -svv
  skus:
    bh_quietbox_2:
      timeout: 15
  owner_id: U0A5V5Q9SRF # Lukasz Galas
  team: ttnn
  budget_type: sanity

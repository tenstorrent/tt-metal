# TTNN merge-gate smoke matrix (subset of former ttnn_sanity_tests.yaml merge_gate entries).
#
# Each entry: name, cmd, skus: { <sku>: { timeout: N } }, team, owner_id.
#
# sim_wh_n150 / sim_bh_p150 SKUs run the same cmd under the ttsim simulator
# on ubuntu-latest; ttnn-smoke-tests-impl.yaml invokes setup-ttsim for these.
# See .github/actions/setup-ttsim/action.yml.
# Logical SKUs only; merge_group prio routing is via sku_config merge_queue_sku.

- name: "ttnn example tests"
  cmd: "./tests/scripts/run_ttnn_examples.sh"
  skus:
    wh_n300_civ2:
      timeout: 15
    sim_wh_n150:
      timeout: 15
    sim_bh_p150:
      timeout: 15
  team: ttnn
  budget_type: merge_gate
  owner_id: U09AWQGLN77 # Konstantinos Fragkiadakis

# Codegen-path coverage for every op that has one. `-k codegen` picks the tests that force the
# codegen kernels and check them against a golden (torch for pad); a new op joins by appending its
# unit-test file. Auto routing over the op's full config matrix is covered by the nightly routing
# tests under tests/ttnn/nightly.
# The selection is 160 tests, about 35 s of pytest on a Blackhole p150b with a warm kernel cache.
# Hardware only: the simulator would take minutes to cover what hardware covers in seconds.
- name: "ttnn codegen ops"
  cmd: >-
    pytest --timeout 60 -xv
    tests/ttnn/unit_tests/operations/data_movement/test_untilize.py
    tests/ttnn/unit_tests/operations/data_movement/test_repeat.py
    tests/ttnn/unit_tests/operations/data_movement/test_repeat_interleave.py
    tests/ttnn/unit_tests/operations/data_movement/test_gather.py
    tests/ttnn/unit_tests/operations/data_movement/test_pad.py
    tests/ttnn/unit_tests/operations/data_movement/test_reshape_codegen.py
    -k codegen
  skus:
    wh_n300_civ2:
      timeout: 5
  team: ttnn
  budget_type: merge_gate
  owner_id: U07M7QZ0BQA # Camilo Vega -- Slack member ID

# Eltwise infra coverage: broadcast classes, tensor-scalar variants and op-dispatch liveness.
# This gates infrastructure, not accuracy.
#
# Eltwise accuracy lives in the sanity and L2-nightly eltwise groups, and neither runs on a PR
# (pr-gate and merge-gate only invoke smoke-level workflows, and sanity-tests-pr.yaml is gated
# to forks). So an eltwise infrastructure break currently lands on main and is first seen when
# nightly sanity goes red. This entry gates the machinery itself -- a broadcast class that stops
# dispatching, a reader stride that goes wrong, a scalar path that stops being taken, an op that
# stops being registered at all.
#
# Selection is by test name except for the category files, which are taken whole. Three things
# are being covered:
#
# 1. Broadcast and scalar machinery, in depth:
#   subtile ......................... the test_binary_subtile_*_bcast cases: no bcast, row, col,
#                                     scalar, and row_b_col_a
#   where_bcast ..................... ternary broadcast over independent H and W per operand
#   program_cache_..._shapes ........ the broadcast-vs-cache-key interaction, where a wrong key
#                                     silently reuses a program built for different strides
#   test_where_tss / tst / tts ...... the tensor-scalar where variants, which are the ones that
#   test_binary_scalar (whole file) . get missed when only the all-tensor form is exercised
#
# 2. One basic case per op, across the op families, so that an op dropping out of dispatch is
#    caught here rather than in nightly sanity:
#   binary .......................... left/right shift, atan2, nextafter, arithmetic operator
#                                     overloads
#   div (test_div_ops) .............. test_div_output_dtype: bf16/fp32 inputs to bf16/fp32/int32
#                                     outputs over each rounding mode; and int32 tensor / float
#                                     scalar promotion in fast mode
#
# 3. Stratified bfloat16 grids from the category files:
#   binary category1 (whole file) ... add, sub, rsub, multiply, divide and their inplace variants,
#                                     addalpha, subalpha
#   binary category2 (whole file) ... eq, ne, lt, le, gt, ge and their inplace variants, t-t and
#                                     t-s; minimum, maximum; isclose
#   binary category4 (whole file) ... ldexp, logaddexp, logaddexp2, squared_difference, xlogy,
#                                     hypot, bias_gelu, prelu, and their tensor-scalar forms
#   test_logical_ops (category3) .... logical_and/or/xor and their inplace variants, t-t and t-s
#   test_floor_div (category5) ...... floor_div over a full 2048x2048 sweep
#   test_modulo_ops (category5) ..... fmod and remainder, over a (64, 32) tile plus a handful of
#                                     fixed shapes rather than a full sweep
#   ternary category1 (whole file) .. mac, lerp, addcmul, addcdiv and where, over the full 256^3
#                                     grid per op with its exception stages asserted
#   unary category1-6 (whole files) . the unary op surface: math and trig, activations, sqrt/exp/
#                                     log/gelu, parametric activations, the GLU family, and clamp/
#                                     round/unary_chain. Also row-major dispatch (category3) and
#                                     the preallocated output_tensor=/queue_id= path (category4)
#
# Deliberately excluded: the rest of binary category3 and category5 (the div-scalar dtype
# matrices among them) -- they are accuracy and dtype coverage, they cost minutes even with warm
# kernels, and they belong in the nightly eltwise groups where they already run. The unary
# category files are taken whole, celu, inverse trig, fill and clamp/clip included: all six run
# in ~8s with warm kernels.
#
# 1489 tests selected. A slightly larger selection (1642 tests) took 542s locally on an N300 with a
# cold kernel cache, the bulk of it kernel compilation; the unary category files are 427 of those
# tests, ~270s cold and ~8s warm locally. A 1805-test selection took 453s of pytest on wh_n300_civ2
# in CI, 7m42s for the whole step.
# One pytest invocation on purpose: device bring-up is ~7s, so splitting this into per-file entries
# would cost more than the tests do.
#
# Hardware only. Blackhole eltwise coverage in the merge gate comes from the tt-nn-validation-basic
# gtest suite (tests/ttnn/unit_tests/gtests/test_eltwise.cpp), which runs on bh_p150b_civ2_viommu
# as well as wh_n150_civ2.
- name: "ttnn eltwise infra"
  cmd: >-
    pytest --timeout 60 -xv
    tests/ttnn/unit_tests/operations/eltwise/test_binary_bcast.py
    tests/ttnn/unit_tests/operations/eltwise/test_binary_scalar.py
    tests/ttnn/unit_tests/operations/eltwise/test_ternary.py
    tests/ttnn/unit_tests/operations/eltwise/test_where.py
    tests/ttnn/unit_tests/operations/eltwise/test_div_ops.py
    tests/ttnn/unit_tests/operations/eltwise/test_binary_composite.py
    tests/ttnn/unit_tests/operations/eltwise/test_elt_binary.py
    tests/ttnn/unit_tests/operations/eltwise/test_binary_category1_bfloat16.py
    tests/ttnn/unit_tests/operations/eltwise/test_binary_category2_bfloat16.py
    tests/ttnn/unit_tests/operations/eltwise/test_binary_category3_bfloat16.py
    tests/ttnn/unit_tests/operations/eltwise/test_binary_category4_bfloat16.py
    tests/ttnn/unit_tests/operations/eltwise/test_binary_category5_bfloat16.py
    tests/ttnn/unit_tests/operations/eltwise/test_ternary_category1_bfloat16.py
    tests/ttnn/unit_tests/operations/eltwise/test_unary_category1_bfloat16.py
    tests/ttnn/unit_tests/operations/eltwise/test_unary_category2_bfloat16.py
    tests/ttnn/unit_tests/operations/eltwise/test_unary_category3_bfloat16.py
    tests/ttnn/unit_tests/operations/eltwise/test_unary_category4_bfloat16.py
    tests/ttnn/unit_tests/operations/eltwise/test_unary_category5_bfloat16.py
    tests/ttnn/unit_tests/operations/eltwise/test_unary_category6_bfloat16.py
    -k "(subtile or where_bcast or program_cache_different_broadcast_shapes
    or test_where_tss or test_where_tst or test_where_tts
    or (test_div_output_dtype and not sub_core_grids)
    or test_div_int32_float_scalar_promotion_fast_mode
    or test_binary_scalar
    or test_binary_atan2_ttnn or test_floor_div or test_modulo_ops
    or test_logical_ops or test_binary_nextafter_ttnn
    or test_binary_left_shift or test_binary_right_shift
    or test_ternary_category1_bfloat16
    or test_arithmetic_operators
    or test_binary_category1_bfloat16 or test_binary_category2_bfloat16 or test_binary_category4_bfloat16
    or test_unary_category1_bfloat16 or test_unary_category2_bfloat16 or test_unary_category3_bfloat16
    or test_unary_category4_bfloat16 or test_unary_category5_bfloat16 or test_unary_category6_bfloat16)
    and not fused_relu_with_broadcast"
    -m "not disable_fast_runtime_mode"
  skus:
    wh_n300_civ2:
      # The 1470 tests run in ~4 min when every kernel compile hits the (read-only) kernel ccache and in
      # ~10 min when none does, which is every merge-queue run of a PR that touches a header all kernels
      # include (dev_msgs.h, noc_nonblocking_api.h, ...): the cache is only populated from main.
      timeout: 15
  team: ttnn
  budget_type: merge_gate
  owner_id: U09BX3N0N95 # Mateusz Nowak

# Matmul, fused and reduction coverage, reusing the Sanity op groups.
#
# The selection lives in the test files, as @pytest.mark.merge_gate (registered in pytest.ini),
# not as a list of node IDs here.
- name: "ttnn matmul fused reduction ops"
  cmd: >-
    pytest --timeout 60 -xv -m merge_gate
    tests/ttnn/unit_tests/operations/matmul
    tests/ttnn/unit_tests/operations/fused
    tests/ttnn/unit_tests/operations/reduce
  skus:
    wh_n150_civ2:
      timeout: 10
    bh_p150b_civ2_viommu:
      timeout: 10
  team: ttnn
  budget_type: merge_gate
  owner_id: U084B1CES7M # Borys Bradel

# Moreh op coverage: every program factory plus small corner cases. The selection lives in the test files, as

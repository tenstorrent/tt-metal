# PRUNED FOR A CI PROBE -- DO NOT MERGE THIS BRANCH.
#
# Only the "ttnn codegen ops" entry is kept, so the merge-gate run on this throwaway branch
# exercises the untilize codegen coverage and nothing else. The dropped "ttnn example tests" entry
# is unrelated to the untilize port; it is not being skipped because it fails. The real file on
# port/untilize-untilize-wormhole_b0-20260716T183525Z is unchanged.

# Codegen-path coverage for every op ported to tt-dm-codegen (untilize and repeat today).
# `-k codegen` selects each op's tests that pin the codegen kernels, so a newly ported op joins
# this entry by appending its unit-test file rather than by adding another job. How an op pins them
# is the op's own business: untilize calls the verification-only entries in
# ttnn._ttnn.operations.data_movement, since its public API takes no implementation argument, while
# repeat still passes implementation="codegen".
#
# Those pinned tests are the ones worth gating a merge on: they run the codegen kernels and
# compare against native on the same input. The generated routing matrices under
# tests/ttnn/nightly only assert that out-of-scope shapes fall BACK to native, so nothing in
# them fails when a codegen kernel itself breaks -- and they cost 1-5 minutes per op, which is
# why they stay in nightly. This selection is 25 tests, 1.9s of pytest on an N300 with the
# job's warm kernel ccache (~8s cold), no single test over 0.6s.
#
# Hardware only, to keep the gate cheap. Codegen kernels are not blocked from ttsim -- untilize's
# codegen tests pass on both sim SKUs and sanity runs them there -- but the simulator would
# cost minutes here to cover a path hardware already covers in seconds.
- name: "ttnn codegen ops"
  cmd: >-
    pytest --timeout 60 -xv
    tests/ttnn/unit_tests/operations/data_movement/test_untilize.py
    tests/ttnn/unit_tests/operations/data_movement/test_repeat.py
    -k codegen
  skus:
    wh_n300_civ2:
      timeout: 5
  team: ttnn
  owner_id: U07M7QZ0BQA # Camilo Vega -- Slack member ID

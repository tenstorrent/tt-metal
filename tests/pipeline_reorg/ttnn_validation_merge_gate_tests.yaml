# tt-nn-validation-smoke (deb) for merge gate.
#
# Each entry: name, cmd, skus: { <sku>: { timeout: N } }, team, owner_id.
# For max allowed timeout refer to .github/time_budget.yaml (ttnn -> merge_gate).
# TT_METAL_RUNTIME_ROOT is the deb install root the binary defaults to; naming it lets
# verify-changed-tests run the entry against the installed debs.
# PR gate matrix lives in ttnn_validation_pr_gate_tests.yaml (ttnn -> pr_gate).
# Logical SKUs only; merge_group prio routing is via sku_config merge_queue_sku.
# Note: wh_n150_civ2 is intentionally omitted here (PR-gate smoke covers n150).

- name: ttnn validation smoke
  # CPU_ tests run on the github_hosted_cpu entries below.
  cmd: TT_METAL_RUNTIME_ROOT=/usr/libexec/tt-metalium /usr/bin/tt-nn-validation-smoke --gtest_filter='-*CPU_*'
  skus:
    wh_n300_civ2:
      timeout: 15
    wh_llmbox_civ2_viommu:
      timeout: 15
    bh_p150b_civ2_viommu:
      timeout: 10
  team: ttnn
  budget_type: merge_gate
  owner_id: U076Z1JJUQZ # Artem Yerofieiev

# Kernel compile on mock devices, per arch: hand-picked cases + unary sweep, the binary sweep, and the
# ternary and data movement sweeps. An empty TT_METAL_CACHE makes every kernel compile.
- name: ttnn kernel compile wormhole
  cmd: TT_METAL_CACHE=$(mktemp -d) TT_METAL_RUNTIME_ROOT=/usr/libexec/tt-metalium /usr/bin/tt-nn-validation-smoke --gtest_filter='CPU_KernelCompile/*wormhole_*:CPU_KernelCompileSweep/*wormhole_unary_*'
  skus:
    github_hosted_cpu:
      timeout: 15
  team: ttnn
  budget_type: merge_gate
  owner_id: U0BK8PFEXGU # Igor Jankowski

- name: ttnn kernel compile wormhole binary sweep
  cmd: TT_METAL_CACHE=$(mktemp -d) TT_METAL_RUNTIME_ROOT=/usr/libexec/tt-metalium /usr/bin/tt-nn-validation-smoke --gtest_filter='CPU_KernelCompileSweep/*wormhole_binary_*'
  skus:
    github_hosted_cpu:
      timeout: 15
  team: ttnn
  budget_type: merge_gate
  owner_id: U0BK8PFEXGU # Igor Jankowski

- name: ttnn kernel compile wormhole ternary and data movement sweep
  cmd: TT_METAL_CACHE=$(mktemp -d) TT_METAL_RUNTIME_ROOT=/usr/libexec/tt-metalium /usr/bin/tt-nn-validation-smoke --gtest_filter='CPU_KernelCompileSweep/*wormhole_ternary_*:CPU_KernelCompileSweep/*wormhole_dm_*'
  skus:
    github_hosted_cpu:
      timeout: 6
  team: ttnn
  budget_type: merge_gate
  owner_id: U0BK8PFEXGU # Igor Jankowski

- name: ttnn kernel compile blackhole
  cmd: TT_METAL_CACHE=$(mktemp -d) TT_METAL_RUNTIME_ROOT=/usr/libexec/tt-metalium /usr/bin/tt-nn-validation-smoke --gtest_filter='CPU_KernelCompile/*blackhole_*:CPU_KernelCompileSweep/*blackhole_unary_*'
  skus:
    github_hosted_cpu:

# Budget + ownership for the ttnn-run-sweeps pipeline (model_traced / lead_models).
#
# Consumed by verify_time_budget.py AND matrix_runner_config.py. The sweep
# workflow generates its own matrix (compute_sweep_matrix.py); the `cmd` fields
# here are placeholders.
#
# One entry per target so each carries its own owner and per-lane budget. SKU
# names are the EXISTING logical SKUs in .github/sku_config.yaml (infra's
# abstraction layer) that matrix_runner_config resolves runs_on from, so each
# budget line maps 1:1 to the lane its jobs actually run on.
#
# Two numbers, two jobs:
#
#   skus.<sku>.timeout  — the TOTAL budget (minutes) for that target's jobs on
#       that SKU for ONE run: the sum of every batch's timeout. This is the
#       "total budget for the whole SKU" number. verify_time_budget.py sums it
#       per (team, sku) and enforces it against .github/time_budget.yaml ->
#       ttnn.sweep. It does NOT depend on how many batches a run happens to
#       produce (the batch count is dynamic — modules are discovered at runtime).
#
#   batch.default / batch.overrides — the PER-BATCH (per-op) timeout policy.
#       The sweep matrix is dynamic: compute_sweep_matrix.py groups the
#       discovered modules into batches (one GH job each) and stamps each job's
#       `timeout-minutes` = sum over the ops in that batch of their per-op
#       ceiling (an `overrides` entry if the op name matches, else `default`).
#       Sizing per op instead of dividing the SKU total by the batch count means
#       a long op (e.g. all_gather_async) keeps its full ceiling no matter how
#       many other batches the run produced — a uniform total/N split would kill
#       the long batches whenever the batch count dropped.
#
# `default`/`overrides` are per-op minutes; `timeout` is the whole-SKU-per-run
# ceiling. Both were seeded from observed wall-clock (Lead run 29559503564 /
# Model-Traced run 29559513509, latest attempts): lead galaxy ran 29 batches /
# ~4h28m total with the slowest single batch ~26m (a solo all_gather_async).

- name: ttnn sweeps lead models
  target: lead_models
  cmd: 'placeholder - matrix generated by compute_sweep_matrix.py (see ttnn-run-sweeps.yaml)'
  # Per-op batch-timeout policy (minutes). Heavy ops that run in their own solo
  # batch (see LEAD_MODELS_BATCH_POLICY.solo_modules) get a full single-op
  # ceiling; a normal 3-op batch of light ops lands at 3 * default. Anchored
  # here and reused by the model_traced entry below.
  batch: &batch_defaults
    default: 4
    overrides:
      all_gather_async: 30
      conv2d: 26
      reduce_scatter: 24
      all_reduce: 24
      matmul: 15
      linear: 15
      reshape: 12
      split: 12
  skus:
    wh_galaxy:
      timeout: 480
    wh_n150_civ2:
      timeout: 120
  owner_id: U08T3JQEB36 # stevendae
  team: ttnn
  category: sweep

- name: ttnn sweeps model traced
  target: model_traced
  cmd: 'placeholder - matrix generated by compute_sweep_matrix.py (see ttnn-run-sweeps.yaml)'
  batch: *batch_defaults
  skus:
    wh_n150_civ2:
      timeout: 360
    wh_n300_civ2:
      timeout: 360
    wh_llmbox:
      timeout: 480
    bh_p100a_civ2_viommu:
      timeout: 240
    bh_p150b_civ2_viommu:
      timeout: 240
    bh_p300_viommu:
      timeout: 150
  owner_id: U08T3JQEB36 # stevendae
  team: ttnn
  category: sweep

# Budget + ownership for the ttnn-run-sweeps pipeline (model_traced / lead_models).
#
# Consumed by verify_time_budget.py AND matrix_runner_config.py. The sweep
# workflow generates its own matrix (compute_sweep_matrix.py); the `cmd` fields
# here are placeholders.
#
# One entry per target so each carries its own owner and per-lane budget. SKU
# names are the EXISTING logical SKUs in .github/sku_config.yaml (infra's
# abstraction layer) that matrix_runner_config resolves runs_on from, so each
# budget line maps 1:1 to the lane its jobs actually run on.
#
# Two numbers, two jobs:
#
#   skus.<sku>.timeout  — the TOTAL budget (minutes) for that target's jobs on
#       that SKU for ONE run: the sum of every batch's timeout. This is the
#       "total budget for the whole SKU" number. verify_time_budget.py sums it
#       per (team, sku) and enforces it against .github/time_budget.yaml ->
#       ttnn.sweep. It does NOT depend on how many batches a run happens to
#       produce (the batch count is dynamic — modules are discovered at runtime).
#
#   batch.overhead / batch.default / batch.overrides — the PER-BATCH (per-op)
#       timeout policy. The sweep matrix is dynamic: compute_sweep_matrix.py
#       groups the discovered modules into batches (one GH job each) and stamps
#       each job's `timeout-minutes` = `overhead` + sum over the ops in that
#       batch of their per-op ceiling (an `overrides` entry if the op name
#       matches, else `default`). Sizing per op instead of dividing the SKU
#       total by the batch count means a long op (e.g. all_gather_async) keeps
#       its full ceiling no matter how many other batches the run produced — a
#       uniform total/N split would kill the long batches whenever the batch
#       count dropped. `overhead` covers the fixed per-job cost that is not op
#       work at all (container start, artifact download, tt-metal cache warm,
#       device reset): the cheapest sweep job in run 30553811243 still took
#       3.1 min and one download-artifact step alone took 6.5 min.
#
# `overhead`/`default`/`overrides` are minutes; `timeout` is the whole-SKU-per-run
# ceiling. Each target is sized from its OWN observed run — the two targets no
# longer share one policy, because the same per-op numbers that were ample for
# lead models killed a third of the model-traced jobs:
#
#   lead_models   — Lead run 29559503564: 29 galaxy batches / ~4h28m total,
#       slowest single batch ~26m (a solo all_gather_async), ZERO jobs hitting
#       their ceiling. Policy below is unchanged for that reason.
#   model_traced  — Model-Traced run 30553811243: 42 of 119 sweep jobs were
#       killed by timeout-minutes (GH reports these as `cancelled`), every one
#       of them at exactly its stamped ceiling — 3-op batches at 12m (3 x the
#       old default of 4), a 2-op batch at 8m, the 17-op t3k batch at 90m. The
#       jobs that did pass ran 3.1 -> 11.6m against that same 12m wall, i.e. the
#       whole distribution was grazing it. Model-traced ops also run TWICE per
#       job (the two-pass dispatch axis: axis=col then axis=row), which the old
#       single-pass per-op numbers never accounted for.

- name: ttnn sweeps lead models
  target: lead_models
  cmd: 'placeholder - matrix generated by compute_sweep_matrix.py (see ttnn-run-sweeps.yaml)'
  # Per-op batch-timeout policy (minutes). Heavy ops that run in their own solo
  # batch (see LEAD_MODELS_BATCH_POLICY.solo_modules) get a full single-op
  # ceiling; a normal 3-op batch of light ops lands at overhead + 3 * default.
  batch:
    overhead: 6
    default: 4
    overrides:
      all_gather_async: 30
      conv2d: 26
      reduce_scatter: 24
      all_reduce: 24
      matmul: 15
      linear: 15
      reshape: 12
      split: 12
  skus:
    wh_galaxy:
      timeout: 640
    wh_n150_civ2:
      timeout: 150
  owner_id: U08T3JQEB36 # stevendae
  team: ttnn
  category: sweep

- name: ttnn sweeps model traced
  target: model_traced
  cmd: 'placeholder - matrix generated by compute_sweep_matrix.py (see ttnn-run-sweeps.yaml)'
  # Sized from run 30553811243 (see header). `default` is 2x the lead number
  # because every op runs once per dispatch axis (col, then row); the heavy
  # overrides are scaled ~1.5x rather than 2x since their cost is dominated by
  # one long axis. Resulting SKU totals (and the worst single batch) are the
  # `timeout` values below.
  batch:
    overhead: 6
    default: 8
    overrides:
      all_gather_async: 45
      conv2d: 40
      reduce_scatter: 36
      all_reduce: 36
      matmul: 24
      linear: 24
      reshape: 18
      split: 18
  skus:
    wh_n150_civ2:
      timeout: 950   # 27 batches, computed 898
    wh_n300_civ2:
      timeout: 990   # 28 batches, computed 939
    wh_llmbox:
      timeout: 920   # 13 batches after the batch-size cap, computed 873
    bh_p100a_civ2_viommu:
      timeout: 660   # 19 batches, computed 622
    bh_p150b_civ2_viommu:
      timeout: 640   # 18 batches, computed 600
    bh_p300_viommu:
      timeout: 720   # 20 batches, computed 681
  owner_id: U08T3JQEB36 # stevendae
  team: ttnn
  category: sweep

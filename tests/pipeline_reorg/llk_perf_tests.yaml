# LLK perf — matrix for llk-perf / llk-perf-impl; optional speed-of-light,
# -n 15 consumer, perf marker.
# Code coverage is collected in LLK e2e (`llk_e2e_tests.yaml` → llk-e2e-impl), not here (perf and coverage builds don't mix for LLK python_tests).

# LLK perf tests are no longer triggered on PR label "llk:performance"
# ci-quiet log mode is hard-coded.
#
# The env below is only read by this gate, not by llk-perf-impl itself: it mirrors
# what llk-perf-gate.yaml's nightly-measure job passes -- the non-speed-of-light
# nightly (llk-perf.yaml's own schedule trigger always runs speed-of-light).
# SPEED_OF_LIGHT stays false -- a speed-of-light leg is 2-4h per change and nothing
# compares it. LLK_PERF_RUN_TYPES mirrors ALL_MODES, which nightly-measure uses to
# skip L1_CONGESTION (ungated, a fifth of the build); blank would keep it. PIPELINE
# is "pr" since this runs on a pull_request, not the schedule.
#
# {split_group} is substituted with each row's split_group by prepare_test_matrix.py,
# so every group below shares one identical cmd that calls a shared runner in
# tt_metal/tt-llk/tests/: run_llk_perf_wormhole.sh and run_llk_perf_blackhole.sh
# (both shard with --perf-splits / --perf-group).

- name: llk_perf_wormhole group 1/5
  split_group: 1
  team: llk
  budget_type: perf
  cmd: |
    set -euo pipefail
    ./tests/run_llk_perf_wormhole.sh {split_group} 5
  skus:
    wh_n150_civ2:
      timeout: 150
  owner_id: U09UC143684 # Nemanja Divnic
  workdir: tt_metal/tt-llk
  env:
    SPEED_OF_LIGHT: "false"
    LLK_PERF_RUN_TYPES: "ALL_MODES"
    PIPELINE: "pr"
    TT_LLK_DISABLE_ASSERTS: "1"

- name: llk_perf_wormhole group 2/5
  split_group: 2
  team: llk
  budget_type: perf
  cmd: |
    set -euo pipefail

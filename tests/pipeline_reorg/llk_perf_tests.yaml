# LLK perf — matrix for llk-perf / llk-perf-impl; optional speed-of-light,
# -n 15 consumer, perf marker.
# Code coverage is collected in LLK e2e (`llk_e2e_tests.yaml` → llk-e2e-impl), not here (perf and coverage builds don't mix for LLK python_tests).

# ci-quiet log mode is hard-coded.
#
# The env below is read only by verify-changed-tests, when a PR edits this list; llk-perf-impl
# sets the same variables from its inputs. It mirrors the non speed-of-light nightly
# (llk-perf.yaml, 05:00 UTC): a speed-of-light leg is 2-4 h per change. LLK_PERF_RUN_TYPES
# mirrors ALL_MODES, which skips L1_CONGESTION (ungated, a fifth of the build).
#
# {split_group} is substituted with each row's split_group by prepare_test_matrix.py,
# so every group below shares one identical cmd that calls a shared runner in
# tt_metal/tt-llk/tests/: run_llk_perf_leg.sh <arch>
# (both shard with --perf-splits / --perf-group).

- name: llk_perf_wormhole group 1/5
  split_group: 1
  team: llk
  budget_type: perf
  cmd: |
    set -euo pipefail
    ./tests/run_llk_perf_leg.sh wormhole {split_group} 5
  skus:
    wh_n150_civ2:
      timeout: 150
  owner_id: U09UC143684 # Nemanja Divnic
  workdir: tt_metal/tt-llk
  env:
    SPEED_OF_LIGHT: "false"
    LLK_PERF_RUN_TYPES: "ALL_MODES"
    PIPELINE: "pr"
    TT_LLK_DISABLE_ASSERTS: "1"


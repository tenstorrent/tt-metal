# LLK perf — matrix for llk-perf / llk-perf-impl; optional speed-of-light,
# -n 15 consumer, perf marker.
# Code coverage is collected in LLK e2e (`llk_e2e_tests.yaml` → llk-e2e-impl), not here (perf and coverage builds don't mix for LLK python_tests).

# LLK perf tests are no longer triggered on PR label "llk:performance"
# ci-quiet log mode is hard-coded.
# SPEED_OF_LIGHT is supplied by llk-perf-impl and defaults to true in the runners.
# {split_group} is substituted with each row's split_group by prepare_test_matrix.py.
#
# Shards (parametrize rows; math_matmul/matmul each still run 5 PerfRunTypes):
#   1–4  perf_math_matmul.py by MATH_FIDELITY (9320 collected / 8660 run each)
#   5    perf_matmul.py (8000 collected / 7408 run)
#   6    remaining perf tests (not those two files; ~8512 WH / ~8895 BH configured variants)

- name: llk_perf_wormhole group 1/6 math_matmul LoFi
  split_group: 1
  team: llk
  budget_type: perf
  cmd: |
    set -euo pipefail
    ./tests/run_llk_perf_wormhole.sh {split_group} perf_math_matmul.py -k LoFi
  skus:
    wh_n150_civ2:
      timeout: 150
  owner_id: U09UC143684 # Nemanja Divnic


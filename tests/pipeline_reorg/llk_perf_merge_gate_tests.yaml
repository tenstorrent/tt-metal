# LLK perf merge gate: non speed-of-light, L1_TO_L1 only.
# llk-perf-impl sets SPEED_OF_LIGHT and LLK_PERF_RUN_TYPES from its inputs; this
# list only decides the legs. The merge gate measures the queue head and uploads
# it as the merge baseline, so the baseline and the gate always share these legs.
# 15 min is the gate ceiling per leg. Wormhole runs in 3. Blackhole runs in 4, so stage 2 has time
# after stage 1 in the same leg.

- name: llk_perf_merge_gate_blackhole group 1/4
  split_group: 1
  team: llk
  budget_type: merge_gate
  cmd: |
    set -euo pipefail
    ./tests/run_llk_perf_blackhole.sh {split_group} 4
  skus:
    bh_p150b_civ2_viommu:
      timeout: 15
  owner_id: U09UC143684 # Nemanja Divnic
  workdir: tt_metal/tt-llk
  env:
    SPEED_OF_LIGHT: "false"
    LLK_PERF_RUN_TYPES: "L1_TO_L1"
    PIPELINE: "merge_baseline"
    TT_LLK_DISABLE_ASSERTS: "1"


# LLK ttnop (timing-perturbation) sweep — Wormhole only (manual dry-run).
#
# Runs python_tests with -p ttnop_plugin via ttnop/ci.sh: one clean baseline
# per case, then unpack+math sync-site delays 1-100 (ttnop defaults).
#
# Driven by the TEMPORARY bit-exact override on this branch
# (llk-bit-exact.yaml / llk-bit-exact-impl.yaml). PYTEST_MARKERS comes from
# that impl's workflow_call inputs.
# For max allowed timeout refer to .github/time_budget.yaml (llk -> ttnop).
#
# Deliberately no -x: a found race turns that case red, but the suite must
# finish so report.md lists every failing variant.
#
# Sizing, all of it off the one run that actually swept. Group 3 of the old
# 4-way split collected 10198 cases and finished them at ~2.4/min (182 cases
# across 75 min of supervisor progress), so the whole suite is ~40800 cases and
# ~283 shard-hours. That put a quarter of it at ~70h, which is why this is now
# split 15 ways: ~2700 cases and ~19h each. The measurement is extrapolated
# from under 2% of one shard, so treat every number here as an order of
# magnitude.
#
# 15 shards is a large improvement but still not under the ceiling. Runs end
# at ~10h however long the timeout is: in run 31714492632 three shards were
# killed at ~10h08m with "the self-hosted runner lost communication with the
# server", nowhere near even the 30h timeout then in force, so the job timeout
# never fired and was never what ended them. Fitting ~19h shards under ~10h
# needs ~28 shards at this rate, or a coarser TTNOP_DELAYS than 1-100 to cut the
# work per case. The 1440 min (24h) timeout below is sized to the ~19h
# estimate with margin, so that the timeout is not also a limit; it is not a
# claim the shard will finish.
#
# 15 x 1440 = 21600, which llk.ttnop.wh_n150_civ2 in .github/time_budget.yaml
# has to match: verify_time_budget.py sums every shard's timeout for the SKU.
#
# UNKNOWN (ask infra / manager):
#   - owner_id below is the LLK CI default (Nemanja). Change if ttnop should
#     page someone else.
#   - 15 concurrent wh_n150_civ2 machines: does dispatching that many reserve
#     them, or does it queue behind other pipelines?

- name: llk_ttnop_wormhole group 1/15
  split_group: 1
  team: llk
  coverage: false
  cmd: |
    set -euo pipefail
    cd tests/python_tests/ttnop
    ./ci.sh --test . \
      --splits 15 --group 1 \
      --report-dir reports/wormhole-1
  skus:
    wh_n150_civ2:
      timeout: 1440
  owner_id: U09UC143684 # Nemanja Divnic


# ─── kokoro-82m ─────────────────────────────────────────────────────────────

- name: kokoro-82m TTNN demo
  cmd: |
    set -e
    # espeak-ng (G2P backend) must be on PATH; not bundled in the tt-metal image.
    apt-get update && apt-get install -y espeak-ng
    uv pip install -r models/experimental/kokoro/requirements.txt
    # Do NOT point HF_HOME at the cloud-mlperf cache: it is mounted read-only and is
    # not seeded with hexgrad/Kokoro-82M, so the kokoro pipeline's hf_hub_download of
    # the checkpoint + voice packs would fail (OSError: Read-only file system). Kokoro
    # is small and public — let it download to the writable default cache each run.
    TT_LOGGER_LEVEL=Error pytest -s "models/experimental/kokoro/demo/test_demo.py::test_demo[default]" --timeout=1200
  skus:
    bh_p150:
      timeout: 20
  owner_id: TODO_KOKORO_OWNER # TODO: replace with Kokoro owner Slack member ID (U...) before merge
  team: models
  model-name: kokoro-82m

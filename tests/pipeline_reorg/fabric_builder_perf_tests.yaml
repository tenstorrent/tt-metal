# Fabric builder perf matrix — consumed by .github/workflows/tm-fabric-builder-tests-perf-impl.yaml.
# Cold/hot host-side fabric bring-up on wh_llmbox_perf (pipeline-perf runner pool).
#
# Each entry:
#   name: GitHub Actions job display name.
#   cmd: Shell command(s) to run from TT_METAL_HOME (/work). {sku} is replaced
#     with the selected SKU by prepare_test_matrix.py.
#   skus: SKU -> { timeout } (minutes).
#   team: Required for time_budget verification (scaleout).
#   owner_id: Slack user ID to notify on failure.
# `arch` is derived from the SKU inline in the impl workflow's ARCH_NAME
# expression (wh_* -> wormhole_b0), not authored per entry.
#
# The measurement runner disables the device profiler itself. Host zones come
# from the fabric-builder Tracy category compiled into the profiled artifact.
#
# For max allowed timeout refer to .github/time_budget.yaml (scaleout -> perf).

- name: T3K fabric builder cold/hot
  cmd: python3 tests/tt_metal/tt_fabric/fabric_builder_perf/run.py --hardware {sku} --mode report --output generated/fabric-builder/{sku}
  # Keep the list of skus in sync with the skus in tests/tt_metal/tt_fabric/fabric_builder_perf/config.json
  skus:
    wh_llmbox_perf:
      timeout: 45 # TODO FIGURE OUT WHAT TO DO HERE
  team: scaleout
  budget_type: perf
  owner_id: U0BRTUH9VE0 # Amogh Rajagopal TODO SEE IF YOU SHOULD MAKE A FT PERSON THE OWNER

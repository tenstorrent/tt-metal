# This file defines the test matrix for the Galaxy multi-user isolation suite,
# run by galaxy-multi-user-isolation-tests-impl.yaml inside "Galaxy tests".
#
# Each entry is one isolation scenario on one Galaxy: the runner splits the box into
# num_containers docker-compose containers of chips_per_container chips each, runs
# `cmd` inside every container at once, and fails if any container fails. The impl
# reads scenario, num_containers, chips_per_container, container_prefix and
# mesh_descriptor from the entry; {test_path} and {test_args} are substituted into
# cmd by prepare_test_matrix.py.
#
# For max allowed timeout refer to .github/time_budget.yaml (gtm.e2e).

- name: Multi-user isolation single (32x1) wormhole_b0
  # One pytest per container, 32 containers, each holding 1 chip(s).
  cmd: pytest -v {test_path} {test_args}
  scenario: single
  num_containers: 32
  chips_per_container: 1
  container_prefix: chip
  mesh_descriptor: n150_mesh_graph_descriptor.textproto
  test_path: tests/ttnn/unit_tests/operations/eltwise/test_fill.py
  test_args: "-k test_fill"
  skus:
    wh_galaxy:
      timeout: 45
  owner_id: U08FBKRKTB8 # sott0n (co-owner: changh95, U08EFCGHPTR)
  team: gtm
  budget_type: e2e


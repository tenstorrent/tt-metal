    # HF_TOKEN has no access to, so all 13 of its cases fail with a 403 GatedRepoError. This is an
    # access problem, not a caching one -- MLPerf write access does not help.
    # TODO(#54499): get the CI account added to the FLUX.2-dev allowlist, then drop the --ignore.
    # qwen3vl vision_tower is excluded: 8 of its 22 cases fail (6 PCC misses that worsen with
    # aspect ratio -- 98.6% at 4:3, 96.9% at 16:9, 93.1% at 4:1 against a 99% threshold -- plus 2
    # TT_FATAL allocator faults on max_load). Added by #52874 and never run by any pipeline, so
    # these are pre-existing, not regressions. It is also 63 of the leg's 98 minutes.
    # TODO(#54498): hand the PCC/allocator failures to the MiniMax H3 owners, then drop the --ignore.
    # gemma is excluded on two counts: google/gemma-3-12b-it-qat-q4_0-unquantized is gated and CI's
    # token is not on its allowlist (4 cases), and test_gemma_connector_blocks calls a stale
    # EmbeddingsConnector.forward signature (1 case). See #54503.
    # TODO(#54503): allowlist the token and fix the connector call site, then drop the --ignore.
    pytest --timeout 10000 -rs --durations=0 \
      --ignore=models/tt_dit/tests/encoders/mistral3 \
      --ignore=models/tt_dit/tests/encoders/gemma \
      --ignore=models/tt_dit/tests/encoders/qwen3vl/test_qwen3vl_vision_tower.py \
      models/tt_dit/tests/encoders/
  model: dit-encoders
  skus:
    wh_llmbox:
      timeout: 45 # 35m02s measured on run 33021627869, +~28% margin
      tier: 1
  owner_id: U0ATR08RCQ0 # James Lee
  team: models


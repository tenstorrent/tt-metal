# ----------------------------------------------------------------------------
# LTX-2.3 component unit tests (Black Hole single galaxy, bh_sc1)
# ----------------------------------------------------------------------------
- name: TT-DiT LTX-2.3 component unit tests
  cmd: |
    export NO_PROMPT=1
    export HF_HUB_OFFLINE=1
    export HF_HOME=/mnt/models/huggingface
    export TT_DIT_CACHE_DIR="$HOME/.cache/tt-dit"
    export TT_MESH_ID=0
    export TT_MESH_HOST_RANK=0
    export TT_MESH_GRAPH_DESC_PATH="${TT_METAL_HOME}/models/tt_dit/tests/models/ltx/scaleout_configs/single_galaxy/mesh_graph_descriptor.textproto"
    # test_audio_ltx discovers its checkpoint via the DEFAULT hf cache (~/.cache/huggingface), not
    # HF_HOME -- symlink it to the pre-staged /mnt/models cache so it resolves offline (no-op for the rest).
    mpirun --pernode --tag-output bash -lc 'mkdir -p ~/.cache && ln -sfn /mnt/models/huggingface ~/.cache/huggingface' || true
    # One multihost-ci-sc1 leg runs every LTX component test on the 4x8 galaxy (bh_sc1).
    # Block tests use random weights; audio/upsampler/lora resolve offline from /mnt/models.
    # Run all, accumulate failures, fail the leg if any component failed.
    rc=0
    run() { mpirun -np 1 --bind-to none --tag-output --wdir "${TT_METAL_HOME}" python3 -m pytest --timeout 1800 "$@" || rc=1; }
    # Cheap/CPU/block tests first so a slow later test can never starve them out of the leg timeout.
    run models/tt_dit/tests/models/ltx/test_ltx_adapter_loader.py
    run models/tt_dit/tests/models/ltx/test_embeddings_ltx.py
    run models/tt_dit/tests/models/ltx/test_rope_ltx.py
    run models/tt_dit/tests/models/ltx/test_attention_ltx.py     -k "4x8sp1tp0nl2_line_is_fsdp0"
    # video block; ckpt_fast pins one checkpoint_variant (video ignores it -> avoids redundant skips).
    run models/tt_dit/tests/models/ltx/test_transformer_ltx.py   -k "4x8sp1tp0nl2_ring_is_fsdp0 and video and ckpt_fast"
    run models/tt_dit/tests/models/ltx/test_ltx_lora_ondevice.py -k "bh_4x8sp1tp0"
    run models/tt_dit/tests/models/ltx/test_latent_upsampler.py  -k "4x8h0w1nl2_line"
    # heavier last. VAE: drop the 145-frame full-res decode (e2e-scale, >20 min); 9f-2K still covers decode.
    run models/tt_dit/tests/models/ltx/test_vae_ltx.py           -k "4x8h0w1nl2_line and not 145f"
    run models/tt_dit/tests/models/ltx/test_audio_ltx.py         -k "4x8sp1tp0nl2_ring_is_fsdp0 and (stage_a or stage_b)"
    exit $rc
  model: ltx-2.3
  model_family: LTX
  skus:
    bh_sc1:
      timeout: 55
      tier: 1
  owner_id: U0ATR08RCQ0 # James Lee
  team: models

# ----------------------------------------------------------------------------
# WAN 2.2 multihost quad-galaxy tests (bh_sc4 / exabox-multihost-ci-sc4)
# ----------------------------------------------------------------------------
- name: TT-DiT Wan2.2-A14B transformer block unit tests
  cmd: |
    unset HF_HUB_OFFLINE
    export NO_PROMPT=1 TT_METAL_PINNED_MEMORY_CACHE_LIMIT_BYTES=0 TT_METAL_FABRIC_ROUTER_SYNC_TIMEOUT_MS=120000
    MGD="${TT_METAL_HOME}/tt_metal/fabric/mesh_graph_descriptors/32x4_quad_bh_galaxy_torus_xy_graph_descriptor.textproto"
    UNIT_TEST="${TT_METAL_HOME}/models/tt_dit/tests/models/wan2_2/test_transformer_wan.py"
    TTRUN_PY="${TTRUN_PY:-${TT_METAL_HOME}/ttnn/ttnn/distributed/ttrun.py}"
    PIPELINE_DIR="${PIPELINE_DIR:-/tmp/wan-unit-${GITHUB_RUN_ID:-$$}-${GITHUB_JOB:-job}}"
    TTRUN_CWD="${TTRUN_CWD:-${PIPELINE_DIR}/ttrun-cwd}"
    mkdir -p "${PIPELINE_DIR}/ranklogs" "${TTRUN_CWD}"
    RESOLVED_HOSTS=$(awk 'NF {printf "%s,", $1}' /etc/ttop/hostfile | sed 's/,$//')
    test -f "${TTRUN_PY}" || { echo "ERROR: missing ${TTRUN_PY}"; exit 1; }
    test -f "${MGD}" || { echo "ERROR: missing ${MGD}"; exit 1; }
    test -f "${UNIT_TEST}" || { echo "ERROR: missing ${UNIT_TEST}"; exit 1; }

    cd "${TTRUN_CWD}"
    python3 "${TTRUN_PY}" \
      --skip-executable-check \
      --tcp-interface ens5f0np0 \
      --mesh-graph-descriptor "${MGD}" \
      --hosts "${RESOLVED_HOSTS}" \
      --mpi-args "--bind-to none --tag-output --wdir ${TT_METAL_HOME} --output-filename ${PIPELINE_DIR}/ranklogs" \
      -- \
      python3 -m pytest --timeout 10000 "${UNIT_TEST}" -k "4x32sp1tp0nl2_ring_is_fsdp0 and 14b-720p"
  model: wan-2.2-t2v
  model_family: Wan
  skus:
    bh_sc4:
      timeout: 40
      tier: 1
  owner_id: U0ATR08RCQ0 # James Lee

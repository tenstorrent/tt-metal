# ============================================================================
# Multihost (exabox) model-unit tests
# ============================================================================
# Entries whose SKU `runs_on` includes an `exabox-multihost-ci-*` label
# (bh_sc1 → exabox-multihost-ci-sc1, bh_sc4 → …-sc4, bh_sc16 → …-sc16) are routed
# by prepare_test_matrix.py to `models-unit-tests-multihost`. That job runs on the
# matching multihost-ci runner; the runner hook provisions workers from
# `container.image`. The hook exposes host topology under /etc/ttop (hostfile;
# do not rely on rank_bindings.yaml / mgd.textproto). Weights live on /mnt/models.
#
# The example below runs Flux.1-dev DiT unit tests on bh_sc1. The pipeline routes
# it to the multihost job because the SKU label is exabox-multihost-ci-*.
- name: "Flux multihost tests"
  cmd: |
    unset HF_HUB_OFFLINE
    export NO_PROMPT=1
    # Plain single-rank mpirun (no tt-run). Host topology comes from the multihost-ci
    # runner (/etc/ttop/hostfile). The rank owns one connected 4x2 (8-device) block,
    # so run the Flux pipeline's 8-device (2x4) parametrization.
    export TT_MESH_ID=0
    export TT_MESH_HOST_RANK=0
    export TT_MESH_GRAPH_DESC_PATH="${TT_METAL_HOME}/models/tt_dit/tests/models/flux1/scaleout_configs/single_galaxy/mesh_graph_descriptor.textproto"
    export TT_VISIBLE_DEVICES=0,1,4,5,8,9,12,13
    mpirun -np 1 --bind-to none --tag-output --wdir "${TT_METAL_HOME}" \
      python3 -m pytest --timeout 10000 models/tt_dit/tests/models/flux1/test_pipeline_flux1.py -k "flux_dev and 2x4sp0tp1"
  model: flux-multihost-tests
  model_family: Flux
  skus:
    bh_sc1:
      timeout: 20
      tier: 1
  owner_id: U0ATR08RCQ0 # James Lee
  team: models


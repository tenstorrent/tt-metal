# This file defines the test matrix for the Models Unit Tests pipelines.
#
# Each entry represents a parallel job with the following keys:
#   name: The display name for the job in GitHub Actions.
#   cmd: The exact command to run (env vars must be inlined).
#   model: Model identifier for filtering (workflow_dispatch model selection).
#   model_family: (optional) Human-facing model family for grouping/reporting (e.g. Llama, Qwen, Gemma). Omit when a test spans multiple families.
#   skus: A mapping of SKU names to their configuration:
#     timeout: Job timeout in minutes.
#     tier: Model tier (1, 2, or 3) used to filter which pipeline runs this test.
#   owner_id: The Slack user ID to notify on failure.
#   team: The team that owns the test.

# For max allowed timeout refer to .github/time_budget.yaml

- name: Llama 3.1-8B unit tests
  cmd: |
    export TT_METAL_WATCHER=15
    export HF_MODEL=meta-llama/Llama-3.1-8B-Instruct TT_CACHE_PATH=/mnt/MLPerf/huggingface/tt_cache/meta-llama/Llama-3.1-8B-Instruct
    # CPU-only (<10s, no device, no weights): guards the warm-weight-cache marker semantics
    # (variant-qualified markers, fail-closed unverifiable variants, sidecar single-load) that
    # every tt_transformers e2e leg depends on. See #45400.
    pytest --timeout 120 models/tt_transformers/tests/test_warm_cache_marker.py
    pytest --timeout 300 models/tt_transformers/tests/test_embedding.py
    pytest --timeout 300 models/tt_transformers/tests/test_rms_norm.py
    pytest --timeout 600 models/tt_transformers/tests/test_mlp.py
    pytest --timeout 300 models/tt_transformers/tests/test_attention.py
    pytest --timeout 300 models/tt_transformers/tests/test_attention_prefill.py
    pytest --timeout 300 models/tt_transformers/tests/test_decoder.py
    pytest --timeout 400 models/tt_transformers/tests/test_decoder_prefill.py
    # pytest --timeout 500 models/tt_transformers/tests/test_model.py -k full
    # pytest --timeout 500 models/tt_transformers/tests/test_model_prefill.py -k "performance and not accuracy"
  model: llama3.1-8b
  model_family: Llama
  skus:
    wh_n150:
      timeout: 30
      tier: 1
    wh_llmbox_perf:
      timeout: 12
      tier: 2
  owner_id: U03PUAKE719 # Miguel Tairum Cruz
  team: models


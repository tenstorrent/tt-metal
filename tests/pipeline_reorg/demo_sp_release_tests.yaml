# This file defines the test matrix for the SP Demo Release pipeline.
# This pipeline includes tests for:
#   - DeepSeek V3 B1 (decode, host IO, unit tests)
#   - Wan 2.2 (across Galaxy and T3K)

# Each entry represents a parallel job with the following keys:
#   name: The display name for the job in GitHub Actions.
#   cmd: The exact command to run (env vars must be inlined).
#   skus: A mapping of SKU names to their configuration (each SKU has timeout in minutes).
#   owner_id: The Slack user ID to notify on failure.
#   team: The team that owns the test.
#   model: Model identifier for filtering tests.

# For max allowed timeout refer to .github/time_budget.yaml

# ============================================================================
# DeepSeek V3 B1 Host IO and Decoder Sweep Tests (Blitz) - Blackhole P300 and Galaxy
# ============================================================================

- name: bh_p300_DeepSeek_B1_HostIO
  cmd: |
    TT_METAL_SLOW_DISPATCH_MODE=1 pytest -svv models/demos/deepseek_v3_b1/tests/unit_tests/test_host_io.py
  model: deepseek_decode
  skus:
    bh_p300:
      timeout: 10
  owner_id: U03HY7MK4BT
  team: models

- name: "Single Galaxy - Decoder Sweep vs reference (DeepSeek V3 B1)"
  cmd: |
    PIPELINE_HOSTS="${HOSTNAME}:4"
    SCALEOUT_CONFIG_DIR="${TT_METAL_HOME}/models/demos/deepseek_v3_b1/scaleout_configs/rev_c/one_galaxy"
    cp "${SCALEOUT_CONFIG_DIR}/rank_bindings_mapping.yaml" .
    cp "${SCALEOUT_CONFIG_DIR}/rank0_binding.yaml" .
    cp "${SCALEOUT_CONFIG_DIR}/rank1_binding.yaml" .
    cp "${SCALEOUT_CONFIG_DIR}/rank2_binding.yaml" .
    cp "${SCALEOUT_CONFIG_DIR}/rank3_binding.yaml" .
    cp "${SCALEOUT_CONFIG_DIR}/mesh_graph_descriptor.textproto" .
    TTRUN_PY="${TT_METAL_HOME}/ttnn/ttnn/distributed/ttrun.py"

    export HF_MODEL=/mnt/MLPerf/tt_dnn-models/deepseek-ai/DeepSeek-R1-0528-dequantized
    export TT_MODEL_CACHE=/mnt/MLPerf/tt_dnn-models/deepseek-ai/DeepSeek-R1-0528-Cache/CI/test_host_io_v3_b1
    export DEEPSEEK_V3_TRACE_ROOT=/mnt/MLPerf/tt_dnn-models/deepseek-ai/debug_trace
    TT_METAL_SLOW_DISPATCH_MODE=1 python3 "${TTRUN_PY}" \
      --rank-bindings-mapping rank_bindings_mapping.yaml \
      --mpi-args "--allow-run-as-root --host $PIPELINE_HOSTS --map-by slot --bind-to none --tag-output" \
      python3 -m pytest models/demos/deepseek_v3_b1/tests/unit_tests/test_host_io_decoder_sweep_chunked_trace.py::test_run_host_io_decoder_sweep_chunked_trace_world_size_4 \
      --timeout=0
  model: deepseek_decode
  skus:
    bh_galaxy:
      timeout: 30
  owner_id: U0ALAR9B78T # Brayden Zhang
  team: models

- name: "Single Galaxy - Decoder Sweep multi-slot stress (DeepSeek V3 B1)"
  cmd: |
    PIPELINE_HOSTS="${HOSTNAME}:4"
    SCALEOUT_CONFIG_DIR="${TT_METAL_HOME}/models/demos/deepseek_v3_b1/scaleout_configs/rev_c/one_galaxy"
    cp "${SCALEOUT_CONFIG_DIR}/rank_bindings_mapping.yaml" .
    cp "${SCALEOUT_CONFIG_DIR}/rank0_binding.yaml" .
    cp "${SCALEOUT_CONFIG_DIR}/rank1_binding.yaml" .
    cp "${SCALEOUT_CONFIG_DIR}/rank2_binding.yaml" .
    cp "${SCALEOUT_CONFIG_DIR}/rank3_binding.yaml" .
    cp "${SCALEOUT_CONFIG_DIR}/mesh_graph_descriptor.textproto" .
    TTRUN_PY="${TT_METAL_HOME}/ttnn/ttnn/distributed/ttrun.py"

    export HF_MODEL=/mnt/MLPerf/tt_dnn-models/deepseek-ai/DeepSeek-R1-0528-dequantized
    export TT_MODEL_CACHE=/mnt/MLPerf/tt_dnn-models/deepseek-ai/DeepSeek-R1-0528-Cache/CI/test_host_io_v3_b1
    export DEEPSEEK_V3_TRACE_ROOT=/mnt/MLPerf/tt_dnn-models/deepseek-ai/debug_trace
    TT_METAL_SLOW_DISPATCH_MODE=1 python3 "${TTRUN_PY}" \

# This file defines the test matrix for the Galaxy demo tests pipeline.

# Each entry represents a parallel job with the following keys:
#   name: The display name for the job in GitHub Actions.
#   cmd: The exact command to run (env vars must be inlined).
#   model: Model identifier for filtering (workflow_dispatch model selection).
#   skus: A mapping of SKU names to their configuration (each SKU has timeout in minutes).
#   owner_id: The Slack user ID to notify on failure.
#   team: The team that owns the test.

# For max allowed timeout refer to .github/time_budget.yaml

- name: Galaxy Wan2.2 demo tests
  cmd: |
    export TT_DIT_CACHE_DIR=/tmp/TT_DIT_CACHE NO_PROMPT=1 VBENCH_CACHE_DIR=/mnt/MLPerf/vbench TORCH_HOME=/mnt/MLPerf/vbench/torch_hub
    pytest models/tt_dit/tests/models/wan2_2/test_pipeline_wan.py -k "4x8sp1tp0nl4_ring_is_fsdp1 and resolution_720p" --timeout 1500
  model: wan22
  skus:
    wh_galaxy_perf:
      timeout: 25
  owner_id: U06UEFWB4P9 # Colman Glagovich
  team: models

- name: Galaxy DeepSeek v3 demo tests
  cmd: |
    export DEEPSEEK_V3_HF_MODEL=/mnt/MLPerf/tt_dnn-models/deepseek-ai/DeepSeek-R1-0528-dequantized-stacked DEEPSEEK_V3_CACHE=/mnt/MLPerf/tt_dnn-models/deepseek-ai/DeepSeek-R1-0528-Cache/CI MESH_DEVICE=TG
    pytest models/demos/deepseek_v3/demo/test_demo.py -k "tg_stress or tg_upr8" --timeout 900
  model: deepseek_v3
  skus:
    wh_galaxy_perf:
      timeout: 15
  owner_id: U08H32XUS9W # Yousef Al Rawwash
  team: models

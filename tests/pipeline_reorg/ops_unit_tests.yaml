# PRUNED FOR A CI PROBE -- DO NOT MERGE THIS BRANCH.
#
# Only the two data_movement suites are kept. Together they are the untilize port's blast radius:
# the nightly directory holds the generated routing matrix, and the post-commit suite is every
# existing data_movement caller, which now reaches the codegen kernels wherever routing sends them.
#
# Dropped from the data_movement category: the ccl and point_to_point entries, which share the
# category but have nothing to do with untilize. They failed on this branch's previous dispatch and
# would drown the signal here. The real file on
# port/untilize-untilize-wormhole_b0-20260716T183525Z is unchanged, so they still run in the real
# nightly.
#
# Each entry represents a parallel job with the following keys:
#   name: The display name for the job in GitHub Actions.
#   cmd: The exact command to run for the test.
#   skus: A mapping of SKU names to their configuration.
#     Each SKU entry contains:
#       timeout: The maximum allowed runtime for this job in minutes on that SKU.
#   owner_id: The Slack user ID to notify on failure.
#   team: The team that owns the test.
#   category: Selector used by tt-metal-l2-nightly.yaml's additional_test_categories
#     dispatch input. On dispatch the impl filters this matrix to entries whose
#     category appears in the comma-separated list; on schedule the filter is
#     bypassed and every entry runs.

# For max allowed timeout refer to .github/time_budget.yaml

- name: ttnn nightly data_movement tests
  cmd: 'pytest tests/ttnn/nightly/unit_tests/operations/data_movement -xv -m "not disable_fast_runtime_mode" --timeout=600'
  skus:
    wh_n150_civ2:
      timeout: 40
    wh_n300_civ2:
      timeout: 40
    bh_p100:
      timeout: 40
    bh_p150b_civ2:
      timeout: 40
  owner_id: U05ACKAJTHS # Naif Tarafdar
  team: ttnn
  category: data_movement

- name: ttnn nightly data_movement tests (post-commit suite)
  # Measured: bh_p100 ~28 min, bh_p150b ~57 min, wh_n300 ~66 min, wh_n150 ~89 min.
  cmd: 'pytest tests/ttnn/unit_tests/operations/data_movement -xv -m "not disable_fast_runtime_mode" --timeout=300'
  skus:
    wh_n150_civ2:
      timeout: 120
    wh_n300_civ2:
      timeout: 95
    bh_p100:
      timeout: 45
    bh_p150b_civ2:
      timeout: 80
  owner_id: U05ACKAJTHS # Naif Tarafdar
  team: ttnn
  category: data_movement

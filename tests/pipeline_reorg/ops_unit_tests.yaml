- name: ttnn nightly experimental fft tests (wormhole)
  # FFT is Wormhole-B0 only (router preflight TT_FATALs elsewhere), so no bh_ SKUs.
  # Each file runs in its own pytest process: per-file is green, a single-process
  # full-directory run can accumulate LLK device state (see fft conftest). Skip
  # the Blackhole-only diagnostic here.
  cmd: |
    rc=0
    for f in tests/ttnn/nightly/unit_tests/operations/experimental/fft/test_*.py; do
      case "$f" in *test_fft_blackhole_diagnose.py) continue;; esac
      echo "::group::$f"
      pytest "$f" -v --timeout=600 || rc=1
      echo "::endgroup::"
    done
    exit $rc
  skus:
    wh_n150_civ2:
      timeout: 30
  owner_id: U080FKG7KEU # Utku Aydonat
  team: ttnn
  category: experimental


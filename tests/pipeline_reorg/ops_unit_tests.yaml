# The post-commit data_movement / ccl / point_to_point suites are re-run nightly
# to cover the long tail that the PR gate skips. One bucket per suite (these
# replaced a single 3-way `pytest-split` job): the split was by test count, not
# duration, so the groups were badly unbalanced and a group's contents shifted
# whenever tests were added anywhere in the three roots.
#
# Timeouts below are derived from measured per-directory runtimes in run
# 31037640586 (2026-08-05). data_movement is ~89% of the collected tests and
# essentially all of the runtime; ccl is ~11% of collection but ~96% of it skips
# on these single-/dual-chip SKUs (the real coverage needs galaxy/box topologies),
# and point_to_point is 12 tests.
- name: ttnn nightly data_movement tests (post-commit suite)
  # Measured: bh_p100 ~28 min, bh_p150b ~57 min, wh_n300 ~66 min, wh_n150 ~89 min.
  cmd: 'pytest tests/ttnn/unit_tests/operations/data_movement -xv -m "not disable_fast_runtime_mode" --timeout=300'
  skus:
    wh_n150_civ2:
      timeout: 120
    wh_n300_civ2:
      timeout: 95
    bh_p100:
      timeout: 45
    bh_p150b_civ2:
      timeout: 80
  owner_id: U05ACKAJTHS # Naif Tarafdar
  team: ttnn
  category: data_movement


# Weekly on Saturday. Budgets: models.agentic_research_tier<N> in .github/time_budget.yaml.
- name: Llama 3.1-8B QB2 decoder and IFEval serving
  cmd: |
    set -euo pipefail

    cd "${TT_METAL_HOME:?Set TT_METAL_HOME to the tt-metal checkout}"
    model_dir=models/demos/llama31_8b_qb2
    work="$PWD/generated/llama31_8b_qb2"
    results="$PWD/generated/test_reports/llama31_8b_qb2"
    mkdir -p "$work" "$results" generated/test_logs
    export TT_LLAMA_TEXT_VER=llama31_8b_qb2 MESH_DEVICE=P300x2
    export TT_METAL_CACHE="$work/tt-cache"
    export LLAMA_MODEL_PATH
    LLAMA_MODEL_PATH=$(python -c 'from models.demos.llama31_8b_qb2.tt.model import checkpoint_path; print(checkpoint_path())')

    git clone --depth 1 --branch "${VLLM_TT_PLUGIN_REF:-main}" \
        https://github.com/tenstorrent/vllm-tt-plugin.git "$work/vllm-tt-plugin"
    unset VLLM_TT_PLUGIN_REF
    pushd "$work/vllm-tt-plugin"
    source docs/install-vllm-tt.sh
    popd

    python -m pytest "$model_dir/tests/test_adapter.py" "$model_dir/tests/test_decoder.py" \
        --timeout 180 --junitxml "$results/decoder.xml"

    # Keep the pinned scorer's dependencies separate from the serving runtime.
    uv venv "$work/eval-env"
    UV_TORCH_BACKEND=cpu uv pip install --python "$work/eval-env/bin/python" -r "$model_dir/tests/requirements-eval.txt"
    export NLTK_DATA="$work/nltk"
    "$work/eval-env/bin/python" -m nltk.downloader -d "$NLTK_DATA" punkt_tab

    tt_config=$(python - <<'PY'
    import json
    from models.demos.utils.trace_region_sizes import resolve_trace_region_size
    print(json.dumps({"tt": {
        "sample_on_device_mode": "all",
        "trace_region_size": resolve_trace_region_size("llama3.1-8b-qb2", "bh_quietbox_2"),
        "l1_small_size": 16384,
    }}))
    PY
    )
    setsid python -u -m vllm.entrypoints.openai.api_server \
        --model "$LLAMA_MODEL_PATH" --served-model-name meta-llama/Llama-3.1-8B-Instruct \
        --host 127.0.0.1 --port 8000 --block-size 128 --max-num-seqs 32 \
        --max-model-len 131072 --max-logprobs -1 --async-scheduling \
        --additional-config "$tt_config" > generated/test_logs/llama31_8b_qb2_server.log 2>&1 &
    server_pid=$!
    trap 'kill -- -"$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true' EXIT

    for attempt in {1..120}; do
        if curl -fsS http://127.0.0.1:8000/health >/dev/null 2>&1; then break; fi
        kill -0 "$server_pid"
        sleep 4
    done
    curl -fsS http://127.0.0.1:8000/health

    status=0
    HF_HUB_OFFLINE=0 HF_HUB_CACHE="$work/datasets" \
        "$work/eval-env/bin/python" "$model_dir/tests/benchmark.py" --output-dir "$results" || status=$?
    CI=true python -m models.demos.llama31_8b_qb2.tests.report "$results/summary.json"
    exit "$status"
  model: llama3.1-8b-qb2
  model_family: Llama
  skus:
    bh_quietbox_2:
      timeout: 10
      tier: 3
  owner_id: U03HY7MK4BT # Mark O'Connor
  team: models

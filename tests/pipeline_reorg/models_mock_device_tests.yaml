# Model memory-budget checks on the mock device: no Tenstorrent hardware, real allocator and kernel JIT.
#
# Each entry sets TT_METAL_MOCK_CLUSTER_DESC_PATH to a checked-in cluster descriptor and runs a test that
# is mock-only (it skips without the variable). The runner needs the model weights
# (MINIMAX_H3_MODEL_PATH or the HuggingFace cache) and, for a fast run, TT_DIT_CACHE_DIR; without
# weights the test skips rather than fails. Run through fabric-cpu-only-tests-impl.yaml with
# tests-yaml-path pointing at this file.

- id: minimax-h3-ref2va-ladder-mock-wh-4x8
  name: minimax-h3 ref2va ladder binds on mock Wormhole 4x8
  cmd: |
    export TT_METAL_MOCK_CLUSTER_DESC_PATH=tt_metal/third_party/tt-cluster-descriptors/wormhole/6u_cluster_desc/6u_cluster_desc.yaml
    export MINIMAX_H3_DRAM_PROBE=1
    pytest models/tt_dit/tests/models/minimax_h3/test_mock_oom_minimax_h3.py -s --timeout 5400
  skus:
    cpu_medium:
      timeout: 100
  team: models
  budget_type: unit
  arch: wormhole_b0
  owner_id: U_TODO # James Lee -- replace with the Slack member id used by the other matrices

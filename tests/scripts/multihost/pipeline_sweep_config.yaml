# Pipeline-sweep MGD generator config (see gen_pipeline_sweep_mgds.py).
#
# Each shape lists stage counts for the SC36 mock (36 hosts x 32 ASICs = 1152 ASICs).
# The largest ring per shape exactly fills the mock: 144 x 8 = 72 x 16 = 1152.
#
# Pinnings (4x4 only): a many-to-many corner group plus 1:1 anchors, matching the subtorus 4x4
# pipeline MGDs. Any chip in a group may map to any position in that group and the solver enforces
# a bijection. A 4x4 slice occupies 4 trays x 4 asic_locations, and the two slices of a 1x2
# split-host galaxy use disjoint location columns (3/4/7/8 vs 1/2/5/6), so the corner group offers
# both columns and positions absent from a mesh are filtered out -- one set of entries covers every
# mesh. Each anchor is its own constraint, so the anchor for the column a mesh lacks drops away.
#
# A group names its chips with either chip_ids (one entry per chip) or chip_id_regex, and each
# position takes either tray_id or tray_id_regex. Regex fields accept ranges ("1-4"), comma lists
# ("0,3,12,15") and regexes ("[0-9]*").

shapes:
  2x4:
    stages: [16, 32, 64, 80, 96, 112, 128, 144]

  4x4:
    stages: [8, 16, 32, 40, 48, 56, 64, 72]
    pinnings:
      groups:
        - name: corners, both location columns
          mesh_id_regex: "[0-9]*"
          chip_id_regex: "0,3,12,15"
          positions:
            - { tray_id_regex: "1-4", asic_location: 3 }
            - { tray_id_regex: "1-4", asic_location: 2 }
        - name: orientation anchor, 3/4/7/8 column
          mesh_id_regex: "[0-9]*"
          chip_ids: [1]
          positions:
            - { tray_id: 1, asic_location: 7 }
        - name: orientation anchor, 1/2/5/6 column
          mesh_id_regex: "[0-9]*"
          chip_ids: [2]
          positions:
            - { tray_id: 4, asic_location: 6 }

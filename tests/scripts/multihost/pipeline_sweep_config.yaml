# Pipeline-sweep MGD generator config (see gen_pipeline_sweep_mgds.py).
#
# Each shape lists stage counts for the SC36 mock (36 hosts x 32 ASICs = 1152 ASICs).
# The largest ring per shape exactly fills the mock: 144 x 8 = 72 x 16 = 1152.
#
# Pinnings (4x4 only): many-to-all groups keyed by mesh_id_regex. Each group lists logical
# chip_ids and physical tray/asic positions; any chip may map to any position and the solver
# enforces a bijection. Position sets alternate by mesh-id parity for the 1x2 split-host galaxy.

shapes:
  2x4:
    stages: [16, 32, 64, 80, 96, 112, 128, 144]

  4x4:
    stages: [8, 16, 32, 40, 48, 56, 64, 72]
    pinnings:
      groups:
        - name: even
          mesh_id_regex: "[0-9]*[02468]"
          chip_ids: [0, 1, 3, 12, 15]
          positions:
            - { tray_id: 1, asic_location: 3 }
            - { tray_id: 1, asic_location: 7 }
            - { tray_id: 2, asic_location: 3 }
            - { tray_id: 3, asic_location: 3 }
            - { tray_id: 4, asic_location: 3 }
        - name: odd
          mesh_id_regex: "[0-9]*[13579]"
          chip_ids: [0, 1, 3, 12, 15]
          positions:
            - { tray_id: 1, asic_location: 2 }
            - { tray_id: 1, asic_location: 6 }
            - { tray_id: 2, asic_location: 2 }
            - { tray_id: 3, asic_location: 2 }
            - { tray_id: 4, asic_location: 2 }

---
test-list:
  - eltwise-nextafter:
      shape:
        start-shape: [1, 1, 32, 32]
        end-shape: [6, 12, 256, 256]
        interval: [1, 1, 32, 32]
        num-dims: [4]
        num-shapes: 2
        num-samples: 128
        args-sampling-strategy: "all"
      env:
        # TT_PCI_DMA_BUF_SIZE: "1048576"
      datagen:
        function: gen_rand
        args:
          low: -100
          high: 100
      comparison:
        # comp_equal, not comp_pcc: nextafter lands within one ULP of its first operand, so PCC
        # against the golden stays near 1.0 even when the op returns that operand untouched. At
        # its default 0.99 this sweep could not have caught the fixed-epsilon bug it exists to
        # guard, and cannot catch a regression to it either.
        function: comp_equal
      args-gen: gen_dtype_layout_device
      sanitize-args: False
      args:
        inputs:
          - input-1:
            data-layout: ["TILE"]
            data-type: ["BFLOAT16"]
            buffer-type: ["DRAM", "L1"]
          - input-2:
            # BFLOAT8_B dropped: nextafter steps one ULP of the destination format, which a
            # block-float tile cannot represent, and it requires both operands to share a dtype.
            data-layout: ["TILE"]
            data-type: ["BFLOAT16"]
            buffer-type: ["DRAM", "L1"]
        out-buffer-type: ["DRAM", "L1"]
      output-file: nextafter_sweep.csv

rank_bindings:
  - {rank: 0, mesh_id: 0, mesh_host_rank: 0, env_overrides: {}}
mesh_graph_desc_path: tt_metal/fabric/mesh_graph_descriptors/single_bh_galaxy_torus_x_graph_descriptor.textproto
global_env:
  PREFILL_MANIFEST: "models/demos/deepseek_v3_d_p/tt/runners/manifests/kimi26.json"
  PREFILL_NUM_LAYERS: "61"                 # K2.6's real depth. [MATCH PRODUCER]
  PREFILL_SP: "8"                          # 8x4 = one 32-chip BH galaxy = the single stage
  PREFILL_TP: "4"
  PREFILL_CHUNK_SIZE: "5120"
  PREFILL_MAX_SEQ_LEN: "56320"             # 11 chunks — the full length of the golden trace below
  PREFILL_H2D_SERVICE_ID: "kimi26_prefill" # MUST equal the producer's h2d_service_id
  PREFILL_GATE_FALLBACK_MODE: "DEVICE_FP32"
  PREFILL_FABRIC_MODE: "2d"

  PREFILL_NUM_USERS: "3"

  # Emit each completed-layer ack over D2H to /tt_prefill_layer_acks_kimi26_prefill.
  PREFILL_ENABLE_LAYER_ACK: "1"
  PREFILL_LAYER_ACK_D2H: "1"

  # After shutdown, validate only the slot that received the final chunk against its assigned trace.
  PREFILL_REQUEST_LOOP_PCC: "1"
  PREFILL_TRACE_DIR: "/mnt/models/deepseek-prefill-cache/golden/structured_traces/kimi_debug_55k_vllm"
  PREFILL_REQUEST_LOOP_SLOT_TRACES: "/mnt/models/deepseek-prefill-cache/golden/structured_traces/kimi_longbook_55k_vllm,/mnt/models/deepseek-prefill-cache/golden/structured_traces/kimi_debug_55k_vllm,/home/jameszianxu/tt-metal/prompt_generation_testing/generated_traces"
  PREFILL_STANDALONE_CHUNKED_PCC: "0.88"
# Dream-RSI campaign: moe_grouped_topk (prefill MoE gate) latency on one Blackhole chip.
name: moe-grouped-topk
description: moe_grouped_topk prefill MoE gate latency (device kernel time) on one Blackhole chip, 6 production model gates at 640 tokens/chip
machine: local          # 4x BH p300c visible; the test uses 1 chip

editable:
  - ttnn/cpp/ttnn/operations/experimental/deepseek_prefill/moe_grouped_topk/*
  - tt_metal/hw/ckernels/blackhole/*
brief: brief.md
rules:
  - "Keep the compute config of the baseline: MathFidelity::HiFi4, fp32_dest_acc_en=true, math_approx_mode=false. Do not switch the score functions (sigmoid, softplus, sqrt) to approximate or lower-precision variants."
  - "The gate math stays fp32 end to end (fp32 intermediate CBs, fp32 sort keys). Do not narrow intermediates to bf16/bfp8."
  - "Keep the op's interface and contracts: stable_sort lowest-index-first tie order, padding_config sentinel rows (index == n_experts), the optional biased_scores debug output, TILE and ROW_MAJOR weights layouts, fp32 or bf16 inputs, n_groups > 1 grouped routing and n_groups == 1 plain top-k."
  - "moe_gate_common_compute.hpp is also compiled into moe_hash_gate; any change to it must keep moe_hash_gate correct (tests/ttnn/nightly/unit_tests/operations/experimental/deepseek_prefill/test_moe_hash_gate.py)."
  - "Before committing, also run the op's existing correctness suites in tests/ttnn/nightly/unit_tests/operations/experimental/deepseek_prefill/ (test_moe_grouped_topk.py, _stable, _ties, _state, _row_major_weights) and keep them passing."
forbidden_patterns:
  - 'math_approx_mode\s*=\s*true'
  - 'MathFidelity::(HiFi3|HiFi2|LoFi)'

eval:
  command: >-
    python agent_orch/adapters/ttmetal_op_perf.py
    --test tests/ttnn/nightly/unit_tests/operations/experimental/deepseek_prefill/test_moe_grouped_topk_prefill_perf.py
    --op-code MoeGroupedTopkDeviceOperation --warmup 3 --measured 10
  direction: minimize
  unit: us
  # Baseline per case: recall 0.9955-0.9980, set_weights_max_abs 0.0003-0.0022.
  gates: ["recall >= 0.995", "set_weights_max_abs <= 0.004"]
  timeout_s: 1200

budget: {max_attempts: 60, max_hours: 8, max_usd: 300}
search:
  policy: fresh
  W: 4
  R: 4
  beta: 0.6
  max_rounds: 6
  round_root: origin
dreaming: {revisions: 5, cost_per_attempt: 0.005, parallel_bonus: 0.01}

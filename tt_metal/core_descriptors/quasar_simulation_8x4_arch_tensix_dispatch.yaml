# Anything using [[#, #]] is logical coordinates (Can be relative)
# relative index: 0 means first row, -1 means last row of functional grid...

# product name:
#   num of HW command queues:
#     core descriptor config

unharvested:
  row:
    1:
      compute_with_storage_grid_range: # Logical only start and end [x, y]
        start: [2, 2]
        end: [8, 5]


      dispatch_cores:
        [[-1, -1], [-1, -1]]

      dispatch_core_type:
        "tensix"

    2:
      compute_with_storage_grid_range: # Logical only start and end [x, y]
        start: [2, 2]
        end: [8, 5]


      # One live corner tile per CQ (only the four corners are live on qsr.s1): [-1, -1] is (9,5), [-1, 0] is (2,5).
      dispatch_cores:
        [[-1, -1], [-1, -1], [-1, 0], [-1, 0]]

      dispatch_core_type:
        "tensix"

import os
import shlex


parent_substitutions = dict(config.substitutions)
tt_llk_root = parent_substitutions["%{tt_llk_root}"]
blackhole_root = parent_substitutions["%{blackhole_root}"]
blackhole_common_include = parent_substitutions["%{blackhole_common_include}"]
blackhole_llk_include = parent_substitutions["%{blackhole_llk_include}"]

tool_bin = os.path.join(tt_llk_root, "tests", "sfpi", "compiler", "bin")
compiler = os.path.join(tool_bin, "riscv-tt-elf-g++")
objdump = os.path.join(tool_bin, "riscv-tt-elf-objdump")

missing_tools = [
    path
    for path in (compiler, objdump)
    if not os.path.isfile(path) or not os.access(path, os.X_OK)
]

if missing_tools:
    lit_config.warning(
        "Blackhole HAL tests are unsupported; missing tools: "
        + ", ".join(missing_tools)
    )
    config.unsupported = True
else:
    compile_command = [
        compiler,
        "-mcpu=tt-bh-tensix",
        "-O3",
        "-ffunction-sections",
        "-std=c++17",
        "-ftt-nttp",
        "-ftt-constinit",
        "-ftt-consteval",
        "-ftt-no-dyninit",
        "-ffast-math",
        "-fno-exceptions",
        "-fno-rtti",
        "-fno-use-cxa-atexit",
        "-mno-tt-fix-whbhebreak",
        "-DTENSIX_FIRMWARE",
        "-DENV_LLK_INFRA",
        "-DKERNEL_BUILD",
        "-DENABLE_LLK_ASSERT",
        "-DARCH_BLACKHOLE",
        "-DLLK_BOOT_MODE_BRISC",
        f"-I{os.path.join(tt_llk_root, 'tests', 'sfpi', 'include')}",
        f"-I{blackhole_llk_include}",
        f"-I{os.path.join(blackhole_root, 'llk_lib', 'hal')}",
        f"-I{blackhole_common_include}",
        f"-I{os.path.join(blackhole_common_include, 'sfpu')}",
        f"-I{os.path.join(tt_llk_root, 'common')}",
        f"-I{os.path.join(tt_llk_root, '..', 'hw', 'inc')}",
        f"-I{os.path.join(tt_llk_root, '..', 'hw', 'inc', 'internal', 'tt-1xx', 'blackhole')}",
    ]
    config.substitutions.extend(
        [
            ("%{blackhole_tensix_compile}", shlex.join(compile_command)),
            ("%{blackhole_objdump}", shlex.quote(objdump)),
            (
                "%{blackhole_unpack_thread}",
                "-DCOMPILE_FOR_TRISC=0 -DLLK_TRISC_UNPACK",
            ),
            (
                "%{blackhole_math_thread}",
                "-DCOMPILE_FOR_TRISC=1 -DLLK_TRISC_MATH",
            ),
            (
                "%{blackhole_pack_thread}",
                "-DCOMPILE_FOR_TRISC=2 -DLLK_TRISC_PACK",
            ),
        ]
    )

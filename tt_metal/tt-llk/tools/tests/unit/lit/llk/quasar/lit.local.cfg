import os
import shlex


tt_llk_root = dict(config.substitutions)["%{tt_llk_root}"]
quasar_root = os.path.join(tt_llk_root, "tt_llk_quasar")

compiler = os.path.join(tt_llk_root, "tests", "sfpi", "compiler", "bin", "riscv-tt-elf-g++")

if not os.access(compiler, os.X_OK):
    lit_config.warning(f"Quasar LLK tests are unsupported; missing tool: {compiler}")
    config.unsupported = True
else:
    compile_command = [
        compiler,
        "-mcpu=tt-qsr32-tensix",
        "-O3",
        "-std=c++17",
        "-ftt-nttp",
        "-ftt-constinit",
        "-ftt-consteval",
        "-ftt-no-dyninit",
        "-ffast-math",
        "-fno-exceptions",
        "-fno-rtti",
        "-fno-use-cxa-atexit",
        "-DTENSIX_FIRMWARE",
        "-DENV_LLK_INFRA",
        "-DKERNEL_BUILD",
        "-DARCH_QUASAR",
        "-DLLK_BOOT_MODE_TRISC",
        f"-I{os.path.join(tt_llk_root, 'tests', 'sfpi', 'include')}",
        f"-I{os.path.join(quasar_root, 'llk_lib')}",
        f"-I{os.path.join(quasar_root, 'llk_lib', 'hal')}",
        f"-I{os.path.join(quasar_root, 'common', 'inc')}",
        f"-I{os.path.join(quasar_root, 'common', 'inc', 'sfpu')}",
        f"-I{os.path.join(tt_llk_root, 'common')}",
        f"-I{os.path.join(tt_llk_root, '..', 'hw', 'inc')}",
        f"-I{os.path.join(tt_llk_root, '..', 'hw', 'inc', 'internal', 'tt-2xx', 'quasar')}",
    ]
    config.substitutions.extend(
        [
            ("%{quasar_tensix_compile}", shlex.join(compile_command)),
            ("%{quasar_tensix_diagnose}", shlex.join(compile_command + ["-fsyntax-only"])),
            ("%{quasar_unpack_thread}", "-DCOMPILE_FOR_TRISC=0 -DLLK_TRISC_UNPACK"),
            ("%{quasar_math_thread}", "-DCOMPILE_FOR_TRISC=1 -DLLK_TRISC_MATH"),
            ("%{quasar_pack_thread}", "-DCOMPILE_FOR_TRISC=2 -DLLK_TRISC_PACK"),
        ]
    )

# Chip class selects the checked-in baseline (sfpu_device_baseline_<class>_v1.tsv).
# Baselines are NEVER modified by the sweeps: drift is reported; updates are a
# reviewed manual step (see corpus/README.md "Baseline update procedure").
: "${CHIP_CLASS:=p150}"

# VERDICT METRIC (owner ratification 2026-08-21, lane ET): WIN/PARITY/LOSS
# verdicts are decided by END-TO-END DEVICE KERNEL TIME — the drain-inclusive
# KERNEL profiler marker — for EVERY row.  The ops-TSV `marker` column is the
# DIAGNOSTIC zone: mechanism attribution needs it, it never decides a
# verdict.  Every perf leg records BOTH zones from ONE device run (the post
# CSV carries a KERNEL row for every module — verified across all 14 perf
# modules of the pin-15 weekly), so the dual metric costs zero device time.
# The HANDOFF §1 issue-slot lower-bound gate applies ONLY to the diagnostic
# zone: the KERNEL zone is structurally drain-inclusive (it closes after the
# math thread's final drain), so a KERNEL reading can never be the
# fire-and-forget under-count that caveat guards against.  Two baselines:
#   sfpu_device_baseline_<class>_v1.tsv — diagnostic (body-zone) anchors,
#     kept for the diagnostic column and as the drift tripwire until a row
#     has v2 anchors (sweep handover rule);
#   sfpu_device_baseline_<class>_v2.tsv — KERNEL-scoped VERDICT anchors,
#     seeded from the e2e re-measure weekly via a reviewed baseline update
#     (tools/seed_kernel_baseline.py + review); conf_lint R5b/R6b anchor its
#     header to the pins once it exists.
# Pre-registered expectation (owner, same ratification): shared unpack/pack
# and per-kernel fixed overhead are identical in both arms, so KERNEL deltas
# COMPRESS toward zero versus body-zone deltas — wins stay wins but shrink,
# some parities become indistinguishable.  That compression is the truth the
# metric change was ordered to expose, not a regression.

# ES-F1 device-hang recovery (lane ET): after any TENSIX TIMED OUT device
# leg the sweep runs the sanctioned fleet flush under both flocks and then
# proves device health with ONE known-good correctness node before further
# device work; until the verify PASSES every failing leg is marked
# DEVICE-POISONED (collateral suspect) in its RED.  Overridable here:
: "${SWEEP_FLUSH_SH:=$HOME/fleet/flush.sh}"
export SWEEP_FLUSH_SH
# Default verify node lives in sweep_2x2.py (FLUSH_VERIFY_NODE); override:
# export SWEEP_FLUSH_VERIFY_NODE="<pytest node id>"

# YELLOW threshold for |measured - baseline| causal/vs-hand percentage drift.
: "${MAX_DRIFT_PCT:=5}"

# RED threshold for per-cell ABSOLUTE cycle drift vs baseline (uniform
# slowdowns preserve every ratio, so ratios alone cannot see them); cells
# that IMPROVED beyond it flag YELLOW (stale baseline, reviewed update).
: "${MAX_ABS_DRIFT_PCT:=10}"

# RED threshold (percentage points) for a baseline loss growing bigger:

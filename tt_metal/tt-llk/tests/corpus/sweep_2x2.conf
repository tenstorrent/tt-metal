# YELLOW threshold for |measured - baseline| causal/vs-hand percentage drift.
: "${MAX_DRIFT_PCT:=5}"

# RED threshold for per-cell ABSOLUTE cycle drift vs baseline (uniform
# slowdowns preserve every ratio, so ratios alone cannot see them); cells
# that IMPROVED beyond it flag YELLOW (stale baseline, reviewed update).

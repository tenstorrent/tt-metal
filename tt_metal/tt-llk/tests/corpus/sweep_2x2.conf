# corpus/sweep_2x2.conf — shared configuration for the scheduled BH sweeps.
# Sourced by nightly_bh_sweep.sh / weekly_bh_sweep.sh.  Non-pin values are
# env-overridable defaults; knobs/rows/paths live HERE, never in script
# bodies.  Machine defaults below are tt-quietbox-0's pinned toolchain/sim
# layout.
#
# THE TOOLCHAIN PINS ARE NOT ENV-OVERRIDABLE (sweep-hardening round 2,
# adversarial finding sweep_2x2.conf:31): a PINNED_* value leaking from a
# wrapper/CI environment used to silently replace the reviewed pin.  An
# environment value that differs from the reviewed value below is a FATAL
# error unless ALLOW_PIN_OVERRIDE=1 is set (the wrappers set it for
# --allow-pin-override and log the override loudly).  Pins are FULL 64-hex
# sha256 values; sweep_2x2.py rejects prefixes.

# Pinned toolchain — PRIMARY pin is CC1PLUS (the compiler proper), resolved
# through the driver via `g++ -print-prog-name=cc1plus`.  The g++ DRIVER
# sha256 is kept as a SECONDARY check (PULL_ANALYSIS D6): across
# cc1plus-only rebuilds the driver is byte-identical (proven by the
# 33221397 incident below), so a driver-only pin is structurally blind —
# but note the converse does not hold: a full sfpi rebuild changes the
# driver too (this pin's rebuild moved the driver 4633999c… → 4f7ff8bf…).
# The sweep ABORTS LOUDLY if the resolved cc1plus sha256 does not equal
# PINNED_CC1PLUS_SHA256, if the driver sha256 does not equal
# PINNED_COMPILER_SHA256, if the removed WP8 exact-calendar flags
# (-mtt-tensix-{analyze,emit}-loadmacro) do NOT error on use, or if the
# tests/sfpi symlink's toolchain diverges from --compiler (the pytest
# harness hardcodes tests/sfpi/compiler/bin; preflight records the
# symlink's realpath and re-verifies the resolved cc1plus at every phase).
#
# CURRENT PIN (values below): cc1plus a45dbca55824… / driver 82f494c16ec8…
# is the sfpi build of sfpi-gcc a96a9cd678d = the overnight research wave on
# top of 007a9c42294: R1 derived timing calendars (SequenceBits/delay
# derivation from ISA-spec+executor+hand-init table facts; 77/77 frozen-word
# reproduction; first derived-calendar formation on unarymaxmin), R2
# setexp-fold (-mtt-tensix-optimize-setexp-fold, NOW IN THE ON SET + KNOBS;
# exp capture 17->16, sdpa 16->15) + corrected concurrent-delivery model,
# R3 Where WP10 (materialized lane proof, derived compact 3-slot calendar,
# opt-in -mtt-tensix-macro-planner-replay — DELIBERATELY NOT in the ON set
# pending the Where device adjudication/promotion blocker), R4 LUT
# increment 2 (coefficient preheader placement + SGN_RETAIN; sigmoid-tree
# 17->4 slots/row). Built at sfpi tip (pin commit); rebuild log
# ~/sfpi-uplift/toolchain-rebuild-research.log (EXIT=0). WATCH ITEMS this
# pin: unarymaxmin sem-ON now FORMS a derived macro (bytes change; if slower
# than the replay-path win the flip detector fires -> formation-vs-replay
# profitability arbitration is the planned fix); sigmoid-tree expects a
# large drift-improvement; exp predicted ~91.6 raw/8; sdpa re-measures.
#
# PIN HISTORY (proof of D6's value):
#   1. 33221397ebb2… — first candidate; looked recalibrated (same driver sha
#      4633999c…) but was built from gcc cd0af49be5c BEFORE the submodule
#      advanced to bb56f1d7797.  The 2x2 pinpair gate CAUGHT it on device
#      (generated 855.5 vs hand 839 = the pre-recalibration regression,
#      WIN→LOSS FLIP RED; nightly-20260816/REPORT-staletoolchain-RED-catch.md).
#   2. e302718c2532700b… — verified stage2 rebuild from the bb56f1d7797
#      submodule; generated Reduce-SDPA .text byte-identical to the gate-fix
#      hybrid's D1-hoisted form.
#   3. afe05a8668c4… — the P0+smag build (sfpi-gcc a2c3cad2631, sfpi d82fb3b).
#      Its confirming nightly-20260816b: 13 GREEN, add/sub_int −34.8% wins
#      confirmed, ONE RED (unarymaxmin causal flip) root-caused to the
#      recalibrated gate firing into an execution-saturated loop.
#   4. 9827aaacc829… — the context-model build; fixed the unarymaxmin flip
#      in the refusing direction; its nightly-20260816c went ALL GREEN.
#   5. 658490c028e6… — the six-lane wave-union build (Lane AA GO); its
#      nightly-20260817 GREEN (addcmul flipped to a -10.9% win) and
#      weekly-20260817d GREEN (full knob table).
#   6. a45dbca55824… (CURRENT) — the overnight research-wave build described
#      above.
#
# RULE: this prose is part of the pin.  Any commit that changes the
# PINNED_* values MUST update this comment block in the SAME commit to
# describe the new build's provenance (source commits, what changed vs the
# previous pin, verification evidence) — a re-pin that edits only the sha
# values leaves the audit trail lying about what the pin is.

_REVIEWED_CC1PLUS_SHA256=a45dbca5582444b0b3ead624df19c9d354ecdbf305f6981aab0ca877752bc1e3
_REVIEWED_COMPILER_SHA256=82f494c16ec88201ea5c15c079252aa85feff246a1414075eb7638de1b92c33a

_sweep_conf_pin_guard() {
  # $1 = pin variable name, $2 = reviewed value.
  local _name=$1 _reviewed=$2 _env_val
  eval "_env_val=\${$1:-}"
  if [ -n "$_env_val" ] && [ "$_env_val" != "$_reviewed" ]; then
    if [ "${ALLOW_PIN_OVERRIDE:-0}" = "1" ]; then
      echo "sweep_2x2.conf: WARNING — $_name OVERRIDDEN BY ENVIRONMENT (--allow-pin-override): env=$_env_val reviewed=$_reviewed" >&2
    else
      echo "sweep_2x2.conf: FATAL — environment overrides the reviewed pin $_name (env=$_env_val, reviewed=$_reviewed).  Pins change through review, never through the environment; pass --allow-pin-override to the wrapper for a deliberate, logged one-off." >&2
      return 2
    fi
  else
    eval "$_name=\$_reviewed"
  fi
}
_sweep_conf_pin_guard PINNED_CC1PLUS_SHA256 "$_REVIEWED_CC1PLUS_SHA256" || return 2 2>/dev/null || exit 2
_sweep_conf_pin_guard PINNED_COMPILER_SHA256 "$_REVIEWED_COMPILER_SHA256" || return 2 2>/dev/null || exit 2

# CRAQ oracle: generic-path libttsim built from craq-sim nkapre/sfpi f80a8d64.
: "${SIM_BH:=$HOME/sfpi-uplift/craq-sim/src/_out/release_bh/libttsim.so}"
: "${SIM_WH:=$HOME/sfpi-uplift/craq-sim/src/_out/release_wh/libttsim.so}"

# Where dated evidence directories accumulate (nightly-YYYYMMDD / weekly-YYYYMMDD).
: "${EVIDENCE_ROOT:=$HOME/sfpi-uplift/sweep-2x2}"

# Chip class selects the checked-in baseline (sfpu_device_baseline_<class>_v1.tsv).
# Baselines are NEVER modified by the sweeps: drift is reported; updates are a
# reviewed manual step (see corpus/README.md "Baseline update procedure").
: "${CHIP_CLASS:=p150}"

# YELLOW threshold for |measured - baseline| causal/vs-hand percentage drift.
: "${MAX_DRIFT_PCT:=5}"

# RED threshold for per-cell ABSOLUTE cycle drift vs baseline (uniform
# slowdowns preserve every ratio, so ratios alone cannot see them); cells
# that IMPROVED beyond it flag YELLOW (stale baseline, reviewed update).
: "${MAX_ABS_DRIFT_PCT:=10}"

# RED threshold (percentage points) for a baseline loss growing bigger:
# loss growth beyond this exits 1 instead of an unalertable YELLOW.
: "${RED_LOSS_GROWTH_PCT:=5}"

# Weekly: headline rows that also get per-knob silicon legs (device time is
# bounded by keeping this list short; classification-only attribution runs on
# every changed row regardless).
: "${HEADLINE_ROWS:=sdpa,signbit,minmax-min,minmax-max,addcmul,exp,unarymaxmin-max,sigmoidappx-tree}"

# Weekly DejaGnu byte-parity suites: a built sfpi-gcc tree (contains gcc/xg++)
# and the gcc source dir. Recorded as SKIP when absent.
: "${DEJAGNU_BUILD_TREE:=$HOME/sfpi-uplift/gcc-build-laneAA}"
: "${SFPI_GCC_SRC:=$HOME/sfpi-uplift/sfpi-gcc-laneAA}"
: "${DEJAGNU_SUITES:=loadmacro* macro-planner*}"

# rebalance depth 4->3) plus generic -fassociative-math scalar-code
# effects on the rest (the license tokens are TU-wide; knob-leg
# attribution must therefore read the reassoc: dump witness, not just
# CHANGED classify verdicts); 98 named
# reassoc-pressure-budget-exceeded refusals (trig/i1 chains in

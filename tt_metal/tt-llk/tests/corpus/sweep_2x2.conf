# Sourced by nightly_bh_sweep.sh / weekly_bh_sweep.sh.  Non-pin values are
# env-overridable defaults; knobs/rows/paths live HERE, never in script
# bodies.  Machine defaults below are tt-quietbox-0's pinned toolchain/sim
# layout.

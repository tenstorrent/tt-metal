# Lane EJ addition (2026-08-21) — the LICENSED reassociation knob
# ("reassoc", on-plus; sweep_2x2.py KNOBS/KNOB_MODES/LICENSED_KNOBS).
# OWNER RATIFICATION 2026-08-21: value-changing FP reassociation is
# LICENSED when the user passes -fassociative-math — the explicit
# opt-in industry mechanism (GCC invoke.texi: reassociation "may
# change the computation result"); the charter's silent-rounding-change
# ban stands — NOTHING reassociates without the flag.  The compiler
# half is sfpi-gcc agent/reassoc-license: every FP reassociation site
# (accumulation-chain rebalance, multi-use MUL+ADD->SFPMAD fusion)
# fires only under -fassociative-math AND -mtt-tensix-optimize-reassoc
# and prints a named "reassoc:" dump line; either flag absent = named
# refusal, byte-identical codegen (dg refusal twins prove both
# directions).  The knob token also carries -fno-signed-zeros
# -fno-trapping-math because GCC clears flag_associative_math without
# them (toplev.cc:1623) — omitting the pair would make the leg a
# silent A/A.  LICENSED-LEG BOOKKEEPING: the knob's cells are marked
# LICENSED and are never merged into unlicensed cells (the license
# tokens ride every jobkey); a knob-leg paired-CRAQ mismatch against
# the bit-exact baseline is recorded LICENSED-EXPECTED — that is the
# license working, never silent — and correctness authority for the
# licensed leg is the DEVICE-GOLDEN correctness run at the row's
# documented tolerance (knob_silicon step 4 still stops perf on any
# device correctness failure).  PIN-15 FLAG-LEG INVENTORY (laneEJ

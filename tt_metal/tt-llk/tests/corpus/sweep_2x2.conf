# corpus/sweep_2x2.conf — shared configuration for the scheduled BH sweeps.
# Sourced by nightly_bh_sweep.sh / weekly_bh_sweep.sh.  Every value is an
# env-overridable default; knobs/rows/paths live HERE, never in script bodies.
# Machine defaults below are tt-quietbox-0's pinned toolchain/sim layout.

# Pinned toolchain — PRIMARY pin is CC1PLUS (the compiler proper), resolved
# through the driver via `g++ -print-prog-name=cc1plus`.  The g++ DRIVER
# binary is byte-identical across cc1plus-only changes (verified: the pre-
# and post-profitability-recalibration sfpi builds share the same driver
# sha256), so a driver-only pin is structurally blind (PULL_ANALYSIS D6).
# The sweep ABORTS LOUDLY if the resolved cc1plus sha256 does not start with
# PINNED_CC1PLUS_SHA256, if the driver sha256 does not start with
# PINNED_COMPILER_SHA256 (secondary check), or if the removed WP8
# exact-calendar flags (-mtt-tensix-{analyze,emit}-loadmacro) do NOT error
# on use.
#
# This cc1plus is the sfpi build of the sfpi-gcc bb56f1d7797 pin (silicon-
# recalibrated replay-hoist profitability gate) — the compiler the p150
# baseline's Reduce-SDPA promotion pair (generated 834 vs hand 840 at the
# default gate) requires.  Pin and p150 baseline are coherent: the sweep's
# reduce-sdpa pinpair row re-measures that pair against this exact binary.
#
# PIN HISTORY (proof of D6's value): the first candidate pin 33221397ebb2…
# looked recalibrated (same driver sha 4633999c…) but was actually built from
# gcc cd0af49be5c BEFORE the submodule advanced to bb56f1d7797 — the 2x2
# sweep's pinpair gate caught it on device (generated 855.5 vs hand 839 =
# the pre-recalibration regression, WIN→LOSS FLIP RED; evidence
# nightly-20260816/REPORT-staletoolchain-RED-catch.md).  Current values are
# from the verified bb56f1d7797 rebuild whose generated Reduce-SDPA .text is
# byte-identical to the gate-fix hybrid's D1-hoisted form.
: "${PINNED_CC1PLUS_SHA256:=afe05a8668c469f105b5bb2c74ea09afe20254b4493cb0bdaa16be96af8abe15}"
: "${PINNED_COMPILER_SHA256:=4f7ff8bfe45f1a3a129c990536c074f83bd6f04492b96eb12bfcc554af7e6fa1}"

# CRAQ oracle: generic-path libttsim built from craq-sim nkapre/sfpi f80a8d64.
: "${SIM_BH:=$HOME/sfpi-uplift/craq-sim/src/_out/release_bh/libttsim.so}"
: "${SIM_WH:=$HOME/sfpi-uplift/craq-sim/src/_out/release_wh/libttsim.so}"

# Where dated evidence directories accumulate (nightly-YYYYMMDD / weekly-YYYYMMDD).
: "${EVIDENCE_ROOT:=$HOME/sfpi-uplift/sweep-2x2}"

# Chip class selects the checked-in baseline (sfpu_device_baseline_<class>_v1.tsv).
# Baselines are NEVER modified by the sweeps: drift is reported; updates are a
# reviewed manual step (see corpus/README.md "Baseline update procedure").
: "${CHIP_CLASS:=p150}"

# YELLOW threshold for |measured - baseline| causal/vs-hand percentage drift.
: "${MAX_DRIFT_PCT:=5}"

# Weekly: headline rows that also get per-knob silicon legs (device time is
# bounded by keeping this list short; classification-only attribution runs on
# every changed row regardless).
: "${HEADLINE_ROWS:=sdpa,signbit,minmax-min,minmax-max,addcmul}"

# Weekly DejaGnu byte-parity suites: a built sfpi-gcc tree (contains gcc/xg++)
# and the gcc source dir. Recorded as SKIP when absent.
: "${DEJAGNU_BUILD_TREE:=$HOME/sfpi-uplift/gcc-build-planner}"
: "${SFPI_GCC_SRC:=$HOME/sfpi-uplift/sfpi-gcc}"
: "${DEJAGNU_SUITES:=loadmacro* macro-planner*}"

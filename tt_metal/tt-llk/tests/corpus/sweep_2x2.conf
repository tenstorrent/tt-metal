# UNION FIRE-WITNESS TABLE (conf R9, laneBU — the pin-11 lesson).  Every
# entry declares the dump-proven fire witness for one reviewed ON-set flag:
#   <flag>|<pytest-node>|<dump-flag>|<required-dump-line-regex>
# witness_preflight.py compiles JUST each entry's node (BH, pytest
# --compile-producer) at the PINNED toolchain with the FULL reviewed ON set
# plus the dump flag, and greps the produced dump files for the required
# line.  A missing line is RED "fire witness stale on the union: <flag>" —
# a flag can fire on its lane's build and still be dead on the shipped
# union (flag interactions), which is exactly what pin 11 shipped for
# prgm-const.  conf_lint.sh R9 lints the table's structure (4 fields, flag
# in sweep_2x2.py's ON set, -fdump-{rtl,tree}-rvtt_* dump flag); the
# nightly wrapper runs the compile half in preflight (--skip-witness = the
# loudly-logged emergency escape).  Entries sharing a node compile once
# (this table = 5 compiles).  The required line is a python regex; escape
# regex metacharacters if a literal line needs them.
#
# Adding an ON-set flag REQUIRES adding (or explicitly reviewing away) a
# witness row verified against the UNION build, not the lane build — that
# verification is one `python3 witness_preflight.py --work /tmp/witness-check
# --only-flag <flag>` run.  Rows below were union-verified at pin 11
# (cc1plus 87688520648a…) on 2026-08-18 and re-verified on the pin-12 union
# (cc1plus 352aee85ec92…, sfpi-gcc 7b4e4d96fb6) on 2026-08-19 via
# witness_preflight.py at the merge of laneBU's infra.  Pin-12 notes:
#   * prgm-const: the pin-11 intended-RED is RESOLVED — lane BT's
#     cgraph-edge TU-scan fix is in the pin-12 toolchain, and
#     REVIEW_RECORD-352aee85ec92 records the installed-binary fire
#     ('allocated PRGM L14', artifact e0ef2f9c) on the shipping recipe.
#   * counted-row-formation (laneBM) / crosscall-hoist (laneBQ): rows added
#     from the pin-12 REVIEW_RECORD's installed-binary witnesses (welford
#     'Formed counted-row record [24,+5): 5 launch sites', sigmoid-tree
#     'hoisted 6 contract materializations'); dump flags are the printing
#     passes' own dumps (rtl-rvtt-replay.cc / gimple-rvtt-crosscall.cc).
#     KNOWN RED (2026-08-19 union verification): the welford counted-row
#     row — the pin-12 union DOES fire on the welford perf math TU but
#     prints 'Formed counted-row record [24,+5): 6 launch sites' (6, not

# Regression for Wormhole ROW broadcast with DEST_TO_SRCA reuse. A 16x32 tile
# has two faces in one face-row; DEST_TO_SRCA consumes one SrcA DVALID per face.

supported_archs: ["wormhole"]

dest_acc: true

operands:
  - name: "input_A"
    dims: [16, 32]
    tile_dims: [16, 32]
    format: "Float16_b"
  - name: "input_B"
    dims: [16, 32]
    tile_dims: [16, 32]
    format: "Float16_b"
  - name: "elwadd_row_bcast_dest_to_srca_tiny_out"
    dims: [16, 32]
    tile_dims: [16, 32]
    format: "Float16_b"

operations:
  - math:
      - type: "Fpu"
        src_a: "input_A"
        src_b: "input_B"
        operation: "Elwadd"
        unpacker: "UnpackerA"
        broadcast_type: "ROW"
        reuse_dest: "DEST_TO_SRCA"
        acc_to_dest: true
        math_fidelity: "LoFi"
    block_size: [16, 32]
    pack:
      - output: "elwadd_row_bcast_dest_to_srca_tiny_out"
        packer: "Packer"

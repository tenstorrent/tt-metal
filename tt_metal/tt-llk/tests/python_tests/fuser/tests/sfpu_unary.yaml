# Basic datacopy test that reads from source A only.

dest_acc: true


operands:
  - name: "input_A"
    dims: [64, 64]
    format: "Float32"
  - name: "input_B"
    dims: [64, 64]
    format: "Float32"
  - name: "datacopy_out"
    dims: [64, 64]
    format: "Float32"

operations:
  - math:
      - type: "Fpu"
        src_a: "input_A"
        src_b: "input_B"
        operation: "Datacopy"
        unpacker: "UnpackerA"
        math_fidelity: "LoFi"
        # unpack_to_dest: true
      - type: "UnarySfpu"
        operation: "Exp"
        approximation_mode: false
        iterations: 32
    block_size: [64, 64]
    pack:
      - output: "datacopy_out"
        packer: "Packer"

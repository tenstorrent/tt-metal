# Datacopy to DEST, then Exp over four sections to reuse both destination banks.

dest_acc: true

operands:
  - name: "input_A"
    dims: [128, 128]
    format: "Float32"
  - name: "datacopy_out"
    dims: [128, 128]
    format: "Float32"

operations:
  - math:
      - type: "Fpu"
        block_size: [32, 128]
        in0: "input_A"
        operation: "Datacopy"
        unpacker: "UnpackerA"
        math_fidelity: "LoFi"
        unpack_to_dest: true
      - type: "UnarySfpu"
        block_size: [32, 128]
        operation: "Exp"
        approximation_mode: false
        iterations: 32
    pack:
      - output: "datacopy_out"
        block_size: [32, 128]
        packer: "Packer"

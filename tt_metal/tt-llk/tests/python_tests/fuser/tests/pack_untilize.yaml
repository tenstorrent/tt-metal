# Datacopy packed out with PackUntilize: dest is written to L1 row-major.

operands:
  - name: "input_A"
    tile_dims: all
    dims: [256, 256]
    format: "Float16_b"
  - name: "output1"
    tile_dims: all
    dims: [256, 256]
    format: "Float16_b"

operations:
  - math:
      - type: "Fpu"
        block_tiles: [2, 4]
        in0: "input_A"
        operation: "Datacopy"
        unpacker: "UnpackerA"
        math_fidelity: "LoFi"
    pack:
      - output: "output1"
        block_tiles: [2, 4]
        packer: "PackUntilize"

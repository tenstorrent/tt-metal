# Datacopy packed out with PackUntilize from a 32-bit dest: dest is written to L1 row-major.

dest_acc: Yes

operands:
  - name: "input_A"
    tile_dims: all
    dims: [256, 256]
    format: "Float32"
  - name: "output1"
    tile_dims: all
    dims: [256, 256]
    format: "Float32"

operations:
  - math:
      - type: "Fpu"
        block_tiles: [1, 4]
        in0: "input_A"
        operation: "Datacopy"
        unpacker: "UnpackerA"
        math_fidelity: "LoFi"
    pack:
      - output: "output1"
        block_tiles: [1, 4]
        packer: "PackUntilize"

# Regression for Wormhole COL broadcast with DEST_TO_SRCA reuse. The first
# stage seeds DEST with non-zero data; the second stage consumes one dummy SrcA
# DVALID per face while retaining one broadcast SrcB face per face row.

supported_archs: ["wormhole"]

dest_acc: true

operands:
  - name: "input_A"
    dims: [32, 32]
    tile_dims: [32, 32]
    format: "Float16_b"
  - name: "input_B"
    dims: [32, 32]
    tile_dims: [32, 32]
    format: "Float16_b"
  - name: "col_broadcast"
    dims: [32, 32]
    tile_dims: [32, 32]
    format: "Float16_b"
  - name: "elwadd_col_bcast_dest_to_srca_out"
    dims: [32, 32]
    tile_dims: [32, 32]
    format: "Float16_b"

operations:
  - math:
      - type: "Fpu"
        src_a: "input_A"
        src_b: "input_B"
        operation: "Elwadd"
        unpacker: "UnpackerAB"
        math_fidelity: "LoFi"
      - type: "Fpu"
        src_a: "col_broadcast"
        src_b: "input_B"
        operation: "Elwadd"
        unpacker: "UnpackerA"
        broadcast_type: "COL"
        reuse_dest: "DEST_TO_SRCA"
        acc_to_dest: true
        math_fidelity: "LoFi"
    block_size: [32, 32]
    pack:
      - output: "elwadd_col_bcast_dest_to_srca_out"
        packer: "Packer"

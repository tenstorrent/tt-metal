# 1x1 convolution: matmul of activations [128,256] x weights [256,128] -> [128,128].
# Models a pointwise conv that changes channel dimension without spatial mixing.

operands:
  - name: "activations"
    dims: [128, 256]
    format: "Float16_b"
  - name: "weights"
    dims: [256, 128]
    format: "Float16_b"
  - name: "conv_out"
    dims: [128, 128]
    format: "Float16_b"

operations:
  - math:
      - type: "Fpu"
        in0: "activations"
        in1: "weights"
        operation: "Matmul"
        unpacker: "MatmulUnpacker"
        math_fidelity: "HiFi2"
    block_size: [64, 64]
    pack:
      - output: "conv_out"
        packer: "Packer"

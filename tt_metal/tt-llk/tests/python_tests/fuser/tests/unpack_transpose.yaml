# Unpack transpose test for all architectures.
# Datacopy with both transpose_faces and transpose_within_face enabled.
# Verifies that the unpacker correctly transposes data at the tile level.

dest_acc: true

operands:
  - name: "input_A"
    dims: [64, 64]
    format: "Float16_b"
  - name: "datacopy_out"
    dims: [64, 64]
    format: "Float16_b"

operations:
  - math:
      - type: "Fpu"
        in0: "input_A"
        operation: "Datacopy"
        unpacker: "UnpackerA"
        transpose_faces: true
        transpose_within_face: true
        math_fidelity: "LoFi"
    block_size: [32, 64]
    pack:
      - output: "datacopy_out"
        packer: "Packer"

# Select between two independent input tiles using a third condition tile.
dest_acc: true

operands:
  - name: "condition"
    dims: [32, 32]
    format: "Float32"
    stimuli:
      include: [0.0, 1.0]
  - name: "true_value"
    dims: [32, 32]
    format: "Float32"
    stimuli: [0.5, 1.0]
  - name: "false_value"
    dims: [32, 32]
    format: "Float32"
    stimuli: [-1.0, -0.5]
  - name: "where_out"
    dims: [32, 128]
    format: "Float32"

operations:
  - math:
      - type: "Fpu"
        block_size: [32, 32]
        in0: "condition"
        operation: "Datacopy"
        unpacker: "UnpackerA"
        math_fidelity: "LoFi"
        unpack_to_dest: false
        indexes:
          dest: 0
      - type: "Fpu"
        block_size: [32, 32]
        in0: "true_value"
        operation: "Datacopy"
        unpacker: "UnpackerA"
        math_fidelity: "LoFi"
        unpack_to_dest: false
        indexes:
          dest: 1
      - type: "Fpu"
        block_size: [32, 32]
        in0: "false_value"
        operation: "Datacopy"
        unpacker: "UnpackerA"
        math_fidelity: "LoFi"
        unpack_to_dest: false
        indexes:
          dest: 2
      - type: "TernarySfpu"
        operation: "SfpuWhere"
        indexes:
          src0: 0
          src1: 1
          src2: 2
          dest: 3
    pack:
      - output: "where_out"
        block_size: [32, 128]
        packer: "Packer"

# ResNet bottleneck block: 1x1 reduce, 3x3 conv (as matmul), 1x1 expand,
# residual add, ReLU. Each conv includes bias via fused elwadd+relu.

dest_acc: true

operands:
  - name: "input"
    dims: [128, 256]
    format: "Float16_b"
  - name: "w_reduce"
    dims: [256, 64]
    format: "Float16_b"
  - name: "b_reduce"
    dims: [128, 64]
    format: "Float16_b"
  - name: "w_3x3"
    dims: [64, 64]
    format: "Float16_b"
  - name: "b_3x3"
    dims: [128, 64]
    format: "Float16_b"
  - name: "w_expand"
    dims: [64, 256]
    format: "Float16_b"
  - name: "skip"
    dims: [128, 256]
    format: "Float16_b"
  - name: "reduce_out"
    dims: [128, 64]
    format: "Float16_b"
  - name: "reduce_bias"
    dims: [128, 64]
    format: "Float16_b"
  - name: "conv3_out"
    dims: [128, 64]
    format: "Float16_b"
  - name: "conv3_bias"
    dims: [128, 64]
    format: "Float16_b"
  - name: "expand_out"
    dims: [128, 256]
    format: "Float16_b"
  - name: "output"
    dims: [128, 256]
    format: "Float16_b"

operations:
  # 1x1 reduce conv
  - math:
      - type: "Fpu"
        src_a: "input"
        src_b: "w_reduce"
        operation: "Matmul"
        unpacker: "MatmulUnpacker"
        math_fidelity: "HiFi2"
    block_size: [64, 64]
    pack:
      - output: "reduce_out"
        packer: "Packer"

  # Bias + ReLU for reduce conv
  - math:
      - type: "Fpu"
        src_a: "reduce_out"
        src_b: "b_reduce"
        operation: "Elwadd"
        unpacker: "UnpackerAB"
        broadcast_type: "COL"
        math_fidelity: "LoFi"
      - type: "UnarySfpu"
        operation: "Relu"
        iterations: 32
    block_size: [64, 64]
    pack:
      - output: "reduce_bias"
        packer: "Packer"

  # 3x3 conv (lowered to matmul)
  - math:
      - type: "Fpu"
        src_a: "reduce_bias"
        src_b: "w_3x3"
        operation: "Matmul"
        unpacker: "MatmulUnpacker"
        math_fidelity: "HiFi2"
    block_size: [64, 64]
    pack:
      - output: "conv3_out"
        packer: "Packer"

  # Bias + ReLU for 3x3 conv
  - math:
      - type: "Fpu"
        src_a: "conv3_out"
        src_b: "b_3x3"
        operation: "Elwadd"
        unpacker: "UnpackerAB"
        broadcast_type: "COL"
        math_fidelity: "LoFi"
      - type: "UnarySfpu"
        operation: "Relu"
        iterations: 32
    block_size: [64, 64]
    pack:
      - output: "conv3_bias"
        packer: "Packer"

  # 1x1 expand conv
  - math:
      - type: "Fpu"
        src_a: "conv3_bias"
        src_b: "w_expand"
        operation: "Matmul"
        unpacker: "MatmulUnpacker"
        math_fidelity: "HiFi2"
    block_size: [64, 64]
    pack:
      - output: "expand_out"
        packer: "Packer"

  # Residual add + ReLU
  - math:
      - type: "Fpu"
        src_a: "expand_out"
        src_b: "skip"
        operation: "Elwadd"
        unpacker: "UnpackerAB"
        math_fidelity: "LoFi"
      - type: "UnarySfpu"
        operation: "Relu"
        iterations: 32
    block_size: [64, 64]
    pack:
      - output: "output"
        packer: "Packer"

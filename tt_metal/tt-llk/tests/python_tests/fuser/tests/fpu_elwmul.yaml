# Element-wise multiplication of two inputs (A * B).

operands:
  - name: "input_A"
    tile_dims: all
    dims: [256, 256]
    format: "Float16_b"
  - name: "input_B"
    tile_dims: all
    dims: [256, 256]
    format: "Float16_b"
  - name: "elwmul_out"
    tile_dims: all
    dims: [256, 256]
    format: "Float16_b"

operations:
  - math:
      - type: "Fpu"
        block_tiles: [2, 4]
        in0: "input_A"
        in1: "input_B"
        operation: "Elwmul"
        unpacker: "UnpackerAB"
        math_fidelity: "HiFi2"
    pack:
      - output: "elwmul_out"
        block_tiles: [2, 4]
        packer: "Packer"

# Basic datacopy test that reads from source A only.

dest_acc: true


operands:
  - name: "input_A"
    tile_dims: all
    dims: [256, 256]
    format: "Float16_b"
  - name: "datacopy_out"
    tile_dims: all
    dims: [256, 256]
    format: "Float16_b"

operations:
  - math:
      - type: "Fpu"
        block_tiles: [1, 4]
        in0: "input_A"
        operation: "Datacopy"
        unpacker: "UnpackerA"
        math_fidelity: "HiFi2"
    pack:
      - output: "datacopy_out"
        block_tiles: [1, 4]
        packer: "Packer"

# Same as fpu_reduce_block_max but the unpacker is configured at runtime
# instead of compile time.

supported_archs: ["wormhole", "blackhole"]

dest_acc: true

operands:
  - name: "input_A"
    tile_dims: all
    dims: [256, 256]
    format: "Float32"
  - name: "input_B"
    tile_dims: all
    dims: [256, 256]
    format: "Float32"
    stimuli: 1.0
  - name: "reduce_block_max_runtime_out"
    tile_dims: all
    dims: [256, 256]
    format: "Float32"

operations:
  - math:
      - type: "Fpu"
        block_tiles: [2, 2]
        in0: "input_A"
        in1: "input_B"
        operation: "ReduceBlockMaxRuntime"
        unpacker: "ReduceBlockMaxRuntimeUnpacker"
        math_fidelity: "HiFi2"
    pack:
      - output: "reduce_block_max_runtime_out"
        block_tiles: [2, 2]
        packer: "Packer"

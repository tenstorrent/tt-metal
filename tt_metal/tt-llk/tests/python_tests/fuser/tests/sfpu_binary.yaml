# Datacopy (unpack_to_dest), then BinarySfpu SfpuElwadd:
# adds dest tile 0 + dest tile 1 and writes the result to dest tile 2.

dest_acc: true

operands:
  - name: "input_A"
    dims: [32, 128]
    format: "Float32"
  - name: "datacopy_out"
    dims: [32, 128]
    format: "Float32"

operations:
  - math:
      - type: "Fpu"
        in0: "input_A"
        operation: "Datacopy"
        unpacker: "UnpackerA"
        math_fidelity: "LoFi"
        blocks:
          - in0: {start: 0, count: 4}
            dest: auto
      - type: "BinarySfpu"
        operation: "SfpuElwadd"
        approximation_mode: false
        iterations: 32
        blocks:
          - src0: 0
            src1: 1
            dest: 2
    pack:
      - output: "datacopy_out"
        packer: "Packer"
        blocks:
          - dest: {start: 0, count: 4}
            out: auto
    block_size: [32, 128]

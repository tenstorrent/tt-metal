# Datacopy (unpack_to_dest), then BinarySfpu SfpuElwadd:
# adds dest tile 0 + dest tile 1 and writes the result to dest tile 2.

dest_acc: true

operands:
  - name: "input_A"
    dims: [32, 128]
    format: "Float32"
  - name: "input_B"
    dims: [32, 128]
    format: "Float32"
  - name: "datacopy_out"
    dims: [32, 128]
    format: "Float32"

operations:
  - math:
      - type: "Fpu"
        src_a: "input_A"
        src_b: "input_B"
        operation: "Datacopy"
        unpacker: "UnpackerA"
        math_fidelity: "LoFi"
        unpack_to_dest: true
      - type: "BinarySfpu"
        operation: "SfpuElwadd"
        approximation_mode: false
        iterations: 32
        src1_dest_tile_index: 0
        src2_dest_tile_index: 1
        dst_dest_tile_index: 2
    pack:
      - output: "datacopy_out"
        packer: "Packer"
    block_size: [32, 128]

# Datacopy (unpack_to_dest), then BinarySfpu SfpuElwadd:
# adds dest tile 0 + dest tile 1 and writes the result to dest tile 2.

dest_acc: true

operands:
  - name: "input_A"
    dims: [128, 128]
    format: "Float32"
  - name: "datacopy_out"
    dims: [128, 128]
    format: "Float32"

operations:
  - math:
      - type: "Fpu"
        block_size: [32, 128]
        in0: "input_A"
        operation: "Datacopy"
        unpacker: "UnpackerA"
        math_fidelity: "LoFi"
        unpack_to_dest: true
        indexes:
          in0: [0, 4, 8, 12]
      - type: "BinarySfpu"
        block_size: [32, 32]
        operation: "SfpuElwadd"
        approximation_mode: false
        iterations: 32
        indexes:
          src0: 0
          src1: 1
          dest: 2
    pack:
      - output: "datacopy_out"
        block_size: [32, 128]
        packer: "Packer"
        indexes:
          out: [0, 4, 8, 12]

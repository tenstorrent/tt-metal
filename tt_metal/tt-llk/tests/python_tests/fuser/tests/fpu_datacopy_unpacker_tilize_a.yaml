# Datacopy test that reads through the tilize unpack path.

operands:
  - name: "input_A"
    tile_dims: all
    dims: [256, 256]
    format: "Float16_b"
  - name: "datacopy_tilize_out"
    tile_dims: all
    dims: [256, 256]
    format: "Float16_b"

operations:
  - math:
      - type: "Fpu"
        block_tiles: [1, 8]
        in0: "input_A"
        operation: "Datacopy"
        unpacker: "UnpackerTilizeA"
        math_fidelity: "HiFi2"
    pack:
      - output: "datacopy_tilize_out"
        block_tiles: [1, 8]
        packer: "Packer"

# Each listed operation expands into an independent single-stage test.
# Only the final SFPU operation is swept; preparation and pack checks are fixed.

# Isfinite: sfpi_bh_isfinite_fp32
# Blackhole SFPI parity: Isfinite. Each case covers all four faces of one tile.
# Case: random input.
# Single-stage direct-to-Dest case preserves special floating-point values.

# Isinf: sfpi_bh_isinf_fp32
# Blackhole SFPI parity: Isinf. Each case covers all four faces of one tile.
# Case: random input.
# Single-stage direct-to-Dest case preserves special floating-point values.

# Isnan: sfpi_bh_isnan_fp32
# Blackhole SFPI parity: Isnan. Each case covers all four faces of one tile.
# Case: random input.
# Single-stage direct-to-Dest case preserves special floating-point values.

# Isneginf: sfpi_bh_isneginf_fp32
# Blackhole SFPI parity: Isneginf. Each case covers all four faces of one tile.
# Case: random input.
# Single-stage direct-to-Dest case preserves special floating-point values.

# Isposinf: sfpi_bh_isposinf_fp32
# Blackhole SFPI parity: Isposinf. Each case covers all four faces of one tile.
# Case: random input.
# Single-stage direct-to-Dest case preserves special floating-point values.

dest_acc: true
supported_archs: [quasar]

operands:
  - {dims: [32, 32], format: Float32, name: input}
  - {dims: [32, 32], format: Float32, name: output}

operations:
  - math:
      - {in0: input, operation: Datacopy, type: Fpu, unpack_to_dest: true, unpacker: UnpackerA}
      - type: UnarySfpu
        operation:
          - Isfinite
          - Isinf
          - Isnan
          - Isneginf
          - Isposinf
        iterations: 32
    pack:
      - {output: output, packer: Packer}

# ema on Float32 unpacked straight to Dest (no TF32 narrowing): column-wise exponential moving average
# down each 32x32 tile, out[r] = 0.6 * out[r-1] + 0.4 * x[r], carry zeroed at every tile. Two tiles
# side by side (unpack to Dest takes the operand as one [32, 64] block); stimuli as in
# sfpu_ema_dest32.yaml.
#
# Generated for the Quasar port of the ema kernel, using only existing fuser features:
# dest_acc is fixed per file (hence the _dest16 / _dest32 pairs), this file's Float32 input is
# unpacked straight to Dest (no FPU datacopy), and stimuli are finite intervals and points (no inf,
# NaN, -0 or INT_MIN).
# Special points sit outside the random ranges, so each is drawn about as often as a unit of range.

dest_acc: true

operands:
  - name: "input_A"
    dims: [32, 64]
    format: [Float32]
    stimuli:
      include:
        - [-1000.0, -10.5]
        - [-9.5, -0.01]
        - [0.01, 9.5]
        - [10.5, 1000.0]
        - -10.0
        - -1.0
        - 0.0
        - 1.0
        - 10.0
  - name: "sfpu_out"
    dims: [32, 64]
    format: Float32

operations:
  - math:
      - {type: "Fpu", in0: "input_A", operation: "Datacopy", unpacker: "UnpackerA", math_fidelity: "LoFi", unpack_to_dest: true, block_size: [32, 64]}
      - type: "UnarySfpu"
        operation: [Ema]
        approximation_mode: false
        iterations: 32
        block_size: [32, 64]
    pack:
      - {output: "sfpu_out", packer: "Packer", block_size: [32, 64]}

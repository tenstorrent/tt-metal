# Large |x| for logsigmoid(x), as points only (an interval would outweigh them), so the fp32 path's
# exponent guard is reached. Float16 cannot hold these inputs and is left out.

dest_acc: true

operands:
  - name: "input_A"
    dims: [32, 32]
    format: [Float16_b, Float32]
    stimuli:
      include:
        - -1.0e+30
        - -1.0e+8
        - -3.0e+7
        - -1.5e+7
        - -1.2e+7
        - -1.0e+7
        - -9.0e+6
        - -1.0e+6
        - -100.0
        - -88.0
        - -87.0
        - -30.0
        - 0.0
        - 30.0
        - 87.0
        - 88.0
        - 100.0
        - 1.0e+6
        - 9.0e+6
        - 1.0e+7
        - 1.2e+7
        - 1.5e+7
        - 3.0e+7
        - 1.0e+8
        - 1.0e+30
  - name: "sfpu_out"
    dims: [32, 32]
    format: Float32

operations:
  - math:
      - {type: "Fpu", in0: "input_A", operation: "Datacopy", unpacker: "UnpackerA", math_fidelity: "LoFi", unpack_to_dest: false, block_size: [32, 32], indexes: {in0: 0, dest: 0}}
      - type: "UnarySfpu"
        operation: [Logsigmoid]
        approximation_mode: false
        iterations: 32
        block_size: [32, 32]
        indexes: {dest: 0}
    pack:
      - {output: "sfpu_out", packer: "Packer", block_size: [32, 32], indexes: {dest: 0, out: 0}}

# leaky_relu (slope 0.1) and quick_gelu on [-8, 8] plus specials, +-20, +-100 and +-65000.
# Bfloat16 inputs (Float32 in _dest32_fp32); rtol 4e-3 is twice quick_gelu's measured worst case.

dest_acc: true

operands:
  - name: "input_A"
    dims: [32, 32]
    format: [Float16_b]
    stimuli:
      include:
        - [-8.0, -3.01]
        - [-2.99, -1.01]
        - [-0.99, -0.01]
        - [0.0101, 0.99]
        - [1.01, 2.99]
        - [3.01, 8.0]
        - -65000.0
        - -100.0
        - -20.0
        - -3.0
        - -1.0
        - -0.5
        - 0.0
        - 0.0001
        - 0.5
        - 1.0
        - 3.0
        - 20.0
        - 100.0
        - 65000.0
  - name: "sfpu_out"
    dims: [32, 32]
    format: Float32
    atol: 1.0e-6
    rtol: 0.004

operations:
  - math:
      - {type: "Fpu", in0: "input_A", operation: "Datacopy", unpacker: "UnpackerA", math_fidelity: "LoFi", unpack_to_dest: false, block_size: [32, 32]}
      - type: "UnarySfpu"
        operation: [Lrelu, QuickGelu]
        approximation_mode: false
        iterations: 32
        block_size: [32, 32]
    pack:
      - {output: "sfpu_out", packer: "Packer", block_size: [32, 32]}

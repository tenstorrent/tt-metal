# Int32 gcd over operands in [-(2**31 - 1), 2**31 - 1]: small values, around +-2**30, near the ceiling,
# fp32-NaN bit patterns and the operands of the 30-step worst-case pairs. The fuser stages Int32 as SMAG32,
# so the op runs with sign_magnitude. sfpu_int32_gcd_pairs_*.yaml cover specific (a, b) pairs.

dest_acc: true

operands:
  - name: "input_A"
    dims: [32, 64]
    format: [Int32]
    stimuli:
      include:
        - [-64.0, 64.0]
        - [1000.0, 1064.0]
        - [1073741792.0, 1073741856.0]
        - [2147483583.0, 2147483647.0]
        - [-1073741856.0, -1073741792.0]
        - [-2147483647.0, -2147483583.0]
        - 3.0
        - 1048576.0
        - 805306368.0
        - 715827883.0
        - 1134903170.0
        - 1431655765.0
        - 1836311903.0
        - 2139095041.0
        - 2143289344.0
        - -3.0
        - -715827883.0
        - -1134903170.0
        - -1431655765.0
        - -1836311903.0
  - name: "sfpu_out"
    dims: [32, 32]
    format: Int32

operations:
  - math:
      - {type: "Fpu", in0: "input_A", operation: "Datacopy", unpacker: "UnpackerA", math_fidelity: "LoFi", unpack_to_dest: true, block_size: [32, 64]}
      - type: "BinarySfpu"
        operation: [SfpuGcd]
        approximation_mode: false
        sign_magnitude: true
        iterations: 32
        block_size: [32, 32]
        indexes: {src0: 0, src1: 1, dest: 2}
    pack:
      - {output: "sfpu_out", packer: "Packer", block_size: [32, 32], indexes: {dest: 2, out: 0}}

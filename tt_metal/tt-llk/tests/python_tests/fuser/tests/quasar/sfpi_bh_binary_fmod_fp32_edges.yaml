# Exact constant pairs cover both signs without SrcA rounding ambiguity.
supported_archs: [quasar]
dest_acc: true

operands:
  - {name: case_0_input, dims: [32, 96], format: Float32, const_value: -2.5}
  - {name: case_0_output, dims: [32, 96], format: Float32}
  - {name: case_1_input, dims: [32, 96], format: Float32, const_value: -0.5}
  - {name: case_1_output, dims: [32, 96], format: Float32}
  - {name: case_2_input, dims: [32, 96], format: Float32, const_value: 0.5}
  - {name: case_2_output, dims: [32, 96], format: Float32}
  - {name: case_3_input, dims: [32, 96], format: Float32, const_value: 2.5}
  - {name: case_3_output, dims: [32, 96], format: Float32}

operations:
  - block_size: [32, 96]
    math:
      - {type: Fpu, operation: Datacopy, in0: case_0_input, unpacker: UnpackerA, unpack_to_dest: false}
      - {type: UnarySfpu, operation: Add1, dst_dest_tile_index: 1, iterations: 32}
      - type: BinarySfpu
        operation: SfpuBinaryFmod
        src1_dest_tile_index: 0
        src2_dest_tile_index: 1
        dst_dest_tile_index: 2
        iterations: 32
    pack:
      - {output: case_0_output, packer: Packer}
  - block_size: [32, 96]
    math:
      - {type: Fpu, operation: Datacopy, in0: case_1_input, unpacker: UnpackerA, unpack_to_dest: false}
      - {type: UnarySfpu, operation: Add1, dst_dest_tile_index: 1, iterations: 32}
      - type: BinarySfpu
        operation: SfpuBinaryFmod
        src1_dest_tile_index: 0
        src2_dest_tile_index: 1
        dst_dest_tile_index: 2
        iterations: 32
    pack:
      - {output: case_1_output, packer: Packer}
  - block_size: [32, 96]
    math:
      - {type: Fpu, operation: Datacopy, in0: case_2_input, unpacker: UnpackerA, unpack_to_dest: false}
      - {type: UnarySfpu, operation: Add1, dst_dest_tile_index: 1, iterations: 32}
      - type: BinarySfpu
        operation: SfpuBinaryFmod
        src1_dest_tile_index: 0
        src2_dest_tile_index: 1
        dst_dest_tile_index: 2
        iterations: 32
    pack:
      - {output: case_2_output, packer: Packer}
  - block_size: [32, 96]
    math:
      - {type: Fpu, operation: Datacopy, in0: case_3_input, unpacker: UnpackerA, unpack_to_dest: false}
      - {type: UnarySfpu, operation: Add1, dst_dest_tile_index: 1, iterations: 32}
      - type: BinarySfpu
        operation: SfpuBinaryFmod
        src1_dest_tile_index: 0
        src2_dest_tile_index: 1
        dst_dest_tile_index: 2
        iterations: 32
    pack:
      - {output: case_3_output, packer: Packer}

# Signbit (1.0 iff the sign bit is set, else 0.0) on a 32-bit Dest, both signs from tiny magnitudes
# (+-1e-3, +-1e-2) through +-0.5 / +-1 / +-2 and mid-range up to +-65000 (the shared Float16 ceiling),
# plus +0.0.
# -0.0 and negative NaN, the inputs where signbit differs from an IEEE `< 0`, cannot be expressed as
# fuser stimuli; the unary SFPU test (test_eltwise_unary_sfpu_quasar.py) seeds them per face instead.
#
# Uses only existing fuser features: dest_acc is fixed per file (hence the _dest16 / _dest32 pair),
# every float input goes through the FPU datacopy path, and stimuli are finite intervals and points
# (no inf, NaN, -0 or INT_MIN). Special points sit outside the random ranges, so each is drawn about
# as often as a unit of range.

dest_acc: true

operands:
  - name: "input_A"
    dims: [32, 32]
    format: [Float16_b, Float16, Float32]
    stimuli:
      include:
        - [-60000.0, -100.5]
        - [-99.5, -1.01]
        - [-0.99, -0.011]
        - [0.011, 0.99]
        - [1.01, 99.5]
        - [100.5, 60000.0]
        - -65000.0
        - -2.0
        - -1.0
        - -0.5
        - -0.01
        - -0.001
        - 0.0
        - 0.001
        - 0.01
        - 0.5
        - 1.0
        - 2.0
        - 65000.0
  - name: "sfpu_out"
    dims: [32, 32]
    format: Float32

operations:
  - math:
      - {type: "Fpu", in0: "input_A", operation: "Datacopy", unpacker: "UnpackerA", math_fidelity: "LoFi", unpack_to_dest: false, block_size: [32, 32]}
      - type: "UnarySfpu"
        operation: [Signbit]
        approximation_mode: false
        iterations: 32
        block_size: [32, 32]
    pack:
      - {output: "sfpu_out", packer: "Packer", block_size: [32, 32]}

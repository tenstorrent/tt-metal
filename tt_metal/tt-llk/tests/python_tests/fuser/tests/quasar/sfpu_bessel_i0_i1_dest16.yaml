# i0 and i1 on [-8, 8] plus the small specials: i0 is a truncated series and i1 clamps past
# 88.5, so neither is meaningful at +-100. i1 reads APPROXIMATION_MODE (its reciprocal), so both
# modes run; i0 ignores it, so its approximate variant repeats the exact one.
#
# Generated for the Quasar port of the Blackhole SFPI kernels, using only existing fuser features:
# dest_acc is fixed per file (hence the _dest16 / _dest32 pairs), every float input goes through
# the FPU datacopy path, and stimuli are finite intervals and points (no inf, NaN, -0 or INT_MIN).
# Special points sit outside the random ranges, so each is drawn about as often as a unit of range.

dest_acc: false

operands:
  - name: "input_A"
    dims: [32, 32]
    format: [Float16_b, Float16]
    stimuli:
      include:
        - [-8.0, -5.01]
        - [-4.99, -3.01]
        - [-2.99, -2.01]
        - [-1.99, -1.01]
        - [-0.99, -0.51]
        - [-0.49, -0.01]
        - [0.0101, 0.49]
        - [0.51, 0.98609375]
        - [1.0178125, 1.99]
        - [2.01, 2.99]
        - [3.01, 4.99]
        - [5.01, 8.0]
        - -5.0
        - -3.0
        - -2.0
        - -1.0
        - -0.5
        - 0.0
        - 1.0e-40
        - 0.0001
        - 0.5
        - 0.99609375
        - 1.0
        - 1.0078125
        - 2.0
        - 3.0
        - 5.0
  - name: "sfpu_out"
    dims: [32, 32]
    format: Float16_b

operations:
  - math:
      - {type: "Fpu", in0: "input_A", operation: "Datacopy", unpacker: "UnpackerA", math_fidelity: "LoFi", unpack_to_dest: false, block_size: [32, 32]}
      - type: "UnarySfpu"
        operation: [I0, I1]
        approximation_mode: [false, true]
        iterations: 32
        block_size: [32, 32]
    pack:
      - {output: "sfpu_out", packer: "Packer", block_size: [32, 32]}

# Datacopy followed by Elwmul that reuses dest as in1.

operands:
  - name: "input_A"
    dims: [256, 256]
    format: "Float16_b"
  - name: "output"
    dims: [256, 256]
    format: "Float16_b"

operations:
  - math:
      - type: "Fpu"
        block_size: [64, 128]
        operation: "Datacopy"
        unpacker: "UnpackerA"
        math_fidelity: "LoFi"
        in0: "input_A"
      - type: "Fpu"
        block_size: [64, 128]
        in0: "input_A"
        operation: "Elwmul"
        unpacker: "UnpackerA"
        reuse_dest: "DEST_TO_SRCB"
        math_fidelity: "LoFi"
      - type: "Fpu"
        block_size: [64, 128]
        in0: "input_A"
        operation: "Elwmul"
        unpacker: "UnpackerA"
        reuse_dest: "DEST_TO_SRCA"
        math_fidelity: "LoFi"
    pack:
      - output: "output"
        block_size: [64, 128]
        packer: "Packer"

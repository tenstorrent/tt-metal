# Datacopy followed by Elwmul that reuses dest as src_b.

operands:
  - name: "input_A"
    dims: [256, 256]
    format: "Float16_b"
  - name: "input_B"
    dims: [256, 256]
    format: "Float16_b"
  - name: "output"
    dims: [256, 256]
    format: "Float16_b"

operations:
  - math:
      - type: "Fpu"
        operation: "Datacopy"
        unpacker: "UnpackerA"
        math_fidelity: "LoFi"
        src_a: "input_A"
        src_b: "input_B"
      - type: "Fpu"
        src_a: "input_A"
        src_b: "input_B"
        operation: "Elwmul"
        unpacker: "UnpackerA"
        reuse_dest: "DEST_TO_SRCB"
        math_fidelity: "LoFi"
      - type: "Fpu"
        src_a: "input_A"
        src_b: "input_B"
        operation: "Elwmul"
        unpacker: "UnpackerA"
        reuse_dest: "DEST_TO_SRCA"
        math_fidelity: "LoFi"
    block_size: [64, 128]
    pack:
      - output: "output"
        packer: "Packer"

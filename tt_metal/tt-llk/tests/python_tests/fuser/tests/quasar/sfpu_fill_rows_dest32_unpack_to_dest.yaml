# fill_rows_tile as in sfpu_fill_rows_dest32.yaml, on Float32 unpacked straight to Dest, so the rows left alone
# carry full 32-bit patterns. Bit-exact.

dest_acc: true

operands:
  - name: "input_A"
    dims: [32, 64]
    format: [Float32]
    stimuli:
      include:
        - [-1000.0, -10.5]
        - [-9.5, -0.01]
        - [0.01, 9.5]
        - [10.5, 1000.0]
        - -1.0e-30
        - -1.0
        - 0.0
        - 1.0
        - 1.0e-30
  - name: "sfpu_out"
    dims: [32, 64]
    format: Float32
    atol: 0.0
    rtol: 0.0

operations:
  - math:
      - {type: "Fpu", in0: "input_A", operation: "Datacopy", unpacker: "UnpackerA", math_fidelity: "LoFi", unpack_to_dest: true, block_size: [32, 64]}
      - type: "UnarySfpu"
        operation: [FillRows, FillRowsCt]
        approximation_mode: false
        iterations: 32
        fill_const_value: 1.0e+20
        block_size: [32, 64]
    pack:
      - {output: "sfpu_out", packer: "Packer", block_size: [32, 64]}

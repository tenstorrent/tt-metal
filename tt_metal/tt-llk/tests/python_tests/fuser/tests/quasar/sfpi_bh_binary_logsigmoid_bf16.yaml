# Blackhole SFPI parity: SfpuLogsigmoid; tile 0 and tile 1 inputs, tile 2 output.
# Pack all three tiles to check that input tiles are preserved.
supported_archs: [quasar]
dest_acc: false

operands:
  - {name: case_0_input, dims: [32, 96], format: Float16_b, const_value: -8}
  - {name: case_0_output, dims: [32, 96], format: Float16_b}
  - {name: case_1_input, dims: [32, 96], format: Float16_b, const_value: -4}
  - {name: case_1_output, dims: [32, 96], format: Float16_b}
  - {name: case_2_input, dims: [32, 96], format: Float16_b, const_value: 0}
  - {name: case_2_output, dims: [32, 96], format: Float16_b}
  - {name: case_3_input, dims: [32, 96], format: Float16_b, const_value: 4}
  - {name: case_3_output, dims: [32, 96], format: Float16_b}
  - {name: case_4_input, dims: [32, 96], format: Float16_b, const_value: 8}
  - {name: case_4_output, dims: [32, 96], format: Float16_b}

operations:
  - block_size: [32, 96]
    math:
      - type: Fpu
        operation: Datacopy
        in0: case_0_input
        unpacker: UnpackerA
        unpack_to_dest: false
      - {type: UnarySfpu, operation: Neg, dst_dest_tile_index: 1, iterations: 32}
      - {type: UnarySfpu, operation: Exp, dst_dest_tile_index: 1, iterations: 32}
      - type: BinarySfpu
        operation: SfpuLogsigmoid
        src1_dest_tile_index: 0
        src2_dest_tile_index: 1
        dst_dest_tile_index: 2
        iterations: 32
    pack:
      - {output: case_0_output, packer: Packer}
  - block_size: [32, 96]
    math:
      - type: Fpu
        operation: Datacopy
        in0: case_1_input
        unpacker: UnpackerA
        unpack_to_dest: false
      - {type: UnarySfpu, operation: Neg, dst_dest_tile_index: 1, iterations: 32}
      - {type: UnarySfpu, operation: Exp, dst_dest_tile_index: 1, iterations: 32}
      - type: BinarySfpu
        operation: SfpuLogsigmoid
        src1_dest_tile_index: 0
        src2_dest_tile_index: 1
        dst_dest_tile_index: 2
        iterations: 32
    pack:
      - {output: case_1_output, packer: Packer}
  - block_size: [32, 96]
    math:
      - type: Fpu
        operation: Datacopy
        in0: case_2_input
        unpacker: UnpackerA
        unpack_to_dest: false
      - {type: UnarySfpu, operation: Neg, dst_dest_tile_index: 1, iterations: 32}
      - {type: UnarySfpu, operation: Exp, dst_dest_tile_index: 1, iterations: 32}
      - type: BinarySfpu
        operation: SfpuLogsigmoid
        src1_dest_tile_index: 0
        src2_dest_tile_index: 1
        dst_dest_tile_index: 2
        iterations: 32
    pack:
      - {output: case_2_output, packer: Packer}
  - block_size: [32, 96]
    math:
      - type: Fpu
        operation: Datacopy
        in0: case_3_input
        unpacker: UnpackerA
        unpack_to_dest: false
      - {type: UnarySfpu, operation: Neg, dst_dest_tile_index: 1, iterations: 32}
      - {type: UnarySfpu, operation: Exp, dst_dest_tile_index: 1, iterations: 32}
      - type: BinarySfpu
        operation: SfpuLogsigmoid
        src1_dest_tile_index: 0
        src2_dest_tile_index: 1
        dst_dest_tile_index: 2
        iterations: 32
    pack:
      - {output: case_3_output, packer: Packer}
  - block_size: [32, 96]
    math:
      - type: Fpu
        operation: Datacopy
        in0: case_4_input
        unpacker: UnpackerA
        unpack_to_dest: false
      - {type: UnarySfpu, operation: Neg, dst_dest_tile_index: 1, iterations: 32}
      - {type: UnarySfpu, operation: Exp, dst_dest_tile_index: 1, iterations: 32}
      - type: BinarySfpu
        operation: SfpuLogsigmoid
        src1_dest_tile_index: 0
        src2_dest_tile_index: 1
        dst_dest_tile_index: 2
        iterations: 32
    pack:
      - {output: case_4_output, packer: Packer}

# Binary Int32 lcm(a, b) over the kernel's contract |a|, |b| <= 2**15 - 1 (so the result stays below
# 2**30): zeros (lcm(0, x) = lcm(0, 0) = 0), small values rich in shared factors and powers of two,
# values around 2**14 and next to the 32767 ceiling, and the pairs (3, 32765) / (10923, 21845) that
# need the full 14 binary-GCD steps. a and b are the two tiles of one [32, 64] operand (Int32 is
# unpacked straight to Dest) and share its stimuli, so every pairing of the ranges and points occurs.
# The harness stores Int32 in L1 as sign-magnitude and the fuser builds the kernel with
# SIGN_MAGNITUDE_FORMAT = false, so only non-negative operands are checked; negative operands (lcm
# takes |a|, |b|) need a two's-complement Int32 option or a sign-magnitude knob in the fuser. The
# test_eltwise_binary_sfpu_quasar.py harness covers them on both datapaths.
#
# Generated for the Quasar port of the lcm kernel, using only existing fuser features:
# dest_acc is fixed per file (Int32 needs a 32-bit Dest), every input goes through the FPU datacopy
# path, and stimuli are finite intervals and points (no inf, NaN, -0 or INT_MIN).
# Special points sit outside the random ranges, so each is drawn about as often as a unit of range.

dest_acc: true

operands:
  - name: "input_A"
    dims: [32, 64]
    format: [Int32]
    stimuli:
      include:
        - [0.0, 64.0]
        - [1000.0, 1064.0]
        - [16352.0, 16416.0]
        - [32703.0, 32767.0]
        - 8192.0
        - 10923.0
        - 21845.0
        - 27720.0
        - 30030.0
        - 32760.0
        - 32765.0
  - name: "sfpu_out"
    dims: [32, 32]
    format: Int32

operations:
  - math:
      - {type: "Fpu", in0: "input_A", operation: "Datacopy", unpacker: "UnpackerA", math_fidelity: "LoFi", unpack_to_dest: true, block_size: [32, 64]}
      - type: "BinarySfpu"
        operation: [SfpuLcm]
        approximation_mode: false
        iterations: 32
        block_size: [32, 32]
        indexes: {src0: 0, src1: 1, dest: 2}
    pack:
      - {output: "sfpu_out", packer: "Packer", block_size: [32, 32], indexes: {dest: 2, out: 0}}

# Each listed operation expands into an independent single-stage test.
# Only the final SFPU operation is swept; preparation and pack checks are fixed.

# SfpuBitwiseAnd: sfpi_bh_signed_bitwise_and_negative_large_int32
# Exact signed SfpuBitwiseAnd; RSUB preprocessing creates mixed-sign operands without float conversion.

# SfpuBitwiseOr: sfpi_bh_signed_bitwise_or_negative_large_int32
# Exact signed SfpuBitwiseOr; RSUB preprocessing creates mixed-sign operands without float conversion.

# SfpuBitwiseXor: sfpi_bh_signed_bitwise_xor_negative_large_int32
# Exact signed SfpuBitwiseXor; RSUB preprocessing creates mixed-sign operands without float conversion.

# SfpuDivInt32Floor: sfpi_bh_signed_div_floor_negative_large_int32
# Exact signed SfpuDivInt32Floor; RSUB preprocessing creates mixed-sign operands without float conversion.

# SfpuDivInt32: sfpi_bh_signed_div_trunc_negative_large_int32
# Exact signed SfpuDivInt32; RSUB preprocessing creates mixed-sign operands without float conversion.

# SfpuFmodInt32: sfpi_bh_signed_fmod_negative_large_int32
# Exact signed SfpuFmodInt32; RSUB preprocessing creates mixed-sign operands without float conversion.

# SfpuRemainderInt32: sfpi_bh_signed_remainder_negative_large_int32
# Exact signed SfpuRemainderInt32; RSUB preprocessing creates mixed-sign operands without float conversion.

# SfpuRsubInt32: sfpi_bh_signed_rsub_negative_large_int32
# Exact signed SfpuRsubInt32; RSUB preprocessing creates mixed-sign operands without float conversion.

dest_acc: true
supported_archs: [quasar]

operands:
  - {const_value: -2147483647, dims: [32, 96], format: Int32, name: input}
  - {dims: [32, 96], format: Int32, name: output}

operations:
  - block_size: [32, 96]
    math:
      - {in0: input, operation: Datacopy, type: Fpu, unpack_to_dest: true, unpacker: UnpackerA}
      - type: BinarySfpu
        operation:
          - SfpuBitwiseAnd
          - SfpuBitwiseOr
          - SfpuBitwiseXor
          - SfpuDivInt32Floor
          - SfpuDivInt32
          - SfpuFmodInt32
          - SfpuRemainderInt32
          - SfpuRsubInt32
        dst_dest_tile_index: 2
        iterations: 32
        src1_dest_tile_index: 0
        src2_dest_tile_index: 1
    pack:
      - {output: output, packer: Packer}

# Dest dvalid gate on MOVD2B: the SFPU writes dest and hands it to the FPU, whose first dest access is the MOVD2B of an
# Elwmul that reuses dest as SrcB. Only the FPU's dvalid wait orders that MOVD2B after the SFPU stores: move_d2b_fixed_face
# waits for MATH and SRCB_VLD but not for the SFPU, and the unpack thread supplies SrcA/SrcB without waiting for the SFPU.
# If MOVD2B is not gated it reads the Datacopy result instead of exp(x), and the output becomes x * x instead of x * exp(x).

quasar_use_dvalid: true

operands:
  - name: "input_A"
    dims: [128, 128]
    format: "Float16_b"
    stimuli:
      include:
        - [-2.0, 2.0]
  - name: "output"
    dims: [128, 128]
    format: "Float16_b"

operations:
  - math:
      - type: "Fpu"
        block_size: [32, 128]
        operation: "Datacopy"
        unpacker: "UnpackerA"
        math_fidelity: "LoFi"
        in0: "input_A"
      - type: "UnarySfpu"
        block_size: [32, 128]
        operation: [Exp]
        approximation_mode: false
        iterations: 32
      - type: "Fpu"
        block_size: [32, 128]
        in0: "input_A"
        operation: "Elwmul"
        unpacker: "UnpackerA"
        reuse_dest: "DEST_TO_SRCB"
        math_fidelity: "LoFi"
    pack:
      - output: "output"
        block_size: [32, 128]
        packer: "Packer"

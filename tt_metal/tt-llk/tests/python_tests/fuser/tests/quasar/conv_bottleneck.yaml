# ResNet-style bottleneck block: 1x1 reduce, 1x1 mid conv, 1x1 expand,
# residual add, ReLU. The reduce and mid convolutions include per-channel
# bias via fused elwadd+relu (row broadcast reusing one bias vector).
# The mid stage stands in for the 3x3 conv of a real bottleneck: a lowered
# 3x3 conv would need im2col (inner dim 9*C), which the fuser does not model.

dest_acc: true

operands:
  - name: "input"
    dims: [128, 256]
    format: "Float16_b"
  - name: "w_reduce"
    dims: [256, 64]
    format: "Float16_b"
  - name: "b_reduce"
    dims: [128, 64]
    format: "Float16_b"
  - name: "w_mid"
    dims: [64, 64]
    format: "Float16_b"
  - name: "b_mid"
    dims: [128, 64]
    format: "Float16_b"
  - name: "w_expand"
    dims: [64, 256]
    format: "Float16_b"
  - name: "skip"
    dims: [128, 256]
    format: "Float16_b"
  - name: "reduce_out"
    dims: [128, 64]
    format: "Float16_b"
  - name: "reduce_bias"
    dims: [128, 64]
    format: "Float16_b"
  - name: "mid_out"
    dims: [128, 64]
    format: "Float16_b"
  - name: "mid_bias"
    dims: [128, 64]
    format: "Float16_b"
  - name: "expand_out"
    dims: [128, 256]
    format: "Float16_b"
  - name: "output"
    dims: [128, 256]
    format: "Float16_b"

operations:
  # 1x1 reduce conv
  - math:
      - type: "Fpu"
        in0: "input"
        in1: "w_reduce"
        operation: "Matmul"
        unpacker: "MatmulUnpacker"
        math_fidelity: "HiFi2"
    block_size: [64, 64]
    pack:
      - output: "reduce_out"
        packer: "Packer"

  # Bias + ReLU for reduce conv
  - math:
      - type: "Fpu"
        in0: "reduce_out"
        in1: "b_reduce"
        operation: "Elwadd"
        unpacker: "UnpackerAB"
        broadcast_type: "ROW"
        broadcast_tile: 0
        math_fidelity: "LoFi"
      - type: "UnarySfpu"
        operation: "Relu"
        iterations: 32
    block_size: [64, 64]
    pack:
      - output: "reduce_bias"
        packer: "Packer"

  # 1x1 mid conv (stand-in for the bottleneck's 3x3 conv)
  - math:
      - type: "Fpu"
        in0: "reduce_bias"
        in1: "w_mid"
        operation: "Matmul"
        unpacker: "MatmulUnpacker"
        math_fidelity: "HiFi2"
    block_size: [64, 64]
    pack:
      - output: "mid_out"
        packer: "Packer"

  # Bias + ReLU for mid conv
  - math:
      - type: "Fpu"
        in0: "mid_out"
        in1: "b_mid"
        operation: "Elwadd"
        unpacker: "UnpackerAB"
        broadcast_type: "ROW"
        broadcast_tile: 0
        math_fidelity: "LoFi"
      - type: "UnarySfpu"
        operation: "Relu"
        iterations: 32
    block_size: [64, 64]
    pack:
      - output: "mid_bias"
        packer: "Packer"

  # 1x1 expand conv
  - math:
      - type: "Fpu"
        in0: "mid_bias"
        in1: "w_expand"
        operation: "Matmul"
        unpacker: "MatmulUnpacker"
        math_fidelity: "HiFi2"
    block_size: [64, 64]
    pack:
      - output: "expand_out"
        packer: "Packer"

  # Residual add + ReLU
  - math:
      - type: "Fpu"
        in0: "expand_out"
        in1: "skip"
        operation: "Elwadd"
        unpacker: "UnpackerAB"
        math_fidelity: "LoFi"
      - type: "UnarySfpu"
        operation: "Relu"
        iterations: 32
    block_size: [64, 64]
    pack:
      - output: "output"
        packer: "Packer"

# dropout at the harness defaults (p = 0, scale 2.0), called twice: golden x * 4.0. The drop path
# needs probability/seed/scale the fuser can't set; it is covered by test_dropout_* instead.

dest_acc: false

operands:
  - name: "input_A"
    dims: [32, 32]
    format: [Float16_b, Float16]
    stimuli:
      include:
        - [-8.0, -2.01]
        - [-1.99, -1.01]
        - [-0.99, -0.51]
        - [-0.49, -0.01]
        - [0.0101, 0.49]
        - [0.51, 0.99]
        - [1.01, 1.99]
        - [2.01, 8.0]
        - -8000.0
        - -100.0
        - -2.0
        - -1.0
        - -0.5
        - 0.0
        - 1.0e-40
        - 0.0001
        - 0.5
        - 1.0
        - 2.0
        - 100.0
        - 8000.0
  - name: "sfpu_out"
    dims: [32, 32]
    format: Float16_b

operations:
  - math:
      - {type: "Fpu", in0: "input_A", operation: "Datacopy", unpacker: "UnpackerA", math_fidelity: "LoFi", unpack_to_dest: false, block_size: [32, 32]}
      - type: "UnarySfpu"
        operation: [Dropout]
        approximation_mode: false
        iterations: 32
        block_size: [32, 32]
      - type: "UnarySfpu"
        operation: [Dropout]
        approximation_mode: false
        iterations: 32
        block_size: [32, 32]
    pack:
      - {output: "sfpu_out", packer: "Packer", block_size: [32, 32]}

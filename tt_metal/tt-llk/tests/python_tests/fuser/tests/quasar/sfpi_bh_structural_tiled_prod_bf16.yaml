# Blackhole SFPI parity: ParityTiledProd; one full 32x32 tile per operation.
# Dispatch uses VectorMode::None, once per tile (not once per face).
# Independent lane-wise prefix product of all 32 SFPU vectors.
# The production helper receives 31 iterations plus its final vector.
supported_archs: [quasar]
dest_acc: false

operands:
  - {name: random_input, dims: [32, 32], format: Float16_b}
  - {name: random_output, dims: [32, 32], format: Float16_b}
  - {name: negative_input, dims: [32, 32], format: Float16_b, const_value: -1}
  - {name: negative_output, dims: [32, 32], format: Float16_b}
  - {name: zero_input, dims: [32, 32], format: Float16_b, const_value: 0}
  - {name: zero_output, dims: [32, 32], format: Float16_b}
  - {name: fraction_input, dims: [32, 32], format: Float16_b, const_value: 0.5}
  - {name: fraction_output, dims: [32, 32], format: Float16_b}
  - {name: one_input, dims: [32, 32], format: Float16_b, const_value: 1}
  - {name: one_output, dims: [32, 32], format: Float16_b}
  - {name: two_input, dims: [32, 32], format: Float16_b, const_value: 2}
  - {name: two_output, dims: [32, 32], format: Float16_b}

operations:
  - math:
      - type: Fpu
        operation: Datacopy
        in0: random_input
        unpacker: UnpackerA
        unpack_to_dest: false
      - {type: UnarySfpu, operation: ParityTiledProd, dst_dest_tile_index: 0, iterations: 32}
    pack:
      - {output: random_output, packer: Packer}
  - math:
      - type: Fpu
        operation: Datacopy
        in0: negative_input
        unpacker: UnpackerA
        unpack_to_dest: false
      - {type: UnarySfpu, operation: ParityTiledProd, dst_dest_tile_index: 0, iterations: 32}
    pack:
      - {output: negative_output, packer: Packer}
  - math:
      - type: Fpu
        operation: Datacopy
        in0: zero_input
        unpacker: UnpackerA
        unpack_to_dest: false
      - {type: UnarySfpu, operation: ParityTiledProd, dst_dest_tile_index: 0, iterations: 32}
    pack:
      - {output: zero_output, packer: Packer}
  - math:
      - type: Fpu
        operation: Datacopy
        in0: fraction_input
        unpacker: UnpackerA
        unpack_to_dest: false
      - {type: UnarySfpu, operation: ParityTiledProd, dst_dest_tile_index: 0, iterations: 32}
    pack:
      - {output: fraction_output, packer: Packer}
  - math:
      - type: Fpu
        operation: Datacopy
        in0: one_input
        unpacker: UnpackerA
        unpack_to_dest: false
      - {type: UnarySfpu, operation: ParityTiledProd, dst_dest_tile_index: 0, iterations: 32}
    pack:
      - {output: one_output, packer: Packer}
  - math:
      - type: Fpu
        operation: Datacopy
        in0: two_input
        unpacker: UnpackerA
        unpack_to_dest: false
      - {type: UnarySfpu, operation: ParityTiledProd, dst_dest_tile_index: 0, iterations: 32}
    pack:
      - {output: two_output, packer: Packer}

# rand overwrites Dest with hardware-PRNG draws from the harness default interval [1, 3]
# (sfpu_operations_quasar.h RAND_FROM_BITS / RAND_SCALE_BITS), so its own output has no
# element-wise golden; test_rand_quasar checks it statistically. Here rand is followed by an
# on-device interval test, built from existing unary ops:
#   neg, add1, add1 -> 2 - x;  abs -> |x - 2|;  neg, add1 -> 1 - |x - 2|;  x >= 0
# which is 1 exactly when x is in [1, 3] (every step is exact on the bounds) and 0 otherwise.
# Every input lies outside [1, 3], so an element rand left unwritten gives 0, as does a draw
# below 1 or above 3; the golden (the interval midpoint) gives 1 everywhere.
#
# Uses only existing fuser features: dest_acc is fixed per file (hence the _dest16 / _dest32
# pair), the float input goes through the FPU datacopy path, and stimuli are finite intervals and
# points. Sweeping the rand interval or seed, or checking rand's own output, needs fuser support
# (op template parameters, statistical checks) that does not exist.

dest_acc: true

operands:
  - name: "input_A"
    dims: [32, 32]
    format: [Float16_b, Float16, Float32]
    stimuli:
      include:
        - [-8.0, -0.01]
        - [0.01, 0.98]
        - [3.02, 8.0]
        - -1.0
        - 0.0
        - 0.5
        - 0.98
        - 3.02
  - name: "sfpu_out"
    dims: [32, 32]
    format: Float32

operations:
  - math:
      - {type: "Fpu", in0: "input_A", operation: "Datacopy", unpacker: "UnpackerA", math_fidelity: "LoFi", unpack_to_dest: false, block_size: [32, 32]}
      - type: "UnarySfpu"
        operation: [Rand]
        approximation_mode: false
        iterations: 32
        block_size: [32, 32]
      - type: "UnarySfpu"
        operation: [Neg]
        approximation_mode: false
        iterations: 32
        block_size: [32, 32]
      - type: "UnarySfpu"
        operation: [Add1]
        approximation_mode: false
        iterations: 32
        block_size: [32, 32]
      - type: "UnarySfpu"
        operation: [Add1]
        approximation_mode: false
        iterations: 32
        block_size: [32, 32]
      - type: "UnarySfpu"
        operation: [Abs]
        approximation_mode: false
        iterations: 32
        block_size: [32, 32]
      - type: "UnarySfpu"
        operation: [Neg]
        approximation_mode: false
        iterations: 32
        block_size: [32, 32]
      - type: "UnarySfpu"
        operation: [Add1]
        approximation_mode: false
        iterations: 32
        block_size: [32, 32]
      - type: "UnarySfpu"
        operation: [GreaterThanEqualZero]
        approximation_mode: false
        iterations: 32
        block_size: [32, 32]
    pack:
      - {output: "sfpu_out", packer: "Packer", block_size: [32, 32]}

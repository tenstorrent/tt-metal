# ResNet basic block: conv + residual add + ReLU.
# The skip connection is added after the convolution, followed by ReLU activation.

operands:
  - name: "activations"
    dims: [128, 256]
    format: "Float16_b"
  - name: "weights"
    dims: [256, 128]
    format: "Float16_b"
  - name: "skip_input"
    dims: [128, 128]
    format: "Float16_b"
  - name: "conv_result"
    dims: [128, 128]
    format: "Float16_b"
  - name: "output"
    dims: [128, 128]
    format: "Float16_b"

operations:
  - math:
      - type: "Fpu"
        in0: "activations"
        in1: "weights"
        operation: "Matmul"
        unpacker: "MatmulUnpacker"
        math_fidelity: "HiFi2"
    block_size: [64, 64]
    pack:
      - output: "conv_result"
        packer: "Packer"

  - math:
      - type: "Fpu"
        in0: "conv_result"
        in1: "skip_input"
        operation: "Elwadd"
        unpacker: "UnpackerAB"
        math_fidelity: "LoFi"
      - type: "UnarySfpu"
        operation: "Relu"
        iterations: 32
    block_size: [64, 64]
    pack:
      - output: "output"
        packer: "Packer"

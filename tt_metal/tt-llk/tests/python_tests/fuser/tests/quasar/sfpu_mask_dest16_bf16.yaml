# mask / mask_posinf: data (Dest tile 0) is zeroed / set to +inf wherever the mask (tile 1) is
# zero, in place (the kernels hard-code that layout); a quarter of the mask lanes are 0.
#
# Generated for the Quasar port of the Blackhole SFPI kernels, using only existing fuser features:
# dest_acc is fixed per file (hence the _dest16 / _dest32 pairs), every float input goes through
# the FPU datacopy path, and stimuli are finite intervals and points (no inf, NaN, -0 or INT_MIN).
# Special points sit outside the random ranges, so each is drawn about as often as a unit of range.

dest_acc: false

operands:
  - name: "input_A"
    dims: [32, 32]
    format: [Float16_b]
    stimuli:
      include:
        - [-8.0, -3.01]
        - [-2.99, -2.01]
        - [-1.99, -1.01]
        - [-0.99, -0.51]
        - [-0.49, -0.01]
        - [0.0101, 0.49]
        - [0.51, 0.98609375]
        - [1.0178125, 1.99]
        - [2.01, 2.99]
        - [3.01, 4.99]
        - [5.01, 8.0]
        - -65000.0
        - -100.0
        - -3.0
        - -2.0
        - -1.0
        - -0.5
        - 0.0
        - 1.0e-40
        - 0.0001
        - 0.5
        - 0.99609375
        - 1.0
        - 1.0078125
        - 2.0
        - 3.0
        - 5.0
        - 100.0
        - 65000.0
  - name: "mask"
    dims: [32, 32]
    format: [Float16_b]
    stimuli:
      include:
        - [-2.0, -0.5]
        - [0.5, 2.0]
        - 0.0
  - name: "sfpu_out"
    dims: [32, 32]
    format: Float16_b

operations:
  - math:
      - {type: "Fpu", in0: "input_A", operation: "Datacopy", unpacker: "UnpackerA", math_fidelity: "LoFi", unpack_to_dest: false, block_size: [32, 32], indexes: {in0: 0, dest: 0}}
      - {type: "Fpu", in0: "mask", operation: "Datacopy", unpacker: "UnpackerA", math_fidelity: "LoFi", unpack_to_dest: false, block_size: [32, 32], indexes: {in0: 0, dest: 1}}
      - type: "BinarySfpu"
        operation: [SfpuMask, SfpuMaskPosinf]
        approximation_mode: false
        iterations: 32
        block_size: [32, 32]
        indexes: {src0: 0, src1: 1, dest: 0}
    pack:
      - {output: "sfpu_out", packer: "Packer", block_size: [32, 32], indexes: {dest: 0, out: 0}}

# Each listed operation expands into an independent single-stage test.
# Only the final SFPU operation is swept; preparation and pack checks are fixed.

# ParityIntSumCol: sfpi_bh_structural_int_sum_col_int32_negative
# Blackhole SFPI parity: ParityIntSumCol; constant input = -3.
# Partial whole-tile reduction; untouched vectors must remain unchanged.
# Single-stage direct-to-Dest preserves Int32 sign-magnitude representation.
# Dispatch uses VectorMode::None exactly once at the tile base.

# ParityIntSumRow: sfpi_bh_structural_int_sum_row_int32_negative
# Blackhole SFPI parity: ParityIntSumRow; constant input = -3.
# Partial whole-tile reduction; untouched vectors must remain unchanged.
# Single-stage direct-to-Dest preserves Int32 sign-magnitude representation.
# Dispatch uses VectorMode::None exactly once at the tile base.

dest_acc: true
supported_archs: [quasar]

operands:
  - {const_value: -3, dims: [32, 32], format: Int32, name: input}
  - {dims: [32, 32], format: Int32, name: output}

operations:
  - math:
      - {in0: input, operation: Datacopy, type: Fpu, unpack_to_dest: true, unpacker: UnpackerA}
      - type: UnarySfpu
        operation:
          - ParityIntSumCol
          - ParityIntSumRow
        dst_dest_tile_index: 0
        iterations: 32
    pack:
      - {output: output, packer: Packer}

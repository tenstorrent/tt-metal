# Binary Int32 shifts a << b, a >> b (arithmetic) and logical a >> b on one value set that cannot
# overflow a left shift: [0, 15] in range plus the out-of-range amounts 32, 33, 63, 64, 100 and 1000,
# which give 0. The largest operand (1000 < 2**10) shifted by the largest in-range amount (15) stays
# below 2**31.
# Int32 must be unpacked straight to Dest and needs a 32-bit Dest, so a and the shift amount are the
# two tiles of one [32, 64] operand and share its stimuli. The harness stores Int32 in L1 as
# sign-magnitude while these kernels compute in two's complement (tt-metal's Int32 encoding), so
# only non-negative operands with non-negative results are checked: negative values and negative
# shift amounts need a two's-complement Int32 option in the fuser.
#
# Generated for the Quasar port of the Blackhole SFPI kernels, using only existing fuser features:
# dest_acc is fixed per file (hence the _dest16 / _dest32 pairs), every float input goes through
# the FPU datacopy path, and stimuli are finite intervals and points (no inf, NaN, -0 or INT_MIN).
# Special points sit outside the random ranges, so each is drawn about as often as a unit of range.

dest_acc: true

operands:
  - name: "input_A"
    dims: [32, 64]
    format: [Int32]
    stimuli:
      include:
        - [0.0, 15.0]
        - 32.0
        - 33.0
        - 63.0
        - 64.0
        - 100.0
        - 1000.0
  - name: "sfpu_out"
    dims: [32, 32]
    format: Int32

operations:
  - math:
      - {type: "Fpu", in0: "input_A", operation: "Datacopy", unpacker: "UnpackerA", math_fidelity: "LoFi", unpack_to_dest: true, block_size: [32, 64]}
      - type: "BinarySfpu"
        operation: [SfpuElwLeftShift, SfpuElwRightShift, SfpuElwLogicalRightShift]
        approximation_mode: false
        iterations: 32
        block_size: [32, 32]
        indexes: {src0: 0, src1: 1, dest: 2}
    pack:
      - {output: "sfpu_out", packer: "Packer", block_size: [32, 32], indexes: {dest: 2, out: 0}}

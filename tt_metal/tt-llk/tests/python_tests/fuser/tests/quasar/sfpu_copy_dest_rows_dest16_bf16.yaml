# copy_dest_rows / copy_dest_row with the fixed pairs COPY_DEST_ROWS_FUSER_BANDS (band 1 -> 6) and
# COPY_DEST_ROW_FUSER_ROWS (row 5 -> 18, then row 9 -> 1) (the fuser cannot pass band / row indices), from Dest tile 0
# into tile 1, which keeps its own data in every other row.
# 16-bit Dest: the kernel moves raw 16-bit datums.

dest_acc: false

operands:
  - name: "input_A"
    dims: [32, 64]
    format: [Float16_b]
    stimuli:
      include:
        - [-1.0e+30, -1000.0]
        - [-1000.0, -0.001]
        - [0.001, 1000.0]
        - [1000.0, 1.0e+30]
        - -1.0e-30
        - 0.0
        - 1.0e-30
  - name: "sfpu_out"
    dims: [32, 32]
    format: Float16_b
    atol: 0.0  # raw copies: every datum, copied or kept, must survive bit for bit
    rtol: 0.0

operations:
  - math:
      - {type: "Fpu", in0: "input_A", operation: "Datacopy", unpacker: "UnpackerA", math_fidelity: "LoFi", unpack_to_dest: false, block_size: [32, 64]}
      - type: "BinarySfpu"
        operation: [SfpuCopyDestRows, SfpuCopyDestRow]
        approximation_mode: false
        iterations: 32
        block_size: [32, 32]
        indexes: {src0: 0, src1: 1, dest: 1}
    pack:
      - {output: "sfpu_out", packer: "Packer", block_size: [32, 32], indexes: {dest: 1, out: 0}}

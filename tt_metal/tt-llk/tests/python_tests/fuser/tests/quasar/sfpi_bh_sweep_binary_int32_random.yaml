# Each listed operation expands into an independent single-stage test.
# Only the final SFPU operation is swept; preparation and pack checks are fixed.

# SfpuBitwiseAnd: sfpi_bh_binary_bitwise_and_int32
# Blackhole SFPI parity: SfpuBitwiseAnd; tile 0 and tile 1 inputs, tile 2 output.
# Pack all three tiles to check that input tiles are preserved.

# SfpuBitwiseOr: sfpi_bh_binary_bitwise_or_int32
# Blackhole SFPI parity: SfpuBitwiseOr; tile 0 and tile 1 inputs, tile 2 output.
# Pack all three tiles to check that input tiles are preserved.

# SfpuBitwiseXor: sfpi_bh_binary_bitwise_xor_int32
# Blackhole SFPI parity: SfpuBitwiseXor; tile 0 and tile 1 inputs, tile 2 output.
# Pack all three tiles to check that input tiles are preserved.

# SfpuDivInt32Floor: sfpi_bh_binary_div_int32_floor_int32
# Blackhole SFPI parity: SfpuDivInt32Floor; tile 0 and tile 1 inputs, tile 2 output.
# Pack all three tiles to check that input tiles are preserved.

# SfpuDivInt32: sfpi_bh_binary_div_int32_int32
# Blackhole SFPI parity: SfpuDivInt32; tile 0 and tile 1 inputs, tile 2 output.
# Pack all three tiles to check that input tiles are preserved.

# SfpuFmodInt32: sfpi_bh_binary_fmod_int32_int32
# Blackhole SFPI parity: SfpuFmodInt32; tile 0 and tile 1 inputs, tile 2 output.
# Pack all three tiles to check that input tiles are preserved.

# SfpuRemainderInt32: sfpi_bh_binary_remainder_int32_int32
# Blackhole SFPI parity: SfpuRemainderInt32; tile 0 and tile 1 inputs, tile 2 output.
# Pack all three tiles to check that input tiles are preserved.

# SfpuRsubInt32: sfpi_bh_binary_rsub_int32_int32
# Blackhole SFPI parity: SfpuRsubInt32; tile 0 and tile 1 inputs, tile 2 output.
# Pack all three tiles to check that input tiles are preserved.

dest_acc: true
supported_archs: [quasar]

operands:
  - {dims: [32, 96], format: Int32, name: input}
  - {dims: [32, 96], format: Int32, name: output}

operations:
  - block_size: [32, 96]
    math:
      - {in0: input, operation: Datacopy, type: Fpu, unpack_to_dest: true, unpacker: UnpackerA}
      - type: BinarySfpu
        operation:
          - SfpuBitwiseAnd
          - SfpuBitwiseOr
          - SfpuBitwiseXor
          - SfpuDivInt32Floor
          - SfpuDivInt32
          - SfpuFmodInt32
          - SfpuRemainderInt32
          - SfpuRsubInt32
        dst_dest_tile_index: 2
        iterations: 32
        src1_dest_tile_index: 0
        src2_dest_tile_index: 1
    pack:
      - {output: output, packer: Packer}

# Group norm over a 64x64 block.
# Tilize the row-major input, then apply the input mask and take the mean E[x]
# via a scalar SUM reduce scaled by inv_num_datums. Subtract the mean, remask,
# square, and reduce again to get E[(x-mean)^2] = variance. Add eps, take rsqrt
# to form 1/sqrt(var+eps), and normalize (x-mean) by it. Accumulate a reread
# row-major residual, then apply per-channel gamma scale (ROW broadcast) and
# beta shift, and untilize the result back to row-major output.

skip_for_perf: true

operands:
  - name: "x"
    dims: [64, 64]
    format: "Float16_b"

  - name: "input_mask"
    dims: [64, 64]
    format: "Float16_b"
    const_value: 1.0

  - name: "scaler"
    dims: [64, 64]
    format: "Float16_b"
    const_value: 1.0

  - name: "inv_num_datums"
    dims: [64, 64]
    format: "Float16_b"
    const_value: 0.000244140625

  - name: "eps"
    dims: [64, 64]
    format: "Float16_b"
    const_value: 0.001

  - name: "gamma"
    dims: [64, 64]
    format: "Float16_b"

  - name: "beta"
    dims: [64, 64]
    format: "Float16_b"

  - name: "reread_rm"
    dims: [64, 64]
    format: "Float16_b"

  - name: "x_tiled"
    dims: [64, 64]
    format: "Float16_b"

  - name: "x_masked"
    dims: [64, 64]
    format: "Float16_b"

  - name: "ex_sum"
    dims: [64, 64]
    format: "Float16_b"

  - name: "ex"
    dims: [64, 64]
    format: "Float16_b"

  - name: "xmm"
    dims: [64, 64]
    format: "Float16_b"

  - name: "xmm_masked"
    dims: [64, 64]
    format: "Float16_b"

  - name: "xmm2"
    dims: [64, 64]
    format: "Float16_b"

  - name: "ex2_sum"
    dims: [64, 64]
    format: "Float16_b"

  - name: "ex2"
    dims: [64, 64]
    format: "Float16_b"

  - name: "ex2pe"
    dims: [64, 64]
    format: "Float16_b"

  - name: "xmm_final"
    dims: [64, 64]
    format: "Float16_b"

  - name: "xmm_final_masked"
    dims: [64, 64]
    format: "Float16_b"

  - name: "normalized"
    dims: [64, 64]
    format: "Float16_b"

  - name: "reread_out"
    dims: [64, 64]
    format: "Float16_b"

  - name: "accum_out"
    dims: [64, 64]
    format: "Float16_b"

  - name: "gamma_out"
    dims: [64, 64]
    format: "Float16_b"

  - name: "out_tiled"
    dims: [64, 64]
    format: "Float16_b"

  - name: "output"
    dims: [64, 64]
    format: "Float16_b"

operations:
  - math:
      - type: "Fpu"
        block_size: [32, 64]
        in0: "x"
        operation: "Datacopy"
        unpacker: "UnpackerTilizeA"
        math_fidelity: "LoFi"
    pack:
      - output: "x_tiled"
        block_size: [32, 64]
        packer: "Packer"

  - math:
      - type: "Fpu"
        block_size: [32, 32]
        in0: "x_tiled"
        in1: "input_mask"
        operation: "Elwmul"
        unpacker: "UnpackerAB"
        broadcast_type: "ROW"
        math_fidelity: "HiFi4"
    pack:
      - output: "x_masked"
        block_size: [32, 32]
        packer: "Packer"

  - math:
      - type: "Fpu"
        block_size: [32, 64]
        in0: "x_masked"
        in1: "scaler"
        operation: "Reduce"
        reduce_dim: "REDUCE_SCALAR"
        reduce_pool: "SUM"
        unpacker: "ReduceUnpacker"
        math_fidelity: "HiFi4"
        loop:
          in0: [0, 2]
          in1: [0, 2]
          dest:
            multipliers: {tile_x: 0}
    pack:
      - output: "ex_sum"
        block_size: [32, 32]
        packer: "Packer"
        pack_l1_accumulation: 1
        loop:
          dest: [0]
          out: [0, 0]

  - math:
      - type: "Fpu"
        block_size: [32, 32]
        in0: "ex_sum"
        in1: "inv_num_datums"
        operation: "Elwmul"
        unpacker: "UnpackerAB"
        math_fidelity: "HiFi4"
        loop:
          in0: [0]
          in1: [0]
          dest: [0]
    pack:
      - output: "ex"
        block_size: [32, 32]
        packer: "Packer"
        loop:
          dest: [0]
          out: [0]

  - math:
      - type: "Fpu"
        block_size: [32, 32]
        in0: "x_tiled"
        in1: "ex"
        operation: "Elwsub"
        unpacker: "UnpackerAB"
        broadcast_type: "SCALAR"
        math_fidelity: "LoFi"
        loop:
          in0: [0, 1, 2, 3]
          in1: [0, 0, 0, 0]
          dest: [0]
    pack:
      - output: "xmm"
        block_size: [32, 32]
        packer: "Packer"
        loop:
          dest: [0]
          out: [0, 1, 2, 3]

  - math:
      - type: "Fpu"
        block_size: [32, 32]
        in0: "xmm"
        in1: "input_mask"
        operation: "Elwmul"
        unpacker: "UnpackerAB"
        broadcast_type: "ROW"
        math_fidelity: "HiFi4"
    pack:
      - output: "xmm_masked"
        block_size: [32, 32]
        packer: "Packer"

  - math:
      - type: "Fpu"
        block_size: [32, 32]
        in0: "xmm_masked"
        in1: "xmm_masked"
        operation: "Elwmul"
        unpacker: "UnpackerAB"
        math_fidelity: "HiFi4"
    pack:
      - output: "xmm2"
        block_size: [32, 32]
        packer: "Packer"

  - math:
      - type: "Fpu"
        block_size: [32, 64]
        in0: "xmm2"
        in1: "scaler"
        operation: "Reduce"
        reduce_dim: "REDUCE_SCALAR"
        reduce_pool: "SUM"
        unpacker: "ReduceUnpacker"
        math_fidelity: "HiFi4"
        loop:
          in0: [0, 2]
          in1: [0, 2]
          dest:
            multipliers: {tile_x: 0}
    pack:
      - output: "ex2_sum"
        block_size: [32, 32]
        packer: "Packer"
        pack_l1_accumulation: 1
        loop:
          dest: [0]
          out: [0, 0]

  - math:
      - type: "Fpu"
        block_size: [32, 32]
        in0: "ex2_sum"
        in1: "inv_num_datums"
        operation: "Elwmul"
        unpacker: "UnpackerAB"
        math_fidelity: "HiFi4"
        loop:
          in0: [0]
          in1: [0]
          dest: [0]
    pack:
      - output: "ex2"
        block_size: [32, 32]
        packer: "Packer"
        loop:
          dest: [0]
          out: [0]

  - math:
      - type: "Fpu"
        block_size: [32, 32]
        in0: "ex2"
        in1: "eps"
        operation: "Elwadd"
        unpacker: "UnpackerAB"
        math_fidelity: "LoFi"
        loop:
          in0: [0]
          in1: [0]
          dest: [0]
      - type: "UnarySfpu"
        block_size: [32, 32]
        operation: "Rsqrt"
        approximation_mode: true
        iterations: 32
        loop:
          dest: [0]
    pack:
      - output: "ex2pe"
        block_size: [32, 32]
        packer: "Packer"
        loop:
          dest: [0]
          out: [0]

  - math:
      - type: "Fpu"
        block_size: [32, 32]
        in0: "x_tiled"
        in1: "ex"
        operation: "Elwsub"
        unpacker: "UnpackerAB"
        broadcast_type: "SCALAR"
        math_fidelity: "LoFi"
        loop:
          in0: [0, 1, 2, 3]
          in1: [0, 0, 0, 0]
          dest: [0]
    pack:
      - output: "xmm_final"
        block_size: [32, 32]
        packer: "Packer"
        loop:
          dest: [0]
          out: [0, 1, 2, 3]

  - math:
      - type: "Fpu"
        block_size: [32, 32]
        in0: "xmm_final"
        in1: "input_mask"
        operation: "Elwmul"
        unpacker: "UnpackerAB"
        broadcast_type: "ROW"
        math_fidelity: "HiFi4"
    pack:
      - output: "xmm_final_masked"
        block_size: [32, 32]
        packer: "Packer"

  - math:
      - type: "Fpu"
        block_size: [32, 32]
        in0: "xmm_final_masked"
        in1: "ex2pe"
        operation: "Elwmul"
        unpacker: "UnpackerAB"
        broadcast_type: "SCALAR"
        math_fidelity: "HiFi4"
        loop:
          in0: [0, 1, 2, 3]
          in1: [0, 0, 0, 0]
          dest: [0]
    pack:
      - output: "normalized"
        block_size: [32, 32]
        packer: "Packer"
        loop:
          dest: [0]
          out: [0, 1, 2, 3]

  - math:
      - type: "Fpu"
        block_size: [32, 64]
        in0: "reread_rm"
        operation: "Datacopy"
        unpacker: "UnpackerTilizeA"
        math_fidelity: "LoFi"
    pack:
      - output: "reread_out"
        block_size: [32, 64]
        packer: "Packer"

  - math:
      - type: "Fpu"
        block_size: [32, 32]
        in0: "reread_out"
        in1: "normalized"
        operation: "Elwadd"
        unpacker: "UnpackerAB"
        math_fidelity: "LoFi"
    pack:
      - output: "accum_out"
        block_size: [32, 32]
        packer: "Packer"

  - math:
      - type: "Fpu"
        block_size: [32, 32]
        in0: "accum_out"
        in1: "gamma"
        operation: "Elwmul"
        unpacker: "UnpackerAB"
        broadcast_type: "ROW"
        math_fidelity: "HiFi4"
    pack:
      - output: "gamma_out"
        block_size: [32, 32]
        packer: "Packer"

  - math:
      - type: "Fpu"
        block_size: [32, 32]
        in0: "gamma_out"
        in1: "beta"
        operation: "Elwadd"
        unpacker: "UnpackerAB"
        broadcast_type: "ROW"
        math_fidelity: "LoFi"
    pack:
      - output: "out_tiled"
        block_size: [32, 32]
        packer: "Packer"

  - math:
      - type: "Fpu"
        block_size: [32, 64]
        in0: "out_tiled"
        operation: "Datacopy"
        unpacker: "UnpackerA"
        math_fidelity: "LoFi"
    pack:
      - output: "output"
        block_size: [32, 64]
        packer: "PackUntilize"

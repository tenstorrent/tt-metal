operands:
  - name: "input_A"
    dims: [256, 256]
    format: "Float16_b"
  - name: "input_B"
    dims: [256, 256]
    format: "Float16_b"
  - name: "output_A"
    dims: [256, 256]
    format: "Float16_b"

operations:
  - math:
      - type: "Fpu"
        src_a: "input_A"
        src_b: "input_B"
        operation: "UnaryBroadcast"
        unpacker: "UnaryBroadcastUnpacker"
        broadcast_type: "COL"
        math_fidelity: "LoFi"
    block_size: [64, 64]
    pack:
      - output: "output_A"
        packer: "Packer"

# log1p(x) = ln(1 + x) on its domain x > -1: just above -1 (where ln(1 + x) runs to -inf), both
# sides of 0 (where log1p keeps the relative accuracy ln(1 + x) loses), and the large-x tail up to
# 65000. Values at or below -1 stay out: the golden's NaN / -inf there is not a finite stimulus.
# Bfloat16 inputs; the Float32 ones are in sfpu_log1p_dest32_fp32.
#
# atol / rtol: 5e-7 relative (about 4 fp32 ulps) against a measured worst case of 1.2e-7 (1 ulp, the
# Blackhole budget for this path); atol 1e-7 is a floor for results near 0.
#
# Generated for the Quasar port of the Blackhole SFPI kernels, using only existing fuser features:
# dest_acc is fixed per file (hence the _dest16 / _dest32 pairs), every float input goes through
# the FPU datacopy path, and stimuli are finite intervals and points (no inf, NaN, -0 or INT_MIN).
# Special points sit outside the random ranges, so each is drawn about as often as a unit of range.

dest_acc: true

operands:
  - name: "input_A"
    dims: [32, 32]
    format: [Float16_b]
    stimuli:
      include:
        - [-0.99, -0.51]
        - [-0.49, -0.01]
        - [0.0101, 0.49]
        - [0.51, 7.99]
        - [8.01, 999.0]
        - -0.99609375
        - -0.5
        - 0.0
        - 0.0001
        - 0.5
        - 1.0
        - 1000.0
        - 65000.0
  - name: "sfpu_out"
    dims: [32, 32]
    format: Float32
    atol: 1.0e-7
    rtol: 5.0e-7

operations:
  - math:
      - {type: "Fpu", in0: "input_A", operation: "Datacopy", unpacker: "UnpackerA", math_fidelity: "LoFi", unpack_to_dest: false, block_size: [32, 32]}
      - type: "UnarySfpu"
        operation: [Log1p]
        approximation_mode: false
        iterations: 32
        block_size: [32, 32]
    pack:
      - {output: "sfpu_out", packer: "Packer", block_size: [32, 32]}

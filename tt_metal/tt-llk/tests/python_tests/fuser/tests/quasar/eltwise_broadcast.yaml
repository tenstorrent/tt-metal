# Single-stage Elwmul with COL broadcast to validate the broadcast path.

dest_acc: true

operands:
  - name: "input_A"
    tile_dims: all
    dims: [32, 32]
    format: "Float16_b"
  - name: "input_B"
    tile_dims: all
    dims: [32, 32]
    format: "Float16_b"
  - name: "output_A"
    tile_dims: all
    dims: [32, 32]
    format: "Float16_b"

operations:
  - math:
      - type: "Fpu"
        block_size: [32, 32]
        in0: "input_A"
        in1: "input_B"
        operation: "Elwmul"
        unpacker: "UnpackerAB"
        broadcast_type: "COL"
        math_fidelity: "HiFi2"
    pack:
      - output: "output_A"
        block_size: [32, 32]
        packer: "Packer"

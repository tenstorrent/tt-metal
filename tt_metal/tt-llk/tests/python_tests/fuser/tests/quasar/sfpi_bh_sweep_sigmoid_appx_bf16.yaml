# Each listed operation expands into an independent single-stage test.
# Only the final SFPU operation is swept; preparation and pack checks are fixed.

# SigmoidAppx: sfpi_bh_sigmoid_appx_bf16
# Approximation quality against independent torch.sigmoid on random data.
# Constant saturation/segment boundaries use the separate source-parity contract.

dest_acc: false
supported_archs: [quasar]

operands:
  - {dims: [32, 32], format: Float16_b, name: input}
  - {dims: [32, 32], format: Float16_b, name: output}

operations:
  - math:
      - {in0: input, operation: Datacopy, type: Fpu, unpack_to_dest: false, unpacker: UnpackerA}
      - type: UnarySfpu
        operation:
          - SigmoidAppx
        iterations: 32
    pack:
      - {output: output, packer: Packer}

# Int32 unary max/min against a scalar (UnaryMaxInt32 / UnaryMinInt32) on Quasar. The fuser cannot
# set the scalar, so the kernel runs with the dispatcher default 1000 (INT_MAXMIN_SCALAR,
# sfpu_operations_quasar.h). Points 0, 1, 998-1002 (ties and neighbours of the scalar), 2**16, 2**30
# and INT_MAX; ranges below and above the scalar, mid-range and next to INT_MAX.
# Int32 must be unpacked straight to Dest and needs a 32-bit Dest. The harness stores Int32 in L1 as
# sign-magnitude while the kernel's default Dest encoding is two's complement (tt-metal's Int32), so
# only non-negative inputs are checked; negative inputs and negative scalars, and the
# SIGN_MAGNITUDE_FORMAT path, are covered by test_unary_max_min_scalar_quasar.
#
# Uses only existing fuser features: stimuli are finite intervals and points (no INT_MIN). Special
# points sit outside the random ranges, so each is drawn about as often as a unit of range.

dest_acc: true

operands:
  - name: "input_A"
    dims: [32, 32]
    format: [Int32]
    stimuli:
      include:
        - [2.0, 40.0]
        - [900.0, 997.0]
        - [1003.0, 1100.0]
        - [123456000.0, 123456030.0]
        - [2147483600.0, 2147483646.0]
        - 0.0
        - 1.0
        - 998.0
        - 999.0
        - 1000.0
        - 1001.0
        - 1002.0
        - 65536.0
        - 1073741824.0
        - 2147483647.0
  - name: "sfpu_out"
    dims: [32, 32]
    format: Int32

operations:
  - math:
      - {type: "Fpu", in0: "input_A", operation: "Datacopy", unpacker: "UnpackerA", math_fidelity: "LoFi", unpack_to_dest: true, block_size: [32, 32]}
      - type: "UnarySfpu"
        operation: [UnaryMaxInt32, UnaryMinInt32]
        approximation_mode: false
        iterations: 32
        block_size: [32, 32]
    pack:
      - {output: "sfpu_out", packer: "Packer", block_size: [32, 32]}

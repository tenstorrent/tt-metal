# Convolution + bias + ReLU: a common conv-bias-relu building block.
# Matmul computes the convolution, elwadd adds per-channel bias with row
# broadcast, then SFPU Relu applies the activation function.

operands:
  - name: "activations"
    dims: [128, 256]
    format: "Float16_b"
  - name: "weights"
    dims: [256, 128]
    format: "Float16_b"
  - name: "bias"
    dims: [128, 128]
    format: "Float16_b"
  - name: "conv_result"
    dims: [128, 128]
    format: "Float16_b"
  - name: "output"
    dims: [128, 128]
    format: "Float16_b"

operations:
  - math:
      - type: "Fpu"
        src_a: "activations"
        src_b: "weights"
        operation: "Matmul"
        unpacker: "MatmulUnpacker"
        math_fidelity: "HiFi2"
    block_size: [64, 64]
    pack:
      - output: "conv_result"
        packer: "Packer"

  - math:
      - type: "Fpu"
        src_a: "conv_result"
        src_b: "bias"
        operation: "Elwadd"
        unpacker: "UnpackerAB"
        broadcast_type: "ROW"
        broadcast_tile: 0
        math_fidelity: "LoFi"
      - type: "UnarySfpu"
        operation: "Relu"
        iterations: 32
    block_size: [64, 64]
    pack:
      - output: "output"
        packer: "Packer"

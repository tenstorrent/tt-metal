# Bucket B2: sqrt and rsqrt on positive arguments from 1e-6 to 1e6.
#
# grad * f'(x) by the fused BF16 backward kernels (<op>_bw_tile): x in Dest tile 0, grad in tile 1,
# the result written over x (the kernels hard-code that layout), so the BinarySfpu runs in place
# with indexes {src0: 0, src1: 1, dest: 0}. The kernels evaluate a BF16 Dest only (dest16 file
# alone). Golden: torch autograd in float64 at TT-NN's fitted parameters, rounded to bf16.
#
# Generated for the Quasar port of the Blackhole SFPI kernels, using only existing fuser features:
# every float input goes through the FPU datacopy path, and stimuli are finite intervals and
# points (no inf, NaN, -0). Special points sit outside the random ranges.

dest_acc: false

operands:
  - name: "input_x"
    dims: [32, 32]
    format: [Float16_b]
    stimuli:
      include:
        - [1e-06, 0.001]
        - [0.001, 0.49]
        - [0.51, 0.99]
        - [1.01, 1.99]
        - [2.01, 1000.0]
        - [1000.0, 1000000.0]
        - 0.5
        - 1.0
        - 2.0
  - name: "input_grad"
    dims: [32, 32]
    format: [Float16_b]
    stimuli:
      include:
        - [-8.0, -1.01]
        - [-0.99, -0.01]
        - [0.01, 0.99]
        - [1.01, 8.0]
        - -1.0
        - 1.0
  - name: "sfpu_out"
    dims: [32, 32]
    format: Float16_b
    atol: 1.0e-6  # with rtol, about one bf16 ULP of an O(1) result; the Blackhole kernels pass here on ttsim
    rtol: 0.008

operations:
  - math:
      - {type: "Fpu", in0: "input_x", operation: "Datacopy", unpacker: "UnpackerA", math_fidelity: "LoFi", unpack_to_dest: false, block_size: [32, 32], indexes: {in0: 0, dest: 0}}
      - {type: "Fpu", in0: "input_grad", operation: "Datacopy", unpacker: "UnpackerA", math_fidelity: "LoFi", unpack_to_dest: false, block_size: [32, 32], indexes: {in0: 0, dest: 1}}
      - type: "BinarySfpu"
        operation: [SfpuSqrtBw, SfpuRsqrtBw]
        approximation_mode: false
        iterations: 32
        block_size: [32, 32]
        indexes: {src0: 0, src1: 1, dest: 0}
    pack:
      - {output: "sfpu_out", packer: "Packer", block_size: [32, 32], indexes: {dest: 0, out: 0}}

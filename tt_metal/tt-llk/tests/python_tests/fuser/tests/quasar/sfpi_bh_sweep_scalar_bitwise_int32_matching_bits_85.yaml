# Each listed operation expands into an independent single-stage test.
# Only the final SFPU operation is swept; preparation and pack checks are fixed.

# ScalarBitwiseAnd: sfpi_bh_extra_scalar_bitwise_and_matching_bits_int32
# Exact ScalarBitwiseAnd(x, 0x55), including signed sign-magnitude Dest conversion.

# ScalarBitwiseOr: sfpi_bh_extra_scalar_bitwise_or_matching_bits_int32
# Exact ScalarBitwiseOr(x, 0x55), including signed sign-magnitude Dest conversion.

# ScalarBitwiseXor: sfpi_bh_extra_scalar_bitwise_xor_matching_bits_int32
# Exact ScalarBitwiseXor(x, 0x55), including signed sign-magnitude Dest conversion.

dest_acc: true
supported_archs: [quasar]

operands:
  - {const_value: 85, dims: [32, 32], format: Int32, name: input}
  - {dims: [32, 32], format: Int32, name: output}

operations:
  - math:
      - {in0: input, operation: Datacopy, type: Fpu, unpack_to_dest: true, unpacker: UnpackerA}
      - type: UnarySfpu
        operation:
          - ScalarBitwiseAnd
          - ScalarBitwiseOr
          - ScalarBitwiseXor
        iterations: 32
    pack:
      - {output: output, packer: Packer}

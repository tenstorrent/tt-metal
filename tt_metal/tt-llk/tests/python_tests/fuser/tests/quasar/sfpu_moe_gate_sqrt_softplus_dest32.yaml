# DeepSeek-V4 MoE gate: key = sqrt(softplus(x)) + bias, x at Dest tile 0 and the bias at tile 1. The
# kernel writes the score over x and the key over the bias tile, so the SFPU dest index is the bias
# tile and the key is what gets packed. x spans the far negative tail (softplus ~ exp(x)), both sides
# of 0 and past the softplus threshold 20; the bias spans both signs. fp32 Dest only: the kernel has
# no bf16 rounding step.
# Bfloat16 inputs; the Float32 ones are in sfpu_moe_gate_sqrt_softplus_dest32_fp32.
#
# atol / rtol: the score is softplus to ~5e-6 relative and a 23-bit sqrt, and the bias add can cancel
# it, so the bound is mostly absolute: the measured worst case is 1.5e-6 absolute (1.7e-5 relative
# where the key is near 0), against atol 3e-6 + rtol 4e-6. Without the last sqrt refinement the
# error reaches 1.1e-4, without the top log1p term 8.8e-3.
#
# Generated for the Quasar port of the Blackhole SFPI kernels, using only existing fuser features:
# dest_acc is fixed per file (hence the _dest16 / _dest32 pairs), every float input goes through
# the FPU datacopy path, and stimuli are finite intervals and points (no inf, NaN, -0 or INT_MIN).
# Special points sit outside the random ranges, so each is drawn about as often as a unit of range.

dest_acc: true

operands:
  - name: "x"
    dims: [32, 32]
    format: [Float16_b]
    stimuli:
      include:
        - [-30.0, -10.01]
        - [-9.99, -3.01]
        - [-2.99, -0.01]
        - [0.01, 2.99]
        - [3.01, 19.99]
        - [20.01, 40.0]
        - -60.0
        - -10.0
        - -1.0
        - 0.0
        - 1.0
        - 20.0
        - 100.0
  - name: "bias"
    dims: [32, 32]
    format: [Float16_b]
    stimuli:
      include:
        - [-2.0, -0.01]
        - [0.01, 2.0]
        - -1.0
        - 0.0
        - 1.0
  - name: "sfpu_out"
    dims: [32, 32]
    format: Float32
    atol: 3.0e-6
    rtol: 4.0e-6

operations:
  - math:
      - {type: "Fpu", in0: "x", operation: "Datacopy", unpacker: "UnpackerA", math_fidelity: "LoFi", unpack_to_dest: false, block_size: [32, 32], indexes: {in0: 0, dest: 0}}
      - {type: "Fpu", in0: "bias", operation: "Datacopy", unpacker: "UnpackerA", math_fidelity: "LoFi", unpack_to_dest: false, block_size: [32, 32], indexes: {in0: 0, dest: 1}}
      - type: "BinarySfpu"
        operation: [SfpuMoeGateSqrtSoftplusAddBias]
        approximation_mode: false
        iterations: 32
        block_size: [32, 32]
        indexes: {src0: 0, src1: 1, dest: 1}
    pack:
      - {output: "sfpu_out", packer: "Packer", block_size: [32, 32], indexes: {dest: 1, out: 0}}

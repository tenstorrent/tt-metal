# Each listed operation expands into an independent single-stage test.
# Only the final SFPU operation is swept; preparation and pack checks are fixed.

# SfpuSituGlu: sfpi_bh_extra_situ_glu_random_bf16
# SiTU-GLU ConfigKimi: beta_gate=4, beta_up=25; preserve both input tiles.

dest_acc: false
supported_archs: [quasar]

operands:
  - {dims: [32, 96], format: Float16_b, name: input}
  - {dims: [32, 96], format: Float16_b, name: output}

operations:
  - block_size: [32, 96]
    math:
      - {in0: input, operation: Datacopy, type: Fpu, unpack_to_dest: false, unpacker: UnpackerA}
      - type: BinarySfpu
        operation:
          - SfpuSituGlu
        dst_dest_tile_index: 2
        iterations: 32
        src1_dest_tile_index: 0
        src2_dest_tile_index: 1
    pack:
      - {output: output, packer: Packer}

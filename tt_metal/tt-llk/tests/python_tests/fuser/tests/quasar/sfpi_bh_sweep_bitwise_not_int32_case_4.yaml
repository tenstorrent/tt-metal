# Each listed operation expands into an independent single-stage test.
# Only the final SFPU operation is swept; preparation and pack checks are fixed.

# BitwiseNot: sfpi_bh_bitwise_not_int32_case_4
# Blackhole SFPI parity: BitwiseNot; full tile, constant input = 256.
# Single-stage direct-to-Dest case; keep integer payloads bit-exact.

dest_acc: true
supported_archs: [quasar]

operands:
  - {const_value: 256, dims: [32, 32], format: Int32, name: input}
  - {dims: [32, 32], format: Int32, name: output}

operations:
  - math:
      - {in0: input, operation: Datacopy, type: Fpu, unpack_to_dest: true, unpacker: UnpackerA}
      - type: UnarySfpu
        operation:
          - BitwiseNot
        iterations: 32
    pack:
      - {output: output, packer: Packer}

operands:
  - name: "input_A"
    dims: [256, 256]
    tile_dims: [32, 16]
    format: "Float16_b"
  - name: "input_B"
    dims: [256, 256]
    tile_dims: [16, 32]
    format: "Float16_b"
  - name: "matmul_out"
    dims: [256, 256]
    tile_dims: [32, 32]
    format: "Float16_b"

operations:
  - math:
      - type: "Fpu"
        block_size: [64, 128]
        in0: "input_A"
        in1: "input_B"
        operation: "Matmul"
        unpacker: "MatmulUnpacker"
        math_fidelity: "HiFi2"
    pack:
      - output: "matmul_out"
        block_size: [64, 128]
        packer: "Packer"

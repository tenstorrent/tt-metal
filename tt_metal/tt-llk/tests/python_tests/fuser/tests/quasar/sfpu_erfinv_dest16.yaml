# erfinv on (-1, 1) with 0, +-0.5, +-0.9, +-0.99 and the endpoints +-1 (+-inf). +-1.5 (NaN) is
# only in the dest32 file: a 16-bit Dest re-encodes the NaN in a way the golden cannot model.
#
# Generated for the Quasar port of the Blackhole SFPI kernels, using only existing fuser features:
# dest_acc is fixed per file (hence the _dest16 / _dest32 pairs), every float input goes through
# the FPU datacopy path, and stimuli are finite intervals and points (no inf, NaN, -0 or INT_MIN).
# Special points sit outside the random ranges, so each is drawn about as often as a unit of range.

dest_acc: false

operands:
  - name: "input_A"
    dims: [32, 32]
    format: [Float16_b, Float16]
    stimuli:
      include:
        - [-0.998, -0.992]
        - [-0.988, -0.902]
        - [-0.898, -0.502]
        - [-0.498, -0.002]
        - [0.0021, 0.498]
        - [0.502, 0.898]
        - [0.902, 0.988]
        - [0.992, 0.998]
        - -1.0
        - -0.99
        - -0.9
        - -0.5
        - 0.0
        - 1.0e-40
        - 0.0001
        - 0.5
        - 0.9
        - 0.99
        - 1.0
  - name: "sfpu_out"
    dims: [32, 32]
    format: Float16_b

operations:
  - math:
      - {type: "Fpu", in0: "input_A", operation: "Datacopy", unpacker: "UnpackerA", math_fidelity: "LoFi", unpack_to_dest: false, block_size: [32, 32]}
      - type: "UnarySfpu"
        operation: [Erfinv]
        approximation_mode: false
        iterations: 32
        block_size: [32, 32]
    pack:
      - {output: "sfpu_out", packer: "Packer", block_size: [32, 32]}

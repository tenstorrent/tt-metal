# Matmul with the MatmulPacker.
# A 2x2-tile block tiles each output tile grid exactly, so the
# MOP's L1 row stride (block_tiles_x * num_subblocks_c_dim = tile_count_x)
# matches the dense row-major L1 layout the fuser golden expects.

operands:
  - name: "input_A"
    tile_dims: all
    dims: [256, 256]
    format: "Float16_b"
  - name: "input_B"
    tile_dims: all
    dims: [256, 256]
    format: "Float16_b"
  - name: "matmul_out"
    tile_dims: all
    dims: [256, 256]
    format: "Float16_b"

operations:
  - math:
      - type: "Fpu"
        block_tiles: [2, 2]
        in0: "input_A"
        in1: "input_B"
        operation: "Matmul"
        unpacker: "MatmulUnpacker"
        math_fidelity: "HiFi2"
    pack:
      - output: "matmul_out"
        block_tiles: [2, 2]
        packer: "MatmulPacker"

# lgamma_stirling_float (compute API lgamma_stirling_float_tile): tile 0 = x, tile 1 = log(x),
# made on device by Log on a copy of x (the API contract wants log(z) with z = x for x >= 0.5),
# output lgamma(x). fp32-only kernel, so 32-bit Dest only; x >= 0.5 keeps the reflection branch out.
#
# Generated for the Quasar port of the Blackhole SFPI kernels, using only existing fuser features:
# dest_acc is fixed per file (hence the _dest16 / _dest32 pairs), every float input goes through
# the FPU datacopy path, and stimuli are finite intervals and points (no inf, NaN, -0 or INT_MIN).
# Special points sit outside the random ranges, so each is drawn about as often as a unit of range.

dest_acc: true

operands:
  - name: "input_A"
    dims: [32, 32]
    format: [Float16_b, Float16, Float32]
    stimuli:
      include:
        - [0.5, 0.99]
        - [1.01, 1.49]
        - [1.51, 1.99]
        - [2.01, 2.99]
        - [3.01, 9.99]
        - [10.01, 20.0]
        - 1.0
        - 1.5
        - 2.0
        - 3.0
        - 10.0
  - name: "sfpu_out"
    dims: [32, 32]
    format: Float32

operations:
  - math:
      - {type: "Fpu", in0: "input_A", operation: "Datacopy", unpacker: "UnpackerA", math_fidelity: "LoFi", unpack_to_dest: false, block_size: [32, 32], indexes: {in0: 0, dest: 0}}
      - {type: "Fpu", in0: "input_A", operation: "Datacopy", unpacker: "UnpackerA", math_fidelity: "LoFi", unpack_to_dest: false, block_size: [32, 32], indexes: {in0: 0, dest: 1}}
      - type: "UnarySfpu"
        operation: [Log]
        approximation_mode: false
        iterations: 32
        block_size: [32, 32]
        indexes: {dest: 1}
      - type: "BinarySfpu"
        operation: [SfpuLgammaStirlingFp32]
        approximation_mode: false
        iterations: 32
        block_size: [32, 32]
        indexes: {src0: 0, src1: 1, dest: 2}
    pack:
      - {output: "sfpu_out", packer: "Packer", block_size: [32, 32], indexes: {dest: 2, out: 0}}

# Binary fmod(a, b) and remainder(a, b): both signs of dividend and divisor, exact multiples,
# large dividends; the divisor is never 0.
#
# Generated for the Quasar port of the Blackhole SFPI kernels, using only existing fuser features:
# dest_acc is fixed per file (hence the _dest16 / _dest32 pairs), every float input goes through
# the FPU datacopy path, and stimuli are finite intervals and points (no inf, NaN, -0 or INT_MIN).
# Special points sit outside the random ranges, so each is drawn about as often as a unit of range.

dest_acc: false

operands:
  - name: "input_A"
    dims: [32, 32]
    format: [Float16]
    stimuli:
      include:
        - [-10.0, -5.01]
        - [-4.99, -2.01]
        - [-1.99, -1.01]
        - [-0.99, -0.01]
        - [0.0101, 0.99]
        - [1.01, 1.99]
        - [2.01, 4.99]
        - [5.01, 7.49]
        - [7.51, 10.0]
        - -5.0
        - -2.0
        - -1.0
        - 0.0
        - 0.0001
        - 1.0
        - 2.0
        - 5.0
        - 7.5
        - 100.0
        - 64992.0
  - name: "input_B"
    dims: [32, 32]
    format: [Float16]
    stimuli:
      include:
        - [-5.0, -2.01]
        - [-1.99, -1.01]
        - [-0.99, -0.25]
        - [0.25, 0.49]
        - [0.51, 0.99]
        - [1.01, 1.99]
        - [2.01, 2.99]
        - [3.01, 5.0]
        - -2.0
        - -1.0
        - 0.5
        - 1.0
        - 2.0
        - 3.0
  - name: "sfpu_out"
    dims: [32, 32]
    format: Float16_b

operations:
  - math:
      - {type: "Fpu", in0: "input_A", operation: "Datacopy", unpacker: "UnpackerA", math_fidelity: "LoFi", unpack_to_dest: false, block_size: [32, 32], indexes: {in0: 0, dest: 0}}
      - {type: "Fpu", in0: "input_B", operation: "Datacopy", unpacker: "UnpackerA", math_fidelity: "LoFi", unpack_to_dest: false, block_size: [32, 32], indexes: {in0: 0, dest: 1}}
      - type: "BinarySfpu"
        operation: [SfpuBinaryFmod, SfpuBinaryRemainder]
        approximation_mode: false
        iterations: 32
        block_size: [32, 32]
        indexes: {src0: 0, src1: 1, dest: 2}
    pack:
      - {output: "sfpu_out", packer: "Packer", block_size: [32, 32], indexes: {dest: 2, out: 0}}

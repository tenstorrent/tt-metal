# The ops defined on (-1, 1): [-0.99, 0.99] plus 0, +-0.5, +-0.99, a small normal (1e-4) and a
# denormal (1e-40).
#
# Trigonometry SFPU kernels on Quasar, using only existing fuser features: dest_acc is fixed per file
# (hence the _dest16 / _dest32 pairs), every float input goes through the FPU datacopy path, and
# stimuli are finite intervals and points. Special points sit outside the random ranges.

dest_acc: false

operands:
  - name: "input_A"
    dims: [32, 32]
    format: [Float16_b, Float16]
    stimuli:
      include:
        - [-0.99, -0.51]
        - [-0.49, -0.01]
        - [0.0101, 0.49]
        - [0.51, 0.99]
        - -0.99
        - -0.5
        - 0.0
        - 1.0e-40
        - 0.0001
        - 0.5
        - 0.99
  - name: "sfpu_out"
    dims: [32, 32]
    format: Float16_b

operations:
  - math:
      - {type: "Fpu", in0: "input_A", operation: "Datacopy", unpacker: "UnpackerA", math_fidelity: "LoFi", unpack_to_dest: false, block_size: [32, 32]}
      - type: "UnarySfpu"
        operation: [Asin, Acos, Atanh]
        approximation_mode: false
        iterations: 32
        block_size: [32, 32]
    pack:
      - {output: "sfpu_out", packer: "Packer", block_size: [32, 32]}

# Exact BH three-segment approximation contract, including saturation and boundaries.
# Separate random quality test retains the independent torch.sigmoid reference.
supported_archs: [quasar]
dest_acc: true
operands:
  - {name: input_0, dims: [32, 32], format: Float32, const_value: -4}
  - {name: output_0, dims: [32, 32], format: Float32}
  - {name: input_1, dims: [32, 32], format: Float32, const_value: -2.015625}

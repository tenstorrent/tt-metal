# Column reduce that reads in0 through the strided tilize unpack

operands:
  - name: "input_A"
    dims: [256, 256]
    format: "Float16_b"
  - name: "input_B"
    dims: [256, 256]
    format: "Float16_b"
    const_value: 1.0
  - name: "reduce_col_tilize_out"
    dims: [256, 256]
    format: "Float16_b"

operations:
  - math:
      - type: "Fpu"
        in0: "input_A"
        in1: "input_B"
        operation: "Reduce"
        reduce_dim: "REDUCE_COL"
        reduce_pool: "SUM"
        unpacker: "UnpackReduceTilize"
        math_fidelity: "HiFi2"
    block_size: [64, 128]
    pack:
      - output: "reduce_col_tilize_out"
        packer: "Packer"

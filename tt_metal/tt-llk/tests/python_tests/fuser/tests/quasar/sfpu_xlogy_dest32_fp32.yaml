# xlogy(x, y) = x * ln(y) with Float32 inputs: x of both signs; y positive, zero (x * -inf) and negative
# (NaN). Points sit outside the random ranges, so each is drawn about as often as a unit of range.
#
# atol / rtol: as sfpu_xlogy_dest32 (measured worst case 1.5e-7 relative, the log op's body plus the
# product's rounding).
#
# Generated for the Quasar port of the Blackhole SFPI kernels, using only existing fuser features.
# Float32 inputs are unpacked straight to Dest: the FPU datacopy path would cut them to tf32 (10
# mantissa bits), an error the golden does not model. Bfloat16 inputs (which the unpacker cannot
# widen into a 32-bit Dest) are in sfpu_xlogy_dest32. Stimuli are finite intervals and points (no
# inf, NaN, -0 or INT_MIN).

dest_acc: true

operands:
  - name: "input_A"
    dims: [32, 32]
    format: [Float32]
    stimuli:
      include:
        - [-4.0, -1.01]
        - [-0.99, -0.01]
        - [0.01, 0.99]
        - [1.01, 4.0]
        - -2.0
        - -1.0
        - 0.5
        - 1.0
        - 2.0
  - name: "input_B"
    dims: [32, 32]
    format: [Float32]
    stimuli:
      include:
        - [-3.0, -0.01]
        - [0.001, 0.49]
        - [0.51, 0.99]
        - [1.01, 1.99]
        - [2.01, 100.0]
        - 0.0
        - 0.5
        - 1.0
        - 2.0
        - 1000.0
  - name: "sfpu_out"
    dims: [32, 32]
    format: Float32
    atol: 1.0e-6
    rtol: 3.0e-7

operations:
  - math:
      - {type: "Fpu", in0: "input_A", operation: "Datacopy", unpacker: "UnpackerA", math_fidelity: "LoFi", unpack_to_dest: true, block_size: [32, 32], indexes: {in0: 0, dest: 0}}
      - {type: "Fpu", in0: "input_B", operation: "Datacopy", unpacker: "UnpackerA", math_fidelity: "LoFi", unpack_to_dest: true, block_size: [32, 32], indexes: {in0: 0, dest: 1}}
      - type: "BinarySfpu"
        operation: [SfpuXlogy]
        approximation_mode: false
        iterations: 32
        block_size: [32, 32]
        indexes: {src0: 0, src1: 1, dest: 2}
    pack:
      - {output: "sfpu_out", packer: "Packer", block_size: [32, 32], indexes: {dest: 2, out: 0}}

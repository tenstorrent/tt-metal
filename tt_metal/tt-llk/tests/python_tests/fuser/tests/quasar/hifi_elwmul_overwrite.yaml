# Quasar copy of ../hifi_elwmul_overwrite.yaml, still on Float16: Quasar allows HiFi4 only when
# SrcA and SrcB are both wide (Float16, Tf32 or Float32), so the Wormhole copy's Float16_b cannot
# run here.
# Temporary: remove with #60920.
supported_archs: [quasar]

operands:
  - {name: seed, dims: [32, 32], format: Float16}
  - {name: a, dims: [32, 32], format: Float16}
  - {name: b, dims: [32, 32], format: Float16}
  - {name: out, dims: [32, 32], format: Float16}

operations:
  - dest_sync: SyncFull
    math:
      - type: Fpu
        operation: Datacopy
        unpacker: UnpackerA
        in0: seed
      - type: Fpu
        operation: Elwmul
        unpacker: UnpackerAB
        in0: a
        in1: b
        math_fidelity: HiFi4
        acc_to_dest: false
    pack:
      - output: out
        packer: Packer

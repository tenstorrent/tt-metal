# Blackhole SFPI parity: UnaryEq. Each case covers all four faces of one tile.
# Dispatch parameters: 0x3f000000u.
supported_archs: [quasar]
dest_acc: false

operands:
  - {name: random_input, dims: [32, 32], format: Float16_b}
  - {name: random_output, dims: [32, 32], format: Float16_b}
  - {name: case_0_input, dims: [32, 32], format: Float16_b, const_value: -1}
  - {name: case_0_output, dims: [32, 32], format: Float16_b}
  - {name: case_1_input, dims: [32, 32], format: Float16_b, const_value: 0.5}
  - {name: case_1_output, dims: [32, 32], format: Float16_b}
  - {name: case_2_input, dims: [32, 32], format: Float16_b, const_value: 2}
  - {name: case_2_output, dims: [32, 32], format: Float16_b}

operations:
  - math:
      - type: Fpu
        operation: Datacopy
        in0: random_input
        unpacker: UnpackerA
        unpack_to_dest: false
      - {type: UnarySfpu, operation: UnaryEq, iterations: 32}
    pack:
      - {output: random_output, packer: Packer}
  - math:
      - type: Fpu
        operation: Datacopy
        in0: case_0_input
        unpacker: UnpackerA
        unpack_to_dest: false
      - {type: UnarySfpu, operation: UnaryEq, iterations: 32}
    pack:
      - {output: case_0_output, packer: Packer}
  - math:
      - type: Fpu
        operation: Datacopy
        in0: case_1_input
        unpacker: UnpackerA
        unpack_to_dest: false
      - {type: UnarySfpu, operation: UnaryEq, iterations: 32}
    pack:
      - {output: case_1_output, packer: Packer}
  - math:
      - type: Fpu
        operation: Datacopy
        in0: case_2_input
        unpacker: UnpackerA
        unpack_to_dest: false
      - {type: UnarySfpu, operation: UnaryEq, iterations: 32}
    pack:
      - {output: case_2_output, packer: Packer}

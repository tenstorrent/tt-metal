# logsigmoid(x) on [-30, 30], from the Blackhole SFPI port, as a unary op on Dest 0.
# Stimuli are finite intervals and points (no inf, NaN or -0), as in the other Quasar files.

dest_acc: true

operands:
  - name: "input_A"
    dims: [32, 32]
    format: [Float16_b, Float32]
    stimuli:
      include:
        - [-8.0, -5.01]
        - [-4.99, -2.01]
        - [-1.99, -1.01]
        - [-0.99, -0.51]
        - [-0.49, -0.01]
        - [0.0101, 0.49]
        - [0.51, 0.99]
        - [1.01, 1.99]
        - [2.01, 4.99]
        - [5.01, 8.0]
        - -30.0
        - -20.0
        - -5.0
        - -2.0
        - -1.0
        - -0.5
        - 0.0
        - 1.0e-40
        - 0.0001
        - 0.5
        - 1.0
        - 2.0
        - 5.0
        - 20.0
        - 30.0
  - name: "sfpu_out"
    dims: [32, 32]
    format: Float32

operations:
  - math:
      - {type: "Fpu", in0: "input_A", operation: "Datacopy", unpacker: "UnpackerA", math_fidelity: "LoFi", unpack_to_dest: false, block_size: [32, 32], indexes: {in0: 0, dest: 0}}
      - type: "UnarySfpu"
        operation: [Logsigmoid]
        approximation_mode: false
        iterations: 32
        block_size: [32, 32]
        indexes: {dest: 0}
    pack:
      - {output: "sfpu_out", packer: "Packer", block_size: [32, 32], indexes: {dest: 0, out: 0}}

# geglu_tanh(gate, up) = gelu_tanh(gate) * up, gate at Dest tile 0 and up at tile 1: the gate on
# [-12, 12] (both saturated tails of the tanh) plus 0, +-0.5, +-1, +-3 and +-20, the up operand on
# both signs.
#
# atol / rtol: as sfpu_geglu_tanh_dest32 (measured worst case 1.0e-4 relative).
#
# Generated for the Quasar port of the Blackhole SFPI kernels, using only existing fuser features.
# Float32 inputs are unpacked straight to Dest: the FPU datacopy path would cut them to tf32 (10
# mantissa bits), an error the golden does not model and that would set the tolerance floor near
# 1e-3 relative. Bfloat16 inputs (which the unpacker cannot widen into a 32-bit Dest) are in the
# _dest32 file. Stimuli are finite intervals and points (no inf, NaN, -0 or INT_MIN); special points
# sit outside the random ranges, so each is drawn about as often as a unit of range.

dest_acc: true

operands:
  - name: "gate"
    dims: [32, 32]
    format: [Float32]
    stimuli:
      include:
        - [-12.0, -3.01]
        - [-2.99, -1.01]
        - [-0.99, -0.01]
        - [0.01, 0.99]
        - [1.01, 2.99]
        - [3.01, 12.0]
        - -20.0
        - -3.0
        - -1.0
        - -0.5
        - 0.0
        - 0.5
        - 1.0
        - 3.0
        - 20.0
  - name: "up"
    dims: [32, 32]
    format: [Float32]
    stimuli:
      include:
        - [-8.0, -1.01]
        - [-0.99, -0.01]
        - [0.01, 0.99]
        - [1.01, 8.0]
        - -1.0
        - 0.0
        - 1.0
  - name: "sfpu_out"
    dims: [32, 32]
    format: Float32
    atol: 1.0e-6
    rtol: 2.0e-4

operations:
  - math:
      - {type: "Fpu", in0: "gate", operation: "Datacopy", unpacker: "UnpackerA", math_fidelity: "LoFi", unpack_to_dest: true, block_size: [32, 32], indexes: {in0: 0, dest: 0}}
      - {type: "Fpu", in0: "up", operation: "Datacopy", unpacker: "UnpackerA", math_fidelity: "LoFi", unpack_to_dest: true, block_size: [32, 32], indexes: {in0: 0, dest: 1}}
      - type: "BinarySfpu"
        operation: [SfpuGegluTanh]
        approximation_mode: false
        iterations: 32
        block_size: [32, 32]
        indexes: {src0: 0, src1: 1, dest: 2}
    pack:
      - {output: "sfpu_out", packer: "Packer", block_size: [32, 32], indexes: {dest: 2, out: 0}}

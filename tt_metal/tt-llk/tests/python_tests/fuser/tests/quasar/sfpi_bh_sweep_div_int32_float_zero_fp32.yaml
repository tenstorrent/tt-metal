# Each listed operation expands into an independent single-stage test.
# Only the final SFPU operation is swept; preparation and pack checks are fixed.

# ParityDivInt32Float: sfpi_bh_div_int32_float_zero_fp32
# Real integer-input/float-output division through numeric Float32 test transport.
# a_int=round_even(16*a)-8; b_int=sign(b)*(round_even(abs(16*b))+1).
# Preserve input tiles0/1 and store the FP32 quotient in tile2; no raw-bit transport.

dest_acc: true
supported_archs: [quasar]

operands:
  - {const_value: 0, dims: [32, 96], format: Float32, name: input}
  - {dims: [32, 96], format: Float32, name: output}

operations:
  - block_size: [32, 96]
    math:
      - {in0: input, operation: Datacopy, type: Fpu, unpack_to_dest: true, unpacker: UnpackerA}
      - type: UnarySfpu
        operation:
          - ParityDivInt32Float
        iterations: 32
    pack:
      - {output: output, packer: Packer}

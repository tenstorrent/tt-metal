# cumprod_tile (column-wise running product inside each 32x32 tile), carry seeded 1.0 per tile (first = true, the only
# value the fuser passes); two stacked tiles check the restart. Stimuli sit near +-1 so 32-deep products stay finite
# and clear of denormals, both signs so the sign chain is checked too.

dest_acc: true

operands:
  - name: "input_A"
    dims: [64, 32]
    format: [Float16_b]
    stimuli:
      include:
        - [-1.1, -0.9]
        - [0.9, 1.1]
        - -1.0
        - 0.5
        - 1.0
        - 2.0
  - name: "sfpu_out"
    dims: [64, 32]
    format: Float32
    atol: 1.0e-6
    rtol: 1.0e-4  # 32 chained fp32 products, one rounding each

operations:
  - math:
      - {type: "Fpu", in0: "input_A", operation: "Datacopy", unpacker: "UnpackerA", math_fidelity: "LoFi", unpack_to_dest: false, block_size: [64, 32]}
      - type: "UnarySfpu"
        operation: [Cumprod]
        approximation_mode: false
        iterations: 32
        block_size: [64, 32]
    pack:
      - {output: "sfpu_out", packer: "Packer", block_size: [64, 32]}

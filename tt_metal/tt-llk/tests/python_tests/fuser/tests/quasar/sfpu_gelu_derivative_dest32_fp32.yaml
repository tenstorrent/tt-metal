# gelu'(x) = Phi(x) + x phi(x) on [-14, 8]: the polynomial / tail region boundaries of the
# derivative kernel (+-3, 3.1719, -13.375), 0, +-0.5, +-1, a small normal (1e-4), and the saturated
# tails at +-20.
#
# atol / rtol: as sfpu_gelu_derivative_dest32 (measured worst case 7.1e-3 relative, the saturation
# to 1 just above x = 3.1719).
#
# Generated for the Quasar port of the Blackhole SFPI kernels, using only existing fuser features.
# Float32 inputs are unpacked straight to Dest: the FPU datacopy path would cut them to tf32 (10
# mantissa bits), an error the golden does not model and that would set the tolerance floor near
# 1e-3 relative. Bfloat16 inputs (which the unpacker cannot widen into a 32-bit Dest) are in the
# _dest32 file. Stimuli are finite intervals and points (no inf, NaN, -0 or INT_MIN); special points
# sit outside the random ranges, so each is drawn about as often as a unit of range.

dest_acc: true

operands:
  - name: "input_A"
    dims: [32, 32]
    format: [Float32]
    stimuli:
      include:
        - [-14.0, -13.39]
        - [-13.36, -5.01]
        - [-4.99, -3.01]
        - [-2.99, -1.01]
        - [-0.99, -0.01]
        - [0.0101, 0.99]
        - [1.01, 2.99]
        - [3.01, 3.16]
        - [3.18, 8.0]
        - -20.0
        - -13.375
        - -5.0
        - -3.0
        - -1.0
        - -0.5
        - 0.0
        - 0.0001
        - 0.5
        - 1.0
        - 3.0
        - 3.171875
        - 20.0
  - name: "sfpu_out"
    dims: [32, 32]
    format: Float32
    atol: 1.0e-12
    rtol: 0.01

operations:
  - math:
      - {type: "Fpu", in0: "input_A", operation: "Datacopy", unpacker: "UnpackerA", math_fidelity: "LoFi", unpack_to_dest: true, block_size: [32, 32]}
      - type: "UnarySfpu"
        operation: [GeluDerivative]
        approximation_mode: false
        iterations: 32
        block_size: [32, 32]
    pack:
      - {output: "sfpu_out", packer: "Packer", block_size: [32, 32]}

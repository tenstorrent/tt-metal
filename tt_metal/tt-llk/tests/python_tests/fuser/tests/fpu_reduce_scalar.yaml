# Scalar reduce that sums all elements in each tile down to one value.

operands:
  - name: "input_A"
    tile_dims: all
    dims: [256, 256]
    format: "Float16_b"
  - name: "input_B"
    tile_dims: all
    dims: [256, 256]
    format: "Float16_b"
    stimuli: 1.0
  - name: "reduce_scalar_out"
    tile_dims: all
    dims: [256, 256]
    format: "Float16_b"

operations:
  - math:
      - type: "Fpu"
        block_tiles: [2, 4]
        in0: "input_A"
        in1: "input_B"
        operation: "Reduce"
        reduce_dim: "REDUCE_SCALAR"
        reduce_pool: "SUM"
        unpacker: "ReduceUnpacker"
        math_fidelity: "HiFi2"
    pack:
      - output: "reduce_scalar_out"
        block_tiles: [2, 4]
        packer: "Packer"

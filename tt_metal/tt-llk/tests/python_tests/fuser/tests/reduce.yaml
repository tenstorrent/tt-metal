# Column reduce with max pooling.

dest_acc: true

operands:
  - name: "input_A"
    tile_dims: all
    dims: [32, 32]
    format: "Float32"
  - name: "input_B"
    tile_dims: all
    dims: [32, 32]
    format: "Float32"
    stimuli: 1.0
  - name: "reduced_output"
    tile_dims: all
    dims: [32, 32]
    format: "Float32"

operations:
  - math:
      - type: "Fpu"
        block_tiles: [2, 2]
        in0: "input_A"
        in1: "input_B"
        operation: "Reduce"
        reduce_dim: "REDUCE_ROW"
        reduce_pool: "SUM"
        unpacker: "ReduceUnpacker"
        math_fidelity: "HiFi4"
    pack:
      - output: "reduced_output"
        block_tiles: [2, 2]
        packer: "Packer"

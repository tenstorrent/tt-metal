# Convolution + batch norm (inference mode): conv matmul, then channel-wise
# scale (elwmul broadcast) and shift (elwadd broadcast) that fold BN params.

operands:
  - name: "activations"
    dims: [128, 256]
    format: "Float16_b"
  - name: "weights"
    dims: [256, 128]
    format: "Float16_b"
  - name: "bn_scale"
    dims: [128, 128]
    format: "Float16_b"
  - name: "bn_shift"
    dims: [128, 128]
    format: "Float16_b"
  - name: "conv_result"
    dims: [128, 128]
    format: "Float16_b"
  - name: "scaled"
    dims: [128, 128]
    format: "Float16_b"
  - name: "output"
    dims: [128, 128]
    format: "Float16_b"

operations:
  - math:
      - type: "Fpu"
        block_size: [64, 64]
        in0: "activations"
        in1: "weights"
        operation: "Matmul"
        unpacker: "MatmulUnpacker"
        math_fidelity: "HiFi2"
    pack:
      - output: "conv_result"
        block_size: [64, 64]
        packer: "Packer"

  - math:
      - type: "Fpu"
        block_size: [64, 64]
        in0: "conv_result"
        in1: "bn_scale"
        operation: "Elwmul"
        unpacker: "UnpackerAB"
        broadcast_type: "ROW"
        broadcast_tile: 0
        math_fidelity: "HiFi2"
    pack:
      - output: "scaled"
        block_size: [64, 64]
        packer: "Packer"

  - math:
      - type: "Fpu"
        block_size: [64, 64]
        in0: "scaled"
        in1: "bn_shift"
        operation: "Elwadd"
        unpacker: "UnpackerAB"
        broadcast_type: "ROW"
        broadcast_tile: 0
        math_fidelity: "LoFi"
    pack:
      - output: "output"
        block_size: [64, 64]
        packer: "Packer"

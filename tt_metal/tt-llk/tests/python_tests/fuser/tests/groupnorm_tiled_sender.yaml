dest_acc: true
skip_for_perf: true

indexes:
  subblock:
    in0: {count: 4}
    in1: {count: 4}
    dest: [0, 1]
    out: {count: 4}
  row_broadcast:
    in0: {count: 4}
    in1: [0, 1, 0, 1]
    dest: [0, 1]
    out: {count: 4}
  scalar_broadcast:
    in0: {count: 4}
    in1: {count: 4, step: 0}
    dest: [0, 1]
    out: {count: 4}
  local_reduce:
    in0: {count: 4}
    in1: {count: 4, step: 0}
    dest: [0, 0, 0, 0]
  scalar:
    in0: [0]
    in1: [0]
    dest: [0]
    out: [0]
  # Reread/copy is w-outer, i-inner; every pack is explicitly indexed.
  copy_columns:
    in0: [0, 2, 1, 3]
    dest: [0]
    out: [0, 2, 1, 3]
  # Affine is i-outer, j-inner, with a separate acquire/pack for EACH tile.
  affine:
    in0: {count: 4}
    in1: [0, 1, 0, 1]
    dest: [0]
    out: {count: 4}

operands:
  - {name: x, dims: [64, 64], format: Float16_b}  # c_0
  - {name: input_mask, dims: [32, 64], format: Float32, const_value: 1.0}  # c_28: DRAM masks use gb_dtype too.
  - {name: scaler, dims: [32, 32], format: Float16_b, const_value: 0.015625}  # c_2: 1/sqrt(64*64)
  - {name: scaler_global, dims: [32, 32], format: Float16_b, const_value: 1.0}  # c_4
  - {name: eps, dims: [32, 32], format: Float16_b, const_value: 1.0e-5}  # c_3
  - {name: gamma, dims: [32, 64], format: Float32}  # c_5
  - {name: beta, dims: [32, 64], format: Float32}  # c_6
  - {name: masked, dims: [64, 64], format: Float16_b}  # c_24
  - {name: mean_partial, dims: [32, 32], format: Float16_b}  # c_8 / reader c_10
  - {name: mean, dims: [32, 32], format: Float16_b}  # c_15
  - {name: centered, dims: [64, 64], format: Float16_b}  # c_25
  - {name: centered_masked, dims: [64, 64], format: Float16_b}  # c_24
  - {name: squared, dims: [64, 64], format: Float16_b}  # c_25
  - {name: variance_partial, dims: [32, 32], format: Float16_b}  # c_21 / reader c_10
  - {name: variance, dims: [32, 32], format: Float16_b}  # c_14
  - {name: rstd, dims: [32, 32], format: Float16_b}  # c_27
  - {name: centered_final, dims: [64, 64], format: Float16_b}  # c_25
  - {name: masked_final, dims: [64, 64], format: Float16_b}  # c_24
  - {name: normalized, dims: [64, 64], format: Float16_b}  # c_25
  - {name: copied, dims: [64, 64], format: Float16_b}  # c_22
  - {name: gamma_out, dims: [64, 64], format: Float16_b}  # c_29
  - {name: output, dims: [64, 64], format: Float16_b}  # c_16

operations:
  # Pass 1: out_block -> i -> j -> w; one bank per subblock, then local reduce.
  - math:
      - type: Fpu
        operation: Elwmul
        unpacker: UnpackerAB
        broadcast_type: ROW
        math_fidelity: HiFi4
        block_size: [32, 32]
        in0: x
        in1: input_mask
        indexes: row_broadcast
    pack:
      - output: masked
        packer: Packer
        block_size: [32, 32]
        indexes: subblock

  - math:
      - type: Fpu
        operation: Reduce
        unpacker: ReduceUnpacker
        reduce_dim: REDUCE_SCALAR
        reduce_pool: SUM
        math_fidelity: HiFi4
        block_size: [32, 32]
        in0: masked
        in1: scaler
        indexes: local_reduce
    pack:
      - output: mean_partial
        packer: Packer
        block_size: [32, 32]
        indexes: scalar

  - math:
      - type: Fpu
        operation: Reduce
        unpacker: ReduceUnpacker
        reduce_dim: REDUCE_SCALAR
        reduce_pool: SUM
        math_fidelity: HiFi4
        block_size: [32, 32]
        in0: mean_partial
        in1: scaler_global
        indexes: scalar
    pack:
      - output: mean
        packer: Packer
        block_size: [32, 32]
        indexes: scalar

  # Pass 2: subtract the ORIGINAL input, remask, pack every square, then reduce.
  - math:
      - type: Fpu
        operation: Elwsub
        unpacker: UnpackerAB
        broadcast_type: SCALAR
        math_fidelity: LoFi
        block_size: [32, 32]
        in0: x
        in1: mean
        indexes: scalar_broadcast
    pack:
      - output: centered
        packer: Packer
        block_size: [32, 32]
        indexes: subblock

  - math:
      - type: Fpu
        operation: Elwmul
        unpacker: UnpackerAB
        broadcast_type: ROW
        math_fidelity: HiFi4
        block_size: [32, 32]
        in0: centered
        in1: input_mask
        indexes: row_broadcast
    pack:
      - output: centered_masked
        packer: Packer
        block_size: [32, 32]
        indexes: subblock

  - math:
      - type: Fpu
        operation: Elwmul
        unpacker: UnpackerAB
        math_fidelity: HiFi4
        block_size: [32, 32]
        in0: centered_masked
        in1: centered_masked
        indexes: subblock
    pack:
      - output: squared
        packer: Packer
        block_size: [32, 32]
        indexes: subblock

  - math:
      - type: Fpu
        operation: Reduce
        unpacker: ReduceUnpacker
        reduce_dim: REDUCE_SCALAR
        reduce_pool: SUM
        math_fidelity: HiFi4
        block_size: [32, 32]
        in0: squared
        in1: scaler
        indexes: local_reduce
    pack:
      - output: variance_partial
        packer: Packer
        block_size: [32, 32]
        indexes: scalar

  - math:
      - type: Fpu
        operation: Reduce
        unpacker: ReduceUnpacker
        reduce_dim: REDUCE_SCALAR
        reduce_pool: SUM
        math_fidelity: HiFi4
        block_size: [32, 32]
        in0: variance_partial
        in1: scaler_global
        indexes: scalar
    pack:
      - output: variance
        packer: Packer
        block_size: [32, 32]
        indexes: scalar

  - math:
      - type: Fpu
        operation: Elwadd
        unpacker: UnpackerAB
        math_fidelity: LoFi
        block_size: [32, 32]
        in0: variance
        in1: eps
        indexes: scalar
      - type: UnarySfpu
        operation: Rsqrt
        approximation_mode: false
        iterations: 32
        block_size: [32, 32]
        indexes: {dest: [0]}
    pack:
      - output: rstd
        packer: Packer
        block_size: [32, 32]
        indexes: scalar

  # Pass 3 recomputes x-mean and the mask; reusing centered_masked would be v2.
  - math:
      - type: Fpu
        operation: Elwsub
        unpacker: UnpackerAB
        broadcast_type: SCALAR
        math_fidelity: LoFi
        block_size: [32, 32]
        in0: x
        in1: mean
        indexes: scalar_broadcast
    pack:
      - output: centered_final
        packer: Packer
        block_size: [32, 32]
        indexes: subblock

  - math:
      - type: Fpu
        operation: Elwmul
        unpacker: UnpackerAB
        broadcast_type: ROW
        math_fidelity: HiFi4
        block_size: [32, 32]
        in0: centered_final
        in1: input_mask
        indexes: row_broadcast
    pack:
      - output: masked_final
        packer: Packer
        block_size: [32, 32]
        indexes: subblock

  - math:
      - type: Fpu
        operation: Elwmul
        unpacker: UnpackerAB
        broadcast_type: SCALAR
        math_fidelity: HiFi4
        block_size: [32, 32]
        in0: masked_final
        in1: rstd
        indexes: scalar_broadcast
    pack:
      - output: normalized
        packer: Packer
        block_size: [32, 32]
        indexes: subblock

  - math:
      - type: Fpu
        operation: Datacopy
        unpacker: UnpackerA
        math_fidelity: LoFi
        block_size: [32, 32]
        in0: normalized
        indexes: copy_columns
    pack:
      - output: copied
        packer: Packer
        block_size: [32, 32]
        indexes: copy_columns

  - math:
      - type: Fpu
        operation: Elwmul
        unpacker: UnpackerAB
        broadcast_type: ROW
        math_fidelity: HiFi4
        block_size: [32, 32]
        in0: copied
        in1: gamma
        indexes: affine
    pack:
      - output: gamma_out
        packer: Packer
        block_size: [32, 32]
        indexes: affine

  - math:
      - type: Fpu
        operation: Elwadd
        unpacker: UnpackerAB
        broadcast_type: ROW
        math_fidelity: LoFi
        block_size: [32, 32]
        in0: gamma_out
        in1: beta
        indexes: affine
    pack:
      - output: output
        packer: Packer
        block_size: [32, 32]
        indexes: affine

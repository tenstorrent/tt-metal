# Sign and Heaviside gate at 0 steps on every exhaustive 16-bit cell below. The in-tree
# WH kernels branch on `abs(v) == 0`, so -0.0 is answered as zero (fixed in #55306), and
# a recurrence is a regression, not specified behaviour. Only the op-wide row is
# tolerance: it answers the Float32 and unswept cells from the 2026-09-18 sample, whose
# worst lane (~1.05e9 Float32 steps, one lane) predates that fix and has no recorded
# input -- a -0.0 read as negative or a flushed subnormal both fit it. Re-measure before
# enrolling it. Their Bfp8_b-input cells read one lane off, like Signbit's there: the
# zero lane the golden's own block quantization turns non-zero.

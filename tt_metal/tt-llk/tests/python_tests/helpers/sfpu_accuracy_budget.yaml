# One multiply, and one open question. x*x has rounding slack the sign-bit ops do not:
# the golden rounds in float64, the hardware in the datapath, and ties can differ.
# The Float32 outputs of a 16-bit input measure 65536 or 32768 steps -- 2**16 and 2**15,
# one bf16 step in fp32 units and half of one -- where the Float32 input measures near 0.
# That is the reference, not the kernel: UnarySFPUGolden untilizes its Dest result through
# the *input* format's dtype, so on a 16-bit input the Float32 golden is rounded to that
# format. The rows record the figure as measured; they tighten when the golden stops
# rounding there.

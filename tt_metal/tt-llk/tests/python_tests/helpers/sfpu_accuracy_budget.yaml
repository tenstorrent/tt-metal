# Derived from the sweep parquet by the budget emitter, not written by hand.
# Every key pins `in` as well as `out`: what reaches the SFPU is already quantized by
# the unpack, and a Bfp8_b input carries 7 magnitude bits behind a shared block
# exponent where an fp32 input carries 23. Measured on WH, 36 of 44 functional-sweep
# failures under a first cut of this table were Bfp8_b-input variants judged by a
# budget derived from fp32/fp16/bf16 inputs only. It also changes what the numbers
# say: tanh fp32->fp32 at dest_acc=Yes agrees to 22 mantissa bits, which a cell mixing
# all three input formats reported as 8.
#
# Regenerate wholesale rather than editing a row: the trailing comment is the
# measurement, and a number changed without it is a guess.


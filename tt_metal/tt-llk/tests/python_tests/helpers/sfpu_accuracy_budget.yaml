  - {in: Float16, out: Float16, max_ulp: 0}  # max 0 ULP
  - {in: Float16, out: Float16_b, max_ulp: 0}  # max 0 ULP
  - {in: Float16_b, out: Bfp8_b, metric: tolerance}  # max 0 ULP, block-quantized, so tolerance

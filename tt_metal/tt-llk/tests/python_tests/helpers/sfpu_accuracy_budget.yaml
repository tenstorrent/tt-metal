#
# The accuracy contract each SFPU op declares. Read by helpers/sfpu_accuracy_budget.py,
# which is the only thing that should parse it; see that module for what the fields mean
# and how a key is matched.
#
# One row per (op, variant). A row's key fields are `in`, `out`, `approx`, `dest` and
# `arch`; every one is optional, an omitted field matches any value, and the most
# specific matching row wins. Two rows that match the same variant equally
# specifically are an authoring error, not a tie-break, and the loader refuses them.
#
# The contract is `max_ulp` (+ optional `near_zero_atol`), or `metric: tolerance` with
# optional `atol`/`rtol`. A row with neither is refused.
#
# `approx` and `dest` are quoted on purpose: YAML 1.1 reads a bare No/Yes as a boolean.
# The loader accepts both spellings, but quote them so the file says what it means.
#
# The trailing comment on a row is the measurement the budget came from, taken on the
# arch it names. A budget may only be *raised* by re-measuring and updating that comment
# in the same change -- the whole point of the table is that no number here is a guess.
#
# A unary step budget is gated only where the exhaustive sweep drives it: a
# Float16_b/Float16/Bfp8_b input into a Float16_b/Float16 output. A unary `Float32` row is
# a record of a sampled measurement no gate reads yet -- the unary functional driver takes
# only the tolerance arm. Binary and ternary rows are gated by their own drivers, on
# every output format that has a step row (Float32 included; never Bfp8_b), because those
# drivers' sweeps are what measured them. Wormhole only, as every unkeyed row.
#
# Every exhaustive row was measured with FAST_MODE(No) and CLAMP_NEGATIVE(True) compiled
# in. The key has no axis for either, so a row holds for a kernel built that way: the
# unary functional driver builds Sqrt/Rsqrt at FastMode.Yes and Exp's clamp path depends
# on CLAMP_NEGATIVE, and it takes only a row's tolerance arm for those ops.
#
# ── Enrolled first: the ops exact by construction ──────────────────────────
#
# They are the flakiness canaries. A 0-step budget on Floor, Ceil or Trunc -- 0 on every
# cell whose output is at least as wide as its input, unlike Abs, whose default row
# carries 1 -- cannot be wrong about the kernel: if one fails, the golden or the datapath
# moved. The narrowing Float16->Float16_b cells measure 1 step, the output rounding
# rather than the op, and carry the emitter's 2. Re-measure on Blackhole before trusting
# any of it there.
#
# Relu is absent because it is packer-applied via STACC_RELU and is not a SfpuType
# member, so it will not compile through the unary driver. ReluMax/ReluMin take a
# threshold operand; they are enrolled with the exact and predicate ops below.
#
# ── Bfp8_b: dominated by block quantization, not by the op ─────────────────
#
# The bf16 proxy is a real per-element criterion only while the block exponent is the one
# bf16 would have used, and on this stimulus it is not: Abs and Neg -- which only clear
# and flip a sign bit -- measure 15616 steps, the worst lane `result 0.0 vs golden
# 0.062`. That is a small element quantized to zero by a shared exponent, exactly as
# designed, and two orders of magnitude past bf16's 128-step ceiling. So a budget cannot
# gate these here, and raising it until they pass gates nothing; a near_zero_atol floor
# would absorb it but would then be the flat-tolerance gate under a new name. Parked on
# tolerance, whose lattice compare is already the stronger criterion -- every Bfp8_b
# output cell, including Floor/Ceil/Trunc's: the exhaustive sweep walks a format in
# value order, so adjacent values share a block, and a 0 measured that way is the best
# case for a block float rather than a representative one. Their op-wide `{max_ulp: 0}`
# rows below record the sampled measurement and still *resolve* a Bfp8_b output wherever
# no more specific row shadows it (a Float32 or unset input), but nothing gates it: the
# sweep skips block outputs and the functional drivers take only the tolerance arm
# (test_a_block_float_output_is_never_enrolled_only_incidentally_covered).
#   wh: Abs/Neg max 15616 ULP, Square max 17664, Floor/Ceil/Trunc max 0, 2026-09-16

Floor:

# frac(x) = x - floor(x) cancels near an integer, and the smaller the result the more of
# the output mantissa the remaining error occupies. Float16 keeps 10 of those bits where
# Float16_b keeps 7, and at 384 measured steps a budget would be looser than the
# tolerance it replaces (the usable ceiling there is 51), so fp16 stays on tolerance.
Frac:
  - {out: Float32, max_ulp: 0}    # 0 ULP, 36 variants / 606k lanes, 2026-09-18
  - {out: Float16_b, max_ulp: 1}  # 1 ULP, 44 variants / 754k lanes, 2026-09-18
  - {out: Float16, metric: tolerance}  # max 384 ULP, 40 variants / 737k lanes, past the 51-step ceiling

# Sign and Heaviside are exact on every lane except -0.0, and there they diverge by
# hardware design, not drift: WH SFPSETCC compares bit patterns, so -0.0 reads as
# negative. sign(-0.0) returns -1 where IEEE gives 0, and heaviside(-0.0) returns 0
# where -0.0 == 0 makes it 0.5. One such lane costs ~1.05e9 steps on Float32, so a
# 0-ULP budget would fail a test that is behaving as specified. Recorded here as
# tolerance on purpose -- do not "close the gap" by enrolling them.
Sign:
  - {metric: tolerance}       # exact except -0.0; max 1056964609 ULP Float32, 16129 Float16_b, 2026-09-18
Heaviside:
  - {metric: tolerance}       # exact except -0.0; max 1048576001 ULP Float32, 16001 Float16_b, 2026-09-18

# ── Binary and ternary SFPU, and the remaining unary approximations ─────────
#
# Measured on Wormhole 2026-09-18 with --ulp-report over each driver's own sweep.
# Budget = 1.25x the sweep's p99.9, rounded up and floored at 1, as everywhere else in
# this file -- not 1.25x the worst lane, which would widen every row by the one unluckiest
# sample. The `max` each row records is the worst lane, so a budget sitting at or a little
# under 1.25x that number is the rule working, not a row that lost its margin. A budget is
# only written where it is *tighter* than the tolerance it replaces: the usable ceiling
# is 419430 steps on Float32, 51 on Float16 and 6 on Float16_b, and an op past it is
# recorded as tolerance with its measurement so nobody re-derives it.
#
# Bfp8_b is never enrolled here. Its shared block exponent quantises a small element in
# a wide block to zero, which costs ~15k steps on ops that cannot be wrong; that is the
# block, not the kernel. Unlisted formats fall through to the tolerance metric.

# -- Unary approximations that stay on tolerance -----------------------------
# Both are past the ceiling on every float column, by three orders of magnitude on
# Float32. They are approximations, and the tolerance is the tighter bound.
GeluTanh:
  - {metric: tolerance}  # max 868220929 ULP Float32 / 13249 Float16_b / 1003 Float16 / 15616 Bfp8_b, 2026-09-18
Tanhshrink:
  - {metric: tolerance}  # max 841656935 ULP Float32 / 12844 Float16_b / 1024 Float16 / 15486 Bfp8_b, 2026-09-18

# Same ~7-mantissa-bit shape as Acosh: 65536 steps on Float32, one step on bf16.
# The bf16 column was one collapsed `{out: Float16_b, max_ulp: 1}` row measured on 8
# sampled variants; exhaustively it holds on none of the swept inputs. Hand-written
# rather than emitted because the Bfp8_b-input cells cannot be measured at all: 257
# lanes there disagree about being non-finite, which is its own investigation and not a
# budget question. Rerun with --ulp-emit once that is settled.

# One multiply, and one open question. x*x has rounding slack the sign-bit ops do not:
# the golden rounds in float64, the hardware in the datapath, and ties can differ.
# Float32 is NOT enrolled, and the measurement is why -- 65536 steps at dest_acc=No is
# 2**16, one step of a 16-bit Dest lattice in fp32 units, so the two round the same step
# differently; 32768 at dest_acc=Yes has no such explanation, the product agreeing to
# only ~8 mantissa bits. Attributing either is its own change, so it is recorded, not
# blessed.

# Multiplication is the one arithmetic op past the ceiling everywhere: its Float32 worst
# lane is 9.4e8 steps against a p99 of 65536, the near-zero spread a product produces.
SfpuElwmul:
  - {metric: tolerance}  # max 936116225 ULP Float32 / 14285 Float16_b / 816 Float16 / 15553 Bfp8_b, 2026-09-18


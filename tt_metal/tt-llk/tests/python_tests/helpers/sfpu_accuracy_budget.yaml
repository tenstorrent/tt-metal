  - {max_ulp: 4}  # wh: Float16 max 4 ULP, 40 variants, 2026-09-16
  - {out: Float16_b, max_ulp: 1}  # wh: max 1 ULP, 40 variants, 2026-09-16
  - {out: Float32, metric: tolerance}  # wh: max 65536 ULP @ dest_acc=No / 32768 @ dest_acc=Yes, 32 variants, 2026-09-16
  - {out: Bfp8_b, metric: tolerance}  # see the Bfp8_b note above

# Still on the tolerance metric, moved here from the test body: CUSTOM_TOLERANCES in
# test_eltwise_unary_sfpu, a coarse 3-segment LUT carrying atol=0.13 so the sweep passes.
# The clearest argument for this mechanism -- that number makes the test blind to a 10x
# regression anywhere else in the domain, and equally blind to the improvement a retune
# would produce. The two share one number because they share one cause, so a retune
# cannot move SigmoidAppx and leave GeluAppx behind without the diff saying so.
SigmoidAppx:
  - &coarse_lut_tolerance {metric: tolerance, atol: 0.13, rtol: 0.05}

GeluAppx:
  - *coarse_lut_tolerance


# Division is driven by two sweeps: the shared binary sweep, where it is exact on both
# float columns, and test_eltwise_binary_sfpu_div, whose own stimuli are what set these
# numbers. The budget has to cover the harder of the two -- an earlier pass measured only
# the shared sweep and enrolled 0, which the dedicated sweep then failed on hardware.
SfpuElwdiv:
  - {out: Float32, max_ulp: 40960}   # max 32768 ULP on the div sweep (0 on the shared one), 14 variants, 2026-09-18
  - {out: Float16_b, max_ulp: 1}     # max 1 ULP on the div sweep (0 on the shared one), 14 variants, 2026-09-18
  - {out: Float16, metric: tolerance}  # max 305 ULP, 5 variants, past the 51-step ceiling

# Multiplication is the one arithmetic op past the ceiling everywhere: its Float32 worst
# lane is 9.4e8 steps against a p99 of 65536, the near-zero spread a product produces.

# ── Binary SFPU, still on the tolerance metric ──────────────────────────────
#
# pow and xlogy were BINARY_CUSTOM_TOLERANCES in test_eltwise_binary_sfpu. They need an
# override because their error is a property of the op's own composition rather than of
# the stimuli, so it grows with the operands however the domain is drawn. Both numbers
# were measured over the domains registered in sfpu_domains -- re-measure before
# widening either. Both are keyed per output format, and both deliberately omit Bfp8_b:
# its default rtol is 0.2, so an override of 0.15 would *tighten* it, and an unlisted
# format falls through to the per-format default rather than to the widest measured
# value.
#
# No step budget yet -- enrolling one means measuring the binary sweep the way the
# unary ops were measured. The numbers now sit next to the op instead of in a dict in
# a test file, which is the point of the table.

# pow's error is relative and roughly flat, and does not scale with the output format's
# precision, so one rtol suits every float column.
SfpuElwpow:
  - {out: Float32, metric: tolerance, rtol: 0.15}
  - {out: Float16_b, metric: tolerance, rtol: 0.15}
  - {out: Float16, metric: tolerance, rtol: 0.15}

# xlogy's error is absolute and linear in x. It splits by nearly 5x between formats, so
# applying Float16_b's atol to Float32 would accept five times what that format
# produces.
SfpuXlogy:
  - {out: Float32, metric: tolerance, atol: 0.14}    # 0.116 measured, ~20% margin
  - {out: Float16_b, metric: tolerance, atol: 0.6}
  - {out: Float16, metric: tolerance, atol: 0.12}    # 0.0989 measured

# logsigmoid's error is relative, and for x > 0 the output is a small residual, so the
# per-format default atol accepts any value at all there: every row below is
# relative-only, at a bound picked to fail on the pre-fix kernel rather than merely to
# pass on this one. Keyed per input format, because the two inputs measure different
# things: BinarySFPUGolden stores its result at the *input* width, so for a Float16_b
# input the reference is rounded to bfloat16 before the comparison, which alone costs
# 3.8e-3 relative on this sweep -- those rows are a regression gate between two kernels
# on identical stimuli -- while a Float32 input's golden is kept at full width and its
# rows measure the arithmetic.
#
# Measured on ttsim v1.10.1 over the [-30, 30] sweep of test_eltwise_binary_sfpu, as the
# max relative error passed_test asserts. The Float16_b-input rows are identical on
# Wormhole and Blackhole; the Float32-input rows ran on Blackhole only, since Wormhole's
# ttsim aborts in its Float32 unpack path. Each comment reads: this kernel / the pre-fix
# kernel (measured with exp(-|x|) on operand B, which is what it reads) / margins.
#
# Two bounds carry one bfloat16 quantum (2^-8 = 3.9e-3) of headroom on purpose: a
# simulator-backed bound with less is one silicon-vs-simulator rounding away from failing
# on a kernel that is fine. The fp32/fp32 row's headroom is ~80x the fp32 quantum,
# since nothing on that path is stored at bfloat16. Against an unrounded float64
# reference the same runs put this kernel at 1.43 bfloat16 ULP on the bfloat16 residual
# path, 1.39 fp32 ULP on the Float16_b-input fp32 path and 1.28 fp32 ULP on the Float32
# path, against 2.12, 2.09 and 1.30e5 fp32 ULP for the pre-fix one.
SfpuLogsigmoid:
  - {in: Float16_b, out: Float16_b, dest: "No", metric: tolerance, atol: 0.0, rtol: 0.013}  # 7.81e-3 / 1.54e-2, 1.66x / 1.18x
  - {in: Float16_b, out: Float32, dest: "No", metric: tolerance, atol: 0.0, rtol: 0.013}  # bit-identical to the row above: rounded to bfloat16 in Dest before the packer widens it
  - {in: Float16_b, out: Float16_b, dest: "Yes", metric: tolerance, atol: 0.0, rtol: 0.008}  # 0 / 1.46e-2, inf / 1.82x
  - {in: Float16_b, out: Float32, dest: "Yes", metric: tolerance, atol: 0.0, rtol: 0.008}  # 3.84e-3 / 1.46e-2, 2.08x / 1.82x
  - {in: Float32, out: Float16_b, dest: "Yes", metric: tolerance, atol: 0.0, rtol: 0.009}  # 3.87e-3 / 1.19e-2, 2.33x / 1.32x
  - {in: Float32, out: Float32, dest: "Yes", metric: tolerance, atol: 0.0, rtol: 1.0e-5}  # 1.25e-7 / 9.02e-3, 80x / 902x

# ── Binary SFPU, still on the tolerance metric ──────────────────────────────
#
# These were BINARY_CUSTOM_TOLERANCES in test_eltwise_binary_sfpu. Only two binary ops
# need an override: their error is a property of the op's own composition rather than of
# the stimuli, so it grows with the operands however the domain is drawn. Both numbers
# were measured over the domains registered in sfpu_domains -- re-measure before
# widening either. Both are keyed per output format, and both deliberately omit Bfp8_b:
# its default rtol is 0.2, so an override of 0.15 would *tighten* it, and an unlisted
# format falls through to the per-format default rather than to the widest measured
# value.
#
# No step budget yet -- enrolling one means measuring the binary sweep the way the
# unary ops were measured. The numbers now sit next to the op instead of in a dict in
# a test file, which is the point of the table.

# pow's error is relative and roughly flat, and does not scale with the output format's
# precision, so one rtol suits every float column.
SfpuElwpow:
  - {out: Float32, metric: tolerance, rtol: 0.15}
  - {out: Float16_b, metric: tolerance, rtol: 0.15}
  - {out: Float16, metric: tolerance, rtol: 0.15}

# xlogy's error is absolute and linear in x. It splits by nearly 5x between formats, so
# applying Float16_b's atol to Float32 would accept five times what that format
# produces.
SfpuXlogy:
  - {out: Float32, metric: tolerance, atol: 0.14}    # 0.116 measured, ~20% margin
  - {out: Float16_b, metric: tolerance, atol: 0.6}
  - {out: Float16, metric: tolerance, atol: 0.12}    # 0.0989 measured

# ── Exact and predicate unary ops ───────────────────────────────────────────
#
# Measured on Wormhole 2026-09-18 over the standard unary sweep with --ulp-report.
# These ops are exactly rounded by construction -- a predicate writing 1.0/0.0, a
# constant fill, a clamp, or a subtraction the hardware does in one step -- so the budget
# is 0 and any drift at all is a regression. The exception is ReluMax, ReluMin and Frac
# into Float16_b from a wider input, which measure 1 step: the op is still exact, and
# the step is the output rounding on the way out of Dest, as the rows there record. A sampled row
# carries that 1; an exhaustive Float16 -> Float16_b row carries 2, the measured step plus
# the emitter's 1.1x headroom rounded up to a whole step.
#
# Every row names an output format that was actually measured. Nothing is enrolled on
# Bfp8_b: its shared block exponent quantises a small element in a wide block to zero,

#
# The accuracy contract each SFPU op declares. Read by helpers/sfpu_accuracy_budget.py,
# which is the only thing that should parse it; see that module for what the fields mean
# and how a key is matched.
#
# One row per (op, variant). A row's key fields are `in`, `out`, `approx`, `dest` and
# `arch`; every one is optional, an omitted field matches any value, and the most
# specific matching row wins. Two rows that match the same variant equally
# specifically are an authoring error, not a tie-break, and the loader refuses them.
#
# The contract is `max_ulp` (+ optional `near_zero_atol`), or `metric: tolerance` with
# optional `atol`/`rtol`. A row with neither is refused.
#
# `approx` and `dest` are quoted on purpose: YAML 1.1 reads a bare No/Yes as a boolean.
# The loader accepts both spellings, but quote them so the file says what it means.
#
# The trailing comment on a row is the measurement the budget came from. A budget may
# only be *raised* by re-measuring and updating that comment in the same change -- the
# whole point of the table is that no number here is a guess.
#
# *Which run* that measurement came from sits on the op's key line, not on every row:
#
#   Tanh:  # measured by: exhaustive Float16_b/Float16/Bfp8_b sweep, wormhole,
#          # <date>, except where a row says otherwise
#
# The identity is the same on every row a sweep emits, and repeating it cost a quarter
# of this file. A row the sweep did not supersede -- a sampled cell it does not drive, an
# arch-keyed entry, a hand-measured one -- keeps its own suffix and is the "otherwise";
# one that had none is stamped with the run it came from before the clause is replaced.
# The number always stays on the row, because that is what a budget is checked against.
#
# Two phrases recur on demoted rows, and mean this. Stated once here rather than spelled
# out several hundred times, because the part that has to sit on the row is the number:
#
#   "budget N > ceiling C"  The measurement itself is past `usable_budget_ceiling` (one
#       inside it is enrolled, its 1.1x headroom capped at the ceiling), and N is the
#       budget it would have needed. Past the ceiling a step budget is no longer
#       *tighter* than the tolerance it replaces, and since the ULP arm of `passed_test`
#       returns before both isclose and PCC, such a budget would be the whole gate.
#
#   "block-quantized"  A shared block exponent quantizes a small element
#       in a wide block to zero, which costs thousands of steps on ops that cannot be
#       wrong. That is the block, not the kernel. It reads low from a sorted sweep --
#       sixteen adjacent values share a block, the best case rather than a
#       representative one -- and low from a narrow sampled domain, so neither number
#       is enrollable. No block-float output is enrolled; Floor, Ceil and Trunc resolve
#       to a step budget there only incidentally, through their op-wide default row,
#       and nothing gates it.
#
# Every cell the sweep drives that carries a step budget is gated -- a
# Float16_b/Float16/Bfp8_b/Bfp4_b input, or a strided Float32 one, into a
# Float16_b/Float16/Float32 output; a tolerance cell is measured, not gated. The unary
# functional driver takes only the tolerance arm of a contract; the binary, ternary and
# scalar drivers gate on the whole of it (every output with a step row, never Bfp8_b),
# because their rows were measured over their own sweeps, and so do the hand-built unary
# signbit, isinf/isnan and threshold sweeps (test_eltwise_unary_sfpu.py,
# `gate_on_step_budget`), whose stimuli measured those predicates' rows.
#
# Every exhaustive row was measured with FAST_MODE(No) and CLAMP_NEGATIVE(True) compiled
# in. The key has no axis for either, so a row holds for a kernel built that way: the
# unary functional driver builds Sqrt/Rsqrt at FastMode.Yes and Exp's clamp path depends
# on CLAMP_NEGATIVE, and it takes only a row's tolerance arm for those ops.
#
# ── Enrolled first: the ops exact by construction ──────────────────────────
#
# They are the flakiness canaries. A 0-step budget on Abs cannot be wrong about the
# kernel -- if one fails, the golden or the datapath moved. Re-measure on Blackhole
# before trusting any of it there.
#
# Relu is absent because it is packer-applied via STACC_RELU and is not a SfpuType
# member, so it will not compile through the unary driver. ReluMax/ReluMin take a
# threshold operand; they are enrolled with the exact and predicate ops below.
#
# ── Bfp8_b: dominated by block quantization, not by the op ─────────────────
#
# The bf16 proxy is a real per-element criterion only while the block exponent is the one
# bf16 would have used, and on this stimulus it is not: Abs and Neg -- which only clear
# and flip a sign bit -- measure 15616 steps, the worst lane `result 0.0 vs golden
# 0.062`. That is a small element quantized to zero by a shared exponent, exactly as
# designed, and two orders of magnitude past bf16's 128-step ceiling. So a budget cannot
# gate these here, and raising it until they pass gates nothing; a near_zero_atol floor
# would absorb it but would then be the flat-tolerance gate under a new name. Parked on
# tolerance, whose lattice compare is already the stronger criterion -- every Bfp8_b
# output cell, including Floor/Ceil/Trunc's: the exhaustive sweep walks a format in
# value order, so adjacent values share a block, and a 0 measured that way is the best
# case for a block float rather than a representative one. Their op-wide `{max_ulp: 0}`
# rows below record the sampled measurement and still *resolve* a Bfp8_b output wherever
# no more specific row shadows it (a Float32 or unset input), but nothing gates it: the
# sweep skips block outputs and the functional drivers take only the tolerance arm
# (test_a_block_float_output_is_never_enrolled_only_incidentally_covered).
#   wh: Abs/Neg max 15616 ULP, Square max 17664, Floor/Ceil/Trunc max 0, 2026-09-16


# Sign-bit and select: exact in fp32, one step in the 16-bit formats. No arithmetic to
# round, so fp32 is bit-exact. The single step on the 16-bit outputs is the *pack* path,
# not the op -- it shows up for Abs, Neg and Identity, mostly at dest_acc=Yes where it is
# rounded at pack rather than truncated in Dest first, and a step budget is what makes it
# visible at all (atol=0.05 is ~6 bf16 steps). No headroom on the 0-step rows,
# deliberately: these are exact by construction, so any movement is real signal. The
# narrowing Float16->Float16_b rows measure 1 and carry the emitter's 1.1x, as 2.

# One multiply, and one open question. x*x has rounding slack the sign-bit ops do not:
# the golden rounds in float64, the hardware in the datapath, and ties can differ.
# Its Float32 outputs measure 0 almost everywhere since UnarySFPUGolden stopped rounding
# its reference to the input format (65536 and 32768 steps, one bf16 step and half of
# one in fp32 units, were that cast). What is left is dest_acc=No: a 16-bit Dest holds
# the product at bf16 or fp16 precision, so a Bfp8_b input reads one bf16 step there,
# and a Float16 input the fp16 Dest's subnormal flush. The op-wide Float32 row keeps the

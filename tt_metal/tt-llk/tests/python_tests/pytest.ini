[pytest]
filterwarnings =
    ignore::UserWarning
    ignore::DeprecationWarning
    ignore::FutureWarning
# --maxschedchunk caps how many tests xdist hands a worker at once. Every worker
# owns one Tensix (tensix_location_for_worker) and nothing resets it between
# tests -- pytest_runtest_teardown only acts under --reset-simulator-per-test --
# so this setting also decides which tests precede a measurement on that core.
# The measuring pass is `-n 15` with no --dist, i.e. the dynamic `load`
# scheduler. At 2000 a worker takes one long contiguous block, the whole shard is
# partitioned by a handful of timing-dependent handouts, and two runs of one
# commit give a test different neighbours -- which makes perf measurements
# irreproducible.
#
# Measured on tt-metal@ef82086141d, Blackhole, non-SoL, two CI runs of the SAME
# commit compared against each other with the merge gate's rule (>2% AND >30
# cycles), 888,300 points:
#
#   chunk=2000   L1_TO_L1 1426   PACK_ISOLATE 1802
#   chunk=10     L1_TO_L1    0   PACK_ISOLATE    0
#
# and it costs nothing: 64 card-minutes at 10 against 66 at 2000. Raising this
# hid nothing and bought nothing. Do not raise it again without re-measuring
# reproducibility; see tt_metal/tt-llk/.claude/scripts/perf_bisect.py.
addopts = -s --maxschedchunk=10
python_files =
    test_*.py
    perf_*.py
    fused_*.py
python_functions = test
markers =
    long: marks tests as long-running (deselect with '-m "not long"')
    perf: marks tests as performance benchmarks (deselect with '-m "not perf"')
    nightly: marks tests as nightly benchmarks (deselect with '-m "not nightly"')
    quasar: marks tests as quasar tests (deselect with '-m "not quasar"')
    accuracy: marks SFPU accuracy-sweep tests (deselect with '-m "not accuracy"')
log_date_format = %Y-%m-%d %H:%M:%S
log_format = %(asctime)s | %(levelname)-8s | %(name)s:%(funcName)s:%(lineno)d - %(message)s
log_cli_format = %(asctime)s | %(levelname)-8s | %(name)s:%(funcName)s:%(lineno)d - %(message)s
log_cli = true

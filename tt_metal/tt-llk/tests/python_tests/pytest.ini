[pytest]
filterwarnings =
    ignore::UserWarning
    ignore::DeprecationWarning
    ignore::FutureWarning
# -s capture: kept — pytest_runtest_logreport in conftest.py renames
#   lowercase "captured stdout" sections to capital so forked-crash output
#   still lands in junit <system-out>.
# -p no:cacheprovider: .pytest_cache lives on overlayfs /tmp — small
#   per-test write that adds up at 32 workers. We don't use the cache.
addopts = -s -p no:cacheprovider
python_files =
    test_*.py
    perf_*.py
    fused_*.py
python_functions = test
markers =
    long: marks tests as long-running (deselect with '-m "not long"')
    perf: marks tests as performance benchmarks (deselect with '-m "not perf"')
    nightly: marks tests as nightly benchmarks (deselect with '-m "not nightly"')
    quasar: marks tests as quasar tests (deselect with '-m "not quasar"')
    accuracy: marks SFPU accuracy-sweep tests (deselect with '-m "not accuracy"')
log_date_format = %Y-%m-%d %H:%M:%S
log_format = %(asctime)s | %(levelname)-8s | %(name)s:%(funcName)s:%(lineno)d - %(message)s
log_cli_format = %(asctime)s | %(levelname)-8s | %(name)s:%(funcName)s:%(lineno)d - %(message)s
log_cli = true

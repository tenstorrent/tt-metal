#
# Triage for compute_api_order_corpus.md.
#
# Keys are either a full fingerprint
#   arch|thread|rule|file:line|message
# or a rule-wide default (this file uses the compact rule defaults).  A rule
# default applies only when there is no exact or rule|file:line override.
#
# Verdicts are from reviewing the corpus against the source.  Unreviewed
# findings are not counted as false positives.

loop-invariant-init:
  true_positive: false
  note: advisory; the init is intentionally re-run after a reconfiguration or to restore per-iteration SFPU state

missing-init:
  true_positive: true
  note: no matching init on this path; pack-only kernels that skip compute_kernel_hw_startup, and bcast/reduce helpers whose init is missing

missing-uninit:
  true_positive: true
  note: the curated uninit contract is not met before the kernel ends or switches operation groups

init-arg-mismatch:
  true_positive: true
  note: init and operation expose different compile-time arguments (e.g. unpack acc_to_dest / datacopy configuration)

wrong-init:
  true_positive: false
  note: helper-local constexpr path (e.g. is_sfpu in reduce_helpers_compute.inl) is not resolved by the checker; tracked as a checker refinement, not a kernel defect

#
# Compute-kernel API ordering rules, expressed at the LLK API level.
#
# The compute API (tt_metal/hw/inc/api/compute/) is a thin layer over the LLK API
# (tt_metal/hw/ckernels/<arch>/metal/llk_api/).  The LLK API is stateful: an
# operation runs only after a matching init has configured the engine, an init
# snapshot must still match the operand/format configuration at execute time, and
# a different init on the same engine replaces the seated operation.  These rules
# used to live only in prose; this file makes them data.
#
# Each operation cites the sanitizer hook / API doc / bug that defines it.  The
# sanitizer-agreement test (tests/test_check_compute_api_order.py) parses the
# SAN_HOOKs in tt_metal/hw/ckernels/*/metal/llk_api/ and fails if this table and
# the sanitizer's operation model disagree for an operation both cover.
#
# match syntax:
#   template: [[init_index, execute_index], ...]   non-type template args
#   args:     [[init_index, execute_index], ...]   runtime arguments
# A value that is not a compile-time constant compares as unknown: the checker
# reports "unknown" in JSON and never guesses a mismatch from it.
#
# requires_uninit is curated, not "every init needs an uninit": only operations
# that arm persistent state the next operation would trip over are listed.
version: 1

threads:
  UNPACK: {define: TRISC_UNPACK, compile_for_trisc: 0}
  MATH: {define: TRISC_MATH, compile_for_trisc: 1}
  PACK: {define: TRISC_PACK, compile_for_trisc: 2}

# Calls that change operand/format configuration, invalidating inits that
# snapshotted the changed fields.  The sanitizer models this as an operand-state
# update: an init snapshot that no longer equals the operand state fails at
# execute.  Statically we invalidate the operations named by each op's
# `invalidated_by` list.
invalidators:
  - functions: [llk_unpack_reconfig_data_format_srca, llk_unpack_reconfig_data_format_srcb, llk_unpack_reconfig_data_format, llk_unpack_hw_configure]
    exu: Unpack
    thread: UNPACK
    citation: tt_metal/hw/ckernels/wormhole_b0/metal/llk_api/llk_unpack_common_api.h (reconfigure/configure hooks); issue #61146
  - functions: [llk_math_reconfig_data_format_srca, llk_math_reconfig_data_format_srcb, llk_math_reconfig_data_format, llk_math_hw_configure]
    exu: Fpu
    thread: MATH
    citation: tt_metal/hw/ckernels/wormhole_b0/metal/llk_api/llk_math_common_api.h (reconfigure/configure hooks)
  - functions: [llk_pack_reconfig_data_format, llk_pack_hw_configure]
    exu: Pack
    thread: PACK
    citation: tt_metal/hw/ckernels/wormhole_b0/metal/llk_api/llk_pack_common_api.h (reconfigure/configure hooks); issue #61146

operations:
  # ------------------------------------------------------------------ UNPACK
  - id: unpack.unary
    compared_fields: [BroadcastType, AccumulateToDest, BinaryReuseDest, UnpackToDest]
    sanitizer_operation: OperationUnpackUnary
    exu: Unpack
    thread: UNPACK
    requires_uninit: false
    invalidated_by: []
    transitions:
      - architectures: [wormhole_b0]
        init: llk_unpack_A_init
        execute: [llk_unpack_A, llk_unpack_A_block]
        uninit: [llk_unpack_A_uninit]
        match:
          template: [[0, 0], [1, 1], [2, 2], [3, 3]]
      - architectures: [blackhole]
        init: llk_unpack_A_init_impl
        execute: [llk_unpack_A, llk_unpack_A_block]
        uninit: [llk_unpack_A_uninit]
        match:
          template: [[0, 0], [1, 1], [2, 2], [3, 3]]
    citation: tt_metal/hw/ckernels/wormhole_b0/metal/llk_api/llk_unpack_A_api.h:24 (init hook); compute API doc tt_metal/hw/inc/api/compute/tile_move_copy.h:25

  # The init/execute argument equality check below is the static form of the
  # LLK_ASSERT unpack-configuration failures in #39184 and #39945: the init and
  # the operation must agree on the configuration the unpacker was programmed
  # with.  Runtime CB-descriptor mismatches remain host-data dependent and are
  # reported by the LLK_ASSERT build, not guessed from a runtime value.
  - id: unpack.binary
    compared_fields: [BroadcastType]
    sanitizer_operation: OperationUnpackBinary
    exu: Unpack
    thread: UNPACK
    requires_uninit: false
    invalidated_by: []
    transitions:
      - init: llk_unpack_AB_init
        execute: [llk_unpack_AB]
        match:
          template: [[0, 0]]
    citation: tt_metal/hw/ckernels/wormhole_b0/metal/llk_api/llk_unpack_AB_api.h:15 (init hook)

  - id: unpack.matmul
    compared_fields: [CtDim, RtDim, KtDim]
    sanitizer_operation: OperationUnpackMatmul
    exu: Unpack
    thread: UNPACK
    requires_uninit: false
    invalidated_by: []
    transitions:
      - init: llk_unpack_AB_matmul_init
        execute: [llk_unpack_AB_matmul]
        match:
          args: [[3, 4], [4, 5], [5, 6]]
    citation: tt_metal/hw/ckernels/wormhole_b0/metal/llk_api/llk_unpack_AB_matmul_api.h:22 (init hook)

  - id: unpack.reduce
    compared_fields: [PoolType, ReduceDim]
    sanitizer_operation: OperationUnpackReduce
    exu: Unpack
    thread: UNPACK
    requires_uninit: false
    invalidated_by: []
    transitions:
      - architectures: [wormhole_b0]
        init: llk_unpack_AB_reduce_init
        execute: [llk_unpack_AB_reduce]
        match:
          template: [[0, 0], [1, 1]]
      - architectures: [blackhole]
        init: llk_unpack_AB_reduce_init_impl
        execute: [llk_unpack_AB_reduce]
        match:
          template: [[0, 0], [1, 1]]
    citation: tt_metal/hw/ckernels/wormhole_b0/metal/llk_api/llk_unpack_AB_reduce_api.h:15 (init hook)

  - id: unpack.tilize
    compared_fields: [BlockCtDim]
    sanitizer_operation: OperationUnpackTilize
    exu: Unpack
    thread: UNPACK
    requires_uninit: true
    invalidated_by: []
    transitions:
      - architectures: [wormhole_b0]
        init: llk_unpack_tilize_init
        execute: [llk_unpack_tilize]
        uninit: [llk_unpack_tilize_uninit]
        match:
          args: [[1, 2]]
      - architectures: [blackhole]
        init: llk_unpack_tilize_init_impl
        execute: [llk_unpack_tilize_impl]
        uninit: [llk_unpack_tilize_uninit_impl]
        match: {}
    citation: tt_metal/hw/ckernels/wormhole_b0/metal/llk_api/llk_unpack_tilize_api.h:24 (init hook); compute API doc tt_metal/hw/inc/api/compute/tilize.h:220 (uninit required before re-init)

  - id: unpack.untilize
    compared_fields: []
    sanitizer_operation: null
    exu: Unpack
    thread: UNPACK
    requires_uninit: true
    invalidated_by: []
    transitions:
      - init: llk_unpack_untilize_init
        execute: [llk_unpack_untilize]
        uninit: [llk_unpack_untilize_uninit]
        match: {}
    citation: tt_metal/hw/inc/api/compute/untilize.h:20 (deprecated; uninit contract); llk_unpack_untilize_api.h is not modelled by the sanitizer (SAN_HOOK(unsupported))

  - id: unpack.fast_tilize
    compared_fields: [AddrMod]
    sanitizer_operation: OperationUnpackFastTilizeWh
    exu: Unpack
    thread: UNPACK
    architectures: [wormhole_b0]
    requires_uninit: true
    invalidated_by: []
    transitions:
      - init: llk_unpack_fast_tilize_init
        execute: [llk_unpack_fast_tilize_block]
        uninit: [llk_unpack_fast_tilize_uninit]
        match: {}
    citation: tt_metal/hw/ckernels/wormhole_b0/metal/llk_api/llk_unpack_tilize_api.h:292 (init hook)

  # -------------------------------------------------------------------- MATH
  - id: math.eltwise_binary
    compared_fields: [EltwiseBinaryType, BroadcastType, MathFidelity, ReuseDest]
    sanitizer_operation: OperationFpuEltwiseBinary
    exu: Fpu
    thread: MATH
    requires_uninit: false
    invalidated_by: []
    transitions:
      - architectures: [wormhole_b0]
        init: llk_math_eltwise_binary_init
        execute: [llk_math_eltwise_binary]
        match:
          template: [[0, 0], [1, 1], [2, 3], [3, 4]]
      - architectures: [blackhole]
        init: llk_math_eltwise_binary_init_impl
        execute: [llk_math_eltwise_binary]
        match:
          template: [[0, 0], [1, 1], [2, 3], [3, 4]]
    citation: tt_metal/hw/ckernels/wormhole_b0/metal/llk_api/llk_math_binary_api.h:41 (init hook); issue #59276

  - id: math.matmul
    compared_fields: [MathFidelity, ThrottleLevel, CtDim, RtDim]
    sanitizer_operation: OperationFpuMatmul
    exu: Fpu
    thread: MATH
    requires_uninit: false
    invalidated_by: []
    transitions:
      - init: llk_math_matmul_init
        execute: [llk_math_matmul]
        match:
          template: [[0, 0], [1, 1]]
          args: [[3, 1], [4, 2]]
    citation: tt_metal/hw/ckernels/wormhole_b0/metal/llk_api/llk_math_matmul_api.h:32 (init hook)

  - id: math.reduce
    compared_fields: [PoolType, ReduceDim, MathFidelity]
    sanitizer_operation: OperationFpuReduce
    exu: Fpu
    thread: MATH
    requires_uninit: false
    invalidated_by: []
    transitions:
      - architectures: [wormhole_b0]
        init: llk_math_reduce_init
        execute: [llk_math_reduce]
        uninit: [llk_math_reduce_uninit]
        match:
          template: [[0, 0], [1, 1], [3, 3]]
      - architectures: [blackhole]
        init: llk_math_reduce_init_impl
        execute: [llk_math_reduce]
        uninit: [llk_math_reduce_uninit]
        match:
          template: [[0, 0], [1, 1], [3, 3]]
    citation: tt_metal/hw/ckernels/wormhole_b0/metal/llk_api/llk_math_reduce_api.h:67 (init hook)

  - id: math.datacopy
    compared_fields: [DataCopyType, BroadcastType]
    sanitizer_operation: OperationFpuEltwiseUnaryDatacopy
    exu: Fpu
    thread: MATH
    requires_uninit: false
    invalidated_by: []
    transitions:

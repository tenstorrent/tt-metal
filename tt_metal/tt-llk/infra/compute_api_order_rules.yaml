    requires_uninit: false
    invalidated_by: [llk_pack_hw_configure]
    transitions:
      - architectures: [wormhole_b0]
        init: llk_pack_init
        execute: [llk_pack, llk_matmul_pack]
        match: {}
      - architectures: [blackhole]
        init: llk_pack_init_impl
        execute: [llk_pack, llk_matmul_pack]
        match: {}
    citation: tt_metal/hw/ckernels/wormhole_b0/metal/llk_api/llk_pack_tile_api.h:29 (init hook)

  - id: pack.untilize

    citation: tt_metal/hw/ckernels/wormhole_b0/metal/llk_api/llk_math_unary_datacopy_api.h:69 (init hook); broadcast uninit contract in tt_metal/hw/inc/api/compute/bcast.h:122

  - id: math.fast_tilize
    compared_fields: [AddrMod]
    sanitizer_operation: OperationFpuFastTilizeWh
    exu: Fpu
    thread: MATH
    architectures: [wormhole_b0]
    requires_uninit: true
    invalidated_by: []
    transitions:
      - init: llk_math_fast_tilize_init
        execute: [llk_math_fast_tilize_block_]
        uninit: [llk_math_fast_tilize_uninit]
        match: {}
    citation: tt_metal/hw/ckernels/wormhole_b0/metal/llk_api/llk_math_unary_datacopy_api.h:llk_math_fast_tilize_init (init hook)


  - id: math.transpose_dest
    compared_fields: []
    sanitizer_operation: null
    exu: Fpu
    thread: MATH
    requires_uninit: false
    additive: true
    # The LLK transpose-dest init has no sanitizer hook, so it does not displace
    # the datacopy operation seated by transpose_init's datacopy init.
    invalidated_by: []
    transitions:

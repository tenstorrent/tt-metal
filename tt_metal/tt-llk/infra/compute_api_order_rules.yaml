  # Compute-API-level broadcast rule: the LLK unpack_A / unary_datacopy inits are
  # shared with copy_init (which does not need an uninit), so the "broadcast must
  # be uninitialized" contract only exists at this level.
  - id: compute.broadcast_unpack
    sanitizer_operation: null
    exu: Unpack
    thread: UNPACK
    requires_uninit: true
    descend: true
    additive: true
    transitions:
      - init: unary_bcast_init
        execute: [unary_bcast]
        uninit: [unary_bcast_uninit]
        match: {}
    citation: tt_metal/hw/inc/api/compute/bcast.h:122 (unary_bcast_uninit)

  - id: compute.broadcast_math
    sanitizer_operation: null
    exu: Fpu
    thread: MATH
    requires_uninit: true
    descend: true
    additive: true
    transitions:

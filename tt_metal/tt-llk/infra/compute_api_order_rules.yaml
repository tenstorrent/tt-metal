        match: {}
    citation: tt_metal/hw/inc/api/compute/bcast.h:122 (unary_bcast_uninit)

  # PACK-side tilize context: tilize_init arms the packer's tilize mode; a
  # pack_reconfig_data_format in between breaks it even though it re-runs
  # llk_pack_init (issue #61146).  Additive so it does not collide with pack.tile.
  - id: compute.tilize_pack
    sanitizer_operation: null
    exu: Pack
    thread: PACK
    requires_uninit: true
    additive: true
    descend: true
    invalidated_by: [llk_pack_reconfig_data_format]
    transitions:
      - init: tilize_init
        execute: [tilize_block]
        uninit: [tilize_uninit]
        match: {}
    citation: tt_metal/hw/inc/api/compute/tilize.h:51; issue #61146 (pack_reconfig_data_format after tilize_init corrupts output)

  # -------------------------------------------------------------------- PACK

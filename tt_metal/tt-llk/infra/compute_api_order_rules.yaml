        uninit: [llk_pack_untilize_uninit_impl]
        match:
          template: [[0, 0], [1, 1], [2, 2]]
    citation: tt_metal/hw/ckernels/wormhole_b0/metal/llk_api/llk_pack_untilize_api.h:37 (init hook); compute API tt_metal/hw/inc/api/compute/pack_untilize.h:374

  - id: pack.fast_tilize
    compared_fields: [AddrMod, Use32BitDest]
    sanitizer_operation: OperationPackFastTilizeWh
    exu: Pack
    thread: PACK
    architectures: [wormhole_b0]
    requires_uninit: true
    invalidated_by: [llk_pack_reconfig_data_format, llk_pack_hw_configure]
    transitions:
      - init: llk_pack_fast_tilize_init
        execute: [llk_pack_fast_tilize_block]
        uninit: [llk_pack_fast_tilize_uninit]
        match: {}
    citation: tt_metal/hw/ckernels/wormhole_b0/metal/llk_api/llk_pack_fast_tilize_api.h:llk_pack_fast_tilize_uninit (nested init<OperationPack> hook)

# SFPU init/execute pairs are generated from the host-side source generator; see
# compute_api_order_sfpu.yaml.  These three pairs are emitted only through
# std::make_pair / direct returns the generator does not parse.
sfpu_extra_groups:
  - id: sfpu.mac_tile
    init: [mac_tile_init]
    execute: [mac_tile]
    citation: ttnn/cpp/ttnn/operations/eltwise/unary/common/unary_op_utils.cpp:684
  - id: sfpu.where_tile
    init: [where_tile_init]
    execute: [where_tile]
    citation: ttnn/cpp/ttnn/operations/eltwise/unary/common/unary_op_utils.cpp:678
  - id: sfpu.signbit_tile
    init: [signbit_tile_init]
    execute: [signbit_tile]
    citation: ttnn/cpp/ttnn/operations/eltwise/unary/common/unary_op_utils.cpp:784
  - id: sfpu.negative_tile
    init: [negative_tile_init]
    execute: [negative_tile, negative_tile_int32]
    citation: ttnn/cpp/ttnn/operations/eltwise/unary/common/unary_op_utils.cpp:951

# Sequence postconditions.  After the trigger init body has been followed, the
# required operation must be seated with matching arguments.  require_args maps
# trigger-argument index -> required-init argument index, compared as canonical
# values.  This is how #52175 is kept from regressing: tilize_init must re-point
# the packer at the OCB, otherwise a previous operation's geometry is reused.
sequence_rules:
  - id: tilize-packer-seated-wh
    trigger: tilize_init
    thread: PACK
    architectures: [wormhole_b0]
    require_init: pack.tile
    # WH llk_pack_init takes the output operand first; compare it with
    # tilize_init(icb, block, ocb) argument 2.
    require_args: [[2, 0]]
    message: "tilize_init did not re-initialize the packer for its output operand; the packer would use the previous operation's tile geometry"
    citation: "tt_metal/hw/inc/api/compute/tilize.h:51; issue #52175"
  - id: tilize-packer-seated-bh
    trigger: tilize_init
    thread: PACK
    architectures: [blackhole]
    require_init: pack.tile
    # BH packs through llk_pack_init_impl, whose arguments are the resolved
    # descriptor fields; freshness is the invariant, not the operand spelling.
    require_args: []
    message: "tilize_init did not re-initialize the packer for its output operand; the packer would use the previous operation's tile geometry"
    citation: "tt_metal/hw/inc/api/compute/tilize.h:51; issue #52175"

# Deprecated init APIs called out by .github/deprecations.json.  The checker also
# reports any call whose C++ declaration carries [[deprecated]]: init-style
# functions produce deprecated-init, everything else (e.g. acquire_dst) produces
# deprecated-api.  This list is only for deprecations tracked outside the headers.
# Keys must exist in .github/deprecations.json (checked by the tests).
deprecated_init_apis: []

# Nested hooks: a rule function that also performs another operation's init/uninit.
# llk_pack_fast_tilize_uninit re-seats OperationPack with llk_pack_init<Default>
# (it undo-tilizes the packer), so a later pack_tile does not need another init.
extra_events:
  - function: llk_pack_fast_tilize_uninit
    architectures: [wormhole_b0]
    kind: init
    op: pack.tile
    match: {}

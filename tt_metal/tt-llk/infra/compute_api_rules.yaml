      - AddrMod
    llk_inits:
      - llk_math_fast_tilize_init
    llk_execs:
      - llk_math_fast_tilize_block
    llk_uninits:
      - llk_math_fast_tilize_uninit
    source: "tt_metal/tt-llk/tools/include/sanitizer/operation.h:520"

  OperationPack:
    exu: Pack
    thread: PACK
    hoistable: true
    state_fields:
      - NumTiles
    llk_inits:
      - llk_pack_init
      - llk_pack_dest_init
    llk_execs:
      - llk_pack
      - llk_pack_block
    llk_uninits: []
    source: "tt_metal/tt-llk/tools/include/sanitizer/operation.h:540"

  OperationPackUntilize:
    exu: Pack
    thread: PACK
    hoistable: false
    state_fields:
      - BlockCtDim
      - FullCtDim
      - Diagonal
    llk_inits:
      - llk_pack_untilize_init
    llk_execs:
      - llk_pack_untilize
    llk_uninits:
      - llk_pack_untilize_uninit
    source: "tt_metal/tt-llk/tools/include/sanitizer/operation.h:556"

  OperationPackFastTilizeWh:
    exu: Pack
    thread: PACK
    hoistable: false
    state_fields:

# ---------------------------------------------------------------------------
# 4. Data-Format Reconfiguration Rules
#    Captures format-tracking and operand-order rules (e.g. #39945, #61146).
# ---------------------------------------------------------------------------
reconfig_operations:
  reconfig_data_format:
    threads: [UNPACK, MATH]
    unpack_call: llk_unpack_reconfig_data_format
    math_call: llk_math_reconfig_data_format
    note: >
      reconfig_data_format(srca_new, srcb_new) configures SrcA with argument 0 and SrcB with
      argument 1. However, matmul_tiles(in0, in1, ...) and matmul_block(in0, in1, ...) unpack
      in1 into SrcA and in0 into SrcB (#39945). Passing (in0, in1) to reconfig_data_format
      before matmul_tiles(in0, in1, ...) when in0 != in1 causes a SrcA/SrcB format mismatch.
    matmul_operand_order_reversed: true
    source: "docs/source/tt-metalium/tools/llk_asserts.rst:152 (#39945)"

  pack_reconfig_data_format:
    threads: [PACK]
    pack_call: llk_pack_reconfig_data_format
    blackhole_invalidates_tilize_init: true
    note: >
      On Blackhole, calling pack_reconfig_data_format after tilize_init and before tilize_block
      overwrites the packer's tilize Z-stride (PCK_EDGE_OFFSET), corrupting half of every
      output tile (#61146). Call pack_reconfig_data_format before tilize_init instead.
    source: "tt_metal/hw/inc/api/compute/tilize.h:35 (#61146)"

# ---------------------------------------------------------------------------
# 5. Compute Kernel API -> Per-Thread LLK Expansion Table
#    Used alongside AST/header expansion so every compute-API call expands to its
#    exact UNPACK, MATH, and PACK LLK operations and template/argument bindings.
# ---------------------------------------------------------------------------
compute_api_wrappers:
  # Hardware startup (configures formats on UNPACK/MATH and initializes default PACK;
  # operation-specific init on UNPACK/MATH is still required before execute calls).
  compute_kernel_hw_startup:
    PACK:
      - call: llk_pack_init
        template_args: ["false", "false"]
        args: ["$arg2"]
    source: "tt_metal/hw/inc/api/compute/compute_kernel_hw_startup.h:60"

  binary_op_init_common:
    PACK:
      - call: llk_pack_init
        template_args: ["false", "false"]
        args: ["$arg2"]
    source: "tt_metal/hw/inc/api/compute/compute_kernel_hw_startup.h:60"

  unary_op_init_common:
    UNPACK:
      - call: llk_unpack_A_init
        template_args: ["BroadcastType::NONE", "false", "EltwiseBinaryReuseDestType::NONE", "false"]
        args: ["false", "false", "$arg0"]
    MATH:
      - call: llk_math_eltwise_unary_datacopy_init
        template_args: ["A2D", "DST_ACCUM_MODE", "BroadcastType::NONE"]
        args: ["$arg0"]
    PACK:
      - call: llk_pack_init
        template_args: ["false", "false"]
        args: ["$arg1"]
    source: "tt_metal/hw/inc/api/compute/compute_kernel_hw_startup.h:61"

  init_sfpu:
    UNPACK:
      - call: llk_unpack_A_init

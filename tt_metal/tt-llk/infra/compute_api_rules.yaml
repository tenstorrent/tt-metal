# Machine-readable compute-kernel and LLK API ordering rules per Tensix thread (UNPACK, MATH, PACK).
# Read by tt_metal/tt-llk/infra/check_compute_api_order.py and validated against
# tt_metal/tt-llk/tools/include/sanitizer/operation.h and .github/deprecations.json
# by tt_metal/tt-llk/infra/tests/test_check_compute_api_order.py.
#
# Every entry cites its authoritative source: an API header doc comment, LLK implementation,
# documentation file, or historical issue number.

schema_version: 1
deprecations_manifest: ".github/deprecations.json"
sanitizer_header: "tt_metal/tt-llk/tools/include/sanitizer/operation.h"

# ---------------------------------------------------------------------------
# 1. LLK Sanitizer Operation Model Correspondence
#    Must stay in 1-to-1 agreement with tt_metal/tt-llk/tools/include/sanitizer/operation.h.
# ---------------------------------------------------------------------------
sanitizer_operations:
  OperationUnpackUnary:
    exu: Unpack
    thread: UNPACK
    hoistable: true
    state_fields:
      - BroadcastType
      - AccumulateToDest
      - BinaryReuseDest
      - UnpackToDest
    llk_inits:
      - llk_unpack_A_init
      - llk_unpack_unary_operand_init
    llk_execs:
      - llk_unpack_A
      - llk_unpack_unary_operand
    llk_uninits: []
    source: "tt_metal/tt-llk/tools/include/sanitizer/operation.h:175"

  OperationUnpackBinary:
    exu: Unpack
    thread: UNPACK
    hoistable: true
    state_fields:
      - BroadcastType
      - Transpose
    llk_inits:
      - llk_unpack_AB_init
    llk_execs:
      - llk_unpack_AB
    llk_uninits: []
    source: "tt_metal/tt-llk/tools/include/sanitizer/operation.h:209"

  OperationUnpackMatmul:
    exu: Unpack
    thread: UNPACK
    hoistable: true
    state_fields:
      - KernelBroadcastA
      - KernelBroadcastB
      - Transpose
      - CtDim
      - RtDim
      - KtDim
      - PartialFaceA
      - PartialFaceB
    llk_inits:
      - llk_unpack_AB_matmul_init
    llk_execs:
      - llk_unpack_AB_matmul
    llk_uninits: []
    source: "tt_metal/tt-llk/tools/include/sanitizer/operation.h:233"

  OperationUnpackTilize:
    exu: Unpack
    thread: UNPACK
    hoistable: false
    state_fields:
      - BlockCtDim
      - NarrowTile
    llk_inits:
      - llk_unpack_tilize_init
      - llk_unpack_tilizeA_B_init
    llk_execs:
      - llk_unpack_tilize
      - llk_unpack_tilize_block
      - llk_unpack_tilizeA_B
      - llk_unpack_tilizeA_B_block
    llk_uninits:
      - llk_unpack_tilize_uninit
    source: "tt_metal/tt-llk/tools/include/sanitizer/operation.h:287"

  OperationUnpackReduce:
    exu: Unpack
    thread: UNPACK
    hoistable: true
    state_fields:
      - PoolType
      - ReduceDim
      - FaceHeight
      - NumFaces
    llk_inits:
      - llk_unpack_reduce_init
      - llk_unpack_AB_reduce_init
    llk_execs:
      - llk_unpack_reduce
      - llk_unpack_AB_reduce
    llk_uninits:
      - llk_unpack_reduce_uninit
    source: "tt_metal/tt-llk/tools/include/sanitizer/operation.h:311"

  OperationUnpackFastTilizeWh:
    exu: Unpack
    thread: UNPACK
    hoistable: false
    state_fields:
      - FullDim
    llk_inits:
      - llk_unpack_fast_tilize_init
    llk_execs:
      - llk_unpack_fast_tilize_block
    llk_uninits:
      - llk_unpack_fast_tilize_uninit
    source: "tt_metal/tt-llk/tools/include/sanitizer/operation.h:345"

  OperationFpuMatmul:
    exu: Fpu
    thread: MATH
    hoistable: true
    state_fields:
      - MathFidelity
      - ThrottleLevel
      - CtDim
      - RtDim
    llk_inits:
      - llk_math_matmul_init
    llk_execs:
      - llk_math_matmul
    llk_uninits: []
    source: "tt_metal/tt-llk/tools/include/sanitizer/operation.h:364"

  OperationFpuEltwiseBinary:
    exu: Fpu
    thread: MATH
    hoistable: true
    state_fields:
      - EltwiseBinaryType
      - BroadcastType
      - MathFidelity
      - ReuseDest
      - AccToDest
      - FaceHeight
      - NumFaces
      - NumFacesCDim
    llk_inits:
      - llk_math_eltwise_binary_init
      - llk_math_eltwise_binary_init_with_operands
    llk_execs:
      - llk_math_eltwise_binary
    llk_uninits: []
    source: "tt_metal/tt-llk/tools/include/sanitizer/operation.h:398"

  OperationFpuReduce:
    exu: Fpu
    thread: MATH
    hoistable: true
    state_fields:
      - PoolType
      - ReduceDim
      - MathFidelity
      - NumFacesRDim

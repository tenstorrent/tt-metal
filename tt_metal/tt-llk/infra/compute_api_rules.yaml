    llk_execs:
      - llk_math_eltwise_unary_datacopy
      - llk_math_eltwise_unary_datacopy_block
    llk_uninits: []
    source: "tt_metal/tt-llk/tools/include/sanitizer/operation.h:491"

  OperationFpuFastTilizeWh:
    exu: Fpu
    thread: MATH
    hoistable: false

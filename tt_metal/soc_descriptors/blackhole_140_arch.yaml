# Eth and worker dram endpoints represent subchannel id from dram array for each noc.
# For example, a dram view where channel is 0 and worker_endpoint is [1, 2] would resolve to dram core at position [0,2] for noc1 which is 0-11.
# Endpoint assignment for noc0 needs to be the same endpoint used by CMFW to read DRAM telemetry to avoid SYS-1419.
dram_views:
  [
    {
      channel: 0,
      eth_endpoint: [2, 1],
      worker_endpoint: [2, 1],
      address_offset: 0
    },
    {
      channel: 1,
      eth_endpoint: [0, 1],
      worker_endpoint: [0, 1],
      address_offset: 0
    },
    {
      channel: 2,
      eth_endpoint: [0, 1],
      worker_endpoint: [0, 1],
      address_offset: 0
    },
    {
      channel: 3,
      eth_endpoint: [0, 1],
      worker_endpoint: [0, 1],
      address_offset: 0
    },
    {
      channel: 4,
      eth_endpoint: [2, 1],
      worker_endpoint: [2, 1],
      address_offset: 0
    },
    {
      channel: 5,
      eth_endpoint: [2, 1],
      worker_endpoint: [2, 1],
      address_offset: 0
    },
    {
      channel: 6,
      eth_endpoint: [2, 1],
      worker_endpoint: [2, 1],
      address_offset: 0
    },
    {
      channel: 7,
      eth_endpoint: [2, 1],
      worker_endpoint: [2, 1],
      address_offset: 0
    }
  ]

# Replaces dram_views when a DRAM channel is harvested and NOC translation is on. Entry k is DRAM view k,
# placed on the k-th unharvested channel in translated order: by translated x, then translated y. Firmware
# translation keeps the column with no harvested channel at the lower translated x and moves the harvested
# channel's rows to the bottom of the other column, so view k reaches the same translated cores whichever
# channel is harvested. Subchannel s of a channel sits s translated rows below its subchannel 0.
# Subchannel 1 is never an endpoint: the syseng firmware runs on noc2axi port 0 or 2 (port 2 only for
# GDDR0), and port 1 is subchannel 1 in both columns, so every view keeps a free subchannel for DRISC
# firmware whichever channel it lands on. The syseng firmware's tile is therefore one of the view's two
# endpoints, NOC0 or NOC1 depending on the channel, and Metal runs DRISC firmware on neither.
# Endpoints alternate by row within each column (views 0-3 are the first column, 4-6 the second). If
# one NOC used subchannel 0 in every view, a column's GDDR rows 0 and 1 (NOC0 y 0 and 2) would share the
# nearest worker row (both clamp to worker row 2); alternating keeps every view's nearest worker distinct
# on both NOCs for every harvested channel.
# Reset the board when a run that booted DRISC firmware used the other table: DRISC firmware leaves its
# non-endpoint NIUs forwarding to DRISC L1 instead of GDDR until reset, and the tables' endpoints differ.
harvested_dram_views:
  [
    { eth_endpoint: [2, 0], worker_endpoint: [2, 0], address_offset: 0 },
    { eth_endpoint: [0, 2], worker_endpoint: [0, 2], address_offset: 0 },
    { eth_endpoint: [2, 0], worker_endpoint: [2, 0], address_offset: 0 },
    { eth_endpoint: [0, 2], worker_endpoint: [0, 2], address_offset: 0 },
    { eth_endpoint: [2, 0], worker_endpoint: [2, 0], address_offset: 0 },
    { eth_endpoint: [0, 2], worker_endpoint: [0, 2], address_offset: 0 },
    { eth_endpoint: [2, 0], worker_endpoint: [2, 0], address_offset: 0 },
  ]

dram_view_size:

# QSR3.A2 craq-sim descriptor. The package is one UMD chip containing three
# Quasar dies in one flat descriptor-frame NOC coordinate space.
#
# UNCONFIRMED: 12 x 19 is the descriptor occupancy bound. No source states the
# strapped QSR3.A2 NOC sizes or the coordinate frame reported by silicon.
grid:
  x_size: 12
  y_size: 19

arc:
  []

pcie:
  []

# DELIBERATE DEVIATION: each 1 GB DRAM channel is modelled at the facing Quasar
# D2D proxy coordinate, not at the true Mimir coordinate one hop farther out.
# Silicon capacity is 6 GB per interface; 1 GB is the approved UNCONFIRMED
# bring-up placeholder.
dram:
  [[1-4],
  [1-5],
  [10-2],
  [10-3],
  [1-10],
  [1-11],
  [10-8],
  [10-9],
  [1-16],
  [1-17],
  [10-14],
  [10-15]]

dram_views:
  [
    {
      channel: 0,
      eth_endpoint: [0,0],
      worker_endpoint: [0,0],
      address_offset: 0
    },
    {
      channel: 1,
      eth_endpoint: [0,0],
      worker_endpoint: [0,0],
      address_offset: 0
    },
    {
      channel: 2,
      eth_endpoint: [0,0],
      worker_endpoint: [0,0],
      address_offset: 0
    },
    {
      channel: 3,
      eth_endpoint: [0,0],
      worker_endpoint: [0,0],
      address_offset: 0
    },
    {
      channel: 4,
      eth_endpoint: [0,0],
      worker_endpoint: [0,0],
      address_offset: 0
    },
    {
      channel: 5,
      eth_endpoint: [0,0],
      worker_endpoint: [0,0],
      address_offset: 0
    },
    {
      channel: 6,
      eth_endpoint: [0,0],
      worker_endpoint: [0,0],
      address_offset: 0
    },
    {
      channel: 7,
      eth_endpoint: [0,0],
      worker_endpoint: [0,0],
      address_offset: 0
    },
    {
      channel: 8,
      eth_endpoint: [0,0],
      worker_endpoint: [0,0],
      address_offset: 0
    },
    {
      channel: 9,
      eth_endpoint: [0,0],
      worker_endpoint: [0,0],
      address_offset: 0
    },
    {
      channel: 10,

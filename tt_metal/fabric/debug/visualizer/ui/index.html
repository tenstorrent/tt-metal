<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fabric Debug Visualizer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="css/ui.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div class="shell">
    <header>
      <div class="title-row">
        <h1>Fabric Debug Visualizer</h1>
        <button type="button" class="ghost" id="open-other" hidden>Open a different capture</button>
      </div>
    </header>

    <main>
      <section id="load-view">
        <div id="capture-list"><p class="empty-list">Looking for captures…</p></div>
        <p id="load-status" class="load-status" role="status"></p>

        <h2 class="label">Or open a folder from this computer</h2>
        <label class="drop" id="drop-zone" tabindex="0" for="folder-input">
          <svg viewBox="0 0 48 48" aria-hidden="true">
            <path d="M5 13a3 3 0 0 1 3-3h10l4 5h18a3 3 0 0 1 3 3v17a3 3 0 0 1-3 3H8a3 3 0 0 1-3-3z"/>
            <path d="M24 31V21m0 0-4 4m4-4 4 4"/>
          </svg>
          <span class="primary">Drop a folder here</span>
          <span class="secondary">or <u>click to choose a folder</u>: a logs folder, a run folder or a capture folder.
            It's read in your browser, and only its decoded files and .bin files are opened.</span>
        </label>
        <input type="file" id="folder-input" webkitdirectory multiple hidden>
      </section>

      <div id="capture-view" class="panels" hidden>
        <section id="summary" aria-label="Capture summary"></section>
        <section class="panel" id="hardware-panel" aria-label="Hardware"></section>
        <section class="panel" id="chip-panel" aria-label="Chip" hidden></section>
        <section class="panel" id="router-panel" aria-label="Router" hidden></section>
      </div>
    </main>
  </div>
</body>
</html>

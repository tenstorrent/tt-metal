  - models/demos/xing40_a4b_d_p/bringup/spec.yaml
- id: R.2
  title: Reference matches HF per layer and on logits (fp32)
  step: reference
  deps:
  - R.1
  gate:
    cmd: python -m models.demos.common.bringup.reference.check_hf --seq 2048
    metrics:
      pcc_hidden_L*: '>= 0.9999'
      pcc_logits: '>= 0.9999'
      top1_match_frac: '>= 0.99'
  paths: &id001
  - models/demos/xing40_a4b_d_p/reference
  - models/demos/xing40_a4b_d_p/bringup/hooks.py
  - models/demos/xing40_a4b_d_p/__init__.py
- id: R.3
  title: Reference chunked == one-shot (4096 in 2048) and block graphs replay exactly
  step: reference
  deps:
  - R.2
  gate:
    cmd: python -m models.demos.common.bringup.reference.check_reference --seq 4096 --chunk 2048
    metrics:
      pcc_hidden: '>= 0.99999'
      pcc_state_min: '>= 0.99999'
      graph_errors: == 0
      boundaries_missing: == 0
      graph_replay_maxabs: <= 0
  paths: *id001
- id: G.s4096
  title: 'Golden s4096: 4096 tokens in 2048-token chunks, full dumps'
  step: goldens
  deps:
  - R.3
  gate:
    cmd: python -m models.demos.common.bringup.reference.generate_golden --rung s4096
    metrics:
      golden_layers: == 40
      golden_chunks: == 2
      golden_hash_ok: == 1
- id: G.s16384

agents:
  rules:
  - 'Always use 2D fabric: the mesh (4x2) opens with ttnn.FabricConfig.FABRIC_2D (spec box.device_params). Configure CCLs,
    dispatch and combine for it; never open a device or build a test with FABRIC_1D, FABRIC_1D_RING or a torus.'
  - 'Parallelization (owner): SP=4 x TP=2 on the 4x2 mesh, the Kimi K2.7 4x4 layout (https://claude.ai/artifact/4MC3c1hvkErCYxByJwdPZ9)
    with 2 columns. Rows (axis 0, 4 chips) split the tokens of each chunk (sequence parallel, 1280 of 5120 per row, balanced
    for the causal mask, e.g. hy4_preview_d_p''s block-cyclic MLA latent cache or a zigzag split); columns (axis 1, 2 chips)
    split the weights (tensor parallel: 16 of 32 heads per chip, dense MLP / shared expert by intermediate, reductions within
    the row). Routed experts: 8 per chip, dispatch / combine up and down each column (axis 0), then a reduce over the 2 columns.
    The mHC residual streams stay split by row, like the tokens, never replicated over all 8 chips. hy4_preview_d_p (SP2 x
    TP2 with MLA + iHC, tt/ihc.py, tt/layout.py) is the closest working code. Do not fall back to a replicated-residual TP=8
    plan. Plan role: think hard before you write the plan. Work out, for every step, where each tensor lives on the 4x2 grid
    and which collective moves it (axis and size), how the causal work is balanced over the 4 rows at the last chunk, how
    the latent cache is laid out and gathered, and how dispatch / combine run on 4-chip columns with the existing forks; say
    where the Kimi layout does not carry over and why.'
  - 'Attention SDPA (owner, 06:35): turn off fp32_dest_acc_en for ring_mla (compute_kernel_config fp32_dest_acc_en=False,
    still HiFi4) so it takes the ring-joint streaming compute path, which is much faster (ring_joint_sdpa_program_factory.cpp:
    use_streaming_compute = !fp32_dest_acc_en; with fp32 dest the kv_actual_isl path TT_FATALs). Use ring_mla over axis 0
    as planned, not the all_gather + chunked_flash_mla_prefill fallback. fp32 accumulation is not an owner rule (rule 7 is
    HiFi4 only); the plan''s ''HiFi4 + fp32 accumulation everywhere'' does not bind here. The first attention attempt''s work
    (ring_mla hit that TT_FATAL; chunked fallback overflowed L1 at fp32 dest) is in /localdev/dnijemcevic/bringup/xing40_a4b_d_p/runs/run1/wip_attention_attempt1
    (attention.py, hooks.diff): reuse it.'
  - 'Text decoder only: never build, load or test the MTP layer (model.layers.40.*: eh_proj, enorm, hnorm, shared_head). There
    is no vision or audio part.'
  - 'Closest repo models: glm53_flash_d_p (the same mHC: 4 streams, 20-iteration Sinkhorn, tt/residual.py mix as one matmul;
    reference/glm_ref.py hc_weights; MLA pieces), hy4_preview_d_p (MLA latent cache + hyper-connection gates + DeepSeek-style
    sigmoid noaux_tc MoE with a shared expert on Blackhole p150b; tt/ihc.py), deepseek_v3_d_p (tt/mla, tt/mhc; dense DeepSeek-V3
    MLA + YaRN), mimo_v2_6_d_p_2x2 (MoE dispatch / combine on a 2D mesh). Differences to check: Xing''s attention is dense
    causal MLA (no indexer, no sinks, no output gate); mHC comb logits are clamped to [-30, 30] and row-max-subtracted before
    exp; the final hidden is the plain mean of the 4 streams, then norm; RoPE is interleaved (config rope_interleave true)
    with YaRN (factor 64, softmax scale x mscale^2).'
  - 'Be aware of the bring-up ops in ttnn/ttnn/bringup (INDEX.md: dispatch, combine, offset_cumsum, unified_routed_expert_ffn,
    sdpa, rms_norm_ttnn, indexer_score); use them as you see fit. Never edit an existing TTNN op: fork it (skill bringup-fork-op)
    or extend an existing fork behind an option.'

# MiMo-V2.6-Flash prefill runner (layers 0-5: GA+dense, 4x SWA+MoE, GA+MoE), 1 rank, QuietBox 2x2 (SP=2 x TP=2),
# Gate 1 mock migration (publishes the KV chunk table + device map for the producer's device-less KV read-back).
# Launch: models/demos/common/prefill/runners/run_pipeline_prefill.sh models/demos/mimo_v2_d_p/tt/runners/manifests/mimo_v2_binding_2x2_mock.yaml localhost:1
# Galaxy: same file with PREFILL_SP=8 / PREFILL_TP=4, the galaxy mesh graph descriptor and PREFILL_NUM_LAYERS=48.
mesh_graph_desc_path: tt_metal/fabric/mesh_graph_descriptors/p150_x4_mesh_graph_descriptor.textproto
rank_bindings:
  - {rank: 0, mesh_id: 0, mesh_host_rank: 0, env_overrides: {}}
global_env:
  PREFILL_MANIFEST: "models/demos/mimo_v2_d_p/tt/runners/manifests/mimo_v2_d_p.json"
  PREFILL_MODEL: "mimo_v2_d_p"
  PREFILL_NUM_LAYERS: "6"
  PREFILL_SP: "2"
  PREFILL_TP: "2"
  PREFILL_FABRIC_MODE: "2d"
  PREFILL_MAX_SEQ_LEN: "16384"
  PREFILL_CHUNK_SIZE: "4096"        # chunk/SP must be >= sliding window (128); chunk-aligned starts (SWA ring)
  PREFILL_NUM_USERS: "2"
  PREFILL_H2D_SERVICE_ID: "mimo_v2_prefill"
  PREFILL_ENABLE_LAYER_ACK: "1"
  PREFILL_HF_MODEL: "/localdev/mstaletovic/hf_models/MiMo-V2.6-Flash-RL"
  LOGURU_LEVEL: "INFO"
  PREFILL_MOCK_MIGRATION: "1"
  PREFILL_MIGRATION_TABLE_PATH: "/tmp/mimo_v2_prefill_kv_chunk_table.pb"
  PREFILL_MIGRATION_DEVICE_MAP_PATH: "/tmp/mimo_v2_prefill_kv_device_map.json"

# Mistral-Small-4 — KVM file-export rank binding: 1 rank, SP=8 x TP=4 on one BH galaxy.
#
# The KVM (tt-d-gen kv_manager) path, which replaces the deprecated tt-llm-engine migration layer.
# Nothing has to be running first: the runner writes the KV chunk table and the device map to disk
# and serves. No MigrationLayerClient, no /mig_ep* shm queues, no WORKER_READY handshake
# (prefill_runner.py:788, the `elif _file_export:` branch). KVM loads both files at startup, and
# kv_byte_verify reads them the same way.
#
# The exported device map is `<mesh_id> <chip_id> <umd_id>` per line, which is exactly the format
# kv_manager's own print_local_device_map emits.
#
# Short context on purpose: Gate 2 proves the DRAM -> transport -> DRAM copy, not model depth.
# 2 chunks x 4 slots at 10240 keeps the KV budget well inside one galaxy, where 11 chunks x 4 slots
# at 56320 would be ~5.5x the per-slot cache that Gate 1 already needed two slots of.
rank_bindings:
  - {rank: 0, mesh_id: 0, mesh_host_rank: 0, env_overrides: {}}

mesh_graph_desc_path: tt_metal/fabric/mesh_graph_descriptors/single_bh_galaxy_torus_y_graph_descriptor.textproto

global_env:
  PREFILL_MANIFEST: "models/demos/deepseek_v3_d_p/tt/runners/manifests/mistral4.json"

  # torus_y, not torus_xy: this galaxy does not wrap the TP axis, and a RING collective on it
  # hangs in FDMeshCommandQueue::wait_for_outstanding_reads after the mesh opens fine.
  PREFILL_FABRIC_MODE: "2d_torus_y"
  PREFILL_SP: "8"
  PREFILL_TP: "4"
  PREFILL_NUM_LAYERS: "36"
  PREFILL_CHUNK_SIZE: "5120"
  PREFILL_MAX_SEQ_LEN: "10240"
  PREFILL_H2D_SERVICE_ID: "mistral4_prefill"
  # Do NOT set PREFILL_GATE_FALLBACK_MODE here. Mistral's adapter defaults to GPT_DEVICE
  # (softmax -> top-4 -> renormalise). DEVICE_FP32 is the "sigmoid" family, and crossing
  # families silently routes to the wrong experts -- no error, just degraded KV from the
  # first MoE layer onward (see GATE_MODE_FAMILY in tt_moe_gate_prefill.py).
  # Must cover every dst slot: src 0,1 -> dst 2,3.
  PREFILL_NUM_USERS: "4"

  PREFILL_USE_TRACE: "1"
  PREFILL_LAYER_ACK_D2H: "1"

  PREFILL_HF_MODEL: "/mnt/models/blaze/mistralai/Mistral-Small-4-119B-2603"
  PREFILL_TTNN_CACHE: "/mnt/models/blaze/mistralai/Mistral-Small-4-Cache/CI"
  PREFILL_TRACE_DIR: "/mnt/models/blaze/mistralai/Mistral-Small-4-Cache/golden/mistral4_56320_36L"

  PREFILL_ENABLE_MIGRATION: "1"
  # The whole point: export to files instead of attaching a client. Mutually exclusive with the
  # queue/client settings below, which are deliberately absent.
  PREFILL_MIGRATION_EXPORT_TO_FILE: "1"
  PREFILL_MIGRATION_TABLE_PATH: "/tmp/mistral4_kv_chunk_table.pb"
  PREFILL_MIGRATION_DEVICE_MAP_PATH: "/tmp/mistral4_kv_device_map.txt"  # text, not JSON, on this path

  # KVM boots its own kernel on the DRAM RISCs. tt-metal auto-enables the Blackhole DRAM
  # programmable cores on this firmware bundle, which claims the same cores; force them off
  # so a KVM instance can attach alongside a live runner.
  TT_METAL_ENABLE_BLACKHOLE_DRAM_PROGRAMMABLE_CORES: "0"

  LOGURU_LEVEL: "INFO"

# Mistral-Small-4 — Gate 1 (mock migration) rank binding: 1 rank, SP=8 x TP=4 on one BH galaxy.
#
# The runner publishes the KV chunk table + the fabric-node -> ASIC device map and then serves H2D
# pushes; no migration_endpoint / worker is involved. prefill_producer reads both files back
# device-lessly (read_dram_umd) and PCCs each slot's KV against the golden.
#
# Launch:
#   ./models/demos/common/prefill/runners/run_pipeline_prefill.sh \
#     models/demos/deepseek_v3_d_p/tt/runners/manifests/mistral4_binding_mock_migration_1rank.yaml $HOST:1
#
# This is the SP=8 x TP=4 single-rank topology, not the PP=4 x [8,1] one the mistral4_pp4_kv_pcc CI
# leg covers. Different device groups, therefore a different table — which is the gap this closes.
#
# tt-run forwards only TT_/ARCH_/WH_/TTNN_/DEEPSEEK_/MESH_ prefixed shell vars, so every PREFILL_* the
# runner needs must live here (ENV_PASSTHROUGH_PREFIXES in ttnn/ttnn/distributed/ttrun.py).
rank_bindings:
  - {rank: 0, mesh_id: 0, mesh_host_rank: 0, env_overrides: {}}

mesh_graph_desc_path: tt_metal/fabric/mesh_graph_descriptors/single_bh_galaxy_torus_y_graph_descriptor.textproto

global_env:
  PREFILL_MANIFEST: "models/demos/deepseek_v3_d_p/tt/runners/manifests/mistral4.json"

  # torus_y ([8,4] RING,LINE): SP wraps, TP stays a line. torus_xy declares TP as RING too, and this
  # galaxy does not wrap that axis -- the mesh opens, then the first TP all_gather never completes
  # (hangs in FDMeshCommandQueue::wait_for_outstanding_reads). Same reason the PP4 binding uses torus_y.
  # A "could not fit" at bring-up instead means the eth links need retraining: tt-smi -glx_reset_auto.
  PREFILL_FABRIC_MODE: "2d_torus_y"
  PREFILL_SP: "8"
  PREFILL_TP: "4"
  PREFILL_NUM_LAYERS: "36"
  PREFILL_CHUNK_SIZE: "5120"
  PREFILL_MAX_SEQ_LEN: "56320"
  PREFILL_H2D_SERVICE_ID: "mistral4_prefill"
  # Do NOT set PREFILL_GATE_FALLBACK_MODE here. Mistral's adapter defaults to GPT_DEVICE
  # (softmax -> top-4 -> renormalise). DEVICE_FP32 is the "sigmoid" family, and crossing
  # families silently routes to the wrong experts -- no error, just degraded KV from the
  # first MoE layer onward (see GATE_MODE_FAMILY in tt_moe_gate_prefill.py).
  # mistral4.json pins 1; two slots so the table's slot axis is exercised at all.
  PREFILL_NUM_USERS: "2"

  PREFILL_HF_MODEL: "/mnt/models/blaze/mistralai/Mistral-Small-4-119B-2603"
  PREFILL_TTNN_CACHE: "/mnt/models/blaze/mistralai/Mistral-Small-4-Cache/CI"
  PREFILL_TRACE_DIR: "/mnt/models/blaze/mistralai/Mistral-Small-4-Cache/golden/mistral4_56320_36L"

  PREFILL_MOCK_MIGRATION: "1"
  PREFILL_MIGRATION_TABLE_PATH: "/tmp/mistral4_kv_chunk_table.pb"
  PREFILL_MIGRATION_DEVICE_MAP_PATH: "/tmp/mistral4_kv_device_map.json"

  LOGURU_LEVEL: "INFO"

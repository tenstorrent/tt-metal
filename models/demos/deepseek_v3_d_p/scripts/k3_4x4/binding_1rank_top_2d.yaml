rank_bindings:
  - {rank: 0, mesh_id: 0, mesh_host_rank: 0, env_overrides: {TT_VISIBLE_DEVICES: "0,4,28,24,1,5,29,25,2,6,30,26,3,7,31,27"}}

mesh_graph_desc_path: models/demos/deepseek_v3_d_p/experimental_descriptors/single_bh_galaxy_subtorus_x4_graph_descriptor.textproto

global_env:

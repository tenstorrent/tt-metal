# MiniMax-M3 — media rank binding: 1 rank / 1 BH galaxy, REQUEST mode, media refs on.
#
# Same shape as m3_binding_mock_migration_1rank.yaml with the media path enabled. The text-only
# latency run (tests/slurm/m3_media_text_only_latency.sh) reuses this file with
# PREFILL_MEDIA_MAX_REFS rewritten to 0, so every other key stays one source of truth across both arms.
#
# Launch:
#   ./models/demos/common/prefill/runners/run_pipeline_prefill.sh \
#     models/demos/minimax_m3/tt/runners/manifests/m3_binding_media_1rank.yaml $HOST:1
rank_bindings:
  - {rank: 0, mesh_id: 0, mesh_host_rank: 0, env_overrides: {}}

mesh_graph_desc_path: tt_metal/fabric/mesh_graph_descriptors/single_bh_galaxy_torus_x_graph_descriptor.textproto

global_env:
  PREFILL_MANIFEST: "models/demos/minimax_m3/tt/runners/manifests/minimax_m3.json"
  M3_INDEX_CACHE_BF16: "0"

  PREFILL_FABRIC_MODE: "2d"
  PREFILL_SP: "8"
  PREFILL_TP: "4"
  PREFILL_CHUNK_SIZE: "5120"
  PREFILL_MAX_SEQ_LEN: "10240"
  PREFILL_H2D_SERVICE_ID: "m3_prefill"
  PREFILL_NUM_USERS: "2"
  PREFILL_TRACE_DIR: "/mnt/weka/model-cache/scratch/minimax/MiniMax-M3-cache/prefill/golden/longbook_10240"

  # 11 refs is the H2D socket page cap at a 512 B page (prefill_runner.py asserts it).
  PREFILL_MEDIA_MAX_REFS: "11"
  PREFILL_MEDIA_STUB_EMBEDDINGS: "1"

  PREFILL_ENABLE_MIGRATION: "0"
  PREFILL_MIGRATION_TABLE_PATH: "/tmp/m3_kv_chunk_table.pb"
  PREFILL_MIGRATION_DEVICE_MAP_PATH: "/tmp/m3_kv_device_map.json"
  # TtPrefillRuntime has no capture_trace, and the runner refuses media refs with a trace anyway.
  PREFILL_USE_TRACE: "0"

  LOGURU_LEVEL: "INFO"

# MiniMax-M3 — Gate 1 (mock migration) rank binding: 1 rank / 1 BH galaxy, REQUEST mode.
#
# The runner serializes the KV chunk table + the fabric-node -> ASIC device map and then serves H2D
# pushes; no migration_endpoint / worker is involved. prefill_producer reads both files back device-lessly
# (read_dram_umd) and PCCs each slot's KV against the golden.
#
# Launch:
#   ./models/demos/common/prefill/runners/run_pipeline_prefill.sh \
#     models/demos/minimax_m3/tt/runners/manifests/m3_binding_mock_migration_1rank.yaml $HOST:1
#
# tt-run forwards only TT_/ARCH_/WH_/TTNN_/DEEPSEEK_/MESH_ prefixed shell vars, so every PREFILL_* the
# runner needs must live here (ENV_PASSTHROUGH_PREFIXES in ttnn/ttnn/distributed/ttrun.py).
rank_bindings:
  - {rank: 0, mesh_id: 0, mesh_host_rank: 0, env_overrides: {}}

mesh_graph_desc_path: tt_metal/fabric/mesh_graph_descriptors/single_bh_galaxy_torus_x_graph_descriptor.textproto

global_env:
  PREFILL_MANIFEST: "models/demos/minimax_m3/tt/runners/manifests/minimax_m3.json"

  # Request mode drives the H2D input over a MeshSocket, which routes on 2D fabric.
  PREFILL_FABRIC_MODE: "2d"
  PREFILL_SP: "8"
  PREFILL_TP: "4"
  PREFILL_CHUNK_SIZE: "5120"
  PREFILL_MAX_SEQ_LEN: "10240"
  PREFILL_H2D_SERVICE_ID: "m3_prefill"
  PREFILL_NUM_USERS: "2"
  PREFILL_TRACE_DIR: "/data/philei/models/minimax-m3-prefill-cache/golden/longbook_10240"

  PREFILL_MOCK_MIGRATION: "1"
  PREFILL_MIGRATION_TABLE_PATH: "/tmp/m3_kv_chunk_table.pb"
  PREFILL_MIGRATION_DEVICE_MAP_PATH: "/tmp/m3_kv_device_map.json"
  # Selects the host-callback ack transport, the only one this runtime implements — it enables no
  # tracing, since the runtime has no capture_trace.
  PREFILL_USE_TRACE: "1"

  LOGURU_LEVEL: "INFO"

# MiniMax-M3 — media producer manifest: drive the runner with synthetic images, one of which spans
# two chunks (5000 + 300 tokens crosses the 5120 chunk boundary).
#
# Pairs with m3_binding_media_1rank.yaml.
#
#   python -m models.demos.common.prefill.runners.prefill_producer \
#     --manifest models/demos/minimax_m3/tt/runners/manifests/m3_producer_media.yaml

model:
  variant: minimax_m3
  num_layers: 60
  max_seq_len: 10240
  chunk_size: 5120

transport:
  sp: 8
  tp: 4
  h2d_service_id: m3_prefill      # [MATCH RUNNER]
  connect_timeout_s: 60

workload:
  num_users: 2
  chunks: "2"
  max_requests: 2
  interleave: round_robin
  # No golden exists for a media prompt: the stub embeddings replace token embeddings, so the KV
  # differs from the text-only longbook_10240 trace by construction. Correctness of the splice is
  # covered by test_media_splice_vs_ref.py at 8x4; this run checks the refs reach the runner.
  check_pcc: false
  trace_dir: /mnt/weka/model-cache/scratch/minimax/MiniMax-M3-cache/prefill/golden/longbook_10240

migration:
  issue: false

env:
  PREFILL_MIGRATION_TABLE_PATH: /tmp/m3_kv_chunk_table.pb        # [MATCH RUNNER]
  PREFILL_MIGRATION_DEVICE_MAP_PATH: /tmp/m3_kv_device_map.json  # [MATCH RUNNER]
  M3_INDEX_CACHE_BF16: "0"
  PREFILL_STANDALONE_CHUNKED_PCC: "0.88"

  PREFILL_MEDIA_MAX_REFS: "11"                   # [MATCH RUNNER]
  PREFILL_PRODUCER_MEDIA: "100:50,5000:300"      # second image crosses the chunk boundary
  PREFILL_MEDIA_STUB_EMBEDDINGS: "1"             # [MATCH RUNNER]

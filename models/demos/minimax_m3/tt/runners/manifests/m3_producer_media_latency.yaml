# MiniMax-M3 - text-only latency producer manifest: no images, many chunks, KV checked.
#
# Pairs with m3_binding_media_1rank.yaml (and its refs0 rewrite) for
# tests/slurm/m3-galaxy-media-text-latency.sh. Deliberately NOT m3_producer_media.yaml: that one
# injects images and so has no golden to check against, while this one is the text-only workload
# #62157 wants the latency of.
#
# max_requests 16 over 2 slots gives 32 chunks per arm, so 30 inter-chunk samples survive dropping
# each arm's warmup chunk. At the observed spread (sd ~9.6 ms on ~498 ms) that resolves a ~1.4%
# regression; the 4 chunks of the first attempt resolved only ~5%.

model:
  variant: minimax_m3
  num_layers: 60
  max_seq_len: 10240
  chunk_size: 5120

transport:
  sp: 8
  tp: 4
  h2d_service_id: m3_prefill      # [MATCH RUNNER]
  connect_timeout_s: 60

workload:
  num_users: 2
  chunks: "2"
  max_requests: 16                # slots are reused; 16 requests x 2 chunks = 32 chunks per arm
  interleave: round_robin
  check_pcc: true                 # text-only, so the longbook_10240 golden applies
  trace_dir: /mnt/weka/model-cache/scratch/minimax/MiniMax-M3-cache/prefill/golden/longbook_10240

migration:
  issue: false

env:
  PREFILL_MIGRATION_TABLE_PATH: /tmp/m3_kv_chunk_table.pb        # [MATCH RUNNER]
  PREFILL_MIGRATION_DEVICE_MAP_PATH: /tmp/m3_kv_device_map.json  # [MATCH RUNNER]
  M3_INDEX_CACHE_BF16: "0"
  PREFILL_STANDALONE_CHUNKED_PCC: "0.88"

  # Sizes the H2D metadata; the refs0 arm rewrites this to 0 here and in the binding together.
  PREFILL_MEDIA_MAX_REFS: "11"                   # [MATCH RUNNER]
  PREFILL_MEDIA_STUB_EMBEDDINGS: "1"             # [MATCH RUNNER]
  # No PREFILL_PRODUCER_MEDIA on purpose: this arm pair measures text-only latency with the refs
  # path compiled in and off, which is what #62157 asks to be unchanged within noise.

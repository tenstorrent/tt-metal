# MiniMax-M3 — Gate 1 with packed forwards: push 2 slots x 10 chunks of 1024 tokens, 4 chunks per forward
# (the last forward carries both slots), then read the KV back device-lessly and PCC it against the golden.
#
# Pairs with m3_binding_mock_migration_packed_1rank.yaml (PREFILL_ENABLE_MIGRATION=0). No migration endpoint.
#
#   python -m models.demos.common.prefill.runners.prefill_producer \
#     --manifest models/demos/minimax_m3/tt/runners/manifests/m3_producer_mock_migration_packed.yaml
#
# prefill_producer (not migration_driver): this gate migrates nothing.

model:
  variant: minimax_m3
  num_layers: 60
  max_seq_len: 10240
  chunk_size: 1024
  forward_tokens_budget: 4096     # [MATCH RUNNER]

transport:
  sp: 8
  tp: 4
  h2d_service_id: m3_prefill      # [MATCH RUNNER]
  connect_timeout_s: 60

workload:
  num_users: 2
  chunks: "10"
  max_requests: 2                 # one resident request per slot
  interleave: round_robin
  check_pcc: true                 # this IS the gate: per-slot read-back vs golden
  trace_dir: /mnt/weka/model-cache/scratch/minimax/MiniMax-M3-cache/prefill/golden/longbook_10240

migration:
  issue: false

env:
  PREFILL_MIGRATION_TABLE_PATH: /tmp/m3_kv_chunk_table.pb        # [MATCH RUNNER]
  PREFILL_MIGRATION_DEVICE_MAP_PATH: /tmp/m3_kv_device_map.json  # [MATCH RUNNER]
  # Must match the runner — decides the index_k chunk size, hence the read-back decoder.
  M3_INDEX_CACHE_BF16: "0"
  PREFILL_STANDALONE_CHUNKED_PCC: "0.88"

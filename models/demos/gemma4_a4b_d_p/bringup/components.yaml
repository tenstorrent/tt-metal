- block_type: model
  step: embed
  tag: COMPOSED
  ttnn: ttnn.embedding (replicated bf16 table [262144, 2816]) -> ttnn.mul (sqrt(2816), fp32-rounded constant)
  reuse: models/demos/ernie45_d_p/tt (embedding from the engine's uint32 device tokens), models/demos/gemma4/tt/model.py
  searched:
  - 'repo_map: Prefill engine contract'
  - 'known_issues: Engine input (uint32 ROW_MAJOR, padded tail)'
  notes: Input is the engine's uint32 device tensor; positions >= actual_end are masked downstream.
- block_type: model
  step: final_norm
  tag: NATIVE
  ttnn: ttnn.rms_norm
  reuse: models/demos/gemma4/tt/rms_norm.py
  notes: model.language_model.norm; replicated.
- block_type: model
  step: lm_head
  tag: COMPOSED
  ttnn: ttnn.linear (vocab-sharded tied embedding, 65536 rows per chip, last tokens only) -> ttnn.all_gather (or gather on
    host) -> 30 * tanh(x / 30) softcap
  reuse: models/demos/ernie45_d_p/tt (vocab-sharded LM head, gather on host), models/demos/gemma4/tt/model.py (softcap on
    device)
  searched:
  - 'repo_map: A worked bring-up (ernie45_d_p)'
  - grep final_logit_softcapping models/demos/gemma4/tt
  notes: Prefill needs only the last-token logits; the tied weight is kept as a second, transposed, vocab-sharded copy (0.37
    GB per chip).

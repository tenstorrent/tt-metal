    cmd: python -m models.demos.common.bringup.reference.generate_golden --rung s56320
    metrics:
      golden_layers: == 30
      golden_chunks: == 11
      golden_hash_ok: == 1
- id: B.1
  title: 'Box: mesh opens with the spec''s device params, collectives are exact'
  step: box
  deps: []
  gate:
    cmd: scripts/run_safe_pytest.sh --run-all models/demos/common/bringup/tests/test_box.py
    metrics:
      chips: == 4
      all_gather_maxabs: == 0
  device: true
- id: PL.0

# Model spec for the gated bring-up framework (models/demos/common/bringup). Written by the /bringup intake skill,
# approved by a person (python -m models.demos.common.bringup approve intake --spec <this file>).
# deepseek-ai/DeepSeek-V4.1-Flash, text decoder only (vision encoder, aligner and the DSpark/MTP draft layers skipped).
# Planned for a Blackhole Galaxy 4x4 at 512K tokens (1M on the Galaxy 8x4; owner 2026-10-15: reference-exact weights
# over context length); brought up here in partial mode on the 4-chip QuietBox (mesh 2x2):
# one layer of each kind (window-only, engram, encoder KV source, encoder reuse, decoder candidate source, decoder
# reuse, decoder re-index), as the SCALED model only (owner, F75): heads and experts cut per the plan so each chip holds
# what a 4x4 chip holds, 2048-token chunks; goldens from the scaled checkpoint. The real checkpoint is read only by the
# reference checks (R.*) and the plan check (PL.*).
model: deepseek_v41_flash_d_p                      # slug: package models/demos/<model>, commit tag [<model>][<task>]
display_name: DeepSeek-V4.1-Flash (layers 0-3, 14, 20, 21, 24)
hf_id: deepseek-ai/DeepSeek-V4.1-Flash
model_dir: models/demos/deepseek_v41_flash_d_p
hooks: models.demos.deepseek_v41_flash_d_p.bringup.hooks
num_layers: 40
prior: null
layers: "0-3,14,20,21,24"          # one of each block type (a subset result is never reported as full-model)
deploy: {box: galaxy_4x4, seq: 524288, chunk: 4096}    # the system the plan is for (F64); 1M fits only galaxy_8x4 exactly;
                                                        # chunk: the serving chunk (owner): 1024 tokens per row on the 4x4,
                                                        # 512 on the 8x4, 2048-token chunks on this 2x2 (F67)
boxes:
  galaxy_4x4:
    name: Blackhole Galaxy, 4 rows as a 4x4 torus (FABRIC_2D_TORUS_XY)
    chip: Blackhole p150b
    mesh: [4, 4]
    chip_dram_gb: 32
    device_params: {fabric_config: FABRIC_2D_TORUS_XY, l1_small_size: 24576}
    test_timeout_s: 3600
  galaxy_8x4:
    name: Blackhole Galaxy, mesh 8x4 (FABRIC_2D)
    chip: Blackhole p150b
    mesh: [8, 4]
    chip_dram_gb: 32
    device_params: {fabric_config: FABRIC_2D, l1_small_size: 24576}
    test_timeout_s: 3600
  loudbox_2x4:
    name: Blackhole LoudBox, 8x p150b, mesh 2x4 (FABRIC_2D)
    chip: Blackhole p150b
    mesh: [2, 4]
    chip_dram_gb: 32
    device_params: {fabric_config: FABRIC_2D, l1_small_size: 24576}
    test_timeout_s: 3600
  quietbox_2x2:
    name: 4x Blackhole p300c (2 cards), mesh 2x2 (FABRIC_2D)
    chip: Blackhole p300c
    mesh: [2, 2]
    chip_dram_gb: 32
    device_params: {fabric_config: FABRIC_2D, l1_small_size: 24576}   # owner: always 2D fabric
    test_timeout_s: 3600
run: {box: quietbox_2x2, mode: partial}
target: {seq: 55296, chunk: 2048, dtype: bf16}          # this run's context: 27 chunks of this box's scaled chunk 2048
ladder:                            # the scaled model (F75), every rung at this box's chunk; goldens are the scaled model's
  - {name: s4096, seq: 4096, chunk: 2048, full_dumps: true}     # 2 chunks; > the window (128) and the compressed top-k
  - {name: last, seq: 55296, chunk: 2048, golden: s55296, prefix_from_golden: true}   # golden 53k prefix, device 53k->55k
  - {name: s55296, seq: 55296, chunk: 2048}                     # all 27 chunks on device
block_types:                       # every layer exactly once; representative = the layer swap tests use
  swa:                             # attention over the 128-token window only (compress ratio 0)
    layers: [0]
    representative: 0
  swa_engram:                      # window-only attention + engram (n-gram hash table lookup into the residual)
    layers: [1]
    representative: 1
  enc_source:                      # encoder (ratio 2): owns the compressed KV, indexer keys and top-k its readers reuse
    layers: [2, 8]
    representative: 2
  enc_source_engram:               # enc_source + engram
    layers: [14]
    representative: 14
  enc_reuse:                       # encoder (ratio 2): attends over its source's compressed KV with its top-k
    layers: "3-7,9-13,15-19"
    representative: 3
  dec_candidate:                   # decoder (ratio 1) KV / index source; builds the candidate pool later indexers use
    layers: [20]
    representative: 20
  dec_reindex:                     # decoder: own top-k over layer 20's KV, restricted to the candidate pool
    layers: [24, 28, 32, 36]
    representative: 24
  dec_reuse:                       # decoder: reuses a source's KV and top-k
    layers: "21-23,25-27,29-31,33-35,37-39"
    representative: 21
state:
  kind: mixed
  # names the reference returns per layer; a reader layer reads its source's state (hooks state_sources, F65)
  tensors: [window_kv, compress_kv, compress_partial, index_k, topk_idx, candidates, engram_tail]
  by_block_type:
    swa: [window_kv]
    swa_engram: [window_kv, engram_tail]
    enc_source: [window_kv, compress_kv, compress_partial, index_k, topk_idx]
    enc_source_engram: [window_kv, compress_kv, compress_partial, index_k, topk_idx, engram_tail]
    enc_reuse: [window_kv]
    dec_candidate: [window_kv, compress_kv, index_k, topk_idx, candidates]
    dec_reindex: [window_kv, topk_idx]
    dec_reuse: [window_kv]
  fixed: [window_kv, compress_partial, engram_tail]   # not growing along the sequence (topk_idx, candidates: per position)
golden: {keep_fp32: [compress_partial]}
tests:
  waivers:                         # owner waivers (F85), signed 2026-10-16: noise-floor checks reported WAIVED, never hidden
    attn_hc: &hc_waiver "hc_fn is fp32 in the official model; the FPU holds at most 10 mantissa bits of a matmul weight (9 at HiFi4), and its fixed rounding is a per-column bias no single-pass format removes (DS41-43; split matmuls ruled out). Debug once the model produces tokens."
    ffn_hc: *hc_waiver
    experts: "owner 2026-10-22: routed-expert weights stay bfp4 (the checkpoint's fp4 width, F117) for speed, although bfp4 (3-bit mantissa, one exponent per 16) is coarser than the reference's fp4 e2m1 with a ue8m0 scale per 32: the experts step lands 0.13-0.18 from full precision with norms 4-5 % high vs a limit of 0.06-0.08, the device matching the CPU at its own formats within 0.015 (FIX.9, DS41-95); bfp8 would give 0.017. Judged end to end (the ladder passes); a better fp4->bfp4 conversion may be tried later as a pick. Owner 2026-10-22 (F158): it also covers the blocks containing the experts (swap tests swa_12 / enc_source_14: block out ~0.026-0.030 vs ~0.016-0.019); revisit if the end-to-end token evals are bad."
    indexer: "owner 2026-10-29 (DS41-150, lowbit phase 2): the index keys and query in bfloat4_b (INDEX_K_FORMAT / INDEX_Q_FORMAT=bfp4, the reference's own 4-bit width): the top-512 selection misses 7.6-15.6 % of the native selection (L02 / L14 / L20 / L24; CPU at the device format 7.6-15.7 %, the reference's own fp4 8.0-16.6 %; bf16 0.4-1.2 %), above the nudged floor at L24 (0.156 vs 0.143); in the component test the golden keys are already fp4, so bfloat4_b rounds them twice. Before: overseer under the owner's format-limit delegation (2026-10-22): the device top-k takes bf16 scores, so near-tie selections flip vs the fp32 step; CPU at the device format (fp32 scores rounded to bf16) reproduces it (1277 unexplained flips, recall 0.9946 vs the device 0.9942, layer 2; DS41-102), and DeepSeek's own bf16 code is further off (2048, recall 0.964), so the device is not below the reference's precision. The swap checks' positional match (0.0015) is an ordering artifact (reference ascending ids, device score order; the attention reads a set; F160 will compare id sets). Judged end to end (err_state_topk_idx)."
    state.topk_idx: "owner 2026-10-29 (DS41-150, lowbit phase 2): with the index keys and query in bfloat4_b the top-k state misses 17-36 % of the native ids end to end (2x2 rung last: L02 0.169, L14 0.185 vs its limit 0.165, L20 0.200, L24 0.361; bf16 0.009-0.026), the reference's own fp4 selection error; every layer output stays within its limit (worst L20 0.034 / 0.051). Accepted for the 3.6x smaller index ring traffic and key memory."
    engram_rows: "owner 2026-10-28: the engram rows go to the device as bfloat8_b (ENGRAM_ROWS=bfp8), packed from the table's 8-bit bytes with no float on the host; bfp8 (one exponent per 16, 7-bit magnitude) cannot hold every e4m3 x 2^k value, so the rows land rel ~3.5e-3 from the exact ones (10 % of values rounded, 1 % to 0), vs a limit of 0. Since FIX.7 (GEMM_INPUTS=bfp8, F208) the engram wkv matmul reads its input as bfloat8_b anyway: ENGRAM_ROWS=bfp8 does that rounding on the host, from the table's bytes, and engram_kv takes the rows as they arrive. The lookup and the packing stay exact: tests/test_engram_bfp8.py (in this step's gate) checks the device rows equal ttnn's bfp8 of the exact rows bit for bit. 2x2 ladder bf16 vs bfp8: every metric within 1.3 %. Judged end to end; the Galaxy's 40-layer ladder + K.1 confirm (ENGRAM_HOST_PATH.md 3e)."
    router: "owner 2026-10-22: the gate matmul runs bf16 x and the checkpoint's bf16 gate weights (exact, as the reference's x.float() @ w.float()) with fp32 accumulation, but the FPU rounds in-tile partial dots to ~TF32 (DS41-16, K-30), so the router step misses its noise floor (swa_12: rel 7.9e-4 vs 3.6e-4; 31 selection flips, all explained by the input nudge; layer-0 golden: 4 of 2048 rows pick another 6th expert at near ties). TF32 is accepted; no emulation. Judged end to end."
text:                              # the canonical prompt, built once at R.1 (reference/prompt.py)
  source: models/tt_transformers/tests/tale-of-two-cities.txt.bz2
  wrap: model_turn                 # instruction-tuned (reasoning effort, chat encoding)
  request: "Recite the Project Gutenberg text of A Tale of Two Cities by Charles Dickens, from the start."
  min_top1: 0.4
hf:
  revision: 5254448103b6254fc646dacbca1cbbf20e9216c1
  parity_seq: 4096                 # > the window (128) and the compressed top-k reach, so parity exercises the selection
  custom_loader: true              # transformers has no deepseek_v41: hooks.hf_model is DeepSeek's inference code on CPU
intake:
  smoke: {prompt: "What is the capital of France? Answer in one word.", expect: "Paris"}
checkpoint:
  expect:
    "embed.weight": [129280, 5120]
    "head.weight": [129280, 5120]
    "norm.weight": [5120]
    "layers.0.attn.wq_b.weight": [32768, 1280]           # fp8 e4m3 + ue8m0 block scales
    "layers.0.attn.wkv.weight": [512, 5120]
    "layers.0.ffn.gate.weight": [384, 5120]
    "layers.*.ffn.experts.*.w1.weight": [2304, 2560]     # fp4 e2m1 packed 2 per byte + ue8m0 scale per 32
    "layers.*.ffn.experts.*.w2.weight": [5120, 1152]
    "layers.2.attn.compressor.wkv.weight": [512, 5120]
    "layers.2.attn.indexer.wq_b.weight": [4096, 1280]
    "layers.1.engram.embed.weight": [384006168, 256]     # engram table, fp8 + ue8m0 scale per 32
    "layers.14.engram.embed.weight": [384016682, 256]
    "layers.*.hc_attn_fn": [24, 20480]                   # mHC, 4 streams
  config:
    num_hidden_layers: 40
    hidden_size: 5120
    num_attention_heads: 64
    head_dim: 512
    n_routed_experts: 384
    num_experts_per_tok: 6
    sliding_window: 128
    candidate_source_layer_id: 20
    hc_mult: 4
  trim_drop: ["vision.*", "aligner.*", "mtp.*", "image_*"]   # R.4 keeps layers 0-24 (the subset's prefix)
contract: {adapter: deepseek_v41_flash_d_p}
serving:
  server_repo: /localdev/$USER/tt-d-gen
  require_engine: false            # QuietBox: tt-d-gen does not run here; tt-metal's prefill_producer stands in
  # answers to serving_contract.md's owner questions (decided by the supervisor on the owner's delegation, 2026-10-15)
  owner_answers:
    - "1 decode-side cache: bf16 row-major per position, lossless, the contract's five config names and order"
    - "2 window KV: TP-dedup (1.25 GiB per chip per slot at 512K on galaxy_4x4); fp8 rows only with server tooling support"
    - "3 slots: max_slots 1 at the deployment context; 2 in the tests"
    - "4 prefix reuse: on, kv_block_size 64"
    - "5 d2p: off (a pulled prefix has no token ids for the engram hash)"
    - "6 server tooling: our tests decode with explicit geometry; tt-d-gen needs a DeepSeek-V4 entry before a launch run"
    - "7 runner smoke: needs all 40 layers; not required in this partial run (F66), run on the deployment Galaxy"
agents:
  rules:                           # the owner's rules, shown in every brief
    - "Always use 2D fabric: the mesh opens with the spec's device_params; never FABRIC_1D or FABRIC_1D_RING."
    - "Text decoder only: never build, load or test the vision encoder (vision.*, aligner.*, image_*) or the DSpark /
      MTP draft layers (mtp.*)."
    - "The model's ground truth is DeepSeek's own inference code shipped with the checkpoint (hf/inference/: model.py,
      engram.py, kernel.py, config.json; hf/encoding/encoding.py builds prompts): transformers has no deepseek_v41.
      Port its GPU kernels to CPU exactly (fp8 / fp4 quantize-dequantize included) and dequantize weights exactly as
      the checkpoint defines them (fp8 e4m3 with ue8m0 block scales; experts fp4 e2m1 with a ue8m0 scale per 32)."
    - "Engram: the n-gram hash and the table lookup depend only on the token ids; they run on the host before each
      chunk's forward and their rows go to the device as an input. Read the tables from the checkpoint files on demand
      (memory-mapped): never hold the 203 GB of tables in host RAM. Everything after the lookup runs on the device."
    - "Host RAM is shared (503 GB): load and dequantize weights one layer (or one expert) at a time."
    - "Precision (owner, 2026-10-28; replaces the 2026-10-14 bring-up line 'HiFi4, fp32 accumulation, bf16 KV cache', superseded by F123 on 2026-10-20): realistic = whatever the reference uses, as agents' rule 7. Every weight, every cache (window KV fp8, compressed KV fp4, index keys fp4) and every GEMM input the reference rounds is stored and computed at that width in the device's own format (fp8 -> bfp8, fp4 -> bfp4); never above the reference, never a parity-only rounding (rule 17). Routed experts bfp4 (owner 2026-10-22)."
    - "Accuracy is judged against the noise floor, not against exactness: a value after the model's own fp8 / fp4
      rounding may differ from the CPU by one rounding step where a correct bf16 device step would too (the checks'
      limits follow the bf16 precision model). Never trade speed for exactness (kernels that emulate the CPU's summation
      order, split matmuls, piecewise attention) without the owner's decision; the fast path is the default."
  model: null
  timeout_s: 14400
  read:
    reference:
      - /localdev/dnijemcevic/bringup/deepseek_v41_flash_d_p/hf/inference/model.py
      - /localdev/dnijemcevic/bringup/deepseek_v41_flash_d_p/hf/inference/engram.py
      - /localdev/dnijemcevic/bringup/deepseek_v41_flash_d_p/hf/inference/kernel.py
      - /localdev/dnijemcevic/bringup/deepseek_v41_flash_d_p/hf/inference/config.json
      - /localdev/dnijemcevic/bringup/deepseek_v41_flash_d_p/hf/config.json
      - /localdev/dnijemcevic/bringup/deepseek_v41_flash_d_p/hf/README.md
      - /localdev/dnijemcevic/bringup/deepseek_v41_flash_d_p/hf/encoding/encoding.py
      - models/demos/deepseek_v3_d_p/reference/deepseek_v4
      - models/demos/deepseek_v3_d_p/reference/mhc
      - models/demos/glm53_flash_d_p/reference
      - models/demos/common/bringup/selftest/fixture_model.py
    plan:
      - ttnn/ttnn/bringup/INDEX.md
      - models/demos/deepseek_v3_d_p/tt/mla
      - models/demos/deepseek_v3_d_p/tt/moe
      - models/demos/deepseek_v3_d_p/tt/mhc
      - models/demos/glm53_flash_d_p/tt
      - models/demos/mimo_v2_6_d_p/tt
    implement:
      - ttnn/ttnn/bringup/INDEX.md
      - models/demos/deepseek_v3_d_p/tt/mla
      - models/demos/deepseek_v3_d_p/tt/moe
      - models/demos/deepseek_v3_d_p/tt/mhc
      - models/demos/glm53_flash_d_p/tt
      - models/demos/mimo_v2_6_d_p/tt
  policy: {}
  swap_review: none
dashboard: {styles: [standard, teletext]}
paths:
  hf: /localdev/dnijemcevic/bringup/deepseek_v41_flash_d_p/hf
reference:
  shipped_dtype: bfloat16          # F136: DeepSeek GPU code keeps activations in bf16 (the margin source runs at it)

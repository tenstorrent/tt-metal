model: deepseek-ai/DeepSeek-V4.1-Flash
target:
  seq: 55296
  chunk: 2048
  dtype: bf16
tasks:
- id: R.1
  title: Checkpoint, intake approval, canonical prompt
  step: intake
  deps: []
  gate:
    cmd: BRINGUP_SCALED=0 python -m models.demos.common.bringup.intake.check_checkpoint && BRINGUP_SCALED=0 python -m models.demos.common.bringup.reference.prompt
    metrics:
      intake_approved: == 1
      prompt_hash_ok: == 1
      missing_tensors: == 0
      shape_mismatches: == 0
      count_mismatches: == 0
      config_mismatches: == 0
      checkpoint_tensors: '>= 1'
  paths:
  - models/demos/deepseek_v41_flash_d_p/bringup/spec.yaml
- id: R.2
  title: HF sanity on the model's loader (revision, smoke, accuracy floor); reference matches HF per layer and on logits (fp32)
  step: reference
  deps:
  - R.1
  gate:
    cmd: BRINGUP_SCALED=0 python -m models.demos.common.bringup.intake.check_hf_sanity && BRINGUP_SCALED=0 python -m models.demos.common.bringup.reference.check_hf
      --seq 4096
    metrics:
      revision_ok: == 1
      text_top1_acc: '>= 0.4'
      smoke_ok: == 1
      pcc_hidden_L*: '>= 0.9999'
      pcc_logits: '>= 0.9999'
      top1_match_frac: '>= 0.99'
  paths: &id001
  - models/demos/deepseek_v41_flash_d_p/reference
  - models/demos/deepseek_v41_flash_d_p/bringup/hooks.py
  - models/demos/deepseek_v41_flash_d_p/__init__.py
- id: R.4
  title: Trim the checkpoint to layers 0-24 (the whole model was needed only for the HF sanity)
  step: intake
  deps:
  - R.2
  gate:
    cmd: python -m models.demos.common.bringup.intake.trim_checkpoint
    metrics:
      trim_done: == 1
      trim_verify_errors: == 0
      trim_freed_gb: '>= 0'
- id: R.3
  title: Reference chunked == one-shot (4096 in 2048) and block graphs replay exactly
  step: reference
  deps:
  - R.2
  gate:
    cmd: BRINGUP_SCALED=0 python -m models.demos.common.bringup.reference.check_reference --seq 4096 --chunk 2048
    metrics:
      pcc_hidden: '>= 0.99999'
      pcc_state_min: '>= 0.99999'
      graph_errors: == 0
      boundaries_missing: == 0
      graph_replay_maxabs: <= 0
  paths: *id001
- id: B.1
  title: 'Box: mesh opens with the spec''s device params, collectives are exact'
  step: box
  deps: []
  gate:
    cmd: scripts/run_safe_pytest.sh --run-all models/demos/common/bringup/tests/test_box.py
    metrics:
      chips: == 4
      all_gather_maxabs: == 0
  device: true
- id: SC.1
  title: 'Serving contract: how tt-d-gen drives the model, a how-to for each part and its tests'
  step: serving
  deps:
  - R.1
  gate:
    cmd: python -m models.demos.common.bringup.testing.serving
    metrics:
      serving_contract_errors: == 0
      serving_contract_tests: '>= 1'
  role: serving
- id: PL.0
  title: 'Ledger: add the component, swap, ladder, contract and perf tasks from the block graphs'
  step: ledger
  deps:
  - R.3
  gate:
    cmd: python -m models.demos.common.bringup.plan.ledger_gen --extend
    metrics:
      ledger_errors: == 0
      ledger_tasks: '>= 1'
  paths:
  - models/demos/deepseek_v41_flash_d_p/bringup/tasks.yaml
- id: PL.1
  title: 'Plan: fits per-chip DRAM (from the checkpoint), every step mapped, ledger valid, approved'
  step: plan
  deps:
  - PL.0
  - B.1
  - SC.1
  gate:
    cmd: BRINGUP_SCALED=0 python -m models.demos.common.bringup.plan.check_plan
    metrics:
      plan_fits: == 1
      unplaced_tensors: == 0
      plan_errors: == 0
      component_errors: == 0
      ledger_errors: == 0
      plan_approved: == 1
  paths:
  - models/demos/deepseek_v41_flash_d_p/bringup/plan.yaml
  - models/demos/deepseek_v41_flash_d_p/bringup/plan.md
  - models/demos/deepseek_v41_flash_d_p/bringup/components.yaml
  - models/demos/deepseek_v41_flash_d_p/bringup/approvals.yaml
  - models/demos/deepseek_v41_flash_d_p/bringup/results/plan_memory.json
  - models/demos/deepseek_v41_flash_d_p/bringup/results/plan_boxes.json
  - models/demos/deepseek_v41_flash_d_p/bringup/scaling.yaml
  approval: plan
- id: SG.1
  title: 'The scaled model: the reduced checkpoint (heads and experts cut by the plan''s scale factors)'
  step: scale
  deps:
  - PL.1
  gate:
    cmd: python -m models.demos.common.bringup.plan.scale
    metrics:
      scale_errors: == 0
      scale_tensors_total: '>= 1'
  role: scale
  paths:
  - models/demos/deepseek_v41_flash_d_p/reference
  - models/demos/deepseek_v41_flash_d_p/bringup/hooks.py
  - models/demos/deepseek_v41_flash_d_p/__init__.py
  - models/demos/deepseek_v41_flash_d_p/bringup/scaling.yaml
- id: G.s4096
  title: 'Golden s4096: 4096 tokens in 2048-token chunks, full dumps (the scaled model)'
  step: goldens
  deps:
  - SG.1
  gate:
    cmd: python -m models.demos.common.bringup.reference.generate_golden --rung s4096
    metrics:
      golden_layers: == 8
      golden_chunks: == 2
      golden_hash_ok: == 1
- id: G.s55296
  title: 'Golden s55296: 55296 tokens in 2048-token chunks (the scaled model)'
  step: goldens
  deps:
  - G.s4096
  gate:
    cmd: python -m models.demos.common.bringup.reference.generate_golden --rung s55296
    metrics:
      golden_layers: == 8
      golden_chunks: == 27
      golden_hash_ok: == 1

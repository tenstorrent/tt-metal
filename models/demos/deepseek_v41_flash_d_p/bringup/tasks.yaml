  gate:
    cmd: BRINGUP_TASK=C.swa.attention scripts/run_safe_pytest.sh --run-all models/demos/deepseek_v41_flash_d_p/tests/bringup/test_c_swa_attention.py
      && BRINGUP_TASK=C.swa.attention scripts/run_safe_pytest.sh --run-all --no-precompile models/demos/deepseek_v41_flash_d_p/tests/bringup/contract/test_cache_starts.py
      && BRINGUP_TASK=C.swa_engram.attention scripts/run_safe_pytest.sh --run-all models/demos/deepseek_v41_flash_d_p/tests/bringup/test_c_swa_engram_attention.py
      && BRINGUP_TASK=C.swa_engram.attention scripts/run_safe_pytest.sh --run-all --no-precompile models/demos/deepseek_v41_flash_d_p/tests/bringup/contract/test_cache_starts.py
      && BRINGUP_TASK=S.swa.11 scripts/run_safe_pytest.sh --run-all models/demos/deepseek_v41_flash_d_p/tests/bringup/test_swap_swa_11_router.py
      && BRINGUP_TASK=S.swa.15 scripts/run_safe_pytest.sh --run-all models/demos/deepseek_v41_flash_d_p/tests/bringup/test_swap_swa_15_ffn_residual.py
      && BRINGUP_TASK=S.swa_engram.18 scripts/run_safe_pytest.sh --run-all models/demos/deepseek_v41_flash_d_p/tests/bringup/test_swap_swa_engram_18_ffn_residual.py
    metrics:
      err_attention_L00: <= limit
      err_attention_L01: <= limit
      err_swap_out: <= limit
  device: true
  paths:
  - models/demos/deepseek_v41_flash_d_p/tt
  - models/demos/deepseek_v41_flash_d_p/bringup/hooks.py
  brief:
    details: 'Attention back to the reference''s precision. The fp32 scores of the window attention (WINDOW_SDPA_SCORES=fp32:
      q rounded to TF32 and kept fp32 through the reshard, Float32 scores and probabilities in ttnn.bringup.sparse_sdpa, DS41-31)
      were added in S.swa.11 only to clear a fixed PCC 0.99 bar on the router vs the golden. That bar is gone (F76): every
      limit is now 2 x the noise floor of the reference''s own dtypes, and the gates record it as <metric>_limit. Owner rule:
      match the reference precision, never above it to pass a test. The reference kernel (inference/kernel.py sparse_attn_kernel)
      uses: q and kv in bf16; the scores, the running max and sum in fp32; the probabilities cast to bf16 before P.V; the
      output accumulated in fp32 and written as bf16; the attention sink in fp32. Make the device path match that stage by
      stage, as closely as the op allows, and make it the default AND the MAX_PRECISION value of every attention setting (tt/settings.py):
      no q TF32 rounding, no fp32 q through the reshard, no Float32 probabilities, an output dtype that matches the reference''s.
      Keep the higher-precision variants only as non-default setting values (the fork option stays, default off). Keep FP32_WEIGHT_ROUND=rne
      (load time, removes a truncation bias; not a precision raise). Measure the attention time per layer before and after
      (minutes, not per-op mode). The gate reruns the passed attention component tests and the swap tests through the router
      and the whole blocks under the new noise-floor limits; all must pass. If one fails at the reference''s precision, do
      NOT raise the precision: report the failing check with its value and limit in BREADCRUMBS.md and answer `disagree` with
      that evidence. Update DS41-18, DS41-19, DS41-30 and DS41-31 in known_issues.md to say what holds now.'

  text: 'Only timeline_ok fails, the rest of X.3 passes (prefill_ms_full is no longer asked, F125). Cause: the P.16 ChunkMemo
    (tt/sparse_attention.py) drops a slot only after the last loaded layer that reads it (model.memo_last). The op profile
    runs only layers 20 and 24, so a slot whose last reader is another layer survives the run, and the timeline run right
    after it (no state reload in between) reuses it and issues one op fewer (3795 vs 3794 calls). The same leak would hand
    stale data to the next chunk whenever a slot''s last reader does not run (its keys carry no chunk). Fix in the model:
    clear the memo at every chunk start (begin_chunk, or key the slots by chunk start), so every run of a chunk builds the
    shared tensors itself. Do not change the profiler or the gate. Check: the X.3 gate''s timeline_ok == 1 and the device
    time unchanged (about 104 ms per chunk).'

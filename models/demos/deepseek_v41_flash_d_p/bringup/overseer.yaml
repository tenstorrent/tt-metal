- id: FIX.5
  title: P.16 ChunkMemo cleared at every chunk start
  gate:
  - X.3
  status: placed
  t: '2026-10-21T06:18:32'
  text: 'X.3 fails only timeline_ok (every test passes; prefill_ms_full is no longer asked, F125). Cause: the P.16 ChunkMemo
    (tt/sparse_attention.py) drops a slot only after the last loaded layer that reads it (model.memo_last). X.3''s op profile
    runs only layers 20 and 24, so a slot whose last reader is another layer survives the run; the timeline run right after
    it (no state reload between) reuses it and issues one op fewer (3795 vs 3794 calls). The same leak would hand stale
    data to the next chunk whenever a slot''s last reader does not run (the slot keys carry no chunk). Fix in the model:
    clear the memo at every chunk start (begin_chunk, or key the slots by the chunk start), so every run of a chunk builds
    its shared tensors itself. Do not change the profiler, the gate or the precision. Measure: the X.3 gate passes with
    timeline_ok == 1, device time unchanged (about 104 ms per chunk), worst layer PCC unchanged.'
  placed: '2026-10-21T06:18:46'

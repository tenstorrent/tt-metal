tests:
  waivers:
    attn_hc: hc_fn is fp32 in the official model; the FPU holds at most 10 mantissa bits of a matmul weight (9 at HiFi4),
      and its fixed rounding is a per-column bias no single-pass format removes (DS41-43; split matmuls ruled out). Debug
      once the model produces tokens.
    ffn_hc: hc_fn is fp32 in the official model; the FPU holds at most 10 mantissa bits of a matmul weight (9 at HiFi4), and
      its fixed rounding is a per-column bias no single-pass format removes (DS41-43; split matmuls ruled out). Debug once
      the model produces tokens.
    experts: 'owner 2026-10-22: routed-expert weights stay bfp4 (the checkpoint''s fp4 width, F117) for speed, although bfp4
      (3-bit mantissa, one exponent per 16) is coarser than the reference''s fp4 e2m1 with a ue8m0 scale per 32: the experts
      step lands 0.13-0.18 from full precision with norms 4-5 % high vs a limit of 0.06-0.08, the device matching the CPU
      at its own formats within 0.015 (FIX.9, DS41-95); bfp8 would give 0.017. Judged end to end (the ladder passes); a better
      fp4->bfp4 conversion may be tried later as a pick. Owner 2026-10-22 (F158): it also covers the blocks containing the
      experts (swap tests swa_12 / enc_source_14: block out ~0.026-0.030 vs ~0.016-0.019); revisit if the end-to-end token
      evals are bad.'
    indexer: 'overseer under the owner''s format-limit delegation (2026-10-22, to review): the device top-k takes bf16 scores,
      so near-tie selections flip vs the fp32 step; CPU at the device format (fp32 scores rounded to bf16) reproduces it (1277
      unexplained flips, recall 0.9946 vs the device 0.9942, layer 2; DS41-102), and DeepSeek''s own bf16 code is further
      off (2048, recall 0.964), so the device is not below the reference''s precision. The swap checks'' positional match
      (0.0015) is an ordering artifact (reference ascending ids, device score order; the attention reads a set; F160 will
      compare id sets). Judged end to end (err_state_topk_idx).'
    router: 'owner 2026-10-22: the gate matmul runs bf16 x and the checkpoint''s bf16 gate weights (exact, as the reference''s
      x.float() @ w.float()) with fp32 accumulation, but the FPU rounds in-tile partial dots to ~TF32 (DS41-16, K-30), so
      the router step misses its noise floor (swa_12: rel 7.9e-4 vs 3.6e-4; 31 selection flips, all explained by the input
      nudge; layer-0 golden: 4 of 2048 rows pick another 6th expert at near ties). TF32 is accepted; no emulation. Judged
      end to end.'
  unit_waivers:  # F225: named failures of a frozen test
    test_adapter_acks:
      match:
      - '\(last-window 128 rows\): 0_window_kv layer 20 nope pcc 0\.98[5-9]\d* < '
      why: 'owner 2026-10-29 (FIX.12): waived for now. P.9 (ATTN_SP32_PROJ) moves layer 20''s window KV over the last 128 rows of the 2536-token prompt to PCC 0.9885 vs the reference-derived 0.9896 (passes with P.9 off; ladder window_kv L20 0.090 -> 0.106, within its 0.151). Cause under investigation as FIX.13 (DS41-141); remove when it is fixed.'
    test_runner_contract:
      match:
      - '^\[tt-d-gen engine \(.*\)\]$'
      - '\(last-window 128 rows\): 0_window_kv layer 20 nope pcc 0\.98[5-9]\d* < '
      why: 'owner 2026-10-29 (FIX.12): waived for now. P.9 (ATTN_SP32_PROJ) moves layer 20''s window KV over the last 128 rows of the 2536-token prompt to PCC 0.9885 vs the reference-derived 0.9896 (passes with P.9 off; ladder window_kv L20 0.090 -> 0.106, within its 0.151). Cause under investigation as FIX.13 (DS41-141); remove when it is fixed.'

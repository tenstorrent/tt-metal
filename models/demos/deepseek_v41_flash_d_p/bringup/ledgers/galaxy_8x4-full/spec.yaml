serving:
  server_repo: /scratch/$USER/tt-d-gen
  require_engine: true
  owner_answers:
  - '1 decode-side cache: bf16 row-major per position, lossless, the contract''s five config names and order'
  - '2 window KV: TP-dedup (1.25 GiB per chip per slot at 512K on galaxy_4x4); fp8 rows only with server tooling support'
  - '3 slots: max_slots 1 at the deployment context; 2 in the tests'
  - '4 prefix reuse: on, kv_block_size 64'
  - '5 d2p: off (a pulled prefix has no token ids for the engram hash)'
  - '6 server tooling: our tests decode with explicit geometry; tt-d-gen needs a DeepSeek-V4 entry before a launch run'
  - '7 runner smoke: needs all 40 layers; runs in this full run on the deployment Galaxy (owner, 2026-10-27), fed by tt-d-gen''s
    engine at its latest commit'
agents:
  rules:
  - 'Always use 2D fabric: the mesh opens with the spec''s device_params; never FABRIC_1D or FABRIC_1D_RING.'
  - 'Text decoder only: never build, load or test the vision encoder (vision.*, aligner.*, image_*) or the DSpark / MTP draft
    layers (mtp.*).'
  - 'The model''s ground truth is DeepSeek''s own inference code shipped with the checkpoint (hf/inference/: model.py, engram.py,
    kernel.py, config.json; hf/encoding/encoding.py builds prompts): transformers has no deepseek_v41. Port its GPU kernels
    to CPU exactly (fp8 / fp4 quantize-dequantize included) and dequantize weights exactly as the checkpoint defines them
    (fp8 e4m3 with ue8m0 block scales; experts fp4 e2m1 with a ue8m0 scale per 32).'
  - 'Engram: the n-gram hash and the table lookup depend only on the token ids; they run on the host before each chunk''s
    forward and their rows go to the device as an input. Read the tables from the checkpoint files on demand (memory-mapped):
    never hold the 203 GB of tables in host RAM. Everything after the lookup runs on the device.'
  - 'Host RAM is shared (503 GB): load and dequantize weights one layer (or one expert) at a time.'
  - 'Precision (owner, 2026-10-28; replaces the 2026-10-14 bring-up line ''HiFi4, fp32 accumulation, bf16 KV cache'', superseded by F123 on 2026-10-20): realistic = whatever the reference uses, as agents'' rule 7. Every weight, every cache (window KV fp8, compressed KV fp4, index keys fp4) and every GEMM input the reference rounds is stored and computed at that width in the device''s own format (fp8 -> bfp8, fp4 -> bfp4); never above the reference, never a parity-only rounding (rule 17). Routed experts bfp4 (owner 2026-10-22).'
  - 'Accuracy is judged against the noise floor, not against exactness: a value after the model''s own fp8 / fp4 rounding
    may differ from the CPU by one rounding step where a correct bf16 device step would too (the checks'' limits follow the
    bf16 precision model). Never trade speed for exactness (kernels that emulate the CPU''s summation order, split matmuls,
    piecewise attention) without the owner''s decision; the fast path is the default.'
  - 'Owner (2026-10-23): everything tuned on the 2x2 seed is tuned for ITS core grid (11x10 per chip) and its per-chip shapes;
    the Galaxy chips give the model a 12x10 grid (one row of 13 is fast dispatch) and 640 rows / 1280 hidden columns per chip. Re-sweep on the Galaxy before
    trusting any tuned constant: the matmul program configs (tt/mm_configs.py, picks P.23 / P.24; harness tests/perf/test_matmul_sweep.py:
    capture the calls, sweep, check the rule), and likewise the other per-box choices (collective link counts and topology,
    fabric payload sizes, core grids hard-coded in fork options). The matmul rule falls back to the stock config for a shape
    it has no entry for, which is safe but not tuned. Do this as a perf pick after the first profile on the Galaxy, not inside
    W.1.'

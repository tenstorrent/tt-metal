- id: FIX.4
  title: 'Routed-expert weights: use the flat-expert fork''s laid-out weight cache and a fast miss path'
  gate:
  - W.1
  status: placed
  t: '2026-10-26T22:17:50'
  text: 'Every test process spends ~113 s PER LAYER in TtExperts._load_block/_load_flat (M.1 precheck log 2026-10-26 22:07-22:15:
    between create_global_expert_idx_table and EXPERTS_FLAT, 113 s each of L00..L03; everything else of a layer ~5 s). 40
    layers = ~75 min of host work before every M.1 / ladder / K.1 / X.* run. Cause: tt/experts.py builds every expert with
    fp4_dequant + per-tensor torch.equal asserts + _bfp8_exact in Python, then FlatRoutedExpert packs and uploads the layout,
    with no cache. The fork already supports it (ttnn/ttnn/bringup/flat_routed_expert_ttnn/flat_expert.py: cache_prefix=
    and weights as a CALLABLE only called on a cache miss; plan-hashed file names; GLM-5.3 models/demos/glm53_flash_d_p/tt/experts_ag.py:325
    uses it). Do: (1) pass cache_prefix (under the run''s weight-cache dir, keyed by the checkpoint actually loaded: revision
    + scaled/real + layer + EXPERTS_IMPL) and a callable that does the current dequant + checks, so a hit skips all host
    dequant/packing; on a bfp4 hit keep bfp4_stats correct (cache them next to the weights) or document why not needed;
    (2) profile the miss path (one layer, CPU, nice 19) and cut its cost honestly (vectorised dequant over all experts of
    a chip, one exactness check per stacked tensor instead of per matrix, no repeated .float() copies); no change to values
    or layout (bit-identical tensors; the exactness asserts stay on the miss path). Same check for dense weights (DENSE_BFP8,
    ~5 s/layer) only if cheap. Report: per-layer load time miss before/after and hit, W.1 load wall time miss vs hit. Gate:
    W.1 must still pass; run it twice (second run must hit the cache).'
  paths:
  - models/demos/deepseek_v41_flash_d_p/tt
  placed: '2026-10-27T05:38:57'

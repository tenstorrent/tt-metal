- id: FIX.25
  title: 'Determinism in every gate: a model-level run-twice-bit-for-bit check that every task gate, quick and full, runs
    and enforces'
  step: overseer_fix
  role: overseer
  precheck: false
  deps:
  - P.49
  device: true
  paths:
  - models/demos/common/bringup
  - models/demos/deepseek_v41_flash_d_p/tests/
  - models/demos/deepseek_v41_flash_d_p/tt
  - models/demos/deepseek_v41_flash_d_p/bringup
  brief:
    details: 'OWNER 2026-11-12: DETERMINISM IS THE HIGHEST OF ALL PRIORITIES. Today no task gate checks it: the gates (test_ladder,
      test_profile, test_positions, test_contract, the final task''s full-target gate and the quick-accepted picks'' full
      gates run before it) check accuracy against limits and times; a run-to-run difference smaller than the limits passes,
      which is how the MoE combine''s non-determinism (DS41-233 / 234 / 235, up to 0.26 on the code prompt; fixed by P.50,
      COMBINE_SPLIT=on) went unnoticed for weeks. The framework has testing/determinism.py (A, then a different input B, then
      A again, byte for byte), but only component tests and fork unit tests use it; the last such run in this ledger was 2026-10-26/27.

      Make determinism a framework property of every gate: (1) a model-level check that runs the same input at least twice
      in one process (cold first run after load included, plus a warm run after a different input, as determinism.py does)
      over several chunks, on both the spec''s prompt and a second, different prompt (the code prompt of DS41-234), and requires
      every chunk''s final hidden and the served states bit for bit (max abs diff 0); reuse testing/determinism.py and the
      model''s determinism test (tests/test_determinism.py, from P.50), do not write a second mechanism. (2) The orchestrator
      runs it as part of EVERY gate (per-task gates, quick A/B accept gates, the full gates, the final task) without each
      tasks.yaml entry having to name it; a gate whose model is not deterministic FAILS, with the first differing chunk /
      layer in the message. A per-step exemption only through the existing tests.nondeterministic switch with a written reason,
      and none for the model. (3) Report its cost per gate (seconds) and keep it as low as coverage allows; say what coverage
      you chose and why. (4) A selftest of the framework part (a deliberately non-deterministic fake model must fail the gate).
      Never loosen any other check.

      SAFETY: a hang or a board reset need: STOP and report, never reset. Agent rules 18 and 19 hold. Report in plain language,
      short, every term defined.'
  gate:
    cmd: BRINGUP_RUNG=last scripts/run_safe_pytest.sh --run-all --no-precompile models/demos/common/bringup/tests/test_ladder.py
      && scripts/run_safe_pytest.sh --run-all --no-precompile models/demos/deepseek_v41_flash_d_p/tests/test_determinism.py
    metrics:
      err_layer_L*: <= limit
      err_state_*_L*: <= limit
      err_final_hidden: <= limit
      top5_overlap: '>= limit'
      determinism_max_abs_diff: == 0

- id: P.35
  title: 'NORM_IN_MHC: the RMS norm of the collapsed input inside the collapse pass (attn_norm / ffn_norm calls removed)'
  step: perf
  role: perf
  device: true
  deps:
  - P.34
  paths:
  - models/demos/deepseek_v41_flash_d_p/tt
  - models/demos/deepseek_v41_flash_d_p/tests/
  - ttnn/ttnn/bringup
  brief:
    details: 'OWNER 2026-11-06 (mHC study, opportunity #3; built on P.34). Under OWN_ROWS each chip holds whole rows, so attn_norm and ffn_norm are local rms_norm calls on the collapsed y (0.70 ms each a chunk, 80 launches). Fold the norm into the pass that writes the collapsed y (after P.34 that is mhc_post''s new collapse output; layer 0''s first collapse in mhc_pre_xing): y * rsqrt(mean(y^2) + eps) * gamma, written as the norm output; optionally also the bfp8 copy q_a reads (0.55 ms of typecasts a chunk). Needs a cross-core row reduction where the collapse is split by column tiles (mhc_pre has a gather-to-root / fold / multicast pattern). perf_proposals.md #10 (NORM_STATS_IN_MHC) predates OWN_ROWS and only moved the statistics; this is the full norm. Expected: about 1.4 ms device (+0.55 with the bfp8 copy) and 80-120 launches a chunk. Setting NORM_IN_MHC (on / off). Each change behind its own setting in tt/settings.py (default on once accepted; off = today''s path) so a regression can be isolated by its switch. Agent rules 18 (at most 110 cores an op) and 19 (no single-card device jobs) hold; forks first; precision at the reference''s level: aim for bit-identical results with the switch on (the same bf16 rounding points; if not bit-identical, every gated metric within its limit and say why). Add fork tests for every fork option you add. Do not profile the model yourself: the orchestrator measures off vs on at 51200 and 512000. Report: ops / launches removed a chunk, device and host ms a chunk before / after. Study: /scratch/dnijemcevic/rebase/mhc/notes.md (per-layer flow, costs, file:line). UPDATE 2026-11-07 (owner released): the tree is now P.43 (defaults: MOE_BLOCK_SRC=main, bf16 KV, WINDOW_KV_KEEP=snapshot128, REINDEX_SERVE=alias, INDEX_K_FORMAT=bfp8, DECODER_SKIP=off; DS41-216: one high_bw_all_gather semaphore pair per mesh axis). Current section times (results/P.43_profile.json, opportunities.md 2026-11-07): attn_norm 0.7, ffn_norm 0.7, ffn_residual 12.7 (includes the snapshot write), experts 97.8 ms a chunk.'
  ab:
    env:
      NORM_IN_MHC: 'off'
      ENGRAM_TABLE: resident
    change:
      NORM_IN_MHC: 'on'
      ENGRAM_TABLE: resident
  ab_positions:
  - 51200
  - 512000
  gate:
    cmd: BRINGUP_RUNG=last scripts/run_safe_pytest.sh --run-all --no-precompile models/demos/common/bringup/tests/test_ladder.py
      && DS41_ENGRAM_TABLE=resident scripts/run_safe_pytest.sh --run-all --no-precompile models/demos/common/bringup/tests/test_profile.py
      && DS41_DECODER_SKIP=replay128 DS41_ENGRAM_TABLE=resident scripts/run_safe_pytest.sh --run-all --no-precompile models/demos/deepseek_v41_flash_d_p/tests/bringup/test_short_turn.py
      && scripts/run_safe_pytest.sh --run-all --no-precompile models/demos/common/bringup/tests/test_contract.py
      && scripts/run_safe_pytest.sh --run-all --no-precompile models/demos/deepseek_v41_flash_d_p/tests/bringup/contract/test_kv_layout.py
      && scripts/run_safe_pytest.sh --run-all --no-precompile models/demos/deepseek_v41_flash_d_p/tests/bringup/contract/test_adapter_acks.py
      && scripts/run_safe_pytest.sh --run-all --no-precompile models/demos/deepseek_v41_flash_d_p/tests/bringup/contract/test_runner_contract.py
      && DS41_DECODER_SKIP=replay128 DS41_WINDOW_KV_KEEP=snapshot128 DS41_ENGRAM_TABLE=resident scripts/run_safe_pytest.sh --run-all --no-precompile models/demos/deepseek_v41_flash_d_p/tests/test_window_snapshot.py
      && DS41_DECODER_SKIP=exact DS41_WINDOW_KV_KEEP=snapshot128 DS41_ENGRAM_TABLE=resident scripts/run_safe_pytest.sh --run-all --no-precompile models/demos/deepseek_v41_flash_d_p/tests/test_window_snapshot.py
    metrics:
      err_layer_L*: <= limit
      err_state_*_L*: <= limit
      err_final_hidden: <= limit
      top5_overlap: '>= limit'
      chunk_wall_ms: '> 0'

  - models/demos/deepseek_v41_flash_d_p/bringup/known_issues.md
  - ttnn/ttnn/bringup
  brief:
    prior_work: 'P.16 FORK_OUT_BUFFERS, P.23 OWN_ROWS (streams on the chip''s own 160 rows), P.34 POST_COLLAPSE (mhc_post
      writes the next collapsed input), P.35 NORM_IN_MHC, DS41-104 (bf16 mHC streams: -4.4 ms device, errors unchanged: check
      whether it shipped), DS41-222 (BRISC transposes on the collapse''s critical path). Read them first.'
    details: 'Owner pointer 2026-11-19: the MoE block takes most of L1, so the streams cannot stay resident across the MoE
      sublayer: no L1 residency work unless a measured L1 map shows the room (now ~6.6 MB a chip: the streams are bf16) at
      that point; residency only around the attention sublayer, if its L1 allows. Both of the owner''s first two leads already
      shipped: POST_COLLAPSE=on (P.34: mhc_post writes the next sublayer''s collapsed input in the same pass) and BF16_ACTIVATIONS=on
      (P.20 / DS41-104: bf16 streams, -4.4 ms device). So the bytes are already halved; the gap is the kernel''s efficiency:
      X.7 at 142k, mhc_post 137-169 us a call (40 calls: attn 3.47 + ffn 2.58 ms, + 1.71 ms ''other'' in ffn_residual), moving
      ~16.4 MB a call (bf16 streams 160 x 4 x 5120 in and out = 2 x 6.55 MB, x and the collapsed output 2 x 1.6 MB) = ~40
      us at 80 % of 512 GB/s: ~25-30 % of DRAM bandwidth. Find what bounds it with device zones (DRAM read / write, the fp32
      hc mixes and Sinkhorn on the SFPU, DS41-222''s BRISC word-copy transposes on the collapse''s critical path: 3 x 5.6-8.2
      us a call; per-core work split, cores used vs the 120 a non-matmul op may use) and fix the largest; then the 1.71 ms
      ''other'' rows next to it. Target <= 3 ms a chunk (floor ~1.6 ms). Stop rule: two designs each gaining < 1 ms: stop
      and report the zone breakdown. L1 residency around the attention sublayer only after the kernel is near its DRAM floor
      and only with a measured L1 map.'
  ab:
    env:
      MHC_POST_FAST: false
    change:
      MHC_POST_FAST: true
  ab_mode: full
  ab_rungs:
  - last
  gate:

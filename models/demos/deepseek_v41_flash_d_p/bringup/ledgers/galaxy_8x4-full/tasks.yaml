      short_turn_ms: '> 0'
      short_turn_device_ms: '> 0'
      acks_early: == 0
      contract_checks_failed: == 0
- id: P.36
  title: 'FFN_FEED: ffn_hc + ffn_norm + the MoE x all_to_all in one program (rows sent over fabric into the head''s input)'
  step: perf
  role: perf
  device: true
  deps:
  - P.35
  paths:
  - models/demos/deepseek_v41_flash_d_p/tt
  - models/demos/deepseek_v41_flash_d_p/tests/
  - models/demos/moe_block
  - ttnn/ttnn/bringup
  brief:
    details: 'OWNER 2026-11-06 (mHC study, opportunity #2; built on P.34 / P.35; after the owner''s moe_block update). The only collective left next to mHC on the 8x4 default path is the MoE x all_to_all after ffn_norm (all_to_all_async_generic over TP, [160, H] -> [640, H/4] into head.x; moe_block.py:720-722, 997-1010): 4.69 ms max chip, 40 launches, ~13.6 ms host with ffn_norm, ~17 ms device idle before it. Have the pass that writes the normalized ffn input send each 1280-column block straight into the peer chip''s head.x over fabric (persistent buffer, same address on every chip): ports, fabric connections, global semaphores and the ready fence as fabric_reduce_scatter / combine_rf do; a slot in the 110-core cap for the ports. The head''s x must be written before the MoE arena is taken. Risks: hangs; the skew wait (~3.7 ms) moves into the head, it does not vanish. Expected: about 2.2 ms device and 80 launches a chunk. Setting FFN_FEED (on / off). Each change behind its own setting in tt/settings.py (default on once accepted; off = today''s path) so a regression can be isolated by its switch. Agent rules 18 (at most 110 cores an op) and 19 (no single-card device jobs) hold; forks first; precision at the reference''s level: aim for bit-identical results with the switch on (the same bf16 rounding points; if not bit-identical, every gated metric within its limit and say why). Add fork tests for every fork option you add. Do not profile the model yourself: the orchestrator measures off vs on at 51200 and 512000. Report: ops / launches removed a chunk, device and host ms a chunk before / after. Study: /scratch/dnijemcevic/rebase/mhc/notes.md (per-layer flow, costs, file:line). UPDATE 2026-11-07 (owner released): the tree is now P.43 (defaults: MOE_BLOCK_SRC=main, bf16 KV, WINDOW_KV_KEEP=snapshot128, REINDEX_SERVE=alias, INDEX_K_FORMAT=bfp8, DECODER_SKIP=off; DS41-216: one high_bw_all_gather semaphore pair per mesh axis). Current section times (results/P.43_profile.json, opportunities.md 2026-11-07): attn_norm 0.7, ffn_norm 0.7, ffn_residual 12.7 (includes the snapshot write), experts 97.8 ms a chunk. The default MoE path is now Marko Staletovic''s block (MOE_BLOCK_SRC=main): its x all_to_all_async_generic over TP into the block''s fused head is in tt/moe_block_main_adapter.py (around lines 395-411; the head is mb.fused_head). Target that path; the carried block (moe_block.py) is secondary (make FFN_FEED refuse or fall back there, say which). The 4.69 ms / 13.6 ms / 17 ms figures were measured on the carried block: re-measure on main in the report.'
  ab:

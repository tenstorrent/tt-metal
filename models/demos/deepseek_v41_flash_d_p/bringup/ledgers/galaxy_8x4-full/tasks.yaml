      not gated. Long CPU or device jobs through devjob (start / wait), never killed; agent rules 18 / 19; one device process
      at a time; no fork regression suites. Run the device side twice per rung: the shipped default and DS41_WINDOW_KV_FORMAT=bf16_tiles

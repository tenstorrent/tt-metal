- id: FIX.27
  title: 'Ledger files that grow by appending are split into chunks below the repo''s 500 KB limit (state_metrics.json first):
    no compaction, no data dropped'
  step: overseer_fix
  role: overseer
  precheck: false
  deps:
  - FIX.25
  device: false
  paths:

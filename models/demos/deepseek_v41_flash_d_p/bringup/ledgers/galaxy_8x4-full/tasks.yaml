      --run-all --no-precompile models/demos/common/bringup/tests/test_contract.py && DS41_DECODER_SKIP=decode scripts/run_safe_pytest.sh
      --run-all --no-precompile models/demos/deepseek_v41_flash_d_p/tests/test_skip_positions.py
    metrics:
      err_layer_L*: <= limit
      err_state_*_L*: <= limit
      err_final_hidden: <= limit
      top5_overlap: '>= limit'
      determinism_max_abs_diff: == 0
      contract_checks_failed: == 0

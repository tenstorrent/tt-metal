- id: P.32
  title: 'WINDOW_KV_KEEP full | ring | none: keep the window history, only each layer''s last 192 rows per user, or nothing (replay)'
  step: perf
  role: perf
  device: true
  hold: 'owner 2026-11-05: before X.3 (X.3 after P.32); aligned on full | ring | none 2026-11-05, released (--until P.32)'

      160 rows a chip with 32-way gathers (no tp_sum), indexer weights_proj local; the exit all_to_all from B stays. mHC and
      the MoE keep today''s layout. Estimate on top of B: ~185 op calls and ~6-8 ms device fewer a chunk, +0.3 GiB a chip.
      Study (overseer 2026-10-29, read-only agent; supervision.md 07:40 entry): attention runs TP=4 x SP=8 for the projections
      while sparse_sdpa and the indexer scoring already run 160 query rows a chip with all 64 heads (SP=32 in effect); the
      split costs two 10.5 MB head<->seq all_to_all per layer (attention.py:447-452, 22 ms a chunk, more than sparse_sdpa),
      the q_a RS+AG of a 2.3 MB bf16 partial (q_a.py:78-84), the wo_b RS of a 6.6 MB bf16 partial (attention.py:715), 4x redundant
      norm / RoPE on the same rows, and ~1525 of ~2030 op calls a chunk are attention''s. DeepSeek-V3''s sparse MLA (models/demos/deepseek_v3_d_p/tt/mla/mla.py:2238-2358,
      indexer.py:1000-1021) keeps top-k local and reshards heads->seq only when heads/tp < 32. Deployment box is the 8x4 (owner):
      attention weights replicated on all 32 chips fit (+3.8 GiB a chip, estimate; check plan_memory). Owner focus: host time
      per chunk (host-bound: warm wall ~400 vs device ~220 ms), device time not worse. Behind the named setting in tt/settings.py
      (default on, ''off'' = today''s path); accuracy within the recorded limits (never a precision raise; the bf16 TP partial
      sums disappearing is expected to help). Derive every size from the mesh (no 8x4 literals). Do not touch tt/engram*.py.

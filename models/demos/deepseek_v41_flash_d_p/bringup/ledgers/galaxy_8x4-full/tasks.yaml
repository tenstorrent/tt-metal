- id: P.83
  title: 'OWNER 2026-11-19 perf: mhc_post to its DRAM roofline (7.8 -> <= 3 ms a chunk at 142k; ~40 us a call vs 137-169 us
    measured)'
  step: perf
  role: perf
  device: true
  deps:
  - P.87
  paths:
  - models/demos/deepseek_v41_flash_d_p/tt
  - models/demos/deepseek_v41_flash_d_p/tests/

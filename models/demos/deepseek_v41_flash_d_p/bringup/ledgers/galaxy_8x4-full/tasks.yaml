- id: PB.7C
  title: 'OWNER 2026-11-20 packed prefill: one indexer ring call for glued chunks (two+ lanes a device) and no program build
    or extra upload per segment layout (glued lane maps as runtime args / device tables in the chunk''s descriptor input);
    walls with a fresh AgentX layout every chunk'
  step: perf
  role: perf
  device: true
  deps:

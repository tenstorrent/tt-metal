  - models/demos/deepseek_v41_flash_d_p/bringup/known_issues.md
  brief:
    details: |-
      OWNER 2026-11-12. FIX.26's gate passed but git refused its commit: the pre-commit hook check-large-files (500 KB limit) rejects ledgers/galaxy_8x4-full/state_metrics.json (515,706 bytes now; F253: every task's gate metrics beside state.json, ledger.py:250, written on every gate). FIX.26 stays COMMIT_PENDING until this is fixed. Other ledger files grow the same way: history_state.json 290 KB, state.json 146 KB today.

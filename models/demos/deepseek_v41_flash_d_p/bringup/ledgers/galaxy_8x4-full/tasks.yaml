- id: P.37
  title: 'MOE_BLOCK_SRC=main (Marko''s reworked block, no DRISC): functional parity with the carried block (SE_PACK_PRECISE, NORM_INTO_MOE, DECODER_SKIP=replay128 and every other setting it honours)'
  step: perf
  role: perf
  device: true
  deps:
  - P.34
  paths:
  - models/demos/deepseek_v41_flash_d_p/tt
  - models/demos/deepseek_v41_flash_d_p/tests/
  - models/demos/moe_block_main
  - ttnn/ttnn/bringup
  brief:
    details: 'OWNER 2026-11-06. Marko''s reworked MoE block (mstaletovic/moe-block-main @ 0c0bbe59d98, which does not use the DRISC cores the serving framework''s KV Manager uses) is ported beside the carried block: C++ ops ttnn/ttnn/bringup/moe_block_main_ttnn (ttnn.bringup.moe_block_main.*), Python models/demos/moe_block_main, DS41 adapter tt/moe_block_main_adapter.py, switch MOE_BLOCK_SRC (carried / main; commits bc71f592543..906a493eabb; report: /scratch/dnijemcevic/rebase/moe_main/, the MOE_BLOCK_SRC description in tt/settings.py lists what main lacks). Give the main block the three features the carried block has, each behind its existing setting so MOE_BLOCK_SRC=main honours it, by porting the logical change: read how each was done for the carried block (git log -S / --grep on the setting and task id, the settings.py description, its task here and BREADCRUMBS) and make the equivalent change in the main block (the bring-up copy; never stock ops, never the carried block). (1) SE_PACK_PRECISE (FIX.9, DS41-132): the fused head''s shared expert packs its bfp8 h with one rounding from fp32 DEST at the group''s shared exponent, as the reference casts h once. (2) NORM_INTO_MOE (P.21): ffn_norm writes the block''s own input buffer in place and, through the rms_norm fork''s bfp8_twin option, the head''s bfp8 x in the same program (no bf16 copy, no separate typecast); bit-identical outputs on vs off. (3) DECODER_SKIP=replay128 (P.31): the main block runs the decoder tail chunk (the last <= 128 rows, TtDS41Model.build_tail) instead of raising. FUNCTIONAL PARITY (owner 2026-11-06): beyond these three, every setting value and code path the carried block honours must work on MOE_BLOCK_SRC=main with the same results; first audit every setting in tt/settings.py that the carried block or its adapter reads (and every value), list each as works / ported / out of scope, and port the missing ones the same way. Out of scope (owner): the carried block''s prepared-program / HOST_ALLOC hooks (P.2, P.14, P.15, TAIL_A2A_PREPARED and similar host-launch tricks: the C++ ops cover them) and mixed expert formats (EXPERTS_IMPL=bfp8_down4 and similar per-matrix combos); uniform formats (bfp4_mse, bfp4, bfp8) are in scope. Put the audit table in the report. Add tests for each (fork tests for every fork option; a DS41 test that SE_PACK_PRECISE bit-matches the reference rounding and that NORM_INTO_MOE on / off are bit-identical, on MOE_BLOCK_SRC=main), and run them before ending. Agent rules 18 (at most 110 cores an op) and 19 (no single-card device jobs) hold. Do not profile the model yourself: the orchestrator measures off vs on at 51200; the gate runs on MOE_BLOCK_SRC=main, including P.31''s short-turn test with replay128. Report in plain language: what each feature needed in the main block, tests added, per-layer MoE device / host ms before / after (before: main 2.91 / 1.24 ms, carried 2.39 / 1.70 ms at 51200).'
  ab:
    env:
      MOE_BLOCK_SRC: main
      SE_PACK_PRECISE: 'off'
      NORM_INTO_MOE: 'off'
      ENGRAM_TABLE: resident
    change:
      MOE_BLOCK_SRC: main
      SE_PACK_PRECISE: 'on'
      NORM_INTO_MOE: 'on'

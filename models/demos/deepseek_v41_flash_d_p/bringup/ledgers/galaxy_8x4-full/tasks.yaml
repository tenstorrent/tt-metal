  brief:
    prior_work: 'P.49 (54b8cfd0793: the old mhc_post op), P.83 (bdbd25c2e83: mhc_post fast, each W block read once from DRAM
      and shared via L1: device -1.1..-1.5 ms a chunk; ffn_residual 110.8 us, attn_residual with feed 141.0 us a call on the
      Galaxy''s slowest chip). Colleague''s op (Milan Alimpic, AI-generated): branch origin/malimpic/2026_11_13_2257_run1_mhc_post
      tip db6a1caa5d6, op commit f1bdc1a4c93 (ttnn/ttnn/operations/mhc_post/: Python program descriptor + 6 kernels; changelog.md
      / op_design.md; adapter tests/.../mhc_post/bringup_adapter.py); report https://claude.ai/artifact/PM6Xsaenvif94xKQ4Tcx2x:
      his op 100.6 / 122.0 us vs our P.83 110.8 / 141.0 (his baseline was P.49, not P.83).'
    details: 'OWNER 2026-11-20 (binding): take TWO IDEAS from the colleague''s op into OUR OWN mhc_post fork (ttnn/ttnn/bringup,
      the P.83 kernels); do NOT port his op, his framework or his October code-gen fork or _op_contract tests; read his kernels
      (git show f1bdc1a4c93 / db6a1caa5d6 -- ttnn/ttnn/operations/mhc_post) for the ideas only. Stay a C++ descriptor op (OV-23),
      110-core cap (FIX.15). Idea 1, feed lands in L1: the workers write the other TP chips'' y directly into the send cores''
      L1 (no DRAM staging); his feed call 127 -> 113 us (QuietBox 2). Idea 2: interleaved core placement of the cores sharing
      a W slice + the fused SFPU mix; his no-feed call 111 -> 96 us. Fold in our own pending ''hc transposes'' step (~-6 to
      -10 us a call) if it fits the same change. Expected ~-1 ms device a chunk total (40 calls; idea 1 ~-0.3 ms, idea 2 +
      transposes the rest) at 5120 and at the packed 8192 path (256 rows a chip: re-tune; most per-call time is fixed overhead,
      the gain may not scale with rows). Keep it only at >= ~1 ms device a chunk (or a clear simplification), behind the call-time
      switch MHC_POST_V2 (in batch_call_settings). Op-level: bit-identical to the current op where the sum order is unchanged,
      else within the reference limits with the reason stated; repeat-run determinism of the op (his had none). Bounded waits,
      every awaited semaphore signalled, NOC writes inside buffers, smallest shape first (P.83''s probes hung once). This
      gate is the 5120 accept gate (one fresh 40-layer process) + walls; PB.8P then runs the packed 8192 oracle and walls
      with the switch on (one geometry a gate). OWNER RULES FOR EVERY PB TASK (binding): read models/demos/deepseek_v41_flash_d_p/bringup/PACKED_RULES.md
      first.'

- id: PB.8
  title: 'OWNER 2026-11-20 perf: mhc_post fork, two ideas from a colleague''s op (feed lands in L1; interleaved W-slice cores
    + fused SFPU mix) + our hc transposes: ~-1 ms device a chunk'

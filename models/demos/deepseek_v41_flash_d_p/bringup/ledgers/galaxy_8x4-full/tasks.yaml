  brief:
    prior_work: 'dnijemcevic/moe_replication P.46 (MOE_REPLICAS: one extra expert slot a chip filled at load from a static
      table, a replicated expert''s tokens split evenly over its holders; in-sample oracle quick wall 181.7 -> 167.1 ms, bit-identical),
      P.48 (online / frozen-after-chunk-0: rejected, frozen = off within noise), P.47 (runtime slot copy: not needed here);
      bringup/deepseek_v41_flash_d_p/moe_replication @ b9a45fb0b80 P.52-P.62b (replicas on the old MoE block: extra slot +
      routing, P.55c planner split, P.56 previous chunk), P.69-P.71; FIX.33 (owner 2026-11-15: replication off model_bringup,
      reversed 2026-11-19 for a STATIC set only). X.9 (no stable hot set across texts) and the offline result below.'
    details: 'OWNER 2026-11-19 (reopened): STATIC expert replicas for an agentic (AgentX-like) workload: 32 replicas a layer
      = one extra expert a chip (13 experts a chip instead of 12), chosen OFFLINE, loaded at startup with the weights, never
      copied at run time. No dynamic placement, no previous-chunk learning (parked on tt-d-gen). The replica set is given:
      results/P.84_replicas.json (per layer {expert: replica chip}; chosen on code + 4 agentic sessions; results/P.84_offline.{txt,py},
      P.84_sessions.json). Offline (DS41-299 fit, 14 agentic positions x 4 chunks, one load): agentic held-out sessions 15.6
      -> 11.1 ms a chunk with the best split of each replicated expert''s rows between its home and replica chips (12.6 with
      an even split), code 16.6 -> 11.3, prose 21.8 -> 20.5, multilingual 20.3 -> 18.5: no text slower. Implement: (1) the
      13th expert slot a chip, filled at load from the table (reuse the replica branch''s slot / placement / dispatch code:
      read it first, port only what fits Marko''s moe_block_main block: sparse_dispatch_2d routes a token''s pick of a replicated
      expert to home or replica, routed_experts_combine computes both slots, the combine sums them); (2) the split of a replicated
      expert''s rows between its two chips decided per chunk on the device (or in the fused head) as a pure function of the
      chunk''s routing counts (balance the two chips'' tiles: best split; the even split is the fallback if the best split
      costs more than it saves): determinism = bit-identical repeats; outputs within the accuracy limits (the same expert
      weights wherever a row runs; the combine''s summation order must stay fixed). Replica DRAM: 17.9 MiB a layer a chip:
      0.35 GiB a chip for layers 0-19 (the prefill path), 0.70 GiB for 40: state it measured. Behind MOE_REPLICAS (off = today,
      bit-identical). Gate walls: agentic held-out sessions (positions 145408 and 770048 are in held-out sessions P.53 / P.55c)
      and prose at 142k and 1M. Stop rule: if the agentic held-out wall at 142k gains < 3 ms, or any text gets slower beyond
      noise, stop and report. One model load per gate.'

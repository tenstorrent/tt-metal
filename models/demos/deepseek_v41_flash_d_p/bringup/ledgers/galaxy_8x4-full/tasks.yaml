    details: 'OWNER 2026-10-31 (best effort, configurable): add the setting DEEP_LAYERS = all | tail, DEFAULT all (today''s
      model, unchanged: the tt-d-gen main contract and our tests need every layer''s full history). With tail: every chunk
      runs layers 0-19 in full plus layer 20 (the last KV source: its compressed rows and index keys must cover the whole
      history); layers 21-39 are skipped for normal chunks; the model keeps a rolling buffer of layer 20''s output for the

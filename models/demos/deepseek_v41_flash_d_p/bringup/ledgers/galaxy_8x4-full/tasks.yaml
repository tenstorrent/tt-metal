  - models/demos/deepseek_v41_flash_d_p/bringup/hooks.py
  - models/demos/deepseek_v41_flash_d_p/bringup/ledgers/tt
  brief:
    details: 'Root-cause the real-time profiler failure on this Galaxy: every 8x4 mesh open logs "Real-time profiler disabled
      on device 7 / 10: D2H socket construction failed (Failed to pin pages for DMA buffer ... size 0x201000 ... flags 0x4:
      Invalid argument)", always devices 7 and 10 (B.1, W.1, M.1 logs). Host facts: KMD 2.11.0, iommu=pt (passthrough), 1412
      x 2 MB hugepages, HugePages_Free 0 while a mesh is open; the buffer is 2 MB + 4 KB. Hypothesis to test, not assume:
      under iommu=pt the pin needs physically contiguous memory and a 2 MB + 4 KB buffer only pins when it happens to be contiguous
      (or the hugepages run out by device 7 / 10). Find the actual cause with evidence (pin a buffer of that size per device,
      hugepage use per device during open, the D2H socket allocation code), fix it at its cause in tt_metal (or the framework
      if the cause is ours), so the real-time profiler runs on all 32 chips; add a check that reports a profiler that failed
      to start before a perf task relies on it. Record the cause and fix in known_issues.'
    gate_tasks:
    - B.1
    - W.1
- id: FIX.4
  title: 'Routed-expert weights: use the flat-expert fork''s laid-out weight cache and a fast miss path'
  step: overseer_fix
  role: overseer
  precheck: false
  deps:
  - W.1
  gate:
    cmd: BRINGUP_TASK=W.1 BRINGUP_RUNG=seed scripts/run_safe_pytest.sh --run-all --no-precompile models/demos/common/bringup/tests/test_ladder.py
    metrics:
      err_layer_L*: <= limit
      err_state_*_L*: <= limit
      host_transfers_per_layer: == 0
  device: true
  paths:
  - models/demos/deepseek_v41_flash_d_p/tt
  - models/demos/deepseek_v41_flash_d_p/bringup/hooks.py
  brief:
    details: 'Every test process spends ~113 s PER LAYER in TtExperts._load_block/_load_flat (M.1 precheck log 2026-10-26
      22:07-22:15: between create_global_expert_idx_table and EXPERTS_FLAT, 113 s each of L00..L03; everything else of a layer
      ~5 s). 40 layers = ~75 min of host work before every M.1 / ladder / K.1 / X.* run. Cause: tt/experts.py builds every
      expert with fp4_dequant + per-tensor torch.equal asserts + _bfp8_exact in Python, then FlatRoutedExpert packs and uploads
      the layout, with no cache. The fork already supports it (ttnn/ttnn/bringup/flat_routed_expert_ttnn/flat_expert.py: cache_prefix=
      and weights as a CALLABLE only called on a cache miss; plan-hashed file names; GLM-5.3 models/demos/glm53_flash_d_p/tt/experts_ag.py:325
      uses it). Do: (1) pass cache_prefix (under the run''s weight-cache dir, keyed by the checkpoint actually loaded: revision
      + scaled/real + layer + EXPERTS_IMPL) and a callable that does the current dequant + checks, so a hit skips all host
      dequant/packing; on a bfp4 hit keep bfp4_stats correct (cache them next to the weights) or document why not needed;
      (2) profile the miss path (one layer, CPU, nice 19) and cut its cost honestly (vectorised dequant over all experts of
      a chip, one exactness check per stacked tensor instead of per matrix, no repeated .float() copies); no change to values
      or layout (bit-identical tensors; the exactness asserts stay on the miss path). Same check for dense weights (DENSE_BFP8,
      ~5 s/layer) only if cheap. Report: per-layer load time miss before/after and hit, W.1 load wall time miss vs hit. Gate:
      W.1 must still pass; run it twice (second run must hit the cache).'
    gate_tasks:
    - W.1

- id: P.8
  title: 'INDEXER_TOPK_LOCAL: the indexer top-k stays on the chip that scores it (option C of the SP=32 study)'
  step: perf
  role: perf
  device: true
  deps:
  - P.7
  paths:
  - models/demos/deepseek_v41_flash_d_p/tt
  - ttnn/ttnn/bringup
  brief:
    details: 'OWNER DECISION 2026-10-29 (order P.7 -> C -> B -> A -> P.4 -> P.5). Option C: the indexer scores 160 query rows
      a chip already; drop the top-k all-gather over TP (indexer.py:315) and the mesh_partition back in attention (sparse_attention.py:225
      / 244), as DeepSeek-V3 does when attention is not head-sharded. Estimate: ~46 op calls and ~0.7 ms device a chunk fewer,
      ~6-9 ms wall. Study (overseer 2026-10-29, read-only agent; supervision.md 07:40 entry): attention runs TP=4 x SP=8 for
      the projections while sparse_sdpa and the indexer scoring already run 160 query rows a chip with all 64 heads (SP=32
      in effect); the split costs two 10.5 MB head<->seq all_to_all per layer (attention.py:447-452, 22 ms a chunk, more than
      sparse_sdpa), the q_a RS+AG of a 2.3 MB bf16 partial (q_a.py:78-84), the wo_b RS of a 6.6 MB bf16 partial (attention.py:715),
      4x redundant norm / RoPE on the same rows, and ~1525 of ~2030 op calls a chunk are attention''s. DeepSeek-V3''s sparse
      MLA (models/demos/deepseek_v3_d_p/tt/mla/mla.py:2238-2358, indexer.py:1000-1021) keeps top-k local and reshards heads->seq
      only when heads/tp < 32. Deployment box is the 8x4 (owner): attention weights replicated on all 32 chips fit (+3.8 GiB
      a chip, estimate; check plan_memory). Owner focus: host time per chunk (host-bound: warm wall ~400 vs device ~220 ms),
      device time not worse. Behind the named setting in tt/settings.py (default on, ''off'' = today''s path); accuracy within
      the recorded limits (never a precision raise; the bf16 TP partial sums disappearing is expected to help). Derive every
      size from the mesh (no 8x4 literals). Do not touch tt/engram*.py. Do not edit frozen tests; if a state readback (e.g.
      top-k) needs another layout, adapt the model''s host readback (to_host / state), not the test. Report: device ms per
      section and op calls per chunk before / after (BRINGUP_PROFILE_OPS), the warm wall before / after with DS41_ENGRAM_TABLE=resident,
      DRAM per chip, collectives per layer before / after.'
  ab:
    env:
      DS41_INDEXER_TOPK_LOCAL: 'off'
      DS41_ENGRAM_TABLE: resident
    change:
      DS41_INDEXER_TOPK_LOCAL: 'on'
      DS41_ENGRAM_TABLE: resident
  gate:
    cmd: BRINGUP_RUNG=last scripts/run_safe_pytest.sh --run-all --no-precompile models/demos/common/bringup/tests/test_ladder.py
      && DS41_ENGRAM_TABLE=resident scripts/run_safe_pytest.sh --run-all --no-precompile models/demos/common/bringup/tests/test_profile.py
    metrics:
      err_layer_L*: <= limit
      err_state_*_L*: <= limit
      err_final_hidden: <= limit
      top5_overlap: '>= limit'
      chunk_wall_ms: < 434
      device_ms_total: <= 230

  paths:
  - models/demos/deepseek_v41_flash_d_p/tt
  - models/demos/deepseek_v41_flash_d_p/tests/
  - ttnn/ttnn/bringup
  brief:
    details: 'OWNER 2026-11-06 (PD migration first cut: decode''s cache formats are still open, so for now both KV caches are 16-bit end to end; the owner will return to 4-bit compressed KV later, so keep bfp4_rows / bfp8_tiles working and only change the defaults). Make the default compressed KV attention table bf16 (CKV_FORMAT=bf16: the history as bf16 rows, read by sparse_sdpa in bf16) and the window KV bf16 (computed and read in bf16, no 8-bit rounding). Today WINDOW_KV_FORMAT=bf16_tiles (P.26: the per-chip region with the neighbour send) asserts CKV_FORMAT=bfp4_rows on compressed layers (tt/sparse_attention.py:301: the window comes to the fork as kv_window next to the bfp4 table). Prefer making bf16_tiles work with CKV_FORMAT=bf16 (keep the per-chip region and neighbour send; the compressed layers read the bf16 table plus the bf16 region, e.g. through the sdpa fork''s kv_window with a bf16 table, or stock sparse_sdpa if it can take both); if that is not reasonable, use WINDOW_KV_FORMAT=bf16 (the row table before P.18) and say what it costs. INDEX_K_FORMAT stays bfp4. The served caches are already bf16 (contract unchanged). Add fork tests for every fork option you add. Agent rules 18 (at most 110 cores an op) and 19 (no single-card device jobs) hold. Do not profile the model yourself: the orchestrator measures off vs on at 51200. Report in plain language: what changed, accuracy (it should be closer to the golden than 4/8-bit: err_state_compress_kv_*, err_state_window_kv_*, layers, final hidden) and device / host ms a chunk before / after.'
  ab:
    env:
      CKV_FORMAT: bfp4_rows
      WINDOW_KV_FORMAT: bfp8_tiles
      ENGRAM_TABLE: resident
    change:
      CKV_FORMAT: bf16
      WINDOW_KV_FORMAT: bf16_tiles
      ENGRAM_TABLE: resident
  ab_positions:

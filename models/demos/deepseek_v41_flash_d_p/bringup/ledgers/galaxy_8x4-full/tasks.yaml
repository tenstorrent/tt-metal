  - models/demos/deepseek_v41_flash_d_p/bringup/ledgers/galaxy_8x4-full/results/PB.5C_packed_walls.md
  - models/demos/deepseek_v41_flash_d_p/bringup/ledgers/galaxy_8x4-full/results/PB.7C_glued_walls.md
  brief:
    prior_work: 'PB.7B (glued v2: attention in passes over per-chip lane options, sparse_sdpa kv_lane_rows; its BREADCRUMBS
      ''What is left'': new descriptors build new programs for the lane maps (sdpa kv_lane_of_chip and the ring''s lane_buffer
      are hashed into the program key) and upload ~5 per-chunk tables; the walls warm them up (each case repeats one layout),
      serving would pay them on every new descriptor). PB.7B walls: 5 x 1.6k 60.5k, AgentX mixes 56.2 / 52.2k (repeated layouts).'
    details: 'OVERSEER 2026-11-20 19:50 (attempt 3+, owner binding, OV-67): attempt 2 reached 0 program builds and one ring
      call, but the host still builds per-layout tables and makes per-descriptor uploads (glued_new_layout_ms 3.4 / 11.8 /
      1.0 on the AgentX mixes): NOT accepted. Finish it: per chunk the host writes ONLY the token ids + the chunk descriptor
      (per segment slot, start, length, write_start) in ONE upload; every other per-chunk table (window index lists, row positions,
      valid lengths, top-k lengths, MoE pad words, piece tables, lane maps, served-write indices) is derived ON THE DEVICE
      by prepared programs from the descriptor; no per-descriptor host caches. Gate: glued_new_layout_ms* <= 1.5 on fresh
      layouts. Keep everything attempt 2 built (it stands in the tree). OWNER 2026-11-20 16:00 (binding; no shortcuts: measure
      what serving pays). In serving nearly every chunk has a new segment layout (AgentX turn lengths vary), so: (1) NO program
      build per layout: every layout-dependent value (per-chip segment / slot index, row starts, history lengths, the ring''s
      lane buffers and extents, top-k valid lengths, window classes) is a per-call runtime argument or a small device table
      the kernels read; the program cache key depends on shapes and switches only (sparse_sdpa kv_lane_rows is the pattern:
      per-core runtime args set every call); every Python-built op prepared (prepare_program / run_prepared). (2) ONE upload
      a chunk: the per-chunk tables become part of the chunk''s descriptor input, written with the token ids (as tt-d-gen
      would deliver them), no separate small uploads. (3) MEASURE honestly: test_glued_walls gives every timed chunk a NEW
      random AgentX layout (no layout repeats; seeds logged) and records glued_program_builds_after_warmup (program-cache
      misses after the warm-up chunks; must be 0) and the host ms a new layout costs; report fresh-layout walls next to PB.7B''s
      repeated-layout walls. (4) ONE indexer ring call for glued chunks (owner 16:10): the ring_indexer_score_dsa fork scores
      up to N (query-row range, lane, start, kv_len) entries a device (runtime args; ranges are whole tile rows since starts
      are 32-aligned): the reader addresses each row block''s lane key share (the lanes ring already carries every lane''s
      keys), compute splits the Q.K^T loop by range with per-range causal geometry, top-k uses each row''s own valid length;
      the lane -> buffer map becomes a runtime arg (not hashed). This removes PB.7B''s second indexer pass (5.6 ms at 139k,
      15.8 ms on a 35k-444k AgentX mix) and the top-k phase copies; record glued_indexer_ring_calls_per_layer (== 1). Op-level
      test vs the host first (two segments meeting inside a chip at every tile-row offset, short and long histories, several
      segments in one ring); fork CHANGELOG. Behind ONE call-time switch PACKED_GLUED_DYNAMIC=off|on (default off). Bit-identical
      to PB.7B (glued + lane oracle). TT-D-GEN SHAPES (owner 2026-11-20 16:00, from the tt-d-gen source, /scratch/dnijemcevic/tt-d-gen
      = origin/main Nov 6): one fixed chunk_size (a multiple of 32), every chunk padded to it, only a request''s last chunk
      partial; every start 32-aligned (prefix resumes at 64-token blocks; DSv4 recurrent: requests start at 0, chunk starts
      are multiples of chunk_size, except a last chunk clamped to max_seq_len - chunk_size); lengths 1..chunk_size (1-token
      segments ARE reachable and supported). Glued packing: segment starts 32-aligned, splits only at 32-aligned positions
      (the continuation starts 32-aligned; <= 31 pad rows a split). Do not build or test unaligned starts (31, 33, ...). OWNER
      RULES FOR EVERY PB TASK (binding): read models/demos/deepseek_v41_flash_d_p/bringup/PACKED_RULES.md first.'
  gate:
    cmd: BRINGUP_CHUNK=8192 DS41_PACKED=on DS41_PACKED_MOE=on DS41_PACKED_GATHER_HIDE=on DS41_PACKED_ATTN_ONECALL=on DS41_PACKED_HOST_FAST=on

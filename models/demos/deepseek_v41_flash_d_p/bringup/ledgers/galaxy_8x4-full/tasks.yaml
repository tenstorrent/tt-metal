- id: P.87
  title: 'OWNER 2026-11-19 perf: engram tables on the Galaxy (hash + row gather on the device, no ids readback): ~-5 ms a
    chunk at 142k'
  step: perf
  role: perf
  device: true
  deps:
  - X.10
  paths:
  - models/demos/deepseek_v41_flash_d_p/tt
  - models/demos/deepseek_v41_flash_d_p/tests/

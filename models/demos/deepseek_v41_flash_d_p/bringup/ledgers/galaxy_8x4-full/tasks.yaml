- id: P.76
  title: 'OWNER 2026-11-18: item 3 of the slot-state page: the indexer scores the SERVED fp8 index rows, no private k8 copy
    (correct whatever wrote the slot''s history)'
  step: perf
  role: perf
  device: true
  deps:
  - FIX.38
  paths:
  - models/demos/deepseek_v41_flash_d_p/tt
  - models/demos/deepseek_v41_flash_d_p/tests/
  - models/demos/deepseek_v41_flash_d_p/bringup/BREADCRUMBS.md
  - models/demos/deepseek_v41_flash_d_p/bringup/known_issues.md
  - ttnn/ttnn/bringup
  brief:
    details: "OWNER 2026-11-18. Item 3 of the slot-state page (https://claude.ai/artifact/ARpCTqB11QGLrwjGxR6Adz): the prefill\
      \ indexer scores a PRIVATE bfloat8_b copy of the index keys (k8, INDEX_K_COPY=bfp8; tt/compressor.py TtServedRows /\
      \ TtCompressCaches ~:430-530 _put8; tt/indexer.py _keys :251), correct only if this process wrote every earlier chunk\
      \ of the slot: after a store load / d2p pull / a reused slot it holds zeros or another user's keys (silently wrong top-k).\
      \ The served index keys are Blaze decode's fp8 192-byte rows (INDEX_K_SERVED=fp8_row192: bytes 0-127 e4m3, 128-131 the\
      \ fp32 scale, 132-191 zero; written per chunk by fp8_rows_tile = per_token_cast_to_fp8 + ttnn.bringup.pack_fp8_rows;\
      \ TP-replicated, SP-sharded, so each chip already holds its SP row's served rows: no mesh traffic needed beyond the\
      \ ring score's own ring over SP). Goal: the indexer reads ONLY served state: every chunk the served rows [0, start)\
      \ (and the chunk's own) are decoded to the scoring format (bfloat8_b tiles of 128 dims, as the ring score reads today)\
      \ into a persistent per-size buffer (no per-user copy; like P.74's gather buffer), then the existing ring score (ttnn.bringup.ring_indexer_score_dsa)\
      \ runs unchanged. Decoder: no device reader of the 192-byte rows exists today; the stock ttnn.experimental.deepseek_prefill.per_token_cast_back\
      \ (decode x scale -> bf16, needs FP8_E4M3 row-major input; its token_count_aware mode reads a scale packed in the row\
      \ tail) plus an unpack/bitcast, or a small bring-up fork (ttnn/ttnn/bringup, e.g. an unpack_fp8_rows next to pack_fp8_rows)\
      \ that writes bfp8 tiles directly: pick the fastest deterministic one; read /data/dnijemcevic/bringup/handoff_20261118/step1_report.md\
      \ \xA73. Hide the decode like P.75 hid the gather if it costs (the served rows [0, start) are complete before the chunk:\
      \ the engram wait, tt/model.TtDS41Model.prefetch_history). Precision: the scored keys become bfp8(fp8(key)) instead\
      \ of bfp8(key): NOT bit-identical to today by construction (fp8 is lossy), but prefill then scores what decode scores;\
      \ the gate's accuracy limits judge it (do not loosen any). Determinism must stay exact. Put it behind a switch (e.g.\
      \ INDEX_K_SOURCE=private|served), keep the private path working. No weight-layout change (no weight rebuild), matmuls\
      \ within 110 cores, every Python-built op through ttnn.bringup.prepare_program / run_prepared, no fork regression suites\
      \ (only tests you add for a new fork, CPU / one device). Check it runs (test_decoder_skip_decode, determinism), then\
      \ stop: the orchestrator measures both sides. Report short: per-chunk cost of the decode at 51k / 256k / 1M, hidden\
      \ or not, and the accuracy change."
  ab:
    keep_default: true
    env:
      INDEX_K_SOURCE: private
    change:
      INDEX_K_SOURCE: served
  ab_mode: full
  ab_rungs:
  - last
  gate:

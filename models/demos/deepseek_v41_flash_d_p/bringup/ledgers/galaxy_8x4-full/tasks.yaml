- id: P.6
  title: 'ENGRAM_ASYNC: engram rows looked up and uploaded off the critical path (layer 14 behind layers 1-13)'
  step: perf
  role: perf
  device: true
  deps:
  - FIX.7
  - FIX.10
  - FIX.8
  paths:
  - models/demos/deepseek_v41_flash_d_p/tt
  brief:
    details: 'OWNER DECISION 2026-10-28: overlap ALL engram host work with dispatch; nothing to decide, no stop for the owner
      (the overseer accepts it as a clean win: gate PASS, accuracy unchanged, warm wall better, device not worse). The owner
      assigned this engram task to the Galaxy session (the 2x2 session is told). Tables are resident in host RAM as bfp8 (ENGRAM_TABLE=resident,
      ENGRAM_ROWS=bfp8; bringup/engram_handoff.md, ENGRAM_HOST_PATH.md 3e). Today begin_chunk (tt/model.py:736) does both
      engram layers'' hash + lookup + pack + upload synchronously on the main thread BEFORE embed and layer 0 are dispatched;
      the run is host-bound (wall ~544 vs device ~220 ms), so all of it adds to the wall. Change: begin_chunk starts both
      layers'' jobs (hash, lookup, pack AND upload) on background threads and returns at once; the main thread dispatches
      embed, layer 0, ... meanwhile; take_engram_rows(i) waits for layer i''s job just before layer i''s engram op (layer
      1 overlaps layer 0, layer 14 overlaps layers 0-13). The upload must not serialize behind the queued layers: use a second
      command queue + an event that layer i''s engram op waits on when the mesh has one (check how tt-d-gen opens the mesh),
      else issue it from the worker so it lands before layer i is dispatched. Keep the GIL-holding parts of the job minimal
      (torch / numpy work releases it). Rows bit-identical to today''s (tests/test_engram_bfp8.py, tests/test_engram_table_modes.py
      pass); deterministic. Behind the setting ENGRAM_ASYNC in tt/settings.py (default on, ''off'' = today''s path). Measure
      with DS41_ENGRAM_TABLE=resident (pytest defaults to random, F222). Report: per engram layer the ms of hash, lookup,
      pack and upload (the upload / PCIe part was never measured) and how much of it is now hidden; the warm wall before/after
      (F196 + F205) and the device time. Next-chunk prefetch (hides even the first wait) needs later tokens, which begin_chunk(tokens,
      start) does not get under the serving contract: say in the report whether the engine has them; do not change the contract.'
  ab:
    env:
      DS41_ENGRAM_ASYNC: 'off'
      DS41_ENGRAM_TABLE: resident
    change:
      DS41_ENGRAM_ASYNC: 'on'
      DS41_ENGRAM_TABLE: resident
  gate:
    cmd: BRINGUP_RUNG=last scripts/run_safe_pytest.sh --run-all --no-precompile models/demos/common/bringup/tests/test_ladder.py
      && DS41_ENGRAM_TABLE=resident scripts/run_safe_pytest.sh --run-all --no-precompile models/demos/common/bringup/tests/test_profile.py
    metrics:
      err_layer_L*: <= limit
      err_state_*_L*: <= limit
      err_final_hidden: <= limit
      top5_overlap: '>= limit'
      chunk_wall_ms: < 434
      device_ms_total: <= 230
- id: P.7
  title: 'CKV_BFP4_PREPARED: ttnn.bringup.ckv_bfp4 without rebuilding its program descriptor every call (DS41-135)'
  step: perf
  role: perf

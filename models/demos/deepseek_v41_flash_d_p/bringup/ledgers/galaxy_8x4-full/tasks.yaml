- id: P.34
  title: 'POST_COLLAPSE: mhc_post also writes the next sublayer''s collapsed input (no separate mhc_pre_xing collapse pass)'
  step: perf
  role: perf
  device: true
  deps:
  - X.3
  paths:
  - models/demos/deepseek_v41_flash_d_p/tt
  - models/demos/deepseek_v41_flash_d_p/tests/
  - ttnn/ttnn/bringup
  brief:
    details: 'OWNER 2026-11-06 (mHC study, opportunity #1). The next sublayer''s collapse uses pre weights that are already known when the residual runs (DS41-3: ffn_hc collapses with attn_hc''s mix, which attn_residual has; the next layer''s attn_hc collapses with ffn_hc''s mix, which ffn_residual has). mhc_post''s stats kernel already holds the four new streams of a column in DEST (mhc_post_stats_compute.cpp): also write y = sum_k pre_k * X''_k there (the collapsed bf16 input of the next sublayer), and run the Sinkhorn coefficients on the row root after mhc_post''s existing partial-row reduction, so the next step needs no mhc_pre_xing pass that re-reads the 4 x 5120 streams (6.5 MB a call). Expected: about 3-3.5 ms device and 80 launches (~7.7 ms host) a chunk. Risks: DEST room for 4 more coefficient tiles (the kernel splits top / bottom halves); stay bit-identical by rounding each new stream to bf16 in registers before the collapse with the packer''s rounding. Layer 0 keeps its first collapse (the embedding emits no row). Setting POST_COLLAPSE (on / off). Each change behind its own setting in tt/settings.py (default on once accepted; off = today''s path) so a regression can be isolated by its switch. Agent rules 18 (at most 110 cores an op) and 19 (no single-card device jobs) hold; forks first; precision at the reference''s level: aim for bit-identical results with the switch on (the same bf16 rounding points; if not bit-identical, every gated metric within its limit and say why). Add fork tests for every fork option you add. Do not profile the model yourself: the orchestrator measures off vs on at 51200 and 512000. Report: ops / launches removed a chunk, device and host ms a chunk before / after. Study: /scratch/dnijemcevic/rebase/mhc/notes.md (per-layer flow, costs, file:line).'
  ab:
    env:
      POST_COLLAPSE: 'off'
      ENGRAM_TABLE: resident
    change:
      POST_COLLAPSE: 'on'
      ENGRAM_TABLE: resident
  ab_positions:
  - 51200
  - 512000
  gate:
    cmd: BRINGUP_RUNG=last scripts/run_safe_pytest.sh --run-all --no-precompile models/demos/common/bringup/tests/test_ladder.py
      && DS41_ENGRAM_TABLE=resident scripts/run_safe_pytest.sh --run-all --no-precompile models/demos/common/bringup/tests/test_profile.py
      && scripts/run_safe_pytest.sh --run-all --no-precompile models/demos/common/bringup/tests/test_contract.py && scripts/run_safe_pytest.sh
      --run-all --no-precompile models/demos/deepseek_v41_flash_d_p/tests/bringup/contract/test_kv_layout.py && scripts/run_safe_pytest.sh
      --run-all --no-precompile models/demos/deepseek_v41_flash_d_p/tests/bringup/contract/test_adapter_acks.py
    metrics:

- id: P.36
  title: 'FFN_FEED: ffn_hc + ffn_norm + the MoE x all_to_all in one program (rows sent over fabric into the head''s input)'
  step: perf
  role: perf
  device: true
  deps:
  - P.35
  paths:
  - models/demos/deepseek_v41_flash_d_p/tt
  - models/demos/deepseek_v41_flash_d_p/tests/
  - models/demos/moe_block
  - ttnn/ttnn/bringup
  brief:
    details: 'OWNER 2026-11-06 (mHC study, opportunity #2; built on P.34 / P.35; after the owner''s moe_block update). The
      only collective left next to mHC on the 8x4 default path is the MoE x all_to_all after ffn_norm (all_to_all_async_generic
      over TP, [160, H] -> [640, H/4] into head.x; moe_block.py:720-722, 997-1010): 4.69 ms max chip, 40 launches, ~13.6 ms
      host with ffn_norm, ~17 ms device idle before it. Have the pass that writes the normalized ffn input send each 1280-column
      block straight into the peer chip''s head.x over fabric (persistent buffer, same address on every chip): ports, fabric
      connections, global semaphores and the ready fence as fabric_reduce_scatter / combine_rf do; a slot in the 110-core
      cap for the ports. The head''s x must be written before the MoE arena is taken. Risks: hangs; the skew wait (~3.7 ms)
      moves into the head, it does not vanish. Expected: about 2.2 ms device and 80 launches a chunk. Setting FFN_FEED (on
      / off). Each change behind its own setting in tt/settings.py (default on once accepted; off = today''s path) so a regression

  brief:
    details: 'OWNER 2026-11-03: the approximate decoder skip, a third value of P.30''s switch: DECODER_SKIP=replay128 (DeepSeek-V4.1-Flash''s
      SWA Bounded Replay, arXiv 2609.19969, n_win 128). The last chunk runs layers 20-39 only on its last 128 positions with
      each window truncated to those positions (no pull-back); a request that appends to a cached prefix replays only the
      prefix''s last 128 tokens through layers 0-19 (truncated windows) before its new tokens. Approximate by design; the
      default stays off (owner decides). Lay the 128-row tail out so the device does not pad it to 32 rows on each of 32 chips
      (e.g. gather it to one mesh row); keep exact and replay128 one code path apart from the tail length. Add tests/bringup/test_short_turn.py:
      time to first token (device and wall, warm) of a 512-token suffix appended to a 51200-token cached prefix, recorded
      as short_turn_ms / short_turn_device_ms, plus its last-position top-5 and final hidden error against the golden; the
      A/B runs it on both sides. OWNER: the window KV state (err_state_window_kv_*, the contract''s window-KV PCC / rel checks)
      is not gated for this value; every other accuracy metric is, and a miss goes to the owner with the table. Model-level
      checks only; no fork regression suites on the 8x4; every Python-built op prepared.'
  ab:
    keep_default: true
    env:
      DECODER_SKIP: exact
      ENGRAM_TABLE: resident
    change:
      DECODER_SKIP: replay128
      ENGRAM_TABLE: resident
  ab_mode: full
  ab_rungs:
  - last

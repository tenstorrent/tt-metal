- id: FIX.21
  title: 'FORMAT_ATTRIBUTION: CPU attribution of the device''s accuracy gap to DeepSeek''s reference, one format at a time'
  step: overseer_fix
  role: overseer
  precheck: false
  deps:
  - FIX.20
  device: false
  paths:
  - models/demos/deepseek_v41_flash_d_p/reference
  - models/demos/deepseek_v41_flash_d_p/tests
  brief:
    details: 'OWNER 2026-11-01: CPU attribution of the device''s accuracy gap, NO DEVICE (device false; the box needs a reboot
      before any device job). FIX.20 measured the device''s logit KL vs the native golden at 2.1-2.2x DeepSeek''s reference
      (numerics official: bf16 + its fp8 / fp4 quantizers), and the per-layer err_* shares say the same (median 0.70, device
      / official error ~1.4-1.8x). Find WHICH of the device''s format and precision choices cause it. No change to tt/ (the
      shipped model); work only in reference/ and tests/bringup/. (1) Add to the CPU reference (reference/ds41_ref.py, next
      to numerics native / official) a device-format emulation with one switch per site, each either ''official'' (the reference''s
      own quantizer and dtype) or ''device'' (what tt/settings.py ships): read tt/settings.py and the tt/ code for the sites;
      at least EXPERTS (bfloat4_b weights, shared exponent per 16 of a tile row, EXPERTS_PRECISION / EXPERTS_IMPL, vs the
      reference''s fp4 e2m1 per 32), the shared expert''s format, INDEX_K_FORMAT / INDEX_Q_FORMAT (bfp4 vs fp4 e2m1 per 32;
      DS41-150), CKV_FORMAT (compressed KV bfp4_rows), WINDOW_KV_FORMAT (bfp8_tiles vs e4m3), ENGRAM table (bfp8), the matmul
      fidelity (MATMUL_FIDELITY / ATTN_FIDELITY HiFi2: emulate its mantissa truncation of the operands as the ttnn docs and
      the repo''s existing fidelity notes say; say exactly how), the bf16 accumulations (COMBINE_ACC, FP32_ACC off where off,
      bf16 cross-chip sums), BF16_ACTIVATIONS, NORM dtypes. Reuse the repo''s existing bfp packers (tt/ckv_codec.py, tt/engram_bfp8.py,
      tests/test_bfp_packer_rounding.py) for the exact device rounding; do not invent a format. (2) VALIDATE the emulation
      before any attribution: all sites ''device'' must reproduce the device''s own errors on layers 0-9 (results/P.26.json
      side ''old'' and results/FIX.20.json: err_layer_L00..L09 and the err_state_* of those layers, rung s10240 or last as
      you run it) within +-25 % per metric, median within +-15 %. If it does not, find what the emulation misses before going
      on and say what it is; a CPU model that does not match the device attributes nothing. (3) Attribution on layers 0-9
      (chained, as the ladder runs them, on a golden chunk with its golden prefix; pick the rung and say why; CPU cost matters,
      say how long each run took): (a) all-device; (b) leave-one-out: all-device with ONE site set back to official, for every
      site; (c) add-one: official with ONE site set to device, for every site; (d) official. Against the native golden, per
      run: err_layer_L00..L09, the err_state_* of those layers, and gap_closed_<site> = (err_all_device - err_leave_one_out)
      / (err_all_device - err_official) at L09 (and the median over L00..L09). Interactions: if the leave-one-out shares sum
      far from 1, say which sites interact. (4) If one or two sites close most of the gap: run (a) and all-device-minus-those-sites
      over all 40 layers at rung last''s chunk and the FIX.20 KL (tests/bringup/test_logit_kl.py''s metric, reusing its cached
      official final_norm) to show what it buys at the tokens; only if it fits in about 3 CPU hours, otherwise say what it
      would cost. Write the test as models/demos/deepseek_v41_flash_d_p/reference/test_format_attribution.py; record metrics
      emu_match_median (median over layers 0-9 of err_emu / err_device), emu_match_worst, sites, gap_closed_<site>, addone_<site>,
      and err_*_L09 per run. Long CPU jobs through devjob (start / wait), never killed; cap CPU to half the cores, nice 19
      (BRINGUP_CPU_THREADS); no device, no fork suites. Report: a table per site (what the device does vs the reference, gap
      closed at L09 leave-one-out and add-one, the device-time cost of switching it if known from tt/settings.py''s notes)
      and a recommendation: which site to A/B on the device first. NO fixed accuracy numbers as limits (F138); the +-25 %
      match is a check of the emulation, not of the model.'
  gate:
    cmd: scripts/run_safe_pytest.sh --run-all --no-precompile models/demos/deepseek_v41_flash_d_p/reference/test_format_attribution.py
    metrics:
      emu_match_median: '> 0'
      emu_match_worst: '> 0'
      sites: '>= 6'
- id: P.27
  title: 'EXPERTS_BFP8: routed experts in bfloat8_b under MOE_IMPL=block, plus the bfp4_mse and bfp8_down4 switch values (P.28
    / P.29 A/B them); A/B bfp4 vs bfp8 at 50k, DRAM per chip at 1M'
  step: perf
  role: perf
  device: true
  deps:
  - FIX.21
  paths:
  - models/demos/deepseek_v41_flash_d_p/tt
  - models/demos/deepseek_v41_flash_d_p/tests/
  - ttnn/ttnn/bringup
  - models/demos/moe_block
  brief:
    details: 'OWNER 2026-11-02: FIX.21 attributed most of the device''s extra error over DeepSeek''s reference to the bfloat4_b
      routed-expert weights (DS41-196: 16.5 % of the e2m1 values move, 0.5 -> 0 and 1.5 -> 2 in every 16-value face row holding
      a 4 or 6; bfloat8_b holds every e2m1 x ue8m0 value exactly in the [N, K] / weights_nk layout). (1) Make EXPERTS_IMPL=bfp8
      work with MOE_IMPL=block (two asserts refuse it today: tt/moe_block_adapter.py and models/demos/moe_block/moe_block.py
      RoutedExperts (dtypes.routed_weights == bfloat4_b; MoEDtypes defaults to it); the flat op already takes wdtype bf8 and
      TtExperts already builds it; check the block''s layout (layout_of, L1 slots sized for 576-B tiles) holds 1088-B bfp8
      tiles; the shared block is used by other models: keep their behaviour unchanged; the block MoE and the flat expert op
      must take bfloat8_b weights in the same weights_nk layout; add a fork option with a test only if the op needs one).
      The default stays bfp4 (a switch-only pick, F241); the owner decides after the A/B. (2) DRAM per chip, measured, not
      estimated: write models/demos/deepseek_v41_flash_d_p/tests/bringup/test_dram.py that loads the model for ONE slot at
      the deployment context (1,048,576 tokens; every served cache and table allocated as serving allocates it) and records,
      from the allocator (ttnn.get_memory_view(device, ttnn.BufferType.DRAM) per chip of the mesh), the DRAM allocated after
      load (dram_load_gib_max / _min over chips) and the peak while one chunk runs at start 1,039,360 (the last whole chunk
      before 1M; sample the allocator after every layer and inside the MoE and attention, report the max over chips and samples
      as dram_peak_gib_max), plus the bytes per group (routed experts, other weights, served caches, tables) from the buffers
      the model allocates, and the allocator''s DRAM capacity per chip (dram_capacity_gib). Recorded, never gated by a fixed
      number. It runs on both sides of the A/B. (3) Agent rules 18 / 19; device jobs over a few minutes through devjob (start
      / wait), never killed. Do not profile the model and do not run the A/B yourself (the orchestrator measures bfp4 vs bfp8
      at 51200 / 512000 / 1039360 and runs the ladder and contract tests on both sides). No fork regression suites; add tests
      only for what you add. Report: memory per group on both sides, and whether bfp8 fits 1M within the 27.2 GiB budget and
      within the physical capacity. (4) OWNER 2026-11-02 (after reviewing GPT-OSS PR #63374, models/demos/gpt_oss/tt/bfp4_quant.py
      on that branch): two more EXPERTS_IMPL values, made here, A/B-ed by P.28 / P.29 (no new agent work there): bfp4_mse
      = bfloat4_b with the shared exponent of each 16-value group (along K in weights_nk, i.e. inside one ue8m0 block) chosen
      by least squared error between the group''s largest exponent and one below it (the large values then saturate at 7;
      ties: the largest), rounded on the host at load and handed to ttnn as bfloat4_b, which must pack it losslessly (add
      a test that ttnn''s packing of the rounded tensor is bit-exact); bfp8_down4 = w1 / w3 in bfloat8_b, w2 (down) in bfloat4_b
      with the bfp4_mse rounding. Each value gets its own expert cache names; the CPU emulation of the device formats (FIX.21,
      _bfp4_round) follows the switch. Log the per-layer changed fraction and worst ||dW|| / ||W|| at load for bfp4_mse as
      for bfp4.'
  ab:
    env:
      EXPERTS_IMPL: bfp4
      ENGRAM_TABLE: resident
    change:
      EXPERTS_IMPL: bfp8
      ENGRAM_TABLE: resident
  ab_mode: full
  ab_rungs:
  - last
  ab_positions:
  - 51200
  gate:
    cmd: BRINGUP_RUNG=last scripts/run_safe_pytest.sh --run-all --no-precompile models/demos/common/bringup/tests/test_ladder.py
      && DS41_ENGRAM_TABLE=resident scripts/run_safe_pytest.sh --run-all --no-precompile models/demos/common/bringup/tests/test_profile.py
      && BRINGUP_TASK=K.1 scripts/run_safe_pytest.sh --run-all --no-precompile models/demos/deepseek_v41_flash_d_p/tests/bringup/contract/test_adapter_acks.py
      && BRINGUP_TASK=K.1 scripts/run_safe_pytest.sh --run-all --no-precompile models/demos/deepseek_v41_flash_d_p/tests/bringup/contract/test_runner_contract.py
      && scripts/run_safe_pytest.sh --run-all --no-precompile models/demos/deepseek_v41_flash_d_p/tests/bringup/test_dram.py
    metrics:
      err_layer_L*: <= limit
      err_state_*_L*: <= limit
      err_final_hidden: <= limit
      top5_overlap: '>= limit'
      dram_load_gib_max: '> 0'
      dram_peak_gib_max: '> 0'
      dram_capacity_gib: '> 0'

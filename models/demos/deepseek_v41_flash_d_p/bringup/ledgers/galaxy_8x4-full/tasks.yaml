      the reference (known_issues DS41-132). Cause: models/demos/moe_block/tt/se_engine3.py hard-codes 2048-byte bf16 tiles
      (xown, xin, hown, hall); MoEDtypes.shared_activations (moe_block.py:118, :1406) only reaches the ops head. Fix: a bfp8

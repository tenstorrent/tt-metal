      segments ARE reachable and supported). Glued packing: segment starts 32-aligned, splits only at 32-aligned positions
      (the continuation starts 32-aligned; <= 31 pad rows a split). Do not build or test unaligned starts (31, 33, ...). OWNER
      2026-11-20 (binding). GOAL: prove no cross-request leakage and bit-exactness vs prompt-by-prompt (today''s unpacked
      path at the SAME chunk boundaries). Write the shared harness models/demos/deepseek_v41_flash_d_p/tests/packed/packed_harness.py
      (segment / sequence generator with logged seeds, a ''today at the same boundaries'' driver, full-capacity slot + host-state
      digests, bystander canaries, buffer-poison hooks over every persistent packed scratch, path-taken counters: a test that
      silently took a fallback is not evidence for its path). TWO TIERS, both inside ONE model load (call-time switches, resident
      runner, no extra loads): (1) FAST TIER models/demos/deepseek_v41_flash_d_p/tests/packed/test_packed_fast_tier.py, budget
      <= ~5 min with a HARD time cap (the test fails loudly over it, never grows silently; record packed_fast_tier_s), mostly
      the 8 characteristic layers: the oracle with the SHIPPED switch set (replaces the switches-off run) + a per-layer log
      of which path ran (metrics: packed_fast_one_ring_layers > 0, packed_fast_hide_regions > 0); perturbation differential
      (change only lane j''s tokens / history / length: every other lane''s outputs at every layer and full-capacity slot
      digests bit-identical, lane j MUST differ); poison (NaN / known bytes in pad rows, scratch buffers, bystander slots:
      outputs unchanged, poison bytes untouched); a short multi-chunk sequence with slot reuse and lane swaps under DECODER_SKIP=decode
      vs today''s path at the same boundaries; a seeded fuzz with a fixed small count (seed logged); glued-packing cases.
      (2) DEEP SWEEP models/demos/deepseek_v41_flash_d_p/tests/packed/test_packed_deep_sweep.py, ~20-30 min: long random histories
      written straight into slots (61k / 139k / 547k / ~1M, equal capacity + one unequal) that REQUIRE the one-ring path;
      all lane orders; boundary lengths (1, 32, 33, 64, 65, 2047, 2048, chunk_size; window / compressor / ring boundaries)
      at 32-aligned starts only, splits at 32-aligned positions, the clamped last chunk (start max_seq_len - chunk_size);
      MoE load extremes in the model; the serving entry adapter.prefill_packed with shared slabs, bystander canaries and acks;
      timing-jitter determinism; the cumulative switch ladder; a larger fuzz; glued cases (splits); a fresh layout every chunk
      with 0 program builds after warm-up. Every check metric packed_fast_* / packed_deep_* is a mismatch count or a max abs

  - models/demos/deepseek_v41_flash_d_p/bringup
  brief:
    details: |-
      OWNER 2026-11-12. P.49 made prefill stop at decode's cap (PREFILL_END=cap, the default; cap = actual_end // KV_BLOCK_SIZE x KV_BLOCK_SIZE, equal to decode's cap). test_contract (models/demos/common/bringup/tests/test_contract.py) sends a request ending at 10208 (cap 10176) and compares the model's INTERNAL state (window state, engram tail) at 10208 with the golden - a state the cap path never computes and that is never served (DS41-236). The golden has state snapshots at 0, 5120 and 10208 only. As a stopgap the owner chose to run that gate unit on the old path (DS41_PREFILL_END=end, P.49's gate; the cap path is covered byte for byte by tests/test_prefill_end.py).
      Target: test_contract judges the DEFAULT path at the handoff point. (1) Add a golden state snapshot at the request's cap (10176 for the test's request; derive it from the request, do not hard-code), produced by the SAME golden pipeline, reference and precision as the existing snapshots (find how they are made; reuse it; if producing it needs a resource this node does not have, stop and say exactly what). (2) Make test_contract compare the state at cap and the served caches over [0, cap) under PREFILL_END=cap, and keep its old comparison at the request's end for PREFILL_END=end. (3) Limits for any new metric follow the framework's existing rule for recording limits; never loosen or edit an existing limit. (4) Do not edit tasks.yaml: report the gate command the owner should put back into P.49's gate (test_contract without DS41_PREFILL_END=end). (5) The determinism check (FIX.25) passes.
      Report: how the golden snapshots are produced, what was added, the new metrics and their limits, the test_contract results on both paths. SAFETY: a hang or a board reset need: STOP and report, never reset. Agent rules 18 and 19 hold. Report in plain language, short, every term defined.
  gate:

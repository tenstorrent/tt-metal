      with CKV_FORMAT=bfp4_rows (default) ttnn.bringup.ckv_bfp4 costs ~1.33 ms host a call, 4 calls a chunk (~5.3 ms), because
      ckv_bfp4.py program() rebuilds its ProgramDescriptor and generic_op hashes / dispatches a fresh one every call (row0
      and buffer addresses change). Make it a prepared program (ttnn/ttnn/bringup/prepared_program, as P.1 GENERIC_OP_PREPARED
      and P.2 TAIL_A2A_PREPARED did: build once per (n, table), patch row0 / addresses per call) or a C++ op if that is simpler.
      Bytes identical to today (ckv_bfp4 tests/unit, test_sparse_sdpa_row_bfp4.py). Behind the setting CKV_BFP4_PREPARED in
      tt/settings.py (default on, ''off'' = the old path). Do not touch tt/engram*.py. Report the host ms saved per chunk
      (cProfile of warm chunks and the warm wall before/after, DS41_ENGRAM_TABLE=resident) and the device time.'
  ab:
    env:
      DS41_CKV_BFP4_PREPARED: 'off'
      DS41_ENGRAM_TABLE: resident
    change:

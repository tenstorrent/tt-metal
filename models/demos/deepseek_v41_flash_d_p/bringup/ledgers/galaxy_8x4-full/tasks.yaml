- id: P.51
  title: 'DECODER_SKIP=decode (Kartik''s cut): prefill never runs layers 21-39; per-position encoder replay below global_write_start with no history-cache writes'
  step: perf
  role: perf
  device: true
  deps:
  - FIX.26
  paths:
  - models/demos/deepseek_v41_flash_d_p/tt
  - models/demos/deepseek_v41_flash_d_p/tests/
  - models/demos/deepseek_v41_flash_d_p/reference
  - models/demos/deepseek_v41_flash_d_p/bringup/serving_contract.md
  - models/demos/deepseek_v41_flash_d_p/bringup/migration_configs.md
  - models/demos/deepseek_v41_flash_d_p/bringup/known_issues.md
  - models/demos/common/bringup
  - ttnn/ttnn/bringup
  brief:
    details: |-
      OWNER 2026-11-12, CONTRACT CHANGE AUTHORIZED: decode's proposal (Kartik Paigwar, #blaze-deepseek-v4, 2026-11-12), the model's side only. tt-d-gen will (not yet implemented there): compute the prefill stop P = floor((N - 128) / KV_BLOCK_SIZE) x KV_BLOCK_SIZE (N = prompt length; example N 5002 -> P 4864) and send prefill chunks with actual_end <= P, exclusive (positions outside [actual_start, actual_end) are PAD, no state updates); decode runs [P, N) through all 40 layers itself (128..191 tokens, DeepSeek's Decoder SWA Bounded Replay on decode's side: arXiv 2609.19969 section 3.2.2). The chunk header grows by one field: {slot_id, actual_start, actual_end, global_write_start}; global_write_start = Xp, the frontier of the long-range caches decode / the prefix cache already hold. Example (N 5002, Xp 4096): encoder replay [3968, 4096), new computation [4096, 4864), decode [4864, 5002).
      MODEL BEHAVIOUR, per valid position p of a chunk: p < global_write_start: ENCODER REPLAY - layers 0-19 only, their sliding windows rebuilt with every window truncated at the replay start (DeepSeek's Encoder SWA Bounded Replay; the model already has begin_chunk(.., replay=True) for a chunk-level replay: reuse it), the compressed KV, index keys and layer 20's KV are READ but NEVER WRITTEN (today every history-cache write covers the chunk's whole [start, end): model.py:699 compressor.write, attention.py:1494 / 1659 cache.write - gate them at global_write_start), layer 20's KV / index head not run. p >= global_write_start: layers 0-19 plus layer 20's KV / index head, writes as today. Layers 21-39 NEVER run on any chunk; every chunk still acks every layer 0-39 as completed (sink.layers_completed; tt-d-gen stays unaware which layers run - Jonathan Azpur's ask). Served: history caches [0, P), the window snapshot of layers 0-19 at P (rows [P - 128, P)); say what is served for layers 20-39's windows and update serving_contract.md / migration_configs.md.
      SWITCHES: a new DECODER_SKIP value `decode` (keep the shipped default `off`: the owner decides after the A/B). The adapter takes an optional global_write_start; missing = actual_start = no replay (today's engine keeps working).
      VERIFICATION, nothing loosened: (1) no prefix hit (global_write_start = actual_start): every served byte of the history caches and of the layer 0-19 window snapshot is BIT-IDENTICAL between DECODER_SKIP=off and decode for the same chunks (the encoder does not depend on the decoder); several prompt lengths, both prompts (novel, code). (2) prefix hit: the cached rows below global_write_start are bit-identical before and after the replay chunk (never written); the rows from global_write_start on vs a fresh full prefill: report their errors against the existing limits and against the golden (approximate by design for positions whose encoder windows reach before the replay start); a golden state at P where a check needs one (reuse FIX.26's reference/handoff.py, same pipeline). (3) acks: every layer once per chunk. (4) determinism (automatic in every gate since FIX.25). (5) if an existing check measures something this mode no longer computes (the decoder's states, a final hidden), do not change or drop it: run it on DECODER_SKIP=off and say so, as P.49 did for test_contract (DS41-236); stop and ask if that is not enough. (6) perf: device time per chunk off vs decode (P.30 measured a skipped chunk at 83.6 vs 167.9 ms at 51200).
      Report: the per-position rule as implemented, the files touched, the bit-identity tables, accuracy, acks, perf. Agent rules 18 and 19 hold. SAFETY: a hang or a board reset need: STOP and report, never reset. Report in plain language, short, every term defined.
  ab:
    env:
      DECODER_SKIP: 'off'
      ENGRAM_TABLE: resident
    change:
      DECODER_SKIP: decode
      ENGRAM_TABLE: resident
    keep_default: true
  ab_positions:
  - 51200
  gate:
    cmd: BRINGUP_RUNG=last scripts/run_safe_pytest.sh --run-all --no-precompile models/demos/common/bringup/tests/test_ladder.py
      && DS41_ENGRAM_TABLE=resident scripts/run_safe_pytest.sh --run-all --no-precompile models/demos/common/bringup/tests/test_profile.py
      && scripts/run_safe_pytest.sh --run-all --no-precompile models/demos/deepseek_v41_flash_d_p/tests/test_decoder_skip_decode.py
      && scripts/run_safe_pytest.sh --run-all --no-precompile models/demos/common/bringup/tests/test_contract.py
      && scripts/run_safe_pytest.sh --run-all --no-precompile models/demos/deepseek_v41_flash_d_p/tests/bringup/contract/test_adapter_acks.py
    metrics:
      err_layer_L*: <= limit
      err_state_*_L*: <= limit
      err_final_hidden: <= limit
      top5_overlap: '>= limit'
      contract_checks_failed: == 0
      acks_early: == 0
      served_bytes_differ: == 0
      chunk_wall_ms: '> 0'
      determinism_max_abs_diff_decoder_skip: == 0
      contract_checks_failed_decoder_skip: == 0
      acks_early_decoder_skip: == 0
      unwritten_records_changed_decoder_skip: == 0
      decode_acks_failures: == 0
      device_ms_total: '> 0'
- id: FIX.28
  title: 'Gates cover DECODER_SKIP=decode (Kartik''s cut): determinism, contract and acks run with the skip active, not only the full path'
  step: overseer_fix
  role: overseer
  precheck: false
  deps:
  - P.51
  - FIX.26
  device: true
  paths:
  - models/demos/common/bringup
  - models/demos/deepseek_v41_flash_d_p/tests/
  - models/demos/deepseek_v41_flash_d_p/tt
  - models/demos/deepseek_v41_flash_d_p/bringup
  brief:
    details: |-
      OWNER 2026-11-13. P.51 added DECODER_SKIP=decode (prefill runs layers 0-19 + layer 20's KV only on chunks marked last=False; positions below global_write_start are replayed with no history-cache writes). Its own test (tests/test_decoder_skip_decode.py) shows 0 of 20,912 served records differ vs the full path, but the framework harness (ladder, determinism, contract, acks) passes last unset, so every gate runs the FULL path under decode: the skipped path is never checked for determinism, contract or acks. Branch dnijemcevic/model_bringup must be functionally correct for end-to-end prefill + decode testing.
      Target, the skipped path exercised by the gate tests themselves (extend the existing tests; no parallel copies): (1) Determinism: test_determinism also runs DECODER_SKIP=decode with chunks marked last=False and a global_write_start inside the request (tt-d-gen's rule: actual_end = P = floor((N-128)/64)*64, exclusive; replay below global_write_start), both prompts (novel, code), cold and warm, and emits determinism_max_abs_diff_decoder_skip (== 0, bit for bit, every served tensor and the state decode reads). (2) Contract: test_contract and test_adapter_acks run a decode-mode request the way tt-d-gen sends it (actual_start, actual_end = P, global_write_start, last=False) and check what decode is served: history caches [0, P) and layers 0-19's window snapshots against the golden at P (reuse FIX.26's golden-at-cap pipeline; derive P from the request, no hard-coding), every layer acked exactly once and never early, nothing written in [P, N). Check the cap rule on this path: the served end equals decode's cap (cap = actual_end // 64 * 64 = P); a request whose actual_end is not a multiple of 64 under decode must be handled by the documented rule (find it in serving_contract.md; if undefined, stop and report). (3) Limits for new metrics follow the framework's existing rule; never loosen or edit an existing limit. (4) The full-path checks stay as they are. Do not edit tasks.yaml; report the gate lines P.51's gate should use.
      Report: what each test now runs under decode, results on both paths (full and decode), new metrics and limits. SAFETY: a hang or a board reset need: STOP and report, never reset. Agent rules 18 and 19 hold. Report in plain language, short, every term defined.
  gate:
    cmd: BRINGUP_RUNG=last scripts/run_safe_pytest.sh --run-all --no-precompile models/demos/common/bringup/tests/test_ladder.py
      && scripts/run_safe_pytest.sh --run-all --no-precompile models/demos/deepseek_v41_flash_d_p/tests/test_determinism.py
      && scripts/run_safe_pytest.sh --run-all --no-precompile models/demos/common/bringup/tests/test_contract.py
      && scripts/run_safe_pytest.sh --run-all --no-precompile models/demos/deepseek_v41_flash_d_p/tests/bringup/contract/test_adapter_acks.py
      && scripts/run_safe_pytest.sh --run-all --no-precompile models/demos/deepseek_v41_flash_d_p/tests/test_decoder_skip_decode.py
    metrics:
      err_layer_L*: <= limit
      err_state_*_L*: <= limit
      err_final_hidden: <= limit
      top5_overlap: '>= limit'
      determinism_max_abs_diff: == 0
      determinism_max_abs_diff_decoder_skip: == 0
      contract_checks_failed: == 0
      acks_early: == 0
      served_bytes_differ: == 0
- id: FIX.29
  title: 'Load the model ONCE per gate: every model-level device test of a gate (contract, acks, the model''s own tests, determinism, ladder) runs in one process on one loaded model'
  step: overseer_fix
  role: overseer
  precheck: false
  deps:
  - FIX.28
  device: true
  paths:
  - models/demos/common/bringup
  - models/demos/deepseek_v41_flash_d_p/tests/
  - models/demos/deepseek_v41_flash_d_p/tt/runners
  - models/demos/deepseek_v41_flash_d_p/bringup
  - scripts/run_safe_pytest.sh
  brief:
    details: |-
      OWNER 2026-11-13, angry, asked for days: "IT DOESN'T MAKE SENSE TO LOAD THE MODEL AGAIN AND AGAIN to conduct tests in serial. LOAD THE MODEL ONLY ONCE." F259 (core/batch.py, testing/batch.py, tests.one_process on) shares one process only among SHARED_TESTS (ladder, profile, positions, smoke, framework determinism). Every other test of a gate loads the model again (~4-5 min each on the 8x4): FIX.26's gate loaded it 4 times (logs/FIX.26.log: 4 x 271-313 s), FIX.28's gate 5 times (ladder, tests/test_determinism.py, test_contract, test_adapter_acks, test_decoder_skip_decode).
      Target: one gate = one model load per distinct model configuration (switch values read at load). (1) Extend F259 to every device test a gate runs: test_contract, test_contract_acks, the model's tests (models/demos/deepseek_v41_flash_d_p/tests/: test_determinism, test_decoder_skip_decode, test_prefill_end, bringup/contract/test_adapter_acks, test_window_snapshot, ...) take the batch's model. The contract tests build the model through the engine's adapter because the adapter is part of what they check: then the batch loads the model THROUGH the adapter once and every test uses that (the adapter path stays tested; no second load path). Tests that need different switch values per run (e.g. DECODER_SKIP off vs decode, PREFILL_END end vs cap) must take them as per-call arguments of the one loaded model where the model allows it; where a switch is truly frozen at load, say which and why, and group them so each configuration loads once. KV/state freed between runs as F259 does. (2) A single command for agents to run several tests in one process while working (no reload per test), and the bringup-engineer agent definition tells agents to use it. (3) Proof on the device: FIX.28's gate command as is, in one process: number of model loads (emit gate_model_loads), every metric identical to the separate-process runs (FIX.28's results), determinism 0, wall before / after (FIX.28's gate wall from its log vs now). Never loosen a check; tests must still fail when what they check breaks (show one injected failure per moved test is still caught).
      Report: loads before/after, wall before/after, what is shared and what is not, and why. SAFETY: a hang or a board reset need: STOP and report, never reset. Agent rules 18 and 19 hold. Report in plain language, short, every term defined.
  gate:
    cmd: BRINGUP_RUNG=last scripts/run_safe_pytest.sh --run-all --no-precompile models/demos/common/bringup/tests/test_ladder.py
      && scripts/run_safe_pytest.sh --run-all --no-precompile models/demos/deepseek_v41_flash_d_p/tests/test_determinism.py
      && scripts/run_safe_pytest.sh --run-all --no-precompile models/demos/common/bringup/tests/test_contract.py
      && scripts/run_safe_pytest.sh --run-all --no-precompile models/demos/deepseek_v41_flash_d_p/tests/bringup/contract/test_adapter_acks.py
      && scripts/run_safe_pytest.sh --run-all --no-precompile models/demos/deepseek_v41_flash_d_p/tests/test_decoder_skip_decode.py
    metrics:
      err_layer_L*: <= limit
      err_state_*_L*: <= limit
      err_final_hidden: <= limit
      top5_overlap: '>= limit'
      determinism_max_abs_diff: == 0
      determinism_max_abs_diff_decoder_skip: == 0
      contract_checks_failed: == 0
      acks_early: == 0
      served_bytes_differ: == 0
      gate_model_loads: == 1

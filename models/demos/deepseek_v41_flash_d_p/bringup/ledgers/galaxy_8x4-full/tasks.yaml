    details: 'FIRST (owner 2026-11-01): set WINDOW_KV_FORMAT''s default back to bfp8_tiles in tt/settings.py (P.26 made bf16_tiles
      the default by the perf-pick convention; the owner wanted a switch only, the shipped window KV stays 8-bit; say so in

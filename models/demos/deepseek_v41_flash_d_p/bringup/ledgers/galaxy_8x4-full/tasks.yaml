  brief:
    details: |-
      OWNER 2026-11-12. THE FIX EXISTS; PORT IT AND MEASURE IT, NOTHING ELSE. On another branch (dnijemcevic/moe_replication, which carries MoE expert-replica work this base must NOT get) an agent found why identical prefills give different outputs: the MoE combine (ttnn/ttnn/bringup/moe_block_main_ttnn/routed_experts_combine) adds each token's weighted expert terms in fp32 in packet-arrival order; the snap (COMBINE_SNAP = 2^-19) makes that order-free only while a sum stays below 2^24 x 2^-19 = 32, and real prompts reach 21,376 (layers 15-39 on the code prompt, the novel prompt's first tokens): DS41-233 / DS41-234 / DS41-235. The fix: MoEBlockConfig.combine_snap_split / model setting COMBINE_SPLIT - each snapped term split into a coarse part (a multiple of 2^-1) and a fine part (the rest), two exact fp32 sums, added once at the end: order-free up to 2^23, bit-identical to the old sum wherever the old sum was exact; the final version fuses the split into one kernel pass. Its complete work is commit 4e90f611e86 (branch exp/fix23_snapshot), whose parent 4c79ce65ece is the replica branch: take `git diff 4c79ce65ece 4e90f611e86` and port ONLY the fix and what verifies it onto this tree: the combine fork's kernel / config / nanobind / tests / docs, the model setting COMBINE_SPLIT and its plumbing in the MoE adapters, the determinism test (tests/test_determinism.py) and the parts of the back-to-back harness it needs (testing/b2b.py etc.), the known-issues entries DS41-233 / 234 / 235. Do NOT port anything of the replica work (MOE_REPLICAS, MOE_COUNTS, MOE_POLICY, expert_slot_copy, slot maps, tile_gather) and nothing of the bisect probes. Files that carry both (moe_block_main_adapter.py, settings.py, CHANGELOGs) need the fix's hunks only. Do not redesign the fix and do not investigate further: no bisect, no history search.
      SWITCH: COMBINE_SPLIT on (the fix) | off (today's single sum). Keep the SHIPPED DEFAULT off in tt/settings.py: the owner decides after reading this task's A/B whether it becomes the default.
      WHAT THE OWNER WANTS FROM THIS TASK, as one short table each, both sides measured by the same runs: (1) DETERMINISM before / after: the determinism test (the same prompt run several times in one process, cold first run and warm runs, both the spec's novel prompt and the code prompt, several chunks; max abs diff per chunk) with COMBINE_SPLIT=off and with on; off is expected to differ on the code prompt, on must be max abs diff 0 everywhere; record the metrics determinism_max_abs_diff_off and determinism_max_abs_diff_on. (2) ACCURACY before / after: every recorded metric against its limit (the orchestrator's A/B table) and the largest differences between the two sides. (3) PERF before / after: chunk wall and device time per section at the quick rung and at 51,200 (the orchestrator's A/B), and the combine op's own device time on both sides. Never loosen a check. Agent rules 18 and 19 hold. Do not profile the model yourself beyond the determinism runs: the orchestrator measures the A/B. SAFETY: a hang or a board reset need: STOP and report, never reset. Report in plain language, short, every term defined.
  ab:
    env:
      COMBINE_SPLIT: 'off'
      ENGRAM_TABLE: resident
    change:
      COMBINE_SPLIT: 'on'
      ENGRAM_TABLE: resident
  ab_positions:
  - 51200
  gate:
    cmd: BRINGUP_RUNG=last scripts/run_safe_pytest.sh --run-all --no-precompile models/demos/common/bringup/tests/test_ladder.py
      && DS41_COMBINE_SPLIT=on scripts/run_safe_pytest.sh --run-all --no-precompile models/demos/deepseek_v41_flash_d_p/tests/test_determinism.py
      && DS41_ENGRAM_TABLE=resident scripts/run_safe_pytest.sh --run-all --no-precompile models/demos/common/bringup/tests/test_profile.py
    metrics:
      err_layer_L*: <= limit
      err_state_*_L*: <= limit
      err_final_hidden: <= limit
      top5_overlap: '>= limit'
      chunk_wall_ms: '> 0'
      device_ms_total: '> 0'
      determinism_max_abs_diff: == 0
- id: P.49
  title: 'Serving contract: prefill stops at decode''s cap (the 64-token boundary) instead of computing to the prompt''s end; prefill''s cap equals decode''s for every prompt length (DS41-219)'
  step: perf
  role: perf
  device: true
  deps:
  - P.50
  paths:
  - models/demos/deepseek_v41_flash_d_p/tt
  - models/demos/deepseek_v41_flash_d_p/tests/
  - models/demos/deepseek_v41_flash_d_p/bringup/serving_contract.md
  - models/demos/deepseek_v41_flash_d_p/bringup/migration_configs.md
  - models/demos/common/bringup
  - ttnn/ttnn/bringup
  brief:
    details: |-
      OWNER 2026-11-12, CONTRACT CHANGE AUTHORIZED, from decode's review (Brian Liu, #blaze-deepseek-v4, 2026-11-06 21:38: "stop prefill at the 64 boundary if you are only storing 128 SWA"; Kartik 2026-11-11 00:35: round the prefill tokens to the 64-token block, then pad to the chunk size). Today (serving_contract.md, P.42) prefill computes and attends every position up to the prompt's end and only clamps what it SERVES at cap = (prompt_len - 1) // kv_block_size x kv_block_size (kv_block_size = setting KV_BLOCK_SIZE, 64 deployed); decode replays [cap, prompt_len) itself, so prefill's work on [cap, prompt end) is wasted. Target: under the serving path prefill computes only positions [0, cap): the request's last chunk ends at cap (padded to the chunk size as the model already pads), nothing at or past cap is computed or written.
      DS41-219 IN THE SAME TASK: under PD_DISAGG tt-d-gen hands prefill actual_end = prompt_len - 1 (tt-d-gen at /scratch/dnijemcevic/tt-d-gen, jazpur/dsv4-replay-window 48b79127fb1: types.hpp:105 prompt_compute_end; decode's cap: prefix_indexer.hpp reusable_prefix_cap). The model computes cap = (actual_end - 1) // 64 x 64, which differs from decode's when prompt_len % 64 == 1 (2,945 tokens: ours 2,880, decode's 2,944). Read tt-d-gen's code and make prefill's cap equal decode's for EVERY prompt length, from what the engine actually passes; cite the lines. If the model cannot know the length decode uses, stop and say exactly what is missing.
      Behind a switch PREFILL_END: cap (new; default after acceptance) | end (today's path, kept). Update serving_contract.md and migration_configs.md (a "Changed in P.49" section) and the contract / runner / kv_layout / acks / window-snapshot tests to the new rule.
      VERIFICATION, the owner's requirement: NO perf impact and NO accuracy degradation. (1) Every served tensor (window snapshot rows [cap - 128, cap), compressed KV and index keys [0, cap)) must be BIT-IDENTICAL between PREFILL_END=end and cap for the same prompt: positions below cap depend only on positions below cap; if any byte differs, find why and report it before anything else. Test prompt lengths with prompt_len % 64 in {0, 1, 2, 63}, one shorter than 128 + 64, one that is a single chunk and one of several chunks, both prompts (the spec's novel prompt and the code prompt from FIX.23). (2) Every accuracy check and limit holds; never loosen a check. If a check measures something the new path no longer computes (e.g. a last-token output past cap), do not change or drop it: stop and report which checks and why, and propose; the owner decides. (3) Perf: the A/B below at the quick rung and 51,200: chunk wall and device time per section, both sides. (4) The determinism test (FIX.23 / FIX.25) passes.
      Report: the cap rule and its tt-d-gen citations; the bit-identity results per prompt length; accuracy table; A/B; what changed in the contract docs. Agent rules 18 and 19 hold. Do not profile the model yourself beyond the A/B: the orchestrator measures. SAFETY: a hang or a board reset need: STOP and report, never reset. Report in plain language, short, every term defined.
  ab:
    env:
      PREFILL_END: end
      ENGRAM_TABLE: resident
    change:
      PREFILL_END: cap
      ENGRAM_TABLE: resident
  ab_positions:
  - 51200
  gate:
    cmd: BRINGUP_RUNG=last scripts/run_safe_pytest.sh --run-all --no-precompile models/demos/common/bringup/tests/test_ladder.py
      && DS41_ENGRAM_TABLE=resident scripts/run_safe_pytest.sh --run-all --no-precompile models/demos/common/bringup/tests/test_profile.py
      && scripts/run_safe_pytest.sh --run-all --no-precompile models/demos/common/bringup/tests/test_contract.py
      && scripts/run_safe_pytest.sh --run-all --no-precompile models/demos/deepseek_v41_flash_d_p/tests/bringup/contract/test_kv_layout.py
      && scripts/run_safe_pytest.sh --run-all --no-precompile models/demos/deepseek_v41_flash_d_p/tests/bringup/contract/test_adapter_acks.py
      && scripts/run_safe_pytest.sh --run-all --no-precompile models/demos/deepseek_v41_flash_d_p/tests/test_prefill_end.py
      && scripts/run_safe_pytest.sh --run-all --no-precompile models/demos/deepseek_v41_flash_d_p/tests/test_determinism.py
    metrics:
      err_layer_L*: <= limit
      err_state_*_L*: <= limit
      err_final_hidden: <= limit
      top5_overlap: '>= limit'
      chunk_wall_ms: '> 0'
      device_ms_total: '> 0'
      acks_early: == 0
      contract_checks_failed: == 0
      served_bytes_differ: == 0
      determinism_max_abs_diff: == 0
- id: FIX.25
  title: 'Determinism in every gate: a model-level run-twice-bit-for-bit check that every task gate, quick and full, runs and enforces'
  step: overseer_fix
  role: overseer
  precheck: false
  deps:
  - P.49
  device: true
  paths:
  - models/demos/common/bringup
  - models/demos/deepseek_v41_flash_d_p/tests/
  - models/demos/deepseek_v41_flash_d_p/tt
  - models/demos/deepseek_v41_flash_d_p/bringup
  brief:
    details: |-
      OWNER 2026-11-12: DETERMINISM IS THE HIGHEST OF ALL PRIORITIES. Today no task gate checks it: the gates (test_ladder, test_profile, test_positions, test_contract, the final task's full-target gate and the quick-accepted picks' full gates run before it) check accuracy against limits and times; a run-to-run difference smaller than the limits passes, which is how the MoE combine's non-determinism (DS41-233 / 234 / 235, up to 0.26 on the code prompt; fixed by P.50, COMBINE_SPLIT=on) went unnoticed for weeks. The framework has testing/determinism.py (A, then a different input B, then A again, byte for byte), but only component tests and fork unit tests use it; the last such run in this ledger was 2026-10-26/27.
      Make determinism a framework property of every gate: (1) a model-level check that runs the same input at least twice in one process (cold first run after load included, plus a warm run after a different input, as determinism.py does) over several chunks, on both the spec's prompt and a second, different prompt (the code prompt of DS41-234), and requires every chunk's final hidden and the served states bit for bit (max abs diff 0); reuse testing/determinism.py and the model's determinism test (tests/test_determinism.py, from P.50), do not write a second mechanism. (2) The orchestrator runs it as part of EVERY gate (per-task gates, quick A/B accept gates, the full gates, the final task) without each tasks.yaml entry having to name it; a gate whose model is not deterministic FAILS, with the first differing chunk / layer in the message. A per-step exemption only through the existing tests.nondeterministic switch with a written reason, and none for the model. (3) Report its cost per gate (seconds) and keep it as low as coverage allows; say what coverage you chose and why. (4) A selftest of the framework part (a deliberately non-deterministic fake model must fail the gate). Never loosen any other check.
      SAFETY: a hang or a board reset need: STOP and report, never reset. Agent rules 18 and 19 hold. Report in plain language, short, every term defined.
  gate:
    cmd: BRINGUP_RUNG=last scripts/run_safe_pytest.sh --run-all --no-precompile models/demos/common/bringup/tests/test_ladder.py
      && scripts/run_safe_pytest.sh --run-all --no-precompile models/demos/deepseek_v41_flash_d_p/tests/test_determinism.py
    metrics:
      err_layer_L*: <= limit
      err_state_*_L*: <= limit
      err_final_hidden: <= limit
      top5_overlap: '>= limit'
      determinism_max_abs_diff: == 0
- id: FIX.26

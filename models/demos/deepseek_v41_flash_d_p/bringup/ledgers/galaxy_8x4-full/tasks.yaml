- id: P.42
  title: 'PD table per decode''s review: re-index layers 24-36 as aliases of layer 20''s index rows (no copies); window KV as a 128-row snapshot clamped at cap'
  step: perf
  role: perf
  device: true
  deps:
  - P.41
  paths:
  - models/demos/deepseek_v41_flash_d_p/tt
  - models/demos/deepseek_v41_flash_d_p/tests/

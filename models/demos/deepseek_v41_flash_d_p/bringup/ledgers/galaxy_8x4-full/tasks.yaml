- id: FIX.3
  title: 'Root-cause the real-time profiler failure on this Galaxy: every 8x4 mesh open logs "Real-time profil'
  step: overseer_fix
  role: overseer
  precheck: false
  deps:
  - B.1
  - W.1
  gate:
    cmd: BRINGUP_TASK=B.1 scripts/run_safe_pytest.sh --run-all models/demos/common/bringup/tests/test_box.py && BRINGUP_TASK=W.1
      BRINGUP_RUNG=seed scripts/run_safe_pytest.sh --run-all --no-precompile models/demos/common/bringup/tests/test_ladder.py
    metrics:
      chips: == 32
      all_gather_maxabs: == 0
      err_layer_L*: <= limit
      err_state_*_L*: <= limit
      host_transfers_per_layer: == 0
  device: true
  paths:
  - models/demos/deepseek_v41_flash_d_p/tt
  - models/demos/deepseek_v41_flash_d_p/bringup/hooks.py
  - models/demos/deepseek_v41_flash_d_p/bringup/ledgers/tt
  brief:
    details: 'Root-cause the real-time profiler failure on this Galaxy: every 8x4 mesh open logs "Real-time profiler disabled
      on device 7 / 10: D2H socket construction failed (Failed to pin pages for DMA buffer ... size 0x201000 ... flags 0x4:
      Invalid argument)", always devices 7 and 10 (B.1, W.1, M.1 logs). Host facts: KMD 2.11.0, iommu=pt (passthrough), 1412
      x 2 MB hugepages, HugePages_Free 0 while a mesh is open; the buffer is 2 MB + 4 KB. Hypothesis to test, not assume:
      under iommu=pt the pin needs physically contiguous memory and a 2 MB + 4 KB buffer only pins when it happens to be contiguous
      (or the hugepages run out by device 7 / 10). Find the actual cause with evidence (pin a buffer of that size per device,
      hugepage use per device during open, the D2H socket allocation code), fix it at its cause in tt_metal (or the framework
      if the cause is ours), so the real-time profiler runs on all 32 chips; add a check that reports a profiler that failed
      to start before a perf task relies on it. Record the cause and fix in known_issues.'
    gate_tasks:
    - B.1
    - W.1

      holding a 4 or 6; bfloat8_b holds every e2m1 x ue8m0 value exactly in the [N, K] / weights_nk layout). (1) Make
      EXPERTS_IMPL=bfp8 work with MOE_IMPL=block (two asserts refuse it today: tt/moe_block_adapter.py and
      models/demos/moe_block/moe_block.py RoutedExperts (dtypes.routed_weights == bfloat4_b; MoEDtypes defaults to it); the
      flat op already takes wdtype bf8 and TtExperts already builds it; check the block''s layout (layout_of, L1 slots sized
      for 576-B tiles) holds 1088-B bfp8 tiles; the shared block is used by other models: keep their behaviour unchanged; the block MoE and the
      flat expert op must take bfloat8_b weights in the same weights_nk layout; add a fork option with a test only if the op
      needs one). The default stays bfp4 (a switch-only pick, F241); the owner decides after the A/B. (2) DRAM per chip,
      measured, not estimated: write models/demos/deepseek_v41_flash_d_p/tests/bringup/test_dram.py that loads the model
      for ONE slot at the deployment context (1,048,576 tokens; every served cache and table allocated as serving allocates
      it) and records, from the allocator (ttnn.get_memory_view(device, ttnn.BufferType.DRAM) per chip of the mesh), the
      DRAM allocated after load (dram_load_gib_max / _min over chips) and the peak while one chunk runs at start 1,039,360
      (the last whole chunk before 1M; sample the allocator after every layer and inside the MoE and attention, report the
      max over chips and samples as dram_peak_gib_max), plus the bytes per group (routed experts, other weights, served
      caches, tables) from the buffers the model allocates, and the allocator''s DRAM capacity per chip (dram_capacity_gib).
      Recorded, never gated by a fixed number. It runs on both sides of the A/B. (3) Agent rules 18 / 19; device jobs over a
      few minutes through devjob (start / wait), never killed. Do not profile the model and do not run the A/B yourself
      (the orchestrator measures bfp4 vs bfp8 at 51200 / 512000 / 1039360 and runs the ladder and contract tests on both
      sides). No fork regression suites; add tests only for what you add. Report: memory per group on both sides, and
      whether bfp8 fits 1M within the 27.2 GiB budget and within the physical capacity. (4) OWNER 2026-11-02 (after reviewing GPT-OSS PR #63374, models/demos/gpt_oss/tt/bfp4_quant.py on that branch): two more EXPERTS_IMPL values, made here, A/B-ed by P.28 / P.29 (no new agent work there): bfp4_mse = bfloat4_b with the shared exponent of each 16-value group (along K in weights_nk, i.e. inside one ue8m0 block) chosen by least squared error between the group''s largest exponent and one below it (the large values then saturate at 7; ties: the largest), rounded on the host at load and handed to ttnn as bfloat4_b, which must pack it losslessly (add a test that ttnn''s packing of the rounded tensor is bit-exact); bfp8_down4 = w1 / w3 in bfloat8_b, w2 (down) in bfloat4_b with the bfp4_mse rounding. Each value gets its own expert cache names; the CPU emulation of the device formats (FIX.21, _bfp4_round) follows the switch. Log the per-layer changed fraction and worst ||dW|| / ||W|| at load for bfp4_mse as for bfp4.'
  ab:
    env:
      EXPERTS_IMPL: bfp4
      ENGRAM_TABLE: resident
    change:
      EXPERTS_IMPL: bfp8
      ENGRAM_TABLE: resident
  ab_mode: full

      scripts/run_safe_pytest.sh --run-all --no-precompile models/demos/common/bringup/tests/test_profile.py && DS41_ENGRAM_TABLE=resident DS41_DECODER_SKIP=exact
      BRINGUP_CHUNK_LAST=0 BRINGUP_POS=51200 BRINGUP_PROFILE_HOST=1 scripts/run_safe_pytest.sh --run-all --no-precompile models/demos/common/bringup/tests/test_profile.py && DS41_ENGRAM_TABLE=resident DS41_DECODER_SKIP=replay128 BRINGUP_CHUNK_LAST=1 BRINGUP_POS=512000 BRINGUP_PROFILE_HOST=1
      scripts/run_safe_pytest.sh --run-all --no-precompile models/demos/common/bringup/tests/test_profile.py && DS41_ENGRAM_TABLE=resident DS41_DECODER_SKIP=exact
      BRINGUP_CHUNK_LAST=0 BRINGUP_POS=512000 BRINGUP_PROFILE_HOST=1 scripts/run_safe_pytest.sh --run-all --no-precompile models/demos/common/bringup/tests/test_profile.py
    metrics:

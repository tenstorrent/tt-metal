- block_type: swa_engram
  step: engram_rows
  tag: CPU
  reuse: models/demos/deepseek_v41_flash_d_p/reference/ngram.py:EngramHasher, models/demos/deepseek_v41_flash_d_p/reference/weights.py:EngramTable
  searched: &id010
  - 'owner rule: the n-gram hash and the table lookup depend only on the token ids; they run on the host before each chunk
    and their rows go to the device as an input'
  - 'serving_contract.md Input: the 3 ids before start come from a per-slot id history on the host (d2p off by default)'
  - 'the tables are 98 GB each (fp8 + e8m0, 384M rows x 256): never on the device (DS41-9)'

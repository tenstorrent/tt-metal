# DeepSeek-V4.1-Flash (this run: layers 0-3, 14, 20, 21, 24; planned for galaxy_4x4): every block step mapped to TTNN.
# Layout and reasoning in plan.md. Mesh axis 0 = SP rows (row r computes the natural token block [start + r W, +W),
# W = chunk / rows), axis 1 = TP columns (heads, the hidden split). Every matmul HiFi4 + fp32 accumulation (owner rule);
# fp32 intermediates where the reference keeps fp32 (K-25, K-30).
#
# Component boundaries are the reference's (reference/ds41_ref.py): block in / x / out [S, 4H + 4] (4 streams + the
# pending pre), h_mid [S, 4H], mHC mixes [S, 24] fp32, the rest [S, *]. A module that splits work over chips gathers
# back to that boundary for its component test; the assembled model (M.1) keeps the resting layout between steps:
# streams [S/SP, 4 x H/TP] fp32 per chip, pending pre [S/SP, 4] fp32 replicated over TP.
#
# The model's quantizers on the device (owner rule: the checkpoint's kernels are the ground truth), one helper module
# tt/quant.py used by many steps and tested on its own against reference/kernels.py (target: bit-exact):
#   fp8_qdq(x)   act_quant_dequant(x, 32): per 32 values amax (>= 1e-4), scale 2^ceil(log2(amax / 448)) (ue8m0, from
#                the exponent bits), e4m3 round-to-nearest-even of x / scale, times scale. Composed: reshape to
#                [rows * K / 32, 32], ttnn.max(abs), int32 bit ops on ttnn.bitcast(fp32) for the scale and the mantissa
#                rounding (normals: add 0x7FFFF + lsb, mask 20 bits; below 2^-6: step 2^-9), multiply. Searched:
#                deepseek_prefill.per_token_cast_to_fp8 / per_token_cast_back (blocks of 128, the e4m3 packer rounds
#                toward zero: not the model's rounding; a fork with block 32 + RNE is the perf alternative).
#   fp4_qdq(x, block, scale)   fp4_quant_dequant: e2m1 RNE on {0, .5, 1, 1.5, 2, 3, 4, 6} (the same bit ops with one
#                mantissa bit for |y| >= 1, step 0.5 below), ue8m0 scale per 32 (index q / k) or e4m3(amax / 6) per 16
#                (compressed KV). Searched: no fp4 quantizer in ttnn (grep e2m1 / fp4 in ttnn/cpp: Quasar MxFp4 only).
# Values stay bf16-exact where the reference's are (fp8 / fp4 values times power-of-two or e4m3 scales).
#
# Constants (agent rule 5): RoPE cos / sin by absolute position (the reference's fp32 angles, both rope types), position
# and owner tables, index-list constants, the candidate pin table, mHC constants and dispatch tables are built once at
# load for max_seq and sliced on device per chunk. The one per-chunk host input besides the token ids is the engram
# rows (owner rule). Nothing is OPGEN: every step has an op, a composition or a fork (searches per entry).
components:
- block_type: swa
  step: attn_hc
  tag: COMPOSED
  ttnn: ttnn.matmul (streams [S/SP, 4 x H/TP] fp32 @ the chip's rows of hc_attn_fn^T [4 x H/TP -> 24], HiFi4 + fp32 acc) and
    the partial sum of squares -> all_gather (axis 1) + ttnn.add (exact, K-30) [S/SP, 25] -> mixes x rsqrt(mean + 1e-20) ->
    ttnn.experimental.deepseek_prefill.mhc_split_sinkhorn (consts from hc_attn_scale / hc_attn_base, n 4, 20 iterations, eps
    1e-6) -> [S/SP, 24] fp32 [pre | post | comb], replicated over TP
  reuse: models/demos/deepseek_v3_d_p/tt/mhc/tt_mhc.py:TtMHCWrap (project with tp_sum, build_consts), models/demos/xing40_a4b_d_p/tt/mhc.py:TtHcWeights
    (partial mixes + one exchange on SP x TP)
  searched: &id001
  - 'reference kernels.sinkhorn_split == DeepSeek-V4 hc_split_sinkhorn (deepseek_v3_d_p/reference/mhc/deepseek_sinkhorn_kernel.py):
    pre sigmoid + eps, post 2 sigmoid, comb row softmax + eps, column normalization, 19 more (row, column) rounds'
  - 'K-20: mhc_split_sinkhorn caps the logits at 80 instead of subtracting the row max (equal without overflow); check the
    comb orientation (row j = input stream, column k = output) against the [pre 4 | post 4 | comb 16] boundary'
  - ttnn.bringup.mhc_pre (fused, GLM) needs the whole 4H row on one chip; the hidden is TP-split here (xing40 pattern)
  notes: 'RMS is a per-token scalar, so it commutes past the linear: one tiny [S/SP, 25] exchange completes the projection
    and the norm.'
- block_type: swa
  step: attn_collapse
  tag: COMPOSED
  ttnn: ttnn.slice (4 streams [S/SP, H/TP], 4 pending-pre columns [S/SP, 1]) -> ttnn.multiply + 3 x ttnn.addcmul -> attn_in
    [S/SP, H/TP] fp32
  reuse: models/demos/xing40_a4b_d_p/tt/collapse.py:TtHcCollapse, models/demos/deepseek_v3_d_p/tt/mhc/tt_mhc.py:_mix
  searched: &id002
  - 'DS41-3: the attention collapses with the PENDING pre (the previous layer''s ffn_hc pre, packed in x; layer 0: one-hot
    stream 0), not attn_hc''s'
  notes: Local per chip (per hidden column), no CCL, fp32 as the reference.
- block_type: swa
  step: attn_norm
  tag: COMPOSED
  ttnn: 'distributed RMSNorm: partial sum x^2 per chip -> all_gather (axis 1) of [S/SP, 1] + ttnn.add -> rsqrt(mean + 1e-20)
    -> x * rstd * w (fp32); plus tt/quant.fp8_qdq of the output (blocks of 32 inside the chip''s H/TP columns) for the fp8
    linears that read it'
  reuse: models/demos/xing40_a4b_d_p/tt/norm.py:TtDistributedRmsNorm, models/demos/deepseek_v3_d_p/tt/tt_distributed_rms_norm.py
  searched: &id003
  - 'K-12: ttnn.rms_norm on an fp32 input is ~0.1 % low and pre/post_all_gather leave junk in the stats tile; xing40 composes
    the exchange'
  - 'reference rms_norm: fp32 x * rsqrt(mean(x^2) + 1e-20), times the weight'
  notes: Output fp32 [S/SP, H/TP] (boundary [S, H]); q(x) bf16 (exact) feeds q_a / kv (fp8 linears), the fp32 x feeds the
    compressor and the indexer's weights_proj (bf16 weights, no act quant).
- block_type: swa
  step: q_a
  tag: COMPOSED
  ttnn: 'ttnn.linear K-split: q(attn_norm) [S/SP, H/TP] @ the chip''s rows of [wq_a | wkv] [H/TP -> 1280 + 512] (bf16, HiFi4,
    fp32 out) and x @ [compressor wkv | wgate | indexer weights_proj] where the layer has them -> all_gather (axis 1) + ttnn.add
    (exact fp32 sum, K-30) -> slice q_resid [S/SP, 1280] -> RMSNorm q_norm (1280, replicated weight, fp32)'
  reuse: models/demos/deepseek_v3_d_p/tt/mla/v4_attention_base.py:TtV4AttentionBase._q_lora, models/demos/xing40_a4b_d_p/tt/q_a.py:TtQa
  searched: &id004
  - V4 base reduces with reduce_scatter + all_gather (FPU adds, K-30); here all_gather + SFPU add of fp32 partials
  - 'q_a, kv, the compressor and weights_proj all read attn_norm: one exchange per layer for all of them'
  notes: q_resid replicated over TP (wq_b and the indexer need it whole). Boundary [S, 1280].
- block_type: swa
  step: kv
  tag: COMPOSED
  ttnn: '(the q_a exchange) slice kv [S/SP, 512] -> RMSNorm kv_norm (fp32) -> ttnn.experimental.rotary_embedding_llama on
    the last 64 dims (interleaved pairs, trans-mat; cos / sin gathered from the load-time table by absolute position: theta
    10000 for ratio 0, 160000 + YaRN for ratio 1 / 2) -> tt/quant.fp8_qdq -> window KV [S/SP, 512] bf16 (exact) -> all_gather
    (axis 0) [chunk, 512] -> ttnn.experimental.slice_write of the positions this chip owns (0_window_kv, TP-dedup sub-blocks)
    for [actual_start, actual_end); pad rows of the last record zeroed before the ack'
  reuse: models/demos/deepseek_v3_d_p/tt/mla/v4_attention_base.py:_kv_stem, models/demos/deepseek_v3_d_p/tt/mla/compressor.py:TtCompressorUtils.rope_gather,
    models/demos/deepseek_v3_d_p/utils/kv_cache_utils.py:init_kvpe_cache, models/demos/deepseek_v3_d_p/tt/kv_ack.py:zero_pad_and_ack
  searched: &id005
  - 'reference rope(): adjacent pairs as complex numbers = the interleaved (Meta) order rotary_embedding_llama takes'
  - 'repo_map: ROW_MAJOR cache writes at an offset -> ttnn.experimental.slice_write'
  - 'serving_contract.md KV cache: bf16 ROW_MAJOR, ND shard [1, 1, 32, 512] ROUND_ROBIN_1D per record (init_kvpe_cache); DS41-5:
    every position served'
  notes: 'The served cache is the window state (state_tensors window_kv = its ring view [128, 512], slot p % 128). The attention''s
    window region (the 128 rows before start + the gathered chunk) reads the carry from the served records of [start - 128,
    start) on every chunk: one path for cold and follow-up starts.'
- block_type: swa
  step: attention
  tag: COMPOSED
  ttnn: 'ttnn.linear wq_b (heads split over TP; bf16, HiFi4) on q(q_resid) -> RoPE on the last 64 dims -> ttnn.experimental.all_to_all_async_generic
    head->seq (axis 1: all 64 heads, chunk / (SP x TP) rows per chip) -> ttnn.bringup.sparse_sdpa(high_precision=True, attention_sink=sink
    / scale, scale=512^-0.5) over the window region only (the 128 window ids per query) (index list: load-time affine window
    ids + the top-k ids mapped to table rows, sentinel tail) -> reshard back -> inverse RoPE -> tt/quant.fp8_qdq -> grouped
    wo_a (whole groups per chip: one batched ttnn.linear) -> fp8_qdq -> ttnn.linear wo_b K-split -> reduce_scatter (axis 1)
    -> [S/SP, H/TP]'
  reuse: models/demos/deepseek_v3_d_p/tt/mla/compressed_sparse_attention.py:TtCSA (index_tables, _build_index, _sparse_attention,
    _reshard), models/demos/deepseek_v3_d_p/tt/mla/v4_attention_base.py (_q_heads, _unrope, _o_proj, sink pre-division)
  searched:
  - TtSWA (dense SDPA, band mask over [carry | chunk]) reads chunk + 128 keys per query; sparse_sdpa reads 128 + 512
  - 'K-31: sparse_sdpa keeps bf16 flash state; ttnn.bringup.sparse_sdpa(high_precision=True) is fp32 but refuses attention_sink
    (ttnn/ttnn/bringup/sdpa/device/sparse_sdpa_device_operation.cpp:132): the attention task extends the fork with the sink
    under high_precision (option, default unchanged)'
  - 'K-27: the dense SDPA sink uses a bf16-truncated scale; check the sparse path''s sink arithmetic'
  - 'sparse_sdpa needs H % 32 == 0 and reads one ROW_MAJOR tensor: 16 heads per chip on 4x4 -> head->seq all_to_all (TtCSA.needs_head_to_seq_reshard);
    the module reshards whenever TP > 1 (one path on every box)'
  notes: 'MQA: keys = values = 512-wide rows of one head. The sparse table holds compressed rows in the gather''s mesh order;
    the top-k ids (natural group positions) are mapped to table rows with integer ops on device. fp32 accumulation; the reference
    applies fp8_qdq before wo_a and before wo_b (wo_a weights bf16-exact). Window rows of position p: [p - 127, p], those
    before start from the served cache.'
- block_type: swa
  step: attn_residual
  tag: NATIVE
  ttnn: 'ttnn.bringup.mhc_post (X''_k = post_k attn_out + sum_j comb[j n + k] x_j: comb transposed, the fork''s default; fp32
    streams [S/SP, 4 x H/TP])'
  reuse: models/demos/glm53_flash_d_p/tt/mhc_fused.py, models/demos/xing40_a4b_d_p/tt/residual.py:TtHcResidual
  notes: Local per chip. attn_out arrives TP-split [S/SP, H/TP] from the reduce_scatter, matching the streams. Output h_mid
    [S, 4H] (no pending pre).
- block_type: swa
  step: ffn_hc
  tag: COMPOSED
  ttnn: as attn_hc on h_mid with hc_ffn_fn / hc_ffn_base / hc_ffn_scale -> [S/SP, 24] fp32; its pre is the next layer's pending
    pre (ffn_residual keeps it)
  reuse: models/demos/deepseek_v3_d_p/tt/mhc/tt_mhc.py:TtMHCWrap (project with tp_sum, build_consts), models/demos/xing40_a4b_d_p/tt/mhc.py:TtHcWeights
    (partial mixes + one exchange on SP x TP)
  searched: *id001
  notes: 'RMS is a per-token scalar, so it commutes past the linear: one tiny [S/SP, 25] exchange completes the projection
    and the norm.'
- block_type: swa
  step: ffn_collapse
  tag: COMPOSED
  ttnn: ttnn.slice + ttnn.multiply + 3 x ttnn.addcmul with attn_hc's pre (DS41-3) -> ffn_in [S/SP, H/TP] fp32
  reuse: models/demos/xing40_a4b_d_p/tt/collapse.py:TtHcCollapse, models/demos/deepseek_v3_d_p/tt/mhc/tt_mhc.py:_mix
  searched: *id002
  notes: Local per chip (per hidden column), no CCL, fp32 as the reference.
- block_type: swa
  step: ffn_norm
  tag: COMPOSED
  ttnn: distributed RMSNorm as attn_norm (ffn_norm.weight, eps 1e-20) -> all_gather (axis 1) of the fp32 output -> [S/SP,
    5120] fp32 on every chip of the row; tt/quant.fp8_qdq -> q(x) bf16 (exact) for the shared and routed experts
  reuse: models/demos/xing40_a4b_d_p/tt/norm.py (ffn_norm gathers its output over axis 1 inside the step)
  searched: &id006
  - 'Kimi K2.7 reference plan: a row all-gather before anything that needs whole token rows (router, experts)'
  - 'reference _swiglu: the shared and the routed experts act_quant the same ffn_norm output; the router reads it unquantized'
  notes: Boundary [S, H] fp32. The gathered fp32 rows feed the router, q(x) feeds dispatch and the shared expert.
- block_type: swa
  step: router
  tag: COMPOSED
  ttnn: ttnn.linear (x fp32 [S/SP, 5120] @ gate^T [5120 -> 384], bf16 weight as stored, HiFi4, fp32 out; x as bf16 hi + lo
    halves if the FPU's TF32 read of fp32 operands (K-30) flips near ties) -> ttnn.softplus -> ttnn.sqrt -> ttnn.add bias
    (SFPU, fp32, K-23) -> ttnn.topk (k 6) -> ttnn.gather of the unbiased scores -> / (sum + 1e-20) x 1.5 -> indices + weights
    for dispatch; dense [S/SP, 384] fp32 via ttnn.scatter in ROW_MAJOR (K-4) for the boundary
  reuse: models/demos/mimo_v2_6_d_p/tt/router.py:TtRouter (ttnn.topk path), models/demos/xing40_a4b_d_p/tt/router.py:TtRouter
  searched: &id007
  - 'repo_map router row: moe_grouped_topk is sigmoid noaux_tc with groups; DS41 scores are sqrt(softplus) with one group,
    so the ttnn.topk path (mimo) fits'
  - 'K-23: the bias only selects, the weights are unbiased, selection in fp32; K-39: near-tie flips are a loose bound in tests'
  notes: 'Replicated per row (every chip of a row has the gathered rows): no CCL.'
- block_type: swa
  step: experts
  tag: COMPOSED
  ttnn: 'ttnn.experimental.deepseek_prefill.masked_bincount -> ttnn.bringup.offset_cumsum -> ttnn.bringup.dispatch (axis 0;
    one group per column: 96 experts per group, 24 per chip on 4x4; 192 / 96 on 2x2 at real size, 48 / 24 scaled) of q(x)
    rows -> expert math per local expert: w1 / w3 decoded exactly from the packed fp4 + e8m0 bytes, ClampedSiluGlu (silu(min(g,
    10)) x clamp(u, +-10)), x routing weight, fp8 block-32 qdq of h, w2: ttnn.bringup.unified_routed_expert_moe extended (fp4
    weight reader; routing weight + h quant before down; options whose defaults keep the fork), HiFi4 + fp32 dest, high_precision
    -> ttnn.bringup.combine -> sum over the token''s experts in the group (weights already applied) -> partial [S/SP, 5120]
    fp32 -> reduce_scatter (axis 1, after adding the shared expert''s partial) -> [S/SP, H/TP]'
  reuse: models/demos/xing40_a4b_d_p/tt/experts.py:TtExperts (2D dispatch on SP x TP, groups along axis 0), models/demos/mimo_v2_6_d_p/tt/experts.py:TtExperts._loop_experts
    / _unified_experts, models/demos/deepseek_v3_d_p/tt/moe/README.md
  searched: &id008
  - 'repo_map MoE row: not dense EP; DeepSeek 2D dispatch (xing40: groups of 4 chips on FABRIC_2D 4x2)'
  - 'ttnn/ttnn/bringup/unified_routed_expert_ffn: ClampedSiluGlu has the DS-V4 limit 10 (device/unified_routed_expert_ffn_types.hpp:58);
    no fp4 weights, no activation quant between up and down, routing weight applied on the combine side'
  - 'reference _swiglu: the routing weight multiplies h BEFORE its fp8 act_quant (q(r h) != r q(h)), so the op must apply
    it'
  - 'DS41-10: bfp8 experts are exact but need 26.9 GiB per chip for this run''s 8 layers on 2x2 and 33.6 GiB on 4x4; the checkpoint''s
    packed bytes are 0.53 B per value; tt-metal''s MxFp4 (544 B per tile) is Quasar-only'
  - K-1 / K-2 (dispatched buffer written in place; counts and region offsets indexed by global expert id), K-22, K-25
  notes: 'Until the fork option lands, the component may run the fused-op-free loop (mimo _loop_experts: extract, decode the
    expert''s fp4 into a bf16 temporary with a composed ttnn chain (uint8 typecast, bitwise nibble split, e2m1 decode, x 2^scale),

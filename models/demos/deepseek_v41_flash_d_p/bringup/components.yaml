    departure from agent rule 5 (Setting experts_impl). Dispatch carries q(x) once per token (bf16-exact).'
- block_type: swa
  step: shared_expert
  tag: COMPOSED
  ttnn: q(x) [S/SP, 5120] bf16 -> ttnn.linear w1, w3 column-parallel (intermediate 2304 / TP per chip; bf16, HiFi4, fp32 out)
    -> clamp / silu / multiply (fp32) -> tt/quant.fp8_qdq (blocks of 32 inside the chip's slice) -> ttnn.linear w2 row-parallel

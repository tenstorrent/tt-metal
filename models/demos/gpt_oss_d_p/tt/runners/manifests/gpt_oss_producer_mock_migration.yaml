# Producer manifest: GPT-OSS loopback migration (slot 0,1 -> 2,3) via migration_driver.
#
# MODEL-SPECIFIC transport: SP=4 TP=8 (TP cols == num_kv_heads). Pair with
# topology_configuration/pipeline_prefill_request_1rank_gpt_oss_migration.yaml.
#
# Run (after endpoint + runner are up / WORKER_READY):
#   export PREFILL_MIGRATION_CLIENT_DIR=<tt-llm-engine>/disaggregation/migration/build_RelWithDebInfo/python
#   export PREFILL_TRACE_DIR=<golden trace dir>
#   python -m models.demos.common.prefill.runners.migration_driver \
#     --manifest models/demos/common/prefill/runners/producer_manifests/producer_manifest_gpt_oss_migration_loopback.yaml
#
# Expect in the RUNNER log: [kv-migrate-validate] ... ALL <N> pair(s) dst==src PASSED

transport:
  sp: 4
  tp: 8
  h2d_service_id: gpt_oss_prefill
  connect_timeout_s: 60

model:
  variant: gpt_oss_d_p
  num_layers: 36
  max_seq_len: 56320
  chunk_size: 5120

workload:
  num_users: 2
  slot_prompts:
    - /data/lgalas/gpt_oss_tt_cache/golden/longbook_qa_eng_prefill_56320
    - /data/lgalas/gpt_oss_tt_cache/golden/longbook_qa_eng_prefill_56320
  max_requests: 2
  interleave: round_robin
  check_pcc: true

migration:
  issue: false
  dest_endpoint_id: 1
  dst_slot_offset: 2
  timeout_ms: 3600000
  done_file: /tmp/migration_done.sentinel
  table_path: /tmp/prefill_kv_chunk_table.pb
  cmd_queue: /mig_ep1_cmd
  table_queue: /mig_ep1_table
  resp_queue: /mig_ep1_resp

env:
  PREFILL_MIGRATION_TABLE_PATH: /tmp/prefill_kv_chunk_table.pb
  PREFILL_STANDALONE_CHUNKED_PCC: "0.82"

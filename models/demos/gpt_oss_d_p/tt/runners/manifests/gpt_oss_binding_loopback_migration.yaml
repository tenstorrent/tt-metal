# REQUEST mode + loopback migration, 1 rank, GPT-OSS GQA (SP=4 × TP=8).
# Start from pipeline_prefill_request_1rank.yaml; pin mesh to (4,8) so TP cols == num_kv_heads (8).
# Pair with producer_manifest_migration_api_validation.yaml (transport.sp/tp must be 4/8 — export or
# override) and migration_driver. See docs/PREFILL_MIGRATION_TESTING.md Gate 2.
rank_bindings:
  - {rank: 0, mesh_id: 0, mesh_host_rank: 0, env_overrides: {}}
mesh_graph_desc_path: tt_metal/fabric/mesh_graph_descriptors/single_bh_galaxy_torus_xy_graph_descriptor.textproto
global_env:
  PREFILL_MANIFEST: "models/demos/gpt_oss_d_p/tt/runners/manifests/gpt_oss_d_p.json"
  PREFILL_MODEL: "gpt_oss_d_p"
  PREFILL_NUM_LAYERS: "36"
  PREFILL_SP: "4"
  PREFILL_TP: "8"
  PREFILL_FABRIC_MODE: "1d_ring"
  PREFILL_MAX_SEQ_LEN: "131072"
  PREFILL_CHUNK_SIZE: "8192"
  PREFILL_H2D_SERVICE_ID: "gpt_oss_prefill"
  PREFILL_GATE_FALLBACK_MODE: "DEVICE_FP32"
  PREFILL_NUM_USERS: "4"
  LOGURU_LEVEL: "INFO"

  PREFILL_ENABLE_MIGRATION: "1"
  PREFILL_MIGRATION_WAIT_READY_MS: "120000"
  PREFILL_MIGRATION_TABLE_PATH: "/tmp/prefill_kv_chunk_table.pb"
  PREFILL_MIGRATION_DEVICE_MAP_PATH: "/tmp/prefill_kv_device_map.json"
  PREFILL_MIGRATION_CMD_QUEUE: "/mig_ep1_cmd"
  PREFILL_MIGRATION_TABLE_QUEUE: "/mig_ep1_table"
  PREFILL_MIGRATION_RESP_QUEUE: "/mig_ep1_resp"
  # Set PREFILL_MIGRATION_CLIENT_DIR in the shell / gate script (tt-run does not forward PREFILL_*):
  #   export PREFILL_MIGRATION_CLIENT_DIR=<tt-llm-engine>/disaggregation/migration/build_RelWithDebInfo/python

  HF_MODEL: "/data/jmalone/.cache/huggingface/hub/models--openai--gpt-oss-120b/gpt-oss-120b"
  PREFILL_TTNN_CACHE: "/data/jmalone/gpt_oss_tt_cache/"
  GPT_OSS_WEIGHTS_FROM_CACHE: "1"
  PREFILL_ENABLE_LAYER_ACK: "1"

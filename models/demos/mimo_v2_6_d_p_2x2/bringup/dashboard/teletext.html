function worstMetric(t){

function pGraph(){

    if (!two) LT.forEach((t, i) => b.m(20, c0 + i, sel.has(i) ? 63 : 20, colAt(i)));
    else for (let i = 0; i < N; i += 2){ const L = colAt(i), R = i + 1 < N ? colAt(i + 1) : null;
      if (R == null) b.m(20, c0 + i / 2, 21, L); else if (L === R) b.m(20, c0 + i / 2, 63, L); else b.m(20, c0 + i / 2, 21, L, R); }
    const step = two ? 10 : 5;

function pShard(){
  const b = new Buf(), P = D.plan;
  banner(b, "Sharding + memory", MAG, WHT, 0, 1, CYN);
  if (!P){ noData(b, 6, "The plan gate has not written plan_memory.json yet."); return [b]; }
  const mesh = P.mesh || D.mesh || [1, 1], nch = mesh[0] * mesh[1], cap = +P.capacity_gb, bud = +P.budget_gb, tot = +P.total_gb;
  b.t(3, 0, `MESH ${mesh.join("x")}`, YEL); b.t(3, 9, trunc(`${nch}x ${D.chip_name || "chip"}`, 20), WHT);
  if (P.tensors != null) b.tr(3, W - 1, `${P.tensors} tensors`, CYN);
  let e = b.t(4, 0, `${tot.toFixed(2)}/${cap} GB/chip`, WHT); e = b.t(4, e + 1, `budget ${bud.toFixed(1)}`, RED);
  b.tr(4, W - 1, P.fits ? "FITS" : "NO FIT", P.fits ? GRN : RED, null, P.fits ? 0 : 1);
  const LAB = 14, BC = 15, BW = 19, HU = BW * 2, VC = 35;
  const u = gb => gb / cap * HU;
  b.t(5, 0, "GROUP", CYN);
  for (let g = 0; g <= cap + 1e-9; g += cap / 4){ const c = BC + Math.min(BW - 1, Math.floor(u(g) / 2)); const s = String(Math.round(g));
    b.t(5, Math.min(c, BC + BW - s.length), s, CYN); }
  b.t(5, VC + 1, "GB", CYN);
  const hb = Math.min(HU - 1, Math.floor(u(bud))), bCell = BC + (hb >> 1), bBits = hb & 1 ? 34 : 17;
  const abbr = s => { s = A(s).replace(/^state:\s*/, "").replace(/^extra:\s*/, "+").replace(/\s*\(planner estimate\)/, "").replace(/\s+layers\b.*$/, "");
    if (s.length > LAB){ s = s.replace(/attention/g, "attn").replace(/embedding/g, "embed").replace(/activations/g, "acts")
      .replace(/vocab-sharded/g, "vocab").replace(/contract/g, "contr").replace(/tables/g, "tbl").replace(/ and /g, "+").replace(/[()]/g, ""); }
    return trunc(s, LAB); };
  let rows = (P.rows || []).slice();
  const MAXR = 13;
  if (rows.length > MAXR){ const rest = rows.slice(MAXR - 1); rows = rows.slice(0, MAXR - 1);
    rows.push({group:`+${rest.length} others`, gb: rest.reduce((a, r) => a + r.gb, 0)}); }
  const SER = [CYN, GRN, YEL, MAG, WHT];
  const bar = (r, s, e2, col, tick) => { for (let c = 0; c < BW; c++){ const hl = 2 * c, hr = 2 * c + 1;
      let bits = (hl >= s && hl < e2 ? 21 : 0) | (hr >= s && hr < e2 ? 42 : 0);
      if (bits) b.m(r, BC + c, bits, col); }
    if (tick != null){ const c = Math.min(BW - 1, tick >> 1); b.m(r, BC + c, tick & 1 ? 32 : 16, col); } };
  let cum = 0;
  rows.forEach((g, i) => { const r = 6 + i, col = SER[i % SER.length];
    const s = Math.round(u(cum)), e2 = Math.round(u(cum + g.gb)); cum += g.gb;
    b.t(r, 0, abbr(g.group), col);
    const cell = b.c[r][bCell]; bar(r, s, e2, col, e2 <= s && g.gb > 0 ? Math.min(HU - 1, s) : null);
    if (cell.m < 0) b.m(r, bCell, bBits, RED);
    b.tr(r, W - 1, g.gb >= 10 ? g.gb.toFixed(1) : g.gb.toFixed(2), WHT); });
  const rt = 6 + rows.length;
  if (rt <= 19){ b.t(rt, 0, "TOTAL", WHT); bar(rt, 0, Math.round(u(tot)), tot <= bud ? GRN : RED, null);
    if (b.c[rt][bCell].m < 0) b.m(rt, bCell, bBits, RED); b.tr(rt, W - 1, tot.toFixed(1), tot <= bud ? GRN : RED); }
  (P.errors || []).slice(0, Math.max(0, 19 - rt)).forEach((er, i) => b.t(rt + 1 + i, 0, trunc("! " + er, 40), RED, null, 1));
  // mesh diagram
  const C = mesh[1], R = mesh[0];
  if (R === 1 && C <= 8){
    const gap = C > 5 ? 1 : 2, bw = Math.floor((W - (C - 1) * gap) / C), x0 = Math.floor((W - (C * bw + (C - 1) * gap)) / 2);
    const ctr = [];
    for (let k = 0; k < C; k++){ const x = x0 + k * (bw + gap); ctr.push(x + (bw >> 1));
      b.fill(20, x, x + bw - 1, BLU); b.fill(21, x, x + bw - 1, BLU);
      const lab = bw >= 6 ? `CHIP ${k}` : `C${k}`, gbs = `${tot.toFixed(1)}G`;
      b.t(20, x + Math.max(0, (bw - lab.length) >> 1), lab.slice(0, bw), WHT, BLU);
      b.t(21, x + Math.max(0, (bw - gbs.length) >> 1), gbs.slice(0, bw), YEL, BLU);
      if (k < C - 1) for (let g = 0; g < gap; g++) b.m(20, x + bw + g, 12, CYN); }
    const fab = (A(D.box).match(/FABRIC_\w+/) || [""])[0], ring = /RING/i.test(fab);
    if (ring && C > 1){ b.m(22, ctr[0], 13, CYN); b.m(22, ctr[C - 1], 14, CYN); for (let c = ctr[0] + 1; c < ctr[C - 1]; c++) b.m(22, c, 12, CYN); }
    const lab = ` ${fab || "mesh " + mesh.join("x")} `; b.t(22, Math.max(0, (W - lab.length) >> 1), lab, CYN);
  } else b.t(21, 0, trunc(`mesh ${mesh.join("x")}: ${nch} chips, ${tot.toFixed(1)} GB each`, 40), CYN);
  return [b];
}

function pPcc(){
  /* the CPU reference and the latest device run only: more lines are unreadable at teletext resolution */
  const ALL = D.trails || [], DEV = ALL.filter(t => t.device), T = ALL.filter(t => !t.device).slice(0, 1).concat(DEV.slice(-1));
  const b = new Buf(), N = (D.layer_types || []).length || Math.max(1, ...T.flatMap(t => t.points.map(p => p[0] + 1)));
  banner(b, "PCC trail", CYN, BLK, 0, 1, BLU);
  b.t(3, 0, "1-PCC/layer, log, lower=better", CYN);
  if (!T.length){ noData(b, 6, "No per-layer PCC recorded yet."); return [b]; }
  const thr = [...new Set([D.thresholds && D.thresholds.layer, D.thresholds && D.thresholds.final_hidden].filter(v => v != null))];
  const lv = v => Math.log10(Math.max(1 - v, 1e-16));
  const all = T.flatMap(t => t.points.map(p => lv(p[1]))).concat(thr.map(lv));
  let lo = Math.floor(Math.min(...all)), hi = Math.ceil(Math.max(...all)); if (hi - lo < 2) lo = hi - 2; hi = Math.min(0, Math.max(hi, lo + 2));
  const RR = 16, PH = RR * 3, r0 = 4, c0 = 6, ppl = N <= 33 ? 2 : 1, PW = Math.ceil(N * ppl / 2) * 2;
  const yOf = e => Math.max(0, Math.min(PH - 1, Math.round((hi - e) / (hi - lo) * (PH - 1))));
  const px = canvas(PW, PH);
  thr.forEach(p => { const y = yOf(lv(p)); for (let x = 0; x < PW; x += 2) px[y][x] = RED; });
  const COLS = [YEL, GRN, MAG, WHT, CYN, RED];
  T.forEach((t, k) => { const col = COLS[k % COLS.length], pts = t.points.slice().sort((a, b2) => a[0] - b2[0]);
    const ys = new Map(pts.map(p => [p[0], yOf(lv(p[1]))]));
    pts.forEach(([i]) => { const y = ys.get(i), yp = ys.has(i - 1) ? ys.get(i - 1) : y, yn = ys.has(i + 1) ? ys.get(i + 1) : y;
      if (ppl === 2){ const xl = i * 2, xr = xl + 1;
        const ml = Math.round((yp + y) / 2), mr = Math.round((y + yn) / 2);
        for (let q = Math.min(ml, y); q <= Math.max(ml, y); q++) px[q][xl] = col;
        for (let q = Math.min(mr, y); q <= Math.max(mr, y); q++) px[q][xr] = col; }
      else { for (let q = Math.min(yp, y); q <= Math.max(yp, y); q++) px[q][i] = col; } }); });
  plot(b, r0, c0, px);
  for (let r = r0; r < r0 + RR; r++) b.m(r, c0 - 1, 42, WHT);
  for (let e = hi; e >= lo; e--){ const y = yOf(e), r = r0 + Math.floor(y / 3); if ((hi - e) % 2) continue;
    b.tr(r, c0 - 2, e === 0 ? "1" : `1E${e}`, WHT); }
  thr.forEach(p => { const r = r0 + Math.floor(yOf(lv(p)) / 3), c = Math.min(c0 + PW / 2 + 1, W - 4); b.t(r, c, String(p).slice(0, 4), RED); });
  const step = ppl === 2 ? 5 : 10;
  for (let i = 0; i < N; i += step){ const c = c0 + Math.floor(i * ppl / 2), s = "L" + i; if (c + s.length <= W) b.t(r0 + RR, c, s, WHT); }
  T.forEach((t, k) => { const r = 21 + k, col = COLS[k % COLS.length];
    const worst = Math.max(...t.points.map(p => 1 - p[1])), name = t.device ? t.label : "CPU reference vs HF";
    const tag = ` worst ${worst > 0 ? expo(worst) : "0"}`;
    b.m(r, 0, 63, col); b.t(r, 2, trunc(name, W - 3 - tag.length), WHT); b.tr(r, W - 1, tag, col); });
  if (ALL.length > T.length) b.tr(3, W - 1, `+${ALL.length - T.length} older`, YEL);
  return [b];
}

  const comps = D.components || [], cpuC = comps.filter(c => c.state !== "device");
  lines.push({draw(b, r){ b.t(r, 0, `Ops not on device ${cpuC.length}/${comps.length}`, WHT); b.t(r, 25, "N", GRN); b.t(r, 26, "ative", WHT); b.t(r, 32, "C", MAG); b.t(r, 33, "omposed", WHT); }});
  const short = k => { const p = A(k).split("/"); return p.length > 1 && bts.includes(p[0]) ? `${p[0].slice(0, 4)}/${p.slice(1).join("/")}` : p.join("/"); };
  for (let i = 0; i < cpuC.length; i += 2){ const pair = cpuC.slice(i, i + 2);
    lines.push({draw(b, r){ pair.forEach((c, j) => { const x = j * 20, comp = /COMPOSED/i.test(c.tag || "");
      b.t(r, x, comp ? "C" : "N", comp ? MAG : GRN); b.t(r, x + 2, trunc(short(c.key), 17), WHT); }); }}); }
  const al = alertTasks();
  if (al.length){ lines.push(gapLine); lines.push(hdrLine("Waiting / stopped", String(al.length), MAG, WHT));
    al.forEach(t => { const txt = t.waiting || t.reason || t.title; lines.push({draw(b, r){ const [c, l, f] = st(t.status); b.t(r, 0, abbrId(t.id, 20), WHT); b.t(r, 22, t.waiting ? "WAIT" : l, t.waiting ? MAG : c, null, 1); }});
      wrap(txt, 37).slice(0, 2).forEach(l => lines.push({draw(b, r){ b.t(r, 2, l, CYN); }})); }); }
  const pe = (D.plan && D.plan.errors) || [];
  if (pe.length){ lines.push(gapLine); lines.push(hdrLine("Plan errors", String(pe.length), RED, WHT)); pe.forEach(e => wrap(e, 38).forEach(l => lines.push({draw(b, r){ b.t(r, 1, l, RED); }}))); }
  return flow(lines, () => new Buf(), 4, 22).map((b, i, a) => { banner(b, "Findings + gaps", BLU, YEL, i, a.length, RED); return b; });
}

function pPrior(){
  const P = D.prior, lines = [], A = trunc(P.this.label, 7), B = trunc(P.prior.label, 7);
  const mk = () => { const b = new Buf(); b.t(3, 0, "THIS", CYN); b.t(3, 5, A.toUpperCase(), WHT); b.t(3, 13, "PRIOR", CYN); b.t(3, 19, B.toUpperCase(), WHT);
    b.tr(3, W - 1, "D=THIS-PRIOR", CYN); return b; };
  if (P.error){ const b = mk(); banner(b, "Versus prior", GRN, BLK, 0, 1, MAG); noData(b, 6, `Prior ${P.source}: ${P.error}`); return [b]; }
  const pc = v => v == null ? "-" : v.toFixed(5), dpc = d => d == null ? "-" : d === 0 ? "0" : (d > 0 ? "+" : "-") + expo(Math.abs(d));
  const ms = v => v == null ? "-" : v >= 1000 ? v.toFixed(0) : v.toFixed(1);
  const dms = r => r.delta == null ? "-" : (r.delta > 0 ? "+" : "") + (Math.abs(r.delta) >= 100 ? r.delta.toFixed(0) : r.delta.toFixed(1));
  const dcol = r => r.delta == null || !r.prior || Math.abs(r.this / r.prior - 1) < 0.01 ? WHT : r.delta < 0 ? GRN : RED;
  const cols = (lab, lc, a, b2, d, dc) => ({draw(bb, r){ bb.t(r, 0, trunc(lab, 15), lc); bb.tr(r, 22, a, a === "-" ? CYN : YEL); bb.tr(r, 30, b2, b2 === "-" ? CYN : WHT); bb.tr(r, W - 1, d, dc); }});
  const colHdr = (a, b2) => ({draw(bb, r){ bb.tr(r, 22, a, CYN); bb.tr(r, 30, b2, CYN); bb.tr(r, W - 1, "DELTA", CYN); }});
  // performance: the current profile's chunk, the TTFT, per block type, per section
  lines.push(hdrLine("Performance", `${P.chunk} ms`, BLU, YEL)); lines.push(colHdr(A.toUpperCase(), B.toUpperCase()));
  P.perf.forEach(r => lines.push(cols(r.short || r.what, WHT, ms(r.this), ms(r.prior), dms(r), dcol(r))));
  if (P.blocks.length){ lines.push(gapLine); lines.push(hdrLine("Per block type", "ms/layer", BLU, YEL));
    P.blocks.forEach(r => lines.push(cols(r.short || r.what, WHT, ms(r.this), ms(r.prior), dms(r), dcol(r)))); }
  if (P.sections.length){ lines.push(gapLine); lines.push(hdrLine("Per section", "ms", BLU, YEL));
    P.sections.forEach(r => lines.push(cols(r.what, WHT, ms(r.this), ms(r.prior), dms(r), dcol(r)))); }
  // accuracy: the worst layer PCC per matching task, then the headline gate metrics (component and swap PCC left out)
  const worst = {};
  P.layers.forEach(r => { const w = worst[r.task] || (worst[r.task] = {task:r.task, this:null, prior:null});
    ["this", "prior"].forEach(k => { if (r[k] != null && (w[k] == null || r[k] < w[k])) w[k] = r[k]; }); });
  const WL = Object.values(worst);
  lines.push(gapLine); lines.push(hdrLine("Worst layer PCC", `${WL.length} runs`, BLU, YEL));
  if (!WL.length) lines.push({draw(b, r){ b.t(r, 1, "none recorded on either side yet", WHT); }});
  WL.forEach(w => lines.push(cols(w.task, WHT, pc(w.this), pc(w.prior), dpc(w.this != null && w.prior != null ? w.this - w.prior : null), WHT)));
  let last = null;
  const G = P.gate.filter(r => !/_L\d+$|^pcc_swap_/.test(r.metric));
  lines.push(gapLine); lines.push(hdrLine("Gate metrics", String(G.length), BLU, YEL)); last = null;
  if (!G.length) lines.push({draw(b, r){ b.t(r, 1, "none recorded on either side yet", WHT); }});
  G.forEach(r => { if (r.task !== last){ last = r.task; lines.push({draw(b, rr){ b.t(rr, 0, abbrId(r.task, 20), MAG); }}); }
    lines.push(cols(" " + r.metric.replace(/^pcc_/, ""), WHT, typeof r.this === "number" ? fmt(r.this).slice(0, 7) : "-", typeof r.prior === "number" ? fmt(r.prior).slice(0, 7) : "-", dpc(r.delta), WHT)); });
  // tasks: status per matching task id (runs.compare)
  const T = P.tasks, pass = i => T.filter(t => t.status[i] === "PASS").length, has = i => T.filter(t => t.status[i] != null).length;
  lines.push(gapLine); lines.push(hdrLine("Tasks", `${pass(0)}/${has(0)} vs ${pass(1)}/${has(1)}`, BLU, YEL));
  lines.push({draw(b, r){ b.t(r, 21, A.toUpperCase().slice(0, 5), CYN); b.t(r, 27, B.toUpperCase().slice(0, 5), CYN); b.tr(r, W - 1, "TRIES", CYN); }});
  T.forEach(t => lines.push({draw(b, r){ b.t(r, 0, abbrId(t.task, 20), WHT);
    const s0 = t.status[0] ? st(t.status[0]) : [CYN, "-", 0], s1 = t.status[1] ? st(t.status[1]) : [CYN, "-", 0];
    b.t(r, 21, s0[1], s0[0], null, s0[2]); b.t(r, 27, s1[1], s1[0]);
    const a = v => v == null ? "-" : String(v); b.tr(r, W - 1, `${a(t.attempts[0])}/${a(t.attempts[1])}`, WHT); }}));
  return flow(lines, mk, 4, 22).map((b, i, a) => { banner(b, `Vs prior ${A}/${B}`, GRN, BLK, i, a.length, MAG); return b; });
}

const PAGES = [
  {n:100, name:"Index", short:"Index", build:pIndex},
  {n:101, name:"Gate ladder", short:"Gates", build:pLadder},
  {n:102, name:"Model graph", short:"Graph", build:pGraph},
  {n:103, name:"Sharding", short:"Memory", build:pShard},
  {n:104, name:"PCC trail", short:"PCC", build:pPcc},
  {n:105, name:"Timing and profile", short:"Timing", build:pTiming},
  {n:106, name:"Findings and gaps", short:"Finds", build:pFindings},
];
if (D && D.prior) PAGES.push({n:107, name:"Versus prior", short:"Prior", build:pPrior});
function buildAll(){ const out = {};
  for (const p of PAGES){ try { out[p.n] = p.build(); }
    catch (err){ const b = new Buf(); banner(b, p.name, RED, WHT, 0, 1); b.t(4, 0, "PAGE ERROR", RED, null, 1); wrap(String(err && err.message || err), 40).slice(0, 6).forEach((l, i) => b.t(6 + i, 0, l, WHT)); out[p.n] = [b]; } }
  return out; }
function notFound(n){ const b = new Buf(); banner(b, `Page ${n}`, RED, WHT, 0, 1); b.t(5, 1, `PAGE ${n} IS NOT IN TRANSMISSION`, YEL);
  b.t(7, 1, "This service carries pages", WHT); b.t(8, 1, `${PAGES[0].n} to ${PAGES[PAGES.length - 1].n}.`, WHT); b.t(10, 1, "Press the blue key for the index.", CYN); return b; }

/* fastext links for a page */
function links(n){ const i = PAGES.findIndex(p => p.n === n), L = PAGES.length;
  if (i < 0) return [PAGES[0], PAGES[1], PAGES[2], PAGES[0]];
  if (n === PAGES[0].n) return [1, 2, 3, 4].map(k => PAGES[k % L]);
  const rest = PAGES.filter(p => p.n !== n && p.n !== PAGES[0].n), j = rest.findIndex(p => p.n > n);
  const nx = k => rest[((j < 0 ? 0 : j) + k) % rest.length];
  return [PAGES[(i - 1 + L) % L], PAGES[(i + 1) % L], (i + 1) % L === 0 ? nx(0) : nx(1), PAGES[0]]; }

/* compose the header and fastext rows onto a page */
const DAYS = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"], MONS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function compose(page, S, now){
  const b = page.clone(); for (let k = 0; k < W; k++) b.c[0][k] = {ch:" ", fg:WHT, bg:BLK, m:-1, fl:0, lk:null};
  const p2 = n => String(n).padStart(2, "0");
  const lead = S.entry ? ("P" + S.entry.padEnd(3, "-")) : S.hold ? "HOLD" : ("P" + (S.target || S.page));
  b.t(0, 0, lead, S.hold && !S.entry ? RED : WHT, null, S.hold && !S.entry ? 1 : 0);
  b.t(0, 5, "TT-FAX", WHT); b.t(0, 13, String(S.roll || S.page), S.roll ? YEL : WHT);
  b.t(0, 17, `${DAYS[now.getDay()]} ${p2(now.getDate())} ${MONS[now.getMonth()]}`, WHT);
  b.t(0, 32, `${p2(now.getHours())}:${p2(now.getMinutes())}/${p2(now.getSeconds())}`, YEL);
  const L = links(S.page), FC = [RED, GRN, YEL, CYN];
  for (let k = 0; k < W; k++) b.c[23][k] = {ch:" ", fg:WHT, bg:BLK, m:-1, fl:0, lk:null};
  L.forEach((p, i) => { b.t(23, i * 10, p.short.slice(0, 9), FC[i]); for (let k = i * 10; k < i * 10 + 10; k++) b.c[23][k].lk = i; });
  return b;
}

/* ---------- DOM ---------- */
const ESC = {"&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;"};
function rowHtml(b, r){ let h = ""; for (const x of b.c[r]){
    let cls = `f${x.fg} b${x.bg}`; if (x.m >= 0) cls += ` m s${x.m}`; if (x.fl) cls += " fl";
    h += `<span class="${cls}"${x.lk != null ? ` data-k="${x.lk}"` : ""}>${x.m >= 0 ? "" : (ESC[x.ch] || x.ch)}</span>`; }
  return h; }
function mosaicCss(){ let css = "";
  for (let n = 1; n < 64; n++){ const img = [], pos = [];
    for (let k = 0; k < 6; k++) if (n & (1 << k)){ img.push("linear-gradient(currentColor,currentColor)"); pos.push(`${k & 1 ? "100%" : "0"} ${["0", "50%", "100%"][k >> 1]}`); }
    css += `.s${n}{background-image:${img.join(",")};background-position:${pos.join(",")};background-size:${img.map(() => "50.5% 34%").join(",")}}\n`; }
  return css; }

function toText(b){ // debugging aid: the screen as plain text (mosaics shown as #)
  return b.c.map((row, r) => row.map(x => x.m >= 0 ? (x.m === 0 ? " " : "#") : x.ch).join("") + (b.dh.has(r) ? "  <dh" : "")).join("\n"); }
if (typeof window !== "undefined") window.__TT = {buildAll, compose, toText, PAGES};

if (typeof document !== "undefined" && document.getElementById("grid")){
  const grid = document.getElementById("grid"), glass = document.getElementById("glass"), live = document.getElementById("live");
  const style = document.createElement("style"); style.textContent = mosaicCss(); document.head ? document.head.appendChild(style) : document.body.appendChild(style);
  const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const BUILT = buildAll();
  const S = {page:100, sub:0, hold:!!reduce, entry:"", target:null, roll:null, tick:0, timer:null, shown:null, idle:0};
  /* carousel: Index and Model graph take turns every CAROUSEL_S seconds while one of them is on screen (hold stops it) */
  const CAROUSEL_S = 20, CAROUSEL = ["Index", "Graph"].map(s => (PAGES.find(p => p.short === s) || {}).n).filter(n => n != null);
  let rows = [];
  grid.innerHTML = Array.from({length:H}, (_, r) => `<div class="row" data-r="${r}"></div>`).join("");
  rows = [...grid.children];
  const subsOf = n => BUILT[n] || null;
  function current(){ const s = subsOf(S.page); return s ? s[Math.min(S.sub, s.length - 1)] : notFound(S.page); }
  function paint(full = true){
    const b = compose(current(), S, new Date());
    for (let r = 0; r < H; r++){ if (!full && r !== 0 && r !== 23) continue;
      const cls = "row" + (b.dh.has(r) ? " dh" : b.dh.has(r - 1) ? " hid" : "");
      if (rows[r].className !== cls) rows[r].className = cls;
      rows[r].innerHTML = rowHtml(b, r); }
    const L = links(S.page);
    L.forEach((p, i) => { const el = document.getElementById("fx" + i); el.textContent = p.short; el.setAttribute("aria-label", `${["Red","Green","Yellow","Blue"][i]}: page ${p.n}, ${p.name}`); });
    document.getElementById("bhold").setAttribute("aria-pressed", S.hold ? "true" : "false");
  }
  function announce(){ const s = subsOf(S.page), p = PAGES.find(q => q.n === S.page);
    live.textContent = p ? `Page ${S.page}, ${p.name}` + (s && s.length > 1 ? `, subpage ${S.sub + 1} of ${s.length}` : "") : `Page ${S.page} not in transmission`;
    glass.setAttribute("aria-label", `Teletext screen, ${live.textContent}. Type a page number, or use the arrow keys.`); }
  function show(n, sub = 0){ S.page = n; S.sub = sub; S.tick = 0; S.idle = 0; S.target = null; S.roll = null; paint(); announce(); }
  function goTo(n){
    clearInterval(S.timer); S.timer = null;
    if (reduce){ show(n); return; }
    S.target = n; const seq = PAGES.map(p => p.n); let i = Math.max(0, seq.indexOf(S.page)), steps = 0;
    const exists = !!subsOf(n), maxSteps = exists ? 6 + Math.floor(Math.random() * 4) : 26;
    S.timer = setInterval(() => { i = (i + 1) % seq.length; S.roll = seq[i]; steps++; paint(false);
      if (steps >= maxSteps){ clearInterval(S.timer); S.timer = null; show(n); } }, 70);
    paint(false);
  }
  function pageStep(d){ const seq = PAGES.map(p => p.n); let i = seq.indexOf(S.target != null ? S.target : S.page); if (i < 0) i = 0; goTo(seq[(i + d + seq.length) % seq.length]); }
  function subStep(d){ const s = subsOf(S.page); if (!s || s.length < 2) return; S.sub = (S.sub + d + s.length) % s.length; S.tick = 0; paint(); announce(); }
  function fast(i){ goTo(links(S.page)[i].n); }
  function toggleHold(){ S.hold = !S.hold; S.tick = 0; paint(false); document.getElementById("bhold").setAttribute("aria-pressed", S.hold ? "true" : "false"); live.textContent = S.hold ? "Hold on" : "Hold off"; }
  function digit(d){ if (!S.entry && d === "0") return; if (!S.entry && d === "9") return; S.entry += d; paint(false);
    if (S.entry.length === 3){ const n = +S.entry; S.entry = ""; goTo(n); } }
  setInterval(() => { if (!S.timer){ const s = subsOf(S.page), c = CAROUSEL.indexOf(S.page);
      if (c >= 0 && CAROUSEL.length > 1 && !S.hold && !S.entry && ++S.idle >= CAROUSEL_S){ goTo(CAROUSEL[(c + 1) % CAROUSEL.length]); return; }
      if (s && s.length > 1 && !S.hold && ++S.tick >= 8){ S.sub = (S.sub + 1) % s.length; S.tick = 0; paint(); announce(); } else paint(false); } }, 1000);
  document.addEventListener("keydown", e => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const onBtn = e.target && e.target.tagName === "BUTTON";
    if (/^[0-9]$/.test(e.key)){ digit(e.key); e.preventDefault(); return; }
    S.idle = 0;
    if (onBtn && (e.key === " " || e.key === "Enter")) return;
    const k = e.key.toLowerCase(); let used = true;
    if (e.key === "ArrowRight") pageStep(1); else if (e.key === "ArrowLeft") pageStep(-1);
    else if (e.key === "ArrowDown" || e.key === "PageDown") subStep(1); else if (e.key === "ArrowUp" || e.key === "PageUp") subStep(-1);
    else if (k === "r") fast(0); else if (k === "g") fast(1); else if (k === "y") fast(2); else if (k === "b") fast(3);
    else if (k === "h" || e.key === " ") toggleHold(); else if (k === "i" || e.key === "Home") goTo(100);
    else if (e.key === "Escape" && S.entry){ S.entry = ""; paint(false); } else used = false;
    if (used) e.preventDefault(); });
  grid.addEventListener("click", e => { const el = e.target.closest("[data-k]"); if (el) fast(+el.dataset.k); });
  [0, 1, 2, 3].forEach(i => document.getElementById("fx" + i).addEventListener("click", () => fast(i)));
  const dg = document.getElementById("digits");
  dg.innerHTML = "1234567890".split("").map(d => `<button type="button" data-d="${d}" aria-label="Digit ${d}">${d}</button>`).join("");
  dg.addEventListener("click", e => { const el = e.target.closest("[data-d]"); if (el) digit(el.dataset.d); });
  document.getElementById("bprev").onclick = () => pageStep(-1); document.getElementById("bnext").onclick = () => pageStep(1);
  document.getElementById("bsubm").onclick = () => subStep(-1); document.getElementById("bsubp").onclick = () => subStep(1);
  document.getElementById("bhold").onclick = toggleHold; document.getElementById("bidx").onclick = () => goTo(100);
  const fit = () => { const h = grid.getBoundingClientRect().height; if (h > 0) grid.style.setProperty("--fs", (h / 24 * 1.12).toFixed(2) + "px"); };
  if (window.ResizeObserver) new window.ResizeObserver(fit).observe(grid); else window.addEventListener("resize", fit);
  document.getElementById("lastpg").textContent = String(PAGES[PAGES.length - 1].n);
  fit(); show(100);
}
</script>

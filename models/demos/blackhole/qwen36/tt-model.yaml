# tt-model.yaml — Qwen/Qwen3.8-27B on TWO p150a cards linked by ethernet (2 Blackhole chips), served through vLLM.
#   profiles: tp2         (default) plain TP=2 over both chips, up to 32 users, full sampling, 64K context, 622,592-token KV pool
#             p1d1        prefill chip + decode chip: prefill/decode disaggregation over the chip-to-chip fabric, <= 8 users, 64K context
#             tp2-dflash2 TP=2 + lossless DFlash2 speculative decoding, 1-4 greedy users, 64K context (gate D passed on TP=2:
#                         lossless-class identity vs tp2 AND 1.5x per user at <= 2k ISL / 3.7x on code; DFLASH2_FEASIBILITY.md 3.4)
#   not included: p1d1-dflash2 (the KV connector needs traced-bucket prefill, DFlash2 needs it off; 2-3 weeks of model work)
#
#   tt-model package --container models/demos/blackhole/qwen36/tt-model.yaml --out <builds>
#   tt-model serve   <builds>/qwen3.8-27b-p150x2/tt_kernel_manifest.json [--profile p1d1]
#   tt-model push    <builds>/qwen3.8-27b-p150x2 --private
#
# Design: profiles/p150x2/MANIFEST_DESIGN.md (entry-point dispatch TT_SERVE_LAUNCHER -> pd_container supervisor, device/port
# mapping, card layout). Every value below is the one the profile was validated and benchmarked with (profiles/p150x2/
# tp2_env.sh + tp2_serve.sh, tp2_dflash2_serve.sh, p1d1_env.sh + p1d1_serve.sh, 2026-09-21):
#   * KV cache is bf8 everywhere (QWEN_SDPA_BF8=1 in the common env): 17.0 KB/token/device at TP=2; the pools below do not
#     fit at bf16.
#   * tp2 and p1d1 sample on the host (Qwen36ForCausalLM refuses on-device sampling on any mesh but 1x4 / 1x8,
#     tt/qwen36_vllm.py _validate_device_sampling_request). ONLY tp2-dflash2 carries additional_config.tt.sample_on_device_mode
#     = decode_only: the plugin's block-output contract requires it (platform.py) and Qwen36DFlashForCausalLM accepts it at
#     TP=2 when speculation is on (its decode tokens are its own greedy speculative outputs; prefill anchors are host-sampled).
#     It is a PROFILE key, not a common one, so pd_container never has to drop it.
#   * tp2-dflash2 speculates on EVERY prompt: the serving class pins tt_adaptive_block_max_prompt_tokens=0 (a plain trace
#     followed by a spec replay hangs the device), so there is no per-ISL gate. The speed-up fades above ~8k ISL (1.07x at
#     32k) -- documented on the card (1-4 users, best below ~8k ISL) rather than pretending a knob exists.
schema: "5.1"
repo: changh95/qwen3.8-27b-p150x2
name: qwen3.8-27b-p150x2
weights:
  repo: Qwen/Qwen3.8-27B
  revision: 1d4bf0f2ff6012fd82039f2fa52739d0dd7c60c0   # refs/main as validated 2026-09-12 (same pin as the p300x2 packages)
kind: vllm-plugin
arch: blackhole

source:
  tt_metal: /home/ttuser/experiments/qwen36_27b/tt-metal        # branch qwen36-p150x2 (PD/TP=1 mode + DFlash2 serving merged); pushed to
                                                                 # tenstorrent/tt-metal before `package` (provenance: built.tt_metal.pushed)
  code:                                                          # = union of the two p300x2 manifests' allowlists
    - models/common
    - models/tt_transformers
    - models/demos/blackhole/qwen36                              # model, kv_transfer hook, DFlash2 drafter, vllm_bundle, demo, tests
    - models/demos/qwen3_vl/tt/common.py
    - models/demos/utils
    - models/experimental/gated_attention_gated_deltanet
    - models/perf
    - models/tt_dit/utils/tensor.py
    - models/model_trace_region_sizes.yaml
    - models/model_targets.yaml
  ubuntu: "22.04"
  python: "3.12"

runtime:
  vllm: {version: "0.26.0"}                                    # the validated serving venv; the dispatch relies on 0.26.0 calling
                                                               # load_general_plugins() before parsing `vllm serve` (arg_utils.py:2733)
  # vllm-tt-plugin branch pd-disagg (superset of the DFlash2 package's 7ddf2c8): PD connector + FabricSocketTransport + launch
  # layer + the TT_SERVE_LAUNCHER dispatch / pd_container supervisor (adc415b, 802 tests). Pinned to the pushed commit.
  plugin: {repo: https://github.com/changh95/vllm-tt-plugin, ref: adc415b69a91704a8943fed65c35cfcf2b348adf}
  extra_models_dir: models/demos/blackhole/qwen36/vllm_bundle    # main_class Qwen36DFlashForCausalLM (tp2-dflash2); the plain
                                                               # profiles select Qwen36ForCausalLM via TT_MODEL_CLASS_OVERRIDES

serve:                                   # common to every profile; a profile's env MERGES over this (it cannot unset a key)
  hardware: p150x2
  mesh_device: P150x2
  port: 8000                             # bare `docker run` default only; `tt-model serve` publishes 20000+
  block_size: 64
  capabilities:
    tool_parser: qwen3_coder
    reasoning_parser: qwen3
  additional_config:
    tt:
      l1_small_size: 24576               # no sample_on_device_mode here: tp2 / p1d1 sample on the host (see header)
  env:
    ARCH_NAME: blackhole
    TT_QWEN35_TEXT_VER: qwen36_blackhole
    QWEN36_SKIP_VISION: "1"
    QWEN_SDPA_BF8: "1"                   # bf8 paged KV on every profile = every validated run (pd_container passes it to both ranks)
    VLLM_RPC_TIMEOUT: "900000"
    VLLM_CONFIGURE_LOGGING: "1"
    TORCHDYNAMO_DISABLE: "1"
    HF_HUB_OFFLINE: "1"

serve_profiles:
  - name: tp2
    description: Plain TP=2 decode over both chips, up to 32 concurrent users, full sampling support, 64K context.
    max_model_len: 65536                  # = CTX of every TP=2 artifact (boot, stress, determinism, identity, the benchmark grid)
    max_num_seqs: 32
    additional_config:
      tt:
        fabric_config: FABRIC_1D
        trace_region_size: 1073741824
    args:
      - [--max-num-batched-tokens, "65536"]
    env:
      MESH_DEVICE: P150x2
      TT_MESH_GRAPH_DESC_PATH: /opt/tt-metal/tt_metal/fabric/mesh_graph_descriptors/p150_x2_mesh_graph_descriptor.textproto
      # The plugin registers the checkpoint arch under its TT-prefixed name (platform.py: "TT" + arch, the bundle too), so the
      # override MUST be keyed on TTQwen3_5ForConditionalGeneration to beat the bundle's DFlash main_class; the raw arch is kept
      # for the plain lookup path. (Keyed on the raw arch alone, the container resolved Qwen36DFlashForCausalLM: boot 1 of step 3.)
      TT_MODEL_CLASS_OVERRIDES: "TTQwen3_5ForConditionalGeneration=models.demos.blackhole.qwen36.tt.qwen36_vllm:Qwen36ForCausalLM,Qwen3_5ForConditionalGeneration=models.demos.blackhole.qwen36.tt.qwen36_vllm:Qwen36ForCausalLM"
      QWEN36_MTP: "0"                     # explicit: the plain class must not load the MTP drafter head / its paged KV cache
      QWEN36_MAX_TOKENS_ALL_USERS: "622592"   # bf8 KV pool (9,760 blocks -> vLLM reports 624,640 tokens): 2.76 GiB/die free after the
                                              # prefill warmup; 786,432 OOMs in the chunk-prefill warmup; 64k prefill + 32-user burst pass
      TT_CACHE_PATH: /cache/tensors-tp2   # converted weights persist under BOTH consumer versions (docker: last --env wins)

  - name: p1d1
    description: Prefill on chip 0, decode on chip 1 (TP=1 each), KV handed over the ethernet fabric; up to 8 concurrent decodes, 64K context.
    max_model_len: 65536                  # = CTX of the validated Phase 3 pair
    max_num_seqs: 8                       # = D_CONC (decode-node concurrency)
    additional_config:
      tt:
        trace_region_size: 536870912      # no fabric_config: the ranks set FABRIC_2D themselves (pd_fabric_rank open_mesh_device)
    args:
      - [--max-num-batched-tokens, "65536"]
      - --no-enable-prefix-caching
      - --no-async-scheduling
    env:
      TT_SERVE_LAUNCHER: pd_container      # the plugin's general-plugin hook execs the PD supervisor (MANIFEST_DESIGN.md 2.2)
      MESH_DEVICE: P150                    # per rank (1,1); the rank binding sets TT_VISIBLE_DEVICES / TT_MESH_ID
      # The plugin registers the checkpoint arch under its TT-prefixed name (platform.py: "TT" + arch, the bundle too), so the
      # override MUST be keyed on TTQwen3_5ForConditionalGeneration to beat the bundle's DFlash main_class; the raw arch is kept
      # for the plain lookup path. (Keyed on the raw arch alone, the container resolved Qwen36DFlashForCausalLM: boot 1 of step 3.)
      TT_MODEL_CLASS_OVERRIDES: "TTQwen3_5ForConditionalGeneration=models.demos.blackhole.qwen36.tt.qwen36_vllm:Qwen36ForCausalLM,Qwen3_5ForConditionalGeneration=models.demos.blackhole.qwen36.tt.qwen36_vllm:Qwen36ForCausalLM"
      QWEN36_FORCE_TP_PATH: "1"
      QWEN36_PREFILL_BUCKET_TRACE: "1"     # required by the KV connector (platform.py:743)
      QWEN36_MTP: "0"                      # no speculation on either node (spec must be off on the PD decode node)
      QWEN36_MAX_TOKENS_ALL_USERS: "163840"   # = the decode pool
      TT_PD_CHIPS: "0,1"                   # p150x2: card A / card B (dev P300x2 box: "0,3" with TT_PD_BOARD=p300x2)
      TT_PD_CONNS: "2"                     # = trained eth links between the cards (1 or 2); the two-mesh MGD channel count must match
      TT_PD_P_POOL: "65536"
      TT_PD_D_POOL: "163840"
      TT_PD_EXPORT_SLOTS: "1"              # one full-length export slot (2.125 GiB of P DRAM at CTX 65536, bf8) = every validated run
      TT_PD_LEASE: "30"
      TT_PD_FABRIC_CLAIM_LEASE_S: "0"      # 0 = 3 x LEASE = 90 s claim lease (claim-gated sends)
      TT_PD_TAG: ttm
      TT_CACHE_PATH: /cache/tensors-tp1
      TT_METAL_OPERATION_TIMEOUT_SECONDS: "600"

  - name: tp2-dflash2
    description: TP=2 with lossless DFlash2 speculative decoding (single 4x8 bucket, composite GDN verify), 1-4 concurrent users, greedy output, 64K context.
    max_model_len: 65536
    max_num_seqs: 4                       # gdn_spec_step / fused_recurrent core budget at Nv=24 -> B <= 4
    additional_config:
      tt:
        fabric_config: FABRIC_1D
        trace_region_size: 1073741824
        sample_on_device_mode: decode_only   # REQUIRED by the plugin's block-output contract (all | decode_only); the DFlash class
                                             # accepts it at TP=2 when speculation is on (decode tokens = its greedy speculative outputs)
    args:
      - [--max-num-batched-tokens, "65536"]
      - --no-async-scheduling
    env:
      MESH_DEVICE: P150x2
      TT_MESH_GRAPH_DESC_PATH: /opt/tt-metal/tt_metal/fabric/mesh_graph_descriptors/p150_x2_mesh_graph_descriptor.textproto
      QWEN36_DRAFTER: dflash2
      QWEN36_DFLASH_TP: "1"                # the TP drafter (the class default; the replicated oracle is test-only)
      QWEN36_GDN_SPEC_FUSED: "0"           # composite verify: the fused gdn_spec_step needs 2*Nv <= 32 (Nv=24 at TP=2)
      QWEN36_DFLASH_BLOCK: "8"
      QWEN36_DFLASH_FOLD_SEED: "1"
      QWEN36_DFLASH_SERVE_BLOCK: "32"
      QWEN36_PREFILL_BUCKET_TRACE: "0"     # the class forces it off anyway (eager masked prefill); explicit so the env is self-describing
      # The drafter is a second checkpoint the single `weights` pointer cannot carry: resolved from the HF cache mounted at /hf, so
      # run `hf download incoai/Qwen3.8-27B-DFlash2 --revision dedf8df68adfb1afeaf7b7480c0a0243108177b4` once before `tt-model serve`.
      # (The validated run used a local copy of exactly this snapshot: model.safetensors sha256 67fc76d6...)
      DFLASH_WEIGHTS: incoai/Qwen3.8-27B-DFlash2@dedf8df68adfb1afeaf7b7480c0a0243108177b4
      QWEN36_MAX_TOKENS_ALL_USERS: "262144"   # 6.05 GiB/die free after warmup with the drafter + verify buffers resident
      TT_CACHE_PATH: /cache/tensors-tp2
default_profile: tp2

verify:
  - "from models.demos.blackhole.qwen36.tt.qwen36_vllm import Qwen36ForCausalLM; assert Qwen36ForCausalLM"
  - "from models.demos.blackhole.qwen36.tt.kv_transfer import Qwen36KVTransfer; assert Qwen36KVTransfer"
  - "import vllm_tt_plugin.kv_transfer.tt_connector, vllm_tt_plugin.kv_transfer.pd_proxy, vllm_tt_plugin.kv_transfer.launch.pd_fabric_rank, vllm_tt_plugin.kv_transfer.launch.pd_container, vllm_tt_plugin.kv_transfer.launch.dispatch"
  - "import importlib.metadata as m; eps = {e.name for e in m.entry_points(group='vllm.general_plugins')}; assert 'tt_serve_launcher' in eps, eps"
  - "import importlib.resources as r; assert r.files('vllm_tt_plugin.kv_transfer.launch').joinpath('data/pd_two_p150_mesh_graph_descriptor.textproto').is_file()"
  - "import importlib; importlib.import_module('ttnn.distributed.ttrun')"
  - "from pathlib import Path; assert Path('/opt/openmpi-v5.0.7-ulfm/bin/mpirun').is_file()"
  - "from pathlib import Path; assert Path('/opt/tt-metal/tt_metal/fabric/mesh_graph_descriptors/p150_x2_mesh_graph_descriptor.textproto').is_file()"
  - "import os, subprocess, sys; os.environ.update(TT_PD_CHIPS='0,1', TT_METAL_CACHE='/tmp/c', TT_CACHE_PATH='/tmp/t'); subprocess.run([sys.executable, '-m', 'vllm_tt_plugin.kv_transfer.launch.pd_container', 'Qwen/Qwen3.8-27B', '--max-model-len', '65536', '--max-num-seqs', '8', '--block-size', '64', '--port', '20000', '--dry-run'], check=True)"
  - "import os; os.environ['QWEN36_DRAFTER']='dflash2'; from models.demos.blackhole.qwen36.tt.qwen36_vllm_dflash import Qwen36DFlashForCausalLM as C; assert C.model_capabilities['tt_adaptive_block_batched']"
  - "import json; m=json.load(open('/opt/tt-metal/models/demos/blackhole/qwen36/vllm_bundle/qwen36/vllm_metadata.json')); assert m['main_class'].endswith(':Qwen36DFlashForCausalLM'), m"
  - "import vllm.model_executor.models.qwen3_5; import transformers.models.qwen3_5"
  - "from pathlib import Path; assert Path('/opt/tt-metal/models/model_trace_region_sizes.yaml').is_file()"

# Rendered by profiles/p150x2/build_cards_p150x2.py render <this file> from profiles/p150x2/CARD_DRAFT.md once the lane
# benchmarks land; the text below is the pre-benchmark draft (placeholders in {{...}}).
card:
  description: |
    [Qwen/Qwen3.8-27B](https://huggingface.co/Qwen/Qwen3.8-27B) served on two Tenstorrent p150a cards linked by ethernet (2 Blackhole chips) through vLLM. One image, three ways to use the two chips: `tp2` (tensor parallel over both chips: 17 tok/s per user, 193 tok/s aggregate at 32 users, full sampling), `p1d1` (one chip prefills, the other decodes — prefill/decode disaggregation over the chip-to-chip fabric, up to 8 users, decode speed independent of arriving prompts) and `tp2-dflash2` (TP=2 with lossless [DFlash2](https://huggingface.co/incoai/Qwen3.8-27B-DFlash2) speculative decoding: 24-36 tok/s per user on prompts up to 2k tokens, 52 tok/s on code, 1-4 greedy users). Siblings for a P300x2 box: [changh95/qwen3.8-27b-p300x2](https://huggingface.co/changh95/qwen3.8-27b-p300x2) (plain, up to 32 users) and [changh95/qwen3.8-27b-dflash2-p300x2](https://huggingface.co/changh95/qwen3.8-27b-dflash2-p300x2) (DFlash2, 1-8 users).
  quickstart: |
    ### How to query

    OpenAI-compatible API on port 20000, model id `Qwen/Qwen3.8-27B`:

    ```bash
    curl -s http://localhost:20000/v1/chat/completions \
      -H 'Content-Type: application/json' \
      -d '{"model": "Qwen/Qwen3.8-27B", "messages": [{"role": "user", "content": "Explain KV caching in two sentences."}], "max_tokens": 256, "temperature": 0.7}'
    ```

    * Streaming (`"stream": true`), tool calls (`qwen3_coder` parser) and reasoning content (`qwen3` parser) work as in vLLM; `"chat_template_kwargs": {"enable_thinking": false}` turns thinking off.
    * `p1d1` answers on the same port through its built-in proxy.

    ### Profiles

    ```bash
    tt-model serve changh95/qwen3.8-27b-p150x2                        # default: tp2
    tt-model serve changh95/qwen3.8-27b-p150x2 --profile p1d1
    tt-model serve changh95/qwen3.8-27b-p150x2 --profile tp2-dflash2
    tt-model profiles changh95/qwen3.8-27b-p150x2                     # list them
    ```

    * `tp2` — both chips as one tensor-parallel mesh: 64K context, 622K-token KV pool (bf8), up to 32 users, every vLLM sampling feature (temperature, top-p/top-k, penalties, structured outputs, streaming).
    * `p1d1` — chip 0 prefills, chip 1 decodes (TP=1 each); each request's KV cache crosses the ethernet fabric once. A new prompt never pauses the running decodes. 64K context, 164K-token decode pool, up to 8 users, full sampling.
    * `tp2-dflash2` — TP=2 with the DFlash2 drafter (single 4x8 verify bucket, 7 drafts per step): greedy output, 1-4 users, best on code and below ~8k-token prompts. Drafter weights once, before the first `serve`: `hf download incoai/Qwen3.8-27B-DFlash2 --revision dedf8df68adfb1afeaf7b7480c0a0243108177b4`.

    ### At a glance

    * Model: [Qwen/Qwen3.8-27B](https://huggingface.co/Qwen/Qwen3.8-27B) (hybrid Gated-DeltaNet + gated attention, 27B dense, reasoning) at revision `1d4bf0f2ff6012fd82039f2fa52739d0dd7c60c0`; bfp8 weights, bf16 activations, bf8 paged KV cache (64-token blocks).
    * Hardware: 2× p150a (32 GB each) linked by ethernet, `/dev/tenstorrent/0` and `/1`, 2 × 1 GiB hugepages; the box needs Docker and the Tenstorrent driver only.
    * `tp2`: 17.1 t/s/u at one user (TPOT 57 ms), 193 t/s at 32 users (128/128); TTFT 0.3 s / 1.9 s / 8.2 s at 128 / 8k / 32k prompt tokens, one user.
    * `p1d1`: 10.2 t/s/u at one user (TPOT 95 ms), 56 t/s at 8 users (128/128); TTFT 0.5 s / 6.5 s / 26 s at 128 / 8k / 32k, one user; TPOT stays at 95-136 ms whatever the prompt mix.
    * `tp2-dflash2`: 26.1 t/s/u at one user on 128-token prompts (1.5× `tp2`), 35-38 t/s/u on 1k-token answers (2.0-2.2×), 52 t/s per user on code (3.7×); lossless greedy output.
    * Source: tt-metal branch `qwen36-p150x2` (PD disaggregation + DFlash2 serving at TP=2), vllm-tt-plugin branch `pd-disagg` (PD connector, fabric transport, container launcher); packaged with tt-model-manager (schema 5.1).

    ### When to choose `p1d1` vs `tp2`

    * `tp2` is the default for a reason: 17 t/s per user against 10 on `p1d1` (decode runs on two chips instead of one), a 3.8× larger KV pool (622K vs 164K tokens), 32 users instead of 8, TTFT 0.3 / 1.9 / 8.2 s at 128 / 8k / 32k tokens (one user), 193 t/s at 32 users. Its cost is shared: every prefill pauses every decode on the mesh, so at 8 users TPOT rises from 69 ms (128-token prompts) to 285 ms (32k prompts), and at 32 users TTFT is 10-71 s.
    * `p1d1` isolates decode from prefill: the decode chip's TPOT stays at 95-136 ms at 1-8 users across the whole grid (128 to 32k prompt tokens) while `tp2` at 8 users goes to 146-285 ms at 16k-32k. Prompts queue on the prefill chip (one at a time), so its TTFT is 0.5 / 6.5 / 26 s at 128 / 8k / 32k for one user and grows about linearly with users; each request also pays one KV handoff over the fabric (on the same chip pair, Phase-3 measurements: 123-128 ms at ≤ 2k tokens, 156 / 210 / 305 / 523 ms at 4k / 8k / 16k / 32k) and, at ≥ 2 users, may wait for the producer's next pump before its export is claimed (claim-gated sends, 90 s lease).
    * Rule of thumb: raw speed, long contexts, more than 8 users or the largest KV pool → `tp2`; steady per-token latency for a few interactive users while long prompts keep arriving → `p1d1`; 1-4 greedy users on code or short prompts → `tp2-dflash2`.

    ## Benchmarks

    * Method: tt-inference-server `--workflow benchmarks` grid, i.e. `vllm bench serve --backend openai-chat --dataset-name random` with streaming, prompts of exactly ISL random tokens (`truncate_prompt_tokens` = ISL) and OSL output tokens per request (every request produced exactly OSL tokens; no request stopped early). The harness passed neither `--ignore-eos` nor `--temperature`, so the servers applied the checkpoint's `generation_config.json` (temperature 1.0, top-k 20, top-p 0.95); on `tp2-dflash2` the output is the target model's greedy trajectory regardless. Each grid point runs 1 user and then the run's maximum (fewer where the KV pool does not seat that many prompts of that length); the 2/4/8/16/32-user columns come from separate runs of the same grid, the 1-user rows from the last run (run-to-run TTFT spread about ±5%).
    * `t/s` = aggregate output tokens per second; `t/s/u` = tokens per second per user (= OSL / mean end-to-end latency); TTFT = mean time to first token; TPOT = mean time per output token.
    * Code: tt-inference-server `--spec-decode` (aiperf, SPEED-Bench `coding`, 80 prompts, `enable_thinking: false`, answers end at EOS, same server-default sampling), one user, `tp2-dflash2` and `tp2` on the same box back to back.
    * All numbers were measured on the development box described under "Validation and caveats", not on a p150a pair.

    #### `tp2` (default): throughput by concurrent users, t/s (t/s/u)

    | ISL / OSL | 1 user | 2 users | 4 users | 8 users | 16 users | 32 users |
    |---|---|---|---|---|---|---|
    | 128 / 128 | 17 (17.1) | 29 (14.7) | 54 (13.4) | 92 (11.4) | 143 (9.0) | 193 (6.0) |
    | 1,024 / 128 | 17 (16.7) | 28 (14.1) | 50 (12.6) | 83 (10.4) | 123 (7.7) | 156 (4.9) |
    | 2,048 / 128 | 16 (16.3) | 27 (13.7) | 48 (11.9) | 75 (9.3) | 107 (6.7) | 131 (4.1) |
    | 4,096 / 128 | 15 (15.4) | 25 (12.4) | 41 (10.2) | 59 (7.4) | 78 (4.9) | 90 (2.8) |
    | 8,192 / 128 | 14 (13.9) | 21 (10.5) | 31 (7.8) | 41 (5.1) | 50 (3.1) | 54 (1.7) |
    | 16,384 / 128 | 11 (11.4) | 16 (7.9) | 21 (5.2) | 25 (3.1) | 28 (1.8) | 29 (0.9) |
    | 32,768 / 128 | 8 (8.2) | 10 (5.0) | 12 (3.0) | 13 (1.7) | 14 (0.9) | 14 (0.8) @18 |
    | 128 / 1,024 | 18 (17.6) | 33 (16.6) | 65 (16.1) | 123 (15.4) | 218 (13.6) | 361 (11.3) |
    | 8,192 / 1,024 | 17 (16.9) | 31 (15.6) | 57 (14.3) | 98 (12.2) | 153 (9.6) | 210 (6.6) |
    | 10,000 / 1,024 | 17 (16.8) | 30 (15.2) | 55 (13.7) | 93 (11.6) | 141 (8.8) | 187 (5.8) |

    * `@N`: the KV pool seats only N prompts of that length, so the workflow ran the point at N users.

    #### `tp2`: mean TTFT ms / mean TPOT ms

    | ISL / OSL | 1 user | 8 users | 32 users |
    |---|---|---|---|
    | 128 / 128 | 316 / 56.6 | 2,394 / 69.2 | 10,226 / 87.0 |
    | 1,024 / 128 | 464 / 56.8 | 3,409 / 70.4 | 14,847 / 90.5 |
    | 2,048 / 128 | 610 / 56.9 | 4,518 / 72.4 | 19,498 / 92.9 |
    | 4,096 / 128 | 1,046 / 57.1 | 7,664 / 76.1 | 25,212 / 160.5 |
    | 8,192 / 128 | 1,941 / 57.3 | 14,217 / 83.9 | 39,474 / 285.3 |
    | 16,384 / 128 | 3,867 / 57.6 | 22,316 / 146.3 | 71,113 / 547.0 |
    | 32,768 / 128 | 8,243 / 58.4 | 40,999 / 284.9 | – |

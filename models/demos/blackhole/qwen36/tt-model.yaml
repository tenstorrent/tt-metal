    | 2,048 / 128 | 41.0 [319] | 30.8 [256] |
    | 4,096 / 128 | 37.8 [611] | 28.8 [511] |
    | 8,192 / 128 | 32.6 [1,209] | 25.8 [1,017] |
    | 16,384 / 128 | 24.3 [2,457] | 21.1 [2,095] |
    | 128 / 1,024 | 44.8 [148] | 32.6 [97] |

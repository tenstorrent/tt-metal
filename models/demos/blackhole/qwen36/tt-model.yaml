# tt-model.yaml — Qwen/Qwen3.8-27B on a P300x2 (2x P300 boards = 4 Blackhole chips, (1,4) mesh) via vLLM,
# serving WITH the DFlash2 block-diffusion speculative-decode drafter (models/demos/blackhole/qwen36/tt/dflash2*.py,
# qwen36_vllm_dflash.py) through the Tenstorrent vLLM plugin's adaptive block-output contract. Two serve
# profiles: `single-user-dflash2` (default: one request at a time, lossless speculative decoding) and `batch32`
# (plain decode, up to 32 concurrent users).
#
#   tt-model package --container models/demos/blackhole/qwen36/tt-model.yaml --out <builds>
#   tt-model serve   <builds>/qwen3.8-27b-dflash2-p300x2/tt_kernel_manifest.json
#   tt-model push    <builds>/qwen3.8-27b-dflash2-p300x2 --private
schema: "5.1"
repo: changh95/qwen3.8-27b-dflash2-p300x2
name: qwen3.8-27b-dflash2-p300x2
weights:
  repo: Qwen/Qwen3.8-27B
  revision: 1d4bf0f2ff6012fd82039f2fa52739d0dd7c60c0   # refs/main as validated, 2026-09-12
kind: vllm-plugin
arch: blackhole

source:
  tt_metal: /home/ttuser/experiments/qwen36_27b/tt-metal      # branch qwen36-prefill-opt-dflash
  code:                                                        # import closure of qwen36_vllm.py + the demo/spec-decode path
    - models/common
    - models/tt_transformers
    - models/demos/blackhole/qwen36                            # model, DFlash drafters, demo, tests, vllm_bundle
    - models/demos/qwen3_vl/tt/common.py
    - models/demos/utils
    - models/experimental/gated_attention_gated_deltanet
    - models/perf
    - models/tt_dit/utils/tensor.py
    - models/model_trace_region_sizes.yaml
    - models/model_targets.yaml
  ubuntu: "22.04"
  python: "3.12"

runtime:
  vllm: {version: "0.26.0"}                                    # the validated serving venv: vllm 0.26.0 (empty target)
  # plugin main bef89e4 + arg/gemma4_spec_serving (adaptive block-output, TT_MODEL_CLASS_OVERRIDES) + the
  # block-output KV-lookahead capability the DFlash2 serving class needs, plus keeping the request's sampling
  # controls / rejecting multimodal prompts on the adaptive profile (branch dflash2-spec-decode).
  plugin: {repo: https://github.com/changh95/vllm-tt-plugin, ref: 751ec33573aa30be03f8a9bda8d36a3cd3259158}
  extra_models_dir: models/demos/blackhole/qwen36/vllm_bundle  # same adapter the plugin registers built-in

serve:
  hardware: p300x2
  mesh_device: P150x4          # tt-metal's name for the (1,4) Blackhole mesh a P300x2 opens
  port: 8000
  max_model_len: 262144
  max_num_seqs: 32             # overridden per profile below (1 = speculative, 32 = batched plain decode)
  block_size: 64
  capabilities:
    tool_parser: qwen3_coder
    reasoning_parser: qwen3
  additional_config:
    tt:
      fabric_config: FABRIC_1D
      trace_region_size: 1073741824
      l1_small_size: 24576
      sample_on_device_mode: decode_only
  env:
    ARCH_NAME: blackhole
    TT_QWEN35_TEXT_VER: qwen36_blackhole
    TT_MESH_GRAPH_DESC_PATH: /opt/tt-metal/tt_metal/fabric/mesh_graph_descriptors/p300_x2_mesh_graph_descriptor.textproto
    QWEN36_MAX_TOKENS_ALL_USERS: "525312"
    VLLM_RPC_TIMEOUT: "900000"
    VLLM_CONFIGURE_LOGGING: "1"
    TORCHDYNAMO_DISABLE: "1"
    HF_HUB_OFFLINE: "1"
    # DFlash2 speculative decoding (incoai/Qwen3.8-27B-DFlash2, block 8 -> 7 drafts per verify, lossless greedy).
    # The drafter is a second checkpoint the single `weights` pointer cannot carry: it is resolved from the HF cache
    # mounted at /hf, so run `hf download incoai/Qwen3.8-27B-DFlash2 --revision dedf8df68adfb1afeaf7b7480c0a0243108177b4`
    # once before `tt-model serve` (quickstart below). QWEN36_DRAFTER=mtp turns speculation off (batch32 profile).
    DFLASH_WEIGHTS: incoai/Qwen3.8-27B-DFlash2@dedf8df68adfb1afeaf7b7480c0a0243108177b4
    QWEN36_DFLASH_BLOCK: "8"
    QWEN36_DFLASH_MAX_PROMPT: "2048"     # prompts up to this take the single masked-bucket prefill; longer ones the
                                         # eager chunked spec prefill. EVERY text prompt speculates.
    QWEN36_DFLASH_SERVE_BLOCK: "32"      # tokens committed per vLLM step on a speculative request
  args:
    - [--max-num-batched-tokens, "262144"]

serve_profiles:
  - name: single-user-dflash2
    description: One request at a time with lossless DFlash2 speculative decoding (block-output serving).
    max_num_seqs: 1
    env:
      QWEN36_DRAFTER: dflash2
    args:
      - [--max-num-batched-tokens, "262144"]
      - --no-async-scheduling           # the plugin's block-output contract is synchronous
  - name: batch32
    description: Plain decode, up to 32 concurrent users (no speculation).
    max_num_seqs: 32
    env:
      QWEN36_DRAFTER: mtp
default_profile: single-user-dflash2

verify:
  - "from models.demos.blackhole.qwen36.tt.qwen36_vllm import Qwen36ForCausalLM; assert Qwen36ForCausalLM"
  - "import os; os.environ['QWEN36_DRAFTER']='dflash2'; from models.demos.blackhole.qwen36.tt.qwen36_vllm_dflash import Qwen36DFlashForCausalLM as C; assert C.model_capabilities['tt_adaptive_block_output'] and C.model_capabilities['output_tokens_per_step'] == 32, C.model_capabilities"
  - "from models.demos.blackhole.qwen36.tt.dflash2_serving import DFlash2ServingDecoder; assert DFlash2ServingDecoder"
  - "import json; m=json.load(open('/opt/tt-metal/models/demos/blackhole/qwen36/vllm_bundle/qwen36/vllm_metadata.json')); assert m['main_class'].endswith(':Qwen36DFlashForCausalLM'), m"
  - "from vllm_tt_plugin.config import get_tt_block_output_kv_lookahead_tokens, is_tt_adaptive_block_output_model"
  - "from models.demos.blackhole.qwen36.tt.dflash2_decode import DFlash2Decoder; from models.demos.blackhole.qwen36.tt.dflash2_tp import DFlash2DrafterTP; assert DFlash2Decoder and DFlash2DrafterTP"
  - "import vllm.model_executor.models.qwen3_5"
  - "import transformers.models.qwen3_5"
  - "from pathlib import Path; assert Path('/opt/tt-metal/tt_metal/fabric/mesh_graph_descriptors/p300_x2_mesh_graph_descriptor.textproto').is_file()"
  - "from pathlib import Path; assert Path('/opt/tt-metal/models/model_trace_region_sizes.yaml').is_file()"
  - "from pathlib import Path; assert Path('/opt/tt-metal/models/demos/blackhole/qwen36/vllm_bundle/qwen36/vllm_metadata.json').is_file()"

card:
  description: >
    Qwen3.8-27B (hybrid Gated-DeltaNet + gated-attention dense 27B, reasoning model, 256K context) served on
    two Tenstorrent P300 boards (4 Blackhole chips, 4-way tensor parallel) through vLLM. The default profile
    serves one request at a time WITH DFlash2 block-diffusion speculative decoding (drafter
    incoai/Qwen3.8-27B-DFlash2, 7 drafts verified per step, greedy, model-internal through the Tenstorrent
    vLLM plugin's block-output contract): 41-84 tok/s on chat requests (mean 56 over 7 prompts; prose ~45,
    code ~80) vs 32.6 tok/s for plain decode on the same box, TTFT 0.18 s vs 0.11 s at ~75-token prompts.
    The `batch32` profile is the plain-decode server for up to 32 concurrent users.
  quickstart: |
    ### Profiles

    * `single-user-dflash2` (default): `--max-num-seqs 1`, speculative decoding on EVERY text request (the
      drafter only sees a 2048-token window, so long prompts accept fewer drafts per step but still beat
      plain decode: 58 tok/s at 4k, 43 at 16k in the demo). Output is greedy: the speculative loop
      reproduces the target model's own greedy trajectory (verified token-for-token against plain greedy
      decode on-device; against a plain vLLM server it can diverge where the target's top-2 logits are
      nearly tied, exactly like the demo's spec loop), so `temperature` and friends only affect the first
      token of a response. `logprobs`, structured outputs, `min_p`/`logit_bias` and multimodal prompts are
      rejected or neutralised by the plugin for this profile; long prompts pay an eager (untraced) prefill.
    * `batch32`: `tt-model serve --profile batch32 changh95/qwen3.8-27b-dflash2-p300x2` — plain decode, up to
      32 users, full sampling support.

    ### DFlash2 drafter weights (one extra download)

    This package pins two checkpoints but tt-model downloads only the target. Fetch the drafter into the
    same HF cache before `tt-model serve` (the container mounts it at `/hf`):

    ```bash
    hf download incoai/Qwen3.8-27B-DFlash2 --revision dedf8df68adfb1afeaf7b7480c0a0243108177b4
    ```

    ### Tuning knobs (container env)

    `QWEN36_DFLASH_SERVE_BLOCK` (default 32) = tokens committed per vLLM step (streaming granularity);
    `QWEN36_DFLASH_MAX_PROMPT` (default 2048) = longest prompt that takes the one-shot masked prefill
    (longer prompts take the chunked one; both speculate);
    `QWEN36_DRAFTER=mtp` = speculation off. The same image also contains the single-user demo/benchmark
    (`models/demos/blackhole/qwen36/demo/text_demo.py`, `-k "traced_128 and not traced_128k and not g8"`),
    where DFlash2 reaches 103.7 tok/s on a document continuation vs 94.2 for the built-in MTP drafter.

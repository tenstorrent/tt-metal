# tt-model.yaml — Qwen/Qwen3.8-27B on a P300x2 (2x P300 boards = 4 Blackhole chips, (1,4) mesh) via vLLM,
# PLAIN batched decode (the qwen36-prefill-opt serving branch: prefill optimizations, no speculative decoding),
# up to 32 concurrent users with full sampling support. For faster single/low-batch decode see
# changh95/qwen3.8-27b-dflash2-p300x2 (DFlash2 speculative decoding).
#
#   tt-model package --container models/demos/blackhole/qwen36/tt-model.yaml --out <builds>
#   tt-model serve   <builds>/qwen3.8-27b-p300x2/tt_kernel_manifest.json
#   tt-model push    <builds>/qwen3.8-27b-p300x2 --private
schema: "5.1"
repo: changh95/qwen3.8-27b-p300x2
name: qwen3.8-27b-p300x2
weights:
  repo: Qwen/Qwen3.8-27B
  revision: 1d4bf0f2ff6012fd82039f2fa52739d0dd7c60c0   # refs/main as validated, 2026-09-12
kind: vllm-plugin
arch: blackhole

source:
  tt_metal: /home/ttuser/experiments/qwen36_27b/tt-metal-plain  # branch qwen36-prefill-opt-package (= qwen36-prefill-opt + this manifest)
  code:                                                        # import closure of qwen36_vllm.py + the demo/spec-decode path
    - models/common
    - models/tt_transformers
    - models/demos/blackhole/qwen36                            # model, demo, tests
    - models/demos/qwen3_vl/tt/common.py
    - models/demos/utils
    - models/experimental/gated_attention_gated_deltanet
    - models/perf
    - models/tt_dit/utils/tensor.py
    - models/model_trace_region_sizes.yaml
    - models/model_targets.yaml
  ubuntu: "22.04"
  python: "3.12"

runtime:
  vllm: {version: "0.26.0"}                                    # the validated serving venv: vllm 0.26.0 (empty target)
  # the same plugin build the DFlash2 package validated (fork of tenstorrent/vllm-tt-plugin; the adaptive block-output
  # features it adds are inert for this plain model class)
  plugin: {repo: https://github.com/changh95/vllm-tt-plugin, ref: 751ec33573aa30be03f8a9bda8d36a3cd3259158}

serve:
  hardware: p300x2
  mesh_device: P150x4          # tt-metal's name for the (1,4) Blackhole mesh a P300x2 opens
  port: 8000
  max_model_len: 262144
  max_num_seqs: 32             # overridden per profile below (1 = speculative, 32 = batched plain decode)
  block_size: 64
  capabilities:
    tool_parser: qwen3_coder
    reasoning_parser: qwen3
  additional_config:
    tt:
      fabric_config: FABRIC_1D
      trace_region_size: 1073741824
      l1_small_size: 24576
      sample_on_device_mode: decode_only
  env:
    ARCH_NAME: blackhole
    TT_QWEN35_TEXT_VER: qwen36_blackhole
    TT_MESH_GRAPH_DESC_PATH: /opt/tt-metal/tt_metal/fabric/mesh_graph_descriptors/p300_x2_mesh_graph_descriptor.textproto
    QWEN36_MAX_TOKENS_ALL_USERS: "525312"
    VLLM_RPC_TIMEOUT: "900000"
    VLLM_CONFIGURE_LOGGING: "1"
    TORCHDYNAMO_DISABLE: "1"
    HF_HUB_OFFLINE: "1"
    QWEN36_DRAFTER: mtp                 # demo drafter switch only; the served class never speculates
  args:
    - [--max-num-batched-tokens, "262144"]

serve_profiles:
  - name: batch32
    description: Plain batched decode, up to 32 concurrent users, full sampling support.
    max_num_seqs: 32
    args:
      - [--max-num-batched-tokens, "262144"]
default_profile: batch32

verify:
  - "from models.demos.blackhole.qwen36.tt.qwen36_vllm import Qwen36ForCausalLM; assert Qwen36ForCausalLM"
  - "import vllm.model_executor.models.qwen3_5"
  - "import transformers.models.qwen3_5"
  - "from pathlib import Path; assert Path('/opt/tt-metal/tt_metal/fabric/mesh_graph_descriptors/p300_x2_mesh_graph_descriptor.textproto').is_file()"
  - "from pathlib import Path; assert Path('/opt/tt-metal/models/model_trace_region_sizes.yaml').is_file()"

card:
  description: |
    [Qwen/Qwen3.8-27B](https://huggingface.co/Qwen/Qwen3.8-27B) served on a Tenstorrent P300x2 (2× P300 = 4 Blackhole chips, 4-way tensor parallel) through vLLM with plain batched decode — up to 32 concurrent users, full sampling support, 262K context. If you want a faster decode speed for batch=8 or less, refer to [changh95/qwen3.8-27b-dflash2-p300x2](https://huggingface.co/changh95/qwen3.8-27b-dflash2-p300x2).
  quickstart: |
    ### How to query

    The server speaks the OpenAI API on port 20000 (model id `Qwen/Qwen3.8-27B`):

    ```bash
    curl -s http://localhost:20000/v1/chat/completions \
      -H 'Content-Type: application/json' \
      -d '{"model": "Qwen/Qwen3.8-27B", "messages": [{"role": "user", "content": "Explain KV caching in two sentences."}], "max_tokens": 256, "temperature": 0.7}'
    ```

    Streaming (`"stream": true`), tool calls (`qwen3_coder` parser) and reasoning content (`qwen3` parser) work as in vLLM.

    ### At a glance

    * Model: [Qwen/Qwen3.8-27B](https://huggingface.co/Qwen/Qwen3.8-27B) (hybrid Gated-DeltaNet + gated attention, 27B dense, reasoning, 256K context) at revision `1d4bf0f2ff6012fd82039f2fa52739d0dd7c60c0`.
    * Hardware: P300x2, mesh `P150x4`, tensor parallel over 4 chips; one box serves 1 to 32 users.
    * Decode: ~32 t/s/u at one user, ~490 t/s aggregate at 32 users on short prompts (739 t/s on 1,024-token outputs).
    * Sampling: temperature, top-p/top-k, penalties, structured outputs, streaming — full vLLM support (no speculative decoding on this package).
    * Faster single-user / small-batch decode: [changh95/qwen3.8-27b-dflash2-p300x2](https://huggingface.co/changh95/qwen3.8-27b-dflash2-p300x2) — the same model with DFlash2 speculative decoding, 1.2 to 1.5× the t/s/u at 1 to 4 users (greedy output).
    * Source: tt-metal branch `qwen36-prefill-opt` (prefill optimizations on by default); packaged with tt-model-manager.

    ## Benchmarks

    * Box: one P300x2 (4 Blackhole chips, TP=4), `batch32` profile, plain decode. Client: tt-inference-server's `vllm bench serve` (random prompts of exactly ISL tokens, `ignore_eos`, temperature 0, streaming), measured 2026-09-13.
    * `t/s` = aggregate output tokens per second; `t/s/u` = tokens per second per user (= OSL / mean end-to-end latency); TTFT = mean time to first token.
    * Decode is weight-bandwidth-bound: one user sees ~32 t/s/u and the aggregate scales almost linearly to 32 users.


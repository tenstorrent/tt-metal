    ### Validation and caveats

    * What ran: the tt-inference-server `--workflow benchmarks` grid above for all three profiles (`tp2` 1/2/4/8/16/32 users, `p1d1` 1/2/4/8, `tp2-dflash2` 1) plus the SPEED-Bench coding run; `tp2`: 64k-token and 32k-token prefills (identical outputs on repeat), a 64-prompt burst at 32 users, an 8× determinism probe at six prompt lengths on two boots (identical), 8/8 prompts identical sequential vs concurrent; `p1d1`: two container up/down cycles (one READY line each, clean teardown in 29 s), 6/6 prompts identical to the standalone PD pair; `tp2-dflash2`: the lossless and serving device tests, and 8 chat prompts × 96 tokens checked token-by-token against `tp2` at 1 and 4 users (733 positions: 0 confident mismatches, 6 near-tie flips where `tp2`'s own top-2 logit gap was < 2.0, identical trajectories at 1 and 4 users).
    * Where it ran: a P300x2 development box emulating the p150x2 — two dies on different cards form the 2-chip mesh / the PD pair over a 2-channel inter-card ethernet link (`channels {count 2 RELAXED}`). A real p150a pair (4 or 8 trained channels, `/dev/tenstorrent/0,1`) is untested: the image ships the stock `p150_x2` descriptor for `tp2` / `tp2-dflash2` and a 2-channel two-mesh descriptor for `p1d1` (`TT_PD_CONNS=2`; set `TT_PD_CONNS=1` if only one link trains). Reports were filed under the harness's `P300` / `P300x2` device labels (it has no p150x2 entry; the grid is device-independent).
    * MTP (the checkpoint's multi-token-prediction head) is OFF in `tp2` and `p1d1` (`QWEN36_MTP=0`): the plain profiles load neither its weights nor its extra paged KV cache. Speculative decoding exists only in `tp2-dflash2`.
    * `tp2-dflash2` is the TP=2 fallback path of the DFlash2 serving code: composite Gated-DeltaNet verify and per-row verify attention (the fused kernels need one KV head per device), a single 4x8 bucket, at most 4 users, `sample_on_device_mode: decode_only` (its decode tokens are the drafter/verify's own greedy outputs; prefill anchors are host-sampled). Use it for 1-4 users and prompts up to ~8k tokens; above that it is no faster than `tp2`. Lossless means the target model's greedy trajectory up to bf16 near-ties: outputs may differ from `tp2` after a near-tied token, and each profile is exact against its own greedy target — never "identical text". `temperature` / `top_p` affect only the anchor token; no `logprobs`, structured outputs or images on this profile.
    * `p1d1`: one KV handoff per request on top of the prefill, claim-gated sends at ≥ 2 users (a request may wait for the producer's next pump; lease 90 s), prefix caching and async scheduling disabled (required by the KV connector); if the decode node loses an export it recomputes the prefill locally. It runs several processes inside one container (supervisor + proxy, two vLLM front-ends, two engine ranks under `tt-run`/`mpirun`); `docker stop` tears them down in order within 120 s. Child logs live under the package cache (`/cache/pd-launch/<tag>/`).
    * Pad-row nondeterminism: the traced masked-bucket prefill writes the pad rows of a padded prompt into a dedicated scratch KV block outside the scheduler's pool, and those bytes are not run-to-run deterministic. No request ever reads that block, `p1d1`'s KV export fills its chunk tails from a persistent zero block instead of it (exported bytes depend on the request alone), and the real rows, logits and GDN state are bit-exact (determinism probes above) — harmless.
    * `tp2` and `p1d1` sample on the host (on-device sampling is certified for 1x4 / 1x8 meshes only); `tp2` keeps every vLLM sampling feature.
    * First boot converts the weights into the package cache (`tensors-tp2` for `tp2` / `tp2-dflash2`, `tensors-tp1` for `p1d1`, one copy per rank); later boots reuse them. Run `tt-model pull --with-weights` first: the container runs with `HF_HUB_OFFLINE=1`.

    | 4,096 / 128 | 511 / 31.0 | 1,622 / 40.0 | 15,409 / 50.0 |
    | 8,192 / 128 | 1,017 / 31.1 | 3,254 / 43.3 | 31,096 / 57.1 |
    | 16,384 / 128 | 2,095 / 31.2 | 6,703 / 50.5 | 47,418 / 253.0 |
    | 128 / 1,024 | 97 / 30.6 | 297 / 33.4 | 2,736 / 40.7 |
    | 1,024 / 1,024 | 185 / 30.8 | 583 / 33.6 | 5,446 / 41.5 |
    | 2,048 / 1,024 | 271 / 30.8 | 831 / 33.8 | 7,839 / 42.3 |

# tt-model-p300x2.yaml — Qwen/Qwen3.8-27B on a P300x2 (2x P300 boards = 4 Blackhole chips, (1,4) mesh) via vLLM, on the
# RESIDENT decode engine (qwen36_resident/: one persistent program per chip per decode step).
# ONE image; the lineup and the default are the user's decision (2026-11-02):
#   single-user          one user, lossless DFlash2 speculative decoding (greedy only), up to 256K context
#   multi-user           DEFAULT: 1-16 users on the rows-mode resident engine (shared 29,440-block KV pool, prefill
#                        gangs + one pipelined PP pass per prefill step, device sampling); TTFT-first scheduling is an
#                        option of it (prefill_gang_tokens 0)
#   batch                17-32 users on the previous package's ttnn decode path (plain batched decode, full sampling)
# Dropped from the earlier draft: plain single-user, single-user-mtp, multi-user-long (now multi-user's sizing).
# Replaces the ttnn-path manifest of the same repo (branch qwen36-p300x2-pkg, tt-metal b220c901dec, plugin 96d4416,
# image f6edb50771ac: profiles plain / batch8-dflash2 / single-user-dflash2). tt-model.yaml on this branch is the p150x2
# package (changh95/qwen3.8-27b-p150x2) and is untouched.
#
#   tt-model package --container models/demos/blackhole/qwen36/tt-model-p300x2.yaml --out <builds>
#   tt-model serve   <builds>/qwen3.8-27b-p300x2/tt_kernel_manifest.json [--profile single-user]
#   tt-model push    <builds>/qwen3.8-27b-p300x2 --private
#
# OPEN before packaging (search TBD): the plugin ref (resident-mu pushed to the fork), the adapter merge (lane serve's
# qwen38-res-mu-serve package-ready SHA, which must include ae776ee280c: RESIDENT_PREFILL_CHUNKS, without which
# multi-user ignores its chunk list and OOMs at build), the card's benchmark cells.
schema: "5.1"
repo: changh95/qwen3.8-27b-p300x2
name: qwen3.8-27b-p300x2
weights:
  repo: Qwen/Qwen3.8-27B
  revision: 1d4bf0f2ff6012fd82039f2fa52739d0dd7c60c0   # refs/main as validated, 2026-09-12 (every resident lane's runs)
kind: vllm-plugin
arch: blackhole

source:
  # Branch qwen38-resident-package = qwen38-resident (resident engine + multi-user rows + DFlash2 R=8 verify + 2-link
  # hub all-reduce) + lane serve's adapters (TBD merge) + lane sched's qwen38-res-sched (prefill gangs in serve_local,
  # one first-token launch per launch for a gang's prompts, lane prefill's PPPrefill.run_batch + HiFi2 / exp_approx SDPA
  # default merged, the multi pool fix) + this manifest. Build prerequisites in the worktree: submodules
  # initialised (git submodule update --init --recursive) and `runtime` a real directory, not a symlink (the docker
  # build context drops a symlink that points outside it).
  tt_metal: /home/ttuser/experiments/qwen36_27b/tt-metal-res-pkg2
  code:                                # import closure of qwen36_resident.generator_vllm (the adapters) + the DFlash2 drafter
    - qwen36_resident                  # resident engine, kernels, PP prefill, adapters + vllm_models bundle, spec serving
    - models/demos/blackhole/qwen36    # the ttnn DFlash2 drafter (tt/dflash2_tp.py, dflash2.py) and what it imports
    - models/common
    - models/tt_transformers
    - models/demos/qwen3_vl/tt/common.py
    - models/demos/utils
    - models/experimental/gated_attention_gated_deltanet
    - models/perf
    - models/tt_dit/utils/tensor.py
    - models/model_trace_region_sizes.yaml
    - models/model_targets.yaml
  ubuntu: "22.04"
  python: "3.12"

runtime:
  vllm: {version: "0.26.0"}
  # vllm-tt-plugin branch resident-mu = upstream tenstorrent/vllm-tt-plugin da7c018 (== the resident reference plugin) +
  # the TT chunk core the multi-user profile needs: a67c7f3 (aligned, one-long-in-flight chunked prefill), a0ee58a (a
  # split prompt's continuation keeps its state slot), 2c683cd (prefill_total_lens), 5618c8b (a split replay's last
  # one-token chunk is prefill work); then branch resident-mu-sched: a80d7a7 (prefill gangs, prefill_gang_tokens /
  # prefill_gang_idle_tokens), ae93205 (a request with no decode step yet does not cap the next gang), docs; merged with
  # fix-ttft2's resident-mu-ttft2 6641c17 as resident-mu-sched-ttft2 d5e699c (profiles/resident/sched/
  # plugin_ttft2_merge_note.txt), pushed to the fork as branch resident-mu-sched-ttft2. single-user uses upstream paths
  # only (adaptive block output for DFlash2; the chunk core is off at max_num_seqs 1).
  plugin: {repo: https://github.com/changh95/vllm-tt-plugin, ref: d5e699c4dca06b1468e6c0f51bdffbdf67820d95}
  extra_models_dir: qwen36_resident/vllm_models    # main_class qwen36_resident.generator_vllm:Qwen36ResidentForCausalLM

serve:                         # common to every profile; a profile's env MERGES over this (it cannot unset a key)
  hardware: p300x2
  mesh_device: P150x4          # tt-metal's name for the (1,4) Blackhole mesh a P300x2 opens
  port: 8000
  max_model_len: 262144
  max_num_seqs: 1              # overridden by multi-user
  block_size: 64
  capabilities:
    tool_parser: qwen3_coder
    reasoning_parser: qwen3
  additional_config:
    tt:
      fabric_config: FABRIC_1D
      trace_region_size: 134217728     # resident decode trace + PP prefill traces + the DFlash2 drafter's (128 MiB)
      sample_on_device_mode: decode_only
  env:
    ARCH_NAME: blackhole
    MESH_DEVICE: P150x4
    TT_MESH_GRAPH_DESC_PATH: /opt/tt-metal/tt_metal/fabric/mesh_graph_descriptors/p300_x2_mesh_graph_descriptor.textproto
    TT_METAL_PINNED_MEMORY_CACHE_LIMIT_BYTES: "0"   # the pinned host-buffer cache stalls large uploads for 10-40 min
    RESIDENT_ATTN_RR: "1"                # attention KV chunks round-robin over the workers
    RESIDENT_PP_SDPA_FIDELITY: HiFi2     # PP prefill SDPA at HiFi2 ("fast")
    # The hubs' all-reduce uses min(RESIDENT_HUB_LINKS = 2, the links trained per neighbour): a mesh that trains one
    # link per neighbour (other cabling / descriptor) serves on the one-link path (logged at build), no failure.
    VLLM_ENGINE_READY_TIMEOUT_S: "3600"  # the resident model + traces build in ~6 min warm, longer with cold caches
    VLLM_PLUGINS: tt,tt_model_registry
    VLLM_RPC_TIMEOUT: "900000"
    VLLM_CONFIGURE_LOGGING: "1"
    TORCHDYNAMO_DISABLE: "1"
    HF_HUB_OFFLINE: "1"
  args:
    - --async-scheduling

serve_profiles:
  - name: single-user
    description: One request at a time with lossless DFlash2 speculative decoding (greedy only), up to 256K context.
    max_num_seqs: 1
    env:
      TT_MODEL_CLASS_OVERRIDES: "TTQwen3_5ForConditionalGeneration=qwen36_resident.generator_vllm:Qwen36ResidentDFlashForCausalLM"
      # The drafter (incoai/Qwen3.8-27B-DFlash2, block 8 -> 7 drafts per verify) is a second checkpoint the single
      # `weights` pointer cannot carry: resolved by repo id AT A PINNED COMMIT from the HF cache mounted at /hf (offline:
      # its cache has no refs/main). `hf download incoai/Qwen3.8-27B-DFlash2 --revision dedf8df68a...` once before
      # `tt-model serve` (quickstart). Also the code default (qwen36_resident.dflash.DRAFTER_WEIGHTS).
      DFLASH_WEIGHTS: incoai/Qwen3.8-27B-DFlash2@dedf8df68adfb1afeaf7b7480c0a0243108177b4
  - name: multi-user
    description: 1-16 concurrent requests on the rows-mode resident engine (one KV pool shared by the users, device sampling, full sampling controls); waiting prompts prefill together before their decodes start, so each user decodes at the decode-step speed. TTFT-first scheduling is an option (prefill_gang_tokens 0).
    max_num_seqs: 16                     # two launches of 8
    env:
      # KV pool = 29,440 blocks x 64 (the former multi-user-long sizing; lane serve 0dea74b8748: 30,016 + the plugin's
      # 16 reservation blocks OOMs at build; 29,440 passed the card churn, queue_wp8_r3, and with PPPrefill.run_batch's
      # staging a 250K-token prompt, lane sched rb1). No 128-token PP chunk: the prefill drops its 128-chunk SmallMatmul
      # weight copies (3.24 GB/chip) for the pool; +49 ms TTFT at <= 128-token prompts, +20 ms at 512, none from ~768
      # tokens (HF accuracy within noise, 32K bit-identical; needs RESIDENT_PREFILL_CHUNKS in the adapter, ae776ee280c).
      RESIDENT_MAX_TOKENS_ALL_USERS: "1884160"
      RESIDENT_PREFILL_CHUNKS: "256,512,1024"
      # the rows build's core split (lane mu, accuracy-gated; needs the GDN head collector fix c6436ac2bfc): 28 attention
      # workers, 4 GDN head groups; 8 users -8.6 % step time at <= 4K, -5.8 % at 32K, +2.5 % at 128K. The single-user
      # profiles keep the defaults (32 workers).
      RESIDENT_ATTN_WORKERS: "28"
      RESIDENT_HEAD_GROUPS: "4"
    additional_config:
      tt:                                # deep-merged over serve.additional_config.tt
        prefill_chunk_tokens: 1024       # the TT chunk core: a prompt over the gang cap splits into 1024-token spans
        # Prefill gangs (lane sched): the waiting prompts prefill whole, in one step (one pipelined PP pass,
        # PPPrefill.run_batch), before their decodes start, so a burst is one wave (c=16, 2K-16K prompts: TPOT at the
        # decode step, TTFT 1.4-2.0x the interleaved policy's); a prompt arriving while others decode runs whole
        # up to 2048 tokens, longer ones split between decode steps. 0 = the interleaved (TTFT-first) policy.
        prefill_gang_tokens: 2048
        sample_on_device_mode: decode_only   # the rows-mode hub feed (WP7)
  - name: batch
    description: 17-32 concurrent requests on the ttnn decode path of the previous package (plain batched decode, full sampling).
    # The old package's `plain` profile (b220c901dec, plugin 96d4416), unchanged, on this image's plugin (every feature
    # it needs is upstream, plugin-fallback-deps.md). fix-b32hang's batch32 (qwen38-b32-hang-fix 1a92e3e09b5), renamed;
    # in the package once the user's card-1 hardware check passes (profiles/resident/b32fix: one card dropped off PCIe
    # about once per 20 heavy c=32 / 8K prefill waves on the test box, the old stack included).
    max_num_seqs: 32
    additional_config:
      tt:                                  # deep-merged over serve.additional_config.tt
        trace_region_size: 1073741824
        l1_small_size: 24576
    env:
      # the image's bundle main_class is the resident class: the override selects the ttnn class. Keyed on the
      # TT-prefixed arch ONLY: this plugin (resident-mu) also registers an entry's bare name, so the old package's
      # second, bare-arch key replaced vLLM's own Qwen3_5ForConditionalGeneration and ModelConfig refused the checkpoint
      # ("This model does not support `--runner generate`"). The TT worker resolves "TT" + arch, so this key suffices.
      TT_MODEL_CLASS_OVERRIDES: "TTQwen3_5ForConditionalGeneration=models.demos.blackhole.qwen36.tt.qwen36_vllm:Qwen36ForCausalLM"
      TT_QWEN35_TEXT_VER: qwen36_blackhole
      QWEN36_MAX_TOKENS_ALL_USERS: "525312"   # bf8 paged KV pool (as published)
      QWEN36_MTP: "0"
      QWEN36_PLAIN_GDN_SLOT_FAST: "1"
      QWEN36_DRAFTER: mtp                     # (backstop, as published: the plain class never speculates)
    args:
      - [--max-num-batched-tokens, "262144"]
default_profile: multi-user              # user decision 2026-11-02

card:
  description: >-
    [Qwen/Qwen3.8-27B](https://huggingface.co/Qwen/Qwen3.8-27B) on a P300x2 (4 Blackhole chips) with vLLM, on the
    resident decode engine: one persistent program per chip per decode step. Profiles: up to 16 users with a shared KV
    pool (the default), and one user with lossless [DFlash2](https://huggingface.co/incoai/Qwen3.8-27B-DFlash2)
    speculative decoding (up to 256K context).
  quickstart: |
    ### At a glance
    - Weights: [Qwen/Qwen3.8-27B](https://huggingface.co/Qwen/Qwen3.8-27B) @ `1d4bf0f`; drafter
      [incoai/Qwen3.8-27B-DFlash2](https://huggingface.co/incoai/Qwen3.8-27B-DFlash2) @ `dedf8df`
    - Hardware: P300x2 (QuietBox 2), one (1, 4) Blackhole mesh
    - Profiles: `multi-user` (default), `single-user`, `batch`
    - `single-user` is **greedy only**: every request is decoded greedily (the server logs one warning for a request with
      temperature > 0). Speculation is lossless against the model's own greedy output; tokens can differ from plain
      decoding at bf16 near-ties.

    ### Which profile
    - One user, greedy (temperature 0): `single-user`.
    - Sampling, or 2 to 16 users: `multi-user`.
    - 17 to 32 users: `batch`.
    - If the time to the first token matters more than decode speed: `multi-user` with the TTFT-first option below.

    ### Get the drafter (`single-user`)
    ```bash
    hf download incoai/Qwen3.8-27B-DFlash2 --revision dedf8df68adfb1afeaf7b7480c0a0243108177b4
    ```

    ### Serve
    ```bash
    tt-model serve changh95/qwen3.8-27b-p300x2                                 # default profile: multi-user
    tt-model serve changh95/qwen3.8-27b-p300x2 --profile single-user
    tt-model profiles changh95/qwen3.8-27b-p300x2
    ```

    ### How to query
    ```bash
    curl http://localhost:20000/v1/chat/completions -H 'Content-Type: application/json' -d '{
      "model": "Qwen/Qwen3.8-27B",
      "messages": [{"role": "user", "content": "Write a haiku about Blackhole chips."}],
      "max_tokens": 256, "temperature": 0
    }'
    ```

    ### Users x context (`multi-user`)
    The users share one KV pool: 1,884,160 tokens on `multi-user` (29,440 blocks of 64 tokens); 8.7 KB per token per chip. A request can use up to `max_model_len` (262,144), and any mix of requests fits while their contexts add up to the pool. The table gives the context each user gets when all of them are equally long. Up to 8 users decode together in one launch. With 9 to 16 users a second launch runs as well.

    | users | context per user, `multi-user` |
    |---|---|
    | 1-7 | 262,144 |
    | 8 | 235,456 |
    | 16 | 117,696 |

    ### TTFT-first option (`multi-user`)
    Instead of prefilling waiting prompts together before their decodes start, the TTFT-first option prefills them in
    1024-token pieces between decode steps: first tokens come sooner, and every user's decode pauses while the others'
    prompts prefill. Turn it on by passing the profile's tt config again with `prefill_gang_tokens` 0:

    ```bash
    tt-model serve changh95/qwen3.8-27b-p300x2 --additional-config '{"tt": {"fabric_config": "FABRIC_1D", "trace_region_size": 134217728, "sample_on_device_mode": "decode_only", "prefill_chunk_tokens": 1024, "prefill_gang_tokens": 0}}'
    ```

    ### More than 16 users (`batch`)
    `batch` serves up to 32 concurrent requests on a different engine: the ttnn decode path of the previous package, all
    users in one decode batch, full sampling.

    Known issue: on the test machine, one card dropped off PCIe under heavy 32-request prefill: about once per 20 waves
    with 8K-token prompts, and once in the tt-inference-server run below at 2K-token prompts; also on the previous
    package. `tt-smi -r` or a reboot brings it back.


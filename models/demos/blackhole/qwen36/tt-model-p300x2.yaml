# tt-model-p300x2.yaml — Qwen/Qwen3.8-27B on a P300x2 (2x P300 boards = 4 Blackhole chips, (1,4) mesh) via vLLM, on the
# RESIDENT decode engine (qwen36_resident/: one persistent program per chip per decode step).
# ONE image; the lineup (user decision 2026-11-21: one engine for 1-32 users) and the default:
#   single-user          one user, lossless DFlash2 speculative decoding (greedy only), up to 256K context
#   batch                DEFAULT: 1-32 users on the resident engine with DFlash2 speculative decoding where it pays
#                        (user decision 2026-11-24: the former batch-dflash2 replaces the plain rows-mode batch): a
#                        32-row plain build and an 8 users x 4 verify rows build sharing weights and one KV pool (K
#                        Hadamard-rotated and V in bfp4), prefill gangs + one pipelined PP pass, device sampling; host-RAM prefix cache and
#                        preemption swap; requests needing logits (logprobs, structured output, ...) are served
#                        without speculation
# Retired 2026-11-22: multi-user (1-16 users, two 8-row launches) and the ttnn-path batch (17-32 users).
# Dropped from the earlier draft: plain single-user, single-user-mtp, multi-user-long (now multi-user's sizing).
# Replaces the ttnn-path manifest of the same repo (branch qwen36-p300x2-pkg, tt-metal b220c901dec, plugin 96d4416,
# image f6edb50771ac: profiles plain / batch8-dflash2 / single-user-dflash2). tt-model.yaml on this branch is the p150x2
# package (changh95/qwen3.8-27b-p150x2) and is untouched.
#
#   tt-model package --container models/demos/blackhole/qwen36/tt-model-p300x2.yaml --out <builds>
#   tt-model serve   <builds>/qwen3.8-27b-p300x2/tt_kernel_manifest.json [--profile single-user]
#   tt-model push    <builds>/qwen3.8-27b-p300x2 --private
#
# OPEN before packaging (search TBD): the plugin ref (resident-mu pushed to the fork), the adapter merge (lane serve's
# qwen38-res-mu-serve package-ready SHA, which must include ae776ee280c: RESIDENT_PREFILL_CHUNKS, without which
# multi-user ignores its chunk list and OOMs at build), the card's benchmark cells.
schema: "5.1"
repo: changh95/qwen3.8-27b-p300x2
name: qwen3.8-27b-p300x2
weights:
  repo: Qwen/Qwen3.8-27B
  revision: 1d4bf0f2ff6012fd82039f2fa52739d0dd7c60c0   # refs/main as validated, 2026-09-12 (every resident lane's runs)
kind: vllm-plugin
arch: blackhole

source:
  # Branch qwen38-resident-package = qwen38-resident (resident engine + multi-user rows + DFlash2 R=8 verify + 2-link
  # hub all-reduce) + lane serve's adapters (TBD merge) + lane sched's qwen38-res-sched (prefill gangs in serve_local,
  # one first-token launch per launch for a gang's prompts, lane prefill's PPPrefill.run_batch + HiFi2 / exp_approx SDPA
  # default merged, the multi pool fix) + this manifest. Build prerequisites in the worktree: submodules
  # initialised (git submodule update --init --recursive) and `runtime` a real directory, not a symlink (the docker
  # build context drops a symlink that points outside it).
  # Branch changh95/qwen38-host-path-fast = the above (058b7271552) + the rows adapter's page-table reload fix
  # (ae3c7739987: host-sampled decode no longer converts 16 x 4096 block ids one by one every step).
  # Branch changh95/qwen38-row-groups = the above + row groups: 1-32 users in one decode launch (RESIDENT_ROW_GROUPS),
  # the batched GDN heads, the per-group rmsnorm pipeline and the attention loop changes (2026-11-21).
  tt_metal: /home/ttuser/experiments/qwen38/src/tt-metal
  code:                                # import closure of qwen36_resident.generator_vllm (the adapters) + the DFlash2 drafter
    - qwen36_resident                  # resident engine, kernels, PP prefill, adapters + vllm_models bundle, spec serving
    - models/demos/blackhole/qwen36    # the ttnn DFlash2 drafter (tt/dflash2_tp.py, dflash2.py) and what it imports
    - models/common
    - models/tt_transformers
    - models/demos/qwen3_vl/tt/common.py
    - models/demos/utils
    - models/experimental/gated_attention_gated_deltanet
    - models/perf
    - models/tt_dit/utils/tensor.py
    - models/model_trace_region_sizes.yaml
    - models/model_targets.yaml
  ubuntu: "22.04"
  python: "3.12"

runtime:
  vllm: {version: "0.26.0"}
  # vllm-tt-plugin branch resident-mu = upstream tenstorrent/vllm-tt-plugin da7c018 (== the resident reference plugin) +
  # the TT chunk core the multi-user profile needs: a67c7f3 (aligned, one-long-in-flight chunked prefill), a0ee58a (a
  # split prompt's continuation keeps its state slot), 2c683cd (prefill_total_lens), 5618c8b (a split replay's last
  # one-token chunk is prefill work); then branch resident-mu-sched: a80d7a7 (prefill gangs, prefill_gang_tokens /
  # prefill_gang_idle_tokens), ae93205 (a request with no decode step yet does not cap the next gang), docs; merged with
  # fix-ttft2's resident-mu-ttft2 6641c17 as resident-mu-sched-ttft2 d5e699c (profiles/resident/sched/
  # plugin_ttft2_merge_note.txt), pushed to the fork as branch resident-mu-sched-ttft2. single-user uses upstream paths
  # only (adaptive block output for DFlash2; the chunk core is off at max_num_seqs 1).
  # Then branch changh95/qwen38-host-path-fast on top of d5e699c: host sampling draws unseeded top-k rows from the
  # top-k candidates (8128097) and applies penalties to the seen tokens only (c221edb): a 16-user step with one
  # penalized request 187.7 -> 60.7 ms with the adapter fix (device sampling 40.5 ms).
  # Then 0c319a7 + c0ec046 (an optional preempt_request(slot, token_ids) hook: Strata S3 swap) and ed900d6 (on a
  # model whose SpecPlan sets narrow_decode_resolves_commits, requests needing host-only sampling -- logprobs,
  # structured output, logit_bias, bad_words, allowed_token_ids, min_tokens -- are decoded without speculation
  # instead of refused; every step stays an ordinary host-sampled decode while one is live), 615dfba (min_p /
  # logit_bias too: upstream's speculative-launch refusal lifted on such a plan, every builtin logits processor on host).
  # Then 2d22bae (SpecPlan.verify_rows_sample: sampled requests speculate on a model whose verify rows draw with
  # their parameters; inactive unless the model declares it).
  plugin: {repo: https://github.com/changh95/vllm-tt-plugin, ref: 2d22baed85471131bc77cf5670c107b9404305da}
  extra_models_dir: qwen36_resident/vllm_models    # main_class qwen36_resident.generator_vllm:Qwen36ResidentForCausalLM

serve:                         # common to every profile; a profile's env MERGES over this (it cannot unset a key)
  hardware: p300x2
  mesh_device: P150x4          # tt-metal's name for the (1,4) Blackhole mesh a P300x2 opens
  port: 8000
  max_model_len: 262144
  max_num_seqs: 1              # overridden by batch
  block_size: 64
  capabilities:
    tool_parser: qwen3_coder
    reasoning_parser: qwen3
  additional_config:
    tt:
      fabric_config: FABRIC_1D
      trace_region_size: 134217728     # resident decode trace + PP prefill traces + the DFlash2 drafter's (128 MiB)
      # (sample_on_device_mode is per profile: additional_config deep-merges, so a profile cannot unset it, and
      # batch-spec samples on the host)
  env:
    ARCH_NAME: blackhole
    MESH_DEVICE: P150x4
    TT_MESH_GRAPH_DESC_PATH: /opt/tt-metal/tt_metal/fabric/mesh_graph_descriptors/p300_x2_mesh_graph_descriptor.textproto
    TT_METAL_PINNED_MEMORY_CACHE_LIMIT_BYTES: "0"   # the pinned host-buffer cache stalls large uploads for 10-40 min
    RESIDENT_ATTN_RR: "1"                # attention KV chunks round-robin over the workers
    RESIDENT_PP_SDPA_FIDELITY: HiFi2     # PP prefill SDPA at HiFi2 ("fast")
    # The hubs' all-reduce uses min(RESIDENT_HUB_LINKS = 2, the links trained per neighbour): a mesh that trains one
    # link per neighbour (other cabling / descriptor) serves on the one-link path (logged at build), no failure.
    VLLM_ENGINE_READY_TIMEOUT_S: "3600"  # the resident model + traces build in ~6 min warm, longer with cold caches
    VLLM_PLUGINS: tt,tt_model_registry
    VLLM_RPC_TIMEOUT: "900000"
    VLLM_CONFIGURE_LOGGING: "1"
    TORCHDYNAMO_DISABLE: "1"
    HF_HUB_OFFLINE: "1"
  args:
    - --async-scheduling

serve_profiles:
  - name: single-user
    description: One request at a time with lossless DFlash2 speculative decoding (greedy only), up to 256K context.
    max_num_seqs: 1
    env:
      TT_MODEL_CLASS_OVERRIDES: "TTQwen3_5ForConditionalGeneration=qwen36_resident.generator_vllm:Qwen36ResidentDFlashForCausalLM"
      # The drafter (incoai/Qwen3.8-27B-DFlash2, block 8 -> 7 drafts per verify) is a second checkpoint the single
      # `weights` pointer cannot carry: resolved by repo id AT A PINNED COMMIT from the HF cache mounted at /hf (offline:
      # its cache has no refs/main). `hf download incoai/Qwen3.8-27B-DFlash2 --revision dedf8df68a...` once before
      # `tt-model serve` (quickstart). Also the code default (qwen36_resident.dflash.DRAFTER_WEIGHTS).
      DFLASH_WEIGHTS: incoai/Qwen3.8-27B-DFlash2@dedf8df68adfb1afeaf7b7480c0a0243108177b4
    additional_config:
      tt:
        sample_on_device_mode: decode_only   # the prefill's first token; blocks come from the model's own sampler
  - name: batch
    description: 1-32 concurrent requests on the resident engine, all in one decode launch, with DFlash2 speculative decoding for up to 8 greedy requests when it pays (8 users x 4 verify rows, 3 drafts per verify) and the 32-row decode otherwise (more users, sampled / penalized requests, low acceptance, requests that need logits such as logprobs or structured output, which are served without speculation). Up to 256K context each, one shared KV pool of 2.56M tokens (K and V in 4-bit block floats), prefix caching and preemption swap in host RAM. Greedy output can differ from a non-speculating decode at bf16 near-ties.
    max_num_seqs: 32
    env:
      TT_MODEL_CLASS_OVERRIDES: "TTQwen3_5ForConditionalGeneration=qwen36_resident.vllm_adaptive:Qwen36ResidentAdaptiveForCausalLM"
      DFLASH_WEIGHTS: incoai/Qwen3.8-27B-DFlash2@dedf8df68adfb1afeaf7b7480c0a0243108177b4
      # both geometries in one process (ResidentModel share=): 28 attention workers leave the cores their 4 GDN head
      # groups need
      RESIDENT_ATTN_WORKERS: "28"
      RESIDENT_HEAD_GROUPS: "4"
      # KV pool in bfp4 (Strata S0): V since 2026-11-24 (prefill V rounded to nearest, RESIDENT_KV_V_RTN default on),
      # K since 2026-11-25 (S0-8: q and k rotated by one 256-point Hadamard after RoPE, which spreads outliers over the
      # head dim; prefill and decode-written K rows rounded to nearest, decode rows re-encoded at the tail write-back
      # off the critical path): 9,216 bytes a token-row pair vs 17,408 in bf8, so the bf8 pool's DRAM (1,376,000
      # tokens next to the second build, 2026-11-23) holds ~2.6M tokens; 2,560,000 keeps a margin
      RESIDENT_KV_V_BFP4: "1"
      RESIDENT_KV_K_BFP4: "1"
      RESIDENT_MAX_TOKENS_ALL_USERS: "2560000"
      # O-2 (2026-11-25): at 9-32 users (row groups) the attention workers compute the next user while the current
      # user's global row max is in flight — bit-identical; 32-row step 45.75 -> 44.65 ms, served c32 529 -> 542 tok/s
      RESIDENT_ATTN_PIPE: "1"
      # O-1c / O-1d (2026-11-25): at row groups the hub all-reduces the partials as bfp8 (half the fabric bytes), adds
      # the residual itself in fp32 (NLL +0.05% at 8K vs bf16 partials; drafter acceptance unchanged) and takes a
      # round's groups through four slots — 32-row step 44.65 -> 43.35 ms, served c32 542 -> 555 tok/s
      RESIDENT_HUB_BFP8: "1"
      RESIDENT_HUB_SLOTS: "4"
      # O-1f (2026-11-26): the hubs route the all-reduce over the chips' ring (with fabric_config FABRIC_1D_RING below):
      # a link direction carries half the line's end-link load — 32-row step -0.5 ms; served c32 561 -> 572 tok/s
      RESIDENT_FABRIC_RING: "1"
      RESIDENT_PREFILL_CHUNKS: "256,512,1024"
      # prefix caching in host memory (GB; 0 = off): a prompt's state at its last 1,024-token boundary (GDN states,
      # conv history, KV; for the speculating build also the drafter's context taps) is kept in host RAM, and a later
      # prompt that starts with it (the next turn of a conversation, a re-sent document) restores it instead of
      # prefilling it; LRU within the budget
      RESIDENT_PREFIX_CACHE_GB: "32"
      # preemption swap in host memory (GB; 0 = off, Strata S3): a request vLLM preempts when the KV pool runs out has
      # its state (GDN states, conv history, KV) kept in host RAM and restored when it resumes, instead of re-prefilling
      # its whole history (~1 s at 9K, ~64 s at 250K); LRU within the budget
      RESIDENT_SWAP_GB: "64"
      # sampled speculation: the verify rows draw with each request's parameters (temperature / top-k / top-p / seed
      # at their positions), so sampled requests the device can sample speculate too (plugin 2d22bae's
      # verify_rows_sample); penalized requests decode without speculation
      RESIDENT_SPEC_SAMPLE: "1"
    additional_config:
      tt:
        fabric_config: FABRIC_1D_RING        # (O-1f: the 2 x 2 mesh's wrap-around links for the hubs' ring routing)
        sample_on_device_mode: decode_only   # the plain geometry's hub sampling (and a verify's sampled column 0)
        prefill_chunk_tokens: 1024           # the TT chunk core: a prompt over the gang cap splits into 1024-token spans
        prefill_gang_tokens: 2048            # prefill gangs; 0 = the interleaved (TTFT-first) policy
    # replaces serve.args. Async scheduling: plain-geometry steps overlap, speculative steps are drained one by one.
    # The drafter is the model's own (vllm-tt-plugin runner-model spec contract: custom_class + the model_owned_drafter
    # sentinel); K = 3, narrow decode in the plain geometry
    args:
      - --async-scheduling
      - ["--speculative-config", '{"method": "custom_class", "model": "vllm_tt_plugin.model_owned_drafter", "num_speculative_tokens": 3}']
default_profile: batch                   # user decisions 2026-11-21 (one engine for 1-32 users) and 2026-11-24 (with DFlash2)

card:
  description: >-
    [Qwen/Qwen3.8-27B](https://huggingface.co/Qwen/Qwen3.8-27B) on a P300x2 (4 Blackhole chips) with vLLM, on the
    resident decode engine: one persistent program per chip per decode step. Profiles: 1 to 32 users in one decode
    launch with [DFlash2](https://huggingface.co/incoai/Qwen3.8-27B-DFlash2) speculative decoding for up to 8 greedy
    or sampled users when it pays, a shared KV pool and prefix caching / preemption swap in host memory (the default);
    and one user with lossless DFlash2 speculative decoding (up to 256K context).
  quickstart: |
    ### At a glance
    - Weights: [Qwen/Qwen3.8-27B](https://huggingface.co/Qwen/Qwen3.8-27B) @ `1d4bf0f`; drafter
      [incoai/Qwen3.8-27B-DFlash2](https://huggingface.co/incoai/Qwen3.8-27B-DFlash2) @ `dedf8df`
    - Hardware: P300x2 (QuietBox 2), one (1, 4) Blackhole mesh
    - Profiles: `batch` (default, 1-32 users, DFlash2 for up to 8 greedy or sampled users when it pays), `single-user`
    - `single-user` is **greedy only**: every request is decoded greedily (the server logs one warning for a request with
      temperature > 0). Speculation is lossless against the model's own greedy output; tokens can differ from plain
      decoding at bf16 near-ties.
    - DFlash2 helps most on short and medium prompts. On long, hard-to-predict text the gain shrinks to about 1.3x over
      plain decoding; it stayed faster at every length measured (32K to 250K).
    - New in this release (2026-11-26): `batch` decodes 16-32 users faster — 32 users 40.5 ms a token at 128 / 1024
      (was 47.0; 25 vs 21 t/s/u, 757 vs 656 t/s aggregate) and 49.3 ms at 8K / 1024 (was 54.8). The attention runs the
      next user while the current one's global maximum is in flight, the chip-to-chip all-reduce carries 8-bit block
      float partials over all four links of the chips' ring with the residual added in full precision (next-token NLL
      +0.05% at 8K tokens), and the norms after it run at a lower multiplier fidelity (NLL unchanged). Plus a fix for a
      rare engine stop when a request moved into speculation while a step was in flight.
    - 2026-11-25: `batch`'s KV pool stores K in 4-bit block floats too (Hadamard-rotated, rounded to nearest):
      2,560,000 tokens (+43%; 9 users at the full 256K, 32 users at 80K each) for ~1-2% of decode speed and +0.26%
      next-token NLL at 8K tokens vs 8-bit K and V.
    - 2026-11-24 (third): `batch` speculates for sampled requests too (temperature > 0 with the
      device's top-k: one user on natural chat at T 0.7 gets ~89 t/s/u vs 61, two ~78 vs 59, four ~63 vs 56); a
      request with its own seed decodes without speculation, so the same seed gives the same text. Greedy decoding
      gives up ~5% for it (one user 91 vs 96 t/s/u: the verify rows now draw tokens instead of taking the argmax).
    - 2026-11-24: `batch` became the speculating engine (the `batch-dflash2` profile replaced the plain `batch`), its
      KV pool stores V in 4-bit block floats (1,792,000 tokens, +27%), a request preempted when the pool runs out
      resumes from host RAM instead of re-prefilling, and requests with logprobs, structured output, logit_bias,
      min_p, bad_words, allowed_token_ids or min_tokens are served (decoded without speculation).

    ### Which profile
    - One user, greedy (temperature 0): `single-user`.
    - Anything else (sampling, 2 to 32 users, logprobs, structured output): `batch`. Its greedy and sampled requests
      speculate while a few users are live (one user on natural text gets about 91 t/s/u greedy, 92 sampled at
      T 0.7; four about 62 / 59); more users, penalized or seeded requests get the plain decode (60 t/s/u for one user,
      25 at 32).
    - If the time to the first token matters more than decode speed: `batch` with the TTFT-first option below.

    ### Get the drafter (both profiles)
    ```bash
    hf download incoai/Qwen3.8-27B-DFlash2 --revision dedf8df68adfb1afeaf7b7480c0a0243108177b4
    ```

    ### Serve
    ```bash
    tt-model serve changh95/qwen3.8-27b-p300x2                                 # default profile: batch
    tt-model serve changh95/qwen3.8-27b-p300x2 --profile single-user
    tt-model profiles changh95/qwen3.8-27b-p300x2
    ```

    ### How to query
    ```bash
    curl http://localhost:20000/v1/chat/completions -H 'Content-Type: application/json' -d '{
      "model": "Qwen/Qwen3.8-27B",
      "messages": [{"role": "user", "content": "Write a haiku about Blackhole chips."}],
      "max_tokens": 256, "temperature": 0
    }'
    ```

    ### Users x context (`batch`)
    The users share one KV pool of 2,560,000 tokens (40,000 blocks of 64 tokens; K and V in 4-bit block floats,
    4.6 KB per token per chip). A request can use up to `max_model_len` (262,144), and any mix of requests fits
    while their contexts add up to the pool; when it runs out, vLLM preempts a request, whose state (GDN states, conv
    history, KV) is kept in host RAM (`RESIDENT_SWAP_GB`, 64 GB) and restored when it resumes, instead of re-prefilling
    its history. All active users decode together in one launch of 32 rows.

    | users | context per user when all are equally long |
    |---|---|
    | 1-9 | 262,144 |
    | 16 | 160,000 |
    | 32 | 80,000 |

    ### Plain decode speed, users x context (`batch`)
    The step every user takes when the server is not speculating (sampled requests, more than ~5 users), from the
    device step time with every user at the given context (no host or HTTP overhead; measured with K and V in 8-bit;
    4-bit V matches or beats it, 8K c32 TPOT 55.1 vs 56.3 ms, and 4-bit K costs ~1% at 32 users); each cell is t/s/u / aggregate t/s:

    | users | context 128 | context 8K | context 32K |
    |---|---|---|---|
    | 1 | 60 / 60 | 59 / 59 | 57 / 57 |
    | 8 | 50 / 400 | 44 / 351 | 34 / 274 |
    | 16 | 36 / 578 | 30 / 485 | 22 / 349 |
    | 32 | 22 / 706 | 18 / 575 | 12 / 393 |

    (2026-11-26, this release, 32 users with K and V in 4-bit: 25 / 803 at context 128 and 20 / 654 at 8K; the other
    cells are from 2026-11-24.)

    ### Speculative decoding on `batch`
    Two builds of the model run in one process with shared weights and one KV pool: the 32-row plain decode and a
    speculating build of 8 users x 4 verify rows (3 DFlash2 drafts per verify). Every prompt prefills on the plain
    side (chunks, prefill gangs, prefix cache). A greedy or sampled request (no penalties, no seed, nothing that needs
    the logits; a sampled one with top_k within 32 — the model's default sampling has 20) moves into the speculating
    build after its first decode step when that pays (expected acceptance per kind of request, learned from finished
    requests: sampled drafts are accepted less, so 3-4 sampled users stay plain unless their text is predictable): the move fills the drafter's
    2,048-token window from the taps its prefill kept (~20 ms; a prefix-cache entry keeps them too), or — after a
    prefill of several prompts in one pass, or a long stretch of plain steps — re-runs the window (~0.35 s at 2K+
    tokens) while every live user waits, which is skipped when too few tokens are expected to be left or too many
    users would wait. The server measures both kinds of step and goes back to plain steps for everyone when
    speculation stops paying (6-8 users or more by its step-time model, low draft acceptance) and while any live
    request is penalized, seeded, or asks for logprobs, structured output, logit_bias, min_p, bad_words,
    allowed_token_ids or min_tokens — those are served on plain steps, as on a server that does not speculate. A
    sampled request's verify rows each draw with its own temperature / top-k / top-p at their positions, and a draft is
    accepted while the draw equals it, which keeps the sampled distribution (lossless for any draft). Greedy output can differ from a non-speculating decode at bf16 near-ties (the speculating and plain
    builds sum in different orders, and a verify step attends to its own new rows before they are stored in 4 bits): in
    the check below, the 8 256-token answers at 8 users each took an equally fluent different word than at 1 user after
    88-223 characters (at 2 users, 7 of 8 matched exactly).

    Served, natural-text prompts, 256 tokens (2026-11-26, this build; greedy, and sampled at T 0.7 / top-p 0.95 /
    top-k 20; the plain decode for comparison, 2026-11-24):

    | users | `batch` greedy t/s/u | `batch` sampled t/s/u | plain decode t/s/u |
    |---|---|---|---|
    | 1 | 91 | 92 | 61 |
    | 2 | 79 | 79 | 59 |
    | 4 | 62 | 59 | 56 |
    | 8 | 54 | 54 | 51 |

    ### Prefill and decode on `batch`, and the TTFT-first option
    A step on this engine either prefills or decodes, never both, so prefill time that runs while a user decodes is a
    pause in that user's tokens. `batch` prefills the prompts that are waiting together, in one pipelined pass, before
    their decodes start: when many requests arrive together, each user then decodes at the decode-step speed, and the
    first tokens of the whole group come out after its prefill. With the TTFT-first option a long prompt is split into
    1024-token pieces between decode steps instead: first tokens come sooner, and every user's decode pauses while the
    others' prompts prefill. Turn it on by passing the profile's tt config with `prefill_gang_tokens` 0:

    ```bash
    tt-model serve changh95/qwen3.8-27b-p300x2 --additional-config '{"tt": {"fabric_config": "FABRIC_1D", "trace_region_size": 134217728, "sample_on_device_mode": "decode_only", "prefill_chunk_tokens": 1024, "prefill_gang_tokens": 0}}'
    ```

    ### Benchmarks (`vllm bench serve`)
    | profile | users | ISL / OSL | t/s | t/s/u | TTFT |
    |---|---|---|---|---|---|
    | `single-user` | 1 | 128 / 128 | 124.0 | 142.1 | 0.14 s |
    | `single-user` | 1 | 8192 / 128 | 73.5 | 175.2 | 1.02 s |
    | `single-user` | 1 | 32768 / 128 | 29.8 | 209.0 | 3.69 s |
    | `batch` | 1 | 128 / 128 | 54.3 | 60.3 | 0.25 s |
    | `batch` | 8 | 128 / 128 | 325.8 | 53.1 | 0.75 s |
    | `batch` | 16 | 128 / 128 | 471.0 | 39.4 | 1.12 s |
    | `batch` | 32 | 128 / 128 | 587.7 | 25.0 | 1.89 s |
    | `batch` | 32 | 128 / 1024 | 756.7 | 24.7 | 1.89 s |
    | `batch` | 32 | 2048 / 128 | 299.9 | 24.6 | 8.49 s |
    | `batch` | 32 | 8192 / 1024 | 430.1 | 20.3 | 25.75 s |
    | `batch` | 1 | 32768 / 128 | 17.6 | 49.3 | 4.71 s |
    | `batch` | 1 | 250000 / 128 | 2.1 | 46.5 | 57.11 s |
    | `batch`, greedy | 1 | 128 / 128 | 70.9 | 82.0 | 0.26 s |
    | `batch`, greedy | 2 | 128 / 128 | 96.4 | 61.2 | 0.37 s |

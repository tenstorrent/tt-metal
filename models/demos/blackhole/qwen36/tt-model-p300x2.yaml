    ### Changes in this release

    * One package for the P300x2. The DFlash2 profiles moved here from [changh95/qwen3.8-27b-dflash2-p300x2](https://huggingface.co/changh95/qwen3.8-27b-dflash2-p300x2), which is retired (its page points here). The old plain profile `batch32` is now `plain`.
    * `plain` now includes two correctness fixes. Earlier plain images could produce degenerate greedy text on short prompts, and their output could change from the second request on. The traced short-prompt prefill no longer trusts stale page-table rows, and each request's Gated-DeltaNet state is written into its decode slot exactly.
    * `batch8-dflash2` prefills long prompts in chunks. A prompt of 8,192 tokens or more that arrives while other requests decode is prefilled in 2,048-token chunks between their steps, so they keep streaming (first shipped in the last DFlash2 release, 2026-09-30).
    * Faster prefill of long prompts: TTFT at 32k tokens 5,149 -> 4,085 ms on `batch8-dflash2`, 5,077 -> 4,086 ms on `single-user-dflash2` and 4,457 -> 4,003 ms on `plain` (1 user).
    * `plain` throughput: the exact slot write costs time per admitted request, so short prompts at many users are slower than with the previous plain image: 128 / 128 tokens at 32 users 491 -> 359 tokens/s (-27%), at 8 users 188 -> 163 (-13%), TTFT at 128 tokens 94 -> 157 ms. One user decodes at the same speed (32.3 -> 31.6 t/s/u); long answers at 32 users lose 7% (739 -> 688 t/s at 128 / 1,024). The previous image's higher numbers came from a slot write that was not exact.
    * Intended output change: on the DFlash2 profiles, prompts of 2,048 tokens or more now prefill with exactly the numerics of the `plain` path. Greedy output for those prompts can differ from the previous DFlash2 package at bf16 near-ties. Shorter prompts give the same output as before.

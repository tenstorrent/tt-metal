# tt-model-p300x2.yaml — Qwen/Qwen3.8-27B on a P300x2 (2x P300 boards = 4 Blackhole chips, (1,4) mesh) via vLLM, on the
# RESIDENT decode engine (qwen36_resident/: one persistent program per chip per decode step).
# ONE image, four serve profiles (the default is decided after the benchmark grid; PROVISIONAL below):
#   single-user-dflash2  one user, lossless DFlash2 speculative decoding (greedy only), up to 256K context
#   single-user          one user, plain resident decode, full sampling (greedy and top-k <= 32 drawn on device)
#   single-user-mtp      one user, lossless MTP speculative decoding (greedy only)
#   multi-user           several users on the rows-mode resident engine (paged KV pool, chunked prefill, device sampling)
#   batch32              (TBD) up to 32 users on the old ttnn decode path, only if it beats multi-user at >= 16 users
# Replaces the ttnn-path manifest of the same repo (branch qwen36-p300x2-pkg, tt-metal b220c901dec, plugin 96d4416,
# image f6edb50771ac: profiles plain / batch8-dflash2 / single-user-dflash2). tt-model.yaml on this branch is the p150x2
# package (changh95/qwen3.8-27b-p150x2) and is untouched.
#
#   tt-model package --container models/demos/blackhole/qwen36/tt-model-p300x2.yaml --out <builds>
#   tt-model serve   <builds>/qwen3.8-27b-p300x2/tt_kernel_manifest.json [--profile single-user-dflash2]
#   tt-model push    <builds>/qwen3.8-27b-p300x2 --private
#
# OPEN before packaging (search TBD): the plugin ref (resident-mu pushed to the fork), the adapter merge (lane serve's
# qwen38-res-mu-serve package-ready SHA), the multi-user sizing (lane mu's grid / lane serve's OOM churn), MTP at 256K,
# the default profile, the card's benchmark cells.
schema: "5.1"
repo: changh95/qwen3.8-27b-p300x2
name: qwen3.8-27b-p300x2
weights:
  repo: Qwen/Qwen3.8-27B
  revision: 1d4bf0f2ff6012fd82039f2fa52739d0dd7c60c0   # refs/main as validated, 2026-09-12 (every resident lane's runs)
kind: vllm-plugin
arch: blackhole

source:
  # Branch qwen38-resident-package = qwen38-resident (resident engine + multi-user rows + DFlash2 R=8 verify + 2-link
  # hub all-reduce) + lane serve's adapters (TBD merge) + this manifest. Build prerequisites in the worktree: submodules
  # initialised (git submodule update --init --recursive) and `runtime` a real directory, not a symlink (the docker
  # build context drops a symlink that points outside it).
  tt_metal: /home/ttuser/experiments/qwen36_27b/tt-metal-res-pkg
  code:                                # import closure of qwen36_resident.generator_vllm (the adapters) + the DFlash2 drafter
    - qwen36_resident                  # resident engine, kernels, PP prefill, adapters + vllm_models bundle, spec serving
    - models/demos/blackhole/qwen36    # the ttnn DFlash2 drafter (tt/dflash2_tp.py, dflash2.py) and what it imports
    - models/common
    - models/tt_transformers
    - models/demos/qwen3_vl/tt/common.py
    - models/demos/utils
    - models/experimental/gated_attention_gated_deltanet
    - models/perf
    - models/tt_dit/utils/tensor.py
    - models/model_trace_region_sizes.yaml
    - models/model_targets.yaml
  ubuntu: "22.04"
  python: "3.12"

runtime:
  vllm: {version: "0.26.0"}
  # vllm-tt-plugin branch resident-mu = upstream tenstorrent/vllm-tt-plugin da7c018 (== the resident reference plugin) +
  # the TT chunk core the multi-user profile needs: a67c7f3 (aligned, one-long-in-flight chunked prefill), a0ee58a (a
  # split prompt's continuation keeps its state slot), 2c683cd (prefill_total_lens), 5618c8b (a split replay's last
  # one-token chunk is prefill work). The single-user profiles use upstream paths only (adaptive block output for
  # MTP / DFlash2; the chunk core is off at max_num_seqs 1). Pin = 5618c8b once resident-mu is pushed to the fork.
  plugin: {repo: https://github.com/changh95/vllm-tt-plugin, ref: 5618c8b_TBD_PUSH}
  extra_models_dir: qwen36_resident/vllm_models    # main_class qwen36_resident.generator_vllm:Qwen36ResidentForCausalLM

serve:                         # common to every profile; a profile's env MERGES over this (it cannot unset a key)
  hardware: p300x2
  mesh_device: P150x4          # tt-metal's name for the (1,4) Blackhole mesh a P300x2 opens
  port: 8000
  max_model_len: 262144
  max_num_seqs: 1              # overridden by multi-user
  block_size: 64
  capabilities:
    tool_parser: qwen3_coder
    reasoning_parser: qwen3
  additional_config:
    tt:
      fabric_config: FABRIC_1D
      trace_region_size: 134217728     # resident decode trace + PP prefill traces + the DFlash2 drafter's (128 MiB)
      sample_on_device_mode: decode_only
  env:
    ARCH_NAME: blackhole
    MESH_DEVICE: P150x4
    TT_MESH_GRAPH_DESC_PATH: /opt/tt-metal/tt_metal/fabric/mesh_graph_descriptors/p300_x2_mesh_graph_descriptor.textproto
    TT_METAL_PINNED_MEMORY_CACHE_LIMIT_BYTES: "0"   # the pinned host-buffer cache stalls large uploads for 10-40 min
    RESIDENT_ATTN_RR: "1"                # attention KV chunks round-robin over the workers
    RESIDENT_PP_SDPA_FIDELITY: HiFi2     # PP prefill SDPA at HiFi2 ("fast")
    # The hubs' all-reduce uses min(RESIDENT_HUB_LINKS = 2, the links trained per neighbour): a mesh that trains one
    # link per neighbour (other cabling / descriptor) serves on the one-link path (logged at build), no failure.
    VLLM_ENGINE_READY_TIMEOUT_S: "3600"  # the resident model + traces build in ~6 min warm, longer with cold caches
    VLLM_PLUGINS: tt,tt_model_registry
    VLLM_RPC_TIMEOUT: "900000"
    VLLM_CONFIGURE_LOGGING: "1"
    TORCHDYNAMO_DISABLE: "1"
    HF_HUB_OFFLINE: "1"
  args:
    - --async-scheduling

serve_profiles:
  - name: single-user-dflash2
    description: One request at a time with lossless DFlash2 speculative decoding (greedy only), up to 256K context.
    max_num_seqs: 1
    env:
      TT_MODEL_CLASS_OVERRIDES: "TTQwen3_5ForConditionalGeneration=qwen36_resident.generator_vllm:Qwen36ResidentDFlashForCausalLM"
      # The drafter (incoai/Qwen3.8-27B-DFlash2, block 8 -> 7 drafts per verify) is a second checkpoint the single
      # `weights` pointer cannot carry: resolved by repo id AT A PINNED COMMIT from the HF cache mounted at /hf (offline:
      # its cache has no refs/main). `hf download incoai/Qwen3.8-27B-DFlash2 --revision dedf8df68a...` once before
      # `tt-model serve` (quickstart). Also the code default (qwen36_resident.dflash.DRAFTER_WEIGHTS).
      DFLASH_WEIGHTS: incoai/Qwen3.8-27B-DFlash2@dedf8df68adfb1afeaf7b7480c0a0243108177b4
  - name: single-user
    description: One request at a time, plain resident decode, full sampling (greedy and top-k <= 32 on device).
    max_num_seqs: 1
  - name: single-user-mtp
    description: One request at a time with lossless MTP speculative decoding (greedy only).
    max_num_seqs: 1
    max_model_len: 32768                 # TBD: validated at 32768 (lane serve); 256K not measured yet
    env:
      TT_MODEL_CLASS_OVERRIDES: "TTQwen3_5ForConditionalGeneration=qwen36_resident.generator_vllm:Qwen36ResidentMTPForCausalLM"
  - name: multi-user
    description: Several concurrent requests on the rows-mode resident engine (paged KV pool shared by the users, chunked prefill, device sampling).
    max_num_seqs: 8                      # TBD: 8 (lead) or 16 (two launches, lane serve's runs), from lane mu's grid
    env:
      RESIDENT_MAX_TOKENS_ALL_USERS: "1576960"   # TBD: KV pool = 24,640 blocks x 64 (lane serve's OOM churn pending)
    additional_config:
      tt:                                # deep-merged over serve.additional_config.tt
        prefill_chunk_tokens: 1024       # the TT chunk core: chunked prefill between decode steps
        sample_on_device_mode: decode_only   # the rows-mode hub feed (WP7)
  - name: batch32
    description: Up to 32 concurrent requests on the ttnn decode path (plain batched decode, full sampling); kept only where it beats multi-user.
    # TBD: in the package only if it beats multi-user at >= 16 users (device comparison queued). The old package's
    # `plain` profile (b220c901dec, plugin 96d4416), unchanged, on this image's plugin (resident-mu: every feature it
    # needs is upstream, plugin-fallback-deps.md).
    max_num_seqs: 32
    additional_config:
      tt:                                  # deep-merged over serve.additional_config.tt
        trace_region_size: 1073741824
        l1_small_size: 24576
    env:
      # the image's bundle main_class is the resident class: the override (keyed on the plugin's TT-prefixed arch, and
      # the raw arch for the plain lookup path) selects the ttnn class, as the old package's plain profile did
      TT_MODEL_CLASS_OVERRIDES: "TTQwen3_5ForConditionalGeneration=models.demos.blackhole.qwen36.tt.qwen36_vllm:Qwen36ForCausalLM,Qwen3_5ForConditionalGeneration=models.demos.blackhole.qwen36.tt.qwen36_vllm:Qwen36ForCausalLM"
      TT_QWEN35_TEXT_VER: qwen36_blackhole
      QWEN36_MAX_TOKENS_ALL_USERS: "525312"   # bf8 paged KV pool (as published)
      QWEN36_MTP: "0"
      QWEN36_PLAIN_GDN_SLOT_FAST: "1"
      QWEN36_DRAFTER: mtp                     # (backstop, as published: the plain class never speculates)
    args:
      - [--max-num-batched-tokens, "262144"]
default_profile: single-user-dflash2     # PROVISIONAL: decided after the grid

card:
  description: >-
    [Qwen/Qwen3.8-27B](https://huggingface.co/Qwen/Qwen3.8-27B) on a P300x2 (4 Blackhole chips) with vLLM, on the
    resident decode engine: one persistent program per chip per decode step, about 12 ms per token for one user.
    Profiles: one user with lossless [DFlash2](https://huggingface.co/incoai/Qwen3.8-27B-DFlash2) speculative decoding
    (up to 256K context), one user plain, one user with MTP, and several users with a shared KV pool.
  quickstart: |
    ### At a glance
    - Weights: [Qwen/Qwen3.8-27B](https://huggingface.co/Qwen/Qwen3.8-27B) @ `1d4bf0f`; drafter
      [incoai/Qwen3.8-27B-DFlash2](https://huggingface.co/incoai/Qwen3.8-27B-DFlash2) @ `dedf8df`
    - Hardware: P300x2 (QuietBox 2), one (1, 4) Blackhole mesh
    - Profiles: `single-user-dflash2` (default, TBD), `single-user`, `single-user-mtp`, `multi-user`
    - `single-user-dflash2` and `single-user-mtp` are **greedy only**: every request is decoded greedily (the server logs
      one warning for a request with temperature > 0). Speculation is lossless against the model's own greedy output;
      tokens can differ from `single-user` at bf16 near-ties.
    - DFlash2 helps most on short and medium prompts. On long, hard-to-predict text the gain shrinks to about 1.3x over
      `single-user`; it stayed faster at every length measured (32K to 250K).

    ### Get the drafter (`single-user-dflash2`)
    ```bash
    hf download incoai/Qwen3.8-27B-DFlash2 --revision dedf8df68adfb1afeaf7b7480c0a0243108177b4
    ```

    ### Serve
    ```bash
    tt-model serve changh95/qwen3.8-27b-p300x2                                 # default profile
    tt-model serve changh95/qwen3.8-27b-p300x2 --profile single-user-dflash2
    tt-model profiles changh95/qwen3.8-27b-p300x2
    ```

    ### How to query
    ```bash
    curl http://localhost:20000/v1/chat/completions -H 'Content-Type: application/json' -d '{
      "model": "Qwen/Qwen3.8-27B",
      "messages": [{"role": "user", "content": "Write a haiku about Blackhole chips."}],
      "max_tokens": 256, "temperature": 0
    }'
    ```

    ### Users x context (`multi-user`)
    | users | context per user | KV pool tokens |
    |---|---|---|
    | 1 | TBD | TBD |
    | 8 | TBD | TBD |

    ### Benchmarks (tt-inference-server `--workflow benchmarks`)
    | profile | users | ISL / OSL | t/s | t/s/u | TTFT |
    |---|---|---|---|---|---|
    | single-user-dflash2 | 1 | 128 / 128 | TBD | TBD | TBD |
    | single-user | 1 | 128 / 128 | TBD | TBD | TBD |
    | single-user-mtp | 1 | 128 / 128 | TBD | TBD | TBD |
    | multi-user | 8 | 128 / 128 | TBD | TBD | TBD |

    DFlash2 at long context (one user, 128 new tokens, one prose prompt per length):

    | prompt | single-user-dflash2 t/s/u | single-user t/s/u |
    |---|---|---|
    | 32K | ~120 | ~79 |
    | 64K | ~207 | TBD |
    | 128K | ~106 | TBD |
    | 250K | ~160 | ~49 |

verify:
  - "from qwen36_resident.generator_vllm import Qwen36ResidentForCausalLM, Qwen36ResidentMTPForCausalLM, Qwen36ResidentDFlashForCausalLM; assert Qwen36ResidentDFlashForCausalLM"
  - "from qwen36_resident.dflash import ResidentDFlash, DRAFTER_WEIGHTS; assert DRAFTER_WEIGHTS.endswith('dedf8df68adfb1afeaf7b7480c0a0243108177b4')"
  - "from models.demos.blackhole.qwen36.tt.qwen36_vllm import Qwen36ForCausalLM; assert Qwen36ForCausalLM"   # batch32

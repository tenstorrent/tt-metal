    * Per-user speed = 1000 / mean time per output token (decode only); `t/s` = aggregate output tokens per second over the run, which includes prefill and the gaps between a user's requests. `thinking off` passes `"chat_template_kwargs": {"enable_thinking": false}`; `thinking on` is the served default, with answers capped at 4,096 tokens. Speed-up = per-user speed of the faster speculative profile over `plain` at the same user count.


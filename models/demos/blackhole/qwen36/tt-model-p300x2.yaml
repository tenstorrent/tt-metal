    Means of `vllm bench serve` runs (random prompts, ignore_eos; `single-user` greedy) on a P300x2 with chip clocks
    logged: `single-user` 2026-11-20 (median 1350 MHz), `batch` 2026-11-26 (median 1350 MHz, at most 69 °C; prefix
    cache on, a different random prompt per row). `single-user` and the greedy `batch` rows follow how predictable the
    text is (DFlash2 acceptance), so they vary by prompt. Accuracy: teacher-forced on natural text, `batch`'s
    next-token NLL with V in 4-bit matched 8-bit V within noise (+0.02% at 8K tokens, -0.14% at 32K), K and V in 4-bit
    gave +0.26% at 8K (1.4144 vs 1.4107; top-1 0.658 vs 0.663), and the 8-bit
    engine matched the previous release's (1.5269 / 0.6548 vs 1.5278 / 0.6562 NLL / top-1 at 128-384 tokens).

    Prefix caching (`batch`, on by default: `RESIDENT_PREFIX_CACHE_GB`, 32 GB of host RAM; 0 turns it off): a prompt's
    state at its last 1,024-token boundary is kept in host memory (for the speculating build also the drafter's taps),
    and a later prompt that starts with it restores it instead of prefilling it. A 3-turn chat over a 12,021-token
    document (greedy, served, 2026-11-24): TTFT 1.98 / 0.71 / 0.69 s vs 1.42 / 1.38 / 1.37 s without the cache
    (2026-11-22); the answers are identical. Storing a long prompt that misses the cache costs its first request about
    +0.9 s at 32K tokens (the 32K TTFT above).
  limitations: |
    - `single-user` decodes every request greedily (temperature and sampling parameters are ignored, with one
      logged warning).
    - `batch` speculates for at most 8 users at a time, and only while no live request has penalties, its own seed,
      logprobs, structured output, logit_bias, min_p, token filters, or a top_k past 32; one such request makes every
      live user decode plainly until it finishes (its output is exact; the speed gain pauses).
    - `batch`: hard-to-predict text (random tokens, some code) is probed and then decoded plainly, which costs a few
      percent on such requests; the server remembers the acceptance it saw, per kind of request (greedy, sampled), so a
      run of them stops probing.
    - `batch`: a request with presence / frequency / repetition penalties or logprobs sends the whole decode step to
      host sampling for every user in it: a 16-user step goes from 27.9 to about 62 ms (one penalized request) or 68 ms
      (one logprobs request).
    - `batch`: greedy output can differ from a non-speculating decode, and from the previous release, at bf16
      near-ties (fluent alternatives; accuracy unchanged).
    - `batch`: a greedy request's move into speculation fills the drafter from its prefill's taps (~20 ms); after a
      prefill of several prompts in one pass, or a long stretch of plain steps, it re-runs the drafter's 2,048-token
      window (~0.35 s a user, every live user waits). Keeping those taps adds ~10-40 ms to TTFT (128-token c1 0.25 vs
      0.21 s, 2K-prompt c32 8.2 vs 8.0 s on the morning's plain `batch`).
    - `batch` fits the users' contexts in a 2,560,000-token KV pool; past it vLLM preempts a request, which resumes from
      host RAM (64 GB budget; LRU — past the budget it re-prefills).
    - Prefix caching is at 1,024-token boundaries, and the first prompt that stores a prefix pays for it (about +0.5 s
      at 12K tokens, +0.9 s at 32K); `single-user` prefills a repeated long prompt again (131,072 tokens: about 21 s).
    - On an earlier test machine with a failed fan, one card dropped off PCIe under heavy 32-request prefill;
      `tt-smi -r` or a reboot brings it back.


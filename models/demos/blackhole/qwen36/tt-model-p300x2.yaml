# tt-model-p300x2.yaml — Qwen/Qwen3.8-27B on a P300x2 (2x P300 boards = 4 Blackhole chips, (1,4) mesh) via vLLM.
# ONE image, three serve profiles:
#   plain                plain batched decode, up to 32 users, full sampling (DEFAULT; was `batch32` of the old plain package)
#   batch8-dflash2       DFlash2 speculative decoding, up to 8 users, two verify buckets, chunked prefill
#   single-user-dflash2  DFlash2 speculative decoding, one user
# This file replaces both earlier P300x2 manifests: the plain package's models/demos/blackhole/qwen36/tt-model.yaml on
# branch qwen36-prefill-opt-package (image 0becf4834925, tt-metal 0e988de173f, plugin 751ec33) and
# tt-model-dflash2-p300x2.yaml (changh95/qwen3.8-27b-dflash2-p300x2, retired: tt-metal 8645cc34677, plugin 96d4416).
# tt-model.yaml on this branch is the p150x2 package (changh95/qwen3.8-27b-p150x2).
#
#   tt-model package --container models/demos/blackhole/qwen36/tt-model-p300x2.yaml --out <builds>
#   tt-model serve   <builds>/qwen3.8-27b-p300x2/tt_kernel_manifest.json [--profile batch8-dflash2]
#   tt-model push    <builds>/qwen3.8-27b-p300x2 --private
schema: "5.1"
repo: changh95/qwen3.8-27b-p300x2
name: qwen3.8-27b-p300x2
weights:
  repo: Qwen/Qwen3.8-27B
  revision: 1d4bf0f2ff6012fd82039f2fa52739d0dd7c60c0   # refs/main as validated, 2026-09-12
kind: vllm-plugin
arch: blackhole

source:
  # Branch qwen36-p300x2-pkg = qwen36-p150x2 (round-5 integration a7a8aeb8d41: TP=2 prefill, tp2/TP=4 chunked prefill,
  # fast GDN remap, long-prompt TTFT) + the SDPA width pin default-off commit + this manifest.
  tt_metal: /home/ttuser/experiments/qwen36_27b/tt-metal-pkg5
  code:                                                        # import closure of qwen36_vllm.py + the demo/spec-decode path
    - models/common
    - models/tt_transformers
    - models/demos/blackhole/qwen36                            # model, DFlash drafters, demo, tests, vllm_bundle
    - models/demos/qwen3_vl/tt/common.py
    - models/demos/utils
    - models/experimental/gated_attention_gated_deltanet
    - models/perf
    - models/tt_dit/utils/tensor.py
    - models/model_trace_region_sizes.yaml
    - models/model_targets.yaml
  ubuntu: "22.04"
  python: "3.12"

runtime:
  vllm: {version: "0.26.0"}                                    # the validated serving venv: vllm 0.26.0 (empty target)
  # vllm-tt-plugin branch pd-disagg: superset of both earlier pins (751ec33 of the plain package, 7ddf2c8 of the DFlash2
  # v13 package): the block-output / batched / ragged contracts the DFlash2 profiles use, the TT chunk policy and the
  # block-output chunked-prefill capability batch8-dflash2 uses, the generic TT_MODEL_CLASS_OVERRIDES the plain profile
  # uses (a67ef80, already in 751ec33), plus PD connector, host sampler and scheduler fixes. Pinned to the pushed commit.
  plugin: {repo: https://github.com/changh95/vllm-tt-plugin, ref: 96d4416d31f79973c9ff10b3b41e15d0b06e3430}
  extra_models_dir: models/demos/blackhole/qwen36/vllm_bundle  # main_class Qwen36DFlashForCausalLM (the DFlash2 profiles);
                                                               # `plain` selects Qwen36ForCausalLM via TT_MODEL_CLASS_OVERRIDES

serve:                         # common to every profile; a profile's env MERGES over this (it cannot unset a key), so
                               # nothing profile-specific lives here: no QWEN36_DRAFTER / DFLASH_* / QWEN36_MTP keys
  hardware: p300x2
  mesh_device: P150x4          # tt-metal's name for the (1,4) Blackhole mesh a P300x2 opens
  port: 8000
  max_model_len: 262144
  max_num_seqs: 32             # overridden per profile below
  block_size: 64
  capabilities:
    tool_parser: qwen3_coder
    reasoning_parser: qwen3
  additional_config:
    tt:
      fabric_config: FABRIC_1D
      trace_region_size: 1073741824
      l1_small_size: 24576
      sample_on_device_mode: decode_only   # plain: the ttnn device sampler (1x4); DFlash2: REQUIRED by the block-output contract
  env:
    ARCH_NAME: blackhole
    TT_QWEN35_TEXT_VER: qwen36_blackhole
    TT_MESH_GRAPH_DESC_PATH: /opt/tt-metal/tt_metal/fabric/mesh_graph_descriptors/p300_x2_mesh_graph_descriptor.textproto
    QWEN36_MAX_TOKENS_ALL_USERS: "525312"   # bf8 paged KV pool, every profile (= both earlier packages)
    VLLM_RPC_TIMEOUT: "900000"
    VLLM_CONFIGURE_LOGGING: "1"
    TORCHDYNAMO_DISABLE: "1"
    HF_HUB_OFFLINE: "1"
  args:
    - [--max-num-batched-tokens, "262144"]

serve_profiles:
  - name: plain
    description: Plain batched decode, up to 32 concurrent users, full sampling support (formerly `batch32`).
    max_num_seqs: 32
    env:
      # The bundle's main_class is the DFlash class; the plugin registers the checkpoint arch under its TT-prefixed name
      # (platform.py: "TT" + arch, the bundle too), so the override MUST be keyed on TTQwen3_5ForConditionalGeneration to
      # beat it; the raw arch is kept for the plain lookup path (same string as the p150x2 tp2 profile, boot-verified there).
      TT_MODEL_CLASS_OVERRIDES: "TTQwen3_5ForConditionalGeneration=models.demos.blackhole.qwen36.tt.qwen36_vllm:Qwen36ForCausalLM,Qwen3_5ForConditionalGeneration=models.demos.blackhole.qwen36.tt.qwen36_vllm:Qwen36ForCausalLM"
      QWEN36_MTP: "0"                 # explicit: the plain class must not load the MTP drafter head / its paged KV cache
      QWEN36_PLAIN_GDN_SLOT_FAST: "1" # fast bit-exact GDN slot hand-off at admission (code default: TP=2 only). Bit-exact at
                                      # TP=4 (slot test 1x4, B=32, decode between admissions); ~130 ms less per admitted
                                      # request. Set here, not as a TP=4 code default, so the DFlash2 profiles are unchanged
                                      # (since 1bec7b836a8 QWEN36_DRAFTER=mtp alone would build it)
      QWEN36_DRAFTER: mtp             # carried over from batch32; the plain class never speculates. Kept as a backstop: if the
                                      # override ever failed to apply, the DFlash class would serve plain (speculation OFF)
                                      # instead of starting speculative serving at 32 slots
    args:
      - [--max-num-batched-tokens, "262144"]
  - name: single-user-dflash2
    description: One request at a time with lossless DFlash2 speculative decoding (block-output serving).
    max_num_seqs: 1
    env:
      QWEN36_DRAFTER: dflash2
      QWEN36_GDN_SPEC_FUSED: "1"      # fused gdn_spec_step verify (M2): verify 49.8 -> 37.7 ms at 8 rows, 70 -> 39-41 at 32 rows
      # DFlash2 speculative decoding (incoai/Qwen3.8-27B-DFlash2, block 8 -> 7 drafts per verify, lossless greedy). The
      # drafter is a second checkpoint the single `weights` pointer cannot carry: it is resolved from the HF cache mounted
      # at /hf, so run `hf download incoai/Qwen3.8-27B-DFlash2 --revision dedf8df68adfb1afeaf7b7480c0a0243108177b4` once
      # before `tt-model serve` (quickstart below).
      DFLASH_WEIGHTS: incoai/Qwen3.8-27B-DFlash2@dedf8df68adfb1afeaf7b7480c0a0243108177b4
      QWEN36_DFLASH_BLOCK: "8"
      QWEN36_DFLASH_MAX_PROMPT: "2048"  # prompts up to this take the single masked-bucket prefill; longer ones the
                                        # eager chunked spec prefill. EVERY text prompt speculates.
      QWEN36_DFLASH_SERVE_BLOCK: "32"   # tokens committed per vLLM step on a speculative request
    args:
      - [--max-num-batched-tokens, "262144"]
      - --no-async-scheduling           # the plugin's block-output contract is synchronous
  - name: batch8-dflash2
    description: Up to 8 concurrent requests with lossless DFlash2 speculative decoding in two verify buckets — K=7 drafts per step (4x8) while up to 4 requests are live, K=3 (8x4) at 5-8 — switched at runtime with no recapture (batched ragged block-output serving).
    max_num_seqs: 8
    env:
      QWEN36_DRAFTER: dflash2
      QWEN36_GDN_SPEC_FUSED: "1"      # fused gdn_spec_step verify (M2): verify 49.8 -> 37.7 ms at 8 rows, 70 -> 39-41 at 32 rows
      DFLASH_WEIGHTS: incoai/Qwen3.8-27B-DFlash2@dedf8df68adfb1afeaf7b7480c0a0243108177b4   # see single-user-dflash2
      QWEN36_DFLASH_BLOCK: "8"        # K_max = 7: the 4x8 bucket drafts the checkpoint's whole block; every bucket's K <= BLOCK-1
      QWEN36_DFLASH_MAX_PROMPT: "2048"
      QWEN36_DFLASH_SERVE_BLOCK: "32"
      QWEN36_DFLASH_BUCKETS: "8x4,4x8"  # verify geometries B x T (profiles/dual_bucket_spec.json): the decoder verifies in the
                                        # smallest bucket that seats the live requests and reseeds them across a switch bit-exactly
      QWEN36_DFLASH_RAGGED: "1"       # one speculative iteration per decode step: a bucket switch stays inside one step
      QWEN36_DFLASH_FOLD_SEED: "1"    # (both verify traces + both buckets' draft/extend traces fit: TRACE region 137 MiB of 1 GiB)
      QWEN36_DFLASH_CHUNKED_PREFILL: "1"  # chunked prefill (qwen36_vllm_dflash.py declares supports_chunked_prefill +
                                          # tt_prefill_chunk_tokens 2048 + tt_block_output_chunked_prefill; refused at
                                          # TP != 4 and max_num_seqs 1). Evaluated OFF vs ON: profiles/tp4_chunked/EVAL.md
    additional_config:
      tt:                               # deep-merged over serve.additional_config.tt
        prefill_chunk_tokens: 2048      # chunk size (a multiple of the model's tt_prefill_chunk_tokens and of block_size)
        chunked_prefill_decode_steps: 4 # speculative decode steps between two chunk steps while requests decode
        # Other chunk-policy keys keep their block-output defaults (vllm_tt_plugin/config.py
        # resolve_tt_prefill_chunk_policy): only a prompt with >= 8192 tokens left (chunked_prefill_min_tokens) that
        # arrives while an EARLIER request decodes (chunked_prefill_protect_prior_decoders) is chunked; bursts
        # (burst_longs 2) and idle steps prefill whole, exactly as without chunking.
    args:
      - [--max-num-batched-tokens, "262144"]
      - --no-async-scheduling           # the block-output contract and the chunk cadence are synchronous
default_profile: plain

verify:
  # plain: the class the override names imports, and the plugin parses the profile's override string to it (vllm first:
  # vllm_tt_plugin.platform imported cold hits a vllm.platforms circular import)
  - "from models.demos.blackhole.qwen36.tt.qwen36_vllm import Qwen36ForCausalLM; assert Qwen36ForCausalLM"
  - "import os, vllm; os.environ['TT_MODEL_CLASS_OVERRIDES']='TTQwen3_5ForConditionalGeneration=models.demos.blackhole.qwen36.tt.qwen36_vllm:Qwen36ForCausalLM,Qwen3_5ForConditionalGeneration=models.demos.blackhole.qwen36.tt.qwen36_vllm:Qwen36ForCausalLM'; from vllm_tt_plugin.platform import _tt_model_class_overrides as f; o=f(); assert o['TTQwen3_5ForConditionalGeneration'].endswith('qwen36_vllm:Qwen36ForCausalLM') and len(o) == 2, o"
  - "import os; os.environ['QWEN36_MTP']='0'; os.environ['QWEN36_DRAFTER']='mtp'; from models.demos.blackhole.qwen36.tt.model_config import mtp_requested_by_env; assert not mtp_requested_by_env()"
  - "import os; os.environ['QWEN36_DRAFTER']='mtp'; from models.demos.blackhole.qwen36.tt.qwen36_vllm_dflash import Qwen36DFlashForCausalLM as C; assert not C.model_capabilities['tt_adaptive_block_output'] and C.model_capabilities['output_tokens_per_step'] == 1, dict(C.model_capabilities)"
  # DFlash2 profiles
  - "import os; os.environ['QWEN36_DRAFTER']='dflash2'; from models.demos.blackhole.qwen36.tt.qwen36_vllm_dflash import Qwen36DFlashForCausalLM as C; assert C.model_capabilities['tt_adaptive_block_output'] and C.model_capabilities['tt_adaptive_block_batched'] and C.model_capabilities['output_tokens_per_step'] == 32, C.model_capabilities"
  - "from models.demos.blackhole.qwen36.tt.dflash2_serving import DFlash2ServingDecoder; assert DFlash2ServingDecoder"
  - "from models.demos.blackhole.qwen36.tt.dflash2_serving import DFlash2DualBucketDecoder, BucketPlanner; assert DFlash2DualBucketDecoder and BucketPlanner"
  - "import os; os.environ['QWEN36_DRAFTER']='dflash2'; from models.demos.blackhole.qwen36.tt.qwen36_vllm_dflash import parse_buckets, check_buckets; assert check_buckets(parse_buckets('8x4,4x8'), 8, 7, True) == ((8, 4), (4, 8))"
  - "import json; m=json.load(open('/opt/tt-metal/models/demos/blackhole/qwen36/vllm_bundle/qwen36/vllm_metadata.json')); assert m['main_class'].endswith(':Qwen36DFlashForCausalLM'), m"
  - "from vllm_tt_plugin.config import get_tt_block_output_kv_lookahead_tokens, is_tt_adaptive_block_output_model, is_tt_adaptive_block_batched, is_tt_adaptive_block_ragged"
  - "import os; os.environ['QWEN36_DRAFTER']='dflash2'; os.environ['QWEN36_DFLASH_RAGGED']='1'; from models.demos.blackhole.qwen36.tt.qwen36_vllm_dflash import Qwen36DFlashForCausalLM as C; assert C.model_capabilities['tt_adaptive_block_batched'] and C.model_capabilities['tt_adaptive_block_ragged']"
  - "from models.demos.blackhole.qwen36.tt.dflash2_decode import DFlash2Decoder; from models.demos.blackhole.qwen36.tt.dflash2_tp import DFlash2DrafterTP; assert DFlash2Decoder and DFlash2DrafterTP"
  # batch8-dflash2 chunked prefill: the model declares the block-output chunk contract only with the knob on (never with it
  # off: single-user-dflash2), and the plugin carries the chunk policy that reads prefill_chunk_tokens / chunked_prefill_decode_steps.
  - "import os; os.environ['QWEN36_DRAFTER']='dflash2'; os.environ['QWEN36_DFLASH_CHUNKED_PREFILL']='1'; from models.demos.blackhole.qwen36.tt.qwen36_vllm_dflash import Qwen36DFlashForCausalLM as C; c=C.model_capabilities; assert c['supports_chunked_prefill'] and c['tt_block_output_chunked_prefill'] and c['tt_prefill_chunk_tokens'] == 2048, dict(c)"
  - "import os; os.environ['QWEN36_DRAFTER']='dflash2'; os.environ.pop('QWEN36_DFLASH_CHUNKED_PREFILL', None); from models.demos.blackhole.qwen36.tt.qwen36_vllm_dflash import Qwen36DFlashForCausalLM as C; c=C.model_capabilities; assert not c.get('supports_chunked_prefill') and 'tt_block_output_chunked_prefill' not in c, dict(c)"
  - "from vllm_tt_plugin.config import resolve_tt_prefill_chunk_policy, is_tt_block_output_chunked_prefill, get_tt_prefill_chunk_extras"
  # common
  - "import vllm.model_executor.models.qwen3_5"
  - "import transformers.models.qwen3_5"
  - "from pathlib import Path; assert Path('/opt/tt-metal/tt_metal/fabric/mesh_graph_descriptors/p300_x2_mesh_graph_descriptor.textproto').is_file()"
  - "from pathlib import Path; assert Path('/opt/tt-metal/models/model_trace_region_sizes.yaml').is_file()"
  - "from pathlib import Path; assert Path('/opt/tt-metal/models/demos/blackhole/qwen36/vllm_bundle/qwen36/vllm_metadata.json').is_file()"

# Card: rendered by profiles/render_card.py p300x2 <this file> from profiles/card_p300x2_bench.md. Every {{...}} is a
# placeholder for a number measured on this build (lane B2 benchmarks); fill the source, then re-render.
card:
  description: |
    [Qwen/Qwen3.8-27B](https://huggingface.co/Qwen/Qwen3.8-27B) served with vLLM on a Tenstorrent P300x2 (2× P300 = 4 Blackhole chips, 4-way tensor parallel), 256K context. One image, three profiles: `plain` (default; plain batched decode for up to 32 users with every sampling option), `batch8-dflash2` (lossless [DFlash2](https://huggingface.co/incoai/Qwen3.8-27B-DFlash2) speculative decoding for 1 to 8 users, {{B8_GAIN_RANGE}}× `plain` per user) and `single-user-dflash2` (the fastest single stream: {{SU_CODE_1U}} tokens/s on coding prompts vs {{PLAIN_CODE_1U}} for `plain`). It replaces [changh95/qwen3.8-27b-dflash2-p300x2](https://huggingface.co/changh95/qwen3.8-27b-dflash2-p300x2), whose profiles now live here.
  quickstart: |
    ### Run

    ```bash
    tt-model pull  changh95/qwen3.8-27b-p300x2 --with-weights
    tt-model serve changh95/qwen3.8-27b-p300x2                                  # plain (default)
    tt-model serve changh95/qwen3.8-27b-p300x2 --profile batch8-dflash2         # needs the drafter weights below
    tt-model serve changh95/qwen3.8-27b-p300x2 --profile single-user-dflash2    # needs the drafter weights below
    tt-model profiles changh95/qwen3.8-27b-p300x2                               # list the profiles
    ```

    * `batch32` is now called `plain`: same configuration, new name. `--profile batch32` no longer exists; use `--profile plain` or no flag.
    * First boot converts the weights ({{FIRST_BOOT_MIN}} min); later boots take about {{WARM_BOOT_MIN}} min.

    ### Drafter weights (DFlash2 profiles only, once)

    ```bash
    hf download incoai/Qwen3.8-27B-DFlash2 --revision dedf8df68adfb1afeaf7b7480c0a0243108177b4
    ```

    The drafter is a second checkpoint; the server reads it from your Hugging Face cache. `plain` does not need it.

    ### Query

    OpenAI-compatible API on port 20000, model id `Qwen/Qwen3.8-27B`:

    ```bash
    curl -s http://localhost:20000/v1/chat/completions -H 'Content-Type: application/json' \
      -d '{"model": "Qwen/Qwen3.8-27B", "messages": [{"role": "user", "content": "Write a Python function that merges two sorted lists."}], "max_tokens": 512}'
    ```

    * Streaming, tool calls (`qwen3_coder` parser) and reasoning content (`qwen3` parser) work as in vLLM on every profile; `"chat_template_kwargs": {"enable_thinking": false}` turns thinking off.
    * `plain` supports every vLLM sampling option. The DFlash2 profiles return the target model's greedy trajectory: `temperature`/`top_p` affect only the first token; `logprobs`, structured outputs and images are not supported.

    ### Profiles at a glance

    | profile | users | context | KV pool | 1 user tok/s | TTFT 128 / 8k / 32k tokens | pick it for |
    |---|---|---|---|---|---|---|
    | `plain` (default) | 32 | 256K | 525K tokens | {{was 32.3}} | {{was 0.09 s}} / {{was 1.0 s}} / {{was 4.5 s}} | many users, long prompts, all sampling options (temperature, top-p/top-k, penalties, logprobs, structured outputs) |
    | `batch8-dflash2` | 8 | 256K | 525K tokens | {{was 56.1}} ({{was 112}} on code) | {{B8_TTFT_128}} / {{B8_TTFT_8K}} / {{B8_TTFT_32K}} | 1-8 greedy users, code; {{was 1.4-1.9}}x plain per user |
    | `single-user-dflash2` | 1 | 256K | 525K tokens | {{was 58.5}} ({{was 119}} on code) | {{was 0.14 s}} / {{was 1.2 s}} / {{was 5.1 s}} | exactly one greedy user, fastest per token |

    * `plain` is the old `batch32` profile under a new name. At 1 user it is {{PLAIN_VS_B8_1U}}x slower per user than `batch8-dflash2`; from {{CROSSOVER_USERS}} users on, its aggregate throughput is higher, and it is the only profile with sampled output and more than 8 users.
    * The DFlash2 profiles are lossless: each request follows the target model's greedy trajectory (up to bf16 near-ties). Their gain is largest on code and long answers ({{B8_GAIN_1K_OSL}}x at 1,024-token answers) and fades with prompt length ({{B8_GAIN_32K}}x at 32k-token prompts).

    ## Benchmarks

    tt-inference-server `--workflow benchmarks` (standard P300X2 grid: random prompts of exactly ISL tokens, `ignore_eos`, greedy, streaming) on one P300x2, measured {{BENCH_DATE}} on this image. `t/s` = aggregate output tokens per second, `(t/s/u)` = per user (= OSL / mean end-to-end latency); TTFT and TPOT are means. Placeholder cells `{{was X}}` show the value the previous package published.


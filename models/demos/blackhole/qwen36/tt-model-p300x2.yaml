      cost more than they return (random-token prompts, 8 users: 38 vs 50 t/s/u); the server then decodes plainly.
    - `batch`: a request with presence / frequency / repetition penalties or logprobs sends the whole decode step to
      host sampling for every user in it: a 16-user step goes from 27.9 to about 62 ms (one penalized request) or 68 ms
      (one logprobs request).
    - `batch` fits the users' contexts in a 1,408,000-token KV pool (`batch-dflash2` 1,376,000); requests that do not
      fit wait.
    - Prefix caching is on `batch` and `batch-dflash2`, at 1,024-token boundaries, and the first prompt that stores a
      prefix pays for it (about +0.5 s at 12K tokens, +0.9 s at 32K); `single-user` prefills a repeated long prompt
      again (131,072 tokens: about 21 s).
    - On an earlier test machine with a failed fan, one card dropped off PCIe under heavy 32-request prefill;
      `tt-smi -r` or a reboot brings it back.


    `batch` rows use the model's default sampling (temperature > 0), which now speculates where it pays too; the
    greedy rows run greedy. Both use random-token prompts, on which drafts are accepted much less than on natural text
    (see the table above): such requests are probed and then decoded plainly, which costs a little (1-user 128-token
    rows 60.3 vs 60.5 t/s/u plain, the 32K sampled row 49.3 vs 57.6), and the long-context rows vary run to run with how
    much of each request ends up speculating. The greedy rows of one or two requests follow where each random-prompt
    continuation goes, so they move a lot between builds whose numerics differ at all (the 8K row: 70.3 here, 52.6 in
    the previous release; the 32K row 95.8 vs 93.0).


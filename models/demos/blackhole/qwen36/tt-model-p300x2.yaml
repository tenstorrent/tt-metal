# tt-model-p300x2.yaml — Qwen/Qwen3.8-27B on a P300x2 (2x P300 boards = 4 Blackhole chips, (1,4) mesh) via vLLM, on the
# RESIDENT decode engine (qwen36_resident/: one persistent program per chip per decode step).
# ONE image; the lineup (user decision 2026-11-21: one engine for 1-32 users) and the default:
#   single-user          one user, lossless DFlash2 speculative decoding (greedy only), up to 256K context
#   batch                DEFAULT: 1-32 users on the rows-mode resident engine in ONE decode launch (row groups of 8
#                        rows, RESIDENT_ROW_GROUPS=4; shared 22,000-block KV pool, prefill gangs + one pipelined PP pass
#                        per prefill step, device sampling); TTFT-first scheduling is an option (prefill_gang_tokens 0)
# Retired 2026-11-22: multi-user (1-16 users, two 8-row launches) and the ttnn-path batch (17-32 users).
# Dropped from the earlier draft: plain single-user, single-user-mtp, multi-user-long (now multi-user's sizing).
# Replaces the ttnn-path manifest of the same repo (branch qwen36-p300x2-pkg, tt-metal b220c901dec, plugin 96d4416,
# image f6edb50771ac: profiles plain / batch8-dflash2 / single-user-dflash2). tt-model.yaml on this branch is the p150x2
# package (changh95/qwen3.8-27b-p150x2) and is untouched.
#
#   tt-model package --container models/demos/blackhole/qwen36/tt-model-p300x2.yaml --out <builds>
#   tt-model serve   <builds>/qwen3.8-27b-p300x2/tt_kernel_manifest.json [--profile single-user]
#   tt-model push    <builds>/qwen3.8-27b-p300x2 --private
#
# OPEN before packaging (search TBD): the plugin ref (resident-mu pushed to the fork), the adapter merge (lane serve's
# qwen38-res-mu-serve package-ready SHA, which must include ae776ee280c: RESIDENT_PREFILL_CHUNKS, without which
# multi-user ignores its chunk list and OOMs at build), the card's benchmark cells.
schema: "5.1"
repo: changh95/qwen3.8-27b-p300x2
name: qwen3.8-27b-p300x2
weights:
  repo: Qwen/Qwen3.8-27B
  revision: 1d4bf0f2ff6012fd82039f2fa52739d0dd7c60c0   # refs/main as validated, 2026-09-12 (every resident lane's runs)
kind: vllm-plugin
arch: blackhole

source:
  # Branch qwen38-resident-package = qwen38-resident (resident engine + multi-user rows + DFlash2 R=8 verify + 2-link
  # hub all-reduce) + lane serve's adapters (TBD merge) + lane sched's qwen38-res-sched (prefill gangs in serve_local,
  # one first-token launch per launch for a gang's prompts, lane prefill's PPPrefill.run_batch + HiFi2 / exp_approx SDPA
  # default merged, the multi pool fix) + this manifest. Build prerequisites in the worktree: submodules
  # initialised (git submodule update --init --recursive) and `runtime` a real directory, not a symlink (the docker
  # build context drops a symlink that points outside it).
  # Branch changh95/qwen38-host-path-fast = the above (058b7271552) + the rows adapter's page-table reload fix
  # (ae3c7739987: host-sampled decode no longer converts 16 x 4096 block ids one by one every step).
  # Branch changh95/qwen38-row-groups = the above + row groups: 1-32 users in one decode launch (RESIDENT_ROW_GROUPS),
  # the batched GDN heads, the per-group rmsnorm pipeline and the attention loop changes (2026-11-21).
  tt_metal: /home/ttuser/experiments/qwen38/src/tt-metal
  code:                                # import closure of qwen36_resident.generator_vllm (the adapters) + the DFlash2 drafter
    - qwen36_resident                  # resident engine, kernels, PP prefill, adapters + vllm_models bundle, spec serving
    - models/demos/blackhole/qwen36    # the ttnn DFlash2 drafter (tt/dflash2_tp.py, dflash2.py) and what it imports
    - models/common
    - models/tt_transformers
    - models/demos/qwen3_vl/tt/common.py
    - models/demos/utils
    - models/experimental/gated_attention_gated_deltanet
    - models/perf
    - models/tt_dit/utils/tensor.py
    - models/model_trace_region_sizes.yaml
    - models/model_targets.yaml
  ubuntu: "22.04"
  python: "3.12"

runtime:
  vllm: {version: "0.26.0"}
  # vllm-tt-plugin branch resident-mu = upstream tenstorrent/vllm-tt-plugin da7c018 (== the resident reference plugin) +
  # the TT chunk core the multi-user profile needs: a67c7f3 (aligned, one-long-in-flight chunked prefill), a0ee58a (a
  # split prompt's continuation keeps its state slot), 2c683cd (prefill_total_lens), 5618c8b (a split replay's last
  # one-token chunk is prefill work); then branch resident-mu-sched: a80d7a7 (prefill gangs, prefill_gang_tokens /
  # prefill_gang_idle_tokens), ae93205 (a request with no decode step yet does not cap the next gang), docs; merged with
  # fix-ttft2's resident-mu-ttft2 6641c17 as resident-mu-sched-ttft2 d5e699c (profiles/resident/sched/
  # plugin_ttft2_merge_note.txt), pushed to the fork as branch resident-mu-sched-ttft2. single-user uses upstream paths
  # only (adaptive block output for DFlash2; the chunk core is off at max_num_seqs 1).
  # Then branch changh95/qwen38-host-path-fast on top of d5e699c: host sampling draws unseeded top-k rows from the
  # top-k candidates (8128097) and applies penalties to the seen tokens only (c221edb): a 16-user step with one
  # penalized request 187.7 -> 60.7 ms with the adapter fix (device sampling 40.5 ms).
  plugin: {repo: https://github.com/changh95/vllm-tt-plugin, ref: c221edb65b5597329480f9696fe3061514475ce9}
  extra_models_dir: qwen36_resident/vllm_models    # main_class qwen36_resident.generator_vllm:Qwen36ResidentForCausalLM

serve:                         # common to every profile; a profile's env MERGES over this (it cannot unset a key)
  hardware: p300x2
  mesh_device: P150x4          # tt-metal's name for the (1,4) Blackhole mesh a P300x2 opens
  port: 8000
  max_model_len: 262144
  max_num_seqs: 1              # overridden by batch
  block_size: 64
  capabilities:
    tool_parser: qwen3_coder
    reasoning_parser: qwen3
  additional_config:
    tt:
      fabric_config: FABRIC_1D
      trace_region_size: 134217728     # resident decode trace + PP prefill traces + the DFlash2 drafter's (128 MiB)
      # (sample_on_device_mode is per profile: additional_config deep-merges, so a profile cannot unset it, and
      # batch-spec samples on the host)
  env:
    ARCH_NAME: blackhole
    MESH_DEVICE: P150x4
    TT_MESH_GRAPH_DESC_PATH: /opt/tt-metal/tt_metal/fabric/mesh_graph_descriptors/p300_x2_mesh_graph_descriptor.textproto
    TT_METAL_PINNED_MEMORY_CACHE_LIMIT_BYTES: "0"   # the pinned host-buffer cache stalls large uploads for 10-40 min
    RESIDENT_ATTN_RR: "1"                # attention KV chunks round-robin over the workers
    RESIDENT_PP_SDPA_FIDELITY: HiFi2     # PP prefill SDPA at HiFi2 ("fast")
    # The hubs' all-reduce uses min(RESIDENT_HUB_LINKS = 2, the links trained per neighbour): a mesh that trains one
    # link per neighbour (other cabling / descriptor) serves on the one-link path (logged at build), no failure.
    VLLM_ENGINE_READY_TIMEOUT_S: "3600"  # the resident model + traces build in ~6 min warm, longer with cold caches
    VLLM_PLUGINS: tt,tt_model_registry
    VLLM_RPC_TIMEOUT: "900000"
    VLLM_CONFIGURE_LOGGING: "1"
    TORCHDYNAMO_DISABLE: "1"
    HF_HUB_OFFLINE: "1"
  args:
    - --async-scheduling

serve_profiles:
  - name: single-user
    description: One request at a time with lossless DFlash2 speculative decoding (greedy only), up to 256K context.
    max_num_seqs: 1
    env:
      TT_MODEL_CLASS_OVERRIDES: "TTQwen3_5ForConditionalGeneration=qwen36_resident.generator_vllm:Qwen36ResidentDFlashForCausalLM"
      # The drafter (incoai/Qwen3.8-27B-DFlash2, block 8 -> 7 drafts per verify) is a second checkpoint the single
      # `weights` pointer cannot carry: resolved by repo id AT A PINNED COMMIT from the HF cache mounted at /hf (offline:
      # its cache has no refs/main). `hf download incoai/Qwen3.8-27B-DFlash2 --revision dedf8df68a...` once before
      # `tt-model serve` (quickstart). Also the code default (qwen36_resident.dflash.DRAFTER_WEIGHTS).
      DFLASH_WEIGHTS: incoai/Qwen3.8-27B-DFlash2@dedf8df68adfb1afeaf7b7480c0a0243108177b4
    additional_config:
      tt:
        sample_on_device_mode: decode_only   # the prefill's first token; blocks come from the model's own sampler
  - name: batch
    description: 1-32 concurrent requests on the rows-mode resident engine, all of them in one decode launch (one KV pool shared by the users, device sampling, full sampling controls); waiting prompts prefill together before their decodes start, so each user decodes at the decode-step speed. TTFT-first scheduling is an option (prefill_gang_tokens 0).
    max_num_seqs: 32                     # one launch of 4 row groups (32 rows)
    env:
      RESIDENT_ROW_GROUPS: "4"
      # KV pool = 22,000 blocks x 64: the 4-group build's buffers leave less DRAM than the former 16-user profile's
      # (29,440 blocks); validated at boot and in the card matrix (2026-11-22)
      RESIDENT_MAX_TOKENS_ALL_USERS: "1408000"
      RESIDENT_PREFILL_CHUNKS: "256,512,1024"
      # the rows build's core split: 28 attention workers, 4 GDN head groups
      RESIDENT_ATTN_WORKERS: "28"
      RESIDENT_HEAD_GROUPS: "4"
      # prefix caching in host memory (GB; 0 = off): a prompt's state at its last 1,024-token boundary (GDN states,
      # conv history, KV) is kept in host RAM, and a later prompt that starts with it (the next turn of a conversation,
      # a re-sent document) restores it instead of prefilling it; LRU within the budget
      RESIDENT_PREFIX_CACHE_GB: "32"
    additional_config:
      tt:                                # deep-merged over serve.additional_config.tt
        prefill_chunk_tokens: 1024       # the TT chunk core: a prompt over the gang cap splits into 1024-token spans
        prefill_gang_tokens: 2048        # prefill gangs; 0 = the interleaved (TTFT-first) policy
        sample_on_device_mode: decode_only   # the rows-mode hub feed
  - name: batch-dflash2
    description: 1-32 concurrent requests on the resident engine with DFlash2 speculative decoding for up to 8 greedy requests when it pays (8 users x 4 verify rows, 3 drafts per verify; greedy output as batch's except at bf16 near-ties), and the 32-row batch decode otherwise (more users, any sampled / penalized request, low acceptance), up to 256K context each, one shared KV pool, prefix caching as batch. Logprobs and structured output are not available on this profile (use batch).
    max_num_seqs: 32
    env:
      TT_MODEL_CLASS_OVERRIDES: "TTQwen3_5ForConditionalGeneration=qwen36_resident.vllm_adaptive:Qwen36ResidentAdaptiveForCausalLM"
      DFLASH_WEIGHTS: incoai/Qwen3.8-27B-DFlash2@dedf8df68adfb1afeaf7b7480c0a0243108177b4
      # both geometries in one process (ResidentModel share=): 28 attention workers leave the cores their 4 GDN head
      # groups need; the KV pool leaves ~1 GB a chip next to the second build (21,500 blocks x 64; 2026-11-23)
      RESIDENT_ATTN_WORKERS: "28"
      RESIDENT_HEAD_GROUPS: "4"
      RESIDENT_MAX_TOKENS_ALL_USERS: "1376000"
      RESIDENT_PREFILL_CHUNKS: "256,512,1024"
      # prefix caching in host memory, as batch (a prompt's state at its last 1,024-token boundary; for the speculating
      # geometry also the drafter's context taps of the window before it, ~108 MB an entry)
      RESIDENT_PREFIX_CACHE_GB: "32"
    additional_config:
      tt:
        sample_on_device_mode: decode_only   # the plain geometry's hub sampling (and a verify's sampled column 0)
        prefill_chunk_tokens: 1024           # the TT chunk core, as batch: every prompt prefills as batch prefills it
        prefill_gang_tokens: 2048
    # replaces serve.args. Async scheduling: plain-geometry steps overlap as batch's, speculative steps are drained one
    # by one (c32 TPOT 45.9 ms as batch, 2026-11-23). The drafter is the model's own (vllm-tt-plugin runner-model spec
    # contract: custom_class + the model_owned_drafter sentinel); K = 3, narrow decode in the plain geometry
    args:
      - --async-scheduling
      - ["--speculative-config", '{"method": "custom_class", "model": "vllm_tt_plugin.model_owned_drafter", "num_speculative_tokens": 3}']
default_profile: batch                   # user decision 2026-11-21: one engine for 1-32 users

card:
  description: >-
    [Qwen/Qwen3.8-27B](https://huggingface.co/Qwen/Qwen3.8-27B) on a P300x2 (4 Blackhole chips) with vLLM, on the
    resident decode engine: one persistent program per chip per decode step. Profiles: 1 to 32 users in one decode
    launch with a shared KV pool and prefix caching in host memory (the default); the same with
    [DFlash2](https://huggingface.co/incoai/Qwen3.8-27B-DFlash2) speculative decoding for up to 8 greedy users; and
    one user with lossless DFlash2 speculative decoding (up to 256K context).
  quickstart: |
    ### At a glance
    - Weights: [Qwen/Qwen3.8-27B](https://huggingface.co/Qwen/Qwen3.8-27B) @ `1d4bf0f`; drafter
      [incoai/Qwen3.8-27B-DFlash2](https://huggingface.co/incoai/Qwen3.8-27B-DFlash2) @ `dedf8df`
    - Hardware: P300x2 (QuietBox 2), one (1, 4) Blackhole mesh
    - Profiles: `batch` (default, 1-32 users), `batch-dflash2` (1-32 users, DFlash2 while at most 8 greedy users are
      live), `single-user`
    - `single-user` is **greedy only**: every request is decoded greedily (the server logs one warning for a request with
      temperature > 0). Speculation is lossless against the model's own greedy output; tokens can differ from plain
      decoding at bf16 near-ties.
    - DFlash2 helps most on short and medium prompts. On long, hard-to-predict text the gain shrinks to about 1.3x over
      plain decoding; it stayed faster at every length measured (32K to 250K).
    - New in this release (2026-11-23): the `batch-dflash2` profile (below); `batch`'s prefix cache no longer slows
      down a burst of new prompts (the 2026-11-22 release stored each one's prefix on its own: 2K-prompt c32 TTFT
      20.4 s, now 8.0 s).

    ### Which profile
    - One user, greedy (temperature 0): `single-user`.
    - Sampling, or 2 to 32 users: `batch` (one user on it gets about 60 t/s/u).
    - Mostly greedy requests, a few at a time (1-4), without logprobs or structured output: `batch-dflash2` (one user
      on natural text gets about 92 t/s/u vs 61 on `batch`, four about 66 vs 56; sampled requests and more users run
      as on `batch`).
    - If the time to the first token matters more than decode speed: `batch` with the TTFT-first option below.

    ### Get the drafter (`single-user`, `batch-dflash2`)
    ```bash
    hf download incoai/Qwen3.8-27B-DFlash2 --revision dedf8df68adfb1afeaf7b7480c0a0243108177b4
    ```

    ### Serve
    ```bash
    tt-model serve changh95/qwen3.8-27b-p300x2                                 # default profile: batch
    tt-model serve changh95/qwen3.8-27b-p300x2 --profile batch-dflash2
    tt-model serve changh95/qwen3.8-27b-p300x2 --profile single-user
    tt-model profiles changh95/qwen3.8-27b-p300x2
    ```

    ### How to query
    ```bash
    curl http://localhost:20000/v1/chat/completions -H 'Content-Type: application/json' -d '{
      "model": "Qwen/Qwen3.8-27B",
      "messages": [{"role": "user", "content": "Write a haiku about Blackhole chips."}],
      "max_tokens": 256, "temperature": 0
    }'
    ```

    ### Users x context (`batch`)
    The users share one KV pool of 1,408,000 tokens (22,000 blocks of 64 tokens; 8.7 KB per token per chip). A request
    can use up to `max_model_len` (262,144), and any mix of requests fits while their contexts add up to the pool; a
    request that does not fit waits. All active users decode together in one launch of 32 rows.

    | users | context per user when all are equally long |
    |---|---|
    | 1-5 | 262,144 |
    | 8 | 176,000 |
    | 16 | 88,000 |
    | 32 | 44,000 |

    ### Decode speed, users x context (`batch`)
    From the device step time with every user at the given context (no host or HTTP overhead); each cell is t/s/u /
    aggregate t/s:

    | users | context 128 | context 8K | context 32K |
    |---|---|---|---|
    | 1 | 60 / 60 | 59 / 59 | 57 / 57 |
    | 8 | 50 / 400 | 44 / 351 | 34 / 274 |
    | 16 | 36 / 578 | 30 / 485 | 22 / 349 |
    | 32 | 22 / 706 | 18 / 575 | 12 / 393 |

    ### `batch-dflash2`: speculative decoding for a few greedy users
    The `batch` engine plus a second, speculating build of the same model in the same process (shared weights and KV
    pool of 1,376,000 tokens): 8 users x 4 verify rows, 3 DFlash2 drafts per verify. Every prompt prefills as on
    `batch` (same chunks, prefill gangs and prefix cache). A greedy request (temperature 0, no penalties) moves into
    the speculating build after its first decode step, when that pays: the move re-runs the drafter's 2,048-token
    window while every live user waits, so it is skipped when too few tokens are expected to be left (an estimate
    from finished requests' lengths) or too many users would wait. The server then measures both kinds of step and
    goes back to plain steps for everyone when speculation stops paying (more than 8 users, any sampled or penalized
    request, or low draft acceptance). Greedy output can differ from `batch`'s at bf16 near-ties: in the check
    below, 3 of 8 256-token answers matched `batch` exactly and the others took an equally fluent different word after
    50-230 tokens.

    Served, natural-text prompts, greedy, 256 tokens (2026-11-23):

    | users | `batch-dflash2` t/s/u | `batch` t/s/u |
    |---|---|---|
    | 1 | 92 | 61 |
    | 2 | 82 | 59 |
    | 4 | 66 | 56 |
    | 8 | 46 | 51 |

    ### Prefill and decode on `batch`, and the TTFT-first option
    A step on this engine either prefills or decodes, never both, so prefill time that runs while a user decodes is a
    pause in that user's tokens. `batch` prefills the prompts that are waiting together, in one pipelined pass, before
    their decodes start: when many requests arrive together, each user then decodes at the decode-step speed, and the
    first tokens of the whole group come out after its prefill. With the TTFT-first option a long prompt is split into
    1024-token pieces between decode steps instead: first tokens come sooner, and every user's decode pauses while the
    others' prompts prefill. Turn it on by passing the profile's tt config with `prefill_gang_tokens` 0:

    ```bash
    tt-model serve changh95/qwen3.8-27b-p300x2 --additional-config '{"tt": {"fabric_config": "FABRIC_1D", "trace_region_size": 134217728, "sample_on_device_mode": "decode_only", "prefill_chunk_tokens": 1024, "prefill_gang_tokens": 0}}'
    ```

    ### Benchmarks (`vllm bench serve`)
    | profile | users | ISL / OSL | t/s | t/s/u | TTFT |
    |---|---|---|---|---|---|
    | `single-user` | 1 | 128 / 128 | 124.0 | 142.1 | 0.14 s |
    | `single-user` | 1 | 8192 / 128 | 73.5 | 175.2 | 1.02 s |
    | `single-user` | 1 | 32768 / 128 | 29.8 | 209.0 | 3.69 s |
    | `batch` | 1 | 128 / 128 | 55.4 | 60.6 | 0.21 s |
    | `batch` | 8 | 128 / 128 | 319.2 | 50.2 | 0.68 s |
    | `batch` | 16 | 128 / 128 | 449.0 | 36.1 | 1.04 s |
    | `batch` | 32 | 128 / 128 | 541.8 | 21.9 | 1.76 s |
    | `batch` | 32 | 128 / 1024 | 662.8 | 21.5 | 1.77 s |
    | `batch` | 32 | 2048 / 128 | 291.1 | 20.9 | 7.99 s |
    | `batch` | 32 | 8192 / 1024 | 399.0 | 17.8 | 24.56 s |
    | `batch` | 1 | 32768 / 128 | 18.9 | 57.6 | 4.58 s |
    | `batch-dflash2`, greedy | 1 | 128 / 128 | 63.1 | 69.7 | 0.21 s |
    | `batch-dflash2`, greedy | 2 | 128 / 128 | 105.9 | 65.5 | 0.37 s |
    | `batch-dflash2`, greedy | 4 | 128 / 128 | 163.0 | 50.6 | 0.46 s |
    | `batch-dflash2`, greedy | 8 | 128 / 128 | 255.0 | 38.1 | 0.52 s |
    | `batch-dflash2`, greedy | 8 | 2048 / 128 | 197.1 | 48.5 | 2.57 s |
    | `batch-dflash2`, greedy | 1 | 32768 / 128 | 17.1 | 44.2 | 4.62 s |

    `batch-dflash2` with the default sampling runs as `batch` (within 2% in every row above). Its greedy rows use
    random-token prompts, on which drafts are accepted less than on natural text (see the table above).

  performance: |
    | profile | ISL | OSL | concurrency | N | TTFT (ms) | prefill tok/s/u | decode tok/s/u | E2EL (s) |
    | --- | --- | --- | --- | --- | --- | --- | --- | --- |
    | `single-user` | 128 | 128 | 1 | 8 | 139 | 921 | 142.1 | 1.0 |
    | `single-user` | 8,192 | 128 | 1 | 2 | 1,015 | 8,070 | 175.2 | 1.7 |
    | `single-user` | 32,768 | 128 | 1 | 1 | 3,685 | 8,891 | 209.0 | 4.3 |
    | `single-user` | 131,072 | 128 | 1 | 1 | 21,710 | 6,037 | 93.9 | 23.1 |
    | `batch` | 128 | 128 | 1 | 4 | 213 | 602 | 60.6 | 2.3 |
    | `batch` | 128 | 128 | 8 | 32 | 675 | 190 | 50.2 | 3.2 |
    | `batch` | 128 | 128 | 16 | 64 | 1,040 | 123 | 36.1 | 4.6 |
    | `batch` | 128 | 128 | 32 | 128 | 1,764 | 73 | 21.9 | 7.6 |
    | `batch` | 128 | 1,024 | 32 | 64 | 1,767 | 72 | 21.5 | 49.4 |
    | `batch` | 2,048 | 128 | 32 | 64 | 7,988 | 256 | 20.9 | 14.1 |
    | `batch` | 8,192 | 1,024 | 32 | 64 | 24,555 | 334 | 17.8 | 82.1 |
    | `batch` | 32,768 | 128 | 1 | 1 | 4,578 | 7,157 | 57.6 | 6.8 |
    | `batch-dflash2` | 128 | 128 | 1 | 4 | 200 | 640 | 60.5 | 2.3 |
    | `batch-dflash2` | 128 | 128 | 8 | 32 | 688 | 186 | 50.1 | 3.2 |
    | `batch-dflash2` | 128 | 128 | 32 | 128 | 1,765 | 73 | 21.9 | 7.6 |
    | `batch-dflash2` | 2,048 | 128 | 32 | 64 | 8,051 | 254 | 20.9 | 14.1 |
    | `batch-dflash2` | 8,192 | 1,024 | 32 | 64 | 24,724 | 331 | 17.8 | 82.2 |
    | `batch-dflash2`, greedy | 128 | 128 | 1 | 4 | 208 | 615 | 69.7 | 2.0 |
    | `batch-dflash2`, greedy | 128 | 128 | 4 | 16 | 458 | 279 | 50.6 | 3.0 |
    | `batch-dflash2`, greedy | 128 | 128 | 8 | 32 | 521 | 246 | 38.1 | 3.9 |
    | `batch-dflash2`, greedy | 2,048 | 128 | 8 | 16 | 2,575 | 795 | 48.5 | 5.2 |

    Means of `vllm bench serve` runs (random prompts, ignore_eos, the model's default sampling; `single-user` greedy) on
    a P300x2 with chip clocks logged: `single-user` 2026-11-20 (median 1350 MHz), `batch` and `batch-dflash2` 2026-11-23
    (median 1350 MHz, at most 61 °C; prefix cache on, a different random prompt per row). `single-user` decode speed
    follows how predictable the text is (DFlash2 acceptance), so it varies by prompt. Accuracy: teacher-forced on
    natural text, the `batch` engine's next-token NLL / top-1 matched the previous release's within noise (1.5269 /
    0.6548 vs 1.5278 / 0.6562 at 128-384 tokens).

    Prefix caching (`batch` and `batch-dflash2`, on by default: `RESIDENT_PREFIX_CACHE_GB`, 32 GB of host RAM, 0 turns
    it off): a prompt's state at its last 1,024-token boundary is kept in host memory, and a later prompt that starts
    with it restores it instead of prefilling it. A 3-turn chat over a 12,021-token document (greedy, served,
    2026-11-23): TTFT 1.95 / 0.68 / 0.67 s on `batch` (1.99 / 0.71 / 0.72 s on `batch-dflash2`) vs 1.42 / 1.38 / 1.37 s
    without the cache (2026-11-22); the answers are identical. Storing a long prompt that misses the cache costs its
    first request about +0.9 s at 32K tokens (the 32K TTFT above).
  limitations: |
    - `single-user` decodes every request greedily (temperature and sampling parameters are ignored, with one
      logged warning).
    - `batch` has no speculative decoding; `batch-dflash2` speculates for at most 8 greedy users at a time, and only
      while every live request is greedy without penalties.
    - `batch-dflash2` refuses requests with logprobs or structured output (guided decoding, response_format), and
      logit_bias, bad_words, allowed_token_ids or min_tokens (use `batch` for those).
    - `batch-dflash2`: a greedy request's move into speculation re-runs the drafter's 2,048-token window (up to ~0.3 s
      a user, every live user waits): a short answer on a long context can finish later than on `batch` (turn 2 of

agents:
  rules:
  - 'Always use 2D fabric: the mesh opens with ttnn.FabricConfig.FABRIC_2D (spec box.device_params). Configure CCLs, dispatch
    and combine for it; never open a device or build a test with FABRIC_1D or FABRIC_1D_RING.'
  - 'Text decoder only: never build, load or test the vision encoder, audio encoder or MTP layers.'
  - 'Weights: qkv_proj and the dense MLP are fp8 e4m3 with a float32 weight_scale_inv per 128x128 block; experts are mxfp4
    (uint8, two e2m1 values per byte, low nibble first unless the HF code says otherwise) with an e8m0 weight_scale per 32
    input elements; o_proj, norms, router, sink bias and embeddings are bf16. The CPU reference dequantizes these exactly
    as the HF code / checkpoint define them. On device the experts are bfp8 (never bfp4).'
  - 'The CPU reference (reference role): the full 48-layer model is ~618 GB in bf16 and does not fit this host''s 503 GB RAM.
    The R.1 sanity hook hf_model(spec, None) must keep expert weights packed (mxfp4 + scale) and dequantize each expert when
    it runs, or stream layers; the layer-subset reference (layers 0-5) can be dequantized to bf16 up front. Keep the RL checkpoint''s
    own modeling code as the source of truth.'
  - 'Owner-approved parallelism (plan role: implement this exactly, do not choose another scheme): mesh 1x4, context
    parallelism CP=4 over the sequence (each chunk of S tokens is split into 4 contiguous slices of S/4, chip c holds slice
    c of the residual stream and of the KV cache). Attention TP=1: every chip holds all 64 Q heads and all KV heads with
    the full qkv_proj and o_proj (no all_reduce after o_proj); full attention sees the K/V of the other chips (ring or
    all-gather of K/V), sliding attention (window 128) gets the previous 128 positions across slice boundaries. Dense MLP
    (layer 0) TP=1, local to each slice. Routed experts EP=4, TP=1: chip c stores experts 64c..64c+63 as complete experts
    (never split an expert), tokens are dispatched across the 4 chips to their experts and combined back (the 2x2 run''s
    dispatch/combine forks for a multi-chip axis). Router replicated per chip on its own slice.'
  - 'Precision: routed experts compute at HiFi4 (unified_routed_expert_moe high_precision), bfp8 expert weights, bf16
    activations; HiFi4 everywhere else too, keeping the 1x4 sliding-attention preset "S". Target chunk 5120 tokens
    (1280 per chip).'
  - 'Op changes: never edit existing TTNN ops (ttnn/cpp/.../operations). Reuse or extend a fork in ttnn/ttnn/bringup
    (check INDEX.md first) or create one with fork_op.py (skill bringup-fork-op: tests/source.yaml with a recorded
    baseline, CHANGELOG entry, INDEX.md row, ./build_metal.sh). An extension goes behind an option that defaults off,
    with the default program unchanged; no regressions for 1x4 MiMo, 2x2 MiMo, Gemma or ERNIE.'

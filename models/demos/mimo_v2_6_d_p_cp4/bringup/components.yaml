- block_type: full_moe
  step: router
  tag: COMPOSED
  ttnn: ttnn.linear (fp32 weight [4096 -> 256], HiFi4 + fp32 acc, fp32 out) on the local [S/4, 4096] slice -> ttnn.sigmoid -> ttnn.add (fp32 e_score_correction_bias)
    -> ttnn.topk (8) -> ttnn.gather (unbiased sigmoid) / ttnn.sum / ttnn.div -> idx/weights [S/4, 8]; dense [S/4, 256] via ttnn.scatter (bf16)
    only for the boundary
  reuse: models/demos/mimo_v2_6_d_p/tt/router.py:TtRouter (mode fp32), models/demos/deepseek_v3_d_p/tt/moe/tt_moe_gate_prefill.py
  searched:
  - 'repo_map: noaux_tc router with a large correction bias (mimo_v2_6_d_p/tt/router.py)'
  - 'known_issues: A large correction bias makes noaux_tc top-k selection precision-bound; moe_grouped_topk selects on TF32 keys; scatter has
    no fp32 TILE path'
  notes: 'Changed for CP=4: replicated weights, each chip routes only its own S/4 rows (the prior routed all S rows on every chip); no CCL. Carries
    over: fp32 logits + bias, SFPU sigmoid + ttnn.topk (moe_grouped_topk sorts TF32 keys), weights = unbiased sigmoid of the chosen 8 renormalized,
    route_scale 1.0.'
- block_type: full_moe
  step: experts
  tag: COMPOSED
  ttnn: ttnn.experimental.deepseek_prefill.masked_bincount (local [S/4, 8] idx) -> ttnn.bringup.offset_cumsum (cluster_axis=1, 4 devices, [1,
    256] histograms all_gathered) -> ttnn.bringup.dispatch (dispatch_group_size 4, num_dispatch_groups 1, cluster_axis=1, fabric, Topology.Linear)
    -> ttnn.bringup.unified_routed_expert_moe (Silu, bfp8 weights, bf16 ROW_MAJOR x, high_precision=True, HiFi4 + fp32 dest) -> ttnn.bringup.combine
    (cluster_axis=1, fabric) -> ttnn.experimental.deepseek_prefill.post_combine_reduce (weighted top-k sum, dispatch table) -> experts_out [S/4,
    4096] on chip c, no all_reduce / all_gather
  reuse: models/demos/mimo_v2_6_d_p_2x2/tt/experts.py:TtExperts (the fabric dispatch/combine pipeline on the forks, DISPATCH_AXIS and group size
    changed), models/demos/mimo_v2_6_d_p/tt/experts.py (LazyExpertWeights, bfp8 cache), models/demos/deepseek_v3_d_p/tt/moe (tt_dispatch.py, tt_combine.py,
    init_helpers.py:ExpertMapping)
  searched:
  - 'repo_map: MoE expert parallel (deepseek_v3_d_p/tt/moe), Fork tests for a dispatch group of several devices, Routed experts at a chosen fidelity'
  - 'ttnn/ttnn/bringup/INDEX.md: dispatch / combine / offset_cumsum forks (1-device axis patch; source behaviour on a multi-device axis), unified_routed_expert_moe
    (high_precision)'
  - 'mimo_v2_6_d_p_2x2/tt/experts.py: dispatch_group_size 2 over axis 0 with fabric works on the forks unchanged'
  - 'deepseek_v3_d_p/tt/moe/tt_dispatch.py: dispatch_group_size + cluster_axis parameters (DeepSeek runs groups of 4-8 chips)'
  - 'known_issues: TtReduceModule always reduce-scatters, Expert counts are global, unified_routed_expert_moe works in place, bfp8 expert activations
    fail on a layer with outlier channels'
  notes: 'Changed for CP=4: the tokens are already split by sequence, so each chip dispatches its own S/4 rows over the whole 1x4 mesh: one dispatch
    group of 4 chips along axis 1 (DGS 4, the 2x2 run used DGS 2 on axis 0), experts_per_chip 64, chip c holds experts 64c..64c+63 as complete
    experts (ExpertMapping device_idx = c; never split). expert_dispatch_table (1, 256) replicated; counts / region offsets [1, 256] global per
    chip. max_dispatched_tokens_per_expert = 4 x S/4 = S, buffer capacity factor 8 (worst case). With one group, combine + post_combine_reduce
    leaves each chip with its own rows summed over all 256 experts, so the prior''s all_reduce (1x4) and the 2x2 all_reduce + all_gather are gone.
    Carries over: bfp8 experts from mxfp4 x e8m0 dequantized on the host at load (low nibble first), high_precision unified kernel at HiFi4 (layer
    5 outlier channels need bf16 x), no shared expert. Axis 1 with 4 devices is untested for these forks in this repo (the forks keep the source
    op''s behaviour there); if it misbehaves, fix it in the forks behind a default-off option (rule 6).'
- block_type: full_moe
  step: ffn_residual
  tag: NATIVE
  ttnn: ttnn.add (or fused into the next block's attn_norm)
  reuse: models/demos/mimo_v2_6_d_p/tt/residual.py
  notes: out = h_mid + experts_out, [S/4, 4096] per chip (CP slice); both operands are slices of the same rows, so no CCL. Module unchanged from
    1x4.
- block_type: model
  step: embed
  tag: COMPOSED
  ttnn: ttnn.to_layout(TILE) -> ttnn.minimum(ids, 152575) (uint32, exact) -> ttnn.to_layout(ROW_MAJOR) -> ttnn.embedding (replicated [152576,
    4096] bf16) on the local S/4 ids
  reuse: models/demos/mimo_v2_6_d_p/tt/model.py:TtEmbedding, models/demos/mimo_v2_6_d_p/tt/runners/adapter.py:_clamp_ids
  searched:
  - 'repo_map: All-device model'
  - 'known_issues: Masking the engine''s pad id when the vocab is not a power of two, Engine input'
  notes: 'Changed for CP=4: chip c embeds only its S/4 ids (the engine input [sp=4, 1, chunk/4] is already sharded over axis 1), so the residual
    starts CP-sliced with no CCL; the 2x2 ids all_gather is not needed. Table replicated as before.'
- block_type: model
  step: final_norm
  tag: NATIVE
  ttnn: ttnn.bringup.rms_norm (local [S/4, 4096], model.norm.weight, eps 1e-6)
  reuse: models/demos/mimo_v2_6_d_p/tt/rms_norm.py:TtRMSNorm
  notes: Only after layer 5 in this subset bring-up; per slice, no CCL.
- block_type: model
  step: lm_head
  tag: COMPOSED
  ttnn: ttnn.slice (last 32 rows of the local slice) -> ttnn.all_gather (cluster_axis=1, dim -2) -> ttnn.slice (the block of the chip that holds
    the last real token, chip 3 for a full chunk) -> ttnn.linear (vocab-sharded lm_head, 38144 rows per chip) -> ttnn.all_gather (cluster_axis=1,
    dim -1)
  reuse: models/demos/mimo_v2_6_d_p/tt/model.py, models/demos/deepseek_v3_d_p/tt/tt_lm_head.py
  searched:
  - 'repo_map: All-device model'
  - ls models/demos/deepseek_v3_d_p/tt (tt_lm_head.py)
  notes: 'Changed for CP=4: the last tokens live on one chip (chip 3 for a full chunk; for a padded last chunk, the chip holding actual_end -
    1, chosen on the host from the chunk geometry, which is a static slice per program), so a tiny [32, 4096] gather over axis 1 brings them to
    every chip before the vocab-sharded matmul. 152576 / 4 = 38144 = 1192 tiles per chip; untied lm_head bf16.'

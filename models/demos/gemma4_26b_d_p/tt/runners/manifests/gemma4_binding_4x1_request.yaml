# Gemma-4 26B-A4B prefill runner, 1 rank, QuietBox 4x1 (SP=4 x TP=1), request mode.
# Launch: models/demos/common/prefill/runners/run_pipeline_prefill.sh models/demos/gemma4_26b_d_p/tt/runners/manifests/gemma4_binding_4x1_request.yaml localhost:1
# tt-run forwards only TT_/ARCH_/WH_/TTNN_/DEEPSEEK_/MESH_ vars, so every PREFILL_* lives here.
mesh_graph_desc_path: models/demos/gemma4_26b_d_p/tt/runners/manifests/qb_4x1_mesh_graph_descriptor.textproto
rank_bindings:
  - {rank: 0, mesh_id: 0, mesh_host_rank: 0, env_overrides: {}}
global_env:
  PREFILL_MANIFEST: "models/demos/gemma4_26b_d_p/tt/runners/manifests/gemma4_26b_d_p.json"
  PREFILL_MODEL: "gemma4_26b_d_p"
  PREFILL_NUM_LAYERS: "30"
  PREFILL_SP: "4"
  PREFILL_TP: "1"
  PREFILL_FABRIC_MODE: "1d_ring"      # 1D ring: MoE dispatch sparse multicast (2x vs 2d_torus_y)
  PREFILL_MAX_SEQ_LEN: "32768"
  PREFILL_CHUNK_SIZE: "4096"        # chunk/SP must be >= sliding window (1024)
  PREFILL_NUM_USERS: "2"
  PREFILL_H2D_SERVICE_ID: "gemma4_prefill"
  PREFILL_ENABLE_LAYER_ACK: "1"
  PREFILL_HF_MODEL: "/localdev/mstaletovic/hf_models/gemma-4-26B-A4B-it"
  LOGURU_LEVEL: "INFO"

  step: attention
  tag: COMPOSED
  ttnn: 'kv stem: ttnn.linear kv_a_proj_with_mqa (K-split) -> reduce over axis 1 -> ttnn.rms_norm (kv_a_layernorm, eps 1e-6) on the 512 latent

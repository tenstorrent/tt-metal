    2c + r); each chip dispatches its row''s S/2 tokens within its column. gate_up_proj [256, 4096, 6144] is split on the host into gate (rows
    0-2047) and up (rows 2048-4095). bf16 checkpoint -> bfp8 weights (never bfp4). Keep the expert input bf16 (outlier channels, known issues);
    check the per-channel max of ffn_norm on layers 1-5 first. Fallback: the per-expert loop (extract -> ttnn.linear SwiGLU with ttnn.clamp ->
    insert). expert_token_counts / region offsets are [1, 256] (global ids). The component boundary experts_out is the full [S, 6144]; after the
    reduce_scatter each chip holds its [S/2, 3072] block.'
- block_type: moe_shared
  step: shared_expert
  tag: COMPOSED
  ttnn: ttnn.linear gate / up (column-parallel, 1024 per chip, bf16 weights, HiFi4 + fp32 acc) -> ttnn.multiply (SILU) -> ttnn.linear down (row-parallel)
    -> reduce_scatter over axis 1 -> [S/2, 3072]
  reuse: models/demos/deepseek_v3_d_p/tt/moe/tt_shared_expert.py; models/demos/mimo_v2_6_d_p_2x2/tt/mlp.py:TtDenseMLP
  searched:
  - 'repo_map: MoE tensor parallel, decode-style (shared_mlp.py)'
  - grep TtSharedExpert models/demos/deepseek_v3_d_p/tt/moe
  notes: '1 shared expert, SwiGLU 2048, no clamp. Perf option for the assemble step: add the shared partial to the routed partial before one reduce_scatter.'
- block_type: moe_shared
  step: moe_combine
  tag: NATIVE
  ttnn: ttnn.add (experts_out + shared_out, [S/2, 3072] per chip)
  reuse: none
  notes: mlp_out = experts_out + shared_out; no collective (both inputs are already reduce-scattered).
- block_type: moe_shared
  step: ffn_residual
  tag: COMPOSED
  ttnn: ttnn.slice (post gate columns) -> 4 x ttnn.addcmul(stream_j, mlp_out, post_j) in fp32 -> ttnn.concat
  reuse: models/demos/deepseek_v3_d_p/tt/mhc/tt_mhc.py:TtMHCWrap.hc_post (same module as attn_residual)
  searched: *id001
  notes: out_j = h_mid_j + post_j * mlp_out; fp32; no collective. The block output stays resident as [S/2, 4 x 3072] fp32.
- block_type: model
  step: embed
  tag: COMPOSED
  ttnn: ttnn.embedding (table [120832, 3072] bf16 per chip, hidden split over columns; token ids [S/2] per row) -> ttnn.typecast fp32 -> ttnn.repeat
    (4 streams) -> [S/2, 4 x 3072]
  reuse: models/demos/deepseek_v3_d_p/tt/tt_parallel_embedding.py:TtParallelEmbedding; models/demos/deepseek_v3_d_p/tt/mhc/tt_mhc.py:mhc_expand
  searched:

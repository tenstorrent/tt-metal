  step: indexer
  tag: COMPOSED
  ttnn: 'ttnn.linear wk (K-split, bf16) -> reduce over axis 1 -> ttnn.layer_norm (k_norm with bias, eps 1e-5) -> ttnn.experimental.deepseek_prefill.rotary_embedding_indexed

    holds chunk rows [r*S/2, (r+1)*S/2) and hidden columns [c*3072, (c+1)*3072) of every stream; the residual is [S/2, 4 x 3072] fp32 per chip.'
- block_type: moe_full
  step: attn_hc_pre
  tag: COMPOSED
  ttnn: ttnn.slice (4 stream column blocks, 3072 wide) + ttnn.slice (4 gate columns) -> ttnn.multiply + 3 x ttnn.addcmul (fp32)
  reuse: models/demos/deepseek_v3_d_p/tt/mhc/tt_mhc.py:_streams / _cols / _mix
  searched: *id001
  notes: attn_x [S/2, 3072] per chip = sum_j pre_j * stream_j, fp32 accumulate, output bf16 (the reference casts to the stream dtype; the device

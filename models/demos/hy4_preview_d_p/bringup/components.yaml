- block_type: moe_full
  step: attn_norm
  tag: COMPOSED
  ttnn: ttnn.rms_norm_pre_all_gather -> all_gather of the [S/2, 32] stats over axis 1 -> ttnn.rms_norm_post_all_gather (weight split by column,

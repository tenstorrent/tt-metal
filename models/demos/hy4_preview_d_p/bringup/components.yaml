  step: q_a
  tag: COMPOSED
  ttnn: ttnn.linear (K-split q_a_proj [3072, 2048] per chip, bf16, HiFi4 + fp32 acc) -> ttnn.experimental.reduce_scatter_minimal_async + ttnn.experimental.high_bw_all_gather
    over axis 1 (or ttnn.all_reduce(cluster_axis=1)) -> ttnn.rms_norm (q_a_layernorm, eps 1e-6)
  reuse: models/demos/deepseek_v3_d_p/tt/mla/mla.py:ttMLA._q_a_latent
  searched:
  - 'repo_map: MoE EP row points at deepseek_v3_d_p; no MLA row'
  - 'models/demos/deepseek_v3_d_p/tt/mla/mla.py: _q_a_latent is the q_a stem shared by the indexer and _q_stem'

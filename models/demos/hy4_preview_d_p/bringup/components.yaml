  - 'models/demos/deepseek_v3_d_p/tt/mhc/tt_mhc.py: TtMHCWrap / TtMHCHead / _project / _mix (DeepSeek-V4 mHC, single device, packed [1,1,T,n*C]
    streams)'
  - 'ttnn.experimental.deepseek_prefill.mhc_split_sinkhorn: computes pre / post / comb with a Sinkhorn on comb; Hy4 has no comb (no mixing matrix)
    and post is 2*sigmoid, so the fused op does not fit and is not used'
  - 'grep hc_pre / hyper_connection in models/: only deepseek_v3_d_p (mhc, attn_res) and the Hy4 reference'
  - 'ttnn/ttnn/bringup/INDEX.md: rms_norm_ttnn'
  notes: The reference records hc_head [S, H] and final_norm [S, H]; both are on the device for every row (the ladder compares final_hidden).
    fp32 up to the norm.
- block_type: model
  step: lm_head
  tag: NATIVE
  ttnn: ttnn.linear (last token's final_norm, fp32 [1, 6144] broadcast to all 4 chips; lm_head [6144, 30208] bf16 per chip, vocab-sharded; HiFi4
    + fp32 acc, fp32 out) -> ttnn.all_gather of the logits over both axes
  reuse: models/demos/deepseek_v3_d_p/tt/tt_lm_head.py:TtLMHead
  notes: HF runs the LM head in fp32 (enable_lm_head_fp32); the checkpoint is bf16, so bf16 weights are exact and fp32 activations + fp32 accumulation
    match it. Last tokens only (the last token lives on mesh row 1).

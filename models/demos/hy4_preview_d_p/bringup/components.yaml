  - 'known_issues: Contract cache on a 2x2 mesh with no sequence parallelism (engine input [sp=2, 1, chunk/2] over axis 0)'
  notes: The engine's uint32 input is already [sp=2, 1, chunk/2] over axis 0, the row split this plan uses, so no gather of ids. Pad ids past
    actual_end are clamped on the device with ttnn.minimum(ids, V - 1) (V = 120832 is not a power of two).
- block_type: model
  step: final_norm
  tag: COMPOSED
  ttnn: 'hc_head: ttnn.matmul (streams x hc_head_fn slice [12288, 4], fp32, HiFi4) + partial sum of squares -> ttnn.all_reduce(cluster_axis=1)
    of [S/2, 32] -> ttnn.rsqrt / ttnn.multiply(scale) / ttnn.add(base) / ttnn.sigmoid (+1e-6) -> ttnn.multiply + 3 x ttnn.addcmul -> [S/2, 3072];
    then ttnn.all_gather(dim -1, cluster_axis=1) -> ttnn.bringup.rms_norm (model.norm, eps 1e-5)'
  reuse: models/demos/deepseek_v3_d_p/tt/mhc/tt_mhc.py:TtMHCHead; ttnn.bringup.rms_norm caller in models/demos/mimo_v2_6_d_p_2x2/tt/rms_norm.py
  searched:

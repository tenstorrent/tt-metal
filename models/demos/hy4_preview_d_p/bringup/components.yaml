  reuse: models/demos/deepseek_v3_d_p/tt/tt_distributed_rms_norm.py:TtDistributedRmsNorm
  searched:
  - 'repo_map: no distributed-norm row; ttnn/ttnn/bringup/INDEX.md rms_norm_ttnn (single-chip rows, needs the whole hidden on the chip)'
  - 'grep rms_norm_pre_all_gather models/demos/deepseek_v3_d_p: tt_distributed_rms_norm.py'
  notes: 'input_layernorm, w * rms(x) (plain w, eps 1e-5). Output stays column-split [S/2, 3072] because ttMLA''s q_a / kv_a projections, the

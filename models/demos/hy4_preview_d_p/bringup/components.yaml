  reuse: models/demos/deepseek_v3_d_p/tt/mla/indexer.py:TtIndexer (score / write_k / select_local / finalize_distribution), config sharing from
    models/demos/deepseek_v3_d_p/reference/glm_5_2_config.py (indexer_types)
  searched:
  - hy4_preview_findings.md component table (Indexer)
  - 'models/demos/deepseek_v3_d_p/tt/mla/indexer.py: TtIndexer, _bc_rope_pe, write_k, score'

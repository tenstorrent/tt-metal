findings:
- id: R2-hf-rope-interleaved
  task: R.2
  kind: REFERENCE
  title: transformers 5.17's hy_v4 port uses rotate-half RoPE; Hy4 is served with interleaved RoPE (MLA and indexer)
  detail: >-
    With the vendored 5.17 modeling code as released, the full-model HF sanity passed the smoke ("Paris") but scored top-1
    next-token accuracy 0.237 on the first 2048 prompt tokens (floor 0.4). The CPU reference matched that oracle at PCC 1.0 on
    all 6 layers, since both followed the same code. SGLang's Hy4 support (srt/configs/hy_v4.py) sets rope_interleave = True
    and indexer_rope_interleave = True; DeepseekV2AttentionMLA and the DSA indexer turn these into is_neox_style=False (GPT-J
    pairs). With interleaved RoPE in both places (vendored oracle: apply_rotary_pos_emb_interleaved, marked "bring-up fix";
    reference: hy4_ref.apply_rope), accuracy is 0.965 and parity is unchanged (PCC 1.0). For the device: the checkpoint's
    rope dims are already in interleaved (Meta) order for MLA q/k_pe and for the indexer's last 64 dims, so no host
    permutation is needed for rotary_embedding_llama-style kernels. hy4_preview_findings.md still says to "permute the rope
    columns on the host (rotate_half to interleaved)"; that no longer applies. The q_a / kv_a RMSNorm eps is 1e-6 in HF and
    1e-5 in SGLang; the reference follows HF, a negligible difference.
- id: C-indexer-score-precision
  task: C.dense_full.indexer
  kind: OP
  title: ring_indexer_score_dsa is too coarse for Hy4's top-2048 in bf16 DEST; forked with opt-in fp32 DEST
  detail: >-
    On the layer-0 golden (s4096 chunk 1) the source op (bf16 DEST, HiFi4, q 64 x k 256) gave logits rel 0.024 vs fp32
    (rows ~1.7% low: truncating bf16 MAC over 32 heads; plus the blocked custom gate multiply at k > 32, which has no
    fidelity phases) and top-k set overlap 0.9853 < 0.99, while CPU top-k on the same device q / k / w scored 0.9987.
    k_chunk 32 (per-column path, fidelity honoured) lifts the source op to 0.9926. The indexer_score fork adds opt-in fp32
    DEST (and the srcA reconfig its causal mask needs): rel 0.0036, overlap 0.99708 = fp32 scores rounded to bf16.
    The plan's host permutation of wq_b / wk / k_norm is not needed: rotary_embedding_indexed takes rotary_offset=64, so
    the index-key cache stays in checkpoint order. Perf of k_chunk 32 at 56k is unmeasured (perf step).
- id: P1-attn-matmul-configs
  task: P.1
  kind: PERF
  title: explicit 2D-mcast configs make attention's q_b / linear_gate / o_proj 2.8x faster, bit-identical
  detail: >-
    Per-op profile (rung last, 51200->56320) put attention at ~35.5 ms per layer: sparse_sdpa 13.9, linear_gate 6.57,
    o_proj 6.49, q_b 2.20 ms; the full-mesh prefix gather was only 0.66 ms. ttnn's auto config for these HiFi4 + fp32 dest
    matmuls (fp32 output for gate / o_proj) runs ~39 TFLOPS. tt/attention.py:mm_program_config (in0_block_w 16, output
    block 8 x 8, per-core M / N over the 11x10 grid) gives 2.29 / 2.28 / 0.80 ms with output bit-identical to the default
    config. HY4_ATTN_MM=default keeps the old configs. sparse_sdpa is now the largest attention cost.
- id: X3-profiler-buffer-timeline
  task: X.3
  kind: INFRA
  title: the profile timeline needs a profiler buffer above 1000 programs; Hy4 layers 0-5 run 1177 per chip per chunk
  detail: >-
    X.3 failed only on timeline_ok (timeline got 1170-1172 programs per chip, op mode counted 1177). The device
    profiler's DRAM buffer holds 1000 programs per RISC per core by default (12 words each); the timeline run reads it
    once per chunk, so cores that run every program drop markers and some tail programs vanish. Not a module bug, and
    the fix role's allowed paths (ttnn/ttnn/bringup, knowledge, breadcrumbs, findings) cannot fix it cleanly. With
    TT_METAL_PROFILER_PROGRAM_SUPPORT_COUNT=3000 on the same test_profile command the timeline aligns: device 461.4 ms =
    kernels 459.3 + gaps 2.0 (chip 2), host dispatch 131.2 ms, 829 op rows, test PASS. Needs a framework or gate-env
    change (set the count before the mesh opens when the op profile is on).
- id: X3-positions-precompile-double-run
  task: X.3
  kind: INFRA
  title: test_positions without --no-precompile runs positions 4x too far and hangs (spec mutated by the collect pass)
  detail: >-
    Running the X.3 gate by hand (no --no-precompile) the precompile collect pass ran test_positions once, which raises
    target.seq in memory to 209920; the real pass then chose positions 0, 204800, 409600, 614400, 819200 and hung at
    the fifth. With --no-precompile (as the orchestrator runs perf-step gates) positions are 0..204800 and it passes
    (448 / 484 / 520 / 548 / 578 ms). Framework-side; no model change.

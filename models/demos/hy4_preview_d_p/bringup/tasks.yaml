      --run-all --no-precompile models/demos/common/bringup/tests/test_ladder.py -p models.demos.common.bringup.testing.fork_capture
      && python -m models.demos.common.bringup.testing.fork_cases --capture models/demos/hy4_preview_d_p/bringup/results/fork_calls.json
      --run-tests
    metrics:
      forks_used: '>= 0'
      fork_calls_uncovered: == 0
      fork_tests_failed: == 0
  role: optests
  paths:
  - ttnn/ttnn/bringup
  device: true

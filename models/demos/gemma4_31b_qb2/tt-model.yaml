    Run 2026-11-11 23:04–23:12 (KST), tt-inference-server 0.26.1 `--workflow benchmarks`; random prompts, greedy (temperature 0), thinking on (server default). One of the QuietBox's two fans was dead during the run; chip 1 thermally throttled during decode at 6 of 14 points (up to 29% of decode time: 4096/128 c1, 8192/128 c1, 8192/1024 c1, 10000/1024 c1, 16384/128 c1, 32768/128 c1).

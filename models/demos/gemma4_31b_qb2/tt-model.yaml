verify:
  - "from models.demos.gemma4_31b_qb2.tt.package_boot import Gemma4ResidentSpecPackaged, ensure_resident_cache; assert Gemma4ResidentSpecPackaged"
  # the first-boot converter's key resolves for the shipped engine and precision (no checkpoint needed for this)
  - "from models.demos.gemma4_31b_qb2.tt import package_boot as pb; import inspect, importlib; c = importlib.import_module('models.demos.gemma4_31b_qb2.resident_m3_2.weights').convert; assert set(pb.CONVERT_ARGS) <= set(inspect.signature(c).parameters)"
  - "from models.demos.gemma4_31b_qb2.tt.generator_vllm import Gemma4ForCausalLM; assert Gemma4ForCausalLM"   # batch
  # the engine is imported lazily by package name: import it here, and check its kernel sources shipped beside it
  - "import os, importlib; e = importlib.import_module('models.demos.gemma4_31b_qb2.resident_m3_2.engine'); importlib.import_module('models.demos.gemma4_31b_qb2.resident_m3_2.model'); from models.demos.gemma4_31b_qb2.resident_m3_2 import PKG_DIR; ks = ('streamer_reader.cpp', 'streamer_writer.cpp', 'streamer_compute.cpp', 'hub_dm.cpp', 'slice_dm.cpp', 'slice_mc.cpp', 'slice_compute.cpp', 'attn_reader.cpp', 'attn_writer.cpp', 'attn_compute.cpp'); missing = [k for k in ks if not os.path.isfile(os.path.join(PKG_DIR, 'kernels', k))]; assert not missing and e.ResidentEngine, missing"
  - "from models.demos.gemma4_31b_qb2.tt.dflash2 import DFlash2Drafter; assert DFlash2Drafter.REVISION == 'b0cd01b4918aae6b6388272950c4f9851734674b'"
  - "from models.demos.gemma4_31b_qb2.tt.model import HF_REVISION; assert HF_REVISION == '842da3794eaa0b77d5f08bae87a17459d91ff475'"
  - "from vllm_tt_plugin.spec_admission import MODEL_OWNED_DRAFT_SENTINEL as s; assert s == 'vllm_tt_plugin.model_owned_drafter', s"
  # the lock took: the serving-relevant versions of the validated venv
  - "import importlib.metadata as md; want = {'torch': '2.11.0+cpu', 'torchvision': '0.26.0+cpu', 'transformers': '5.12.1', 'tokenizers': '0.22.2', 'huggingface-hub': '1.33.0', 'safetensors': '0.8.0', 'numpy': '1.26.4', 'protobuf': '5.29.6', 'fastapi': '0.136.3', 'starlette': '1.10.0', 'prometheus-fastapi-instrumentator': '8.1.0', 'numba': '0.61.2'}; got = {k: md.version(k) for k in want}; assert got == want, {k: (got[k], v) for k, v in want.items() if got[k] != v}"
  - "import importlib.util as u; bad = [m for m in ('flashinfer', 'tilelang', 'tokenspeed_mla') if u.find_spec(m)]; assert not bad, bad"   # no CUDA closure

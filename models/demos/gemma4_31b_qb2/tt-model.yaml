    ² tt-inference-server's own points cap concurrency at 262,144 / (ISL + OSL), one maximum context in total. These points
    ask instead for the most users vLLM admits at once: the target is vLLM's runtime admission rule, calibrated
    on the `batch` session above (est.). vLLM's KV accounting reports a capacity of 414,365 tokens: it
    charges `batch`'s five sliding-window layer groups against the same pool of 4,320 blocks of 128 tokens as the
    full-attention layers, so fewer users fit than the full-attention blocks alone would hold. By the same
    accounting a second 262,016-token request does not fit while one runs (the table above has that point at one
    user). "Achieved concurrency" is the most requests running together (vLLM's
    10 s stats): at 16,384 tokens 16 of the 17 ran together, and every other point ran at its target. The users' prefills run one after another, so later users' TTFT includes the earlier prefills.

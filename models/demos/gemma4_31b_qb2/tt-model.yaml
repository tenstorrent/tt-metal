    ### Update 5: prefix caching
    - **What a hit does.** vLLM's prefix cache holds the full-attention KV. The engine also keeps each sliding-window
      layer's last 1,152 rows between prefill chunks. Update 5 saves those rows at 8,192-token chunk ends, in a fixed device
      pool:
      - `batch` holds 4 saved points, at most 2 per request, so roughly the last two long requests; `single-user` holds 2,
        so only the most recent long prompt. The least recently used point is replaced first; a 32K prompt alone fills two
        of `batch`'s four slots.
      - A hit recomputes at least 2,080 tokens. When the earlier prompt covers all but the last 2,080 tokens and the newest
        8,192-multiple below that is still saved, as in the measurement, it recomputes at most 10,271; a shorter shared
        prefix or an evicted point recomputes more. Time to first token follows the recomputed length.
      - Without a saved point, the request prefills from the start, as before.
    - **Measured in update 5's proof**, on update 5's image: a 32,797-token prompt (a 32,768-token history plus a
      29-token new turn; 5 real conversations; decode width R = 1) resumed at 24,576 tokens and recomputed 8,221:
      - update 5's `batch`: time to first token 1.79 s on a hit, against 5.72 s for the same request cold (medians;
        3.19x for this shape);
      - `single-user`: 1.81 s on a hit, against 5.74 s cold (3.17x for this shape).
      - This release's proof re-checks prefix caching on update 6's `batch`.
    - **Exactness.** A hit's output equals the same request prefilled from the start, token for token, at the same decode
      width (R), when the prompts' prefills did not share a step with another prompt's prefill. In update 5's proof:
      - `batch`: 3 hit/cold pairs at R = 1 (resumed at 16,384, 16,384, 65,536 tokens), and a hit at
        R = 8 among 7 decoding users against a cold twin at the same width;
      - `single-user`: 3 hit/cold pairs, with the speculation counters (drafts, accepted drafts, verifies) equal;
      - a multi-turn chat on `single-user`: in 3 conversations with 32K-token openers, all 6 later turns resumed at
        24,576 tokens and matched their cold twins, with no other long prompt in between (`single-user` keeps only the
        most recent long prompt's points);
      - before packaging, on the development tree, the S1 probe also checked 12 `batch` hit/cold pairs at R = 1.
      - Under concurrent prefills on `batch`, chunked prompts can differ slightly, as before.
    - **Memory.** The pool is allocated at start-up: 0.94 GB per chip on `batch` (measured 0.944 GB in the S1 probe; 4 x
      235.9 MB) and 0.47 GB on `single-user`. Update 6's `batch` also holds the drafter on the device; this release's
      proof re-measures its KV capacity and lowest free device memory.
    - **Soak.** In a 30-minute hit-and-miss churn on update 5's `batch` in update 5's proof (1,426 requests, 499 of them
      resumed from a saved point), free device memory stayed flat and no kernel was compiled after the first 120 s.
    - **Rollback.** To serve without prefix caching, pin the Hub tag `update-4`.

    ### Update 4: programs built at the first start; more long-context users on `batch`
    - **Continuation programs are pre-built.** Both profiles build every prefill program a long prompt's continuation
      can need on the first start after installation or a kernel change (`single-user` 64, `batch` 640). Later starts
      skip it: a marker in the kernel cache records that it was done. Measured in update 4's proof, on the packaged
      image with a fresh kernel cache:
      - first start, time spent pre-building: 90.6 s (`single-user`); 495.0 s and 535.8 s (`batch`, on a host
        where `single-user` had already started, and on a fresh host);
      - device memory the pre-built programs use: 3.5 MiB per chip (`single-user`), 8.3 MiB per chip (`batch`);
      - later starts, the marker check: 0.003 s (every later start in the proof).
      After that, a prompt longer than one 8,192-token chunk compiled no kernels at its first continuation (12 first
      continuations on the fresh host, and 10 pairs of users sharing a prefill step: 0 kernel files each). Set
      `GEMMA4_CONT_PREWARM=off` to skip the pre-build (continuation programs are then built on first use, as in update 3).
      Update 6's `batch` pre-build took 536.7 s before packaging (development tree, empty kernel cache); this release's
      proof measures it on the packaged image.
    - **`batch` KV layout.** The full-attention layers use vLLM's block pool; the sliding-window layers use a fixed
      per-user ring. Users vLLM ran at once on update 5's `batch`, measured in update 5's proof: 32 at 16,384 tokens,
      21 at 32,768, 10 at 65,536, 5 at 131,072, 2 at 262,016. This release's proof measures update 6's.
    - The `update-3` revision on the Hub keeps update 3's `batch` (without the ring layout and the pre-build).

    ### Update 2: paged-bucket prefill
    - Both profiles now build their prefill programs for a fixed set of length buckets at start-up. Update 1 compiled a
      new program set for every distinct prompt length and kept it for the life of the server, about 0.24 MB of device
      memory per chip per new length. Update 2's program set is bounded by the fixed buckets.
    - Decoding is unchanged. In the gating runs, update 2's outputs matched update 1's on the same prompts.
    - Start-up cost, measured with the kernels already compiled: about 5 s more for `single-user`, which also pre-builds
      the drafter's seed programs (about 6.5 MB per chip). The extra compile time on a first start has not been measured
      yet.
    - Continuation programs: update 2 built them on first use; update 4 builds them at the first start (above).
      `single-user` ignores `GEMMA4_PREFILL_WARM_CONT=1`; `batch` refuses to start with it set.

    ### Update 3: the resident batch engine (`batch`)
    `--profile batch` selects the resident batch engine (update 6: a new build of it, with speculation). The previous
    `batch-b32` profile was removed; the `update-2` revision keeps it.
    - Reliability on update 3's adapter (before the ring layout and before update 6's engine build): 0 hangs in 491,520
      long-context launches (≤ 6.1e-6 per launch, 95%), in a 6.5 h soak at 262K context.
    - Update 5's `batch` start-up times, its real-prompt table and its other measurements stay in the `update-5` revision
      on the Hub; this release's proof measures update 6's `batch`.

    ### Which profile
    - One user: `single-user`.
    - 2 to 32 concurrent users, or several users at long context: `batch` (it speculates in the bands above).

    ### Get the drafter (both profiles)
    ```bash
    hf download RedHatAI/gemma-4-31B-it-speculator.dflash2 --revision b0cd01b4918aae6b6388272950c4f9851734674b
    ```

    ### Serve
    ```bash
    tt-model serve changh95/gemma4-31b-it-dflash                    # default profile: single-user
    tt-model serve changh95/gemma4-31b-it-dflash --profile batch
    tt-model profiles changh95/gemma4-31b-it-dflash
    ```
    - `single-user`'s code is unchanged from update 5. In update 5's proof, its first start on a host with an empty
      package cache was ready after 901 s (converting the resident engine's weights once, 62 s, 22.8 GB; compiling kernels
      once; the 90.5 s pre-build), and later starts after 151 s. This release's proof re-measures both.
    - First start of `batch` after updating from update 5: it converts resident_m5_14's weights into a new directory
      (`gemma4_resident_raw_bf4_m5_14`) and the drafter's weights into `gemma4_m7_drafter_dflash2_b0cd01b4`, once (see
      Update 6 above). Update 5's `batch` copy (`gemma4_resident_raw_bf4_m5_11`) is no longer read.
    - **Cache directories must be dedicated.** `GRES_CACHE` and `GEMMA4_M7_DRAFTER_CACHE` (the profiles set them
      under `/tensor-cache`) must each point at a directory used only for that cache. At the first start, a directory
      without a valid package marker is deleted and rebuilt, and symlinks are never followed. Update 5 already did this for
      `GRES_CACHE`; update 6 adds the drafter's cache.
    - Disk, in the package cache under `~/.cache/tt-model/gemma4-31b-it-dflash`: in update 5's proof, 11.1 GB of compiled
      kernels and 22.8 GB of converted weights per profile copy. Update 6's `batch` adds its own engine copy and the
      drafter's cache; this release's proof measures the totals. A package update that changes an engine converts that
      engine's copy again.

    ### How to query
    ```bash
    curl http://localhost:20000/v1/chat/completions -H 'Content-Type: application/json' -d '{
      "model": "google/gemma-4-31B-it",
      "messages": [{"role": "user", "content": "Write a haiku about Blackhole chips."}],
      "max_tokens": 256, "temperature": 0,
      "chat_template_kwargs": {"enable_thinking": false}
    }'
    ```
    - Completions prompts get `<bos>` automatically; don't add it yourself.
    - Don't set `add_special_tokens: true` on chat requests; the template already writes `<bos>`.

    ### Known limitations
    - **Code-generation quality (BF4 weights).** On the same evaluation harness, run through update 1's `batch` decode
      path, a build of this model with BF8 weights scores higher on code generation:
      - MBPP: 0.566 (this build) vs 0.658, a significant gap (paired McNemar test, Holm-adjusted p ≈ 1e-6).
      - HumanEval: 0.835 vs 0.884, not significant.
      - About half of the MBPP gap is answers that never close their code block, mostly because they run long or repeat
        until the 512-token limit.
      - Long thinking traces repeat more often: 12.8% vs 8.8% are degenerate.
      - GSM8K, IFEval, MMLU-Pro, MATH-500 and RULER (8K) are within noise.
    - **Host-sampled requests.** A request that needs CPU sampling (repetition, presence or frequency penalties, the seven
      controls above, or top_k above the device limit of 32) moves sampling for every concurrent request on its profile to
      the CPU while it is active, and speculation pauses for all of them.
      - On update 5's `batch` (update 5's proof), at 32 users a decode step took 281.6 ms while one of them carried a
        repetition penalty, against 26.9 ms when all 32 were greedy (with `OMP_NUM_THREADS=8`, which this package sets).
        This release's proof re-measures it on update 6's `batch`.
      - Greedy requests and the default device sampling are unaffected.
      - The full fix belongs in the vLLM TT plugin.
    - **Seeded co-tenants.** While a host-sampled request is live, a seeded sampled co-tenant is sampled on the host too,
      so its text differs from a run without that co-tenant. Update 5 did this for penalties and logprobs; update 6 extends
      it to the seven controls.
    - **`prompt_logprobs`** is refused on both profiles.
    - **`batch`: greedy text depends on load.** The engine changes its decode width as users join and leave, and the same
      greedy prompt can produce different text depending on how many other requests are running. At a fixed width,
      greedy text was bitwise stable under co-tenant churn for prompts that prefill in one step. A prompt that is chunked
      alongside others can see small differences.
    - With 1–2 concurrent users, the batch profile stops speculating for the rest of the server's life once speculation stops paying off (for example on low-acceptance text); throughput then equals plain decoding until restart.
    - **Drafter: rounding-level draft differences at 256-position boundaries; output exactness unaffected (verification
      is exact).**
    - **Prefix-cache privacy (`cache_salt`).** A hit reuses state computed for an earlier request with the same prefix and
      salt. Its output equals the same request without the hit (see Exactness), but its shorter time to first token shows
      that an earlier request shared the prefix. On a shared server, give each tenant its own `cache_salt`, a request field
      on `/v1/chat/completions` and `/v1/completions`.
    - **Prefix-cache consistency check.** An internal check compares every restored state with its saved record. On a
      mismatch it stops the server rather than serve wrong output. It never triggered outside the deliberate corruption
      tests: 567 restores in the S1 probe (552 on `batch`, 15 on `single-user`), and 528 resumed requests in update 5's
      proof. This release's proof re-checks it on update 6.
    - **No per-request opt-out.** To serve without prefix caching, pin the Hub tag `update-4`.
    - **Device memory.** Update 6's `batch` holds the drafter's weights and buffers on the device as well as the
      prefix-cache pool; this release's proof measures its lowest free device memory per chip. On update 5's `batch` it
      was 3.51 GB at its lowest in update 5's proof.
    - **Thermal clock dips.** On a QuietBox 2 chip 1 can lower its clock after about 20 s of sustained fast decode, raising
      per-token time by up to about 1.3–1.45× while it lasts (measured on earlier builds). The tables on this card note
      the clock dips during their runs.
    - **`batch`: host decode guard.** The engine refuses a decode mix whose conservative attention bound exceeds 40 units
      per core. On update 5 it would have mattered only with a full-attention pool above 19,648 blocks (the shipped pool
      was 5,462); this release's proof re-checks it against update 6's engine and pool.
    - **First use of host sampling.** The first request that needs host sampling (logprobs, penalties, the seven controls)
      compiles one more kernel (update 5: 13 files, about 1 s (est.)), once per host; it is outside the start-up
      pre-build.
    - **Boot topology fault.** A boot can occasionally fail at mesh open with `TT_FATAL … could not fit in the discovered
      physical topology`, an intermittent host link-training fault. Reset the chips (`tt-smi -r 0,1,2,3`) and start again.
    - **No default physical grouping descriptor.** The image boots without tt-metal's default physical grouping descriptor
      and logs 'mapping without a PGD'; every proof of this package ran that way.
    - **Update 2 evidence scope.** The paged-bucket prefill's runtime guard and its gating runs check program-cache growth
      and outputs; they did not record device buffer addresses. The drafter seed pre-warm's first-start (cold kernel
      cache) time is not measured.


# tt-model.yaml — google/gemma-4-31B-it on a QuietBox 2 (P300x2: 2x P300 boards = 4 Blackhole chips, (1, 4) mesh, TP4)
# via vLLM + vllm-tt-plugin (fork changh95/vllm-tt-plugin @ 86bb6a47: prefix_resume + M7 API parity).
#
# Rendered from bench/packaging/update6/tt-model_u6.yaml and update6/card_v8_x_v3.md by render_manifest_u6.py.
#
#   single-user          DEFAULT: one user on the resident persistent-kernel decode engine (resident_m3_2) with
#                        DFlash2 speculative decoding (RedHatAI/gemma-4-31B-it-speculator.dflash2, block 8, R=8 verify),
#                        262,144-token context. = stage-2 regression config D (M2 adapter + M2 delta), with update 2's
#                        paged-bucket prefill (PB3: tt/generator_resident_spec_vllm_pb3.py; LEAD_DECISIONS_PKG P34, P37);
#                        update 4: PB4 = PB3 + the continuation pre-warm (tt/package_boot_pb4.py, tt/contwarm.py).
#                        update 5: PB4-APC = PB3-APC (prefix resume) + PB4 (tt/package_boot_pb4_apc.py).
#                        update 6: code byte-identical to update 5 (M349 2). The plugin re-pin makes it serve the seven
#                        controls (logprobs, structured output, bad_words, allowed_token_ids, min_tokens, logit_bias,
#                        min_p) without speculation instead of refusing them (LEAD_DECISIONS_M7 M13, M18), and
#                        --tokenizer names the shipped add_bos_token override (M349 1; chat ids unchanged).
#   batch                update 6 (M7): up to 32 users on the resident batch engine resident_m5_14 (frozen SUMS
#                        d117b59b) with the resident DFlash2 drafter (resident_m7, D program v10), switched between
#                        SPEC and PLAIN by the number of live users per the frozen serving config's bands
#                        (tt/m7_serving_config.json; c1 policy f2c, M274). Composition (UPDATE6_PLAN_ADDENDUM_14_3 §1, M328):
#                        tt/package_boot_m7.py:Gemma4ResidentMultiM7Packaged = class v5.6 (V56 5f329205 -> V55
#                        afb4eb06 -> V53 release revision -> APC v3 d4dc6891 -> ...) + update 4's packaged ring class
#                        (tt/package_boot_s3pb_ring.py 79a7dcd7), ENGINE_PACKAGE resident_m5_14. Replaces update 5's
#                        `batch` (D1, M140); update 5's `batch` stays on the Hub's `update-5` revision.
#
# Update 6 (2026-11; LEAD_DECISIONS_M7 M140, M274, M292, M297, M308, M313, M328, M336, M349, M357-M367): `batch` (M7)
# speculates with a resident DFlash2 drafter on resident_m5_14, switched by live users per the frozen serving config
# tt/m7_serving_config.json (518c6321, pinned at generator_resident_multi_m7_v5_3_vllm.py l.251): 1, 2 and 9-16 users
# SPEC (c1 on (8, 4), F2c), 3-8 and above 16 PLAIN, by the lead's band ruling on G-T v4 (record in the release record).
# Both profiles serve the seven sampling controls without speculation (plugin 86bb6a47) and use the shipped tokenizer
# override with add_bos_token on (tokenizer_bos), so /v1/completions prompts get one <bos>. `batch`'s two caches
# (engine weights, drafter weights) are dedicated directories under /tensor-cache; the first `batch` start converts
# both. The Hub's `update-5` revision keeps update 5.
#
# Update 5 (2026-11-21; LEAD_DECISIONS_PKG P144-P160; update5/UPDATE5_PLAN_v3.md): prefix caching on both profiles (S1:
# canonical resume). vLLM's prefix cache holds the full-attention KV; the engine saves each sliding-window layer's last
# 1,152 rows at 8,192-token chunk ends in a fixed device pool (tt/s1_tail_pool.py; GEMMA4_S1_TAIL_SLOTS = 4 on `batch`,
# 2 on `single-user`, read at import, so it is in each profile's env block) and a hit resumes at the largest saved
# 8,192-multiple at least 2,080 tokens before the prompt's end (the plugin's prefix_resume capability). Both profiles:
# --enable-prefix-caching and --enable-prompt-tokens-details; `single-user` also --prefix-cache-retention-interval 8192.
# The Hub's `update-4` revision keeps update 4 (no prefix caching).
#
# Update 4 (2026-11-19; LEAD_DECISIONS_PKG P99-P122): both profiles pre-build every continuation prefill program at the
# first start after a kernel change (a marker in the kernel cache skips it later; GEMMA4_CONT_PREWARM=auto|off|force,
# default auto; P106, P112). The Hub's `update-3` revision keeps update 3's `batch`.
#
# Update 2 (2026-11-15; LEAD_DECISIONS_PKG P36-P38): the paged-bucket prefill (tt/prefill_paged.py) on both profiles.
# Its runtime switches stay at the code defaults, as every PB gate ran them (GEMMA4_PB_* unset).
#
#   tt-model package --container models/demos/gemma4_31b_qb2/tt-model.yaml --out /home/ttuser/experiments/gemma4/tt-model-builds
#   tt-model serve   <builds>/gemma4-31b-it-dflash/tt_kernel_manifest.json [--profile batch]
#   tt-model push    <builds>/gemma4-31b-it-dflash          (the Hub repo is public; never pass --private, P75)
#
# Authored against tt-model-manager d28ed4dc (the installed CLI; card = description + quickstart only; lead 2026-11-11).
schema: "5.1"
repo: changh95/gemma4-31b-it-dflash
name: gemma4-31b-it-dflash
weights:
  repo: google/gemma-4-31B-it
  revision: 842da3794eaa0b77d5f08bae87a17459d91ff475   # refs/main as validated (= tt/model.py HF_REVISION)
kind: vllm-plugin
arch: blackhole

source:
  # Update 6: the X6 commit = X5 b3e48730 + exactly the sets the X6 staging script (stage_x6) stages (UPDATE6_PLAN.md §1.3-1.4;
  # addenda 14 §2-§4, 14.1 §1, 14.2, 14.3 §1) + this manifest. Staged and committed (detached) in a fresh worktree,
  # then fast-forwarded into this path's branch hchang/gemma4-31b-qb2-package on the lead's GO after the release review
  # (LEAD_DECISIONS_M7 M338 O-g).
  # Worktree prerequisites: submodules initialised, `runtime/` a real directory (copied, gitignored).
  tt_metal: /home/ttuser/experiments/gemma4/tt-metal-pkg
  code:                                          # = the import closure traced from the adapters (O1: closure_v2 e2ddd0c3)
    - models/demos/gemma4_31b_qb2/__init__.py
    - models/demos/gemma4_31b_qb2/README.md
    - models/demos/gemma4_31b_qb2/tt               # X5's tt/ + exactly addendum 14.1 §1's set + package_boot_m7 (14.3 §1)
    - models/demos/gemma4_31b_qb2/resident_m3_2    # single-user's engine (frozen SUMS 4677ca02), unchanged
    - models/demos/gemma4_31b_qb2/resident_m5_14   # update 6: batch's engine, whole (37 files, SUMS d117b59b; addendum 3:
                                                   # package_boot's GRES_CACHE key hashes the whole engine tree)
    - models/demos/gemma4_31b_qb2/resident_m7      # update 6: the drafter, exactly the 99-file union of bef8d061 (93),
                                                   # d_v8 38aab89f (2), selector ec38485b (1), omcast_v2 abb23c6f (3)
                                                   # (addendum 14 §3, final by 14.2); staging controls the set
    - models/demos/gemma4_31b_qb2/resident_r64b/__init__.py   # update 6: the subset resident_r64b.weights needs
    - models/demos/gemma4_31b_qb2/resident_r64b/common.py     # (Checkpoint, for the drafter's embedding rows;
    - models/demos/gemma4_31b_qb2/resident_r64b/weights.py    # addendum 3, closure doc 02d7b509)
    - models/demos/gemma4_31b_qb2/tokenizer_bos   # update 6: the tokenizer override with add_bos_token on
                                                   # (M349 1; UPDATE6_PLAN_ADDENDUM_14_4): both profiles' --tokenizer
    - models/demos/gemma4_31b_qb2/vllm_models      # this package's EXTRA_MODELS_DIR: exactly the two profiles' bundles,
                                                   # resident_spec_pb4_apc and resident_multi_m7 (update 6, 14.3 §1)
    - models/demos/gemma4/__init__.py              # spec_policy (generator_resident_spec_vllm.py imports it)
    - models/demos/gemma4/tt/__init__.py
    - models/demos/gemma4/tt/spec_policy.py
    - models/demos/gpt_oss/tt/ccl.py               # tt/decoder.py's CCL helpers (validator v9's single exception, M313)
    - models/common                                # sampling (TTSampling), lightweightmodule
  ubuntu: "22.04"
  python: "3.12"

runtime:
  vllm: {version: "0.31.0"}
  # Update 6: the fork changh95/vllm-tt-plugin, branch hchang/m7-api-parity @ 86bb6a47 (LEAD_DECISIONS_M7 M29):
  # update 5's c9d7808 (prefix_resume) plus (b) 6a03ae94 and (b2) 86bb6a47, the API-parity commits: the seven controls
  # served without speculation on both profiles (spec_admission.ordinary_decode_controls, host_sampler). It keeps the
  # model-owned drafter sentinel and the custom_class speculative path both profiles use.
  plugin: {repo: https://github.com/changh95/vllm-tt-plugin, ref: 86bb6a4763b7d1679f97eb9ada3ddad139de5a58}
  extra_models_dir: models/demos/gemma4_31b_qb2/vllm_models
  # Unchanged from update 5 (UPDATE6_PLAN.md §1.1: vLLM stays at 0.31.0, requirements.lock unchanged).
  lock: requirements.lock

serve:                             # common to both profiles; a profile's env/additional_config MERGE over this, but a
  hardware: p300x2                 # profile's `args` REPLACE serve.args wholesale (so every profile lists its own argv)
  mesh_device: P300x2              # as validated (MESH_DEVICE=P300x2); (1, 4)
  port: 8000
  max_model_len: 262144
  max_num_seqs: 1
  block_size: 128
  additional_config:
    tt:
      sample_on_device_mode: all
      trace_region_size: 536870912
      l1_small_size: 16384
  env:
    ARCH_NAME: blackhole
    MESH_DEVICE: P300x2
    # tt/model.py checkpoint_path() refuses an HF_MODEL that is not a directory, and tt-model sets HF_MODEL to the
    # repo id: point it at the pinned snapshot inside the /hf mount (as tt-inference-server does). The resident
    # weight conversion (weights.Checkpoint) reads the same variable.
    HF_MODEL: /hf/hub/models--google--gemma-4-31B-it/snapshots/842da3794eaa0b77d5f08bae87a17459d91ff475
    HF_HUB_OFFLINE: "1"
    TT_METAL_PINNED_MEMORY_CACHE_LIMIT_BYTES: "0"
    VLLM_ENGINE_READY_TIMEOUT_S: "3600"          # cold first boot: resident cache conversion + kernel JIT
    VLLM_PLUGINS: tt,tt_model_registry
    VLLM_RPC_TIMEOUT: "900000"
    VLLM_CONFIGURE_LOGGING: "1"
    VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"
    TORCHDYNAMO_DISABLE: "1"

serve_profiles:
  - name: single-user
    description: One user on the resident decode engine with DFlash2 speculative decoding, 262K context, paged-bucket prefill.
    max_num_seqs: 1
    capabilities:
      tool_parser: gemma4                             # = stage-2 D's argv (spec_qb2_resident_spec_262k_m3.json)
      reasoning_parser: gemma4
    env:
      GEMMA4_RESIDENT_ENGINE_PACKAGE: resident_m3_2       # = stage-2 D
      GEMMA4_RESIDENT_DRAFTER: dflash2
      GEMMA4_S1_TAIL_SLOTS: "2"                          # update 5: the prefix-resume tail pool (2 points; read at import)
      # The resident engine's converted weights (raw BF4/BF8 blocks, 22 GB), in the /tensor-cache mount
      # (~/.cache/tt-model/gemma4-31b-it-dflash/tensors on the host). vllm_models/resident_spec_pb4_apc names
      # tt/package_boot_pb4_apc.py:Gemma4ResidentSpecPB4APCPackaged (update 5), unchanged in update 6.
      GRES_CACHE: /tensor-cache/gemma4_resident_raw_bf4
      GEMMA4_RESIDENT_PRECISION: bf4                   # must match the converter's dtypes (refused otherwise)
      # The drafter (5.2 GB) is a second checkpoint the single `weights` pointer cannot carry: tt/dflash2.py resolves
      # RedHatAI/gemma-4-31B-it-speculator.dflash2 at its pinned commit b0cd01b4 from the /hf cache, offline
      # (snapshot_download local_files_only). The card's quickstart downloads it first.
    args:
      - [--hf-overrides, '{"architectures":["TTGemma4QB2ResidentSpecPB4APCForCausalLM"]}']   # update 5: PB4-APC (vllm_models/resident_spec_pb4_apc)
      # update 6: the shipped tokenizer override (add_bos_token on), so /v1/completions prompts get one <bos>; chat ids
      # unchanged (M349 1, check (a); UPDATE6_PLAN_ADDENDUM_14_4). tt-model lays source.code under /opt/tt-metal.
      - [--tokenizer, /opt/tt-metal/models/demos/gemma4_31b_qb2/tokenizer_bos]
      - [--revision, 842da3794eaa0b77d5f08bae87a17459d91ff475]
      - [--tokenizer-revision, 842da3794eaa0b77d5f08bae87a17459d91ff475]
      - [--max-num-batched-tokens, "8192"]
      - --enable-chunked-prefill
      - --enable-prefix-caching                       # update 5
      - --enable-prompt-tokens-details                # update 5: usage.prompt_tokens_details.cached_tokens
      - [--prefix-cache-retention-interval, "8192"]   # update 5, single-user only (as the S1 probe's SU holds ran)
      - [--max-logprobs, "-1"]
      - [--override-generation-config, '{"top_k": 20}']
      - [--default-chat-template-kwargs, '{"enable_thinking":true}']
      - [--seed, "9472"]
      - [--max-log-len, "32"]
      - --no-async-scheduling                         # the custom_class drafter requires sync scheduling
      - [--speculative-config, '{"method":"custom_class","model":"vllm_tt_plugin.model_owned_drafter","num_speculative_tokens":7}']
  - name: batch
    description: Up to 32 concurrent users on the resident batch engine with DFlash2 speculative decoding switched by the number of live users, 262K context, paged-bucket prefill.
    max_num_seqs: 32
    capabilities:
      reasoning_parser: gemma4                        # as every M7 evidence spec ran (h6_spec_v8, G-T): no tool parser
    # The env is h6_spec_v8's merged env (both TIS env blocks; class v5.6 evidence) minus the dev-only keys
    # (EXTRA_MODELS_DIR, VLLM_TARGET_DEVICE, GEMMA4_M7_SWITCH_PIN) and with the package's mount paths
    # (UPDATE6_PLAN.md §1.4). Proof v9 §4 reads the container's pid-1 env and checks the release-env rules against it
    # (M375, M376, M378).
    env:
      GEMMA4_QB2_HF_DECODE_ROPE: "1"                  # E1-E4: kept, as in every M7 evidence spec (the ttnn prefill model reads them)
      GEMMA4_QB2_HOIST_DECODE_ROPE: "1"
      GEMMA4_QB2_SLIDING_SDPA_GRID: 11x10
      GEMMA4_QB2_SMALL_PREFILL_1D_ROWS: "128"
      # Host threads for CPU-sampled steps (update 1). With OMP_NUM_THREADS set, vLLM leaves the thread count alone
      # (v1/executor/multiproc_executor.py:1107) and the plugin skips its reduction to 1 torch thread.
      OMP_NUM_THREADS: "8"                            # host-sampled steps, as update 1 (and as every M7 evidence spec)
      # Update 6 drops update 5's GEMMA4_RESIDENT_SPEC_POLICY=never, GEMMA4_RESIDENT_ENGINE_TAPS=0 and
      # GEMMA4_RESIDENT_ENGINE_BLOCKS=1 (UPDATE6_PLAN.md §1.4 "Drop", 7662f98a, adopted by M140): no taps means the
      # drafter build fails, and blocks=1 fails S1's warmup check without policy never. No M7 evidence spec sets them.
      GEMMA4_RESIDENT_ENGINE_PACKAGE: resident_m5_14
      GEMMA4_RESIDENT_BF8_PARTIALS: "1"
      GEMMA4_RESIDENT_R_DOWN_STEPS: "32"
      GEMMA4_RESIDENT_R_IDLE_RESET: "1"
      GEMMA4_S1_TAIL_SLOTS: "4"                      # update 5: the prefix-resume tail pool (4 points; read at import)
      # GRES_*: per M297 the release spec carries no GRES_* tuning variable (addendum 14 §7's 15 stay unset, at their
      # code defaults, as in every device evidence run; m5-serving h6/GRES_ENV_TABLE_O5.md), and GRES_CACHE may appear
      # only at its default value. M338 O-a: that means no tuning variable; GRES_CACHE is the weight-cache location,
      # the image mount below (as update 5 and UPDATE6_PLAN.md §1.4), not the dev path the code defaults to.
      # package_boot keys the converted cache by engine package and engine tree, so m5_14 gets its own directory and
      # the first start converts (UPDATE6_PLAN.md §1.4 "Change"). Both cache paths must be dedicated directories
      # (M336): one without a valid package marker is deleted and rebuilt at first start; symlinks are not followed.
      GRES_CACHE: /tensor-cache/gemma4_resident_raw_bf4_m5_14
      GEMMA4_RESIDENT_PRECISION: bf4                  # must match the converter's dtypes (refused otherwise); = h6_spec_v8
      # The resident drafter's converted weights (resident_m7.drafter_weights.convert(): L*/, global/, vectors.pt,
      # selector.pt; the head comes from GRES_CACHE). package_boot_m7.initialize_vllm_model (b02ce5cc) converts it at
      # the first start and checks it on every start (drafter_cache_key(): DFlash2 b0cd01b4, the converter modules'
      # hash, bf8, layout; D3, addendum 14.3 §2, M328); a cache with no marker or another key is discarded and rebuilt,
      # as package_boot does for GRES_CACHE. The drafter checkpoint itself is DFlash2 b0cd01b4 from the /hf cache,
      # offline, as on `single-user` (GEMMA4_RESIDENT_DRAFTER_CHECKPOINT stays unset). Its own directory, beside and not
      # inside GRES_CACHE's (M336; m5-serving: pkg-update's choice for the image).
      GEMMA4_M7_DRAFTER_CACHE: /tensor-cache/gemma4_m7_drafter_dflash2_b0cd01b4
      # Must not appear in any env block (UPDATE6_PLAN.md §1.4; H7-2's env proof refuses them): GEMMA4_M7_SWITCH_PIN,
      # GEMMA4_M7_SERVING_CONFIG, GEMMA4_M7_DUMMY_DRAFT, any GEMMA4_S1P_TEST_*, GEMMA4_M7_SEED other than unset/off,
      # and the spy guard's variables (validator v9 V4).
    args:
      - [--hf-overrides, '{"architectures":["TTGemma4QB2ResidentMultiM7ForCausalLM"]}']   # update 6: M7 composition (vllm_models/resident_multi_m7; 14.3 §1, M328)
      - [--tokenizer, /opt/tt-metal/models/demos/gemma4_31b_qb2/tokenizer_bos]   # update 6: as single-user (M349 1)
      - [--revision, 842da3794eaa0b77d5f08bae87a17459d91ff475]
      - [--tokenizer-revision, 842da3794eaa0b77d5f08bae87a17459d91ff475]
      - [--max-num-batched-tokens, "8192"]
      - --enable-chunked-prefill
      - --enable-prefix-caching                       # update 5
      - --enable-prompt-tokens-details                # update 5: usage.prompt_tokens_details.cached_tokens
      - [--max-logprobs, "-1"]
      - [--override-generation-config, '{"top_k": 20}']
      - [--default-chat-template-kwargs, '{"enable_thinking":true}']
      - [--seed, "9472"]
      - [--max-log-len, "32"]
      - --async-scheduling                            # kept (UPDATE6_PLAN.md §1.4); every M7 evidence spec ran async
      # num_speculative_tokens 7: the evidence specs' value (h6_spec_v8, G-T v3's spec_B); M338 O-b. H7-2's env proof
      # confirms it; any difference goes to the lead.
      - [--speculative-config, '{"method":"custom_class","model":"vllm_tt_plugin.model_owned_drafter","num_speculative_tokens":7}']
default_profile: single-user          # lead 2026-11-11 (qwen v2 names)

card:
  description: |
    [google/gemma-4-31B-it](https://huggingface.co/google/gemma-4-31B-it) on a QuietBox 2 (P300x2, 4 Blackhole chips) with vLLM. The default profile serves one user on a resident decode engine (one persistent program per chip per decode step) with [DFlash2](https://huggingface.co/RedHatAI/gemma-4-31B-it-speculator.dflash2) speculative decoding, up to 262K context. `batch` serves up to 32 users on a resident batch engine that keeps per-user decode fast at long context, up to 262K. Both profiles use a paged-bucket prefill: a fixed set of prefill programs built at start-up, so device memory no longer grows with the number of distinct prompt lengths served. Update 4 also builds every continuation prefill program a long prompt can need at the first start, and gives `batch` a KV layout that admits more users at long context. Update 5 turns on prefix caching on both profiles: a request that repeats an earlier prompt's beginning, such as the next turn of a chat or a shared system prompt, resumes from a saved point instead of prefilling all of it again. Update 6 adds DFlash2 speculative decoding to `batch`, switched on or off by the number of live users: where it speculates (1, 2 and 9–16 users), it measured 1.20–1.64x faster per output token than update 5's `batch` before packaging. Both profiles now also serve logprobs, structured outputs and the other sampling controls `single-user` used to refuse.
  quickstart: |
    ### At a glance
    - Weights: [google/gemma-4-31B-it](https://huggingface.co/google/gemma-4-31B-it) @ `842da37`; drafter
      [RedHatAI/gemma-4-31B-it-speculator.dflash2](https://huggingface.co/RedHatAI/gemma-4-31B-it-speculator.dflash2) @ `b0cd01b`
      (both profiles)
    - Hardware: P300x2 (QuietBox 2), one (1, 4) Blackhole mesh, tensor-parallel over 4 chips
    - Profiles: `single-user` (default), `batch`
    - Context: 262,144 tokens on every profile
    - Weights on device: BF4 (bfloat4_b) projections, BF8 LM head and KV cache, as validated
    - Thinking is on by default. Turn it off per request with `"chat_template_kwargs": {"enable_thinking": false}`.
    - Default sampling: the model's generation config (temperature 1.0, top_p 0.95) with top_k 20. Pass `"temperature": 0` for greedy.
    - `single-user` speculates on greedy and on sampled requests (temperature, top_p, top_k). Penalties and top_k above 32
      are served without speculation. Speculative output can differ from plain decoding at near-ties.
    - Update 6: both profiles serve logprobs (including `logprobs=0`), structured outputs (`response_format`, guided
      decoding), `bad_words`, `allowed_token_ids`, `min_tokens`, `logit_bias` and `min_p`. A request carrying any of them
      decodes without speculation, sampled on the host, and so do its co-tenants while it is live (see Known limitations).
      `prompt_logprobs` stays refused.
    - Tool calling: `single-user` parses tool calls (vLLM's `gemma4` parser, `tool_choice: "auto"`). `batch` has no
      tool calling.
    - `batch` (update 6): the resident batch engine with a resident DFlash2 drafter. It picks its decode width by the
      number of live users and speculates when the live-user count is in a band the shipped serving config marks
      speculative: 1, 2 and 9–16 live users speculate; 3–8 and more than 16 decode without speculation. With one user,
      `batch` also speculates (DFlash2, verify blocks of 4: 3 drafted tokens per step).
    - Update 4: continuation prefill programs are built once, at the first start after installation or a kernel change;
      `batch` keeps its sliding-window layers in a fixed per-user ring, so vLLM admits more users at long context.
    - Update 5: prefix caching is on. A request that shares at least 8,192 tokens with an earlier one, and is at least
      10,272 tokens long, resumes at a saved point if one for that prefix is still in the pool: a multiple of 8,192 within
      the shared prefix, at least 2,080 tokens before its end. Only prompt tokens are cached.

    ### Update 6: speculative decoding on `batch`
    - **What changed.** `batch` runs a new build of the resident batch engine (resident_m5_14) and adds a resident
      DFlash2 drafter on the device. Each step, the engine either speculates (drafts, then verifies on the engine) or
      decodes plainly, by the number of live users, per the serving config frozen in this package. Verification runs on
      the engine, so committed tokens are the engine's own.
    - **Bands.** The engine switches by the number of live users: 1 and 2 users speculate with DFlash2 in verify blocks of
      4 (3 drafted tokens per step), 9–16 users in verify blocks of 2 (1 drafted token per step); 3–4, 5–8 and more than
      16 users decode without speculation.
    - **One live user.** With one user, `batch` also speculates (DFlash2, verify blocks of 4). Its measured gain is in the
      table below.
    - **Measured speedup by band**, against update 5's `batch` (time per output token, update 5's / update 6's):

      | Live users | Mode in this release | Measured at | Speedup, 128-token prompts | Speedup, 1,024-token prompts |
      |---|---|---|---|---|
      | 1 | speculative | 1 user (3 requests) | 1.209x | 1.357x |
      | 2 | speculative | 2 users (4 requests) | 1.519x | 1.642x[1] |
      | 3–4 | plain | – | – | – |
      | 5–8 | plain | – | – | – |

# tt-model.yaml — google/gemma-4-31B-it on a QuietBox 2 (P300x2: 2x P300 boards = 4 Blackhole chips, (1, 4) mesh, TP4)
# via vLLM + the stock vllm-tt-plugin. Rendered from bench/packaging/{tt-model.yaml,card.md} by render_manifest.py.
#
#   single-user          DEFAULT: one user on the resident persistent-kernel decode engine (resident_m3_2) with
#                        DFlash2 speculative decoding (RedHatAI/gemma-4-31B-it-speculator.dflash2, block 8, R=8 verify),
#                        262,144-token context. = stage-2 regression config D (M2 adapter + M2 delta).
#   batch                up to 32 users on the stock ttnn batched decode path with the E1-E4 env knobs.
#                        = regression config B32 (bench/regression/session_B32).
#   (multi-user resident profile: a later update, not in this package.)
#
#   tt-model package --container models/demos/gemma4_31b_qb2/tt-model.yaml --out /home/ttuser/experiments/gemma4/tt-model-builds
#   tt-model serve   <builds>/gemma4-31b-it-dflash/tt_kernel_manifest.json [--profile batch]
#   tt-model push    <builds>/gemma4-31b-it-dflash --private
#
# Authored against tt-model-manager d28ed4dc (the installed CLI; card = description + quickstart only; lead 2026-11-11).
# Release decisions (2026-11-12): engine resident_m3_2 (stage-2 D's; m3_3 comes with the next update), BF4 weights
# (the user decoupled the upload from the BF8 evaluation), the card's tables from stage-2 D / Dsd and stage-1 B32.
schema: "5.1"
repo: changh95/gemma4-31b-it-dflash
name: gemma4-31b-it-dflash
weights:
  repo: google/gemma-4-31B-it
  revision: 842da3794eaa0b77d5f08bae87a17459d91ff475   # refs/main as validated (= tt/model.py HF_REVISION)
kind: vllm-plugin
arch: blackhole

source:
  # Branch hchang/gemma4-31b-qb2-package = main 7ccf9c16556 + the serving closure copied from the live tree
  # (bench/packaging/stage_files.sh, sums checked against the m3_2 freeze and the M2 delta) + this manifest.
  # Worktree prerequisites: submodules initialised, `runtime/` a real directory (copied, gitignored).
  tt_metal: /home/ttuser/experiments/gemma4/tt-metal-pkg
  code:                                          # = the import closure traced from the adapters (no lazy-import gaps)
    - models/demos/gemma4_31b_qb2/__init__.py
    - models/demos/gemma4_31b_qb2/README.md
    - models/demos/gemma4_31b_qb2/tt               # ttnn model (prefill + batch32 decode), adapters, drafters, taps
    - models/demos/gemma4_31b_qb2/resident_m3_2    # the engine stage-2 D validated (frozen SUMS 4677ca02)
    - models/demos/gemma4_31b_qb2/vllm_models      # this package's EXTRA_MODELS_DIR (two bundles)
    - models/demos/gemma4/__init__.py              # spec_policy (generator_resident_spec_vllm.py imports it)
    - models/demos/gemma4/tt/__init__.py
    - models/demos/gemma4/tt/spec_policy.py
    - models/demos/gpt_oss/tt/ccl.py               # tt/decoder.py's CCL helpers
    - models/common                                # sampling (TTSampling), lightweightmodule
  ubuntu: "22.04"
  python: "3.12"

runtime:
  vllm: {version: "0.31.0"}
  # Stock upstream tenstorrent/vllm-tt-plugin main @ ca7a182 (pushed, on origin/main): the plugin every validated
  # gemma4 serving run used, unmodified (git_diff_vllm-tt-plugin.patch empty in session_B32). It already carries the
  # model-owned drafter sentinel (spec_admission.py) and the custom_class speculative path the adapter needs.
  plugin: {repo: https://github.com/tenstorrent/vllm-tt-plugin, ref: ca7a18246e4111629ed6cb4a7d1192002749fccf}
  extra_models_dir: models/demos/gemma4_31b_qb2/vllm_models
  # The validated serving venv (tt-metal/python_env), pinned exactly: 418 packages, then vLLM --no-deps, as the plugin's
  # own installer does. Live resolution (attempt 2 of the warm-up build) pulled vLLM's CUDA metadata: torch 2.13 against
  # ttnn's 2.11 (verify.sh refused it), protobuf 7, nvidia-*/flashinfer/triton. Two documented departures, in the file.
  lock: requirements.lock

serve:                             # common to both profiles; a profile's env/additional_config MERGE over this, but a
  hardware: p300x2                 # profile's `args` REPLACE serve.args wholesale (so every profile lists its own argv)
  mesh_device: P300x2              # as validated (MESH_DEVICE=P300x2); (1, 4)
  port: 8000
  max_model_len: 262144
  max_num_seqs: 1
  block_size: 128
  additional_config:
    tt:
      sample_on_device_mode: all
      trace_region_size: 536870912
      l1_small_size: 16384
  env:
    ARCH_NAME: blackhole
    MESH_DEVICE: P300x2
    # tt/model.py checkpoint_path() refuses an HF_MODEL that is not a directory, and tt-model sets HF_MODEL to the
    # repo id: point it at the pinned snapshot inside the /hf mount (as tt-inference-server does). The resident
    # weight conversion (weights.Checkpoint) reads the same variable.
    HF_MODEL: /hf/hub/models--google--gemma-4-31B-it/snapshots/842da3794eaa0b77d5f08bae87a17459d91ff475
    HF_HUB_OFFLINE: "1"
    TT_METAL_PINNED_MEMORY_CACHE_LIMIT_BYTES: "0"
    VLLM_ENGINE_READY_TIMEOUT_S: "3600"          # cold first boot: resident cache conversion + kernel JIT
    VLLM_PLUGINS: tt,tt_model_registry
    VLLM_RPC_TIMEOUT: "900000"
    VLLM_CONFIGURE_LOGGING: "1"
    VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"
    TORCHDYNAMO_DISABLE: "1"

serve_profiles:
  - name: single-user
    description: One user on the resident decode engine with DFlash2 speculative decoding, 262K context.
    max_num_seqs: 1
    capabilities:
      tool_parser: gemma4                             # = stage-2 D's argv (spec_qb2_resident_spec_262k_m3.json)
      reasoning_parser: gemma4
    env:
      GEMMA4_RESIDENT_ENGINE_PACKAGE: resident_m3_2       # = stage-2 D
      GEMMA4_RESIDENT_DRAFTER: dflash2
      # The resident engine's converted weights (raw BF4/BF8 blocks, 22 GB), in the /tensor-cache mount
      # (~/.cache/tt-model/gemma4-31b-it-dflash/tensors on the host). vllm_models/resident_spec names
      # tt/package_boot.py:Gemma4ResidentSpecPackaged, which converts them on the first start and checks them on every
      # start (COMPLETE.json: weights revision, engine + converter hashes, precision, file manifest).
      GRES_CACHE: /tensor-cache/gemma4_resident_raw_bf4
      GEMMA4_RESIDENT_PRECISION: bf4                   # must match the converter's dtypes (refused otherwise)
      # The drafter (5.2 GB) is a second checkpoint the single `weights` pointer cannot carry: tt/dflash2.py resolves
      # RedHatAI/gemma-4-31B-it-speculator.dflash2 at its pinned commit b0cd01b4 from the /hf cache, offline
      # (snapshot_download local_files_only). The card's quickstart downloads it first.
    args:
      - [--hf-overrides, '{"architectures":["TTGemma4QB2ResidentSpecForCausalLM"]}']
      - [--revision, 842da3794eaa0b77d5f08bae87a17459d91ff475]
      - [--tokenizer-revision, 842da3794eaa0b77d5f08bae87a17459d91ff475]
      - [--max-num-batched-tokens, "8192"]
      - --enable-chunked-prefill
      - --no-enable-prefix-caching
      - [--max-logprobs, "-1"]
      - [--override-generation-config, '{"top_k": 20}']
      - [--default-chat-template-kwargs, '{"enable_thinking":true}']
      - [--seed, "9472"]
      - [--max-log-len, "32"]
      - --no-async-scheduling                         # the custom_class drafter requires sync scheduling
      - [--speculative-config, '{"method":"custom_class","model":"vllm_tt_plugin.model_owned_drafter","num_speculative_tokens":7}']
  - name: batch
    description: Up to 32 concurrent users on the stock ttnn batched decode path (E1-E4 on), 262K context.
    max_num_seqs: 32
    capabilities:
      reasoning_parser: gemma4                        # as B32 ran: no tool parser (lead: ship validated configs only)
    env:
      GEMMA4_QB2_HF_DECODE_ROPE: "1"                  # E1-E4: the validated env-gated decode/prefill knobs
      GEMMA4_QB2_HOIST_DECODE_ROPE: "1"
      GEMMA4_QB2_SLIDING_SDPA_GRID: 11x10
      GEMMA4_QB2_SMALL_PREFILL_1D_ROWS: "128"
    args:
      - [--hf-overrides, '{"architectures":["TTGemma4QB2ForCausalLM"]}']
      - [--revision, 842da3794eaa0b77d5f08bae87a17459d91ff475]
      - [--tokenizer-revision, 842da3794eaa0b77d5f08bae87a17459d91ff475]
      - [--max-num-batched-tokens, "8192"]
      - --enable-chunked-prefill
      - --no-enable-prefix-caching
      - [--max-logprobs, "-1"]
      - [--override-generation-config, '{"top_k": 20}']
      - [--default-chat-template-kwargs, '{"enable_thinking":true}']
      - [--seed, "9472"]
      - [--max-log-len, "32"]
      - --async-scheduling
default_profile: single-user          # lead 2026-11-11 (qwen v2 names); multi-user comes later

card:
  description: |
    [google/gemma-4-31B-it](https://huggingface.co/google/gemma-4-31B-it) on a QuietBox 2 (P300x2, 4 Blackhole chips) with vLLM. The default profile serves one user on a resident decode engine (one persistent program per chip per decode step) with [DFlash2](https://huggingface.co/RedHatAI/gemma-4-31B-it-speculator.dflash2) speculative decoding, up to 262K context. `batch` serves up to 32 users on the stock ttnn decode path.
  quickstart: |
    ### At a glance
    - Weights: [google/gemma-4-31B-it](https://huggingface.co/google/gemma-4-31B-it) @ `842da37`; drafter
      [RedHatAI/gemma-4-31B-it-speculator.dflash2](https://huggingface.co/RedHatAI/gemma-4-31B-it-speculator.dflash2) @ `b0cd01b`
    - Hardware: P300x2 (QuietBox 2), one (1, 4) Blackhole mesh, tensor-parallel over 4 chips
    - Profiles: `single-user` (default), `batch`
    - Context: 262,144 tokens on both profiles
    - Weights on device: BF4 (bfloat4_b) projections, BF8 LM head and KV cache, as validated
    - Thinking is on by default. Turn it off per request with `"chat_template_kwargs": {"enable_thinking": false}`.
    - Default sampling: the model's generation config (temperature 1.0, top_p 0.95) with top_k 20. Pass `"temperature": 0` for greedy.
    - `single-user` speculates on greedy and on sampled requests (temperature, top_p, top_k). Penalties and top_k above 32
      are served without speculation. Speculative output can differ from plain decoding at near-ties.
    - `single-user` refuses (HTTP 400) what its speculative path cannot apply: logprobs, structured outputs
      (`response_format`, guided decoding), `bad_words`, `allowed_token_ids`, `min_tokens`, `logit_bias`, `min_p`.
      `batch` serves logprobs.
    - Tool calling: `single-user` parses tool calls (vLLM's `gemma4` parser, `tool_choice: "auto"`). `batch` has no tool
      calling.

    ### Which profile
    - One user: `single-user`.
    - 2 to 32 concurrent users: `batch`.

    ### Get the drafter (`single-user`)
    ```bash
    hf download RedHatAI/gemma-4-31B-it-speculator.dflash2 --revision b0cd01b4918aae6b6388272950c4f9851734674b
    ```

    ### Serve
    ```bash
    tt-model serve changh95/gemma4-31b-it-dflash                    # default profile: single-user
    tt-model serve changh95/gemma4-31b-it-dflash --profile batch
    tt-model profiles changh95/gemma4-31b-it-dflash
    ```
    - First start on a host (`single-user`): about 12.5 min to ready. It converts the resident engine's weights once
      (about 70 s: 22 GB from the 59 GB checkpoint) and compiles kernels once (about 9.5 min).
    - Later starts: about 2.5 min, including a sha256 check of the converted weights (seconds when they are in the page cache).
      `batch` then starts in about 2 min.
    - Disk: about 31 GB under `~/.cache/tt-model/gemma4-31b-it-dflash` (22 GB converted weights, 9 GB compiled kernels).
      A package update that changes the engine converts again.

    ### How to query
    ```bash
    curl http://localhost:20000/v1/chat/completions -H 'Content-Type: application/json' -d '{
      "model": "google/gemma-4-31B-it",
      "messages": [{"role": "user", "content": "Write a haiku about Blackhole chips."}],
      "max_tokens": 256, "temperature": 0,
      "chat_template_kwargs": {"enable_thinking": false}
    }'
    ```

    ### Results (tt-inference-server `--workflow benchmarks`)


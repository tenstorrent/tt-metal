# tt-model.yaml — google/gemma-4-31B-it on a QuietBox 2 (P300x2: 2x P300 boards = 4 Blackhole chips, (1, 4) mesh, TP4)
# via vLLM + the stock vllm-tt-plugin. Rendered from bench/packaging/update3/{tt-model_u3_2.yaml,card_v5a.md} by
# render_manifest_u3_2.py.
#
#   single-user          DEFAULT: one user on the resident persistent-kernel decode engine (resident_m3_2) with
#                        DFlash2 speculative decoding (RedHatAI/gemma-4-31B-it-speculator.dflash2, block 8, R=8 verify),
#                        262,144-token context. = stage-2 regression config D (M2 adapter + M2 delta), with update 2's
#                        paged-bucket prefill (PB3: tt/generator_resident_spec_vllm_pb3.py; LEAD_DECISIONS_PKG P34, P37).
#   batch                update 3: up to 32 users on the resident batch engine (resident_m5_11) through the S3.2
#                        adapter with the paged-bucket prefill (S3-PB: tt/generator_resident_multi_s3_2_pb_vllm.py),
#                        option S (decode width R = 1 / 8 / 32 by live rows), no speculation, 262,144-token context.
#                        = option A's evidence config (bench/resident/s1 H6-H9, the S3-PB subset and L3-only holds;
#                        update3/UPDATE3_PLAN.md section 3); LEAD_DECISIONS_PKG P48, P49.
#
# Update 3.2 (2026-11-17; LEAD_DECISIONS_PKG P84-P86, the user's decision): the `batch-b32` profile (update 2's `batch`,
# B32-PB) is removed; the Hub's `update-2` revision keeps it. Its code (tt/generator_vllm_pb.py, vllm_models/qb2_pb)
# stays shipped and unused until update 4's cleanup. Nothing else changes from update 3.1 (1c932f77b76) but the card.
#
# Update 2 (2026-11-15; LEAD_DECISIONS_PKG P36-P38): the paged-bucket prefill (tt/prefill_paged.py) on both profiles.
# Prefill programs are keyed by a fixed bucket set built at boot, so serving many distinct prompt lengths no longer
# pins device DRAM per novel exact length (update 1: ~0.24 MB per chip per novel length, no eviction). Its runtime
# switches stay at the code defaults, as every PB gate ran them (GEMMA4_PB_* unset): GEMMA4_PB_GUARD=retire,
# GEMMA4_PB_SDPA_FLEX=1, GEMMA4_PB_EMBED_ZERO=mul, GEMMA4_PREFILL_WARM_CONT=0 (lazy: a first-seen continuation key
# builds its programs at first use; single-user does not read the variable, update 3's `batch` (S3-PB) refuses to start
# with it, and the only profile that read it, update 2's `batch` / 3.1's `batch-b32`, is removed in 3.2).
#
#   tt-model package --container models/demos/gemma4_31b_qb2/tt-model.yaml --out /home/ttuser/experiments/gemma4/tt-model-builds
#   tt-model serve   <builds>/gemma4-31b-it-dflash/tt_kernel_manifest.json [--profile batch]
#   tt-model push    <builds>/gemma4-31b-it-dflash          (the Hub repo is public; never pass --private, P75)
#
# Authored against tt-model-manager d28ed4dc (the installed CLI; card = description + quickstart only; lead 2026-11-11).
# Release decisions (2026-11-12): engine resident_m3_2 (stage-2 D's; m3_3 comes with the next update), BF4 weights
# (the user decoupled the upload from the BF8 evaluation), the card's tables from stage-2 D / Dsd and stage-1 B32.
schema: "5.1"
repo: changh95/gemma4-31b-it-dflash
name: gemma4-31b-it-dflash
weights:
  repo: google/gemma-4-31B-it
  revision: 842da3794eaa0b77d5f08bae87a17459d91ff475   # refs/main as validated (= tt/model.py HF_REVISION)
kind: vllm-plugin
arch: blackhole

source:
  # Branch hchang/gemma4-31b-qb2-package = main 7ccf9c16556 + the serving closure copied from the live tree
  # (bench/packaging/stage_files.sh, sums checked against the m3_2 freeze and the M2 delta) + this manifest.
  # Worktree prerequisites: submodules initialised, `runtime/` a real directory (copied, gitignored).
  tt_metal: /home/ttuser/experiments/gemma4/tt-metal-pkg
  code:                                          # = the import closure traced from the adapters (no lazy-import gaps)
    - models/demos/gemma4_31b_qb2/__init__.py
    - models/demos/gemma4_31b_qb2/README.md
    - models/demos/gemma4_31b_qb2/tt               # ttnn model (prefill + batch32 decode), adapters, drafters, taps, PB prefill
    - models/demos/gemma4_31b_qb2/resident_m3_2    # the engine stage-2 D validated (frozen SUMS 4677ca02): single-user
    - models/demos/gemma4_31b_qb2/resident_m5_11   # update 3: the batch engine (frozen SUMS b128d3df, D43 isolation)
    - models/demos/gemma4_31b_qb2/vllm_models      # this package's EXTRA_MODELS_DIR (five bundles; the profiles use
                                                   # resident_spec_pb3 and resident_multi_s3pb; qb2_pb (3.1's batch-b32)
                                                   # and update 1's qb2 and resident_spec stay, unused)
    - models/demos/gemma4/__init__.py              # spec_policy (generator_resident_spec_vllm.py imports it)
    - models/demos/gemma4/tt/__init__.py
    - models/demos/gemma4/tt/spec_policy.py
    - models/demos/gpt_oss/tt/ccl.py               # tt/decoder.py's CCL helpers
    - models/common                                # sampling (TTSampling), lightweightmodule
  ubuntu: "22.04"
  python: "3.12"

runtime:
  vllm: {version: "0.31.0"}
  # Stock upstream tenstorrent/vllm-tt-plugin main @ ca7a182 (pushed, on origin/main): the plugin every validated
  # gemma4 serving run used, unmodified (git_diff_vllm-tt-plugin.patch empty in session_B32). It already carries the
  # model-owned drafter sentinel (spec_admission.py) and the custom_class speculative path the adapter needs.
  plugin: {repo: https://github.com/tenstorrent/vllm-tt-plugin, ref: ca7a18246e4111629ed6cb4a7d1192002749fccf}
  extra_models_dir: models/demos/gemma4_31b_qb2/vllm_models
  # The validated serving venv (tt-metal/python_env), pinned exactly: 418 packages, then vLLM --no-deps, as the plugin's
  # own installer does. Live resolution (attempt 2 of the warm-up build) pulled vLLM's CUDA metadata: torch 2.13 against
  # ttnn's 2.11 (verify.sh refused it), protobuf 7, nvidia-*/flashinfer/triton. Two documented departures, in the file.
  lock: requirements.lock

serve:                             # common to both profiles; a profile's env/additional_config MERGE over this, but a
  hardware: p300x2                 # profile's `args` REPLACE serve.args wholesale (so every profile lists its own argv)
  mesh_device: P300x2              # as validated (MESH_DEVICE=P300x2); (1, 4)
  port: 8000
  max_model_len: 262144
  max_num_seqs: 1
  block_size: 128
  additional_config:
    tt:
      sample_on_device_mode: all
      trace_region_size: 536870912
      l1_small_size: 16384
  env:
    ARCH_NAME: blackhole
    MESH_DEVICE: P300x2
    # tt/model.py checkpoint_path() refuses an HF_MODEL that is not a directory, and tt-model sets HF_MODEL to the
    # repo id: point it at the pinned snapshot inside the /hf mount (as tt-inference-server does). The resident
    # weight conversion (weights.Checkpoint) reads the same variable.
    HF_MODEL: /hf/hub/models--google--gemma-4-31B-it/snapshots/842da3794eaa0b77d5f08bae87a17459d91ff475
    HF_HUB_OFFLINE: "1"
    TT_METAL_PINNED_MEMORY_CACHE_LIMIT_BYTES: "0"
    VLLM_ENGINE_READY_TIMEOUT_S: "3600"          # cold first boot: resident cache conversion + kernel JIT
    VLLM_PLUGINS: tt,tt_model_registry
    VLLM_RPC_TIMEOUT: "900000"
    VLLM_CONFIGURE_LOGGING: "1"
    VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"
    TORCHDYNAMO_DISABLE: "1"

serve_profiles:
  - name: single-user
    description: One user on the resident decode engine with DFlash2 speculative decoding, 262K context, paged-bucket prefill.
    max_num_seqs: 1
    capabilities:
      tool_parser: gemma4                             # = stage-2 D's argv (spec_qb2_resident_spec_262k_m3.json)
      reasoning_parser: gemma4
    env:
      GEMMA4_RESIDENT_ENGINE_PACKAGE: resident_m3_2       # = stage-2 D
      GEMMA4_RESIDENT_DRAFTER: dflash2
      # The resident engine's converted weights (raw BF4/BF8 blocks, 22 GB), in the /tensor-cache mount
      # (~/.cache/tt-model/gemma4-31b-it-dflash/tensors on the host). vllm_models/resident_spec names
      # tt/package_boot.py:Gemma4ResidentSpecPackaged, which converts them on the first start and checks them on every
      # start (COMPLETE.json: weights revision, engine + converter hashes, precision, file manifest). Update 2:
      # vllm_models/resident_spec_pb3 names tt/package_boot_pb3.py:Gemma4ResidentSpecPB3Packaged, the same boot step
      # (ensure_resident_cache) in front of PB3 (PB prefill + drafter-seed pre-warm + seed-path guard).
      GRES_CACHE: /tensor-cache/gemma4_resident_raw_bf4
      GEMMA4_RESIDENT_PRECISION: bf4                   # must match the converter's dtypes (refused otherwise)
      # The drafter (5.2 GB) is a second checkpoint the single `weights` pointer cannot carry: tt/dflash2.py resolves
      # RedHatAI/gemma-4-31B-it-speculator.dflash2 at its pinned commit b0cd01b4 from the /hf cache, offline
      # (snapshot_download local_files_only). The card's quickstart downloads it first.
    args:
      - [--hf-overrides, '{"architectures":["TTGemma4QB2ResidentSpecPB3ForCausalLM"]}']   # update 2: PB3
      - [--revision, 842da3794eaa0b77d5f08bae87a17459d91ff475]
      - [--tokenizer-revision, 842da3794eaa0b77d5f08bae87a17459d91ff475]
      - [--max-num-batched-tokens, "8192"]
      - --enable-chunked-prefill
      - --no-enable-prefix-caching
      - [--max-logprobs, "-1"]
      - [--override-generation-config, '{"top_k": 20}']
      - [--default-chat-template-kwargs, '{"enable_thinking":true}']
      - [--seed, "9472"]
      - [--max-log-len, "32"]
      - --no-async-scheduling                         # the custom_class drafter requires sync scheduling
      - [--speculative-config, '{"method":"custom_class","model":"vllm_tt_plugin.model_owned_drafter","num_speculative_tokens":7}']
  - name: batch
    description: Up to 32 concurrent users on the resident batch engine (option S, R = 1 / 8 / 32), 262K context, paged-bucket prefill.
    max_num_seqs: 32
    capabilities:
      reasoning_parser: gemma4                        # as every A hold ran: no tool parser
    env:
      GEMMA4_QB2_HF_DECODE_ROPE: "1"                  # E1-E4: kept, as in every A hold (the ttnn prefill model reads them)
      GEMMA4_QB2_HOIST_DECODE_ROPE: "1"
      GEMMA4_QB2_SLIDING_SDPA_GRID: 11x10
      GEMMA4_QB2_SMALL_PREFILL_1D_ROWS: "128"
      # Host threads for CPU-sampled steps (update 1). With OMP_NUM_THREADS set, vLLM leaves the thread count alone
      # (v1/executor/multiproc_executor.py:1107) and the plugin skips its reduction to 1 torch thread
      # (vllm_tt_plugin/worker.py:535-536). Proof v5 run 3 C5, 32 users: 277.5 ms per step with one repetition_penalty
      # request among 31 default-sampled ones, 26.9 ms all-greedy.
      OMP_NUM_THREADS: "8"                            # host-sampled steps, as update 1 (and as every A hold)
      # Option A's RES set (bench/resident/s1/run_s3_h6_v2.sh; the S3-PB subset and L3-only specs), verbatim:
      GEMMA4_RESIDENT_ENGINE_PACKAGE: resident_m5_11
      GEMMA4_RESIDENT_SPEC_POLICY: never
      GEMMA4_RESIDENT_ENGINE_TAPS: "0"
      GEMMA4_RESIDENT_ENGINE_BLOCKS: "1"
      GEMMA4_RESIDENT_KV_POOL: b32
      GEMMA4_RESIDENT_BF8_PARTIALS: "1"
      GEMMA4_RESIDENT_R_DOWN_STEPS: "32"
      GEMMA4_RESIDENT_R_IDLE_RESET: "1"
      # GRES_ISO / GRES_ISO_SKIPFOLD stay unset: m5_11's safe defaults (1 / 0), checked by the validator's iso pin.
      # The converted weights, in the /tensor-cache mount: package_boot keys a cache by engine package and engine tree,
      # so this profile has its own directory (sharing single-user's would reconvert on every profile switch).
      # vllm_models/resident_multi_s3pb names tt/package_boot_s3pb.py:Gemma4ResidentMultiS32PBPackaged, which converts
      # them on the first start and checks them on every start.
      GRES_CACHE: /tensor-cache/gemma4_resident_raw_bf4_m5_11
      GEMMA4_RESIDENT_PRECISION: bf4                  # must match the converter's dtypes (refused otherwise)
    args:
      - [--hf-overrides, '{"architectures":["TTGemma4QB2ResidentMultiS32PBForCausalLM"]}']   # update 3: S3-PB (vllm_models/resident_multi_s3pb)
      - [--revision, 842da3794eaa0b77d5f08bae87a17459d91ff475]
      - [--tokenizer-revision, 842da3794eaa0b77d5f08bae87a17459d91ff475]
      - [--max-num-batched-tokens, "8192"]
      - --enable-chunked-prefill
      - --no-enable-prefix-caching
      - [--max-logprobs, "-1"]
      - [--override-generation-config, '{"top_k": 20}']
      - [--default-chat-template-kwargs, '{"enable_thinking":true}']
      - [--seed, "9472"]
      - [--max-log-len, "32"]
      - --async-scheduling
default_profile: single-user          # lead 2026-11-11 (qwen v2 names); multi-user comes later

card:
  description: |
    [google/gemma-4-31B-it](https://huggingface.co/google/gemma-4-31B-it) on a QuietBox 2 (P300x2, 4 Blackhole chips) with vLLM. The default profile serves one user on a resident decode engine (one persistent program per chip per decode step) with [DFlash2](https://huggingface.co/RedHatAI/gemma-4-31B-it-speculator.dflash2) speculative decoding, up to 262K context. `batch` serves up to 32 users on a resident batch engine that keeps per-user decode fast at long context, up to 262K. Both profiles use a paged-bucket prefill: a fixed set of prefill programs built at start-up, so device memory no longer grows with the number of distinct prompt lengths served.
  quickstart: |
    ### At a glance
    - Weights: [google/gemma-4-31B-it](https://huggingface.co/google/gemma-4-31B-it) @ `842da37`; drafter
      [RedHatAI/gemma-4-31B-it-speculator.dflash2](https://huggingface.co/RedHatAI/gemma-4-31B-it-speculator.dflash2) @ `b0cd01b`
    - Hardware: P300x2 (QuietBox 2), one (1, 4) Blackhole mesh, tensor-parallel over 4 chips
    - Profiles: `single-user` (default), `batch`
    - Context: 262,144 tokens on every profile
    - Weights on device: BF4 (bfloat4_b) projections, BF8 LM head and KV cache, as validated
    - Thinking is on by default. Turn it off per request with `"chat_template_kwargs": {"enable_thinking": false}`.
    - Default sampling: the model's generation config (temperature 1.0, top_p 0.95) with top_k 20. Pass `"temperature": 0` for greedy.
    - `single-user` speculates on greedy and on sampled requests (temperature, top_p, top_k). Penalties and top_k above 32
      are served without speculation. Speculative output can differ from plain decoding at near-ties.
    - `single-user` refuses (HTTP 400) what its speculative path cannot apply: logprobs, structured outputs
      (`response_format`, guided decoding), `bad_words`, `allowed_token_ids`, `min_tokens`, `logit_bias`, `min_p`.
      `batch` serves logprobs (on the host-sampled step; see Known limitations).
    - Tool calling: `single-user` parses tool calls (vLLM's `gemma4` parser, `tool_choice: "auto"`). `batch` has no
      tool calling.
    - `batch` (update 3): the resident batch engine. It picks its decode width by the number of live users (R = 1 / 8 /
      32) and does not speculate.

    ### Update 2: paged-bucket prefill
    - Both profiles now build their prefill programs for a fixed set of length buckets at start-up. Update 1 compiled a
      new program set for every distinct prompt length and kept it for the life of the server, about 0.24 MB of device
      memory per chip per new length. Update 2's program set is bounded by the fixed buckets.
    - Decoding is unchanged. In the gating runs, update 2's outputs matched update 1's on the same prompts.
    - Start-up cost, measured with the kernels already compiled: about 5 s more for `single-user`, which also pre-builds
      the drafter's seed programs (about 6.5 MB per chip). The extra compile time on a first start has not been measured
      yet.
    - A prompt longer than one 8,192-token chunk builds a few programs the first time a new continuation length class is
      seen (lazy, on every profile). `single-user` ignores `GEMMA4_PREFILL_WARM_CONT=1` (its continuation programs are
      always built on first use, and its drafter seed pre-warm is always on); `batch` refuses to start with it set.
    - Measured first-sight cost of a new continuation length class, on a fresh kernel cache: about +1.05 s TTFT on
      `single-user` (kernel compilation, once per host per class); about 10 ms once the kernels are on disk. Not measured
      on `batch`.

    ### Update 3: the resident batch engine (`batch`)
    `--profile batch` now selects the resident batch engine. The previous `batch-b32` profile was removed; the `update-2` revision keeps it.
    - Start-up, measured in update 3.1's proof (in the package container, the same code): 120 s to ready on a warm
      start. The first `batch` start on a host that had already run `single-user` once took 241 s, including the
      one-time conversion of `batch`'s own copy of the engine weights (converted in 55 s; 22.8 GB more disk). A fresh
      host that starts `batch` first also compiles the shared kernels: that start is not measured. `single-user`'s
      weight copy is untouched.
    - `batch` serves logprobs, repetition / presence / frequency penalties and logit_bias on its host-sampled step, each
      alone and alongside 31 greedy users (checked in this release's proof); see Known limitations.
    - One long request among short ones: 32 users with 1K-token prompts (512 output tokens) had a TPOT of 35.6 ms; with
      one of them replaced by a 259,000-token request, its prefill already done, the 31 short users' TPOT was 42.5 ms
      (2026-11-15, the same engine before the paged-bucket prefill was added; chip clocks were below 1,323 MHz for 4–19%
      of the 32-user windows).
    - Reliability: 0 hangs in 491,520 long-context launches (≤ 6.1e-6 per launch, 95%), in a 6.5 h soak of `batch`'s
      engine at 262K context.

    **Real prompts.** `vllm bench serve` (tt-inference-server's client) with the real-prompt builder's chat prompts: a
    coding, writing or math task after a real context, cut so the chat template renders it to exactly the stated length;
    thinking on (the server default), greedy, 256 output tokens, warm-ups = concurrency. Times are as measured; points
    where chip clocks dropped during decode carry a footnote with the per-chip share of decode time below 1,323 MHz.

    | ISL | Concurrency | TPOT (ms) | TTFT (ms) |
    |---|---|---|---|
    | 128 | 1 | 10.2 | 64 |
    | 128 | 8 | 14.3 | 392 |
    | 128 | 32 | 26.8 | 1,465 |
    | 1,024 | 1 | 11.4 | 145 |
    | 1,024 | 8 | 16.7[1] | 1,054 |
    | 1,024 | 32 | 38.0[2] | 2,905 |
    | 8,192 | 1 | 11.7[3] | 1,181 |
    | 32,768 | 1 | 12.4[4] | 5,635 |

    - [1] Chip clocks dipped during this point's decode. Share of decode time below 1,323 MHz, chips 0 / 1 / 2 / 3 (%): 10.48 / 10.48 / 0.04 / 10.48. Times as measured, not corrected.
    - [2] Chip clocks dipped during this point's decode. Share of decode time below 1,323 MHz, chips 0 / 1 / 2 / 3 (%): 14.17 / 17.48 / 0 / 17.48. Times as measured, not corrected.
    - [3] Chip clocks dipped during this point's decode. Share of decode time below 1,323 MHz, chips 0 / 1 / 2 / 3 (%): 0 / 17.64 / 26.46 / 17.64. Times as measured, not corrected.
    - [4] Chip clocks dipped during this point's decode. Share of decode time below 1,323 MHz, chips 0 / 1 / 2 / 3 (%): 14.95 / 34.24 / 28.94 / 24.11. Times as measured, not corrected.
    - The clock footnotes cover the decode windows (TPOT) only.

    Measured 2026-11-16 09:28–09:31 (KST), outside the package container on the same files (byte-identical engine and adapter
    code); this release's proof measures the packaged image at the same points.

    ### Which profile
    - One user: `single-user`.
    - 2 to 32 concurrent users, or several users at long context: `batch`.

    ### Get the drafter (`single-user`)
    ```bash
    hf download RedHatAI/gemma-4-31B-it-speculator.dflash2 --revision b0cd01b4918aae6b6388272950c4f9851734674b
    ```

    ### Serve
    ```bash
    tt-model serve changh95/gemma4-31b-it-dflash                    # default profile: single-user
    tt-model serve changh95/gemma4-31b-it-dflash --profile batch
    tt-model profiles changh95/gemma4-31b-it-dflash
    ```
    - First start on a host (`single-user`): about 12.5 min to ready. It converts the resident engine's weights once
      (about 70 s: 22 GB from the 59 GB checkpoint) and compiles kernels once (about 9.5 min).
    - Later starts: about 2.5 min, including a sha256 check of the converted weights (seconds when they are in the page cache).
    - These start times were measured on update 1. Update 2 adds its prefill warm-up (see above); `batch`'s start-up is
      in the update 3 section.
    - Disk: about 31 GB under `~/.cache/tt-model/gemma4-31b-it-dflash` (22 GB converted weights, 9 GB compiled kernels),
      plus 22 GB for `batch`'s own weight copy once it has started. A package update that changes an engine converts that
      engine's copy again; `single-user`'s copy is unchanged by update 3.

    ### How to query
    ```bash
    curl http://localhost:20000/v1/chat/completions -H 'Content-Type: application/json' -d '{
      "model": "google/gemma-4-31B-it",
      "messages": [{"role": "user", "content": "Write a haiku about Blackhole chips."}],
      "max_tokens": 256, "temperature": 0,
      "chat_template_kwargs": {"enable_thinking": false}
    }'
    ```

    ### Known limitations
    - **Code-generation quality (BF4 weights).** On the same evaluation harness, run through update 1's `batch` decode
      path, a build of this model with BF8 weights scores higher on code generation:
      - MBPP: 0.566 (this build) vs 0.658, a significant gap (paired McNemar test, Holm-adjusted p ≈ 1e-6).
      - HumanEval: 0.835 vs 0.884, not significant.
      - About half of the MBPP gap is answers that never close their code block, mostly because they run long or repeat
        until the 512-token limit.
      - Long thinking traces repeat more often: 12.8% vs 8.8% are degenerate.
      - GSM8K, IFEval, MMLU-Pro, MATH-500 and RULER (8K) are within noise.
    - **Host-sampled requests in `batch`.** A request that needs CPU sampling (repetition, presence or frequency penalties,
      logprobs, or top_k above the device limit of 32) moves sampling for every concurrent request to the CPU while it is
      active.
      - At 32 users a decode step takes 277.5 ms while one of them carries a repetition penalty (the other 31
        default-sampled), against 26.9 ms when all 32 are greedy (update 3.1's proof, same code, with
        `OMP_NUM_THREADS=8`, which this package sets).
      - Greedy requests and the default device sampling are unaffected.
      - The full fix belongs in the vLLM TT plugin.
    - **`batch`: greedy text depends on load.** The engine changes its decode width (R = 1 / 8 / 32) as users join and
      leave, and the same greedy prompt can produce different text depending on how many other requests are running.
      At a fixed width, greedy text was bitwise stable under co-tenant churn for prompts that prefill in one step. A prompt
      that is chunked alongside others can see small differences.
    - **`batch`: prefix caching is off** (as on every profile): repeated prefixes are recomputed.
    - **Device memory.** Lowest free DRAM per chip measured on `batch`: 2.85 GB, briefly, right after a burst of 1K-prompt
      prefills at up to 32 users with a 200K-token request live (a 6.5 h, 491K-launch soak). At steady state about 6.3 GB,
      flat over the soak.
    - **Thermal clock dips.** On a QuietBox 2 chip 1 can lower its clock after about 20 s of sustained fast decode, raising
      per-token time by up to about 1.3–1.45× while it lasts (measured on earlier builds). Every table on this card
      notes the clock dips during its run.
    - **`batch`: host decode guard.** The engine refuses a decode mix whose conservative attention bound exceeds 40 units
      per core. With its KV pool (4,320 blocks, about 553K positions) no reachable mix comes near it (at most 25 of 40); it
      would matter only with a pool about 4.5 times larger (above 19,648 blocks).
    - **Update 2 evidence scope.** The paged-bucket prefill's runtime guard and its gating runs check program-cache growth
      and outputs; they did not record device buffer addresses. The drafter seed pre-warm's first-start (cold kernel
      cache) time is not measured.

    ### Results (tt-inference-server `--workflow benchmarks`)

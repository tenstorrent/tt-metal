model: zai-org/GLM-5.3-Flash
target:
  seq: 56320
  chunk: 5120
  dtype: bf16
tasks:
- id: R.1
  title: Checkpoint, intake approval, canonical prompt
  step: intake
  deps: []
  gate:
    cmd: python -m models.demos.common.bringup.intake.check_checkpoint && python -m models.demos.common.bringup.reference.prompt
    metrics:
      intake_approved: == 1
      prompt_hash_ok: == 1
      missing_tensors: == 0
      shape_mismatches: == 0
      count_mismatches: == 0
      config_mismatches: == 0
      checkpoint_tensors: '>= 1'
  paths:
  - models/demos/glm53_flash_d_p/bringup/spec.yaml
- id: R.2
  title: HF sanity on the model's loader (revision, smoke, accuracy floor); reference matches HF per layer and on logits (fp32)
  step: reference
  deps:
  - R.1
  gate:
    cmd: python -m models.demos.common.bringup.intake.check_hf_sanity && python -m models.demos.common.bringup.reference.check_hf
      --seq 4096
    metrics:
      revision_ok: == 1
      text_top1_acc: '>= 0.4'
      smoke_ok: == 1
      pcc_hidden_L*: '>= 0.9999'
      pcc_logits: '>= 0.9999'
      top1_match_frac: '>= 0.99'
  paths: &id001
  - models/demos/glm53_flash_d_p/reference
  - models/demos/glm53_flash_d_p/bringup/hooks.py
  - models/demos/glm53_flash_d_p/__init__.py
- id: R.3
  title: Reference chunked == one-shot (4096 in 2048) and block graphs replay exactly
  step: reference
  deps:
  - R.2
  gate:
    cmd: python -m models.demos.common.bringup.reference.check_reference --seq 4096 --chunk 2048
    metrics:
      pcc_hidden: '>= 0.99999'
      pcc_state_min: '>= 0.99999'
      graph_errors: == 0
      boundaries_missing: == 0
      graph_replay_maxabs: <= 0
  paths: *id001
- id: R.4
  title: Trim the checkpoint to layers 0-4 (the whole model was needed only for the HF sanity)
  step: intake
  deps:
  - R.2
  gate:
    cmd: python -m models.demos.common.bringup.intake.trim_checkpoint
    metrics:
      trim_done: == 1
      trim_verify_errors: == 0
      trim_freed_gb: '>= 0'
- id: G.s4096
  title: 'Golden s4096: 4096 tokens in 2048-token chunks, full dumps'
  step: goldens
  deps:
  - R.3
  gate:
    cmd: python -m models.demos.common.bringup.reference.generate_golden --rung s4096
    metrics:
      golden_layers: == 5
      golden_chunks: == 2
      golden_hash_ok: == 1
- id: G.s16384
  title: 'Golden s16384: 16384 tokens in 8192-token chunks'
  step: goldens

  gate:
    cmd: python -m models.demos.common.bringup.plan.opportunities --profile X.1
    metrics:
      opportunities_listed: '>= 1'
  paths:
  - models/demos/glm53_flash_d_p/bringup/opportunities.md
- id: X.3
  title: 'Final: full-target accuracy, warm full prefill (no readback), one warm chunk at several positions'
  step: perf
  deps:
  - X.2
  gate:
    cmd: BRINGUP_RUNG=s56320 scripts/run_safe_pytest.sh --run-all models/demos/common/bringup/tests/test_ladder.py && BRINGUP_FULL_PREFILL=1
      BRINGUP_PROFILE_OPS=1 TT_METAL_DEVICE_PROFILER=1 TT_METAL_PROFILER_MID_RUN_DUMP=1 TT_METAL_PROFILER_CPP_POST_PROCESS=1
      scripts/run_safe_pytest.sh --run-all models/demos/common/bringup/tests/test_profile.py && scripts/run_safe_pytest.sh
      --run-all models/demos/common/bringup/tests/test_positions.py
    metrics:
      pcc_layer_L*: '>= 0.97'
      pcc_state_min: '>= 0.97'
      prefill_ms_full: '> 0'
      pos_chunk: '>= 1'
      op_rows: '>= 1'
      timeline_ok: == 1

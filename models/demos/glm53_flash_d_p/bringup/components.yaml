# ======================================================================================================== model
- block_type: model
  step: embed
  tag: COMPOSED
  ttnn: ttnn.minimum (engine ids, V - 1; vocab 154880 is not a power of two) -> ttnn.embedding (replicated bf16 table) -> ttnn.repeat [1, 4] (4
    identical residual streams, [S, 16384])
  reuse: models/demos/mimo_v2_6_d_p/tt/model.py (embedding), models/demos/deepseek_v3_d_p/tt/mhc/tt_mhc.py:mhc_expand
  searched:
  - 'known_issues: Masking the engine''s pad id when the vocab is not a power of two'
  - 'tt_mhc.py:mhc_expand'
  notes: Replicated, no CCL.
- block_type: model
  step: final_norm
  tag: COMPOSED
  ttnn: ttnn.slice (4 streams) -> ttnn.add x 3 -> ttnn.multiply 0.25 (unweighted mean of the streams) -> ttnn.bringup.rms_norm (norm, eps 1e-5)
  reuse: models/demos/mimo_v2_6_d_p/tt/rms_norm.py:TtRMSNorm
  searched:
  - 'glm_ref.py:forward_chunk (mean over the 4 streams, then norm); tt_mhc.py:TtMHCHead is the weighted DeepSeek-V4 head, not GLM''s'
  notes: Replicated, no CCL.
- block_type: model
  step: lm_head
  tag: COMPOSED
  ttnn: ttnn.slice (last tokens) -> ttnn.linear (vocab-sharded, 38720 rows per chip, bf16, HiFi4) -> ttnn.all_gather (dim -1, axis 1) + ttnn.all_gather
    (dim -1, axis 0)
  reuse: models/demos/mimo_v2_6_d_p_2x2/tt (LM head over the 2x2 mesh)
  searched:
  - 'repo_map: Collectives and MoE dispatch on a 2D mesh'
  notes: Untied LM head. Logits only for the last tokens of a chunk.

# Gemma 4 31B disaggregated prefill serving on one Blackhole Galaxy.
#
# Paired with tt-d-gen/models/gemma4/dynamo-disagg-prefill.json and the
# decode endpoint id 1. The launcher must provide GEMMA4_MODEL_PATH,
# TT_CACHE_PATH, GEMMA4_PREFILL_LOAD_FULL_WEIGHTS, and
# PREFILL_MIGRATION_CLIENT_DIR. HF_HOME is derived under TT_CACHE_PATH.
rank_bindings:
  - {rank: 0, mesh_id: 0, mesh_host_rank: 0, env_overrides: {}}

mesh_graph_desc_path: tt_metal/fabric/mesh_graph_descriptors/single_bh_galaxy_torus_x_graph_descriptor.textproto

global_env:
  PREFILL_MANIFEST: "models/demos/gemma4/tt/runners/manifests/gemma4_31b.json"
  GEMMA4_MODEL_PATH: "${GEMMA4_MODEL_PATH}"
  PREFILL_HF_MODEL: "${GEMMA4_MODEL_PATH}"
  HF_HOME: "${TT_CACHE_PATH}/hf"
  HF_HUB_OFFLINE: "1"
  TT_CACHE_PATH: "${TT_CACHE_PATH}"
  GEMMA4_PREFILL_LOAD_FULL_WEIGHTS: "${GEMMA4_PREFILL_LOAD_FULL_WEIGHTS}"

  PREFILL_FABRIC_MODE: "2d"
  PREFILL_SP: "8"
  PREFILL_TP: "4"
  PREFILL_NUM_LAYERS: "60"
  PREFILL_CHUNK_SIZE: "8192"
  PREFILL_MAX_SEQ_LEN: "262144"
  PREFILL_NUM_USERS: "2"
  PREFILL_H2D_SERVICE_ID: "gemma4_prefill"
  PREFILL_USE_TRACE: "1"
  PREFILL_KV_ONLY_LAST_LAYER: "0"

  PREFILL_ENABLE_MIGRATION: "1"
  PREFILL_ENABLE_LAYER_ACK: "1"
  PREFILL_MIGRATION_WAIT_READY_MS: "600000"
  PREFILL_MIGRATION_TABLE_PATH: "/tmp/gemma4_kv_chunk_table.pb"
  PREFILL_MIGRATION_DEVICE_MAP_PATH: "/tmp/gemma4_kv_device_map.json"
  PREFILL_MIGRATION_CMD_QUEUE: "/mig_ep0_cmd"
  PREFILL_MIGRATION_TABLE_QUEUE: "/mig_ep0_table"
  PREFILL_MIGRATION_RESP_QUEUE: "/mig_ep0_resp"
  PREFILL_MIGRATION_CLIENT_DIR: "${PREFILL_MIGRATION_CLIENT_DIR}"

  TT_MIGRATION_SPSC_TRACE: "0"
  TT_METAL_ENABLE_BLACKHOLE_DRAM_PROGRAMMABLE_CORES: "0"
  LOGURU_LEVEL: "INFO"

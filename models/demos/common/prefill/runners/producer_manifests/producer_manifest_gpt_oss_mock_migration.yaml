# GPT-OSS Gate 1 producer manifest — checks the KV chunk address table by reading DRAM device-lessly
# via read_dram_umd and PCC'ing against golden. NO migration client attach.
#
# Drive with:
#   python -m models.demos.common.prefill.runners.prefill_producer \
#     --manifest models/demos/common/prefill/runners/producer_manifests/producer_manifest_gpt_oss_mock_migration.yaml
model:
  variant: gpt_oss_d_p
  num_layers: 36                          # [MATCH RUNNER] PREFILL_NUM_LAYERS
  max_seq_len: 56320                      # [MATCH RUNNER] PREFILL_MAX_SEQ_LEN
  chunk_size: 5120                        # [MATCH RUNNER] PREFILL_CHUNK_SIZE

transport:
  sp: 4                                   # [MATCH RUNNER] mesh rows on a Blackhole galaxy
  tp: 8                                   # [MATCH RUNNER] mesh cols
  h2d_service_id: gpt_oss_prefill         # [MATCH RUNNER] PREFILL_H2D_SERVICE_ID
  connect_timeout_s: 300                  # bump: gpt-oss-120b compile is minutes on the first run

workload:
  num_users: 2                            # [MATCH RUNNER] PREFILL_NUM_USERS
  chunks: "11"
  max_requests: 2
  interleave: round_robin
  check_pcc: true                         # producer PCCs its device-less read-back vs golden
  trace_dir: /localdev/gpt-oss-120b/prefill_traces/golden_a  # change to your staged golden trace

migration:
  issue: false                            # Gate 1 does NOT migrate — table read-back only
  table_path: /tmp/gpt_oss_kv_chunk_table.pb       # [MATCH RUNNER] PREFILL_MIGRATION_TABLE_PATH
  device_map_path: /tmp/gpt_oss_kv_device_map.json # [MATCH RUNNER] PREFILL_MIGRATION_DEVICE_MAP_PATH

env:
  PREFILL_SEND_SHUTDOWN: "1"              # close the H2D stream so the runner exits cleanly after the run
  PREFILL_STANDALONE_CHUNKED_PCC: "0.93"  # producer pass threshold (M3 uses same default)

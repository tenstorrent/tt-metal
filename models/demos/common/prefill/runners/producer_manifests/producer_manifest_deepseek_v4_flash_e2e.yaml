# DeepSeek-V4-Flash -- END-TO-END disaggregated prefill -> decode (DS4F-0263, 2026-09-25): the 43-layer prefill runner on
# host 31 (endpoint 1) prefills ONE prompt (PREFILL_PRODUCER_SLOT_TRACES=<trace dir>, overrides the trace_dir below) and
# migrates slot 0 into slot 0 of the blaze decode ring on hosts 29/48/30 (endpoint 2, --migration-decode-only), which
# decodes from prompt_len with the first token the runner computed (PREFILL_FIRST_TOKEN_DIR) and then runs the same
# prompt as plain prefill-by-decode for the TTFT/token reference. Driver process: PREFILL_NUM_USERS=1;
# --verify-migration off (the destination is another galaxy; check_pcc false: no golden at these lengths).
model:
  variant: deepseek_v4_flash
  num_layers: 43
  max_seq_len: 133120
  chunk_size: 5120
transport:
  sp: 8
  tp: 4
  h2d_service_id: dsv4_prefill
  connect_timeout_s: 900
workload:
  num_users: 1
  chunks: "1"
  max_requests: 1
  interleave: round_robin
  check_pcc: false
  trace_dir: /mnt/tt-data/sdawle/dsv4_flash_traces/e2e/e2e_256
migration:
  issue: true
  src_endpoint_id: 1
  dest_endpoint_id: 2     # != src -> cross-endpoint P->D pairing (connect_to remote endpoint 2)
  dst_slot_offset: 0      # slot 0 -> remote slot 0
  timeout_ms: 3600000
  done_file: /home/ttuser/sdawle/prefill_runs/e2e/done.sentinel
  handoff_path: /home/ttuser/sdawle/prefill_runs/e2e/handoff.json
  client_dir: /home/ttuser/sdawle/tt-llm-engine/disaggregation/migration/build_RelWithDebInfo/python
  cmd_queue: /mig_ep1_cmd
  table_queue: /mig_ep1_table
  resp_queue: /mig_ep1_resp
env:
  PREFILL_MIGRATION_TABLE_PATH: /tmp/dsv4_kv_table.pb
  PREFILL_MIGRATION_DEVICE_MAP_PATH: /tmp/dsv4_kv_devmap.json
  PREFILL_FIRST_TOKEN_DIR: /home/ttuser/sdawle/prefill_runs/e2e/first_token
  PREFILL_HF_MODEL: /mnt/tt-data/sdawle/models/DeepSeek-V4-Flash-0731
  PREFILL_TTNN_CACHE: /mnt/tt-data/sdawle/dsv4_flash_ttnn_cache

model:
  variant: deepseek_v3_d_p
  num_layers: 61
  max_seq_len: 56320
  chunk_size: 5120

transport:
  sp: 8
  tp: 4
  h2d_service_id: ds_prefill
  connect_timeout_s: 120

workload:
  num_users: 4
  chunks: "11"
  max_requests: 4
  interleave: round_robin
  check_pcc: true
  trace_dir: /mnt/models/deepseek-prefill-cache/golden/structured_traces/vllm-kimi-k27-codedebug-56320

migration:
  issue: true
  # Equal to src_endpoint_id => loopback: src and dst slots share one table.
  dest_endpoint_id: 1
  # Omitted pairs => dst_slot_offset defaults to num_users, giving 0->4,1->5,2->6,3->7.
  timeout_ms: 3600000
  done_file: /tmp/migration_done.sentinel
  client_dir: /data/nmilicevic/tt-llm-engine/disaggregation/migration/build_RelWithDebInfo/python
  cmd_queue: /mig_ep1_cmd
  table_queue: /mig_ep1_table
  resp_queue: /mig_ep1_resp
  table_path: /tmp/prefill_kv_chunk_table.pb
  device_map_path: /tmp/prefill_kv_device_map.json

env:
  PREFILL_PCC_GOLDEN_LEN: "56320"
  PREFILL_STANDALONE_CHUNKED_PCC: "0.85"
  PREFILL_VERIFY_MIGRATION: "both"
  # Leave the runner serving between driver runs; set to 1 on the final pass.
  PREFILL_SEND_SHUTDOWN: "0"

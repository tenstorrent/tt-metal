model:
  # Resolves the producer's adapter (prefill_producer.py maps model.variant -> PREFILL_MODEL).
  # It must name the MODEL, not the model family: only the Kimi adapter carries the drafter
  # checkpoint and golden defaults, so a family name silently skips the drafter PCC half.
  variant: kimi_k2_7
  num_layers: 61
  max_seq_len: 56320
  chunk_size: 5120

transport:
  sp: 8
  tp: 4
  h2d_service_id: ds_prefill
  connect_timeout_s: 120

workload:
  num_users: 4
  chunks: "11"
  max_requests: 4
  interleave: round_robin
  check_pcc: true
  trace_dir: /mnt/models/deepseek-prefill-cache/golden/structured_traces/vllm-kimi-k27-codedebug-56320

migration:
  issue: true
  # Equal to src_endpoint_id => loopback: src and dst slots share one table.
  dest_endpoint_id: 1
  # Omitted pairs => dst_slot_offset defaults to num_users, giving 0->4,1->5,2->6,3->7.
  timeout_ms: 3600000
  done_file: /tmp/migration_done_dflash.sentinel
  client_dir: /data/nmilicevic/tt-llm-engine/disaggregation/migration/build_RelWithDebInfo/python
  cmd_queue: /mig_ep1_cmd
  table_queue: /mig_ep1_table
  resp_queue: /mig_ep1_resp
  table_path: /tmp/prefill_kv_chunk_table_dflash.pb
  device_map_path: /tmp/prefill_kv_device_map_dflash.json

env:
  PREFILL_PCC_GOLDEN_LEN: "56320"
  PREFILL_STANDALONE_CHUNKED_PCC: "0.85"
  PREFILL_VERIFY_MIGRATION: "both"
  # The drafter gate tracks the verifier's and never sits above it: drafter V is unnormalized and
  # carries the verifier's own error, so a tighter gate fires when the verifier merely sits near its
  # floor rather than when the drafter regresses. K is normalized by RMSNorm+RoPE and clears both by a
  # wide margin, so this is effectively a V gate. The module default 0.88 is a K2.6 value that does not
  # hold for K2.7 at full depth.
  PREFILL_DFLASH_PCC: "0.85"
  # Leave the runner serving between driver runs; set to 1 on the final pass.
  PREFILL_SEND_SHUTDOWN: "0"

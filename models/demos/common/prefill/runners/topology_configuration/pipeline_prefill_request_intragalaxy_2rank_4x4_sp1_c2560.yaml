# pipeline_prefill_request_intragalaxy_2rank_4x4_sp1.yaml at 2,560-token chunks, with a 256 KB D2D FIFO.
# Same 2-stage intra-galaxy layout: one 8x4 galaxy carved into its top tray half (rows 0-3, mesh 0) and
# bottom tray half (rows 4-7, mesh 1), SP=4 on axis 1 (ring) and TP=4 on axis 0 (line).
#
# The chunk size and the FIFO size go together. The receiver FIFO is L1 on the D2D worker cores, above
# the static CBs of the ops that run on them, and those CBs grow with the rows per chip:
#   - 5,120-token chunks (1280 per chip): ring_mla's CBs reach to within ~1.5 KB of the top of L1, so
#     only the 256 B default fits (see the base binding).
#   - 2,560-token chunks (640 per chip): 256 KB fits. 512 KB clashes with
#     dit_fused_distributed_rmsnorm's CBs on rank 1.
# At the 256 B default the 2-stage pipeline runs at ~0.5x one stage. With 256 KB it reaches 1.6x one
# stage end to end and ~1.8x in steady state (GLM-5.3, 12 layers, traced).
#
# TT_VISIBLE_DEVICES is PER-GALAXY: another galaxy enumerates differently and a wrong map does not
# error. Regenerate for your host with
#   python models/demos/deepseek_v3_d_p/utils/gen_pipeline_binding.py --layout 4x4 \
#     --template models/demos/common/prefill/runners/topology_configuration/pipeline_prefill_request_intragalaxy_2rank_4x4_sp1_c2560.yaml

rank_bindings:
  - {rank: 0, mesh_id: 0, mesh_host_rank: 0, env_overrides: {TT_VISIBLE_DEVICES: ""}}
  - {rank: 1, mesh_id: 1, mesh_host_rank: 0, env_overrides: {TT_VISIBLE_DEVICES: ""}}

mesh_graph_desc_path: models/demos/common/prefill/runners/topology_configuration/pipeline_prefill_intragalaxy_2x4x4_sp1_mgd.textproto

global_env:
  # SP's ring is the X axis, matched by the descriptor's dim_types [LINE, RING].
  PREFILL_FABRIC_MODE: "2d_torus_x"
  PREFILL_SP: "4"
  PREFILL_TP: "4"
  PREFILL_SP_AXIS: "1"
  PREFILL_CHUNK_SIZE: "2560"
  # A multiple of the 2,560-token chunk and of 4,096: the runner's KV cache stripes each slot over the 16 chips,
  # and every slot must start on DRAM bank 0 (16 stripes x 8 banks x 32 tokens; kv_bank_alignment.py).
  PREFILL_MAX_SEQ_LEN: "20480"
  PREFILL_H2D_SERVICE_ID: "ds_prefill"
  PREFILL_PP_D2D_FIFO_BYTES: "262144"
  LOGURU_LEVEL: "INFO"

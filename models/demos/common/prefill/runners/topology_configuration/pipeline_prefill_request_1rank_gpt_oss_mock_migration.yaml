# GPT-OSS Gate 1 (mock migration): 1-rank REQUEST mode; runner serializes the KV chunk table + device
# map, then the producer reads each chunk device-lessly via read_dram_umd and PCCs against golden.
# No migration endpoint / worker involved. See ADDING_A_PREFILL_MODEL.md + PREFILL_MIGRATION_TESTING.md
# gate 1.
rank_bindings:
  - {rank: 0, mesh_id: 0, mesh_host_rank: 0, env_overrides: {}}
mesh_graph_desc_path: tt_metal/fabric/mesh_graph_descriptors/single_bh_galaxy_torus_x_graph_descriptor.textproto
global_env:
  PREFILL_MANIFEST: "models/demos/gpt_oss_d_p/tt/runners/manifests/gpt_oss_d_p.json"
  PREFILL_FABRIC_MODE: "2d"
  PREFILL_MAX_SEQ_LEN: "56320"           # per-user KV cap; must be multiple of chunk_size
  PREFILL_CHUNK_SIZE: "5120"             # tokens per prefill_chunk (matches SP=4 alignment)
  PREFILL_NUM_USERS: "2"                 # slot indexing space for the mock table
  PREFILL_H2D_SERVICE_ID: "gpt_oss_prefill"
  PREFILL_GATE_FALLBACK_MODE: "DEVICE_FP32"
  LOGURU_LEVEL: "INFO"

  # Gate 1: mock migration — runner writes the table + device map and exits when the producer is done.
  PREFILL_MOCK_MIGRATION: "1"
  PREFILL_MIGRATION_TABLE_PATH: "/tmp/gpt_oss_kv_chunk_table.pb"
  PREFILL_MIGRATION_DEVICE_MAP_PATH: "/tmp/gpt_oss_kv_device_map.json"

# 2-stage intra-galaxy pipeline prefill at stage shape [4,4] (SP=4 x TP=4): one BH galaxy carved into
# its top and bottom halves (rev C: trays 1+2 / 3+4, rev A/B: trays 1+3 / 2+4), one rank per half,
# hidden state hopping between them over a MeshSocket. Rank 0 serves an external prefill_producer;
# model selected by PREFILL_MANIFEST.
#
# TT_VISIBLE_DEVICES is PER-GALAXY: a wrong map does not error, it builds stages that are not halves.
# Regenerate for your host with
#   python models/demos/deepseek_v3_d_p/utils/gen_pipeline_binding.py --stage-shape 4x4
#
# torus_x: each half wraps only its 4-wide in-tray axis, which is mesh axis 1 (TP) here, so TP
# collectives are Ring and SP collectives are Linear. A half's 4-row axis has no wrap, so torus_xy is
# not possible.

rank_bindings:
  - {rank: 0, mesh_id: 0, mesh_host_rank: 0, env_overrides: {TT_VISIBLE_DEVICES: "REGENERATE"}}
  - {rank: 1, mesh_id: 1, mesh_host_rank: 0, env_overrides: {TT_VISIBLE_DEVICES: "REGENERATE"}}

mesh_graph_desc_path: models/demos/deepseek_v3_d_p/experimental_descriptors/single_bh_galaxy_2x4x4_z_torus_x_graph_descriptor.textproto

global_env:
  PREFILL_FABRIC_MODE: "2d_torus_x"
  PREFILL_SP: "4"
  PREFILL_TP: "4"
  PREFILL_H2D_SERVICE_ID: "ds_prefill"
  # Only 12B of metadata transits the queue, so reducing its size has no effect on transfer speed.
  # Keeping it default (64KB) clashes with the MoE FFN L1 allocation.
  PREFILL_PP_D2D_FIFO_BYTES: "32768"
  LOGURU_LEVEL: "INFO"

# Kimi-K3, ALL 93 layers across 4 Galaxies (24/24/24/21).
#
# Four ranks, not three, and not two:
#   * memory -- ~717 MiB/chip/layer against 31.85 GiB/chip. 93 over two ranks is 46/47 each and
#     OOMs during weight loading; over four it is 16.8 GiB/rank with room to spare.
#   * circular-buffer placement -- MLA's static CBs become unplaceable past ~36 layers on a rank
#     (40 fails, 36 passes; #54876). 24 sits well inside that.
#
# Every boundary is a multiple of 12. A rank starting mid-block would inherit an incomplete AttnRes
# sealed set, and its local layer 0 would fire a seal the architecture does not have there.
#
# Handoff payload grows with depth: rank 0 sends 3 planes, rank 1 sends 5, rank 2 sends 7 (one live
# stream plus one per sealed snapshot, k = boundary // 12). ~2.29 MB/chip/plane/chunk.
#
# FABRIC_2D, never a torus: attn_res_gather_softmax deadlocks under Topology::Ring (#54835).
#
# TWO-USER variant. Everything else matches the 1-user 93-layer binding; only PREFILL_NUM_USERS moves.
# The KV cache is `num_users * num_layers` slots of max_seq_len, so this doubles KV -- but KV is
# sharded over SP and is ~26 MB/chip at one user, against ~15 GiB/chip left after weights, so the
# cost is noise. What this actually exercises is the slot machinery: two concurrent cache slots,
# interleaved pushes, and per-slot KV ranges that must not bleed into each other.
#
# The producer side needs PREFILL_PRODUCER_MAX_REQUESTS >= 2 as well, or it stops after the first
# slot completes and the second user's request is left unfinished.
rank_bindings:
  - {rank: 0, mesh_id: 0, mesh_host_rank: 0, env_overrides: {}}
  - {rank: 1, mesh_id: 1, mesh_host_rank: 0, env_overrides: {}}
  - {rank: 2, mesh_id: 2, mesh_host_rank: 0, env_overrides: {}}
  - {rank: 3, mesh_id: 3, mesh_host_rank: 0, env_overrides: {}}
# The RING/RING descriptor, NOT the fabric2d one. `dim_types` describes how the galaxies are
# physically CABLED, not how the model routes: discovery reports intra-mesh degrees
# {4:24, 5:8} on this hardware, which is the RING signature. The fabric2d descriptor declares
# LINE/LINE ({2:4, 3:16, 4:12}) and the mapper rejects it -- 'Graph specified in MGD could not
# fit in the discovered physical topology'. Routing is chosen separately by
# PREFILL_FABRIC_MODE=2d below, which is linear routing over the wrapped wiring and is what
# Kimi-K3 needs (attn_res_gather_softmax deadlocks under Topology::Ring, #54835). The working
# 2-rank config pairs these two the same way.
mesh_graph_desc_path: models/demos/common/prefill/runners/topology_configuration/pipeline_prefill_4galaxy_connected_mesh_graph_descriptor.textproto
global_env:
  PREFILL_FABRIC_MODE: "2d"
  PREFILL_MANIFEST: "models/demos/deepseek_v3_d_p/tt/runners/manifests/kimi_k3.json"
  PREFILL_MODEL: "kimi_k3"
  PREFILL_NUM_LAYERS: "93"
  # Explicit rather than relying on the even split: 93/4 is 23.25, which would snap somewhere, and
  # the split is the thing under test.
  PREFILL_PP_LAYER_COUNTS: "24,24,24,21"
  PREFILL_NUM_USERS: "2"
  PREFILL_MAX_SEQ_LEN: "56320"
  PREFILL_H2D_SERVICE_ID: "ds_prefill"
  PREFILL_GATE_FALLBACK_MODE: "DEVICE_FP32"
  PREFILL_LAYER_ACK_D2H: "1"
  PREFILL_LAYER_ACK_FIFO_BYTES: "65536"
  LOGURU_LEVEL: "INFO"

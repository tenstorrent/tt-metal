# Kimi-K3, 2 ranks across 2 Galaxies, 72 of 93 layers (36+36).
#
# 72 layers, not 93, and that is a hard limit rather than a choice. A Blackhole Galaxy has
# 34.2 GB/chip (31.85 GiB) and Kimi-K3 averages ~717 MiB/chip/layer of DEVICE allocation, so a rank
# tops out near 44 layers. 93 over two ranks is 46.5 each and OOMs during weight loading; confirmed
# three times, byte-identically at num_users 2 and 1 and at capacity_factor 8 and 2, because the OOM
# happens before either takes effect (capacity_factor allocates nothing at construction at all).
#
# Do NOT compare that against "517 MB/chip/layer of tensorbins on disk" and read the difference as
# overhead — that division by 32 is only valid for the routed experts. Every other weight is
# TP-sharded but SP-REPLICATED, so dividing its file size by 32 undercounts it 8x. The per-layer
# cost is really ~496 MiB routed experts (already bfloat4_b, no headroom below it) + ~170 MiB
# bfloat16 KDA input projection + ~50 MiB the rest. The one lever with enough room to reach 47
# layers/rank is the KDA projections at bfloat8_b (~101 MiB/KDA layer), which needs a full cache
# rebuild since dtype is in the tensorbin name.
#
# All 93 layers needs a third rank. The tree does have 3-mesh descriptors
# (3_quad_bh_galaxy_3x32x4_torus, triple_pod_*), but they describe quad-galaxy pods —
# dims [32,4] with host_topology [4,1] — not the [8,4]/[1,1] single-galaxy-per-mesh geometry this
# pipeline needs, and the hand-written one here fails inter-mesh mapping.
#
# 36+36 sits well inside the ceiling and lands on AttnRes block boundaries (multiples of 12); a rank
# starting mid-block would have an incomplete sealed set.
rank_bindings:
  - {rank: 0, mesh_id: 0, mesh_host_rank: 0, env_overrides: {}}
  - {rank: 1, mesh_id: 1, mesh_host_rank: 0, env_overrides: {}}
mesh_graph_desc_path: models/demos/common/prefill/runners/topology_configuration/pipeline_prefill_2galaxy_connected_mesh_graph_descriptor.textproto
global_env:
  # FABRIC_2D, never a torus: attn_res_gather_softmax deadlocks under Topology::Ring (#54835).
  PREFILL_FABRIC_MODE: "2d"
  PREFILL_MANIFEST: "models/demos/deepseek_v3_d_p/tt/runners/manifests/kimi_k3.json"
  PREFILL_MODEL: "kimi_k3"
  PREFILL_NUM_LAYERS: "72"
  PREFILL_NUM_USERS: "1"
  PREFILL_MAX_SEQ_LEN: "56320"
  PREFILL_H2D_SERVICE_ID: "ds_prefill"
  PREFILL_GATE_FALLBACK_MODE: "DEVICE_FP32"
  PREFILL_LAYER_ACK_D2H: "1"
  LOGURU_LEVEL: "INFO"

# Kimi-K3 CORRECTNESS gate: 2 ranks across 2 Galaxies, 24 layers split 12+12.
#
# 24 layers, not 72, because this is the only depth the golden traces cover
# (k3_vllm_code_debug_1M records decoder_output_layer_0..24 and the KV of every MLA layer
# in that range). A 72-layer run has no oracle, so it can only be checked for "does it
# still run" — this rung is what makes a 72-layer number mean anything.
#
# 12+12 is the smallest split that exercises the cross-rank AttnRes handoff: the boundary
# at layer 12 hands over k=1 sealed snapshot, through the identical code path a 36/36
# split uses with k=3. Rank 1 owns MLA layers 15, 19 and 23, and those KV slabs are
# written from reads that only exist if the inherited sealed set arrived — so they are the
# load-bearing check, not rank 0's layers 3/7/11, which would pass even with the bug.
#
# Untraced on purpose. Trace is worth 1.81x and is how perf is measured, but it adds the
# capture/replay path on top of the thing under test; correctness first, then re-run with
# PREFILL_USE_TRACE=1 to cover the _trace_input ownership fix (whose signature is
# corruption from chunk 2 onward, invisible in a single-chunk run).
rank_bindings:
  - {rank: 0, mesh_id: 0, mesh_host_rank: 0, env_overrides: {}}
  - {rank: 1, mesh_id: 1, mesh_host_rank: 0, env_overrides: {}}
mesh_graph_desc_path: models/demos/common/prefill/runners/topology_configuration/pipeline_prefill_2galaxy_connected_mesh_graph_descriptor.textproto
global_env:
  # FABRIC_2D, never a torus: attn_res_gather_softmax deadlocks under Topology::Ring (#54835).
  PREFILL_FABRIC_MODE: "2d"
  PREFILL_MANIFEST: "models/demos/deepseek_v3_d_p/tt/runners/manifests/kimi_k3.json"
  PREFILL_MODEL: "kimi_k3"
  PREFILL_NUM_LAYERS: "24"
  # Explicit rather than relying on the even split: this is the property under test, and a
  # snapped-but-different split would still run and quietly test something else.
  PREFILL_PP_LAYER_COUNTS: "12,12"
  PREFILL_NUM_USERS: "1"
  PREFILL_MAX_SEQ_LEN: "56320"
  PREFILL_H2D_SERVICE_ID: "ds_prefill"
  PREFILL_GATE_FALLBACK_MODE: "DEVICE_FP32"
  PREFILL_LAYER_ACK_D2H: "1"
  PREFILL_ENABLE_LAYER_ACK: "1"
  # 792 acks would overflow the 341-record default; 24 layers x 11 chunks = 264 fits, but
  # set it anyway so the drain is not the thing that fails (#54869).
  PREFILL_LAYER_ACK_FIFO_BYTES: "65536"
  LOGURU_LEVEL: "INFO"

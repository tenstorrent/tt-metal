# REQUEST mode, 2-rank D2D pipeline, MOCK migration for the device-less producer PCC test.
# Same topology as pipeline_prefill_request_2rank.yaml, but migration is enabled in MOCK mode:
# every rank all-gathers its stage into the merged KV chunk table, rank 0 serializes it to a SHARED
# (NFS) path, and EVERY rank writes its own fabric_node->ASIC device map to a HOST-LOCAL path. A
# co-located prefill_producer.py reads KV back via read_dram_umd using its host's map (which resolves
# only its host's chips, so each producer naturally PCCs only its own stage's layers). No migration
# worker runs. num_ranks>1 routes per-layer completions through the master's LayerCompletionRouter.
rank_bindings:
  - {rank: 0, mesh_id: 0, mesh_host_rank: 0, env_overrides: {}}
  - {rank: 1, mesh_id: 1, mesh_host_rank: 0, env_overrides: {}}
mesh_graph_desc_path: models/demos/common/prefill/runners/topology_configuration/pipeline_prefill_2galaxy_connected_mesh_graph_descriptor.textproto
global_env:
  # Absolute path so every rank loads the SAME manifest regardless of CWD; -x forwarding of a
  # shell-set PREFILL_MANIFEST reaches only the local rank, leaving remote ranks on the module
  # default model (and default PREFILL_PP_D2D_FIFO_BYTES) -> D2D chunk-plan desync between stages.
  PREFILL_MANIFEST: "/home/jjovicic/tt-metal/models/demos/deepseek_v3_d_p/tt/runners/manifests/kimi26.json"
  PREFILL_FABRIC_MODE: "2d"
  PREFILL_MAX_SEQ_LEN: "56320"
  PREFILL_H2D_SERVICE_ID: "ds_prefill"
  PREFILL_GATE_FALLBACK_MODE: "DEVICE_FP32"

  PREFILL_ENABLE_MIGRATION: "1"
  PREFILL_MOCK_MIGRATION: "1"
  # Table is shared so both hosts' producers read the same merged layout; device map is host-local
  # so each rank overwrites its own host's copy (the driver points every rank at the same names).
  PREFILL_MIGRATION_TABLE_PATH: "/data/jjovicic/prefill_mr/kv_chunk_table.pb"
  PREFILL_MIGRATION_DEVICE_MAP_PATH: "/tmp/prefill_kv_device_map.json"
  # Per-user DONE-sentinel path: the default /tmp/migration_done.sentinel is world-visible and
  # sticky-bit /tmp blocks removing another user's stale copy, hard-crashing rank-0 bringup.
  MIGRATION_DONE_FILE: "/tmp/prefill_migration_done_jjovicic.sentinel"
  LOGURU_LEVEL: "INFO"

# REQUEST mode (unbounded, H2D-driven), 1 rank, MOCK migration for the device-less producer PCC test.
# Same as pipeline_prefill_request_1rank.yaml but migration runs in MOCK mode: rank 0 builds + serializes
# the merged KV chunk table and writes its local fabric_node->ASIC device map, for a co-located
# prefill_producer.py to read KV back via read_dram_umd WITHOUT a migration worker. Single-rank, so
# every layer is local (the producer PCCs all of them) and the LayerAck channel is the direct one.
rank_bindings:
  - {rank: 0, mesh_id: 0, mesh_host_rank: 0, env_overrides: {}}
mesh_graph_desc_path: tt_metal/fabric/mesh_graph_descriptors/single_bh_galaxy_torus_x_graph_descriptor.textproto
global_env:
  PREFILL_FABRIC_MODE: "2d"
  PREFILL_MAX_SEQ_LEN: "56320"
  PREFILL_H2D_SERVICE_ID: "ds_prefill"
  PREFILL_GATE_FALLBACK_MODE: "DEVICE_FP32"

  PREFILL_ENABLE_MIGRATION: "1"
  PREFILL_MOCK_MIGRATION: "1"
  PREFILL_MIGRATION_TABLE_PATH: "/tmp/prefill_kv_chunk_table_jjovicic.pb"
  PREFILL_MIGRATION_DEVICE_MAP_PATH: "/tmp/prefill_kv_device_map.json"
  # Per-user DONE-sentinel path: the default /tmp/migration_done.sentinel is world-visible and
  # sticky-bit /tmp blocks removing another user's stale copy, hard-crashing rank-0 bringup.
  MIGRATION_DONE_FILE: "/tmp/prefill_migration_done_jjovicic.sentinel"
  LOGURU_LEVEL: "INFO"

# REQUEST mode (unbounded, H2D-driven), 1 rank. No PREFILL_STANDALONE => request loop. rank0 builds the
# H2D service + waits; drive it with prefill_producer.py on this host.
#
# Model config comes from PREFILL_MANIFEST (kimi27.json => PREFILL_MODEL=kimi_k2_7); this file stays
# topology + run knobs.
# PRECEDENCE: ttrun injects global_env into every rank's environment BEFORE python starts, and
# _apply_manifest_env() uses os.environ.setdefault -- so anything set here WINS over the manifest.
# kimi27.json's unshadowed contribution below is PREFILL_MODEL=kimi_k2_7.
#
# FABRIC/MGD PAIRING: PREFILL_FABRIC_MODE=2d_torus_xy wraps BOTH axes into rings, so it must match a
# descriptor whose device_topology dim_types are [RING, RING] -- a Ring collective on an axis the
# fabric does not wrap hangs. single_bh_galaxy_torus_xy is [RING, RING]; torus_x is [LINE, RING].
rank_bindings:
  - {rank: 0, mesh_id: 0, mesh_host_rank: 0, env_overrides: {}}
mesh_graph_desc_path: tt_metal/fabric/mesh_graph_descriptors/single_bh_galaxy_torus_xy_graph_descriptor.textproto
global_env:
  # --- model selection -----------------------------------------------------------------
  PREFILL_MANIFEST: "models/demos/deepseek_v3_d_p/tt/runners/manifests/kimi27.json"

  # --- topology / transport ------------------------------------------------------------
  PREFILL_FABRIC_MODE: "2d_torus_xy"
  PREFILL_H2D_SERVICE_ID: "ds_prefill"
  PREFILL_PP_D2D_FIFO_BYTES: "4096"
  PREFILL_STANDALONE: "0"

  # --- model shape ---------------------------------------------------------------------
  PREFILL_NUM_LAYERS: "61"
  PREFILL_NUM_USERS: "64"
  PREFILL_CHUNK_SIZE: "5120"
  PREFILL_MAX_SEQ_LEN: "10240"
  PREFILL_GATE_FALLBACK_MODE: "DEVICE_FP32"
  PREFILL_STANDALONE_PCC: "0"

  # --- migration: file-export handoff to the KV manager (tt-d-gen) ---------------------
  PREFILL_ENABLE_MIGRATION: "1"
  PREFILL_MIGRATION_EXPORT_TO_FILE: "1"
  PREFILL_MIGRATION_TABLE_PATH: "/data/ljovanovic/prefil_kv_table.pb"
  # Per-layer ack channel. Real knob name is PREFILL_ENABLE_LAYER_ACK (there is no
  # PREFILL_LAYER_ACK_D2H); it already defaults to PREFILL_ENABLE_MIGRATION, set here to be explicit.
  PREFILL_ENABLE_LAYER_ACK: "1"
  # Device map lands at /tmp/prefill_device_map.txt unless set here (host-local, one
  # "mesh_id chip_id umd_id" line per chip). Uncomment to put it next to the table:
  # PREFILL_MIGRATION_DEVICE_MAP_PATH: "/data/ljovanovic/prefill_device_map.txt"

  # --- runtime / logging ---------------------------------------------------------------
  TT_METAL_ENABLE_BLACKHOLE_DRAM_PROGRAMMABLE_CORES: "0"
  LOGURU_LEVEL: "INFO"

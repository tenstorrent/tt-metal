rank_bindings:
  - {rank: 0, mesh_id: 0, mesh_host_rank: 0, env_overrides: {}}
mesh_graph_desc_path: models/demos/common/prefill/runners/topology_configuration/ci/sc1_mgd.textproto
global_env:
  PREFILL_MANIFEST: "models/demos/deepseek_v3_d_p/tt/runners/manifests/kimi27_dflash.json"
  PREFILL_FABRIC_MODE: "2d_torus_xy"
  PREFILL_GATE_FALLBACK_MODE: "DEVICE_FP32"
  PREFILL_H2D_SERVICE_ID: "ds_prefill"
  # Weight load is NFS-bandwidth-bound at ~9.1 GB/layer; 4 layers trades 75 min for ~6 min
  # and still exercises every migration stage, which is depth-independent.
  PREFILL_NUM_LAYERS: "4"
  PREFILL_MAX_SEQ_LEN: "56320"
  PREFILL_CHUNK_SIZE: "5120"

  # Runner slots must cover every destination: the driver prefills 0..3 and the
  # default dst_slot_offset (= the driver's num_users) maps them onto 4..7.
  PREFILL_NUM_USERS: "8"

  # dflash forbids device trace, so keep it off here too — results stay transferable.
  PREFILL_USE_TRACE: "0"
  PREFILL_LAYER_ACK_D2H: "1"
  PREFILL_SYNC_PER_CHUNK: "1"

  PREFILL_ENABLE_MIGRATION: "1"
  PREFILL_MIGRATION_WAIT_READY_MS: "120000"
  PREFILL_MIGRATION_ATTACH_WAIT_S: "0"
  PREFILL_MIGRATION_TABLE_PATH: "/tmp/prefill_kv_chunk_table_dflash_smoke4.pb"
  PREFILL_MIGRATION_DEVICE_MAP_PATH: "/tmp/prefill_kv_device_map_dflash_smoke4.json"
  PREFILL_MIGRATION_CMD_QUEUE: "/mig_ep1_cmd"
  PREFILL_MIGRATION_TABLE_QUEUE: "/mig_ep1_table"
  PREFILL_MIGRATION_RESP_QUEUE: "/mig_ep1_resp"
  PREFILL_MIGRATION_CLIENT_DIR: "/data/nmilicevic/tt-llm-engine/disaggregation/migration/build_RelWithDebInfo/python"

  LOGURU_LEVEL: "INFO"

# GLM-5.2 MTP7, REQUEST mode, 2-rank D2D pipeline across two galaxies. rank0 builds the H2D
# service and runs the front of the trunk; rank1 owns the trunk tail plus the 7 MTP levels.
rank_bindings:
  - {rank: 0, mesh_id: 0, mesh_host_rank: 0, env_overrides: {}}
  - {rank: 1, mesh_id: 1, mesh_host_rank: 0, env_overrides: {}}
mesh_graph_desc_path: models/demos/common/prefill/runners/topology_configuration/pipeline_prefill_2galaxy_connected_mesh_graph_descriptor.textproto
global_env:
  # In global_env rather than an export: tt-run applies it to every rank, while -x reaches only the
  # launch host. Repo-relative, resolved from the launch CWD.
  PREFILL_MANIFEST: "models/demos/deepseek_v3_d_p/tt/runners/manifests/glm52_mtp7.json"
  PREFILL_FABRIC_MODE: "2d_torus_xy"
  PREFILL_MAX_SEQ_LEN: "56320"
  PREFILL_H2D_SERVICE_ID: "ds_prefill"
  PREFILL_GATE_FALLBACK_MODE: "DEVICE_FP32"

  PREFILL_TRACE_DIR: "/mnt/models/deepseek-prefill-cache/glm-traces/vllm-glm52-indexer-kcache-55k"

  # KV read-back at 2 ranks needs BOTH of these: the in-block mock path is what makes every rank
  # join the KV-table allgather, so rank 0's merged table spans the MTP slots too.
  PREFILL_ENABLE_MIGRATION: "1"
  PREFILL_MOCK_MIGRATION: "1"
  # The table must be on shared storage (only rank 0 writes it); the device map stays host-local.
  PREFILL_MIGRATION_TABLE_PATH: "generated/mtp7_2rank_kv_table.pb"
  PREFILL_MIGRATION_DEVICE_MAP_PATH: "/tmp/mtp7_2rank_devmap.json"
  PREFILL_ENABLE_LAYER_ACK: "1"
  PREFILL_LAYER_ACK_D2H: "1"
  LOGURU_LEVEL: "INFO"

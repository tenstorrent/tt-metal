# GLM-5.2 MTP4 (#53533), REQUEST mode, 2-rank D2D pipeline across TWO galaxies.
# Trunk split (compute_layer_split(78, 2, glm_5_2 boundaries, mtp_levels=4)) = rank0 layers 0..41,
# rank1 layers 42..77 + the 4 MTP levels; MTP costs 4 block-equivalents, which is why the split is
# 42/36 and not 39/39. rank0 builds the H2D service; rank1 receives over D2D and owns the MTP tail.
#
#   ./models/demos/common/prefill/runners/run_pipeline_prefill.sh \
#       models/demos/common/prefill/runners/topology_configuration/pipeline_prefill_request_2rank_mtp4.yaml \
#       bh-glx-110-d04u02:1,bh-glx-110-d04u08:1 ens5f0np0
#
# then, on the launch host (rank 0's host):
#   PREFILL_MTP_LEVELS=4 PREFILL_NUM_LAYERS=78 PREFILL_MODEL=glm_5_2 PREFILL_NUM_USERS=1 \
#   PREFILL_MAX_SEQ_LEN=56320 PREFILL_CHUNK_SIZE=5120 PREFILL_H2D_SERVICE_ID=ds_prefill \
#   PREFILL_PRODUCER_CHUNKS=11 PREFILL_PRODUCER_MAX_REQUESTS=1 PREFILL_SEND_SHUTDOWN=1 \
#     python -m models.demos.common.prefill.runners.prefill_producer
#
# The producer runs standalone (not under a launcher), so it is just the master and CHECK_PCC stays 0:
# the multi-rank "requires CHECK_PCC=1" rule is about launching the PRODUCER multi-rank, not the runner.
# KV read-back at 2 ranks needs ENABLE_MIGRATION=1 AND MOCK_MIGRATION=1: the in-block mock path (the
# second _mock_migration check in prefill_runner.py) has every rank join allgather_kv_stage_layouts, so
# rank 0's merged table spans layers 0..81, and it is checked before is_first_rank so no rank blocks on
# a worker. TABLE_PATH must be SHARED (only rank 0 writes it); DEVICE_MAP_PATH stays host-local.
rank_bindings:
  - {rank: 0, mesh_id: 0, mesh_host_rank: 0, env_overrides: {}}
  - {rank: 1, mesh_id: 1, mesh_host_rank: 0, env_overrides: {}}
mesh_graph_desc_path: models/demos/common/prefill/runners/topology_configuration/pipeline_prefill_2galaxy_connected_mesh_graph_descriptor.textproto
global_env:
  # ABSOLUTE path, on the NFS-shared /data clone so BOTH hosts resolve it: tt-run applies global_env to
  # every rank, whereas a shell-exported PREFILL_MANIFEST reaches only the launch-host rank, and a rank
  # that silently takes the default model disagrees on the chunk plan AND on the MTP level count.
  PREFILL_MANIFEST: "/data/nbabin/tt-metal/models/demos/deepseek_v3_d_p/tt/runners/manifests/glm52_mtp4.json"
  PREFILL_FABRIC_MODE: "2d_torus_xy"
  PREFILL_MAX_SEQ_LEN: "56320"
  PREFILL_H2D_SERVICE_ID: "ds_prefill"
  PREFILL_GATE_FALLBACK_MODE: "DEVICE_FP32"

  PREFILL_TRACE_DIR: "/mnt/models/deepseek-prefill-cache/glm-traces/vllm-glm52-indexer-kcache-55k"

  PREFILL_ENABLE_MIGRATION: "1"
  PREFILL_MOCK_MIGRATION: "1"
  PREFILL_MIGRATION_TABLE_PATH: "/data/nbabin/tt-metal/generated/mtp4_2rank_kv_table.pb"
  PREFILL_MIGRATION_DEVICE_MAP_PATH: "/tmp/mtp4_2rank_devmap.json"
  PREFILL_ENABLE_LAYER_ACK: "1"
  PREFILL_LAYER_ACK_D2H: "1"
  LOGURU_LEVEL: "INFO"

# Static 4-rank mock-migration binding for the disaggregated-prefill CI leg.
# ttrun expandvars() each global_env value at load, so ${TABLE_PATH} (the per-run
# NFS scratch) and ${TT_METAL_HOME} resolve from the launching env -- both MUST be
# exported before ttrun is invoked. mesh_graph_desc_path is repo-relative and
# resolves against TT_METAL_HOME. Values that equal the runner/manifest default
# are intentionally omitted so the manifest (kimi27.json) and kimi_k2_7 adapter
# supply them (cache + trace); only the real weights path is overridden.
rank_bindings:
  - {rank: 0, mesh_id: 0, mesh_host_rank: 0, env_overrides: {}}
  - {rank: 1, mesh_id: 1, mesh_host_rank: 0, env_overrides: {}}
  - {rank: 2, mesh_id: 2, mesh_host_rank: 0, env_overrides: {}}
  - {rank: 3, mesh_id: 3, mesh_host_rank: 0, env_overrides: {}}
mesh_graph_desc_path: models/demos/common/prefill/runners/topology_configuration/pipeline_prefill_4galaxy_connected_mesh_graph_descriptor.textproto
global_env:
  PREFILL_MANIFEST: "${TT_METAL_HOME}/models/demos/deepseek_v3_d_p/tt/runners/manifests/kimi27.json"
  MESH_DEVICE: "TG"
  PREFILL_HF_MODEL: "/mnt/models/moonshotai/Kimi-K2_7-Code-dequantized"
  PREFILL_FABRIC_MODE: "2d"
  PREFILL_MAX_SEQ_LEN: "56320"
  PREFILL_ENABLE_MIGRATION: "1"
  PREFILL_MOCK_MIGRATION: "1"
  PREFILL_MIGRATION_TABLE_PATH: "${TABLE_PATH}"
  LOGURU_LEVEL: "INFO"

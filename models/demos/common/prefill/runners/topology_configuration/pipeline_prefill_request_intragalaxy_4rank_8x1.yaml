# 4-stage intra-galaxy pipeline prefill at stage shape [8,1] (SP=8 x TP=1): one 8x4 galaxy carved
# into 4 Z-connected column sub-meshes, hidden state hopping stage->stage over a MeshSocket. Rank 0
# serves an external prefill_producer; model selected by PREFILL_MANIFEST.
#
# TT_VISIBLE_DEVICES is one logical column per rank and is PER-GALAXY: another 32-chip galaxy
# enumerates differently and a wrong map does not error, it builds stages that are not columns.
# Regenerate for your host with
#   python models/demos/deepseek_v3_d_p/utils/gen_pipeline_binding.py [--profile]

rank_bindings:
  - {rank: 0, mesh_id: 0, mesh_host_rank: 0, env_overrides: {TT_VISIBLE_DEVICES: "0,1,2,3,11,10,9,8"}}
  - {rank: 1, mesh_id: 1, mesh_host_rank: 0, env_overrides: {TT_VISIBLE_DEVICES: "4,5,6,7,15,14,13,12"}}
  - {rank: 2, mesh_id: 2, mesh_host_rank: 0, env_overrides: {TT_VISIBLE_DEVICES: "28,29,30,31,23,22,21,20"}}
  - {rank: 3, mesh_id: 3, mesh_host_rank: 0, env_overrides: {TT_VISIBLE_DEVICES: "24,25,26,27,19,18,17,16"}}

mesh_graph_desc_path: tt_metal/fabric/mesh_graph_descriptors/single_bh_galaxy_4x8x1_z_chain_graph_descriptor.textproto

global_env:
  # 2d, not a torus mode: the D2D MeshSocket routes over FABRIC_2D, and a torus mode would have to be
  # matched by the descriptor's dim_types (which are LINE/LINE here).
  PREFILL_FABRIC_MODE: "2d"
  PREFILL_SP: "8"
  PREFILL_TP: "1"
  PREFILL_MAX_SEQ_LEN: "10240"
  PREFILL_H2D_SERVICE_ID: "ds_prefill"
  # Only 12B of metadata transits the queue, so reducing its size has no effect on transfer speed.
  # Keeping it default (64KB) clashes with the MoE FFN L1 allocation.
  PREFILL_PP_D2D_FIFO_BYTES: "32768"
  LOGURU_LEVEL: "INFO"

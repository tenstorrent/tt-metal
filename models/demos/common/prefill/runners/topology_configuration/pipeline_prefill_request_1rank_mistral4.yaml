# Single-rank SP=8 x TP=4, as pipeline_prefill_request_1rank.yaml but with no PREFILL_GATE_FALLBACK_MODE:
# Mistral routes softmax -> top-4 -> renormalize, which the sigmoid DEVICE_FP32 gate cannot express,
# so the mode is left to the adapter default (GPT_DEVICE).
rank_bindings:
  - {rank: 0, mesh_id: 0, mesh_host_rank: 0, env_overrides: {}}
mesh_graph_desc_path: tt_metal/fabric/mesh_graph_descriptors/single_bh_galaxy_torus_xy_graph_descriptor.textproto
global_env:
  PREFILL_FABRIC_MODE: "2d_torus_xy"
  PREFILL_MAX_SEQ_LEN: "56320"
  PREFILL_H2D_SERVICE_ID: "ds_prefill"
  LOGURU_LEVEL: "INFO"

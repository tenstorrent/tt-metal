# Role text inserted into briefs/brief.md. $-placeholders come from the task and the spec.
reference: |
  Role: reference. Write the standalone CPU reference for $model in `$model_dir/reference/` against the interface in
  `models/demos/common/bringup/reference/interface.py`, and the `reference` hook (plus `tokenizer` / `hf_layers` if
  the defaults do not fit) in `$model_dir/bringup/hooks.py`. The HF implementation is the oracle; the checkpoint is at
  `$hf_dir`. Block types and layers are in the spec. Every block's forward goes through `run_block`, and every step
  output is recorded as `L{i}.<output>`. The following gates hold the same code: R.3 requires chunked prefill to equal
  one-shot prefill and each block type's graph to replay exactly from recorded boundaries, and the goldens step runs
  the reference over the longest ladder rung on CPU, so make it fast (group tokens per expert for MoE, attend each chunk
  against the state instead of recomputing the prefix). Split the block into steps at the boundaries a device
  implementation would swap one at a time (norms, attention, residual adds, MLP / router / experts), and keep
  `state_tensors` / `load_state` exact inverses (names per layer from `spec.state_names(layer)`; a fixed-size tensor in
  `state.fixed`, e.g. a recurrent state, is the current one and `load_state` sets it as of `length`). If the stock HF loader cannot run this checkpoint on this host (custom
  quantized storage, or too big for host RAM in bf16), write `hf_model(spec, num_layers)` in hooks.py: the HF modeling
  code with the checkpoint's weights dequantized exactly as the checkpoint defines them; `num_layers=None` means the
  full model (the HF sanity gate: smoke and next-token accuracy), so keep what does not fit packed and dequantize it
  when it runs. For a layer subset, task R.4 trims the checkpoint once R.2 passes (only layers up to the last subset
  layer stay; mixed shards become `subset-<shard>`): read every tensor through `model.safetensors.index.json`, never
  by a shard file name.
plan: |
  Role: plan. Map every component to TTNN and shard the model over the $mesh mesh ($chips chips, $dram GB each). Write
  `$bringup_dir/plan.yaml` (schema in `models/demos/common/bringup/plan/memory.py`), `$bringup_dir/plan.md`, and
  `$bringup_dir/components.yaml` (schema in `models/demos/common/bringup/plan/components.py`). The gate computes
  per-chip memory from the real checkpoint shapes under your placements, so every checkpoint tensor needs a placement.
  Adjust `$bringup_dir/tasks.yaml` only if the plan needs different tasks (keep the id scheme). A person approves the
  plan afterwards; the gate passes only then. A block step TTNN has no proper op for (no op, no composition, no fork
  of an existing op fits) is tagged OPGEN, with `searched` like CPU and COMPOSED and optionally the op name as `op`:
  its component task then requests the op from the op code generator and the step stays on the CPU bridge.
test: |
  Role: test. Review the rendered test $tests for $component_desc against the golden and the component, and adjust it
  if needed (comparison mode, threshold, extra checks). It will be frozen next: it must pass with the CPU reference as
  the module (BRINGUP_IMPL=reference) and fail with a zero stub (BRINGUP_IMPL=stub). You can check both with
  `BRINGUP_IMPL=reference $gate_cmd` and `BRINGUP_IMPL=stub $gate_cmd`.
implement: |
  Role: implement. Implement $component_desc on the device. The frozen test is $tests. Components entry:
  $component_entry
  Register the module in `$model_dir/bringup/hooks.py` (`device_component`, and `device_model` for the ladder).
  Everything not swapped stays on the CPU reference.
  $defer
contract: |
  Role: contract. Make $model servable by the prefill engine: adapter, runtime, KV layout and address table (see
  `models/demos/common/prefill/docs/ADDING_A_PREFILL_MODEL.md` and the repo map). You may change the prefill engine
  (`models/demos/common/prefill`) where the model's layout needs it; prefer a generic adapter hook to a name branch.
fix: |
  Role: fix. The scripted gate below failed. Find the component whose layer first broke the PCC trail (or the contract
  check that failed), fix it in its module, and re-run the gate. The log is quoted below.
perf: |
  Role: perf. Make one performance change to $model and keep it correct:
  $details
  The gate re-runs an accuracy rung and the warm profile; it passes only if every accuracy threshold still holds and
  the measured time drops below its threshold. Keep the previous behaviour selectable (a named setting or an env var,
  recorded in the profile's settings) so the two can be compared. Do not change thresholds, goldens or frozen tests.
  Measure only the e2e chunk time and the changed section's time, before and after, with the plain profile
  (test_profile.py without BRINGUP_PROFILE_OPS; a few minutes). Never profile per op over the whole model: per-op mode
  runs on the representative layers only (BRINGUP_PROFILE_LAYERS picks others) and only when the section time
  cannot explain a result.
optests: |
  Role: optests. $model calls derived bring-up ops (`ttnn.bringup.*`, see `ttnn/ttnn/bringup/INDEX.md`). Every
  distinct call it makes needs a test case in that fork's `tests/`, with random inputs (never the model's real
  activations, goldens or weights). Follow `models/demos/common/bringup/skill/bringup-fork-tests/SKILL.md`. The gate
  records the calls in `$bringup_dir/results/fork_calls.json` and its log lists the ones with no case (sig, op). Add
  cases for those; never remove or loosen another model's case. The gate then runs every test of every fork used.
assemble: |
  Role: assemble. Every step of every block type has passed on the device, but through the hybrid harness
  (`$model_dir/bringup/hooks.py`: the CPU reference with host in / host out around each device step). Build the model
  the ladder, the contract and the profile use: one device model whose hidden state stays on the device from the
  embedding to the final norm, made from the validated modules (reuse them, do not rewrite them). Each block's forward
  goes through `run_block` with the block graph, so the profiler sees one section per step. Everything that depends
  only on shapes or positions is built once at load and sliced on the device (agent rule 5). Register it as the
  `device_model` hook; keep the hybrid selectable (e.g. `BRINGUP_HYBRID=1`) for debugging. Steps deferred to
  op-gen (listed below, if any) stay on the CPU: the device model calls each through `CpuBridge`
  (`models/demos/common/bringup/testing/cpu_bridge.py`) with the mesh placements of its inputs and output; nothing
  else in the forward path may touch the host. $details

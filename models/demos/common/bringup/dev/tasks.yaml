# Framework build ledger. Drive with:
#   python -m models.demos.common.bringup gate F1 --spec models/demos/common/bringup/dev/spec.yaml --commit
tasks:
  - id: F1
    title: Core - spec, ledger, gate runner, metrics, CLI
    step: framework
    deps: []
    paths: [models/demos/common/bringup/__init__.py, models/demos/common/bringup/__main__.py,
            models/demos/common/bringup/core, models/demos/common/bringup/selftest/__init__.py,
            models/demos/common/bringup/selftest/conftest.py, models/demos/common/bringup/selftest/test_core.py,
            models/demos/common/bringup/dev/spec.yaml]
    gate:
      cmd: scripts/run_safe_pytest.sh --no-precompile --run-all models/demos/common/bringup/selftest/test_core.py
      metrics: {selftest_passed: ">= 20", selftest_failed: "== 0"}
  - id: F2
    title: Freeze with zero-stub check, resume, rerun, fork, compare, agent-definition hashes
    step: framework
    deps: [F1]
    paths: [models/demos/common/bringup/__main__.py, models/demos/common/bringup/core,
            models/demos/common/bringup/selftest/test_runs.py]
    gate:
      cmd: scripts/run_safe_pytest.sh --no-precompile --run-all models/demos/common/bringup/selftest/
      metrics: {selftest_passed: ">= 39", selftest_failed: "== 0"}
  - id: F3
    title: Reference interface + block graph, HF parity, chunked + graph replay, golden generator and reader
    step: framework
    deps: [F2]
    paths: [models/demos/common/bringup/reference, models/demos/common/bringup/selftest/fixture_model.py,
            models/demos/common/bringup/selftest/test_reference.py]
    gate:
      cmd: scripts/run_safe_pytest.sh --no-precompile --run-all models/demos/common/bringup/selftest/
      metrics: {selftest_passed: ">= 49", selftest_failed: "== 0"}
  - id: F4
    title: Device-side test helpers - component, swap, ladder, contract, profiler, templates
    step: framework
    deps: [F3]
    paths: [models/demos/common/bringup/testing, models/demos/common/bringup/tests,
            models/demos/common/bringup/selftest]
    gate:
      cmd: scripts/run_safe_pytest.sh --no-precompile --run-all models/demos/common/bringup/selftest/
      metrics: {selftest_passed: ">= 60", selftest_failed: "== 0"}
  - id: F5
    title: Plan memory check from the checkpoint, components map, approvals, ledger generator, intake, knowledge, opportunities
    step: framework
    deps: [F4]
    paths: [models/demos/common/bringup/plan, models/demos/common/bringup/intake, models/demos/common/bringup/knowledge,
            models/demos/common/bringup/tests/test_box.py, models/demos/common/bringup/tests/test_ladder.py,
            models/demos/common/bringup/__main__.py, models/demos/common/bringup/core,
            models/demos/common/bringup/selftest/test_plan.py]
    gate:
      cmd: >-
        scripts/run_safe_pytest.sh --no-precompile --run-all models/demos/common/bringup/selftest/ &&
        python -m models.demos.common.bringup.knowledge.check
      metrics: {selftest_passed: ">= 77", selftest_failed: "== 0", known_issue_errors: "== 0", repo_map_errors: "== 0"}

  notes: out = h_mid + experts_out, replicated [S, 4096]; no CCL (both inputs already replicated).
- block_type: model
  step: embed
  tag: COMPOSED
  ttnn: ttnn.to_layout(TILE) -> clamp pad ids into range (ttnn.where(ids < 152576, ids, 0) or ttnn.minimum) -> ttnn.to_layout(ROW_MAJOR) -> ttnn.embedding
    (replicated [152576, 4096] bf16)
  reuse: models/demos/gemma4_a4b_d_p/tt/model.py:TtEmbedding
  searched:
  - 'repo_map: All-device model'
  - 'known_issues: Masking the engine''s pad token on the device (bitwise_and needs a power-of-two vocab; 152576 is not)'
  notes: Plain lookup (no embedding scale). The engine's 0xFFFFFFFF pad ids must be mapped into range before ttnn.embedding; the rows are discarded
    after actual_end.
- block_type: model
  step: final_norm
  tag: NATIVE
  ttnn: ttnn.rms_norm (replicated [S, 4096], model.norm.weight, eps 1e-6)
  reuse: models/demos/gemma4_a4b_d_p/tt/rms_norm.py
  notes: Only after layer 5 in this subset bring-up (the ladder compares final_norm of the subset).
- block_type: model
  step: lm_head
  tag: COMPOSED
  ttnn: ttnn.slice (last tokens) -> ttnn.linear (vocab-sharded lm_head, 38144 rows per chip) -> ttnn.all_gather (cluster_axis=1, dim -1)
  reuse: models/demos/deepseek_v3_d_p/tt/tt_lm_head.py, models/demos/gemma4_a4b_d_p/tt/model.py
  searched:
  - 'repo_map: All-device model'
  - ls models/demos/deepseek_v3_d_p/tt (tt_lm_head.py)
  notes: Untied lm_head [152576, 4096] bf16; 152576 / 4 = 38144 = 1192 tiles per chip. Only the last tokens the harness asks for.

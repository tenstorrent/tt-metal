[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "muse-glimmer-vllm-ext"
version = "0.1.0"
description = "tt-metal-owned vLLM general plugin for Muse-Glimmer-30B: registers the TT text-only bridge and the model's tool-call parser against stock vLLM + the public vllm-tt-plugin, with no plugin patch."
requires-python = ">=3.10"

# Loaded by vLLM in every process that loads plugins, before ModelConfig resolves
# the arch, and in the API-server frontend where tool parsing runs.
[project.entry-points."vllm.general_plugins"]
muse_glimmer_tt_ext = "muse_glimmer_vllm_ext:register"

[tool.setuptools]
packages = ["muse_glimmer_vllm_ext"]

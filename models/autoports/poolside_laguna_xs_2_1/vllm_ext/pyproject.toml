[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "laguna-vllm-ext"
version = "0.1.0"
description = "tt-metal-owned vLLM general plugin for Laguna-XS-2.1: newline-tolerant poolside_v1 tool-parser override for stock vLLM 0.24.0 + the public vllm-tt-plugin."
requires-python = ">=3.10"

# Loaded by vLLM in every process that loads plugins (incl. the API-server frontend where tool parsing runs).
[project.entry-points."vllm.general_plugins"]
laguna_tt_ext = "laguna_vllm_ext:register"

[tool.setuptools]
packages = ["laguna_vllm_ext"]

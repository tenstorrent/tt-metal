# A container (v5.1) package for FLUX.2 on a Blackhole QuietBox 2 (p300x2, 4 chips).
#
#   tt-model package --container models/tt_dit/server/flux2/tt-model.yaml
#   tt-model serve   build/flux2-dev-qb2/tt_kernel_manifest.json --follow
#   tt-model push    build/flux2-dev-qb2 --private
schema: "5.1"

repo: stisiTT/flux2-dev-qb2
name: flux2-dev-qb2

# A POINTER: FLUX.2-dev is downloaded to the consumer's own HF cache at pull time and
# is never baked into the image. Note the weights are GATED — a consumer needs their own
# accepted licence and HF token before `serve` can fetch them.
weights: black-forest-labs/FLUX.2-dev

# FLUX.2 is a rectified-flow diffusion transformer: no tokens, no KV cache, nothing for a
# continuous-batching engine to do. It serves through its own HTTP app instead.
kind: tt-dit-server
arch: blackhole

image:
  registry: hf

source:
  tt_metal: /home/stisi/tt-metal
  # EXACTLY what ships. An allowlist, never a denylist — under-shipping is an error, so a
  # missing entry fails the build rather than surfacing on a consumer's first boot.
  # Narrow on purpose. Naming the two parent directories would ship 405 files this model
  # never imports: both test trees, experimental/, the LLM runtime, and other models
  # entirely. code/ is published as "byte-identical to what runs inside the image", so
  # every entry below is one the runtime import closure actually reaches.
  code:
    # The only models/common module on the path: tt_dit's linear and attention import
    # is_blackhole from it. modules/tt_ccl is NOT needed — only utils/test.py imports
    # that, and the server inlines the helpers rather than depending on the test tree.
    - models/common/__init__.py
    - models/common/utility_functions.py
    # The pipeline, the model code, and server/flux2 itself. Sibling DiT models under
    # models/ and pipelines/ come along with their packages; splitting those out per
    # file would risk under-shipping for a few MB.
    - models/tt_dit/__init__.py
    - models/tt_dit/blocks
    - models/tt_dit/encoders
    - models/tt_dit/layers
    - models/tt_dit/models
    - models/tt_dit/parallel
    - models/tt_dit/pipelines
    - models/tt_dit/utils
    - models/tt_dit/server/__init__.py
    - models/tt_dit/server/flux2
  ubuntu: "24.04"
  python: "3.12"

runtime:
  # The ASGI target uvicorn serves. It lives in the tree above, which is why
  # verify.sh imports it inside the finished image.
  app: "models.tt_dit.server.flux2.app:app"
  packages:
    - fastapi
    - uvicorn
    - "pydantic>=2"
    - pillow
    # The pipeline builds its torch reference modules from diffusers and tokenizes the
    # prompt with transformers, so both are runtime dependencies, not dev extras. Pinned
    # to the versions this model was validated against: a newer diffusers has changed
    # Flux2 class names before, and the image would resolve one silently.
    # torch is added automatically at tt-metal's own pin.
    - diffusers==0.38.0
    - transformers==5.12.1
    - sentencepiece
    - protobuf

card:
  quickstart: |
    FLUX.2 [dev] generating 1024x1024 images on four Blackhole chips, served over HTTP.

    ### Before you start

    **The weights are gated.** They are a pointer, not part of this image, so `pull`
    fetches them into your own HF cache under your own token. Accept the licence at
    [black-forest-labs/FLUX.2-dev](https://huggingface.co/black-forest-labs/FLUX.2-dev)
    and run `huggingface-cli login` first, or the pull fails partway with a 403.

    Budget roughly 106 GB of disk and a long first pull. Weights dominate: the image
    itself is 1.2 GB.

    **Hardware: four Blackhole chips**, opened as a 2x2 mesh (`p300x2` / `QB2`). This is
    not a preference. FLUX.2 needs its sequence and tensor parallel factors both above 1,
    so a four-chip *line* cannot run it, and the server refuses such a mesh at startup
    rather than producing images that are quietly wrong.

    ### Generate an image

    ```bash
    tt-model serve stisiTT/flux2-dev-qb2

    # wait for readiness (first boot converts weights to device layout: several minutes)
    curl -s localhost:8000/health

    JOB=$(curl -s -X POST localhost:8000/generate \
            -H 'Content-Type: application/json' \
            -d '{"prompt": "a lighthouse in a thunderstorm", "seed": 3}' \
          | python -c 'import sys,json; print(json.load(sys.stdin)["job_id"])')

    curl -s localhost:8000/jobs/$JOB                 # queued | running | done | error
    curl -s -o out.png localhost:8000/jobs/$JOB/image
    ```

    ### API

    | route | purpose |
    | --- | --- |
    | `GET /health` | readiness, model id, mesh shape, served resolution |
    | `POST /generate` | enqueue a prompt; returns `202` and a `job_id` |
    | `GET /jobs` | every job this process knows about |
    | `GET /jobs/{id}` | one job's status |
    | `GET /jobs/{id}/image` | the finished PNG |
    | `POST /jobs/{id}/cancel` | cancel a job that has not started |

    `POST /generate` takes `prompt` (required), plus optional `num_inference_steps`,
    `guidance_scale` and `seed`.

    ### Worth knowing

    Generation is serialized. One device, one warm pipeline, one worker: concurrent
    requests queue rather than collide, and the API stays responsive while one runs.

    The served resolution is fixed at startup. The pipeline builds its position
    embeddings and captures its trace for one shape, so a request asking for a different
    `height`/`width` is refused instead of silently rebuilding the pipeline. Serve a
    second instance with `FLUX2_HEIGHT` / `FLUX2_WIDTH` to offer another size.

    Finished jobs and their PNGs are reaped an hour after completion. Download what you
    want to keep.

    First boot is minutes, not seconds, and nearly all of it is converting weights to
    device layout.

serve:
  hardware: p300x2
  # Four chips as a 2x2 square, NOT the P300x2 line. FLUX.2 needs its sequence and
  # tensor parallel factors both above 1; on a line one of them is 1 and attention
  # fails deep inside with an error that says nothing about the real cause.
  mesh_device: QB2
  port: 8000
  env:
    # The 32B transformer, the 24B text encoder and the VAE cannot be co-resident on
    # four chips, so weights are swapped per phase and the transformer is FSDP-sharded.
    FLUX2_DYNAMIC_LOAD: "1"
    FLUX2_FSDP: "1"
    FLUX2_TRACED: "1"
    FLUX2_HEIGHT: "1024"
    FLUX2_WIDTH: "1024"
    FLUX2_STEPS: "50"

# Assertions run INSIDE the finished image, after the user switch. These are what make
# the code allowlist trustworthy.
verify:
  # The pipeline and its three big submodules must import from the shipped tree.
  - "from models.tt_dit.pipelines.flux2.pipeline_flux2 import Flux2Pipeline"
  - "from models.tt_dit.models.transformers.transformer_flux2 import Flux2Transformer"
  - "from models.tt_dit.models.vae.vae_flux2 import Flux2VaeDecoder"
  - "from models.tt_dit.encoders.mistral3.model_mistral3 import Mistral3Encoder"
  # The server must reject a mesh that would give either parallel factor 1. This is the
  # guard standing between a consumer and a run that silently produces noise.
  - |
    import os
    from models.tt_dit.server.flux2.config import ServerConfig
    os.environ['FLUX2_MESH_SHAPE'] = '1x4'
    try:
        ServerConfig.from_env()
    except ValueError:
        pass
    else:
        raise AssertionError('a 1x4 line mesh must be rejected: FLUX.2 needs sp>1 and tp>1')
    os.environ['FLUX2_MESH_SHAPE'] = '2x2'
    assert ServerConfig.from_env().mesh_shape == (2, 2)

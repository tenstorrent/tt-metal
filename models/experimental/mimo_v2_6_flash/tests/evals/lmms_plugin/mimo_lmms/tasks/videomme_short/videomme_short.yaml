# Video-MME, short videos only (300 videos, 900 questions), no subtitles. Same prompt, answer parsing and metric as
# lmms-eval's `videomme` task; process_docs keeps duration == "short". The videos are fetched by
# prefetch_datasets.py videomme --durations short into $HF_HOME/videomme/data (lmms-eval then skips its 101 GB download).
dataset_path: lmms-eval/Video-MME
dataset_kwargs:
  token: True
  cache_dir: videomme
  video: True
task: videomme_short
test_split: test
output_type: generate_until
process_docs: !function utils.short_only
doc_to_visual: !function utils.videomme_doc_to_visual
doc_to_text: !function utils.videomme_doc_to_text
doc_to_target: "answer"
generation_kwargs:
  max_new_tokens: 16
  temperature: 0
  top_p: 1.0
  num_beams: 1
  do_sample: false
process_results: !function utils.videomme_process_results
metric_list:
  - metric: videomme_perception_score
    aggregation: !function utils.videomme_aggregate_results
    higher_is_better: true
lmms_eval_specific_kwargs:
  default:
    pre_prompt: ""
    post_prompt: "\nAnswer with the option's letter from the given choices directly."
metadata:
  - version: 0.0

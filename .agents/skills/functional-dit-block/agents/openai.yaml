interface:
  display_name: "Functional DiT Block"
  short_description: "Bring up a correct TTNN diffusion-transformer block"
  default_prompt: "Use $functional-dit-block to implement the per-block TTNN module for a diffusion transformer (self-attention with QK-norm and multi-axis RoPE, AdaLN/timestep modulation, SwiGLU FFN), compare it against the diffusers reference block on a 1x1 mesh to PCC >= 0.99 with synthetic and real weights, and leave a concise work log and PCC evidence."

policy:
  allow_implicit_invocation: true

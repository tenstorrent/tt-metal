# The original run_all.py prefill sweep: three matmul shapes, POWER_CASE=0, split mode. One
# config per shape keeps the <op>/<case> layout; run this file three times with a different
# --output-root, or edit app_args. Kept for parity with the earlier Wormhole runs.
name: prefill_1024_2048_2048_160
workload: long_matmul
app_args: [1024, 2048, 2048, 160]
# 20000 Hz = a 50 us polling period (telemetry -f 50), what the paper's captures used; telemetry
# tops out near 9.7 kHz. Writes about 1.5 MB of telemetry.txt per second of run.
telemetry_freq_hz: 20000
trim_ms: 1.0
runs:
  power_cases: [0]
  ops: [matmul]
analyses:
  - pj_per_flop

# One shape of the former run_all.py prefill sweep (POWER_CASE=0, split mode), at the paper's
# telemetry rate and trim rather than run_all.py's 50 Hz / 6 ms. For its other shapes, edit
# app_args and use another --output-root. run_all.py's fixed_tpc group and its multi-shape
# compare_runs overlay have no config any more.
name: prefill_1024_2048_2048_160
workload: long_matmul
# legacy reproduces how the earlier prefill runs were measured; drop it (or set updated) for new data.
mode: legacy
app_args: [1024, 2048, 2048, 160]
# 20000 Hz = a 50 us polling period (telemetry -f 50), what the paper's captures used; telemetry
# tops out near 9.7 kHz. Writes about 1.5 MB of telemetry.txt per second of run.
telemetry_freq_hz: 20000
trim_ms: 1.0
runs:
  power_cases: [0]
  ops: [matmul]
analyses:
  - pj_per_flop

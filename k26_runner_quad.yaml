# Kimi-2.6 4-galaxy pipeline-parallel prefill. Drive with:
#   ./models/demos/common/prefill/runners/run_pipeline_prefill.sh \
#     k26_runner_quad.yaml <h0>:1,<h1>:1,<h2>:1,<h3>:1
# Host order is the ring chain (see the 4-galaxy connected MGD). Pair with k26_producer_quad.yaml
# on rank 0's host after the [h2d] descriptor appears. PREFILL_* here is in global_env so every
# rank sees it (shell-forwarded PREFILL_MANIFEST reaches only the launch-host rank).
rank_bindings:
  - {rank: 0, mesh_id: 0, mesh_host_rank: 0, env_overrides: {}}
  - {rank: 1, mesh_id: 1, mesh_host_rank: 0, env_overrides: {}}
  - {rank: 2, mesh_id: 2, mesh_host_rank: 0, env_overrides: {}}
  - {rank: 3, mesh_id: 3, mesh_host_rank: 0, env_overrides: {}}
mesh_graph_desc_path: models/demos/common/prefill/runners/topology_configuration/pipeline_prefill_4galaxy_connected_mesh_graph_descriptor.textproto
global_env:
  PREFILL_MANIFEST: "models/demos/deepseek_v3_d_p/tt/runners/manifests/kimi26.json"
  PREFILL_NUM_LAYERS: "61"                 # K2.6's real depth. [MATCH PRODUCER]
  PREFILL_SP: "8"                          # 8x4 = one 32-chip BH galaxy per pipeline stage
  PREFILL_TP: "4"
  PREFILL_CHUNK_SIZE: "5120"
  PREFILL_MAX_SEQ_LEN: "56320"             # 11 chunks — the full length of the golden trace below
  PREFILL_H2D_SERVICE_ID: "kimi26_prefill" # MUST equal the producer's h2d_service_id
  PREFILL_GATE_FALLBACK_MODE: "DEVICE_FP32"
  PREFILL_FABRIC_MODE: "2d_torus_xy"
  LOGURU_LEVEL: "INFO"

  PREFILL_NUM_USERS: "1"

  # Expose /tt_prefill_layer_acks_kimi26_prefill and emit one ack per completed layer.
  PREFILL_ENABLE_LAYER_ACK: "1"

  # After shutdown, each rank PCCs its local layer slice of slot 0 against the NFS golden.
  PREFILL_REQUEST_LOOP_PCC: "1"
  PREFILL_TRACE_DIR: "/mnt/models/deepseek-prefill-cache/golden/structured_traces/kimi_debug_55k_vllm"
  PREFILL_STANDALONE_CHUNKED_PCC: "0.88"

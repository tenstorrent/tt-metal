# Full fine-tuning of Llama 3.2 1B Instruct on SST-2, on a single chip.
#
#   python -m ttml.experimental.trainer \
#     --config tt-train/sources/ttml/ttml/experimental/training_configs/llama_3_2_1b_instruct_sst2.yaml
#
# No model.lora section: every weight is trained. Checkpoints are HuggingFace model
# directories under <checkpoint.save_strategy.project_dir>/checkpoints/.
model:
  name: meta-llama/Llama-3.2-1B-Instruct
  gradient_checkpointing: true

dataset:
  id: sst2

optimizer:
  type: adamw
  lr: 1.0e-4

device:
  mesh: [1, 1]

max_length: 64
batch_size: 8
seed: 0
stopping_criteria:
  type: step
  limit: 500

metrics:
  train:
    frequency: 10
  validation:
    frequency: 50

checkpoint:
  save_strategy:
    type: step
    frequency: 100
    project_dir: runs/llama_3_2_1b_instruct_sst2

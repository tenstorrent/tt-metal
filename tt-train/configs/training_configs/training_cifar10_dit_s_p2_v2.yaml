training_config:
  project_name: "tt_train_dit"
  seed: 5489
  batch_size: 128
  max_steps: 100000
  model_save_interval: 10000
  data_path: "data/cifar-10"
  output_dir: "runs/dit"
  model_config: "${TT_METAL_RUNTIME_ROOT}/tt-train/configs/model_configs/dit_s_p2.yaml"
  lr_schedule: cosine
  warmup_steps: 1000
  ema_decay: 0.9999
  ema_interval: 100
  optimizer:
    type: AdamW
    lr: 0.0002
    beta1: 0.9
    beta2: 0.999
    epsilon: 1.0e-8
    weight_decay: 0.0

diffusion_config:
  timesteps: 1000
  beta_start: 0.0001
  beta_end: 0.02
  cfg_drop_prob: 0.1

eval_config:
  sample_interval: 10000
  sample_steps: 50
  cfg_scale: 2.0

logging_config:
  log_interval: 100
  wandb: false

device_config:
  enable_ddp: false
  mesh_shape: [1, 1]

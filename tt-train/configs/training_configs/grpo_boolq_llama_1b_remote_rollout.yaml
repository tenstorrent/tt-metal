# Two-rank Llama-3.2-1B GRPO with remote rollouts: 2 TTML training chips
# (rank 0) + 2 TTT rollout chips (rank 1), 4 chips total on one host.
# Launch with grpo/boolq/run_remote_rollout.sh.

training_config:
  model_config: "${TT_METAL_RUNTIME_ROOT}/tt-train/configs/model_configs/llama3_2_1B.yaml"

  # HuggingFace Hub id; both ranks load their weights from it.
  model_source: "meta-llama/Llama-3.2-1B-Instruct"

  optimizer:
    type: MorehAdamW
    lr: 5.0e-6
    beta1: 0.9
    beta2: 0.99
    epsilon: 1.0e-8
    weight_decay: 0.01
    amsgrad: false
    kahan_summation: false

  grpo_config:
    rollout_source: "ttt"
    rollout_mode: "remote_sync"
    # Push the policy weights to the rollout rank every N optimizer steps.
    weight_sync_every: 1
    epsilon: 0.2
    per_device_train_batch_size: 2
    num_iterations: 1
    gradient_accumulation_steps: 4
    logging_steps: 1
    checkpointing: false
    checkpoint_interval: 0
    prompts_to_train: 80
    temperature: 1.0
    max_completion_length: 256
    num_generations: 4
    warmup_steps: 0

device_config:
  enable_ddp: true
  mesh_shape: [1, 2]
  device_ids: [0, 1]

# Rollout rank (rank 1) settings: its mesh, the tt-transformers batch size per
# device and sequence length.
remote_rollout_config:
  mesh_shape: [1, 2]
  max_batch_size: 32
  max_seq_len: 2048

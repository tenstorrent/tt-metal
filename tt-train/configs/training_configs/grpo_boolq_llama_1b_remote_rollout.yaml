# Two-rank Llama-3.2-1B GRPO for the remote-rollout example: 2 TTML training
# chips + 2 TTT rollout chips (4 chips total on one host).

training_config:
  model_config: "${TT_METAL_RUNTIME_ROOT}/tt-train/configs/model_configs/llama3_2_1B.yaml"

  # HF repo path (both ranks use this: TTML for tokenizer/completer, TTT for
  # stop/pad-token lookup and the TttGenerationWorker's model source).
  model_id: "meta-llama/Llama-3.2-1B-Instruct"

  # Cadence (in optimizer steps) at which WeightSyncCallback pushes fresh policy
  # weights from the TTML rank to the TTT rollout worker.
  weight_sync_every: 1

  optimizer:
    type: MorehAdamW
    lr: 5.0e-6
    beta1: 0.9
    beta2: 0.99
    epsilon: 1.0e-8
    weight_decay: 0.01
    amsgrad: false
    kahan_summation: false

  grpo_config:
    epsilon: 0.2
    per_device_train_batch_size: 2
    num_iterations: 1
    gradient_accumulation_steps: 4
    logging_steps: 1
    checkpointing: false
    checkpoint_interval: 0
    prompts_to_train: 80
    temperature: 1.5
    max_completion_length: 256
    num_generations: 4
    warmup_steps: 0

device_config:
  enable_ddp: true
  mesh_shape: [1, 2]
  device_ids: [0, 1]

# TTT rollout-rank settings (mesh, batch, seq-len for the generation worker).
remote_rollout_config:
  mesh_shape: [1, 2]
  max_batch_size: 32
  max_seq_len: 2048

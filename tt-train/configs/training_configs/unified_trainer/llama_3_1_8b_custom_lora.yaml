# LoRA fine-tuning of Llama 3.1 8B Instruct on your own instruction data, on a single chip.
#
#   python -m ttml.unified_trainer \
#     --config tt-train/configs/training_configs/unified_trainer/llama_3_1_8b_custom_lora.yaml \
#       --set dataset.custom_options.train_dataset_path=/data/train.jsonl \
#       --set dataset.custom_options.val_dataset_path=/data/val.jsonl
#
# Each line of the files is one example with "instruction", "output" and optionally "input" fields;
# dataset.custom_options.column_mapping maps them to other column names.
model:
  name: meta-llama/Llama-3.1-8B-Instruct
  lora:
    r: 8
    alpha: 16
    target_modules: [q_proj, k_proj, v_proj, o_proj]
  gradient_checkpointing: true

dataset:
  id: custom
  custom_options:
    file_type: jsonl
    train_dataset_path: data/train.jsonl
    val_dataset_path: data/val.jsonl
    template: alpaca

max_length: 256
batch_size: 4
num_epochs: 1
val_steps_freq: 100
seed: 0

optimizer:
  type: adamw
  lr: 1.0e-4
  weight_decay: 0.01

metrics:
  steps_freq: 10

checkpoint:
  save_strategy:
    type: step
    frequency: 200
  project_dir: runs/llama_3_1_8b_custom_lora

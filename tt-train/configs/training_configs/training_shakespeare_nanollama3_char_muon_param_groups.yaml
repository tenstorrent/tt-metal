training_config:
  project_name: "tt_train_nanollama3_muon"
  seed: 5489
  model_save_interval: 500
  batch_size: 64
  max_steps: 5000
  use_clip_grad_norm: false
  clip_grad_norm_max_norm: 1.0
  data_path: "data/shakespeare.txt"
  model_config: "${TT_METAL_RUNTIME_ROOT}/tt-train/configs/model_configs/nanollama3_char.yaml"
  optimizer:
    type: MuonWithAdamW
    adamw_modules: [tok_emb, fc, kv_linear]
    muon:
      lr: 0.02
      momentum: 0.95
      ns_steps: 5
      param_groups:
        - modules: [attention]
          lr: 0.01
    adamw:
      lr: 0.0003
      weight_decay: 0.1
      param_groups:
        - modules: [gamma]
          weight_decay: 0.0
        - modules: [tok_emb]
          lr: 0.00015

device_config:
  enable_ddp: false
  mesh_shape: [1,1]

eval_config:
  repetition_penalty: 1.0
  temperature: 0.7
  top_k: 50
  top_p: 1.0

# Two-rank Qwen3-0.6B GRPO for the reverse-text task (async rollout): 1 TTML
# training chip + 1 TTT rollout chip (2 chips total on one host).
#
# Batch shape (scaled down from examples/grpo/reverse_text/, which runs single-
# device local rollout at 64 completions/generate):
#   per_device_train_batch_size (16) is the GRPO group (16 completions per prompt);
#   gradient_accumulation_steps (2) sends 2 prompts x 16 completions = 32 completions
#   per generate() call, matching one Blackhole's per-generate ceiling and
#   remote_rollout_config.max_batch_size below. Effective batch per optimizer step
#   halves versus the on-main config (2 grad-accum instead of 4); raise
#   gradient_accumulation_steps to a higher value once the ttt worker runs on
#   multiple chips (remote_rollout_config.mesh_shape > [1, 1]).

training_config:
  # Only max_sequence_length is read from here; the Qwen3 architecture comes
  # from the HuggingFace config of ``model_id`` (loaded by the completer).
  model_config: "${TT_METAL_RUNTIME_ROOT}/tt-train/configs/model_configs/qwen3_06b.yaml"

  # HF repo path (both ranks use this: TTML for the tokenizer + the local ttml
  # Qwen3 rebuild + reference weights, TTT for stop/pad-token lookup and the
  # TttGenerationWorker's model source).
  model_id: "PrimeIntellect/Qwen3-0.6B-Reverse-Text-SFT"

  # Cadence (in optimizer steps) at which WeightSyncCallback pushes fresh
  # policy weights from the TTML rank to the TTT rollout worker. weight_sync_every=1
  # matches the boolq example; raise it to trade freshness for wall-clock.
  weight_sync_every: 1

  # Reproducibility knob picked up by the training example's dataset shuffle.
  seed: 0

  optimizer:
    type: MorehAdamW
    lr: 2.0e-5
    beta1: 0.9
    beta2: 0.99
    epsilon: 1.0e-8
    weight_decay: 0.0
    amsgrad: false
    kahan_summation: false

  grpo_config:
    epsilon: 0.2
    per_device_train_batch_size: 16   # one prompt's group of 16 completions
    num_iterations: 1
    gradient_accumulation_steps: 2    # 2 prompts x 16 completions = 32 per generate call
    logging_steps: 1
    checkpointing: false
    checkpoint_interval: 5
    prompts_to_train: 40              # 20 optimizer steps x 2 prompts per batch
    temperature: 1.0
    max_completion_length: 384
    num_generations: 16
    warmup_steps: 2
    log_completions: true
    num_completions_to_print: 1
    report_to: none

device_config:
  enable_ddp: false
  mesh_shape: [1, 1]
  device_ids: [0]

# TTT rollout-rank settings (mesh, batch, seq-len for the generation worker).
# max_batch_size sizes the KV cache and the on-device sampling batch; keep it at
# least ``per_device_train_batch_size * gradient_accumulation_steps`` so every
# generate() call fits without truncation.
remote_rollout_config:
  mesh_shape: [1, 1]
  max_batch_size: 32
  max_seq_len: 1024

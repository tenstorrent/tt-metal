# Context-parallel training on the eight-board Blackhole loudbox as a ring
# of eight: one sequence of 45056 characters per step, 5632 rows per chip.
#
# Run from the tt-metal root with the ring descriptor selected:
#   TT_METAL_HOME=$PWD TT_METAL_RUNTIME_ROOT=$PWD \
#   TT_MESH_GRAPH_DESC_PATH=$PWD/tt_metal/fabric/mesh_graph_descriptors/p150_x8_ring_mesh_graph_descriptor.textproto \
#   build_Release/tt-train/sources/examples/nano_gpt/nano_gpt -c tt-train/configs/training_configs/training_shakespeare_nanollama3_cp8_char.yaml
#
# The ring attention's backward is chosen by device_config.cp_backward
# (two_pass | cyclic | cyclic_in_place) or the TTML_CP_BACKWARD environment
# variable, so the same config runs the baseline and the cyclic backward.
training_config:
  project_name: "tt_train_nano_llama_cp"
  seed: 5489
  model_save_interval: 1000000
  batch_size: 1
  max_steps: 40
  use_clip_grad_norm: false
  clip_grad_norm_max_norm: 1.0
  data_path: "data/shakespeare.txt"
  model_config: "${TT_METAL_RUNTIME_ROOT}/tt-train/configs/model_configs/nanollama3_cp_char.yaml"
  optimizer:
    type: AdamW
    lr: 0.0003
    beta1: 0.9
    beta2: 0.999
    epsilon: 1.0e-8
    weight_decay: 0.01
    amsgrad: false
    stochastic_rounding: false

device_config:
  enable_ddp: false
  enable_tp: false
  enable_cp: true
  mesh_shape: [1, 8]
  cp_backward: two_pass
  cp_shift_transport: direct
  cp_layout: contiguous
  cp_rows_per_block_tiles: 0

eval_config:
  repetition_penalty: 1.0
  temperature: 0.7
  top_k: 50
  top_p: 1.0

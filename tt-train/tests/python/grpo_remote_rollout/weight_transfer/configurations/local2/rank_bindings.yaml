# Pins each rank to a disjoint pair of BH loudbox chips via TT_VISIBLE_DEVICES
# (PCIe device ids -- each p150 is one PCIe device / one chip).
# Rank 0 = TTML sender (chips 0..1); rank 1 = TTT receiver (chips 2..3).

rank_bindings:
  - rank: 0
    mesh_id: 0
    mesh_host_rank: 0
    env_overrides:
      TT_VISIBLE_DEVICES: "0,1"
  - rank: 1
    mesh_id: 1
    mesh_host_rank: 0
    env_overrides:
      TT_VISIBLE_DEVICES: "2,3"

mesh_graph_desc_path: "configurations/local2/mgd.textproto"

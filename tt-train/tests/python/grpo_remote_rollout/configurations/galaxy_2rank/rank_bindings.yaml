# One directly connected device from each of two adjacent physical rows of a
# Blackhole Galaxy. Devices 0 and 4 are paired by the native Galaxy graph used
# by the intrahost pipeline-parallel runner.
rank_bindings:
  - rank: 0
    mesh_id: 0
    mesh_host_rank: 0
    env_overrides:
      TT_VISIBLE_DEVICES: "0"
  - rank: 1
    mesh_id: 1
    mesh_host_rank: 0
    env_overrides:
      TT_VISIBLE_DEVICES: "4"

mesh_graph_desc_path: "configurations/galaxy_2rank/mgd.textproto"

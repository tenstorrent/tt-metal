#
# Field descriptions (per model entry):
#   name:     Display name of model
#   filename: Prefix for output files. Unique identifier. Changing this might affect dashboard.
#   binary:   Absolute path to the executable or Python script to run
#   args:     List of arguments passed to the configured executable or script
#   tokenize: Optional pre-tokenization of text_file into output_file before the run.
#             hf_tokenizer points at a local tokenizer.json that CMake downloads into data/ at build
#             time, so no Hugging Face access (or token for the gated Llama repos) is needed here.
#             Any tokenizer works as long as its ids fit the model config's vocab_size, so the 32k
#             TinyLlama vocab is reused for the larger models; their embedding shapes are unchanged.

models:
  - name: "TinyLlama 1.1B DDP=32 Shakespeare"
    filename: "tinyllama_1_1b_ddp32_shakespeare"
    binary: "${TT_METAL_RUNTIME_ROOT}/tt-train/sources/examples/train/train.py"
    args:
      - "-c ${TT_METAL_RUNTIME_ROOT}/tt-train/configs/training_configs/training_shakespeare_tinyllama_ddp.yaml"
      - "--track_memory"
      - "--batch_size=160"
      - "--max_steps=20"
    mgd: "${TT_METAL_RUNTIME_ROOT}/tt-train/configs/mgd/bh_galaxy_32_1_ring_ring.textproto"
    tokenize:
      text_file: "data/shakespeare.txt"
      hf_tokenizer: "TinyLlama/TinyLlama-1.1B-Chat-v1.0"
      output_file: "data/tokenized_shakespeare_tinyllama"

  - name: "Llama 8B TP=8 DDP=4 Shakespeare"
    filename: "llama_8b_tp8_ddp4_shakespeare"
    binary: "${TT_METAL_RUNTIME_ROOT}/tt-train/sources/examples/train/train.py"
    args:
      - "-c ${TT_METAL_RUNTIME_ROOT}/tt-train/configs/training_configs/llama8b/training_shakespeare_llama_8b_tp8_ddp4.yaml"
      - "--track_memory"
      - "--batch_size=12"
      - "--max_steps=750"
    mgd: "${TT_METAL_RUNTIME_ROOT}/tt-train/configs/mgd/bh_galaxy_4_8_ring_ring.textproto"
    tokenize:
      text_file: "data/shakespeare.txt"
      hf_tokenizer: "meta-llama/Llama-3.1-8B-Instruct"
      output_file: "data/tokenized_shakespeare_llama8b"

  - name: "Llama 8B TP=4 DDP=8 Shakespeare"
    filename: "llama_8b_tp4_ddp8_shakespeare"
    binary: "${TT_METAL_RUNTIME_ROOT}/tt-train/sources/examples/train/train.py"
    args:
      - "-c ${TT_METAL_RUNTIME_ROOT}/tt-train/configs/training_configs/llama8b/training_shakespeare_llama_8b_tp4_ddp8.yaml"
      - "--track_memory"
      - "--max_steps=750"
    mgd: "${TT_METAL_RUNTIME_ROOT}/tt-train/configs/mgd/bh_galaxy_8_4_ring_ring.textproto"
    tokenize:
      text_file: "data/shakespeare.txt"
      hf_tokenizer: "meta-llama/Llama-3.1-8B-Instruct"
      output_file: "data/tokenized_shakespeare_llama8b"

  - name: "Qwen 3 1.7B DDP=32 Shakespeare"
    filename: "qwen3_1_7b_ddp32_shakespeare"
    binary: "${TT_METAL_RUNTIME_ROOT}/tt-train/sources/examples/train/train.py"
    args:
      - "-c ${TT_METAL_RUNTIME_ROOT}/tt-train/configs/training_configs/training_shakespeare_qwen3_17b_ddp.yaml"
      - "--track_memory"
      - "--epochs 0"
      - "--max_steps=750"
    mgd: "${TT_METAL_RUNTIME_ROOT}/tt-train/configs/mgd/bh_galaxy_32_1_ring_ring.textproto"
    tokenize:
      text_file: "data/shakespeare.txt"
      hf_tokenizer: "Qwen/Qwen3-1.7B"
      output_file: "data/tokenized_shakespeare_qwen3"

  - name: "Tiny Deepseek v3 DDP=32 (Char) Shakespeare"
    filename: "tiny_deepseek_v3_ddp32_char_shakespeare"
    binary: "${TT_METAL_RUNTIME_ROOT}/tt-train/sources/examples/train/train.py"
    args:
      - "-c ${TT_METAL_RUNTIME_ROOT}/tt-train/configs/training_configs/training_shakespeare_tiny_deepseek_char_ddp.yaml"
      - "--track_memory"
      - "--epochs 0"
      - "--max_steps 600"
    mgd: "${TT_METAL_RUNTIME_ROOT}/tt-train/configs/mgd/bh_galaxy_32_1_ring_ring.textproto"

  - name: "Llama 70B TP=8 FSDP=4 Shakespeare"
    filename: "llama_70b_tp8_fsdp4_shakespeare"
    binary: "${TT_METAL_RUNTIME_ROOT}/tt-train/sources/examples/train/train.py"
    args:
      - "-c ${TT_METAL_RUNTIME_ROOT}/tt-train/configs/training_configs/llama70b/training_shakespeare_llama70b_tp8_fsdp4.yaml"
      - "--track_memory"
      - "--max_steps 1000"
    mgd: "${TT_METAL_RUNTIME_ROOT}/tt-train/configs/mgd/bh_galaxy_4_8_ring_ring.textproto"
    tokenize:
      text_file: "data/shakespeare.txt"
      hf_tokenizer: "meta-llama/Llama-3.1-70B-Instruct"
      output_file: "data/tokenized_shakespeare_llama70b"
